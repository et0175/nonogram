  detail: 'Closed by fix commit 728c7d0 test additions TestSolverPercent_AlignItemsFlexStartKeepsHistoryAndSlotAtTheirRowsTop and TestSolverPercent_SolvedBannerNeverOverlapsTheNewCounters. Re-verified: both pass (22 passed file run); reverting align-items to center turns 2 tests red (M1).'
  status: closed
- id: F-2
  severity: minor
  file: src/nonogram/admin/templates/puzzle_solve.html
  title: 'Visual order differs from DOM order (cycle 1, owner-accepted)'
  detail: 'Comment now states the mismatch and that the counters are non-focusable. Owner accepted the layout 2026-10-06. Residual: that rationale covers focus order only, not WCAG 1.3.2 meaningful sequence. Carried as C2-1.'
  status: closed-by-owner-decision
- id: F-3
  severity: minor
  file: src/nonogram/admin/static/admin.css
  title: 'Comment claims outran assertions (cycle 1)'
  detail: 'Closed for the 1440 same-row claim (test_hints_and_errors_share_the_row_at_1440) and the pair-height claim (test_pair_is_as_tall_as_a_toolbar_button). Residual claim carried as C2-2.'
  status: closed
- id: F-4
  severity: minor
  file: tests/test_puzzle_solver_percent.py
  title: '_MIN_PER_SHAPE check is true by construction (cycle 1)'
  detail: 'Fix 728c7d0 documents the check as vacuous (comment at line 186-191) rather than removing it. The other minimums remain real checks. Accepted as closed by documentation.'
  status: closed
- id: C2-1
  severity: minor
  file: src/nonogram/admin/templates/puzzle_solve.html
  title: 'Accessibility rationale for the visual-vs-DOM order addresses focus order only'
  detail: 'Lines 58-64 justify the mismatch because the counters are not focusable. Screen readers read DOM order (Errors, Hints, Progress) while sighted users see Progress, Errors, Hints. That is a WCAG 1.3.2 meaningful-sequence question, not a focus question. Owner accepted the layout, so this is a record gap, not a code defect. Suggested fix: add one sentence naming 1.3.2 and the owner acceptance, or record it in the accessibility notes.'
  status: open
- id: C2-2
  severity: minor
  file: src/nonogram/admin/static/admin.css
  title: 'Hints right-end claim cites a file that does not assert it'
  detail: 'The comment at the .player-counters block says Hints sits at the toolbar right end at 1440 px and cites tests/test_puzzle_solver_percent.py, TestSolverPercent_SitsNextToTheCounters. That test checks Progress at the right end at 1280 and Hints only for band overlap at 1440. The Hints right edge is asserted only in test_puzzle_solver_hint.py (line 612). Suggested fix: cite test_puzzle_solver_hint.py for that clause, or add a Hints right-edge assertion to the percent file.'
  status: open
