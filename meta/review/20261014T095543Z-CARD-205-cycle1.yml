findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2619
    title: "structural_toc_entries' docstring claims interior_stream asserts len(entries) == structural_toc_entry_count(...); it asserts only that the two derived PAGE counts agree"
    description: |
      `structural_toc_entries`' docstring (book_pdf_generator.py:2619-2622) states:
      "``len()`` of the result equals :func:`structural_toc_entry_count` of the
      same book; :meth:`BookPDFGenerator.interior_stream` asserts that rather
      than trusting it."

      It does not. The tripwire at interior_stream (:5455-5462) computes
      `drawn_toc_pages = measured_toc_page_count(len(toc_entries), frame, dpi)`
      and compares it to `toc_page_count` — two PAGE counts, both of which are 1
      for any row count between 1 and the frame's capacity (10 rows on the
      shortest storable trim, ~42 on Book 1). A row-count divergence smaller
      than a page is invisible to it.

      DEMONSTRATED, not argued. Mutation M6 of this review: change
      `structural_toc_entry_count`'s body from `2 + 2 * level_count` to
      `1 + 2 * level_count` — the single function that feeds all three
      page-count callers. Result: `tests/test_book_toc.py` is **33 passed, 0
      failed**; the tripwire does not fire; the export runs clean. The only
      test in the whole targeted set that kills it is
      `tests/test_book_finalise_gutter.py::...::test_the_structural_toc_is_one_page_on_every_trim_kdp_admits`,
      and it kills it on its own PREMISE line (`worst_case_rows == 8`), not on
      anything about the TOC.

      The consequence is that the equality between the count function and the
      builder is pinned at exactly one point — `level_count == 3` — by two
      independent literal `8`s in two different files
      (`test_the_structural_toc_is_one_page_on_every_trim_kdp_admits`'s premise
      and `test_a_hundred_and_fifty_puzzles_take_one_toc_page`'s
      `len(pages[0]) == 8`). For a one-level or two-level book nothing pins it
      at all; no test calls `structural_toc_entries` or `toc_range_label`
      directly, and only one test calls `structural_toc_entry_count`.

      THERE IS NO DEFECT TODAY, and that matters for the severity: every
      consumer of `structural_toc_entry_count` uses it only to derive a page
      count, all three derive 1 (I verified end to end over 28 book/trim
      configurations), and the drawn page count is separately spied in AC-5's
      test. What is wrong is the *claim*: the function CARD-206 is explicitly
      pointed at (the card's own "For CARD-206" section, item 1) documents a
      guarantee the code does not provide, in the repo's highest-defect-density
      file (29 of 60 commits are fixes). The card's Worktree notes state the
      true limitation correctly ("interior_stream's TOC tripwire re-measures
      the page COUNT, not the numbers"); the docstring contradicts them.
    suggestion: |
      Either (a) make the code match the docstring — one line in
      interior_stream, re-deriving the predicted row count beside the page
      count and raising on a row-count mismatch too (the level runs are
      already in scope via `decided.payloads`); or (b) correct the docstring to
      say what the tripwire actually compares, and add one direct test that
      `len(structural_toc_entries(...)) == structural_toc_entry_count(...)`
      over the one-, two- and three-level books the file already builds. (a) is
      the stronger fix and is what the card's own circularity argument assumes.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_memory.py
    line: 1902
    title: "test_the_toc_page_moved_under_card205_not_card204 never loads CARD-204's fixture, so the half its name promises is unasserted"
    description: |
      The test's name, its own docstring ("while CARD-204's recording still
      agrees with CARD-200 on it") and the class docstring ("...which is what
      makes 'CARD-205 moved it, CARD-204 did not' a fact about three fixtures")
      all claim a three-fixture attribution. The test takes two fixtures:
      `baseline` (which loads `book_baseline_card200.json`, :1795-1804) and
      `card205_baseline`. `book_baseline_card204.json` is never opened anywhere
      in the class.

      The claim is TRUE — I verified it independently by digesting the three
      fixtures: CARD-200 vs CARD-204 differ on pages [1, 2, 5, 7, 9, 11, 12, 13]
      and NOT on page 3; CARD-200 vs CARD-205 differ on exactly [3] plus that
      set; CARD-204 vs CARD-205 differ on exactly [3]. So this is an unasserted
      true statement, not a wrong one — but it is precisely the class of claim
      this class exists to turn into a measurement, and the card's own notes
      lean on it ("the attribution is itself asserted").
    suggestion: |
      Add a `card204_baseline` fixture alongside the other two and one line:
      `assert card204_baseline["pages"][number - 1] == baseline["pages"][number - 1]`
      inside the existing loop. Two lines, and the docstring becomes true.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_toc.py
    line: 1
    title: "Five new raise paths, no negative test: tests/test_book_toc.py contains no pytest.raises at all"
    description: |
      The card adds five error paths and exercises none of them:

      * `TocEntry.__post_init__` — ValueError on a page below 1 (:2209-2212)
      * `toc_range_label` — ValueError on a backwards or sub-1 range (:2697-2700)
      * `structural_toc_entry_count` — ValueError on a negative count (:2751-2755)
      * `structural_toc_entries` — RuntimeError when the plan's dividers and the
        payloads' level runs disagree (:2673-2678). This is the guard the card's
        own "Finding: the card's step-1 recipe is subtly wrong" section rests on.
      * `interior_stream` — RuntimeError when the drawn TOC needs a different
        page count than the plan was laid out on (:5458-5462). This is the
        tripwire the card calls the thing that "closes the circle".

      `grep -n "pytest.raises\|RuntimeError\|ValueError" tests/test_book_toc.py`
      returns nothing. The project has the opposite precedent: CARD-200's own
      page-plan tripwire has `TestFinaliseCounts_PlanTripwireIsNotAnEstimate`
      and `TestFinaliseGet_NamesThePagePlanFailure` — the latter because
      app.py's Finalise screen is written to catch and log exactly this
      RuntimeError, which makes the message text a user-facing contract.

      I checked the one latent crash this class of gap usually hides and it is
      NOT present: `structural_toc_entries`' message does `divider.level.value`,
      and `DividerPagePlan.__post_init__` enforces `isinstance(self.level, Tier)`,
      so the message cannot AttributeError on a None level. So this is a
      coverage gap, not a known bug.
    suggestion: |
      One small class in tests/test_book_toc.py: a `TocEntry(page=0)`, a
      `toc_range_label(5, 4)`, a `structural_toc_entry_count(-1, 1)`, a
      `structural_toc_entries` fed a section whose dividers were reordered, and
      an `interior_stream` with `measured_toc_page_count` monkeypatched to
      return a different figure — the last one also pinning that the message
      names both counts, since app.py logs it.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_toc.py
    line: 1206
    title: "The owner's 10 px folio margin (8.5 pt over the maximal 8.9) is enforced only on a host whose fonts match the recording"
    description: |
      Fix 2 states: "Both figures — the 59 px and the 10 px of margin — are
      asserted, so that choice is enforced and not just recorded." Measured,
      that is true only behind the `_lettered_as_recorded()` gate.

      MUTATION M10 of this review: set `TOC_GROUP_GAP_PT = 8.9` (the largest
      value that still clears the folio, by 2 px instead of 10) AND force
      `_lettered_as_recorded()` to return False, simulating a host without this
      machine's Arial. Result: **33 passed, 0 failed.** The owner's margin is
      unenforced off this host.

      This is correctly distinguished from the thing that actually matters, and
      I verified that half too: the BLOCKER itself is face-independent.
      MUTATION M9 — `TOC_GROUP_GAP_PT = 10.0` with the same gate forced False —
      still kills two tests: the 381-height sweep's ungated `room >= folio_line`
      inequality (whose own font ladder is a byte-for-byte re-implementation of
      `_guide_face`'s try-Arial-then-load_default fallback, so the two resolve
      to the same face on any host) and the ungated `folios == ["3"]` assertion
      in the real 10.00 cm render. So the folio can NOT be silently dropped
      again on any machine.

      Flagged as a risk, not an error: the test's own docstring says exactly
      this ("on a machine without it the guardrail inequality still runs, only
      the px figure is skipped"). Only the card's unqualified prose overstates it.
    suggestion: |
      No code change needed. Either qualify the Fix 2 note ("enforced on a host
      that letters as recorded; the folio guard itself is face-independent"), or
      — if the owner wants the margin enforced everywhere — assert the
      face-independent form of it: `worst_room - folio_line >= 2 * px(1.0)` or
      similar, outside the gate.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

