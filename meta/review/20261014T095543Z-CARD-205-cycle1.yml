independent_verification:
  three_caller_agreement:
    verdict: "AGREE — verified end to end, not inferred from the mechanism"
    method: |
      A script of my own (not the card's tests) over 7 book shapes x 4 trims
      (Book 1, 10.00, 10.10, 48.00 cm) = 28 configurations: 3-level 60/60/30,
      one level, two levels with the middle one empty, two levels + an untiered
      tail, untiered only, empty, and a book with an undrawable row. For each it
      compared six figures: section_plan's toc_page_count, the number of
      create_toc_page calls actually made by interior_stream, the number of rows
      actually drawn, structural_toc_entry_count re-derived from _level_runs,
      book_kdp's own TOC term re-derived from print_order + tier_of_record, and
      interior_page_count's sheet-free default — plus
      unpaired_interior_page_count(puzzles, book) against the generator's real
      stream.unpaired_page_count.
    result: "0 disagreements of 28. Rows drawn == structural_toc_entry_count in every case (8/4/6/6/2/0/4). All three page-count callers return 1 wherever the book has a puzzle and 0 where it does not. The KDP estimate equals the real unpaired count exactly in all 24 non-empty cases (307/29/18/18/6/13)."
    mechanism: |
      The agreement is structural, not coincidental. section_plan feeds
      structural_toc_entry_count the named level-run count off
      _level_runs(payloads); book_kdp feeds it `dividers`, the distinct named
      tiers of the same grouped print_order (equal to the run count because
      INV-009 groups the order — the premise is stated in the comment and holds
      because print_order is called two lines above); interior_page_count's
      sheet-free default feeds it min(len(TIERS), puzzle_count), a deliberate
      UPPER bound that keeps the documented "never under-count" contract. The
      card's claim that all three are fed from the same function is accurate. A
      point worth recording for the gutter table: because the term is now
      bounded at 8 rows and 8 rows fit one page on every trim KDP admits
      (swept, 381 heights, both in the gutter file and again with independent
      font metrics in the TOC file), the KDP estimate and the export can no
      longer differ about the TOC on ANY trim — this card strictly reduces the
      F-2 under-count surface rather than widening it.
  baselines:
    verdict: "HONEST — re-derived from the fixtures themselves"
    result: |
      Page-digest comparison, computed by me: book_baseline_card204.json vs
      book_baseline_card205.json differ on exactly [3]. card200 vs card205
      differ on [1,2,3,5,7,9,11,12,13]; card200 vs card204 differ on
      [1,2,5,7,9,11,12,13] — NOT page 3. So "CARD-205 moved page 3, CARD-204
      did not" is true as a fact about the three files (though only two of the
      three are asserted — F-002). `git diff main...HEAD --name-only --
      tests/fixtures/` is exactly one file, the new card205 recording: no
      earlier fixture is touched. The downward byte count (3504840 -> 3498430
      where Fix 1 went up) is recorded in interior_bytes_note with the
      mechanical cause given (three gaps shrink 42->35 px while a fourth
      appears, so the list ends 14 px lower and four rows sit at a new y) and
      an explicit refusal to explain the JPEG stream's direction — "which way
      the page's JPEG stream then moves is the encoder's business, and it is
      recorded because it is what the file does". That is the right call: the
      direction of a lossy stream's size under a pure y-shift is not derivable,
      and inventing a cause would be worse than recording the measurement. No
      explanation is needed and none should be demanded.
  repaired_tests:
    verdict: "REPAIRS, not relaxations — with one forced softening that is compensated"
    result: |
      (1) test_parity_holds_on_a_larger_book_whose_toc_spans_more_than_one_page
      -> ..._across_the_toc_insertion: the old precondition (toc_page_count > 1)
      is genuinely unsatisfiable now. The replacement is STRICTER, not looser —
      `== 1` plus two new preconditions the old test never had (the TOC still
      sits at 1 + GUIDE_PAGE_COUNT, and the book still prints > 120 pages). The
      body it protects is unchanged.
      (2) test_the_corpus_really_forces_more_than_one_toc_page_on_book_one ->
      test_an_explicit_book_one_height_matches_the_no_book_default: the BODY is
      byte-unchanged; only the name and docstring moved. The old name was
      already describing something the body never asserted, so this is a
      correction of a misleading name.
      (3) The one real softening: `shrunk_counts.page_count > book1_counts.page_count`
      -> `>=` in the end-to-end screen test. Forced (the strict form is now
      unreachable) and compensated by a NEW, more direct test of the mechanism
      the strict form was standing in for —
      test_the_frame_still_follows_the_books_own_stored_trim asserts
      `_toc_entries_per_page(_toc_frame_for(12cm)) < Book 1 < 48cm`, which is a
      stronger statement about F-2's actual fix than any comparison of totals.
      (4) The eight re-measured constants are measurements by construction, not
      nudges: every one is asserted against the LIVE page plan
      (`panel.counts(book_id).page_count == <CONST>`) somewhere in the file, so
      a hand-nudged value fails immediately. Each also keeps its own band
      assertion (kdp_page_band(...) == (301,500), gutter_refusal boundaries,
      AC288's 150/151 pair), and the AC288/CK1 retune to 41+41 / 41+42
      preserves CK-1's premise (an odd paired-tier count) — I re-derived the
      arithmetic: 2 guide + 1 TOC + 2 dividers + 41 + 21 + 1 + 82 = 150.
  folio_blocker:
    verdict: "CANNOT SILENTLY REAPPEAR"
    result: |
      Two independent guards, both running on any font (proved by forcing the
      font_fingerprint gate False and re-running): the 381-height sweep's
      `room >= folio_line` inequality, whose font ladder duplicates
      _guide_face's exactly so the two resolve to the same face on any host and
      whose folio metric comes from the PACKAGED face (deterministic
      everywhere); and `folios == ["3"]` read off the REAL create_toc_page
      drawing on the 10.00 cm trim via an ImageDraw spy. The threshold is right:
      _draw_folio omits when `bottom - content_bottom < ascent + descent` with
      no content_right offered, and create_toc_page offers none — exactly what
      the sweep computes. The sweep also pins (ungated) that the tightest trim
      IS the shortest one, so the worst case cannot drift to an unmeasured
      height. What is host-gated is only the 59 px figure and the owner's 10 px
      margin (F-004).
