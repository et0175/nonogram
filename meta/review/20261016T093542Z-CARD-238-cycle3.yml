      a chosen subset. Not a live defect; the sandbox writes its manifest fresh from
      the parent's live `git ls-files` on every build, so staleness is not reachable
      today.
    suggestion: "Consult the manifest only when `root != REPO_ROOT` (or ignore a manifest found at REPO_ROOT and say why), and add `.card238-tracked` to .gitignore so a leaked copy cannot be committed. One-line change plus a control asserting the parent resolution order."
