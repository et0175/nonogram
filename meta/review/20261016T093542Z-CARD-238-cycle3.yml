  - id: F-306
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 2165
    title: ".card238-tracked is consulted at any root including REPO_ROOT, and is neither gitignored nor tracked, so a stray manifest silently replaces git ls-files"
    description: |
      `_files_under_guard` (line 2165) tries `root / SANDBOX_MANIFEST_NAME` FIRST, for
      every root — including REPO_ROOT, where the file is never supposed to exist.
      Verified: the manifest branch is unconditional on root identity, and in the
      parent the guard currently falls through to `git ls-files` (278 files).
      `.card238-tracked` is not in .gitignore (`grep -n card238 .gitignore` -> no hit)
      and is not tracked (`git ls-files | grep -c card238` -> 0), so a stray copy at
      the repo root would at least show up in `git status` — that is the mitigation,
      and it is incidental rather than designed.

      Spoof/stale shape: a `.card238-tracked` at the repo root naming >100 innocuous
      modules plus this module and the ranker would satisfy
      `test_the_walk_actually_sees_both_guarded_trees` (its three assertions are
      `len > 100`, this module present, RANKER_PATH present) while omitting the one
