findings:
  - id: F-301
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_suite_profile.py
    line: 1124
    title: "_LISTERS names three listing spellings and the rule can only fire on one; a mutant restoring the original defect survives every guard test"
    description: |
      `_LISTERS = frozenset({"iterdir", "scandir", "listdir"})` (line 1124), under the
      comment at 1122-1123 — "Listing that directory is the same coupling without a
      filename at all: what comes back depends on what the host happens to have put
      there" — states coverage of three spellings. The rule in `_live_log_references`
      (lines 1489-1504) tests the call's RECEIVER:

          isinstance(node.func, ast.Attribute) and node.func.attr in (_GLOBBERS | _LISTERS)
          ... _is_the_kanban_directory(node.func.value)

      `os.listdir(d)` and `os.scandir(d)` are module functions: the directory is the
      ARGUMENT and the receiver is `os`. There is no `Path.listdir` / `Path.scandir`.
      So two of the three members are structurally unreachable, and only `.iterdir()`
      is pinned (the "listing the kanban directory, naming no log at all" control).

      Measured, by executing the guard (not by reading it):
        _live_log_references('import os\nN = os.listdir(REPO_ROOT / "meta" / "kanban")')  -> []
        _live_log_references('import os\nN = list(os.scandir(REPO_ROOT / "meta" / "kanban")))') -> []

      And measured end to end as a SURVIVING MUTANT. MUT-L, planted in another tracked
      guarded source (tests/test_clues.py) and reverted (md5 942627df2b6df5a003bf52775ab1d398
      restored and verified):

          _KANBAN = _P(__file__).resolve().parent.parent / "meta" / "kanban"
          def test_the_timing_log_is_present_and_nonempty() -> None:
              names = [n for n in _os.listdir(_KANBAN) if n.endswith(".log")]
              if not names:
                  _pt.skip("no timing log on this host")
              assert (_KANBAN / names[-1]).read_text(encoding="utf-8").strip()

      That is this card's own defect restored — a host-state skip wrapped round a live
      log read, green on a log-less host and red on a host with the log. Result:
      BOTH guard classes PASS (57 passed, rc=0). `_live_log_references` on the mutated
      module returns `[]`. The behavioural comparison cannot help: it runs only
      tests/test_suite_profile.py plus the control node, so 220 of the 221 guarded
      sources have the structural guard as their ONLY defence.

      Note the near-miss: `_conditional_silences` DOES report the skip half
      (`[('test_the_timing_log_is_present_and_nonempty', 'not names')]`) — but it is
      only ever applied to `Path(__file__)`, so nothing runs it against the offender.

      This is the family's shape, not one of its named instances: `_LISTERS`'s
      membership is a declaration of coverage the code lacks, it is not in
      MEASURED_STRUCTURAL_MISSES, and no control pins it — so it cannot go red. The
      card's root-cause fix (hold limits as controls) is the right mechanism; what
      did not happen is a fresh sweep for instances beyond the three already named.
    suggestion: |
      Two small fixes, either sufficient, both cheap:
      (a) in the `_LISTERS` branch, also test the call's ARGUMENTS with
          `_is_the_kanban_directory`, not only `node.func.value`; add
          `os.listdir(REPO_ROOT / "meta" / "kanban")` and the `os.scandir` twin to
          REINTRODUCTIONS as controls; or
      (b) apply `_conditional_silences` to every source in `_guarded_sources()` rather
          than to `Path(__file__)` alone — which closes MUT-L's skip half across the
          whole guarded tree and is the stronger change.
      Either way, add the two spellings as controls so the claim and the code are
      pinned to each other.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-302
    severity: high
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 2535
    title: "_build_sandbox states that nothing outside root can be written; 57 data symlinks resolve outside it and a write through one lands in the real worktree"
    description: |
      `_build_sandbox`'s docstring (lines 2535-2538) asserts a containment property:

          "Nothing outside ``root`` is written: every directory is created with
          ``mkdir``, so a write here cannot land in the real tree even if a future
          edit points a source path at it."

      The mkdir argument covers directories. It does not cover the file symlinks the
      same function creates four lines earlier (`mirrored.symlink_to(source)`, line
      2552) for every non-`.py` tracked file. Measured on a built sandbox:

          total entries 291, .py 222, SYMLINKED .py: 0, symlinked DIRECTORIES: 0
          symlinked non-.py: 57  (.jpg .json .md .png .txt)
          sample: meta/profiling/card-235-browser-teardown.md ->
                  /Users/omelnikova/.../PythonProject4-card-238/meta/profiling/card-235-browser-teardown.md
          that symlink's resolve() escapes the sandbox: True

      And a write through such a link lands on the target (demonstrated on a throwaway
      pair rather than on a repo file, to avoid touching the worktree):
          link.write_text("OVERWRITTEN") -> target content "OVERWRITTEN", escaped: True

      So the stated guarantee is false by exactly the route the sentence says is
      closed, and the test the docstring cites as pinning it
      (`test_no_module_the_sandbox_can_reach_resolves_outside_it`, line 2350) scans
      `tmp_path.rglob("*.py")` only — it cannot see the 57 data links.

      Nothing in the module writes to a mirrored data path today, so this is latent
      rather than live. It is filed as Important rather than Minor because (a) it is a
      false statement of a SAFETY property on a card whose hardest guardrail (G-1) is
      "do not touch the owner's file", (b) the sentence's "even if a future edit points
      a source path at it" clause actively invites reliance on it, and (c) it is the
      same uncontrolled-declaration shape as F-301 — RC-1 — in the sandbox builder
      rather than in a guard.

      The isolation property the card actually needs IS delivered and IS pinned: no
      `.py` is symlinked, no directory is symlinked, and no `.py` resolves or is
      reachable through a link outside the sandbox (all four measured as zero). This
      finding is only about the write direction and the sentence that overstates it.
    suggestion: |
      Correct the sentence to the measured bound — "every *.py is a copy and no
      directory is linked, so no module resolves outside root; data files are
      symlinks, so a write through one WOULD land in the real tree, and nothing here
      writes to them" — and pin that bound as a control the way the card pins its
      others: widen `test_no_module_the_sandbox_can_reach_resolves_outside_it` to
      rglob("*") and assert the escaping set is exactly the non-.py data links (so it
      goes red if a *.py or a directory ever joins them), or copy the data files too
      and assert the escaping set is empty.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-303
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1137
    title: "_string_values has no IfExp branch, so a ternary literal written straight into the join is invisible — and the sentence cycle 2 narrowed for the walrus is still false for it"
    description: |
      `_string_values` (lines 1147-1206) handles Constant, JoinedStr, Tuple/List/Set,
      Dict, BinOp(Add|Mod), Name, Attribute, Subscript/Starred/NamedExpr, the three
      comprehensions and Call. `ast.IfExp` is absent. Measured:

          _string_values(parse('("suite-timing.log" if x else "y")').body, {}) -> []
          _live_log_references('LOG = REPO_ROOT / "meta" / "kanban" / ("suite-timing.log" if V2 else "old.log")') -> []
          _live_log_references('NAME = "suite-timing.log" if V2 else "x"\nLOG = REPO_ROOT / "meta" / "kanban" / NAME') -> []

      `_is_pathish`'s docstring at 1136-1142 says: "a literal written where a path is
      used is judged by :func:`_live_log_references` directly and this test never sees
      it". That sentence is the *narrowed* replacement cycle 2 (F-105) forced, because
      the old wording ("flagged either way") was untrue of one wrapper node — the
      walrus. The narrowed wording is still untrue of this wrapper node: an IfExp
      holding the literal is written exactly where a path is used, and is reported
      nowhere. The walrus got a control (REINTRODUCTIONS, "the filename bound by a
      walrus inside the join"); the ternary has none, and is not in
      MEASURED_STRUCTURAL_MISSES either.

      Low rather than high because a ternary over two log filenames is less idiomatic
      than F-301's `os.listdir`, and inside this module the form dies on outcome. But
      it is the same one-step-off-a-caught-form class cycle 2 added four controls for,
      and it leaves the same sentence overclaiming for a second cycle running.
    suggestion: |
      Add `if isinstance(node, ast.IfExp): return [*_string_values(node.body, env),
      *_string_values(node.orelse, env)]` to `_string_values`, and add the inline
      ternary form to REINTRODUCTIONS. If it is to stay a bound instead, put it in
      MEASURED_STRUCTURAL_MISSES so it goes red when the resolver grows past it.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-304
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1120
    title: "_GLOBBERS' iglob is unreachable for the same receiver-vs-argument reason as _LISTERS' listdir/scandir"
    description: |
      `_GLOBBERS = frozenset({"glob", "rglob", "iglob"})` (line 1120). `glob.iglob` is
      a module function, so like `os.listdir` it is spelled with the pattern as an
      argument and `glob` as the receiver — and the rule requires `"meta" in receiver
      and "kanban" in receiver`, which `glob` never satisfies. Unlike F-301 this is
      harmless in practice, because a glob NAMES its own filter and the generic
      call-argument rule catches a literal pattern:
          _live_log_references('import glob\nHITS = glob.glob("meta/kanban/*.log")')
            -> ['meta/kanban/*.log']   (caught)
      It only leaks when the pattern is assembled from a hoisted directory:
          'D = str(REPO_ROOT / "meta" / "kanban")\nHITS = glob.iglob(D + "/*.log")' -> []
      Filed separately from F-301 because the consequence differs (no live hole), but
      it is the same declaration-vs-code mismatch and belongs in the same sweep.
    suggestion: "Fold into F-301's fix: test the call's arguments as well as its receiver, and either add a control for the module-function spelling or drop iglob from the set so the declaration matches the code."
    confidence: high
