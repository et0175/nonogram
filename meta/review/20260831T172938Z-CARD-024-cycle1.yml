  - id: F-010
    severity: info
    category: ops
    type: risk
    file: tests/property/test_export_roundtrip.py
    line: 1
    title: "Out of scope (process) — mutation checks in this repo give false results unless __pycache__ is cleared"
    description: |
      Worth recording because it likely explains the orchestrator's own
      unreliable mutation run. A mutant that preserves file byte-length — the
      width/height swap in json_export.parse is exactly such a mutant, since
      the two lines simply exchange contents — leaves the .pyc validation stamp
      (mtime in whole seconds + source size) unchanged when the restore lands
      in the same second as the mutation. CPython then reuses the MUTATED
      bytecode for every subsequent run. In this review's first pass that
      produced one false KILL and contaminated the two mutants that ran after
      it; the results reported here are from a re-run with __pycache__ removed
      before every mutant and `python -B -p no:cacheprovider`.
    suggestion: |
      Any future mutation check in this repo should clear __pycache__ between
      mutants and run the interpreter with -B, and should verify each mutation
      pattern matched exactly once before drawing a conclusion from a PASS.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
