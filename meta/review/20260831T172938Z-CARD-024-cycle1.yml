findings:
  - id: F-001
    severity: critical
    category: feature
    type: gap
    file: tests/property/test_export_roundtrip.py
    line: 20
    title: "AC-060 and AC-061 have no test — the named tests do not exist anywhere in the repo"
    description: |
      The card's two headline acceptance criteria name
      `TestExport_JSONRoundTripsRectangularDimensions` and
      `TestExport_CSVRoundTripsRectangularDimensions`
      (meta/architecture/requirements.yml:381 and :387, repeated verbatim in
      CARD-024.md's `## Acceptance criteria`). Neither test exists.

      Re-derived, not assumed:
        * `grep -rn "def test.*rectangular\|RoundTripsRectangular" tests/` returns
          exactly two hits, both inside the docstring at
          tests/property/test_export_roundtrip.py:20 and :22 — no function
          definitions.
        * The complete list of `^def ` in that file is lines 146, 175, 189, 225,
          308, 345, 415, 433, 446, 472, 493, 532, 568, 637. The two names the
          docstring maps AC-060/AC-061 to
          (`test_json_round_trips_rectangular_dimensions`,
          `test_csv_round_trips_rectangular_dimensions`) are not among them.
        * No rectangular payload reaches disk. The corpus does contain 30x12
          (indices 1229, 2011, 2027, 2043, 2059, 2075) and 12x30 (2010, 2026,
          2042, 2058, 2074), but only through the in-memory
          `document`/`decode` pair. The on-disk slice is `CASES[::19]`; its
          edge-case members are 49x50, 2x2, 49x49 and 2x1 — no 30x12 or 12x30
          case makes the `render`/`read` round trip that AC-060/AC-061's
          "exported as JSON / decoded back" describes.

      The underlying BEHAVIOUR is well covered (2010 non-square cases in the
      corpus, 105 non-square cases on disk), so this is not a correctness bug —
      it is a delivery gap plus a dead check-ref. That combination is worse
      than a plain omission: trace.yml will resolve AC-060/AC-061 to test names
      that do not exist and mark FR-012 covered, and the reviewer of the next
      card sees a green suite and an index that says the criteria are tested.
    suggestion: |
      Add two tests with the exact names the criteria require, each doing a
      30x12 round trip through the real file layer:

        def test_json_round_trips_rectangular_dimensions(tmp_path):  # AC-060
            payload = _payload(_random_or_fixed_30x12_grid, width=30, height=12, ...)
            json_export.render(payload, tmp_path / "r.json")
            decoded = json_export.read(tmp_path / "r.json")
            assert (decoded.width, decoded.height) == (30, 12)
            assert len(decoded.grid[0]) == 30 and len(decoded.grid) == 12

      and the CSV twin, then fix the docstring index at lines 20-23 to point at
      them. Assert 30 and 12 as two distinct values (not `== payload.width`),
      so a decoder that derived one from the other cannot satisfy the test.
    confidence: high
    source: static
