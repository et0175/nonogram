  - id: F-003
    severity: high
    category: tech-debt
    type: risk
    file: tests/property/test_export_roundtrip.py
    line: 234
    title: "Verified surviving mutant: the corpus gate does not enforce the non-degeneracy the docstring claims, and the stated mechanism is wrong"
    description: |
      `_corpus`'s docstring (lines 233-237) says:

          "The height stride is 3, coprime with the 50-long size cycle, which
          is what makes every (width, height) residue pair reachable instead of
          pinning height to a function of width"

      That reasoning is backwards. Writing index = 50q + r (so width = r+1),
      the actual expression `(index*3 + index//50) % 50` evaluates to
      (151q + 3r) mod 50 = (q + 3r) mod 50 — it is the `index // len(SIZES)`
      term (q) that decouples height from width, giving 40-43 distinct heights
      per width (measured). The coprime stride 3 alone would give
      (3*index) mod 50 = 3r mod 50, a BIJECTION of width — i.e. exactly the
      "height is a function of width" degeneracy the docstring claims the
      stride prevents.

      Confirmed by mutation, not by argument. Mutant M6 replaces the stride
      with `SIZES[(index * 3) % len(SIZES)]`, making height a pure deterministic
      function of width, and it **SURVIVES** the whole export suite
      (tests/property/test_export_roundtrip.py + tests/test_export_json.py +
      tests/test_export_csv.py, all green). It survives because the gate at
      line 371 asserts only a non-square floor, and such a corpus still yields
      1970 non-square cases against the bar of 1500.

      The commit message repeats the same wrong rationale ("Width and height
      therefore cycle on coprime strides (3 against the 50-long size cycle) so
      height is not a function of width"). The hazard is concrete: a future
      maintainer simplifying the expression on the strength of the docstring's
      own explanation would silently restore the degeneracy, and every gate in
      the file would stay green.

      Scope note, so this is not overstated: the gate DOES catch the realistic
      bugs. Mutants M4 (corpus reverts to squares), M3 (CSV decodes height from
      len(grid)) and M1 (JSON reverts to a scalar size) were all killed. What
      survives is only the contrived "decoder reimplements the same modular
      function" case. The finding is about the false rationale plus an
      unasserted invariant, not about the realistic failure mode.
    suggestion: |
      Two independent fixes, both cheap:
        1. Correct the docstring (and the card's Worktree notes) to attribute
           the decoupling to the `index // len(SIZES)` term, not to the coprime
           stride.
        2. Assert the property directly in
           `test_the_corpus_covers_what_ec_002_asks_for`, e.g.

             by_width = defaultdict(set)
             for case in CASES: by_width[case.width].add(case.height)
             assert min(len(h) for h in by_width.values()) >= 10, (
                 "height must not be a function of width"
             )

           Measured today: min 40, max 43 — so the bar has real margin.
    confidence: high
    source: static
    violates: EC-002
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_export_roundtrip.py
    line: 650
    title: "The version sweep couples the two SCHEMA_VERSIONs that ADR-0023 says may diverge"
    description: |
      `wrong = [v for v in (*range(0, 12), 99, 1000, -1) if v != json_export.SCHEMA_VERSION]`
      excludes only the JSON constant, then feeds the same list to the CSV
      decoder at line 670. ADR-0023 is explicit that the two constants are
      independent and "that both read 2 today is a coincidence of history".
      The first time csv_export.SCHEMA_VERSION moves to 3 while JSON stays at
      2, the sweep will hand the CSV decoder its own current version and the
      test fails on a document that is correctly accepted.

      Fail-loud rather than silent, hence low — but it will fire on an
      unrelated card and read as a regression there.
    suggestion: |
      Filter per format inside the loop, e.g. build the JSON sweep against
      json_export.SCHEMA_VERSION and the CSV sweep against
      csv_export.SCHEMA_VERSION, and keep the `assert 1 in wrong` guard for
      both.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_export_roundtrip.py
    line: 661
    title: "Substring assertion is weaker than the 'names both versions' claim it stands for"
    description: |
      `assert str(version) in message and str(SCHEMA_VERSION) in message` is a
      digit-substring test, not a "names both versions" test: a message reading
      "unsupported version 1000" would satisfy `str(1) in message`.

      It happens to be sound for the current sweep — none of the swept values
      (0, 1, 3..11, 99, 1000, -1) contains the digit "2", so a decoder that
      dropped its own version from the message is genuinely caught — but the
      soundness is an accident of the chosen value set, not a property of the
      assertion. Adding 12, 21 or 20 to the sweep would silently weaken it.
    suggestion: |
      Assert the shape rather than the digits, e.g.
      `assert f"version {version}" in message and f"version {SCHEMA_VERSION}" in message`,
      which is what both decoders actually emit.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_export_roundtrip.py
    line: 106
    title: "REQUIRED_CASES = 500 is now a dead constant and its docstring is misleading"
    description: |
      REQUIRED_CASES is documented as EC-002's floor, "comfortably below
      CASE_COUNT so the bar is not also the ceiling". It can no longer bind: at
      a 500-case corpus the drawn cases yield ~490 non-square and 10 squares,
      which fails BOTH `non_square >= 1500` (line 371) and `squares >= 50`
      (line 376) long before the 500-case bar is reached. The real floor is now
      REQUIRED_NON_SQUARE_CASES = 1500, i.e. CASE_COUNT can never drop below
      roughly 1530 without a different assertion firing first.

      Measured margins on the current corpus (2080 cases): non_square 2010 vs
      1500, squares 70 vs 50, widths and heights each covering all of 1..50.
      Both floors are met with real margin — this is a documentation/coherence
      point, not a coverage gap.
    suggestion: |
      Either drop REQUIRED_CASES or restate its docstring to say it is a
      lower-order floor that the non-square bar now dominates, so a future
      reader does not tune CASE_COUNT against a constant that cannot bind.
    confidence: high
