  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/static/solver.js
    line: 65
    title: "Reset-clear claim is tested on the Keep-marks path only"
    description: |
      The MARKING comment (solver.js:65-67) says lastClick is cleared by "pressing Reset when
      that opens the confirmation (so a reset opened and then cancelled ends the run too)".
      The code is right (the clear sits at solver.js:566, after the gesture/aria-disabled
      early return, so both cancel paths inherit it). But only one edge of the claim is
      tested. Mutant R8 moves the clear into the Keep-marks handler, so cancelling with
      Escape keeps lastClick. It survives all 11 TestSolverClickFollowsTheBrush tests.
      Mutant R9 moves the clear above the early return, so a disabled Reset press, or one
      made during a gesture, clears it. It also survives. Example: with White, two clicks
      leave the board blank and Reset disabled; a press on the disabled Reset is then
      followed by a click that gives dark today but white under R9.
      This is Minor because the behaviour comes from cycle-1's Minor F-002, not from an AC,
      and the code holds the property by construction.
    suggestion: |
      Add "reset opened and cancelled (Escape)" to the AC-5 between-steps (press Reset, then
      Escape) to kill R8. Then either pin the qualifier with one test (White, two clicks to
      blank, press the disabled Reset, click: expect dark), or drop "when that opens the
      confirmation" from the comment.
    confidence: high
