figure_re_derivation:
  method: >-
    Independent re-derivation, not a re-run of the implementation's code. A
    separate recursive-descent AST walker (ast.iter_child_nodes, not ast.walk)
    for the symbol census; a regex paragraph locator for the claim census; a
    literal-reading ast pass over tests/test_cli.py for the adapter rank
    instead of importing tests.test_cli; three methods for the assert counts.
  reproduced:
    symbols_1347:
      claimed: 1347
      re_derived: 1347
      domain: "distinct symbol NAMES (FunctionDef/AsyncFunctionDef/ClassDef anywhere + module-level Assign/AnnAssign Name targets) over 60 src/nonogram/**/*.py files"
    module_names_60: {claimed: 60, re_derived: 60}
    unparsable_src_files_0: {claimed: 0, re_derived: 0}
    distributions_11:
      claimed: 11
      re_derived: 11
      detail: "runtime [numpy, pillow]; dev [pytest, pytest-playwright]; admin [flask, gunicorn, reportlab, werkzeug]; db [alembic, psycopg2-binary, sqlalchemy]"
    claims_24:
      claimed: "24 claims = 9 paths + 8 symbols + 4 type-or-literal + 2 keywords + 1 module"
      re_derived: "24 backtick spans (22 distinct; `pyproject.toml` occurs 3x), and the breakdown reproduces exactly 9 + 8 + 4 + 2 + 1 = 24"
      domain: "span OCCURRENCES across the three guarded paragraphs, not distinct spans"
      per_paragraph: "boundary-types 14, solver 7, dependency 3"
    derived_members_6:
      claimed: 6
      re_derived: 6
      members_with_definition_sites:
        - "_validate_side -- sourcing/random_grid.py:115"
        - "parse_art -- sourcing/library.py:159"
        - "parse_tier -- difficulty.py:562"
        - "validate_aspect_ratio -- sourcing/image.py:586"
        - "validate_density -- sourcing/random_grid.py:383"
        - "validate_extent -- sourcing/random_grid.py:131"
      excluded_by_the_adapter_rank: "5 -- _parse_sort_string, validate_image, validate_interior_ink_mode, validate_margins, validate_trim_size, all defined under admin/"
    assert_nodes:
      claimed: "115 / 236 / 149"
      re_derived: "115 / 236 / 149 by ast.walk, by independent recursive descent, and by a line regex -- all three agree"
      domain: "ast.Assert node count per FILE, not per selection, and not the collected-test counts (21 / 8 / 6, confirmed by --collect-only)"
    M5_default_deny_8_arms:
      claimed: "a renamed paragraph lead-in reds 8 arms rather than reading less"
      re_derived: "RED, exit 1, 8 failed / 13 passed over the 21-test TestClaudeMd selection"
      domain_caveat: >-
        The implementation's 8 is an ARM count at 8 named lines; mine is a
        TEST count. They coincide numerically; that is not the same figure.
        Mechanism confirmed either way: a lead-in the rule cannot find fails
        everywhere, across all three test classes, rather than reading fewer
        claims.
  did_not_reproduce:
    repo_paths_575:
      claimed: 575
      re_derived: "604 today; 507 if __pycache__ is excluded"
      cause: >-
        _repo_paths() globs "*" under src/tests/docs, so it counts
        __pycache__/*.pyc entries, which vary with what has been run. 575
        implies 68 cached files at measurement time; there are 97 now.
      consequence: >-
        The figure is non-reproducible by construction. Benign in effect: the
        set is used only for membership, and a .pyc can never satisfy a span
        ending .py/.toml/.md/.yml/.cfg/.txt or a "dir/" span. Filed as F-9
        because the evidence standard says a figure that does not reproduce is
        a finding regardless of direction.
  not_re_derived:
    - figure: "arms reached 35 / 19 / 11, and the 14-of-14 kill result"
      why: >-
        These are kill_matrix.py's own instrument figures; re-running the same
        instrument is not an independent method, and the brief forbids
        measuring durations and writing a second instrument. Instead I wrote
        twelve plants of my own (below) as the independent method. Nine red
        exactly where the matrix said the corresponding mutant landed, which
        is corroboration of the attribution, not of the arm counts.
    - figure: "the 1,000 / 451 / 6 pass counts in the worktree notes"
      why: "this board's -q output does not reliably print a pass-count line; I quote exit codes and --collect-only figures only"

plants:
  restore_protocol: >-
    cp -p backup of six files into mktemp -d, shasum -a 256 manifest, restore
    in a trap on EXIT/INT/TERM, then shasum -a 256 -c AND diff -q on all six,
    then git status --porcelain. Deletion mutants line-count preserving.
  final_tree_state: >-
    git status --porcelain shows only "?? meta/kanban/cards/CARD-264.md", which
    was untracked before this review began and is not mine. git diff HEAD is
    empty; git diff --name-only HEAD over CLAUDE.md, tests/, docs/ and src/ is
    empty. shasum -a 256 -c reported OK for all six guarded files after every
    plant, and diff -q found no difference.
  incident:
    - what: >-
        Plant 1a mutated src/nonogram/web/__init__.py, which was not yet in the
        harness's restore manifest, so the trap did not restore it.
      detected_by: "the trap's own git status --porcelain line, which printed ' M src/nonogram/web/__init__.py'"
      remedy: "git checkout -- src/nonogram/web/__init__.py; the file was then added to the manifest and every later plant verified it OK"
      residual: none

