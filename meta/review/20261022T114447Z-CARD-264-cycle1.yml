  total_deductions: 2.00
  arithmetic: "10 - 2.00 = 8.00"
  adjustment:
    amount: "+0.30"
    reason: >-
      Stated explicitly rather than folded into the weights, so the arithmetic
      stays auditable. The twelve plants I wrote as a third author -- neither
      implementer nor drafter -- red nine times on arms I chose, including an
      AC-4 dead member different from the committed one, AC-2 plants on two
      lines other than the hardcoded 46, and an AC-5 plant proving the
      derivation catches ground the retired triple would have passed. On
      CARD-262 the equivalent exercise found 23 silent shapes against a table
      passing all 18 of its own rows; here it found three, and all three are
      undeclared-reach bounds rather than defects. Every figure I could
      re-derive by an independent method reproduced exactly, except one
      cache-sensitive census number. That is a materially stronger result than
      the deduction list alone conveys.
  final: 8.30

