findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_public_player_pages.py
    line: 1793
    title: "The drift guard's boundary class has one uncontrolled character, and it is the hyphen — declared by the card, confirmed here"
    description: |
      `named()`'s boundary is `(?![a-z-])`. The letter half is controlled twice
      over (C3-M05, C3-M06 both red on the countx cell). The HYPHEN half is
      controlled by nothing: C3-M07 deletes it, leaving `(?![a-z])`, and the
      test PASSES.

      The card declares this in its own could-not-establish - "the hyphen in
      `[a-z-]` has no control at all" - so this finding adds the measurement
      rather than the news. What it would take to matter: a `data-pages-*` hook
      that is a HYPHEN-extended prefix of another hook, e.g. a
      `data-pages-count` beside a `data-pages-count-label`. No such pair exists
