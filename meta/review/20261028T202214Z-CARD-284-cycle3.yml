gating_findings_readjudicated:
  - id: "cycle2 F-001"
    was: "high / gating — ADR-0041/R2 (mandatory) read false for the assembled site, and its own named served-half guard passed only because the bundle fixture's book title was editorial, while a sibling test in the same suite asserted the opposite outcome"
    verdict: CLOSED
    independent_rederivation: |
      I did not take the card's account. Both halves were re-derived from the
      artefacts and from mutants.

      THE MODEL HALF. ADR-0041/R2's own statement (not an FR, not a comment)
      now carries the exemption, and its amendment log entry at the ADR's
      :249-270 states what was false and why, including the measurement that
      settles it. EC-048's statement carries the exemption clause and says the
      channel is OPEN with a declared residual. FR-045 is narrowed on both
      halves. The false justification - "EC-048's enumeration does not name
      it" - survives at exactly four sites and every one of them now says it
      was FALSE and why: player/assemble.py (two regions, :223-228 and
      :789-792), player/pages.js (:40-43), tests/test_public_player_pages.py
      (:38-41). Nowhere does it still read as a justification.
      And the model half did NOT travel with this merge: 4b4ca160 is an
      ancestor of main at c2307064, so R2's amendment, EC-048's clause and
      FR-045's bundle sentence are already on main.

      THE MECHANICAL HALF, measured per assertion:

      * C3-M12 re-fires cycle 2's C2-M41 (the fixture default BOOK_TITLE made
        leaky, as `_leaky_title(GRIDS["min"])`). Cycle 2's split is GONE:
        tests/test_public_player.py::test_served_tree_is_clean_of_answers
        PASSES and
        tests/test_public_player_pages.py::test_the_book_title_exemption_is_scoped_and_its_cost_is_measured
        PASSES - the two tests that asserted opposite outcomes for one
        mandatory rule now agree. The one node that reds is
        test_the_picture_name_is_dropped_and_the_books_title_is_not, on
        `assert BOOK_TITLE == "A book"`: the fixture's title is now pinned in
        exactly one place and that place is a test ABOUT the fixture, not a
        test about R2. The card's claim is exactly right.
      * C3-M01 (2-node, DELETION): served_puzzle's field-by-field rebuild and
        its internal schema-equality assert both deleted, so the bundle's
        PUZZLE title flows into the served puzzle file. test_served_tree_is_clean_of_answers
        reds on its OWN half-1 assertion, `assert sweep_tree(clean.site_dir,
        GRIDS) == {}` - not at fixture setup, which is cycle 1's F-007 failure
        mode and the reason this mutant was worth firing. Three further nodes
        red, each on its own assertion.
      * C3-M02 (DELETION): served_book's title pass-through deleted
        (`"title": _book_title(payload.get("title"))` -> `""`), which is the
        one field that function passes through from the bundle. The same test
        reds on its OWN half-2 assertion, `assert sorted(recovered) ==
        ["book/0123456789.json [min]"]`. So BOTH halves of the served-half
        guard are live, each on its own cell, and neither rests on a fixture
        default - the test takes `(bundle, tmp_path)` and builds its own two
        bundle roots with both titles passed in explicitly.
      * C3-M03 (DELETION): EXEMPT_LISTING_FIELDS emptied. All three nodes red.
        Declared honestly: they red in a `raise ValueError` from
        check_listing_capacity's partition arm, not in an assertion.
      * C3-M04 (edge): `title` added to SERVED_ENTRY_SCHEMA - the "and only in
        the book file" direction. All three nodes red, and all three red in the
        SCOPE refusal's `raise`, before any assertion about where the title
        landed. This is precisely what the card declared it could not claim a
        mutant for, and the declaration is accurate: the scope refusal is the
        first reader, so "only in the book file" is enforced mechanically but
        is not the cell that reds.
    residual: >-
      One. Nothing mechanical enforces R2's owed check-ref flip at merge; see
      the check_ref_disposition block below.

  - id: "cycle2 F-002"
    was: "medium / gating — the design-inventory drift guard's word-boundary fix had no control that could fail; typo-absorption was still live for every hook but one hardcoded name (C2-M25 and the 2-node C2-M25b both survived)"
    verdict: CLOSED
    independent_rederivation: |
      The fix is that `named()` takes the inventory text as a PARAMETER and
      the boundary is asserted THROUGH the function over inventories written
      in the test. I re-fired cycle 2's two survivors unchanged and added two
      edges.

      * C3-M05 = C2-M25, re-fired: the word boundary DELETED, `return
        re.search(rf"{re.escape(hook)}(?![a-z-])", text) is not None` ->
        `return hook in text`. Now KILLED, and killed on the cell the fix
        named: `assert not named("data-pages-count", "a tile has
        [data-pages-countx] on it")`. The cell the fix added is the cell that
        reds.
      * C3-M06 = C2-M25b, re-fired (2-node): the boundary deleted AND the
        inventory's `data-pages-count` typo'd to `data-pages-countx` in
        meta/design/components.md - the counter-case that closed cycle 2's
        refutation. Now KILLED, on the SAME cell, which is the point: the
        control no longer depends on which hook the inventory happens to
        spell. Both file hashes verified at HEAD before and restored after.
      * C3-M08 (edge): the boundary stops admitting `=`
        (`(?![a-z-])` -> `(?![a-z-=])`). KILLED - but read the cell: it reds on
        `assert missing == [], missing`, the real-inventory completeness sweep,
        and NOT on the dedicated `named("data-pages-count", "written as
        data-pages-count=\"3\" here")` assertion, which never runs. So cycle
        2's sentence "the `=` half is held by the real inventory rather than by
        its own cell" is STILL TRUE of the first reader, and fix round 2's
        could-not-establish says exactly that. Honest.
      * C3-M07 (edge): the hyphen DELETED from the boundary class
        (`(?![a-z-])` -> `(?![a-z])`). SURVIVED. This is the one survivor of
        the cycle and the card declares it in its own words - "the hyphen in
        `[a-z-]` has no control at all". The declaration is accurate and the
        exposure is small: it needs a hook that is a hyphen-extended prefix of
        another hook, and no such pair exists in the two shipped documents
        today (the live pair is `data-pages-filter` / `data-pages-filters`,
        which the letter half of the class already covers).

check_ref_disposition:
  question: "the card says R2's check-ref flip is 'verified and owed AT MERGE, not before'. Sound, or does it hide an unflipped ref?"
  verdict: "SOUND — and it hides nothing. But the figure in its justification is WRONG, and the obligation is carried by prose alone."
  rederivation: |
    Resolved each of the three path::name strings in the flip text the way the
    validator does - `git grep -lw` over tracked non-Markdown files - and then
    against main.

    * all three resolve ON THE BRANCH. The third now resolves from
      tests/test_public_player_pages.py, the module that DEFINES it, which is
      what commit 4b06b11d was for and it worked: before it the only
      non-excluded hits were prose sentences in two other files.
    * against main, however: the first two resolve on main (their defs exist
      there - the bundle half is CARD-282's and the served half is CARD-283's,
      with the latter's signature changed but not its name), and only the
      THIRD does not, because tests/test_public_player_pages.py does not exist
      on main at all. So "two of the three resolve only on this branch" is
      FALSE: exactly ONE does.
    * That does not change the disposition. One branch-only ref is sufficient
      reason not to apply the flip before the merge, and it is the reason the
      board repaired across ADR-0042's four checks: a ref that names a test
      absent from the tree reads as mechanically checked while nothing checks
      it. R2's `check:` therefore still names the bundle half alone, the served
      half and the exemption's own control are named in the COMMENT beside it,
      and that comment names CARD-284 as owing the flip at its merge. Nothing
      is hidden and nothing reads as checked that is not.
    * What is NOT mechanical is the flip itself. It is owed by a sentence in an
      ADR comment and a code block in the card's FIX ROUND 2 section. If the
      merge lands and nobody applies it, R2's exemption keeps no named control
      and the omission reds nothing. Recorded as a residual rather than as a
      finding, because prescribing the flip here would be prescribing an edit
      in the last cycle.
    * One fragility re-confirmed and it is not this card's: R2's EXISTING
      bundle-half ref resolves, outside the model's own excluded files, through
      exactly one prose line in tests/test_public_player.py plus two
      meta/review/*.yml files. That is the backlog's "a review YAML can revive
      a dead check ref", one artefact away from firing - so this report
      deliberately does not quote that path::name string in full either.

