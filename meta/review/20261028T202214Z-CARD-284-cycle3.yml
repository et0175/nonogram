      C2-M28 and handing the cross-process half to the other test. The SOURCE
      docstring does not. `served_index`'s docstring at player/assemble.py
      :988-997 still reads: "It is held now, in two places and two shapes -
      ...test_the_served_index_is_key_sorted on this function's own output, and
      ...test_two_assemble_runs_are_byte_identical on the whole assembled tree,
      which is the property at the layer that is actually deployed."

      Mechanically confirmed that the fix round did not reach it: the hunk
      headers of `git diff 82d777c9 6aa4c5b9 -- player/assemble.py` are
      :43, :62, :169, :204, :664, :751, :849 and the last ends at 889+24, well
      short of 988. So this is the one site of two that did not get the
      narrowing, in the same commit range that narrowed the other.

      This is RC-2 of cycle 2 recurring - a claim stated at two sites and
      corrected at one - and it is the third consecutive round in which that
      family produces a finding. It is low because the sentence is in a
      docstring with no behavioural consequence and the correct statement is
