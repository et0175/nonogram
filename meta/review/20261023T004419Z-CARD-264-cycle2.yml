      already ends with a full stop, not because of the em-dash. The declared miss
      side (colon, comma) is accurate; only the parenthetical attribution is wrong.
      On this card that matters more than usual: a control's own declaration
      misdescribing the mechanism it declares is the defect the card exists to
      remove, one layer in.
    suggestion: "say 'a full stop or a semicolon breaks the split; an em-dash does not', and move the em-dash case out of the caught list or keep it with its real cause named."
