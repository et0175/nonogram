    description: |
      tests/test_cli.py is byte-identical to main on this branch
      (git diff main...HEAD -- tests/test_cli.py is empty), because the narrowing
      merge 4f7263fb resolved it to main's version. The docs page was NOT reverted
      with it, so three statements it makes are now false:

      (a) lines 25-30 quote, in bold and verbatim, "A guard with an allowlist is
      weaker than a guard without one (ADR-0019, Negative), so the set below is
      closed and is deliberately not a pattern: it grows only by a deliberate edit
      to that line, reviewed as the architectural change admitting an adapter is."
      The comment at tests/test_cli.py:743-747 reads "...so this set is closed at
      two names and is deliberately not a pattern -- a third adapter is a
      decision, not a rename." The quotation marks are the problem: this is not a
      paraphrase that drifted, it is a fabricated citation.

      (b) lines 36-45: "**The guard's prose contradicted its own code until
      CARD-264.** ... All three now state the *rule* -- the set is closed and grows
      only by a deliberate edit to that line". Only one of the three (CLAUDE.md,
      and by CARD-261) states the rule. The comment still says "closed at two
      names" and the test at tests/test_cli.py:905 is still called
      test_the_adapter_allowlist_is_closed_at_the_two_known_adapters.

      (c) line 47: "`TestAdapterAllowlist_NoProseClaimsAStaleCount` reds if any
      prose around the set states a count again, reading `len(_ADAPTERS)` for the
      number rather than restating it." git grep over src and tests returns no hit
      for that name -- it exists only in docs, card files and cycle 1's report. The
      guard that DOES exist (CARD-261's _adapter_counts) is applied to _CLAUDE_MD
      at tests/test_cli.py:2388, i.e. scoped to CLAUDE.md, not to the prose around
      the set.

      main's version of this same page was accurate: present tense, "The guard's
      prose contradicts its own code", with the real comment text. So as it stands
      the branch makes this page strictly LESS accurate than main, and it
      reinstates the exact reader-harm the page itself describes two paragraphs
      down: a reader told the prose now states the rule, who then finds "closed at
      two names" at the line the page sends them to, has been given a reason to
      trust the stale comment over the code.
    suggestion: |
      Restore the present-tense note for the tests/test_cli.py half (keeping the
      by-name citations and the CARD-261 / src/nonogram/__init__.py clarifications
