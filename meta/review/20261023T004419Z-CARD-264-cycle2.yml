        search.py:1418     (_descend)             -> SURVIVED (exit 0, 0 FAIL)
        search.py:1728     (_probe_fixed_point)   -> SURVIVED (exit 0, 0 FAIL)

      So five of the six sites named by "as it propagates and branches" can be
      deleted with the cited file green. Note which tests stay green while that is
      true: test_the_search_checks_the_deadline_at_every_branch_node and
      test_the_branch_checkpoint_alone_stops_a_search_propagation_would_not. They
      are well built -- _blind_propagation isolates the branch checkpoint -- but
      their assertions (clock.reads >= branch_nodes; "it raised") are satisfied by
      any one of the remaining three branch-side sites, so no individual site is
      held.

      AC-6's control checks two things: that exactly one guarded sentence mentions
      the deadline, and that the path it cites exists under tests/. Neither can
      fail for this. Objective 2 named this exact scenario -- "'Not yet enforced'
      corrected to 'enforced' becomes false again the day someone removes a check
      site, and nothing would notice" -- and the shipped form answers it with a
      citation rather than a control. The citation is the camouflage: the cited file
      exists, is green, and is about the right subject.
