      Enumerating every negative claim in the file gives six sites, and a
      SECOND one has the same shape — and it sits inside the very test the
      round reports F-006's line as having closed "both" defects of:

        tests/test_puzzle_solver_crosshair.py:877
          assert browser_page.locator("#puzzle-player-announce").inner_text() == ""

      The ARIA-ATTRIBUTE half of that test is genuinely closed (C2-E1 and
      C2-E2 both kill). The ANNOUNCE half is a bare empty-vs-empty with no
      in-test control that the live region can ever hold text, and it is
      driven from a board where the region is empty by design.

      Measured both directions rather than asserted:
        - C2-H1 (additive) — the paint loop writes "crossed" into
          #puzzle-player-announce on every hover: KILLED. The direction AC-8
          actually forbids ("no live announcements") IS discriminated.
        - C2-H2 (destructive) — the paint loop CLEARS
          #puzzle-player-announce on every hover: SURVIVED, exit 0. A
          crosshair that wipes the player's live region on every mouse move
          passes this cell, because the cell never gives the region anything
          to lose.

      The region is not vacuous: solver.js:835-836 writes the solved banner
      and the hint text into it, so a hover arriving while an announcement is
      live is a reachable state the test never visits. This is exactly the
      F-002 shape — a claim cell driven from the one state in which its own
