  predecessor_prescription_judged: "Cycle 4's suggestion 1 — replace the three membership checks with `sorted(set(commands)) == [\"cp\", \"diff\", \"shasum\", \"sys.executable\"]` — is sound, and it loses nothing. At HEAD the check was one conjunction (`\"cp\" in commands and \"diff\" in commands and \"shasum\" in commands`); the equality implies all three and additionally rejects any new or vanished spawn name. Verified by measurement, not by argument: D15 (the instrument's `[\"diff\", \"-q\", ...]` spawn changed to a behaviour-equivalent `[\"cmp\", \"-s\", ...]`) reds :1055 and ONLY :1055 — so the equality is a control that can fail, on exactly the event it claims to catch. `_git_among(commands) == []` survives beside it, so the git predicate was not dropped in the trade."
  reach_bounds_judged:
    argv_census_unmeasurable: "CONFIRMED by derivation (the instrument may not be pointed at any PythonProject4 path, so this was not measured with it). test_g5_the_argv_census_fails_rather_than_skips plants its failures in `_spawn_argv_heads`, a module-level helper of the test file itself. Instrumenting the file rewrites those ast.Assert nodes into recording try/except, so in the RECORDING pass they record FAIL and do not propagate — the pytest.raises would then see nothing and the test would red on DID NOT RAISE, and SHIPPED would carry FAIL cells, which `_refuse_unless_clean` refuses. The claim is sound and the README states it in the right place."
    d4_crash_vs_failure: "The claim and the behaviour MATCH, and I am not filing it. Measured: with the isinstance guard made vacuous the census raises AttributeError('Name' object has no attribute 'elts') at :128 and the mutant is KILLED (rc=1) — the control does its job. ADR-0039/R2 asks for a FAILURE and never a silent pass; a crash is a failure, and the shape that reaches the crash is an argv the census cannot analyse, which is precisely the case R2 governs. The test's name ('fails rather than skips') is about the census's behaviour, not about which exception class carries it, and it is true under the mutant. The honest caveat, which belongs in the report and not in a finding: the message that names WHICH shape was refused is lost in that state, so the mutant is killed by a crash rather than by the named assertion. I walked the remaining shapes for an actual silent pass and found none (keyword-only args hit :118, an empty argv literal raises IndexError, a starred argv fails the sys.executable assert)."
    bound_heads_sh: "The fix's verdict is defensible and I confirm it with one caveat. `heads == [\"sh\"] and named == []` is a legal shape for a declared bound: the conjunction carries a POSITIVE equality (`heads == [\"sh\"]`), so it is not absence-only and it can fail. The caveat is reachability, not shape: every mutant I ran that would move it reds :1051 or :1059 first, so under mutation it is always NOT-REACHED and it is demonstrated only in the green baseline. That is a second-line control, and it is one of the two things splitting the WITHOUT-half test would fix (see F-501's suggestion)."
    bound_pathlib: "CONFIRMED one-sided by construction, and harmless. `_aliased_spawn_imports(ast.parse(\"from pathlib import Path\")) == []` (:1218) is the 'must not flag' side; it can only red if SPAWN_IMPORT_MODULES gained `pathlib` specifically, and the general case (any member added) is covered by the pin at :1208, which D11 reds. Not a finding."
  class_enumeration_recomputed: "Recomputed by AST on the shipped file rather than inherited, and it does NOT reproduce the fix's figures. ast.Assert nodes: 189 (181 inside `test_*` functions, 8 inside module-level helpers), against the fix's 172 — a figure I cannot reconcile under any definition I tried, and which is not stated with its domain. Absence-shaped under my own predicate (== []/()/frozenset()/0/\"\" or `not X`): 27, against the fix's 30 — a definitional gap, not necessarily an error. Over the instrument's own source: 7 censuses, which matches. Per-assertion over the seven census-bearing tests: 29 assertions (ac4 8, argv-plant 2, string-plant 3, import-plant 3, env 5, g6-WITHOUT 2, g6-WITH 6), reaching the fix's 32 only if the three default-deny asserts inside `_spawn_argv_heads` are counted as well. NONE of these figures is committed to the artifact (grep for 172/189/30 in the two files finds nothing), so this is a reporting-hygiene observation and not a finding against the code — but the card's own trap 1 is a figure quoted without its domain, and 172/30/32 are quoted without theirs."
  per_assertion_measurement: "Re-derived from the rows, not from a narrative, and by a route the brief's safety constraints allow. The instrument may not be pointed at any PythonProject4 path, so instead: (1) all 7 census-bearing tests PASS in the baseline, and a passing pytest test executes every assert in its body — there is no short-circuit on success; (2) by AST, every one of those 29 assertions is an UNCONDITIONAL statement of the function body (nested count = 0 for all seven), so none can be skipped by control flow. Therefore 29 of 29 reached, 0 FAIL, 0 NOT-REACHED — the fix's '0 FAIL of N reached, every arm reached' is CONFIRMED; only its N is unreconcilable (see above). The same per-assertion discipline is what refutes the docstring's red counts in F-501: under mutation, pytest stops the test at its first failing assert, so an arm named as a red behind another red is NOT-REACHED."
