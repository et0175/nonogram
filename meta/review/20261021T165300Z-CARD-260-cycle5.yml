findings:
  - id: F-501
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_kill_matrix.py
    line: 1032
    title: "The WITHOUT-half docstring's red-count enumeration names arms that cannot FAIL — 'five arms' is three, and one named arm is NOT-REACHED"
    description: |
      `test_ac4_restoring_uses_cp_p_backups_and_no_git_command_anywhere`'s docstring
      (:1032-:1044) opens with "Measured per assertion, not asserted in prose" and then
      enumerates which arms red under which mutation. Two of its five clauses are not what
      the measurement says, and both failures are the shape this card exists to prevent — a
      test short-circuits at its first failing assert, so an arm named as a red that sits
      behind another red is NOT-REACHED, and NOT-REACHED is indistinguishable from a
      survivor, which is trap 1 and trap 2 of the card's own table.

      Measured on this working tree, every mutant line-count-preserving and restored from a
      `cp -p` backup with digests re-verified:

        D17  GIT_COMMAND -> `.*git.*` ("widening it until it matches prose")
             -> rc=1, reds at :1059 (`invoked == []`, on kill_matrix.py's own sentence)
                and :1165 (the planted-command arm).
             The clause "the prose arm beside it" names :1064
             (`not GIT_COMMAND.match("No git command anywhere")`), which NEVER EXECUTES —
             :1059 is five lines above it in the same test.

        D13  the `_SPAWN` walk in `_spawn_argv_heads` neutered
             -> rc=1, reds at :1051, :1145, :1240 — three arms, three tests.
        D18  `km._SPAWN`'s `subprocess` alternative neutered (the other reading of the
             same clause) -> rc=1, reds at :741, :766, :816, :862, :897, :1051, :1145,
             :1240 — still exactly three inside *these* tests.
             The clause "neutering the `_SPAWN` walk reds five arms across three of these
             tests" is therefore false under both readings: :1055 and :1056 sit behind
             :1051's `assert commands` and :1146 sits behind :1145's equality, so they are
             NOT-REACHED, not FAIL.

      The three other clauses ARE accurate and I confirmed each: narrowing GIT_COMMAND reds
      :1060 and :1165 (D2); breaking the `"git"` substring reds :1146 (D1); dropping a
      SPAWN_IMPORT_MODULES member reds :1195 (D8).

      Failure scenario. A maintainer widening or narrowing one of these predicates reads this
      docstring as the map of which asserts are its controls, sees five, and concludes the
      mechanism is five-ways covered. Three are. The two shadowed arms publish as
      NOT-REACHED — the exact cell this card's AC-6 and trap 1 exist to keep distinguishable
      from a survivor. The guards themselves are not weakened by this; the claim about them is.

      Why this is R1 and not prose polish: the clause is a claim about what a control catches,
      it is untrue as measured, and nothing can fail if it drifts further. ADR-0039/R1's
      closing sentence is the applicable one — "must be narrowed to what is measured or
      deleted". Cycle 4 declined to file F-402 under R1 on the ground that the clause there was
      TRUE and derivable; that distinction is what makes this one different.
    suggestion: |
      Narrow the sentence to the arms that actually FAIL, and say where the others are:
        - widening: "reds `invoked == []` here (:1059) and the planted-command arm there
          (:1165); the prose arm at :1064 sits behind :1059 and reads NOT-REACHED";
        - `_SPAWN`: "reds :1051 here, :1145 and :1240 there — three arms across three tests;
          :1055/:1056 and :1146 sit behind them and read NOT-REACHED".
      Or, if the five arms are wanted as five measured controls, split the WITHOUT-half test so
      each arm is independently reachable — which is the move the card's own per-assertion
      thesis argues for, and would also unshadow the :1086 bound.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: dismissed
    fixed_in: null
    dismissed_reason: |
      REFUTED by adversarial verification (shared/adversarial-verification.md), and re-measured
      independently by the orchestrator. Clause 2 is the decisive one: the prose arm at :1064 DOES
      have a control that can fail. Widening GIT_COMMAND to the minimal pattern that satisfies the
      docstring's own definition of "matches prose" -- r".*git(\s|$)" -- leaves :1059 PASSING and
      reds :1064 with its own message, in a plain propagating pytest run. :1064 is shadowed only
      under the broader r".*git.*" the reviewer happened to choose, where :1059 reds first. R1 asks
      whether a control CAN fail, not whether it fails under every mutant, so the R1 filing does not
      hold. Clause 1's count is also right when measured the way the docstring says it was measured:
      under the recording pass, neutering _SPAWN reds exactly five arms (:1051 :1055 :1085 :1145
      :1146); the five-arm count is the recording pass's, which is that pass's defining property per
      kill_matrix.py:22-29. One residue survives and is NOT this finding: the sub-phrase "across
      three of these tests" is two tests plus one out-of-domain red at the pytest.raises loop.
      Carried to the follow-up card as prose polish on a measured, accurate sentence.
    learned_pattern: null

  - id: F-502
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_kill_matrix.py
    line: 1013
    title: "The `(\\S*/)?git(\\s|$)` literal is restated in prose twice, and neither restatement has a control"
    description: |
      The round-5 hoist left exactly one executable spelling of the pattern (`GIT_COMMAND`,
      :74 — verified: one match for the literal in the file) and that is the fix's central
      claim, which holds. But the literal is also spelled out in prose in two places:
      :1013 ("``GIT_COMMAND``, the one spelling of ``(\\S*/)?git(\\s|$)`` in this file") and
      tests/README.md's G-5 paragraph. D17 and D2 both changed GIT_COMMAND and neither
      restatement reds — nothing checks them. This is the weakest member of the same family:
      it cannot disable a guard, it can only go stale, and the staleness lands on the one
      sentence a reader uses to find the single spelling.
    suggestion: |
      Either drop the literal from the two prose sites and name only `GIT_COMMAND`, or add one
      assert (`GIT_COMMAND.pattern == r"(\\S*/)?git(\\s|$)"`) so a change to the constant reds
      the documentation that quotes it.
