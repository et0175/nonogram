findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_pdf.py
    line: 4300
    title: "The 24-case corpus floor is self-referential: the corpus can shrink to 3 cases with all 24 tests green"
    description: |
      `_MIN_EDGE_CASES = 24` (:3988) is BOTH the corpus generator's
      bound and the floor asserted against it. The fixture at :4269 builds
      `[_edge_case(index, ...) for index in range(_MIN_EDGE_CASES)]` (:4280),
      and the guard is then `assert len(edge_corpus) >= _MIN_EDGE_CASES`
      (:4300) with `assert len(edge_corpus) * len(_GRID_EDGES) >=
      _MIN_EDGE_READINGS` (:4301), where `_MIN_EDGE_READINGS = 4 *
      _MIN_EDGE_CASES` (:3989). Both comparisons are
      satisfied by construction for ANY value of that constant.

      MEASURED, not argued. Two mutants, same anchor, both in a clean tree
      with SHA-256 asserted back afterwards:
        * `_MIN_EDGE_CASES = 24` -> `6`:  24 passed, 88 deselected (2.17 s).
          SURVIVED.
        * `_MIN_EDGE_CASES = 24` -> `3`:  24 passed, 88 deselected (1.37 s).
          SURVIVED. 87.5 % of the corpus gone, 96 edge readings down to 12,
          every uniformity set-equality still green.
        * `_MIN_EDGE_CASES = 24` -> `1`:  KILLED — but only by the SPAN
          assertion (trims/parities/bounds), not by the floor. So the floor
          this card actually enforces is 3, not 24.

      This contradicts the card's own words twice: "minimum asserted inside the
      test (`_MIN_EDGE_CASES = 24`, `_MIN_EDGE_READINGS = 96`), so it cannot
      silently shrink" (Worktree notes) and the test's own docstring "The
      minimum, asserted here so the corpus cannot silently shrink." It is also
      the exact mechanism CLAUDE.md's test-style section exists to require
      ("asserting a minimum case count inside the test itself so the corpus
      can't silently shrink") and the thing G-5 forbids the NEXT card from
      doing — with no control to notice if it does.
    suggestion: |
      Decouple the floor from the generator. Either assert literals in the
      corpus test (`assert len(edge_corpus) >= 24` and
      `>= 96` readings, with a comment that the literals are the floor and the
      constant is the generator), or build the corpus from an explicit case
      table and keep `_MIN_EDGE_CASES` as the floor only. Then plant the
      control the claim needs: a mutant that lowers the floor must red.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: 90d300ae
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_book_pdf.py
    line: 4620
    title: "The medium pin's site map is keyed on a bare function name, so one of two same-named placed-edge sites is silently dropped — and that one can read the content stream undetected"
    description: |
      The pin's walk (the static method at :4620, inside the class at :4592) returns `dict[str, set[str]]` keyed on `node.name`. This
      module holds TWO distinct tests with the identical name
      `test_the_drawing_sits_25_45_mm_from_the_left_trim_edge`, at :620
      (interior page 7, right-hand) and :661 (interior page 6, left-hand), in
      two different classes. Measured with ast: 15 functions in this module
      name `EDGE_TOLERANCE_MM`, but the dict has only 14 keys. The reader set
      of whichever of the pair is walked FIRST is overwritten and never
      checked.

      Exploitable, with a matched control. Two mutants, one anchor each:
        * N8 — the FIRST of the pair (:620) has its
          `_mm(drawing_of(page).left)` replaced by
          `_mm(pdf_vector.content_streams(page))`, i.e. it stops reading the
          raster ink oracle AND starts reading a content stream — the precise
          condition both pin assertions exist to catch. Result: the pin class
          is **4 passed**. SURVIVED.
        * N9 — the identical change to the SECOND of the pair (:661).
          Result: **2 failed, 2 passed**. KILLED.
      So the guard's verdict depends on ast walk order, not on the code.

      That directly refutes the class docstring's "Default-DENY per
      ADR-0039/R2: a site whose medium cannot be determined is a FAILURE, not
      a pass" and the other test's "a site that quietly started reading the
      stream would be asserting a 0.169 mm different number against the same
      bound" — at :620 it would not. It also weakens the one mechanical
      artefact the owner's steer is implemented as: the pin is what is
      supposed to red on CARD-322's arrival.
    suggestion: |
      Key the map on something unique — the class-qualified name, or
      `(node.name, node.lineno)` — and keep `_BOUND_ONLY_SITES` matching on
      the function part. Then make the collision itself a failure rather than
      a silent merge: have the walk's own control assert the key count EQUALS
      the number of `EDGE_TOLERANCE_MM`-naming functions (15 today), so a
      future duplicate reds instead of disappearing. Re-run N8 as the
      regression.
    confidence: high
    source: static
    violates: ADR-0039/R2
    root_cause: RC-1
    status: fixed
    fixed_in: 90d300ae
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: risk
    file: tests/test_book_pdf.py
    line: 3984
    title: "AC-1's headline control is held at 1.5 px when 1.05 px passes — and 1.5 px (0.127 mm) is wider than the 0.1 mm bound the card refused to widen"
    description: |
      `_SPEC_ROUNDING_PX = 1.5` (:3984) is the entire bound on the card's answer to
      its first question ("the specified position IS where the content stream
      puts the grid") and on the raster's `Drawing.left`/`top` arm. The card
      documents the measured worst disagreement as 1.0 px and derives 1.5 px
      from three ≤0.5 px roundings.

      Measured: tightening it to `1.05` leaves all 24 tests green (SURVIVED),
      so 0.45 px — 0.038 mm — of the asserted slack is unused by any case in
      the corpus. Loosening it to `12.0` (1 mm) ALSO leaves all 24 green
      (SURVIVED), confirming that nothing else in the suite holds this
      relation: this constant is the sole control on the card's central
      measurement.

      The asymmetry is worth naming rather than dismissing: 1.5 px is
      0.127 mm, which is LARGER than the `EDGE_TOLERANCE_MM = 0.1` the card
      correctly declined to widen. The conclusion is not weakened — the
      measured figure (1.0 px = 0.0847 mm) is itself inside 0.1 mm, and the
      card says in terms that this is a bound on the derivation and
      deliberately not the placed-edge bound. But a reader who re-derives from
      this test learns a looser fact than the card actually measured.
    suggestion: |
      Assert the measured ceiling and keep the derived one as the documented
      headroom: e.g. keep `_SPEC_ROUNDING_PX = 1.5` for the comment's
      derivation and add `assert worst[0] <= 1.0` (or a named
      `_SPEC_MEASURED_PX = 1.05`) as the live bound, so a future half-pixel
      regression in the derivation reds instead of being absorbed.
    confidence: high
    source: static
    violates: null
    root_cause: null
