premise_verdict: >-
  SURVIVES. The card concluded its own premise false and therefore needed no
  src change, which is the shape a rationalisation takes — and it is not one
  here. The decisive evidence is a number CARD-309 never read and the card
  did: the raster renderer's OWN Layout position. It equals the vector stream's
  operand exactly, on every edge, so the two media do not disagree about where
  the grid goes by 2 px or by anything else; and the raster's ink begins
  exactly (6-1)//2 = 2 px before it, which the thin rule's own 1 px offset and
  my heavy-rule mutant both confirm is a function of the rule's WEIGHT and not
  of the grid's position. Nothing is left over for a placement error to hide
  in. The one sub-pixel asymmetry I found and chased — a 6 px rule centred on
  965 inks 963..968, whose centre is 965.5 — is the inherent even-width
  centring offset, is exactly what `-(w-1)//2` encodes, and is not a defect.
