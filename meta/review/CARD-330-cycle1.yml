verdict: >-
  THE PREMISE-FALSE CONCLUSION SURVIVES, and it survives because I re-derived
  it from scratch rather than reading the card's tests. On CARD-295's own Twin
  fixture, by my own probe: the raster page's ink reports grid_left/right
  963/1849; the written content stream's 1.3 pt operands are 965/1851; and the
  RASTER page's own `Layout` places those two vertical borders at 965 and 1851
  — the same two numbers as the stream, to the pixel, with vertical rule
  widths of exactly (thin 3, heavy 6). 965 - (6-1)//2 = 963. There is no
  residual anywhere in that chain, so there is no room for a placement error
  hiding inside the framing: the two media agree on the COORDINATE exactly,
  and CARD-309's 2 px is `drawing_of`'s leading-ink-edge reading of a 6 px
  rule centred on that coordinate, differenced against the coordinate itself.
  CARD-309's "the two media place the same grid 2 device pixels apart" is
  false as stated. The card took the right branch, for the right reason, and
  G-4 is correctly not triggered.

  BOTH RETRACTIONS OF THE BRIEF ARE CORRECT, and I checked them against source
  and not against the card. (1) `RASTER_RULE_FLOOR_PX = 2` at
  src/nonogram/export/layout.py:425 is a floor on a rule's THICKNESS — the
  raise at :605 is `if pixels < RASTER_RULE_FLOOR_PX`. The 6 px border is
  `_rule_widths` (:3163-:3166) returning `thin, thin * 2` with thin held up to
  `_mm_to_px_at_least(0.25)` = ceil(2.9527) = 3. Two unrelated constants that
  land on the same two pixels; the brief's "it IS the device floor" is wrong.
  (2) Read ink against ink on the same fixture, by one oracle at one
  resolution, my own numbers are: the four grid edges differ by exactly 1 px
  (0.0847 mm, INSIDE the 0.1 mm bound) and `Drawing.left`/`Drawing.top` by
  exactly 3 px (0.254 mm, OUTSIDE it). The brief's "every placed-edge
  expectation changes value" is wrong, and the card's substitute figure is
  right. The mechanism is also right: `drawing_of` takes `left`/`top` from
  `_longest_run_start`, which on Pillow's butt-capped frame lines lands ON the
  path and on poppler's mitred single `re` lands half a rule outside it.

  THE ADR's DEVICE-FLOOR MEASUREMENT REPRODUCES EXACTLY. My own poppler renders
  of a real vector puzzle page ink the 0.3 pt cell line at 1 / 2 / 2 / 5 device
  pixels at 150 / 300 / 600 / 1200 DPI, and the run greys are 89 at every one
  of the four resolutions — including the single pixel at 150 DPI, so "grey 89,
  never diluted by coverage" holds of the cell line as written. R2's 2 px floor
  is cleared at 300 exactly and missed at 150, as recorded.

  THE CARD'S 8 MUTANTS REPRODUCE: 8 planted, 8 KILLED, 0 survivors, tree clean
  after. So does the node-id claim (my AST set difference says 0 removed / 24
  added, and the collected count moves 88 -> 112 with 3 `parametrize`
  decorators accounting for the 4-id gap), the 112-passed module run, the
  unchanged bound, the empty exemption register, the biconditional predicate,
  and the skip attribution.

  WHAT HOLDS THE SCORE BELOW min_score IS NOT THE CONCLUSION. It is two
  controls that the card's own prose asserts are closed and which I measured
  OPEN, each with a survived mutant and a matched killed control:
  * the 24-case corpus floor is SELF-REFERENTIAL — the corpus is built as
    `range(_MIN_EDGE_CASES)` and then asserted `>= _MIN_EDGE_CASES`. I lowered
    that constant to 6 and then to 3 and all 24 of the card's tests stayed
    green (87.5 % of the corpus silently gone). The card says "so it cannot
    silently shrink". It can. F-001.
  * the medium PIN's site map is keyed on a BARE function name, and this module
    holds two different tests with the same name. I converted the first of that
    pair into a content-stream reader and all four pin tests stayed green; the
    same change to the second of the pair reds two of them. So the guard that
    the card calls "default-DENY per ADR-0039/R2: a site whose medium cannot be
    determined is a FAILURE" silently drops a site instead of failing. F-002.
  Both are one-line fixes in the card's own file. Neither touches src, neither
  changes a measured figure, and neither is a reason to doubt the finding — but
  a card whose entire deliverable is evidence does not get to overstate two of
  its own controls.

