    line: 5050
    title: "_draw_two_up_qr_groups raises instead of degrading once a puzzle number exceeds four digits"
    description: |
      The pairing gate uses _qr_group_line_px(dpi), the widest line the face can
      set for a number of at most FOLIO_RESERVE_DIGITS (4) digits — measured at
      594 px (PROBE-3). The drawer uses the real measure for THIS page's numbers.
      For numbers up to 9999 the drawer's measure is never wider, which is the
      argument the docstring makes ("Unreachable from puzzle_pages"). At 10000 and
      above the real line is wider than the ceiling, qr_group_insets can answer
      None in the drawer, and the method raises ValueError — i.e. the export
      crashes rather than degrading.
      This is the same bound _folio_reserve_px already carries, so it is a
      pre-existing project-wide assumption rather than something this card
