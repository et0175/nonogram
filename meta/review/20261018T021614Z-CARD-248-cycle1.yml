ac_vs_body_check:
  verdict: "one AC was already satisfied in behaviour at 5c5d0aa^; no AC contradicts another"
  detail: |
    Checked each AC against the parent commit.
      * AC-1 was FALSE (the baseline book printed 3 links for 4 puzzles — the
        retired assertion said so in words, and the fixture chain confirms page 5
        changed).
      * AC-2, AC-3 were vacuous (there were no two groups).
      * AC-5, AC-6 were FALSE/absent (there was no reserve, so no cost and no
        refused band).
      * AC-7 was FALSE (a two-up page carried CARD-200's corner folio; the
        retired TestBookPageFrame_TwoUpKeepsItsOuterFolio asserted `footer_rule
        == []`).
      * AC-8 was FALSE (a two-up page had no footer at all).
      * AC-4 is the exception: "no QR pixel and no caption pixel lands on the
        gutter side" was ALREADY TRUE at 5c5d0aa^, and asserted more strongly —
        CARD-223's retired test_every_two_up_slot_keeps_its_icon_out_of_the_gutter_half
        held the two-up page to the gutter HALF of the sheet, where AC-4's
        survivor holds it only to the gutter margin plus one icon width. So the
        AC guards new ink (two groups where there was one midline icon) but its
        proof is strictly weaker than the claim it replaces. That weakening is
        unavoidable (the row of two groups is 1684 px of ink against 1125 px of
        outer half), is declared in three places, is asserted rather than
        asserted-around, and leaves a pinned 240 px residue — which is exactly
        ADR-0039/R3's required shape. Recorded, not faulted.
    No AC contradicts another. The card BODY does contradict AC-6 — its
    spare-height table predicts the tall 15-row pairs lose ~2% of their cell when
    in fact they stop pairing — but the orchestrator already corrected that in the
    hand-back notes and the tests correct it rather than inheriting it
    (test_the_worst_surviving_cost_is_the_thirteen_row_band_at_4_95_percent names
    the card's figure as wrong). AC-5's "recorded against the figures above" is
    therefore satisfied in spirit by refuting them.

house_conventions:
  hypothesis: "clean — no hypothesis anywhere in the diff; the two new corpora (AC-5's 45+ pairs, AC-6's 4 * 441 sweep) are deterministic nested loops with their case counts asserted (>= 45, >= 3, == 1764), and the seeded random.Random corpus in test_book_pairing.py grew rather than shrank."
  asserted_minimums: "present on every new corpus. No minimum lowered anywhere in the diff (verified by grepping the diff for changed `>=` bounds). F-7 notes two minima that were left behind rather than lowered."
  independent_second_implementation: >-
    Honoured where it counts: _expected_pair_cell_mm (AC-5) writes FR-040's fit
    out from Book 1's millimetres including CARD-204's re-fit rule rather than
    calling compute_pair_layout; FOOTER_STRIP_PX is stated from CON-020's three
    rows and then compared against INTERIOR_FOOTER_MM; the 28/29 boundary is
    derived by hand; test_book_pairing.py and test_book_arrange_page_breaks.py
    each reimplement the footer reserve and the two-group gate in their own
    arithmetic, importing only the font measurement (_qr_group_line_px), which is
    the same split _folio_reserve_px already uses and is justified in place. No
    test checks a function against itself. The one place a production helper is
    reused in a test expectation (_drawn_group_lines mirrors the renderer's
    `max(getlength(...))`) is a font measurement, not the geometry under test.
  lateral_imports: "clean — SEL-5 green; the new admin -> export.layout imports (PageParity, qr_group_insets) are inward, which the guard allows, and layout.py imports nothing new."
  dependency_baseline: "clean — no new runtime dependency; the diff adds only stdlib math/ast usage in tests."
  baseline_fixtures: "clean — see G-6. No earlier fixture regenerated or deleted; the new one explains every page it lists and states its own control."

strengths:
  - "The card's own arithmetic was re-derived and REFUTED rather than inherited: the ~2% tall-pair cost is shown to be a refusal, and the test class says so in its docstring. That is the behaviour the card asked for ('measure it and state what you get') and it is rare."
  - "Every catch-claim has a control that demonstrably fails: AC-4's draws the retired placement through the production drawer; AC-6's pins 28-in/29-out from hand arithmetic; AC-7's reads _draw_page_frame's own boolean both ways; the no-reserve control shows the strip is what buys the footer."
  - "The AC-4 narrowing is handled exactly as ADR-0039/R3 wants: the old claim is shown arithmetically impossible, the new region is stated, the residue is pinned at 240 px, and two tempting-but-false stronger claims (the gutter quarter; both icons in the outer half) are explicitly declined because they break at four digits."
  - "The vertical refusal set is a real exact set. I reproduced it over 55,566 cases at 21 widths and 3 clue depths against the implementation's own 1764-case sweep and it matched exactly, including the odd members that an equal-pair sweep would have missed."
  - "G-2 is met structurally, not by assertion: two parameters on two axes, and the vertical one's effect is proved by its own absence."
  - "The fit/placement identity on reserved_bottom_mm is the subtle correctness point of the whole card and the commit message explains the 13x13 / y=1485.5 near-miss that forced it. Mutating it back is killed."

risks_to_downstream:
  - "CARD-226 inherits a two-up page whose lower drawing bottom sits exactly ON footer_rule.y, i.e. at the `<=` boundary of interior_frame's footer condition. Its divider rule and aligned bottoms must not consume any of the 353 px strip."
  - "6 x 9 in — a common nonogram-book trim — loses two-up pages entirely under this card (both axes refuse). Declared in the card's notes, not in the option set the owner chose from. It is a scope consequence the owner should be told about rather than discovering in a book."
  - "Book 1's own cost is real: 30 of the 90 depth-1 equal pairs stop pairing, and the worst surviving pair loses 4.95% of its cell. That is a longer interior and a higher per-copy print cost."

score_rationale: >-
  8.5. Nothing critical and nothing that makes a wrong page: the card's hard
  parts (the fit/placement identity, the two-axis refusal, the measured-ink proof
  with a working control, the exact set, the baseline provenance) are all done
  properly, every guardrail holds with evidence, every retirement names a
  survivor, and the implementation corrects its own card's arithmetic instead of
  inheriting it. Ten of twelve targeted mutants die. Held back from 9+ by two
  important findings: one axis of AC-6's "exact set" is a two-point sample whose
  boundary mutants both survive and which would silently unpair a 7 x 10 in book
  (F-1, one test away from fixed), and FR-040's registry ACs now certify figures
  and verdicts their own tests no longer assert (F-2, declared and routed, but
  still open). Above the 8 threshold.
