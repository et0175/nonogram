      below 10000.
    failure_scenario: "A 10,000-puzzle compendium (or a book numbered from a global sequence past 9999) reaches _two_up_page for a pair numbered 10000/10001; qr_group_insets returns None and export_interior raises `this page's footer cannot carry 2 QR groups N px wide` instead of producing a book."
    remediation: "Either state the 9999 bound in the docstring as a precondition (one sentence, matching _folio_reserve_px's own), or raise at plan time in puzzle_pages where the number is known and the pair can still be split."
    confidence: high
