findings:
  - id: F-1
    severity: important
    category: test-quality
    type: gap
    file: src/nonogram/export/layout.py
    line: 1410
    title: "AC-6's horizontal refusal has no boundary case, and its line's off-by-one mutants both survive"
    description: |
      `if count * pitch - gap > page.usable_right - page.usable_left: return None`
      is one half of the pairing verdict (the other half, the vertical strip, is
      pinned to the pixel by test_the_boundary_is_where_the_hand_arithmetic_puts_it).
      Every test that reaches it does so far from the boundary: Book 1 needs 1774 px
      against 2250 (fits), the 12 x 48 cm book needs 1774 against 1229 (refuses),
      three groups need 2680 against 2250 (refuses). The window where the verdict
      actually turns — usable widths 1700..1850 px — is never visited, so:

        * M1, dropping the `- gap` term, SURVIVES the whole suite;
        * M2, `>` for `>=`, SURVIVES vacuously.

      The card's own worktree notes state the derived threshold ("about 176.2 mm /
      6.94 in of width before a two-up page is possible at all") and no test pins
      it. The exemption AC-6 is required to state exactly is therefore exact on
      one axis of a two-axis verdict.
    failure_scenario: |
      A 7 x 10 in trim (the first trim in the card's own table that KEEPS two-up
      pages) has 151.8 mm = 1793 px of usable width. Under M1 the predicate becomes
      2 * 906 = 1812 > 1793, so qr_group_insets answers None, puzzle_pages sets
      pair = None, and every pair in every 7 x 10 in book silently prints as two
      single pages — a longer interior and a higher per-copy print cost on a real
      KDP trim — with the whole suite green. The same input under the shipped code
      pairs correctly. Nothing in the suite distinguishes the two.
    remediation: >-
      Add one boundary pair to TestTwoUpFooter_APairThatCannotFitSplitsIntoSinglePages:
      a spec whose usable width is exactly `2 * pitch - gap` (asserted to fit) and the
      same spec one pixel narrower (asserted to refuse), with the pitch stated from
      the test module's own QR_SLOT_PX / FOOTER_GAP_PX / _qr_group_line_px as the
      vertical boundary test already states its figures by hand. That single pair
      kills both M1 and M2 and turns the 6.94 in threshold into a pinned figure.
    confidence: high
    source: "mutation analysis (M1, M2) + enumeration of every qr_group_insets call site in the suite + PROBE-3's measured pitch"

