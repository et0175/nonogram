  - id: F-4
    severity: minor
    category: correctness
    type: fragility
    file: src/nonogram/export/layout.py
    line: 3195
    title: "AC-8's \"the drawing stops on the rule the frame strokes, by construction\" is true for the production margin, not by construction"
    description: |
      The reserve round-trips px -> mm (as a float) -> exact Fraction -> rounded px,
      so the slack the fit leaves is 353 + O(1e-14) and the two boundaries are
      rounded independently. I swept bottom margins (PROBE-1): at bottom_mm =
      9.525 the lower slot's drawing_bottom comes out 2834 against a footer_rule.y
      of 2835 — one pixel apart, so the AC-8 identity is false there. It holds at
      every value I tried in the 10..15 mm band and on every trim height
      8..12 in at the production margin (PROBE-2).

      Not reachable today: BOOK1_PROFILE fixes bottom_in = Decimal("0.47") for every
      book, so the margin is a single constant. Recorded because the identity is
      asserted in a docstring and a test as structural when it is in fact
      margin-dependent, and because the failure direction on the other side is
      worse: a rounding that produced 352 would make qr_slot answer None, which
      the pairing gate reads as "do not pair", so every pair in the book would
      silently split rather than loudly fail.
    failure_scenario: |
      A later card makes the bottom margin a per-profile figure (a trim-dependent
      bottom margin is ordinary KDP practice). At a value like 0.375 in the slack
      rounds one pixel short of the strip; qr_group_insets answers None for every
      pair; every two-up page in every book on that profile becomes two single
      pages, with no error and with the whole suite green (the suite only exercises
      0.47 in).
    remediation: "Reserve in exact Fractions end to end (skip the float() in footer_reserve_mm), or assert `slack >= footer_depth` as a post-condition inside compute_pair_layout so a rounding shortfall raises instead of silently unpairing."
    confidence: high
    source: "PROBE-1 (measured, read-only) + src/nonogram/admin/book_page_spec.py:237-238"

