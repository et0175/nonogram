findings:
  - id: N-001
    severity: low
    classification: Minor
    gating: false
    category: testing
    type: gap
    file: tests/test_book_interior_face.py
    line: 542
    title: "The gate class's non-vacuity test states its rationale backwards, and the one branch it was meant to protect — the gate returning False from the comparison rather than from the OSError — is still untested"
    description: |
      `test_the_two_faces_it_compares_really_do_draw_differently` (:542)
      says it exists because "if Pillow's built-in face and the packaged
      one rendered this sample identically, the test above would pass for
      the wrong reason". It would not: `test_it_says_yes_when_the_host_offers_a_face_that_really_differs`
      (:519) asserts `host_offers_a_second_face() is True`, so two
      indistinguishable faces make it FAIL, not pass. The non-vacuity test
      is a useful diagnostic — it localises which half is at fault — but it
      is not protecting against the failure mode its docstring names.

      The real gap is next door. `test_it_says_no_when_the_host_offers_no_face_at_all`
      (:511) refuses every host path, so the gate returns False from its
      `except OSError` branch and never reaches the pixel comparison at
      all. So the pair covers "no face at all → no" and "two different
      faces → yes", and nothing covers the gate's third real case: a host
      face that loads but is indistinguishable from Pillow's own → no, via
      the comparison. That is the branch the whole function exists for, and
      it is the one a future edit could break while both current tests stay
      green.

      Neither point weakens what the class achieves — I confirmed with two
      mutants that it kills both directions of the N5a family, including a
      mutant that blanks the gate's own probe string so it closes wrongly
      on every host. This is a completeness and an accuracy-of-rationale
      point, not a hole in the kill.
    suggestion: |
      Two small edits:
      1. Re-word :542's docstring to what it actually does ("if these two
         rendered alike, the test above would fail and this one says
         why"), or fold it into the yes-test as a precondition.
      2. Add the third case, which is three lines and needs no host: patch
         `ImageFont.truetype` to return `ImageFont.load_default(size)` for
         any path — the same face the fallback resolves — and assert the
         gate returns False. That exercises the comparison's False branch,
         which is currently reached by no test.
    confidence: high
    source: dynamic
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

