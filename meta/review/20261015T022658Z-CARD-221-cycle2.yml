confirmations:
  - id: X-001
    finding: "N1 — the folio reservation in `_toc_entries_per_page`, and whether the new sweep exercises capacity or only asserts arithmetic about it"
    verdict: "CLOSED, and the sweep genuinely exercises capacity. Every figure in the write-up reproduces exactly. The rendered witness is the right one."
    evidence: |
      This was the one I was asked to look at hardest, because a test
      written to kill a specific mutant is where an over-narrow assertion
      hides. It is not narrow.

      Does it exercise capacity? Yes, and this is the hinge. The sweep
      (tests/test_book_toc.py:1648) calls the REAL
      `_toc_entries_per_page(frame, DPI)` for each height and then places
      that many rows using metrics it measures itself (`_metrics()` at
      :1611 reads the three faces off package data through importlib, the
      same second-implementation discipline the group-gap sweep above it
      uses). So the capacity is the function's own output and the geometry
      is independent: delete the reservation and the capacity rises, the
      last row moves down by one `line`, and the room under it falls below
      the folio's. That is a behavioural consequence, not a restatement.

      I re-derived the write-up's numbers from scratch rather than reading
      them, over all 381 KDP-admitted heights:

          heights measured          381
          WITH the reservation      0 short; worst 66 px at 10.10 cm
          WITHOUT it                185 short; first failing 10.30 cm at 24 px

      which is exactly "0 of 381 with, 185 without, from 10.30 cm (24 px
      against 49)". The folio's own line measures 49 px, title_space 258,
      row 49, line 66 — all reproduced.

      Is 10.30 cm the right rendered witness? Yes, and it is the best
      available one: it is the FIRST height that loses the folio once the
      reservation goes, i.e. the tightest case the reservation actually
      saves. A witness further up the range would have more slack to spare
      and would prove less.

      Mutants, mine, all killed (details in mutation_check):
        M-A  the reservation deleted (N1 itself)      → BOTH new tests red
        M-B  the reservation halved (the edge)        → the sweep red, the
             rendered witness GREEN — the correct separation: at 10.30 cm a
             half reservation still leaves room, and only the sweep finds
             the heights where it does not
        M-C  capacity off by one the other way        → BOTH red
      None of the three is caught by anything outside the new class, which
      is the same gap N1 exposed, now closed from the inside.

      One observation, not a finding. The sweep's final assertion
      `worst[0] >= metrics["folio_line"]` is implied by `tight == []` and
      adds nothing, and unlike the group-gap sweep this one does not pin
      its worst case as a FIGURE. I checked whether that is the
      inequality-vs-figure weakness the file argues against three hundred
      lines above, and it is not: capacity is an integer division, so the
      room under a packed page is confined to [folio_line, folio_line +
      line) by construction, and the 66 px worst case is a fact about which
      height minimises a modulus rather than about how much margin the
      reservation buys. Pinning it would pin an incidental. The agent chose
      correctly here even though it reads as an inconsistency.
  - id: X-002
    finding: "N5a — the host gate's own logic, and the scepticism owed to its non-vacuity check"
    verdict: "CLOSED. The class kills both directions of the mutant family, including one the agent did not run. The non-vacuity test's rationale is stated backwards and one branch is still uncovered — N-001, Minor."
    evidence: |
      `TestInteriorFace_TheOneHostGateDiscriminates` (:493) pins the gate
      host-independently in both directions: refuse every host path and it
      must say no (:511), hand it a loadable face that genuinely differs
      from Pillow's own and it must say yes (:519). The second is the
      clever half — it points the host lookup at the PACKAGED face, so the
      test holds on a machine with no Arial, which is what makes the gate's
      logic testable at all on the deployment image.

      Killed, by me:
        M-E  `host_offers_a_second_face` → `return False` (N5a itself)
             → test_it_says_yes... red
        M-F  the gate's own probe string blanked to " ", so both faces draw
             nothing and the gate closes wrongly on EVERY host
             → test_it_says_yes... red
      M-F is the one that matters and the agent did not run it: it shows
      the class pins the gate's discrimination through the gate's own code
      path, not merely through a separate side-by-side comparison. A gate
      whose probe stops discriminating is caught.

      Where I remain sceptical, as asked, and it is the non-vacuity check
      (:542). Its docstring says that without it the yes-test "would pass
      for the wrong reason" if the two faces rendered alike. It would fail,
      not pass — so the stated rationale is backwards. And the pair leaves
      the gate's third real case untested: a host face that LOADS but is
      indistinguishable from the fallback, where the gate must return False
      from the pixel comparison rather than from the `except OSError`
      branch that :511 exercises. That branch is the reason the function
      samples pixels at all. Three lines would cover it. Recorded as
      N-001; it does not weaken either kill.
  - id: X-003
    finding: "F-001 — the four narrated records, and in particular the page-2 re-measurement produced by rebuilding a deleted instrument"
    verdict: "CLOSED on all four. The re-measurement is correct to the pixel: I rebuilt the deleted instrument independently and got the same four numbers."
    evidence: |
      This is the one figure in the set with no independent witness, so I
      made one. I wrote my own vectorised implementation of
      `_one_pixel_displacement_outliers` from the cycle-1 DIFF — the
      3x3 neighbourhood, the max of the two directional minima, the
      64-grey tolerance, the edge clipping — rather than from anything on
      the branch, and ran it over both guide pages of a fresh export
      against the two stored CARD-200 JPEG fixtures:

          page 1  differing 639,187 of 8,415,000 = 7.596%  moved 287,496  outliers 254,766
          page 2  differing 886,216 of 8,415,000 = 10.531%  moved 495,242  outliers 478,630

      The branch now says "page 1 … 7.596% … and page 2 in 10.531%, with
      254,766 and 478,630 differing pixels that no 1 px displacement at its
      own 64-grey tolerance explains" (tests/test_book_pdf_memory.py:1516
      and :1994). Exact match on all four. Page 1 being unchanged at
      7.596% / 254,766 is a real control, not a coincidence: it is the
      number the ORIGINAL instrument produced before deletion, so
      reproducing it is evidence the rebuild is faithful, and my
      independent rebuild agreeing with both is a third witness. The
      argument the figures support is untouched — 10.531% is still ten
      times the 1% ceiling and 96.6% of the moved pixels are still
      outliers.

      The other three:
      1. tests/test_book_toc.py:1184-1244. The two stale paragraphs are
         gone. "which is why the constant is 8.5 pt" is now "…which is why
         the owner moved the constant to 8.5 pt then, and to 8.0 pt when
         CARD-221's packaged face cost it another 12 px"; the bolded
         "this test says so by failing" paragraph is replaced by "**At the
         shipped 8.0 pt the worst case is 55 px, 6 px clear of the folio's
         line, and no height fails**", which is what the body asserts. The
         three remaining "8.5 pt" mentions at :1349 and :1412 are
         past-tense ("the 8.5 pt it then carried") and correct.
      2. tests/fixtures/book_baseline_card221.json. `why_a_new_baseline`'s
         third paragraph is rewritten from "TWO MEASURED CONSEQUENCES THE
         CARD COULD NOT CLOSE … the two strict xfail markers" to "THREE
         MEASURED CONSEQUENCES OF THE EXTRA WIDTH, ALL RULED ON BY THE
         OWNER", and now says interior_bytes ROSE, that page 3 is the 8.0
         pt list, and that no strict xfail survives — each of which I
         verified. It no longer contradicts `interior_bytes_note` or
         `changed_pages_note`. Only that one field changed: the diff is
         +1/-1 and every digest is untouched, which the green
         test_book_pdf_memory run confirms.
      3. tests/helpers/book_corpus.py:443 now reads 3464123, which is the
         fixture's value, the card's value and the exported length.

      And the claim that stood behind all four: `grep -rn "mark.xfail"
      tests/` returns one hit, in tests/bench_generate.py:143, unrelated
      and pre-existing. No xfail anywhere in tests/test_book_*.py.
  - id: X-004
    finding: "F-002 — the min-trim guide folio, escalated"
    verdict: "CLOSED as an escalation. All four numbers verified by my own spy; the two-measures distinction is exactly right. One two-pixel ambiguity, N-003."
    evidence: |
      It is now item 3 of "What this card could NOT close — three, all now
      ruled on by the owner", and the other two were rewritten as closed
      rather than left describing a branch that no longer exists — which
      was the second half of my complaint.

      I verified every figure with a spy on `_draw_folio`'s `content_bottom`
      plus an ink-extent measurement, same book, only `_guide_face` swapped:

          packaged  page 2: content_bottom 1051, frame.bottom 1069 → 18 px of room
          Arial     page 2: content_bottom  976, frame.bottom 1069 → 93 px of room
          folio needs 49 px                                → 93-18 = 75 px is the face's cost
          packaged  page 1: content_bottom 1281 → 212 px past the frame
          Arial     page 1: content_bottom 1279 → 210 px past
          ink bottom 1180 on BOTH faces        → 111 px of ink past the frame

      So the write-up's 18 / 93 / 49 / 75 / 111 are all exact, the folio
      table ([2,3,4,6] on Arial → [3,4,6] packaged) is the one I measured
      at cycle 1, and the distinction the card draws in its parenthesis —
      that 18/93/212 are the ladder's own `bottom`, which is what
      `_draw_folio` is handed and what decides the folio, while 111 px is
      where ink lands — is precisely correct and is the right thing to
      have separated. The only slip is "212 px … on either face", which is
      212 packaged and 210 Arial; the 111 px really is identical on both.
      N-003, one clause.

      The claim that the 8.0 pt ruling could not have recovered it is also
      right, and for the reason given: at 10 cm the ladder had already
      fallen to its bare form, which never printed the difficulty
      sentences, so Block 1's 234 px buys nothing there. My own
      measurement at HEAD, after both rulings, is still 18 px.

      The mitigation is recorded in the owner's own terms and the
      10.00 → 10.10 cm minimum-trim option they declined is written up
      beside it as an architect-station question. That is the escalation I
      asked for.
