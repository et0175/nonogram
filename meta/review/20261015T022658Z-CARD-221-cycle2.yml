verdict:
  summary: >-
    All three gating findings are closed, and closed in the strong form.
    The two the cycle was really about — the fixes written in response to
    surviving mutants, which is where an over-narrow assertion hides — are
    both wider than they had to be. The new capacity class calls the real
    `_toc_entries_per_page` and places its rows with metrics it measures
    itself, so it tests behaviour rather than restating arithmetic; I
    re-derived every figure in its write-up from scratch and got 381
    heights, 0 short with the reservation and 185 without, first failing at
    10.30 cm with 24 px against the folio's 49 — which also makes 10.30 cm
    the tightest available rendered witness rather than a convenient one.
    Three mutants aimed at it all die, and the one that halves the
    reservation dies on the sweep while leaving the rendered page green,
    which is the right separation rather than a gap. The gate class pins
    its logic in both directions host-independently, and a mutant the agent
    did not run — blanking the gate's own probe string so it closes wrongly
    everywhere — dies too.
    F-001's hardest number stands up: I rebuilt the deleted 3x3 instrument
    from the cycle-1 diff and got 7.596% / 254,766 and 10.531% / 478,630,
    matching the branch exactly, with page 1's unchanged pair acting as a
    real control on the rebuild. The other three records are rewritten and
    no longer contradict each other or the code. F-002 is escalated with
    all four of its numbers verified against my own spy, and its
    distinction between the ladder's `bottom` and where ink lands is
    exactly right. F-003 was fixed rather than deferred, and a regression
    mutant proves both halves are live. Of the five minors, three were
    taken and the two that were argued are argued correctly — I checked
    F-007's claim against the recorder's implementation rather than
    accepting it, and it holds.
    What is left is three Minor findings, all cheap: a non-vacuity test
    whose stated rationale is backwards and one gate branch still
    uncovered, a dead CSS selector left behind by the template fix, and a
    two-pixel ambiguity in one sentence of the card.
  gating_findings: []
  cycle1_findings_closed: [F-001, F-002, F-003, F-004, F-005, F-006, F-007, F-008, F-009]
  min_score: 8
  meets_min_score: true
  score_delta: 1.0
  min_improvement: 0.5
  meets_min_improvement: true
  cycles_used: 2
  max_cycles: 3
  recommendation: >-
    Proceed to the merge gate. None of the three Minor findings needs a
    review cycle: N-002 is deleting one CSS line, N-003 is one clause in
    the card, and N-001 is a docstring re-word plus a three-line third test
    case — worth folding in while the file is open, but not worth a cycle
    of their own and not worth blocking on. I would fold N-001 in, because
    the gate's comparison-returns-False branch is the one branch of the one
    piece of host-dependent logic this card adds, and it is currently
    reached by no test.
    Two things to carry forward past the merge rather than fix here. The
    residual determinism lever the code now names honestly — an unbounded
    `Pillow>=10.0` against metrics read straight off `getmetrics()` — is an
    ADR-0006/R1 question and the card has already routed it to the
    architect station; it belongs on that station's queue, not in a
    follow-up card. And the owner's declined 10.00 → 10.10 cm
    minimum-trim option is recorded beside F-002 as the one change that
    would retire both folio problems at that trim; it is a one-constant
    change to CON-018's floor and the architect station should see it at
    the same time.
