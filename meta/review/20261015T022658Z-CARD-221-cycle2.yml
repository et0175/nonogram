      Book 1, the min-trim book and a 150-puzzle book, with the page-count
      assertion kept exact for Book 1 and relaxed to `> 0` for the other
      two, which is right — the other two have no recorded page count to
      assert. F-006 taken: `_both_faces` (:193) lost the parameter, and the
      docstring now states why it must stay lost (the on-host half must run
      with nothing patched). F-005 taken in three places, including the
      module docstring of the AC-1 file, and each says what WOULD catch a
      FreeType bump — the ungated thirteen-page baseline — rather than
      leaving the limit unanswered. That is more than I asked for.

      F-007, kept with a reason, and I checked the reason rather than
      accepting it. The claim is that
      `TestInteriorType_FloorHoldsWithoutArial` is "what fails first if a
      host lookup returns to the DRAWING, where the structural watch only
      sees `truetype`'s argument". That is accurate: `record_interior`
      (tests/test_book_interior_type_floor.py:213) spies on
      `ImageDraw.ImageDraw.text`, not on the font constructors — its own
      module docstring explains that the font caches make a constructor
      spy unreliable — and it flags an unsized face as a floor breach. So
      the two instruments really are complementary for the one case that
      matters: a reintroduced lookup whose fallback is a sizeless
      `load_default()` leaves no path for the watch to see and produces a
      10 px em the floor check does catch. Deliberate redundancy, honestly
      labelled, and the file is now in the card's gate inventory as a file
      with no gate.

      F-008, documented not changed: correct, and for the stated reason —
      the generic probe understates, which makes a floor check stricter
      rather than more lenient. The docstring now records the 1.05 pt
      margin I measured at cycle 1 and tells a later card to read it as
      probe slack rather than headroom, which is exactly the hazard I was
      worried about.

      F-009 (the cover's sizeless 72 px fallback) is carried into CARD-234's
      scope note as asked; it was never this card's to fix.

