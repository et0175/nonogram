findings:
  - id: F-013
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/static/admin.css
    line: 45
    title: "The new invalid rule tokenizes the border but leaves Bootstrap's red focus halo"
    description: |
      The cycle-2 fix added `.form-control.is-invalid, .form-select.is-invalid,
      .form-control.is-invalid:focus, .form-select.is-invalid:focus { border-color:
      var(--color-danger); }`. It deliberately spells out the `:focus` selectors to
      beat Bootstrap's `.form-control.is-invalid:focus` (0,3,0) — but overrides only
      `border-color`, so that same Bootstrap rule's
      `box-shadow: 0 0 0 .25rem rgba(220,53,69,.25)` survives and still wins over
      admin.css's `.form-control:focus { box-shadow: none }` (0,2,0, line 38).
      The capture station measured exactly this: prose.json
      `step1-general-info-refused.focus_ring_on_marked` =
      `{outline: "solid 2px rgb(31,95,91)", boxShadow: "rgba(220,53,69,0.25) 0 0 0 4px",
      borderColor: "rgb(155,59,38)"}` — a focused invalid field shows three colours at
      once: the teal focus outline, the brick token border and an untokenized Bootstrap
      red halo. The halo pre-dates this card (it was already beating admin.css on print
      setup), but the card's own rule is what left the pair mismatched, and the card's
      Handover describes the change as "one rule, tokens only".
      Shared-stylesheet scope is acceptable: G-4 guards book_setup_print.html, not
      admin.css, and the rule moves that page toward the design system rather than away.
    suggestion: |
      Add `box-shadow: none;` to the existing `:focus` half of the rule (the focus ring
      is already carried by the `outline` in the line-38 rule), or set the halo from
      `--color-danger`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-014
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/book_create.html
    line: 66
    title: "#general-info-error carries no reason, unlike its sibling #plan-error — and the failure is announced twice"
    description: |
      The pattern this fix says it mirrors renders the reason inside the page-local
      region: book_setup_print.html:86 is `<strong>Plan not saved:</strong>
      {{ plan_error }}. …`, and setup_print does NOT flash on a `_PlanFormError`
      (app.py:2399-2402 sets `plan_error`/`plan_error_fields` only).
      edit_book instead flashes `f"Error: {str(e)}"` (app.py:2068-2069) AND renders a
      region whose text is constant: "General info not saved: correct the field marked
      below…". Consequences, both visible in prose.json's `alerts` for
      step1-general-info-refused: (a) the refusal is announced twice — base.html's flash
      `Error: Title cannot be empty` plus the new region, two `role="alert"` regions on
      one render; (b) `aria-describedby="general-info-error"` resolves to a region that
      says *that* the field is wrong but not *why*, while the reason sits in an
      unassociated flash at the top of the page.
      Judged Minor, not Important: the flash is itself `role="alert"` and is announced on
      load, the control has a real label, `aria-invalid="true"` and a resolving
      describedby, and axe would not flag it. But components.md's rewritten FormField
      entry now asserts the two screens share this pattern, and on the reason they do not.
    suggestion: |
      Pass the refusal message into the template and render it inside
      `#general-info-error` as `#plan-error` does, dropping the flash on that path —
      one announcement, and the describedby target then carries the reason.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

