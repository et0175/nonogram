    type: gap
    file: meta/kanban/cards/CARD-305.md
    line: 505
    title: "The 'byte-identical requirements.yml / sha256 equal both sides' claim is false, and the 112-vs-113 split has a cheap exact explanation"
    description: |
      Fix round 1 declares, as unexplained: "the *main* worktree's validator
      reads 112 where the branch reads 113 on a byte-identical
      `requirements.yml` (sha256 equal both sides)".

      Measured, both sides, now:
        sha256 main   0408c9f49830eba1543944fa028dc959ba7b713ad42d84e7f869f5ced02d23ad
        sha256 branch 9c761cf86c3a3eab8818428a328ce7d4819a92dbb331cb0b453f1073d0b9bc35
        diff          122 differing lines — exactly this card's own registry delta
      The two files are not byte-identical and cannot be: main is at 81e683a2
      and carries none of this card's commits. The premise of the mystery is
      the error.

      The split itself is fully explained, and it is not about requirements.yml
      at all. Diffing the two validator runs' warning-id sets gives exactly one
      difference: INV-013, present on the branch and absent on main. The
      validator decides a check ref's existence with
      `CodeSearch.exists` -> `git grep -w`, whose excludes are only
      `:(exclude)meta/architecture` and `:(exclude)*.md`
      (forge/skills/architect-validate/scripts/validators/utils.py, `code_search`).
      `meta/review/**.yml` is NOT excluded. Reproduced:

        cd main   && git grep -wn TestGuideSpread_SitsOnPagesTwoAndThree \
                     -- ':(exclude)meta/architecture' ':(exclude)*.md'
        -> meta/review/20261028T142020Z-CARD-305-cycle1.yml:77   (exit 0)
        cd branch && same command
        -> (no match, exit 1)

      So **cycle 1's own review report resurrects the dead ref**: because that
      report's prose names the missing test, the validator run in the main repo
      believes it exists, INV-013's ref resolves fully, and the warning
      disappears. The branch worktree has no meta/review/ copy of it, so it
      warns. The branch's 113 is the honest number; main's 112 is contaminated
      by the review artefact. (This cycle-2 report names the same symbol, so
      main will keep reading 112 for the same reason.)
    suggestion: |
      Retract the sha256 claim on the card and replace the "declared and
      unexplained" paragraph with the explanation above, naming the branch's
      113 as the honest baseline. Separately worth a board-level note (see
      Out-of-scope): a review report that names a missing test silently
      satisfies the validator's existence search for it, which is a general
      hole in every dead-check-ref verdict taken in the main repo.
    confidence: high
    source: static
    violates: ADR-0039/R4
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

