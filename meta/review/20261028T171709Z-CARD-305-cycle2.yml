  - id: F-007
    severity: info
    category: ops
    type: question
    file: meta/review/20261028T142020Z-CARD-305-cycle1.yml
    line: 77
    title: "Out-of-scope, board-level: a review report that names a missing test satisfies the validator's existence search for it"
    description: |
      Mechanism established while explaining F-001. The validator's
      `CodeSearch` builds its existence search as `git grep -w <name>` with
      excludes `[':(exclude)meta/architecture', ':(exclude)*.md']` only
      (validators/utils.py, `code_search`). `meta/review/**.yml` and
      `meta/profiling/**` are inside the search domain. So any symbol a review
      report, a profiling note or a non-Markdown artefact merely MENTIONS is
      reported as existing in the code.

      Demonstrated here on a real rule: INV-013's
      `TestGuideSpread_SitsOnPagesTwoAndThree` reads as alive in the main repo
      purely because cycle 1's YAML report quotes the name, and as dead in the
      worktree, which has no copy of that report. A dead check ref — the exact
      failure class the board repaired across ADR-0042's four checks on
      2026-10-25 — can therefore be silently revived by writing about it.

      This affects every `check_ref_missing` / `dead_check_ref` verdict taken
      in the main repo rather than in a worktree, in both directions: a
      genuinely missing test can read as present, and a cycle's own report can
      flip the next cycle's count.
    suggestion: |
      Not this card's. Either exclude the review/profiling artefact trees from
      `code_search`'s excludes list (`:(exclude)meta`), or restrict the search
      to code paths positively (`-- '*.py' '*.ts'`), and re-run the dead-ref
      census afterwards. Worth a kanban card; it quietly weakens a mandatory
      mechanism.
    confidence: high
    source: model
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

