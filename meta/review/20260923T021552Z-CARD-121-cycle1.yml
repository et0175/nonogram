findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 777
    title: "Floor verdict and published refusal now decided outside the writing transaction (DB mode)"
    description: |
      `add_puzzles_to_book` reads the book once at line 777 with `self.get_book(book_id)`.
      In DB mode that opens and CLOSES its own session (`get_book`, line 501-505) and
      returns a detached `Book` dataclass. The published refusal (line 780-781), the
      override set (`book.floor_overrides`, line 783) and the whole floor measurement
      (`_below_floor_for`, line 784 — which itself reads the print spec off that snapshot
      and opens one more session per puzzle via `puzzle_store.get_puzzle`) are all decided
      against that snapshot. The row is then re-fetched and written in a *different*
      session at line 820-843.

      Before this diff the published check ran inside the writing session
      (`if book_row.status == PUBLISHED` on the freshly-loaded row). The diff moved it out,
      so the window between "is this book published / what is its trim / what overrides does
      it hold" and "write the new membership" now spans two transactions instead of one.
      A publish, a trim change (Print setup) or a `remove_puzzle_from_book` landing in that
      window is silently ignored: the add commits a membership decided against stale state.
      Flask serves the panel multi-threaded by default, so two tabs are enough; the panel is
      loopback and single-owner (CON-015), which bounds the blast radius but does not remove
      the window.

      What is NOT at risk: the membership list and the override list are two columns of the
      same row assigned in the same session and committed together (lines 829-834), so
      INV-006's pair can never land half-written. This finding is about the decision, not
      the write.
    suggestion: |
      Move the published check, the override read and the floor measurement inside the
      writing session: fetch `book_row` first, build the `Book` (or read status/trim/overrides
      straight off the row), measure, filter, then assign `puzzle_ids` and `floor_overrides`
      and commit — one transaction. If the per-puzzle `get_puzzle` calls must stay outside it
      (they open their own sessions), at minimum re-read and re-check `book_row.status` and
      the print-spec columns inside the writing session before committing, and abort if they
      moved. A regression test with two interleaved managers over the same factory would pin it.
    confidence: medium
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: migrations/versions/012_book_floor_overrides.py
    line: 1
    title: "No test class of its own for migration 012 (chain, column, downgrade)"
    description: |
      Migrations 010 and 011 each carry a `TestMigration0NN` class asserting
      `(revision, down_revision)` and exercising upgrade / no-backfill / downgrade
      explicitly (tests/test_book_plan_storage.py:~790, tests/test_book_page_spec.py:405).
      012 has none. Its chain onto 011 and the column's existence are only covered
      *incidentally*, by the two `command.upgrade(config, "head")` lines this card added to
      those other migrations' tests, and its `downgrade` runs only as a by-product of
      TestMigration011's `command.downgrade(config, "010")`. Nothing asserts that the column
      is gone after 012's downgrade, or that a pre-012 NULL row reads back as "no override".
      The coverage is real but it lives in tests about other revisions, so deleting or
      rewriting either of those tests silently removes 012's only coverage.
    suggestion: |
      Add a `TestMigration012` beside the others: assert `(revision, down_revision) == ("012", "011")`;
      upgrade 011 -> 012 over a row inserted at 011 and assert `floor_overrides` is NULL
      (no backfill) and that `BookManager.floor_overrides(book_id)` reads it as `[]`;
      downgrade to 011 and assert the column is absent from `PRAGMA table_info(books)`.
    confidence: high
