  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 653
    title: "The storeless-manager posture is not reached when the trim is also unreadable"
    description: |
      `_below_floor_for` builds the page spec at line 653 BEFORE the
      `if self.puzzle_store is None` check at line 655. A manager wired without a puzzle store
      whose book also has an unreadable trim therefore raises `ValueError` from
      `book_page_spec` instead of taking the documented "nothing resolvable, nothing refused,
      an error logged" posture the docstring (lines 626-636) and
      `test_a_manager_with_no_store_says_so_rather_than_pretending` describe. Unreachable
      through `create_app` (which always wires a store), so this is a documentation/behaviour
      mismatch rather than a live defect.
    suggestion: "Move the `puzzle_store is None` check above `spec = book_page_spec(book)`, or amend the docstring to say the print-spec refusal wins."
