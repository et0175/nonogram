  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_ready_gate.py
    line: 205
    title: "SCOPE+ fixture: the ready-gate stub clears the floor with a clue set that contradicts its own extent"
    description: |
      The in-memory `Shelf` stub now writes `clues_rows=[[1]], clues_cols=[[1]]` on every
      record, whatever `width`/`height` it declares (those are `bucket.high`, up to 30x30).
      `book_cell_mm` derives the grid extent from the clue arrays alone
      (compute_layout(row_clues, column_clues)), so every one of these records is measured as
      a 1x1 puzzle and clears the floor by a mile — regardless of the 30x30 it claims to be.

      JUDGEMENT on the SCOPE+ question: the edit is NECESSARY (36 tests broke, the floor now
      measures stored records) and MINIMAL, and it is NOT a weakening introduced by this card —
      the stub's DB branch already wrote exactly `clues_rows=[[1]]` (line 224) before this diff,
      so the in-memory branch was brought to parity with a pre-existing shape, not softened to
      let new code through. The ready-gate suite's own guarantee (INV-007 plan tolerance) is
      untouched: it reads only width, height and tier.

      What it does hide is a real product interaction nothing now covers: with clues consistent
      with a 30x30 extent, a deep-gutter large puzzle sits BELOW the floor on the default Book 1
      trim (AC-182's own figure: 42 cells across = 4.61 mm), so books assembled from the largest
      bucket may not be able to reach their planned counts without overrides. No test states that.
    suggestion: |
      Leave the parity repair as is, and add one test (in tests/test_book_floor.py, not in the
      gate suite) that a realistic large puzzle whose clues match its 30x30 extent needs an
      override to join a default book — so the floor/plan interaction is stated somewhere
      rather than inferred. Optionally note in the stub's docstring that its clue pair is a
      floor-clearing stand-in, not a description of the record's extent.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2572
    title: "Every add measures the whole submission twice, one store round-trip per puzzle"
    description: |
      Both routes call `book_mgr.floor_refusals(...)` (app.py:2572 and :3103) purely to word the
      refusal, then `add_puzzles_to_book` repeats the identical measurement internally
      (book_manager.py:784). Each pass runs `_below_floor_for`, which calls
      `self.puzzle_store.get_puzzle(puzzle_id)` inside a per-id loop (book_manager.py:668) —
      a separate session/query per puzzle in DB mode — plus one `compute_layout` per puzzle.
      A selection step committing a book-sized set (~150 tiles, ADR-0034) therefore issues
      ~300 point reads and 300 layout computations for one POST. It is correct and bounded,
      not a bug, but it is an N+1 on the hot path of the step the owner uses most.
    suggestion: |
      Have `add_puzzles_to_book` return (or accept) the `FloorRefusal` list so the route gets
      the wording from the same pass that made the decision — that also removes the theoretical
      disagreement between the two passes. If the loop stays, add a batch read to the puzzle
      store (`get_puzzles(ids)`) and use it in `_below_floor_for`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
