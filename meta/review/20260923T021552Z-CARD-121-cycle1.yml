    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_manager.py
    line: 828
    title: "A duplicate id inside one submission still duplicates membership, and now duplicates the refusal too"
    description: |
      `new_puzzles = [pid for pid in puzzle_ids if pid not in existing]` (lines 805 and 828)
      de-duplicates against CURRENT members but not within the incoming list, so posting
      `p,p` for a non-member `p` appends it twice. That is pre-existing (the line is unchanged
      by this diff). What this card adds on top: `_below_floor_for` loops over the raw
      `puzzle_ids` with no de-dup (line 649-700), so a duplicated below-floor id yields two
      identical `FloorRefusal` entries — two identical flash messages to the owner — and makes
      the route's `added = len(puzzle_ids) - len(refusals)` counter (app.py:2576, :3104)
      double-count. The brief asked for duplicate-id behaviour; this is what it is.
    suggestion: |
      De-duplicate `puzzle_ids` once at the top of `add_puzzles_to_book` (preserving order,
      `list(dict.fromkeys(...))`) and once in `_below_floor_for`; add a case to
      tests/test_book_floor.py for a submission carrying the same id twice, below and above
      the floor.
    confidence: high
