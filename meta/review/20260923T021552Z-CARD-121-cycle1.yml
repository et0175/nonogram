  - id: F-007
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_book_membership_floor.py
    line: 328
    title: "The property corpus puts the same puzzle into 16 books, a state ADR-0033 forbids"
    description: |
      Each test loops 16 print specs and calls `add_puzzles_to_book(book_id, corpus.ids, ...)`
      with the SAME 24 puzzle ids every time (lines 328, 368, 407, 467). Since
      `_mirror_onto_puzzles` writes `puzzles.book_id`, every puzzle ends up claimed by 16
      successive books — the single-valued `puzzles.book_id` rule (ADR-0033, G-2) that the
      selection route's assigned-puzzle exclusion exists to keep. It does not weaken what the
      property asserts (the membership/override coupling is per book and independent of it),
      but the corpus is exercising a state the product prevents, so a future regression in the
      exclusion would not show up here.
    suggestion: "Build a fresh puzzle set per book (or release the previous book's claim between iterations) so the corpus stays a reachable state."
    confidence: high
    source: static
