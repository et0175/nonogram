  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_db_engine_lifecycle.py
    line: 1136
    title: "arm 2b's position assert would pass trivially on a one-call probe, and nothing asserts the probe has two"
    description: |
      The brief asked directly whether a position assertion can pass for a wrong
      reason. It can, and here is the one way:

        second_call = two_calls_source.rindex("setattr(")
        assert match is not None and match.start() == second_call

      `rindex` returns the LAST occurrence. On a probe containing only one
      `setattr(`, `second_call` is that one occurrence, the pattern necessarily
      matches at a `setattr(`, and the assert is trivially true -- the over-reach
      property would be unmeasured and the arm would still be green.

      Today it discriminates, measured: the probe contains exactly two `setattr(`
      occurrences, at offsets 49 and 122, and
        shipped   -> match.start() = 122 (== rindex)  PASS
        PAREN-DEL -> match.start() =  49              RED
        NORM-DEL  -> match is None                    RED
      which reproduces the card's 122 / 49 / None table exactly.

      So this is a latent vacuity, not a live one -- which is why it is Minor. It
      is filed because the rest of this file asserts every probe precondition
      explicitly (:922 the probe file is not an exemption, :984 the exempt file
      lists a name, :992 the real file's count still matches the exemption), and
      this arm, uniquely, leaves the property its instrument depends on
      unasserted. A maintainer trimming the probe to one call gets a green arm and
      no signal.
    suggestion: |
      One line before the assert, in the file's existing idiom:

        assert two_calls_source.count("setattr(") == 2, (
            "this arm needs two setattr( calls in the probe; with one, rindex "
            "returns the only occurrence and the position assert is vacuous"
        )
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

