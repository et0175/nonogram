         it; which cycle found it belongs on the card. ~25 lines across the two
         control docstrings -- and it closes the surface where this card's own
         recurring genus keeps reappearing.

      Not a gate. If the board prefers to land as-is, land as-is: nothing here is
      wrong, it is only heavy.
