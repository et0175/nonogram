    description: |
      This is the answer to the card's own question, measured rather than argued,
      and it is recorded as a finding so the next guard-shrink card inherits the
      number instead of the anecdote.

      Line counts, per revision (git show | wc -l):

        tests/test_db_engine_lifecycle.py   1415 -> 919 -> 1062 -> 1177
                                            base   shrink  cyc1   cyc2
        src/nonogram/db/session.py           327 -> 368 ->  376 ->  384

      The shrink removed 496 lines. Cycle 1's fix put back 143, cycle 2's put back
      115 -- 258 lines, 52% of the shrink, restored by controls and by prose about
      controls. Net over both files: 1742 -> 1561, i.e. -181 lines (-10.4%),
      against a card that declared "Retire (~400 lines of code and prose)" and
      "Keep (~55 lines -- the part with real authority)".

      Prose-to-mechanism in the surviving AC-5 guard, measured by AST (docstring
      spans + comment-only lines vs executable lines):

        _hand_set_spellings                          doc  33   exec   2
        _hand_set_sites_in                           doc  11   exec   6
        _hand_set_sites                              doc   1   exec   7
        AC-5 class docstring                         doc 116   exec   -
        test_no_test_file_outside_the_exemption...   doc   7   exec  14
        test_the_count_reds_on_a_new_file...         doc  37 + 9 comments   exec  68
        test_a_wrapped_call_is_counted...            doc  63 + 20 comments  exec  79
        ------------------------------------------------------------------
        TOTAL                                        prose 297   exec 176   = 1.69 : 1

      And in session.py: reset_engine()'s docstring is 126 lines for a 6-line
      function body -- 21:1.

      What actually catches things is about 22 executable lines: two regexes
      (2 lines), a 6-line counter, a 6-entry dict, and the 14-line tree-wide
      equality. Those 22 lines caught the keyword-bound
      `monkeypatch.setattr(app_session, name="engine", ...)` shape that CARD-252's
      ~400 lines of AST machinery missed through three review cycles. That part is
      unambiguously worth keeping.

      The claim-heavy part is the duplication rule. The convention is written
      twice on purpose, "in the same words" -- the AC-5 class docstring (116 lines)
      and reset_engine()'s docstring (126 lines) -- and that doubling has been paid
      three times already: cycle 1 edited both, cycle 2 edited both, and two of
      this cycle's four Minors (F-002, F-003) live in text that would have to be
      corrected in both places. "The same words in two places" is itself an
      unverified claim: nothing reds if they drift.
    suggestion: |
      Three cuts, roughly -135 lines, with no measured property lost:

      1. Single-source the convention. Keep it on reset_engine() (where the seam
         is); replace the class docstring's copy with a one-line cross-reference
         plus the "Controls:" list. ~100 lines, and it retires the
         "in-the-same-words-in-two-places" rule, which is a claim with no control.
      2. Delete control A's arm 2 (F-001). ~10 lines, zero coverage.
      3. Stop narrating review history in shipped docstrings. Both prose Minors
