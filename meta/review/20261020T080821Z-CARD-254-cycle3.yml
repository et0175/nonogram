    My own ast.NodeTransformer, written for this review and independent of the
    agent's: every ast.Assert at any nesting depth is rewritten into
    try: <assert>; __REC__(lineno, None) / except AssertionError as e:
    __REC__(lineno, e), so execution continues past a red assert and each one is
    recorded under the lineno of its own Assert node. The module is then exec'd and
    the two target methods called directly. Mutants are applied to the module source
    text before parsing, and every deletion mutant preserves the line count (the
    deleted regex slot is filled with a never-matching pattern rather than removed),
    so no lineno can shift -- the misalignment the agent reported in its first
    attempt is structurally impossible here. An assert in a loop records one verdict
    per iteration (reported as PASS/RED in iteration order).
  mutants:
    NORM-DEL: "[^()]*? -> [^()\\n]*? (restore the newline exclusion = the pattern before this card)"
    PAREN-DEL: "[^()]*? -> (?s:.*?) (delete the parenthesis exclusion, keeping newline-crossing)"
    SETATTR-DEL: "the setattr( half of _hand_set_spellings replaced by a never-matching pattern"
    ASSIGN-DEL: "the .name = half of _hand_set_spellings replaced by a never-matching pattern"
    PAIR-COLLAPSE: "_hand_set_sites_in: sites[(filename, name)] += 1 -> = 1 (one per pair, not per match)"
    COMMENT-STOP: "[^()]*? -> [^()#]*? (stop at a comment marker)"
    COMMA-REQ: "setattr\\([^()]*? -> setattr\\([^()]*?,[^()]*? (require an argument comma)"
    NAMES-HARDCODE: "_hand_set_sites_in iterates a hardcoded three-name tuple instead of its names parameter"
    OPENPAREN-OK: "[^()]*? -> [^)]*? (allow an opening paren, still stop at a closing one)"
  control_a:
    test: "test_the_count_reds_on_a_new_file_a_new_name_and_a_tenth_site"
    rows:
      - ":920, :922 preamble guards -- PASS under all nine mutants"
      - ":945 arm 1, both spellings counted (nested in a for) -- RED/PASS under SETATTR-DEL, PASS/RED under ASSIGN-DEL; each iteration kills its own half, exactly as the docstring claims"
      - ":956 arm 2, a new file -- RED under SETATTR-DEL only; no mutant kills it without also killing :945 iter 1 (F-001)"
      - ":974 arm 3, a new name -- RED under SETATTR-DEL and uniquely under NAMES-HARDCODE"
      - ":978, :984 precondition guards -- PASS under all nine"
      - ":992 precondition (the real exempt file's count still matches the exemption) -- RED under SETATTR-DEL, which is a precondition doing its job"
      - ":1001 arm 4, a tenth site in an already-exempt pair -- RED under SETATTR-DEL and uniquely under PAIR-COLLAPSE, the mechanism the arm names"
  control_b:
    test: "test_a_wrapped_call_is_counted_and_a_parenthesised_receiver_is_not"
    rows:
      - ":1074, :1076 preamble guards -- PASS under all nine mutants"
      - ":1092 arm 1, a wrapped call is counted -- RED under NORM-DEL (and SETATTR-DEL). Docstring claims NORM-DEL. ✓"
      - ":1110 arm 2a, an unrelated wrapped call manufactures no match -- RED under PAREN-DEL only. Docstring claims PAREN-DEL. ✓"
      - ":1136 arm 2b, the match STARTS at the call carrying the name -- RED under PAREN-DEL AND NORM-DEL (and SETATTR-DEL). Docstring claims both, not only the flattering one. ✓ Positions re-derived: shipped 122, PAREN-DEL 49, NORM-DEL None, rindex 122, probe contains exactly two setattr( at offsets 49 and 122."
      - ":1151 arm 3, a parenthesised receiver is not counted -- RED under PAREN-DEL. Docstring claims PAREN-DEL. ✓ OPENPAREN-OK does not kill it (the receiver's own ')' still stops the scan), so arm 3 and arm 2a probe the same exclusion from two sides -- both sentences name it and both are measured."
      - ":1171 arm 4, an unclosed setattr( in prose IS counted -- RED under NORM-DEL (and SETATTR-DEL) and uniquely under COMMA-REQ, which deletes the prose over-read while leaving the wrapped-call widening intact. So arm 4 is independently killable and not a relabelled arm 1. Docstring claims NORM-DEL. ✓"
  conclusion: >-
    No third generation. Every claim-bearing assert in both controls reds under a
    mutant that deletes the mechanism its own sentence names, and the two cells the
    brief singled out (arm 2b under PAREN-DEL and under NORM-DEL) are both red and
    both stated. The card's own two matrices reproduce cell for cell under an
    independent instrument.

