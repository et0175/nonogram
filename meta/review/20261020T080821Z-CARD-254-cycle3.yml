findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_db_engine_lifecycle.py
    line: 956
    title: "arm 2 of the neighbouring control is a strict duplicate of arm 1's setattr iteration -- no mutant can kill one without the other"
    description: |
      Control A's docstring lists arm 2 as a separate clause -- "2. a new file --
      reds if the ``setattr(`` spelling stops being counted" (:912) -- and the
      test's own name claims "the count reds on a new file".

      Measured: arm 2's probe and arm 1's first-iteration probe are the same
      input to the scan. Side by side, with the derived name interpolated:

        arm 1 iter 1: 'def test_spelling(monkeypatch):\n    monkeypatch.setattr(db_session, "SessionLocal", None)\n'
        arm 2:        'def test_new_file(monkeypatch):\n    monkeypatch.setattr(db_session, "SessionLocal", None)\n'

      The only difference is the probe function's NAME, which a text scan cannot
      see. Same probe_file, same global name, same spelling, and the asserts are
      character-for-character the same predicate
      (`dict(...) == {(probe_file, names[0]): 1}`). I ran both through the scan
      under every mutant of _hand_set_spellings: identical Counter in all three
      cases (shipped, setattr-half deleted, assignment-half deleted). In the
      per-assert matrix :945 and :956 red under exactly the same single mutant
      (SETATTR-DEL) and under no other -- while arms 3 and 4 each have a mutant
      that kills only them (NAMES-HARDCODE for :974, PAIR-COLLAPSE for :1001).

      This is NOT a third generation of F-001 and I want to be exact about why:
      arm 2 CAN fail, and it fails for the reason its own sentence gives. The
      cycle-2 fix already narrowed that sentence from the direction-claim ("a new
      file") to the mechanism-claim ("reds if the setattr( spelling stops being
      counted"), which is what ADR-0039/R1 asks for. What is left is a duplicated
      control wearing a clause label -- ten lines that measure nothing the line
      above them does not. The docstring's own framing ("Four arms, one per
      clause", "Every direction the equality claims to catch") is what makes it
      read as a fourth measurement.
    suggestion: |
      Delete arm 2 (:950-959) and its docstring bullet. Arm 1's setattr iteration
      is the measurement; the "new file" direction is the equality's reaction to
      that count, which the same docstring already says is dict equality and not a
      mechanism an arm can kill. If the clause is worth naming, name it there:
      "a site in a file the exemption does not list is counted (arm 1) and the
      equality reacts to any count it does not account for, by construction".
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: bug
    file: tests/test_db_engine_lifecycle.py
    line: 899
    title: "the control's own docstring says both removed comparisons 'were true for every possible probe value' -- one of them was not"
    description: |
      tests/test_db_engine_lifecycle.py:893-903 explains the cycle-2 deletions:

        "Two asserts here used to compare a single-file probe count against the
         whole six-pair exemption and say in their message that the equality would
         otherwise pass; those comparisons were true for every possible probe value
         and were removed in CARD-254 review cycle 2 (F-001's family)."

      Measured against the f0701729 source, the two asserts were:

        (i)  assert dict(new_file) != {} and dict(new_file) != _EXEMPT_HAND_SET_SITES
        (ii) assert dict(after) != _EXEMPT_HAND_SET_SITES

      (ii) is unconditionally true -- `after` holds keys under one file only, the
      exemption holds six keys over two files, so they can never be equal, tenth
      site or not. Confirmed: deleting it lost nothing, and :1001
      (`after[key] == before[key] + 1`) is the assert that measures the tenth site
      and reds under PAIR-COLLAPSE. The cycle-2 fix's claim about (ii) is right.

      (i) is NOT true for every probe value. Its FIRST conjunct, `dict(new_file)
      != {}`, reds under SETATTR-DEL: with the setattr half of the spelling pair
      deleted the probe counts nothing, dict(new_file) == {}, and the assert fails.
      I ran it: `drop=setattr -> dict={} -> (!={}) False -> assert passes=False`.
      Only (i)'s SECOND conjunct was vacuous.

      No coverage was lost -- the replacement
      `dict(new_file) == {(probe_file, names[0]): 1}` is strictly stronger than
      `!= {} and != EXEMPT` -- so the fix is right and only the stated reason is
      wrong. Filed because this is the THIRD occurrence of this card's own
      recurring genus (cycle-1 OBS-1 on the card, cycle-2 F-003 on the card, now
      shipped in a test docstring), and the first time it has shipped inside the
      code rather than sitting on the card.
    suggestion: |
      One clause: "...one of those comparisons was true for every possible probe
      value (the tenth-site one) and the other was true except when the setattr
      half of the scan is deleted, which the assert above it already covers; both
      were replaced by asserting only the count."
    confidence: high
    source: static
    violates: null
