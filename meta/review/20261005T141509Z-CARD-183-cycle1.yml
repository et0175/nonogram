  type: gap
  file: tests/test_puzzle_solver_hint.py
  line: 507
  title: test_the_hinted_cell_carries_an_accent_outline never checks the accent colour, the inset offset or the paper ring
  description: The test name and the admin.css:458-462 comment claim an accent outline 'just inside the cell' with a paper ring. The assertions (514-515) read only outlineStyle == solid and outlineWidth > 0. Swapping var(--color-accent) for any other colour, dropping outline-offset (outline drawn outside the cell, under neighbours), or deleting the box-shadow ring all leave the test green - the claimed region has no killing assertion (TEST-CLAIM RULE).
  suggestion: Assert getComputedStyle(td).outlineColor equals the resolved --color-accent, outlineOffset equals minus the major rule width, and boxShadow carries the --grid-paper inset ring; or narrow the test name and CSS comment to what is asserted.
  confidence: high
  source: static
