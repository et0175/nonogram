- id: F-001
  severity: high
  type: gap
  file: tests/test_puzzle_solver_hint.py
  line: 362
  title: AC-3 'wrong mark hides a deduction' minimum is asserted with a weaker predicate than the AC and the comment state
  description: 'AC-3 requires >= 20 boards where a wrong mark hides a deduction, and line 366 comments ''a wrong mark taken at face value would hide this deduction''. The counted predicate (line 362-363) is _face_value_hint(...) != want, which also counts boards where a face-value wrong mark creates a spurious EARLIER deduction while the oracle''s cell stays deducible. Re-running the test''s own seeded corpus (seed 1833) in Python: 181 boards counted, of which only 112 truly hide the cell (its row and column no longer force it at face value); 91 are spurious-earlier cases. The AC holds on this seed, but the assertion does not demonstrate it - a corpus change could keep ''hidden >= 20'' green with zero real hides.'
  suggestion: Count a board only when, at face value, neither the row nor the column of want's cell forces it (or narrow the comment and the AC wording to 'changes the deduction' via the owner).
  confidence: high
  source: static
  violates: null
  root_cause: RC-1
  category: feature
  status: fixed
