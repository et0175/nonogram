    type: gap
    file: meta/kanban/cards/CARD-318.md
    line: 0
    title: "AC-6 is violated: the demotion ADDED a validator warning, and the card's warning-set figure is pre-demotion"
    description: |
      AC-6 requires "ten fewer dead-ref warnings and NO WARNING OF ANY KIND
      ADDED — warning sets diffed line by line". The card's G-9 section reports
      "9 removed, 0 added" and states "AC-6 reads 9, not 10 — the tenth is
      AC-142, held open".

      Re-derived at HEAD with the validator of record (forge_1 validate.py
      --root meta/architecture --phase all), merge-base ef242847 in a throwaway
      worktree vs HEAD 3a4052a4, review YAMLs equal on both sides because the
      branch does not touch meta/review/:

        merge-base: 0 errors, 100 warnings
        HEAD:       0 errors,  91 warnings
        sets diffed with comm on sorted WARN lines:
          REMOVED: 10  (AC-136..AC-143, EC-017, EC-018 — AC-142 INCLUDED)
          ADDED:    1  →  [WARN ] FR-029/AC-142 'then' bundles several
                           outcomes — split into separate acceptance criteria
                           (one behaviour each)

      Cross-checked: "bundles several outcomes" warnings go 10 at merge-base →
      11 at HEAD, and AC-142's merge-base warning was the dead-ref one, so the
      attribution is unambiguous — the card's own rewritten `then` caused it.

      Two distinct problems, one cause. (a) AC-6's second clause is FAILED: a
      warning was added. (b) The reported figures are the state at commit
      9329f1fb, before the demotion. The demotion cleared AC-142's dead ref
      (-1) and introduced the bundling warning (+1), so the TOTAL stayed 91 by
      coincidence while the SET changed. That coincidence is why the round's
      count line still matched and the regression was invisible — the exact
      "a figure summarising rows must be counted from the rows" trap, landing on
      the card's single most load-bearing figure.

      Also note the removal count is 10, not 9: by demoting AC-142 the card
      bought the tenth warning after all. So the card understates what it
      achieved and overstates its cleanliness, from the same stale read.
    suggestion: |
      Re-run the validator of record at HEAD and restate G-9 from the diffed
      sets: 10 removed, 1 added, net 91. Then either split AC-142's `then` into
      one-behaviour criteria so the added warning goes away and AC-6 passes
      intact, or record an explicit owner-accepted deviation on AC-6 saying the
      bundling warning is the accepted cost of the demotion. Do not leave AC-6
      reading as met.
    confidence: high
