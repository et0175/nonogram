  - id: F-003
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_solver_strategies.py
    line: 382
    title: "AC-139's tests assert a weaker property than the AC's \"that puzzle's real list\" — a plausible wrong constant survives at both call sites"
    description: |
      AC-139's `then` is "every stored row's strategies_used holds THAT
      PUZZLE'S REAL non-empty list". The round found the row-only assertion
      unobservable (add_puzzle derives the list when handed an empty one) and
      added a spy on the add_puzzle hand-off. I reproduced its mutants and ran
      two more. Harness: SHA-256 asserted before each mutant and after each
      restore (all four restore=ok), __pycache__ swept both ends,
      PYTHONDONTWRITEBYTECODE=1, restore from the in-memory original, node-id
      scoped, -o addopts=''. Tree verified clean afterwards.

        R1  batch_generator.py:474  -> strategies_used=[]                  KILLED
        R2  app.py:1993             -> strategies_used=[]                  KILLED
        R3  batch_generator.py:474  -> strategies_used=['simple_overlap']  SURVIVED
        R4  app.py:1993             -> strategies_used=['simple_overlap']  SURVIVED

      So the spy watches the right boundary — R1/R2 confirm the round's M6/M9
      fix works, and the empty-list defect it was built for is genuinely caught
      at both call sites. But the predicate applied at that boundary is only
      "truthy AND subset of STRATEGY_NAMES" (the `assert names` and
      `set(names) <= set(puzzle_review.STRATEGY_NAMES)` loops at :441-444 and
      :482-485, mirrored by _assert_row_is_a_real_list at :425-429). It never
      compares the handed-over value to the puzzle's own strategies. A call site
      that reported a fixed, in-vocabulary, wrong list therefore passes both
      tests and both the row and the hand-off checks.

      This is the aspirational-green shape, and it is self-documented: the class
      docstring says "the AC's words are 'that puzzle's real ... list', so what
      has to be observed is the value the GENERATOR HANDED OVER". The hand-off
      is observed; its identity with the puzzle's list is not. The card's own
      standard (AC-3: a mutant in the covered behaviour must red the test) is
      met for deletion mutants and not for substitution mutants on the same
      line — and AC-139 is the one criterion where substitution is the realistic
      regression, because the sample value ['LineLogic','ConstraintProp'] the
      docstring guards against is itself a hardcoded constant.
    suggestion: |
      Assert identity, not shape. In the random test, the generator's puzzles
      are reachable, so capture each puzzle alongside its hand-off and assert
      handed == list(puzzle.strategies). Where the aggregate is not reachable
      (the image route), assert at minimum that the handed lists are not all
      equal to one another across puzzles of differing difficulty, or spy one
      level deeper on puzzle.strategies. Keep SAMPLE as a belt-and-braces check;
      it is the identity assertion that closes R3/R4.
    confidence: high
    source: static
