mutation_census:
  policy: >-
    Per the owner-approved policy: every gating finding's mutation re-fired
    plus the declared rows, one node id at a time, per assertion,
    line-count-preserving, restored with a `git hash-object` check after each.
    I did NOT re-run the whole census -- the fix round's own log covers S3/S4/
    M2/M3/M4 and I spent the budget on the declared rows, the F-07 proof and
    PRIORITY ONE.
  reviewer_runs:
    - mutant: S1 -- the hot call site reverted to the stdlib
      expected: killed, and the message must name 2938
      observed: >-
        KILLED by the set equality, message "Offending (scope, lineno):
        [('TestBookPdfStructure_NoPositionCountsTheGuideWithoutTheTitlePage',
        2938)]"
    - mutant: S2 -- the cold call site reverted to the stdlib
      expected: killed, and the message must name 1460
      observed: >-
        KILLED by the set equality, message naming ... 1460. THE TWO MESSAGES
        DIFFER AND EACH NAMES ITS OWN SITE -- F-07 is closed, verified here and
        not taken from the round's log.
    - mutant: M1 -- the ast.Call requirement -> a bare Attribute match
      expected: survive, declared
      observed: >-
        SURVIVED through the F-07 re-fire, as declared. Cycle 1 verified the
        reason by AST; the derivation changed under it and the declaration still
        holds.
    - mutant: N1 -- the lineno the derivation carries deleted (-> 0)
      expected: killed by the positive control
      observed: >-
        KILLED, and by the positive control ONLY: assert [('Foo', 0)] ==
        [('Foo', 4)]. The main set equality passed it (it runs first and did
        not fire), so "killed by one control only" is exactly right -- the
        positive control is the only assertion in the tree that can observe the
        lineno at all. ADEQUATE as far as it goes; see N-judgement below.
    - mutant: N2 -- the lineno half of the FAILURE MESSAGE deleted
      expected: survive, declared
      observed: SURVIVED, no assertion fired. The declaration is TRUE -- see below.
    - mutant: E1 (reviewer's own, EDGE) -- node.lineno -> node.end_lineno
      expected: unknown; this is the edge the fix round did not fire
      observed: >-
        SURVIVED. Invisible to the main equality (all four of this file's own
        *.get_source_segment calls are single-line, so lineno == end_lineno)
        and invisible to the positive control (its planted call is one line).
        F-C2-04.
    - mutant: E2 (reviewer's own) -- the offending pairs in the message replaced
        by a constant string
      expected: unknown; the message claim's edge
      observed: >-
        SURVIVED. A second, independent message mutant confirming that NOTHING
        in this tree observes that f-string while the file is green, which is
        what makes N2's declaration true rather than humble.
  judgement_on_N1: >-
    The single control is CORRECT and SUFFICIENT for what N1 claims, and
    INSUFFICIENT for the mechanism. The positive control is the only assertion
    that can see the lineno -- the authority projects it away deliberately and
    the message is unobservable while green -- so "killed by the positive
    control and only it" is not a weakness, it is the architecture. What the
    lineno half does want is not a second control but a BETTER one: the
    existing positive control plants a single-line call, so it pins that a line
    is reported and not that the RIGHT line is reported. E1 demonstrates the
    gap and a two-line plant closes it. Recommended, not gating.
  judgement_on_N2: >-
    The REASON IS CORRECT: an assert's message operand is evaluated only when
    the assertion fails, so while this file is green no test in this tree can
    observe that f-string, and killing N2 would require a test that asserts on
    another test's failure text. I confirmed the un-observability with a second
    mutant of my own (E2), which also survived -- so this is a declaration with
    a control behind it, not a claim wearing a declaration. And S1-vs-S2 IS
    adequate evidence that the message is right: the census renders it twice,
    under two different offenders, and it names each site distinctly, which is
    direct positive evidence rather than an argument. The one thing the
    declaration overstates slightly: un-killability is a property of the chosen
    SHAPE (an inline f-string), not of the tree -- extracting the formatting
    into a helper would make it assertable. Accepted as declared.

