  - id: F-C2-04
    severity: minor
    title: >-
      The one mechanism fix round 1 added has an inside mutant (N1) and no edge
      mutant, and the edge mutant survives: replacing `node.lineno` with
      `node.end_lineno` in the derivation is invisible to every assertion in
      the tree, because the positive control plants a SINGLE-LINE call
    file: tests/test_book_export_interior_cover.py
    line: 6813
    gating: false
    confidence: high
    detail: >-
      The board's rule is that a comment saying what a test catches needs two
      mutants, one inside the claimed region and one at the EDGE. N1 is the
      inside mutant and it is killed by the positive control, as declared. The
      edge is the lineno being WRONG rather than absent, and the positive
      control cannot see it: its planted source is
      "        return ast.get_source_segment(source, node)\n", one line, so
      lineno == end_lineno == 4. All four of this file's own legitimate
      *.get_source_segment calls are single-line too (6501/6547/6623/6624,
      lineno == end_lineno for each), so the main equality cannot see it
      either. UNLIKE M1 this is NOT structurally unkillable: the planted source
      is entirely under the test's control, so wrapping the planted call over
      two lines closes it in four characters. A closeable bound, and the
      board's rule is that a closeable bound is closed. The consequence if left
      open is bounded and cosmetic -- a failure message naming the wrong line
      for a multi-line analysis call that does not yet exist in the file --
      which is why this is minor and not gating.
    evidence: |
      Reviewer mutation re-fire, committed blob 4d9a8977, one node id, per
      assertion, line-count-preserving, restored and hash-checked after each
      (rev2/mut.py):
      --- E1 reviewer EDGE: lineno -> end_lineno
          rc=0  ['1 passed in 0.21s']
          SURVIVED (no assertion fired)
          restored blob 4d9a8977cf19f8cd9c2830f740e9fdbc60e294e2 OK

      $ # every *.get_source_segment call in the committed blob is single-line
      *.get_source_segment calls (lineno, end_lineno, single-line):
         (6501, 6501, True)
         (6547, 6547, True)
         (6623, 6623, True)
         (6624, 6624, True)
      all single-line: True
    remedy: >-
      Make the positive control's planted call span two lines and assert the
      OPENING line, e.g. "return ast.get_source_segment(\n            source,
      node)" asserted as [("Foo", 4)]. Four characters; kills E1; reds on
      nothing.

