verdict: >-
  CERTIFIED (8.0 against a threshold of 8). All three of cycle 1's gating
  findings are closed in substance, and closed on evidence this review
  re-derived rather than re-read: the bounded-prefix reach (mean 81.1 %, min
  43.1 %, max 96.7 %) reproduces EXACTLY when measured at the stdlib boundary
  instead of at the caller; F-287-02's arithmetic checks to the digit and its
  saving is confirmed by an in-situ wall clock that never uses a count x
  ms/call model at all (12.20 s measured against 11.48 s modelled, 5.9 %);
  F-287-03's extended capture really does cover all seven axes cycle 1
  enumerated, with nothing left as a bare len(), and I reproduced the
  52-section capture BYTE-FOR-BYTE on arm A's blob and on the committed blob
  with my own loader. F-07 is genuinely closed: S1 and S2 now name 2938 and
  1460 separately. G-1 holds.
  What remains is one major and seven minors, none of them gating and none of
  them a mechanism: AC-1's headline 21.0 % share takes its numerator and its
  denominator from two DIFFERENT cProfile runs while the card claims the
  opposite "by construction" (the same-run share on this host is 22.0 %, so
  the figure is right and the claim is not); the grep that is offered as
  F-287-01's class audit does not reproduce as written; F-08's call-site line
  numbers are the superseded blob's and contradict the card's own mutant
  table; and the one mechanism the fix round added has an inside mutant but no
  edge mutant — node.lineno -> node.end_lineno SURVIVES. Each is a prose
  correction or a four-line control, all below cycle 1's gating bar, and all
  named below as what the merge gate owes.

