priority_one_resolution:
  question: >-
    Cycle 1 reported that a one-character divergence at the HOT call site moves
    1 535 of 1 752 capture lines (88 %); fix round 1 measured 75 of 1 752
    (4.3 %) and 793 of 11 936 (6.6 %). Cold site 8 in both. Which is right?
  answer: >-
    NEITHER IS A MEASURE OF THE CAPTURE'S SENSITIVITY, and both are correct
    measurements of their own injection. The 20x gap is an artefact of the
    COMPARISON, not of the scope or of the value: a positional line-by-line
    equality over a pprint-formatted text is not invariant under a change in
    the text's LINE COUNT. A divergence that LENGTHENS each segment leaves the
    capture at 1 752 lines and moves only the 75 lines whose content changed;
    a divergence that SHORTENS it re-wraps pprint to 1 744 lines and then
    almost every line after the first changed one differs positionally.
  reconstructed: >-
    YES, to within 8 lines, and the mechanism exactly. I reproduced cycle 1's
    magnitude with a one-character SHORTENING at the hot site (drop the last
    character of each non-None segment): 1 744 lines, 1 543 of 1 752 differ
    positionally = 88.1 %, against cycle 1's 1 535 = 87.6 %. I reproduced the
    fix round's with a one-character APPEND: 1 752 lines, 75 differ = 4.3 %,
    byte-for-byte the fix round's own number. The exact character cycle 1
    appended or removed is still not recoverable and does not matter.
  both_hypotheses_the_brief_named_are_REFUTED: >-
    (1) SCOPE: injecting at CARD-292's already-memoised segment() closure
    (line 1761) moves 559 lines, and injecting at all three call sites at once
    (patched inside _source_segment itself) moves 631. Neither is near 1 535,
    so the rounds did not differ by injecting at different scopes.
    (2) A VALUE THAT PROPAGATES FURTHER: the hot site's answer reaches exactly
    6 of the 52 sections under EVERY injection I fired -- tilde, escaped
    newline, upper-case, same-length single-character swap, truncation,
    first-character drop and a ten-character append. The set of sections it
    reaches is invariant; only the positional line count moves.
  the_invariant_measure: >-
    Section-level content comparison, which the round's own data already
    carried. HOT site: 6 of 52 sections differ (175 lines live in them, 75
    carry different content) -- AC6 real/shipped sites, AC6 real/no-door-arms
    sites, AC6 real/follow-terms sites, AC3 PLANTED_LITERAL outcome, AC3
    DERIVED_INSTEAD outcome, AC3 EXEMPTED_TERM outcome. COLD site: 1 of 52
    sections (AC3 counting expressions, 22 lines, 8 carry different content) --
    which is why 8 is the one figure both rounds agree on: that section's
    content is 8 lines and no injection changes its line count.
  conclusion_status: >-
    THE LOAD-BEARING CONCLUSION REPRODUCES AND IS STRENGTHENED. The capture
    reads the output of both changed call sites at every injection I tried, so
    it is not self-confirming, and I established that in a third form (section
    identity) that is invariant under the formatting artefact that produced the
    disagreement.
