    223019c2430217999e456fe0de0ee7d45e4dfc67bef43fececd38811e1644292  before.txt

    injection        site            lines  posdiff      %  first  sects
    hot_tilde        hot              1752       75   4.3%      2    6/52
    hot_newline      hot              1752       75   4.3%      2    6/52
    hot_upper        hot              1752       33   1.9%     18    6/52
