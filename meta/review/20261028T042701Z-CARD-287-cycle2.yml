      numerator over an unprofiled denominator) IS satisfied, and my same-run
      re-derivation moves the share by one percentage point. But this is the
      card's own central lesson -- an instrument's domain is part of its figure
      -- failed in the first AC, and it has now survived two reviews: cycle 1
