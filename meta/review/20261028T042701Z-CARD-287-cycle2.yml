      is the board's rule, and the curve is the same method with a different
      summation -- which is why it agrees to 0.8 %, a suspiciously good
      agreement for two domains. I measured the saving with no count-x-ms
      model in it at all: three interleaved arms over the same 108 analyses
      in one process, the two routed call sites sent back to
      ast.get_source_segment by caller line, with a third arm that measures the
      dispatcher's own overhead instead of assuming it. The saving is 12.20 s
      (A - B', dispatcher overhead 0.23 s measured and removed), against the
      card's modelled 11.48 s -- the model is 5.9 % LOW, in the direction the
      card declares, and the implied in-situ cost of a bounded split is
      5.01 ms/call against the 4.730 ms measured in isolation. The claim
      survives; what is wrong is calling the curve a second domain.
    evidence: |
      Reviewer, committed blob 4d9a8977, venv python -I, worktree cwd,
      rival-pytest 0 at both ends, load 6.33 -> 4.05, hang env unset
