  # ---------------------------------------------------------------- new in cycle 2
  - id: F-101
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/pdf.py
    line: 57
    title: "The new shaping claim is an environment-local fact baked into shipped source, pinned by no test"
    description: |
      [FAMILY REGRESSION — same family as F-001: a pdf.py docstring asserting a
      checkable fact. Severity is far lower; the fact is true here.]

      pdf.py:57-58 reads: "Coverage is not the only boundary, either: this venv's
      Pillow reports ``features.check("raqm") == False``, so there is no
      complex-script shaping and no bidi."

      Verified true on this machine (Pillow 12.3.0: raqm False, harfbuzz False,
      fribidi False), and the consequence it draws is verified true as well (see
      F-001). The problem is the scope of the claim, not its truth. `features.check("raqm")`
      is a property of the *installed* Pillow build, not of this package: Pillow's
      binary wheels bundle Raqm on some platforms and not others. A reader who
      installs this package elsewhere reads "this venv's Pillow" as a statement about
      their own venv, where it may be false — and the paragraph's conclusion
      ("a name in either sets as isolated, unjoined letterforms in left-to-right
      order") would then be wrong in the user-visible direction, describing a defect
      the reader does not have.

      Nothing pins it. Every other checkable claim this card makes about the face has
      a test (test_the_notdef_comparison_can_actually_tell_tofu_from_a_glyph,
      test_a_cyrillic_header_sets_the_letters_and_not_notdef_boxes,
      test_the_separator_is_stroked_by_choice_now_rather_than_by_necessity,
      test_the_header_font_is_the_bundled_file_and_not_the_hosts). This one, added to
      fix a false docstring in a card whose own G-2 note says "this codebase treats a
      false docstring as a defect", is the only new factual claim with no pin.

      Not gating: the claim is hedged ("this venv's"), it is true where it was
      written, and the failure mode is a reader misreading an environment note — not
      wrong output.
    suggestion: |
      Either (a) reword so the claim is about the *class* of limitation rather than
      this install — "Pillow's complex-script shaping (Raqm) is optional and absent
      from some builds, this one included; where it is absent, DejaVu covers Arabic
      and Hebrew but a name in either sets as isolated, unjoined letterforms in
      left-to-right order rather than as tofu" — or (b) add a one-line test asserting
      `PIL.features.check("raqm") is False` with a docstring pointing at this
      paragraph, so the docstring goes red rather than stale on a Raqm-enabled build.
      (a) is cheaper and is what the rest of the module docstring's register does.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/pdf.py
    line: 308
    title: "The replacement weight justification names the right formula but the wrong mechanism and the wrong place in the range"
    description: |
      [FAMILY REGRESSION — same family as F-002, one rewrite later: the docstring's
      substance is now right, its attribution is newly wrong.]

      pdf.py:308-312: "its *weight* is ``max(1, round(size * _RULE_WEIGHT_RATIO))``
      (see the ``draw.line`` call below) — clamped to a minimum of one pixel and
      rounded to a whole one, so at the small end of the fitting range
      (:data:`_MIN_HEADER_FONT_RATIO`) the rule's thickness stops scaling linearly
      with size even though its length still does."

      The formula citation is exact (pdf.py:346-350) and naming it as the non-scaling
      term is the correction cycle 1 asked for. Two things it then says about that
      formula do not survive measurement:

      1. THE CLAMP IS UNREACHABLE. `max(1, ...)` binds only when
         round(size * 0.07) < 1, i.e. size < ~7.15. The fitting range is bounded
         below by pdf.py:337: `size = max(round(band.font_size * _MIN_HEADER_FONT_RATIO), ...)`,
         and `band.font_size` is not a free parameter — layout.py:426 sets it to
         `max(1, _mm_to_px(HEADER_FONT_MM))` = round(5.0 / 25.4 * 300) = 59 px,
         fixed by two module constants (HEADER_FONT_MM = 5.0, DPI = 300). So the
         floor is round(59/3) = 20, and round(20 * 0.07) = 1 already without the
         clamp. The clamp cannot fire for any header this code can draw; citing it
         as a cause of the non-linearity is the same class of unmeasured mechanism
         claim as the advance-width clause it replaced.

      2. IT IS NOT "AT THE SMALL END". The non-linearity is `round`, and rounding
         produces a staircase across the WHOLE reachable range, not a small-end
         effect. Measured over size ∈ [20, 59]:
           size 20-21 -> weight 1
           size 22-35 -> weight 2   (step at 22)
           size 36-49 -> weight 3   (step at 36)
           size 50-59 -> weight 4   (step at 50)
         Three steps, two of them in the upper half. The small-end plateau (20-21,
         two sizes) is in fact the NARROWEST of the four, so the sentence points at
         the least representative part of the range.

      Behaviourally harmless — the code is correct and unchanged, and G-2 alone
      already carries the decision. This is a docstring-accuracy finding in a
      docstring that exists to be accurate.
    suggestion: |
      Drop the clamp and the range-end localization; keep the measured part:
      "The stroke does have one property the glyph would not: its *weight* is
      ``round(size * _RULE_WEIGHT_RATIO)`` whole pixels (see the ``draw.line`` call
      below), so unlike the rule's length — and unlike a glyph's advance — it does
      not scale continuously with the type size but steps: 1px up to size 21, 2px to
      35, 3px to 49, 4px above, across the range the fitting can pick."
      If the `max(1, ...)` clamp is meant as defence against a future caller
      constructing a HeaderBand with a tiny font_size, say that instead of implying
      it fires today.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

