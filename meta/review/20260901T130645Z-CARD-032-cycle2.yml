      The new test pins the lower half only. Mutant B:

          @lru_cache(maxsize=8)
          def _header_font(size):
              try:
                  return ImageFont.truetype(io.BytesIO(_font_bytes()), size=size)
              except (FileNotFoundError, OSError):
