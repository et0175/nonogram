  - id: F-011
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/regrade.py
    line: 373
    title: "A dry run silently discards any work the caller had pending on the session"
    description: |
      `regrade`'s docstring says "The caller owns the transaction". The dry-run
      path then calls `session.rollback()` on it, which is not scoped to this
      function's own work — it discards the caller's entire uncommitted
      transaction.

      Demonstrated. Given a fresh session in which the caller has added an
      unrelated Puzzle and not yet committed, `regrade(session, dry_run=True)`
      followed by the caller's own `session.commit()` leaves 0 rows persisted.
      The caller's insert is gone, with no error raised and nothing in the
      report to say so. (The row does reach the database first — `session.query`
      autoflushes it — and is then rolled back with everything else.)

      Not reachable through the shipped routes: `regrade_preview` opens a fresh
      `session_scope()` and does nothing else with it. So this is a latent
      contract violation rather than a live bug, and it is what makes the
      rollback line untestable — the mutation check run on this cycle (deferred
      from cycle 1 by the cost ladder) found the mutant that deletes the
      rollback entirely SURVIVES the whole suite, because with no caller work
      and no assignments in dry-run mode there is nothing for it to undo.

      Found by the deferred certification, not by the fix delta: the line is
      unchanged since a3ab9dc. Cycle 2 is therefore still a clean confirmation
      of the fixes — this is the check that cycle 1 postponed doing its job.
    suggestion: |
      Scope the undo to this function's own work, which also makes it testable:
      wrap the loop in `with session.begin_nested():` and roll back the
      SAVEPOINT, or drop the rollback and state in the docstring that dry-run
      safety comes from the `not dry_run` gate rather than from an undo. If the
      rollback stays in any form, add the test the mutant would fail: a session
      carrying an unrelated pending row, asserted to survive a dry run.
    confidence: high
    source: static
