  - id: F-101
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_puzzle_frame.py
    line: 838
    title: "The new ast guard is blind to dataclasses.replace(spec, parity=...), an idiom already live in layout.py"
    description: |
      `_is_page_spec_call` matches only `PageSpec(...)` / `<anything>.PageSpec(...)`
      (tests/test_book_puzzle_frame.py:833-838). A module that produces a parity-bearing
      spec with `dataclasses.replace(DEFAULT_PAGE_SPEC, parity=PageParity.ODD)` is not a
      `Call` to `PageSpec` and is not seen at all.

      Demonstrated by execution, not argued. I added
      `src/nonogram/export/_review_probe_second_producer.py` twice and ran the guard:
        * with `PageSpec(width_mm=..., height_mm=..., parity=PageParity.ODD)` the guard
          FAILS, naming the new module and its line — the fix works for the shape it was
          written for;
        * with `dataclasses.replace(DEFAULT_PAGE_SPEC, parity=PageParity.ODD)` the guard
          PASSES. (Both probes removed; the working tree and all three touched files were
          checksum-verified back to 837075b afterwards.)

      The idiom is not hypothetical here: `src/nonogram/export/layout.py:1818` already
      writes `replace(page_spec, band_mm=two_bands_mm)` on a PageSpec, so the shape the
      guard cannot see is one this codebase already uses on this very type.

      The test's own docstring over-claims: "The day a second producer appears this fails,
      and the reading to take from it is *not* 'add the module to the allowlist'". It fails
      for one of the two ways a second producer can appear.

      Failure scenario: CARD-146 (or a poster/preview card) adds
      `replace(DEFAULT_PAGE_SPEC, parity=PageParity.ODD)` in `src/nonogram/export/`. That
      spec's `framed` is True, the sheet silently acquires a frame, the guard stays green,
      and the a4_golden tripwires do not fire because they only exercise DEFAULT_PAGE_SPEC
      itself. The exact silence F-004 was filed to end.
    suggestion: |
      Widen `_is_page_spec_call` to also match `replace(...)`/`dataclasses.replace(...)`
      calls carrying a `parity=` keyword (the rest of `_carries_a_parity` already handles
      the keyword analysis), and add the two shapes to
      `test_the_placed_page_walk_reads_a_parity_where_there_is_one` so the widening is
      itself pinned. Alternatively drop the "second producer is impossible" claim from the
      docstring and state what the guard actually covers.
    confidence: high
    source: static
