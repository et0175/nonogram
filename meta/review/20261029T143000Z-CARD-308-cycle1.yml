      node_id_refs: 23
    why_i_first_agreed_with_the_round: >-
      My first pass used the same line-oriented shape (match `tests:`, then walk
      `- item` lines) and reproduced 576 exactly. Agreement between two
      implementations of the SAME idea is not independence — which is the lesson
      of the round's own trie bug, and I nearly repeated it.
    what_settled_it: >-
      Re-derived trace.yml with a real parser (`yaml.safe_load`, walking every
      `tests:`/`test:` key at any depth). That gives 510 distinct trace refs —
      EXACTLY the orchestrator's figure. The regex route gives 494. 16 refs are
      dropped; 13 of them are also declared in requirements.yml so the union
      survives, and 3 are declared NOWHERE ELSE. 576 + 3 = 579.
    the_mechanism: "F-001"
    where_the_orchestrators_580_is_wrong: >-
      Its trace figure (510) is right and its shape is right. Its ADR-inline
      figure of 44 is an occurrence count, not a distinct-ref count: there are
      45 inline `check: {kind: test` occurrences in the ADR set resolving to 43
      distinct refs (one ref is declared 3 times, two are declared twice). 579 +
      1 = 580 is consistent with one ADR ref being double-counted into the
      union. So: round 576 (3 low), orchestrator 580 (1 high), measured 579.
    do_the_partition_counts_inherit_the_error: >-
      NOT TODAY, and this is luck rather than design. All 3 union-dropped refs
      are `TestBookPuzzleFrame_…` classes that are BOTH loose-alive and
      strict-alive (each has a real `class` in tests/test_book_puzzle_frame.py at
      :2127, :2323 and :2712), so each would land in the unpinned
      "both resolvers agree" class. Every one of the six pinned counts is
      unaffected. I re-derived all six independently and they are exact:
      BOOKKEEPING_ONLY 13, FALSELY_ALIVE 164, FALSELY_DEAD 13, HONEST_DEAD 30,
      RESOLVED_FROM_AFAR 4, SAME_FILE_PROSE 16.

