      plausible definition' — survives this deletion.
    method: >-
      Deletion at the detector's input surface: the def line's NAME removed
      (replaced by a same-length non-matching def), which is exactly what
      `git grep -nE '^[[:space:]]*(def|class)[[:space:]]+[A-Za-z_]'` no longer
