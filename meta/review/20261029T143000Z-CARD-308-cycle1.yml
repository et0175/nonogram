score_rationale: >-
  7.5. The work is well above this board's median: the derivation is the first
  one on this card that reads all four authorities, the two resolvers are
  genuinely independent, the cross-check against real `git grep -lw` bites on
  exactly the bug that nearly made the instrument silent, the count+digest
  choice is the correct answer to G-2, and I could not defeat the gate through
  the mechanisms the brief pointed me at — the prefix collision is caught, the
  edge mutant kills, the signal-loss mutant kills through the real sync
  protocol. The round also narrowed its own overstatement in a commit when its
  own control refuted it, which is the discipline the card is about.
  It is held below 8 by one finding, not by a tally. F-001 is not a figure slip:
  the module's central claim is that its self-check covers EVERY ref in the
  model, that claim is the whole answer to the CARD-291 lesson, and it is false
  by 3 refs because of a parsing bug that drops 16 trace.yml refs without
  raising — in a module whose cited rule (ADR-0039/R2, mandatory) makes a shape
  it cannot analyse a FAILURE rather than a silent pass. I demonstrated the
  consequence rather than arguing it: with a dropped ref spelled whole in the
  module, the suite is green while git grep confirms the module resolves it.
  A detector that can revive a model ref while reviewing the card about refs
  being revived has to be fixed before it lands, and the fix is small — a raise
  instead of a break, then re-derive six baselines that I expect not to move.
  Everything else is non-gating: F-002 and F-005 are hardening, F-003 and F-008
  are prose, F-004 is figures, F-006 and F-007 belong to other cards.

