  - id: F-007
    severity: informational
    confidence: high
    title: "The unreproduced LeakedPatch — explanation sufficient, and it is kill_matrix.py's, not this card's"
    verdict: "the round was right not to bury it, right about the cause, and right that it is out of scope"
    proven_from_source_rather_than_by_racing_it: >-
      KillMatrix._apply (tests/kill_matrix.py:1345) does `path.write_text(...)`
      on the REAL TRACKED PATH, and the only restore is a `cp -p` from a backup
      in a `finally` (_restore, :1057). So a window provably exists in which the
      tracked working-tree file holds the mutant. A concurrent `git status` in
      that window necessarily prints `M <path>`, and a `git diff` taken after the
      restore prints nothing — which is exactly the observed pair. No race needed
      to establish it.
    observed_live_this_round: >-
      During my own impact run, `pgrep` caught the suite inside
      tests/test_kill_matrix.py spawning a nested pytest with
      `-p kill_matrix_plugin` against
      tests/test_db_engine_lifecycle.py::TestEngineLifecycle_... — the same
      module and the same instrument as the reported incident. I sampled
