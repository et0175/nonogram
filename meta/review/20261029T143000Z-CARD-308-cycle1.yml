      window is short; the source argument above does not depend on catching it.
    the_LeakedPatch_at_1255: "is the 'SHIPPED reached no assertion node' fail-closed branch, i.e. the instrument refusing a vacuous baseline — not evidence of a corrupted tree."
    the_residual_hazard_worth_a_card: >-
      tests/kill_matrix.py READS the full-suite lock but states at :96 that "it
      never writes a lock anywhere". So nothing serialises its plant window
      against a concurrent `git add` / `git commit` from another session — and
      with three cards in flight that is a live condition, not a hypothetical. A
      commit taken inside the window would capture a mutant in a tracked source
      file. The precedent for the fix already exists in this repo
      (meta/kanban/.full-suite.lock + tests/full_suite_lock.py). Recommend a card
      against kill_matrix.py; explicitly NOT CARD-308's.

