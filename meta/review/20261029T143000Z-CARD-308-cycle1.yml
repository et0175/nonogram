  - "Two genuinely independent resolvers, with the loose one cross-checked against the real `git grep -lw`. I reproduced the `?`-binding bug it was built to catch and confirmed the control covers all three affected refs exhaustively."
  - "Count+digest instead of a ref list is the correct answer to G-2 and I could not find a way to make a pinned class lie. The signal-loss mutant reds through the real sync mechanism with no author involvement — the strongest result in the diff, and it was not in the round's own evidence."
  - "The G-2 self-check's design decision — apply the trie to the file's own text, not through git ls-files — is subtle, correct, necessary, and was found by the round itself. It also holds the tracked half."
