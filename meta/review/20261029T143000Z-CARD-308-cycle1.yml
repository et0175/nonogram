    what_is_genuinely_right: >-
      Routing the check through Path(__file__).read_text() instead of the
      tracked-file pass is correct and necessary — git ls-files cannot see an
      untracked file, so the tracked route passes vacuously for exactly as long
      as the file is new. The round found this itself. It also asserts the
      tracked half, so both states are covered.
    does_the_ellipsis_truncation_survive_a_prefix_collision:
      answer: "The DEVICE does not. The SELF-CHECK does, and that is what matters."
      measured_against_git_grep_itself: >-
        Not reasoned. In a throwaway git repo containing the line
        `alpha ZZPrefix…Tail here`, `git grep -lw ZZPrefix` returns the file and
        exits 0. So U+2026 is a NON-word character to git's -w, which means `…`
        terminates the token: writing `Foo…Bar` leaves `Foo` fully matchable.
        The docstring's reasoning ("… is not a word character, so git grep -w
        cannot complete the token") is true of the WHOLE token and is the wrong
        safety argument in general, because it exposes every prefix.
      does_the_self_check_catch_it: >-
        YES, proven by mutant. _trie_pattern's lookaround is
        (?<![A-Za-z0-9_])...(?![A-Za-z0-9_]), which treats `…` as a boundary
        exactly as git does. Inserted `TestExport_RejectsUnverified…ForPDF`
        (whose prefix IS a declared ref) into the module docstring ->
        test_this_module_resolves_no_verifying_ref_at_all RED, naming the
        prefix. 1 failed, 16 passed. Restored, blob re-verified.
      state_of_the_board_today: >-
        5 truncated tokens in the module; NONE has a declared-ref prefix
        (measured). The board has exactly 3 prefix-shaped ref pairs. So the
        module is safe today by mechanism, not by luck — but a future author
        reading the docstring's reasoning will truncate at a prefix and be
        caught by the self-check rather than warned by the prose. Asked for as
        a docstring correction, not a code change.
    is_the_un_split_control_real:
      node: "tests/test_check_ref_resolution.py::test_the_two_pinned_refs_are_spelled_in_pieces"
      verdict: "YES — and it reds 5 cells, not 4."
      mutant: "see mutants.M3"

  2_is_count_plus_digest_a_measurement_or_a_tripwire:
    short_answer: >-
      The DETECTION is enforced and I proved it. The JUDGEMENT — repair vs
      signal loss — is only documented, and the failure message hands over the
      paste-ready line, which lowers the cost of the lazy fix rather than
      raising it. So: a real measurement with an undisciplined response path.
    detection_is_enforced_proof: "see mutants.signal_loss — the card's exact headline mechanism reds 2 cells"
    is_order_sensitivity_handled: >-
      YES. _fingerprint joins `sorted(refs)` before hashing; verified
      empirically that fingerprint(refs) == fingerprint(reversed(refs)).
    does_the_message_let_a_reader_decide_repair_vs_signal_loss: >-
      Partly. It prints the full class — each ref with who declared it, what
      resolved it and where it is defined — which IS enough to decide, because
      "resolved by" names the review YAML or the state log. The round's claim
      here is true. But it also prints the exact paste-ready baseline line, so
      the cheapest action available to a reader is the one the card forbids.
    is_the_rule_enforced_anywhere_or_only_written_down: >-
      ONLY WRITTEN DOWN, in _assert_class's message. Nothing records WHY a
      baseline moved: no provenance field, no assertion that a shrink was
      accompanied by a new def/class, no second artefact. The six pins detect
      every transition, so nothing can move unseen — but nothing stops the next
      card re-running and pasting six new digests.
    cheapest_repair_available: >-
      Make each baseline a 3-tuple (count, digest, why_it_last_moved) and assert
      the third element is non-empty. A reader then cannot update a digest
      without writing a sentence, and the sentence is reviewable. ~6 lines. This
      is a recommendation, not a gating requirement.

