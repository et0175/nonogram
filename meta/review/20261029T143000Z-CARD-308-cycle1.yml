# =====================================================================
# FINDINGS
# =====================================================================
findings:

  - id: F-001
    severity: gating
    confidence: high
    title: >-
      The derived ref set silently drops 16 trace.yml refs at 3 sites, and the
      G-2 self-check is blind to exactly those — measured false green
    rule: "ADR-0039/R2 (mandatory, derived set / unanalysable shape is a FAILURE) and ADR-0039/R1 (a claim must be narrowed to what is measured)"
    where: "tests/test_check_ref_resolution.py, the trace.yml `tests:` block scan inside _declared_refs()"
    mechanism: >-
      The block scan walks `- item` lines and `break`s on the first line that is
      not one. Three `tests:` blocks in trace.yml carry `#` COMMENT lines INSIDE
      the list, so the scan stops there and every item after the comment is
      dropped — silently, with no exception and no record.
    blocker_sites:
      - "meta/architecture/trace.yml:306 `tests:` -> blocked at :313 by `# AC-117 named ...` -> 1 item dropped"
      - "meta/architecture/trace.yml:1732 `tests:` -> blocked at :1734 by `# AC-190's test is GONE as a class ...` -> 11 items dropped"
      - "meta/architecture/trace.yml:2032 `tests:` -> blocked at :2045 by `# AC-252 RETIRED 2026-10-18 ...` -> 7 items dropped"
    measured: >-
      Regex derivation: 494 distinct trace refs. `yaml.safe_load` over the same
      file, walking every `tests:` key: 510. 16 dropped. 13 are also declared in
      requirements.yml so the union absorbs them; 3 are declared nowhere else,
      so the model's true distinct ref population is 579, not 576.
    why_it_is_gating_rather_than_a_figure_slip: >-
      It makes the card's CENTRAL property false. test_this_module_resolves_no_
      verifying_ref_at_all claims, in its docstring and in the module's G-2
      section, to assert "over EVERY ref in the model rather than over the two
      this file names", and that is the whole answer to the CARD-291 lesson. It
      covers 576 of 579. REPRODUCED: with a dropped ref spelled as a whole token
      in the module, the suite is 17 passed while real `git grep -lw` confirms
      the module is one of that ref's resolvers (mutants.G2_derivation_blindness).
      The module can revive a model ref while reviewing the card about refs being
      revived, which is the defect eating its own reviewer — one layer further in
      than the four instances already on the card.
    why_the_guard_cannot_see_it: >-
      Both candidate witnesses use self-referential or floor comparisons:
      test_every_declared_ref_lands_in_exactly_one_class compares to
      `len(_verdicts())` (shrinks with the drop), and
      test_the_derivation_reads_all_four_authorities asserts `> 500` against 576.
      Neither can witness 16 refs going missing.
    mitigation_stated_honestly: >-
      No signal is lost on this board TODAY. All 3 union-dropped refs are
      loose-alive AND strict-alive (real `class` definitions at
      tests/test_book_puzzle_frame.py:2127, :2323, :2712), so all six pinned
      class counts are unaffected and I re-derived every one of them as exact.
      The hole is in the mechanism, not yet in the figures — but a retired ref
      inside one of those three blocks is precisely the shape that would be
      dropped next, and two of the three blockers are comments ABOUT retired
      tests.
    repair: >-
      Default-deny, which is what R2 asks for and needs no new dependency: inside
      a `tests:` block, a line that is neither a `- item` nor the end of the
      block should raise RefShapeNotClassifiable rather than terminate the scan.
      Skipping comment and blank lines and continuing is the permissive variant
      and is also acceptable, but the raise is the one that matches the module's
      own stated discipline. Then re-derive all six baselines and say in the
      commit that the population moved 576 -> 579 for a parsing reason, not a
      board reason. Expect the pinned counts to be unchanged.
    reproduce: >-
      `python -I` importing tests/test_check_ref_resolution, compare
      {d.ref for d in _declared_refs()} against a yaml.safe_load walk of
      trace.yml; then insert the whole token of any of the 3 into the module and
      observe 17 passed.

  - id: F-002
    severity: non-gating
    confidence: high
    title: >-
      Count+digest pinning is a real measurement with an enforced detector and an
      unenforced response — the failure message hands over the paste-ready line
    see: "called_out.2"
    where: "tests/test_check_ref_resolution.py, _assert_class's message, and the six module-level baselines"
    measured: >-
      Detection is enforced and I proved it on the real mechanism
      (mutants.signal_loss: 2 cells red). Digest is order-insensitive (sorted
      before hashing; verified against a reversed input). The gap is the response
      path: the message prints `LABEL = (count, digest)` ready to paste, nothing
      records why a baseline moved, and no assertion ties a SHRINK to a newly
      found def/class.
    the_rounds_own_note_is_half_right: >-
      "The baselines move whenever a sync changes a class — that is the feature"
      is true and is the right instinct. What does not follow is that the
      response is disciplined. The card's rule — a class shrinking because a
      review report was synced in is signal loss, not a fix — exists only as
      English inside a failure message.
    recommendation: "make each baseline (count, digest, why_it_last_moved) and assert the third element is non-empty. ~6 lines."

  - id: F-003
    severity: non-gating
    confidence: high
    title: >-
      The `…` truncation device is documented as the safety property but is not
      one; it protects the whole token and exposes every prefix
    see: "called_out.1"
    measured: "`git grep -lw ZZPrefix` matches `ZZPrefix…Tail` (exit 0) in a throwaway repo — `…` terminates the token for git's -w"
    today: "0 of the module's 5 truncated tokens has a declared-ref prefix; the board has 3 prefix-shaped ref pairs"
    covered_by: "the self-check, proven by mutant (mutants.G2_prefix_collision) — the trie's lookaround has the same boundary semantics as git -w"
    recommendation: >-
      Correct the docstring so the stated reason for safety is the self-check and
      not the ellipsis, and say that a truncation must not be cut at a point
      where the prefix is itself a ref. Prose only; no code change.

