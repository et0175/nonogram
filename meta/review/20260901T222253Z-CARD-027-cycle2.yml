  - id: F-202
    severity: medium
    category: tech-debt
    type: gap
    file: tests/property/test_grid_dimensions.py
    line: 412
    title: "F-002's second cited evasion still slips: a public class attribute with no annotation is not an offence, because the field branch matches only `ast.AnnAssign`"
    description: |
      Cycle-1 F-002 cited and verified TWO shapes:

        def generate(key, size, rng): ...   -> SLIPPED
        class Request:
            size = None                      -> SLIPPED (no AnnAssign)

      The fix commit's message enumerates five evasions and claims all five are
      now caught; the class-attribute one is silently absent from that list.
      Re-probed on this head against the shipped `_scalar_extent_offences`:

        def generate(key, size, rng): ...          -> CAUGHT
        class Request:  size = None                -> SLIPPED
        @dataclass
        class Request:  size = 30                  -> SLIPPED

      The cause is structural, not in `_annotation_is_int`: the class branch
      (lines 411-424) is guarded by `isinstance(statement, ast.AnnAssign)`, so
      a bare `Assign` never reaches the resolver at all. The new docstring's
      headline rule — "**an absent annotation counts as a hit**" — is therefore
      true on the parameter path only, and the fix delivered exactly half of
      the rule it declares.

      This is a live shape in this codebase, not a hypothetical: an ast scan of
      `src/nonogram/**` finds 11 bare public class Assigns today
      (`cli.py:78-83` ExitCode members, `difficulty.py:166-168` Tier members,
      `web/handler.py:131,140` `server_version`/`timeout`). A later card adding
      `size = 30` beside any of them reintroduces a scalar-extent public field
      with a green suite — and CARD-028, which owns the web form's extent
      field, is the very next card and edits `web/`.
    suggestion: |
      Extend the class branch to bare `ast.Assign` targets: an unannotated
      public class attribute whose name is in `_SCALAR_EXTENT_NAMES` is an
      offence on the same principle the parameter path now uses. Then reflect
      it in the card's STRUCTURE entry (see F-203).
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-203
    severity: medium
    category: tech-debt
    type: gap
    file: meta/kanban/cards/CARD-027.md
    line: 288
    title: "The STRUCTURE entry describing the R1 guard now contradicts the guard in two checkable ways, and cycle-1's F-002 fix was supposed to update it"
    description: |
      The entry (lines 286-297) states the guard "bans a scalar-extent name
      (`size`, `grid_size`, `edge`, `edge_length`) as an `int`-annotated
      parameter of a **public** function ... Two deliberate exclusions ...
