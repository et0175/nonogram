  - id: F-205
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_grid_dimensions.py
    line: 338
    title: "\"Absent annotation is a hit\" crossed with `n`/`side` in the name set gives the guard a plausible false-positive surface"
    description: |
      The riskier half of the fix was checked, and the tree is genuinely clean
      rather than accidentally clean: an ast scan of every `src/nonogram/**/*.py`
      finds exactly two unannotated public parameters — `cls` on
      `solver/propagate.py:387` and `:477` (`blank`) — and `cls` is not in
      `_SCALAR_EXTENT_NAMES`. Nothing in the package is one rename away from
      firing.

      But the rule WILL fire on ordinary future code, because the name set
      includes `n` and `side`. Probed against the shipped scanner:

        def chunk(items, n): ...      -> CAUGHT ("chunk(n: int) takes a scalar extent")
        def draw(canvas, side): ...   -> CAUGHT
        def generate(size=None): ...  -> CAUGHT (default, no annotation)

      `n` in a public helper is a normal thing to write and has nothing to do
      with a grid. The failure is loud, not silent, and the fix (annotate, or
      rename) is trivial — but the reason will not be discoverable from the
      card, which does not mention the rule at all (F-203) or that `n` is a
      banned name. That is the whole cost of this finding: a future red suite
      whose explanation lives only in a test docstring.
    suggestion: |
      Either narrow the absent-annotation rule to the four unambiguous
      grid-extent names (`size`, `grid_size`, `edge`, `edge_length`) and keep
      `n`/`side` annotation-gated, or leave it and say so in the STRUCTURE
      entry alongside F-203's rewrite, with the one-line remedy.
    confidence: high
