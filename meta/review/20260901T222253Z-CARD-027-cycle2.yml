      Two clauses are refutable against the code as it now stands:

      (a) "`int`-annotated parameter" — FALSE after the fix. An *unannotated*
          public parameter is now an offence (`_annotation_is_int(None)`
          returns True; probed: `def generate(key, size, rng)` -> CAUGHT). The
          delta changed the rule and did not change the sentence that states
          it. Cycle-1's F-002 suggestion said in as many words: "record the
          change in the STRUCTURE entry so the declared exclusion list matches
          the code." The delta touches CARD-027.md twice — failure-matrix row 8
          and the stale-text note — and not this entry.

      (b) The name list is four; `_SCALAR_EXTENT_NAMES` (line 338) is six —
          it also contains `side` and `n`. This half predates the delta (cycle 1
          missed it), but it is the same defect and the same fix.

      Weight: this is the sentence CARD-028/030/031/033 read to learn the local
