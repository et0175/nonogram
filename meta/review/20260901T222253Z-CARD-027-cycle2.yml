    file: tests/property/test_grid_dimensions.py
    line: 356
    title: "The entire cycle-1 guard fix is unpinned — reverting `_annotation_is_int` verbatim to the pre-fix implementation leaves the whole suite green"
    description: |
      The fix rewrote `_annotation_is_int` from string equality to an ast walk,
      but added no test asserting any of the newly-covered shapes. The two
      guard-meta tests were not touched by the delta:
      `test_the_scalar_extent_guard_would_catch_a_violation` uses a fixture
      spelled only `size: int`, `size: int | None = None`, `-> int | None` —
      all four of which the OLD four-string allowlist already matched — and
      `test_the_scalar_extent_guard_leaves_the_two_declared_exclusions_alone`
      only asserts non-firing.

      Mutation-verified, both directions, on this head:

        M1  `_scalar_extent_offences` gutted to `return []`
            -> KILLED (test_the_scalar_extent_guard_would_catch_a_violation
               fails: `assert 0 == 3`). The teeth test still has teeth.
        M2  `_annotation_is_int` body replaced verbatim with the pre-fix
            `return node is not None and ast.unparse(node) in {"int",
             "int | None", "None | int", "Optional[int]"}`
            -> SURVIVED. `pytest tests/property/test_grid_dimensions.py` is
               fully green with the fix undone.

      So the guard's teeth test protects against a *scanner* that matches
      nothing, but not against the *annotation resolver* regressing to exactly
      the state cycle 1 rejected. All five cycle-1 evasions reopen silently.
      The card is `Complexity: architectural` and its own STRUCTURE notes say
      CARD-028/030/031/033 copy this file's structure — an untested guard is
      the worst thing to hand four downstream cards, because they will copy the
      confidence, not the coverage.

      (Working tree restored and verified byte-identical after both mutants:
      sha1 0b7e52b9a41229a1ff3affc76df820a8e459c905, `git status --porcelain`
      empty, full suite re-run 1461 passed / 1 xfailed.)
    suggestion: |
      Add a table-driven test over the shapes the docstring claims — a hit case
      per bullet (`typing.Optional[int]`, `Annotated[int, 'cells']`,
      `builtins.int`, the string `'int'`, an unannotated `size`) and a miss case
      per exclusion (`float`, `Point`, `print`, a private helper). Written as a
      `pytest.mark.parametrize` over `(source, expected_offence_count)` feeding
      `_scalar_extent_offences`, it costs ~20 lines and makes M2 fail.
    confidence: high
