  - id: F-206
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_grid_dimensions.py
    line: 356
    title: "Remaining routes a later card could use to reintroduce square-only code past the R1 guard"
    description: |
      Attacked fresh, not by re-running cycle 1's five. Each probed against the
      shipped `_scalar_extent_offences` on this head:

        SLIPPED  Size = int                        ; def generate(size: Size)
        SLIPPED  S = TypeVar('S', bound=int)       ; def generate(size: S)
        SLIPPED  Cells = NewType('Cells', int)     ; def generate(size: Cells)
        SLIPPED  def generate(size: Literal[10, 20])
        SLIPPED  if TYPE_CHECKING: from builtins import int as Cells
                                                    ; def generate(size: Cells)
        SLIPPED  Extent = NamedTuple('Extent', [('size', int)])   (functional form)
        SLIPPED  Extent = TypedDict('Extent', {'size': int})      (functional form)
        SLIPPED  size: int = 30                    (module-level AnnAssign, outside a class)
        SLIPPED  def generate(*size: int, **kw: int)  (vararg/kwarg not scanned)
        CAUGHT   class Extent(NamedTuple): size: int              (class form)
        CAUGHT   def generate(size: 'int | None')                 (stringized union)

      All the SLIPPED rows share one cause with F-202: the guard resolves the
      annotation's own syntax tree and never resolves a *name binding*, so any
      indirection through an alias defeats it. The alias route
      (`Size = int`) is the realistic one — it is a normal readability move and
      it would pass review as a green suite. The TypeVar/NewType/Literal/
      TYPE_CHECKING rows are lower-probability. `*args`/`**kwargs` and
      module-level annotations are cheap to close (`node.args.vararg`,
      `node.args.kwarg`, a module-level `AnnAssign` pass).

      Filed Minor rather than Important because none of these is a defect in
      the shipped source and closing all of them is not proportionate; the
      point is that the guard should be documented as best-effort so the four
      cards that copy it do not treat a green run as proof.
    suggestion: |
      Close the two cheap ones (vararg/kwarg, module-level AnnAssign) and add a
      one-paragraph "what this guard cannot see" note to the docstring naming
      the alias route, so a downstream card knows the guard is a net, not a
      proof.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
