  SHIPS_UNREVIEWED:
    - "The full suite. Instructed not to run it; 36 impact modules were run instead. The merge gate is the backstop, and this card's own subject makes a cross-tree warning-count comparison unsound, so the merge gate must re-derive, not compare."
    - "The forge-side repair in forge_1's validators/utils.py — G-1, out of scope by the card's own design. This card ships a DETECTOR. Nothing in it changes what the validator reports, and that is stated in the module's first paragraph and in ADR-0039."
    - "CARD-307's and CARD-315's branches. CARD-307 owns the one-line pointer repair for ADR-0006/R1 and the node-id refs; CARD-315 owns kill_matrix.py's plant window. Neither was opened here."
