      what: >-
        _refuse_unexplained_departures' docstring claims the withdrawal
        residual "is reported here as a count so the two cases are never
        confused". Measured false when withdrawal is the ONLY departure.
      measurement: >-
        The `withdrawn` count is interpolated into the assertion MESSAGE, and
        the assertion only fires when `losses` is non-empty. Driven directly:
        with the stored set augmented by one digest matching no declared ref and
        no other departure, the helper returns SILENTLY — green, and nothing
        reported at all. The module's own case-4 control asserts only that it
        does not raise, so the claim has no control that could fail in the
        direction it is about, which is ADR-0039/R1's own subject. The residual
        IS still distinguishable (it moves CENSUS, pinned exact), so the safety
        argument holds; only the "reported" half is wrong. Fix: narrow the
        sentence, or emit the count unconditionally.
    - id: F-005c3
      what: "Figures in the brief I measured to be wrong."
      items:
        - claim: "the runtime band 7.9–16.4 s"
          measured: >-
