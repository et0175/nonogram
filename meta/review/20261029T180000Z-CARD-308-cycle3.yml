    - "Everything cycle 2 marked owed and this round did not take: cycle 2's `pin the both-agree class as a seventh baseline` (2 lines, readability only — and F-003c3 is the sharper version of the same point), and the one sentence owed in ADR-0006 itself. The ADR-0006 sentence WAS taken (I read the diff: the comment block above R1's `check:` now states the pointer is dead while the rule is tested, names the real test, and warns against the overstatement) — so of cycle 2's owed items only the both-agree pin is unreviewed, and it buys no detection."

note_on_the_briefs_gating_rule:
  the_rule_as_the_brief_states_it: >-
    "Per ADR-0039/R2, each must be classified or raise — never silently
    collected and never silently skipped. A region misclassification that
    INVENTS a ref is gating; one that DROPS a real one is gating; one that REDS
    ON PROSE is gating."
  applied_literally: >-
    F-001c3(a) silently collects (invents), (b) and (d) silently skip, (c) reds
    on prose. Under the brief's letter, all four are gating and the verdict is
    BELOW THRESHOLD.
  why_i_did_not_apply_it_literally: >-
    The brief's rule is written about LIVE shapes, because that is what cycle
    2's gating finding was: a shape class present in the authority set, with the
    derivation missing it and the self-check reporting CLEAN. I measured each
    of my four against the real authorities and all four are latent — 0 `~~~`
    fences, 0 odd fence parities, 0 quoted declaration keys, 0 commented
    block-scalar openers. Two of the four additionally red an exact pin. A
    latent generalisation of a closed rule is a hardening note, not the same
    defect, and treating it as gating on the third and final cycle would ship
    the card UNREVIEWED rather than DECLARED, which is strictly worse for the
    board.
  the_lever_for_the_owner: >-
    If the owner applies the letter, the verdict is 7.5 / DOES NOT CERTIFY and
    F-001c3 ships unreviewed with max_cycles already reached. If the owner
    accepts the measurement, the verdict is 8.0 / CERTIFIES and F-001c3 ships
    DECLARED with its four shapes, its four measurements of latency, and a
    ~10-line repair. I recommend the second and have stated the first so the
    choice is not mine alone to make silently.

# =====================================================================
# THE FIVE THINGS THE BRIEF ASKED TO BE CALLED OUT
# =====================================================================
called_out:

  1_is_the_region_notion_total:
    short_answer: "NO. Four shapes, all latent. See F-001c3 for each, with the shapes that are correctly handled stated beside them."
    how_i_drove_it: >-
      A harness in the scratchpad that imports the module and rebinds ADR_DIR,
      REQUIREMENTS and TRACE at the module object to a synthetic authority set,
      then writes one shape at a time and asks: was the planted ref COLLECTED,
      was something INVENTED, was it SILENTLY SKIPPED, or did it RAISE. The
      clean synthetic set was derived first and its four refs asserted, so a
      harness that raised on everything could not have produced the table.
      Thirteen region shapes plus eight block-scalar indicator variants; then
      each hole's liveness checked against the real authorities by grep.
    the_direction_that_matters_most: >-
      INVENTION, and it is the one the round names as "worse for a census"
      while reporting it closed. The repair that closed it — collection scoped
      to the same _declaration_key_lines as the refusal — is correct and I
      verified it works for a recognised block scalar. It inherits the region's
      own boundary, so it fails exactly where _BLOCK_SCALAR fails to recognise
      an opener, and `key: >- # a note` is such an opener.

  2_does_the_26_shape_matrix_control_the_right_lines:
    answer: "YES for 20 of 26, verified line by line; NO line at all for the other 6, verified."
    method: >-
      For each shape, the line index the planted declaration key actually
      occupies in the written file was computed independently, and compared
      against the line number parsed out of the refusal message. 20/20 key-route
      matches. 6/6 form-route name no line.
    is_the_missing_line_acceptable_or_a_declared_defect: >-
      A DECLARED DEFECT, low severity, with the measurement that splits it:
      the form refusal quotes the offending text verbatim and names the
      declaring authority, and for FIVE of the six shapes that text is a unique
      grep handle. For the sixth — `test: >-` — it quotes `'>-'` and nothing
      else, which on a registry with 152 block scalars is no handle at all, and
      there the brief's framing is exactly right. ~2 lines to close all six by
      carrying the line in Declared.sources. See F-002c3.
    and_the_four_legal_shapes: >-
      A genuine non-vacuity floor, proved with a mutant rather than accepted:
      a derivation that raises on any planted file passes the clean baseline and
      all 26 negatives and is caught ONLY by the legal block. The matrix is not
      a set of negatives in search of a positive.
    one_weakness_worth_a_line: >-
      The key-route assertion in the module's own loop checks only that the
      refusal mentions the authority's FILENAME. It does not check the line
      number, which is the half this card's whole subject is about. My
      instrumentation checked it and it is correct for all 20 — but the control
      does not, so a regression that lost the line number would keep the cell
      green. One `assert str(want_line) in str(refusal)` would close it.

  3_is_the_partition_arithmetic_a_real_closure:
    answer: "NO — a balancing restatement. See F-003c3, with the 2000-population identity test and the count-preserving swap."
    but: >-
      The conclusion it is offered as a reason for is TRUE, and the digests are
      what make it true. Detection is closed for all four classes. Naming is
      not, and the round says so. So the DECISION to scope per-member digests to
      two of six classes is RIGHT; the ARGUMENT given for it is partly vacuous
      and should be replaced by the one sentence that is not.

  4_does_the_digest_replay_reproduce_and_name_both:
    answer: "YES, exactly. Reproduced verbatim, not accepted."
    what_came_out: >-
      It raises, says the class lost 2 members and that 2 of them left WITHOUT
      gaining a def/class while still reading as alive to the validator, calls
      it SIGNAL LOSS, names BOTH refs, prints each one's single resolver
      (meta/review/20261029T130000Z-CARD-285-cycle1.yml, the same file for
      both) and prints `defined at (nowhere)` for each. It also states that the
      refs were named by re-deriving the 580-ref population and that no ref is
      stored in the module.
    and_the_fourth_case: >-
      GREEN as claimed, and NOT reported — F-004c3. The honest residual is
      distinguishable (it moves the exact CENSUS pin) so the safety argument
      holds; the docstring's "reported here as a count" is false when
      withdrawal is the only departure.

  5_every_figure_re_derived_at_3fab6828:
    see: "three_way_split.VERIFIED, and F-005c3 for the two I found wrong"
    summary: >-
      20+ figures re-derived; two wrong, both in the brief (the runtime band's
      cold case, and the impact-set base). None wrong on the card or in the
      module at HEAD.

  6_did_the_stash_window_leave_residue:
    answer: "NO, and I checked three ways rather than one."
    evidence: >-
      The working copy's blob equals HEAD's blob
      (384900802ec28b4eb30e6dfd4b8069de38d2a2ff from both `git rev-parse
      HEAD:<path>` and `git hash-object <path>`); `git status --porcelain` lists
      no tracked modification, and none under tests/ even with
      --untracked-files=all; and `git stash list --date=iso` holds four entries
      whose NEWEST is dated 2026-09-23, so nothing from 2026-10-29 survives in
      the stash. The round's remediation is complete and its figures come from
      the clean tree. Reporting the error honestly and leaving no residue are
      different claims and both now hold.

  7_what_i_measured_to_be_WRONG:
    in_the_brief: >-
      Two figures — the runtime band's cold case (18.47 s outside 7.9–16.4) and
      the impact-set base (`--base 3fab6828` yields 0, not 31). Plus one framing
      softened: the requirements.yml frame names no line but does name a unique
      quoted string.
    in_the_card: >-
      Nothing measured wrong at HEAD. The retraction is sound and its honest
      reading reproduces exactly. Every figure fix round 2 corrected was right.
    in_cycle_2s_report: >-
      Two of its figures are now STALE rather than wrong, and both were correct
      for its tree (3f3012a4): the 44-occurrence / 43-distinct ADR reading (45
      / 44 at HEAD) and the eight baselines at the cut. Its 404 arithmetic was
      right in the parts and missing the 7-ref overlap that reconciles them,
      which fix round 2 supplied. Its F-002c2 and F-005c2 were both built and
      both are now in the module and working, which I verified.
    in_the_round_itself: >-
      One claim: the partition arithmetic as a closure (F-003c3). One docstring
      sentence: the withdrawal residual "is reported" (F-004c3). One scope
      claim: the region notion's totality (F-001c3). Nothing it reports as
      measured came out wrong.

