score_rationale: >-
  8.0. Cycle 2's single gating finding is closed, and closed better than it was
  asked to be: one shared notion of where a declaration lives feeds both the
  collection and the refusal, so the two halves cannot drift, across all four
  authorities rather than the one that was caught. I verified that with mutants
  instead of accepting it — muting the refusal reds the control on the first
  shape, and a derivation that raises on anything planted is caught only by the
  four legal shapes, so the floor is real. The matrix controls the right lines
  for 20 of 26 and I checked each line number against where the key actually
  sits. The digest replay is the strongest evidence on the card and it
  reproduces verbatim: both departed refs named from a digest alone, SIGNAL
  LOSS, `defined at (nowhere)` twice. Every figure the brief listed re-derives
  exact at HEAD, including the ones that moved under main's merge; the two
  departed refs are re-derived against a def/class and against the cut's own
  tree; CENSUS 579->580 is proved to be exactly one ref by diffing the cut's
  authorities out of tree; the retraction's honest reading (0 errors, 100
  warnings, 23 no-definition) is confirmed on the named binary; and the stash
  window left no residue by three independent checks. Two of the round's own
  conclusions I had to correct are small and both are statements, not
  mechanisms.
  It is held AT 8.0 rather than higher by F-001c3: the region notion that the
  whole repair now rests on is not total, and one of its four shapes reproduces
  the invent-a-ref failure the round reports as closed — a legal YAML block
  scalar whose opener carries a trailing comment is not recognised as an opener,
  so a prose line in its body beginning `test: ` is collected as a declared ref
  with nothing raised. That direction is structurally outside the default-deny's
  reach, because the default-deny fires only where no narrow pattern claims and
  invention happens exactly where one does. It is not gating here because all
