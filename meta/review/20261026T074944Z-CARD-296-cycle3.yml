  - id: F-302
    severity: major
    title: >-
      AC-4's declared residue is not the residue — a complete second ruled grid
      is still drawable with 265 + 715 green, through a ``Layout``-ANNOTATED
      dataclass field, and five more routes escape at helper level
    file: tests/test_book_guide_page_vector.py
    line: 585
    gating: true
    confidence: high
    evidence: >-
      The closure is real for both shapes cycle 2 measured and all three arms are
      load-bearing (see previous_findings/N-2). The defect is the paragraph
      beside it, which enumerates "three routes remain, each measured" and closes
      with "All three are the same shape: a receiver whose type a syntactic walk
      cannot establish". MEASURED LIVE, in the real module, restored and
      sha256-verified against
      5aafde43d4eefe4ab4d17e1fd0dba5a10dd801358cb7874a1e27596e64d98d2f: I
      appended a frozen dataclass ``_SecondRuledGrid`` with one field ``sheet:
      Layout`` and a ``stroke`` method computing ``cell = min(self.sheet.width *
      0.8 / self.sheet.columns, self.sheet.height * 0.8 / self.sheet.rows)`` and
      stroking ``columns + 1`` verticals, ``rows + 1`` horizontals and the frame
      — a complete second ruled-grid implementation, which is precisely what AC-4
      says a structural check forbids in this file. Three touched files: **265
      passed**. Blast radius (test_collected_names, test_suite_profile,
      test_book_interior_type_floor, test_book_page_frame, test_book_pdf,
      test_export_pdf, test_cli): **715 passed**. Nothing in the tree reports it.
      The receiver as written is ``self.sheet``, which _layout_spellings never
      gains: the annotation arm reads FUNCTION PARAMETERS only, and the rebinding
      arm skips an AnnAssign with no value, which is what a dataclass field is.
      Five more routes measured blind against the class's own helpers, each with
      _layout_spellings gaining nothing: ``lay, _z = layout, None`` (tuple
      unpack — the bound value is a Tuple, so ast.unparse never matches);
      ``lay = _sheet(layout)`` where ``def _sheet(layout: Layout) -> Layout``
      (an annotated RETURN the walk does not read); the same as a walrus;
      ``[one.rows for one in layouts]``; ``for lay in (layout,)``; and
      ``def f(lay=None)``. NONE of the six is the computed-name getattr, the
      container subscript or the unannotated parameter the paragraph concedes,
      and two of them (the annotated field, the tuple unpack) are receivers whose
      type a syntactic walk establishes trivially — so the generalisation that
      is supposed to make the enumeration safe is false. Why this gates rather
      than reads as a nit: AC-4's own words are "a structural check shows no
      second grid implementation in the file", its test is specified
      "default-DENY: a drawing path it cannot classify is a FAILURE, not a pass"
      (ADR-0039/R2, in this card's system contract), and CARD-295 — which runs
      next and is the card AC-4 exists to constrain — will be writing exactly
      this kind of dataclass-held layout.
    remedy: >-
      Cheapest honest fix, in order of value. (1) STOP ENUMERATING A RESIDUE.
      State the limit by its shape — "a ``Layout`` reached through an expression
      this walk does not resolve to a spelling: a subscript, an attribute the
      seed does not hold, a container element, a value returned from a call, an
      unannotated binding" — with the three current entries as EXAMPLES, and
      delete the "all three are the same shape" sentence. That alone makes the
      paragraph true and costs nothing. (2) Two of my six close in a few lines
      each and are worth taking because they are what a sibling card will write:
      add ``ast.AnnAssign`` fields whose annotation matches ``\bLayout\b`` as
      ``self.<name>`` spellings (the module's own ``self.layout`` is one), and
      let the rebinding arm unpack a Tuple target against a Tuple value
      elementwise. (3) If neither is taken, the honest alternative is to say
      which assertion is the real default-DENY on this axis — a role for every
      function that calls ``stream.line``, which is a bigger mechanism and is
      arguably CARD-298's — and name CARD-298 as owning it, rather than letting
      the enumeration imply the axis is covered.
    disposition: open

  - id: F-303
    severity: major
    title: >-
      N-3's residue is larger than declared too — an INLINE comprehension
      defeats all three clauses, and the round's two new helpers disagree about
      what a sequence display is
    file: tests/test_book_difficulty_dots.py
    line: 1114
    gating: false
    confidence: high
    evidence: >-
      MEASURED through the guard's own instrument, _unrecognised_draw_receivers
      on fabricated sources, the same way the round's own test plants its five
      entries. Reported (good): ``stream.line(points, 1, 3, None)`` after
      ``points = [(i, i) for i in range(32)]``; ``stream.line(_disc(rank), 1, 3,
      None)``; ``stream.line(*points)``; ``stream.multiline_text(points, …)``.
      NOT reported, and neither is declared: ``stream.line([(i, i) for i in
      range(32)], 1, 3, None)`` → **[]**, and ``stream.line(((i, i) for i in
      range(32)), 1, 3, None)`` → **[]**, and ``points = _disc(rank)`` then
      ``stream.line(points, 1, 3, None)`` → **[]** (and the same with ``points =
      list(_disc(rank))``, which is a spelling this package really writes one
      receiver over: ``draw.line(list(side), …)`` at book_pdf_generator.py:1441).
      The inline comprehension is the sharpest because it is an inconsistency
      inside this round's own code rather than an unforeseen shape:
      _names_bound_to_a_sequence deliberately counts ast.ListComp, ast.SetComp
      and ast.GeneratorExp as sequence displays, while
      _passes_a_coordinate_display — the clause that reads the first positional —
      tests ``isinstance(argument, (ast.List, ast.Tuple))`` only. So a
      comprehension is a sequence when it is bound to a name and is not one when
      it is written in the call. The name-bound-from-a-call case is a one-line
      transformation of the round's own ``fake.positional_call`` plant. NOT
      GATING, and the reasons are real: the clause genuinely closes both
      spellings cycle 2 measured, the package writes no Pillow call under the
      vector name at all, the declared cost is true on the excused surface (I
      checked all 15 ``stream.*`` calls — no positional ast.Call), and the fix is
      three type names in one isinstance tuple. But the declaration must stop
      claiming a residue of two.
    remedy: >-
      One line and one sentence. Add ``ast.ListComp``, ``ast.SetComp``,
      ``ast.GeneratorExp`` and ``ast.DictComp`` to _passes_a_coordinate_display's
      isinstance tuple (or, better, factor the "is a sequence display" predicate
      so the two helpers cannot disagree again — they were written in the same
      round from the same idea). Then restate _hides_a_sequence_argument's named
      limit as "a positional whose value this walk cannot resolve — a subscript,
      an attribute, or a name bound from a call" and add the bound-from-a-call
      plant as a sixth entry to test_a_pillow_call_wearing_the_vector_name_is_caught
      so the route cannot reopen silently.
    disposition: open

