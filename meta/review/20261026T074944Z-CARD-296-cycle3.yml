verdict: >-
  NOT CERTIFIED at 7/10, and the distance to 8 is far shorter than cycle 2's was
  — three edits, two of them one line of code each. First, plainly, on the
  central question: THE DISPOSITION IS RIGHT. Retracting the claim and carrying
  the straight-segment approximation as a named limit owned by CARD-298 is the
  correct call, and the reasoning for it is sound and now written as a structural
  fact rather than a figure to tune (the page's own arrow head is 3 points and so
  is a triangle, so no value of MAX_PATH_POINTS separates the page from a disc).
  The FLAT_METHODS/CARD-241 precedent is the right shape to carry it in, and the
  round went further than the precedent by annotating MAX_FLAT_VERTICES' own
  comment at its definition rather than citing a bound it had just measured
  broken. Every mechanism this round built is load-bearing, which I measured
  rather than took: disabling the rebinding closure, the annotation arm or the
  getattr arm each reds
  test_a_rebound_or_getattr_layout_is_held_to_the_same_rule, and removing
  _hides_a_sequence_argument reds
  test_a_pillow_call_wearing_the_vector_name_is_caught. F-5 is closed — my own
  independent BinOp walk finds exactly two functions doing arithmetic on a
  guarded COMP-007 number (diagram_box, _Diagram.translation), which is what the
  corrected paragraph now says. F-7/N-6 is closed and the split message names
  which clause broke (measured at FOLIO_PT 11.0: the measurement passes, the
  identity reds with its sentence). N-4's U+00B7 reasoning is true and
  understated — adding it reds 2 cells on 11 offending literals in 3 modules, not
  3 — and the hole is recorded in the rule's own comment, where a reader of the
  rule finds it. WHAT BLOCKS CERTIFICATION is the same family, one more time, and
  it is now only in the declarations: (1) THERE IS A SEVENTH SITE, and it is this
  card's own sentence from fix round 1 — tests/test_book_difficulty_dots.py:944
  still reads "a polygonal disc … Bounded per page kind by the drawing card's own
  control over the written stream", under a lead-in that says each of the three
  routes "is controlled elsewhere", i.e. the exact claim
  test_book_pdf_vector_primitives.py now retracts 350 lines away with "closed
  nowhere in the tree today". Two merged guards contradict each other on the
  card's central claim. (2) AC-4's residue is larger than the three limits the
  round declares, and a COMPLETE SECOND RULED GRID is still drawable with the
  whole tree green — I planted one in the module as a frozen dataclass whose
  field is annotated ``Layout`` under a name LAYOUT_SPELLINGS does not seed, and
  measured 265 passed on the three touched files and 715 on the blast radius. Six
  such routes exist at helper level, none of them among the declared three, and
  the round's generalisation ("all three are the same shape: a receiver whose
  type a syntactic walk cannot establish") is false for two of mine. (3) N-3's
  residue is likewise larger than declared: an INLINE comprehension
  (``stream.line([(i, i) for i in range(32)], 1, 3, None)``) is reported by
  nothing, because _passes_a_coordinate_display tests ast.List/ast.Tuple only
  while the round's own _names_bound_to_a_sequence counts a comprehension as a
  sequence display — the two new helpers disagree about what a sequence is. That
  one is major rather than gating: the clause's closure is real, the package
  writes no such call, and the fix is three ast types in one isinstance tuple.
  Measured suite state at 0b91ab18 by node id: three touched files 265 passed;
  blast radius (test_collected_names, test_suite_profile,
  test_book_interior_type_floor, test_book_page_frame, test_book_pdf,
  test_export_pdf, test_cli) 715 passed — 980 together, matching the round's
  figure. Every file I mutated was restored and sha256-verified against the
  pre-mutation snapshot; the worktree is clean apart from the pre-existing
  CARD-296.md edit and the two untracked review reports.

