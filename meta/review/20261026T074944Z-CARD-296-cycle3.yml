    plainly: the disposition is correct. Retraction plus a carried limit owned by
    CARD-298 is the only honest option left once the bound is shown to have zero
    headroom, the FLAT_METHODS/CARD-241 precedent is the right form, and this
    round carried the limit BETTER than the precedent did — it went back to
    MAX_FLAT_VERTICES' definition and recorded the identical hole there rather
    than leaving a citation that would read as proof. If the last round's only
    job were the disposition, this card would be certifiable today.
  - >-
    Brief item "look for a seventh": there is one, and it is the card's own
    sentence rather than a pre-existing one — tests/test_book_difficulty_dots.py:944,
    written at cf0db002 by the fix round that named this very comment as one of
    the places it was correcting. Two merged guard files now contradict each
    other on the card's central claim. I also found the file contradicting itself
    a second time, at :694-698 (CARD-228's text, which this round's own
    MAX_FLAT_VERTICES annotation now refutes 70 lines below it). F-301.
  - >-
    Brief item 1 (N-2's completed receiver rule): the three declared limits are
    NOT the residue — there are at least six more, and a complete second ruled
    grid is still green at 265 + 715 through a ``Layout``-ANNOTATED dataclass
    field. The brief's own guesses were good: a tuple unpack escapes, a
