judgements:
  - id: J-5
    title: "The self-caught attribution correction (5af8f422) is the TRUE one, measured"
    verdict: endorse
    detail: >-
      The round had written in three places that one plant dies on the cell's
      `q`/`Q` box control; it re-measured, found it dies elsewhere, and
      committed nothing but the correction. I verified the corrected
      attribution is the true one by firing the plant. MUT-25 (`q`/`Q` added to
      `_REFUSED_STATE_OPERATORS`) is KILLED at
      tests/test_book_difficulty_dots.py:7609 — the row loop's
      names-its-own-operator assertion on the **Do** row — and the red reads,
      verbatim: "an external object (Do) was refused, but by something else in
      the same stream: the message is "the stream uses 'q', …" and names no
      'Do'". With `q` refused, `q /Im0 Do Q` raises on its own `q`, the message
      names `'q'`, the assertion reds first, and the `q`/`Q` box control at the
      bottom of the cell never runs. That is exactly what 5af8f422 states, in
      the card, in `mutate.py` and in the reader's comment — all three now
      agree with the run. Stating a kill site from the shape of the code and
      then measuring it is the exact failure this card family keeps producing
      (it is cycle 2's F-009), and the round caught an instance of it in its own
      round-2 prose, unprompted, before any reviewer saw it. That is scored as
      credit and it is the single best signal in this round.
  - id: J-6
    title: "This card's work order to CARD-322 is unambiguous and MATCHES what CARD-322 now says"
    verdict: endorse
    detail: >-
