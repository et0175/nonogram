      declares raster (the cover or the divider), and move the 27
      bitmap-reading cells of this module with it." CARD-322's own
      ORCHESTRATOR CORRECTION (CARD-322.md:123-146): "THE INSTRUCTION THIS CARD
      INHERITS, stated once: RE-POINT, DO NOT RETIRE. Keep the raster arm;
      change its kind from PageKind.PUZZLE to a kind `_RASTER_DECLARATIONS`
