out_of_scope_observations:
  - "F-005's declaration is universally quantified ('any mutation that leaves a pre-rebuild backend alive also leaves its connection in that pool') and is refutable only by a contrived mutation that checks the pooled connection out before disposing — `conn = engine.raw_connection(); engine.dispose(close=False)` would leave before_pool.checkedin() == 0 and the backend alive, in which case the backend poll WOULD be the assertion that fires. So the declaration slightly under-claims the poll's value rather than over-claiming it, which is the safe direction. No change asked."
  - "TestEngineLifecycle_WhyTheHazardCannotBeForced keys the driver on the module constant session.POSTGRES_DRIVER and on psycopg2's own class, so a driver adopted by naming it in DATABASE_URL alone (`postgresql+psycopg://…`, which _init_engine honours at session.py:129) would leave the class green. In practice test_db_url_driver.py:103-122 ties POSTGRES_DRIVER to the installed package, so the gap is narrow. Accepted in cycle 1 and unchanged by this delta; recorded, not raised."
  - "Two of the three measurements session.py's docstring quotes (24/24 queries correct, OID 2950) are card-recorded history rather than standing controls. The docstring attributes them correctly to CARD-252's AC-3 attempt, so this is not an over-claim — but a reader who goes looking for the OID measurement inside TestEngineLifecycle_WhyTheHazardCannotBeForced will not find it there. One clause ('recorded on CARD-252, not asserted here') would close the gap entirely."
  - "tests/conftest.py:512's call is reached by the AC-5 guard only through the `app_session.` receiver spelling, which test_conftest_names_the_seam_at_its_call_site declares as its own bound. Correctly declared."

