findings:
  - id: C2-F-001
    severity: important
    category: testing
    type: guard_narrower_than_its_claim
    file: tests/test_db_engine_lifecycle.py
    line: 285
    title: "The private-globals guard silently passes three setattr spellings that reach session.py's globals — two of which it claims to see, all three already idiomatic in this tree, none named by the declared bound"
    description: |
      Cycle 1's F-002 is genuinely closed for the three shapes it reported (R1/R2/R3 all
      independently re-derived RED below, and the deny default has a working control, G4).
      But the same guard, under the same two mandatory rules, now has three new surviving
      shapes — and this time the file positively claims two of them.

      What the file claims:
        :300-303 (_private_global_sites_in) — "Everything else that touches one of ``names``
        on something this cannot resolve to the session module is returned in the second
        list, which the guard fails on."
        :647-655 (the AC-5 class) — "What the guard reaches, stated as what has a control
        (ADR-0039/R1). It sees three spellings — a dotted assignment,
        ``setattr(module, "name", …)`` and ``setattr("dotted.path.name", …)`` — … and
        **fails** rather than passes on a spelling it cannot resolve to the session module.
        Each of those four claims has a control in this class."

      Three mutants, each appended to a real non-exempt test file (tests/test_db_isolation.py),
      each applied alone and restored from a byte-identical backup verified with `diff` and
      `shasum -a 256`. All three SURVIVED — TestEngineLifecycle_TheResetIsAPublishedSeam
      stayed 9 passed, with the unanalysable list empty every time:

      X1 — the tree's own parametrised-monkeypatch idiom, reaching all three globals:
             @pytest.mark.parametrize("name", ["engine", "SessionLocal", "_engine_url"])
             def test_x1(monkeypatch, name):
                 monkeypatch.setattr(app_session, name, None)
           SURVIVED. The target resolves (app_session is in _SESSION_ALIASES) but args[1] is
           not an ast.Constant, so the `elif` at :336-340 is false and `record` is never
           called — neither a site nor unanalysable. This is not an exotic shape: the same
           spelling exists at six sites in this tree today — test_book_finalise_gutter.py:1907,
           test_book_plan.py:287, test_book_trim_persistence.py:891, test_web_submission.py:989,
           test_admin_error_text.py:102, property/test_image_fit.py:714.

      X2 — the spelling the class docstring names, in the builtin form:
             def test_x2():
                 setattr(app_session, "engine", None)
           SURVIVED. :326-327 requires `node.func` to be an ast.Attribute with attr
           "setattr", i.e. a `receiver.setattr(...)` call, so the bare builtin is invisible.
           ``setattr(module, "name", …)`` at :648 is exactly this spelling. It is also the
           more dangerous one — unlike monkeypatch it is not reversed at teardown — and it is
           used on classes and modules at 10+ sites in this tree (e.g.
           test_book_pdf_memory.py:477 `setattr(BookPDFGenerator, name, tracking(drawn))`,
           test_book_floor.py:865, test_book_select_floor_tiles.py:148).

      X3 — a computed string target:
             _X3_MODULE = "nonogram.db.session"
             def test_x3(monkeypatch):
                 monkeypatch.setattr(f"{_X3_MODULE}.engine", None)
           SURVIVED. args[0] is a JoinedStr, so the string-target branch at :332 is false;
           args[1] is `None`, so the object branch is false too. This spelling also already
           exists in the tree: test_web_server.py:2198
           `monkeypatch.setattr(f"{__name__}._WEB_SOURCES", [])`.

      Why these are not the declared bound. :656-661 declares: "the recognition is syntactic.
      A test file that reached the globals through something no AST walk can follow — a name
      bound by a fixture, ``importlib.import_module`` into a local, a ``globals()`` write — is
      outside the guard, and the failure path above only catches the spellings whose last
      component is still ``session``." I verified those three named shapes do indeed pass
      silently (probes P6/P7/P8) — correctly declared limits, not defects, and I raise nothing
      for them. X1/X2/X3 are different: an AST walk CAN follow all three (X2's target and name
      are both literals and the target is a known alias), and the clause about "spellings whose
      last component is still session" does not reach them, because for X1 and X3 the failure
      path is never entered at all. The board accepts a stated bound and refuses a hidden one;
      this is a hidden one.

      Where the deny default stops: it fires only when `_dotted` returns a chain whose last
      component is "session" (probe P9, `sys.modules['nonogram.db.session'].engine = None`,
      correctly comes back as a FAILURE). It is not applied on the attribute-name axis or to a
      non-literal string target, which is where ADR-0039/R2 needs it.

      Family attribution: cycle-1 F-002 — same file, same function family
      (_private_global_sites_in / the AC-5 class's reach claim), same two mandatory rules
      (ADR-0039/R1 and R2), same defect class (a claim about what the guard catches, refuted
      by a surviving mutant). This is the SECOND consecutive cycle whose gating finding falls in
      this family. Attributable to cycle 1's fix in part: the mechanism gap for a bare `setattr`
      and a non-literal arg pre-dates it, but the explicit "it sees three spellings … and fails
      rather than passes" claim and the bound that omits them were both written this cycle.
    suggestion: |
      Two mechanical changes plus the bound, all in _private_global_sites_in:
      (a) Accept a bare `setattr` name as well as an attribute `.setattr`: match
          `isinstance(node.func, ast.Name) and node.func.id == "setattr"` alongside the
          existing Attribute branch — the body below already handles both arg shapes.
      (b) Apply the deny default on the other two axes. When the call is a setattr-shaped call
          whose first argument resolves True (or whose first argument is a string the guard
          cannot read) and whose attribute-name argument is NOT a literal in `names`, append to
          `unanalysable` instead of returning silently; same for a non-Constant first argument
          that is not a Name/Attribute chain. The failure message already exists.
      (c) Then narrow :648 and :656-661 to whatever the code ends up catching, and name the
          residual shapes (a name bound by a fixture, importlib into a local, a globals() write)
          as the bound they already are.
      X1/X2/X3 are the three controls to add alongside, and they cost four lines each — they can
      be in-source text probes like the existing R1/R2/R3 controls rather than file mutants.
    confidence: high
    source: mutation
    violates: "ADR-0039/R1, ADR-0039/R2"
    root_cause: RC-1
