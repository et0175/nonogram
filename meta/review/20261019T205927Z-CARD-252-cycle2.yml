verdict:
  score: 8.0
  min_score: 8
  severity_gate: "FAILED — one open Important (C2-F-001). One is enough regardless of score."
  score_arithmetic: "10 − 1 (one Important) − 0.5 (one Minor) − 0.5 (recurrence: a gating finding in the same file/function/rule family for the second consecutive cycle is evidence the artifact's claims are not converging, which the rubric's meaning column treats as worse than an isolated finding) = 8.0"
  family_regression_check: |
    BOTH of this cycle's findings fall in a family that already gated or was filed in cycle 1:
      C2-F-001 -> cycle-1 F-002: tests/test_db_engine_lifecycle.py, the AC-5 private-globals
                  guard, ADR-0039/R1 + R2, "a claim about what the guard catches, refuted by a
                  surviving mutant". GATING in both cycles.
      C2-F-002 -> cycle-1 F-003: the AC-4 db_required count, "a count measured from the wrong
                  source". Minor in both cycles.
    So the loop IS regenerating defects in this one artifact rather than converging on it — the
    orchestrator asked to be told this explicitly rather than infer it from a score. Two
    qualifications that matter for what to do about it: (a) the three cycle-1 shapes are
    genuinely fixed and stay fixed — this is not the same mutant surviving twice, it is the next
    three shapes out; (b) the recurrence is confined to one guard in one test file, and nothing
    about the card's product behaviour has been in question in either cycle (G-1 proved by AST
    comparison both times). The pattern is specifically that each cycle's fix widens the guard's
    mechanism and then writes a reach claim slightly wider than the new mechanism. A third cycle
    that widens again by shape will very likely produce a fourth. The cheaper exit is to make the
    deny default total — fail on any setattr-shaped call whose target or name the guard cannot
    read as a literal — so the claim becomes "it catches these three spellings and FAILS on
    everything else it cannot read", which has no shape-by-shape frontier left to probe.
  recommendation: |
    Fail cycle 2 on the severity gate and run cycle 3, the last one. The fix did most of what it
    claimed: all six cycle-1 findings are closed, the three shapes that survived cycle 1 are RED
    (re-derived independently, not taken from the report), the deny default and the site equality
    both have working controls, G-1 is proved rather than asserted (docstring-stripped ASTs
    identical on both production-adjacent files), and the one side effect the fix flagged against
    itself was real and is correctly handled by an AST call-site test with M1/M1b as controls.
    What remains is one Important of the same shape as cycle 1's, in the same guard: three
    setattr spellings that reach session.py's globals and pass silently, two of them named in the
    file's own description of its reach, all three already present as idioms elsewhere in this
    tree, and none of them covered by the declared bound. The fix is mechanical — accept the bare
    builtin `setattr`, and route a non-literal target or name into the existing `unanalysable`
    failure path — and should be made total rather than shape-by-shape, so cycle 3 is not a
    fourth round of the same probe. C2-F-002 is one line plus one docstring sentence and can ride
    along.
  key_concerns:
    - "The AC-5 guard's reach claim is wider than its mechanism for the second cycle running (ADR-0039/R1+R2), and the three new surviving shapes are idioms this test tree already uses at 17 sites."
    - "The AST db_required count has one fail-open direction — a test class renamed off pytest's Test* prefix — which is the exact direction AC-4 exists to catch and which the cycle-1 measurement did catch."
    - "Nothing about the card's product behaviour or guardrails is in question: zero executable production delta this cycle, verified by AST comparison; all six guardrails hold."
  approve_conditions:
    - "C2-F-001 closed: the deny default applied to any setattr-shaped call whose target or attribute name is not a literal the guard can read, the bare builtin `setattr` spelling recognised, the :648 and :656-661 claims narrowed to the resulting mechanism, and X1/X2/X3 added as in-source controls."
