    Read: the fix delta in full (three files), both pre-fix versions of the two files I compared
    ASTs on, the pre-fix guard and call-site test, the cycle-1 report in full, the card in full
    including its uncommitted cycle-1 section, and the whole tests/ tree by targeted grep for
    setattr spellings. Not reached: the full suite (forbidden), AC-4's suite-wide skip profile
