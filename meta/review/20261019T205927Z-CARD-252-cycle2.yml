  - id: C2-F-002
    severity: minor
    category: testing
    type: claim_wider_than_mechanism
    file: tests/test_db_engine_lifecycle.py
    line: 106
    title: "The AST db_required count closed cycle-1's false red but opened one false green: a test class renamed off pytest's Test* prefix keeps the count at 2 while pytest collects nothing"
    description: |
      F-003 is closed — the single-node-id selection the cycle-1 reviewer reported red
      (…::TestEngineLifecycle_TheDbCoverageDoesNotQuietlyVanish::test_exactly_the_expected_number_of_tests_here_need_the_database)
      is 1 passed on this head, measured. The new derivation reads the module's own AST, which
      is exactly what the reviewer prescribed.

      Its docstring (:119) says a class-level marker "marks every test it contains, the way
      pytest applies it". That one clause is true. But `_test_functions_in` diverges from
      pytest's real marker resolution in six ways, measured by feeding source text straight to
      the function:

        module-level `pytestmark = pytest.mark.db_required` -> AST 0, pytest 2   (fail-closed)
        class-level `pytestmark = [pytest.mark.db_required]` -> AST 0, pytest 1  (fail-closed)
        marker inherited from a base class                  -> AST 0, pytest 1  (fail-closed)
        `@pytest.mark.db_required()` with parens            -> AST 0, pytest 1  (fail-closed)
        a nested test class                                 -> AST 0, pytest 1  (fail-closed)
        a class renamed off the `Test*` prefix              -> AST 2, pytest 0  (FAIL-OPEN)

      Five of the six bias to red, which is the right default and costs nothing. The sixth is
      the problem, and it is the one direction AC-4 exists to catch: rename
      `TestEngineLifecycle_TheRebuildLeavesNoEngineOlderThanTheSchema` to anything pytest's
      `python_classes` does not match and the class stops being collected entirely — the
      coverage that pins the fix goes to zero, silently — while `_test_functions_in` still
      counts its tests (it collects `test*` functions out of any ClassDef regardless of the
      class's name) and the guard stays green. `assert every` at :583 catches only "no tests at
      all". Cycle 1's collection-based measurement did catch this shape, so the fix traded a
      false red for a false green in the direction that matters.

      Filed Minor, matching the severity band of the finding it replaces: the shape needs a
      deliberate rename of a test class, every other divergence is fail-closed, and the module's
      two db_required tests are independently pinned by the mutants M4/F3a/F3b.

      Family attribution: cycle-1 F-003 (RC-2, "a count measured from the wrong source").
      Attributable to cycle 1's fix — the blind spot did not exist before it. Second consecutive
      cycle in this family, at Minor severity both times.
    suggestion: |
      One line, plus one docstring sentence. In `_test_functions_in`, skip a ClassDef whose name
      does not start with "Test" (and assert that at least one class WAS considered, so the
      filter cannot silently empty the set) — then a rename reds the count instead of hiding in
      it. Then declare the bound in the docstring: the derivation sees AST-visible
      `pytest.mark.db_required` decorators on `Test*`-prefixed classes and their direct `test*`
      methods only, so `pytestmark`, an inherited marker, a nested class and the parenthesised
      marker form all bias it to red. Replace "the way pytest applies it" with that.
    confidence: high
    source: dynamic
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: ddd5a18
    dismissed_reason: null
    learned_pattern: null
    family: "cycle-1 F-003 (AC-4 db_required count) — second consecutive cycle in this family, Minor both times"

