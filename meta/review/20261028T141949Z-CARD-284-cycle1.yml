    type: gap
    file: meta/kanban/cards/CARD-284.md
    line: 31
    title: "ESCALATION — the body's 'the book's title' is not implemented, and the decision taken is a fourth option the card did not offer"
    description: |
      ADJUDICATION OF THE CARD'S OWN DECLARED FINDING ("the title is NOT served"):

      (a) TRUE. player/assemble.py:605 SERVED_BOOK_SCHEMA = ("puzzles", "slug");
          SERVED_ENTRY_SCHEMA is SERVED_SCHEMA minus "clues" and SERVED_SCHEMA has
          no "title". pages.js never reads a title field. Verified, not taken on
          trust: mutant M3b (_dump(..., book) -> _dump(..., payload), one node,
          line-count-preserving) reds tests/test_public_player_pages.py::
          test_no_title_reaches_either_listing on its own assertion.

      (c) CONSISTENT with the ACs and guardrails. AC-387/388/389
          (meta/architecture/requirements.yml:5048-5066) name no title; and for the
          PUZZLE title the drop is not a choice at all — EC-048 (requirements.yml:5086)
          forbids "the picture name" on "every asset the public site serves", so
          serving it would have been a violation. G-1..G-4 all hold.

      (b) MIS-SCOPED, and this is the finding. Two different fields are argued as one.
          The measurement the record leans on ("CARD-282 measured a published title
          decoding back to all 144 cells of a 12x12 answer") is about a PUZZLE title —
          the picture name, which EC-048 names. The BOOK's display title is a different
          field with different provenance: owner-authored editorial text for a book,
          which EC-048's enumeration does not name. Dropping it is defensible on the
          residual argument (free text cannot be scanned), but it is a PRODUCT decision
          about the page the card's own body calls "a book customer's first contact with
          the product on a phone", and the card's routed-in section (lines 174-182)
          enumerated exactly three options for it — publish one title / refuse such a
          pair at export / disambiguate — flagging the third as "an ADR touch, not a
          code change". "Serve no title at all" is a fourth option, and the round took it
          in the worktree. That is precisely what CARD-282's round refused to do one
          commit after being pulled up for it.

      The card body (lines 31-35: "the book's title, its puzzles ... (each tile: title,
      size, tier)") and the shipped code now contradict each other, and FR-045's own
      statement for /b/<slug> is silent on the title, so nothing in the registry resolves
      it either. On this board a card whose body and ACs diverge is an escalation.
    suggestion: |
      Escalate to the owner before merge; do not absorb it as a worktree note. Two
      landing shapes, both cheap:
        (i) ship titleless (today's code) AND amend the card body plus FR-045's
            /b/<slug> clause so the registry stops asking for a title the site will
            never serve; or
        (ii) serve the BOOK's display title only, behind an explicit third ADR-0041
             exemption with its own control (caught with the exemption removed, missed
             with it in place — ADR-0039/R3), leaving the puzzle title dropped as
             EC-048 requires.
      Either way, separate the two titles in the argument: the EC-048 citation carries
      the puzzle title and does not, on its own text, carry the book's.
    confidence: high
    source: model
