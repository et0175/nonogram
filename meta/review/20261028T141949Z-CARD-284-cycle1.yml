  - id: F-005
    severity: medium
    category: tech-debt
    type: risk
    file: player/assemble.py
    line: 843
    title: "check_out_dir's destructive allow-set gained index.json/book/b/library/pages.js with no control for what it must still deny"
    description: |
      _site_entries() is the allow-set check_out_dir consults before assemble() calls
      shutil.rmtree on --out. Its docstring records a measured data-loss incident as its
      reason ("a directory holding precious/notes.txt came back holding only the site").
      This commit widens it by five names: PLAYER_FILES adds library/index.html, b/index.html
      and pages.js (contributing 'library', 'b', 'pages.js'), and _site_entries() unions
      SITE_BOOK_DIR ('book') and SITE_INDEX_FILE ('index.json') explicitly.

      The guard refuses when ANY top-level name is foreign, so the new exposure is a
      directory consisting only of allowed names: a directory whose sole entry is
      index.json — one of the most generic filenames on the web — or only book/, or only
      library/, is now silently rmtree'd where before it was refused by name.

      The widening has no denial control. The only negative control is
      tests/test_public_player.py:882, a notes/important.txt tree, which is the shape the
      guard was originally written from and reads none of the new names. Mutant
      R3-outdir-index-allowed (dropping SITE_INDEX_FILE from the set) IS killed at
      tests/test_public_player.py — but by the POSITIVE control (re-assembling into
      `empty`, which now contains index.json). That is the half this board warns about:
      the test pins that index.json must be ALLOWED and nothing pins what must still be
      DENIED.
    suggestion: |
      Add the denial control from a shape the guard was not written from — e.g. a
      directory holding only `index.json`, asserting whichever answer is intended, and
      a directory holding `index.json` plus one foreign name, asserting refusal. If
      "a lone index.json is deletable" is not the intended answer, change the recognition
      test from a name-set to a marker the script itself writes (the site's own
      vercel.json is already published on every run), which is a strictly stronger
      predicate and does not widen with every new published path.
    confidence: high
    source: static
    violates: ADR-0039/R3
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

