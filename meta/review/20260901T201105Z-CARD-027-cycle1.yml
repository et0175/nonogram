findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: tests/property/test_grid_dimensions.py
    line: 349
    title: "`_INT_ANNOTATIONS`'s docstring claims a type-based exclusion; it is a four-spelling allowlist"
    description: |
      The comment on `_INT_ANNOTATIONS` states: "The exclusion is a property of
      the type, not an allowlisted name, so it cannot be stretched to cover a
      real violation." That is false as implemented. `_annotation_is_int`
      (line 356-357) does `ast.unparse(node) in _INT_ANNOTATIONS`, a literal
      string comparison against exactly four spellings — `int`, `int | None`,
      `None | int`, `Optional[int]`. Verified by feeding synthetic modules
      through the shipped `_scalar_extent_offences`:

        def generate(size: typing.Optional[int]) -> list: ...   -> SLIPPED
        def generate(size: Annotated[int, 'cells']) -> list: ...  -> SLIPPED
        def generate(size: builtins.int) -> list: ...             -> SLIPPED
        def generate(size: 'int') -> list: ...                    -> SLIPPED

      All four are genuinely int-typed scalar-extent public parameters, i.e.
      exactly the "real violation" the comment says cannot slip past. Because
      docstrings are load-bearing truth in this repo and CARD-028/030/031/033
      are all instructed to copy this file's structure, an overclaim about the
      guard's own reach is the shape that propagates worst.
    suggestion: |
      Either weaken the comment to what the code does ("the four annotation
      spellings this codebase actually uses"), or make it true by resolving the
      annotation structurally — e.g. strip `typing.`/`t.` qualifiers and
      `Annotated[...]` wrappers, and treat any annotation whose unparsed form
      contains the token `int` (and not `float`/`str`) as int-bearing.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: gap
    file: tests/property/test_grid_dimensions.py
    line: 356
    title: "An unannotated scalar-extent parameter is a third, undeclared exclusion from the R1 guard"
    description: |
      `_annotation_is_int(None)` returns False, so a public function taking a
      bare `size` with no annotation is not an offence. Verified:

        def generate(key, size, rng): ...   -> SLIPPED (0 offences)
        class Request:
            size = None                      -> SLIPPED (no AnnAssign)

      CARD-027.md's STRUCTURE entry declares exactly two exclusions — private
      helpers, and non-`int` annotations — each justified on principle ("a grid
      extent is a count of cells and can never be a float"). An *absent*
      annotation is neither: it is an unknown type, not a known non-int one, and
      the justification does not reach it. There is no compensating control:
      CLAUDE.md states there is no ruff/mypy in `pyproject.toml` or the venv, so
      nothing else in the pipeline would reject it. `def generate(key, size,
      rng)` is a plausible thing for a later card to write, and it would
      reintroduce square-only code with a green suite.
    suggestion: |
      Treat an unannotated public parameter whose name is in
      `_SCALAR_EXTENT_NAMES` as an offence (or as a distinct "unverifiable"
      offence class), and record the change in the STRUCTURE entry so the
      declared exclusion list matches the code.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: bug
    file: README.md
    line: 0
    title: "README claims `*` \"never reaches the program\"; in bash it does"
    description: |
      The new `--size` section says: "The separator is a lower-case `x` (`*` is
      a shell glob and never reaches the program)." `src/nonogram/cli.py`'s
      `_EXTENT_SEPARATOR` comment states the same fact correctly and narrowly —
      "in zsh — the project owner's shell". The README drops the qualifier and
      generalizes. Verified: `bash -c 'echo 30*20'` prints `30*20` — bash (and
      sh, and zsh with `nullglob`/`nomatch` disabled) passes a non-matching glob
      through literally, so `--size 30*20` does reach the program, where
      `_extent_token` correctly rejects it as malformed. The user-visible
      behaviour is fine; the README's stated reason is not.
    suggestion: |
      Say "`*` is a shell glob — in zsh it fails before the program starts, and
      elsewhere it is rejected as a malformed token", or simply drop the
      parenthetical and keep "the separator is a lower-case `x`".
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: meta/kanban/cards/CARD-027.md
    line: 0
    title: "Failure-matrix row 8's ordering claim omits the `source is None` guard that precedes the range check"
    description: |
      Row 8 declares "Ordering is still range -> probe -> aspect -> decode
      (EC-007)". `sourcing/image.py:614-619` actually runs
      `if source is None: raise UnreadableImage(...)` *before*
      `random_grid.validate_extent(width, height)`. Verified:

        image.generate(None, 40, 20, rng)
          -> UnreadableImage("image mode needs an --image PATH ...")
        image.generate("/nonexistent.png", 40, 20, rng)
          -> SizeOutOfRange("grid width must be between 10 and 30 ...")

      So for a missing `--image` the mode's own leading argument wins over the
      out-of-range side — which is the exact mirror of row 6 (unknown library
      key wins over a bad extent), and row 6 *does* declare its precedence.
      The behaviour is pre-existing, correct and symmetric across modes; the
      declaration is what is incomplete. Row 8 is scoped "extent valid", so it
      is not strictly refuted — but its ordering sentence is unqualified and
      reads as a claim about all image-mode failures.
    suggestion: |
      Add the missing-`--image` precedence as its own row (mirroring row 6), or
      qualify row 8's ordering sentence as "for a request that names a source:
      range -> probe -> aspect -> decode".
    confidence: high
    source: static
