  - id: F-011
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_admin_binding.py
    line: 873
    title: "The docstring exemption the F-001 fix added has no control that can fail"
    description: |
      _docstring_constants (:873-892) grants the G-1 sweep's `strings` arm an
      exemption — "Docstrings excluded" / "Prose is not a reach" — and
      :955-962's _RESET_COUNTER_INNOCENT is positioned as its control
      ("the innocent source is in none of them"). That control cannot fail.

      Measured by mutation, twice, on the whole file:
        * `and id(node) not in docstrings` → `and True`  ⇒ 72 passed
        * `docstrings = _docstring_constants(tree)` → `docstrings = set()`
          (the mechanism deleted outright) ⇒ 72 passed
      No test in the card distinguishes the exemption's presence from its
      absence, which is exactly the shape ADR-0039/R1 names as "narrative,
      not coverage" and ADR-0039/R3 forbids: "Every exemption a guard grants
      carries a control for what it must NOT absorb — caught with the
      exemption removed, missed with it in place."

      The stated justification is also measurably not the reason it is
      needed. The arm matches only a string equal to "reset_count" or ending
      in ".reset_count"; session.py's docstrings write the name inside
      backticks within long strings and match neither. With the exclusion
      disabled, test_nothing_in_src_calls_the_reset_counter still passes —
      so the exemption absorbs nothing under src today, and the docstring in
      _RESET_COUNTER_INNOCENT ("A docstring may say reset_count without
      being a reach.") was never matched with or without it.

      Scope and weight, stated plainly: this is a guard-discipline /
      ADR-conformance defect, not a reach hole. Because _docstring_constants
      only ever collects a bare string *expression statement in first
      position*, every site it suppresses is dead prose, so it cannot hide a
      real reach — G-1 holds and is independently verified. But the code is
      new (added by the cycle-1 fix: `git show HEAD:tests/test_admin_binding.py
      | grep -c _docstring_constants` → 0, working tree → 3), it is in the
      same guard and the same ADR-0039 family as F-001, and the rule it
      breaks is severity: mandatory.
    suggestion: |
      Either (a) give the exemption a control that fails, or (b) delete it.

      (a) one source, measured sound before suggesting it: add a shape whose
      docstring is EXACTLY the accessor name, and one whose docstring is a
      dotted path ending in it, and assert both land in no kind:
          '"""reset_count"""\n'
          'def f():\n    """nonogram.db.session.reset_count"""\n'
      Verified discriminating: with the exclusion in place both give
      strings=[]; with it removed they give strings=['probe.py:1'] and
      ['probe.py:2'] respectively. Today's _RESET_COUNTER_INNOCENT gives []
      in both, which is the proof the present control is inert.

      (b) delete _docstring_constants and the `id(node) not in docstrings`
      clause: 72 passed either way, and the precedent is this card's own
      warnings.catch_warnings() removal ("it deleted with zero test
      failures (a dead mechanism)"). If (b), say so at bound 10 and at the
      sweep's docstring, which currently both claim the exclusion.

      Either way the sweep's docstring (:913-915) and bound 10 must stop
      asserting an exemption that is not controlled.
