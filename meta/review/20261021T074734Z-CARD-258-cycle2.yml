    title: "register() crashes the whole run with INTERNALERROR if the module is also loaded by -p <module>"
    description: |
      register() calls config.pluginmanager.register(sys.modules[__name__],
      PLUGIN_NAME) unconditionally. pluggy refuses to register one plugin
      object under a second name, so a run that loads the module by its
      import path AND lets the conftest register it dies at configure time.
      Reproduced on this tree:
        pytest tests/test_admin_binding.py -p tests.helpers.undefined_table_report
        → INTERNALERROR> ValueError: Plugin already registered under a
          different name: undefined-table-report=<module
          'tests.helpers.undefined_table_report' …>
      Not reachable from any documented invocation: pyproject's addopts is
      "-q", scripts/ and CLAUDE.md never pass -p <module>, and the probes run
      with their own rootdir where this conftest is not loaded, so the -p
      they pass cannot collide. The documented disable route is unaffected and
      works: `-p no:undefined-table-report` returns None from register() and
      reds only test_the_diagnostic_is_registered_in_this_very_run (verified).
      Filed low because the trigger is self-inflicted; filed at all because
      the module's whole contract is "never make a run worse", and a future
      change to _probe_run's cwd would walk into it.
    suggestion: |
      One line at the head of register():
          if config.pluginmanager.is_registered(sys.modules[__name__]):
              return None
      and name it in the docstring beside the -p no: note.
