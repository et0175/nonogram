findings:
  - id: F-201
    severity: high
    category: security
    type: gap
    gating: true
    file: tests/test_public_player_pages.py
    line: 2057
    title: "The raw/stripped split's load-bearing claim is false: the quoted-rooted pattern also reads a quoted `//authority` and routes it to `foreign`, while the raw quoted-host pattern cannot read an authority without a letter-TLD -- so a comment-delimiter swallow still hides an egress reference. Four measured silent passes, and the declared residual's cost statement is understated in two documents"
    description: |
      The whole design of fix round 2 rests on one proposition, stated in the
      pattern block, in the stripper's docstring and in the deploy page: the
      two patterns that read stripped text are the only two whose misses
      cannot be egress, so what a bad strip costs is a module specifier or a
      rooted path resolving to nothing -- "an `unclassifiable` lost, never a
      `foreign` one".

      It is false, for a reason neither document notices. The quoted-rooted
      pattern matches any quoted value whose first character is `/`. A quoted
      value beginning `//` satisfies it, and classify() sends every target
      beginning `//` down the absolute branch, where it becomes `foreign`.
      So that pattern is not an internal-only reader; it is a second reader
      of the protocol-relative form.

      The raw reader of that form -- the quoted-host pattern -- is shaped
      `//[A-Za-z0-9.-]+\.[A-Za-z]{2,}[^"'`\n]*` and therefore cannot read an
      authority whose final label is not two or more ASCII letters. For such
      an authority, outside a markup, CSS, sink or call position, the ONLY
      reader is the stripped one. Combine that with the residual the round
      itself declares -- an opener after an unguarded character still blanks
      a region, and the block forms cross lines -- and a live egress
      reference disappears with no finding.

      MEASURED, each planted alone into a copy of the clean counted site in a
      scratch worktree, the real scan with the real allow-list, the baseline
      asserted empty in the same run:

        const open = "x/*";                            *** SILENT PASS ***
        import t from "//203.0.113.9/t.js";
        const close = "*/";
          stripped = 'const open = "x\n\n";\n'

        a{content:"x/*"}                               *** SILENT PASS ***
        @import "//203.0.113.9/x.css";
        b{content:"*/"}
          stripped = 'a{content:"x\n\n"}\n'

        ...with //intranet/t.js (single-label)         *** SILENT PASS ***
        ...with //[2001:db8::1]/t.js (bracketed v6)    *** SILENT PASS ***

      And the controls, in the same run, which is what isolates the cause:

        import t from "//203.0.113.9/t.js"  (no comment)      CAUGHT foreign
        @import "//203.0.113.9/x.css"       (no comment)      CAUGHT foreign
        import t from "//intranet/t.js"     (no comment)      CAUGHT foreign
        the same residual, dotted letter-TLD authority        CAUGHT foreign
        the IPv4 authority in a `src=` behind the residual    CAUGHT foreign

      So it is not the residual alone and not the authority shape alone: it
      is the two together, and the second ingredient is a shape nothing in
      three cycles has looked at.

      Why gating on the last cycle:
      (a) it falsifies AC-392's `then:` -- "a reference shape the scan cannot
          classify is a failure" -- in the security-shaped AC, for the third
          consecutive cycle and by the same class of cause;
      (b) it falsifies the sentence the round added to the stripper's
          docstring ("an `unclassifiable` lost, never a `foreign` one") and
          the matching paragraph in the deploy page, which is the DECLARED
          residual the owner's risk picture rests on. A declared residual
          whose cost is understated is worse than an undeclared one, because
          a reader stops looking;
      (c) it falsifies the deploy page's "every quoted `//host` ... is read
          from the file as written": only a dotted letter-TLD one is;
      (d) a bare CSS `@import "//host/x.css"` needs no exotic trick at all --
          it is a real stylesheet fetch, it is not wrapped in `url()`, so the
          CSS pattern never sees it, and the quoted-host pattern misses it
          whenever the authority is an IP literal.

      What it does NOT falsify, and should be said plainly: the raw reads the
      round moved are real and each is uniquely reachable (plant matrix), the
      stripper genuinely cannot be removed (both false positives reproduce,
      C3-M11), and the shipped tree is clean.
    reproduction: >-
      Scratch detached worktree at 6caccb65, PYTHONPATH=<copy>/src with
      nonogram.__file__ asserted under the copy; a probe test appended to the
      module so it can take the counted-site fixture, which copytrees the
      assembled site, asserts the baseline scan empty, then writes each plant
      above into the copy one at a time, prints the real scan filtered to the
      plant's filename plus the stripper's output, and unlinks it. Outputs
      above verbatim. The module's blob hash was asserted back to 945cfb1f...
      afterwards and the worktree removed.
    recommendation: >-
      One line, and I measured it: relax the quoted-host pattern from a
      dotted letter-TLD authority to any quoted `//` followed by a non-slash
      character -- `(["'`])(//[^/"'`\n][^"'`\n]*)\1` -- keeping it on the RAW
      read. Measured (C3-FIX): the real counted site stays clean in all three
      buckets, all four silent passes become `foreign`, and both player
      modules stay at 66 passed. It also makes the load-bearing claim TRUE as
      written, because the protocol-relative form then has a raw reader for
      every authority shape and the quoted-rooted pattern's misses really are
      internal. Then add the four plants to the control set, and correct the
      two documents: the cost of a bad strip is an `unclassifiable` only
      BECAUSE the `//` form is read raw for every authority -- which is the
      sentence that was missing.
    confidence: high
    source: measured

  - id: F-202
    severity: medium
    category: correctness
    type: gap
    gating: false
    file: tests/test_public_player_pages.py
    line: 3311
    title: "The hold the owner's accepted cost rests on does not hold the documented publish COMMAND to the flag -- deleting the flag from that command line leaves both player modules green"
    description: |
      The owner kept the flag inversion knowing a real publish can now go out
      uncounted if the flag is forgotten, and named the new hold as what stops
      the documented command and the helper from separating again.

      What the hold actually does: it runs the helper's `--help` (returncode
      asserted 0), collects every `--flag` the deploy page writes inside
      backticks, and asserts (i) the page's set is a subset of argparse's
      options, (ii) the opt-in flag and the print-only flag are each
      backticked somewhere in the page, (iii) the opt-out flag is in neither
      place. The first direction is real: renaming the option in argparse
      while the page keeps the old name KILLS (C3-M13).

      What it does not do: the documented publish command lives in an
      indented command block, so its flags are not backticked and never enter
      the page's set. The opt-in flag is backticked twice in PROSE elsewhere
      in the page. So assertion (ii) is satisfied by prose, not by the
      command.

      MEASURED (C3-M12): delete ` --analytics` from the publish command line
      and both player modules are 66 passed. The documented command silently
      becomes the uncounted one while every assertion about the flag still
      holds.

      Not gating: nothing ships broken, the shipped command carries the flag
      today, and the direction of failure is the safe one the owner chose
      (not counting). It is listed at medium because the owner's acceptance of
      the cost was explicitly conditioned on this hold, and the hold does not
      cover the drift the condition names.
    reproduction: >-
      Scratch worktree at 6caccb65; the publish command's line edited by
      index with its flag occurrence count asserted first; the helper-driver
      node and then both player modules run; the deploy page's blob hash
      asserted back to 453bfff6... Then the argparse-rename mutant for
      contrast, with the helper script's blob asserted back to b817b17b...
    recommendation: >-
      Hold the COMMAND, not the prose: parse the publish command block the
      page already delimits (or find the line that invokes the helper) and
      assert the flag is on it, in addition to the subset check that already
      works. Two or three lines in the same test, and it makes the sentence
      the owner's decision rests on a measurement.
    confidence: high
    source: measured

  - id: F-203
    severity: low
    category: documentation
    type: inaccuracy
    gating: false
    file: tests/test_public_player_pages.py
    line: 2036
    title: "The identifier vocabulary is listed among \"the patterns that can hide EGRESS\" -- its miss cannot be egress, which is the over-claim half of the split"
    description: |
      The brief asked for a pattern on the raw list whose miss could not be
      egress -- one moved for symmetry rather than for a measured reason.
      There is exactly one, and it is the identifier vocabulary.

      Its plant's hit lands in the `identifiers` bucket and the plant holds no
      external reference at all; nothing it could miss is a channel. It serves
      AC-392's first clause (no reference names a visitor IP or per-visitor
      identifier), not the reference clause. Reading it raw is defensible on
      its own terms -- an identifier read parked in a comment is still worth a
      reviewer's eye, and the plant does control the line -- so this is a
      wording defect and not a hole.

      The other four raw reads each earn it: I verified the markup, CSS and
      sink reads are uniquely reachable (plant matrix) and that the markup
      read is the only raw reader of a non-letter-TLD authority in a fetching
      position (F-201's control set), and the absolute and quoted-host reads
      are egress by construction.

      Worth one sentence rather than a cycle, but it is the third unearned
      claim this card has shipped and the pattern is what matters.
    recommendation: "Say what is true: the raw list is everything that can hide egress PLUS the identifier vocabulary, which reads raw so a comment is not a hiding place for an identifier read either."
    confidence: high
    source: measured

  - id: F-204
    severity: low
    category: testing
    type: inaccuracy
    gating: false
    file: tests/test_public_player_pages.py
    line: 3128
    title: "The \"asserted four ways\" per plant is three: the shipped-scan assertion is subsumed by the pre-fix-stripper assertion, and three plants satisfy it with their own `\"/*\"` decoy"
    description: |
      The record says each of the nine plants is asserted four ways. Measured,
      one of the four is subsumed and for three plants it is additionally
      self-satisfied.

      Subsumption: the shipped stripper blanks a subset of what the pre-fix
      stripper blanks, so the shipped scan's findings are a superset of the
      pre-fix scan's. The fourth assertion (the scan reports the plant with
      the pre-fix stripper patched in) therefore implies the first (the
      shipped scan reports it). Driven: with the CSS read or the sink read
      disabled under the SHIPPED stripper, NO plant loses its bucket -- only
      the pre-fix pass reds. So the first assertion alone would not catch
      removing those raw reads.

      Self-satisfaction: the first assertion matches by FILENAME, and three
      plants open with `const open = "/*";` or `a{content:"/*"}`, which the
      quoted-rooted pattern reads as the rooted path `/*` and reports
      `unclassifiable` in that same file. For the two plants whose declared
      bucket IS `unclassifiable`, that decoy satisfies their own first
      assertion with the read they exist to control entirely removed.

      The control survives -- every one of the five is still a control over
      exactly one line -- so this is an accuracy finding about the count, in
      a card whose own subject is that an assertion which cannot fail is not
      an assertion.
    recommendation: "Match by needle as well as by filename in the first and fourth assertions (the needle is already in the tuple), and call it three assertions plus two text-level checks."
    confidence: high
    source: measured

  - id: F-205
    severity: low
    category: documentation
    type: inaccuracy
    gating: false
    file: tests/test_public_player_pages.py
    line: 2742
    title: "F-104's replacement is non-tautological but its own comment names a scenario it does not catch and which is not a risk -- the fourth document on this card to describe a mechanism the code does not have"
    description: |
      The refusal is right: cycle 2's recommended assertion compares `hosts`
      to the expression `hosts` is defined as two lines above, so it is True
      by construction. Confirmed by evaluation.

      The replacement can fail, so it is a real assertion: evaluated against
      three fabricated allow-lists, a third runtime entry on a NEW HOST makes
      the derived equality False. Good.

      But its comment says it replaces a floor that "passed a run in which
      the two endpoints had collapsed onto one host and half of what should
      be blocked was not". Evaluated with the two required endpoints
      collapsed onto one host: BOTH new assertions still pass. And they
      should, because the interceptor's route pattern is keyed on HOSTS, so
      one host pattern aborts both endpoints -- nothing would go unblocked.
      The scenario the comment names is neither caught by the assertion nor a
      risk; what the assertion actually guards is a runtime allow-list that
      grows a host beyond the required set, which is a different and real
      thing.

      Same shape as this card's earlier "exempts by the located URL" and
      "`refs - defined` carries nothing": a true property with a false
      explanation beside it, which is how a reader comes to trust the wrong
      half.
    reproduction: "The two assertions evaluated directly against three fabricated allow-lists in the scratch worktree: shipped (pass/pass), a third entry on a new host (pass/FAIL), the two required endpoints collapsed onto one host (pass/pass)."
    recommendation: "Say what it guards: the runtime block's host set equals the host set of the required endpoints, so a counted page cannot be permitted a host this interceptor does not abort. Drop the collapsed-onto-one-host story, or note that case is harmless because the route pattern is host-keyed."
    confidence: high
    source: measured

