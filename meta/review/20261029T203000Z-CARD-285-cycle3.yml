verdict: >-
  Fix round 2 is the strongest round this card has had and most of its claims
  hold under measurement. I drove every one rather than reading the report.
  The registry guard's new arms work in BOTH directions, including the
  docstring-only direction the brief asked about. Cycle 2's F-107 reproduces
  exactly and the docstring now says what the arms do. Both of the round's
  refutations of cycle 2 REPRODUCE on the real tree, and one of them is the
  strongest argument on the card. The five new plants are each a control over
  exactly one raw read. Node ids, guardrails, skips and the flag hold's
  argparse direction all reproduce.

  The score stays below min_score for ONE gating reason, and it is the same
  defect class for the THIRD consecutive cycle, one level deeper. The round's
  load-bearing proposition -- "the two patterns reading stripped text are the
  only two whose misses cannot be egress: a lost `unclassifiable`, never a
  lost `foreign`" -- is MEASURABLY FALSE. The quoted-rooted pattern also reads
  a quoted value that BEGINS `//`, and classify() routes anything beginning
  `//` to the absolute/foreign branch. The quoted-host pattern, which reads
  raw, requires the authority's last label to be two or more ASCII letters.
  So for any authority that is not a dotted letter-TLD name -- an IPv4
  literal, a bracketed IPv6 literal, a single-label host -- the ONLY pattern
  that sees an egress-capable protocol-relative reference is the one that
  reads STRIPPED text. Combine that with the residual the round declares (an
  opener after an unguarded character still blanks a region) and four
  measured SILENT PASSES of a `foreign` follow, each with its no-comment
  control CAUGHT in the same run. So the declared residual's cost sentence is
  understated in the stripper's docstring AND in the deploy page, and
  AC-392's `then:` clause is falsified again -- in the security-shaped AC.
  Finding F-201, gating.

  Second, non-gating but it bears directly on the OWNER'S accepted cost. The
  owner kept the flag inversion on the strength of the new hold stopping the
  documented command and the helper from separating again. Measured: that
  hold holds the page's BACKTICKED PROSE to argparse's option set, and
  argparse renaming the option reds it. It does NOT hold the documented
  publish COMMAND to carrying the flag. Deleting ` --analytics` from the
  publish command line in the deploy page leaves both player modules at 66
  passed -- a SURVIVING mutant on the exact drift the decision was made
  against. F-202.

  One figure in the brief is stale and I re-derived it: F-107's two arms are
  at :1954 and :1955 at this HEAD, not :1919/:1920 (those were cycle 2's
  numbers at 79ecafcb). The brief's node-id figures are right.

