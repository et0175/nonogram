judgements_requested:
  "1_does_the_raw_stripped_split_hold_in_BOTH_directions": >-
    NO on the under-claim direction, and that is the gating finding. YES with
    one named exception on the over-claim direction.

    UNDER-CLAIM (gating). The claim is that a miss by the two stripped-text
    patterns can only cost an `unclassifiable`. It can cost a `foreign`. The
    quoted-rooted pattern matches any quoted value whose first character is
    `/`, so it also matches a quoted value beginning `//`, and classify()
    sends anything beginning `//` down the absolute branch -> `foreign`. The
    quoted-host pattern, which does read raw, is shaped
    `//[A-Za-z0-9.-]+\.[A-Za-z]{2,}...`, so it cannot read an authority whose
    last label is not two-or-more ASCII letters. For such an authority the
    quoted-rooted pattern (STRIPPED) is the only reader outside a markup, CSS,
    sink or call position. Four shapes measured as SILENT PASSES on a copy of
    the clean counted site, each planted alone, each with its no-comment
    control CAUGHT as `foreign` in the same run -- see F-201 for the plants
    and the outputs.

    OVER-CLAIM. Of the raw-read list, the absolute pattern, the quoted-host
    pattern, the two markup/CSS patterns and the sink pattern each have a
    miss that CAN be egress, and I verified each is uniquely reachable (the
    plant matrix). The markup/CSS/sink reads earn raw text for a specific
    measured reason and not for symmetry: they are the reads that carry
    `fetching=True`, which is what makes a non-runtime-allow-listed URL in a
    fetching position a finding, and for a non-letter-TLD authority the
    markup read is the ONLY raw reader (I measured that too -- the same
    IP-literal host in a `src=` behind the same residual is CAUGHT). The ONE
    exception is the identifier vocabulary: its miss cannot be egress at all.
    It serves AC-392's identifier clause, not its reference clause, and its
    plant's hit lands in the `identifiers` bucket with no external reference
    anywhere in the plant. The pattern block lists it among "the patterns
    that can hide EGRESS", which is an unearned word. Reading it raw is
    defensible on its own terms -- an identifier read parked in a comment is
    still worth seeing -- so this is a wording defect, not a hole. F-203.
  "2_is_each_of_the_five_new_plants_a_control_over_ONE_line": >-
    YES, all five, measured plant-by-plant by disabling each pattern in turn
    and asking which plants lose their declared bucket. Each disabled read
    loses exactly ONE plant and only its own. The full matrix is in
    mutation.plant_control_matrix.

    But the verdict is carried by only one of the four assertions, and the
    "four ways" overstates the control by one. The first assertion (the
    shipped scan reports the plant) is SUBSUMED by the fourth (the scan
    reports it with the pre-fix stripper patched back in): the shipped
    stripper blanks a subset of what the pre-fix stripper blanks, so the
    shipped scan's findings are a superset. Measured, not argued: with the
    CSS read or the sink read disabled under the SHIPPED stripper, NO plant
    loses its bucket -- only the pre-fix-stripper pass reds. Two reasons
    compound it: the first assertion matches by FILENAME rather than by
    needle, and three plants contain a decoy that produces a hit in their own
    declared bucket -- the `const open = "/*"` / `a{content:"/*"}` literal is
    itself read as a quoted rooted path `/*` and reported `unclassifiable` in
    the same file. For the two plants whose declared bucket IS
    `unclassifiable`, that decoy satisfies their own first assertion with the
    read they exist to control fully removed. F-204, low, non-gating -- the
    control survives, it is just one assertion narrower than the record says.
  "3_is_the_declared_residuals_never_a_lost_foreign_true": >-
    NO. It is false, and this is the gating finding. The residual is declared
    accurately as a MECHANISM -- an opener after an unguarded character does
    still blank a region, and the block forms do cross lines -- and the
    mechanism is what I used. What is false is the stated COST. Measured, each
    planted alone into a copy of the clean counted site, baseline asserted
    empty in the same run:

      const open = "x/*";                             *** SILENT PASS ***
      import t from "//203.0.113.9/t.js";
      const close = "*/";

      a{content:"x/*"}                                *** SILENT PASS ***
      @import "//203.0.113.9/x.css";
      b{content:"*/"}

      ...the same with //intranet/t.js                *** SILENT PASS ***
      ...the same with //[2001:db8::1]/t.js           *** SILENT PASS ***

    and the controls, in the same run:

      the same reference with NO comment               CAUGHT (foreign)
      the same residual with a dotted letter-TLD host  CAUGHT (foreign)
      the same host in a `src=` behind the residual    CAUGHT (foreign)

    So the loss is specifically a `foreign`, the sentence in the stripper's
    docstring and the matching paragraph in the deploy page are both
    understated, and the deploy page's "every quoted `//host` ... is read from
    the file as written" is true only for dotted letter-TLD authorities.
  "4_does_F_102s_guard_catch_the_docstring_only_direction": >-
    YES, and the non-vacuity control is genuine. Three mutants, each with the
    blob restored and asserted afterwards:
      * the ADR-authority node's `def` renamed by one character (the round's
        M10, cycle 2's survivor) -> KILLED at :1972, the assertion that every
        whole path::name the table spells is defined in the file;
      * a phantom whole path::name INSERTED into the module docstring's table,
        defined nowhere -> KILLED at the same assertion. This is the direction
        the brief asked about and it is covered;
      * the ADR line DELETED from the table -> KILLED at :1976, the control
        asserting the table spells at least one ref neither hand-written set
        holds. So the "the arm is reached" control is not vacuous: it reds the
        moment the table stops carrying a name outside those two sets.
    The guard is now genuinely both-ways on what the table spells, whatever
    registry or ADR a ref belongs to, and the docstring's claim that the
    defining module is the one place that cannot lose a ref unnoticed is true
    as held for the first time.
  "5_do_the_rounds_two_refutations_of_cycle_2_reproduce": >-
    BOTH REPRODUCE, and the first is the strongest argument on the card.

    (a) Cycle 2's "stronger and simpler alternative" REDS THE REAL TREE.
    Applied as recommended -- the quoted-literal read moved to unstripped
    text, which at this HEAD means the quoted-ROOTED half reads raw -- the
    scan on the CLEAN COUNTED SITE returns
    `unclassifiable: ["solver_state.js: '/static/solver_state.js' resolves to
    no file, directory or rewrite"]`. That is one of the two measured false
    positives the stripper exists for, the documented admin-panel path sitting
    inside a `//` comment, and it is the exact shape the round's own
    exempt-comment control asserts must be MISSED. Dropping the stripper
    entirely brings back the second measured false positive as well
    (`player.css: 'not yet decided'`, through the import specifier). So both
    measured false positives are real at HEAD, the stripper earns its place
    for exactly the two patterns that still read it, and cycle 2's
    recommendation would have traded a gating finding for a red suite. The
    round was right to refuse it and right about why.

    (b) Cycle 2's F-104 recommendation IS tautological. The recommended
    assertion compares `hosts` to the expression `hosts` is defined as two
    lines above; evaluated, it is True by construction and cannot fail under
    any mutation. Refusal confirmed.

    The replacement is genuinely non-tautological -- I evaluated its two
    assertions against three fabricated allow-lists: a third runtime entry on
    a new host makes the equality FALSE. It does, however, guard a DIFFERENT
    risk from the one its own comment names, and that comment is wrong. See
    F-205.
  "6_the_remaining_fix_round_items": >-
    F-105 ACCURATE. The deploy page's new paragraph names four refusals and
    the code enforces exactly those four, in order: an endpoint that does not
    start with `https://`; an endpoint that is not bare (a quote, a `<`, or
    whitespace); a document that already carries the marker attribute (the
    marker constant IS that attribute string); and a document whose count of
    the anchor is not exactly one (the anchor constant IS `</head>`). Nothing
    is claimed that the code does not do and nothing enforced is left out.
    And the paragraph sits BETWEEN and OUTSIDE both sentinel-delimited blocks
    (the two blocks end at :194 and :207; the paragraph is :208-:218), so the
    collection-time parse of those two fenced blocks is untouched -- which the
    suite confirms by collecting and passing at all, since a damaged block is
    a collection-time ValueError.

    F-106 HELD, and by exactly one line. The url-in-comment plant is reported
    `foreign` by the shipped scan; recompiling scan_site with the absolute
    pattern's read moved from raw to stripped text makes it a SILENT PASS with
    no other bucket catching it. Asked for in three consecutive cycles, now
    present and mutation-held.

    F-107 REPRODUCES, and the correction landed in the code. Two insert
    mutants, each adding one seventh registry ref for this module: naming a
    node nothing defines reds at :1954 ONLY; naming a node the file defines
    reds at :1955 ONLY. Complementary, and the docstring now says so instead
    of calling one arm inert. NOTE: the brief's :1919/:1920 are cycle 2's
    numbers at 79ecafcb; at this HEAD the arms are :1954 and :1955.

    F-104's refusal and replacement: see judgement 5 and F-205.
  "7_the_flag_hold_the_owner_decision_rests_on": >-
    HALF HELD. The hold derives the option set from the helper's own `--help`
    (returncode asserted 0), collects every backticked `--flag` from the
    deploy page, and asserts page_flags is a subset of the options, that the
    opt-in flag and the print-only flag are both backticked somewhere in the
    page, and that the opt-out flag appears in neither place.
      * argparse renaming the option while the page keeps the old name ->
        KILLED. That direction works.
      * ` --analytics` DELETED from the documented publish command ->
        *** SURVIVED ***, both player modules 66 passed. The command sits in
        an indented block, so its flags are not backticked and are not in
        page_flags at all; the two required flags are satisfied by PROSE
        mentions elsewhere in the page. So the documented command can lose
        the flag silently, which is the drift the owner's accepted cost was
        accepted against. F-202.
  "8_measured_wrong": "see corrections_to_the_record"

