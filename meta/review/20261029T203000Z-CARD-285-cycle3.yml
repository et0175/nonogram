dead_ref_hygiene: >-
  This report syncs into main, where the check-ref search is a TEXT search over
  tracked non-Markdown files and meta/review/** is NOT excluded from it, so a
  whole `path::name` spelled here would read as a definition -- and F-102 is a
  measured instance of exactly that hazard in this card's own module. Device
  used: this file was grepped for the `::` form before writing it out, and
  EXACTLY ZERO whole `path::name` strings appear in it. Every node is named by
  AC id, by bare function name, or by description. The four mutants that rename
  a definition away are described rather than named. The ADR-0041/R2 exemption
  node -- F-102's subject, and the node whose resolvers are the point -- is
  referred to only as "the ADR-authority node", so this report adds no resolver
  to the silencer the finding is about, and no truncated prefix of it appears
  either.
  SEPARATELY: NEITHER ANALYTICS ENDPOINT IS SPELLED ANYWHERE IN THIS REPORT, by
  URL or by host, and neither is the non-runtime one. Cycle 1's hygiene rule is
  technically liftable (cycle 2 proved the `:!meta` pathspec hides meta/ whole)
  and is kept anyway. Every host in this report -- `evil.example`,
  `203.0.113.9`, `[2001:db8::1]`, `intranet`, `one.example`, `third.example` --
  is a documentation-reserved or invented name used in a plant.

disposition: >-
  DOES NOT CERTIFY at 7.5 against min_score 8, and cycle 3 is the last cycle,
  so this is the final word rather than a request for another round.

  The card does what it was for and the tree is strictly stronger than at
  cycle 2: three ACs that had no definitions have mutation-held tests, a false
  alive is gone, a measured instance of CARD-308's hazard is closed in the
  module where it lived, and the stripper is off the egress path for every
  pattern the round examined. If this ships as is, what ships is a guard that
  is default-deny for every reference shape anybody has planted EXCEPT a
  protocol-relative reference to an authority without a letter-TLD sitting
  behind a comment delimiter opened from an unguarded character -- and a
  declared residual whose cost statement, in two documents, is understated in
  exactly that case.

  The one thing worth spending a fix on, if any time exists at all, is the
  single line of F-201's recommendation, because I measured it: the real tree
  stays clean, all four silent passes become `foreign`, both player modules
  stay green, and the sentence in the stripper's docstring and the deploy page
  becomes true as written instead of understated. F-202 is three lines and it
  is the hold the owner's own accepted cost was conditioned on. F-203, F-204
  and F-205 are one sentence each and nothing depends on them.
