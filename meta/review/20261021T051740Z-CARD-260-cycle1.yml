    category: tech-debt
    type: bug
    file: tests/kill_matrix.py
    line: 427
    title: "An equal-line-count edit that moves an assert is accepted, and a real kill is reported NOT-REACHED"
    description: |
      `_refuse_line_shift` only compares `count("\n")` and `len(splitlines())`. An edit that
      preserves both while reordering lines moves an `ast.Assert`'s lineno, and the matrix —
      whose cells are keyed on the PRISTINE linenos (tests/kill_matrix.py:772, :874) — then
      attributes nothing to the moved node. Reproduced on a 1-assert target:

        pristine assert linenos: (6,)
        mutated  assert linenos: (5,)
        apply_edit: accepted (no refusal)
        SHIPPED : km_move.py:6 PASS
        MUTANT  : km_move.py:6 NOT-REACHED
        records : {5: (False,)}   <- the arm RAN and FAILED

      So a kill is reported as "never ran", with exit_code 0 and no refusal. This is the
      misattribution the card's own worktree notes call the worse of the two outcomes ("a
      misattributed cell looks like a measurement"), and `_refuse_line_shift`'s docstring claims
      to prevent exactly its consequence. The instrument already holds the evidence: lineno 5 is
      in `records` and not in the denominator's key set.
    suggestion: |
      After `_apply`, re-derive `assert_linenos(target.read_text())` and raise MutantRefused
      unless it equals the pristine tuple; equivalently/additionally refuse in `_measure` when
      `set(records) - set(linenos)` is non-empty. One check closes F-003 and F-011. Plant a
      reordering mutant as the control.
