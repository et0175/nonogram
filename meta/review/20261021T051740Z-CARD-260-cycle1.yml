  - id: F-004
    severity: high
    category: tech-debt
    type: bug
    file: tests/kill_matrix.py
    line: 877
    title: "With child_instrumentation off (the default) an arm that ran and failed in the child reads NOT-REACHED, and no figure says the overlay was skipped"
    description: |
      The BLIND overlay is gated on `child_instrumentation` (:877), which defaults to False
      (:666). Declared bound 2 justifies the default with "the child is pristine, propagation is
      intact, and those arms are measured for real" (tests/kill_matrix.py:652-670, tests/README.md).
      That is true for the PARENT's arm reading the child's returncode, and false for an arm whose
      execution happens inside the child. Same target, same mutant, both passes recording:

        child_instrumentation = False
          ...: 0 PASS, 1 FAIL, 1 NOT-REACHED, 0 BLIND of 2 assertion nodes
          km_child_target.py:11 NOT-REACHED      <- ran in the child and FAILED
          km_child_target.py:20 FAIL
        child_instrumentation = True
          ...: 0 PASS, 1 FAIL, 0 NOT-REACHED, 1 BLIND of 2 assertion nodes
          km_child_target.py:11 FAIL
          km_child_target.py:20 BLIND

      So the default reintroduces the exact conflation the instrument was built to remove — "a
      surviving mutant and a never-reached assert look identical" — for in-child arms. Neither
      `figure()` nor `table()` carries `child_instrumentation`, so a recording-pass figure's
      "0 BLIND" is indistinguishable between "no blind arms" and "the blind-spot overlay did not
      run": a figure that does not carry its domain, which is this card's own stated defect. No
      test exercises the default on a child-spawning target — tests/test_kill_matrix.py:433 runs
      both passes with `child_instrumentation=True` — so the exempted state has no control that
      can fail (ADR-0039/R3).
    suggestion: |
      Carry `child_instrumentation` on Matrix/KillMatrix and interpolate it in `figure()`/
      `table()`, so "0 BLIND" always states whether the overlay ran. Either report
      child-dependent arms as an explicit "overlay-off / unmeasurable" state rather than
      NOT-REACHED when the overlay is skipped, or narrow bound 2's wording to exclude arms that
      execute in the child. Add the child_instrumentation=False reading of the child target as
      the control.
    confidence: high
    source: static
    violates: ADR-0039/R3
    root_cause: null
    status: open
