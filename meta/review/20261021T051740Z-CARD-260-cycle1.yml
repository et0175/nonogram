        ALLOWED : tests/CONFTEST.py
        ALLOWED : tests/Conftest.py
        refused : tests/database_guard.py
        ALLOWED : tests/DATABASE_GUARD.py
        exists via mis-cased path: True
        -> apply_edit + write_text through tests/CONFTEST.py changed the real
           tests/conftest.py from 'GUARD = 1' to 'GUARD = 0'

      The text refusal does not cover for it: an edit that defeats the guard need not contain
      `_refuse_unless_test_database` or `nonogram_poc` in `old`/`new` (e.g.
