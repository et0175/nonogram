    file: tests/kill_matrix.py
    line: 677
    title: "G-2's lock refusal checks a path no gate ever writes when driven from a linked worktree"
    description: |
      `_refuse_if_lock_held` tests `self.repo_root / "meta" / "kanban" / ".full-suite.lock"`.
      The board's real lock does not live there for a linked worktree: tests/full_suite_lock.py
      `default_lock_path()` calls `main_repo_root()`, which follows a linked worktree's `.git`
      pointer file back to the main checkout. Derived in this worktree:

        this_worktree     = /Users/omelnikova/PycharmProjects/PythonProject4-card-260
        default_lock_path = /Users/omelnikova/PycharmProjects/PythonProject4/meta/kanban/.full-suite.lock
        km checks         = /Users/omelnikova/PycharmProjects/PythonProject4-card-260/meta/kanban/.full-suite.lock
        SAME?             = False

      Both AC-7 callers pass `repo_root=REPO`, where `REPO = Path(tests/test_kill_matrix.py).parent.parent`
      = the worktree (tests/test_kill_matrix.py:44, :968, :1203). So in the only configuration the
      card ships, G-2 is inert: a full-suite gate holding the board's real lock does not stop this
      instrument from mutating src/nonogram/db/session.py and spawning pytest — the exact host
      contention CARD-255 exists to prevent. The instrument also ignores `NONOGRAM_FULL_SUITE_LOCK`,
      the override the board (and this review's own brief) uses to relocate the lock, so the guard
      cannot be pointed at the right file either. `repo_root` is simultaneously the pytest `cwd` and
      the base for relative selections (FOUR_ARM at :981 is relative), so a caller cannot pass the
      main repo root instead without breaking selection resolution — the two roles are conflated.
      The control, tests/test_kill_matrix.py:864, plants the lock at `tmp_path/meta/kanban/` and
      passes `repo_root=tmp_path`, so it can only ever exercise the relative join and can never fail
      for the real path (ADR-0039/R1).
    suggestion: |
      Resolve the lock through the project's own authority instead of re-deriving the path: import
      tests.full_suite_lock and call `lock_path()` (which honours NONOGRAM_FULL_SUITE_LOCK and
      main_repo_root), or accept an explicit `lock_path` parameter defaulting to it. Then add a
      control that can fail: assert the path the Runner would refuse on equals
      `full_suite_lock.lock_path()`, which reds the day the two diverge again.
    confidence: high
