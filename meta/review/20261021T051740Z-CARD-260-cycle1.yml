  - id: F-008
    severity: low
    category: tech-debt
    type: risk
    file: tests/kill_matrix.py
    line: 736
    title: "_restore aborts the whole restore loop on the first verification failure, leaving later registered paths mutated"
    description: |
      `_restore` iterates the registry and raises LeakedPatch from inside the loop on a diff or
      shasum mismatch (:743, :752), so every path after the failing one is never restored. The
      outer `finally` in `run()` (:812) calls `_restore` again and fails at the same point, so
      the tail of the registry stays mutated. Registry order is insertion order — target first,
      then mutant paths — so in the card's own anchor 2 the path left behind would be
      src/nonogram/db/session.py, a tracked source file, with G-5 forbidding a git restore.
      `shasum` is also an external binary (`check=True`, :747): where it is absent,
      FileNotFoundError takes the same route. Related: tests/test_kill_matrix.py:1179 mutates the
      real src/nonogram/db/session.py and tests/test_db_engine_lifecycle.py in the working tree on
      every full-suite run; the `finally` and the two-way verification cover exceptions, but an
      abnormal termination leaves them edited, and `tempfile.mkdtemp` workdirs (:755) are never
      cleaned up.
    suggestion: |
      Restore every registered path first, collect the verification failures, and raise once
      afterwards so no path is skipped. Guard the `shasum` invocation so a missing binary is a
      named refusal rather than an exception mid-restore.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
