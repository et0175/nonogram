  - id: F-005
    severity: critical
    category: tech-debt
    type: bug
    file: tests/kill_matrix.py
    line: 869
    title: "A run in which nothing executed is reported as a complete, FAIL-free measurement"
    description: |
      `_measure` records `exit_code` and `collected_tests` on the Matrix (:889-890) and no
      refusal ever consults either. `_refuse_unless_clean` (:815-847) demands only that no cell
      is FAIL and, from the second reading on, that cells equal the baseline — both of which an
      all-NOT-REACHED reading satisfies trivially. Reproduced with a non-empty, resolvable
      selection whose node id does not exist:

        SHIPPED / recording pass over km_simple_target.py: 0 PASS, 0 FAIL,
        5 NOT-REACHED, 0 BLIND of 5 assertion nodes (collected tests: None)
        exit_code = 4   collected_tests = None
        KillMatrix figure: ... SHIPPED 0 FAIL
        mutant MARK-ROT cells: all 5 NOT-REACHED

      No refusal. Every mutant then reads "survived everywhere", and the baseline comparison
      passes because the baseline is equally blank. Any cause of a non-run takes this route —
      a collection error, a stale node id, an import failure, or the project's own
      full_suite_lock hook refusing the child pytest. This is a fabricated measurement
      presented as a reading, which is the defect class the card exists to prevent, and it is
      ADR-0039/R2's deny-default inverted: a shape the instrument cannot analyse is a silent
      pass.
    suggestion: |
      Make SHIPPED's liveness a precondition: in `_refuse_unless_clean` (or `_measure`), raise
      when `exit_code` is not in {0, 1} (pytest's "tests ran" codes), when `collected_tests` is
      None or 0, or when SHIPPED records no execution at all. Control: a selection naming a
      non-existent node id must raise rather than return a blank matrix.
    confidence: high
