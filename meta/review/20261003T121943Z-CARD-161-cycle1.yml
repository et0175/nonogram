findings:
  - id: F-001
    severity: medium
    category: feature
    type: gap
    file: src/nonogram/admin/static/solver_state.js
    line: 15
    title: "Module header still declares CARD-161 routes clicks through withCell/setBoard and keeps a history of boards"
    description: |
      solver_state.js:14-17 (CARD-160 header, left untouched by the append-only SCOPE+) states
      "a history of boards (CARD-161's undo) is just an array of values" and "CARD-161 routes
      clicks through withCell/setBoard". The code this card ships contradicts both: clicks go
      clickStroke -> record -> applyStroke (solver.js:300-304), setBoard is not on the marking
      path at all (it now RESETS the history, solver.js:228-231), withCell is not called by any
      marking code (grep withCell src/nonogram/admin/static/solver.js -> 0 hits), and the history
      is {board, done: [{stroke, before}], undone: [stroke]} (solver_state.js:139-146), not an
      array of boards. The appended section below is accurate, so the file now carries two
      contradicting descriptions of the same design - exactly the declared-vs-demonstrated drift
      CARD-160 escalated on, and CARD-162 will read this header first.
    suggestion: |
      Comment-only edit of solver_state.js:14-17 (and the "history of boards" phrase at :72):
      say boards are never mutated, so a history can hold them as values (see "Strokes and
      history" below), and that CARD-161 routes clicks and drags through strokes and record /
      undo / redo. Amend the SCOPE+ Worktree note from "CARD-160's comments untouched" to
      "two stale CARD-160 header sentences corrected". No code change.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/static/solver.js
    line: 329
    title: "Ctrl/Cmd+Z matched on event.key only - dead on a Cyrillic layout"
    description: |
      The shortcut requires event.key.toLowerCase() === "z". With a Russian (JCUKEN) layout
      active, the Z key reports event.key "я", so Ctrl+Z / Shift+Ctrl+Z do nothing while the
      buttons still work. Not covered by AC-309 (which presses Latin "z").
    suggestion: |
      Accept event.code === "KeyZ" when event.key is not a Latin letter (keeps QWERTZ correct,
      fixes Cyrillic): `const isZ = event.key.toLowerCase() === "z" || (!/^[a-z]$/i.test(event.key) && event.code === "KeyZ");`
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: feature
    type: bug
    file: src/nonogram/admin/static/solver.js
    line: 310
    title: "Tool can change mid-drag via keyboard: preview drawn with one tool, stroke recorded with another"
    description: |
      The tool buttons' click handler (solver.js:310-313) does not check `gesture`, unlike the
      history buttons (:322-324) and the shortcut (:328). With a tool button focused, pressing
      Enter/Space while the pointer is held on the board switches `tool`; pointerup then records
      dragStroke(..., tool) with the new tool although the preview so far showed the old one.
    suggestion: |
      Capture the tool into the gesture at pointerdown (gesture.tool = tool) and use it for the
      preview and the recorded stroke, or ignore tool clicks while a gesture is active.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
