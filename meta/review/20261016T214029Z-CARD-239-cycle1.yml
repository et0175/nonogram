  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_guard_integrity.py
    line: 715
    title: "AC-6's no-invocation guard misses a shell-string invocation of --check-log; its own positive control for that case passes against a reimplemented predicate the guard does not use"
    description: |
      `test_no_guarded_source_invokes_the_check_log_subcommand` (line 715) walks
      every *.py under tests/ and meta/profiling/ and reports a Constant whose
      value is EXACTLY `CHECK_LOG_OPTION`:

          and node.value == CHECK_LOG_OPTION

      Its positive-control test, `test_the_invocation_rule_catches_every_way_of_passing_it`
      (line 759), does not call that rule. It reimplements it inline with a
      strictly wider predicate:

          and CHECK_LOG_OPTION in str(node.value)

      So the "a shell string" control (`os.system("r.py --check-log x")`) is green
      against a predicate the guard does not run. Measured, both predicates copied
      verbatim into one script:

          a subprocess argv      control=True  DEPLOYED=True
          main() directly        control=True  DEPLOYED=True
          a shell string         control=True  DEPLOYED=False
          subprocess(shell=True) control=True  DEPLOYED=False

      Measured on disk too, one mutant per fresh pytest process, both restored
      from a byte copy with md5 verified:
        * planted in tests/test_clues.py:
          `subprocess.run(["python","meta/profiling/rank_durations.py","--check-log","x"])`
          -> guard RED (killed).
        * planted in tests/test_clues.py:
          `os.system("python meta/profiling/rank_durations.py --check-log meta/kanban/suite-timing.log")`
          -> guard GREEN, `1 passed`. SURVIVED.

      The consequence is the one CARD-238 was cut for: a guarded source can shell
      out to the deliberate reader against the owner's live gitignored log and
      AC-6's guard stays green - the suite's verdict becomes a fact about the host
      again, and G-1's territory is reachable through a route no test reports.
      It is a realistic route in this very tree: the sweep's own row F-8 argues
      that shelling out to list files "is **this module's own idiom** (six
      `git ls-files` listings)". The first module records exactly that blind spot
      as two MEASURED_STRUCTURAL_MISSES entries; the new module's rule has the
      same blind spot and claims a control for it instead.

      Sweep row E-3 therefore overstates: '"no test invokes the subcommand" |
      **PINNED** ... with four fabricated positive controls (a subprocess argv,
      `main([...])`, a shell string, an argv list)'. Three of four discriminate
      against the deployed rule; the shell-string one measures a copy.

      Root cause shared with F-001 and with the project's own precedent: all three
      AC-6 tests (lines 679, 759, 797) re-derive the predicate inline instead of
      calling one function, so a control certifies a copy rather than the rule.
      The first module avoids this by construction - every control there calls
      `_live_log_references`, which is why mutants M1/M6 and the
      `SPELLINGS.without(spelling)` discrimination tests are meaningful.
    suggestion: |
      Factor the rule into a module-level function (e.g.
      `_check_log_invocations(source) -> dict[str, list[str]]`) and have all three
      tests call it, so a control cannot be green against a predicate that is not
      deployed - the shape `_live_log_references` already has in the other module.
      Then decide the shell-string case explicitly: either widen the deployed
      predicate to `CHECK_LOG_OPTION in str(node.value)` (and keep the
      add_argument / module-assignment shape exemptions, which still hold), or
      drop the shell-string control and record the form as a measured miss with a
      reason. Do not leave a control that passes for a form the rule misses.
    confidence: high
    source: static
    violates: AC-7
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

