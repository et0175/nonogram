findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 126
    title: "The module-scope silence rule is described and swept as default-deny; measured, it is enumerate-and-report, and a sibling silencing spelling produces the identical verdict undetected"
    description: |
      `_MODULE_SCOPE_SILENCERS = frozenset({"skip", "exit", "importorskip", "xfail"})`
      with `_module_scope_silences()` reporting (a) a module-scope call whose last
      name component is in that set and (b) any `pytestmark` binding. Nothing else
      at module scope is reported.

      Three claims in this diff are false of that code:
        * line 126 "Default-deny, because the alternative does not work."
        * lines 131-133 "the completeness claim is carried by the shape of the
          rule: a module-scope statement this rule does not understand is
          reported, not ignored."
        * line 259 (MEASURED_MODULE_SCOPE_SILENCES) "Every module-scope silence in
          the guarded tree. Empty, measured 2026-10-17."

      Measured by calling `_module_scope_silences` directly (fresh process, module
      loaded by path):
        raise unittest.SkipTest("no timing log on this host")  -> []
        os._exit(0) under a host-state if                      -> []
        a helper function that calls pytest.skip(...)           -> []
        collect_ignore = ["test_suite_profile.py"]              -> []
        pytest.skip(..., allow_module_level=True)               -> [('skip() at module scope', '')]

      The first of those is not hypothetical. Run as a real pytest module
      (scratchpad sandbox, fresh process):

        import unittest, os
        if not os.path.exists("/nonexistent-timing-log"):
            raise unittest.SkipTest("no timing log on this host")
        def test_guard_a(): assert False
        def test_guard_b(): assert False

      -> `1 skipped in 0.00s`, rc=0. That is byte-for-byte the verdict the F-308
      mutant produced ("1 skipped in 0.03s, rc=0 - 398 guards gone, run green")
      and the verdict the card calls the CARD-234-green / CARD-235-red flip. So
      AC-4's hole is closed for the four spellings someone thought of and open for
      a sibling with the same observable outcome. (`os._exit(0)` is quieter still:
      rc=0 with no output at all.)

      This is the governing rule unmet: the set a guard consults has no
      completeness test. The only completeness-shaped test,
      `test_every_silencer_it_names_has_a_control`, runs the CONVERSE direction
      (every member has a control) - which is why it caught `skip_module` and
      `fail` and cannot catch an absent member. `test_every_way_a_module_goes_quiet_is_reported`
      (9 positive) and `test_what_this_rule_must_not_claim_is_not_claimed`
      (6 negative) are all about members of the set.

      And the sweep records it as pinned. Row D-6: '"the module-scope rule is
      default-deny" | **PINNED** - nine positive controls ... the completeness
      claim is carried by the rule's shape, not by the list: nothing enumerates
      the ways a module can go quiet, so what is enumerated is what is *allowed*.'
      The last clause is inverted: what is enumerated is what is REPORTED.
      D-6 is the row a generous reading would hide behind, and it is false.

      The card knew the right shape and applied it one module over: the first
      module derives its surface from dir(os)/dir(os.path)/dir(glob)/dir(pathlib.Path)
      and is red on any unclassified name (`test_every_spelling_the_stdlib_offers_is_classified`,
      verified red by mutant M3 below). The new module has no equivalent.
    suggestion: |
      Either close it or record it, not describe it:
        (a) derive, the way AC-1 did - probe a surface (e.g. `dir(pytest)` plus
            `unittest.SkipTest`, `os._exit`, `sys.exit`, conftest's
            `collect_ignore`/`collect_ignore_glob`) and be red on any name that is
            neither a silencer nor an exclusion carrying a reason; or
        (b) delete the three sentences and add the measured misses as controls in
            the shape this card already uses for exactly this purpose - a
            MEASURED_STRUCTURAL_MISSES-style tuple asserting
            `_module_scope_silences(src) == []` for the SkipTest, `os._exit`,
            helper-indirection and `collect_ignore` forms, so the bound goes red
            the day the rule grows past it.
      (b) is one tuple and honours G-4. Whichever is chosen, sweep row D-6 must
      stop saying PINNED.
    confidence: high
    source: static
    violates: AC-7
    root_cause: RC-1
