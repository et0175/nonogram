findings:
  - id: F-1
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/orchestrator.py
    line: 1975
    title: "The reveal policy's requested-tier gate is unverified: the mutant removing it survives the whole suite, and the card's named test for that behaviour never reaches the code"
    description: |
      Two mechanically established facts, both from runs on this head.

      (1) Mutating `return accepted if accepted.difficulty_in_requested_tier
      else None` (orchestrator.py:1975) to `return accepted` leaves
      tests/test_given_cells.py at 20 passed. `grep -rl reveal_given_cells
      tests/` returns exactly ONE file, so that mutant survives the entire
      suite — nothing anywhere exercises the gate.

      (2) The reason is that the card's declared behaviour ("a missed
      difficulty tier is not rescued", Worktree notes; test:
      test_the_reveal_policy_does_not_rescue_a_missed_difficulty_tier) is
      verified by a test that never enters the reveal policy at all. I proved
      this by planting `raise AssertionError("MUTANT-PROBE")` as the first
      statement of `accept_by_revealing`: four tests in that file fail, and
      test_the_reveal_policy_does_not_rescue_a_missed_difficulty_tier is NOT
      one of them. It uses an already-unique image conversion, so
      `attempt_candidate()` returns a candidate, the nudge loop never runs, and
      the tier refusal is raised at orchestrator.py:2176-2177 — which sits at
      indent 8 OUTSIDE the inner `try`, so `accept_by_revealing` is never
      called. The test passes for a reason unrelated to the behaviour it names.

      The code is correct; the gap is in the evidence, and it is on the one
      branch where the gate is load-bearing. In image mode the gate is
      redundant (the tier check at 2176 re-checks the revealed candidate). In
      random/library mode it is not: the outer handler does `return revealed`
      with no further tier check (orchestrator.py:2193-2196), so if the gate
      ever regressed, a revealed puzzle outside the requested tier would be
      returned — which is precisely the "the flag silently widens what
      `--difficulty` means" outcome the card forbids. Every request helper in
      tests/test_given_cells.py leaves `difficulty` unset, and
      `difficulty_in_requested_tier` returns `True` unconditionally when
      `requested_tier is None` (orchestrator.py:1262-1263), so the gate is a
      no-op in every existing case.

      Weighted up rather than down: orchestrator.py carries 22 commits in the
      last 12 months with 7 of them fix/bug-shaped (~29% defect density), and
      `solver.solve` has 3 production callers.
    suggestion: |
      Add one random-mode case with `difficulty=` set to a tier the revealed
      puzzle does not land in, and assert the run still raises
      GenerationAbandoned (not a returned puzzle) and that
      `puzzle.ready_for_export` stays False. That one test kills the surviving
      mutant and gives the declared behaviour real evidence on the branch where
      it matters. Separately, either retarget
      test_the_reveal_policy_does_not_rescue_a_missed_difficulty_tier so it
      actually reaches `accept_by_revealing` (e.g. an ambiguous conversion whose
      revealed form misses the tier), or keep it and rename it to say what it
      checks — that an already-unique tier miss is refused before the policy is
      consulted.
    confidence: high
    source: static
