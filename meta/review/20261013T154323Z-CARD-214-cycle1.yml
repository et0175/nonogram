  - id: F-2
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_given_cells.py
    line: 24
    title: "The 'in any process' determinism rationale is factually wrong: PYTHONHASHSEED does not perturb the iteration order of a set of (row, column) tuples"
    description: |
      The module docstring (lines 24-31) and `_in_child`'s docstring state that
      "``PYTHONHASHSEED`` changes the iteration order of every set and dict in
      the interpreter, so a choice that depended on one — and 'collect the
      disagreeing cells, take one' is exactly the shape that does — is stable
      within a run and unstable across runs." That is the named justification
      for EC(ADR-0024/R4)'s "in any process" half, and it is not true for the
      shape it names. CPython's hash randomisation covers `str`, `bytes` and
      `datetime` only; `int` hashes to itself, so a `set[tuple[int, int]]`
      iterates identically under every seed. Measured on this machine with the
      project venv: the same 8-element set of `(row, column)` tuples prints in
      byte-identical order under PYTHONHASHSEED 0, 1, 2 and 42, while a
      5-element set of strings reorders under each.

      The property itself holds, and I verified it directly rather than
      trusting the test: `grep -n 'set(|\.items\(\)|\.keys\(\)|\.values\(\)'`
      over src/nonogram/solver/search.py and src/nonogram/solver/propagate.py
      returns zero hits, and `_first_disagreement_cell` walks lists in
      row-major order. So this is a wrong rationale next to correct code, not a
      defect — but it is the rationale a future card will read before adding a
      set to the choice path, and it tells that reader a guard exists where
      none does. (What the subprocess check does genuinely buy: independence
      from env, cwd, import order and module-level caches — worth keeping, just
      not for the reason given.)
    suggestion: |
      Correct the two docstrings to claim what the subprocess actually proves
      (a fresh interpreter, no inherited module/env state) and drop the
      "collect the disagreeing cells, take one" example, since that shape is
      not hash-order-sensitive. If a real guard for it is wanted, the cheap one
      is structural rather than behavioural: assert that the chooser's own
      source builds no set or dict — the same posture the package's `ast`
      import guard already takes.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-3
    severity: low
    category: tech-debt
    type: bug
    file: src/nonogram/solver/search.py
    line: 529
    title: "`solve`'s docstring says 'the grades on record all come from unseeded solves', which this card's own policy makes false"
    description: |
      search.py's Returns section (the paragraph added for `givens`) says of
      `line_logic_cells` and the missing rung tags: "Neither is read on the
      seeded path by anything that grades a *puzzle*: the grades on record all
      come from unseeded solves."

      The orchestrator does exactly the opposite, deliberately:
      `judge_candidate` calls
      `puzzle.record_difficulty(difficulty.score_difficulty(verdict.signals),
      verdict.signals.branch_nodes, verdict.signals.rungs)`
      (orchestrator.py:1884-1888) off the SAME verdict it just obtained — which,
      for a revealed puzzle, is the seeded one. The card's own Structural
      decisions section states the true version ("a puzzle accepted with givens
      is GRADED off that seeded solve's signals ... a revealed puzzle grades
      easier"), so the design is intentional and consistent; only this one
      sentence in the solver contradicts it.

      It matters because the consequence is real and user-visible: a revealed
      puzzle's `line_logic_cells` counts the given cells, its given cells carry
      no rung tag, so its score and tier are computed on a strictly easier
      reading of the same picture — and that grade is what the requested-tier
      gate (F-1) then compares against. A reader who trusts this sentence will
      conclude that cannot happen.
    suggestion: |
      Replace the sentence with the card's own version: a revealed puzzle IS
      graded off its seeded solve (ADR-0029/R2's "one derivation from the one
      verifying solve"), which grades it easier because the solver genuinely
      meets it with those cells filled; every pre-CARD-214 grade on record came
      from an unseeded solve.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-4
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_solver_uniqueness.py
    line: 259
    title: "The seeded EC-001 corpus covers a narrower size range than the unseeded one, for a reason that does not explain the narrowing"
    description: |
      `GIVEN_SIZES = (2, 3, 4, 5, 6)` against the pre-existing
      `SIZES = (1, 2, 3, 4, 5, 6, 7, 8)` for the same property. The stated
      reason — "a *contradicted* given can make the oracle's row-candidate
      filter empty only after the product has been set up, and 2..6 already
      covers every shape of line-placement bug" — explains neither why 7 and 8
      are dropped nor why a contradicted given costs more at 7 than at 6; the
      oracle's own docstring puts its comfort ceiling at 7x7 and its usable
      ceiling at 8x8, so both sizes are affordable.

      This is a coverage gap in the committed guard, not a latent defect: I ran
      my own 240-case solver-vs-oracle cross-check at 7x7 and 8x8, with
      consistent, contradicted and clue-mutated givens at six reveal shares,
      and found 0 mismatches across 189 truly-0, 23 truly-1 and 28 truly-MANY
      cases. The seeded property is sound at those sizes; it is simply not
      asserted there.
    suggestion: |
      Extend GIVEN_SIZES to (2, 3, 4, 5, 6, 7) — or to 8 if the corpus time
      stays inside its couple of seconds — or state the real cost reason. The
      oracle's own ceiling, not the contradicted-given argument, is the honest
      bound to cite.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-5
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/orchestrator.py
    line: 2038
    title: "The 'FIRST sourced candidate, never the latest' decision is indistinguishable from 'the latest draw' in every test, because the scripted source returns one grid"
    description: |
      Mutating `if pristine_candidate is None:` (orchestrator.py:2038) to
      `if True:` — so the policy hands over the LATEST sourced grid rather than
      the run's first — leaves tests/test_given_cells.py at 20 passed. The
      cause is `_CountingSource.__call__` (tests/test_given_cells.py:512-514),
      which returns a fresh copy of the same grid on every call, so no test can
      see the difference between the first draw and the thirtieth.

      The important half of the decision IS structurally guaranteed and is
      asserted: the assignment sits inside `attempt_candidate`'s fresh-draw
      branch, so `pristine_candidate` can never be a repaired or nudged
      derivative, and test_the_reveal_policy_keeps_the_random_mode_retry_bound
      asserts `puzzle.grid == _SIX_SWITCHES` after 30 redraws and several
      repairs. In image mode the source is called exactly once, so first and
      latest coincide by construction. What is unguarded is only the
      random/library "first draw rather than the thirtieth" half, where the two
      are behaviourally equivalent (both are fresh draws). Recorded because a
      surviving mutant on a declared STRUCTURE decision is worth knowing about,
      not because the behaviour is at risk.
    suggestion: |
      Give the random-mode test a source that returns a DIFFERENT grid per call
      (e.g. a list of scripted grids, cycling) and assert the accepted grid is
      the first element. That kills the mutant and pins the decision CARD-215
      and CARD-216 will read as "the picture the user gave us".
    confidence: high
    source: static
    violates: null
