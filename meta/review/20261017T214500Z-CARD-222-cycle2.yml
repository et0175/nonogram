  - id: F-006
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_book_guide_page_type.py
    line: 611
    title: "The new count bound's docstring names two failure paths it cannot demonstrate, and omits the one it can"
    description: |
      The count bound added for cycle 1's F-002 is a real control — confirmed
      killed by M11. What is wrong is the reach its prose claims. Both
      KNOWN_BARE_LEVEL_2_OVERFLOWING_CASES' docstring
      (tests/test_book_guide_page_type.py:611-619) and the test's own docstring
      (:807-812) name the same two scenarios:

        "A seventh case overflowing -- a clean case starting to, or the ceiling
         being lifted so that a taller case falls under the lenient branch --
         fails rather than passing green."

      The first was already conceded unreachable by the fix agent and I confirm
      it: of the 48 corpus cases, 6 sit below the 12.5 cm ceiling and ALL SIX
      already overflow, so there is no clean sub-ceiling case left to start.
      (Measured independently: 19.86x12.44 +6 px, 10.79x11.79 +82, 22.37x10.81
      +127, 10.00x10.00 +140, 29.31x11.29 +140, 26.91x11.12 +140 — which also
      confirms the docstring's "six ... by 6 to 140 px" exactly.)

      The second is the one the commit message rests the control's value on,
      and it does not fire either:

        * M9b: KNOWN_BARE_LEVEL_2_HEIGHT_CEILING_CM lifted 12.5 -> 40.0 cm,
          with bottom_in raised 0.47 -> 0.48 in to shift the frame — 17 passed,
          zero FAILED. Lifting the ceiling absorbs nothing, because the frame
          shift creates no new overflow: the 5-level fallback ladder fits
          content TO the frame, so every tall case stays flush (measured: the
          six nearest-to-overflow cases above the ceiling all sit at exactly
          1 px of slack, by construction).
        * M10: GUIDE_BODY_PT raised 11.0 -> 16.0 pt (+45% body type) and the
          overflow table measured directly — the overflowing set is STILL
          exactly those same six trims, the tallest overflowing trim is still
          12.44 cm, and the overflow saturates at 140 px. bare_level 2 is the
          bottom of the ladder, so the set is a function of trim height alone
          and content pressure cannot move the threshold.

      The path that DOES red it is corpus growth, which neither docstring
      mentions: M11 raised CORPUS_CASES 48 -> 96 and the bound fired with its
      own message, "AssertionError: 15 of the corpus's 96 cases now overflow
      the bottom margin against the measured 6".

      Concrete failure scenario for the claim (not for the code): an engineer
      reads the docstring, believes a ceiling lift is guarded, and lifts
      KNOWN_BARE_LEVEL_2_HEIGHT_CEILING_CM to absorb a tall page's new
      overflow. Measured above: the suite stays green and no bound reds —
      the exact silent-widening the bound was added to refuse. The claim is
      logically sound (if a taller case did overflow, the count would reach 7)
      but is not demonstrable from any input probed, so it should not be the
      stated justification.
    suggestion: |
      Restate the reach to what the mutants show. Two lines:
        * name the corpus-growth path, which is demonstrated — "a seventh case
          arriving because the corpus grew (CORPUS_CASES, its seed, or its trim
          range) reds here; measured at CORPUS_CASES=96, 15 against 6";
        * say that the set is structural — every corpus case below ~12.5 cm
          overflows and none above does, at any content size (measured at
          GUIDE_BODY_PT 16 pt: the same six, saturating at 140 px) — so the
          ceiling-lift path is a safeguard against a change to the ladder
          itself, not something today's inputs can drive.
      No code change is needed; the control is correct.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

