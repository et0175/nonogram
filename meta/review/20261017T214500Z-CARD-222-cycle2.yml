      The lower pin therefore comes from tests/test_book_floor.py:499's
      `assert cells[below] < FLOOR_MM <= cells[above]`, whose fixtures are
      BELOW_FLOOR's 4.54 mm and ABOVE_FLOOR's 4.76 mm — a straddle 0.22 mm
