# ALSO CONFIRMED
# ---------------------------------------------------------------------------
also_confirmed:
  f001_two_sentences_now_true: >-
    YES, and the code is what makes them so. Replayed cycle 1's surviving M-1 on
    the FIXED tree — the probe's grep given a flag it does not have, blob
    f2b0d4ada1f64568cef7d875410f919517e5ece8 — and
    `test_each_near_miss_probe_is_visible_to_ps[e]` now RED (2 failed, 33
    passed; `test_a_probe_leaves_no_orphan_behind` red with it). Where cycle 1
    measured 29/29 green with no search tool on the host, HEAD reds. The (e)
    branch requires a child of the wrapper carrying the text whose `$1` is not a
    shell, and on this host that child is measurably the grep. config.yml's
    "that immunity is now asserted rather than reasoned -- asserted ON THE GREP"
    and R4's "for the search tool that means THE SEARCH TOOL, a child of the
    pipeline whose own $1 is not a shell" are both TRUE as written. One
    qualification, which is F-103 and not a falsity: the "$1 is not a shell"
    half of that requirement is itself uncontrolled and unexercised.
  g1_held: >-
    YES. ONE hunk in the ADR (@@ -541,10 +541,29 @@). Every `-`/`+` line is a
    `#` comment; a grep over the changed lines for `statement:`, `scope:`,
    `severity:` and `check:` returns nothing, and a grep for any changed line
    that is NOT a comment returns nothing. R4's statement, scope, severity and
    check are byte-identical to the merge base.
  the_rename_is_inert_today_and_the_silencer_is_measured:
    inert: >-
      YES. The pre-rename name (the one-place test's name without its
      `_in_config_yml` suffix) now resolves to ZERO `def` lines tree-wide, and
      it is spelled in exactly ONE tracked file: the cycle-1 review YAML. R4's
      `check:` does not name it — R4 names three refs and none is that one — and
      `system_rules.py --verify-refs --format yaml` on this worktree reports
      `dead_check_ref: []`, `check_refs_verified: true`, `unparseable_sources: []`.
      The name is in neither the census nor the DEFINED set.
    but_the_hazard_is_no_longer_theoretical: >-
      MEASURED, on this exact name. In the out-of-tree copy I appended that dead
      name to R4's own `check:` ref list and ran --verify-refs twice. WITH the
      cycle-1 review YAML present: `dead_check_ref: []`. With that one file
      moved aside: `dead_check_ref: ["ADR-0039/R4 -> <the dead name> (partial —
      still checked by: ...)"]`. So the board's safety net for that name is
      switched off by a committed file, and it will stay off. Inert because
      nothing names it; NOT inert because nothing could. See F-105.
  grep_q_correction_to_cycle_1: >-
    THE ROUND IS RIGHT, and cycle 1's committed report is wrong on this point.
    Re-derived: spawned the case-(e) pipeline three ways and enumerated the
    wrapper's children. With a plain grep, children are
    `['sleep 5', '/usr/bin/grep -- <pattern>']` and the (e) branch returns the
    grep. With `grep -q`, children are
    `['sleep 5', '/usr/bin/grep -q -- <pattern>']` — the grep still blocks on
    the pipe, so a real search tool exists and the fixed branch finds it. Only
    the unknown-flag form leaves `['sleep 5']` alone and reds. So cycle 1's M-7
    `grep -q` variant surviving was legitimate behaviour, not a second
    independent witness for F-001, and listing it as corroboration overstated
    the evidence by one witness. Correcting a committed review report against
    measurement is the behaviour R4 exists to produce.
  f010_already_on_main: >-
    CONFIRMED. The card's AC-3 residue list now reads "one-off shell commands
    that are not prescriptions"; the contradicted heading is gone. Nothing was
    owed.
  pgrep_fc_re_measurements: >-
    ALL THREE EXACT, under pipefail. `pgrep -fc 'python.* -m pytest'` bare ->
    exit 2, empty stdout, usage on stderr. Same form with `|| [ $? -eq 1 ]` ->
    exit 1, so it STILL reds (2 != 1). The normalized grep form
    (`ps -Ao command= | grep -c '[m] pytest' || [ $? -eq 1 ]`) -> exit 0. Also
    re-confirmed: `pgrep -f 'python.* -m pytest' | wc -l` -> exit 1, stdout 0.
  sandbox_narrowing: >-
    CONFIRMED by derivation, not by reading: the class collects 35 node ids and
    SANDBOX_DESELECTED's four methods account for exactly 11 of them
    (visible_to_ps 5, rises 1, does_not_rise 4, declared_bound 1), leaving 24
    participating in both sandbox copies. TestSuiteTiming_CollectsTheSameWithAnd
    WithoutTheLog is 127 passed in 27.93 s.
  validators: "100 WARN / 0 ERROR (Counter({'WARN': 100}), zero ERROR rows); dead_check_ref: []."
  node_ids: "445 at HEAD, 439 at the merge base. See the figure correction below."

# ---------------------------------------------------------------------------
# WHAT I MEASURED TO BE WRONG in the brief, the card or the round's report
