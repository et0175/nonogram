# ---------------------------------------------------------------------------
# FINDINGS, ranked
# ---------------------------------------------------------------------------
findings:
  - id: F-101
    severity: high
    confidence: measured
    title: >-
      On a quiet board `test_a_rejected_instrument_is_still_refuted_on_this_host[pgrep -f]`
      asserts nothing — half (1) cannot fail there and half (2) cannot see the
      only real pytest that is always alive — and the declared bound says the
      opposite.
    where:
      - "tests/test_suite_profile.py — test_a_rejected_instrument_is_still_refuted_on_this_host, its DECLARED BOUND paragraph and both assertions"
      - "meta/kanban/config.yml — the `rejected` entry for the case-sensitive `pgrep -f` form"
    measured: >-
      Half (1) compares `_reading(instrument)` with the prescribed count.
      `pgrep -f` can only print a PID list; `_reading` turns that into a pid
      (never equal to a one-digit count) or into None (two or more pids), so the
      inequality is a guaranteed pass on that row — structurally, not
      circumstantially. Half (2) asks whether anything the instrument matched is
      a run the prescribed cell would count, and BSD pgrep's documented default
      excludes the invoking process AND ALL ITS ANCESTORS (`man pgrep`, the `-a`
      flag), so the test's own runner — a real `-m pytest` that the prescribed
      cell does count, measured at 2 from inside a run — is invisible to it.
      M-E proves the consequence both ways with the same stale instrument in
      place (`pgrep -fi`, which config.yml itself records as no longer blind):
      KILLED by half (2) alone while CARD-306's gate was live, naming its pids;
      SURVIVED, 2 passed in 0.29 s, on a quiet host. M-L shows half (1) is not
      decorative for the `-fc` row, which is the only row it protects.
    why_it_matters: >-
      This is the card's own subject one row over: a control whose green is not
      evidence. Worse, its greenness is a function of what ELSE is running on
      the host, so the row is green on a solo run and only becomes informative
      when a sibling card happens to be mid-gate — the inverse of what a gate
      should do. And the paragraph that would tell a reader this says "the first
      half carries the row either way", which is the one sentence a future
      reader would rely on.
    fix: >-
      Two small changes, either of which restores the row. (a) Add `-a` to the
      pgrep forms the test runs — not to the prescription, only to the
      re-execution — so the runner is in the match list and half (2) is strong on
      every run; the rejection's verdict is about blindness, and the runner is
      exactly the run it must be blind to. (b) Restate the bound to say which
      half carries which row: half (1) carries `-fc` (M-L), half (2) carries
      `-f`, and neither carries both. If (a) is taken, the bound shortens to one
      sentence instead of needing a hedge.

  - id: F-102
    severity: medium
    confidence: measured
    title: >-
      `_is_a_real_pytest_run` — the awk's two halves reimplemented natively — has
      no control at all, and no cross-check against the awk it mirrors.
    where: "tests/test_suite_profile.py — _is_a_real_pytest_run, and its single call site in the refutation test"
    measured: >-
      M-I: the body replaced with `return False`, i.e. the helper made totally
      blind. 35 passed in 5.26 s. Nothing in the collected set notices, because
      half (2)'s only assertion is `not counted` — so any narrowing of this
      predicate is a silent pass, which is ADR-0039/R2's named prohibition.
      Separately: the copy IS faithful today. I cross-checked it against the awk
      over every live `ps -eo command=` row and over a 20-case synthetic argv
      corpus aimed at the shapes that could diverge; zero disagreements either
      way. But that corpus is mine. The awk is read out of config.yml at run
      time by `_instrument()` while the two halves are frozen in Python, and
      nothing compares them — so a future edit to the prescription leaves the
      copy behind with no red.
    why_it_matters: >-
      The project's own precedent for reimplementing rather than importing
      (`solver/propagate.py`'s `mask_runs`) is explicitly cross-checked from the
      test tree against the thing it mirrors, and CLAUDE.md names that as the
      pattern. This copy has the reimplementation without the cross-check, which
      is the half that makes the pattern safe.
    fix: >-
      A table-driven control in the same class: a handful of argv strings with
      expected verdicts, asserted BOTH against `_is_a_real_pytest_run` and
      against the prescription's own awk run as a subprocess over the same
      strings. That is one test, it is the `mask_runs` shape, and it reds on
      either drift or blindness.

  - id: F-103
    severity: medium
    confidence: measured
    title: >-
      `_is_a_shell`'s set is hand-written, not derived from the enumerable
      authority that exists, and its default on an unrecognised shape is a
      silent pass in exactly the direction F-001 was about — ADR-0039/R2,
      mandatory, `tests/**` in scope.
    where: "tests/test_suite_profile.py — _is_a_shell; its call sites in _wait_until_visible and in the visibility control's second assertion"
    measured: >-
      The predicate is one derived equality (config.yml's `shell` key) OR a
      hand-written suffix rule (`Path(executable).name.endswith("sh")`). No
      authority backs the suffix rule, and `/etc/shells` — 7 entries on this
      host — is an enumerable authority that agrees with it on all 7, so
      deriving the set would change no present answer and would make it
      checkable. Measured misclassifications: `env zsh`, `/usr/bin/env sh`,
      `/bin/bash-5.2` and any shebang wrapper read as NOT a shell (and the
      caller's test is `not _is_a_shell(child)`, so an unrecognised shell is
      accepted as the search tool); `/usr/bin/ssh` reads as a shell. The brief's
      `/bin/sh` and `-zsh` both work.
      M-A: the body replaced with `return False` — 35 passed. M-B: `return True`
      — 3 failed. So the predicate is controlled only in the over-inclusive
      direction, and uncontrolled in the one that reinstates the vacuity.
      Also measured: the clause is never exercised. A live case-(e) probe's
      children were exactly `('sleep N', 'grep -- <pattern>')` across 12 trials
      and 30 polls at 50 ms — zsh's pre-exec window for a pipeline stage never
      appeared — so nothing on this host ever reaches the shell filter.
    why_it_matters: >-
      R4's REACH comment and config.yml's restated paragraph both present "a
      child whose own $1 is not a shell" as the thing that makes the branch
      sound. It is the half of that requirement with no authority, no control
      and no realized work. The sentences are still true (the code does require
      it); the guarantee behind them is thinner than it reads.
    fix: >-
      Derive the set from `/etc/shells` plus config.yml's declared `shell`,
      default to DENY on an unparseable executable (treat "cannot analyse" as
      "is a shell", which is the safe direction for this caller), and add the
      third pair to VISIBILITY_CONTROL_PROBES that would make M-A red: a probe
      whose pattern-carrying child IS a shell and must not be accepted.

  - id: F-104
    severity: medium
    confidence: measured
    title: >-
      `test_a_probe_leaves_no_orphan_behind` measures a WAIT, not a kill — and
      the hang-guard exposure cycle 1's F-005 removed has re-entered through the
      fix for F-004.
    where: "tests/test_suite_profile.py — test_a_probe_leaves_no_orphan_behind; _kill_group's proc.wait(timeout=60); the module-scoped rival_matrix fixture"
    measured: >-
      M-J: `start_new_session=True` -> `False` on the search-tool spawn alone.
      35 PASSED, in 65.41 s instead of ~5 s. Without a new session `proc.pid` is
      not a process-group id, `os.killpg` raises ProcessLookupError, the
      `finally` tolerates it by design, and `proc.wait(timeout=60)` then waits
      out PROBE_LIFETIME_SECONDS = 30 per search-tool spawn. The children are
      gone when the assertion looks because they expired, not because they were
      killed.
      M-J2: the same at all six spawn sites. The run was KILLED at 121.18 s with
      15 dots and NO SUMMARY LINE — hang_guard's 120 s `exit=True`. The fixture
      builds up to 6 cases x 4 BASELINE_ATTEMPTS = 24 spawns inside ONE node, so
      the ceiling on that node is now dominated by `_kill_group`'s 60 s wait,
      not by the PROBE_VISIBLE_TIMEOUT x 5 that F-005 lowered from 30 to 5. One
      broken shape already costs 65 s of a 120 s node budget.
    why_it_matters: >-
      The orphan claim itself is TRUE and I re-measured it independently (five
      before, including the grep spelling ` -m pytest`; zero after, including
      after whole-module runs). The defect is in what the new test can detect:
      it cannot tell a working `killpg` from one that reaches nothing, which is
      the only thing the F-004 fix added. And F-005's own argument — that this
      node must stay clear of a guard whose action is to kill the process and
      produce no verdict — now applies to a larger term than the one that was
      reduced.
    fix: >-
      Assert the kill rather than the outcome: after `os.killpg`, poll for the
      children's disappearance with a budget of a second or two and fail if they
      outlive it, instead of letting `proc.wait(timeout=60)` absorb the
      difference. Drop that wait to a few seconds (a group that got SIGKILL does
      not need 60), and make the ProcessLookupError arm distinguish "the group
      was already gone" from "there was never a group with that id" — the second
      is the mutant and it is distinguishable (`os.getpgid(proc.pid) != proc.pid`).

  - id: F-105
    severity: low-medium
    confidence: measured
    title: >-
      The deliberate rename orphaned a name whose dead-ref warning is now
      permanently silenced by a committed review YAML — inert today, and the
      silencing is measured rather than feared.
    where:
      - "tests/test_suite_profile.py:6125 — the renamed one-place test"
      - "meta/review/20261030T000000Z-CARD-304-cycle1.yml — the only tracked file still spelling the old name"
    measured: >-
      The pre-rename name resolves to ZERO `def` lines tree-wide and appears in
      exactly one tracked file, the cycle-1 report. Nothing declares it: R4's
      `check:` names three refs and none is that one, and --verify-refs is
      `dead_check_ref: []` / `check_refs_verified: true` / `unparseable_sources: []`.
      So the rename is INERT.
      The hazard, however, is no longer theoretical. With that dead name
      appended to R4's own `check:` ref list in an out-of-tree copy:
      --verify-refs reports `dead_check_ref: []` while the cycle-1 YAML is
      present, and reports the dead ref the moment that one file is moved aside.
      The board's safety net for that specific name is off, by a committed file,
      permanently.
    why_it_matters: >-
      It is the board-level version of this card's subject: a resolver whose text
      domain includes its own review reports cannot tell a live instrument from a
      discussed one, and every review cycle widens the blind spot by one file.
      CARD-304 did not create the mechanism, but its rename is the first name on
      which the mechanism has been measured end to end.
    fix: >-
      Nothing for this card beyond recording it. For the board: a card that
      excludes `meta/review/**` from the ref resolver's text domain, or requires
      review YAMLs to spell test names in a split form. Until then, review
      reports should assume every name they spell is a name they have revived —
      which is why this report writes the orphaned one descriptively and never
      in full.

  - id: F-106
    severity: low
    confidence: measured
    title: >-
      Both re-measured cost bands are already outside their own ranges, one day
      old, and the class band is now outside in BOTH directions — the shape
      cycle 1's F-003 named, surviving its own fix.
    where: "tests/test_suite_profile.py — the module docstring's CARD-304 re-measurement paragraph"
    measured: >-
      Class, 5.3-5.8 s session / 6.2-6.7 s wall over five runs. Seven runs here:
      quiet host 4.95 / 4.99 / 5.31 s session, 5.54 / 5.61 / 6.51 s wall;
      sibling gate live 5.64 / 5.87 / 5.96 s session, 6.65 / 6.74 / 7.13 s wall.
      Outside at both ends on both readings.
      Module, 37.6-39.0 s session over six runs: 37.28 / 38.62 / 39.09 / 40.30 s
      here. Outside at both ends.
    why_it_matters: >-
      The F-003 fix was the right one and it did the hard half — each module
      figure now carries its host, date, node-id count and (for the newest) the
      fact that a sibling gate was live. The class figure did not get the same
      treatment: it says WHICH READING it is, which was F-011, but it is still a
      bare two-decimal range from five runs with no domain, immediately below
      bullets that argue five runs cannot bound this quantity. The paragraph's
      conclusion is unaffected and remains correct.
    fix: >-
      Give the class figure the same bullet treatment as the module totals, with
      contention in its domain, or widen it to the measurements that now exist
      (4.95-5.96 s session, 5.54-7.13 s wall, 13 runs across two load domains).

  - id: F-107
    severity: low
    confidence: measured
    title: >-
      AC-5 is the one acceptance criterion HEAD literally contradicts, and only
      the commit message says so.
    where: "meta/kanban/cards/CARD-304.md — AC-5, and its census paragraph"
    measured: >-
      AC-5 reads "collected node-id set loses nothing; additions named. **Param
      ids count.**" The raw symmetric difference at HEAD is 2 REMOVED / 8 ADDED:
      the two removed are the one-place test's `[load]` and `[rival-pytest]`
      param ids, which is precisely the clause AC-5 emphasises. The card's own
      record still says "Census 410 -> 439, 0 lost". The commit message
      discloses the rename and its two ids; nothing in a tracked
      artefact other than that message does.
    why_it_matters: >-
      No test was retired and the rename was prescribed by the review, so the
      substance is fine. But the card is the artefact a later reader checks the
      ACs against, and it now records a figure HEAD does not produce — the
      AC-vs-body drift this board keeps paying for.
    fix: >-
      Orchestrator's, not the round's: one line on the card recording the
      rename, the two retired param ids and the two replacing them, and the fact
      that AC-5's "param ids count" clause is being read as "no test retired".
      No code change.

  - id: F-108
    severity: low
    confidence: measured
    title: >-
      The false-positive figure that now carries the storability argument is a
      point estimate of a contention-dependent quantity with no stated domain.
    where: "meta/kanban/config.yml — the rival-pytest cell's `why_this_shape_is_storable_at_all`"
    measured: >-
      "reading 3 at an instant when the prescribed cell read 1" did not
      reproduce. Two re-measurements: 2 against a true 1 with CARD-306's gate
      live, and 1 against a true 0 on a quiet host. The quantity counts the
      measuring agent's own `zsh -c` wrapper lines, so it moves with how many
      agents are alive — which the sentence does not say.
    why_it_matters: >-
      The F-008 fix correctly moved the argument off an overstated exit-status
      claim and onto a measurement; the measurement it landed on is itself the
      card's AC-3 residue item 3. The DIRECTION is solid and I confirmed it
      twice, so the argument holds.
    fix: >-
      State it as a range with its domain ("1-3 depending on how many agent
      shells are alive; measured 1 against a true 0 and 2 against a true 1 on
      2026-10-30"), or as the qualitative claim it actually is: the form counts
      the measuring agent's own wrappers, so its reading is not a function of the
      host's pytest count at all.

  - id: F-109
    severity: low
    confidence: measured
    title: >-
      The new resolver's domain is one module while its data's domain is the
      whole board, so its declared failure direction is "report a live test as
      dead" in a file every card edits.
    where: "tests/test_suite_profile.py — test_the_named_tests_in_config_yml_all_resolve"
    measured: >-
      `defines()` searches `Path(__file__)` only. config.yml is the board's
      kanban convention file; a future `re_executed_by` naming a test in another
      module — a legitimate thing for that file to do — reds here although the
      test is alive. The docstring declares this bound explicitly, which is why
      this is low and not medium. Also measured: the character class is
      `[a-z0-9_]`, so a name containing an uppercase letter yields no match at
      all rather than a partial one — a shape the narrowing that produced the
      anchors did not consider. Today `named` is exactly 4, the floor is exactly
      4, and all 4 resolve, so nothing is hidden.
    fix: >-
      Either widen the resolver to `tests/**` (a `def` search over tracked test
      modules, which keeps "definition not mention") and keep the floor, or keep
      the module scope and make the failure message say "and if the name is
      defined in another module, move it into the data" — it already half says
      this. Add an uppercase case to the regex or state the lowercase
      restriction as part of the bound.

# ---------------------------------------------------------------------------
# WHAT THE ROUND GOT RIGHT
# ---------------------------------------------------------------------------
credits:
  - >-
    The F-001 fix is real and is killed by the exact mutant that survived it
    before. Cycle 1 measured 29/29 green with no search tool on the host; HEAD
    reds on the same plant. Both committed sentences became true because the
    code changed, which is what the round claimed and is not what usually
    happens.
  - >-
    VISIBILITY_CONTROL_PROBES is a genuine standing control and it earns its
    place three times over: it is the killer for M-B, M-C and M-D, each on a
    different row, and keeping the F-001 mutant standing as a permanent row is
    exactly the right instinct. VISIBILITY_CONTROL_TEXT's refusal to spell any
    instrument's pattern — reasoned, with the measurement that forced it — is
    the kind of care this module is for.
  - >-
    Finding 12 is the best work on the round: a gate reddening for a reason that
    is not about the tree, found by running it rather than by reading it,
    diagnosed to the exact mechanism (`pgrep -f` prints a PID list, `isdigit()`
    is true), reproduced deterministically, and traced to a named sibling card.
    I reproduced the mechanism and the sibling's wrapper lines independently.
  - >-
    The correction to cycle 1's committed report is correct and I re-derived it:
    `grep -q` is not discriminating, the grep child exists with the pattern in
    its argv, and listing it as a second F-001 witness did read as corroboration
    it was not. Correcting a review report against measurement, and saying which
    report, is the behaviour R4 exists to produce.
  - >-
    The handling of another card's frozen baseline is exemplary. Symmetric
    difference against a named main commit rather than a count comparison;
    exactly three in and zero out, independently confirmed; every entrant
    resolved to a `def` line read off the line; the refs deliberately NOT named
    in that file, with the G-2 reason stated — and I confirmed the
    counterfactual, so the unnamed form is necessary rather than fastidious.
  - >-
    G-1 held cleanly: one comment-only hunk, R4's statement, scope, severity and
    check byte-identical. The card's whole reason for existing is a rule that
    outlived its check, and the temptation to trim the rule to the check was
    there and was not taken.
  - >-
    The sandbox narrowing is right and the figures are right: 11 of 35
    deselected, 24 participating, comparison still 127 passed. The symlink is
    now load-bearing for 24 node ids instead of buying collection alone.
  - >-
    `test_the_named_tests_in_config_yml_all_resolve` found a real dead reference
    on its first run — the one the prescribed rename had just created — which is
    the strongest possible evidence for an instrument, and its regex narrowing
    drops both phantoms with the measurement that forced each anchor written
