# ---------------------------------------------------------------------------
# AREA 1 — the five new instruments, attacked rather than read
# ---------------------------------------------------------------------------
area_1_new_instruments:
  summary: >-
    The brief's premise — "each is claimed to carry a mutant that reds it" — is
    FALSE for two of the five, and incomplete for a third. The two that work
    (`_children_of`, `test_the_named_tests_in_config_yml_all_resolve`) work
    well; `VISIBILITY_CONTROL_PROBES` is a genuine standing control and kills
    three separate mutants. But `_is_a_shell` neutered to `return False`
    survives, `_is_a_real_pytest_run` neutered to `return False` survives, and
    `test_a_probe_leaves_no_orphan_behind` survives a broken `killpg`.

  children_of_embedded_whitespace:
    question: "can a command containing whitespace, or a right-aligned pid column, shift the fields?"
    verdict: "NO — it survives both. Measured, not reasoned."
    how: >-
      `line.split(maxsplit=2)` with the command column LAST is structurally
      immune: the first two splits take pid and ppid, the remainder is handed
      back whole. Measured with a child spawned as
      `Python -c '...' 'lots   of    spaces   and pytest   here'`: the recovered
      argv is byte-identical to `ps -o command= -p <pid>`, multi-space runs
      preserved. Leading blanks from the right-aligned pid column are consumed
      by `str.split`. A 1034-character argv came back untruncated through a pipe
      (BSD `ps` truncates to terminal width only on a tty), and truncation would
      cost a tail, never a field shift. The `len(fields) < 3: continue` arm
      drops the shapes with no command column.
      Residual, stated and not a finding: an argv containing a literal NEWLINE
      would be split across `splitlines()` boundaries and its tail lost. No such
      process exists on this host and the failure direction is "child not
      found", which reds.
    mutants:
      - id: M-C
        mutation: "`line.split(maxsplit=2)` -> `line.split()` (argv truncated to its first word)"
        blob_before: c792a9b47530ff6c2593d8b61b0d4dc6798fdb6d
        blob_after: 27eb566fe9ba1e545135520993d630263c089d5a
        result: "KILLED — 3 failed, 32 passed in 22.04 s"
      - id: M-D
        mutation: "parentage filter dropped (`int(fields[1]) == pid` removed), so every process reads as a child"
        blob_after: e396013cf396e580853347de8df3b90ec8680e48
        result: >-
          KILLED — 2 failed, 33 passed in 13.58 s, and the killer is the right
          one: `test_the_visibility_check_is_proved_in_both_directions[a search
          tool that dies on arrival]`. The invisible row is what makes the
          parentage load-bearing.

  is_a_shell_authority:
    question: "what is its authority, and is it enumerable? (ADR-0039/R2)"
    verdict: >-
      HAND-WRITTEN, and R2 is mandatory with `tests/**` in scope. The predicate
      is `executable == _shell() or Path(executable).name.endswith("sh")`. The
      first half is derived (config.yml's own `shell` key, the same value
      `_spawn` passes to `Popen`); the second is a suffix heuristic with no
      authority behind it. An enumerable authority EXISTS on this host and is
      free: `/etc/shells` lists 7 entries and ALL SEVEN agree with the suffix
      rule, so deriving the set would change no current answer and would make
      the set checkable.
    measured_misclassifications: >-
      False NEGATIVES (a shell read as not-a-shell, which is the direction
      F-001 was about): `env zsh -c foo`, `/usr/bin/env sh`,
      `/bin/bash-5.2 -c foo`, and any wrapper script with a shebang
      (`/usr/local/bin/mywrapper`). False POSITIVE: `/usr/bin/ssh host` reads as
      a shell. The two shapes the brief asked about that DO work: `/bin/sh -c
      foo` and a login shell's `-zsh` argv[0] both read True.
    r2_default_deny: >-
      R2 requires that a shape the guard cannot analyse be a FAILURE and never a
      silent pass. `_is_a_shell` returns False for every shape it does not
      recognise, and the caller's test is `not _is_a_shell(child)` — so an
      unrecognised shell is accepted AS the search tool. The default is
      permissive in exactly the direction that reinstates the vacuity.
    mutants:
      - id: M-A
        intent: "is the shell-exclusion controlled in the direction that reinstates F-001?"
        mutation: "`_is_a_shell` body replaced with `return False`"
        blob_before: c792a9b47530ff6c2593d8b61b0d4dc6798fdb6d
        blob_after: 165e33e73e5c4753d24fbe9c5ef9dc12bb5946d0
        result: "SURVIVED — 35 passed in 5.54 s. See F-103."
      - id: M-B
        intent: "the opposite direction"
        mutation: "`_is_a_shell` body replaced with `return True`"
        blob_after: b8b0b0dbad2976a4d7d0a11c4dbe9959fa805616
        result: >-
          KILLED — 3 failed, 32 passed in 17.20 s
          (`test_each_near_miss_probe_is_visible_to_ps[e]`,
          `test_the_visibility_check_is_proved_in_both_directions[a search tool
          that is really there]`, `test_a_probe_leaves_no_orphan_behind`).
    reachability: >-
      Separately measured and it matters for how F-103 should be read: the
      clause is not merely uncontrolled, it is never EXERCISED on this host.
      Polling a live case-(e) probe's children every 50 ms for 1.5 s, the child
      set was constant at exactly `('sleep N', '/usr/bin/grep -- <pattern>')`
      across 12 trials and 30 polls — zsh's fork/exec window for a pipeline
      stage never showed an intermediate shell. So `not _is_a_shell(child)` has
      no realized work to do here; it is a defensive clause that the ADR comment
      and the config.yml paragraph both present as the thing making the branch
      sound.

  visibility_control_probes:
    verdict: >-
      REAL, and the best thing added this round. Four rows, two visible and two
      not, one pair per branch, at one shared budget
      (VISIBILITY_CONTROL_LIFETIME 4 / VISIBILITY_CONTROL_TIMEOUT 1.0), and the
      invisible rows are the two vacuities actually measured on this card rather
      than invented ones. It kills M-B, M-C and M-D above, each on a different
      row. VISIBILITY_CONTROL_TEXT's refusal to spell any instrument's pattern
      is the right call and is reasoned correctly in its own comment.
    one_soft_spot: >-
      `assert not _is_a_shell(seen) or shape == "shell-wrapper"` short-circuits
      for 2 of the 4 rows, and for the other 2 it is satisfied by the same
      predicate M-A shows is uncontrolled. It is the one assertion in the block
      that carries nothing.

  named_tests_resolver:
    verdict: "WORKS, and the regex narrowing holds against the shapes it was aimed at."
    how: >-
      Re-derived the sets by hand from config.yml: `spelled` is 6 names,
      `named` is exactly 4 after the two exemptions, the floor is 4 — tight, not
      a ceiling-free floor — and all 4 resolve to `def` lines (6125, 6253, 6458,
      6483). The anchored form drops BOTH phantoms the unanchored one caught:
      `test_configure` (out of `pytest_configure`) and `test_suite_profile` (out
      of a module path). The negative control is real: `defines()` is called on
      `test_command` and `test_scope` in the same run and must answer no twice.
    mutant:
      - id: M-H
        mutation: "one config-named test renamed at its `def` line only (`..._in_the_form_...` -> `..._in_a_form_...`)"
        blob_after: 25c217133ca39f6a82712890f84d2ed135a5eba5
        result: "KILLED — 1 failed, 34 passed in 5.38 s. The instrument finds a dead reference."
    domain_question_the_brief_asked: >-
      CAN config.yml legitimately name a test in another file? Yes — it is the
      board's convention file, not this module's. The resolver searches THIS
      module's source only, so such a name reds as dead when it is alive. The
      docstring declares this ("names tests in this module only, today"), so it
      is a declared bound rather than a hidden one; but the declared direction
      is "report a live test as dead" in a file every card edits, which is the
      expensive direction for a shared file. See F-109.
    shape_the_narrowing_did_not_consider: >-
      The character class is `[a-z0-9_]` only. A test name with an uppercase
      letter (`test_fooBar`) produces NO match at all — the lookahead on `[\w.]`
      rejects the `test_foo` prefix — so such a name would be silently unseen
      rather than loudly dead. No such name exists in config.yml today and the
      floor of 4 is exact, so nothing is hidden now.

  orphan_test:
    orphan_claim_re_measured:
      before_the_fix: >-
        FIVE, confirmed independently. Ran the class from an out-of-tree
        `git archive 74debef2` copy (29 passed in 3.39 s) and censused `ppid == 1`
        immediately after: four `sleep 30` and one
        `/usr/bin/grep -- .../MacOS/Python -m pytest`. The orphan grep's argv
        does spell ` -m pytest`, exactly as reported.
      after_the_fix: >-
        ZERO. Same census after the class at HEAD (worktree, 35 passed) and
        after two whole-module runs (445 passed): no `sleep 30`, no `sleep 4`,
        no probe `grep` with ppid 1. Host was swept clean between the two
        measurements.
    is_two_the_right_floor: >-
      YES and it is TIGHT. The realized child count for a search-tool probe is
      exactly 2 (`sleep` + `grep`), measured stable over 12 trials — so
      `>= 2` equals the actual value and cannot absorb the loss of a child.
    but_it_does_not_measure_a_kill:
      - id: M-J
        intent: "does the test detect a killpg that reaches nothing?"
        mutation: "`start_new_session=True` -> `False` on the search-tool spawn ONLY (1 of 6 sites)"
        blob_after: c48980934d4d122654f44df8e37926552cf62ea0
        result: >-
          SURVIVED — 35 passed, but in 65.41 s instead of ~5 s. Without a new
          session `proc.pid` is not a process-group id, `os.killpg` raises
          ProcessLookupError, the `finally` tolerates it, and
          `proc.wait(timeout=60)` then simply waits out
          PROBE_LIFETIME_SECONDS = 30 for each of the two search-tool spawns.
          The children are gone when the assertion looks because they died of
          old age. The docstring's "the group is killed the way the fixture
          kills it, and every pid that was there has to be gone" is satisfied by
          waiting.
      - id: M-J2
        intent: "bound the exposure that leaves"
        mutation: "all SIX `start_new_session=True` sites -> `False`"
        blob_after: 580e03b97b9dbf3860f6cd9b08956722a0e7736a
        result: >-
          NO VERDICT. 15 dots, then the process was killed at 121.18 s wall with
          no summary line — tests/hang_guard.py's 120 s `exit=True`. This is the
          exact failure mode cycle 1's F-005 was raised to remove
          ("a MEASUREMENT defect, never a tree verdict"), re-entering through the
          F-004 fix: the dominant term on the module-scoped fixture's node is now
          `_kill_group`'s `proc.wait(timeout=60)` over up to
          6 cases x 4 BASELINE_ATTEMPTS = 24 spawns, not PROBE_VISIBLE_TIMEOUT x 5.
          See F-104.

# ---------------------------------------------------------------------------
# AREA 2 — the rewritten refutation criterion and its declared bound
# ---------------------------------------------------------------------------
area_2_refutation_criterion:
  finding_12_itself: "CORRECT, and correctly diagnosed. Re-derived."
  how: >-
    `_reading` returns `int(stdout)` when `stdout.strip().isdigit()` and None
    otherwise. `pgrep -f` without `-c` prints a PID LIST, so exactly one
    matching argv makes the cell a digit string and the OLD criterion ("exits
    non-zero, or printed something that is not a number") reads the rejection as
    no longer refuted. The diagnosis of what spells the pattern also checks out:
    this module's own (d)/(d2) wording is one source, and a sibling card's shell
    wrapper is another — CARD-306's full-suite gate was live on this host during
    this cycle and its own `zsh -c` wrapper lines were measured in `ps`.

  interference_observed_live: >-
    OBSERVED, as the brief hoped, and it moves a figure. From 2026-10-29T21:34Z
    CARD-306's merge gate held the lock with a real `-m pytest` alive (pid
    25643). At that instant: prescribed cell 1; `pgrep -fc` exit 2 with empty
    stdout; `pgrep -f 'python.* -m pytest'` exit 1, NO match (the gate's argv
    carries no lowercase `python` — the (d3) property, holding); and
    `ps -Ao command= | grep -c '[m] pytest'` read **2** against a true 1.

  faithfulness_of_the_native_reimplementation:
    verdict: "FAITHFUL today, verified; but with NO standing cross-check, so free to drift."
    how: >-
      Cross-checked `_is_a_real_pytest_run` against the awk it mirrors by
      running both over (a) every row of live `ps -eo command=` and (b) a
      20-case synthetic argv corpus built for the shapes that could diverge
      (`/usr/bin/python3.12`, `/a/pythonw`, `/a/python -mpytest`,
      `/a/python - m pytest`, a trailing newline, `jython`, `/a/PYTHON`,
      `/a/python.`, `/a/xpython`, `-m pytest` with no argv[0], empty and
      whitespace-only lines, and `-m pytest` hidden inside a `-c` string).
      ZERO divergences in either direction. awk's `$1 ~ /re/` and Python's
      `re.search` on `argv.split()[0]` agree, and awk's `/-m pytest/` over `$0`
      is a metacharacter-free literal, so `in argv` is equivalent.
    but: >-
      The project's precedent for native reimplementation over lateral import
      (`solver/propagate.py`'s `mask_runs`) is cross-checked FROM THE TEST TREE
      against the thing it mirrors. There is no equivalent here: the awk is read
      out of config.yml at run time by `_instrument()` while the two halves are
      frozen in Python, and nothing compares them. The corpus above is mine, not
      the tree's. See F-102.

  does_half_1_carry_the_row:
    verdict: "NO — refuted, for the `pgrep -f` row, and this is the cycle's headline."
    argument_and_measurement: >-
      For the `pgrep -fc` row half (1) is meaningful: the cell produces no
      reading at all, and it would red the day pgrep grew a working `-c` that
      agreed with the prescribed cell. PROVED, M-L: with that entry's instrument
      replaced by the prescribed awk itself, half (1) reds (1 failed, 1 passed).
      For the `pgrep -f` row half (1) is STRUCTURALLY INCAPABLE of reddening.
      `pgrep -f` can only ever print a PID list, and `_reading` of a PID list is
      either a pid — never equal to a single-digit process count — or `None`
      when more than one pid prints. So the comparison `_reading(instrument) !=
      prescribed` is a guaranteed pass on that row, whatever happens to pgrep.
    the_bound_is_mis_stated_not_merely_understated: >-
      The docstring declares: "the second half is strong while a real `-m
      pytest` is alive and weak while none is... the first half carries the row
      either way." BOTH clauses are wrong on this host, and the reason is one
      fact neither the round nor the brief names: BSD `pgrep` EXCLUDES ITS OWN
      ANCESTORS by default. `man pgrep`: "-a  Include process ancestors in the
      match list. By default, the current pgrep or pkill process and all of its
      ancestors are excluded." The test always runs under a real `-m pytest` —
      its own runner, which `_is_a_real_pytest_run` counts and the prescribed
      cell counts (measured: the cell read 2 from inside a run while one sibling
      was live) — yet that runner is invisible to every pgrep-family instrument
      in the rejected list, because it is the ancestor of the `zsh -c pgrep` the
      test spawns. Measured directly from inside a pytest run: runner pid 27867,
      argv `.../MacOS/Python -m pytest ...`, and `pgrep -fi 'python.* -m pytest'`
      returned only the sibling's pid, not the runner's.
      So the real condition is not "while a real `-m pytest` is alive" but
      "while a real `-m pytest` that is NOT AN ANCESTOR of this process is
      alive" — i.e. while a sibling card is running pytest. On a solo board,
      never.
    mutant_both_ways:
      - id: M-E
        intent: "make the `pgrep -f` rejection genuinely STALE and see whether the row notices"
        mutation: "that entry's instrument -> `pgrep -fi 'python.* -m pytest'`, the case-insensitive form config.yml itself records as no longer blind"
        config_blob_after: 221c3e4bf4a6ce6b7a043f7fb32a4a133a18e8ca
        result_with_a_sibling_gate_live: >-
          KILLED, by half (2) ALONE — 1 failed, 1 passed. The failure names
          CARD-306's gate pytest (25643) and a nested probe pytest it had
          spawned (27696). Half (1) passed.
        result_on_a_quiet_host: >-
          SURVIVED — 2 passed in 0.29 s, with the same demonstrably stale
          instrument in place and `ps -eo command= | awk ... | wc -l` reading 0.
        conclusion: >-
          On a quiet board the `[pgrep -f]` row asserts NOTHING: half (2) has
          nothing it can see and half (1) cannot fail. Its greenness on a solo
          run is not evidence about the rejection. See F-101.

# ---------------------------------------------------------------------------
# AREA 3 — the edit to CARD-308's frozen baseline
# ---------------------------------------------------------------------------
area_3_frozen_census:
  symmetric_difference_re_derived: "EXACTLY THREE IN, ZERO OUT. Confirmed independently."
  how: >-
    Two out-of-tree `git archive` copies — `0ea64cf3` (main) and `2583783b`
    (HEAD) — each `git init`ed and committed so `git ls-files` has a tracked set
    (1765 files in both), then CARD-308's own `_declared_refs()` and
    `_verdicts()` run against each and the resulting ref SETS diffed. This
    re-derives the DELTA from the data rather than re-deriving CARD-308's
    algorithm, which is the right division: the algorithm is its instrument, the
    delta is the claim under review.
  census: "580 -> 583; entering = the three R4 refs; leaving = []"
  defined: "389 -> 392; entering = the same three; leaving = []"
  all_three_resolve: >-
    YES, and to real definitions, read off `def` lines in
    tests/test_suite_profile.py rather than text-searched:
    test_every_prescribed_host_cell_command_exits_zero at 6076,
    test_the_instrument_rises_on_a_real_pytest at 6371,
    test_the_instrument_does_not_rise_on_a_near_miss at 6403. All three are in
    the DEFINED set too, which is why both baselines move by the same three —
    a declaration arriving with its definition already in place.
  g2_intact: "YES, and its counterfactual is confirmed rather than assumed."
  g2_how: >-
    tests/test_check_ref_resolution.py is 23 passed at HEAD, including
    test_this_module_resolves_no_verifying_ref_at_all and
    test_a_ref_with_a_real_definition_is_not_reported. Then the counterfactual,
    M-F: the three node ids written INTO that file's CENSUS comment, blob
    recorded (97c62e55d094717f33634abf00bdad2af6aa3d3a), run, restored to the
    commit's own 7a893d6c. Result: 1 failed, 22 passed — G-2 reds and names all
    three. So the unnamed form is NECESSARY, not merely tidy, and the
    file:line-instead-of-name precedent is the only shape available.
  was_updating_the_baseline_the_right_move: >-
    YES. The baseline did its job: it went red, it refused to be nudged, and it
    forced the delta to be derived before it moved. The move is additive and the
    direction a flip to {kind: test} must produce; nothing left; every entrant
    arrived already defined, which is the one census movement that needs no
    repair. The docstring says exactly that and names the file:line evidence.
    The thing worth recording is not a defect but a coupling: CENSUS and DEFINED
    are whole-board fingerprints owned by one card, so any card that adds a
    check ref must edit another card's frozen artefact. That is a board process
    observation for the retrospective, not a finding against CARD-304.

