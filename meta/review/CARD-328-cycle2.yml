  minor:
    - id: MIN-3
      status: open
      title: >-
        The round-1 "G-5 / the CARD-255 shape" enumeration is left standing
        unqualified, and it is now an incomplete count of what holds G-5
      files: [meta/kanban/cards/CARD-328.md]
      confidence: high
      source: static-analysis
      ac_refs: [AC-4]
      guardrail_refs: [G-5]
      detail: >-
        Commit 34042762 inserts a `[Superseded by fix round 1]` block, and it is
        well written -- but it scopes itself to "The three rows above", i.e. the
        exemption table. Nine lines below it, still inside the round-1 section,
        stands a separate bolded claim under its own heading: "**G-5 / the
        CARD-255 shape.** The declaration is not a bare list. It carries three
        constraints and two controls, each its own node id:" followed by five
        bullets. All five arms still exist and still do what the bullets say, so
        nothing there is false. But the sentence is a closed enumeration of what
        satisfies G-5 ("It carries three constraints and two controls"), and
        after this round G-5 is held by four more constraints and six more
        controls: `...names_the_difference_it_normalises_away`,
        `...agrees_on_the_residue_it_leaves`,
        `...has_an_unreadable_residue`, `...carries_a_control_of_its_own`, and
        the six parametrized `test_real_drift_inside_a_declared_divergence...`
        cases. G-5 is the guardrail cycle 1 gated on, and cycle 1's own G-5
        verdict quoted this very block.
      failure_scenario: >-
        A later reader -- the merge gate, CARD-325's implementer, or cycle 3 --
        audits G-5 by finding the card's G-5 heading. It reads as a complete
        answer and says nothing about residues, so they conclude the per-exemption
        constraint was never built, and either re-open a closed finding or copy
        the key-and-reason pattern into CARD-325's AC-6 believing it is what this
        card shipped. That is the stale-declaration family this board cites most,
        and it is the one statement in the card the supersede commit did not
        reach.
      why_minor_not_important: >-
        The fix-round section below is explicit and correct, its own guardrail
        list states "G-5 ... now holding per exemption and not just at the
        table", and the superseded block does point forward to "the current
        shape, the residues and the controls ... in Fix round 1 below". So a
        linear reader is not misled, and no shipped behaviour depends on it. One
        sentence closes it.
      suggested_direction_report_only: >-
        Extend the superseded block's scope to the G-5 enumeration too, or append
        one clause to that sentence -- "...and, since fix round 1, four more
        constraints and six more controls; see Fix round 1".
