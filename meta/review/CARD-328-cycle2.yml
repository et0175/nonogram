min_2_declined_trade:
  question: Is the declined trade-off stated correctly, or is it a rationalisation?
  verdict: stated_correctly
  reasoning_derived_by_reviewer: >-
    The fix reports every fact through `_measured(fact, read)` so a collapsed
    parse names the fact, adds a fixture-free arm that turns any collapse into
    one named FAILED cell, and KEEPS the fixture-scoped ERRORs on the grounds
    that removing them would mean handing the arms a sentinel surface and making
    "not found" something other than a failure. I checked what a sentinel would
    actually do to one arm, which is the cheap test. `disagreements()` is
    `{k: p for k, p in surface.items() if p[0] != p[1]}`. If a collapsed fact
    were handed out as, say, `("<unparsed>", "<unparsed>")`, the two sides would
    compare EQUAL, the fact would drop out of `disagreements()`, and
    `test_the_disagreements_are_exactly_the_declared_ones` -- the arm that
    carries AC-4 -- would pass while reporting perfect agreement about nothing.
    That is precisely the vacuity this file's `DOT_PROPERTIES`, `WAVE_EXPRESSION`
    and `UNREADABLE` floor all exist to prevent, so declining the trade is not a
    rationalisation; accepting it would have traded a hard failure for a silent
    one in the same round that closed IMP-1 by adding a floor against exactly
    that. V1 confirms the improvement is real: 5 errors remain, but
    `test_the_compared_surface_parses_fact_by_fact` reds as a named FAILED cell
    alongside them.

