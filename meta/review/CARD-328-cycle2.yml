  Score 9, no open critical or important finding. IMP-1 is genuinely closed on
  evidence I derived rather than re-read: all four cycle-1 survivors now die,
  and so does a fifth drift of the same family the fix round found on its own.
  More importantly for this board's standing risk, I went looking for what the
  tightening broke and did not find it: all eight of the card's original mutants
  still red the exact arm sets cycle 1 recorded, every one of the five
  equivalence mutants still survives at `35 passed`, no node id was removed, and
  the re-expressed arm kept its second assert. The three remaining findings are
  one minor documentation staleness and two diagnostic nits.

