summary: >-
  IMP-1 is genuinely closed, and closed in the right shape: the exemption is now
  over a stated difference rather than over a fact. All four cycle-1 survivors
  die at the cells the card names, and so does N5, the fifth drift the fix round
  found on its own. The E1/N5 pair is the proof that matters -- the same hook
  rename survives when done consistently and dies when done in the sweep rule
  only -- because it shows the exemption buys exactly what it declares and
  nothing adjacent.

  The question this cycle existed for is whether the tightening broke or weakened
  anything, and on four independent lines of evidence it did not. Every arm cycle
  1 recorded for the original eight mutants still reds; the grown totals are
  accounted for cell by cell rather than taken on trust. All five equivalence
  mutants still survive at exactly `35 passed`, so the residue comparison has not
  become formatting police. The re-expressed arm kept its old assert and gained a
  real one. And the guard still reports nothing but the three declared
  disagreements against CARD-268's current worktree, so the stricter comparison
  introduced no merge hazard.

  Two of the subtler claims I tested directly rather than reading. The unreadable
  floor is load-bearing: F2 -- both sheets naming the sweep in their
  reduced-motion block but with `animation: slide` -- produces byte-identical
  unreadable residues, the equality arm passes, and the floor is the only cell
  that reds; strip its `startswith(UNREADABLE)` clause and the regression goes
  invisible again at `35 passed`. And the per-exemption constraint is a shape, not
  three special cases: I added a fourth exemption in six forms and the suite named
  the missing piece every time, with the only genuine gap being the normaliser for
  the new difference -- exactly what the fix round said. I also found the shape is
  closed one step further than the card claims: a future normaliser that fails to
  mark its own failures still cannot ship, because its mandatory control makes a
  constant residue red.

  All seven guardrails hold, G-1 re-derived by SHA after my own 29 mutation runs.
  What is left is one minor and three nits, none of them in the code: a round-1
  "G-5 / the CARD-255 shape" enumeration that the supersede commit's scope did
  not reach and that now undercounts what holds G-5, plus two diagnostic-quality
  nits in the new controls and one dead helper. Score 9; the card certifies.
