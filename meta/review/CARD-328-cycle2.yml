primary_question_of_this_cycle:
  question: Did anything regress or weaken while IMP-1 was closed?
  verdict: nothing_regressed
  evidence_derived_by_reviewer: >-
    This is the board's standing risk (3 of 3, then 2 of 2, gating findings
    introduced by the previous fix), so I spent most of the cycle here and
    attacked it from four sides.

    (1) ORIGINAL ARM SETS INTACT, not merely bigger totals. I re-fired all eight
    card-table mutants and read the `FAILED <nodeid>` lines, never the count.
    M1/M2 red the same four arms cycle 1 recorded; M3/M4 the same three, with
    `test_a_fourth_divergence...` correctly still absent for the reason cycle 1
    verified; M5/M6 the same three PLUS the new residue arm; M7/M8 the same four.
    Not one arm that used to catch a mutant has gone quiet. The grown totals
    (9-10 vs 3-4) are fully accounted for: 4 original + 6 parametrized controls
    reding on their precondition assert, which I confirmed by reading the
    assertion text under M1 (it is the key-level `absorbed == set(...)` assert,
    with 'dot.declarations' named as the extra item).

    (2) NO OVER-TIGHTENING. The sharper risk with a residue comparison is that it
    starts reding on the declared differences themselves. All five equivalence
    mutants still survive at exactly `35 passed`: E1 (the sweep hook renamed
    CONSISTENTLY in both the sweep rule and the reduced-motion block), E2 (the
    public fallback `, 0` -> `, 1`), E3 (the admin reduced-motion block drops a
    chrome selector), P2 (the public dot reindented but not made identical),
    Q2 (an unrelated `: no-preference` block added, which the old loose opener
    would have miscounted).

    (3) NO CLAIM DROPPED BY THE RE-EXPRESSION. The old arm had two asserts, a
    tautological one and 'declarations equal'. The new arm keeps the second
    verbatim (proved: M1-M4 still red this arm, and they can only reach it
    through that assert) and replaced the tautology with a claim that can fail
    (proved: P1 now kills, exactly and only here).

    (4) NO NEW MERGE HAZARD. A stricter guard is likelier to red on a sibling's
    work, so I re-ran this card's `compared_surface` and `residues` against
    CARD-268's worktree as it stands now (f0c22aab, +213 admin.css and +192
    solver.js over this card's): 12 facts, disagreements exactly the three
    declared, residue disagreements `{}`, unreadable residues `[]`.

imp_1:
  status: genuinely_closed
  closed_how: the residue is constrained, not the key
  evidence_derived_by_reviewer: >-
    I re-fired all four cycle-1 survivors from my own harness and each dies at
    the cells the card names, with the counts the card states: N1 `5 failed, 30
    passed`, N2 `2 failed, 33 passed`, N3 and N4 `3 failed, 32 passed`. I also
    re-derived the live residue table by importing the module rather than
    quoting the card: all three residues readable and equal
    (`.player-cell[data-state="filled"]`, `calc(var(--player-wave) * 12ms)`,
    `.player-cell[data-state="filled"] { animation: none }`), reason lengths
    661/649/797 against a floor of 120, and 6 plants, 2 per exemption.
  the_four_probes_now_die: true
  the_exemption_is_now_over_a_difference: >-
    Verified by the E1/N5 pair, which is the discrimination the whole fix rests
    on and the one I would have expected to be fudged. E1 renames the sweep's
    hook consistently in the sweep rule AND the reduced-motion block -- that IS
    the declared difference, and it survives at `35 passed`. N5 renames it in
    the sweep rule only, leaving the reduced-motion block quieting a selector
    that no longer exists -- real drift inside the exemption, and it dies at
    3 cells. The exemption therefore buys exactly the stated difference and
    nothing adjacent to it.

