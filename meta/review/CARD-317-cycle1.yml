    title: "ADR-0006/R1's repaired pointer still resolves only from bookkeeping — the card's own erosion class"
    description: |
      The card's item 5 is the one repair it was commissioned to make, and it
      landed in the one ref form the card's own worktree notes derive as not
      resolving at a definition.

      The new ref is a two-part pytest node id. In the validator's domain
      (`git grep -lw <whole ref>`, excluding meta/architecture and *.md) it
      resolves from 58 tracked files, measured at this HEAD: 52 under
      meta/review/, 4 under meta/profiling/, meta/kanban/backlog-scored.yml,
      and one test module. That one test module is NOT the module holding the
      definition — the module that carries the real `def` (line 1249 of
      tests/test_export_pdf.py) does not spell the node id anywhere, so the
      ref does not resolve at its own definition.

      The card's own guard already has a class for this and the ref is in it:
      the resolved-from-afar cell (tests/test_check_ref_resolution.py around
      line 1861) selects node-id refs whose definition exists and whose
      declaring path is absent from the loose hits, and its docstring reads
      "the loose resolution rests entirely on files that are about the card
      rather than about the code, and the board has no control stopping them
      being pruned". The class did not move only because ADR-0042's own rule
      had already declared the identical string (line 650 of
      0042-book-interior-is-vector-cover-stays-raster.md).

      The honest form was available and the card used it everywhere else.
      Measured: the BARE name resolves from 82 files INCLUDING its own
      definition module. That is the rule the card states in its worktree
      notes ("a bare name resolves at its own `def` line in both
      instruments") and applies to FR-019's six and FR-042's two — and then
      does not apply here.

      Consequence, concretely: prune or stop syncing meta/review/ and
      meta/profiling/ and ADR-0006/R1 flips from falsely-alive to a dead-ref
      WARN with its test untouched and passing. The twelve cards' hand-written
      DEAD-REF notes the card declares "now true" are true of the rule and
      still not true of the pointer's resolution path.
    suggestion: |
      Change ADR-0006/R1's `check.ref` to the bare test name (no path, no `::`),
      which resolves at its own `def` line in both the validator and the guard —
      the form this card already chose for FR-019's six, FR-042's two and
      CON-011. Keep the prose explaining what the retired name was. The census
      guard will red (a declaration moved) and must be re-derived, which is the
      intended behaviour.
