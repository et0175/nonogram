  - id: F-104
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_book_export_interior.py
    line: 554
    title: "No corpus floor requires answer pages on BOTH parities"
    description: |
      The new floors added with this change are
      `seen["answer page"] >= 20`, `seen["6-up answer page"] >= 5 and
      seen["4-up answer page"] >= 5` and `seen["headed answer page"] >= 10`.
      The parity counters the answer-page loop feeds
      (`seen["right-hand"] / seen["left-hand"]`) are shared with the puzzle
      pages, whose own floors (`>= 10` each) can be met by puzzle pages alone.
      So the corpus could in principle drift to answer pages that are all of
      one parity while every asserted floor still passes — and the left-margin
      measurement that `_expected_answer_left_mm` exists for is precisely a
      parity statement.

      Theoretical today, not a live hole: an independent reviewer injected an
      `answer_wrong_parity` mutation (the key laid out on the opposite
      parity's margins) and this test caught it —
      "answer page 5 (right-hand) starts its key at 9.398 mm, not 12.700 mm" —
      as did tests/property/test_book_pdf_geometry.py and both retargeted
      methods of tests/test_book_pdf_band.py. So the property is verified; only
      the floor that would keep it verified as the corpus evolves is missing.
    suggestion: |
      Two more counters beside the three new floors, e.g.
      `seen["answer page right-hand"] >= 5` and
      `seen["answer page left-hand"] >= 5`, incremented in the same loop that
      already writes `seen["answer page"]`.
