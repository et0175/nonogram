- id: F-003
  severity: low
  category: tech-debt
  type: risk
  file: tests/helpers/book_corpus.py
  line: 324
  title: font_fingerprint's new sized fallback does not match the divider's actual fallback
  description: 'The new fallback in `font_fingerprint()` calls `ImageFont.load_default(size)` for

    **all three** entries of MACHINE_FACE_SIZES, and its comment describes this as "the

    page''s own fallback, transcribed like the sizes". That is true for the guide page''s

    92 and 46 (create_guide_page now does ask for a size, book_pdf_generator.py:1262-1263)

    but not for the divider''s 60: create_divider_page still calls a bare

    `ImageFont.load_default()` (book_pdf_generator.py:1315), as does create_cover

    (line 1195). So on an Arial-less machine the fingerprint''s third sample is drawn at a

    60 px em while the divider pages it stands for are lettered at a 10 px em.


    Soundness is not affected, and I checked the direction: if two machines produce the

    same `load_default(60)` sample their built-in face is identical, so their bare

    `load_default()` samples are identical too — the fingerprint can therefore never

    claim comparability it does not have. It can only be over-strict (a Pillow-10.0

    machine, where the TypeError guard fires, gets a different fingerprint from a

    Pillow-10.1+ machine even though both letter the divider identically). Over-strict

    fails safe.


    The finding is the comment: this tuple exists precisely because its contents are

    hand-transcribed from the call sites, and one of the three entries is now transcribed

    from a call site that does not look like that.

    '
  suggestion: 'Narrow the comment to say the sized fallback mirrors the guide page''s two sizes and

    is deliberately over-strict for the divider''s 60 (whose page still uses a bare

    load_default), or size only the first two entries. Do not "fix" the divider page

    itself — that would move pages 2/4/6/8 on an Arial-less machine and is exactly what

    G-1 forbids.

    '
  confidence: high
  source: static
  violates: null
  root_cause: null
  status: open
  fixed_in: null
  dismissed_reason: null
  learned_pattern: null
