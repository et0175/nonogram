    title: "Card note cites an assert _open_filled does not contain"
    description: |
      The fix-cycle note says the _SHADOW_OFF widening was "checked on its
      other three callers ... all three go through _open_filled, which marks
      every cell filled and asserts count == 400". _open_filled
      (tests/test_puzzle_solver_fifth_rule.py:207-217) marks every cell filled
      via _FILL_ALL and asserts the board is not solved — it asserts no 400
      count. The 400-count asserts live in test bodies (:391 counts filled
      cells but is not a _SHADOW_OFF caller; :636 counts td.player-cell, not
      the filled state). The safety argument itself holds — _FILL_ALL
      mechanically marks all 400, and the code's own _SHADOW_OFF docstring
      says "mark", which is accurate — but on a board that treats committed
      figures as claims to re-derive, a cited assert that does not exist at
      the cited place is the family the board gates on, one layer down.
    suggestion: |
      Correct the card note ("marks every cell filled via _FILL_ALL; the
      solved-state assert is the only assert in _open_filled"), or add the
      filled-count premise assert to _open_filled so the note becomes true.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_puzzle_solver_fifth_rule.py
    line: 729
    title: "Byte-identity arm sits one rendering-noise event from a loud flake"
    description: |
      :729 asserts shipped.tobytes() == without.tobytes() on the blank board,
      while this same file's _differing docstring records that two renderings
      of the SAME computed style were measured to differ by +-1 per channel on
      32 pixels (under REACHES-BLANK, where shadows are painted). If that
      noise ever occurs on the no-shadow blank board, :729 flakes red. The
      evidence says it does not today: the arm has been byte-stable across the
      implementation round, cycle 1, the fix round, and this cycle's repeated
      SHIPPED re-runs between mutants — and the measured noise domain (shadow
      rasterisation) is absent from the shipped blank board. Failure direction
      is red/loud, never silently green. Low confidence, non-gating; recorded
      so a future flake here is diagnosed in one step rather than chased.
    suggestion: |
      If :729 ever flakes, switch that arm to `_differing(shipped, without)
      == 0` with a comment citing this finding — same claim, tolerance-aware —
      rather than rerunning until green.
    confidence: low
