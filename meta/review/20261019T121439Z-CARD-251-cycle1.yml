  - id: F-004
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 254
    title: "\"The book ... gets one page longer\" is hardcoded beside a computed delta"
    description: |
      `bookNote`'s split-pair sentence quotes `pages.before` and `pages.after` and then asserts
      "The book stays valid and gets one page longer." The delta is not constrained to 1 anywhere:
      `_page_count_effect` only compares two lengths, and the pairing walk is greedy and forward, so
      splitting one pair re-walks the whole suffix. A suffix whose pairings reshuffle can in
      principle move the count by more than one, and the sentence would then quote "60 to 62" while
      saying "one page longer".
      The symmetric gap: a split that the suffix absorbs (e.g. positions i,i+1 paired and i+2 alone
      becoming i alone and i+1,i+2 paired) leaves the count equal, so `changes` is False and the
      warning is silent — even though the puzzle's page did split and the folios after it did move,
      which is the harm the card's own prose names ("every folio after it moves"). That silence is
      faithful to the owner's decision as worded (page COUNT), so it is listed here rather than as a
      defect, but it is the same mismatch between the measurement and the words.
    suggestion: |
      Derive the phrase from the numbers — "gets 1 page longer" / "gets ${after - before} pages
      longer" — so the sentence cannot disagree with the figures beside it. If the card wants the
      broader harm covered, that is a separate decision for the owner (announce a changed pairing,
      not only a changed count) and belongs on a new card, not here.
    confidence: medium
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

