  - id: F-007
    severity: low
    category: ops
    type: risk
    file: src/nonogram/admin/app.py
    line: 2660
    title: "Every verify of a booked puzzle now reads the whole book row-by-row and walks it twice, and the cost is stated only in the card"
    description: |
      Judged structurally, by call counts — no timing taken, per the orchestrator's instruction.
      `_page_count_effect` runs `_book_puzzles(book)` (app.py:5304), which calls
      `puzzle_review.get_puzzle(puzzle_id)` once PER MEMBER — in DB mode that is one session and one
      `SELECT ... WHERE id = ?` each, i.e. ~150 queries on a full book — then `print_order`, then
      `puzzle_page_plan` twice, each constructing a `BookPDFGenerator` and offering every adjacent
      equal-tier pair to `compute_pair_layout`. Before this card a verify of a booked puzzle did
      none of this: it was a 409. The path is interactive — the owner waits on Save.

      Two narrowings exist and neither is taken:
      * `PuzzleReviewService.get_puzzles` (puzzle_review.py:1744) already reads a set of ids in ONE
        session and one `WHERE id IN (...)`; `_book_puzzles` predates it and was reused as-is. This
        is pre-existing, but this card is what puts it on an interactive path.
      * the second walk's PREFIX is provably identical to the first's — the walk is greedy and
        forward, and `puzzle_pages`' own docstring states that parity "moves the usable area, never
        its size, so it cannot change a verdict" — so it could start at the edited puzzle's page
        rather than at page 1. That saves roughly half of one of the two walks; the `before` walk is
        needed in full to report the figures at all, so the saving is modest and is worth stating
        as such rather than as a fix.

      The cost is written down only in the card's `## Worktree notes` ("150 compute_pair_layout
      calls per verify and may want a look"). `_page_count_effect`'s own docstring and
      `puzzle_page_plan`'s say nothing about it, and the card is deleted at `done`, so the next
      reader of this function has no way to learn that it is O(book) on a per-keystroke-adjacent
      path. There is no latency NFR in `meta/architecture/requirements.yml` to violate — searched —
      so this is a durability-of-knowledge finding, not a threshold breach.
    suggestion: |
      State the cost where the function lives: one sentence in `_page_count_effect`'s docstring
      ("asked on every verify of a booked puzzle; one row read per member plus two pairing walks
      over the whole book"). That closes the hole because the next reader meets the fact at the
      call site instead of in a card that no longer exists. If the figure is ever measured and found
      to matter, the two cheap moves are `get_puzzles` for the member read and starting the second
      walk at the edited puzzle's page.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

