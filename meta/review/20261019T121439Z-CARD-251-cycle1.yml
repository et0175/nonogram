findings:
  - id: F-001
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/app.py
    line: 2680
    title: "The AC-9 warning reports the puzzle-page count as \"that book's page count\""
    description: |
      `_page_count_effect` sets `before`/`after` to `len(book_pdf_generator.puzzle_page_plan(...))`,
      and `puzzle_edit.js`'s `bookNote` renders them as "this grid would change that book's page
      count from ${pages.before} to ${pages.after}". `puzzle_page_plan` returns only the PUZZLE
      pages; the book's page count, as this same codebase defines it, also counts the 2-page guide,
      one divider per non-empty level, the SOLUTIONS divider and the answer pages —
      `BookPDFGenerator.interior`'s docstring says outright "The list's length is the book's page
      count (FR-030)", and `app.py`'s own `_interior_counts` → `InteriorCounts.page_count`
      ("the guide page, the level dividers, the puzzle pages, the SOLUTIONS divider and the answer
      pages") is the number Finalise already shows the owner.

      Measured on the card's own AC-9 fixture (2 x 10x10 easy, DEPTH_4, Book 1 profile, in-memory
      panel): the verify answers `{"before": 1, "after": 2}` while
      `BookPDFGenerator(book).interior_stream(ordered).page_count` is 7 — the owner is told the page
      count goes "from 1 to 2" when it goes from 7 to 8. On a 150-puzzle book the gap is the guide,
      four dividers and ~150 answer pages, so the figure would be out by well over a hundred pages
      and would disagree with the figure the same panel prints on Finalise for the same book.

      The DELTA is right and AC-9's substance ("the book's page count would change", "one page
      longer") is delivered. What is wrong is the pair of absolute figures, on a path the owner uses
      to decide whether to approve the edit. This is the standing claims-match-mechanism rule:
      `puzzle_page_plan` measures puzzle pages and the sentence says book pages.
    suggestion: |
      Either (a) stop quoting absolute figures — the only fact the two walks measure is the delta,
      so say "this grid would make the book one page longer" and name the partner, which is exactly
      what AC-9 asks for; or (b) take `before`/`after` from `_interior_counts(book, ordered)` and
      `_interior_counts(book, replaced)`'s `page_count`, so the editor and Finalise quote the same
      number for the same book. (a) closes the hole because it removes the claim rather than
      restating it; (b) closes it by making the claim true, at the cost of walking answer packing
      twice as well (see F-007 on the cost already on this path). If (b) is chosen, the SCOPE+
      wrapper may become unnecessary, since `_interior_counts` already lives in `app.py`.
    confidence: high
    source: static
    violates: "AC-9"
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

