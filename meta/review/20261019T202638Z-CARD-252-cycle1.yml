findings:
  - id: F-001
    severity: important
    category: maintainability
    type: claim_wider_than_mechanism
    file: src/nonogram/db/session.py
    line: 219
    title: "reset_engine()'s docstring tells the causal story AC-3 was withdrawn for, and session.py is the one place that does not say so"
    description: |
      Lines 219-226 read: `Without it, _init_engine's "rebuild only when the URL changed" cache
      keeps whatever engine the process had already built for that URL, pool and all, so
      connections opened *before* the DROP SCHEMA are handed back out *after* it. Four
      consecutive waves of this board's build gates reported failures that reproduced on no
      second run ...`

      The first sentence is pinned. AC-1 forces the precondition and mutants M1 (card) and R5
      (this review, `engine.dispose()` deleted) make it red on the pool half, so `the engine and
      its pooled connection survive the rebuild` is demonstrated, not asserted.

      The second sentence, read inside a paragraph that opens `Without it`, attributes four waves
      of irreproducible gate failures to that mechanism. That attribution is exactly what AC-3
      was WITHDRAWN for being unable to force - and the card's own measurement goes further than
      `not demonstrated`: 24/24 queries through a connection that outlived a DROP SCHEMA returned
      correct values, pg_prepared_statements held 0 rows after 40 executions, and
      cursor.description for puzzles.id came back as type_code 2950 every time. So for at least
      the recorded `uuid.UUID(hex=<float>)` signature, the card measured the stated route as
      unreachable on this driver, and no alternative route (for instance two runs sharing one
      test database - note that the diff REMOVES the old comment's `several pipelines share
      nonogram_test` at conftest.py:481 of the base) was excluded.

      The narrowing exists twice in the card's own tree and is good: the test module's docstring
      (tests/test_db_engine_lifecycle.py:19-34) states the withdrawal and that what is pinned is
      the PRECONDITION, and conftest._rebuild_public_schema (:462-468) points the reader at it.
      session.py is the artifact a future maintainer of the production module reads, and it is
      the only one of the three that presents the hazard as established with no pointer to the
      withdrawal. Why that matters on this card specifically: the card's own harm statement is
      that `a wrong diagnosis is cheap to reach` (CARD-252.md:41-42, the wave-47 attribution that
      had to be withdrawn), and the failure class is live and still unexplained - CARD-253's gate
      failed 5 tests in tests/test_admin_binding.py with `relation "puzzles" does not exist` on a
      tree WITHOUT reset_engine() and came back fully green on a solo re-run of the same commit.
      A reader of session.py today concludes the cause is known and fixed.
    suggestion: |
      Two sentences inside the existing docstring, no code change. Keep the mechanism sentence as
      it is (it is pinned). Then say plainly, where the gate failures are named, that this
      function removes the hazard's PRECONDITION, that a deterministic reproduction of the
      corruption was attempted and could not be produced on psycopg2 (CARD-252, AC-3 withdrawn),
      and that the four waves' failures are therefore the MOTIVE for the function, not a
      demonstrated consequence of its absence - with a pointer to
      tests/test_db_engine_lifecycle.py's module docstring, which already says it properly.
    confidence: high
    source: static
    violates: "ADR-0039/R1"
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: important
    category: testing
    type: guard_narrower_than_its_claim
    file: tests/test_db_engine_lifecycle.py
    line: 157
    title: "AC-5's private-globals guard advertises a reach it does not have: three surviving mutants"
    description: |
      AC-5's gating half is `no test reaches into session.py's private globals directly`, enforced
      by _private_global_sites (:157-190) under the equality at :502, with the exemption set at
      :143-150. Three mutants, each a shape a real test file could plausibly carry, were applied
      one at a time (every one restored from a byte-identical backup and verified with diff) and
      ALL THREE SURVIVED - `TestEngineLifecycle_TheResetIsAPublishedSeam` stayed 5 passed each
      time:

      R1 - a tenth hand-set site, in a file and under a name the exemption already lists
      (`monkeypatch.setattr(db_session, "engine", None)` appended to tests/test_db_url_driver.py).
      SURVIVED. The exemption is an equality over (file, name) PAIRS, so the nine existing sites
      collapse to six pairs and an eleventh, twelfth or hundredth site in those pairs is
      invisible. The comment at :140 says `A tenth such site, or one in a new file, fails the
      guard below`: the second half is true (M3 on the card proves it for conftest.py), the first
      half is false, and :442 compounds it by counting `nine pre-existing ... sites`.

      R2 - monkeypatch's string-target spelling, in a file the exemption does not list
      (`monkeypatch.setattr("nonogram.db.session.engine", None)` appended to
      tests/test_db_isolation.py). SURVIVED. The guard requires node.args[0] to be an ast.Name in
      _SESSION_ALIASES (:183-185), and a string target has no Name at all. This is the idiomatic
      pytest spelling, so it is not an exotic shape.

      R3 - a plain `import nonogram.db.session as X` followed by `X.engine = None` inside a test
      body (appended to tests/test_db_isolation.py). SURVIVED, and so did the completeness test
      at :477-497, whose own docstring says `an alias it does not know is a shape it cannot
      analyse. That must be a failure, not a silent pass` - it scans only ast.ImportFrom with
      module == "nonogram.db", so the ast.Import spelling is invisible to the completeness check
      AND to the guard it certifies.

      Under ADR-0039/R2 each of R2 and R3 is a shape the guard cannot analyse and silently passes,
      where the rule requires a failure; under R3 the `tenth site` claim is an exemption claim
      with no control. What does hold, and is worth keeping on the record: the other derived set
      on this card is sound - mutant R4 (a fourth global `_engine_dialect` added to _init_engine)
      KILLED test_it_resets_exactly_the_globals_the_builder_creates with exactly the message the
      :108-112 comment promises, which is the edge control that comment was missing.
    suggestion: |
      Keep the derivation; widen the analysis and make the unanalysable shapes red.
      (a) Recognise the string-target form: when a setattr call's first argument is an
      ast.Constant string, treat any value starting `nonogram.db.session.` as a site (and any
      string naming a module the guard cannot resolve as a FAILURE, per R2).
      (b) Collect aliases from ast.Import as well as ast.ImportFrom - `import nonogram.db.session
      as X` binds X too - so the completeness test at :477 can do the job it claims.
      (c) Make the exemption an equality over SITES, not pairs: count occurrences per (file, name)
      and compare counts, so a tenth site is the decision the comment says it is. Then narrow
      :140 and :442 to whatever the code ends up catching.
      R1/R2/R3 are the three controls to add alongside; each is 4 lines.
    confidence: high
    source: mutation
    violates: "ADR-0039/R2, ADR-0039/R3, ADR-0039/R1"
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: minor
    category: testing
    type: false_red
    file: tests/test_db_engine_lifecycle.py
    line: 379
    title: "AC-4's db_required count measures the run's selection, not the module, so a legal targeted selection reds it"
    description: |
      test_exactly_the_expected_number_of_tests_here_need_the_database counts
      `request.session.items` filtered to this file. The expectation (EXPECTED_DB_REQUIRED_TESTS
      = 2, :74) is independent of the measurement, which is right and is what the AC asked for -
      but the measurement is the COLLECTION, not the module, so it answers `how many db_required
      tests did this selection collect` rather than `how many does this module carry`.

      Measured on this head:
        pytest "tests/test_db_engine_lifecycle.py::TestEngineLifecycle_TheSkipProfileIsUnchanged::test_exactly_the_expected_number_of_tests_here_need_the_database"
        -> FAILED: `0 test(s) here carry db_required, expected 2: []`
      The `assert mine` guard at :387 catches `collected nothing` but not `collected a subset`.

      This board runs targeted selections constantly - the card's own notes record a
      touched-adjacent selection, and this review was instructed to use nothing else - so this is
      a red that means nothing, on the card whose title is `a gate's red means the code`. It is
      filed Minor, not Important, because the AC's purpose is served in any whole-module run and
      at the gate, and because the failure message is self-explanatory rather than a
      wrong-diagnosis trap.
    suggestion: |
      Count from the module instead of from the run: walk this file's own AST for
      `@pytest.mark.db_required` on functions and classes (the file already does AST work for two
      other guards), or collect the file with a sub-pytest. Either way the number stops depending
      on which tests the run selected.
    confidence: high
