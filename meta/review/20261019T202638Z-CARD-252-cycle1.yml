    learned_pattern: null

  - id: F-004
    severity: minor
    category: maintainability
    type: claim_wider_than_mechanism
    file: tests/conftest.py
    line: 453
    title: "The ordering's stated reason cannot happen: reset_engine() builds nothing, so there is no engine to point at a half-built schema"
    description: |
      Two docstrings give the same justification for step 3's position:
        conftest.py:453-456 - `after the migration, never before. Disposing before step 2 would
        leave a fresh engine pointed at a half-built schema`
        session.py:215-216 - `after the migration, never before, because a fresh engine built
        against a half-built schema is the same problem wearing a different hat`
      reset_engine() disposes and assigns None (session.py:234-238); it builds nothing, and
      nothing between step 1 and step 3 asks for a session (the migration is a subprocess).

      Verified, not reasoned: mutant R7 moved `app_session.reset_engine()` from after the
      truncate-list read to before the alembic subprocess in _rebuild_public_schema. Result: 10
      passed - the module is completely indifferent to the position. The card's worktree notes
      already record this measurement honestly (`moving reset_engine() to before the migration
      does not turn it red`) and the decision not to assert line order is right; what was missed
      is that the two docstrings still state the unreachable hazard as the REASON, so the next
      reader believes an ordering constraint exists that the code cannot violate.
    suggestion: |
      Keep the order (it is the clearer reading and costs nothing) and narrow both sentences to
      what is true: the position is deliberate so that the reset is the last thing the rebuild
      does and no engine predating the new schema can exist when the fixture yields; add that
      reset_engine() builds nothing, so the `half-built schema` hazard applies to the card's
      original sketch-with-an-eager-rebuild and not to this implementation - which is exactly what
      CARD-252's worktree notes say.
    confidence: high
    source: mutation
    violates: "ADR-0039/R1"
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: minor
    category: testing
    type: unfalsifiable_assertion
    file: tests/test_db_engine_lifecycle.py
    line: 262
    title: "The third of AC-1's three-part claim - `no backend process predating the rebuild survives` - has no control that can fail on its own"
    description: |
      The claim is made in three places as a conjunction of three survivors: the module docstring
      (:30-31), the class docstring (:212-214) and the test name itself
      (`test_no_engine_pool_or_backend_predating_the_rebuild_survives_it`). Two of the three are
      falsifiable and now certified: the engine identity by M1 on the card, the pool by mutant R5
      (`engine.dispose()` deleted -> `the pre-rebuild pool still holds a connection (Pool size: 5
      Connections in pool: 1 ...): it was not disposed`, 1 failed 9 passed).

      The backend half I could not falsify. The dedicated attempt was R6 -
      `engine.dispose(close=False)`, SQLAlchemy's own way to abandon a pool without closing its
      sockets, which is the only realistic shape that leaves a backend alive. It died on the
      PRECEDING pool assertion (:257) instead, because `before_pool` still references the old pool
      object and its connection: same message as R5, 1 failed 9 passed. Any mutation that leaves
      a pre-rebuild backend alive leaves that connection in the pool, so :257 always fires first
      and the poll at :262-271 can only be reached when it is already going to pass.

      So the backend check is an implied consequence of the pool check rather than a third pin,
      and the 5-second polling loop exists to tolerate its own asynchrony. Not harmful, and the
      claim is TRUE - but it reads as three independent pins where the code has two, which is the
      same family as F-001/F-004 in a weaker form. Same shape, same severity, in the AC-4 class
      name: `TestEngineLifecycle_TheSkipProfileIsUnchanged` does not assert the suite's skip
      profile at all (it is a gate observation, and the class docstring at :364-371 says so
      plainly - the name does not).
    suggestion: |
      Either say in the class docstring that the backend observation is implied by the pool
      assertion and kept as a belt-and-braces reading rather than an independent control (one
      sentence), or make it independent by snapshotting the pid set and asserting it from the
      fixture engine with the pool assertion moved after it - so a dispose that abandons sockets
      is caught by the backend half specifically. If the cheap route is taken, consider a name for
      the AC-4 class that matches what it asserts (the module's db_required floor and the gate's
      zero skip reasons).
    confidence: high
    source: mutation
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: nit
    category: testing
    type: robustness
    file: tests/test_db_engine_lifecycle.py
    line: 249
    title: "AC-1 drives a real DROP SCHEMA mid-suite, where the session fixture drives it before any test could leak a connection"
    description: |
      The test calls _rebuild_public_schema (:249) for real: DROP SCHEMA public CASCADE, CREATE,
      and a full `alembic upgrade head` subprocess, at whatever point in the run the test happens
      to land. The session fixture runs the same routine before any test body has executed; this
      test runs it after arbitrarily many, so it inherits any session an earlier test leaked
      open - which the DDL's `SET LOCAL lock_timeout = '10s'` turns into an error in the new
      test rather than in the fixture. Probability is low (the per-test TRUNCATE at conftest.py
      :572-578 already depends on the same property and has the same 10s timeout), and this is
      the right trade for having the mutant land in the code the fixture actually runs. Recorded
      so that if this test ever goes red with a lock timeout, the reader knows it is an earlier
      test's leak and not this card.
    suggestion: "No change asked. If it ever flakes, name the holder: query pg_stat_activity for the blocking pid in the failure message."
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
