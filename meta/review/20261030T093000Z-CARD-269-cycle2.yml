verdict: >-
  CERTIFIED. All three gating findings of cycle 1 are genuinely closed, and the
  closure of the hardest one (F-2) is the best-evidenced piece of work this card
  has produced. The screenshot instrument's three proofs reproduce exactly --
  the negative control is byte-identical on all three regions over six repeats,
  the positive control rises, and the measured separation (noise <= 2 levels,
  smallest real change 20) holds. Every placement figure re-derives to the
  digit, and removing the visible line from the live page moves nothing at
  1280x720, 1280x900 or 1440x900, which is a stronger proof of the zero-cost
  claim than the shipped test makes. The owner's 1280 px toolbar threshold is
  untouched. The accessibility choice reproduces against Chromium's real tree in
  all three directions and is the right call. The null-impossibility has a real
  control on the same board. Seven mutants all bite, the threshold constant
  being load-bearing in BOTH directions (3 reds raised, 2 reds lowered).
  What keeps this off a 9: the narrow-width residual is the one thing in this
  round that is stated wrongly rather than conservatively. Measured, the phone
  IS in the ellipsis band the round says it was deliberately kept out of -- at
  390 px every rung-2 sentence is truncated at 358 px against 508-594 px of
  text -- and the own-row rule that was introduced to keep it out costs
  38.328 px of vertical space, which pushes the board out of a 900 px viewport
  between roughly 700 and 820 px wide, the exact failure mode for which the
  toolbar-to-board placement was rejected. Neither is a shipped defect on the
  paths the card is about, both are should-fix. The exhausted second press is a
  genuine, correctly scoped residual and not F-2 surviving.

