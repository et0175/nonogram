judgements_requested:
  are_the_three_gating_findings_closed: >-
    YES, all three, and independently checked rather than taken from the card.
    See gating_closure above. F-2's closure is the strongest of the three: the
    property is asserted as a property, in a class phrased against what a
    sighted player sees, and seven mutants against it all bite.
  do_the_instruments_three_proofs_reproduce: >-
    ALL THREE, exactly. Negative: byte-identical on all three regions, six
    repeats, two states. Positive: rises on board and line. Separation: noise
    <= 2 levels against a smallest real change of 20.
  does_anything_land_in_the_4_to_20_gap: >-
    Nothing this page can do. The focus ring, the smallest real change the round
    names, re-measures at exactly 20 through the click path. A counter digit is
    217, a highlighted row 25, Check's row 49, a sentence 217. The gap is
    reachable only by a uniform low-level colour shift -- 4 levels over 10,524
    pixels reads invisible, 5 is caught -- which is F-19, a property of the
    instrument rather than a live defect. The componentwise choice is right and
    its stated justification checks out arithmetically.
  cycle_1s_byte_identity_claim: >-
    FIX ROUND 2'S RULING IS CORRECT, and I would put it more strongly in its own
    favour. The board half of cycle 1's claim reproduces exactly at HEAD: 0
    differing pixels between rung 1 and rung 2. The toolbar half does not, and
    my own numbers differ from fix round 2's (16 pixels at 2 levels against its
    6 at 1), which is the best possible evidence for its thesis -- a pixel count
    across a repaint is not reproducible even between two reviews of the same
    comparison. The measurement was sound and the claim's FORM was not; bounding
    the per-channel level is the right replacement. Its own capture log shows
    the same thing from the other side: every stored PNG needed two or three
    attempts to get two consecutive byte-identical reads.
  do_the_placement_figures_re_derive: >-
    EVERY ONE, to the digit. Board bottom 715.813 px in a 720 px viewport,
    4.187 px of slack, line 22.328 px, .player-toolbar margin-bottom exactly
    16 px, leaving +6.328 px against 4.187 px available. The computed style is
    exactly what is claimed: flex-grow 1, flex-shrink 1, flex-basis 0px,
    min-width 0px, white-space nowrap. The h1 is 48 px and the line 22.328 px,
    so "shorter than the h1 that sets the row's height" is true, and .page-head
    is 52 px at every width above 820. The zero-cost claim is proved here more
    strongly than the shipped test proves it: REMOVING the element from the live
    page leaves head, board, toolbar, counters and progress at identical boxes
    at 1280x720, 1280x900 and 1440x900. The +6.328 consequence row reproduces as
    a count (F-14 on its names); the 0 px row reproduces as 0 reds across 907
    tests.
  is_the_1280_threshold_untouched: >-
    YES. #puzzle-player-controls 74.797 px at 1280 and 38.797 px at 1440;
    .player-counters 186.234 px and 346.234 px; board top 238.797 px and
    202.797 px; line 627.859 px and 787.859 px. Identical empty and full, and
    identical with the line removed entirely. The owner is being shown the same
    toolbar they accepted.
  are_the_three_residuals_complete_and_honest: >-
    TWO OF THREE. The ellipsis band is honest and in fact conservative for
    desktop (the true boundary for the 593.875 px longest sentence is about
    1246 px, not 1270), and the longest-sentence figure re-derives exactly and
    really is the longest of the page's whole vocabulary, including at 30x30.
    The tint residual is honest and correctly reasoned (below). The PHONE
    exemption is the one that is wrong, and wrong in the direction that matters,
    because it was the reason given for why the narrow rule sufficed -- F-12 --
    and the row it introduces has an undeclared vertical cost in a band nobody
    measured, F-13. A fourth residual is undeclared because it was not looked
    for: there is no capture at any narrow width.
  the_exhausted_second_press: >-
    IT IS A GENUINE RESIDUAL, CORRECTLY SCOPED, AND NOT F-2 SURVIVING. F-2 was
    "the rung whose job is to explain changes nothing a sighted player can see",
    as a property of every board. After this round the second press changes
    something seen on every board where it has something new to say, and on the
    one board where it does not, the sentence it repeats is TRUE and complete --
    card rule 6 fixes one sentence for both exhausted rungs precisely because
    there is nothing further to say until CARD-268's probe exists. The right
    remedy is copy, which is the owner's, and inventing it in a fix round would
    have been the wrong call. Asserting it in a test rather than leaving it as
    prose is exactly right, and the assertion is the one a future card flips --
    I verified it is a real assertion: every region indistinguishable across that
    press, measured, with _pixel_delta in the failure message.
  is_the_a11y_choice_right_and_does_it_reproduce: >-
    IT REPRODUCES EXACTLY, in all three directions, and the choice is RIGHT.
    As shipped, two nodes carry the sentence -- InlineTextBox and StaticText,
    neither ignored. Removing aria-hidden raises that to four; restoring it
    returns the tree exactly; the announce region is unmoved by a real press and
    is in its shipped 1x1 clipped state with role status and aria-atomic true.
    On the brief's question -- does a sighted screen-reader user lose the ability
    to navigate back to the sentence as static text? NO, and this is the detail
    that settles the choice. The announce region is visually clipped but it is
    PRESENT AND UN-IGNORED in the accessibility tree, which my probe shows
    directly, so a virtual cursor still reaches the sentence as static text. The
    only cost is that the reachable copy is not co-located with the visible one.
    A single visible role="status" line with no hidden copy would be the cleaner
    end state, but it would have meant changing the shipped live region inside a
    fix round closing a gating finding, which is the thing this card's own
    regression assertions exist to prevent. Right call; note it as a follow-up,
    not a defect.
  does_the_null_impossibility_have_a_control: >-
    YES, and a real one, on the SAME board. Verified in the source:
    hintLine(board(2,1,'uu'), [[3]], [[3],[3]], [[true,true]]) with a hand-built
    {deduced: true} hint throws RangeError, while the same call with the hint
    hintCell actually answers on that same board, those same clues and that same
    solution returns null -- the exhausted state. Without the second half the
    first would also pass if hintLine had started throwing unconditionally, and
    the test's own comment says so. The structural gap cycle 1 named is closed.
  is_the_ladder_legible_from_the_captures: >-
    YES at 1280 and 1440. In 12-visible-answer-line-1280px-rung2-fullpage.png the
    sentence "Hint: look at row 1 -- the 3-run must overlap in the middle
    whatever its position." reads cleanly beside the title, the tinted row 1 and
    its clue box are both perceptible on the paper, and the usage paragraph under
    the board now names the ladder, Check and the line. A player pressing Hint
    gets an answer they can read. Two caveats. The line is typographically
    subordinate and sits in the title row rather than near the button (F-21).
    And the captures cover the two DEDUCIBLE rungs only: there is no capture of
    the exhausted board or of Check with the visible line, which were two of
    F-2's three dead-button cases, and none at any narrow width, which is where
    F-12 bites.

