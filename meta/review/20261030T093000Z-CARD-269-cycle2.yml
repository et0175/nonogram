findings:
  - id: F-12
    severity: should-fix
    confidence: certain
    source: measured
    title: >-
      The phone IS in the ellipsis band the round declares it was deliberately
      kept out of: at 390 px every rung-2 sentence is truncated
    where: >-
      src/nonogram/admin/static/admin.css, the .player-explain comment's
      "THE RESIDUAL" and "The phone is NOT left in that band" paragraphs; the
      same claim in d22f1de0's commit message and in the card's fix-round-2
      note; the narrow-width rule @media (max-width: 820px).
    detail: >-
      MEASURED at 390 x 844 on the shipped page. The narrow rule does give the
      line its own row, 358 px wide, and that is a real improvement over the
      5.859 px it would have inline -- the 5.859 px figure re-derives EXACTLY.
      But 358 px is not enough for the sentences that matter. Rendered widths
      in the line's own typography: rung 2 generic 593.875 px, rung 2 overlap
      564.031 px, rung 2 runs-complete 508.438 px, the exhausted rung-3 reveal
      581.781 px at 15x15 and 584.438 px at 30x30. Every one of them is
      ELLIPSISED at 390 px (scrollWidth 508-594 against clientWidth 358). Only
      rung 1 (157.484 px), the exhausted rungs 1-2 sentence (350.984 px, with
      7.016 px to spare) and Check's sentences (220.563 px) fit.
      So on a phone the press IS visible -- F-2 proper does not return -- but
      rung 2, the rung whose entire job is to explain the deduction and the
      rung F-2 was about, is readable only up to about two thirds of its words.
      The declared band "about 820 px to 1270 px" is honest and in fact
      conservative for the desktop case (the true boundary for the 593.875 px
      longest sentence is about 1246 px, so the round over-declares the
      residual, which is the safe direction). It is the phone EXEMPTION that is
      wrong, and it is wrong in the unsafe direction, because it was offered as
      the reason the narrow rule was enough.
      Compounding it: captures 12 and 13 are at 1280 and 1440 only. There is no
      phone capture of the visible line, so the one width where the residual
      actually bites is the one width nobody has looked at -- the same shape as
      cycle 1's F-4, one band over.
    recommendation: >-
      Restate the residual honestly (the phone is in the band for rungs 2 and
      for the exhausted reveal), and take a 390 px capture so the owner can see
      it. The real fix is a follow-up card: allow the line to wrap to two lines
      below 820 px, where the board has 41.859 px of slack left after the row
      (802.141 px bottom in an 844 px viewport), rather than nowrap+ellipsis.

  - id: F-13
    severity: should-fix
    confidence: certain
    source: measured
    title: >-
      The narrow-width own-row rule costs 38.328 px of vertical space and pushes
      the board out of a 900 px viewport between roughly 700 and 820 px wide --
      the exact failure mode the toolbar-to-board placement was rejected for
    where: >-
      src/nonogram/admin/static/admin.css, @media (max-width: 820px)
      { .player-head .player-explain { flex-basis: 100%; } }
    detail: >-
      MEASURED. The .page-head row is 52 px high at every width above 820 px and
      90.328 px at and below it -- the line's own row costs 38.328 px, which the
      comment states. The comment then checks that the board still fits at one
      viewport only, 390 x 844, where it does (802.141 px bottom against 844).
      At 819 px and 820 px wide by 900 px tall the board's bottom edge is
      917.297 px in a 900 px viewport. Without the line's row it would be
      878.969 px and would fit. So in that band the line moves the board out of
      the viewport, which is precisely the consequence the round measured,
      wrote up in a five-row table and rejected the gap placement over. No test
      covers 600-820 px at a tall viewport, so it is green.
      Scope, honestly: at 600 x 900 the board already overflowed before this
      card (914.563 px), so the band this introduces is roughly 700-820 px
      wide, it is an admin tool, and nothing breaks beyond a scroll. It is a
      should-fix because the round's own standard for this question was
      measurement at every width it shipped a rule for, and the rule was
      checked at one.
    recommendation: >-
      Measure the board's bottom against the viewport across the narrow band,
      not at 390 px alone, and declare the result beside the 38.328 px figure.

  - id: F-14
    severity: minor
    confidence: certain
    source: measured
    title: >-
      The +6.328 px row of the placement table reproduces as a COUNT and not as
      the tests it names
    where: >-
      src/nonogram/admin/static/admin.css, the "MEASURED consequences of
      spending it anyway" paragraph; the same list in d22f1de0's commit message
      and in the card's fix-round-2 table; the docstring of
      tests/test_puzzle_solver_hint.py::TestSolverHintLadder_EveryPressChangesSomethingSeen::test_the_line_moves_neither_the_toolbar_nor_the_board
    detail: >-
      MEASURED by planting the shift (mutant M7) rather than by reading the
      claim. +6.328 px of board shift reds 2 of 120 tests in
      tests/test_puzzle_solver_marking.py plus
      tests/test_puzzle_solver_progress.py, and the unmutated control is 0, so
      the row's count and its conclusion both hold. But the two are
      TestSolverMarking_KeyboardAndLabels::test_each_tool_acts_on_a_single_key_press
      in its [Black-Enter] parametrisation and
      TestSolverProgress_SolvedWhenBlacksMatch::test_the_banner_takes_the_tools_place_and_the_board_does_not_move.
      The second is named correctly. The first is named as the [White-Space]
      parametrisation, with a mechanism attached to it ("whose _drag re-measures
      between its own mouse moves"), and that parametrisation passed for me.
      Worse for the claim's form: narrowing the selection to those two classes
      alone turns 2 reds into 3, so WHICH parametrisation falls over is
      selection-dependent. The class is stable; the member is not.
    recommendation: >-
      Attribute the row to the class and the mechanism, not to a parametrisation
      that moves. The decision it supports is unaffected and independently
      confirmed here.

  - id: F-15
    severity: minor
    confidence: certain
    source: measured
    title: >-
      "the whole page has 4.187 px of vertical slack" names the wrong box: the
      page already scrolls by 178 px at that viewport
    where: >-
      src/nonogram/admin/static/admin.css, the "Why nothing cheaper worked"
      paragraph; the same sentence in d22f1de0's commit message and on the card.
    detail: >-
      MEASURED at 1280 x 720. Every number is right: the board's bottom edge is
      715.813 px, the viewport is 720, the slack is 4.187 px, a line of
      --text-sm is 22.328 px high, .player-toolbar's margin-bottom is exactly
      16 px, and 22.328 - 16 = 6.328 > 4.187. The sentence is what is wrong.
      document.documentElement.scrollHeight is 898 at that viewport and the body
      bottom is 898.438, so the PAGE has no slack at all and already scrolls by
      178 px. The quantity that matters -- and the one the whole argument
      actually rests on -- is the BOARD's bottom edge against the viewport,
      because that is what decides whether Playwright scrolls to reach a cell.
      Naming the page instead of the board makes a correct derivation read as a
      claim anyone who measures scrollHeight will think is false.
    recommendation: "One word: the board, not the page."

  - id: F-16
    severity: minor
    confidence: certain
    source: measured
    title: >-
      "6 of the 73 500 pixels ... differing by 1/255 in one channel" is stated as
      a measurement in shipped comments and does not reproduce
    where: >-
      tests/test_puzzle_solver_hint.py, the _pixel_delta docstring;
      src/nonogram/admin/static/solver.js, the showExplain comment; the card's
      fix-round-2 correction 1.
    detail: >-
      MEASURED. The region size is exactly right -- the toolbar is 980 x 75 =
      73,500 px at 1280. The rest is not reproducible. Rung 1 -> rung 2 on the
      deducible board gives me 16 differing pixels at 2 levels, not 6 at 1; the
      exhausted first -> second press gives 20, not 23. The board half of the
      claim DOES reproduce exactly: 0 differing pixels, byte-identical.
      This does not weaken the round's conclusion -- it strengthens it, because
      the whole point was that a pixel count across a repaint is not a
      reproducible instrument, and here is the count varying by 2.7x between two
      runs of the same comparison. It also confirms the derivation of 4: 2 levels
      is still inside the stated 1-2 noise band. But the figures are written down
      as measurements in two shipped comments, where the next reader will take
      them for constants.
    recommendation: >-
      State the noise as a band ("a handful of pixels, 1-2 levels, varying run
      to run") rather than as two integers, which is what the instrument's own
      argument says it is.

  - id: F-17
    severity: minor
    confidence: certain
    source: measured
    title: >-
      The no-ellipsis assertion runs on one sentence 69 px shorter than the
      longest, so it does not pin the residual it is cited for
    where: >-
      tests/test_puzzle_solver_hint.py::TestSolverHintLadder_EveryPressChangesSomethingSeen::test_the_line_moves_neither_the_toolbar_nor_the_board
    detail: >-
      The test presses twice on GRID and asserts scrollWidth <= clientWidth,
      which is the right assertion and the right reason (text-overflow hides an
      overflow silently). But the sentence it measures is "Hint: look at row 1 --
      the 3-run must overlap in the middle whatever its position." at 524.609 px,
      while the residual's claim is about the longest sentence the page can
      produce. Good news for the round: I measured the whole vocabulary and the
      claim is CORRECT AND COMPLETE -- "Hint: look at column 15 -- every
      placement of this column's clues agrees on at least one cell." is
      593.875 px, re-deriving the declared 593.88 exactly, and it really is the
      longest; the candidate I expected to beat it, the exhausted rung-3 reveal,
      is 581.781 px at 15x15 and 584.438 px even at 30x30. So the residual is
      right and the test simply does not reach it: it has 103 px of slack it is
      not using at 1280.
    recommendation: >-
      Drive the longest sentence into the line directly in that test, or
      parametrise it over the three reason sentences. One line, and the
      assertion then pins what its docstring says it pins.

  - id: F-18
    severity: minor
    confidence: certain
    source: measured
    title: "The new visible channel is asserted cleared on one of AC-4's five reset events"
    where: >-
      tests/test_puzzle_solver_hint.py::TestSolverHintLadder_EveryPressChangesSomethingSeen::test_the_next_recorded_change_clears_the_line
    detail: >-
      AC-4 names a mark, undo, redo, a confirmed reset and Check. Read in the
      source, the behaviour is right for all five: undo and redo both call
      commit(), the reset confirmation's accept calls commit(), and commit()
      carries the showExplain("") -- one choke point, as the comment claims --
      while Check writes its own sentence through say() instead of clearing,
      which is the correct behaviour and not a gap. Only the cell-click path is
      asserted. Mutant M2 shows the one assertion is load-bearing, so this is a
      coverage note and not a correctness one.
    recommendation: "Add undo and the confirmed reset to that test's walk."

  - id: F-19
    severity: minor
    confidence: certain
    source: measured
    title: >-
      The level bound is on magnitude only and not on area, so a <= 4-level
      change over any number of pixels reads as invisible
    where: >-
      tests/test_puzzle_solver_hint.py, _INVISIBLE_LEVEL and _indistinguishable
    detail: >-
      This is the brief's question answered by measurement. NO change this page
      can make lands between 4 and 20: the smallest real change is 20 levels
      (the focus ring) and the largest noise 2, so the derivation holds for
      everything that ships, and M5/M6 show the constant is load-bearing in both
      directions. The gap is reachable only one way, and I reached it: darkening
      --color-accent-tint by 4 levels changes 10,524 board pixels and still
      reads indistinguishable, while 5 levels is caught. The docstring is
      explicit that the count is deliberately not bounded, with a correct reason
      (the count tracks how big a region Chromium chose to re-raster), so this
      is a known property rather than an oversight -- but as written it means a
      whole-region colour shift of up to 4 levels is invisible to the
      instrument, which is a different statement from "nothing visible changed".
      I could not reproduce the round's other near-miss in the shipped tree: the
      min-height 22.32 px variant leaves the board at 238.796875 px before and
      after a press at 1280, because in the page-head placement the h1's 48 px
      sets the row height. That claim describes a placement that is no longer
      there; it is not wrong so much as unverifiable now.
    recommendation: >-
      One sentence in the docstring: the bound is on magnitude, so a uniform
      shift of <= 4 levels over any area reads as invisible by design.

  - id: F-20
    severity: nice-to-have
    confidence: certain
    source: measured
    title: "Two stale pointers, both introduced by this card's own rounds"
    where: >-
      meta/architecture/requirements.yml, the AC-333 amendment comment;
      tests/test_puzzle_solver_hint.py, the
      TestSolverHintLadder_EveryPressChangesSomethingSeen docstring.
    detail: >-
