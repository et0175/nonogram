positives:
  - >-
    The instrument is proved in both directions before anything is claimed with
    it, the proof is a test rather than a note, and both controls reproduce on a
    different machine-state six repeats deep. This is the discipline the day has
    been asking for, written into the suite.
  - >-
    The threshold is derived and then shown to be derived: M5 and M6 red in
    opposite directions, so the constant 4 is pinned between two live failures
    rather than chosen.
  - >-
    The placement was decided by measurement after two wrong answers, the wrong
    answers are written down with their costs, and the winning answer's
    zero-cost property is structural (flex 1 1 0, min-width 0, nowrap, shorter
    than the h1) rather than incidental -- which is why removing the element
    from the live page moves nothing at three viewports.
  - >-
    The round corrected the review it inherited on its own central instrument,
    and the correction is right: byte-identity is not reproducible across a
    repaint, and my own numbers diverge from its numbers in exactly the way its
    argument predicts.
  - >-
    The accessibility choice is proved against Chromium's real tree in both
    directions, after the round caught its own first instrument counting DOM
    copies instead of tree nodes -- and the mutant shows the assertion bites.
  - >-
    The residual nobody would have noticed is asserted rather than narrated: the
    exhausted second press changes nothing seen, and that is a live assertion
    with _pixel_delta in its failure message, waiting for the card that takes
    the owner's decision.
  - >-
    The owner-authorised copy sentence went in exactly one file and moved its
    exact-equality pin with it, after fix round 1 was right to refuse it.

