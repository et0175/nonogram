findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/static/solver.js
    line: 1003
    title: "The menu's Tab-case comment still says focus lands on Undo; it now lands on Region"
    description: |
      In the menu's keydown switch, `case "Tab"` carries:

          // Not prevented: the item closeMenu() hides is the current focus,
          // so the browser's own Tab handling lands on the next focusable
          // control after it in the (now updated) DOM — Undo.

      That trailing "— Undo." is false at HEAD. The Region toggle is now the
      menu <div>'s next sibling, so the next focusable control after the
      hidden menu is Region, and the card's own test asserts exactly that:
      tests/test_puzzle_solver_brush_menu.py:602
      test_escape_closes_and_tab_leaves presses Tab out of the open menu and
      asserts `_FOCUSED == "Region"`, then one more Tab for "Undo".

      This is not a behaviour defect — the code is correct and verified. It is
      a stale claim in the layer this project treats as contract, and it is
      the ONE place in solver.js that was missed: the same file's header
      comment WAS updated for this exact transition ("Tab closes the menu and
      lets focus continue to the next control (Region, since CARD-211 put it
      between the trigger and Undo)"), so the file now states both the old and
      the new answer ~900 lines apart. A later reader resolving a Tab-order
      question from the nearer comment gets the wrong answer.
    suggestion: |
      Replace "— Undo." with "— Region (then Undo), since CARD-211 put the
      toggle between the trigger and the history buttons", matching the header
      block's wording.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_marking.py
    line: 742
    title: "Docstring points at TestSolverBrushMenu_Touch, a class this diff renamed away"
    description: |
      test_a_touch_drag_marks_one_line's docstring says "(TestSolverBrushMenu_Touch
      covers the Region-off case, where the same drag scrolls and marks
      nothing)". This diff renamed that class: `git diff main...HEAD` shows
      `-class TestSolverBrushMenu_Touch:` /
      `+class TestSolverRegion_UnarmedTouchDragStillScrolls:`, and
      `grep -rn TestSolverBrushMenu_Touch` over the whole tree now returns
      only this one line — a dangling pointer.

      Same family as F-001 and worth the same small fix, for a concrete
      reason rather than tidiness: these cross-references are how this
      project's test tree is navigated (the card's own Per-AC evidence table
      is built from them), and this diff deliberately added nine such
      pointers of its own. One that resolves to nothing teaches a reader to
      stop trusting the rest. Nothing executable depends on it — no AC, no
      trace.yml entry and no ADR check ref names the old class (grepped
      meta/architecture/ for it: zero hits), so the model is clean.
    suggestion: |
      Point it at TestSolverRegion_UnarmedTouchDragStillScrolls.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/static/admin.css
    line: 633
    title: "The layout fix shrinks the brush trigger by ~124 px and makes the Region toggle slide ~40 px when the brush changes — correct, but unasserted and unseen"
    description: |
      Measured at HEAD, 1280 px, with a throwaway Playwright probe (written,
      run, deleted — the tree is clean):

          brush  trigger   .player-tools   .player-slot   .player-region
          Black     83.7 px      208.0 px       208.0 px        71.7 px
          Undecided 123.8 px     208.0 px       208.0 px        71.7 px

      Two consequences of moving `min-width: 13rem` from
      `.player-tool-trigger` to `.player-tools`, neither of which any test in
      the repo observes:

      1. The brush trigger was a fixed 208 px before this card (it carried the
         13rem itself and was the group's only content). It is now content-
         width — 83.7 px for "Black", a ~60% reduction in the primary
         marking control's clickable width.
      2. Because `.player-tools` is a left-packing flex row, the trigger's
         width now varies with the chosen brush, so the Region toggle's left
         edge moves ~40 px to the right when the user picks "Undecided" and
         back when they pick "Black". A control that relocates right after the
         interaction that precedes it is a Fitts's-law cost: the common
         sequence is "pick a brush, then arm Region".

      Why this is a finding and not a defect: it breaks no AC, no guardrail
      and no standing rule, the slot and the counters' row are genuinely
      preserved (that part of the card's claim is exactly right), and a
      208 px button for a five-letter label was arguably oversized — the
      shrink may well be an improvement. The gap is in the EVIDENCE. The new
      regression test asserts `.player-slot == .player-tools == 208` and
      nothing about the group's interior, so both effects are invisible to
      it; the card's Worktree notes report the outcome as "the slot keeps
      exactly its old 208 px" and "picking a wider brush never nudges the
      board sideways either", which is true of the board and the slot and
      reads as if nothing moved. And `review.visual` is off for this
      project, so no eye has been on it.

      This is the one item in this card that the owner's hand-validation
      should actually be pointed at.
    suggestion: |
      No code change required. Either (a) accept both effects explicitly in
      the card's notes so the next reader is not surprised, or (b) if the
      trigger's old width or the toggle's position should be stable, pin it —
      the cheapest version is one extra assertion in the existing
      test_adding_it_leaves_the_tools_slot_at_its_old_width (it already
      parametrises Black/Undecided and already evaluates a width probe):
      assert the Region toggle's left edge, or the trigger's width, is the
      same for both brushes. Either way, show the 1280 px toolbar and the
      390 px toolbar to the owner before merge.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

