findings:
  - id: N-1
    severity: minor
    title: >-
      The AC-3 artefact's "embedded face, total" is wrong by 30 lines, and the
      sentence declaring every figure re-derived is wider than its enumerator —
      the enumerator's scope is a transcribed tuple that this round did not
      update
    file: scripts/card294_curve_price.py
    line: 92
    gating: false
    confidence: certain
    evidence: >-
      `meta/profiling/card-294-curve-price.md` §1 states
      "| the embedded face, total (CARD-293 estimated 163) | 216 |" and then,
      in the paragraph this round added: "Review cycle 1's fix round added 45
      code lines to the face and nothing to the round shape ... **Every figure
      in this table is re-derived by `scripts/card294_curve_price.py` on each
      run and none is transcribed**."
      The figure is re-derived; its *scope* is not. `code_lines(source,
      FONT_NAMES)` enumerates a hand-written tuple at
      `scripts/card294_curve_price.py:92-104`, and `git diff 0c63a328..7bf47f6b
      -- scripts/card294_curve_price.py` is **empty** — the fix round added two
      functions to the face and added neither to the list.
      Measured with the enumerator's own `code_lines`:
      `code_lines(src, FONT_NAMES)` -> **216**;
      `code_lines(src, ("_cap_height", "_table"))` ->
      `{'_cap_height': 25, '_table': 5}` = **30**.
      So the true "embedded face, total" is **246**, not 216, and the stated
      growth is **+75**, not +45. `_cap_height` is not an incidental helper: it
      is the whole of this card's only src/ behaviour change, and `_table` is
      F-7's error-typing. Both are face work by any reading of the row's label.
      The rows AC-3 is actually about reproduce exactly — I ran
      `scripts/card294_curve_price.py --samples 1000` and got round shape
      **24** (of which `round_mark` **13**), straight-line vocabulary **12**,
      and the 7-operator table — which is why this is minor and why AC-3 is
      met. But the artefact's §1 is a named deliverable ("**This is a
      deliverable, not a note**", item 3), the false row is the one the
      narrative reasons from ("twice the straight-line vocabulary and a ninth
      of the font work"), and the sentence asserting it is derived is the
      board's standing defect family in miniature: a number presented as
      mechanically re-derived whose input set is hand-held and has drifted.
      ADR-0039/R2 is the rule it misses — a guard's (here an enumerator's) set
      comes from an enumerable authority. Nothing holds `FONT_NAMES` to the
      module's face-related functions, so this will drift again on the next
      card that touches the face.
    remedy: >-
      Add `"_cap_height"` and `"_table"` to `FONT_NAMES`, re-run
      `scripts/card294_curve_price.py`, and correct §1's row to the figure it
      prints (246) along with the two sentences that reason from 216 — "a ninth
      of the font work" becomes a tenth, and "added 45 code lines" becomes 75.
      Then close the drift rather than fixing one instance of it: derive the
      face's name set instead of transcribing it (e.g. every module-level name
      whose `code_lines` body mentions `sfnt`/`cmap`/`hmtx`/`FontMetrics`, or
      the complement of `CURVE_PRIMITIVE_NAMES + STRAIGHT_PRIMITIVE_NAMES` over
      the module's own top-level defs), and assert inside the script that the
      three sets partition the names it means to cover — so a face function
      added without a row FAILS instead of silently shrinking the figure. If
      the sets must stay explicit, drop "and none is transcribed" from the
      artefact and say which part is transcribed.
    disposition: open
  - id: N-2
    severity: minor
    title: >-
      `_cap_height` — the card's only src/ behaviour change — has three
      reachable paths, the shipped face exercises one, and the card states
      behaviour for a second that no case takes
    file: src/nonogram/admin/book_vector.py
    line: 566
    gating: false
    confidence: certain
    evidence: >-
      Measured off the bundled face: `OS/2` is **version 1, 86 bytes** and
      `head`'s `indexToLocFormat` is **1**. So of `_cap_height`'s paths, only
      the long-loca `glyf` read runs, and it runs for every real input — the
      `version >= 2 and length >= 90` branch is unreachable for this face twice
      over (version *and* length), and the short-loca `else` branch is
      unreachable.
      Uncontrolled by any test, and each stated or implied as behaviour:
      (a) the `OS/2` version >= 2 branch. The card's round-2 notes say
      "`OS/2` version >= 2 still wins where a face has it" and the function's
      docstring says "``OS/2``'s ``sCapHeight`` when the table carries it
      (version 2 and up)". No case supplies such a face;
      `TestVectorVocabulary_RefusesWhatItCannotDraw`'s five `mangle` params are
      all refusals, none a well-formed v2 `OS/2`;
      (b) the short-loca (`indexToLocFormat == 0`) branch;
      (c) both `ContentStreamError` raises — a face with no `H` in its cmap,
      and an `H` whose `loca` entry is empty.
      I reviewed all three against the sfnt and OS/2 specifications and the
      arithmetic is **correct**: `sCapHeight` is int16 at `OS/2`+88 (so the
      `length >= 90` guard is right), short-`loca` offsets are stored halved so
      `*2` is right, and the glyph header's `yMax` is int16 at +8 — which is
      also the correct read for a **composite** glyph, since a composite's
      header still carries the overall bounding box. So this is a missing
      control, not a defect, and the `H`-bbox read reproduces FreeType's 729
      exactly (`ImageFont.getbbox("H")` top 200, `getmetrics()` ascent 929,
      929-200 = 729; the `H` glyph's raw `yMax` is 1493/2048 em = 729, which
      `tests/test_book_proof_pages.py:1104` also records for this face).
      The reach is bounded and I checked the bound the brief asked about:
      **nothing downstream depended on 650.** No module under `src/` imports
      `book_vector` (`grep -rn book_vector src tests scripts` finds only
      `tests/test_book_pdf.py` and `scripts/card294_curve_price.py`), so the
      metric's only consumers are `_write_face`'s `/FontDescriptor` and the
      future page cards. `face_bytes` is documented as existing only for AC-1's
      control and no page card can reach it.
      One residual that is a real hole rather than only a missing control: a
      face whose `OS/2` is version >= 2 but whose `sCapHeight` is **0** — some
      faces ship it that way — takes branch (a) and returns 0, giving
      `CapHeight 0` in the descriptor with no fallback to the `H` box and no
      error. The function's own `Raises:` clause says it exists to stop
      guessing a cap height; a zero is the one value it will state without
      either reading or refusing.
    remedy: >-
      Three cases in the class that already has one per refusal, all
      constructible from the bundled face with `struct`: a synthesised `OS/2`
      v2 table carrying a known `sCapHeight` (assert that value wins over the
      `H` box, which pins claim (a) in the direction the card states it); the
      same table with `sCapHeight = 0` (decide: fall through to the `H` box, or
      refuse — either is defensible, a silent 0 is not); and a face whose `H`
      is removed from the cmap (assert the `ContentStreamError`). The
      short-loca branch is the expensive one to fixture; if it is not worth a
      case, say so in the docstring beside it the way this round says so for
      the `Flags` rationale, rather than leaving it reading as exercised.
    disposition: open
  - id: N-3
    severity: minor
    title: >-
      `collects_file`'s "a pure glob, matched on the basename" is a
      simplification of pytest's rule, in the one module whose whole value is
      not simplifying pytest's rules
    file: tests/test_collected_names.py
    line: 126
    gating: false
    confidence: high
    evidence: >-
      `CollectionRules.collects_file` is
      `any(fnmatch.fnmatch(name, pattern) for pattern in self.files)` under the
      docstring "``python_files`` is a pure glob, matched on the basename".
      pytest matches `python_files` with `_pytest.pathlib.fnmatch_ex`, which
      matches the **full path** when the pattern contains a path separator and
      the basename only when it does not.
      No behavioural gap today: the shipped defaults are `test_*.py` and
      `*_test.py`, neither containing a separator, and `pyproject.toml`
      configures no `python_files` at all — which is why the guard is green and
      correct as it stands. It is a documentation/robustness point, and I raise
      it only because this module is otherwise scrupulous about exactly this
      distinction: `_prefix_or_glob` carries a whole docstring explaining why
      pytest's prefix rule is *not* `fnmatch` and why reimplementing it beats
      importing the private method, and the same care is not taken one method
      below. A `python_files = ["tests/unit/*.py"]` added later would make the
      guard's file filter diverge from pytest's silently — the guard would
      judge names in files pytest never opens, and skip names in files it does.
      I verified the claim about pytest's own rule by reading
      `PyCollector._matches_prefix_or_glob_option` in the installed pytest
      **9.1.1**, which the guard's reimplementation matches exactly (`startswith`
      first, then `fnmatch` only for an option containing one of `*?[`) — so
      that half of the module is right, not merely different, which was the
      brief's question.
    remedy: >-
      Either use `_pytest.pathlib.fnmatch_ex` (the same second-implementation
      trade the module already reasons about for `_prefix_or_glob`, or a
      four-line reimplementation of it) and say so, or narrow the docstring to
      "matched on the basename, which is pytest's rule for a pattern with no
      path separator — the only kind this repository configures" so the
      simplification is declared rather than stated as pytest's rule.
    disposition: open

