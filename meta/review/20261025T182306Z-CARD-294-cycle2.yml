corrections_to_the_brief:
  - >-
    **The brief's first "already settled" item is wrong, and the fix round was
    right.** The ADR-0025 circular-supersession ERROR exists, on both trees,
    deterministically. Reproduction, which the brief asked for:

      cd /Users/omelnikova/PycharmProjects/PythonProject4-card-294
      /Users/omelnikova/PycharmProjects/PythonProject4/.venv/bin/python \
        /Users/omelnikova/.claude/plugins/cache/adverax/forge/2026.8.17/skills/architect-validate/scripts/validate.py \
        --root meta/architecture > /tmp/val.txt 2> /tmp/val.err ; echo "exit=$?"
      sed -n '1,4p' /tmp/val.txt ; tail -2 /tmp/val.txt

    Branch: exit=1, 143 stdout lines, **0 stderr lines**, and stdout line 3 is
    `[ERROR] ADR-0025     circular supersession: ADR-0025 -> ADR-0031 ->
    ADR-0025 -> ADR-0025`, with the summary `1 error(s), 122 warning(s), 1
    info`. The same command in the primary worktree
    (`/Users/omelnikova/PycharmProjects/PythonProject4`, main) gives the
    identical error and `1 error(s), 121 warning(s), 1 info`. So round 1's
    headline (error count unchanged from main) and its attribution are both
    true, the pre-gate was wrong, and the brief inherited the pre-gate's error.
    All three of the brief's sub-claims fail: it is not 0 errors on either tree;
    the string does not appear "nowhere in the validator's output" (it is on
    stdout, not stderr, so a `2>&1 >file` ordering would not hide it, though
    running the script under `python -I` produces **no output at all**, which is
    one way to measure zero); and `adr_integrity.py:132` is inside
    `_check_contradictions`'s `seen_pairs` dedup for DEC *question overlap* — a
    different check with no bearing on supersession. The supersession check is
    `_check_supersession_cycles` (same file, from ~:195), and it has no such
    comment.
    The brief is right that the **data** is clean: `_SUPERSEDES_PAT` matches
    "supersedes" and "superseded by" alike and adds the target to one
    direction-blind adjacency set, so ADR-0025's "Superseded by ADR-0031" and
    ADR-0031's "Supersedes: ADR-0025" become a 2-cycle. It is a validator
    defect, not a model defect — and the doubled tail in the printed chain is
    cosmetic (`" -> ".join(cycle + [cycle[0]])`). But it is emitted, it is an
    ERROR, and "0 errors" is not reproducible by any invocation I could find.
    I am the third agent to assert it because it is there; here is the command.
  - >-
    The branch has **122** warnings against main's **121**, not "identical" as
    the pre-gate recorded. The one extra is **not this card's**:
    `[WARN] FR-044/EC-035 ... test 'PropertyTest_SolverHistory_ReplayReproducesTheBoard'
    but no definition was found ... DEAD check ref`, which lives in
    `meta/architecture/requirements.yml` — a file the card does not touch
    (`git diff 9b0d245d..HEAD` contains no `requirements.yml`) and which is
    **uncommitted-modified in the main worktree** (`M
    meta/architecture/requirements.yml` in the opening git status). The delta is
    an artefact of main's dirty tree, not of the branch. The round's substantive
    claim — "no ADR-0042 warning on the branch" — is true: `grep -c ADR-0042`
    over the branch's warnings is **0**, so R5's bare-name ref resolves.
    Noted in passing because it is the same defect family as F-1 in a third
    place: `PropertyTest_SolverHistory_ReplayReproducesTheBoard` is another bare
    `PropertyTest_` name read as a live mechanically-checked ref. It belongs to
    FR-044/EC-035's card, not this one, and it is more evidence that the guard
    this round built was worth building.
  - >-
    The round's F-2 mutation figure does not reproduce exactly: it reports
    "`/Widths` constant **600** -> RED (1 failed, 101 passed)". The two files
    collect 52 + 51 = **103**, and I measure **1 failed, 102 passed**. The cell
    named is correct and the conclusion is unaffected; the passed count is one
    short.
  - >-
    The round's `cap_height` mutation is **understated**, not overstated. It
    reports 2 RED; I measure **3 failed, 100 passed**, the third being
    `::test_a_face_that_is_not_a_truetype_sfnt_is_refused[a table the reader
    needs, missing]`. The coupling is real and benign: `_cap_height` is the only
    reader of the `OS/2` table, so bypassing it also bypasses F-7's
    missing-table refusal for that one case. Worth knowing because it means
    F-7's `[a table the reader needs, missing]` case controls `_table` only
    *through* `_cap_height` — if `_cap_height` is ever rewritten, that case stops
    testing what it claims to.
  - >-
    "Does reading Config.getini genuinely track a changed pattern, or is there a
    path where widening pyproject's python_classes would make the guard silently
    follow the widening rather than object?" It genuinely tracks it, and it does
    **not** follow silently. Measured: `pytest tests/test_collected_names.py -o
    python_classes="Test* PropertyTest*"` -> **2 failed, 11 passed**, the
    failures being `test_the_rules_come_from_pytest_and_not_from_this_file` (its
    pinned `assert not rule.collects_class("PropertyTest_Anything")`) and
    `test_the_rule_catches_the_defect_it_was_written_for` (the planted defect
    stops being a defect). So a widening cannot land without being acknowledged
    in this file. One prose nit rather than a finding: the module docstring says
    a future `python_classes` means "`PropertyTest_*` stops being a finding on
    the same commit it stops being a defect", which reads as frictionless — in
    fact that commit must also edit two assertions here. The inline comment at
    line 449-452 says exactly that ("If this line ever reds, the configuration
    changed and the guard has already followed it"), so the two are reconciled
    in the file; only the docstring is optimistic.
  - >-
    "Does the floor actually bind?" Yes. `python_files_under` made to return
    `[]` reds `test_no_name_in_the_tree_declares_a_test_pytest_will_not_collect`
    on `assert names >= 5000` (and also
    `test_the_files_pytest_never_opens_are_the_two_known_ones`).
    `declaring_names` over `tests/**/*.py` totals **6,348**, matching the
    module's stated figure to the unit. The floor is written down rather than
    derived, with the counted figure in the comment beside it, which is the same
    shape this tree's other corpus minima use and is honest.
    One structural note, not a finding: `names` is accumulated **before** the
    `collects_file` filter, so the floor does not protect against the file
    filter breaking — but that failure is caught twice over by
    `test_the_rules_come_from_pytest_and_not_from_this_file` and
    `test_the_files_pytest_never_opens_are_the_two_known_ones` (measured:
    `collects_file -> False` reds both), so there is no gap, only a
    division of labour.
  - >-
    "Is the reimplementation right, not just different?" Right. I read
    `PyCollector._matches_prefix_or_glob_option` in the installed pytest
    (**9.1.1**) and `_prefix_or_glob` is semantically identical: `startswith`
    first, `fnmatch` only for an option containing one of `*?[`. The round's
    account of why the `fnmatch`-only first draft went green for the wrong
    reason also checks out by mutation: degrading `_prefix_or_glob` to
    `any(fnmatch.fnmatch(name, option) for option in options)` reds the live
    walk with twenty genuine findings across
    `tests/test_cli.py`, `tests/test_admin_error_text.py`,
    `tests/property/test_binarisation.py` and others — i.e. under plain
    `fnmatch` the defaults match nothing and essentially the whole tree reads as
    uncollectible. The guard would have been loud, not silent, in that
    direction; what the round says is that its *first draft* passed, which is
    consistent with the draft also having mis-scoped the walk. Either way the
    shipped version is correct and controlled.
  - >-
    "Does the pin `test_the_files_pytest_never_opens_are_the_two_known_ones` red
    on a third uncollected file?" Yes. I planted
