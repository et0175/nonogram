verdict: >-
  All nine of cycle 1's findings are closed, and closed in the strong sense:
  for every one of them I re-fired the mutation the round's own table names and
  the cell that reds is the cell it names. Nothing in this cycle is gating.

  The two gating findings are genuinely dead, not relabelled. F-1: the class is
  `TestPropertyTest_VectorFont_EmbeddedOncePerDocumentAcrossPageCounts`, the
  file collects 52 where it collected 35, and I ran all three EC(ADR-0042/R5)
  tests by explicit node id (24 passed with the other new classes) rather than
  inferring them from a total. Both dead citations — the card's EC(R5) row and
  ADR-0042/R5's own comment — now name the collectable id. F-2: the FreeType
  cross-check discriminates **per code, to the unit**. I did not take the
  constant-600 mutation on trust; I also moved ONE width by one part in a
  thousand (`widths[0x41] += 1`) and
  `test_every_encoded_width_is_the_width_freetype_measures` redded alone. That
  is the strongest possible answer to the brief's question: a single wrong
  advance is caught, not just a wholesale replacement. The 219 floor is written
  down but derivable and derived in the comment beside it (224 codes in
  32..255, less the 5 cp1252 leaves undefined), and `_encoded_characters()` is
  rebuilt from the codec in the test rather than imported from
  `book_vector._encoded_codepoints`, so neither side of the comparison is the
  module under test.

  **The new guard can fail, and the floor binds.** I attacked
  `tests/test_collected_names.py` five ways. Degrading `_prefix_or_glob` to
  plain `fnmatch` — the first draft's own bug — reds the live walk against the
  real tree with twenty genuine names; the reimplementation is also
  *character-for-character* the rule in pytest 9.1.1's
  `PyCollector._matches_prefix_or_glob_option`, which I read, so it is right
  and not merely different. Neutering `uncollectible_names` reds 5. Making
  `python_files_under` return `[]` reds the live walk **on the 5,000-name
  floor** — so the floor is load-bearing, and `declaring_names` counts exactly
  the 6,348 the module claims. Breaking `collects_file` reds 2. Narrowing
  `DECLARES_A_TEST` reds 1. On the brief's G-2-adjacent worry — whether
  widening `python_classes` would make the guard silently follow the widening:
  it does not. Run with `-o python_classes="Test* PropertyTest*"` and
  `test_the_rules_come_from_pytest_and_not_from_this_file` and
  `test_the_rule_catches_the_defect_it_was_written_for` both red, so a widening
  must be acknowledged in this file on the commit that makes it. And the pin
  reds on a third file: I planted `tests/zz_review2_probe.py` with one
  module-level `test_*` and
  `test_the_files_pytest_never_opens_are_the_two_known_ones` failed naming it
  (probe removed).

  The `cap_height` change is a real bug fix on correct arithmetic, with the
  blast radius the brief asked me to check: **nothing downstream depended on
  650**, because no module under `src/` imports `book_vector` at all (measured;
  the only consumers are `tests/test_book_pdf.py` and
  `scripts/card294_curve_price.py`). Restoring the 0.7-ascent heuristic reds
  three tests, two of them through independent engines — FreeType's `getbbox`
  and poppler's render of real outlines — so 729 is agreed by two readers that
  did not write it. The glyf/loca arithmetic is right where it is exercised and
  right where it is not: `sCapHeight` at `OS/2`+88 as int16, short-loca offsets
  halved, and the glyph header's `yMax` at +8, which is also the correct read
  for a composite glyph. It is the *controls* on the branches the bundled face
  cannot reach that are missing — see N-2 — not the code.

  F-5's decision is sound and I corroborated it beyond what the test asserts:
  rendering `"A B"` and `"A B"` through this writer and `pdftoppm` gives
  **pixel-identical** pages (2,742 ink pixels each) and `pdftotext` extracts
  identically, so "inkless" is the right discriminator and the accepted case is
  faithful as far as any instrument on this host can tell. The refused case is
  the one that would have printed ink nobody asked for.

  What keeps this at 8 rather than higher is that the round, while closing the
  family, left one new instance of it and one gap of the same shape. N-1: the
  AC-3 artefact says "Every figure in this table is re-derived by
  `scripts/card294_curve_price.py` on each run and none is transcribed", and the
  enumerator's *scope* is a transcribed tuple that the fix round did not update
  — `_cap_height` and `_table`, the two functions it added to the face, are not
  in `FONT_NAMES`, so the stated 216 is really 246 and the stated "+45 lines"
  is really +75. The rows AC-3 is actually about (round shape 24, `round_mark`
  13, straight-line 12) re-derive exactly, which is why this is minor rather
  than gating — it is the same weight cycle 1 gave F-8, and consistency says
  treat it the same way. N-2: `_cap_height` has three reachable paths and the
  shipped face exercises one, while the card states behaviour for a second
  ("`OS/2` version >= 2 still wins where a face has it") that no case takes.

  Guardrails: all eight hold across the whole card, not just the fix round.
  `book_pdf_generator.py`, `pyproject.toml` and `src/nonogram/export/` are each
  **0 lines** of `git diff 9b0d245d..HEAD`. Layering is legal (`admin` is in
  `tests/test_cli.py:748`'s `_ADAPTERS`, so importing `nonogram.export.pdf` is
  adapter-to-capability). The component map needs no new row because its rows
  are per package (`admin/` = COMP-009), which is why 857 still passes.

  Fix N-1's figure and N-2's two cases and this is a 9. Neither blocks a merge.

