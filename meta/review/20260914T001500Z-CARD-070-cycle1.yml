findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: bug
    file: src/nonogram/orchestrator.py
    line: 1811
    title: "The batch and the CLI still disagree on the empty string, which is the one thing item 1 set out to make impossible"
    description: |
      The new gate is
      `tier = difficulty.parse_tier(difficulty_tier) if difficulty_tier else None`,
      and the docstring above it says routing through `parse_tier` means "a
      batch and an interactive run now accept and refuse exactly the same
      spellings". Measured on this head, they do not:

        generate(difficulty="")        -> UnsupportedDifficulty:
                                          unsupported difficulty tier ''
        generate_batch(difficulty_tier="") -> accepted, request.difficulty=None

      `""` is falsy, so the batch never calls `parse_tier` at all and silently
      means "any tier"; `generate` at :1492 guards on `is not None`, reaches
      `parse_tier` and refuses. Same input, two answers, in the two functions
      this item exists to reconcile.

      Nothing pins it either way. Mutation M1 — changing the guard to
      `is not None` so the empty string *is* refused — SURVIVED the whole of
      tests/test_orchestrator.py, which means the suite would not notice either
      behaviour changing.

      The behaviour is unchanged from before the card (the old `if
      difficulty_tier and ...` was falsy on `""` too) and no caller passes an
      empty string, so the blast radius is nil. It is filed at this severity
      because of the claim, not the input: a comment asserting a property the
      code does not have is the failure mode this whole card is a cleanup of —
      finding 4 was a comment describing a reader that did not exist.
    suggestion: |
      Pick one and pin it. Either guard on `is not None` so both paths refuse
      `""` (and `parse_tier`'s message explains why), or keep the falsy guard
      and narrow the docstring to the spellings it really covers — "every
      non-empty spelling parse_tier accepts". Add the case to
      `test_generate_batch_accepts_every_spelling_parse_tier_accepts`'s
      parametrize either way, so M1 stops surviving.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: 1500c1c
    dismissed_reason: null
    fix_note: |
      the guard is now `is not None`, so "" reaches parse_tier and is refused with the same message generate gives it; test_the_empty_string_is_a_tier_that_does_not_exist_on_both_paths asserts the two messages are equal, and test_none_is_still_the_way_to_say_any_tier pins the other side. Mutants R1 (falsy guard back) and R2 (None refused too) both KILLED
    learned_pattern: null

