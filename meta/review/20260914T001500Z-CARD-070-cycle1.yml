    title: "The batch gate is now a pure duplicate of generate's own tier parse"
    description: |
      Before the card the two differed — the batch compared enum names, which
      is why `"Easy"` raised there and not in `generate`. Now both call
      `parse_tier`, and `generate` does it at :1492 *before a seed is drawn and
      before the aggregate exists*, so a bad tier already aborts on the first
      loop iteration with no work done. Mutation M3 (remove the batch gate
      entirely) was killed only by the accept tests' `made == [tier.value]`
      assertion — the refusal tests passed with the gate gone, because
      `generate` refused for it.

      So the gate buys nothing behaviourally. It is defensible as boundary
      validation — failing before the loop rather than inside it reads better,
      and CARD-076 pinned tests on it — but it is now a second copy of a rule
      that has one home, which is the shape the card's own item 1 was
      correcting.
    suggestion: |
      Either keep it and say in the comment that it is a boundary convenience
      duplicating :1492 rather than the enforcement point, or drop it and let
      `generate` be the single gate (the CARD-076 tests would then need to
      drive the real `generate` rather than a stub). Not urgent; the risk is
      drift between the two, not current behaviour.
