findings:
  - id: F-009
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 4405
    title: "A plan tripwire on the Finalise GET is logged twice with the same traceback"
    description: |
      _interior_counts logs the tripwire with log.exception and re-raises it; the GET half of
      finalize_book (app.py:4405) does not answer it, so Flask's handle_exception logs it again
      ("Exception on /book/<id>/finalize [GET]") through the same logger. Probe with
      _drop_last_planned_page + PROPAGATE_EXCEPTIONS=False: two ERROR records with exc_info for one
      failure. F-005 removed exactly this duplication on POST; GET still has it. AC-1 holds (it is
      logged with its traceback); this is log noise only. The helper's docstring ("so a caller that
      answers it itself does not log it again") is accurate but no caller on GET does.
    suggestion: |
      Either answer the stamped exception on GET as POST does (render 500.html naming the error), or
      leave it and accept the duplicate; if fixed, pin the count with a len(logged) == 1 assertion in
      test_the_screen_shows_no_count_and_the_error_is_logged_with_its_traceback.
    confidence: high
