  - id: F-503
    severity: Important
    attribution: FIX 1 (own_instance and receiver_seen are both new in b88621d8)
    title: >-
      `own_instance`'s hard-coded `depth > 4` cap fails OPEN with no control:
      five aliases of `self` drop a setattr-installed door out of the
      own-instance surface rule and into the external-attribute exemption.
    ac: AC-4; ADR-0039/R1 (a hand-written bound with no caught-WITH /
      missed-WITHOUT); ADR-0039/R2 (a shape the walk cannot analyse is a pass)
    confirmed_by: EXECUTION, with its own control pair
    file: tests/test_book_export_interior_cover.py:1980-1998 (own_instance), :2026-2043 (receiver_seen)
    failure_scenario: >-
      `_a = self; _b = _a; _c = _b; _d2 = _c; _e = _d2` then
      `setattr(_e, "_door", getattr(self, "page_" + _S)); _e._door(3 + len(section))`.
      own_instance recurses _e -> _d2 -> _c -> _b -> _a and hits `depth > 4`
      before reaching `self`, returns False, so the own-instance surface rule is
      skipped and the call lands in the external-attribute exemption. Measured:
      SILENT, 0 refusals. The same plant with FOUR aliases instead of five --
      inside the cap -- REFUSES ("an attribute of this module's own instance
      that BookPDFGenerator never spells"). That is a caught-WITH /
      missed-WITHOUT pair for the cap itself, and nothing in the suite contains
      it.
    second_instance: >-
      `receiver_seen` has the mirror-image cap: `if depth > 4: return True`, so
      an attribute chain deeper than four is declared "seen" rather than
      refused. Same hand-written constant, same absent control, opposite
      polarity -- one fails open by returning False, the other by returning
      True.
    why_this_is_its_own_finding: >-
      It shares F-501's root cause (a syntactic form treated as a derivation)
      but it is a different mechanism with a different remedy: a magic constant
      inside a recursive resolver. ADR-0039/R2's default-deny prescription is
      unambiguous about which way a recursion bound must fail -- the
      `_page_positions` fixed-point loop one screen above already does it right,
      raising AssertionError when its own bound of 17 rounds is reached
      ("a bound that is reached is reported rather than silently truncating the
      set"). These two caps do the opposite, in the same walk, with the correct
      pattern visible 500 lines earlier.
    smallest_honest_fix_direction: >-
      Make both caps raise or append a refusal when reached, exactly as the
      vocabulary fixed point does, and assert the cost on this module (it is
      0 today: R8c shows four levels suffice for everything the module contains).

