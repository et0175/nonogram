    confirmed_by: EXECUTION (the test is green while R1b is silent)
    file: tests/test_book_export_interior_cover.py:3783-3816
    detail: >-
      The test asserts only that the four listed shapes ARE silent -- which is a
      real, falsifiable bound in one direction, verified here. It cannot assert
      that nothing ELSE is silent, and "exactly these" says it does. F-501's
      seven plants are silent and are not in the table, on an axis the class
      docstring declares CLOSED, so the name is not merely loose but currently
      false. Rename to `...are_still_silent`, or make the table the place where
      F-501's class is declared.

  - id: F-505
    severity: Minor
    cluster: claims whose controls cannot fail
    attribution: FIX 1 (IDIOMS_NO_ARM_BRANCHES_ON and its test are new in b88621d8)
    title: >-
      `IDIOMS_NO_ARM_BRANCHES_ON` is an inert five-member set: the assertion
      that consumes it passes for ANY value of the tuple, including `()`.
    ac: ADR-0039/R1 ("a set a guard consults needs a completeness test", and
      caught WITH the member / missed WITHOUT it)
    confirmed_by: EXECUTION
    file: tests/test_book_export_interior_cover.py:3536-3583
    detail: >-
      `constants.isdisjoint(self.IDIOMS_NO_ARM_BRANCHES_ON)` is the whole
      assertion. Measured at HEAD: the two walks hold 93 string constants and
      the intersection with the shipped five names is EMPTY -- and also empty
      against a fifteen-name candidate set (itemgetter, __getattribute__,
      globals, eval, exec, locals, partial, operator, __call__,
      getattr_static). So no member has a control that can fail in either
      direction, and the set has no completeness test: a sixth idiom is
      unconstrained. F-408 was correctly converted from prose to a control, and
      the control is the right shape -- but its SET is the defect the same ADR
      clause forbids, which is the third time this exact shape has been filed on
      this board (CARD-206 F-203 on GEOMETRY_DOORS, F-303 on BINDERS_READ, and
      now this). Derive it -- the candidate surface is enumerable from
      `dir(builtins)` plus `dir(operator)` -- or state the claim as "no string
      constant in either walk names any attribute-access callable of builtins or
