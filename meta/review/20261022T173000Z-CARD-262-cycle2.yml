      (the door-spelling arm, because the name is spelled). Cross them --
      W1's assembled name with W9's extra assignment -- and the result is
      SILENT, with no `extra` scaffolding at all. The card asserts per arm that
      "each arm catches a shape the other misses"
      (SILENT_WITHOUT_ONE_ARM: 17 rows and 2 rows, both re-derived here and
      correct). It never asserts the complement -- that no shape escapes BOTH --
      and the complement is false, derivable by crossing two rows of its own
      table.
