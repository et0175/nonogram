the_five_questions_cycle_2_was_asked:
  q1_is_the_door_axis_closed: >-
    NO. Seven new line-count-preserving plants, none of them in any of the
    card's tables, are SILENT -- neither READ nor REFUSED -- and all of them
    reach the real geometry door with the literal-derived position (executed,
    not reasoned). The plainest is the card's own W1 crossed with its own W9 and
    needs no scaffolding at all. F-501.
  q2_is_the_arm_default_deny_and_the_exemption_set_derived: >-
    PARTLY. The POLARITY genuinely inverted and that is real progress: `opaque`
    is gone as a positive gate, the arm refuses 760 of 816 calls with nothing
    exempt, and that cost is asserted step by step. But the inversion is
    incomplete -- the `anchored` branch and the arm's final fall-through are two
    ungated passes (F-501), and two recursion caps fail open (F-503). The
    exemption SET is hand-written (four strings), which R3 permits for
    exemptions, and it IS machine-checked in one direction: the controls
    table's class names are asserted EQUAL to CALLEE_EXEMPTIONS, so a fifth
    class cannot be added without a control. That assertion is sound and worth
    credit. What it cannot do is notice an exemption that is not in the list at
    all, which is what F-501 is.
  q3_do_the_tables_still_read_as_completeness: >-
    NO, and this is MET. The class docstring, PLANTED_SHAPES' docstring and
    DOOR_SHAPES' docstring all say "regression nets over the shapes measured so
    far, never completeness arguments", the completeness claim is explicitly
    placed on the closures' quantifiers instead, and
    `test_no_planted_shape_is_declared_silent` forbids an empty declared
    outcome in either table. The card offered a narrowed docstring OR an
    empty-outcome row and took the docstring plus the control, which is the
    stronger of the two. Verified green. The residual completeness read is in a
    TEST NAME, not a table -- F-504.
  q4_do_all_8_BINDERS_READ_members_have_failing_controls: >-
    YES, and this is the card's most solidly built piece of work. F-303 is
    CLOSED. `BINDER_BINDINGS` holds one tiny module per member; the set equality
    `set(BINDER_BINDINGS) == set(BINDERS_READ)` is asserted so a member cannot
    be added without a control; each member's own shape is read TWICE, with the
    member -> ("offender",) and with it removed -> ("refusal",), and neither
    state is silent. Verified: both tables hold the same 8 names
    (AnnAssign, Assign, AsyncFor, AugAssign, For, NamedExpr, comprehension,
    withitem), and the test passes in the green guard-class run. AsyncFor and
    NamedExpr, the two CARD-206 cycle 3 filed as having no control anywhere,
    now have one.
  q5_is_every_open_axis_a_named_exemption_with_a_control: >-
    NO. The three DECLARED axes are each properly named with a control that reds
    in both directions, and all three were verified: MODULE
    (`inside == 17`, 6 outside, the one non-trivial caller as an equality -- all
    re-derived here by an independent walk), VALUE and CALL-GRAPH
    (MEASURED_BLIND_SPOTS asserts its four shapes ARE silent, so narrowing the
    axis reds; it passes unchanged after the inversion, which is itself
    evidence the bound was not quietly narrowed). What is NOT a named exemption
    is F-501's class, which sits on the axis declared CLOSED. So
    MEASURED_BLIND_SPOTS is NOT "exactly the right set": it is right about the
    axes it covers and silent about a family on the axis it does not. It is
    also 2 representatives per axis rather than all 16, which the card declares
    and which I agree is a bound rather than a gesture.

