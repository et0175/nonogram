    severity: Critical
    attribution: >-
      FIX 1 for the CLAIM and the BRANCH; the silent behaviour itself pre-dates
      fix 1 (it lived inside F-401's wider default-allow hole). The branch that
      produces the silence under the new polarity (`if "anchored" in
      statuses(key): continue`, both sibling copies), the comment that justifies
      it, the docstring sentence "Closed on every callee this module's own text
      binds", and [SEMANTICS correction 2]'s closing claim that the axis-2
      clause "is TRUE as of this round" are all fix 1's. Within CARD-262 this
      makes family_regression streak = 1 (cycle 1 = the implementation's,
      cycle 2 = fix 1's); the detector needs >= 2, so the counter does NOT
      escalate. The family has now gated four times across the slice chain.
    title: >-
      The DOOR axis is still not closed. "Anchored" is a ONE-STEP syntactic
      check, not a derivation of identity, so appending one extra assignment to
      any shape the arms refuse makes it silent -- and the resulting pass is not
      one of the four named exemptions.
    ac: AC-2, AC-3, AC-4; ADR-0039/R2 (and R1 for the claim)
    confirmed_by: EXECUTION
    root_cause: >-
      For a callee the arm reaches `if "anchored" in statuses(key): continue`
      (the ast.Name branch at tests/test_book_export_interior_cover.py:2109, and
      the identical ast.Attribute branch at :2183). "anchored" means only that
      SOME binding occurrence of that one name holds a syntactic ast.Name or
      ast.Attribute. It says nothing about what THAT name holds. The walk never
      follows the alias, so `_d = _x` where `_x = getattr(self, "page_"+"spec")`
      is "anchored" and passes, while `_x` itself -- which IS in the opaque
      table -- is never a callee and so is never consulted. The hole has moved
      one STEP over, exactly as cycle 1's hole had moved one QUANTIFIER over and
      the hole before that one STORAGE over. The code's own comment at :2105-2108
      states the false premise explicitly: "a door could only have reached it by
      being SPELLED, which the door-spelling arm then sees" -- the door reached
      `_d` without being spelled anywhere.
      Neither this branch nor the arm's final fall-through `continue` at :2163 is
      gated by `exempt`, so the pass is UNNAMED and UNCOUNTED: it does not
      appear in CALLEE_EXEMPTIONS, it costs nothing in CALLEE_EXEMPTION_COST,
      and no control can see it.
    the_counterexample_is_the_cards_own_two_rows: >-
      W1 ("getattr with an assembled name") is
      `_d = getattr(self, "page_" + "spec")` + the call, and it REFUSES (the
      opaque branch). W9 ("a chained alias of a getattr door") is
