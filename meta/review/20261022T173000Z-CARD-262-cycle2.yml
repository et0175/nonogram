what_the_next_cycle_must_decide:
  - >-
    The same question cycle 1 posed, one level deeper, and the honest options
    are still only two. CLOSE axis 2 by making anchoring TRANSITIVE -- a name is
    anchored only if every binding occurrence holds a Name/Attribute that is
    itself anchored, computed as a fixed point over the `bound` table the arm
    already builds, with cycles and the recursion bound REFUSED rather than
    capped -- and re-measure the refusal cost on this module as the 760 -> 0
    sequence was measured, because the transitive version will refuse more.
    Or DECLARE the class: a fifth CALLEE_EXEMPTIONS member with its own step of
    the cost sequence, R1b/R3/R4 in MEASURED_BLIND_SPOTS asserted SILENT, and
    both docstrings narrowed from "Closed on every callee this module's own text
    binds" to "closed on callees whose own binding this walk can anchor in one
    step".
  - >-
    Either way, add the CROSS of the two arms' per-arm silent lists as a table
    row. The card asserts that each arm catches a shape the other misses; the
    claim that matters is that no shape escapes both, and R1b -- W1's body with
    W9's extra assignment -- is the two-line counterexample. One row makes that
    complement a regression control.
  - >-
    Both recursion caps (own_instance's `depth > 4: return False` and
    receiver_seen's `depth > 4: return True`) must fail CLOSED, the way the
    vocabulary fixed point in the same walk already does, with the cost on this
    module asserted -- it is 0 today, which R8c measures.
  - >-
    Each exemption class needs a control shape that is refused ONLY by its own
    branch, read twice (silent when the class is widened, refused when it is
    not). Where a prior mechanism dominates the branch and no such shape exists,
    say so and let the cost step carry the class, rather than labelling a
    control for mechanism A as a control for class B.
  - >-
    IDIOMS_NO_ARM_BRANCHES_ON should be derived (dir(builtins) + dir(operator)
    is an enumerable authority) or its claim restated to something the empty set
    cannot satisfy.

