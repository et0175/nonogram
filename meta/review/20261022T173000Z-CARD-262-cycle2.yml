ac1_and_the_semantics_block:
  the_block_is_quoted: >-
    Yes -- AC-1's stated control is that the review quotes the SEMANTICS block,
    and this cycle reads the implementation against it. Axis 2's declared
    semantics are: "a call whose callee's identity this walk cannot derive is
    REFUSED", closed by "two closures, and by NO per-shape branch".
  honesty_mechanism_still_honoured: >-
    YES, and it deserves credit. The pre-code block is left byte-unchanged;
    [SEMANTICS correction] (the STORAGE dimension) and [SEMANTICS correction 2]
    (the VACUITY dimension) sit beside it rather than being folded into it, and
    both falsified clauses are still visible. A pre-code declaration quietly
    edited to match the code is worth nothing, and this card has now resisted
    that twice.
  but_correction_2_makes_a_new_false_claim: >-
    [SEMANTICS correction 2] closes with: "The axis-2 clause the reviewer
    audited as FALSE -- 'a call whose callee's identity this walk cannot derive
    is REFUSED' -- is TRUE as of this round, and it is true because the polarity
    changed, not because the sentence did." That is FALSE, measured. The walk
    cannot derive `_d`'s identity in R1b and does not refuse it. The correction
    of a false claim is itself a false claim of the same kind -- the third
    generation of one sentence. Folded into F-501 rather than filed separately,
    but it is the AC-1 honesty failure of this round and it should be recorded
    beside the other two rather than edited away.
  what_could_not_be_checked: >-
    That the block predates the first code commit. meta/ carries no commit by
    procedure, so there is no timestamp to read. Cycle 1 stated that rather than
    scoring it; fix 1 claimed nothing from the "before" either; and this cycle
    scores it neither way. The evidence that remains is structural -- an author
    matching prose to code would not have left two falsified clauses standing --
    and it is credible but not measured.

