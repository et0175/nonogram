findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 545
    title: "The new staying branch leaves keyboard focus on <body> and tells the owner to press a button nothing focuses"
    description: |
      On `main`, onApprove ended with ONE unconditional `save.focus()` covering every outcome
      (git show main:src/nonogram/admin/static/puzzle_edit.js — the last line of the function).
      CARD-250 moved that call into the refusal branch only, and justified the removal in two
      places:

        - tests/test_puzzle_editor_ui.py:1540-1546 — "a stored edit leaves the editor (CARD-250
          AC-5), so there is no save bar left to stand on. The focus discipline of the flow is
          still pinned where the page stays";
        - the card's AC-5 blast-radius note — "Neither pins the successful branch, which no
          longer has one."

      Fix cycle 1 then added a SUCCESSFUL-approve branch that keeps the bar
      (puzzle_edit.js:545-548), and revisited neither the code nor the claim. On that branch:

        1. `tell("Storing this grid...")` set `decide.hidden = true` (:420), which hides the
           ancestor of the focused Approve button, so Chromium moves focus to `document.body`;
        2. the staying branch calls `tell(storedAndStayingText(...))` and returns — no focus()
           anywhere on the path;
        3. the sentence it writes ends "Press Save to check the board as it is now", and Save
           is re-enabled (`inFlightIs(null)` ran in the `finally`), but a keyboard owner has to
           tab to it from the top of the document.

      Measured, not inferred: a one-line activeElement probe temporarily added to
      test_a_stroke_made_while_the_store_was_writing_keeps_the_page and then removed reports
      `activeElement='' tag='BODY'`. By contrast the two surviving page-keeping paths both
      restore focus and both are pinned (onBackToEdit :566, assertion at :1522; onApprove's
      refusal :531, assertion at :1452 — MU4 confirms that one dies when the line is deleted).

      Two defects, one cause:

        (a) behaviour — G-3's stated purpose is "aria-disabled rather than `disabled` for every
            refusal, so keyboard focus is never dropped mid-flow (CARD-211)". Focus IS dropped
            mid-flow here and never restored, on the one path this cycle added, and `main` did
            not have the gap.
        (b) claim — tests:1544 "The focus discipline of the flow is still pinned where the page
            stays" is now false: there is a page-staying path whose focus hop is neither
            implemented nor pinned. The fix cycle's step-6b list claims every statement of the
            new lifecycle was re-derived from the code; this is the statement that licensed
            dropping the hop, and it was not.

      History weight: puzzle_edit.js is the highest-defect-density file of the touched set (3 of
      its 5 commits are review-fix cycles), and this is the third consecutive cycle in which the
      focus-discipline claim on this bar has produced a finding (CARD-246 cycle 1, CARD-250
      cycle 1 F-002, now this).
    suggestion: |
      Two lines, one in each layer.

      Code — puzzle_edit.js:545, inside the staying branch, before the `return`:

          if (mine !== turn) {
            tell(storedAndStayingText(body.puzzle));
            save.focus();
            return;
          }

      Test — at the end of
      test_a_stroke_made_while_the_store_was_writing_keeps_the_page (:2778):

          assert browser_page.evaluate("() => document.activeElement.id") == "puzzle-editor-save"

      Prose — correct tests:1540-1546 and the card's AC-5 note to enumerate THREE focus hops
      (Back to edit, onApprove's refusal, onApprove's staying branch), with the leaving branch
      the only outcome that has none, for the reason it already gives.

      Why this closes the hole rather than restating it: the assertion fails on the code as it
      stands — the probe above returns `''`, so the comparison is `'' == 'puzzle-editor-save'` —
      and passes once the line is added, which makes it the same shape of pin that MU4 proved
      works for the refusal branch. `save` is the right target and not a guess: it is enabled at
      that point and it is the button the sentence itself instructs the owner to press, which is
      the same choice onBackToEdit and the refusal branch already make. The only judgement call
      is Save versus leaving focus where it is, and "where it is" is `<body>`, so any
      restoration is strictly better than the present state.
    confidence: high
    source: static
    violates: G-3
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 564
    title: "onBackToEdit's unguarded turn += 1 is the one way the new exit predicate can mean something other than 'the board moved'"
    description: |
      `turn` now carries a third job: it is the staleness token for a verify answer, the
      request counter, and — since the fix — the predicate for whether a successful Approve
      LEAVES. Of the four sites that advance it, three cannot disagree with that reading:
      onSave (:477) and onApprove (:509) are both behind `if (inFlight !== null) return`, and
      onBoardChange (:597) is the intended advancer. onBackToEdit (:564) is not guarded at all.

      If Back to edit is pressed while an approve is in flight, `mine !== turn` becomes true for
      a reason unrelated to the board, and the page then states
      "You changed the board while it was being stored, so the editor stays open: those strokes
      are still on the board and are not stored" — a claim about the board that is false, on a
      page whose whole discipline is to never state what it has not been told.

      Not reachable by an owner: `#puzzle-editor-decide` is `hidden` (display:none) for the
      whole of the write, so `back` is neither clickable nor focusable. Filed anyway because
      that is precisely the argument this file refuses on this very line — its own comment reads
      "safety that rests on another element's visibility is not safety" — and because
      `_SAVE_THEN_BACK` already forces exactly such a press for the verify case, so the suite
      treats the forced press as a state worth testing.
    suggestion: |
      Either is sufficient; the first is cheaper to reason about:

        1. Guard the handler the way the others are guarded —
           `if (inFlight === "approve") return;` at the top of onBackToEdit. It changes nothing
           reachable (the button is hidden for exactly that window) and it makes `mine !== turn`
           mean "the board moved" and nothing else, which is what onApprove's comment claims it
           means. It must NOT be a blanket `if (inFlight !== null) return`: that would drop the
           verify-case turn spend the file deliberately added (review cycle 2, G-008) and would
           break test_a_back_to_edit_taken_mid_flight_is_not_undone_by_the_answer.
        2. Or leave the code and narrow the comment: say the predicate reads "the turn moved",
           and name the one unreachable way it can move for another reason. That makes the claim
           true but leaves the false sentence reachable under forcing.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_puzzle_editor_ui.py
    line: 928
    title: "_STORED_OR_LEFT's docstring claims three outcomes; the predicate resolves two"
    description: |
      The helper's docstring says "The store's write has been acted on, whichever way it went:
      either the bar says so, or the bar is GONE because the page left for the list... so a test
      that expects one of them reports which one happened instead of timing out on the other."

      The predicate is `message === null || message.textContent.includes('Saved')`. A REFUSED
      approve is a third way the write can go, and no refusal sentence in refusalText contains
      "Saved" (they open "Nothing was stored", "This edit cannot be stored", "The panel answered
      the save with ..."). So that outcome resolves neither disjunct and the wait runs out its
      full 20 s — the exact failure mode the docstring says it avoids.

      Two things it is NOT, checked: it cannot resolve for the wrong reason (the element is in
      the template, not script-built, so `message === null` means only "not on the editor page",
      and the test's own next assertions — `_asked_for_the_list(asked) == []` and
      `url.endswith("/editor")` — discriminate the two branches); and no BOARD_MOVED sentence can
      reach the bar on this path, because onBoardChange returns early while `inFlight ===
      "approve"`.
    suggestion: |
      Either closes it; the second is cheaper and loses nothing the test needs.

        1. Widen the predicate to the three outcomes:
           `message === null || /Saved|Nothing was stored|not known/.test(message.textContent)`.
           A refusal then fails on the assertions rather than on the clock.
        2. Narrow the docstring to what the predicate does: "either the store's SUCCESS is on
           the bar, or the bar is gone because the page left". The two branches this wait exists
           to distinguish are both covered, and a refusal remains a timeout — loud, just slow.

      Prefer (1) if the suite's wall-clock matters more than the line count; prefer (2) if not.
      Both are honest; leaving the present pair is the only option that is not.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

