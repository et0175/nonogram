    title: "The transfer test is claimed to be what notices AC-4's retirement; measured, it does not"
    description: |
      AC-9 as amended, the test's own docstring and the card's fix-cycle note all state that
      `test_the_puzzle_page_delta_is_the_whole_interiors_delta` is the thing that would notice if
      AC-4's regrade refusal were retired ("Retire that refusal and this test is what notices that
      the sentence stopped being true").

      Measured (mutant N3, this cycle): removing `self._refuse_a_regrade_inside_a_book(puzzle,
      grade["difficulty_tier"])` from `verify_replacement_grid` kills 5 tests - all five of them
      AC-4's own (TestBookedEdit_ARegradeInsideABookIsRefusedAtVerify x4 across both storage modes,
      TestBookedEditRoutes_ARegradeIsRefusedAtTheVerify x1). The transfer test PASSES. It cannot do
      otherwise: its three fixture grids DEPTH_3/4/5 are all Easy and are asserted to be
      (TestBookedEdit_TheDepthFixtureIsWhatItClaims), so no regrade is ever offered to the refusal
      it is said to depend on.

      The transfer ARGUMENT is sound and the test is a good test of the transfer; what does not
      exist is the detector the three places claim. AC-4's own five tests do fail, so a retirement
      cannot happen silently - it just does not point at AC-9's sentence.

      Filed Minor rather than Important deliberately: the AC's gating halves (the words appear, the
      save stores, the delta is signed) all hold and are mutation-certified; what is refuted is a
      rationale sentence with no behavioural consequence, which is the severity cycle 1 gave the
      same shape (F-003, F-005, both low). Escalate if the board wants claims inside an AC held to
      a higher bar than claims in a docstring.
    suggestion: |
      Either reword the three places to "AC-4's own tests are what notice" (one line each, in
      tests/test_puzzle_edit_routes.py:1069, CARD-251 AC-9 and the fix-cycle note), or make the
      claim true by giving the transfer class a cross-tier case that AC-4's refusal blocks - which
      would pin the dependency mechanically instead of asserting it.
