  - id: F-002
    severity: low
    category: feature
    type: gap
    file: src/nonogram/admin/app.py
    line: 2733
    title: "A split pair the suffix absorbs re-paginates the book silently, and nothing in the repo says so"
    description: |
      `changes` is `added != 0`, so the warning is keyed on the page COUNT. A greedy forward walk
      can split the edited puzzle's page and give the page back later in the book, leaving the count
      equal while the pairing moves.

      Measured on this head with the card's own fixtures (probe over
      `book_pdf_generator.puzzle_page_plan`, no production code changed): a book of four Easy 10x10
      puzzles at gutter depths (4, 4, 4, 5) plans as [(1,2), (3,), (4,)] = 3 puzzle pages; replacing
      puzzle 1's grid with the DEPTH_5 picture plans as [(1,), (2,3), (4,)] = 3 pages. `added` is 0,
      `changes` is False, and `bookNote`'s only sentence is "This puzzle is in the book X." - so the
      page this puzzle is on does stop holding two puzzles, puzzle 2 moves off page 1, and the owner
      is told nothing.

      This is faithful to the owner's settled wording ("says WHEN an edit would change the book's
      page count"), so it is not a behaviour finding and the review is not widening the owner's
      rule. What is missing is the declaration: this residual appears nowhere in
      `_page_count_effect`'s docstring, nowhere in the failure matrix, nowhere in the card and in no
      test - while the same file declares residuals of exactly this kind beside `_WRITES_THE_MESSAGE`,
      `_BUILDS_A_GRID` and `_EDIT_ROUTES`. A reader meeting `changes` will read it as "the pairing
      changes", which is wider than what it measures.
    suggestion: |
      Add the residual where the reader meets it - two lines in `_page_count_effect`'s Returns block
      saying that `added`/`changes` are a page-COUNT delta and that a split the suffix absorbs reads
      as no change, with the measured (4,4,4,5) construction as the example. Optionally put the case
      to the owner as a separate question (announce any re-pagination, not only a count change);
      that is an owner decision, not a review's.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

