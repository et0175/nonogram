  - id: F-009
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_difficulty_dots.py
    line: 2768
    title: "The accounting multiset is page-agnostic, which is a wider hiding place than the pixel tolerance it refuses"
    description: |
      `_unaccounted` matches found boxes against declared boxes as a flat multiset over the
      whole interior; page identity is dropped in `_interior_ink` (lines 2855-2863 append
      `region.box` and the declared dots without a page index). Its docstring argues against a
      coordinate tolerance because "a tolerance here would only buy a rogue mark room to hide
      beside a declared one" — but dropping the page gives a rogue mark room to hide on a
      *different page* at a declared box's coordinates, whenever a declared dot on some other
      page is not itself found (it touches ink, or is outlined). The band geometry is identical
      on every page, so those coordinates are not hard to hit.
      Contrived rather than likely, and the guard still counts totals, so an added mark
