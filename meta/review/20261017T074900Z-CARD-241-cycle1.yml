findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/helpers/round_ink.py
    line: 71
    title: "A round mark drawn in the package's own grey is invisible to the instrument, and that bound is neither stated nor controlled"
    description: |
      `ink_mask` is a hard binary threshold at grey 128 (tests/helpers/page_ink.py:138,
      INK_LEVEL = 128). Anything lighter is not ink, so it has no region, no aspect and no fill,
      and the guard cannot see it at all.

      This is not hypothetical. The production module already draws in a grey above that
      threshold: `_SOLVED_GRID_GRAY = (160, 160, 160)` at
      src/nonogram/admin/book_pdf_generator.py:1341, used at :4705 and :4715. The card's own
      test leans on exactly this fact — test_a_seeded_corpus_of_pictures_draws_no_round_mark's
      docstring (tests/test_book_difficulty_dots.py:3249-3257) says "a solved page draws its
      grid over the cells in grey, which is lighter than INK_LEVEL, so neighbouring filled
      cells stay separate regions". The same property that makes the corpus sweep come back
      clean is an open route for a round mark.

      Measured, planted through the real harness (`_interior_ink`), 6 glyphs of the planted
      tier stroked in `_SOLVED_GRID_GRAY` on every band of the baseline interior:

          GREY (160,160,160) dots: plants=6 pages=13 found=0 unaccounted=0 -> guard silent

      So ADR-0036/R3 ("exactly one function in src/nonogram/** puts a round mark on a page"),
      whose declared check is test_the_books_own_pages_carry_no_undeclared_round_mark, passes
      green with 18 undeclared grey dots on the pages. A reader of the printed book sees them.

      round_ink.py's "What this instrument does **not** see" section (lines 71-90) lists four
      bounds — hollow, touching other ink, non-square footprint, unrendered surface — and reads
      as exhaustive; the ADR-0036/R3 comment lists three ("bounded instead by the pages it
      renders, by a near-square footprint and by a filled mark"). Neither names ink darkness.
      ADR-0039/R1 requires every claim about what a guard catches to carry a control that can
      fail; there is no control at any grey level.
    suggestion: |
      Either narrow the claim or close the route — both are cheap:
      (1) add a fifth bullet to round_ink.py's bound list and to ADR-0036/R3's comment: "a mark
          lighter than INK_LEVEL (grey 128) — the package already draws at grey 160
          (_SOLVED_GRID_GRAY)", with a control in
          TestRoundMarkOnThePage_TheBoundaryIsMeasured that plants a grey disc and asserts the
          metric misses it while the same disc in INK is found; or
      (2) close it: measure against a second, lighter threshold (or against "not BACKGROUND")
          for the roundness pass only, with the solved-grid grey as the named exemption under
          ADR-0039/R3 and a control for what that exemption must not absorb.
      (1) is the honest minimum under ADR-0039/R1; (2) is what makes ADR-0036/R3 as wide as it
      reads.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: tests/helpers/round_ink.py
    line: 65
    title: "The \"no size floor\" claim is refuted by measurement: discs below the glyph's own minimum escape, and the sweep has no control there"
    description: |
      round_ink.py:65-69 states:

          **No size floor**, deliberately. ... a floor at the glyph's own smallest dot
          (12 px at 300 DPI) would have hidden a rogue mark smaller than the glyph itself
          can draw.

      The card repeats it verbatim in its STRUCTURE notes. The sentence's whole force is that
      the absence of a floor BUYS the catching of sub-12 px marks. It does not: the `fill`
      metric imposes an effective floor of its own, because at small diameters Pillow's raster
      of a circle is too square or too sparse to land inside 0.88..1.12.

      Measured (filled `draw.ellipse` on a blank canvas, via `ink_regions`):

          d= 2  aspect 1.000  fill 1.273  round=False
          d= 3  aspect 1.000  fill 0.707  round=False
          d= 4  aspect 1.000  fill 0.955  round=True
          d= 6  aspect 1.000  fill 0.849  round=False
          d= 7..15                        round=True

      and planted through the real harness, three 6 px black discs per band:

          TINY 6 px black discs: plants=6 pages=13 found=0 unaccounted=0 -> guard silent

      `_disc_sweep()` (tests/test_book_difficulty_dots.py:3352-3363) starts at `MIN_DOT_PX`
      (12), so `test_a_disc_measures_round_at_every_diameter_it_can_be_drawn` cannot fail on
      any of these — the claim about marks "smaller than the glyph itself can draw" has no
      control at all in the region it is about. That is the ADR-0039/R1 shape exactly: a claim
      whose control cannot fail.

      Severity: this does not break the guard for the marks the glyph draws (>= 12 px, all
      round at every diameter 12..142, verified), and a 6 px speck is a weaker threat than a
      full dot. But the sentence is in the instrument four more cards will read and build on,
      and it reads as a measured property.
    suggestion: |
      Narrow the sentence to what is measured and add the control:
      - replace the claim with the measured fact: "no size floor is imposed, and none is needed
        to keep the guard quiet over the real pages; the `fill` metric's own resolution is an
        effective floor — a filled disc reads round from 7 px up, and at 2, 3 and 6 px it does
        not (measured)". Then the bound list gains a fifth entry: "a mark too small for the
        fill metric to resolve (under ~7 px)".
      - extend `_disc_sweep()` down to 1 px and assert the verdict per diameter against a
        recorded table, so the boundary is stated and tested (AC-4's own wording) instead of
        starting the sweep above it. That makes the floor a control that can fail.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: bug
    file: tests/test_book_difficulty_dots.py
    line: 3186
    title: "AC-2's margin is 1.886, not 2.27, and the conclusion drawn from it (\"both tolerances could double\") is false"
    description: |
      TestRoundMarkOnThePage_PassesOnTheRealBook's docstring (lines 3186-3191) says:

          The closest any region on those pages comes to being round is reported as
          BookInk.margin, in units of the tolerance: it is over 2, so both tolerances could
          double and the book would still pass.

      and test_the_closest_the_book_comes_to_a_round_mark_is_measured's failure message
      (line 3201-3205) says "it was 2.27 when the tolerances were set".

      Measured on this head, through `_book_ink(None)` itself:

          margin = 1.8859

      The 2.27 figure belongs to the letter-stem family (aspect 0.5455, fill 0.9067 ->
      0.4545/0.2 = 2.27), which round_ink.py:60 also names as the closest mark. But the actual
      closest region is nearer and of a different kind — a 99x94 px nearly-square filled block
      at (144, 1266, 242, 1359), aspect 1.0532, fill 1.2263, ink 8963, on interior page 1:

          1.8859  page 0  (144,1266,242,1359)  aspect 1.0532  fill 1.2263
          2.2727  page 0  (476,2114,481,2124)  aspect 0.5455  fill 0.9067   <- the stem

      Consequences:
      * "it is over 2" is false (1.886);
      * "both tolerances could double and the book would still pass" is false in the strong
        direction — that block is already INSIDE the aspect tolerance (0.053 from square), and
        doubling ROUND_FILL_TOLERANCE to 0.24 makes |1.2263-1| = 0.2263 < 0.24, so it becomes
        round and AC-2 reds. The book's margin is carried entirely by `fill`, not by both;
      * the assertion floor is 1.5, so no test is red today — the misstatement is exactly the
        kind that survives green and misleads the next reader of the failure message.

      The aspect-tolerance justification on round_ink.py:58-63 ("the nearest mark ... that gets
      anywhere near a disc's fill is a letter stem at aspect 0.545 ... 0.2 sits in a gap with
      0.255 of margin") survives this only on the qualifier "that carries a disc's fill" — the
      1.053-aspect block does not. Worth saying out loud there, because the unqualified reading
      is what a future card will take.
    suggestion: |
      Replace the three numbers with the measured ones and the conclusion with the measured
      one: margin 1.886, carried by `fill` alone, driven by a 99x94 filled block at aspect
      1.053; the fill tolerance could rise to 0.226 before the book reds, and the aspect
      tolerance has no margin left on that block at all. Then raise the asserted floor from
      1.5 to something that actually guards the measured value (e.g. 1.8), so the test reds
      when the margin erodes rather than after it has halved.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

