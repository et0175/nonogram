root_causes:
  - id: RC-1
    title: "the render check's stated reach is wider than what it measures, on this card's own metric"
    finding_ids: [F-001, F-002, F-003]
    description: >-
      The card names this exact trap in its own Worktree notes ("writing a render check whose
      stated reach exceeds what it measures ... the same family as the static guard's, one
      abstraction over") and ADR-0039/R1 makes it a standing rule. The instrument's bound list
      is presented as exhaustive (four entries in round_ink.py's docstring, three in
      ADR-0036/R3's comment) and two further bounds exist that are neither stated nor
      controlled: the binary ink threshold and the small-mark floor the fill metric imposes.
      A third claim, the measured margin, is simply wrong by 0.38 tolerances and the conclusion
      drawn from it is false. All three are one defect: a reach sentence written ahead of the
      measurement that would have to fail to make it true.
