  - id: F-003
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_puzzle_editor_ui.py
    line: 1070
    title: "A retargeted assertion now runs on /puzzles, where its subject does not exist, and cannot fail"
    description: |
      test_approve_commits_the_grid_that_was_graded (:1052) ends:

          _button(browser_page, "Approve").click()
          _wait_for_the_list(browser_page)
          ...
          # The two-phase flow is over: there is nothing left to approve.
          assert not _approve_offered(browser_page)

      `_wait_for_the_list` waits for the URL to become /puzzles, so by the time the last line runs
      the document is the puzzle list. `_approve_offered` is
      `page.locator("#puzzle-editor-decide").is_visible()` (:1797-1798 region, helper at :798) and
      Playwright's `is_visible()` returns False for a locator that matches nothing — it does not
      raise. On the list page `#puzzle-editor-decide` matches nothing, so the assertion is True for
      any implementation whatsoever, including one that leaves the offer standing.

      This is the one of the nine retargeted tests that was weakened into a tautology; I checked
      the other seven (:1084, :1135, :1176, :1422, :1491, :1878, :1914) and each keeps a
      substantive post-navigation assertion (store contents, the POSTed grid, the URL, the
      pageerror list), so the pattern is isolated rather than systemic.

      The property itself is not wholly lost — test_a_second_approve_pressed_in_flight_is_not_sent_either
      (:1751) holds the page with `_stay_on_the_editor` and asserts no bar state saying "Storing
      this grid" has an Approve beside it — but that test checks the *storing* state, not the
      *stored* one, so "no Approve stands beside the Saved sentence" is now asserted nowhere.
    suggestion: |
      Either delete the line and its comment (the claim is false of the page the test now ends on,
      so an honest test says nothing about it), or move it to where the page still exists: read it
      from the bar-state sequence, as its sibling already does. In
      test_a_second_approve_pressed_in_flight_is_not_sent_either, which already installs
      `_WATCH_BAR` and `_stay_on_the_editor`, add to the existing states read at :1792-1795:

          saved = [s for s in states if "Saved" in s["text"]]
          assert saved, states
          assert not any(s["offered"] for s in saved), saved

      Why this closes it: that test keeps the document (204 on the navigation) and already records
      every bar state through a MutationObserver, so the stored state is in `states` and the
      assertion can genuinely fail — unlike a read taken after the browser has left the page.
      Deleting the line alone is honest but leaves the stored-state half of mechanism 1 unpinned,
      which is why the moved assertion is the better of the two.
    confidence: high
