    title: "One of the two named survivors for the retired focus assertion asserts no focus at all"
    description: |
      The card's note on AC-5's blast radius says test_approving_from_the_keyboard_commits lost its
      assertion about where focus lands, and that "the named survivors are
      test_the_whole_flow_runs_from_the_keyboard (Back to edit) and
      test_an_approval_of_a_grid_the_store_no_longer_remembers_asks_to_verify_again (a refusal
      keeps the page), **both of which still assert the focus discipline**."

      The first does: tests/test_puzzle_editor_ui.py:1479 asserts
      `document.activeElement.id == "puzzle-editor-save"` after Back to edit.

      The second does not. tests/test_puzzle_editor_ui.py:1379-1406 contains no read of
      activeElement at all — it asserts the sentence, the absence of "not known", the withdrawn
      offer and the store. It is a survivor for "a refusal keeps the page"; it is not a survivor
      for the focus discipline, which is the thing it is named as surviving.

      What that leaves unpinned is concrete: the diff restructured onApprove so that `save.focus()`
      now runs only in the refusal branch (:495, previously unconditional at the end of the
      function). Remove that line and no test in the suite fails — the one test that used to read
      focus after an approve is the one whose assertion was retired, and its replacement reads
      `browser_page.url` instead (:1500).

      This is the board's recurring defect family rather than a new one: a claim whose cited
      evidence does not carry it (wave 46's through-line, three cards). It is filed at Important
      because the claim is in the artifact that will be read at merge, and because the G-3 /
      CARD-211 discipline it invokes — keyboard focus is never dropped mid-flow — is the reason
      the aria-disabled pattern exists on this bar at all.
    suggestion: |
      Add one line to tests/test_puzzle_editor_ui.py:1406, inside
      test_an_approval_of_a_grid_the_store_no_longer_remembers_asks_to_verify_again:

          assert browser_page.evaluate("() => document.activeElement.id") == "puzzle-editor-save"

      Why this closes the hole rather than restating it: the test already drives a refused Approve
      and stays on the page, which is exactly the branch that owns the surviving `save.focus()`
      call (:495). With the assertion present, deleting that line fails this test, so the card's
      sentence becomes true of both named survivors instead of one.

      The weaker alternative — correcting the card note to name only
      test_the_whole_flow_runs_from_the_keyboard and stating plainly that the refused-approve focus
      hop is unpinned — makes the claim honest but leaves the behaviour unverified. Prefer the
      assertion; it is one line and it is cheaper than the note.
