findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 502
    title: "A stroke made while the store is deciding is destroyed by Approve's new exit, with no question asked"
    description: |
      AC-2's principle is "confirm before leaving only when there is something to lose", and the
      page latches exactly that fact (`boardChanged`, set in onBoardChange at :554). The exit AC-5
      adds does not consult it, and there is one reachable sequence where that loses work:

        1. Approve is pressed. onApprove: turn += 1, inFlightIs("approve"),
           tell("Storing this grid...") — offer withdrawn, decide hidden (:477-481).
        2. The owner paints a cell. solver.js commits and dispatches BOARD_CHANGE (solver.js:782,
           the single dispatch site). onBoardChange sets boardChanged = true and then returns
           early *by design* — `if (inFlight === "approve") return;` (:558) — so the stroke is
           deliberately not spoken about, to keep the store's word last.
        3. The store answers 200/ok. tell(storedText(...)) then
           `window.location.assign(THE_LIST)` (:501-502), unconditionally.

      The stroke from step 2 is gone: the editor keeps no localStorage of its own
      (TestPuzzleEditor_ThePlayerIsNotRegressed::test_the_editor_writes_nothing_into_the_players_save),
      so the board dies with the document. Nothing asked, nothing said.

      Before this card the same sequence was safe: the page stayed, the stroke was still on the
      board, and storedText's old tail said "Your board is untouched — go on editing and press Save
      again to change it further." The implementation noticed that sentence had become false (the
      card's own note records replacing it) without noticing the work it described is now destroyed.

      No test covers it, before or after: the suite's only approve-race test is
      test_approve_sends_the_graded_grid_and_never_re_reads_the_board, which paints *before*
      Approve, and _SAVE_THEN_PAINT only races a verify.

      Window: between the Approve click and the response — the one moment the owner's hand has
      just left the mouse on that button. Narrow, not unreachable, and silent when it fires.
    suggestion: |
      Reuse mechanism 2 rather than adding a second notion of "changed" — capture the turn at
      approve time and make only the navigation conditional on it:

          const mine = (turn += 1);          // :477, instead of a bare turn += 1
          ...
          tell(storedText(body.puzzle));     // told whatever happens, unchanged
          if (mine !== turn) return;         // the board moved while the store wrote: stay
          window.location.assign(THE_LIST);

      Why this closes the hole: every path that can lose the stroke runs through onBoardChange,
      which already advances `turn` before its early return at :558, so `mine !== turn` is true
      for exactly the sequence above and false otherwise. It keeps the store's answer told first
      (AC-7's reason), keeps `tell` the single writer (G-2 — this adds no writer, only a branch
      after one), and adds no comparison of board against stored grid (the duplicate AC-2's test
      docstring explicitly rejects).

      One consequence to carry with it, stated rather than glossed: storedText's new tail
      "Showing the puzzle list, ..." becomes false on the staying branch, so that sentence has to
      split in two (one for the exit, one for "stored, and the stroke you made since is still on
      the board"). Both are still written by `tell`, so G-2 holds; AC-4's corpus test picks the
      new sentence up automatically (it calls storedText over the grade corpus).

      Residual uncertainty, declared: this narrows AC-5's literal "*then* the store holds the new
      grid **and** the browser is on /puzzles" to the settled case. AC-5's own test seeds no
      stroke and still passes, as do the eight retargeted tests, but whether the owner prefers
      "stay and say so" or "ask before leaving" here is their call, not the reviewer's — the
      finding is that today it neither stays nor asks.
    confidence: high
