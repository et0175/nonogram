  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 498
    title: "\"never traded for the navigation\" is wider than its mechanism: the store's success sentence is unobservable"
    description: |
      :498-502 claims: "The store said yes. Its answer is told first — it is told whatever happens,
      and the exit comes after it, so the one report of what the store did is never traded for the
      navigation." The DOM write happens, but `window.location.assign` runs synchronously in the
      same task, so neither a reader nor a screen reader ever observes the sentence: a
      `role="status"` live region announces at the next rendering opportunity, which this page does
      not reach. `/puzzles` carries no flash message either, so the success report exists only as
      an unobserved DOM mutation.

      The evidence confirms rather than contradicts this: the only test that reads the sentence
      (test_a_second_approve_pressed_in_flight_is_not_sent_either) can read it solely because
      `_stay_on_the_editor` suppresses the navigation with a 204 — i.e. the sentence is readable
      exactly when the production behaviour is switched off.

      This is not an AC failure (AC-5 asks for the exit, and the refusal paths — where the report
      actually matters — all keep the page via `save.focus(); return;` at :495). It is a comment
      asserting a property the mechanism does not deliver, which is the house rule's definition of
      a finding. The new storedText tail ("Showing the puzzle list, where this puzzle's picture is
      the grid that was just stored.") is prose nobody can read.
    suggestion: |
      Narrow the claim to what the code does: the answer is *told* before the exit, and it is the
      refusal answers that are read on this bar, the success answer being reported by the list the
      owner lands on (the row's new picture — which AC-6 makes true). That is accurate and still
      explains why the tell() comes first.

      F-001's remedy also makes the sentence readable on the one path where staying is correct, so
      fixing F-001 first and then rewording this comment is the cheaper order. I am not claiming
      the reword alone improves behaviour — it only stops the file promising something it does not
      do.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

