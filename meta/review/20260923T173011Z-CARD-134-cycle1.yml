    type: gap
    file: tests/test_book_export_interior_cover.py
    line: 640
    title: "Finalise's displayed page count is now re-derived with the function under test"
    description: |
      `test_finalise_shows_that_bound_on_the_downloaded_interior` asserts
      `f"~{interior_page_count(puzzle_count)}</dd>" in body`. The expected value
      comes from `interior_page_count` itself — the same function `app.py:3323`
      calls to produce the string being matched — so that assertion holds for any
      arithmetic the function returns. Before this diff the same assertion read
      `f"~{pages}</dd>" in body`, where `pages` was the written PDF's real page
      count: an independent number.

      This matters because the single-argument path lost its only exact pin in
      the same edit: `test_the_plan_matches_the_written_interior` now pins the
      three-argument form (`interior_page_count(n, n, answer_pages) == written`)
      and the single-argument form only as `>= written`
      (`test_the_plan_called_with_the_count_alone_bounds_the_file:627`, and
      `:641` here). Grep over src/ and tests/ finds no assertion anywhere that
      `interior_page_count(n)` equals `2n + 2`. The dangerous direction (a stated
      count BELOW the file's) is still guarded by the two `>=` assertions, so this
      is a test-quality regression rather than a correctness hole — but it is
      exactly the "re-derive the expected value with the function you are testing"
      that CLAUDE.md names, on the one screen a wrong number costs money.
    suggestion: |
      Use the module's own independent helper, already defined at line 35:

          assert f"~{_interior_pages(puzzle_count, puzzle_count)}</dd>" in body

      (the un-paired, un-packed plan: one puzzle page and one answer page each).
      Keep the two `>=` assertions and the `pages == _interior_pages(...)` line as
      they are.
