    category: tech-debt
    type: risk
    file: tests/test_book_pdf_band.py
    line: 225
    title: "answer_page_number() still encodes one-answer-page-per-puzzle"
    description: |
      `answer_page_number(index, count) = 3 + count + index` is the pre-FR-042
      formula: it maps puzzle index -> answer page assuming one answer page per
      puzzle. Its two surviving call sites are correct only by coincidence — the
      one-puzzle book and the three-puzzle/three-tier book each happen to have
      exactly `count` answer pages (one per level). Any future book added to this
      module with two same-tier puzzles would silently address the wrong page.
    suggestion: |
      Rename to something that states the assumption (e.g.
      `answer_page_number(offset, puzzle_pages)`) or take the answer-page count
      explicitly, so the coincidence is written down rather than relied on.
