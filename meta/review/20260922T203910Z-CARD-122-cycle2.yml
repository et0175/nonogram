findings:
  - id: F-001
    severity: critical
    category: feature
    type: bug
    file: src/nonogram/admin/app.py
    line: 2556
    title: "Tier-then-shorter-side sort is applied per page, not per tab — the tab's order restarts at easy on every page"
    description: |
      The card's "What to implement" item 4 and AC-215 declare one order for a tab:
      tier (easy, medium, hard), then shorter side ascending. The route gets that order
      from `sorted(..., key=_tab_order)` in Python, applied to `result.puzzles` — the
      rows the store already sliced with LIMIT/OFFSET. The slice itself is taken in the
      store's default order (`sort_by="batch_id,-size,quality"`), so each page is an
      arbitrary subset of the tab re-sorted in isolation.

      Measured on this head (60 members of the 21-25 tab, page size _SELECT_PAGE=50):
        page 1 tiers: easy x17, medium x16, hard x17
        page 2 tiers: easy x3,  medium x4,  hard x3
        globally sorted by tier? False
      Page 2 restarts at easy. On the owner's real corpus, F-001 of cycle 1 measured
      36 / 85 / 135 / 185 available puzzles per bucket, so three of the four tabs are
      multi-page at 50/page and the declared order is wrong on all three.

      This is the same root cause as cycle-1's F-001 (an operation applied after the
      store's slice), moved from the filter to the sort — and it is invisible to the
      tests for the same reason F-003 named: TestBookSelect_TabSortsByTierThenShorterSide
      builds 4 puzzles, which fit on one page, and
      test_PropertyTest_LongestSideBuckets_PartitionEveryExtent asserts membership only,
      never order.
    suggestion: |
      Push the order into the store query so LIMIT/OFFSET page the tab in the card's
      order — e.g. a named `sort_by` value the store maps to a tier-rank CASE
      (easy < medium < hard, ungraded last), then `min(width, height)` (a CASE mirroring
      the existing `longest` CASE), then id. That is the same additive change to
      puzzle_review.py the card already took a scope exception for, and it lets
      `_tab_order` stay as the route-level cross-check the way `_is_in_tab` does.
      Add a case whose corpus outgrows one page (MORE_THAN_A_PAGE is already in the
      test file) asserting the order across `panel.pages_of(...)`, not within a page.
    confidence: high
    source: static
    violates: AC-215
    root_cause: RC-1
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/book_select_puzzles.html
    line: 30
    title: "Applying a filter is a GET and silently drops the ticks made on the current page"
    description: |
      The Filters card is a separate `method="GET"` form. Pressing Apply navigates away
      without POSTing the step's own form, so the tiles ticked since the page loaded are
      never folded into the kept selection and are lost with no message — while the page
      itself tells the owner "Ticks are kept as you move" under the pagination control.
      The already-kept set survives (it is server-side), so the loss is bounded to the
      current page's unsaved ticks, and it is not a regression: before this card a filter
      change lost the whole selection. Noted, not gating.
    suggestion: |
      Either make the filter controls submit the step's own form with a
      `name="go_filter"` submit button (the same fold-then-redirect path as go_bucket /
      go_offset), or state on the filter card that ticks are applied when a tab or page
      control is pressed.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

