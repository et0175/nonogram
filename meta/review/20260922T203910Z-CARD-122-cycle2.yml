  - id: F-007
    severity: info
    category: tech-debt
    type: question
    file: src/nonogram/admin/app.py
    line: 2340
    title: "[deferred from cycle 1] N+1 in _selected_cells — the skip argument is legitimate"
    description: |
      Judged as asked: the skip is legitimate. `_selected_cells` reads the authoritative
      `book.puzzle_ids` and resolves each id with `puzzle_review.get_puzzle`, one store
      call (one DB session in DB mode) per member. Replacing it with
      `filter_puzzles(PuzzleFilter(book_id=...))` would move the figures onto the
      `puzzles.book_id` mirror, which `BookManager._mirror_onto_puzzles` writes only when
      the manager was given a puzzle store (book_manager.py:994 logs and returns when it
      was not) — so planned-vs-selected would silently depend on whether the mirror exists.
      That is a correctness change dressed as a performance one, and the card is right to
      refuse it.
      The cost is real but bounded: 150 lookups per render at DEFAULT_PLAN, on a
      single-user loopback tool. The proper fix is a bulk `get_puzzles(ids)` on the store;
      a follow-up card, not this one.
    suggestion: |
      Open a follow-up card for a bulk `PuzzleReviewService.get_puzzles(ids)` and switch
      `_selected_cells` to it.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
