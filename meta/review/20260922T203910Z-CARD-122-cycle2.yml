  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/book_select_puzzles.html
    line: 92
    title: "role=\"tab\" tablist without roving tabindex or arrow-key navigation"
    description: |
      The tab strip declares `role="tablist"` with four `role="tab"` submit buttons,
      `aria-selected` and `aria-controls`. That satisfies axe's required-attr/required-parent
      rules and every tab is keyboard-reachable (they are real buttons), so the card's
      stated a11y minimum is met. But the WAI-ARIA tabs pattern a screen-reader user is
      told to expect from `role="tablist"` also includes roving `tabindex` and Left/Right
      arrow navigation, neither of which is implemented — declaring the role promises an
      interaction model the widget does not have. The `role="tabpanel"` element carries
      `aria-label` rather than `aria-labelledby` pointing at the current tab.
    suggestion: |
      Either implement roving tabindex + arrow keys, or drop `role="tablist"`/`role="tab"`
      and keep the strip as a plain group of buttons with `aria-pressed`/`aria-current`
      semantics that match what the controls actually do.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2246
    title: "_pending_selections is mutated without a lock under Flask's threaded dev server"
    description: |
      `_pending_selections` is a plain `OrderedDict` read and written on the request path
      (`move_to_end`, `__setitem__`, `popitem(last=False)`, `pop`). Werkzeug's dev server
      is threaded by default, so two concurrent requests (two browser tabs, or a page that
      fires a second request while the first is in flight) interleave these. The blast
      radius is small — the worst realistic outcome is one session's pending ticks being
      evicted a request early — and nothing committed is at risk, but the map is shared
      mutable state with no guard and the card's note does not mention it.
    suggestion: |
      Wrap the three mutating operations in a module-level `threading.Lock()`, or note in
      the docstring that single-threaded loopback use is the assumption.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/puzzle_review.py
    line: 775
    title: "bucket_of's \"both sides inside MIN..MAX\" clause is now restated in three places"
    description: |
      G-1 holds — the (low, high) thresholds come only from `book_plan`'s bucket and
      nowhere else, and there is no second threshold table. But the *other* half of
      `bucket_of`'s contract (a row with a side outside MIN_SIZE..MAX_SIZE belongs to no
      bucket) is now written three times: in `book_plan.bucket_of`, in the in-memory
      branch of `filter_puzzles`, and in the DB branch's
      `Puzzle.width.between(MIN_SIZE, MAX_SIZE), Puzzle.height.between(...)`. They agree
      today — verified by reading and by test_PropertyTest_LongestSideBuckets_PartitionEveryExtent
      over all 441 extents plus `_is_in_tab`'s render-time re-check — but a change to that
      clause in book_plan would now have to be made in three files to stay true.
    suggestion: |
      Note it in book_plan's docstring as the contract the store's pushdown must mirror, or
      expose the (low, high, in-range) triple from book_plan so the store takes all of it
      from one place.
    confidence: high
    source: model
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
