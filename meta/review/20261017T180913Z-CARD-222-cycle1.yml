findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/export/layout.py
    line: 1287
    title: "The footer hairline's new exemption and its control are written against a retired ADR-0037/R2"
    description: |
      ADR-0037/R2 was amended on `main` on 2026-10-17 (commit db04c23, the same
      architect-station pass that lowered NFR-008's floor to 4.75 mm — which this
      card does propagate). The amended rule sets the thin minimum at **2 device
      pixels = 0.1693 mm**, not 0.25 mm (meta/architecture/decisions/adr/0037-*.md,
      `## Rules` and the 2026-10-17 History entry: "0.48 / 1.28 / 2.08 pt =
      0.1693 / 0.4516 / 0.7338 mm, rendering 2 / 5 / 9 px").

      The card's new `INTERIOR_FOOTER_RULE_PT` docstring (layout.py:1281-1295) states
      the retired figure as live and derives an exemption from it:

        "R2 binds 'every thin *grid* rule' to at least 0.25 mm (3 px); this is page
         furniture, not a grid rule, and at 0.169 mm it is deliberately under that
         minimum. The exemption is held by a control: ... TestBookPageFrame_
         TheHairlineIsNotAGridRule asserts both halves."

      Measured on this tree (independent computation, not re-derived from the
      function under test): the hairline is `_pt_to_px_at_least(0.4)` = **2 px =
      0.1693 mm**, which is *exactly* the amended minimum, not under it. So the
      exemption the docstring declares does not exist, and the control that ADR-0039/R3
      requires for it is guarding a threshold the registry retired.

      The control itself (tests/test_book_page_frame.py:957-965) asserts:

        assert frame.footer_rule.width < layout.thin_rule        # 2 < 3 today
        assert layout.thin_rule / DPI * 25.4 >= 0.25             # 0.254 >= 0.25 today
        assert frame.footer_rule.width / DPI * 25.4 < 0.25       # 0.1693 < 0.25

      It passes today only because `BOOK1_PROFILE.min_thin_rule_mm` is still the
      retired 0.25 (measured: thin = 3 px = 0.254 mm). Concrete failure scenario:
      when amended R2 is implemented — the three-weight grid at 0.48/1.28/2.08 pt →
      2/5/9 px — `layout.thin_rule` becomes 2 px and **two of the three assertions
      red**: `2 < 2` is false and `0.1693 >= 0.25` is false. Worse than the red
      itself, the test is framed as R2's exemption control, so it will read as a
      regression in CARD-227's work while actually asserting a property amended R2
      makes unsatisfiable: a hairline lighter than a grid rule that is itself at the
      2 px floor.

      Scope note, because this is the obvious dismissal: the two lines carrying the
      retired figure (layout.py:1287, 1292) are **added by this diff**, verified with
      `git diff -U0`. The pre-existing restatements (layout.py:467/739/1846/2151,
      book_page_spec.py:25, book_proof.py:4,7) are the same known backlog class as
      the 4.8 mm test-file naming and are listed separately as out-of-scope.
    suggestion: |
      Two edits, both local:
      1. layout.py:1281-1295 — restate against amended R2: the hairline is 2 px,
         which is R2's own thin minimum, so it needs no exemption at all. What it
         *is* is lighter than the book's **current** thin grid rule (3 px, because
         min_thin_rule_mm is still 0.25) — a property of today's profile, not of R2.
      2. tests/test_book_page_frame.py:957-965 — either retarget the control to
         amended R2 (`frame.footer_rule.width >= 2` and the grid's thin rule
         >= 2 px), or keep the "lighter than the grid rule" claim and mark it
         explicitly as a property of the un-amended profile that CARD-227's landing
         is expected to change, so the future red is not read as a regression.
      Either way the exemption framing should go: there is nothing to exempt.
    confidence: high
    source: model
    violates: ADR-0039/R3
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_book_guide_page_type.py
    line: 605
    title: "The bare_level-2 exemption lost its page gate and bounds its magnitude but not its count"
    description: |
      `assert_bottom_fits_or_is_the_known_bare_level_2_gap` changed its predicate from
      `page_number == 1 and height_cm < CEILING` to `height_cm < CEILING`, and both
      bounds widened: ceiling 12.0 → 12.5 cm, overflow 130 → 150 px. The disclosure
      is thorough and the magnitude is bounded. What is **not** asserted is the set:
      the docstring states "six of this corpus's 48 cases overflow now rather than
      four, by between 6 and 140 px" and no assertion counts them.

      Concrete failure scenario: a later change that makes the 10 cm trim's page 2
      overflow 56 → 149 px, or that makes one of the currently-clean sub-12.5 cm
      corpus cases overflow by 100 px, passes green. The sibling residue control
      added in this same diff does bound its set
      (tests/test_book_guide_page.py: `assert len(flush) <= 6` with "a seventh fails
      here"), so the asymmetry is within the card's own standard.

      Reach, measured rather than assumed: the helper has exactly two call sites
      (lines 715 and 776) and they pass page 1 and page 2 only, so dropping the page
      gate widens the exemption to page 2 of the min trim and nothing else. Corpus
      heights are `uniform(10.0, 48.0)` rounded to 2 dp over 47 random cases plus one
      pinned 10×10, so roughly four cases sit below the 12.5 cm ceiling. That is why
      this is a control gap rather than a live defect, and why it is Minor.
    suggestion: |
      Add a count bound alongside the magnitude bound, in the shape the guide-page
      test uses: collect the overflowing cases in
      `test_the_whole_corpus_of_trims_and_counts_fits` and assert the set (or its
      size) equals today's measured six, with the message naming what a seventh
      means. Optionally keep a page-level bound too: assert no page above 2 ever
      takes the exemption, so the dropped `page_number == 1` gate cannot silently
      cover a third page kind if a caller is added.
    confidence: high
    source: static
    violates: ADR-0039/R3
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

