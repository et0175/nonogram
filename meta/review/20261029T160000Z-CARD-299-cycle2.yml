      AC-1's second mutant is NOT lost: the real control is cycle 1's M-1
      (deleting `_draw_page_frame`'s size-label `draw.text` reds
      TestInteriorType_EveryFaceHoldsTheFloor::test_the_recording_covers_every_kind_of_interior_lettering[book1]
      while the floor assertion stays green), and `_draw_page_frame` is
