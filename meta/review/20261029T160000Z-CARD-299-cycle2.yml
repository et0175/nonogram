findings:
  - id: F-201
    severity: medium
    category: tech-debt
    type: issue
    gating: false
    file: tests/test_book_interior_type_floor.py
    line: 453
    title: "`called_names` reads each authority only at its own surface, and the spy control cannot detect a vector-side indirection"
    description: |
      `called_names(source)` walks one source with `ast` and collects the names
      of its `Call` nodes. For a per-kind MODULE authority that reads the whole
      file, so intra-module indirection is covered. It does NOT follow calls
      into other modules, and for the `BookPDFGenerator.vector_<kind>_page`
      authority it reads only `inspect.getsource(writer)` -- one method body.

      So a future vector writer that reached its clue digits through a wrapper
      in another module (say `book_vector_draw.draw_grid_with_clues`, or a
      shared `book_vector.py` helper) would make `draws_clue_digits` return
      False, `CLUE_DIGIT_KINDS` lose that kind, and `stream_faces` READ the page
      -- which is exactly cycle 1's F-001 failure mode, one level down.

      The reason this is worth stating rather than filing as theory is that the
      independent control CANNOT catch it. The spy reading is taken on the
      RASTER medium (live `ImageDraw.text` calls joined to each page's
      `PageKind`), so a vector-side indirection leaves it saying
      `{answer, puzzle}` while the AST side also says `{answer, puzzle}` for the
      wrong reason. The two readings would AGREE and both be wrong. M4 reds
      because a deletion removes the kind from ONE side only.

      MEASURED, no live instance: `grep -rn draw_clue_digits src/` gives exactly
      four lines -- the definition at book_vector_draw.py:513, its `__all__`
      entry at :74, and two DIRECT call sites, book_answer_vector.py:403 and
      book_puzzle_vector.py:211. Nothing inside `book_vector_draw.py` calls it,
      so there is no indirection path today and the derivation is complete as
      it stands.
    reproduction: >-
      `ast` probe over all seven PageKind values printing
      `called_names(source) & CLUE_DIGIT_DRAWERS` per authority source
      (run with `python -I` against the worktree); plus
      `grep -rn "draw_clue_digits" src/`.
    recommendation: >-
      Either resolve one level of indirection (walk the called helpers' sources
      when they live in the same package), or -- cheaper and in this file's
      spirit -- add a control that reds when a clue-digit drawer gains a caller
      the derivation cannot see: assert that every `src/` line calling a
      CLUE_DIGIT_DRAWERS name lies in a file `vector_writer_sources` returns for
      some kind. That turns an invisible indirection into a failure, which is
      what ADR-0039/R2 asks. CARD-314 is the natural owner, since it is already
      changing how a vector page marks its clue digits.
    confidence: high
    source: measured

  - id: F-202
    severity: low
    category: tech-debt
    type: issue
    gating: false
    file: tests/test_book_interior_type_floor.py
    line: 428
    title: "The two authorities are a naming convention, so CARD-231 can write a correct vector divider that still reds"
    description: |
      `vector_writer_sources(kind)` looks for exactly
      `src/nonogram/admin/book_<kind>_vector.py` and
      `BookPDFGenerator.vector_<kind>_page`. That is a convention the four
      existing writers happen to follow, not an enumeration of a registry.

      CARD-231 makes the divider born vector. If it writes that page from
      `book_vector.py`, or as `BookPDFGenerator.vector_divider_opener`, or by
      rewriting `create_divider_page` to emit a ContentStream, the page
      classifies VECTOR, `vector_writer_sources("divider")` is still `{}`, and
      `stream_faces` fails with "no vector writer for that kind" on correct
      work.

      This is NOT a wrong outcome -- the failure is loud, it fires only once the
      page really is operators (`page_media` requires a `/Font` and no
      `/XObject`, tests/helpers/pdf_vector.py:104-105, so it cannot fire before
      the writer exists), and the message already says "the card that wrote that
      page owes this file its writer's name", which invites registering a new
      name rather than demanding a filename. It is a handoff cost, recorded so
      CARD-231's round reads it as expected rather than as a regression.
    reproduction: >-
      `tests/test_book_interior_type_floor.py::TestInteriorType_TheStreamArmIsReached::test_a_page_kind_with_no_vector_writer_is_a_failure_not_a_pass`
      is the cell that pins the behaviour; `assert vector_writer_sources("divider") == {}`
      at :1092 is its premise, re-derived by listing
      `src/nonogram/admin/*vector*.py` (no book_divider_vector.py) and
      `grep "def vector_" src/nonogram/admin/book_pdf_generator.py`
      (vector_title_page, vector_puzzle_page, vector_two_up_page,
      vector_puzzle_pages -- no vector_divider_page).
    recommendation: >-
      Add one line to CARD-231's revision section: this file's
      `vector_writer_sources` must learn the divider's writer by name, or the
      divider must be added to a declared-exempt set, in the same commit that
      makes the page vector. One sentence on the receiving card costs less than
      a round.
    confidence: high
    source: measured

  - id: F-203
    severity: low
    category: test-quality
    type: issue
    gating: false
    file: tests/test_book_interior_type_floor.py
    line: 1188
    title: "The SEMANTIC half of the non-vacuity mutant pair is still the tautology cycle 1 noted in passing -- F-004's named cell was fixed, its sibling was not"
    description: |
      `test_dropping_a_semantic_kind_reds_the_coverage_assertion` filters
      `call.kind != "band"` out of the recording, builds `kinds` from what is
      left, then asserts `"band" not in kinds` and
      `not {"guide","divider","band"} <= kinds`. Both are true by construction
      of the filter, for any recording whatsoever. MEASURED by `ast` over the
      cell: its only call into the module under test is `recording`, and the
      conclusion uses nothing the module computes.

      Cycle 1 flagged this cell as "weaker than it reads for the same reason" as
      F-004 while naming the page-kind cell as F-004's subject. The fix round
      rewrote the named cell (M3 proves it) and left this one unchanged -- the
