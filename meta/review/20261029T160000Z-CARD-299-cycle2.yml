    test_the_refused_kinds_are_derived_and_agree_with_the_spy (:1097) calls
    `recording` and `_pages_by_kind`.

answers_to_the_brief:
  1_is_the_refusal_set_genuinely_derived: >-
    YES, genuinely derived -- and M4 is the proof, not the prose. Deleting ONE
    call line in `src/nonogram/admin/book_answer_vector.py` moves
    `CLUE_DIGIT_KINDS` from `{answer, puzzle}` to `{puzzle}` and reds two cells.
    A list with a derivation bolted on cannot do that.

    THE AST-OVER-TEXT JUSTIFICATION REPRODUCES EXACTLY, and it is the load-
    bearing claim. I ran both readings side by side over all seven page kinds.
    For `guide`: the AST reading of `book_guide_vector.py` finds NO clue-digit
    drawer, while a text search over the same file finds `_draw_clues` AND
    `_write_clues` -- at :236, :241 and :676, all three inside `#:` comment
    blocks and one docstring, never a call. So a text-derived
    `CLUE_DIGIT_KINDS` would have contained `guide`, and `stream_faces` would
    have REFUSED the guide page -- the one page whose worked example the file's
    own `book_guide_vector.py:234-248` says is *"NOT exempt from CON-020's
    floor"* (CARD-296 AC-5). The mechanism's justification is real.

    THE TWO AUTHORITIES ARE COMPLETE TODAY, and I checked rather than assumed.
    `vector_writer_sources` reads `src/nonogram/admin/book_<kind>_vector.py` and
    `BookPDFGenerator.vector_<kind>_page`. Measured against `PageKind`'s seven
    members: cover {} , title {vector_title_page}, guide {book_guide_vector.py},
    toc {book_toc_vector.py}, divider {}, puzzle {book_puzzle_vector.py,
    vector_puzzle_page}, answer {book_answer_vector.py}. The vector-writing
    modules on disk are exactly `book_answer_vector`, `book_guide_vector`,
    `book_puzzle_vector`, `book_toc_vector` (plus `book_vector.py`, the generic
    page writer, and `book_vector_draw.py`, the primitives -- neither a per-kind
    writer), and the only `vector_*` methods on the generator are
    `vector_title_page` :5053, `vector_puzzle_page` :5601, `vector_two_up_page`
    :5647 and `vector_puzzle_pages` :5675. The last two are NOT matched by the
    `vector_<kind>_page` convention, but neither costs a kind its coverage
    (`puzzle` is already covered twice). **No vector writer lives anywhere the
    pair cannot see, and I found none.** And the direction of any miss is safe:
    a kind the pair cannot find is a FAILURE, not a silent pass.

    `CLUE_DIGIT_DRAWERS` IS HAND-WRITTEN IN ITS LOAD-BEARING HALF, and it has a
    control. It is `{_draw_clues, _write_clues}` (from CON-020's own
    EXEMPT_CALLERS) plus the literal `"draw_clue_digits"`. Measured: the
    EXEMPT_CALLERS half contributes NOTHING to the AST reading -- I recomputed
    the derivation with `{"draw_clue_digits"}` as the sole seed and got the
    identical per-kind result for all seven kinds. So the whole derivation rests
    on one hand-written string. Its control is
    `assert hasattr(book_vector_draw, "draw_clue_digits")` inside
    test_the_refused_kinds_are_derived_and_agree_with_the_spy, which reds on a
    rename rather than letting the reading empty silently -- exactly what
    ADR-0039/R2 asks of a seed. Adequate, and improvable: see F-204.
  2_is_the_spy_control_genuinely_independent: >-
    YES in the half that matters, and the measurement is the reason. The two
    readings share the `EXEMPT_CALLERS` constant as a seed, which looks like
    shared code -- but I measured that the shared seed is INERT on the AST side
    (identical result with `draw_clue_digits` alone). So in practice the AST
    reading is driven entirely by the VECTOR drawer name `draw_clue_digits`
    found in `src/` by `ast`, and the spy reading entirely by the RASTER callers
    `_write_clues` / `_draw_clues` observed on live `ImageDraw.text` calls joined
    to each page's `PageKind`. Different medium, different function names,
    different mechanism, and they agree on `{answer, puzzle}`. That agreement is
    non-trivial.

    M4 REPRODUCED: 2 cells red, named above, line count preserved 657 -> 657,
    blob asserted before/after/restored, `__pycache__` swept, PYTHONPATH asserted
    to the copy. The round's claim that "a renamed drawer empties the AST reading
    and reds there rather than quietly refusing nothing" is correct for the
    deletion case (M4) and for the rename case (the `hasattr` guard).

    THE ONE LIMIT OF THE CONTROL'S INDEPENDENCE, measured and raised as F-201:
    the spy reads the RASTER medium only, so it cannot see a VECTOR-side
    indirection. If a future vector writer reached its clue digits through a
    wrapper in another module, the AST reading would say "no" and the spy reading
    would still say `{answer, puzzle}` -- the two would AGREE and both be wrong.
    No live instance: `draw_clue_digits` has exactly two call sites in `src/`
    (book_answer_vector.py:403, book_puzzle_vector.py:211), both direct, and
    nothing inside `book_vector_draw.py` calls it.
  3_the_divider_consequence: >-
    RIGHT OUTCOME, RIGHT OWNER, AND IT REDS THE DAY CARD-231 FINISHES RATHER
    THAN THE DAY IT STARTS -- which is the question the brief asked, and the
    answer turns on `page_media`.

    Timing, measured from tests/helpers/pdf_vector.py:101-133: a page is VECTOR
    iff its resources name a `/Font` and no `/XObject`. So the no-writer assert
    in `stream_faces` can only fire once a divider page is actually EMITTED as
    operators with a face -- i.e. once CARD-231's writer exists and runs. Merely
    starting CARD-231, or removing the divider's raster declaration while the
    generator still paints a bitmap, leaves `page_media` at RASTER and the assert
    silent. So this card does not red on CARD-231's first commit.

    Right owner: `_RASTER_DECLARATIONS[PageKind.DIVIDER]` carries
    `expires_with=("CARD-231",)` and `authority="owner decision 2026-10-25,
    recorded in ADR-0042/R2"` (book_pdf_generator.py, within :594-:700), and
    CARD-231's own 2026-10-25 revision already says it is "born vector", that
    landing it "EXPIRES ADR-0042/R2's divider exception", that it must "remove
    the divider from the declared raster set", and -- at CARD-231 lines 165-168
    -- that `divider` is one of CON-020's required lettering kinds and
    "CARD-299 left it on the raster path precisely because this card had not
    run". The handoff is already written on the receiving card.

    Right outcome: a failure is correct. The alternative is to read a divider
    page whose exemption status nothing in `src/` can state, which is the silent
    pass ADR-0039/R2 forbids. And the message is actionable: it names the page
    number and kind, both conventional locations (`book_divider_vector.py`,
    `BookPDFGenerator.vector_divider_page`), the rule, and -- importantly --
    says "the card that wrote that page owes this file its writer's name",
    which invites registering a differently-named writer rather than demanding
    one of two filenames. One residual: the authority pair is a NAMING
    CONVENTION, so a CARD-231 that puts its writer in `book_vector.py` or names
    it `vector_divider_opener` reds on correct work until it edits this file.
    Loud, cheap, and signposted -- F-202, low.
  4_is_F_003_honest_and_the_partition_real: >-
    HONEST, AND THE PARTITION IS REAL.

    Honest: the round says plainly, in the `#:` block at
    tests/test_book_interior_type_floor.py:389-398, that `LETTERING_KINDS` is
    hand-written and that "there is no authority in the tree to derive 'letters
    something' from". I went looking for one rather than taking it. (a)
    `PageKind` gives the kinds but not whether they letter -- it is the authority
    for the COMPLEMENT check, and that is exactly what the round used. (b)
    Deriving "letters" from the recording would be circular: the set exists to
    stop the recording going empty, so deriving it from the recording makes the
    assertion tautological -- the vacuity trap this whole card is about. (c)
    `meta/architecture` holds no page-kind-level lettering enumeration; the files
    naming divider/guide/toc are trace.yml, handoff.md, requirements.yml, the ADR
    and raw-requirements.md, none of which states which kinds letter. (d) The
    nearest thing to an authority is a per-writer face vocabulary --
    `book_guide_vector.py` declares `FACE_KINDS` (:256) and `EXEMPT_KINDS`
    (:263) -- but it is CARD-296-local: `book_toc_vector`, `book_answer_vector`
    and `book_puzzle_vector` declare neither, and it describes faces within a
    page rather than whether a page kind letters. **So "no authority exists" is
    true as measured.** (The `FACE_KINDS` convention is a plausible future
    authority if it generalises; noted for CARD-309/312, not a finding here.)

    Real: M2 reproduced. Dropping `"toc"` reds TWO cells on the fix tree
    (test_the_lettering_kinds_partition_the_page_kinds, because `LETTERING_KINDS
    | NON_LETTERING_KINDS != {k.value for k in PageKind}`, and
    test_the_refusal_does_not_absorb_the_guide_or_the_toc) and passes SILENTLY on
    the round-1 tree (28 passed). The control also pins the two halves disjoint
    and requires every NON_LETTERING_KINDS entry to carry a non-empty reason.
    Both reasons are substantively right: `cover` is not an interior page
    (ADR-0042/R2, `expires_with=()`), and `title` is blank by AC-283.
  5_do_F_004_and_F_006_drive_the_module: >-
    F-004: YES. Verified two ways. By `ast` over the cell: it calls
    `kinds_covered_in_their_medium`, `recording` and `_pages_by_kind`, where the
    round-1 version's loop called nothing. By mutation: M3 deletes the page
    predicate inside `kinds_covered_in_their_medium` and the cell reds on the fix
    tree (1 failed) while the round-1 tree passes silently (28 passed). The drop
    really goes into the READING -- the kind's pages are removed from the spy
    recording and `stream_recording` is emptied, both through
    `pytest.MonkeyPatch.context()` on the module's own attributes -- and the
    first assertion in the loop (`dropped not in covered`) is the one that could
    not be written as set algebra.

    F-006's cover arm: BOTH HALVES, as the brief required.
    (a) It passes with `object()` as the cover, on a REAL vector page produced by
    production's own writer (the TITLE declaration lifted via
    `monkeypatch.delitem`, then `assert pdf_vector.page_media(data)[0] ==
    pdf_vector.VECTOR` before the call). A sentinel cover is the proof the arm
    never touches it.
    (b) It REDS under its own mutant: `dataclasses.replace(permanent,
    expires_with=("CARD-999",))` set into `_RASTER_DECLARATIONS[PageKind.COVER]`,
    and `pytest.raises(AssertionError, match="raster PERMANENTLY")`. The arm now
    reads the premise it argues from -- ADR-0042/R2's permanence -- rather than
    restating its own branch condition.
    (c) And I added a third half the round did not claim: M5 deletes the arm's
    assertion entirely and the cell reds, so the `pytest.raises` is not sitting
    over a different assertion. Round 1's version passed with `object()`; this
    one passes with `object()` AND fails when the premise moves. That is a whole
    fix, not half a fix.
    F-006's other two parts also landed: the two previously-undriven vector arms
    now have cells
    (test_the_guide_pages_vector_arm_fails_by_name_and_names_its_card, which
    asserts the failure NAMES CARD-309, and the cover cell above), and the
    floor's stream arm is exercised with a NON-EMPTY list in
    test_the_stream_arm_of_the_floor_judges_a_face_it_is_handed -- a 9.0 pt face
    must come out in the verdict and a face exactly at FLOOR_PT must not.
  6_r6_node_ids_and_amendments: >-
    R6 is still `check: {kind: review-lens}` (ADR line 588; the ADR's non-comment
    content is byte-identical to the cut's). Node ids 172 -> 188, removals 0, all
    four parametrised floor ids byte-identical, trace.yml out of the diff, no
    rename, the ERROR-level gate-3 hazard never armed. Amendments still owed: see
    card_amendments_owed -- five, all cheap, none gating, and two of them are
    cycle 1's that the fix round answered in the code and the ADR but not on the
    card.
  7_what_i_measured_to_be_wrong: "see corrections_to_the_record"

