    recommendation: >-
      Give it the same shape its sibling now has: drop the band's pages from the
      reading through `MonkeyPatch.context()` and ask
      `kinds_covered_in_their_medium` (or the real semantic `required <= kinds`
      assertion) again -- or delete the cell and let M-1's style carry the
