    confidence: high
    source: measured

  - id: F-204
    severity: low
    category: test-quality
    type: issue
    gating: false
    file: tests/test_book_interior_type_floor.py
    line: 420
    title: "The whole derivation rests on one hand-written string, and `book_vector_draw.__all__` is an authority sitting beside it"
    description: |
      `CLUE_DIGIT_DRAWERS` is `{name for _module, name in EXEMPT_CALLERS} |
      {"draw_clue_digits"}`. MEASURED: the EXEMPT_CALLERS half contributes
      nothing -- recomputing `draws_clue_digits` for all seven kinds with
      `{"draw_clue_digits"}` as the only seed gives the identical per-kind
      result. So `CLUE_DIGIT_KINDS`, the set this card's whole F-001 fix turns
      on, is derived through exactly one hand-written literal.

      Its control is `assert hasattr(book_vector_draw, "draw_clue_digits")`
      inside test_the_refused_kinds_are_derived_and_agree_with_the_spy, which is
      the right shape (a vanished seed is a failure, not an empty reading) and
      it does catch a rename. What it does not catch is the seed gaining a
      SIBLING -- a second vector clue-digit drawer under another name would be
      invisible, with the same consequence as F-201.

      `src/nonogram/admin/book_vector_draw.py` declares `__all__` and lists
      `"draw_clue_digits"` at :74, which is an enumerable authority for "the
      drawers this module exports".
    reproduction: >-
      Side-by-side recomputation of `draws_clue_digits` with the full seed and
      with `{"draw_clue_digits"}` alone, over `PageKind`'s seven values;
      `grep -n "draw_clue_digits" src/nonogram/admin/book_vector_draw.py`.
    recommendation: >-
      Seed from the authority instead of a literal: take the exported names in
      `book_vector_draw.__all__` whose name says clue (and assert the result is
      non-empty, so an empty match is a failure). Then a renamed OR an added
      drawer both move the derivation.
    confidence: high
    source: measured

  - id: F-205
    severity: info
    category: process
    type: issue
    gating: false
    file: meta/review/CARD-299-cycle1.yml
    line: 1
    title: "The worktree is not clean -- an untracked duplicate of cycle 1's review YAML sits under a second filename"
    description: |
      The brief states the tree is clean. `git status --porcelain` in
      /Users/omelnikova/PycharmProjects/PythonProject4-card-299 reports one
      untracked entry: `meta/review/CARD-299-cycle1.yml`, 43803 bytes, 665
      lines, byte-identical (`cmp -s`) to main's
      `meta/review/20261029T000000Z-CARD-299-cycle1.yml`.

      Because `meta/review/**` is not excluded from the validator's ref
      resolver, I measured its effect rather than assuming: with the file moved
      aside the validator still reads 0 errors / 102 warnings and the sorted
      warning set is byte-identical. It resolves nothing, and `grep` confirms it
      spells none of the three dead names as a whole token -- cycle 1's hygiene
      held.

      So this is benign today. It is recorded because a duplicate review YAML
      under a non-canonical name, if it were ever committed, would silently
