    file: src/nonogram/admin/static/admin.css
    line: 357
    title: "\"Fits a laptop screen\" is pinned to 1440x900; a 30x30 board with deep clues overflows on 1366x768"
    description: |
      The card asks the board to "fit a laptop screen" for MAX_SIZE grids. The implementation
      and test_the_largest_board_fits_a_laptop_screen choose 1440x900. On a common 1366x768
      laptop, a 30x30 board with 15-deep clues needs (30+15+1)·14px = 644px at the 14px
      floor, against 768-204 = 564px available, so the page scrolls vertically. Typical
      depth (about 8) fits: 546px. This assumption is not written down anywhere outside
      the test.
    suggestion: |
      Write the target viewport into FR-044/F12, or let the floor drop (e.g. 12px) when
      svh is small. The owner decides.
