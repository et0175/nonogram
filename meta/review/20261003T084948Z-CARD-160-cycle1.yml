findings:
  - id: F-001
    severity: high
    category: feature
    type: gap
    file: tests/test_puzzle_solver_page.py
    line: 329
    title: "Legacy 0/1 grid test cannot tell booleans from ints — surviving mutant"
    description: |
      Failure-matrix row F5 declares that a legacy 0/1 stored grid is coerced so the
      payload's `solution` is booleans. test_a_legacy_zero_one_grid_is_read_as_booleans
      asserts `payload["solution"] == AC_GRID`, but in Python `1 == True` and `0 == False`,
      so a payload of ints compares equal. Mutation M8 (app.py:5321 `"solution": grid` ->
      `"solution": puzzle.get("grid")`, shipping the raw stored 0/1 grid) SURVIVED. The
      regression is user-visible: solver.js's isSolution (solver.js:59-63) demands
      `typeof cell === "boolean"`, so a legacy row would render the danger alert instead
      of a board, with every test green.
    suggestion: |
      In that test also assert
      `all(type(cell) is bool for row in payload["solution"] for cell in row)`
      (or `json.dumps(payload["solution"]) == json.dumps(AC_GRID)`); optionally a browser
      case that a legacy row draws a board.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 1b869aa
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: high
    category: feature
    type: gap
    file: tests/test_puzzle_solver_page.py
    line: 695
    title: "No test checks that withCell returns a frozen board — surviving mutant"
    description: |
      Failure-matrix row F10 declares "boards are frozen", and solver_state.js's header
      promises immutable board values so CARD-161's undo history can be an array of boards.
      Only `createBoard`'s result is checked for freezing (test line 695).
      Mutation M6 (solver_state.js:57 returning an unfrozen `{width, height, cells}` from
      withCell) SURVIVED TestSolverStateModule, AllCellsStartUndecided and WritesNothing.
      The property test checks that the input stays unchanged, not that the output is frozen.
      Every board after the first move comes from withCell, so the declared property goes
      unverified for nearly every board CARD-161 will keep.
    suggestion: |
      In test_PropertyTest_StateModule_WithCellChangesExactlyOneCell record
      `frozen: Object.isFrozen(next) && Object.isFrozen(next.cells)` per step and assert it.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 1b869aa
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/static/solver.js
    line: 175
    title: "setBoard validates only the dimensions, not the board's cells"
    description: |
      setBoard compares width/height, then repaints from next.cells. If a board-like object
      has the right size but a short `cells` array or unknown states, every cell gets
      data-state="undefined" (drawn as bare paper) with no error. It also accepts unfrozen
      boards. CARD-161 routes all input through this one function, and the failure matrix
      has no row for it.
    suggestion: |
      Export an `isBoard(board)` predicate from solver_state.js (frozen, cells.length ===
      w*h, every state in CELL_STATES) and have setBoard throw RangeError otherwise; add
      the row to the matrix.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: 1b869aa
    dismissed_reason: null
    learned_pattern: null
