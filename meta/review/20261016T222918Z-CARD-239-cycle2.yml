  - id: F-203
    severity: medium
    category: tech-debt
    type: risk
    file: tests/test_guard_integrity.py
    line: 205
    title: "The error(...) exemption's recorded bound (G-11) is narrower than the exemption: no ArgumentParser need exist, and the exempt shape can execute"
    description: |
      The exemption fires when a call's attribute is `error` and the unparsed text of its
      receiver appears as the receiver of any `add_argument` call anywhere in the source
      (line 178-184, 205-207). The bound is recorded - sweep G-11, and the card's cycle-2
      notes - but both state it narrower than it is:

        * the card: "**not borrowable without building a real parser**";
        * the docstring line 167: "Not borrowable without actually building a parser that
          registers arguments";
        * G-11: "A source that builds a real `ArgumentParser`, registers something on it
          and then passes the option to that parser's `error` is exempt ... the exempt
          shape executes nothing: `parser.error` prints usage and exits."

      Measured against the deployed rule:
        * `maker().add_argument("--z")` + `maker().error("python r.py --check-log L")`
          -> [] MISSED. No parser is built, nothing is even the same object; the match is
             on unparsed receiver text.
        * a class with a method named `add_argument` and an `error` that calls
          `os.system(c)`, instantiated and used
          -> [] MISSED. The exempt shape executed the command.

      So "the exempt shape executes nothing" is a property of `argparse.ArgumentParser`,
      not of the exemption, which is keyed on two method *names*. The practical blast
      radius is small (it takes an object with an `add_argument`-named method and an
      executing `error`), which is why this is medium rather than high - but the recorded
      bound is wrong as stated, and the parent cycle's own rule applies: a recorded miss
      that is wider than recorded is not harmless.
    suggestion: |
      Either restate G-11 and the two docstring sentences to the exemption's actual
      shape - "an `error(...)` call whose receiver text also receives an `add_argument(...)`
      call somewhere in the same source", with no claim about parsers or about nothing
      executing - or narrow the exemption to a receiver that is demonstrably an
      `argparse.ArgumentParser` (bound from an `ArgumentParser(...)`/`add_parser(...)`
      call in the same source), which is what the reason actually relies on.
    confidence: high
    source: static
    violates: "AC-7"
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

