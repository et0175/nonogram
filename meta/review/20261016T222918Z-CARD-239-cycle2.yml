findings:
  - id: F-201
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_guard_integrity.py
    line: 187
    title: "The module-scope-binding exemption absorbs a real --check-log invocation: hoisting cycle 1's own killed mutant into a module-scope constant makes it survive"
    description: |
      `_check_log_invocations` exempts `id(node.value)` for every module-scope `ast.Assign`
      (line 186-188), unconditionally on the value. The stated reason is "a module-scope
      binding to a constant ... Prose about the option is not an invocation" (docstring
      line 171-174), repeated in the module docstring line 89 ("a module-level binding is
      not an invocation, and a rule that flagged one would flag itself") and swept PINNED
      as E-8. The reason is false whenever the bound constant is a command line that is
      then executed - which is one refactor away from the exact mutant cycle 1's F-002 was
      about.

      Measured on disk, three mutants, each in its own fresh pytest process, each restored
      from a byte copy with md5 942627df2b6df5a003bf52775ab1d398 re-verified:

        M3 (control, inline - the committed control's shape)
            `os.system("python meta/profiling/rank_durations.py --check-log PATH")`
            planted in tests/test_clues.py
          -> KILLED. test_no_guarded_source_invokes_the_check_log_subcommand red, naming
             {'tests/test_clues.py': ["os.system('python meta/profiling/rank_durations.py --check-log PATH')"]}

        M2 (the hoist - the identical command, bound first)
            `_M2_CMD = "python meta/profiling/rank_durations.py --check-log PATH"`
            at module scope, `os.system(_M2_CMD)` in a never-called function
          -> SURVIVED. 854 passed (468 guards + 386 host tests), rc=0, both guard modules green.

      Function-level, measured by calling the deployed rule directly:
        `CMD = "...--check-log..."` + `os.system(CMD)`                  -> []      MISSED
        `CMD = "...--check-log..."` + `subprocess.run(CMD, shell=True)` -> []      MISSED
        `CMD: str = "...--check-log..."` (AnnAssign)                    -> caught
        `cmd = "...--check-log..."` inside a function                   -> caught
        `CMD = f"{R} --check-log {L}"`                                  -> caught
        `ARGV = ["--check-log", "x"]` (the committed control)           -> caught

      So the hole is exactly `NAME = "<command line containing the option>"` at module
      scope - the single most idiomatic spelling in this repo (both guard modules hold
      their constants that way, and `ARGV = [...]`, a module-scope binding that IS caught,
      sits in the positive controls, which is plausibly where the false confidence came
      from). AC-6's swept claim "no test invokes the subcommand" (E-3/E-4, PINNED) and the
      rule's own first docstring line ("Every place in `source` that PASSES
      CHECK_LOG_OPTION on") are both wider than the mechanism, and the exemption is
      neither PINNED, DELETED nor RECORDED as a bound - an AC-7 failure, not only a
      defect. G-11 records the `error(...)` exemption; nothing records this one.

      This is the same family as cycle 1's F-002 and, worse, the same route: the fix
      widened the predicate to a substring match to catch the shell string, then added an
      exemption that re-opens it for the hoisted spelling.
    suggestion: |
      Not a one-liner, and the measurement says why. Narrowing the exemption to
      `node.value == CHECK_LOG_OPTION` (value equality, not mere presence) catches the
      hoist, keeps all 7 positive and all 4 negative committed controls green, and over
      the real 223-file guarded tree produces exactly one new hit:
      `SANDBOX_CONTROL_MODULE` in tests/test_suite_profile.py:4804, a module-scope constant
      holding a whole fabricated test module as source text, which mentions the option as
      prose. So the exemption does have a second real job.

      The discriminator the rule is missing is the one the sibling rule already has: does
      the bound name ever reach an executor (`os.system`, `subprocess.*`, `main(...)`)?
      `_live_log_references` answers exactly that with `_tainted_names`/`_string_values`;
      this rule reimplemented the shape and dropped the taint half. Either add it, or key
      the exemption on the value (option-exact, or multi-line source text) rather than on
      the constant's parent - and whichever is chosen, the remaining bound belongs in a
      `MEASURED_CHECK_LOG_MISSES` constant with a control, in the shape
      MEASURED_MODULE_SCOPE_MISSES already has, so the next cycle does not have to
      rediscover it.
    confidence: high
    source: static
