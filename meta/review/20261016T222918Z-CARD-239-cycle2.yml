  - id: F-205
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_guard_integrity.py
    line: 468
    title: "'No dir() is an authority for them' is false of SkipTest: dir(unittest) offers it, public and callable, under the same two filters"
    description: |
      D-10 and the comment at line 468-473 justify hand-enumerating `_NON_PYTEST_SILENCERS`
      and `_MODULE_SCOPE_SILENCING_BINDINGS` together on the grounds that "No `dir()` is an
      authority for them" / "a binding is not a call and cannot come from any namespace's
      `dir()`". Measured under this module's own two filters (public, callable):

        "SkipTest" in public-callable dir(unittest)  -> True
        "_exit"    in public-callable dir(os)        -> False  (leading underscore)

      So the justification holds for `_exit` and for all three bindings, and fails for
      `SkipTest`: `dir(unittest)` is as much an authority for it as `dir(pytest)` is for
      `pytest.skip`, and the projection-plus-audit shape the module uses one line above was
      available. The cost is that the unittest half carries no completeness audit. I looked
      for a second unittest route and found none that silences (`skip`/`skipIf`/`skipUnless`
      are decorators; `unittest.main()` raises SystemExit, which is loud), so no measurable
      miss follows - the defect is the justification, in a card whose subject is exactly
      that.
    suggestion: |
      Split the sentence: the bindings are genuinely nobody's `dir()`; `SkipTest` is
      unittest's, and is a hand-enumerated member by choice (one name, one namespace, not
      worth a second projection) rather than by necessity. Say which it is.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
