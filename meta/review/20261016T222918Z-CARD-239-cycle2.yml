  - id: F-202
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 491
    title: "__test__ = False silences a guarded module with a green session; it is a module-scope binding, and it is in neither _MODULE_SCOPE_SILENCING_BINDINGS nor MEASURED_MODULE_SCOPE_MISSES"
    description: |
      `_MODULE_SCOPE_SILENCING_BINDINGS` holds `pytestmark`, `collect_ignore`,
      `collect_ignore_glob` - "a name whose mere assignment at module scope changes what
      pytest collects" (line 486-490). `__test__ = False` is precisely that and is absent,
      and `MEASURED_MODULE_SCOPE_MISSES` does not disclose it either, so D-10 ("the routes
      that are not pytest's are explicit members") plus D-11 ("what is left over is named,
      not implied to be covered") together claim a leftover of exactly two routes that is
      not the leftover. Both sweep rows are PINNED/RECORDED.

      Measured, pytest 9.1.1:
        * standalone module carrying `__test__ = False` and two failing tests
          -> "collected 0 items", "no tests ran in 0.05s", rc=5.
        * the same module beside one other module with a passing test
          -> "1 passed in 0.03s", rc=0. The two failures are gone and the session is green.
        * planted in tests/test_clues.py (mutant M1, fresh process, file restored from a
          byte copy, md5 942627df2b6df5a003bf52775ab1d398 re-verified)
          -> SURVIVED: 468 passed instead of 854. All 386 tests in that module vanished,
             both guard modules green, rc=0.

      That is the F-308 verdict in its quietest form - quieter than the enumerated
      `collect_ignore` (which only works in conftest.py, measured: in a test module the
      victim is still collected and still fails) and quieter than `raise
      unittest.SkipTest` (which at least prints "1 skipped"). `__test__ = False` prints
      nothing at all, and it works in any test module.

      The rule's own standard forecloses the "nobody writes that" defence: it reports
      `importorskip` and `xfail` with the comment "Not a spelling anyone in this tree
      writes, and reported anyway". No `__test__` binding exists in the guarded tree today
      (grep over 223 files), so this is a hole in the rule and in its disclosed bound, not
      a live violation.
    suggestion: |
      Add `__test__` to `_MODULE_SCOPE_SILENCING_BINDINGS` with the measured reason
      (rc=0, no output, the victim module's tests simply absent) and a control in
      MODULE_SCOPE_SILENCES - the existing
      test_every_binding_it_names_has_a_control / test_the_control_for_each_binding_depends_on_the_set
      pair then covers it with no new machinery. A binding of `__test__` to anything other
      than a true literal is the shape to report.

      The deeper issue is that the binding half has no completeness audit at all and is
      justified by "no dir() is an authority for them". For the bindings that is true, and
      it is precisely why that half needs a substitute for the audit the derived half
      gets - pytest's own documented module-level attributes (`pytestmark`, `__test__`,
      `collect_ignore*`, `collect_ignore_glob`) are a short, enumerable, citable list;
      checking the enumeration against the installed pytest's documentation or against
      `_pytest`'s own references would restore a falsifiable completeness claim.
    confidence: high
    source: static
