    description: |
      Both recorded misses are genuinely open, verified by calling the rule directly
      (local-helper indirection -> [], alias -> []), and the bound is red the day the rule
      grows past either, since the assertion is `== []`. Two refinements:

        * entry 1 is "a module-scope call into a **local** helper that skips", and G-8
          repeats "local". An *imported* helper is also missed
          (`from tests.helpers.bail import bail` / `bail()` -> []) and is a different,
          wider route: the rule cannot descend into a body it cannot see, so the stated
          reason ("the rule does not descend into function bodies") does not cover it.
        * further unreported module-scope routes, measured, none disclosed:
            `globals()["pytestmark"] = pytest.mark.skipif(...)`  -> []
            `getattr(pytest, "skip")("x", allow_module_level=True)` -> []
            `raise SystemExit(0)`                                -> []
          The last is an exact alias of an enumerated member - the rule reports
          `sys.exit(0)` (and its own comment calls that "the loudest version of the hole
          this module exists to close"), and `raise SystemExit(0)` is the same statement
          spelled differently. Measured: INTERNALERROR, rc=3, so it is loud and low-stakes;
          the first two are quiet but exotic.

      Clustered under F-202: one cause, several symptoms.
    suggestion: |
      Widen entry 1's wording to "a module-scope call into a helper that skips, local or
      imported", and add the three routes above to MEASURED_MODULE_SCOPE_MISSES (each is one
      line and the existing parametrised test covers them for free), or report
