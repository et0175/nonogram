  - id: F-006
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_db_engine_lifecycle.py
    line: 887
    title: "AC-2's pointer arm is a substring test that no deletion or rotting of the pointer can fail - it is held up by a method name in the Controls list"
    description: |
      NEW this cycle. The same defect as F-001, one assert further down, in the
      sibling the fix did not examine.

          assert "reset_engine" in guard, (
              "this class no longer points at the convention's single source; a "
              "pointer that rots is how the duplication came back last time"
          )

      `guard` is the class docstring. It carries the substring `reset_engine`
      four times:

        * twice as the actual pointer - ``:func:`nonogram.db.session.reset_engine` ``
          ("the fixture calls ..." and "is written **once**, on ...");
        * once in Control 1's prose (``reset_engine``'s global set equals ...);
        * once EMBEDDED in a method name in the `Controls` list -
          ``:meth:`test_reset_engine_is_public_and_says_who_calls_it` ``.

      That fourth occurrence is not a pointer at the convention's single
      source; it is the name of a test in this same file. And it alone keeps
      the assert green. Measured per assert with the cycle-2 instrument, and
      then re-derived a second time WITHOUT the instrument by compiling the
      assert's own test expression straight out of the AST and evaluating it
      against mutated guard strings (so the result does not depend on my
      instrumentation at all):

        mutant                                              :851 :870 :881 :887
        SHIPPED                                             PASS PASS PASS PASS
        POINTER-ROT (both `:func:` dotted references renamed
          to a function that does not exist; Controls entry
          untouched)                                        PASS PASS PASS PASS
        POINTER-DEL-WORD (every whole-word `reset_engine`
          removed; Controls entry untouched)                PASS PASS PASS PASS
        POINTER-DEL-WORD + Controls entry renamed           PASS PASS PASS RED

      POINTER-ROT is not a contrived mutant: it is the single most likely
      drift - the production function is renamed and the two `:func:`
      references are not updated - and it is literally the failure the
      assert's own message names ("a pointer that rots is how the duplication
      came back last time"). Under it the class points at a function that does
      not exist and the control is green.

      Three claims are therefore stated wider than the mechanism:
        * the assert's own message at :888-890 ("this class no longer points at
          the convention's single source");
        * the control's docstring at :848 - "**DOC-POINTER-DEL** (the pointer to
          the single source gone)";
        * the card's AC-2 matrix row `DOC-POINTER-DEL -> :869 RED` (now :887),
          which is true only for a mutant that deletes the substring
          everywhere, including from the Controls list's method name - i.e. a
          mutant that deletes more than "the pointer". That is the identical
          epistemic error as cycle 1's `DOC-NAME-DEL -> :857 RED`, which was
          true only for a name choice the matrix never stated.

      Provenance: this assert does not exist on main (`grep` for
      `reset_engine" in guard` returns nothing at main, :887 at HEAD). It is
      this card's own new control, introduced at 245bc898 and untouched by the
      fix commit. Cycle 1 recorded "DOC-POINTER-DEL reds :869" as AC-2
      evidence; that measurement does not reproduce under a pointer-faithful
      mutant, so cycle 1's AC-2 evidence line and its ADR-0039/R2 holds line
      both overstate on this one cell.

      Failure direction is safe (a missed red, never a false red), which is why
      this is Important and not Critical - the same call cycle 1 made on F-001.
    suggestion: |
      Word-bounding this arm is NOT the fix, and the measurement says so:

        candidate assert                               SHIPPED  POINTER-ROT  POINTER-DEL-WORD  CONTROLS-RENAME-ONLY
        "reset_engine" in guard          (shipped)     PASS     PASS         PASS              PASS
        re.search(\breset_engine\b, guard)             PASS     PASS         RED               PASS
        "nonogram.db.session.reset_engine" in guard    PASS     RED          RED               PASS

      A word bound still passes POINTER-ROT, because Control 1's prose mentions
      `reset_engine` as a whole word for its own reasons. What discriminates is
      asserting the POINTER - the dotted path - rather than the bare name:

          target = f"{app_session.reset_engine.__module__}.reset_engine"
          assert target in guard, (
              f"this class no longer points at {target}, the convention's "
              "single source; a pointer that rots is how the duplication came "
              "back last time"
          )

      Deriving the module from `app_session.reset_engine.__module__` keeps it
      off the hand-written-literal list (ADR-0039/R2) and makes a module move
      red it too. Note the last column: renaming the Controls entry leaves this
      candidate PASS, which is correct - renaming a test method is not losing
      the pointer. So this is better TARGETED, not merely stricter, which is
      the distinction the fix correctly drew for the :881 heads arm.

      CERTIFICATION - what cycle 3 must see, per assert, line-count-preserving,
      ANY-RED aggregated:
        1. SHIPPED all-PASS across :851 / :870 / :881 / the pointer assert.
        2. The pointer assert RED under BOTH POINTER-ROT (the two `:func:`
           dotted references renamed to a non-existent function, Controls entry
           untouched) and POINTER-DEL-WORD (every whole-word `reset_engine`
           removed, Controls entry untouched). One of the two is not enough:
           a word bound kills only the second.
        3. The other three arms' rows unchanged - the six DOC-NAME-DEL cells
           still RED at the names arm, the four DOC-HEAD-DEL cells still RED at
           the heads arm, NAMES-BLIND still RED at the preamble.
        4. The control's docstring row for DOC-POINTER-DEL and the assert's
           message narrowed to what the new mutant actually demonstrates.
      Because max_cycles is 3, a fix landing after cycle 3 ships uncertified:
      this must not be the last commit before the merge gate without a cycle
      seeing that matrix.
