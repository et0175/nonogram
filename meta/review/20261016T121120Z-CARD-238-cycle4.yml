  - id: F-404
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1749
    title: "_HOST_STATE_PROBE omits .iterdir(), os.scandir and os.access, so a skip gated on those results is not reported"
    description: |
      Separate from F-401's `walk` because for these spellings the path guard
      does fire, so no mutant survives today — it is the stated limit that is
      wrong, not the defence.

      Measured:

        _conditional_silences(<skip gated on list(KANBAN.iterdir())>)        -> []
        _conditional_silences(<skip gated on [e for e in os.scandir(KANBAN)]>) -> []
        _conditional_silences(<skip gated on os.listdir(KANBAN)>)            -> [('test_x', 'not names')]

      The probe is `\.exists\(\)|\.is_file\(\)|\.is_dir\(\)|\.stat\(\)|os\.path\.(?:exists|isfile|isdir)|os\.listdir|\.glob\(|\.rglob\(`
      — `os.listdir` is there, `.iterdir()`, `os.scandir`, `os.walk`,
      `os.access` and `.is_symlink()` are not. The docstring's "Measured
      limits, each one a form this returns [] for" names three forms and
      these are not among them, so the enumeration reads closed and is not
      (same shape as F-401's, which is why the walk half of it is gating and
      this half is not).

      Consequence today: a host-state skip keyed on an `.iterdir()` or
      `os.scandir` result in another guarded source is reported only by the
      path guard, which fires on the lister itself. So the "two defences from
      both directions" the owner asked for is one defence for these
      spellings. Loud either way, hence Minor.
    suggestion: |
      Add `\.iterdir\(\)|os\.scandir|os\.walk|\.walk\(|os\.access` to
      `_HOST_STATE_PROBE` with a control per addition in
      `CONDITIONAL_SILENCES`, and replace the three-item "Measured limits"
      sentence with a pointer to `NOT_A_CONDITIONAL_SILENCE`, which can grow
      without a sentence going stale.
