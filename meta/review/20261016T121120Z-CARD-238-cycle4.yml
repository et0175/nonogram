    file: tests/test_suite_profile.py
    line: 2470
    title: "MEASURED_SILENCES_ELSEWHERE's header says 'Every host-state silence' and 'These three' over four entries, one of which it says is not host state"
    description: |
      A small prose inconsistency in the one block the owner's judgement call
      (2) turns on, so it is worth naming rather than swallowing.

      Line 2470-2471: "Every **host-state** silence the detector reports in the
      guarded tree *outside this module*". Line 2482-2483: "**These three** are
      pre-existing and belong to other cards". The tuple holds **four**
