      owner's host and not in a fresh checkout. Two of those three are
      therefore accurately characterised as this card's own defect one module
      over, and G-4 does confine the card to two files, so recording rather
      than fixing is the right call.
    suggestion: |
      Change the header to "Every silence the detector reports in the guarded
      tree outside this module" and "These four are pre-existing", or move the
      geteuid entry's width note into the header. One-line edit.
