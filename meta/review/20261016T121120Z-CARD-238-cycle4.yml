  - id: F-406
    severity: info
    category: tech-debt
    type: question
    file: tests/test_suite_profile.py
    line: 1424
    title: "Out of scope: _kanban_directories over-approximates in two measured ways, both in the false-positive direction"
    description: |
      Judgement call (3) probed and accepted. `_kanban_directories` resolves
      **zero** names across all 221 real guarded sources (measured by running
      it over every one), so the claimed "no false positive across all 221
      real sources" is confirmed, and confirmed more strongly than claimed —
      it fires on nothing in the tree at all.

      Two over-approximations found by probing, both harmless because they
      produce a loud false positive and never a hole:

      * a `meta/kanban` under a *different* root is treated as the owner's:
        `OTHER = Path("/tmp/fake") / "meta" / "kanban"; os.listdir(OTHER)`
        -> `['listdir() of meta/kanban']`. `_joined_components` folds a
        single-string `Path(...)` call into the component list, so the root is
        not distinguished.
      * the resolution is flow-insensitive: `K = REPO_ROOT / "meta" / "kanban"`
        then `K = K / "cards"` leaves `K` resolved as the kanban directory, so
        the subsequent `os.listdir(K)` is reported even though it lists
        `cards/`.

      Three negative controls pin the narrowness that matters (a subdirectory
      listing by either spelling, and a caller-supplied root), and all three
      are green. Noted for a follow-up only if a future card trips one.
    suggestion: "No action on this card. If a real false positive ever appears, compare the join's root against REPO_ROOT rather than folding it into the component list."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
