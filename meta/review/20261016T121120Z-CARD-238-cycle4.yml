findings:
  - id: F-401
    severity: critical
    category: tech-debt
    type: bug
    file: tests/test_suite_profile.py
    line: 1147
    title: "os.walk / Path.walk of the kanban directory is missed by BOTH guard halves; a mutant restoring this card's own defect survives the whole module — the fifth occurrence of the family"
    description: |
      `_LISTERS = frozenset({"iterdir", "scandir", "listdir"})` and
      `_HOST_STATE_PROBE` both omit `walk`. The two omissions compound, and
      the result is cycle 3's F-301 with one spelling substituted.

      Measured as pure functions:

        _live_log_references("import os\nKANBAN = REPO_ROOT / 'meta' / 'kanban'\n"
                             "NAMES = [n for _,_,fs in os.walk(KANBAN) for n in fs "
                             "if n.endswith('.log')]\n")            -> []   MISSED
        same, inline (no hoist)                                     -> []   MISSED
        (REPO_ROOT / "meta" / "kanban").walk()   (Path.walk, 3.12+) -> []   MISSED
        _conditional_silences(<skip gated on the walk result>)      -> []   MISSED

      Compare the shapes that ARE caught, to show the omission is in the set
      and not in the rule: `os.listdir(KANBAN)`, `os.scandir(KANBAN)`,
      `listdir(KANBAN)` bare-imported, and `.iterdir()` are all reported, and
      a skip gated on `os.listdir`'s result IS reported
      (`[('test_x', 'not names')]`).

      Executed end to end, planted in a tracked guarded source other than
      this module (`tests/test_clues.py`, reverted, md5
      942627df2b6df5a003bf52775ab1d398 restored and verified) — MUT-L's shape
      with `os.walk` for `os.listdir`: walk the kanban directory, filter to
      `*.log`, `pytest.skip` when the host has none, then assert on the live
      log:

        tests/test_suite_profile.py                 -> 168 passed, GREEN
        both guard classes                          -> 77 passed, GREEN
        the mutant's own verdict (log-less worktree) -> 1 SKIPPED

      That last line is the original defect verbatim: green-by-skipping on a
      machine without the file, and it would go red on the owner's machine
      the moment a gate line lands — the CARD-234-green/CARD-235-red flip
      this card exists to remove. For contrast, MUT-L (`os.listdir`) now dies
      to exactly the three tests the card claims: the path guard
      (`{'tests/test_clues.py': ['listdir() of meta/kanban']}`), the widened
      silence equality (`('tests/test_clues.py',
      'test_the_timing_log_is_present_and_nonempty', 'not names')`) and the
      behavioural comparison — 3 failed, 74 passed, rc=1. The fix is real;
      its reach is one hand-written set wide.

      Why the behavioural half cannot save it: the comparison runs only
      `tests/test_suite_profile.py` plus the sandbox control, so a coupling in
      any of the other 220 guarded sources has the two structural rules as its
      sole defence — and here both are silent. Confirmed by the 168-passed
      run above.

      Four standing claims are falsified by this, and none of them can go red:

      * line 1498, `_live_log_references`: "...or a listing of that directory
        **at all**." It is not: two listing spellings walk through.
      * lines 1551-1563: "What it cannot see is measured by executing each
        form, not guessed, and is held as controls in
        :data:`MEASURED_STRUCTURAL_MISSES` rather than only described here...
        **The five**, as of 2026-10-16: ..." — the enumeration is presented as
        closed and is not. `os.walk` is a sixth and is in no control, so
        nothing goes red (all five listed entries ARE honest misses: I ran
        `_live_log_references` on each and all return `[]`).
      * lines 3064-3068, `_build_sandbox` on G-1: "no path in any guarded
        source names the owner's log at all, **within the measured bound of**
        :class:`TestSuiteTiming_NoTestReadsTheLiveLog` **and its five**
        :data:`MEASURED_STRUCTURAL_MISSES` -- which is the strongest statement
        anything here pins." The stated bound is not the real bound.
      * lines 1835-1841, `_conditional_silences`: "**Measured limits, each one
        a form this returns [] for**: a test that calls a helper which skips;
        a skip keyed on an environment variable; a module-scope skip under a
        condition that is neither host state nor absent." A skip keyed on a
        walk result is a fourth and is not named.

      `os.walk` is not an evasion. It is stdlib's most commonly written
      directory enumerator — more common in practice than `os.scandir`, which
      IS a member of `_LISTERS` and which the cycle-4 fix went out of its way
      to make reachable. The card's own declined Option 2 ("find whatever
      `.log` is under meta/kanban") is naturally written with `os.walk` or
      `glob`. This is the same judgement cycle 3 applied to `os.listdir` when
      it gated F-301.

      Worth stating plainly on severity: this IS worth stopping the card for.
      The card's entire deliverable is the guard's completeness, the owner's
      recorded reason for authorising cycle 4 was "merging it would ship a
      guard that does not guard", and a second, structurally identical
      surviving mutant is exactly that condition unchanged.
    suggestion: |
      Two changes, and one of them is what makes the fix durable:

      1. Add `walk` to `_LISTERS` and `os.walk`/`\.walk\(` to
         `_HOST_STATE_PROBE`, with a positive control per spelling in
         `REINTRODUCTIONS` (`os.walk` hoisted, `os.walk` inline, `Path.walk()`)
         and a conditional-silence control for the walk-gated skip in
         `CONDITIONAL_SILENCES`. `test_every_listing_and_globbing_spelling_has_a_control`
         then covers the new members automatically — I verified that test is
         genuine (adding `walk` to `_LISTERS` alone makes it red at
         `['walk']`).

      2. Stop the enumeration being a judgement nothing can check. The honest
         version of the "at all" claim is a control that enumerates the
         *stdlib surface* rather than the author's memory — e.g. a test that
         asserts every name in `{n for n in dir(os) if ...}` plus
         `{n for n in dir(pathlib.Path) if ...}` that returns directory
         contents is either in `_LISTERS`/`_GLOBBERS` or in an explicit
         `NOT_A_LISTING` exclusion list with a reason. That is the only shape
         that makes "a listing of that directory at all" a claim that can go
         red, and without it the next unlisted spelling is occurrence six.

      3. Delete or narrow the four sentences above to what is pinned: "the
         listing spellings in `_LISTERS`/`_GLOBBERS`, each with a control",
         not "at all"; and drop "the five" / "its five" / "each one a form
         this returns [] for" in favour of a reference to the data, which can
         grow without a sentence going stale.
    confidence: high
    source: static
