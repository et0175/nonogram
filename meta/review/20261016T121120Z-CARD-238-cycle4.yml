  - id: F-402
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1708
    title: "The listing rule's 'judged by both ends of the call' omits keyword arguments; os.listdir(path=...) evades the path guard, and the bare-imported form evades both halves"
    description: |
      The argument rule the owner's condition 1 asked for collects positional
      arguments only:

        tests/test_suite_profile.py:1708-1715
          where = [
              candidate
              for candidate in [*receiver, *node.args]
              ...

      `node.keywords` is absent, while the same function's `Call` branch four
      lines earlier does include them for the string-operand rule
      (`operands = [*node.args, *(kw.value for kw in node.keywords)]`). So the
      omission is inconsistent within the one function.

      Measured:

        _live_log_references("import os\nKANBAN = REPO_ROOT / 'meta' / 'kanban'\n"
                             "NAMES = os.listdir(path=KANBAN)\n")  -> []  MISSED

      `os.listdir(path=...)` and `os.scandir(path=...)` are legal signatures,
      so this is a spelling and not a trick.

      Executed end to end in `tests/test_clues.py` (reverted, md5 verified):

        MUT-K  os.listdir(path=KANBAN)              -> 2 failed, 166 passed  KILLED
        MUT-KB from os import listdir; listdir(path=KANBAN)
                                                    -> 168 passed            SURVIVED

      MUT-K dies, but only on the silence half, and only because the source
      text happens to contain the literal `os.listdir` that
      `_HOST_STATE_PROBE` greps for — not because the path guard saw it.
      Drop the `os.` prefix and both halves go quiet: MUT-KB is a second
      surviving mutant restoring the card's own defect (SKIPPED on this
      log-less worktree, green module).

      The claim this falsifies, at lines 1500-1503: "A listing or a glob is
      judged by both ends of the call -- the receiver for ``p.iterdir()`` and
      ``d.glob(...)``, **the arguments** for the module functions
      ``os.listdir``, ``os.scandir`` and ``glob.iglob``". A keyword argument
      is an argument. Nothing in the 36 controls uses one, so nothing goes red.

      On severity: MUT-KB's spelling (bare import *and* a keyword-only
      directory) is contrived in a way `os.walk` is not, so taken alone this
      would be a bound worth recording rather than a reason to stop. It is
      filed as Important because it is the same root cause as F-401, it is a
      one-token fix, and the asymmetry the owner's condition 1 was written to
      remove ("220 of 221 sources have one defence") is still live wherever
      `_HOST_STATE_PROBE`'s text match does not happen to fire.
    suggestion: |
      Change the one line to

        for candidate in [*receiver, *node.args, *(kw.value for kw in node.keywords)]

      and add two controls to `REINTRODUCTIONS`: `os.listdir(path=KANBAN)` and
      the bare-imported `listdir(path=KANBAN)`. Then re-word line 1500-1503 to
      say positional *and* keyword arguments, or drop the enumeration in favour
      of pointing at the controls.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-403
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 2685
    title: "test_every_path_wrapper_is_seen_through cannot fail for any bare-name member, so the claim the sweep wrote it to pin is still unpinned"
    description: |
      This is the one item on the agent's own sweep list that is reported as
      pinned and is not, which the review brief singles out as worse than an
      unlisted claim — so it is reported even though its consequence is benign.

      The cycle-4 sweep found `_PATH_WRAPPERS` holding `PosixPath` and
      `WindowsPath` with nothing exercising them, called it "the F-301 shape in
      miniature, in my own pass", narrowed the set to three, and wrote
      `test_every_path_wrapper_is_seen_through` parametrized from the set with
      `WRAPPED_DIRECTORY_SOURCE` generated per member. The comment at 1153-1159
      says the set is now "exercised by that test on the next run rather than
      taken on trust", and at 2253-2256 "the set and the controls cannot drift
      apart".

      The test cannot discriminate. `_unwrapped` (line 1370-1379) peels any
      single-argument call whose function name is in `_PATH_WRAPPERS`, so the
      generated source `os.listdir({wrapper}(KANBAN))` is caught *because* the
      wrapper is in the set. Measured — `PosixPath` re-added to
      `_PATH_WRAPPERS`:

        tests/test_suite_profile.py::TestSuiteTiming_NoTestReadsTheLiveLog
          -> 60 passed  (59 before; the new parametrisation collected and PASSED)

      versus the sibling guard, which is genuine — `walk` added to `_LISTERS`:

        -> 1 failed, 58 passed
           AssertionError: ... with no positive control that the guard actually
           catches it: ['walk']

      So the exact two members the sweep removed would pass the guard it wrote
      to justify removing them, and `_PATH_WRAPPERS`' own claim ("Three
      members, each one a spelling somebody writes") is held by prose alone.
      The only member that could make the test red is a dotted spelling such
      as `os.fspath`, since `_unwrapped` rsplits on `.`.

      Why this is Minor and not gating, stated plainly: a wrong member of
      `_PATH_WRAPPERS` widens the *peel*, which makes the guard catch more,
      not less. The one way it can bite is through `_leftmost`, which also
      peels: a bogus wrapper lets `os.listdir(bogus(root) / "meta" / "kanban")`
      reach the caller-root exemption. That is a false-exemption path, not a
      hole that exists today. This is a bound worth accepting and recording,
      not a reason to stop the card.
    suggestion: |
      Either give the test power — assert the wrapper is seen through by a
      mechanism that does not consult the set (e.g. parametrize over
      `_PATH_WRAPPERS` but assert the *resolved directory*, and add a negative
      control asserting a name NOT in the set, such as
      `os.listdir(reversed_name(KANBAN))`, is NOT seen through, so the set's
      narrowness is what the test measures) — or delete the two sentences and
      say what is true: the three members are a judgement, and the test
      exercises each one end to end without bounding the set.
    confidence: high
    source: static
