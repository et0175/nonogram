      So the header's "host-state" is wrong for one of the four and the "three"
      undercounts; all four are in fact pre-existing. The two inline comment
      blocks disambiguate correctly, and the test name
      (`test_the_host_state_silences_elsewhere_are_exactly_the_measured_ones`)
      carries the same narrowing. Nothing is hidden by it — the equality is
      over whatever the detector returns, which I verified in both directions —
      but on a card whose defect class is "a sentence wider than its
      mechanism", a count in a docstring that disagrees with the data two lines
      below it is the same habit in miniature.

      I verified the substance the prose describes. The three filesystem
      silences are genuine pre-existing host state belonging to other cards:
      `tests/test_admin_design_tokens.py` skips on `not _DESIGN.exists()`
