findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: meta/architecture/requirements.yml
    line: 3295
    title: "FR-042's statement still defines the tile height as the equal division, which the code no longer does"
    description: |
      FR-042's `statement:` says "Each tile is (usable width - 2 mm) / 2 wide and
      **(usable height - (rows - 1) x 2 mm) / rows tall** ... a 6 mm caption line is
      reserved inside the tile and the grid is drawn at the largest square cell that
      fits the rest." After this diff that expression is only the *measured* tile used
      to size the cell (`_answer_cell_mm`, layout.py:2304-2325); the tile a caller
      actually receives is `ANSWER_CAPTION_MM + max(rows x cell)` over its row
      (`_answer_row_heights_mm`, layout.py:2328-2350). The registry now misdescribes
      shipped geometry and nothing in the FR distinguishes the two heights.

      Concrete failure scenario: CARD-144 (next in wave 26, "frame around the puzzle
      on book pages, clue bands boxed", listed `after CARD-141`) and CARD-129 both
      size against book geometry. A card author who reads FR-042's statement rather
      than layout.py's docstring will compute `(260.35 - 4)/3 = 85.45 mm` as an answer
      tile's height and place a frame, a rule or a page-fit check 4.45..30 mm below
      where the tile now ends on any cap-bound row (a 15x15 six-up row is 81 mm, a
      10x10 six-up row is 56 mm).

      Mitigating (why this is Minor, not Important): the delta IS captured in the
      intake queue — meta/architecture/inputs/raw-requirements.md:264 records the
      owner's ruling verbatim, including the row-height rule — so this is a tracked
      deferral, not a hidden one, and requirements.yml is outside the card's declared
      `Touches`. No AC pins a tile height, so no test is aspirational-green because
      of it.
    suggestion: |
      Either amend FR-042's statement in place with a dated note (the pattern the FR
      already uses for the 2026-09-22 (c)/(d) deltas) distinguishing "the measured
      tile, which sizes the cell" from "the row, which is the tile a caller gets", or
      confirm on the card that the amendment rides on the raw-requirements delta at
      line 264 and name the card that will formalise it.
    confidence: high
    source: model
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_answer_page_layout.py
    line: 190
    title: "The corpus helper `_extents(capacity)` ignores its argument and is rebuilt 3000 times"
    description: |
      `def _extents(capacity: int) -> list[Extent]` never reads `capacity`; it returns
      every (columns, rows) in MIN_SIZE..MAX_SIZE regardless. That is deliberate (the
      docstring says "INV-011's rule is not applied") but the parameter is dead, and
      the call site `allowed = _extents(capacity)` sits *inside* the 3000-iteration
      loop, so the 441-element list is rebuilt on every page — ~1.3 M tuple
      allocations per run.

      Concrete failure scenario: a later card widens the property to be
      capacity-aware, passes a different capacity, and silently gets the same corpus
      back — the new coverage it believes it added does not exist, and the minimum
      counts (`partial >= 600` etc.) still pass because they were computed over the
      unchanged corpus. Suite cost today is 1.2 s, so this is a readability/trap
      finding, not a performance one.
    suggestion: |
      Hoist the list out of the loop (`ALLOWED = _extents()` at module level, or one
      dict keyed by capacity) and drop the unused parameter, or make it actually
      select the INV-011 subset and say in the docstring which corpus each capacity
      gets.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_answer_page_layout.py
    line: 54
    title: "The property test hardcodes DPI = 300 instead of importing layout.DPI, so its one-pixel tolerance can go stale"
    description: |
      `DPI = 300` / `PX_PER_MM = DPI / 25.4` / `PIXEL_MM = 1.0 / PX_PER_MM` are
      literals here, while the sibling unit test `tests/test_answer_page_layout.py:42`
      imports `DPI` from `nonogram.export.layout` for the same purpose. Every
      assertion in `_check_page` is `<= PIXEL_MM`, i.e. "within one device pixel".

      Concrete failure scenario: if `layout.DPI` is ever raised (e.g. to 600 for a
      print-quality card), this file keeps a `PIXEL_MM` of 0.0847 mm while a real
      device pixel is 0.0423 mm — every tolerance in the property becomes twice as
      loose as it claims, and a genuine half-pixel-per-row placement error in
      `_answer_row_heights_mm` would pass unnoticed while the unit test still catches
      it. The opposite direction (DPI lowered) turns the property flaky. The file's
      own docstring justifies re-deriving *CON-018's Book 1 literals* independently —
      DPI is not one of those; it is the module constant the coordinates are expressed
      in.
    suggestion: |
      Import `DPI` from `nonogram.export.layout` as `tests/test_answer_page_layout.py`
      already does, keeping the Book 1 millimetre literals hand-written as they are.
    confidence: medium
    source: static
