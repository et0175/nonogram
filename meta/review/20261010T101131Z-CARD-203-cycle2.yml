  - id: RC-101
    title: "The cycle-1 F-001 fix threads the caption's occupied box into _draw_folio's collision check asymmetrically: solved_puzzle_page explicitly gates the fold-in on page_is_right_hand(page_number) (book_pdf_generator.py:3754), matching the geometric fact that the caption (always right-aligned, CARD-203) only shares the folio's own physical corner on a right-hand page. _packed_answer_page's own fix (book_pdf_generator.py:3902-3907) has no equivalent gate: it folds the corner tile's caption into content_bottom on BOTH page sides. On a left-hand packed page the selected 'corner tile' is column 0, whose GRID reaches the page's left margin (by construction, CARD-200 cycle-2) but whose CAPTION is still right-aligned toward that tile's own drawing_right (the tile's own right side, nowhere near the left margin) — so content_bottom gets widened by a mark that cannot actually reach the folio's corner, while the horizontal clearance check (content_left) still answers only for the grid, not the caption. Net effect, confirmed by direct reproduction: the folio is silently omitted on some left-hand packed answer pages where no collision exists, reversing the direction of the very defect this fix cycle was meant to close and contradicting the Worktree notes' own explicit claim that resolution (a) 'would also still [draw the folio] on left-hand pages in slack windows where no collision is even possible, which (a) does not do' (CARD-203.md:456-460) — true for solved_puzzle_page, false for _packed_answer_page."
