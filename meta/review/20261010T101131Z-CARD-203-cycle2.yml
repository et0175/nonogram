findings:
  - id: F-101
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 3902
    title: "_packed_answer_page's F-001 fix omits the folio on left-hand packed pages with no actual caption/folio collision (fix-introduced regression, not gated by page_is_right_hand unlike solved_puzzle_page)"
    description: |
      Confirmed by direct reproduction against this worktree's own post-fix code (capacity-4
      packed layout, KDP-minimum-trim book, a 14x6/depth-1 member, page_number=8 — a left-hand
      page): the corner tile selected for the left-hand side is column 0 (book_pdf_generator.py:3888,
      `corner_column = ... if right_hand else 0`), whose own `drawing_left == frame.left` (the
      grid genuinely reaches the folio's x-position there, by CARD-200 cycle-2's own established
      geometry). But the corner tile's CAPTION (CARD-203, always anchored "rm" at that tile's own
      `drawing_right` — book_pdf_generator.py:3619/3636) sits toward the TILE's own right edge,
      not its left edge, regardless of which column the tile occupies. `_packed_answer_page`'s
      fix (lines 3902-3907) folds that caption's bottom edge into `content_bottom` unconditionally
      — with no `page_is_right_hand` gate, unlike `solved_puzzle_page`'s own fix at line 3754 —
      even though the caption's horizontal footprint is nowhere near the folio's left-corner
      anchor on this page side.

      Reproduction: with a short caption ("3 — Pic"), the corner tile's own grid leaves 84px of
      vertical slack (`drawing_bottom`=985, `usable_bottom`=1069) — comfortably clearing the
      folio's own 49px bar, so the pre-this-fix code (content_bottom = grid only) draws the folio.
      The caption's own ink was independently confirmed to occupy none of the pixel region the
      folio's digit would occupy (no dark pixels in a wide scan box around the folio's own
      (left, bottom) anchor). Post-fix, `content_bottom` is widened to the caption's own bottom
      edge (1058px, only 11px of the required 49px margin left), which trips `_draw_folio`'s
      "not enough room" check; the horizontal clearance check then reads `content_left`
      (still the GRID's own `drawing_left == frame.left`, unrelated to the caption's real
      position) and — because that figure was always ~equal to the margin itself — always
      reports "not clear," so the folio is omitted. A monkeypatched render simulating the
      pre-fix caller behavior (`_draw_solved_slot` reporting no caption box) draws the folio's
      digit at that exact anchor; the actual post-fix render does not.

      This violates CARD-200's own formal AC-1 ("each [interior] page... carries its own
      1-based interior page number... except a page whose bottom slack is too small to fit
      one line, which prints none" — meta/kanban/cards/CARD-200.md:181-187): this page's own
      slack (84px) is NOT too small; the folio is omitted anyway, purely because of the
      asymmetric fix. It also directly contradicts this fix's own stated design rationale
      (CARD-203.md:456-460, picking resolution (a) over (c) specifically because "(a)... would
      also still [draw the folio] on left-hand pages in slack windows where no collision is
      even possible, which (a) does not do") — true for `solved_puzzle_page`, demonstrably
      false for `_packed_answer_page`.

      Root cause: `_packed_answer_page`'s own docstring addition (lines 3844-3851) claims this
      is "the same 'folio yields' fix :meth:`solved_puzzle_page` makes for a full page" — but
      `solved_puzzle_page`'s fix is conditioned on `page_is_right_hand(page_number)`
      (line 3754) and this one is not. The two methods' fixes are not actually parallel, despite
      the docstring's claim of parity (an intent-vs-reality drift, Step 8c).
    suggestion: |
      Gate `_packed_answer_page`'s caption fold-in the same way `solved_puzzle_page` does:

          right_hand = page_is_right_hand(page_number)
          content_bottom = None if corner_placement is None else corner_placement.drawing_bottom
          if right_hand and content_bottom is not None and corner_caption is not None:
              content_bottom = max(content_bottom, corner_caption[0])

      (the `right_hand` variable already exists at line 3887, computed for `corner_column` —
      it only needs to be reused here). Add a regression test mirroring
      `TestBookSolvedPage_CaptionDoesNotCollideWithTheFolio` for `_packed_answer_page`
      specifically, with cases for: (1) a right-hand packed page where the corner tile's
      caption and the folio really do compete (collision still correctly resolved); (2) a
      left-hand packed page in the same danger window, asserting the folio is NOT omitted
      (the regression this finding reports). Neither case exists in the current test suite —
      see F-102.
    confidence: high
