    title: "The two route-level membership tests still run in memory only, now that widening them is nearly free"
    description: |
      F-005's fix widened EC-021's *agreement* half to both storage modes and
      built the machinery to do it (`panel_in_mode` + the `admin_panel`
      parametrised fixture). The two route-level membership tests —
      `..._selection_step` (line 424) and `..._paste_ids_route` (line 468) —
