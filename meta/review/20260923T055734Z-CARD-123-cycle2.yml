    type: risk
    file: tests/test_book_select_floor_tiles.py
    line: 685
    title: "The ast guard for F-001 does not discriminate the defect it was written for"
    description: |
      `TestBookSelectTile_TheFloorVerdictIsMadeOnce::test_only_one_function_in_app_py_compares_against_the_floor`
      asserts `comparing == {"_misses_the_floor": 1}` over an ast walk of
      app.py. It is NOT a trivially-passing test — an empty dict fails the
      equality, which is the failure mode that matters. But it cannot fail
      against the pre-fix state either: `git show HEAD:src/nonogram/admin/app.py
      | grep FLOOR_MM` shows the pre-fix app.py already had exactly one
      FLOOR_MM comparison (HEAD app.py:2586, inside `_misses_the_floor`) —
      F-001's second verdict lived in the *Jinja template*, which this test
      does not read. It is therefore a forward regression guard, not a
      pre/post discriminator. The card's note "All five structural/behavioural
      guards were watched to fail against the pre-fix template" reads as more
      than it establishes for this one.

      The F-001 defect IS discriminated, by its sibling
      `test_the_selection_template_makes_no_comparison_of_its_own`: the pre-fix
      template carries `cell_mm < floor_mm` (matched by that test's regex) and
      carries no `below_floor_ids`, so it fails pre-fix. Independently
      confirmed by rendering the pre-fix template.
    suggestion: |
      Say in the test's docstring that it guards the Python side going
      forward, and that the template side is guarded by the sibling test —
      so the pair's division of labour is not re-read as "both watched to
      fail".
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-007
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_select_floor_tiles.py
    line: 701
    title: "The ast guard sees only a bare `FLOOR_MM` Name inside a function"
    description: |
      `visit_Compare` records a hit only when `FLOOR_MM` appears as an
      `ast.Name` among `node.left`/`node.comparators`, and only when
      `enclosing` is non-empty. Three shapes evade it silently and would
      re-open F-001 on the Python side: a local alias (`floor = FLOOR_MM`
      then `cell < floor`), an attribute access
      (`book_page_spec.FLOOR_MM`), and a module-level comparison (no
      enclosing function). Narrow by construction rather than wrong — worth
      naming so the next reader does not over-read the guarantee.
    suggestion: |
      Either widen the walk to `ast.Attribute` ending in `FLOOR_MM` and drop
      the `enclosing` requirement in favour of a `"<module>"` bucket, or state
      the three evasions in the docstring.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
