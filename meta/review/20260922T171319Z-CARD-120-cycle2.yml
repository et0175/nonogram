findings:
  - id: F-007
    severity: medium
    category: feature
    type: gap
    file: src/nonogram/admin/book_manager.py
    line: 1091
    title: "An edit that equals the current prefill cannot be released; count/split changes judge typed values against the old prefill"
    description: |
      revise_plan's reference is prefill(shown.count, shown.split). Reproduced:
      (a) stored 21-25 x hard = 15, edited, at 30/45/25 (prefill there is also 15): the
      owner cannot clear the mark in one submit — typing 15 equals the shown value, so the
      mark is kept; the page caption ("kept as hand-edited ... until you change it back to
      the value the split gives", book_setup_print.html:125) promises a release that is
      impossible in this state (needs a two-submit dance via another value).
      (b) count 150->200 and the owner types the NEW prefill into an unedited cell: it is
      marked hand-edited (it differs from the 150 prefill), then pinned through later split
      changes, contradicting the card text "a cell whose value differs from the prefill is
      recorded as hand-edited".
      (c) edited 20, split changed to 30/45/25 and the owner types 12 (the OLD prefill) in
      the same submit: mark cleared, cell silently becomes 15 — the typed value is replaced.
      No data is lost from storage and no invariant breaks (INV-005 holds); it is a POL-007
      semantics gap at the edges of the F-001 fix.
    suggestion: |
      Compare "back to prefill" against prefill(count, submitted split) (the plan the
      submission will derive), keeping the stored-mark carry-forward for unchanged cells;
      and/or give each edited cell an explicit "follow the split" control (checkbox) so a
      coinciding edit can be released. Align the caption with whichever rule is chosen and
      add a revise_plan test for cases (a)-(c).
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-008
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2070
    title: "Refusal re-render mixes submitted inputs with the stored plan's Planned row, warning and edited hints"
    description: |
      On a refused submission _plan_context carries the submitted count/split/cells into the
      inputs, but plan_column_totals, plan_tier_counts (tfoot "Planned"), plan_disagrees and
      the per-cell "edited" hints/labels are still computed from the stored plan. After
      refusing 40/40/30 the page shows split 40/40/30 above a Planned row for 40/40/20 and
      may show (or hide) the disagreement warning for a plan that is not the one on screen.
    suggestion: |
      On a re-render, either compute the derived rows from the submitted values when they
      parse, or label them explicitly as the stored plan ("Stored plan: ...").
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-009
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_plan_storage.py
    line: 311
    title: "F-005's trim-untouched assertion cannot fail in DB mode"
    description: |
      In DB mode get_book returns a fresh transient Book from _row_to_book and setup_print's
      trim write (book.metadata.size) is never persisted (O-2), so
      `get_book(book_id).metadata.size == size_before` holds whether or not the route wrote
      the trim. The assertion is meaningful only in the memory-mode parametrisation.
    suggestion: |
      Note the limitation in the test (or assert only in memory mode) until DB mode stores
      the trim; when O-2 is fixed this assertion becomes real in both modes.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

