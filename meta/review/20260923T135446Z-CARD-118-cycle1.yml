findings:
  - id: F-001
    severity: low
    category: feature
    type: gap
    file: src/nonogram/admin/book_proof.py
    line: 428
    title: "A book on a legal square KDP trim can never get proof pages, and the refusal names no remedy"
    description: |
      PrintSpecValidator accepts any trim from 10 cm up to 30 x 48 cm
      (src/nonogram/admin/print_specs.py:113-129), which includes the real KDP
      square sizes 8.25 x 8.25 in and 8.5 x 8.5 in. Both proof fixtures are
      square, so on those trims the drawing is limited by page height and
      _fitted_note_font raises, leaving the owner with no way at all to
      validate ADR-0037's strokes for that book — which is the card's whole
      purpose.

      I measured the boundary rather than taking the card's "near-square"
      wording on trust: with width 21.59 cm the first height that renders is
      23.115 cm, i.e. an aspect ratio of ~1.071. Every real portrait KDP trim
      I probed renders (5x8 1.600, 5.5x8.5 1.545, 6x9 1.500, 7x10 1.429,
      8x10 1.250, 8.5x11 1.294, and the tightest real one, 7.5x9.25 at 1.234).
      So the card's claim that "every portrait book trim leaves tens of
      millimetres" holds; the gap is confined to square and landscape trims,
      which the validator nonetheless allows.

      The refusal message is also hard to act on: it reports both dimensions
      symmetrically ("the note needs 62.0 x 4.6 mm and the page has
      196.9 x 1.2 mm clear below the drawing"), so the owner cannot see that
      only the height failed, and it names no remedy. The route wraps it as
      "Failed to generate proof pages: <message>".
    suggestion: |
      Either (a) say what to do — append "use a portrait trim, or set a
      taller sheet on Print setup" and lead with the dimension that failed; or
      (b) close the gap: fall back to a single-line note, or set the note in
      the drawing's blank clue corner (the card itself suggests this as a
      later card). Option (a) is a two-line change inside the existing
      ValueError and keeps the card's scope.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: compliance
    type: risk
    file: src/nonogram/admin/app.py
    line: 3505
    title: "Unvalidated redirect target — `redirect(request.referrer or ...)`"
    description: |
      On failure the route redirects to `request.referrer`, a header the
      caller controls. A page on another origin linking to
      http://localhost:5000/book/<id>/proof-pages passes the loopback door
      (the Host is local; the cross-site check only runs in deployed mode,
      app.py:892-897) and, on the square-trim refusal, bounces the operator's
      browser back to that origin. Impact is low — loopback-only panel, a
      redirect after a failed download, no token in the URL — and there is a
      precedent at app.py:3446, so this is not new to the codebase.
    suggestion: |
      Redirect unconditionally to `url_for("setup_print", book_id=book_id)`.
      The route's own docstring already says Print setup "is where the trim
      that caused it is changed", so the referrer adds nothing, and the
      route's test already asserts that destination
      (tests/test_book_proof_pages.py:768).
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 3497
    title: "Broad `except Exception` turns real bugs into a flashed message, and puts internal exception text on screen"
    description: |
      The handler catches every exception from render_proof_pdf, flashes
      `f"Failed to generate proof pages: {e}"` and returns 302. Exactly one
      failure is expected (the ValueError of F-001); everything else is a bug
      that now reports as a 200-level user flow with whatever `str(e)` happens
      to contain (a path, a database message) rendered into the page. It is
      mitigated — `app.logger.exception` keeps the traceback, and the comment
      says this is deliberate — so this is a hardening note, not a defect.
    suggestion: |
      Catch `ValueError` for the expected refusal and flash its message; let
      anything else propagate to the panel's 500 handler, or flash a generic
      "Proof pages could not be built — see the server log" and keep the
      detail in the log only.
    confidence: high
    source: static
