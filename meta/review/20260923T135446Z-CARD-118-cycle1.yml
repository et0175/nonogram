  - id: F-007
    severity: info
    category: feature
    type: question
    file: src/nonogram/admin/templates/book_setup_print.html
    line: 171
    title: "\"the smallest cell the book gives\" over-promises on a small trim"
    description: |
      The screen copy says the proof shows "a 30 x 30 at the smallest cell the
      book gives". On a small trim that cell falls below NFR-008's 4.8 mm
      floor — the property test deliberately spans it
      (tests/test_book_proof_pages.py:922:
      `assert min(cells_seen) < 4.8 <= max(cells_seen)`), and INV-006 would
      refuse such a puzzle into that book without a stored override. So on a
      5 x 8 in book the proof shows a cell the book will in practice never
      print. Nothing lies — the note states the cell it actually drew — but
      the copy is stronger than the fact.
    suggestion: "Add a below-floor marker to the note (or the copy) when placement.cell_mm < 4.8, so a small-trim proof reads as \"below the 4.8 mm floor\" rather than as the book's working cell."
