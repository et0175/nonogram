    type: gap
    file: tests/test_db_engine_lifecycle.py
    line: 857
    title: "AC-2's name-agreement arm cannot fail for the global `engine` (1 of its 3 set members is narrative)"
    description: |
      The new control's first assert is a substring membership test:

          assert {name for name in names if name in text} == set(names)

      with names == ['SessionLocal', '_engine_url', 'engine']. `engine` is a
      substring of `reset_engine`, `_init_engine`, `_engine_url` and
      `create_engine`, so `'engine' in text` is satisfied by any text that
      merely mentions the function - it does not measure whether the text
      names the global. For the guard text the arm is provably unfalsifiable:
      the same test's assert at :869 requires `"reset_engine" in guard`, which
      forces `'engine' in guard`.

      Measured with an independent per-assert instrument (every ast.Assert
      rewritten into a recording try/except keyed on its own lineno; mutants
      installed as module attributes or as in-memory source, so no line number
      shifts; the instrument reproduces the card's AC-2, AC-3 and AC-4
      matrices cell for cell, on main and on HEAD):

        DOC-NAME-DEL-PROD[SessionLocal]  -> :857 RED
        DOC-NAME-DEL-PROD[_engine_url]   -> :857 RED
        DOC-NAME-DEL-PROD[engine]        -> :857 PASS
        DOC-NAME-DEL-GUARD[SessionLocal] -> :857 RED
        DOC-NAME-DEL-GUARD[_engine_url]  -> :857 RED
        DOC-NAME-DEL-GUARD[engine]       -> :857 PASS

      (the [engine] mutants delete every word-boundary occurrence of the bare
      name `engine` from the text and leave `reset_engine` / `_init_engine`
      intact - i.e. a text that has genuinely stopped naming that global.)

      Three claims are therefore stated wider than the mechanism:
        * the control's docstring at :304-308 - "**DOC-NAME-DEL** (a global
          dropped from either text)";
        * the assert's own message at :858-860 - "{label} does not name every
          global _init_engine() creates";
        * the card's AC-2 and its matrix row `DOC-NAME-DEL -> :857 RED`, which
          is true only for a name choice the matrix does not state.

      This is the card's single new control, and it is the whole replacement
      for a rule that was retired precisely because it had no control
      (ADR-0039/R1: "a claim whose control cannot fail is narrative, not
      coverage, and must be narrowed to what is measured or deleted"). The
      failure direction is safe (a missed red, never a false red), which is
      why this is Important rather than Critical.
    suggestion: |
      Make the membership test word-bounded so all three set members are
      measured:

          import re  # already imported
          assert {
              name for name in names
              if re.search(rf"(?<![A-Za-z0-9_]){re.escape(name)}(?![A-Za-z0-9_])", text)
          } == set(names), ...

      Both texts carry a standalone `engine` today (reset_engine()'s docstring
      12 times, the class docstring twice), so the fix keeps the test green;
      the class docstring's dependence on it is the same one the card already
      declares as a residue.

      Alternatively, narrow the two sentences to the two names that are
      measured - but that weakens AC-2, which asks for the three global names.

      CERTIFICATION: a later cycle must show, per assert, that
      DOC-NAME-DEL[engine] reds :857 on BOTH texts while SHIPPED stays green,
      and that the mutant is applied per name (three mutants, not one) - a
      single DOC-NAME-DEL that happens to pick SessionLocal is exactly the
      evidence that missed this. Because max_cycles is a cycle budget and not
      a last-mile rule, this fix must not land as the last commit before the
      merge gate without a cycle seeing that per-name matrix.
    confidence: high
    source: static
