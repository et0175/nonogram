  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: player/assemble.py
    line: 1228
    title: "The destructive marker predicate's is_file() edge is uncontrolled"
    description: |
      `check_out_dir` refuses a non-empty target that does not hold
      `SITE_MARKER_FILE` as a FILE. Mutant C2-M17 - `.is_file()` ->
      `.exists()` - SURVIVES: all five denial controls still refuse (none of
      their trees contains a `.player-site` entry at all), and the positive
      controls write a real file. So a target containing a DIRECTORY named
      `.player-site` would be accepted and `shutil.rmtree`d, with nothing to
      notice the weakening.

      Low probability - it needs a dotted directory with that exact name in
      the deploy target - but it is an uncontrolled edge on the one predicate
      standing between `--out` and `shutil.rmtree`, and the edges of this
      guard are precisely what cycle 1's F-005 gated on.

      The core of F-005 IS closed, and I confirmed it separately: C2-M16
      (predicate reads SITE_INDEX_FILE instead of the marker) and C2-M18 (the
      `present` term dropped) both die, so the refusals are a statement about
      the marker rather than about the names - which was the original defect.
      All five denial controls assert through `check_out_dir` directly and
      never through `assemble`, verified by reading; the repo-root case does
      too.

      Also measured as fine: the stated cost. A tree assembled before the
      marker existed is refused and `--force` lifts it (C2-M22 dies), and the
      repo root is refused before `force` is read (C2-M21 dies).
    suggestion: >-
      Add a sixth denial case: a target whose only entry is a DIRECTORY named
      `.player-site`, refused. One line in the existing `denied` table, which
      already bumps its own `assert len(denied) == 5`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: low
    category: tech-debt
    type: gap
    file: player/assemble.py
    line: 1256
    title: "\"Written the moment the directory exists\" is true and has no control that discriminates it"
    description: |
      The comment above the marker write claims the ordering is "the
      difference between 'a retry works' and 'a retry needs --force'". The
      control is in test_an_out_dir_that_is_not_a_previous_site_is_refused at
      :1007-1012: after a SUCCESSFUL assemble, everything but the marker is
      deleted and `check_out_dir` is asserted to accept. A marker written
      LAST would pass that identically.

      I verified the claim is true, in a domain the suite does not use: with
      `_write` monkeypatched to raise on its third call, `assemble` dies after
      the marker and one page, the half-written tree holds `.player-site`, and
      `check_out_dir` accepts it. No test in the repo makes `assemble` fail
      part way (grepped), so a future edit moving the write to the end would
      ship green.

      Consequence of a regression is bounded - one `--force` - which is why
      this is Minor rather than gating. But the claim as written is a claim
      about ordering and nothing reds on the ordering.
    suggestion: >-
      One test: monkeypatch `_write` (or `PLAYER_FILES`) so `assemble` raises
      part way, then assert the marker is present and `check_out_dir` accepts
      the half-written tree. That is the assertion the comment is making.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-2
    status: open
    fixed_in: null
