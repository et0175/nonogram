findings:
  - id: F-001
    severity: high
    category: compliance
    type: risk
    file: player/assemble.py
    line: 1046
    title: "ADR-0041/R2 (mandatory) now reads false for the assembled site, and its own served-half guard passes only on a fixture choice"
    description: |
      The owner's decision to serve the book's display title is implemented
      well: I fired fourteen mutants at the exemption and its figure and all
      fourteen died, attributed by test name, and every number re-derived in
      an independent domain. The defect is not the decision, and not the code.
      It is that the decision was not carried into the model it contradicts.

      ADR-0041/R2 is `severity: mandatory`, its scope includes `player/**`, and
      its text has no enumeration to escape through: "No public asset -
      nothing in player/, nothing in the exported bundle, nothing the
      assembled site serves - carries a solution grid or data from which any
      solution cell is recoverable, for any puzzle, on any export path."
      EC-048 carries the identical catch-all as its fourth clause ("a solution
      grid, a filled-cells encoding, the picture name, or data from which any
      solution cell is recoverable"), quantified "for every puzzle on every
      export path and every asset the public site serves".

      The round's load-bearing justification is that "EC-048's enumeration
      does not name" the book's display title (player/assemble.py:206-215 and
      the module docstring at :199-215). That is true of EC-048's first three
      items and FALSE of EC-048 as a whole - the fourth clause names exactly
      the measured case, and the card concedes the substance in its own words:
      "a book title cannot carry an answer is false and stated as false,
      measured at 100 of 100 cells".

      MEASURED, in the one place it is checkable (mutant C2-M41): the bundle
      fixture in tests/test_public_player.py:299 hardcodes the book title as
      "A book". Change it to a leaky title and
      `tests/test_public_player.py::test_served_tree_is_clean_of_answers` -
      the test ADR-0041/R2's own `check:` comment names as "the served tree's
      half" - FAILS. So R2's served-half guard is green because of a fixture
      value, not because of the code. Meanwhile
      `test_the_book_title_exemption_is_scoped_and_its_cost_is_measured`
      asserts in the same suite that exactly that leak SUCCEEDS
      (`sorted(recovered) == [f"book/{leaky_slug}.json [e10]"]`). Two tests in
      one suite now assert opposite outcomes for the same mandatory rule,
      discriminated only by which book title the fixture picked.

      This is sharper than a process nit because of what it does next: R2's
      check ref is live and passing, so the next card's system-rules run will
      report R2 as mechanically checked and green. That is the board's own
      stale-green failure mode, one notch worse than a dead check ref - the
      check runs, and it is wrong for a reason nobody can see from the verdict.

      Note what is NOT claimed here. The clues make every cell recoverable BY
      SOLVING, which is the game and which the module docstring already argues
      is outside any implementation of ADR-0041. The book title is a different
      kind of channel - directly decodable with no solving - and R2's text does
      not distinguish them. Drawing that distinction is exactly the ADR edit
      that is missing.
    suggestion: |
      Two things, and the first is not the fix round's to write:

      1. ADR-0041 needs a revision from the architect: either a scoped
         exemption clause in R2 naming the book's display title with its
         declared residual (the shape R2 already uses for the clues and the
         key), or an explicit distinction between "recoverable by solving" and
         "directly decodable". The card's own routed-in option list already
         held the right instinct - it flagged the third option as "an ADR
         touch, not a code change". Serving a title is the same kind of touch.
         Editing FR-045's description to cite ADR-0041/R2 as the authority for
         the picture-name prohibition (which the fix round did, at
         requirements.yml:5027-5031) does not narrow a mandatory ADR rule; the
         FR is the lower artefact.
      2. Stop `test_served_tree_is_clean_of_answers` passing by accident. Its
         own `write_bundle` docstring states the discipline it did not extend
         to this field - "a fixture that only ever carries 'Snowy owl' would
         make every assertion below pass for the wrong reason". Give the
         bundle fixture a leaky BOOK title too and assert the one expected
         hit by name, so the served tree's cleanliness is a statement about
         the code and the one declared exception is visible in the assertion
         rather than hidden in a fixture constant.
    confidence: high
    source: model
    violates: ADR-0041/R2
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_public_player_pages.py
    line: 1724
    title: "The design-inventory drift guard's word-boundary fix has no control that can fail - M24's defect is still live for every hook but one hardcoded name"
    description: |
      Fix round 1 found its own survivor M24 - the drift guard matched with
      `in`, so `data-pages-loading` was a substring of the typo
      `data-pages-loadingx` and the guard read the typo as the thing it
      sought - and replaced it with a word-boundary match. The `named()`
      docstring at :1724-1740 states the claim explicitly: "the boundary has
      to admit `=` and `]` and refuse a further letter."

      That claim has no control. MEASURED twice:

      * C2-M25 (one node): revert `named` to `return hook in inventory`.
        The test PASSES. `assert not named("data-pages-nowhere")` passes under
        `in` too (the string is absent either way), and `missing == []` is
        strictly looser under `in`.
      * the 2-node counter-case, which closes the obvious refutation: the
        test does carry two bare regex assertions that catch the literal
        `data-pages-loadingx`, so one might argue the boundary is pinned.
        It is pinned for that ONE name only. Revert `named` to `in` AND typo
        the inventory's `data-pages-count` to `data-pages-countx` and the
        guard PASSES - re-run, with both file hashes verified identical
        before and after. The exact defect M24 named is still live for every
        hook except the one spelled out as a literal.

      The two controls the test does have do not go through the function under
      test: they re-derive the same regex inline. That is the pattern the
      board's own rule warns about - a comment saying what a test catches
      needs a mutant inside the claimed region and one at the edge, and here
      the inside mutant survives.

      The inventory-drift direction IS live and I confirmed it: C2-M26
      (typo the inventory under the real word-boundary code) reds the test.
      So the guard works today; what is missing is anything that would notice
      if the boundary were lost.
    suggestion: |
      Make the prefix control go through `named`, with the inventory in a
      state only a boundary match can read correctly. The cheapest honest
      shape: assert `named()` directly on a hook the inventory names only as
      the prefix of a longer word, using a locally constructed inventory
      string rather than the shipped file - e.g. assert that `named` returns
      False against an inventory that contains `data-pages-countx` and not
      `data-pages-count`, and True against one containing `data-pages-count]`.
      The genuine `data-pages-filter` / `data-pages-filters` pair the
      docstring already cites is the positive half and should be asserted
      through `named` as well, not alongside it.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: player/assemble.py
    line: 856
    title: "\"Both were dead code\" is false for the scope refusal: the order is load-bearing for liveness only"
    description: |
      `check_listing_capacity`'s docstring presents the refusal order as a
      discovery: "the first draft put them after the partition check, where
      both were dead code because any edit that reaches them breaks the
      partition first." The card's FIX ROUND 1 section repeats it, and the
      brief asked me to re-derive it.

      It is half true. Re-derived without reordering the source, by evaluating
      the partition PREDICATE under each single-node schema edit the suite
      actually uses (scratchpad probe, independent of the function):

        edit                                      actual refusal    partition would pre-empt?
        title OUT of SERVED_BOOK_SCHEMA           liveness          True
        title INTO SERVED_ENTRY_SCHEMA  (M26)     scope             False
        title INTO SERVED_INDEX_SCHEMA  (M27)     scope             False
        title INTO SERVED_SCHEMA                  scope             False
        'note' INTO SERVED_BOOK_SCHEMA            partition         True

      All three scope edits pass the partition predicate, because
      SERVED_ENTRY_SCHEMA and MIRRORED_FROM_PUZZLE_FILE are both bound at
      import and `title` is already carried by the book file - so neither
      `carried` nor `accounted` moves. The scope refusal would therefore be
      reachable regardless of where it sits. Only liveness is order-dependent.

      The test knows this: the exemption test's own comment at :1054-1059
      says "none of these three edits changes what the listings CARRY ... so
      the scope refusal is the only one that can fire", and it asserts
      `match="is scoped"` rather than a looser pattern. So the source
      docstring contradicts the test that holds it.

      No behavioural consequence - the order as written is correct and both
      refusals are controlled. This is the claim, not the code.
    suggestion: >-
      Narrow the sentence to what was measured: the liveness refusal is
      order-dependent (any single-node edit that fires it also breaks the
      partition), the scope refusal is not, and it is placed first for
      symmetry and for the message a reader gets. The exemption test's comment
      already has the right wording to borrow.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

