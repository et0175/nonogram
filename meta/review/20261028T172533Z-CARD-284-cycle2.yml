figures:
  - claim: "the book title costs 2410.18 bits"
    instrument: "player/assemble.py::book_title_residual_bits (SERVED_TITLE_MAX_CHARS * math.log2(TITLE_CODE_POINTS))"
    control_1: "the suite's own: surrogates counted by list comprehension, chr(0xD800)/chr(0xDFFF) shown unencodable, chr(0xD7FF)/chr(0xE000) as the boundary control, and TITLE_CODE_POINTS asserted == 0x110000 - 2048 == 1112064. The boundary control is real: C2-M10 moves the space by ONE code point and dies, so cycle-1's M8 rounding survivor is closed"
    control_2: "mine, new domain: character space counted by walking Unicode and testing unicodedata.category(chr(cp)) == 'Cs' (2048 - the exclusion is derived from the category, not from the literal), and the bits taken as Decimal(space).ln()/Decimal(2).ln() at 40 digits rather than math.log2. Result 2410.1770 -> 2410.18"
  - claim: "24.1x the 100-bit ceiling and 2.68x the 900 cells of the largest publishable grid"
    instrument: "the card and the module docstring"
    control_1: "2410.1770 / 100 = 24.102"
    control_2: "2410.1770 / 900 = 2.678"
  - claim: "a book file's order residual is log2(k!) - 4.58 / 79.04 / 660.48"
    instrument: "LISTING_STRUCTURE_FIELDS' docstring"
    control_1: "sum(log2(i) for i in 1..k) recomputed: 4.58, 79.04, 660.48"
    control_2: "declared at the site a reader reaches from the module docstring's residual list - confirmed present at both"
  - claim: "membership is log2(C(N,k)) = 83.17 for 24 of 120"
    instrument: "LISTING_STRUCTURE_FIELDS' docstring"
    control_1: "math.log2(math.comb(120,24)) = 83.17"
    control_2: "independent of the order figure (79.04), as the docstring claims - the two are different functions of different arguments"
  - claim: "a MIN_SIZE grid's base-64 is 20 chars (inside the cap) and a MAX_SIZE grid's is 152 (truncated)"
    instrument: "the exemption test's cells measurement, which recovers 100 of 100 cells off the served tree"
    control_1: "ceil(100/8) = 13 bytes -> 20 base-64 chars; ceil(900/8) = 113 bytes -> 152 chars. Both confirmed"
    control_2: "the truncation is an accident of base-64 and not protection, as the card says - 152 > 120 only for the largest grid, and every grid at or below ~480 cells fits"
  - claim: "F-012: PAGES_SETTLE_MS = 3000 removed the 62.63 s cost"
    instrument: "cycle 1's whole-file timing with the not-found mutant"
    control_1: "fix round: 9.72 s against a 4.93 s baseline over 25 nodes"
    control_2: "mine, third host: 10.59 s with the mutant against a 12.46 s clean baseline - the mutant is now FASTER than the clean run. Closed"
  - claim: "the four declared residuals are each declared where a reader will find them"
    instrument: "reading"
    control_1: "module docstring :129-166 names all four and sites three of them (:data: cross-references to LISTING_STRUCTURE_FIELDS and EXEMPT_LISTING_FIELDS); the tier's two bits are sized in place at :122-141"
    control_2: "cycle 1's F-002 - the stale 'one open edge, two bits wide' sentence - is CLOSED: the paragraph now says so explicitly and names what it used to omit"

