    file: src/nonogram/sourcing/image.py
    line: 122
    title: "EXIF orientation is ignored, so a phone photo converts rotated and cropped on the wrong axis"
    description: |
      `load_greyscale` opens the file and hands it straight to `_flattened`
      without consulting the EXIF Orientation tag (0x0112). For the card's
      headline use case — "the user's uploaded photo" — this is the common
      case, not an exotic one: phone cameras store a portrait shot as a
      landscape raster plus Orientation=6/8, and every viewer the user has
      seen the picture in applies that tag.

      Verified empirically rather than argued: a 60x20 JPEG saved with
      Orientation=6 (black outer thirds, the wide.png pattern) converts with
      the outer thirds cropped away — i.e. the module cropped the *stored*
      landscape axis. `ImageOps.exif_transpose` on the same file reports the
      display size as (20, 60), the other axis. The result the user sees is a
      picture rotated 90 degrees, with the crop taken across the wrong
      dimension, so centre-crop-then-resize discards the wrong ends.

      Not gating: AC-007/008/009 all hold (the output is still exactly
      size x size), no guardrail or standing rule is implicated, and the four
      repo fixtures are PNGs with no EXIF, so no test is wrong. It is a
      real-input quality gap in a card whose stated purpose is that
      "dithering quality is unproven until real images run through it".
    suggestion: |
      One line in `load_greyscale`, inside the existing guarded block:

          opened.load()
          return _flattened(ImageOps.exif_transpose(opened))

      (`from PIL import ImageOps`). `exif_transpose` returns the image
      unchanged when there is no orientation tag, and returns a new image
      when there is, so nothing about the PNG fixtures changes. Add a fixture
      or a tmp_path JPEG with Orientation=6 asserting that the crop lands on
      the display axis. If the team would rather defer, this is a natural
      companion to CARD-016 — but record it, don't let it be discovered by a
      user with a phone.
