score_rationale: >-
  8.5. What this round did is unusually well evidenced: every mutant the card
  publishes reproduces to the test name (5/42, 2/45, 1/46, and the negative
  control's 1/46 with exactly the economy assertion rising); every figure
  re-derives to the unit, including the EC's eleven sizes and four
  above-the-floor exemptions, which really is the strongest argument on the
  card; all ten trace refs resolve by class line; G-5's mechanism holds and
  not just its count; G-3 holds by substance; AC-6 reproduces pixel for pixel
  through an engine that wrote neither file; and the four widened structural
  guards are provably classified rather than silenced -- a planted public
  member still reds six tests in two modules. The round's own six corrections
  are five-and-a-half right, including the important one, and it reported them
  against its own brief.
  Pressed past what it claims, the implementation holds where it matters: a
  clue digit cannot escape the bracket, an over-applied mark inside the right
  drawer is caught at both a super-floor and a sub-floor size, a BDC swap is
  caught, and a raw-append forgery is caught.
  What keeps it off 9: two surviving mutants and a dead assertion, all three
  in the same family and all three in a card whose subject is that a
  provenance claim must be checkable. F-001 is the one that counts -- the
  reading is not actually keyed on the tag, and the corollary of the card's
  own central thesis has no control that can fail. F-003 ships an assertion
  that cannot fail inside the class that holds the mark's authorship. F-004 is
  a naming decision taken inside the round that should have gone to the owner,
  on a board where CON-020's covered trace row is how people resolve which
  test means what. None of these is a defect in shipped behaviour; all are
  control and claim-accuracy gaps, and F-001/F-002/F-003 are together about
  ten lines.

recommendation: >-
  CERTIFIES at 8.5 against min_score 8. A fix round is cheap and high value:
  F-001 (four lines), F-003 (delete three lines), F-002 (two lines) and F-008
  (one sentence) are all inside files this card already touches and would take
  it to roughly 9.2. F-004 is an owner decision and should not be settled
  inside a fix round. F-005 through F-012 are reporting and wording and can
  ride along or be deferred.
