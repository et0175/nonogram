  "1_stale_scope_premise": "ROUND IS RIGHT. Re-derived at 4d164f62 out of tree: the guard reads `not in CLUE_DIGIT_KINDS`, that set evaluates to ['answer','puzzle'], and the answer-page test is live at :1061. The card's load-bearing [SCOPE CORRECTED] paragraph describes a state that no longer existed when this work started."
