    fix: "Delete both lines; say 'threaded down the recursion'."

  - id: F-010
    severity: low
    confidence: medium
    source: review
    title: "One of the four reclassifications is a filing decision, not a measurement, and the card says all four were measured"
    where: "tests/test_book_pdf_vector_primitives.py, NOT_A_MARK at :1407, held by TestVectorVocabulary_TheRoundMarkRouteTheOldGuardCannotSee::test_the_unwatched_half_of_the_vocabulary_is_named"
    measured: >-
      That test asserts only that the three sets PARTITION dir(ContentStream)
      and do not overlap. It does not drive begin_marked/end_marked and does
      not measure that they put no mark on a page. The claim "they paint
      nothing" is measured -- but in the OTHER module, by
      tests/test_book_solved_answer_key.py's _DOOR_PROBE (:2701) /
      _NOT_A_DOOR_BECAUSE (:2738) pair, which drives each member and checks
      its emitted operators against _PATH_OPERATORS.
    why_it_matters: >-
      Not a silencing: the predicate is unchanged, exact, and default-DENY
      (M21 proves it bites), and this is the same standard the module's
      pre-existing NOT_A_MARK members are held to. The card's sentence "each
      is now classified with its own measurement" is simply one guard too
      broad.
    fix: "Wording only, or a two-line probe in that class if the owner wants all four self-contained."

  - id: F-011
    severity: nit
    confidence: high
    source: review
    title: "Two figures in the tree are illustrative but written in the shape of measurements"
    where: "src/nonogram/admin/book_vector_draw.py::draw_clue_digits (def at :513) and tests/test_book_puzzle_page_vector.py MARKED_CONTENT_OPERATORS (:2376), both saying '540 digits on a 30x30 ... rather than 1080'"
    measured: >-
      No 30x30 page this tree builds has 540 clue entries. The EC corpus's
      three 30x30 pages have 456, 449 and 468; the rendered baseline puzzle
      page has 204 clue digits (so the real economy there is 2 operators
      against 408). 540 is a plausible upper bound stated as an observation.
      Same family, smaller: the render README's 107,962 ink pixels measures
      107,957 here at a <128 threshold (both images equal either way, so the
      claim stands).
    fix: "Say 'up to ~900 on a dense 30x30; 408 on this module's baseline page' or mark the figure as a bound."

  - id: F-012
    severity: nit
    confidence: high
    source: review
    title: "The EC's minimum-case floor has no slack and cannot catch a filtered corpus"
    where: "tests/test_book_interior_type_floor.py::TestInteriorType_EveryVectorClueDigitIsExemptByItsMark, MINIMUM_CASES = 18, asserted in test_every_non_exempt_face_holds_the_floor_and_every_digit_is_marked (def at :1919)"
    measured: "len(_corpus()) == 18 == MINIMUM_CASES exactly, and 18 == len(TRIMS) * len(SIZES) by construction."
    note: >-
      This satisfies CLAUDE.md's rule (the count IS asserted inside the test)
      and does catch a shrunk TRIMS or SIZES. It cannot catch a corpus that
      shrank by a filter inside the loop, because the assertion and the
      construction share a derivation. The companion assertions
      (exempt_seen >= 1000 against an actual 3557, and sub_floor_seen non-zero)
      carry the real non-vacuity load, so this is a nit.

