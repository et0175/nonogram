  G-2: "HOLDS, and is the best-controlled thing on the card. The exemption is read off the mark; M1 (size equality) reds 5 including both AC-2 parametrisations and the EC. Caveat at one level down: F-001."
  G-3: "HOLDS BY SUBSTANCE. pyproject.toml diff empty. The only added imports in the whole delta are `import random`, `from contextlib import contextmanager` (both stdlib) and intra-project `from nonogram.admin import ...`. The third-party import set of both touched src files is unchanged (PIL.PdfParser only). The dead TestDependencyBaseline_ ref was not used."
  G-4: "HOLDS. tests/test_book_interior_type_floor.py's raster/spy arm is untouched by the diff -- TestInteriorType_OnlyPuzzleClueDigitsAreExempt does not appear in the diff at all, and below_floor()'s left arm is unchanged. Separately, tests/test_book_puzzle_page_vector.py's marks_of was widened by SKIPPING bracket rows rather than by emitting a Mark for them, so no ink comparison in that module learned to ignore anything."
  G-5: "HOLDS, MECHANISM VERIFIED. 0 files under tests/fixtures/ changed; all 7 PageKind values still in _RASTER_DECLARATIONS (undeclared == []), so no vector page reaches the interior export. Nothing to raise."
  G-6: "HOLDS AS MEASURED (317 -> 330 node ids, +13 / 0 removed / 0 renamed; 0 test defs removed; no skip/xfail marker added in the delta). But see F-004: literal compliance here preserved two names that now state the pre-card contract, and that should go to the owner rather than be settled inside the round."

acceptance_criteria:
  AC-1: "MET. Clue digits are recoverable from the WRITTEN PDF (verified independently off ~/Documents/.../puzzle-page-marked.pdf: BMC 1, 204 of 209 faces exempt) and the floor is asserted over non-exempt faces only (below_floor_in_its_medium's `and not face.exempt`, controlled by M13)."
  AC-2: "MET and it is a real control. M1 reds 5/47. The plant is outside every bracket and at a size read off the page (`planted = min(digits)`), exactly as claimed. Docstring nit at F-008."
  AC-3: "MET. The missing mark FAILS rather than exempting or reporting ~204 violations; M2 reds 2. The mutant is planted at the one chokepoint on a real writer's page, which is the right place."
  AC-4: "MET in both directions, and better than the card claims. Wrong page: M3 reds 1. Wrong code: the chokepoint walk reds on a planted emitter (M4). Beyond the card: over-application INSIDE the right drawer -- which neither named instrument covers -- is caught too, at 12 pt (M10, 4 reds) and at a sub-floor 8.0 pt (M14, 4 reds), by AC-1's at-or-above-the-floor assertion and the EC's len(layout.clue_entries) cross-check. Gap at F-001 (wrong TAG) and F-006 (forged by raw append)."
  AC-5: "MET. The raster arm is byte-unchanged and green; all ten CON-020 trace refs resolve by `class` line; 0 dead refs; gate 3 is not at risk."
  AC-6: "MET. Reproduced with poppler: 0 differing pixels of 2,103,750, max abs diff 0, identical text layer, +26 bytes. The page was looked at and is complete."
  EC: "MET and independently re-derived to the unit: 18 pages >= MINIMUM_CASES 18, 3557 exempt faces over 11 distinct sizes, 4 of them above the floor, 2629 below, 67 non-exempt with min 10.08 pt. The cross-check against len(layout.clue_entries) from COMP-007's geometry is a genuine second source and is what catches M9/M10/M14."

