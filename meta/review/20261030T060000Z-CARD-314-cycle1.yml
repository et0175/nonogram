findings:
  - id: F-001
    severity: medium
    confidence: high
    source: mutation
    title: "The exemption is not keyed on the TAG -- 'by the mark' has no control for WHICH mark"
    where: "tests/helpers/pdf_vector.py::marked_type_sizes (def at :392)"
    measured: >-
      Replacing `CLUE_DIGIT_TAG in stack` with `bool(stack)` -- i.e. exempting
      every face inside ANY marked-content sequence regardless of its tag --
      passes all 733 tests in the blast radius (M22, confirmed twice: 263
      passed on the three vector modules, then 733 passed on the full radius).
      The shipped code is CORRECT: a probe of the real reader returns
      exempt=False for a face inside "/Artifact BMC ... EMC". Nothing in the
      tree would notice if it stopped being correct.
    why_it_matters: >-
      This is AC-2 one level down, and it is the same mistake in a different
      coordinate. AC-2 proves the exemption is not keyed on SIZE and is the
      card's declared central control. Its necessary corollary -- that the
      exemption is keyed on THIS tag and not on the mere presence of a
      bracket -- is asserted in four docstrings and controlled by nothing.
      /Artifact is the standard PDF idiom for exactly the kind of decorative
      run a future interior card will want to bracket (PDF 1.7 section 14.8.2.2),
      so the day a second marked-content sequence enters this writer, every
      face inside it is silently exempt from CON-020. ADR-0039/R1: a claim
      needs a control that CAN fail.
      test_the_tag_the_reader_expects_is_the_tag_the_writer_emits does not
      close it -- it holds the two SPELLINGS equal, which says nothing about
      whether the reader uses the tag at all.
    fix: >-
      One assertion, in the module that already owns this claim: a stream
      carrying a sub-floor face inside a non-ClueDigit BMC sequence must come
      back non-exempt and must be REPORTED by faces_on_page on a clue-digit
      kind. Roughly four lines beside
      tests/test_book_interior_type_floor.py::TestInteriorType_TheStreamArmIsReached::test_an_unbalanced_mark_is_a_failure_not_a_silent_exemption
      (def at :1445), which already builds hand-written streams for exactly
      this sort of bound.

  - id: F-002
    severity: low
    confidence: high
    source: mutation
    title: "The nesting claim is documented four times and controlled nowhere"
    where: "tests/helpers/pdf_vector.py::marked_type_sizes (def at :392); src/nonogram/admin/book_vector.py::marked_content_imbalance (def at :1307)"
    measured: >-
      `stack.pop()` -> `stack.clear()` survives all 733 tests (M11). The
      docstring says "Marked content nests (PDF 1.7 section 14.6), so the state
      tracked is a stack rather than a flag", and a stack and a degenerate
      flag are indistinguishable to this suite. (The WRITER's equivalent is
      controlled: M15 on marked_content_imbalance reds.)
    why_it_matters: >-
      Lower than F-001 because production never nests today -- one emitter,
      depth always 1, verified by grep over src/. It is the same family as
      F-001: a correct implementation with a reasoned docstring and no control,
      in a card whose whole subject is that a claim must be checkable.
    fix: "One assertion: a ClueDigit sequence containing another tag's sequence exempts what is inside the inner one, and closing the inner one does not end the outer exemption."

  - id: F-003
    severity: medium
    confidence: high
    source: static
    title: "A shipped assertion that cannot fail -- `assert <always False> or True`"
    where: "tests/test_book_interior_type_floor.py::TestInteriorType_TheClueDigitMarkIsTheWritersOwn::test_the_tag_the_reader_expects_is_the_tag_the_writer_emits (def at :1717), the assert spanning :1726-:1729"
    measured: >-
      The statement is
      `assert book_vector.CLUE_DIGIT_TAG in frozenset({name for name in dir(book_vector) if True}) or True`.
      Two independent defects in one line: (a) the trailing `or True` makes
      the whole assertion unconditionally true, and (b) its left operand is
      ALWAYS False anyway -- it tests the tag's VALUE ("ClueDigit") for
      membership in the set of book_vector's ATTRIBUTE NAMES (which contains
      "CLUE_DIGIT_TAG", not "ClueDigit"); evaluated on the shipped module, it
      is False. The `if True` in the comprehension is a third tell. The
      trailing comment says "the constant exists; the equality above is the
      claim", which is an accurate description of a line that should then not
      have been written.
    why_it_matters: >-
      This is the exact shape -- an assertion that reads as a check and is
      not one -- that this board has spent the week removing, shipped inside
      the card whose thesis is that a provenance claim must be checkable
      rather than merely stated. The two assertions around it are real and
      carry the test, so nothing is UNcovered; what is wrong is that a dead
      assertion is in the tree under a true-sounding name.
    fix: "Delete the statement. The real claim is the line above it and the source check below it."

  - id: F-004
    severity: medium
    confidence: high
    source: review
    title: "Two test names now state the contract this card REVERSED, and keeping them is literal G-6 compliance, not honest G-6 compliance"
    where: >-
      tests/test_book_interior_type_floor.py::TestInteriorType_TheStreamArmIsReached::test_a_vector_puzzle_page_refuses_rather_than_reading_its_clue_digits
      (def at :1262) and ::test_a_vector_answer_page_refuses_too (def at :1297)
    ruling: >-
      THEY SHOULD NOT KEEP THEIR NAMES. The round's defence is that "the page
      is refused rather than read" is still true. It is true only of the
      MUTATED page the test builds (_no_clue_digit_mark, def at :771). Of the
      page this card actually ships, the opposite is true and is the card's
      headline: a vector puzzle page is now READ, and its clue digits are read
      as clue digits. A name that is true only under the test's own mutation
      is a name about something else.
      The cost is not hypothetical and not local: CON-020's trace.yml row is
      `status: covered` at ERROR severity, and a reader auditing which tests
      verify CON-020 now meets a test called "a vector puzzle page refuses
      rather than reading its clue digits" as a live member of that
      verification. That reader will conclude the stream arm still refuses.
      This board's memory rule "attribute by test, not by file" exists because
      names are what people resolve claims against.
      G-6 forbids a test being "deleted, renamed, skipped or merged" -- its
      purpose is that coverage cannot vanish behind an edit, which a DECLARED
      rename with a node-id delta does not do. The round was right to keep
      them unilaterally and right to say so in both docstrings; it should also
      have raised the conflict for an owner decision, which is what G-5 asks
      for in the parallel case ("say which before re-recording anything").
    fix: >-
      Owner decision. Recommended: rename both in a follow-up with the node-id
      delta declared explicitly (2 renamed, +0/-0 net) -- e.g.
      ..._a_vector_puzzle_page_WITH_NO_MARK_refuses... . If the owner holds
      G-6 absolutely, then at minimum trace.yml's CON-020 note should name
      which of the class's tests assert the missing-mark refusal, since
      trace.yml is where the names are consumed.

  - id: F-005
    severity: low
    confidence: high
    source: mutation
    title: "The negative control's headline 46/47 is a one-module reading presented as the whole measurement"
    where: "the card's 'Implementation' section; the four risers are in two modules"
    measured: >-
      Floor module alone: 1 failed / 46 passed, riser =
      test_the_mark_reaches_the_written_file_and_not_the_rendered_page (def at
      :1737). EXACTLY as published. Whole 733-test radius: 4 failed / 729
      passed. The three extra risers are
      tests/test_book_puzzle_page_vector.py::TestPuzzlePage_CarriesNoImageXObject::test_the_operator_alphabet_is_closed_at_what_this_page_draws,
      ::TestPuzzlePage_TheSharedPagesAreNotMutated::test_every_page_of_the_shared_corpus_still_matches_its_layout
      and ::test_the_operator_count_holds_on_a_page_of_many_widths -- the last
      two being the MARKED_CONTENT_OPERATORS = 2 derivations (:2376) this card
      itself added.
    verdict_on_the_division: >-
      THE DIVISION IS CORRECT. All four risers are operator-economy or
      operator-count claims; no AC-bearing test rises on a differently-right
      drawer, and no OTHER test should have risen. The economy assertion is a
      legitimate separate claim rather than a performance preference, because
      MARKED_CONTENT_OPERATORS feeds an EXACT derivation of the page's whole
      operator list (`len(stream.operators) == len(expected) + _state_operators(...)`),
      not a budget.
    why_it_matters: >-
      The second commit "states the division" in ONE of the four places that
      rises. The other three carry names that read as correctness claims about
      the page, so a future card that legitimately wants to spend the
      operators will meet three reds whose docstrings do not say they are
      economy. And the published 46/47 understates this card's own coupling to
      a second module by a factor of four.
    fix: "A one-line pointer in the two MARKED_CONTENT_OPERATORS-derived tests saying that a per-digit mark is differently-right and reds here by design; and restate the figure as 4/733, not 1/47."

  - id: F-006
    severity: low
    confidence: high
    source: mutation
    title: "The chokepoint guard watches CALLS in one hand-chosen directory; a raw operator append is outside it"
    where: "tests/test_book_interior_type_floor.py::TestInteriorType_TheClueDigitMarkIsTheWritersOwn::test_only_the_clue_digit_drawer_emits_the_mark (def at :1691); SOURCES at :1657; _enclosing_functions at :1660"
    measured: >-
      Two gaps, both measured. (1) SCOPE: SOURCES globs
      src/nonogram/admin/*.py, non-recursively. Measured gap TODAY: 0 -- every
      file in src/ that names ContentStream is in that flat directory. The
      scope is nonetheless hand-chosen rather than derived from where
      ContentStream is used, so a vector writer placed anywhere else is
      outside the guard silently. (2) MECHANISM: the walk finds ast.Call nodes
      named begin_marked/end_marked. M16 planted
      `stream._operators.append('/ClueDigit BMC')` in book_answer_vector --
      a mark emitted with no such call -- and this guard did NOT red. The
      forgery was caught (2 reds) only because AC-3's _no_clue_digit_mark
      patches the two ContentStream methods and therefore cannot suppress a
      raw append, so the refusal failed to fire. That is an incidental catch
      by a different instrument, not the chokepoint doing its job.
    why_it_matters: >-
      ADR-0039/R2 wants an enumerable authority. The guard IS derived from
      disk (not a hand-written emitter list, which is what this board has been
      correcting all week) and its expected value is an exact set equality
      with a non-emptiness guard -- that part is right and should be said so.
      What is hand-written is the directory and the assumption that the only
      way to emit the tag is to call the method. `_operators` is private, so
      the second gap is small.
    fix: >-
      Two cheap hardenings in the same test: assert that the walked file set
      covers every file under src/ whose text names ContentStream (today: 0
      difference, so it starts green and stays honest), and add a text check
      for a literal 'BMC'/'EMC' outside book_vector.py.

  - id: F-007
    severity: low
    confidence: high
    source: mutation
    title: "The round's correction #5 mis-states its own hazard: the test would have gone RED, not silently vacuous"
    where: "tests/test_book_interior_type_floor.py::TestInteriorType_TheStreamArmIsReached::test_lifting_a_declaration_makes_the_stream_arm_read_that_page (def at :1173)"
    measured: >-
      M18 reverts the wrapper to the pre-card pdf_vector.type_sizes, which is
      exactly the state the round says would have been vacuous. Result: 1
      FAILED. The test's assertion is `assert len(asked) == 1`, so an arm that
      never called the wrapped reader fails loudly. The test is fail-closed.
    why_it_matters: >-
      The fix is real and the test can still fail -- both of the brief's
      questions answer YES. But the card and the round's report describe a
      hazard ("the wrapper would have recorded nothing AND THE TEST WOULD HAVE
      CLAIMED THE ARM WAS NEVER REACHED", listed under "silently vacuous")
      that does not exist: the test would have said so out loud. On a board
      whose week is about claims matching their measurement, a self-correction
      that overstates the danger it caught is worth correcting in turn.
    fix: "Restate it: 'one existing test would have gone RED, correctly, because its wrapper no longer sat on the function the arm calls; the body was updated under the same name.'"

  - id: F-008
    severity: low
    confidence: high
    source: static
    title: "AC-2's docstring describes a plant it does not make"
    where: "tests/test_book_interior_type_floor.py::TestInteriorType_TheStreamArmIsReached::test_a_body_face_at_the_clue_digit_size_is_reported (def at :1361)"
    measured: >-
      The docstring says the body face is set "through the same
      ContentStream.text primitive the band and the folio use". The body
      appends a raw operator row:
      `stream = f"{clean}\n0 g BT /F1 {planted} Tf 100 100 Td (8) Tj ET"`.
      ContentStream.text is not called.
    why_it_matters: >-
      The plant is FINE -- it is outside every bracket, at a size READ OFF THE
      PAGE (`planted = min(digits)`) exactly as claimed, which is the part
      that matters and which I verified reproduces (M1 reds it). Only the
      sentence about how it is spelled is wrong. It also quietly weakens the
      test by one notch: a hand-written row does not prove the production
      primitive emits an unmarked face.
    fix: "Either say 'appended as a raw text row' or build it with ContentStream.text, which would also make the claim true."

  - id: F-009
    severity: low
    confidence: high
    source: static
    title: "A dead local and a docstring that describes a mechanism the body does not use"
    where: "tests/test_book_interior_type_floor.py::TestInteriorType_TheClueDigitMarkIsTheWritersOwn::_enclosing_functions (def at :1660)"
    measured: >-
      `stack: list = []` at :1670 and `del stack` at :1688, with nothing
      between them touching it. The docstring says the enclosing def is
      "resolved by walking the tree with a parent trail"; the body threads an
