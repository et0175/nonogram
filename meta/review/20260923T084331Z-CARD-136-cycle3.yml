    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2791
    title: "Print setup shows the raw column while Finalise shows it re-derived through mm"
    description: |
      _trim_cm renders `f"{spec.width_mm / 10:.2f}"` (app.py:2791) while Print setup's
      prefill shows the raw stored string (`book.trim_width_cm or DEFAULT`,
      app.py:2091-2092). For every value the route itself can store the two agree —
      create_spec formats to two decimals (print_specs.py:163-164) — but a legacy row
      holding e.g. "15.2" renders "15.2" on Print setup and "15.20" on Finalise. The
      card's whole point is that the two screens report one trim, so the one-format
      reading is worth making literal.
    suggestion: |
      Have _stored_trim_cm normalise through the same two-decimal form _trim_cm uses
      (or have both read book_page_spec), so the two screens cannot diverge on a
      legacy row either.
