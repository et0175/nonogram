    file: meta/kanban/cards/CARD-136.md
    line: 213
    title: "The blank-trim guard also refuses a trim-less plan submission — declared in the docstring, absent from the card's handover"
    description: |
      _blank_trim_error treats an absent `width`/`height` key exactly like an empty one,
      so a POST carrying only the plan fields — which before this card saved the plan and
      defaulted the trim to the Book 1 profile — is now refused whole and stores neither
      half. Probed: POST unit=cm with no width/height keys and plan_count=120 → 200, plan
      unchanged at 150, trim unchanged. That is the right call (it is the same rule the
      route already applied to a refused trim, and the template always renders both fields
      with `required`, so no browser path exists), and setup_print's docstring states it.
      It is not in the card's `## Worktree notes` handover, which is where the next card
      looks for behaviour this card changed outside its AC.
    suggestion: |
      One line in the card's handover: a Print setup POST with no trim fields is now a
      refused submission, not a request for the profile defaults.
