    title: "set_print_spec's ValueError text reaches the owner naming an internal column"
    description: |
      set_print_spec raises `ValueError("a book's trim_width_cm must be a finite number
      of cm, not 'nan'")`, and setup_print's outer `except ValueError as e` renders it
      verbatim as a flash. Reproduced through the real route (memory mode):
        POST unit=cm width=nan height=22.86 -> 200, columns unchanged,
        page shows "Error: a book's trim_width_cm must be a finite number of cm, not 'nan'"
      (inf / 1e400 / 0x10 are all refused with the validator's own wording instead, so
      only the non-finite branch surfaces this). The behaviour is right — nothing is
      stored, which is exactly what cycle 1's F-001 gate was added for — and no browser
      can produce it (type="number" rejects "nan"). Only the wording is internal: the
      owner is shown a storage-layer column name and a Python repr.
    suggestion: |
      Give the non-finite branch the same owner-facing voice the other refusals have,
      e.g. "Trim width must be a number of centimetres"; keep the column name in the
      exception chained underneath or in the log.
