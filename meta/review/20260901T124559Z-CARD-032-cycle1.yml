  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/pdf.py
    line: 282
    title: "The retained justification for the stroked separator rests on a typographic claim that does not hold for an outline font"
    description: |
      `_draw_header`'s rewritten docstring is now the sole standing justification for
      keeping the separator stroked once the ASCII-subset necessity is gone (G-2 is the
      other half). It argues:

        "…the stroke's length, weight and the air around it are fixed fractions of the
        type size (:data:`_RULE_LENGTH_RATIO` and friends), so the separator looks the
        same at every size the fitting below can pick, which a glyph's own advance width
        does not guarantee."

      A scalable outline glyph's advance is also a fixed fraction of the type size: at
      size 40 the bundled face reports `getlength("—") == 40.00`, exactly 1.0 em, i.e.
      precisely as linear in size as `size * (_RULE_LENGTH_RATIO + 2*_RULE_GAP_RATIO)`.
      Meanwhile the stroke's own weight is `max(1, round(size * _RULE_WEIGHT_RATIO))`
      (line 330) — clamped and rounded, so it is the *stroke* that stops scaling linearly
      at the small end of the fitting range (`_MIN_HEADER_FONT_RATIO`), not the glyph.

      This is not a behavioral defect — the code does what it says — but the claim is
      unsubstantiated and, on the weight axis, inverted, in a codebase where a docstring
      is held to be true and where this particular docstring exists to stop a future
      contributor "simplifying" the separator back to a glyph.
    suggestion: |
      Either drop the advance-width clause and rest the justification on G-2 alone
      ("the card changes the face and nothing else about the header; turning the rule
      back into a glyph is a separate, deliberate change to the page"), or replace it
      with a claim that survives checking (grid-fitting/hinting at small ppem, if that
      is what was meant — and say so).
    confidence: medium
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: "068f419"
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/export/pdf.py
    line: 154
    title: "The 'raises rather than falls back to load_default' contract is asserted only in prose — no test pins it"
    description: |
      CARD-032's implementation notes and `_font_bytes`'s docstring (lines 154-158) both
      state that a missing or unreadable resource must raise rather than be papered over
      with `ImageFont.load_default`, "silently reinstating [which] would reproduce the
      tofu it exists to fix while reporting success."

      Today that holds by construction — `_font_bytes` has no `try`/`except` — but nothing
      in the suite would fail if someone added one. Grepped tests/: the only occurrences of
      `load_default` are in the two comparison tests (lines 498, 547), which use it as a
      *reference face*, and `_font_bytes` is called once (line 647) purely to check the TTF
      magic bytes. There is no test for the missing-resource path and no `cache_clear()`
      anywhere in the suite.

      This is the one designed error path the card names explicitly, and it is exactly the
      regression the card was written to prevent, so it is worth a pin.
    suggestion: |
      Add a test alongside `test_the_font_ships_as_package_data_and_not_as_a_dependency`:

        def test_a_missing_bundled_font_raises_instead_of_falling_back(monkeypatch):
            pdf._font_bytes.cache_clear()
            pdf._header_font.cache_clear()
            monkeypatch.setattr(pdf, "FONT_RESOURCE", "fonts/NotAFont.ttf")
            try:
                with pytest.raises(FileNotFoundError):
                    pdf._font_bytes()
            finally:
                pdf._font_bytes.cache_clear()
                pdf._header_font.cache_clear()

      (The cache_clear pair on both sides matters: `_font_bytes` is `lru_cache(maxsize=1)`
      and would otherwise serve the real bytes, and would leave the fake resource's failure
      uncached but the real bytes evicted for later tests.)
    confidence: high
