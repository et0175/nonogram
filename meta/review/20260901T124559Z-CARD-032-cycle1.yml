  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/export/pdf.py
    line: 166
    title: "A rendered PDF page now mixes two typefaces (DejaVu header, Pillow default clue digits) and nothing says so"
    description: |
      `render_pages` builds both pages from `png.render_image` (pdf.py:373), whose
      `_draw_clues` uses `png._clue_font` → `ImageFont.load_default(size=…)`
      (png.py:69-79). Only the header moved to the bundled face, so every PDF this
      tool now writes sets its title in DejaVu Sans and its clue digits in Pillow's
      embedded Aileron.

      Leaving png.py alone is the correct call: it is outside the card's `Touches`, clue
      digits are ASCII decimal digits so no tofu is possible there, and `png._clue_font`'s
      own rationale (host-independent output) is untouched and still true. The problem is
      only that the consequence is stated nowhere — not in the module docstring's "Why a
      font ships inside this package" section, not in the card's worktree notes, not in
      meta/kanban/backlog.md (whose Wave-8 entry, lines 16-25, is the only place this
      subject is tracked and still describes the pre-card state).

      `_header_font`'s docstring makes it slightly worse than silent: "The bundled face and
      not a system one, for the reason ``png._clue_font`` documents" invites the reader to
      assume the two functions are now aligned, at exactly the moment they diverged.
    suggestion: |
      One sentence in pdf.py's module docstring, e.g. after the "coverage is now the
      boundary" paragraph: "Only the header moved. Clue digits still come out of
      ``png._clue_font``'s Pillow default face (they are ASCII decimal digits, so nothing
      there can tofu), which means a page now carries two typefaces — deliberate, and
      outside this card's Touches." Then either a backlog entry for unifying the two, or
      an explicit note that the mix is accepted.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "068f419"
