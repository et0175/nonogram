  - id: F-006
    severity: info
    category: tech-debt
    type: question
    file: tests/test_export_pdf.py
    line: 642
    title: "Substring heuristic `assert \"font\" not in ...dependencies` is near-tautological"
    description: |
      `test_the_font_ships_as_package_data_and_not_as_a_dependency` ends its
      dependency-side assertion with a substring scan of the joined dependency list for the
      literal "font". It can only ever catch a package whose *name* contains "font"
      (fonttools, fonts-*), and cannot catch reportlab, fpdf, or matplotlib — the realistic
      ways a font could arrive as a dependency.

      Not a defect: the real pin lives in `test_the_dependency_baseline_is_still_closed`
      (`packages == {"pillow", "numpy"}`), which is exact and would catch all of them, so
      the substring line is redundant rather than misleading. Noted only because the
      docstring above it ("it must have arrived without touching the installed dependency
      set") is carried by the *other* test, not by this line.
    suggestion: |
      Either drop the line, or replace it with the same exact set comparison so the test's
      docstring is carried by the test's own body.
