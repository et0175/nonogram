findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/export/pdf.py
    line: 54
    title: "Module docstring names Arabic and Hebrew as scripts that 'still render as tofu' — the bundled DejaVu Sans covers both"
    description: |
      The module docstring (lines 51-55) states:

        "A name written in a script it does not cover — Chinese, Japanese, Arabic,
        Hebrew — still renders as tofu, by exactly the same mechanism one layer down."

      Two of the four named scripts are wrong. Re-derived against the file this card
      actually shipped (src/nonogram/export/fonts/DejaVuSans.ttf, sha256
      7da195a7…, DejaVu 2.37), using the diff's own `.notdef`-comparison technique at
      size 40 against U+FFFE:

        Hebrew   א U+05D0  COVERED (advance 27 vs notdef 24)
        Arabic   ب U+0628  COVERED (advance 38 vs notdef 24)
        Chinese  猫 U+732B  TOFU    (advance 24 == notdef 24)
        Japanese ね U+306D  TOFU
        Korean   가 U+AC00  TOFU
        Thai     ก U+0E01  TOFU
        Devanagari क U+0915 TOFU
        (Greek α, Armenian ա, Georgian ა all COVERED)

      This codebase holds docstrings to be true, and this is the one docstring the card
      explicitly mandated ("Say so in the module docstring rather than implying full
      Unicode support" — CARD-032 "What this does not fix"). It does not overclaim, it
      *underclaims*, but it is a false statement of a checkable fact in the exact place
      the card put the honesty obligation.

      There is a real limitation hiding behind the wrong one, and the corrected text
      should state it instead: Pillow 12.3.0 in this venv reports `features.check("raqm")
      == False`, so there is no complex-script shaping and no bidi. A Hebrew name would
      set right-to-left characters in left-to-right order; an Arabic name would set
      isolated, unjoined letterforms. Those names do not tofu — they render *wrongly*,
      which is a different and more surprising failure than the one the docstring
      currently describes.

      ADR-0006's "Negative (2026-09-01 revision)" bullet and CARD-032's "What this does
      not fix" carry the same four-script list, so the error originates upstream of the
      diff; the docstring is where it becomes a code-level false claim.
    suggestion: |
      Replace the example list with scripts verified absent from the shipped file —
      Chinese, Japanese, Korean, Thai, Devanagari — and add one sentence for the
      shaping/bidi gap, e.g.:

        "A name written in a script it does not cover — Chinese, Japanese, Korean,
        Thai, Devanagari — still renders as tofu, by exactly the same mechanism one
        layer down. And coverage is not the only boundary: Pillow is built without
        Raqm here, so the scripts DejaVu *does* cover but that need shaping or bidi
        (Arabic, Hebrew) set as unjoined, left-to-right letterforms rather than as
        tofu — wrong in a different way, not fixed by this card."

      Consider a follow-up note on ADR-0006's revision bullet and the card so the
      upstream prose stops propagating the wrong list.
    confidence: high
    source: static
    violates: null
