  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/orchestrator.py
    line: 1874
    title: "The empty-batch message reads as the general all-failed path but can only ever print count 1 or 2"
    description: |
      For `puzzles` to be empty at the loop's end, every slot must have
      abandoned *and* the consecutive counter must never have reached 3 — but
      with no successes the counter never resets, so it reaches 3 at the third
      slot. The exit is therefore unreachable for `count >= 3`, confirmed by
      the measurement in F-001.

      The message says "no puzzle in a batch of {count} ... every candidate was
      abandoned", which reads as the answer for a batch of any size. The admin
      never reaches it at all: `create_batch` requires count 10-200 for random
      batches. A reader debugging a failed 50-puzzle batch will look for this
      message and never find it.
    suggestion: |
      Say what it is: "a batch of 1 or 2 that produced nothing" — or restructure
      so the consecutive check runs after the loop as well, making this the
      general exit it reads as. The first is a comment; the second is a design
      choice worth stating either way.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 5900515
    dismissed_reason: null
    fix_note: |
      the empty-batch exit carries a comment saying it is reachable only below MAX_CONSECUTIVE_ABANDONMENTS and why, and the message says 'this batch' rather than implying generality
    learned_pattern: null

