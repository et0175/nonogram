  - id: F-001
    severity: medium
    category: tech-debt
    type: bug
    file: src/nonogram/orchestrator.py
    line: 1874
    title: "The empty-batch refusal drops the candidate's cause — the same defect CARD-080 F-008 fixed, on the other branch of the function that fixed it"
    description: |
      The consecutive-bound exit chains the candidate's own abandonment
      (`... from abandonment`) and the card says so explicitly, citing
      CARD-080's F-008 as the reason. The empty-batch exit twelve lines later
      does not:

        raise GenerationAbandoned(
            f"no puzzle in a batch of {count} could be made uniquely solvable; ..."
        )

      Measured, with every candidate abandoning:

        count=1   -> empty-batch        __cause__: None
        count=2   -> empty-batch        __cause__: None
        count=3   -> consecutive-bound  __cause__: GenerationAbandoned
        count=10  -> consecutive-bound  __cause__: GenerationAbandoned

      So a caller who asks for one or two puzzles and gets none loses what the
      pipeline actually said — which is precisely the forensic loss F-008 was
      filed for, in the same session, in a commit whose own message cites that
      lesson.
    suggestion: |
      Keep the last abandonment and chain it: hold the exception from the
      `except` block in a local (`last_abandonment`) and
      `raise GenerationAbandoned(...) from last_abandonment`. One line, and it
      makes the two exits consistent instead of one carrying the lesson and
      one not.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 5900515
    dismissed_reason: null
    fix_note: |
      both exits now chain the candidate's abandonment via a `last_abandonment` local; test_both_exits_chain_the_candidate_s_abandonment parametrizes count 1, 2, 3, 10 so it spans the boundary between the two exits. Mutants R1 (from-clause dropped) and R2 (the abandonment never captured) both KILLED
