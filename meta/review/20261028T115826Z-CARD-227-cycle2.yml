findings:

  - id: F-012
    severity: minor
    gating: false
    confidence: high
    source: static
    type: gap
    title: >-
      "four call sites ... every raster grid stroke the book can reach" is wider
      than the mechanism — _draw_solved_slot strokes grid rules onto a bitmap at
      two more sites, guarded only by sharing its GridLines with the call above
    file: src/nonogram/admin/book_pdf_generator.py
    line: 5743
    claim_quoted: >-
      ADR-0037 History: "the mechanism is layout.refuse_rasterised_rule, called
      per rule at **four call sites in three functions**, which is every raster
      grid stroke the book can reach". book_page_spec.py:190: "called at every
      raster grid stroker that a sheet carrying them can reach".
      layout.PageSpec.grid_rules and the test class docstring carry the same
      sentence.
    what_is_true: >-
      _draw_solved_slot (book_pdf_generator.py:5638) calls _stroke_drawing(draw,
      slot) at :5739 — which is guarded — and then strokes the grid AGAIN at
      :5743 and :5753, in grey over the filled cells, reading
      slot.vertical_lines[c].width and slot.horizontal_lines[r].width directly.
      Those two draw.line calls are raster grid strokes and they do not go
      through refuse_rasterised_rule. They are harmless TODAY because the pair
      they stroke is the same (width, width_pt) pair _stroke_drawing checked four
      lines earlier, and packed solved slots do carry declared weights
      (_slot_layout passes rules=page_spec.grid_rules). So the substance of AC-7
      — a declared figure cannot reach a bitmap — still holds. The count and the
      word "every" do not.
    evidence: |
      $ grep -rn "refuse_rasterised_rule(" src/
      src/nonogram/admin/book_pdf_generator.py:1646   # _stroke_drawing, lines
      src/nonogram/admin/book_pdf_generator.py:1656   # _stroke_drawing, frame
      src/nonogram/export/png.py:216                  # _draw_grid, lines
      src/nonogram/export/png.py:251                  # _draw_frame
      $ sed -n '5739,5757p' src/nonogram/admin/book_pdf_generator.py
              _stroke_drawing(draw, slot)          # <- guarded
              for c in range(1, slot.columns):
                  width = slot.vertical_lines[c].width      # <- NOT re-checked
                  ...
                      draw.line([(x, ys[r]), (x, ys[r+1])], fill=_SOLVED_GRID_GRAY, width=width)
              for r in range(1, slot.rows):
                  width = slot.horizontal_lines[r].width    # <- NOT re-checked
                  ...
      # and those slots DO carry declared weights:
      # tests/test_book_grid_rules.py's new three-arm test asserts
      #   {line.width_pt for line in slot_lines} == {CELL_PT, FIFTH_PT, BORDER_PT}
    why_not_gating: >-
      No hole: the pair is checked, once rather than twice, by the call four
      lines above in the same function. This is the same defect SHAPE cycle 1's
      F-001 named (a stroker a completeness sentence did not account for) without
      its substance (that one was genuinely unguarded and received the figures).
    fix_shape: >-
      One sentence, in the four places that carry it: say "four call sites in
      three functions — every place a declared pair is first stroked; the solved
      page's grey re-stroke at book_pdf_generator.py:5743/5753 re-uses the pair
      _stroke_drawing has already checked", or move the guard into those two
      loops as well. The second is a code change and would be a fifth and sixth
      call site; the first is accurate as it stands.

  - id: F-013
    severity: minor
    gating: false
    confidence: high
    source: static
    type: risk
    title: >-
      F-007's fix moves the coincidence out of the reach arm and into an
      assertion, so the brittleness it named is relocated rather than removed —
      and "recorded rather than relied on" is not true of an assert
    file: tests/test_book_puzzle_page_vector.py
    line: 1742
    claim_quoted: >-
      "The coincidence itself is recorded rather than relied on." (docstring),
      above `assert twin.case.layout.thin_rule == counts[1] == 3`.
    what_is_true: >-
      The reach arm itself IS now independent — `twin.case.layout.thin_rule in
      inked` is keyed on a width the page inks for a reason unrelated to the
      declared figures, which is exactly what F-007 asked for. But the very next
      statement asserts the coincidence, so the defect F-007 described — "on a
      book whose thin rule fitted to 4 px the arm would have reddened with
      nothing wrong" — still reds this test, two lines further down. A statement
      that fails the suite when it stops being true is being relied on for green;
      "recorded" is what a comment does.
    note: >-
      Pinning the coincidence so that the paragraph above it cannot go quietly
      stale is a defensible choice. Only the sentence claiming it is not relied
      on is wrong.
    fix_shape: >-
      Either demote the assertion to a comment, or keep it and say what it is:
      "this assertion deliberately reds if the fitted cell ever changes, so the
      paragraph above cannot go stale" — one sentence, no code change.

