# ---------------------------------------------------------------------------
round_1_survivors_independent_read:
  M14_the_scoped_negative_inference:
    the_claim: '''"a scoped negative is unsound here", so round 1 is quoted for positives only and no negative from it is cited.'''
    verdict: SOUND, and applied CONSISTENTLY.
    why_sound: >-
      tests/README.md states it from the other side: a surviving mutant and a
      never-reached assert are indistinguishable in a test-level reading, and
      the Runner refuses an exit code of 2/3/4/5 precisely because such a run's
      matrix is all-NOT-REACHED and FAIL-free -- the shape of a mutant every arm
      survived. Under a one-nodeid selection a mutant that kills elsewhere in
      the class reads SURVIVED. My own RECORDING run reproduces the hazard from
      a third direction: pytest exited 0 on BOTH mutants while the matrix
      recorded 1 FAIL each. A test-level reading of that run would have called
      both mutants survivors.
    consistency_audit: >-
      I checked whether the rule was applied only where it rescued a mutant. It
      was not. Every figure quoted in the notes is either a positive (RED) or an
      in-process analyser measurement taken without a pytest selection at all --
      the 23/6/7 equalities, the 816/0, the 51 -> 0, the 14-of-18. No
      mutant-scoped negative stands anywhere in the card's evidence. The 13
      REDs from round 1 remain sound because they are positives.
  M15_setter_only:
    verdict: DIAGNOSIS CORRECT by reading. The setter is `opaque.setdefault((storage, spelling), ...)` and the lookup is `key = ("a local name"|"an attribute", spelling)`. Changing one side alone cannot conflate the storages -- it makes every lookup miss, which DISABLES the arm. A mutant doing something other than its name, exactly as recorded. M15b (both sides) is the right correction.
  M16_label_only:
    verdict: >-
      DIAGNOSIS CORRECT, and self-indicting in the right way: both sides of
      test_the_declared_blind_spots_are_still_exactly_these read the row's
      label, so a label-only mutant is invariant. That IS CARD-206's F-302
      reproduced in the author's own instrument, and reporting it is a credit.
      I extend it: the same shape is in the SHIPPED assertions (F-407), not
      only in the mutant.

