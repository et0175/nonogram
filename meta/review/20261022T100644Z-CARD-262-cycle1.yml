# ---------------------------------------------------------------------------
positives_verified_independently:

  - claim: 816 calls in the generator, all syntactic names
    method: >-
      re-derived by two methods independent of ast.walk -- an ast.NodeVisitor
      subclass and a hand-written recursion over each node's _fields.
    observed: 816 and 816; zero calls whose func is neither Name nor Attribute
    verdict: REPRODUCES exactly, in both the figure and the claim it supports

  - claim: 23 geometry-door calls in src/, 17 inside the generator, 6 outside, 1 non-trivial (book_proof.py:767)
    counting_rule_stated_before_counting: >-
      a door call is one ast.Call whose func is an ast.Attribute with .attr in
      ("page_spec", "book_page_spec") or an ast.Name with .id in the same.
      Nothing in a comment, docstring or string literal counts. A def of that
      name counts only if it is also called.
    observed: 23 total; 17 inside; 6 outside (app.py 4190/4264/4283, book_kdp.py:588, book_manager.py:1126, book_proof.py:767); 1 non-trivial
    verdict: REPRODUCES exactly. **17 is right.**
    the_17_vs_18_delta_reconciled: >-
      The card reported the delta and deliberately did not reconcile it, which
      is defensible for a figure outside its own subject -- but it ships
      `inside == 17` as an asserted denominator, so one number is pinned. It
      reconciles in one line: the generator holds 17 door CALLS plus exactly 1
      door DEFINITION (`def page_spec` at book_pdf_generator.py:4036). 17 + 1
      = 18. CARD-206 cycle 2 counted OCCURRENCES of the door names in callee-ish
      position; this card counts CALLS. Under the stated rule 17 is correct and
      the predecessor's 18 is not, and the +1 is the def, not a comment, a
      docstring or a string literal.

  - claim: W3's operator.methodcaller row is killed by the guard's own assertion, not by production raising NameError for an unimported operator
    method: inspected the planted text and ran the analyser with each arm combination
    observed: >-
      "import operator" is ABSENT from the planted text; the module is only
      ast.parse'd and never imported or exec'd anywhere in the class; with both
      arms the row yields 2 refusals, one from each arm -- door spelling:
      'a geometry door name spelled in Constant.value' at the plant line;
      callee identity: 'a callee this walk cannot anchor: a local name bound to
      an expression at line 6718'. With arms=("callee identity",) -> 1 refusal;
      with arms=("door spelling",) -> 1 refusal; with arms=() -> 0 refusals.
    verdict: CLAIM HOLDS. Not the vacuity shape. This is the cleanest piece of evidence in the hand-back.

  - claim: the two arms are not one mechanism written twice
    observed: removing "callee identity" leaves 8 rows silent; removing "door spelling" leaves 1 (W9). Each arm carries a shape the other misses.
    verdict: HOLDS (the control that proves it is a floor -- F-403)

  - claim: '"14 of 18 rows fall silent with both arms removed", asserted as an equality'
    floor_check: >-
      It is a LABEL-LIST equality (`reproduced == list(SILENT_WITHOUT...)`)
      plus `len(kept) == 4`, not a count. It cannot be satisfied by the arms
      doing less on those rows, because the WITH-arms test
