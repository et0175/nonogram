what_the_next_cycle_must_decide:
  - >-
    Whether axis 2 is CLOSED or DECLARED. Those are the only two honest
    options, and the card's own AC-4 already provides the second one. Inverting
    the arm's default to deny is a genuine closure but will refuse real calls
    (parameters, builtins, imported functions) and its cost must be MEASURED on
    this module before it is chosen -- the 51 -> 0 measurement is the precedent
    for how to make that decision.
  - >-
    If DECLARED is chosen instead: the silent class needs a named ADR-0039/R3
    exemption whose control is this reviewer's Q1/Q2/P1 (asserted SILENT, in
    MEASURED_BLIND_SPOTS, so narrowing it reds), not a table row -- and both
    docstrings' "Closed" must become "Closed on callees with a spelled binding
    occurrence".
  - >-
    Either way the ast.Name branch belongs in the referenced-without-called
    arm: the imported door having no such arm while the method door has one is
    an asymmetry with no argument behind it, and Q1 is a two-line real-world
    shape.

