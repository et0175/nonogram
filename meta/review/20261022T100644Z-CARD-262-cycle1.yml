    11 skipped, 0 failed) is what stands in for it, and it reproduces the
    implementation's own gate exactly.
  - >-
    Whether the 51-refusal figure for the one-shared-table design is right. It
    was derived in a scratchpad prototype that is not committed, so there is
    nothing to re-run. The 0 on the shipped keying IS asserted in the suite and
    I re-derived it (refusals == [] on the shipped module), which is the half
    that matters. On the brief's question -- does a colliding spelling buy an
    attacker silence? -- measured: NO for a local (P4 refuses, because a local
