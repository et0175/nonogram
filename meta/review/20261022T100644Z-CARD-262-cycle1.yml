    control_plants_that_DID_refuse:
      - id: Q4
        shape: '''_d = self.page_spec (the METHOD door)'''
        outcome: ('refusal',) -- 'a geometry door referenced without being called'
        note: the asymmetry that isolates defect (2)
      - id: P3
