findings:

  - id: F-401
    severity: Critical
    title: >-
      The DOOR axis is not closed. The callee-identity arm fails OPEN for a
      callee with no binding occurrence, and the "referenced without being
      called" arm ignores ast.Name doors -- so F-301's exact signature
      reproduces on the shipped code.
    ac: AC-2, AC-3; ADR-0039/R2
    root_cause: >-
      Two independent fail-open defaults in one axis.
      (1) The callee-identity arm builds `opaque` as a POSITIVE table: it walks
      ast.Name / ast.Attribute store contexts, skips any binder not in
      BINDERS_READ (`if shape not in cls.BINDERS_READ: continue` -- a SILENT
      continue, where the position axis appends a refusal), and then refuses a
      call only `if key in opaque`. A callee whose name has NO binding
      occurrence under a BINDERS_READ shape is therefore anchored by default.
      The corrected SEMANTICS clause -- "every binding occurrence IN ITS OWN
      STORAGE holds a syntactic Name or Attribute" -- is VACUOUSLY TRUE for
      zero occurrences.
      (2) The pre-existing "a geometry door referenced without being called"
      arm is keyed `isinstance(node, ast.Attribute) and node.attr in doors`.
      It has no ast.Name branch, so the IMPORTED door `book_page_spec` has no
      referenced-without-called arm at all -- while the METHOD door
      `self.page_spec` does (W4). That isinstance keying is structurally the
      same shape F-301 was filed against.
    what_state_would_make_this_red: >-
      An arm that refuses a callee whose identity it cannot POSITIVELY anchor
      (default deny), rather than one that refuses only callees it has
      positively proved opaque; plus an ast.Name arm for a door referenced and
      not called.
    does_that_state_exist_today: No.
    plants: >-
      All authored by this reviewer (third author), all line-count-preserving
      against DERIVED_POSITION via the card's own `_plant`, all analysed in
      memory with nothing mutated on disk. SHIPPED analyser first: refusals ==
      [], 23 sites, 6 names -- so any refusal observed is the plant's.
    silent_plants:
      - id: Q1
        shape: '''_d = book_page_spec; _d(None, 3 + len(section))'''
        extra: none
        axis: STORAGE (ast.Name)
        outcome: () -- SILENT, 0 refusals
        note: >-
          No dynamic access whatsoever. A plain local alias of the imported
          door. This is W4 one storage over and it is the cheapest possible
          shape.
      - id: Q2
        shape: '''_bps(None, 3 + len(section))'''
        extra: '''from nonogram.admin.book_page_spec import book_page_spec as _bps'''
        axis: STORAGE (import alias)
        outcome: () -- SILENT, 0 refusals
        note: >-
          ("alias", "asname") is EXPLICITLY in DOOR_SPELLINGS_READ, i.e. the
          card whitelisted the exact field through which an import alias
          launders the door past both arms.
      - id: Q3
        shape: '''_bps2(None, 3 + len(section))'''
        extra: '''_bps2 = book_page_spec'''
        axis: STORAGE (module-level rebind to a new name)
        outcome: () -- SILENT, 0 refusals
      - id: P1
        shape: '''setattr(self, "_door", getattr(self, "page_" + _S)); self._door(3 + len(section))'''
        extra: '''_S = "spec"'''
        axis: STORAGE (attribute with no binding occurrence)
        outcome: () -- SILENT, 0 refusals
        note: >-
          W12 is this shape with the store SPELLED (`self._door = getattr(...)`)
          and it refuses. Replace the assignment with setattr -- the very idiom
