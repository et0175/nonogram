    verdict: HOLDS -- not a floor

  - claim: the three equalities red in both directions (AC-5)
    method: >-
      stronger than the card's M9/M10/M12/M13, which mutate the EXPECTED
      constant. I moved the MODULE instead: deleting the one derived position
      gives 22 sites (reds), adding two position bindings gives 25 (reds);
