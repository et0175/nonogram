        outcome: ('refusal',)
      - id: P7
        shape: '''__set_name__ installing the door with a SPELLED `owner._door = ...`'''
        outcome: ('refusal',)
    runtime_reachability_not_vacuous: >-
      Executed, not reasoned. P1, P2, P5 and P9 were each compiled and run in a
      minimal module whose page_spec records its argument: all four called the
      real door with 5, i.e. `3 + len(section)` for a 2-element section. Q1 was
      run against the real production function: `_d = book_page_spec;
      _d(None, 3 + len(section))` returns a PageSpec byte-equal to
      `book_page_spec(None, 5)`, parity=ODD -- the literal-derived position
      reaches the real geometry door and sets the page's parity and frame.
      P7/P8 are static-reachability probes at module level (the descriptor is
      never installed in the generator's class body), the same approximation
      the second author's X18/X27 made; I say so rather than claim more.
    f301_signature_reproduced:
      selection: the whole guard class, with P1 planted in memory
      observed:
        refusals: '[]'
        len_sites: '23'
        POSITION_SITE_COUNT: '23'
        vocabulary: identical to SHIPPED (6 names)
        _bare_literals: '[]'
        _outcome: ()
      note: >-
        This is cycle 3's F-301 reading, verbatim, on the card that was sliced
        out to close it. That makes the family streak 3, not 2.
    why_this_gates: >-
      AC-2 asks for the FAMILY (a door whose identity is not a syntactic name
      in the call position) to be read or refused, never silent. The four named
      shapes are refused; the class is not. The shipped class docstring says
      axis 2 is "**Closed**" and the SEMANTICS block says "a call whose
      callee's identity this walk cannot derive is REFUSED". Both are false as
      shipped. AC-3 asked for a stranger's plant: a stranger's plant went
      silent on the one axis the card exists to close, which the brief names
      in advance as the Critical case.
    the_prediction_it_falsifies: >-
      "on the ast.Name / attribute STORAGE axis your plant should be refused
      (the second author tried and failed)". Falsified by the plainest possible
      shape, Q1, which uses no dynamic access at all -- and by Q2, which the
      card's own DOOR_SPELLINGS_READ whitelists.
    smallest_honest_fix_direction: >-
      Invert the arm's default: refuse a callee unless it is POSITIVELY
      anchored (a name whose set of binding occurrences is non-empty and every
      member holds a syntactic Name/Attribute), and add the ast.Name branch to
      the referenced-without-called arm. Both are one-line polarity changes in
      the existing closures, not per-shape branches. Cost must then be
      measured: it will refuse real calls (every call to a parameter, every
      builtin, every imported function), so this is an arm-design decision, not
      a patch -- which is why it belongs to a cycle, not a fix-up.

  - id: F-402
    severity: Important
    title: >-
      AC-1's correction is incomplete: the corrected clause is vacuous, and the
      axis-2 sentence of the pre-code SEMANTICS block is still false.
    ac: AC-1
    judgement_on_leaving_the_original_visible: >-
      Right, and worth credit. A pre-code declaration quietly edited to match
      the shipped code is worth nothing, and [SEMANTICS correction] is the only
      reason this axis could be audited against a decision at all.
    what_the_correction_fixed: >-
      The STORAGE dimension. "Call.func is an ast.Attribute, OR an ast.Name
      whose every binding occurrence..." treated every attribute callee as
      self-evidently anchored; "in its own storage" removed that, and W12-W14
      prove it.
    what_it_did_not_fix: >-
      The VACUITY dimension. "every binding occurrence in its own storage holds
      a syntactic Name or Attribute" is TRUE when there are no binding
      occurrences, which is exactly Q1/Q2/Q3/P1/P2/P5/P8/P9. The hole moved one
      quantifier over instead of one storage over. The original clause and the
      correction share one shape: a universal over a set the arm builds
      positively.
    other_clauses_audited_against_what_shipped:
      - clause: door-spelling closure refuses a GEOMETRY_DOORS name in any (class, field) pair outside DOOR_SPELLINGS_READ
        verdict: TRUE as shipped (verified on W3's Constant.value refusal)
      - clause: each arm is individually removable (door_arms=) and each catches a shape the other misses
        verdict: 'TRUE as shipped (measured: 8 rows and 1 row respectively)'
      - clause: neither closure mentions getattr/setattr/methodcaller/attrgetter/vars
        verdict: TRUE in substance -- see positives; the wording is loose
      - clause: a call whose callee's identity this walk cannot derive is REFUSED
        verdict: FALSE as shipped (F-401)
      - clause: axes 3, 4 and 5 are SILENT by declaration, each with its own control
        verdict: TRUE as shipped (verified; see positives)
      - clause: PLANTED_SHAPES and the door table are regression nets, never completeness arguments
        verdict: TRUE, and the no-silent-row control exists and is real
    ac1_what_could_not_be_checked: >-
      That the SEMANTICS block was written BEFORE the first code commit is not
      independently verifiable from git: meta/ is excluded from a card's
      commits by procedure, so the block has no commit of its own to date. Its
      only evidence is the card's own statement plus the existence of
      [SEMANTICS correction], which is credible (an author matching prose to
      code would not have left the falsified clause standing) but not measured.
      I state that rather than score it either way.

  - id: F-403
    severity: Minor
    cluster: the controls that are floors where the card's own rule is equalities
    title: The per-arm control is a floor, and the door axis's "caught WITH" half rests on a single assertion node.
    detail: >-
      test_each_door_axis_arm_catches_a_shape_the_other_misses asserts only
      `assert silent` -- non-empty. Measured here: removing "callee identity"
      leaves 8 of 18 rows silent (W1, W5, W8, W12, W13, W14, W15, W16);
      removing "door spelling" leaves exactly 1 (W9). The callee arm could
      degrade from 8 rows to 1 and the control would still pass. AC-5's own
      discipline ("an equality, not a floor; cycle 3 supplied the removal
      direction and it must not regress to a floor") is applied to the three
      counts and not to the control for the card's headline claim.
      Separately, the per-arm attribution below shows that removing either arm
      reds exactly ONE assert node under the shipped default (:2610) -- every
      other door-axis assertion passes door_arms= explicitly and is therefore
      insensitive to DOOR_ARMS. That is legitimate parameterisation, but it
      means the "caught WITH" half of the door axis is carried by one node.

  - id: F-404
    severity: Minor
    cluster: the controls that are floors where the card's own rule is equalities
    title: '''`len(calls) == 816` is a tripwire on the whole production module for a door-axis claim; `inside == 17` is not.'''
    detail: >-
      The stated reason for pinning 816 is that `len(anchored) == len(calls)`
      alone would be satisfied by a module with no calls. That degenerate case
      is already caught four other ways in the same class (23 sites, the
      six-name vocabulary, the 7 guide expressions, and the module-axis
      census), each of which would red loudly on a module with no calls. So the
      816 equality buys nothing the class does not already hold, and costs a
      red on any future production edit that adds any call anywhere in 7,000
      lines -- not just a door call. A lower bound (`len(calls) > 500`) plus the
      existing equalities would hold the same claim. The card flags the cost
      honestly and calls it intended; I think it is the wrong instrument here.
      `inside == 17` is different and an equality IS right there: it is the
      module-axis bound's own denominator and it MUST red when a door call is
      added. Keep that one.

  - id: F-405
    severity: Minor
    cluster: diagnostics and prose
    title: A refusal can name a line that has nothing to do with the defect.
    detail: >-
      `opaque.setdefault((storage, spelling), (node.lineno, segment(binder)))`
      keeps the FIRST opaque binding found by ast.walk order. Plant P4 parked a
      real door in a local named `text`; the refusal fired -- and reported
      "a local name bound to an expression at line 2170 ... `text =
      str(page_number)`", the module's own unrelated binding, not the planted
      `text = getattr(self, "page_spec")`. The guard reds, which is what
      matters, but it points the reader away from the defect. Reporting every
      opaque binding for the key, or the one nearest the call, costs nothing.

  - id: F-406
    severity: Minor
    cluster: diagnostics and prose
    title: '''"unchecked, not clean" is understated for the in-class-body routes.'''
    detail: >-
      The card records `__set_name__`, metaclass and `type()` routes as "still
      not reachable by a line-count-preserving plant". They are reachable --
      with the harness's own `extra` parameter, which the card already uses for
      module-level scaffolding on nine rows. Measured: P6 (`type()`-built class,
      attribute store) REFUSED; P7 (`__set_name__`, spelled store) REFUSED;
      P8 (`__set_name__`, setattr store) SILENT. So the routes are not merely
      untried: their behaviour is fully determined by whether the store is
      spelled, which is F-401's root cause. A genuine in-class-body install
      remains unchecked, and that part of the note stands.

  - id: F-407
    severity: Minor
    cluster: diagnostics and prose
    title: CARD-206's F-302 label-invariance shape is live in the shipped assertions, not only in the author's own M16 mutant.
    detail: >-
      test_every_door_shape_is_read_or_refused_and_never_silent and
      test_the_declared_blind_spots_are_still_exactly_these both build the
      expected list from the SAME table rows the measured list comes from, so a
      row's LABEL appears on both sides of the equality and is not pinned by
      anything. The author diagnosed this correctly in M16 and treated it as a
      defect in the mutant; it is also a (low-impact) property of the shipped
      asserts. A label typo is harmless, but the table cannot be held to its own
      labels, so a row silently renamed is invisible.

  - id: F-408
    severity: Minor
    cluster: diagnostics and prose
    title: '''"the executable arm code names none of getattr/setattr/methodcaller/ attrgetter/vars (one comment does)" is loose in two ways.'''
    detail: >-
      `getattr` occurs 10 times in the executable body of `_page_positions` --
      as Python's own reflection on AST nodes (`getattr(node, "ctx", None)`,
      `getattr(binder, cls.BINDERS_READ[shape])`), never as a branch on the
      analysed module's text. And two comments name the idioms, not one
      (L1726-1727 and L1807). The SUBSTANTIVE claim holds and I verified it the
      hard way: no string constant and no comparison anywhere in
      `_page_positions` or `_door_position_slots` equals any of the five idiom
