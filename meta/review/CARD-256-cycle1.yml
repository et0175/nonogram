    title: "the two conftest substring assertions cannot fail while the assertion above them passes, and their one independent reach is undeclared"
    description: |
      test_nothing_in_the_tree_sets_either_of_the_guards_env_switches ends with
      `assert guard.OVERRIDE not in conftest` and the new
      `assert guard.LOCK_PATH_VAR not in conftest`, after `assert not offenders`.
      tests/conftest.py is tracked (`git ls-files --error-unmatch tests/conftest.py`),
