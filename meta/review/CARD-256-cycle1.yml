    title: "M-Q is reported as a measured survivor but is killed six ways; the instrument's scope is undeclared and its 41-assertion figure does not recompute"
    description: |
      The Implementation record's 'Measured bounds' block states: "M-Q (the `verdict`
      no-lock branch) survives: current_verdict returns before calling verdict when
      there is no lock, so that branch is unreachable from a real run."

      The second half is true — current_verdict (tests/full_suite_lock.py:388-390)
      returns (True, None) before calling verdict when read_lock gives None, so the
      branch is unreachable from a real run. The first half is false. verdict is unit
      tested directly: tests/test_full_suite_lock.py:103 calls
      guard.verdict(None, worktree=..., age_seconds=None, overridden=False) and
      asserts `allowed is True` and `said is None`. Probed (cp -p backup, restored,
      diff -q and shasum -a 256 both clean): replacing that branch's `return True, None`
      with `return False, "M-Q probe"` reds 6 of the 41 tests —
      test_no_lock_file_is_the_ordinary_case plus the five real-process cases, because
      SELECTION is that same canary test. No variant of "returns a verdict" survives
      `assert said is None`.

      The reason the harness said otherwise is the instrument's reach, and that is the
      part worth fixing. The card claims an instrument that rewrites "every ast.Assert
      at any depth" and reports "all 41 assertions PASS and reached". The file holds
      129 ast.Assert nodes at HEAD (111 on main, so this card adds 18); the ten tests
      the kill matrix names hold 38. 41 is the collected *test* count (recomputed:
      36 -> 41), not an assertion count. So the matrix was measured against an
      undeclared ~41-node subset that excludes test_no_lock_file_is_the_ordinary_case —
      which is exactly the arm that kills M-Q. The instrument itself is in neither the
      diff nor the tree (`git grep 'ast.Assert'` finds only prose in meta/), so the
      figure cannot be re-derived at all.

      Net effect: the card's principal evidence artefact — the 21-row kill matrix — is
      not reproducible, and the one row I could recompute independently is wrong. The
      shipped code and tests are sound (AC-1..AC-5 all verified independently below);
      this is an evidence-integrity defect in the record, and on this board the record
      is what the next card reads.
    suggestion: |
      Restate the residue as measured: M-Q is killed by
      test_no_lock_file_is_the_ordinary_case (6 of 41 tests red), and what survives is
      nothing — the unreachability-from-a-real-run observation stands on its own and
      does not need a survivor to carry it. Then either (a) declare the instrument's
      scope explicitly — which files, which node count, e.g. "129 ast.Assert nodes in
      tests/test_full_suite_lock.py" — and re-run the 21 mutants against the full set,
      or (b) commit the instrument so the figure has a recomputing control. Replace the
      "41 assertions" figure with the number that recomputes (129 at HEAD, +18 from this
      card). Certification: a cycle-2 read of the restated record plus one re-run of the
      M-Q edit — it is a record-only change, no code moves, so it can be confirmed
      cheaply and need not be the last commit before the gate.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
