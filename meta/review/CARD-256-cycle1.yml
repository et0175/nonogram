  - id: F-006
    severity: low
    category: ops
    type: risk
    file: tests/test_full_suite_lock.py
    line: 1099
    title: "the two real-process silence assertions were narrowed from one substring to a hand-enumerated three-phrase list, and the narrowing is not declared as a bound"
    description: |
      test_a_tree_with_no_lock_runs_exactly_as_it_did_before and
      test_a_gate_running_under_its_own_lock_is_not_refused both had
      `assert "full-suite lock" not in combined` replaced by a loop over
      ("Refusing to start", "running anyway", "stale"). The replacement is forced and
      correct — every real-process case redirects the lock path by construction
      (_run_pytest always sets LOCK_PATH_VAR), so the announcement this card adds now
      appears in the output and the old substring can no longer be used. The three
      phrases do enumerate every verdict message verdict() can produce today.

      What is not stated is that the assertion is now a closed list rather than a
      prefix: a fourth verdict phrase added later would be reported on a self-run or a
      no-lock run and neither test would notice. The old form could not drift that way.
      Both docstrings explain why the line is there; neither says the enumeration is
      the bound.

      Each of the two loops is also a single ast.Assert covering three phrases, so a
      plain pytest run stops at the first failing phrase — which is the per-assertion
      hazard the card's own instrument exists to remove, reintroduced inside the
      assertion.
    suggestion: |
      Add one clause to each docstring naming the enumeration as the bound ("the three
      phrases are every message verdict() returns today; a fourth would pass this
      test"), or derive the list from the verdict messages instead of restating them.
      Certification: a cycle-2 read, or a mutant that adds a fourth verdict phrase and
      shows which test reds.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

