    title: "the absent redirection mutant is justified by a premise G-5 does not state, and the redirection is already controlled"
    description: |
      The record says: "A mutant deleting the redirection (lock_path() ignoring the
      variable) is deliberately not in the set: under it every real-process case here
      reads the board's own lock, which G-5 forbids."

      G-5 forbids creating, modifying or deleting the board's real lock. Reading it is
      not in the prohibition, so the stated premise is not what the guardrail says.
      More to the point, the mechanism is not uncontrolled and needs no real-process
      case at all: tests/test_full_suite_lock.py:742-747
      (test_the_lock_path_is_injectable_so_a_test_never_touches_the_real_one) asserts
      `guard.lock_path() == elsewhere` with the variable set and
      `== guard.default_lock_path(...)` with it unset — both in-process, with no file
      anywhere near the board's path. Deleting `if named: return Path(named)` from
      lock_path reds that test immediately.

      So the record understates its own coverage on a premise that does not hold. Same
      shape as F-001 and the same remedy: state what a run shows, not what the
      guardrail is assumed to forbid.
    suggestion: |
      Replace the paragraph with the measured fact: the redirection is killed in-process
      by test_the_lock_path_is_injectable_so_a_test_never_touches_the_real_one, so no
      real-process mutant is needed and G-5 is not implicated either way.
    confidence: high
    source: static
