  - id: F-003
    severity: medium
    category: tech-debt
    type: gap
    file: tests/helpers/round_ink.py
    line: 289
    title: "The reader's operator vocabulary is hand-written beside an authority the repo already enumerates, and three mark-bearing operator classes pass silently"
    description: |
      `_PATH_OPERANDS` (line ~300) carries a claim about the product:
      "``v`` and ``y`` ... are deliberately absent: this project's writer emits
      neither (``nonogram.admin.book_vector.ContentStream``)". Nothing in the
      diff binds that claim to the writer. The authority exists and the
      project already uses it, one module over:

        * `dir(ContentStream)` is runtime-enumerable, and
          tests/test_book_pdf_vector_primitives.py partitions it into
          watched/unwatched/not-a-mark;
        * tests/test_book_solved_answer_key.py:2691 holds
          `_PATH_OPERATORS = frozenset({"m","l","re","c","h","S","f","B"})`
          — the MEASURED emission set — and its door-probe drives every
          member of that surface and records what each one emits.

      All 8 of those measured operators are understood by the new reader, so
      the claim is TRUE today. It is simply unchecked, which ADR-0039/R2
      addresses directly: a guard's set is derived from an enumerable
      authority, not hand-written; and the module that would import the
      authority (tests/test_book_pdf_vector_primitives.py) is this diff's one
      unguardrailed co-change peer, 5 co-changes in 12 months.

      The consequence is measurable. Probing the reader as committed:

        REFUSED  "10 10 m 20 20 30 30 v f"            (v shorthand)
        REFUSED  "10 10 m 20 20 30 30 y S"            (y shorthand)
        REFUSED  "f"                                   (paint, no subpath)
        REFUSED  "10 m"                                (starved operand)
        REFUSED  "0 0 .5 .5 re f"                      (leading-dot number)
        REFUSED  "0 0 BOGUS 10 10 re f"                (unknown token)
        REFUSED  "0 0 1e1 1e1 re f"                    (exponent form)
        TOLERATED  "2 0 0 2 0 0 cm 0 0 10 10 re f"  -> box (0,0,10,10), i.e.
                   bit-identical to the same rect with no `cm` at all: the
                   transform is silently dropped, so a non-uniform `cm` would
                   let a path-space circle print as an ellipse (false round)
                   or a path-space ellipse print as a circle (MISSED round
                   mark, the direction that matters to the
                   no-round-mark-on-the-books-own-sheets cell)
        TOLERATED  "q 100 0 0 100 0 0 cm /Im0 Do Q"  -> 0 marks, no refusal
        TOLERATED  "/Sh0 sh"                          -> 0 marks, no refusal

      The default-deny is genuinely strong — an unrecognised token clears the
      operand stack and the next path operator then starves and raises, which
      is why 7 of 10 classes refuse. That makes the asymmetry the finding: the
      ONE bound the module records (type is not a path) is recorded in prose
      AND given a two-sided control with the other arm as its witness, while
      `cm`/`Do`/`sh` are neither recorded nor controlled. ADR-0039/R3 is
      explicit that a bound a guard cannot close is recorded "as a measured
      bound with its own failing control".

      Practical risk today is low and should be weighed as such: `ContentStream`
      deliberately has no `q`/`Q` and no transformations (its own docstring,
      src/nonogram/admin/book_vector.py ~756), `write_vector_page` refuses a
      `Do` outright (same file, ~1411, with its own cells in
      tests/test_book_puzzle_page_vector.py around 3368-3401), and `sh` is
      outside the vocabulary. The gap is that the new reader depends on those
      three facts and asserts none of them, so the day the writer grows one,
      this instrument mis-measures or under-measures and the liveness probe
      stays green — 588 painted subpaths of grid rules keep `alive` true while
      a dot drawn through the new route is invisible. That is this card's own
      thesis one layer down.
    suggestion: |
      Add one cell to the vector-arm class that imports the measured emission
      set from tests/test_book_solved_answer_key.py (or re-derives it over
      `dir(ContentStream)` with the door probe) and asserts it is a subset of
      `_PATH_OPERANDS | _PAINT_OPERATORS | _REFUSED_PATH_OPERATORS` — the
      exact shape the existing `PAINTS_THAT_FILL`-is-a-subset cell already has
      for paints, widened from paints to the whole vocabulary. Then record
      `cm`/`Do`/`sh` in the module header as a named bound beside the typed-glyph
      one, with a control: a two-line stream for each, asserting what the reader
      reports today, so a future refusal is a visible change rather than a
      silent one.
    confidence: high
