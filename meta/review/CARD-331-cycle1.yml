      That last fact is what distinguishes this case from every precedent in
      the frozen list, and the distinction is the precedents' OWN stated
      criterion: CARD-222's addition contributes 0 s ("this file does not appear
      at all"), CARD-223's contributes 0 s and moved only the row's COUNT
      (1079 -> 1091) which that card restated, CARD-295's and CARD-305's
      contribute 0 s because the files did not exist. CARD-331's file
      contributes 450 recorded phase entries. No precedent re-froze a set in a
      way that moved a measured second, and this card has no instrument to
      re-derive one.

      The deferral is also genuinely pre-existing and owner-visible, exactly
      where the round says it is: the legacy harness's own docstring records
      that "the call this file really makes, `interior_pages`, is not one of
      those eight names, so the file does not match that grep on its own
      merits; CARD-241's notes record why re-freezing the snapshot was not
      this card's to do (G-5) and what the next profiling run should record
      instead." So the file's render-heavy-but-unlisted status is CARD-241's
      recorded debt, not something this card created.

      ONE GAP in the argument. The card answers CARD-223 ("added rather than
      dodged") and distinguishes it correctly. It does not answer CARD-227,
      which is the NEARER precedent and cuts the other way: that file matched
      the grep only in its own docstring — "a false positive by the grep's
      purpose", with the card recording that "the tempting move was to reword
      the sentence and slip the set" — and it was "added anyway, because the
      file genuinely renders and the set is there to find the files that do."
      By that criterion CARD-331's file belongs in the set, because it does
      genuinely render. The refusal survives anyway, on the 450-occurrences
      ground CARD-227 did not face and on CARD-241's standing deferral; but
      the card should say so, because a later reader checking the precedents
      will find CARD-227 first and read the refusal as unanswered.

      On whether the corpus rebuild is a dodge: it is not, and the file's own
      legacy docstring normalises the move — "a helper spelled that way — or a
      docstring quoting it, which is how this sentence had to be rewritten"
      is the same card family spelling around the same trap. The rebuild also
      grew the sweep (11 -> 13 pages), made the book's row count the corpus's
      authority rather than a pairing verdict, and put both page parities in
      it, all asserted. My M2 plant (one page dropped) reds 2 cells, so the
      new anchor has teeth.

  - id: N-2
    title: "What the rebuilt corpus gives up, named for the next card"
    body: |
      The corpus no longer consults the pairing walk at all, so the vector arm
      never reads a sheet composed the way a real book's interior composes a
      paired one. The round names this and names the two-up sheet as the arm's
      next step rather than half-building it, with a stated reason (a paired
      sheet carries two bands, so the accounting becomes a question about which
      band a plant landed in). I judge the not-built decision CORRECT: a
      two-band accounting with no band-attribution rule would be a verdict
      nobody can read, which is the defect class this card exists to remove.
      Recorded so the next card inherits the gap explicitly rather than
      discovering it.

