      shared state named; no suite in this repo runs parallel today.
    suggestion: |
      Prefer `monkeypatch.setattr(round_ink, "_BEZIER_SEGMENTS", segments)` —
      which is scoped and auto-restored — or pass the segment count as an
      argument to the flattening helper so no global moves. Note the first
      option collides with AC-3's hook detector if this cell ever joins
