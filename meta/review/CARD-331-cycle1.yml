  - id: N-4
    title: "Mutation results — 14 plants fired this cycle, 12 killed, 2 survivors both accounted for"
    body: |
      Harness discipline: PYTHONDONTWRITEBYTECODE=1, `__pycache__` swept before
      and after every run, every plant located BY TEXT with its occurrence count
      asserted to be exactly 1, SHA-256 asserted before the plant and after the
      restore, the environment inherited via `dict(os.environ, ...)`,
      `["-o", "addopts="]` as two argv items, and 189 collected / 0 skipped
      asserted on every single run including the baseline.

        M1  (re-fire of the round's MUT-13: an arm renamed, nothing else)
              SURVIVED, 189 passed — as declared. LEGITIMATE, see N-5.
        M2  (MUT-3: corpus shrunk by one page)           KILLED, 2 cells
        M3  (MINE: page floor 12 -> 999)                 KILLED, 1 cell
        M4  (MINE: region floor 85 -> 999)               KILLED, 1 cell
        M5  (MINE: shaped floor 170 -> 9999)             KILLED, 1 cell
        M6  (MUT-16: recomputed extent drifts 1 px)      KILLED, 1 cell
        M7  (MUT-10: the reader stops refusing v/y)      KILLED, 1 cell
        M8  (MUT-11: the margin declared, not derived)   KILLED, 1 cell
        M9  (MUT-9: flattening 32 -> 4)                  KILLED, 1 cell
        M10 (MINE: a production rebind inside the raster arm's plant function)
              SURVIVED, 189 passed — this is F-004, a real hole.
        M11 (MUT-15: ONLY the declaration flips about the wrong height)
              KILLED, 3 cells, DISJOINT from M6's one
        M12 (MINE: the vector arm's liveness hardcoded to always-alive)
              KILLED, 1 cell — the control's own control works
        M13 (MUT-12: the vector arm re-declared RASTER)  KILLED, 2 cells

      The M6/M11 pair is the load-bearing result of this cycle and it vindicates
      the self-narrowing. M6 drifts the extent that BOTH the writer and the
      declaration use, so the accounting stays self-consistent and only the
      independent MediaBox reading disagrees: 1 red, and it is the narrowed
      cell. M11 drifts ONLY the declaration, so the accounting breaks and the
      MediaBox cell is untouched: 3 reds, none of them the narrowed cell. The
      two plants red disjoint sets. That is precisely the standard — a claim
      narrowed to exactly what its own control can fail on, with the wider
      failure owned by a different control — and it is why the old, wider claim
      ("every declared dot in the wrong place") was not just unproven but FALSE:
      under M6 the declared dots are in the RIGHT place relative to the stream.

      Tree state after every plant: `git status --porcelain` empty, HEAD still
      308bbded, `git diff --stat b18fd397..HEAD` still 8 files / 2690
      insertions, the touched module's sha256 equal to its HEAD blob's. One
      transient note for honesty: I once ran `git status` WHILE a background
      harness held a plant and saw the file modified; I restored from HEAD and
      verified the sha matches the HEAD blob exactly. That was my race, not a
      left-behind mutation — the harness's own final line reported a clean tree.
      No orphaned pytest processes (`lsof -c python` finds 0 holding this
      worktree). CARD-317's worktree was not touched.

  - id: N-5
    title: "MUT-13's declared survival is legitimate, and the round's reason is half the reason"
    body: |
      Re-fired: an arm renamed and nothing else survives, 189 passed. The
      round's justification — "the guard claims one arm per medium and not a
      set of spellings" — is correct and is a claim stated in the cell's own
      name and docstring, written before the mutant rather than after it. The
      mutant that attacks the actual claim is killed: M13 (the vector arm
      re-declared RASTER, so the set loses a medium) reds 2 cells. A declared
      survivor is only meaningful next to the kill that bounds it, and that
      kill exists.

      What the round's table does not say, and should: the arm's `name` is NOT
      unguarded, it is guarded by a different instrument at a different layer.
      `name` feeds the parametrize ids, so renaming `raster` to `bitmap` moves
      the node id from `[raster]` to `[bitmap]` — which G-5's node-id set diff
      catches as a renamed cell. So the complete answer is "the spelling is
      pinned by the card gate, not by this cell, and correctly not by this
      cell". With that sentence the survivor is honest discipline. Without it a
      reader cannot tell it from a claim quietly narrowed to fit, which is the
      question I was asked to decide. Verdict: HONEST DISCIPLINE, not a hole.

  - id: N-6
    title: "The deliberately future-red cell is the right instrument, and CARD-322 was already told"
    body: |
      The mechanism-still-exercised cell will red the day the puzzle page
      converts. I judge this CORRECT rather than a landmine, on three grounds,
      two of them measured:

      1. it reds for a TRUE reason. On that day the 27 legacy cells really do
         stop measuring the product's own page. A guard that stayed green
         across the medium change is the silent pass this card exists to kill —
         and I proved a tolerant guard cannot do the job: under probe state B
         the legacy walk never reaches the vector page at all (it is filtered
         out), so NO exception, named or otherwise, would fire. The cheaper fix
         the brief asked me to weigh — making the legacy walk raise a named
         error — is therefore provably insufficient, not merely weaker.
      2. the failure is a work order, not a puzzle. Captured verbatim: "the
         raster arm of the difficulty-dot accounting is DEAD: the product now
         writes a puzzle page as vector, so a bitmap of one is a page it does
         not print. Its mechanism is ink extents, in device pixels, of the
         connected regions of a bitmap puzzle page the product draws through
         _blank_page. the product no longer draws this page as a bitmap:
         retire this arm, or re-point it at a page kind _RASTER_DECLARATIONS
         still declares raster, and move the 27 cells of this module that read
         the interior as bitmaps with it." (F-005 is about the first of those
         two options.)
      3. CARD-322 is adequately told, and was told BEFORE this round ran —
         which is the part the card gets to take no credit for and should cite.
         meta/kanban/cards/CARD-322.md lines 118-121 already read: "expect to
         delete raster expectations here, not satisfy them. Same for
         **CARD-331**'s raster arm of the difficulty-dot accounting: its
         lifetime ends with this card." That is "expect it, not widen it",
         recorded on the consuming card, written at CARD-309's re-cut. CARD-331
         is also already in CARD-322's `Depends on`.

      So the instrument is right, the message is right, and the hand-off is
      already on the receiving card. The one wrinkle is F-005: CARD-322's prose
      says "delete", the guard requires "re-point" (PageMedium keeps RASTER for
      the cover and divider), and the remedy string offers both without saying
      the first one reds.

  - id: N-7
    title: "The corrected premise, and whether the deliverable follows from it"
    body: |
      Both halves of the correction reproduce.

      Half one — the card's "passes silently" is FALSE TODAY, and the round's
      reason is right: 29 failed / 160 passed with the declaration lifted, and
      the 27 legacy reds die on a type error naming neither a dot nor a dead
      hook. Half two — the silent pass is ONE PATCH AWAY and the patch is the
      one a converting card writes: 15 failed / 174 passed with the walk also
      filtered to bitmaps, i.e. 14 cells go green on a book whose puzzle pages
      have left the measurement. Both probes are committed, both do exactly
      what they claim, and I ran both.

      The second premise correction also holds: `_draw_difficulty_dots` has no
      production caller (grep over src/ finds its own def at
      book_pdf_generator.py:2178 and one docstring mention at
      book_guide_vector.py:901, nothing else), and `round_mark` appears in src/
      only inside book_vector.py — its own def and three docstrings. So BOTH
      arms are accounting instruments rather than readings of a drawn glyph,
      and the vector arm is explicitly forward-looking. The code SAYS so
      rather than glossing it: the glyph-writing helper's docstring states "the
      package has no vector drawing site for this glyph (CARD-207 is the card
      that puts one on the puzzle page) ... So this arm is a *forward*
      instrument: it is the accounting a vector dot site will be measured by,
      standing ready", and the vector-arm class's docstring opens its own
      "What this arm is not" paragraph. That is honest.

      DOES THE DELIVERABLE FOLLOW? Yes, and this is the cycle's central
      measurement. Under probe state B — the exact state in which 14 cells go
      silently green — the new section still reds, in the AC-4 class, with the
      message quoted in N-6. The thing the card promised (an arm per medium,
      each naming its mechanism, plus a guard that reds when an arm's mechanism
      stops being exercised whatever the page object's type is) is the thing
      that catches the scenario the corrected premise identified, and the
      cheaper alternative provably does not. The design follows from the
      correction rather than being justified by it after the fact.
