  - id: F-005
    severity: minor
    gating: false
    confidence: high
    title: >-
      AC-6's comparative claim is not an arithmetic truth — the per-resolution
      band is strictly stronger on the absolute axis and strictly WEAKER on the
      ratio axis, so "tighter at both ends than any ratio between them" overstates
    file: tests/test_book_grid_rules.py
    line: 723
    claim_quoted: >-
      "each span is held against the width the renderer was actually asked for
      -- ``declared <= span <= declared + 2`` ... which is tighter at **both**
      resolutions than any ratio between them"
    what_is_true: >-
      For the cell line the band is [1.25, 3.25] px at 300 DPI and [5, 7] px at
      1200. Those two bands together imply only 5/3.25 = 1.54 <= ratio <= 7/1.25
      = 5.6. Any narrow ratio band around the measured 2.5 (say [2.4, 2.6]) is
      far tighter on the ratio than the absolute band is. The monotone arm beside
      it adds only ratio > 2 (5 > 2*2, a margin of one pixel). The two forms are
      incomparable: the band pins each measurement absolutely, which a ratio
      cannot, and a ratio pins the relationship, which the band barely does. The
      chosen form IS the better one — it excludes the 1 px dropout, which no
      ratio does — and that is what the sentence should say.
    evidence: |
      # measured, second domain (own pdftoppm + own run-length scan, attribution by
      # the STREAM's x in points rather than by layout.position device pixels)
      $ .venv/bin/python -I probe/figs.py
      --- 300 DPI render (3300, 2550) ---
         declared 0.3 pt -> inked (span,darkest) [(2, 89)]   device_count=1
         declared 0.8 pt -> inked (span,darkest) [(4, 0)]    device_count=3
         declared 1.3 pt -> inked (span,darkest) [(6, 0)]    device_count=5
      --- 1200 DPI render (13200, 10200) ---
         declared 0.3 pt -> inked (span,darkest) [(5, 89)]   device_count=5
         declared 0.8 pt -> inked (span,darkest) [(14, 0)]   device_count=13
         declared 1.3 pt -> inked (span,darkest) [(22, 0)]   device_count=22
      # band check: 1.25<=2<=3.25, 5<=5<=7, 3.33<=4<=5.33, 13.33<=14<=15.33,
      #             5.42<=6<=7.42, 21.67<=22<=23.67   -- all hold
      # implied ratio range for the cell line: [5/3.25, 7/1.25] = [1.54, 5.60]

