seam_verdict:
  question: "weaker, differently scoped, or equivalent-under-the-new-design?"
  verdict: DIFFERENTLY SCOPED, AND STRICTLY STRONGER ON THE DEFECT THAT MATTERS
  what_it_asserted_at_7a62d704: |
    test_the_ink_measures_the_two_widths_the_stream_sets:
      verticals, horizontals = _device_rules(twin.case)      # stream w, /scale -> device px
      stated = sorted({width for _position, width in verticals + horizontals})
      inked  = _inked_rule_widths(twin)                      # run lengths off the bitmap
      assert len(stated) == 2 and stated[1] > stated[0]
      assert [Decimal(width) for width in inked] == stated    # ink == stream, in device px
  what_it_asserts_now: |
    test_the_inked_widths_are_never_the_declared_figures:
      assert stated == [0.3, 0.8, 1.3]                       # stream hierarchy, in POINTS
      assert inked  == sorted({thin_rule, thick_rule})       # raster hierarchy, in PIXELS
      assert counts == [1, 3, 5]                             # the declared figures' device counts
      assert counts[0] not in inked                          # 1 px absent
      assert counts[1] in inked                              # 3 px present
  how_established:
    - >-
      Measured that the old claim really is false now, both arms, rather than
      taking the round's word: stream widths in device pixels are
      [1.25, 3.333..., 5.4166...] (three values, not two) against ink [3, 6], so
      `len(stated)==2` and `inked==stated` both fail. The claim is false by
      design, not by drift.
    - >-
      Planted the defect the old seam existed to catch — raster ink no longer
      the layout's widths — as M3 (_rule_widths' thin rule collapses to 1 px).
      The new form reds, and it reds at the 1 px arm while the arm above it
      stays green. So the 1 px arm catches a defect NOTHING ELSE in the new form
      sees, and the old form's job is still done.
    - >-
      Planted the undo (K-F, draw_grid_lines ignores width_pt). The new seam
      reds. So it cannot be satisfied by reverting the card, which is the
      failure mode the brief named.
    - >-
      Checked the 1 px arm for vacuity three ways: it is not implied by the arm
      above it under M3 (where thin/thick moved together and the equality
      held); the band it belongs to excludes 1 px at both resolutions; and the
      3 px arm does fire True, so the membership reading is live.
  is_the_1px_3px_pair_a_real_control: >-
    The 1 px arm: YES, demonstrated by M3. The 3 px arm: live but coincidental —
    3 is `counts[1]` and `layout.thin_rule` only because of this book's fitted
    cell. Recorded as F-007, minor.
  reservation: >-
    On the page the corpus holds, with the previous assertion in force, the two
    membership arms are also derivable from it (inked == [3,6] and counts ==
    [1,3,5] make both arms theorems). They stop being theorems the moment the
    raster hierarchy itself moves, which is the case that matters and the case
    M3 builds. So: not vacuous, but their independence is conditional and the
    docstring presents it as unconditional.

