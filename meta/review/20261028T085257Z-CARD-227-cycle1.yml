  cross-medium seam is differently scoped and strictly stronger on the defect
  that matters; the call-graph re-stamp is three pinned figures re-derived at
  both ends with 204's immobility measured, not assumed; all six poppler
  figures reproduced in a second domain; G-2, G-3 and G-5 verified by
  byte-identity rather than by inspection; _rule_tier exactly equivalent and
  correct at both edges; Obligation 2 judged line by line; the Touches list
  exactly matches the change; eight of nine mutants killed at the named cell.
  Against that, AC-7 — the card's single genuinely new claim, and the thing
  that keeps ADR-0037/R2's medium argument from being a comment — is weaker
  than declared in two independent ways, and one of the card's own "could not
  establish" statements is factually false in the direction that let the bound
  stay open, now written into ADR-0037 as well. Neither moves any ink today,
  which is why this is not lower, and both are a few lines from closed. Below
  8 rather than at it because the same root cause recurs seven times (see
  finding_family), including a shipped module docstring that tells the next
  reader the opposite of what shipped.

verdict: >-
