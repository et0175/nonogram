findings:

  - id: F-001
    severity: major
    gating: true
    confidence: high
    title: >-
      AC-7's declared bound rests on a false premise — png._draw_grid DOES
      receive the declared weights today, on every book single-puzzle page, and
      the control the card says cannot fail both passes today and reds on the
      mutant
    file: tests/test_book_grid_rules.py
    line: 825
    claim_quoted: >-
      "What is *not* closed here is ``png._draw_grid``, the other raster
      stroker — it reads a line's device width and ignores the declared one, so
      these figures cannot reach it today, but nothing stops a later card
      making it read them." And in the card's own "could not establish":
      "whether png._draw_grid would refuse the declared figures (it cannot
      receive them today, so there is nothing to refuse and no control that can
      fail)".
    what_is_true: >-
      _blank_page — the live interior walk's single-puzzle page builder — draws
      its grid through render_pages -> export/png._draw_grid, NOT through
      _stroke_drawing. _stroke_drawing rules only two-up slots and solved
      slots. So of the two raster strokers, the one that rules the dominant
      interior page kind is the unguarded one, and it receives GridLines
      carrying width_pt 0.3/0.8/1.3 and grey 0.0/0.35 on every book page. A
      control at that door is writable, passes on the real page, and reds on
      exactly the mutant AC-7 names.
    evidence: |
      # (1) the weights reach the unguarded stroker, measured by spying on it
      $ cat probe/pngdoor.py   # wraps png._draw_grid, then calls gen._blank_page(...)
      $ .venv/bin/python -I probe/pngdoor.py
      RESOLUTION png -> /Users/.../PythonProject4-card-227/src/nonogram/export/png.py
      png._draw_grid calls during _blank_page: 1
         layout=Layout width_pt=['0.3', '0.8', '1.3'] grey=['0.0', '0.35'] device_width=[3, 6]

      # (2) the bound is closeable: the same guard _stroke_drawing has, installed
      #     at png._draw_grid, three arms
      $ .venv/bin/python -I probe/closeable.py
      ARM 1  real book page through a guarded png._draw_grid : PASSES (no false positive)
      ARM 2  mutant (raster takes the declared figures) REDS: a raster border rule may
             not be stroked at a declared physical weight: 1.3 pt is 5 px at 3[00 DPI]
      ARM 3  shipped png._draw_grid draws the refused configuration SILENTLY (no guard)

      # (3) which stroker rules which page kind
      $ grep -nE "self\._blank_page\(|self\._two_up_page\(|self\.solved_puzzle_page\(|self\._packed_answer_page\(|self\.vector_puzzle_page" \
          src/nonogram/admin/book_pdf_generator.py
      5352:                yield self.vector_puzzle_page(      # only vector_puzzle_pages reaches this
      7080:                        page = self._blank_page(    # -> render_pages -> png._draw_grid  (UNGUARDED)
      7087:                        page = self._two_up_page(   # -> _stroke_drawing                 (guarded)
      7116:                        page = self._packed_answer_page(
      7121:                        page = self.solved_puzzle_page(
    why_gating: >-
      AC-7 is the card's one genuinely new claim and the thing that keeps R2's
      medium argument from being a comment. The card declared this bound, which
      is the right discipline, but declared it on a measurement that is false
      and used that falsehood as the reason no control could be written. A
      closeable bound left open on a false premise is the weakened-guard shape.
      No user-visible defect today: png reads line.width (3/6 px), so the ink
      has not moved.
    fix_shape: >-
      Either call refuse_rasterised_rule in png._draw_grid (one line per
      stroker loop, demonstrated above to pass on the real page and red on the
      mutant), or restate the bound truthfully — "it receives them and ignores
      them, and here is the control that says so" — and then it is not an open
      bound at all. Do not re-use the sentence "cannot receive them today".

  - id: F-002
    severity: major
    gating: true
    confidence: high
    title: >-
      "default-DENY" is claimed for a predicate that is default-ALLOW, and the
      one function that really is default-DENY (rasterise_rule_px) has no caller
      in src — so neither of the "two doors held" is held the way stated
    file: src/nonogram/export/layout.py
    line: 596
    claim_quoted: >-
      refuse_rasterised_rule's own docstring: "**What defaults to DENY, stated
      rather than implied.** For a rule the sheet declares a physical width
      for, the declared figure's own device count is **denied**: there is no
      branch that lets a declared weight through to a bitmap". And the card:
      "layout.rasterise_rule_px is the single door a raster generator may
      convert a declared width through, and it defaults to DENY".
    what_is_true: >-
      refuse_rasterised_rule has exactly two refusing branches and two
      returning ones. It returns on width_pt is None, and it returns on every
      integer width that is not exactly round(width_pt*dpi/72). That is
      default-ALLOW with one point exclusion. A stroker that ceil-ed the same
      declared figure (2 px for 0.3 pt at 300 DPI) is admitted, as is any
      declared figure resolved at a dpi other than the one passed. Separately,
      rasterise_rule_px — which genuinely does default to DENY — is called
      nowhere in src/: grep finds only its definition, its __all__ entry and
      nine docstring cross-references. It is reachable only from tests, so it
      is not a door the shipped code goes through. This is ADR-0039/R2's own
      warning: "derived" and "default-deny" are both satisfiable by a
      default-ALLOW predicate underneath.
    evidence: |
      $ grep -rn "rasterise_rule_px" src/ | grep -v "layout.py"
      src/nonogram/admin/book_page_spec.py:190:#: why :func:`~nonogram.export.layout.rasterise_rule_px` refuses them a bitmap
      $ grep -n "rasterise_rule_px" src/nonogram/export/layout.py
      298:    "rasterise_rule_px",          # __all__
      417: 429: 478: 587: 610: 645: 769: 1218:   # all docstring prose
      537:def rasterise_rule_px(width_pt: float, dpi: int = DPI) -> int:
      # -> zero call sites in src/. The only callers are in tests/.

      $ sed -n '596,660p' src/nonogram/export/layout.py   # the LIVE guard's branches
      ...
          if width_pt is None:
              return                       # ALLOW
          if width == _device_rule_px(width_pt, dpi):
              raise ValueError(...)        # the single DENY
                                           # (falls off the end -> ALLOW)
    note: >-
      The guard does have both a positive and a negative control, which is to
      the round's credit — mutating the comparison to `if True` (blanket deny)
      reds the near-miss arm, and deleting either call site reds a named test
      (see the re-fire table). What is wrong is the prose: a point-exclusion
      predicate is described as having "no branch that lets a declared weight
      through", and an uncalled function is counted as one of two doors held.
    fix_shape: >-
      Say what the predicate actually denies (one device count per declared
      width) and what it therefore admits; and either wire rasterise_rule_px
      into the raster path so it is a door, or stop calling it one.

