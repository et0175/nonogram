finding_family:
  name: "a claim stated wider than the measurement behind it"
  members: [F-001, F-002, F-003, F-005, F-006, F-010, F-011]
  note: >-
    Seven of eleven findings share one root cause, and it is not sloppiness
    about measurement — this round measured unusually well, corrected three of
    its own assumptions, and re-derived the figures that mattered. What it did
    not do is narrow the sentences around those measurements. "Cannot reach it
    today" for "receives it and ignores it"; "no branch lets a declared weight
    through" for "one device count is excluded"; "a sheet a caller cannot
    express wrongly" for "three stated constraints"; "tighter than any ratio"
    for "tighter on the absolute axis"; "seven w operators" for the page's seven
    and the function's six; a docstring saying the file is outside a set it is
    inside; and a trace note giving a false reason for a true gap. Recorded as a
    family per the board's family_regression: warn, because the fix for all
    seven is the same editorial pass and the next card is better checked against
    the rule than against seven findings.

