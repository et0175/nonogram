  - id: F-001
    severity: low
    category: tech-debt
    type: bug
    file: src/nonogram/admin/image_manager.py
    line: 71
    title: "floor_percent truncates a float artifact one point low for exact 29%/57%/58% shares"
    description: |
      `int(share * 100)` truncates the binary-float product, so a share whose exact
      value is 29/100, 57/100 or 58/100 prints one whole point BELOW the true value:
      0.58 * 100 == 57.99999999999999 -> "57%". These shares are reachable from
      _kept_share's integer cross-products: source 300x174 at grid 5x5 gives
      min(1500,870)/max(...) == 0.58 exactly, and all three values are below
      MIN_KEPT_SHARE, i.e. inside the range the three app.py lines and both preview
      spots actually print.

      Measured, not asserted: a scan of 57,238,272 reachable (source_w, source_h,
      grid_w, grid_h) combinations found 1,410 shares (~0.0025%) where the printed
      percent is one point below the exact floor. All are of the form k/100 with
      k in {29, 57, 58}.

      Blast radius is bounded and the card's own boundary is safe: 0.9 * 100 == 90.0
      exactly (verified), and no mismatching share lands at 90, so the "89% vs 90%"
      confusion CARD-065 exists to remove cannot recur. The defect is cosmetic
      under-reporting of an already-failing picture.
    suggestion: |
      Absorb the representation error before truncating, e.g.
      `return f"{math.floor(share * 100 + 1e-9)}%"`, or compute exactly from the
      cross-products the share came from. Add the 0.58 case (source 300x174, grid
      5x5) to tests/test_card_065_follow_ups.py's parametrised table.
    confidence: high
    source: static
