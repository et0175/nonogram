    file: src/nonogram/admin/static/admin.css
    line: 453
    title: "Board now jumps 44 px on solve at 1180-1259 px desktop widths (collateral regression of SolvedBanner 'board does not move')"
    description: |
      Measured with Playwright (15x15 GRID, near-solved board, solving click; board bounding-box y after minus before),
      viewport 960..1480 step 20, height 900. Real main (adec591 static files): 0 px at 1180, 1200, 1220, 1240.
      This branch: -44 px at 1180, 1200, 1220, 1240 (and -46.8 at 1040-1080 where main gave -44).
      Both are 0 at >= 1260. The --space-2 padding rule keeps only the 1280x720 G-1 test green; the fourth
      tool still pushes the Errors/Hints counter to a second row in a band of common desktop widths, and hiding
      the tools on solve then moves the board. CARD-162's DESIGN-REGISTER for SolvedBanner says "in place of the
      ToolPicker (the board does not move)". The card's [Layout] note calls this "an estimate, not tested";
      it is now measured. The padding change (all four tools) is also not listed among the owner defaults (a)-(d).
    suggestion: |
      Either fix the cause: keep the toolbar's row count unchanged when solved (e.g. the banner takes the tools'
      box instead of the toolbar reflowing, or the counters never share a wrapping row with the tools), with a
      test that sweeps widths (for example 1024..1440) for the board-does-not-move property. Or, if the owner
      accepts the band, replace the [Layout] estimate with the measured band and list the padding change and the
      band as owner default (e) for the owner check.
    confidence: high
