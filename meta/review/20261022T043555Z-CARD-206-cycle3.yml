  escaped:
    - 'M1 `_d = getattr(self, "page_spec"); _d(3 + len(section))` -- SILENT (certified on disk as R1b: 0 FAIL of 133 reached)'
    - 'M2 the same with the name assembled, `getattr(self, "page" + "_spec")` -- SILENT'
