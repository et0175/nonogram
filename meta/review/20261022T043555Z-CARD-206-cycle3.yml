findings:
  - id: F-301
    title: 'The page-position walk still fails OPEN: a geometry door reached other than as a syntactic call is neither read nor refused'
    severity: important
    gating: true
    category: 'test-quality / system-contract (ADR-0039/R2 second clause, ADR-0039/R1)'
    file: tests/test_book_export_interior_cover.py
    line: 1376
    confidence: high
    source: 'measured -- kill_matrix mutant R1b_DOOR_VIA_GETATTR_PRESERVED on disk, plus 12 in-memory shapes'
    evidence: |
      Fix 2 rebuilt the walk around two closures and states, twice, that the result has no
      "shape I thought of" left in it:

        :1135  "**And it fails closed** (ADR-0039/R2 ...) ... a shape a position flows through
                that none of them names is a **refusal**, which reds naming the line and the shape."
        :1376  "The walk **fails closed** (ADR-0039/R2): ... every shape a position can flow
                through that this walk does not read appends a refusal below instead of passing."

      Both are false. The POSITION side is genuinely closed -- I could not break it. The DOOR side
      is not: door recognition is still an enumeration of syntactic call spellings. `called(call)`
      reads only `Call.func` as `ast.Name` or `ast.Attribute`, and the one refusal that covers an
      unrecognised door ("a geometry door referenced without being called", :1648) is keyed on
      `isinstance(node, ast.Attribute) and node.attr in doors`. A door whose identity is not a
      syntactic name in the call position is therefore dropped before either closure sees it --
      which is the refusal-side failure, not the position-side one.

      CERTIFIED ON DISK. Mutant R1b_DOOR_VIA_GETATTR_PRESERVED replaces two comment lines of
      `interior_stream` (leaving DERIVED_POSITION intact, so the guard's own plant anchor still
      resolves) with:

            _d = getattr(self, "page_spec")
            _d(3 + len(section))

      That is F-102's exact literal -- a front-matter page count spelled `3` -- handed to the real
      geometry door. Reading: pytest exit 0, 133 of 134 assert nodes reached, **0 FAIL**. Every
      arm of the guard passes: `refusals == []` (:1947), `tuple(vocabulary) == POSITION_NAMES`
      (:1948), `len(sites) == 23` (:1949), the per-door control (:1984), `_bare_literals == []`
      (:2001) and the sixteen-row shape table (:2039). A silent pass, which is exactly what
      ADR-0039/R2's second clause forbids and what cycle 2's F-201 gated on.

      In-memory, four of twelve shapes I planted escape the same way and all four share that one
      cause: `getattr(self, "page_spec")(...)`, `getattr(self, "page" + "_spec")(...)`,
      `getattr(self, _n)(...)` with `_n = "page_spec"`, and `operator.methodcaller("page_spec", ...)`.
      The door name as a bare string is not a POSITION name, so the string closure
      (STRING_FIELDS_READ) does not refuse it; `Call.func` is itself a `Call`, so `called()`
      returns None and the door-slot walk skips it; there is no `ast.Attribute` naming the door,
      so refusal class 3 does not fire. `getattr(` is already an idiom of this module
      (book_pdf_generator.py:5245), so the shape is not foreign to the file.

      The class has NO control that can fail. PLANTED_SHAPES is sixteen rows every one of which
      declares a non-empty outcome, so the table can only regress on a shape its author chose; it
      cannot discover a class nobody planted. That is ADR-0039/R1 as well: a claim whose control
      cannot fail is narrative, and must be narrowed to what is measured or deleted.

      What is NOT the finding, said plainly: there is no live defect. The module reports 0
      refusals, 0 offenders and 23 derived sites, every one of its own door calls is a direct
      `self.page_spec(...)`, and the behavioural monkeypatch case still covers every position that
      reaches a byte of output. What gates is the declared reach, again, in the mechanism built to
      narrow the declared reach.

      Remedy is one narrowing plus one exemption, the same shape cycle 2 asked for and got on the
      position axis: say that door recognition is by syntactic call form, name the
      unrecognisable-door class as a second exemption under ADR-0039/R3, and give it a control in
      both states (caught with the exemption removed, missed with it in place) the way EXEMPTION
      already has one.
    status: open
    attribution: 'introduced by fix 2 (eb5cbd5d) -- both "fails closed" universals and the "referenced without being called" refusal class are added lines of that commit; `git show 91a51395:tests/test_book_export_interior_cover.py` contains neither'
    family: 'FAM-POSITION-REACH -- an over-broad universal about the page-position guard''s reach, with no control that can fail on the class it misses. Same family as cycle 1 F-102 and cycle 2 F-201.'

