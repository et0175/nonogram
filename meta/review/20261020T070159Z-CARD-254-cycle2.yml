findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_db_engine_lifecycle.py
    line: 1044
    title: "arm 2b of the new control cannot fail for the claim it makes: under PAREN-DEL the scan DOES run past the closing parenthesis and arm 2b still passes (ADR-0039/R1)"
    description: |
      SECOND GENERATION of cycle 1's family. Cycle 1's Important (F-001) was
      ADR-0039/R1: a claim wider than its mechanism, in the sentence written to
      stop exactly that. The recurrence is one layer in: the claim is now in a
      *control's* docstring, and the mechanism that is too narrow is the control
      arm itself.

      The fix's own notes, the test's docstring and the dispatch brief all state
      that the two edge arms are "both killed by PAREN-DEL". Arm 2a is. Arm 2b
      is not, and cannot be.

      Arm 2b (tests/test_db_engine_lifecycle.py:1033-1047, the assert at 1044) asserts, on two
      wrapped calls in a row of which only the second carries a global name:

          assert dict(two_calls) == {(probe_file, name): 1}, (
              "the scan ran past one setattr( call's closing parenthesis into "
              f"the next call's arguments: {dict(two_calls)}"
          )

      Apply PAREN-DEL -- the mutant that deletes the very mechanism this arm
      names, `[^()]*?` -> `.*?` under re.DOTALL -- and the scan DOES run past the
      first call's closing parenthesis into the second call's arguments. Arm 2b
      still PASSES. The reason is re.finditer's non-overlapping semantics: the
      over-reaching first match starts at the FIRST `setattr(` and consumes the
      second one whole, so finditer never restarts inside it, and the count is
      exactly 1 either way. The property the arm names is invisible to the
      instrument the arm uses.

      Measured twice, independently, not argued:

        (1) a standalone pattern matrix over the four arms:
              arm              SHIPPED   NORM-DEL   PAREN-DEL
              arm1 wrapped       PASS       RED        PASS
              arm2a unrelated    PASS       PASS       RED
              arm2b two-calls    PASS       RED        PASS   <-- survives
              arm3 recv-parens   PASS       PASS       RED
        (2) the same, with each probe source extracted from the test function's
            own AST (ast.unparse of the first argument of each
            _hand_set_sites_in call) and eval'd, so the strings are the test's,
            not a paraphrase: arm2b PASS under PAREN-DEL, actual
            {('test_not_exempt.py', 'SessionLocal'): 1} == expected.

      Why the fix believed otherwise: all four arms are assertions inside ONE
      test function, so the live PAREN-DEL run dies at arm 2a's assert and never
      evaluates 2b. The run reports "FAILED
      test_a_wrapped_call_is_counted_and_a_parenthesised_receiver_is_not", which
      is true and says nothing about which arms did the killing. A per-arm kill
      matrix cannot be read off a per-test result.

      Arm 2b reds only under NORM-DEL -- i.e. for arm 1's reason, because it
      happens to contain a wrapped call. So it is a duplicate of arm 1 wearing
      arm 2a's description. Under ADR-0039/R1 (mandatory, scope tests/**) that
      is narrative, not coverage: "A claim whose control cannot fail is
      narrative, not coverage, and must be narrowed to what is measured or
      deleted."

      Blast radius is bounded and worth saying plainly: the *mechanism* is still
      controlled. Arm 2a kills PAREN-DEL on its own, so the false-positive-engine
      risk the widening created is genuinely guarded; nothing in the tree is
      miscounted (the differential sweep is zero-delta). This is an uncontrolled
      claim in a control, on the card whose thesis is that an uncontrolled claim
      must be narrowed or deleted -- which is why it is Important rather than
      Minor, and why it is worth one more cycle on a card that exists to make
      this exact point.
    suggestion: |
      Two honest options; the first is cheaper and matches the card's own thesis.

      (a) DELETE arm 2b and drop its clause from the texts. R1's own remedy.
          Arm 2a already carries the whole edge claim ("widening a count could
          otherwise turn it into a false-positive engine"), and it can fail.
          Then fix the three places that claim 2b is a control:
            - the test docstring's arm-2 bullet (tests/test_db_engine_lifecycle.py:977-984),
            - the class docstring's "Controls: arms 1 and 2 ... (counted at all;
              and not matched across an unrelated call)" (tests/test_db_engine_lifecycle.py:750-753),
            - the card's fix notes ("Edge arms ... killed by PAREN-DEL").

      (b) RESTATE arm 2b so it can fail -- assert the match POSITION, not the
          count. Verified to work before proposing it:
              second = source.rindex("setattr(")
              assert pattern.search(source).start() == second
          shipped: match starts at 122 == second setattr( at 122 -> PASS
          PAREN-DEL: match starts at 49 -> RED (over-reach detected)
          This needs _hand_set_spellings' first pattern in the test's hands
          (it is already module-level), and it makes the closing-parenthesis
          claim a measured statement for the first time.

      Either way, re-derive the kill matrix PER ARM, not per test: a single
      pytest result over a four-assert test cannot distinguish an arm that was
      killed from an arm that was never reached.
    confidence: high
    source: static
    violates: "ADR-0039/R1"
    root_cause: RC-1
    status: fixed
    fixed_in: a0c7c987
    fix_note: |
      restated arm 2b as a match-POSITION assertion (pattern.search(src).start() == src.rindex('setattr(')): shipped 122, PAREN-DEL 49 -> reds. Per-assert kill matrix re-derived with an AST instrument that records every assert independently; arm 2b now PASS/RED/RED (shipped/NORM-DEL/PAREN-DEL). All three texts that call it a control updated (control docstring arm list, class docstring Controls: line, card cycle-1 arm table struck through and corrected).
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: risk
    file: tests/test_db_engine_lifecycle.py
    line: 744
    title: "the widening enlarges the false-positive surface to an unclosed `setattr(` in prose reaching across lines, and the guard file's own new docstring is one prose edit from self-matching"
    description: |
      The deviation itself is correct (see the verdict in the markdown report)
      and the differential sweep is genuinely zero-delta. But "zero delta today"
      is not "no new surface", and the new surface is where a text scan goes
      wrong. Constructed probes, old pattern vs new:

          case                                        old  new
          A one-line call                              1    1
          B formatter-wrapped                          0    1   <- intended
          C CRLF-wrapped                               0    1   <- intended
          D backslash continuation                     0    1   <- intended
          E receiver has parens                        0    0   <- declared blind
          F receiver parens, wrapped                   0    0   <- declared blind
          G comment `setattr(`, name on a later line   0    1   <- NEW false positive
          H docstring `setattr(`, name later           0    1   <- NEW false positive
          I unrelated wrapped call, paren between      0    0
          J two wrapped calls                          0    1   <- intended
          K string literal "setattr(", name later      0    1   <- NEW false positive

      G/H/K are new-only and wrong: no code sets anything. They are reachable
      because `[^()]*?` now crosses newlines, so any `setattr(` that is never
      closed by a `)` before the next quoted global name -- which is what prose
      and comments routinely contain -- matches. The equality is tree-wide and
      count-based, so one such match reds
      test_no_test_file_outside_the_exemption_sets_those_globals for everyone.

      How near the tree actually is, measured (366 `setattr(` occurrences under
      tests/, 9 matched, 5 near misses where a global name sits within 200 chars
      but a parenthesis came first):

        tests/test_db_engine_lifecycle.py:734 -- the guard file's OWN docstring,
        added by this very fix: paren@65, name@98. The only thing between its
        `setattr(` and the literal "engine" 33 characters later is the editorial
        parenthesis in "parentheses** (".

      I then measured the fragility rather than asserting it. Reflowing that one
      sentence:
        as shipped                             -> 0 matches
        parens -> dashes                       -> 0 matches
        paren-free receiver example            -> 1 MATCH (suite reds)
        no inner setattr example               -> 1 MATCH (suite reds)
      So the guard file does not match itself only because its illustrative
      example happens to embed parentheses. A maintainer rewording that bullet
      -- on the bullet that documents this very behaviour -- reds the suite.

      Declared or not? Bullet 1 of both texts says an occurrence "in a docstring,
      a comment or a string literal" is counted, and the new bullet says the scan
      "stops at a parenthesis, never at a newline". Compose the two and G/H/K
      follow, so the texts are not inaccurate. But the class docstring's
      explanation of why the tree is clean -- "at zero false positives over this
      tree today only because no other file in `tests/` happens to write these
      three names that way" -- is now incomplete: it is also because no file
      happens to leave a `setattr(` unclosed upstream of one of these names, and
      this file comes within 33 characters of being the exception. Minor, not
      Important: measured at zero, declared by composition, and the failure mode
      is a loud self-naming red rather than a silent miss.
    suggestion: |
      One sentence in both texts, in the same words (the card's own discipline):
      note that because the scan crosses newlines, a `setattr(` left unclosed in
      prose, a comment or a string literal can reach a quoted name further down
      the file, so prose in `tests/` that quotes a `setattr(` spelling should
      keep a parenthesis or a `)` between it and any quoted global name -- as the
      receiver-parentheses example in these very bullets does.

      Optionally add it as a fifth arm (a probe with a commented `setattr(` and a
      quoted global name two lines later), which turns the sentence into a
      measured statement and pins whichever way the board decides it should go.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: a0c7c987
    fix_note: |
      receiver-parentheses example reflowed in BOTH texts to one that writes no global name out; guard file now has 0 near misses (was: paren@65, "engine"@98, 33 chars of slack) because its only quoted global-name literals are _EXEMPT_HAND_SET_SITES' own keys, all above the file's first setattr(. Class docstring's 'why the tree is clean' now gives both reasons with the tree-wide measurement (12 occurrences with a name downstream, 9 counted, 3 stopped by their own paren). New arm 4 measures the prose over-read. NOTE: at f0701729 PAREN-DEL's second kill (the tree-wide equality) WAS this self-match; with it fixed PAREN-DEL kills only the control, via arms 2a/2b/3.
    dismissed_reason: null
    learned_pattern: null

