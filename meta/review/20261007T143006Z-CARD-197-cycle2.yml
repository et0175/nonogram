findings:
  - id: F-005
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2152
    title: "Gray-boundary loops' direct grid indexing stays asymmetric with the fill loop's defensive slicing (F-003, carried)"
    description: |
      The fill loop (~line 2124) defensively slices `grid[:layout.rows]` / `row[:layout.columns]`
      before iterating, while the two new gray-boundary loops (lines 2152-2171) index
      `grid[r][c-1]`/`grid[r][c]` directly with no equivalent slice. Verified this cycle: the
      invariant that makes the direct indexing safe (grid dimensions always equal
      layout.rows/layout.columns, because ExportPayload.grid is always the same grid INV-001's
      row_clues/column_clues were encoded from, and compute_layout derives rows/columns from the
      length of those same clue tuples) holds by construction, so there is no live bug — just a
      stylistic inconsistency between the two loops in the same method. Left as-is per the
      implementer's cycle-1 reasoning (cosmetic; no test exercises a mismatch; a "fix" would either
      remove a harmless safety net from the fill loop or bolt on a guard shape that doesn't fit the
      boundary loops' structure).
    suggestion: |
      Optional, not blocking: a one-line comment at the boundary loops noting why the slice is
      unnecessary there (dimensions in lockstep with the clue tuples) would make the asymmetry
      self-documenting for a future reader, without changing either loop's logic.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_solved_page.py
    line: 346
    title: "AC-7's caller-attribution spy relies on frame introspection (sys._getframe)"
    description: |
      TestBookSolvedPage_TextHoldsTheTenPointFloor._record monkeypatches ImageDraw.ImageDraw.text
      and recovers the calling function's name via `sys._getframe(1).f_code.co_name` to distinguish
      `_write_clues` calls (exempt) from `_set_band`/`solved_puzzle_page` calls (must hold the 10pt
      floor). This works today but is coupled to the exact call-stack shape (one frame up from
      `draw.text`): if a future refactor wraps the band/caption draws through one more helper, the
      spy would silently attribute calls to the wrapper instead of the real caller, weakening the
      per-caller exemption check without failing loudly.
    suggestion: |
      Optional: walk a short chain of frames (or match on a small allow-list of known caller names)
      instead of assuming exactly one frame of indirection, so an added wrapper doesn't silently
      misattribute a call. Not blocking — the test is correct for the code as it stands today and
      the mutation spot-checks (this cycle and cycle 1) confirm it currently discriminates real
      breakage.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

