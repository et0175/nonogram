score_rationale: >-
  7.5. Cycle 1's F-001 is genuinely and completely closed, and I verified that
  rather than accepting it: the comment-in-list shape no longer drops anything,
  the new witness reds when the bug is replayed and the TRACE_TESTS pin reds
  when the witness is also collapsed, all three pins re-derive exact, the census
  579 reproduces under a third independent implementation of my own, G-2 holds
  exhaustively against all 579 refs by two instruments, and the ellipsis crux is
  true on the same bytes under both git and the trie. The round also corrected
  its own brief three times and was right each time. That is a strong round.
  It is held below 8 by one finding, not by a tally. F-001c2 is the same
  mandatory rule the fix round was cut to satisfy — ADR-0039/R2 — violated one
  frame above the frame it repaired: six YAML-legal `tests:` key shapes fall
  through the dispatch with no else, no raise and no record, and two of them are
  invisible to the NEW independent witness as well, so the round's answer to
  F-001 does not reach them. I reproduced the consequence rather than arguing
  it: with such a ref planted, the derivation misses it, both readings agree at
  510, every cell is green, and the G-2 self-check's trie — built from the
  derived set — reports CLEAN on a text spelling the ref in full. That is cycle
  1's false green at a different door. It is less severe than cycle 1's F-001
  (0 refs lost today against 16) and the repair is the same ~6 lines one frame
  up, which is why the score did not fall further.
  Two of the round's own conclusions are also over-claims with a mechanism
  behind them, and both are small: an AST cell DOES detect M2's collapse
  (F-005c2), and a per-member digest set DOES make the signal-loss response
  enforceable without reviving anything (F-002c2) — I built and ran both. The
  rest is figures: 44 ADR occurrences not 45, written into the new ADR table
  beside a blank row and a line condemning blank rows; and five pins that red
  against main because the card's own defect fired on live data while this card
  was in flight (F-004c2), which is the instrument working and a merge-time
  obligation, not a defect.

