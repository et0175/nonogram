called_out:

  1_is_the_classifier_total:
    short_answer: >-
      _tests_block IS total. The DISPATCH that decides whether to enter it is
      NOT, and that is F-001c2, gating.
    shapes_driven_at_tests_block_fourteen_of_them: >-
      Every one either collected or raised; none silently skipped:
        quoted item `- "Alpha_One"`           -> COLLECTED (quotes stripped by _split)
        item with a trailing `# retired`      -> COLLECTED as 'Alpha_One  # retired',
                                                 which then RAISES in Declared.form
        nested list `- - Alpha_One`           -> COLLECTED as '- Alpha_One' -> RAISES in form
        item is a mapping `- ref: Alpha_One`  -> COLLECTED as 'ref: Alpha_One' -> RAISES in form
        anchor/alias item `- *alpha`          -> COLLECTED as '*alpha' -> RAISES in form
        empty block, next line is a key       -> COLLECTED ()   (correct: YAML null)
        empty block at EOF                    -> COLLECTED ()   (correct)
        tab-indented item                     -> COLLECTED (expandtabs(8) throughout)
        document separator `---` at col 0     -> ends the list (dedent) — correct
        document separator indented `  ---`   -> COLLECTED as '--' -> RAISES in form
        `  ---` as the only line              -> COLLECTED as '--' -> RAISES in form
        comment at col 0 between two items    -> both items COLLECTED  (F-001's shape, fixed)
        deeper mapping key inside the list    -> RAISES
        key with no space after the colon     -> RAISES
    the_judgement: >-
      Six of these terminate in a raise one frame later, in Declared.form, not
      in _tests_block — so the message names the ref shape rather than the YAML
      line. That is acceptable under R2 (collected or raised, never skipped) and
      fails closed, but the line number is lost; a reader gets "'Alpha_One  #
      retired' is neither a bare name, a node id nor a tracked script path"
      without being told which trace.yml line produced it. Worth a `source`
      hint, non-gating.
    the_hole: "see F-001c2 — six `tests:` KEY shapes fall through both dispatch branches with no else"

  2_is_the_second_reading_genuinely_independent_and_would_any_bug_fool_both:
    is_it_independent:
      answer: "YES — a real second algorithm, and I proved it two ways rather than reading it."
      way_1_it_catches_what_the_forward_scan_cannot: >-
        Replaying F-001 out of tree (monkeypatching _tests_block to the
        break-on-non-item version): forward 494, backward 510, census 576 —
        reproducing cycle 1's figures exactly — and the cross-reading cell goes
        RED naming the disagreement. On a clean tree both read 510 and it is
        green. A restatement could not do that.
      way_2_it_catches_two_dispatch_shapes_the_forward_scan_misses: >-
        For `tests: [A,` and `tests: [A] # note` the backward scan returns 511
        where the forward scan returns 510, so the cell reds. The backward
        reading is strictly stronger than the forward one on two shapes — the
        clearest possible evidence that it is not a copy.
      the_layering_the_round_described_is_exact: >-
        M1 alone -> RED on the cross-reading (the cause). M1+M2 together -> still
        RED, now on the TRACE_TESTS pin (494 vs 510 — the consequence). M2 alone
        -> GREEN. All four measured out of tree. "The cross-reading catches the
        cause, the pinned counts catch the consequence, and neither alone is the
        witness" is accurate.
    would_any_bug_fool_both:
      answer: "YES, and I found it and reproduced it: F-001c2."
      the_shared_assumption: >-
        Both readings assume a `tests:` key's refs live either in a flow
        sequence whose value starts `[` or in a block sequence of `- item`
        lines. Neither raises on a `tests:` key of any other shape. So
        `tests: <scalar>` and `tests: >-` are invisible to both, both report
        510, they AGREE, and both are wrong. That is the "two readings of the
        same file format share an assumption" risk the brief asked about,
        instantiated and measured.
      why_the_cross_reading_cannot_be_the_whole_answer: >-
        Because it compares two readings of the same ASSUMPTION about where refs
        live. The only thing that closes that class is a default-deny on the key
        itself — the repair in F-001c2.
    was_the_out_of_tree_yaml_proof_real_and_out_of_tree:
