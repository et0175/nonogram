      - "tests/test_check_ref_resolution.py:249-251 — the claim this breaks: 'The shapes are deliberately matched narrowly: an unrecognised one raises rather than being skipped (ADR-0039/R2), and test_every_declared_check_is_classified is the control for that.'"
    what_the_fix_round_hardened_and_what_it_did_not: >-
      _tests_block (:374) is now total for lines INSIDE a block sequence, and I
      confirmed that: fourteen shapes driven at it, every one either collected
      or raised, none silently skipped (see called_out.1 for the table). The
      hole is the layer that decides whether _tests_block is entered. A
      `tests:` key is handled only if it is a complete single-line flow
      sequence (_TESTS_INLINE) or a bare key with nothing after the colon
      (_TESTS_BLOCK). Every other YAML-legal shape of the same key falls
      through both branches and contributes NOTHING, with no exception and
      nothing to read — which is F-001's defect verbatim, moved up one frame.
    the_shapes_measured:
      - "`tests: [A,` (a multi-line flow sequence) -> SILENTLY SKIPPED by the forward dispatch"
      - "`tests: >-` or `tests: |` (a block scalar) -> SILENTLY SKIPPED"
      - "`tests: SomeRefName` (a scalar value) -> SILENTLY SKIPPED"
      - "`tests: # note` (a comment after the key) -> SILENTLY SKIPPED"
      - "`tests: [A] # note` (a trailing comment on an inline list) -> SILENTLY SKIPPED"
      - "`tests: &anchor` -> SILENTLY SKIPPED"
    and_two_of_them_fool_the_NEW_WITNESS_TOO: >-
      This is the part that makes it gating rather than a hardening note. The
      round's answer to F-001 was a second, genuinely independent reading
      (_trace_tests_refs_by_backward_scan, :442). I drove each shape at BOTH
      readings, out of tree, by pointing the module's TRACE global at a planted
