        shape                      forward   backward   agree?   caught?
        ------------------------   -------   --------   ------   -------
        baseline (unplanted)         510       510       YES      n/a
        tests: <scalar>              510       510       YES      NO
        tests: >- then the ref       510       510       YES      NO
        tests: [A,\n  B]             510       511       NO       YES
        tests: [A] # note            510       511       NO       YES
        comment inside a block list  510       510       YES      n/a (the F-001 fix works — no drop)

      For `tests: <scalar>` and `tests: >-` the planted ref is invisible to the
      forward scan AND to the backward scan, because both recognise only a flow
