  - id: F-002c2
    severity: non-gating
    confidence: high
    title: >-
      The repair-vs-signal-loss refusal is NOT airtight — a per-member digest
      set identifies the departed ref by name while reviving nothing, and I
      built it
    the_rounds_argument: >-
      "Enforcement needs the departed refs; a stored ref list is exactly what
      G-2 forbids because it would revive them; and a digest cannot say who
      left. The property that makes the guard safe is the property that makes
      the response unenforceable."
    where_it_is_true: >-
      It is true of ONE digest over the whole class, which is what the module
      stores. A single SHA-256 of the sorted class genuinely cannot name a
      member. That half is correct and well argued.
    where_it_fails: >-
      It does not follow that no artefact can. The missing step is that the ref
      population is DERIVABLE AT RUN TIME, so the stored artefact never has to
      be resolvable — it only has to be matchable against a set the guard
      re-derives. Store a set of PER-MEMBER digests instead of one digest over
      the class and the response becomes enforceable.
    built_and_measured_this_cycle: >-
      Prototyped against the real BOOKKEEPING_ONLY class (13 members):
        stored artefact        : 13 per-member 12-hex digests, e.g. '080555bfe5ee'
        is that a declared ref : False — and `git grep -lw 080555bfe5ee` cannot
                                 match any ref string, so it revives nothing
        simulated a shrink     : 13 -> 12
        missing digest         : exactly one, '5dffd6a19d09'
        recovered BY NAME      : re-derived the 579-ref population, hashed each,
                                 matched the missing digest -> exactly 1 ref,
                                 and it is precisely the member I removed
        the enforceable question then asked: _strict_resolution(that ref) -> ()
                                 => SIGNAL LOSS, and assertable
      So "a class shrank because a review report was synced in" can be turned
      from English in a failure message into an assertion: on a shrink, name the
      departed member from the derived population and require that it gained a
      def/class.
    the_one_honest_residual: >-
      If the departed ref ALSO left the model (its declaration was deleted), no
      current ref hashes to the missing digest and it cannot be named. That case
      is distinguishable and already covered: it moves CENSUS, which is pinned
      exactly, so it reds there instead. The enforceable case is exactly the case
      the card is about — the resolver pruned or added, the declaration intact.
    cost: "~15 lines: baselines become (count, frozenset-of-12-hex), plus the recovery-and-assert branch in _assert_class."
    severity_rationale: >-
      Non-gating because the detector is enforced and proven, and because this
      is a strengthening the round explicitly reasoned about rather than
      overlooked. But the round's sentence is its sharpest claim and it is
      false as written, and this card is the card about claims that are
      stronger than their measurement.
    and_it_is_about_to_matter: "see F-004c2 — the response path is about to be exercised for real, with nothing but the paste-ready line in the way"

