  - id: F-009
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_sourcing_image.py
    line: 1168
    title: "Surviving mutant: the ink-threshold upper bound is not actually pinned — Pillow raises the same ValueError"
    description: |
      MUTATION CHECK (M5), src/nonogram/sourcing/image.py:314:
        -   if not 0 <= threshold <= 256:
        +   if not 0 <= threshold <= 257:
      Result: SURVIVED (174-test impact set green).

      `test_an_ink_threshold_outside_the_greyscale_range_is_a_caller_bug` asserts
      `pytest.raises(ValueError)` for (-1, 257, 1000). With the bound loosened, 257
      falls through to `greyscale.point([255]*257 + [0]*(-1))`, which Pillow rejects
      with its own ValueError — so the test passes while the module's own guard is
      broken. The test therefore pins the exception *type* only, not that the module
      is the one enforcing the range, which is exactly what its docstring claims
      ("a threshold is not user input, so an impossible one is a wiring error").
      The lower bound (-1) is genuinely pinned; only the upper half is hollow.
    suggestion: |
      Match on the module's own message, e.g.
      `pytest.raises(ValueError, match="greyscale value in 0..256")`, which fails on
      Pillow's "wrong number of lut entries".
    confidence: high
    source: static
