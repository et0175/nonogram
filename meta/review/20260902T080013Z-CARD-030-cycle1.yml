findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_sourcing_image.py
    line: 982
    title: "Verified surviving mutant: deleting the trim from generate() leaves the entire 1471-test suite green"
    description: |
      The card's headline deliverable is that `generate` trims an upload to its ink
      box. Nothing pins it.

      All five AC tests (AC-086..AC-091) go through `_untrimmed_grid`
      (tests/test_sourcing_image.py:969) and `_trimmed_grid` (:982), which
      reassemble the pipeline in the test body —
      `load_greyscale` + `ink_bounding_box` + `greyscale.crop(box)` + `binarize` +
      `to_grid` — rather than calling `image.generate`. They therefore verify that
      *the trim transform* has the claimed effect on the corpus; they never verify
      that the shipped conversion applies it.

      Every other conversion fixture is, by deliberate design (see the card's scope
      note on bands.png and the two-stripe edit to `test_transparent_areas_are_paper_
      and_not_ink`), a trim no-op — its ink box is the whole sheet. So no test
      anywhere observes `generate` cropping.

      MUTATION CHECK (M1), src/nonogram/sourcing/image.py:635:
        -   return to_grid(binarize(greyscale.crop(box), width, height))
        +   return to_grid(binarize(greyscale, width, height))
      i.e. compute the box, judge the request against it, then throw it away and
      convert the untrimmed picture — FR-022 entirely undelivered.
      Result: SURVIVED. Impact-scoped set (174 tests) green; FULL suite re-run with
      __pycache__ cleared and `-B -p no:cacheprovider` also green, rc=0.
      File restored and verified byte-identical (md5 65c607be...), tree clean.

      This is the aspirational-green pattern: an FR marked delivered, five green
      tests named for its criteria, and a shipped entry point that could stop doing
      the thing without a single failure.
    suggestion: |
      Add one test that drives `image.generate` on a source with real margin and
      asserts the trim is observable end to end. The cheapest sufficient form, in
      tests/test_sourcing_image.py next to the AC block:

        def test_generate_applies_the_trim_it_judges() -> None:
            source = PICTURES / "img_2.png"
            assert image.generate(source, *TRIM_EXTENT, _rng()) == _trimmed_grid(
                source, image.INK_THRESHOLD
            )
            assert image.generate(source, *TRIM_EXTENT, _rng()) != _untrimmed_grid(source)
            assert _deepest_blank_edge(
                image.generate(source, *TRIM_EXTENT, _rng())
            ) <= 1

      The second and third assertions are what kill M1; the first ties the AC
      helpers to the shipped pipeline so they cannot drift apart again.
    confidence: high
    source: static
    violates: AC-086
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

