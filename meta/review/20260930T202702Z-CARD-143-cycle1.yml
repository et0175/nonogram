      provably coincide (I verified that coincidence exhaustively: 0
      divergences between insertion and exchange at ±1 over every book of
      1..6 puzzles and every tier assignment).

      So the helper is a stale oracle with a live parameter. The moment a
      future card widens `_draw`/`_move` to draw a larger offset — the obvious
      next step now that a typed position exists — this line asserts the rule
      the owner rejected, and the failure will read as a regression in
      `moved_within_level` rather than as a wrong expectation.
    suggestion: |
      Replace the two-element swap with the insertion the rule now makes:
      `expected = list(sequence); expected.insert(target, expected.pop(index))`.
      Identical for every offset the property currently draws, correct for the
      ones it will draw next.
