  - id: F-004
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2152
    title: "ADR-0037/R2's literal text ('every thin/heavy rule under the book PageSpec is... in pure black') is contradicted by this method's own rendered output at filled-adjacent boundaries"
    description: |
      _stroke_drawing (line 2142) draws every thin/heavy rule pure black,
      verbatim and unedited (G-2's own argument). Immediately after, the new
      per-cell loops (lines 2152-2174) draw additional draw.line calls in
      _SOLVED_GRID_GRAY directly on top of the subset of those same rule
      pixels that sit between two filled cells. The final pixel value at
      those coordinates, in the rendered page, is gray — not pure black.
      ADR-0037/R2, read as a statement about the page's own rendered output
      (which is how AC-2/AC-3's own pixel tests read it, and how a human or a
      PDF inspector would read it), is literally false for this method's
      pages at those specific coordinates. The Worktree notes already flag
      this exact tension and argue the opposite reading (the *function* that
      strokes "the rule" is unedited, so R2's letter survives) — a defensible
      but not self-evidently correct reading, since R2's own restated text in
      the System Contract talks about what a rule IS on the page, not which
      function drew it first.
      This is NOT a live defect today: solved_puzzle_page has zero callers
      (confirmed: grep for the symbol across the repo finds only the two test
      files and the PAGE_FACTORIES registration), so no page any reader or
      the PDF pipeline can currently reach is affected, and G-2's own named
      guardrail tests (test_book_pdf_band.py, test_book_puzzle_frame.py,
      test_book_pdf_two_up.py) all pass unedited in this diff.
    suggestion: |
      Before CARD-198 wires solved_puzzle_page into a real, reachable page,
      resolve the reading explicitly — either an ADR-0037 amendment stating
      the rule governs the thin/heavy STROKE CALLS rather than final pixel
      colour (ratifying this card's reading), or accept that R2 needs a
      stated exception for a solved/answer page (mirroring ADR-0037/R1's own
      "puzzle page vs. answer/solution page" split). Either way, the decision
      should be made once, explicitly, rather than carried forward as an
      unresolved tension into a card that does make this method reachable.
    confidence: medium
    source: static
