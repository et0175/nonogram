  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2152
    title: "Gray-boundary loops index the grid directly, asymmetric with the fill loop's defensive slicing a few lines above"
    description: |
      The fill loop (around line 2122) truncates defensively:
      for row_index, row in enumerate(grid[: layout.rows]): ... row[: layout.columns].
      The two new gray-boundary loops a few lines later index grid[r][c - 1]
      / grid[r][c] directly with no equivalent slicing, assuming grid has
      exactly layout.rows rows and layout.columns columns per row. Under the
      Failure matrix's declared invariant (grid and clues always agree in
      count, enforced upstream) this is safe and the fill loop's slicing is
      itself redundant — but the two loops are stylistically inconsistent,
      and if that invariant is ever violated by a future caller, the fill
      loop degrades silently while the boundary loops raise IndexError.
    suggestion: |
      Either drop the fill loop's redundant slicing (to match the boundary
      loops' trust in the invariant) or add the same slicing discipline to
      the boundary loops, so one error-handling posture is visible throughout
      the method.
    confidence: medium
    source: static
