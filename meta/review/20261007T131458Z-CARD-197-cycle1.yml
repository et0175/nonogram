  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2206
    title: "Caption's mm->px conversion duplicates the module's own type_px() formula instead of calling it"
    description: |
      caption_font_size = round(ANSWER_TEXT_FONT_MM / 25.4 * self.dpi) is
      mathematically identical to this same file's existing
      type_px(points, dpi) -> round(points * dpi / 72) (ANSWER_TEXT_FONT_MM
      is exactly 10pt expressed in mm, so the two formulas compute the same
      value). type_px is defined in this same module and is already used by
      five other call sites (guide/divider pages) specifically because its
      own docstring calls it "the one place this module turns a type size
      into pixels". The Worktree notes justify the inline reimplementation by
      citing CLAUDE.md's reimplement-rather-than-import-across rule, but that
      rule is about avoiding imports ACROSS capability-module boundaries
      (e.g. solver avoiding clues.py) — it does not apply to calling a sibling
      function already defined in the SAME file, so the justification does
      not actually cover this duplication.
    suggestion: |
      Replace the inline formula with type_px(10.0, self.dpi) (or extract the
      10pt literal to a named constant passed through type_px), so the
      conversion has one source of truth in this file.
    confidence: high
