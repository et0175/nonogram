area_1_subsumption:
  importer_set_rederived:
    verdict: "HOLDS -- exactly 3, on both arms, under a predicate broader than the survivor's."
    how: >-
      Wrote an independent ast walk over tests/**/*.py that flags ANY import
      statement in ANY form mentioning the leaf name `shared_fixture_controls`
      (ImportFrom module, ImportFrom alias names, Import alias names), excluding
      the home itself and the survivor's own module. BROAD = 3, NARROW (the
      survivor's own two shapes) = 3, BROAD-only = empty. Identical on
      4d164f62 and on a58284bb.
    the_three: "tests/test_book_pdf_band.py, tests/test_book_puzzle_frame.py, tests/test_book_puzzle_page_vector.py"
    the_third_never_had_a_copy: >-
      CONFIRMED by `git grep` for the deleted function's def line at the fork
      point: exactly two hits, band :1624 and frame :3125. The vector file has
      none, and its 65 node ids are unchanged across the diff. So the survivor's
      scope was strictly wider than the two copies' -- before the card as well
      as after it (see F-004).

  is_the_bound_IDENTICAL_or_merely_similar:
    verdict: >-
      IDENTICAL, and stronger than the round claimed: it is the SAME SOURCE. The
      deleted guards' bodies are inlined copies of
      `shared_fixture_controls.fixtures_taken_dynamically`, which is what the
      survivor reaches through
      `refuse_unless_nothing_is_taken_dynamically`. Same traversal
      (`ast.walk(ast.parse(...))`, i.e. unbounded depth), same node type
      (`ast.Attribute`), same discriminator (`node.attr == "getfixturevalue"`),
      same `sorted(... lineno)` reduction, same `assert not taken`. There is no
      predicate gap to find, and I looked for one.
    the_only_difference: >-
      WHICH FILE'S SOURCE is read. The deleted guards read their own module's
      `Path(__file__)`. The survivor reads `Path(path)` for each path that
      `_importers()` returns. That relocates the question from "is the predicate
      the same" (it is) to "is the file set the same" -- and that is where
      F-001's defect lives.

  shapes_the_round_did_not_try:
    harness: >-
      Six shapes planted one at a time at end-of-file in the BEFORE tree, so all
      three guards (band's, frame's, the survivor) are observable on the same
      run. 3 collected every time, 0 skipped, lock clear, blob restored and
      asserted on every row.
    matrix_band_only:
      - { shape: "none (negative control)",                             band: PASS,  frame: PASS, survivor: PASS, note: "3 passed in 1.80s" }
      - { shape: "plain method, `request.getfixturevalue(\"page\")`",   band: FAIL,  frame: PASS, survivor: "FAIL, names band:1972", note: "the round's own shape -- 2 failed, 1 passed" }
      - { shape: "NESTED FUNCTION inside the test body",                band: FAIL,  frame: PASS, survivor: "FAIL, names band:1973", note: "NOT tried by the round -- caught" }
      - { shape: "inside a LIST COMPREHENSION",                         band: FAIL,  frame: PASS, survivor: "FAIL, names band:1972", note: "NOT tried by the round -- caught" }
      - { shape: "bound method taken THROUGH A VARIABLE then called",   band: FAIL,  frame: PASS, survivor: "FAIL, names band:1972", note: "NOT tried by the round -- caught" }
      - { shape: "reached via `getattr(request, \"getfixture\"+\"value\")`", band: PASS, frame: PASS, survivor: PASS, note: "NOT tried by the round -- MISSED, by BOTH. See F-005." }
      - { shape: "near-miss: the word in a docstring only",             band: PASS,  frame: PASS, survivor: PASS, note: "the round's negative control -- reproduces" }
    conclusion: >-
      The survivor catches every shape the deleted guards catch, including three
      the round never planted, and misses exactly the one shape the deleted
      guards also miss. Because the predicate is the same code this is a
      structural certainty, not a sampling result -- the experiments confirm it
      rather than establish it. `ast.walk` is full-depth, so nesting cannot
      escape either reading.

  one_file_at_a_time:
    verdict: "REPRODUCES, and the discipline was NECESSARY -- I measured the short-circuit it defeats."
    band_only: "band FAIL / frame PASS / survivor FAIL naming band -- 2 failed, 1 passed in 1.61s"
    frame_only: "band PASS / frame FAIL / survivor FAIL naming frame:3443 -- 2 failed, 1 passed in 1.44s"
    both_planted: >-
      3 failed in 1.35s, and the survivor's single AssertionError names
      `test_book_pdf_band.py` line 1972 ONLY. The loop
      `for path in _importers(): controls.refuse_unless_...(path)` raises on the
      first failing importer and never reaches the second, and `_importers()`
      returns `sorted(...)` so band always comes first. A both-planted mutation
      would therefore have credited the survivor for band's mutant and left
      frame's deletion UNPROVEN. The round's choice is correct and load-bearing,
      not a stylistic preference.
    grep_near_miss_control:
      substance: "HOLDS -- the bound is an ast reading, so the docstring-only plant leaves all three green while a text instrument would fire."
      figure: "the round's '7 times per file' does not hold on the tree it describes. See F-006."

  skip_gating: "checked and clear -- the survivor and its class's two non-vacuity tests all ran, none skipped, on both arms."

