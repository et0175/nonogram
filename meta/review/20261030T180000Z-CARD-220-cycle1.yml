    consequence: >-
      AC-6 ("a solo profile before and after, both wall-clocks recorded") is
      therefore NOT discharged by this cycle -- it is deferred, not met. AC-6 is
      explicitly "recorded, not asserted", so this does not gate; but the merge
      gate owes the solo figure, or AC-6 should be restated as scope-level.

# ---------------------------------------------------------------------------
# FINDINGS, RANKED
# ---------------------------------------------------------------------------
findings:
  - id: F-001
    severity: medium
    confidence: high
    source: measured
    title: >-
      The survivor's SCOPE SELECTOR is blind to one of the two idiomatic import
      forms -- the one its own module uses -- and the deletion removed the
      per-file guards' immunity to that. No coverage gone today; a
      coverage-preservation property is.
    where: "tests/test_shared_fixture_controls.py::_importers (:169-:195), and its only guard at :364"
    what: >-
      `_importers()` recognises exactly two shapes: an `ast.ImportFrom` whose
      `node.module` is the home or ends with `shared_fixture_controls`, and an
      `ast.Import` whose alias name IS the home. It does NOT recognise
      `from tests.helpers import shared_fixture_controls as controls` -- an
      ImportFrom whose `module` is `tests.helpers` and whose ALIAS carries the
      leaf name. That is not a hypothetical idiom: it is the one
      tests/test_shared_fixture_controls.py:57 uses for itself, the only
      occurrence of it in the tree, and it is excluded from the loop only by the
      separate `path == Path(__file__).resolve()` self-skip.
    measured: >-
      Synthetic importer added out of tree, with a live
      `request.getfixturevalue("pages")` consumer, three arms, 1 collected each:
      (A) recognised form `from tests.helpers.shared_fixture_controls import ...`
      -> survivor FAILED, naming test_zz_new_importer.py line 18 (positive
      control, the instrument rises);
      (B) the alias form `from tests.helpers import shared_fixture_controls as
      controls` -> survivor PASSED, 1 passed in 1.30s. A real importer with a
      real violation runs GREEN;
      (C) no import of the home at all -> survivor PASSED (negative control, the
      instrument does not rise on a near miss).
      File removed after the experiment; the AFTER tree's collect is unchanged.
    why_it_matters: >-
      Before the card, band and frame each carried a guard keyed on their own
      `__file__`, which no import-statement refactor could switch off. After the
      card the bound reaches those files ONLY through `_importers()`. Rewriting
      band's import line to the alias form -- an innocuous, idiomatic change
      that the project's own test file models -- silently drops band out of the
      bound with nothing red. Compounding it: the only guard on the set is a
      floor of `len(importers) >= 2` at :364 against a measured set of 3, so
      losing ONE importer is silent too. The survivor's docstring claim that it
      is "applied here rather than once per consumer file so that a module which
      starts importing the shared home is covered the day it does" is FALSE for
      one of the two forms a module might start importing it with.
    verdict_on_the_deletion: >-
      The deletion is still correct -- the survivor's scope is 3 files against
      the copies' 2, so coverage strictly grew, and the brief's question "is the
      bound identical" answers YES. But the round proved the PREDICATE and never
      attacked the SCOPE SELECTOR, and the selector is the half with the defect.
      This is the card's own rule-3 concern class ("coverage reduction wearing
      curation's clothes") in a conditional form: not reduced now, reducible
      silently later.
    fix: >-
      Three lines in `_importers()`: also match an `ast.ImportFrom` whose
      `node.names` carry the leaf name, and an `ast.Import` whose alias name
      ENDS WITH the home rather than equalling it. Then raise :364's floor from
      a hand-written 2 to the measured set size, or assert the set equals a
      derived membership so a drop-out reds. Cheap, and it makes the deletion
      strictly better rather than merely safe.

  - id: F-002
    severity: medium
    confidence: high
    source: measured
    title: >-
      AC-4 cannot fail on this diff by construction, and the round presents it
      as a measurement that could have gone the other way.
    measured: >-
      Every removed line in the diff, filtered for comparison operators, yields
      exactly four hits, and all four are the same string equality
      `node.attr == "getfixturevalue"` (two per deleted guard). There is no
      numeric comparison against any length anywhere in the removed text, and no
      file other than the two changed. The only other removals are two import
      statements. So "0 fallen, 0 lost, 0 new" was GUARANTEED regardless of the
      collector's quality -- a collector that returned the empty set would have
      reported the same verdict.
    why_it_matters: >-
      The card's own framing is that this is the gate where a blind instrument
      produces a clean bill of health, and the report answers that worry with 286
      sites and nine controls. The controls are good work and the instrument is
      real (I confirmed 0 fallen under a collector with 768 deduped sites and
      five extra shapes). But the report should state that on THIS diff the
      measurement has no way to fail, so a reader does not take "0 fallen" as
      evidence about the deletion. The instrument is worth keeping for the next
      curation card, where it will not be vacuous.
    also: >-
      The instrument is genuinely narrower than the report reads: blind to 7
      reversed-operand sites, 14 `.count() >= N`, 37 min/max-sided comparisons
      and 662 `len(x) == N` censuses. None is in a changed file and none is a
      corpus minimum (the 7 reversed sites all compare against 0, 1 or 2), so
      the blindness costs nothing here. Worth recording before the instrument is
      reused.

  - id: F-003
    severity: low
    confidence: high
    source: measured
    title: >-
      "Three further groups were rejected without mutation, each with its
      reason" is recorded nowhere. Only one of the three is even alluded to, and
      none by name.
    measured: >-
      Searched the card (453 lines, in full), the commit message of a58284bb (in
      full), meta/review/ (no CARD-220 file existed before this one) and the
      worktree (`git status --porcelain --ignored` shows only .pytest_cache/, so
      there is no untracked round artefact). The card's "## Worktree notes"
      section is a single em dash. The negative-control pair is identifiable
      only by chasing the quoted docstring phrase, which occurs at three sites
      in two files -- so even that one is not pinned.
    why_it_matters: >-
      AC-5's obligation is "the card records why the pair was not redundant".
      That is discharged, well, for the door pair. The three rejected groups are
      a bare claim: a later card re-cutting this work cannot tell which
      candidates were already considered and declined, which is precisely the
      institutional memory this card exists to produce. The claim that one pair
      is the other's negative control is also the single most load-bearing
      "do not delete this" in the round's report and it names neither test.
    fix: "name the three groups and their node ids in the card's Worktree notes. No code change."

  - id: F-004
    severity: low
    confidence: high
    source: measured
    title: >-
      Half the value claim is unsupported: the third importer was already
      covered at the fork point, so "a third importer NOW covered" is a
      zero-delta claim.
    measured: >-
      The survivor's node id is present in the FORK-POINT collect (grep over the
      4d164f62 node-id file: 1 hit), and neither
      tests/test_shared_fixture_controls.py nor
      tests/helpers/shared_fixture_controls.py appears in
      `git diff --name-only 4d164f62..a58284bb`. The third importer's 65 node ids
      are identical on both arms. So the survivor, the bound and the three-file
      scope all existed before this card and the card changed none of them.
    what_the_card_actually_delivered: >-
      The removal of two INLINED DUPLICATES of a bound that already had a single
      home and already covered all three importers. That is a real, modest
      maintenance win and it is worth having. But "one bound in one place
      instead of three near-copies" overstates it in a second way too: there
      were never three near-copies of the BOUND -- there was one bound in the
      helper plus two inlined copies of its body. Net value: two fewer inlined
      duplicates, minus the form-immunity in F-001.
    why_it_matters: >-
      This card's 2026-10-15 correction orders it re-justified on maintenance
      terms or parked. The maintenance justification is the whole remaining case
      for the card, so an overstated version of it is the one claim that must be
      exact. Rewrite the value sentence to what the diff did.

  - id: F-005
    severity: info
    confidence: high
    source: measured
    title: >-
      Both readings miss a fixture reached through `getattr(request, "getfixture"
      + "value")`. Not a subsumption gap -- a shared blind spot, inherited.
    measured: "planted in band in the BEFORE tree: 3 passed, all three guards green, 0 skipped. The attribute name is a string constant, not an `ast.Attribute`, so neither the deleted copies nor the survivor can see it."
    why_it_is_only_info: >-
      Identical on both arms, so the deletion neither created nor widened it, and
      the helper's own docstring already concedes that no static reading can
      close this channel because the fixture name is a run-time expression. The
      deleted guards' docstrings also listed four further open shapes and handed
      them to CARD-219. Recorded so a future card does not rediscover it as new.

  - id: F-006
    severity: info
    confidence: high
    source: measured
    title: >-
      "A grep instrument would have fired 7 times per file" does not hold on the
      tree it describes -- it is 5. Another figure with an unstated domain, in
      the round's own report this time.
    measured: >-
      At the fork point, `getfixturevalue` occurs 5 times in
      tests/test_book_pdf_band.py and 5 times in tests/test_book_puzzle_frame.py,
      by `grep -c` (matching lines) and `grep -o | wc -l` (occurrences) alike --
      the two agree, so the domain ambiguity does not explain it. At HEAD both are
      2. The 7 is reachable only on the round's own docstring-only MUTATED tree,
      i.e. baseline 5 plus its 2 planted mentions. Separately, "ast used 10x
      elsewhere" in the frame file: I count 22 load-context reads of the name
      `ast` at HEAD (2 at the fork point were the deleted guard's).
    why_it_matters: >-
      The substance is untouched -- grep fires, ast does not, and I reproduced
      that. But the round's own finding 3 is that this board's dominant defect
      family is figures whose domain was never stated, and these two are
      instances of it inside the report that names the family. Worth stating so
      the pattern is not read as applying only to other people's numbers.

  - id: F-007
    severity: info
    confidence: high
    source: measured
    title: >-
      AC-3's "the two protected node ids" cannot be correct under any reading.
      The round's flag is right; the card text needs the fix.
    measured: >-
      The protected list names five items. One is a helper module with no node
      ids. The A4 golden alone resolves to two classes in two files with ~130
      parametrised node ids between them. The mask_runs cross-check is a further
      single node id (tests/test_solver.py:619). So "two" matches nothing: there
      are either 4 protected TARGETS (the round's reading, and the right one) or
      ~136 node ids.
    judgement: >-
      It does not matter for this card -- the intersection is empty because only
      two files changed and none of the five lives in either, so no reading of
      "two" changes the verdict. It matters for the NEXT card that reads AC-3 as
      a gate instruction, because an under-specified gate is one a round can
      discharge by naming any two things. Over-covering to four was the correct
      response. Fix the card text to name the four targets by path.

