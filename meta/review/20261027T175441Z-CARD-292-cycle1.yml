findings:
  - id: F-001
    severity: major
    title: >-
      A results cell reports the host through `pgrep -fc`, which does not exist
      on this platform - and the prose asserts a reading that command cannot
      have returned
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 445
    also_at: [295, 342, 343]
    gating: true
    confidence: certain
    evidence: |
      The instrument, on this box:
        $ pgrep -fc 'bin/python -m pytest'
        usage: pgrep [-Lfilnoqvx] [-d delim] [-F pidfile] [-G gid] ...
        exit=2
        $ X=$(pgrep -fc 'bin/python -m pytest' 2>/dev/null); echo "X=[$X]"
        X=[]
      BSD/macOS pgrep has no -c (confirmed against `man pgrep`'s SYNOPSIS:
      [-Lfilnoqvx]).  So inside a `$(...)` host cell it yields an EMPTY string,
      not a count.  The working form returns a count:
        $ pgrep -f 'bin/python -m pytest' | wc -l
        0
      What the document does with it:
        line 445 (a RESULTS TABLE ROW of this card's own pre-gate):
          | **rival-pytest, start / end** (`pgrep -fc`) | **0 / 0** |
        lines 342-343 (prose, asserted as a measurement):
          "`pgrep -fc 'bin/python -m pytest'` counts processes and returned
           **0** on the same box in the same minute."
        line 295 (inside the block the document calls "verbatim", section 6,
        which exists so the convention "outlives this worktree"):
          #   rival-pytest   `pgrep -fc 'bin/python -m pytest'`, both ends.
      Either the 0 / 0 came from a different command than its label states, or
      it is not a measurement.  The one reading that cannot be true is the one
      at line 343: that command returned a usage error, not 0.
      The "verbatim" claim is also already false.  main corrected the convention
      at d61f0be1; diffing the document's section 6 block against main's
      config.yml:
        -  #   rival-pytest   `pgrep -fc 'bin/python -m pytest'`, both ends.
        +  #   rival-pytest   `pgrep -f 'bin/python -m pytest' | wc -l`, both
        +  #                  ends. NOT `pgrep -fc` -- BSD/macOS pgrep has no
        +  #                  -c flag and exits with a usage error ...
        -  #                  returns 2 with no pytest running at all, so its
        +  #                  returns 2-3 with no pytest running at all, so its
      Why gating: this is the cell the convention itself names as "the cell that
      decides whether the run was quiet", in the card's own AC-6 instance, in the
      artefact written to survive the worktree.  A host cell that silently empties
      is precisely the failure AC-6 exists to prevent, so AC-6's single required
      instance does not demonstrate the convention.
    remedy: >-
      Replace every `pgrep -fc` in the document with `pgrep -f '...' | wc -l`,
      re-sync section 6 against main at d61f0be1 (or state that it is a snapshot
      and name the commit), and either re-take the section 8 host cells with the
      working form or label them "not measured".  The 0 / 0 is almost certainly
      the true value - no rival pytest ran - but as it stands it is a figure
      whose stated door cannot have produced it.

  - id: F-002
    severity: major
    title: >-
      Four shipped docstrings state the module is 306 KB - the figure this card
      recomputed and refuted in the same commit series
    file: tests/test_book_export_interior_cover.py
    line: 1105
    also_at: [6313, 6385, 6398]
    gating: true
    confidence: certain
    evidence: |
      The card's own document, section 1.4, under the heading
      "The warm/cold page-cache mechanism: REFUTED":
        | module size | 306 KB | **389,177 bytes (380 KB)** |
      Recomputed by me:
        $ python -c "import os; print(os.path.getsize('src/nonogram/admin/book_pdf_generator.py'))"
        390485              # 381.3 KiB / 390.5 kB
      What ships in the tree, four times:
        1105: #: this module's 306 KB that is 2.557 s of the 2.843 s one analysis cost
        6313:     per analysis over a 306 KB module, and the door-axis controls run 108
        6385:     #: the node's line on every call, so an exhaustive sweep of this 306 KB
        6398:         Nodes of ``book_pdf_generator.py`` -- the 306 KB source
      The rule is explicit that a figure in a docstring is a claim whose control
      is recomputation and that no mutant will catch a stale number.  Here the
      card performed that recomputation, published the correction in its own
      document, and then shipped the refuted figure four times in the standing
      test tree - where it is the version a future reader will find first,
      because the document is a card artefact and the docstring is in the file.
    remedy: >-
      Replace the four occurrences with the recomputed figure (and see F-004 on
      which unit).  One sed, no behaviour change, no re-run needed.

  - id: F-003
    severity: minor
    title: >-
      The stated mechanism "re-splits its WHOLE source argument on every call"
      is not what this Python does, and the same file states it correctly 70
      lines later
    file: tests/test_book_export_interior_cover.py
    line: 1104
    also_at: [6311, "meta/profiling/card-292-per-test-ceiling.md:111"]
    gating: false
    confidence: certain
    evidence: |
      CPython 3.14.3's ast.get_source_segment:
        lines = _splitlines_no_ff(source, maxlines=end_lineno+1)
      and _splitlines_no_ff breaks out of the finditer loop at maxlines.  So it
      splits up to the NODE'S line, not the whole source.  Measured on one
      analysis of the real module: 740 get_source_segment calls, 673
      _splitlines_no_ff calls, 2.280 s tottime in the split.
      The file says both things:
        1104: "that function re-splits its whole ``source`` argument with a
               regex on **every** call"   <- not true on this Python
        6384: "``ast.get_source_segment`` re-splits the source up to the node's
               line on every call"        <- correct
      The conclusion (quadratic-ish in module size, 80-90 % of the analysis) is
      unaffected - I reproduced it - but the claim as written at 1104/6311 and
      at document line 111 is not what the stdlib demonstrates, and a reader
      checking it against ast.py will find the contradiction inside one file.
    remedy: Keep the 6384 wording and delete "whole" from the other three places.

  - id: F-004
    severity: minor
    title: "389,177 'bytes' and '44.8 MB' are CHARACTER counts - the instrument's domain is not carried into the figure"
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 100
    also_at: [101, "meta/profiling/card292_plant_reads.py:93"]
    gating: false
    confidence: certain
    evidence: |
      The probe sums len(text) AFTER decode (card292_plant_reads.py:61,85), so
      its "bytes read" is characters:
        $ python -c "...; print('chars',len(s),'bytes',len(s.encode()),'ondisk',st.st_size)"
        generator: chars 389177  bytes 390485  ondisk 390485
        page_spec: chars  25867  bytes  25929  ondisk  25929
        108 each -> 44,824,752 chars = 44.8 MB if counted as bytes
      So 389,177 is exactly the CHARACTER count (and the file is 390,485 bytes),
      and 44.8 MB is 44.8 M characters = 42.7 MiB.  The module is not all-ASCII
      (first non-ASCII at line 3 - the card establishes this elsewhere, in the
      narrowing of its own equivalence claim), which is why the two differ.
      Magnitude is 0.3 %, so nothing downstream moves; the defect is that the
      figure's label states a domain the instrument does not measure, on a card
      whose subject is instrument domains.
    remedy: >-
      Say "389,177 characters (390,485 bytes on disk)" and relabel the probe's
      line as "characters read", or encode before measuring.

  - id: F-005
    severity: minor
    title: >-
      "675 calls per analysis" is attributed to the wrong function, and the
      chain "675 per analysis x 108 analyses per test" does not hold
    file: tests/test_book_export_interior_cover.py
    line: 1103
    also_at: [6312, "meta/profiling/card-292-per-test-ceiling.md:112"]
    gating: false
    confidence: high
    evidence: |
      One analysis of the real, unplanted module, instrumented by me (counting
      shim, no cProfile), plus a cProfile run through the same door:
        ONE analysis: segment() calls = 716
        cProfile:  740 ast.get_source_segment   /   673 ast._splitlines_no_ff
      So 675 is within 2 of the SPLIT count (673) and is 65 short of the
      get_source_segment count (740) it is attributed to.  Minor on its own.
      The chain is the part that does not hold.  The same docstring says the
      door-axis controls "run 108 analyses in one test", which invites
      675 x 108 = 72,900 segment calls.  Measured over the real test:
        COUNTS: {'page_positions': 108, 'segment_calls': 25873, 'split_entries': 23461}
        segment calls per analysis: 239.6
      The planted analyses are far cheaper than the unplanted one the 675 was
      taken from, so the per-analysis figure may not be multiplied by the
      analysis count.  108 is exactly right; 675 is a property of one particular
      analysis and its domain is not stated.
    remedy: >-
      State 673 splits per unplanted analysis and name it as such, or state the
      measured 25,873 segment calls per test.  Both are recomputable.

  - id: F-006
    severity: minor
    title: >-
      "2.8429 s -> 0.2864 s (9.9x)" is a cProfile figure that cannot be
      reconciled with the test's own cost; unprofiled it is 8.2x and 80 %
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 172
    gating: false
    confidence: high
    evidence: |
      The domain IS stated ("cProfile, same process, same host"), which is why
      this is minor rather than gating.  But 108 analyses x 2.8429 s = 307 s
      against a measured before-cost of 105.65 s for the whole test, so a reader
      who multiplies gets 3x the truth.  Re-measured by me, same door, no
      profiler:
        ONE analysis (memoised): 0.2792 s
        ONE analysis (stdlib)  : 2.2835 s      -> 8.2x, not 9.9x
        cProfile total 2.994 s, of which _splitlines_no_ff 2.402 s -> 80 %
                                                     (document says 90 %)
      Sign, order and mechanism all reproduce; the ratio and the share are
      cProfile-inflated and the document presents them as the analysis's cost.
    remedy: Add the unprofiled pair beside the profiled one, or say "under cProfile" in the ratio cell itself.

  - id: F-007
    severity: minor
    title: "A share whose denominator's revision is not named"
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 102
    gating: false
    confidence: high
    evidence: |
      The cell reads "0.0416 s - 0.039 % of the test's 107.19 s".  107.19 s is
      the BEFORE arm's cost; the probe at HEAD reports the same reads against
      the AFTER arm:
        $ python meta/profiling/card292_plant_reads.py
        test wall clock   27.32 s
        read_text calls   216
        seconds in reads  0.0454 s  = 0.166% of the test
      Same refutation, different share, and nothing in the cell says which
      revision 107.19 s belongs to.  The refutation itself is unaffected and is
      arithmetically airtight: 2 of 216 reads can be cold, 0.0018 s.
    remedy: Name the revision in the cell.

  - id: F-008
    severity: minor
    title: >-
      Nothing reds if the cheapening is reverted - declared, not hidden, but
      worth recording as the one price that can silently return
    file: tests/test_book_export_interior_cover.py
    line: 1723
    gating: false
    confidence: certain
    evidence: |
      My M10 re-fire: reverting line 1723 to ast.get_source_segment leaves the
      file green (2 passed, exit 0) at 105.65 s and 87.27 s.  The memo has a
