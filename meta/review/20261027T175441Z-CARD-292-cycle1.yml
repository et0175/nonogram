  negatives are true as declared, and M10's declared survival is proved rather
  than merely humble. It is not certified because the two gating findings are
  both in the one class this board gates on - a claim that its own code and
  measurements do not support. F-001: the card's own AC-6 instance reports a
  host cell through an instrument that cannot produce it on this platform, and
