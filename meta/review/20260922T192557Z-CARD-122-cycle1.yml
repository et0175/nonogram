findings:
  - id: F-001
    severity: critical
    category: feature
    type: bug
    file: src/nonogram/admin/app.py
    line: 2440
    title: "Tabs drop most of their own puzzles: 371 of 441 available puzzles are unreachable on the rendered page"
    description: |
      The store query is narrowed with side_range=(bucket.low, bucket.high), which
      puzzle_review matches as "EITHER side in [low, high]" (puzzle_review.py L758 /
      L856-860). That is a superset of the tab, as the worktree notes say — but the
      store applies ORDER BY + LIMIT/OFFSET to the superset (L925-927), and only then
      does the route drop the non-members with _is_in_tab. The page has no pagination
      control at all (grep for has_more/offset/limit in book_select_puzzles.html and
      base.html: no hits), so a browser always loads offset=0, limit=50.

      Measured against the real route (441 approved puzzles, one per supported
      extent, in-memory store, default sort batch_id,-size,quality):

        tab   <=15: members= 36  rendered=  0   header says "(0 available)"
        tab  16-20: members= 85  rendered=  0   header says "(0 available)"
        tab  21-25: members=135  rendered= 20   header says "(20 available)"
        tab  26-30: members=185  rendered= 50   header says "(50 available)"
        TOTAL available=441  reachable across all four tabs=70  UNREACHABLE=371

      The default sort is width-descending, so the first 50 rows of the <=15 tab's
      superset are all 26..30-wide rows that _is_in_tab then discards — the tab renders
      empty while 36 puzzles belong on it.

      This fails the card's objective 1 ("Each puzzle is listed on exactly one tab") and
      EC-024's route-level clause ("every available puzzle appears on exactly one
      rendered tab") as the product actually renders. AC-208/209/210 pass only because
      their fixtures hold 1-4 puzzles.
    suggestion: |
      Move the bucket decision into the store query so LIMIT applies to members only,
      without introducing a second threshold table (G-1/EC-024): pass the bucket's
      (low, high) as a *longest-side* predicate the store can express — e.g. add a
      `longest_side_range` to PuzzleFilter implemented as
      `func.max(Puzzle.width, Puzzle.height).between(low, high)` (SQLite/Postgres both
      have a 2-arg max) and `max(w, h)` in the in-memory branch, with book_plan
      remaining the only source of the (low, high) pairs. Failing that, page the store
      until the tab is full and render real pagination controls. Either way
      `total_count` must be the tab's true member count, not the surviving slice.
    confidence: high
    source: static
    violates: EC-024
    root_cause: RC-1
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/templates/book_select_puzzles.html
    line: 108
    title: "\"(N available)\" reports the surviving page slice, so the header states a false zero"
    description: |
      The route sets total_count=len(filtered_puzzles) (app.py L2459) — the count AFTER
      the Python bucket filter has eaten the store page — and the template renders it as
      "Longest side <=15 <small>(N available)</small>". In the measurement under F-001
      the <=15 and 16-20 tabs both render "(0 available)" while 36 and 85 puzzles
      respectively are available on them.

      This is worse than the truncation itself: an empty list with an explicit "0
      available" plus the empty-state copy ("No approved puzzles with a longest side of
      <=15 match these filters. Try another tab…") tells the owner a true statement is
      false. The store's own `total` (the pre-page count) is discarded.
    suggestion: |
      Once F-001's fix makes the store query bucket-exact, report the store's
      PuzzleListResponse.total_count rather than len(filtered_puzzles), and render the
      empty state only when that total is genuinely 0.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_select_tabs.py
    line: 490
    title: "The EC-024 route-level property test passes limit/offset the product never sends, so it certifies a path no user can reach"
    description: |
      `_every_offered_id` walks each tab with `panel.tab(book_id, bucket, limit=PAGE,
      offset=offset)` — explicit `?limit=100&offset=N` query parameters. No rendered page
      produces such a URL: `book_select_puzzles.html` contains no pagination control, no
      link that sets `offset`, and no `limit` field (verified by grep over the template
      and base.html), and the POST form's hidden fields carry bucket/difficulty/
      quality_min/theme/status/puzzle_name only — `_SELECT_FILTERS` names "limit" and
      "offset" but nothing ever submits them.

      So `test_PropertyTest_LongestSideBuckets_PartitionEveryExtent` is green on a
      corpus of 441 puzzles while the same 441 puzzles, loaded the way the browser loads
      them, leave 371 unreachable (F-001). This is exactly the aspirational-green
      pattern: the test's `given` is not the screen's `given`.
    suggestion: |
      Add one case to the same test that loads each tab with NO limit/offset — the URL a
      browser actually requests — and asserts that the four tabs between them still
      offer every available puzzle (or, if paging is the intended answer, that the page
      renders a reachable control for the next page and that following it terminates on
      the full set). Keep the paged walk as a second case.
    confidence: high
    source: static
    violates: EC-024
    root_cause: RC-1
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2245
    title: "The kept selection lives in the signed session cookie and silently overflows the 4 KB browser limit at ~135 puzzles"
    description: |
      `_keep_selection` writes the full list of ticked puzzle ids into
      `session["book_selection"][book_id]`. The admin panel uses Flask's default
      client-side session (app.py L745-760 sets SECRET_KEY and cookie flags; no
      server-side session interface is installed), so that list is serialised into the
      `session` cookie on every response.

      Measured with Flask's own SecureCookieSessionInterface serializer and UUID ids:

         50 ticked -> 1575 bytes    ok
        100 ticked -> 3056 bytes    ok
        120 ticked -> 3636 bytes    ok
        150 ticked -> 4507 bytes    OVERFLOW (browser limit ~4093)

      ADR-0034's DEFAULT_PLAN is 150 puzzles, and the four tabs exist precisely so the
      owner accumulates a whole book's worth of ticks before the single commit. At the
      overflow point Werkzeug warns to the server log and the browser silently discards
      the cookie — taking the entire session with it, including `unit_preference` and
      `book_<id>_cover_path` written elsewhere in this same app. AC-211 then fails
      silently, with no error the owner can see. The threshold is lower in practice,
      since other session keys share the same 4093 bytes.
    suggestion: |
      Keep the pending selection server-side rather than in the cookie: either a
      per-book scratch table / in-memory map keyed by a small session token, or a
      compact encoding (the store already has the ids; storing them as raw 16-byte UUIDs
      base64'd roughly halves the size but only moves the ceiling). If the cookie is
      kept, at minimum cap the kept set and tell the owner when the cap is hit, instead
      of losing the selection without a message.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "223fa3e"
    dismissed_reason: null
    learned_pattern: null

