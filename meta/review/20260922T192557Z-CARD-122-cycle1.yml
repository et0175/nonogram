  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2268
    title: "N+1: _selected_cells issues one get_puzzle per book member on every render"
    description: |
      `_selected_cells` loops `for puzzle_id in list(book.puzzle_ids) + list(kept_ids)`
      and calls `puzzle_review.get_puzzle(puzzle_id)` for each. In DB mode every call
