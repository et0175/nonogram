findings:
  - id: F-101
    severity: Minor
    rule_family: >-
      the class F-001 belongs to (a hairline reaching cells that are not
      filled), audited across siblings rather than at the one arm named
    defect: >-
      Both arms that protect "no cell other than a filled one carries a
      hairline" run at the DESKTOP viewport only, so the same defect scoped to
      a media query survives the card's whole test file -- while the file
      docstring says the mechanism assertions "hold for any rendering of this
      stylesheet".
    location: >-
      tests/test_puzzle_solver_fifth_rule.py:20-22 (the file docstring's claim),
      :697 (the blank-board arm pins DESKTOP), :758
      (test_no_other_cell_state_gains_a_shadow pins DESKTOP)
    failure_scenario: >-
      a future card adds a rule inside @media (max-width: 820px) that paints
      the hairline on .player-cell -- a plausible shape for a phone-only
      tweak, since admin.css:633 is already exactly such a one-line block.
      Every blank cell on every phone board gains a grey inner ring it never
      had, and all 17 tests in this file stay green.
    evidence: >-
      CONFIRMED-by-execution. PHONE-REACHES-BLANK (the hairline put on
      .player-cell inside the existing @media block, line-count-preserving):
      recording pass over the whole file, 50 PASS, 0 FAIL, 0 NOT-REACHED,
      0 BLIND of 50 assertion nodes, collected tests 17, pytest exit 0.
      NOT A NO-OP: at 390x844 a blank board's computed box-shadow goes from
      {'none': 400} to the inset string on all 400 cells, and that board is
      byte-identical to the "forced on everywhere" board the shipped blank
      phone board differs from in 19560 pixels past tolerance.
    why_minor_and_not_important: >-
      the claim is not narrative -- it has a control that CAN fail, and does:
      :729 and :803 both red under REACHES-BLANK and BROADEN-UNKNOWN at
      desktop. Each test also declares its own domain honestly (the
      blank-board docstring's first line is "DOMAIN: Chromium, 1440x900"), and
      the ADDED_SINCE_BEFORE reasons make no viewport claim. What overreaches
      is one sentence of the FILE docstring about the mechanism class, and what
      is missing is a phone arm -- the exact symmetric gap F-002 closed for the
      pixel arms one class up. It is also pre-existing rather than introduced
      by the fix round.
    cheapest_honest_fix: >-
      parametrize test_no_other_cell_state_gains_a_shadow on _VIEWPORTS (it
      reads computed styles only, so the phone case costs one page load and no
      new figure), or bound the file docstring's sentence to "any rendering at
      the viewport the test names". Either closes it; neither is this card's
      obligation to take.
  - id: F-102
    severity: Minor
    rule_family: a comment that claims a guarantee nothing enforces
    defect: >-
      The new _VIEWPORTS constant's comment says it exists "as one list so a
      test cannot be parametrized on a subset of them by accident", but nothing
      enforces that -- and two tests in the same file are desktop-only without
      going through it.
    location: tests/test_puzzle_solver_fifth_rule.py:74-78
    failure_scenario: >-
      a later reader trusts the word "cannot" and believes every viewport-aware
      test in the file covers both; :697 and :758 do not, which is F-101. No
      behaviour is unprotected -- this is a naming-vs-mechanism mismatch of
      exactly the kind the card's own worktree notes care about.
    evidence: >-
      CONFIRMED by construction and cross-checked against the file: the four
      @pytest.mark.parametrize sites that use _VIEWPORTS (:396, :454, :490,
      :595) are a convention, not a guard; a fifth could be written
      [(DESKTOP, "desktop")] and nothing would notice. No test in the file or
      in test_browser_fixture_scope.py asserts anything about _VIEWPORTS.
    cheapest_honest_fix: >-
      drop the word "cannot" (say what it is: one list so the two band tests
      and the two sweep tests cannot DRIFT apart), or make it true with an AST
      check in the fixture-scope file. The wording is the cheaper half.

