the_noise_finding:
  claim_under_test: >-
    after widening _SHADOW_OFF, the "comparing nothing" control at :748 flipped
    FAIL->PASS under both mutants, and that PASS was bought by 32 pixels
    differing by at most +-1 per channel, at x=227 and x=725, between two
    renderings whose computed box-shadow is the same string on all 400 cells.
  verdict: CONFIRMED-by-execution, exactly, through a door that never calls _differing
  method: >-
    /tmp/card270_review2_noise_probe2.py reproduces the TEST's own sequence of
    page operations (swatches, the _tokens full-page screenshot, board shot,
    _SHADOW_OFF injected, board shot, _SHADOW_OFF REMOVED and the "everywhere"
    rule added, board shot) and computes the full per-pixel max-channel delta
    HISTOGRAM itself, parametrized on the WIDE (shipped) and the NARROW
    (pre-fix) control so both states are measured in one run. A first probe
    that merely ADDED the everywhere rule to the shipped page found the two
    renderings byte-identical -- so the +-1 noise is produced by the style
    add/remove cycle, which is what the assert actually compares, and only the
    test's own sequence can measure it. Reported because a reader could
    otherwise reproduce the simpler sequence and think the figure wrong.
  measured_under_REACHES_BLANK_wide_control:
    arm_729_shipped_vs_without: 'bytes EQUAL = False; 36320 px differ, all past tolerance -> the arm REDS'
    control_748_shipped_vs_everywhere: '32 px differ, ALL at delta exactly 1; 0 px past tolerance 8'
    old_assert_bytes_differ_would_say: 'True  (i.e. PASS -- bought by noise)'
    new_assert_changed_ge_400_would_say: 'False (i.e. RED -- correct)'
    where: 'x=227 (16 px, y 182..630) and x=725 (16 px, y 182..630), max delta 1'
    computed_box_shadow: 'the IDENTICAL string on all 400 cells in both readings (measured, not reasoned)'
  measured_under_REACHES_BLANK_narrow_control:
    arm_729: 'bytes EQUAL = True -> PASS. F-001''s tautology re-confirmed from the pixel side.'
    control_748: '0 px differ; old assert would say False -> FAIL. Exactly cycle 1''s (622 PASS, 637 FAIL).'
  measured_under_SHIPPED:
    arm_729: 'bytes EQUAL = True -> green'
    control_748_desktop: '36320 px differ, all at delta 64; floor 400; headroom 90.8x'
    control_748_phone_same_comparison: '19560 px differ, all at delta 64; floor 400; headroom 48.9x'
  is_the_docstring_figure_precisely_stated: >-
    yes, under this file's own usage. x=227 and x=725 are not the extremes of
    the .player-board ELEMENT (0 and 953) but of the GRID inside it: measured
    in board-screenshot coordinates, cell (0,0)'s left edge is 227.80 and cell
    (19,19)'s right edge is 725.30, with a row-clue gutter on each side. "The
    board's left and right extremes" is the same sense in which admin.css's own
    comment says "the board's outer frame", so the claim is true, not loose.
    Recorded with the coordinates so no later reader has to re-measure it.

