open_questions_ruled_on:
  q1_does_748_need_parametrising_on_viewport:
    ruling: 'NO -- and the answer is measured, not reasoned'
    evidence: >-
      the floor is nowhere near exercised at phone cell sizes. The same
      comparison the arm makes, run at 390x844 where the cell is 14.39 px,
      changes 19560 pixels past tolerance against the 400 floor -- 48.9x
      headroom, against 90.8x at desktop (36320 vs 400). Every differing pixel
      is at delta 64, two full orders above _TOLERANCE = 8 and three above the
      +-1 noise floor, at BOTH viewports. There is no cell size in the card's
      declared range at which 400 becomes tight: the floor is one pixel per
      cell and a 14 px cell's hairline contributes about 49.
    but: >-
      a phone arm WOULD buy something, and it is not the floor -- it is the
      blank-board claim itself. That is F-101, logged separately, and the right
      lever for it is the cheaper test_no_other_cell_state_gains_a_shadow
      rather than a second screenshot-differencing arm at a second viewport.
      Parametrising :748 for the floor's sake would be work that measures
      nothing.
  q2_the_zoom_flake:
    ruling: >-
      RECORDING IT WAS THE RIGHT CALL FOR THIS CARD'S GATE, AND IT NEEDS A CARD
    not_this_cards_defect: >-
      established structurally rather than asserted: git diff --name-only
      main...HEAD is five files and names neither
      tests/test_puzzle_solver_zoom.py nor tests/conftest.py; the shared
      browser fixtures live in tests/test_puzzle_solver_page.py and the whole
      of this card's change to that file is six lines inside the PAGE_ISOLATION
      data dict (no fixture, no test, no assertion). The card adds no JS and no
      state change. The isolation guards that would catch a new cross-test
      leak are green in this cycle's impact run, including
      test_the_riskiest_tests_pass_alone[test_puzzle_solver_fifth_rule] (2.63 s)
      and both order-independence probes (18.65 s / 18.37 s).
    why_it_still_needs_a_card: >-
      the symptom -- a one-finger drag marking 225 cells, i.e. the entire 15x15
      board, instead of 5 -- is a correctness-shaped nondeterminism in the
      player's own drag handling at 200 % zoom
      (TestSolverZoom_OneFingerDragIsUnchangedByZoom, around
      tests/test_puzzle_solver_zoom.py:403-423), not a timeout or a flaky
      selector. This board defers the full suite to the merge gate, so a
      1-in-5 red in the browser family is a red at exactly the moment nobody
      is positioned to diagnose it; and "recorded, not diagnosed" in a worktree
      note dies with the worktree. The board's own precedent is one card old:
      F-004 was an out-of-scope sibling defect found in review and it got
      CARD-275 rather than a note.
      Recommendation: a quick card, same shape as CARD-275, owning the
      diagnosis and a seeded reproduction attempt. It must NOT block CARD-270's
      merge.

