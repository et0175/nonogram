re_aimed_tests:
  - name: TestGuidePage_ExtraPageShiftsEverythingByOneKeepingParity::test_every_pages_parity_still_equals_its_own_position
    verdict: still testing its name's claim -- STRENGTHENED
    why: >
      Moved to a book storing gutter 20 mm / outside 10 mm, where parity really moves
      the drawing. The previous version skipped up to six width-bound pages and only
      asserted the sign of the offset; the new one asserts every page carrying a
      drawing (12 of 17, with an asserted minimum) and asserts the magnitude equals
      half the margin difference, which the old one could not.
  - name: TestBookPdf_UnbuildablePuzzleNeverShiftsALaterPage::test_the_second_survivor_did_not_inherit_the_dropped_page_parity
    verdict: still testing its name's claim -- STRENGTHENED
    why: >
      Moved to gutter 20 mm / outside 10 mm. The old body asserted
      `abs(second - first) > EDGE_TOLERANCE_MM` plus a spare-dependent formula; the
      new one pins each survivor to its own expected left edge, asserts the two
      expectations are 10 mm (118 px) apart -- "not a tolerance" -- and re-states
      EC-032's formula on the profile where it is not an identity.
  - name: TestBookPdfMemory_InteriorAndCoverStillSeparate::test_parity_still_counts_from_interior_page_1
    verdict: still testing its name's claim -- held, by a different and valid signal
    why: >
      The drawing genuinely cannot carry the signal any more (equal margins + centring
      => same pixel column at both parities), so the test reads parity off the footer's
      2 cm QR block and asserts `outer > 4 * inner` on both checked pages -- a real
      asymmetry with teeth, not an identity. It additionally asserts the drawing's two
      side gaps are equal, which documents why the old signal is gone. Net: the claim
      is as well covered as before.
  - name: TestBookExport_FirstPuzzlePageParityCountsFromInteriorPage1 (three tests)
    verdict: WEAKENED -- see F-002
    why: >
      Not on the card's list of three, and the one place the re-aim went wrong: all
      three parity assertions became identities on the equal-margin profile, one of
      them by being inverted, and the docstring names a replacement assertion that was
      never written.

