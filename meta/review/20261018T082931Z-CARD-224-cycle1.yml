    severity: minor
    file: tests/test_book_puzzle_frame.py
    line: 2438
    claim: >
      AC-4's test_it_is_not_pushed_further_down_than_the_old_placement guards itself
      with `assert ink_bottom / PX_PER_MM > area_bottom, "this page's drawing really
      is deeper than its puzzle area"`.
    evidence: >
      `_area_ink_box` crops the page to `round(area_bottom * PX_PER_MM)`, so
      `ink_bottom` saturates at that row. Measured on this fixture (SHORT = 160 mm
      trim, 30x30 behind 15-deep gutters): area_bottom = 1395.764 px, crop row = 1396,
      ink_bottom = 1396 -- the assertion passes on round()'s own 0.236 px, while the
      drawing's real bottom edge is 1749 px (30 mm below the footer rule). The guard
      would pass identically for a drawing that stopped exactly on the footer rule, so
      it does not show what it says. The claim itself is genuinely covered by the
      sibling test_such_a_page_prints_no_footer_group_to_cross, which reads
      layout.page.drawing_bottom.
    suggested_fix: >
      Assert the depth off the layout (`layout.page.drawing_bottom / PX_PER_MM >
      area_bottom`) or off an uncropped page read, and keep `_area_ink_box` for the
      ink_top half it is actually able to measure.

