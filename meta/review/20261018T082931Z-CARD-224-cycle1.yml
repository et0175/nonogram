      asserted to 0.005.
  - claim: "AC-378's test asserts the measured difference, says why each row is where it is, and goes red in both directions."
    status: verified
    how: >
      test_the_two_top_rows_differ_by_the_single_pages_own_float asserts both the
      derived figure (_predicted_gap_mm, built from the file's own CON-018 millimetres
      and the cell read back off the drawn grid -- no layout function on either side)
