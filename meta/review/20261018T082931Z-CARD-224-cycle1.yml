  - claim: "G-5: no earlier fixture regenerated or deleted."
    status: verified
    how: >
      git diff cc4430b HEAD -- tests/fixtures/ shows two additions and zero
      modifications; --diff-filter=D over the whole diff is empty; all 23 earlier
      book/proof baselines are still present.
  - claim: "AC-6's ink measurement uses one convention on both sides and the inset is insensitive."
    status: verified
    how: >
      _ink_bands (tests/test_book_pdf_two_up.py:1115) returns
      (ink_top - AREA_TOP, AREA_BOTTOM - ink_bottom) -- each band measured from its own
      rule to the drawing's outermost ink, the same convention at both ends; the 6 px
