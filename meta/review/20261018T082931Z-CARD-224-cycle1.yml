verified_claims:
  - claim: "_draw_solved_slot's return value is unchanged, so both consumers are unchanged."
    status: verified
    how: >
      AST comparison of src/nonogram/admin/book_pdf_generator.py and book_proof.py
      against cc4430b with every docstring normalised: identical. Both files' entire
      +111/-xx is docstrings and comments. solved_puzzle_page and _packed_answer_page
      are therefore byte-identical code, and the caption box (caption_bottom,
      caption_right) contract did not move.
  - claim: "What moved underneath the two consumers is safe for both."
    status: verified
    how: >
      _packed_answer_page draws through _packed_tile_layout, whose vertical position
      is unchanged (vertical_bound="slot", band_bottom == drawing_top).
      solved_puzzle_page draws through compute_layout, so its drawing and the caption
      hanging a fixed gap below it both move down by 0.42 x spare; the caption's own
      guard is `slack = usable_bottom - drawing_bottom >= gap_px + line_height`, and
      slack under the float is 353 + 0.58 x spare px against a 73 px requirement, so
      no caption is newly omitted. Answer pages are drawn with _draw_folio and never
      _draw_page_frame, so they carry no footer rule for the lowered caption to cross.
      The move is recorded and attributed over three fixtures by the new
      test_the_floated_answer_page_moved_under_this_card_and_nothing_before_it.
  - claim: "Two new required fields on all three constructors, no defaults."
    status: verified
    how: >
      PagePlacement gains band_bottom: int and vertical_bound: VerticalBound, both
      without defaults; compute_layout, _slot_layout and _packed_tile_layout all pass
      both. A fourth constructor cannot compile without them.
  - claim: "header_band reads band_bottom; without it the band grows by tens of mm and its type drifts under the header rule."
    status: verified
    how: >
      height = page.band_bottom - page.usable_top is 142 px (12.0 mm) on Book 1; read
      off drawing_top it would be 362 px (30.7 mm) for a 15x15 and 623 px (52.8 mm)
      for a 10x10, whose center_y (311) lands below the header rule row (289) and
      inside the puzzle area. Mutant `band_bottom=ys[0]` KILLED.
  - claim: "For two-up slots and packed tiles band_bottom == drawing_top, so those are byte-identical."
    status: verified
    how: >
      Both pass band_bottom=_round_px(top) while drawing_top = ys[0] =
      _boundaries(top, pitch, n)[0] = _round_px(top). Identical by construction, and
      asserted in TestPairLayout_UpperSlotSitsAtItsOwnBandFoot.
  - claim: "qr_slot(...) is None on a degraded page, so no footer group is crossed."
    status: verified
    how: >
      Asserted in both AC-3's sweep (held >= 200 cases) and AC-4's
      test_such_a_page_prints_no_footer_group_to_cross, and the control
      test_the_control_a_trim_that_can_hold_it_floats_instead asserts qr_slot is NOT
      None on a trim that can hold the same 45-cell drawing.
  - claim: "The degraded placement is byte-identical to the pre-card position."
    status: verified
    how: >
      _placed_drawing_top returns band_bottom unchanged, which is exactly the retired
      `top = _exact_px(top_mm) + _exact_px(band_mm)`. Mutant
      `return ratio, "footer"` KILLED.
  - claim: "AC-1's mirroring half is genuinely under test; a 141 px shift between parities."
    status: verified
    how: >
      CARD-223's _unequal_spec (gutter 19 mm / outside 7 mm) is imported from
      tests/test_book_qr_slot.py, not reimplemented;
      test_on_unequal_margins_the_area_moves_and_the_alignment_does_not asserts the
      shift equals (19 - 7) mm = 141.7 px with an explicit
      `assert abs(expected_shift) > 100, "this sheet must really move the area"`, and
      asserts the drawing stays centred in the moved area.
  - claim: "G-1: pairing verdicts and the committed cell are bit-for-bit CARD-204's."
    status: verified
    how: >
      compute_pair_layout's only code change is the removal of the
      `outer_reserve_px=folio_reserve_px` kwarg on the lower slot's call; the
      folio_reserve_px fit/re-fit block (layout.py:3386-3411) and the accept/refuse
      path are untouched, and _slot_layout receives cell_mm rather than computing it.
      The verdict is therefore taken before any changed line runs.
  - claim: "Removing _slot_layout's outer_reserve_px moved nothing."
    status: verified
    how: >
      It only ever shifted the anchor the card replaces; under the centred anchor
      `left = usable_left_px + max(spare, 0)/2` it has no expressible effect. Its
      removal is accompanied by a renamed property test
      (test_PropertyTest_BookTwoUp_SlotsAreCentredAcrossTheUsableWidth), and mutant
      `_slot_layout left -> usable_left_px` was KILLED.
  - claim: "G-3: the clamp is still genuinely tested and the three regimes are what they claim."
    status: verified
    how: >
      _OVER_SPARE_TITLE (measured 2190 px) is added, and
      test_the_three_titles_really_are_in_the_three_regimes bounds each regime off the
      page's own measurements: drawing_width < over_grid < room, room < over_spare <
      usable_width, over_page > usable_width. The clamp assertions are parametrised
