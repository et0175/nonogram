findings:

  - id: F-001
    severity: important
    file: src/nonogram/export/layout.py
    line: 2525
    claim: >
      "_placed_drawing_top"'s docstring: "A spare that cannot pay that clearance twice
      over is treated as no spare at all, which is what makes 'no drawing or clue ink
      crosses either rule' (EC-022) a property of the arithmetic rather than of the
      trims that happen to be stored today." The card's AC-3 rests on this being
      "arithmetic and not luck".
    evidence: >
      (a) The arithmetic does not deliver the stated clearance. The guard is
      `if spare < 2 * clearance`, but only GRID_SPARE_ABOVE of the spare lands above
      the drawing, so the guard yields gap_above >= 0.42 * 2 * clearance = 0.84 *
      clearance -- LESS than the one clearance it is supposed to buy. The invariant
      survives only because clearance = ceil(thick/2) + ceil(furniture/2) + 1 is one
      pixel more generous than the need (thick/2 + furniture/2), and 0.84*(need+1) >=
      need holds only while need <= 5.25.
      (b) Measured margin over every admissible extent (rows/cols 5..40, every clue
      depth 1..(n+1)//2) on four sheets: the drawing's topmost ink clears the header
      rule's ink by 0.555 px (h200), 0.659 px (Book 1: 39x35, depths 18/20, spare
      12.283 px), 0.757 px (100x100 trim), 1.025 px (6x9 trim). Sub-pixel, not
      arithmetic.
      (c) It fails outright once the heavy rule reaches 14 px (need 8.5 > 0.42*2*10 =
      8.4). PageSpec(cell_cap=...) is a public COMP-007 field with no upper bound:
      with cell_cap=18.0 mm, 126 (trim, extent) combinations place ratio-branch ink on
      the header rule -- e.g. height 212 mm, 5x5, column depth 3, spare 20.213 px >=
      2*clearance=20, ink top row 290 against header rule row 289. Not reachable
      through book_page_spec today (the sole PrintProfile is BOOK1 at 7.5 mm and
      comfort_cap_mm maxes at 9.0 mm), so this is a false claim plus an uncovered
      line, not a live print defect.
      (d) Nothing tests the threshold. Mutant `spare < 2 * clearance` ->
      `spare < clearance` SURVIVED all four targeted selections, including both
      property files (tests/test_book_puzzle_frame.py CARD-224 classes,
      tests/test_layout_two_up.py, tests/test_layout_page_spec.py,
      tests/property/test_book_layout.py, tests/property/test_book_pdf_geometry.py,
      tests/property/test_book_two_up.py). The only oracle that models the threshold,
      Sheet.drawing_top_mm at tests/property/test_book_pdf_geometry.py:166, accepts
      BOTH candidate rows inside CLEARANCE_WINDOW_MM = 2.0 mm (23.6 px), which is
      wider than the implementation's own 12 px threshold on every stored trim -- so no
      test in that file can pin it either. tests/test_book_puzzle_frame.py's own
      oracle `_expected_top_mm` uses `spare <= 0`, which also cannot see it; its
      docstring nevertheless names those two property modules as where "the boundary
      itself" is pinned.
    suggested_fix: >
      Condition on what is actually needed: `GRID_SPARE_ABOVE * spare >= clearance and
      (1 - GRID_SPARE_ABOVE) * spare >= clearance`. Then add one test that fails when
      the threshold is halved -- e.g. assert, for a spec whose spare is engineered just
      above and just below the threshold, both the vertical_bound verdict and the
      measured ink clearance, with the clearance term derived in the test from
      thick_rule and the two furniture rule widths rather than from the window.

  - id: F-002
    severity: important
    file: tests/test_book_pdf.py
    line: 664
    claim: >
      TestBookExport_FirstPuzzlePageParityCountsFromInteriorPage1 (AC-287) still
      verifies that parity counts from interior page 1; its re-aimed docstring states
      "The page's parity is therefore asserted where it is still visible: the usable
      area's own edges, which the drawing is centred in. The identity is asserted
      explicitly rather than left to look like evidence."
    evidence: >
      On CON-018 as amended, gutter == outside == 12.700 mm, so
      `_expected_left_mm(..., right_hand=True)` and `_expected_left_mm(..., right_hand=False)`
      return the identical number (the function is now `left_margin + spare / 2`).
      All three of this class's parity tests therefore became identities in this diff:
      * test_the_first_puzzle_page_is_right_hand asserts the drawing is at the
        right-hand position -- a number equal to the left-hand position;
      * test_it_is_not_the_left_hand_page_a_miscount_would_give_it was INVERTED, from
        `assert abs(left_mm - left_hand) > EDGE_TOLERANCE_MM` to
        `assert abs(left_mm - left_hand) < EDGE_TOLERANCE_MM` -- it now asserts the
        drawing IS at the left-hand position, the exact opposite of its name;
      * test_the_parities_alternate_from_there now asserts a difference of
        `GUTTER_MM - OUTSIDE_MM`, which is 0.
      No assertion anywhere in the class reads the usable area's own edges, so the
      replacement the docstring names does not exist. Failure scenario: revert the
      interior-page-1 offset so the first puzzle page is treated as EVEN (the miscount
      the class is named for) -- every test in the class still passes, because the
      drawing lands on the same pixel column either way.
      Two other re-aimed tests in this same card handled exactly this situation
      correctly by moving to an unequal-margin book
      (TestBookPdf_UnbuildablePuzzleNeverShiftsALaterPage,
      TestGuidePage_ExtraPageShiftsEverythingByOneKeepingParity); this class was left
      as identities instead.
    suggested_fix: >
      Give this class its own unequal-margin book, the way the two siblings above
      already do (`_book(gutter_mm=20.0, outside_mm=10.0)`), and restore the
      inequality in test_it_is_not_the_left_hand_page_a_miscount_would_give_it on that
      book. If the equal-margin profile is to be kept, read the parity off something
      that still mirrors (the footer's QR block, as
      tests/test_book_pdf_memory.py::test_parity_still_counts_from_interior_page_1 now
      does) and say so in the docstring.

