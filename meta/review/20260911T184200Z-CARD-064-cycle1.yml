  - id: F-002
    severity: medium
    category: tech-debt
    type: bug
    file: src/nonogram/admin/image_manager.py
    line: 170
    title: "Exact-threshold share depends on orientation (float); inclusive boundary untested"
    description: |
      _kept_share divides float ratios. A picture that keeps exactly 90%
      gets a status that depends on its orientation: (100,90) at Fixed 10 ->
      chosen_kept 0.8999999999999999 -> MOVED_TO_LARGE (30x27), while the
      transpose (90,100) -> 0.9 -> FITS (10x10). No test sits on the
      boundary: mutant `chosen_kept >= MIN_KEPT_SHARE` -> `>` survives all
      five related test files (90 passed). Kept Minor rather than the
      surviving-mutant default because only exact-ratio inputs are affected
      and the outcome is a visible move, not a silent crop.
    suggestion: |
      Compare with a small tolerance (>= MIN_KEPT_SHARE - 1e-9) or with
      integer cross-multiplication. Add a boundary test in both orientations
      (e.g. 100x90 and 90x100 at Fixed 10 -> FITS).
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: medium
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 54
    title: "±1 retry neighbour can land below MIN_KEPT_SHARE"
    description: |
      neighbour_extents ignores MIN_KEPT_SHARE. In a seeded corpus, 356 of
      6,547 neighbour candidates of FITS/MOVED pictures keep less than 90%.
      Example: 441x1442 at Small moves to 10x30; if 10x30 is abandoned it is
      generated at 10x29, keeping 88.7%. Another: 560x254 at Medium fits 20x10
      (90.7%); its neighbour 19x10 keeps 86%. The results line says only
      "generated at 10x29 — 10x30 had no unique solution" and gives no share.
      The card keeps the ±1 retry, so this may be accepted, but it contradicts
      G-2's "never crop below the threshold silently".
    suggestion: |
      Either drop neighbours whose share is below MIN_KEPT_SHARE, or put the
      share in the adjustment line. Ask the owner which.
