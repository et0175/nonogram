    title: "MOVED_TO_LARGE pictures are not listed in the batch results (G-2)"
    description: |
      The batch loop flashes skipped pictures (app.py:471-474) and ±1 retry
      adjustments (app.py:440-445), but a MOVED_TO_LARGE picture generated at
      fit.extent produces no line at all. Scenario: c5 at Medium is generated
      at 10x30; the results page shows "Generated 1 puzzle(s) from 1 image(s)"
      and a 10×30 thumbnail, with nothing saying Medium was not used. G-2 says
      "every changed or skipped picture is visible in the preview and in the
      batch results". CARD-058's own rationale treats bare numbers as not
      visible. test_ac1_a_thin_picture_is_moved_to_large_end_to_end discards
      the flashed messages, so nothing pins this.
    suggestion: |
      For fit.status == MOVED_TO_LARGE, append a results line, e.g. "c5.jpg:
      the chosen size (10x20) would cut this picture (keeps 69%) — generated
      at Large 10x30". If ±1 retry then changes the extent, fold that into the
      same line. Assert it in the AC-1 e2e test's flashed list.
    confidence: high
    source: static
    violates: G-2
    root_cause: RC-1
    status: open
