  - id: F-004
    severity: low
    category: tech-debt
    type: question
    file: src/nonogram/orchestrator.py
    line: 466
    title: "MAX_RESAMPLE_ATTEMPTS is structurally non-binding whenever regeneration occurs"
    description: |
      Because `attempt_candidate_in_tier` runs the inner regenerate loop, every
      resample round consumes at least one regenerate attempt and neither
      counter is reset. Therefore `resample.attempts <= regenerate.attempts` at
      all times, and the resample bound can only ever be the one that trips in
      the exact lockstep case (every round found a unique candidate on its
      first draw). In every run where any regeneration happens, the run ends on
      the regenerate bound instead.

      This is not a defect — it is exactly what ADR-0002 asks for ("the
      regenerate/resample loop ... is capped at 20 attempts", justified by
      bounding total solver invocations), and the tier-aware
      `_uniqueness_reason` exists precisely to report the right cause on that
      path. But the two-constant surface (`MAX_REGENERATE_ATTEMPTS` /
      `MAX_RESAMPLE_ATTEMPTS`) reads as though a run gets 20 of each, and a
      future reader retuning one of them may expect an independence the loop
      shape does not have.
    suggestion: |
      One sentence in the `MAX_RETRY_ATTEMPTS` comment stating the derived
      property outright — "resample.attempts can never exceed
      regenerate.attempts, so the effective budget for a request is 20 sourced
      grids in total, not 20 per loop" — would close the gap between the two
      names and the one budget.
    confidence: high
    source: static
