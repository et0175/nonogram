      named for — would still leave the cache empty at the end and still pass.

      The AC-1 comparison is NOT vacuous regardless: mutant M4 (restoring the pre-card
      host lookup) reds all six `test_the_generated_cover_is_the_same_pixels_on_both_hosts`
