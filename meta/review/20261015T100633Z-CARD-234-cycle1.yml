    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 3297
    title: "Whitespace with no ink inside a title is refused, while a whitespace-only title is drawn blank"
    description: |
      The glyph gate treats "has no glyph" as "unletterable", which pulls in whitespace
      and control characters that carry no ink at all. Measured through the real entry
      point on this worktree:

        create_cover_page("Winter Pictures\t")  -> UnletterableTitle
        create_cover_page("Winter\tPictures")   -> UnletterableTitle
        create_cover_page("\t")                 -> blank cover (the AC-5 guard)

      Also refused: U+000D, U+000B, U+000C, U+0085, U+3000. Accepted (verified over 59
      characters): NBSP U+00A0, ZWSP U+200B, SHY U+00AD, BOM U+FEFF, WJ U+2060, LRM/RLM,
      U+2002, U+202F — so the common paste artefacts are safe and the gate is sound for
      realistic Latin/Cyrillic/Greek/punctuation/currency titles.

      Reachability (this is what makes it more than theoretical): HTML's value
      sanitization for <input type="text"> (src/nonogram/admin/templates/book_create.html:74)
      strips LF and CR but NOT tabs, and the title is stored raw — the only validation is
      `len(title.strip()) == 0` at src/nonogram/admin/book_manager.py:522. So a title
      copied out of a spreadsheet cell with a trailing tab is storable, and the cover
      export then fails. The owner sees only the generic PDF_EXPORT_FAILED flash
      (src/nonogram/admin/app.py:4900 / :5227); the named character is in the server log.

      Before this card that title printed a .notdef box (or tiny type); now it produces
      no cover file at all. That direction is the card's declared decision and the loud
      failure is better than a bad book, so this is not a gate — but the card's own
      principle ("nothing to letter, so nothing is drawn", the AC-5 guard) is applied
      only when the WHOLE title is whitespace, and mutant M2 shows why: with the guard
      removed, "\t" raises UnletterableTitle. The guard exists precisely to stop the gate
      refusing inkless whitespace, and it stops it in one position only.
    suggestion: |
      Either exclude inkless whitespace from the gate (skip characters for which
      `character.isspace()` and the face draws nothing, or probe the title with its
      whitespace runs collapsed), or normalise the title on the Finalise/create screen so
      a tab never reaches the drawing code. The card's observation #3 already names the
      second option; a follow-up card is the right home, and it should also cover the
      untreated tab in the download filename at app.py:5223.
    confidence: low
