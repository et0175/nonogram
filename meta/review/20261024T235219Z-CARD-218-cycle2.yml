findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_book_pdf_band.py
    line: 1757
    title: "AC-5's new retention control is 0.21 % from its own bound and cannot see it: the
      declared @lru_cache blind spot hides 25,192,439 B -- 0.9979 page bitmaps -- in the very
      module whose docstring names the two caches that hold it"
    description: |
      MEASURED, deterministically, twice, and reproduced at the fork point.

      The control `TestBookPdf_TheSharedRenderLeavesNoBitmapBehind::
      test_no_module_level_accumulator_retains_a_page_bitmap` asserts
      `total < unit`, i.e. "total retained bitmap bytes < one page bitmap
      (25,245,000 B)", and its docstring states the universal: **"Nothing this
      module leaves behind is as big as one page bitmap."** Its instrument
      reports **256 B**.

      What `tests/test_book_pdf_band.py` actually leaves alive in
      `sys.modules` after every fixture is finalised, measured by walking the
      two @lru_cache wrappers' stores with `gc.get_referents` (the store
      `functools` "does not expose" is reachable that way in three lines of
      stdlib):

        _set_once   lru_cache(maxsize=None), currsize=666 -> 24,435,107 B  (666 numpy ndarrays)
        _font_bytes lru_cache(maxsize=None), currsize=1   ->    757,076 B  (bytes)
        _SHARED_SNOWFLAKE_DIGEST                          ->        256 B
        -------------------------------------------------------------------
        TOTAL                                                25,192,439 B = 0.9979 page bitmaps

      Against a bound of < 1.0000 page bitmaps, the real headroom is
      **52,561 B (0.21 %)**, not the "five orders of magnitude" the round's
      notes and the control's own docstring claim. The figure is exact and
      stable: two consecutive runs gave 24,435,107 B / 666 entries byte for
      byte, and the same run against the band file at the FORK POINT
      `c7cca514` gives the identical 24,435,107 B -- so this retention is
      **pre-existing and NOT created by CARD-218**, which is why this is high
      and not critical.

      WHY IT GATES ANYWAY, and it is the orchestrator's own criterion:
      ADR-0039/R3 says an exemption must record "whatever it still cannot see
      as a **measured bound with its own failing control**". The exemption here
      is recorded as prose, with no figure and no control -- and the
      orchestrator's test for a declared bound ("acceptable only when it
      cannot hide a real instance") fails on measurement, not on argument:
      there IS a real instance, it is 98,400x larger than everything the
      instrument can see, and it sits at 99.79 % of the bound. Two further
      consequences:

      * The control's own failure message prints that false total. Under the
        bytes-restored mutant it reads "this module will leave 201,960,000 B
        (8.00 page bitmaps) alive after its fixtures are finalised" --
        verbatim, measured -- while the true figure in that arm is
        226,395,083 B. A guard whose diagnosis is wrong by 24 MB is the same
        displaced-diagnosis shape rule 2 of this card exists to prevent.
      * The hiding channel is reachable with this module's own idioms, which
        is what makes it a live false negative rather than a curiosity.
        `_bitmap_bytes` returns **0** for a numpy array of page pixels
        (measured: `_bitmap_bytes(np.asarray(page)) = 0` while
        `arr.nbytes = 25,245,000`), and numpy arrays of page pixels are
        exactly what this module's `_scan` and `_set_once` produce. The numpy
        channel is NOT in the declared blind-spot list at all; nor is a
        bitmap held on a Test class attribute (measured:
        `_retained_bitmap_bytes({'TestX': Holder})` with `Holder.pages=[page]`
        returns `{}`).
      * The instrument's blindness is the single point of failure for the
        whole AC-5 guarantee, demonstrated with a mutant nobody had run
        (X2 in the notes): neuter the container-summation branch of
        `_retained_bitmap_bytes` AND put the bytes back, and the control goes
        **GREEN on 201,960,000 B of retained bitmaps** (1 failed, the
        read-only control, vs 2 failed with the branch intact).

      FAILURE SCENARIO (inputs/state -> wrong outcome): CARD-219 converts six
      more files with this same machinery (the pre-gate's FINDING B says so).
      A converter hoists a render behind a cached helper -- the natural shape
      in a module that already caches by `(text, size)` -- e.g.
      `@lru_cache def _book_pages_for(level): ...` returning a list of pages,
      or keeps the pages as `np.asarray(page)` because that is what the
      assertions consume. The whole book stays alive in `sys.modules` for the
      rest of the ~1400 s suite, the AC-5 control reports 0 B and passes, and
      the card closes on a green control. That is F-001 of cycle 1, recreated
      by the control written to prevent it.

      The frame file is CLEAN on this point and the finding does not touch it:
      `tests/test_book_puzzle_frame.py` has no @lru_cache at all (grep: the
      only hit is the docstring that names the channel), and an independent
      deep walk to depth 8 gives 320 B there -- equal to the control's own
      figure. One file's declaration is honest; the other's hides 25 MB.
    suggestion: |
      Either widen the instrument or narrow the claim; the first is better and
      is about six lines of stdlib.

      (a) WIDEN. In `_bitmap_bytes`, add the two types it cannot measure:

            nb = getattr(value, "nbytes", None)
            if isinstance(nb, int) and type(value).__module__.split(".")[0] == "numpy":
                return nb

          and in `_retained_bitmap_bytes`, walk an lru_cache store:

            if isinstance(value, functools._lru_cache_wrapper):
                held += sum(_bitmap_bytes(v) for ref in gc.get_referents(value)
                            if isinstance(ref, dict) for v in ref.values())

          `functools` and `gc` are stdlib, so ADR-0006/R1 is untouched.

      (b) Then RE-DERIVE THE BOUND, because `total < one page bitmap` cannot
          survive (a): the module's real total is 0.9979 units and the next
          cached glyph reds it. ADR-0039/R3's own shape is the answer: an
          explicit, measured allowance for the two PRE-EXISTING caches, held
          to an equality so it cannot grow unnoticed, plus the strict
          accumulator bound on everything else. Something like:

            PRE_EXISTING_CACHE_BYTES = 25_192_183   # _set_once 24,435,107 + _font_bytes 757,076
                                                    # measured 2026-10-24, identical at c7cca514
            assert cached == PRE_EXISTING_CACHE_BYTES, "..."   # equality: a growing cache reds
            assert accumulated < unit, "..."                   # the F-001 bound, unchanged

      (c) WHATEVER IS CHOSEN, the two universals must go: the class docstring's
          "Nothing this module leaves behind is as big as one page bitmap" and
          the assertion message's "this module will leave {total} B alive" are
          both false as written, and ADR-0039/R1 says such a claim "must be
          narrowed to what is measured or deleted". Also strike "five orders
          of magnitude of headroom" from the card's notes: against what the
          module really retains it is 0.21 %.

      (d) Add the numpy and class-attribute channels to the declared list, or
          cover them -- the current list names @lru_cache and deep nesting and
          omits the two that a page's pixels actually travel in.

      `_set_once`'s unbounded `maxsize=None` cache retaining 24.4 MB for the
      rest of every session is pre-existing and worth its own backlog card;
      it is NOT this card's to fix.
    confidence: high
    source: static
    violates: ADR-0039/R3
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_band.py
    line: 1640
    title: "The denominator guard is default-deny only over consumers written in a test's own
      signature: four shapes pytest collects are invisible to it, and a
      request.getfixturevalue consumer is invisible to both halves -- measured, an identical
      late mutation of the shared render is caught when declared and MISSED when taken that way"
    description: |
      The guard the fix round added for F-002 reads its denominator from
      `inspect.signature` over the module's `Test*` classes' own `test_*`
      attributes (`_declared_consumers`), and its numerator from pytest's own
      `item.fixturenames` (`_consumers_among`). Those are two different
      authorities, both available at the same moment, and the guard uses the
      narrower one for the set it defaults-deny on. ADR-0039/R2: "a shape it
      cannot analyse is a FAILURE, never a silent pass."

      ENUMERATED AND TESTED, every case the orchestrator named, against the
      real helper (synthetic namespaces, run under pytest):

        direct method                     -> VISIBLE   (baseline)
        @staticmethod / @classmethod test -> VISIBLE
        indirect (through another fixture)-> INVISIBLE to _declared_consumers
        request.getfixturevalue("name")   -> INVISIBLE to BOTH halves
        inherited method on a subclass    -> INVISIBLE (vars() sees no inherited attr)
        nested Test class                 -> INVISIBLE (pytest collects it; vars() walk does not)
        method named testX (no underscore)-> INVISIBLE (pytest's prefix is `test`, helper's is `test_`)
        @pytest.mark.usefixtures          -> INVISIBLE to signature, VISIBLE in fixturenames
        class aliased in the namespace    -> declared name can never be collected -> PERMANENT RED

      TODAY THERE IS NO INSTANCE, and I measured that rather than assuming it:
      an independent `pytest_collection_finish` probe comparing the two
      authorities over a whole-file run of both files reports
      `collected - declared = []` for all three fixtures, with
      declared = collected = **22** (`pages`), **8** (`snowflake_interior`),
