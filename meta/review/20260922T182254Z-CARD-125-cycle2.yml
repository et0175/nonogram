  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_book_two_up.py
    line: 445
    title: "The pixel probe can index past the canvas when _spec_fitting_cell draws a near-zero bottom margin"
    description: |
      The lower slot's grid_bottom is by construction the bottom margin line
      (_slot_layout: lower_band_top = page_bottom - lower_down * pitch - band),
      so page.getpixel is called up to grid_bottom + thick_rule - 1, which
      exceeds the canvas whenever bottom_mm is smaller than the heavy rule
      (about 0.5 mm). _spec_fitting_cell draws bottom from
      round(rng.uniform(0.0, 20.0), 3) (line 151), so roughly 2.5% of draws land
      there. Verified on this head: with bottom_mm forced to 0.0 the same probe
      loop raises `IndexError: image index out of range` instead of asserting
      anything; on the shipped seed (370125) the tightest of the 8 cases clears
      the canvas edge by 11 px (bottom_mm = 1.423).
      Deterministic, so not flaky today, and it fails loudly rather than passing
      silently — but adding a case, reordering the `wanted` tuple, or reseeding
      turns a property test into a crash whose message says nothing about the
      property.
    suggestion: |
      Either clamp the probe (`for y in range(max(0, slot.grid_top -
      slot.thick_rule), min(page.height, slot.grid_bottom + slot.thick_rule))`),
      or give _spec_fitting_cell a bottom margin floor (e.g.
      rng.uniform(2.0, 20.0)) so the last heavy rule always has canvas under it.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
