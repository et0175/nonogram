findings:

  - id: F-201
    severity: major
    title: >-
      `_SCALAR` is declared a non-mechanism on three measured grounds, and all
      three are false for `memoryview` - deleting it doubles a page figure, and
      the mutant survives only because no control covers the one type it is
      live for
    file: tests/helpers/shared_fixture_controls.py
    line: 742
    family: ADR-0039/R1 (a claim about a mechanism, not the mechanism)
    evidence: >-
      The comment at :742-746 reads "A cheap short-circuit and **not** a
      mechanism: the collector reports no referents for any of these either
      (measured 2026-10-24), so skipping them changes no figure -- it only keeps
      the frontier short. Nothing claims they are a channel, and no mutant on
      them could kill anything." `_SCALAR` is
      (str, bytes, bytearray, memoryview, int, float, complex, bool, NoneType).
      MEASURED, Python 3.14.3 / numpy 2.5.2, each type asked directly:
      `gc.get_referents(memoryview(b"abcdef"))` -> `[<managedbuffer object at
      0x102f6d3c0>]`, `gc.is_tracked` True. Every other one of the nine
      returns `[]`. So clause 1 is false.
      CONSEQUENCE MEASURED, with a line-count-preserving deletion mutant on the
      type tuple alone: for `{"__name__": "probe_module", "kept":
      memoryview(np.zeros((2550,3300,3), np.uint8))}`,
      `retained_bitmap_bytes(ns).by_name` is `{'kept': 25245000}` WITH
      memoryview in `_SCALAR` and `{'kept': 50490000}` WITHOUT it - exactly
      double, because `gc.get_referents(managedbuffer)` -> `[ndarray]` and the
      walk then measures the same pixels a second time through the array. So
      clause 2 ("skipping them changes no figure") is false, by 25,245,000 B.
      WHY THE MUTANT SURVIVED: I reproduced C9 myself (the whole
      `if isinstance(value, _SCALAR): return []` disabled, line-count
      preserving) over the control module + band + frame -> **191 passed, 0
      cells**. It survives because `HOLE_TWO_CHANNELS`
      (test_shared_fixture_controls.py:1126-1151) has nine rows and none of them
      is a `memoryview`, although `bitmap_bytes` at :682 recognises memoryview
      as a page carrier in its very first branch. A surviving mutant and an
      uncovered channel look identical - the board's own rule - and here the
      round read the first where it was the second. Clause 3 is therefore false
      too: a `[memoryview]` row would make C9 killable.
      Restored from the pristine copy outside the worktree; sha256
      c67baa4cc55b8ae1c9889ce6912e1749933bfd20e5ac49f6fba0cc4c74e3b396 before
      and after, `git diff --stat -- tests/` empty, `grep -rn MUTC9 tests/`
      empty.
    remedy: >-
      Two sentences and one tuple. (1) Correct the comment: the collector
      reports no referents for eight of the nine, and for `memoryview` the
      short-circuit is what keeps a page from being counted twice through its
      managedbuffer. (2) Add a `("memoryview", builder, SHEET_BYTES, False)` row
      to `HOLE_TWO_CHANNELS` whose builder parks a page-sized buffer in a
      memoryview - it reds the C9 mutant at 2x and turns a declared dead
      mechanism into a controlled live one. No production change, no new
      dependency, no node id removed.
    confidence: high
    gating: true
    gating_rationale: >-
      ADR-0039/R1 is the family that produced fifteen consecutive gating
      findings across three waves, and this is its exact shape: a statement
      presented as "measured 2026-10-24" that a one-line probe refutes, which
      then propagated into the round's survived-mutant ruling and into the
      pre-gate's acceptance of it. The error direction is conservative (an
      over-count would make the guard louder, not quieter), which is why this is
      major and not critical - but the claim reads as having been checked and
      was not, and there is no fix round in which it could be caught later.

  - id: F-202
    severity: major
    title: >-
      "Measured 2026-10-24 over the whole tree: zero such names" is false -
      `tests/helpers/book_corpus.py:757` defines `page_digest`, a second reading
      of the shared home's own question, in the same package
    file: tests/test_shared_fixture_controls.py
    line: 229
    also_at:
      - "tests/helpers/shared_fixture_controls.py:1190-1193 (the same claim in the card's FIX 1 notes, meta/kanban/cards/CARD-219.md:1190-1193)"
    family: ADR-0039/R1 (a figure committed to a docstring is a claim; its control is recomputation)
    evidence: >-
      `_locally_defined_names`' docstring states the cost of being depth-blind
      and then bounds it: "Measured 2026-10-24: zero such names in the tree."
      RECOMPUTED, in the same domain the guard uses - `_copies_among(
      _locally_defined_names(src), _shared_names())` over every
      `tests/**/*.py`: TWO files carry a clashing name, and one of them is not
      the shared home itself:
        tests/helpers/book_corpus.py -> ['page_digest']   (not an importer)
        tests/helpers/shared_fixture_controls.py -> all 13 (it is the home)
      `tests/helpers/book_corpus.py:757` is `def page_digest(page) ->
      Dict[str, Any]` returning `{"size", "mode", "sha256": hexdigest}`, while
      `shared_fixture_controls.py:101` is `def page_digest(page) -> bytes`
      returning the raw 32-byte digest. Both are "one page's identity, sha256 of
      `page.tobytes()`". By the guard's own criterion for a copy -
      underscore-stripped name identity - the tree has one, it sits in
      `tests/helpers/`, the very directory this card chose for the one home, and
      in a module that is in CARD-219's own `Touches` list. Present at the fork
      point (`git show 808cf51f:tests/helpers/book_corpus.py` has it at :757),
      so the divergence is pre-existing; the false measurement is this round's.
      The guard stays silent today only because `book_corpus.py` does not
      import the shared home - and `tests/test_book_pdf_memory.py:195-196`
      imports `page_digest`/`page_digests` from it while
      `tests/test_book_puzzle_frame.py:138` imports `page_digest as
      _page_digest` from the shared home, so the tree already has two different
      `page_digest`s reached under one name from two files. I checked the live
      risk and there is none today: frame's import is from
      `shared_fixture_controls` (verified at :131-141), so its retention
      control really does accumulate 32-byte values and its 320 B figure holds.
    remedy: >-
      Correct the sentence to what is true ("one, `tests/helpers/
      book_corpus.py:757`'s `page_digest`, which is not an importer, so the
      guard does not see it") and raise the consolidation as a successor item -
      `book_corpus.page_digest` is the dict-shaped envelope around the same
      sha256 and belongs either beside the shared one under a distinct name or
      derived from it. Test-tree only; no `src/**` change, so G-5 is not in play.
    confidence: high
    gating: true
    gating_rationale: >-
      Same family as F-201 and the same cost: a reader takes "measured over the
      whole tree: zero" as having been recomputed. It is one sentence to fix and
      the orchestrator can take it inline. The underlying consolidation is NOT
      gating and is routed below as F-205.

  - id: F-203
    severity: minor
    title: >-
      The agreement guard's derived set is 13 of the 15 names the module itself
      declares exportable; the two it omits are the hand-written pattern
      fallbacks, and an importer may redefine either one locally with no refusal
    file: tests/test_shared_fixture_controls.py
    line: 153
    family: ADR-0039/R2 (derived from an enumerable authority - but from a narrower one than exists)
    evidence: >-
      `_shared_names()` derives from `vars(controls)` filtered to
      `inspect.isfunction or inspect.isclass` with
      `__module__ == controls.__name__`. MEASURED: it returns 13 names;
      `controls.__all__` enumerates 15; the difference is exactly
      `['DEFAULT_CLASS_PATTERNS', 'DEFAULT_FUNCTION_PATTERNS']`. Fed to the
      guard's own comparison:
        source `DEFAULT_FUNCTION_PATTERNS = ("test_",)`  -> caught: NOTHING
        source `DEFAULT_CLASS_PATTERNS = ("Test",)`      -> caught: NOTHING
        control: `def _case_of(item): ...`               -> caught: ['_case_of']
      So an importer of the shared home may bind its own
      `DEFAULT_FUNCTION_PATTERNS = ("test_",)` - reinstating cycle 1's F-002
      defect verbatim, a hard-coded `test_` prefix that misses
      `testCamelCase` - and `test_no_importer_defines_its_own_copy_of_a_shared_helper`
      reports nothing. A more complete authority (`__all__`) is in the same
      module and is what `DEFAULT_*` were put there for. The bound is also
      undeclared: `_shared_names`' docstring says "every public function and
      class", which is true, but nothing anywhere says a duplicated *value* is
      outside the guard - and the module's own rationale for existing is that
      CARD-218's ninth helper drifted on a value, not on code.
    remedy: >-
      Derive from `controls.__all__` (or union it in) so the set is 15, and keep
      one control that is a value rather than a callable. One line plus one row.
    confidence: high
    gating: false
    routing: >-
      Successor card to CARD-219, same card as F-205 (both are "the one home is
      not quite one home yet"). Latent, not live: the guard passes today over
      both importers, so nothing ships broken.

  - id: F-204
    severity: info
    title: >-
      The "parametrised rather than stacked asserts" property is true where the
      round claimed it and false module-wide; no reported figure depends on it
    file: tests/test_shared_fixture_controls.py
    line: 677
    family: measurement hygiene (per-assertion attribution)
    evidence: >-
      AST census of every `ast.Assert` at any depth inside every `test*`
      function in the diff's test files. In the new control module: nine tests
      carry 2-3 stacked asserts and one,
      `test_a_test_that_asks_for_nothing_is_not_a_consumer` (:677), asserts
