findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_manager.py
    line: 900
    title: "A damaged stored plan is refused with a decode message, not the Print-setup remedy"
    description: |
      `_refuse_unless_the_planned_book` calls `self.get_plan(book_id)` without guarding
      `InvalidPlan`. In DB mode `get_plan` -> `plan_from_json` (book_manager.py:1292-1311)
      raises `InvalidPlan` for a stored document the aggregate refuses, so that exception —
      not `NO_PLAN_REFUSAL` — is what the owner is shown.

      Reproduced against a real SQLite book (status stays `draft`, so the gate is still
      fail-closed and ADR-0035/R1 is not violated):

          books.set_book_status(bid, "ready_for_pdf")
          -> InvalidPlan: the puzzle count must be a whole number of at least 1, got 0
          status after: draft

      Two consequences. (a) ADR-0035 (c) asks the plan-less refusal to carry its remedy;
      a damaged plan is functionally no plan (that is exactly the reading CARD-120 baked
      into `app._readable_plan`, app.py:2019-2032) but gets no "Store one on Print setup
      first". (b) The two storage modes are not equivalent for this state: the in-memory
      branch holds `DistributionPlan` objects and can never produce it.
    suggestion: |
      In `_refuse_unless_the_planned_book`, read the plan the way Print setup already does:

          try:
              plan = self.get_plan(book_id)
          except InvalidPlan:
              logger.error(...)
              plan = None
          refusal = ready_refusal(plan, self._selection_records(puzzle_ids))

      and add a case to `TestBookReady_PlanlessBookRefusedWithRemedy` that damages the
      stored document (DB mode) rather than dropping it.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_ready_gate.py
    line: 683
    title: "The no-op re-save test starts from an all-edited plan, so the `edited` half of `==` is not discriminated"
    description: |
      `test_print_setup_leaves_a_book_alone_when_the_plan_did_not_change` stores
      `AC_PLAN_AS_STORED` (all 12 cells in `edited`). The M-1 shortcut compares
      `new_plan == current` on a frozen dataclass, so the `edited` frozenset is part of
      the comparison — but with every cell already marked, `revise_plan`'s edit-mark
      round trip is trivially preserved and the test cannot fail on it.

      I checked the underlying behaviour separately and it is sound — `revise_plan` is
      idempotent on the plans the app can actually store:
        DEFAULT_PLAN round-trip equal: True (edited set preserved)
        hand-edited plan round-trip equal: True
      so the shortcut is total in production and this is a test-discrimination gap, not a
      behaviour bug. (An arbitrary unedited matrix such as the bare `AC_PLAN` is *not* a
      fixed point — `revise_plan` re-derives its unedited cells — which is why the fixture
      had to change; that change is legitimate, not a weakening.)
    suggestion: |
      Drive the fixed point through the route instead of asserting it: POST
      `_setup_print_form(AC_PLAN_CELLS)` once, then POST the identical form again and
      assert nothing moved on the second POST. That exercises the edit-mark round trip
      from whatever state the route itself produces.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 2769
    title: "The second user-facing exit from draft (`finalize`, action=save_and_finish) has no route test"
    description: |
      The card's route audit asserts that `POST /book/<id>/finalize` with
      `action=save_and_finish` "flashes the refusal and the page re-renders with the
      status unchanged". Nothing pins it: `grep -rn save_and_finish tests/` returns zero
      hits. The status route's user-facing half IS covered
      (`TestBookReady_RefusalNamesOffendingCell::test_the_status_route_flashes_it`), so
      the two user-facing exits are covered asymmetrically.

      The gate itself is not at risk (the route calls the gated `set_book_status`, and the
      property test drives every target status at the manager level), but the route's
      `except Exception` handler — which is what turns the refusal into a flash rather
      than a 500 — is unexercised, and it is a bare `except Exception`, so a future change
      to the handler could swallow the refusal silently.
    suggestion: |
      Add one Flask-test-client case beside `test_the_status_route_flashes_it`: an
      off-plan draft book, POST `/book/<id>/finalize` with `action=save_and_finish`,
      assert the response is 200, the offending cell appears in the flashes, and the
      status is still `draft`.
    confidence: high
