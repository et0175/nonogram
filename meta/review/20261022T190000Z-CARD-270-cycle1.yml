  The fix is right, small and genuinely load-bearing: nine line-count-preserving
  admin.css mutants were measured with the committed kill instrument and every
  one of them is killed, including the two the implementer could most plausibly
  have gotten away with (MOVES-LAYOUT, which its own rewritten arm 1 kills and
