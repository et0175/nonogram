    tests/test_browser_fixture_scope.py (+150/-5) and
    tests/test_puzzle_solver_page.py (+6), and two CARD-235 guards changed
    shape. Does that satisfy G-3 or violate it?
  verdict: SATISFIES G-3
  confidence: CONFIRMED-by-execution
  because:
    - >-
      NOT ONE ASSERTION in any player test changed. The whole of the
      test_puzzle_solver_page.py diff is six added lines inside the
      PAGE_ISOLATION data dict; no test function, no fixture and no assertion in
