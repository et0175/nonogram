# ---------------------------------------------------------------------------
findings:
  - id: F-001
    severity: Important
    rule_family: ADR-0039/R1 (a claim whose control cannot fail is narrative)
    defect: >-
      The blank-board arm of test_the_rules_against_paper_are_untouched cannot
      fail in the direction its own failure message and its ADDED_SINCE_BEFORE
      reason both name, because the suppression it compares against is scoped to
      the very selector that matches no element on a blank board.
    location: tests/test_puzzle_solver_fifth_rule.py:622 (message), :598-605 (docstring claim), tests/test_browser_fixture_scope.py:965-968 (registry reason)
    mechanism: >-
      :622 asserts shipped.tobytes() == without.tobytes() for a BLANK board,
      where `without` is the same board with _SHADOW_OFF injected --
      '.player-cell[data-state="filled"] { box-shadow: none !important; }'. On a
      blank board no cell is in the filled state, so the rule being disabled
      matches nothing and the two renderings are equal BY CONSTRUCTION. The
      assert is a tautology for every possible hairline-broadening: any rule that
      paints a hairline on a non-filled cell is, by definition, not the rule
      _SHADOW_OFF turns off, so it sits in both readings.
    failure_scenario: >-
      A future card broadens the hairline to .player-cell, or adds a second rule
      for [data-state="unknown"]; every blank cell on every board now carries a
      grey inner ring it never had, and :622 -- the arm whose message is "the
      hairline is reaching cells that are not filled" -- stays green while it
      happens.
    evidence: >-
      CONFIRMED-by-execution, twice, with two different mutants that each prove
      themselves non-no-op by killing other arms in the same reading:
      REACHES-BLANK (hairline moved onto .player-cell:529) -- recording exit 0,
      FAIL (637, 691), :622 PASS; reraising exit 1, FAIL (637, 691), :622 ran and
      passed. BROADEN-UNKNOWN (a second rule on the same line for
      [data-state="unknown"], .player-cell's own rule untouched) -- recording
      exit 0, FAIL (637, 691), :622 PASS.
    not_a_coverage_hole: >-
      the defect itself IS caught, by :691 in test_no_other_cell_state_gains_a_
      shadow and by :637, the "comparing nothing" control. This is a false claim
      in a committed docstring and a committed registry reason, plus a dead
      assert -- which is precisely the family this board has gated on fifteen
      consecutive times -- not an unprotected behaviour. Hence Important, not
      Critical.
    secondary: >-
      the arm's premise (the board is blank) is only spot-checked -- :617 reads
      paper at two cell centres -- and never asserted over the board, so nothing
      would notice if the premise changed and made :622 meaningful again.
    cheapest_honest_fix: >-
      widen _SHADOW_OFF from '.player-cell[data-state="filled"]' to
      '.player-cell'. Then under SHIPPED a blank board still has no shadow
      anywhere and :622 stays green, while under REACHES-BLANK and
      BROADEN-UNKNOWN `without` loses hairlines that `shipped` has and :622
      REDS -- a live control for the claim as written, with the docstring and
      the registry reason then true. The widening is safe for the other three
      users of _SHADOW_OFF, because in each of them every cell on the board is
      already filled. Alternatively, delete :622 and let :637 and :691 carry the
      claim, and strike the "reaches no cell that is not filled" half of the
      docstring and of the registry reason.

  - id: F-002
    severity: Minor
    defect: >-
      AC-1's two band FIGURES have no phone arm, although the card's Design
      context names the 14 px cell explicitly ("state what it measures at
      14 px"); at the phone viewport only PRESENCE of the division is asserted,
      and only on the board's outer ring.
    location: tests/test_puzzle_solver_fifth_rule.py:347-411 (parametrized on axis, DESKTOP only) vs :425-429 (the only tests parametrized on viewport)
    failure_scenario: >-
      a future change to --player-cell-min, to the @media (max-width: 820px)
      floor at admin.css:633, or to --border-width, makes the hairline
      unreadable in the board's INTERIOR at 390 px while the outer-ring sweep
      and the computed-style mechanism arm both stay green.
    evidence: >-
      PLAUSIBLE-from-reading for the gap; the figures themselves are
      CONFIRMED-by-execution to hold at the phone size today (this cycle
      measured 1/2/1 and 3 contiguous at 390x844, both axes, dpr 1/2/3), so the
      claim in the card note is true -- it is the REGRESSION NET that is
      desktop-only, not the measurement.
    note: >-
      the implementer did not over-claim here: the file docstring states the
      pixel domain and says the pixel arms claim nothing about other viewports,
      and the card note names dpr 1 and zoom 100 %. Parametrizing
      test_a_light_band_reads_across_the_fifth_rule on viewport as well as axis
      would close it for the cost of two more cases.

  - id: F-003
    severity: Minor
    defect: >-
      The assert the reshaped guard's new name advertises -- the count derived
      from the registry -- is logically subsumed by the set equality on the very
      next line, so it adds nothing a renamed test should be named after.
    location: tests/test_browser_fixture_scope.py:1522-1524
    mechanism: >-
      _family_files() globs one directory, so its basenames are distinct and
      len(files) == len({basenames}); the next line already asserts
      {basenames} == set(PAGE_ISOLATION). Every state that fails the count
      therefore also fails the set equality, while the set equality catches
      states the count cannot (a file renamed on disk and a registry key renamed
      differently keeps both counts equal).
    failure_scenario: >-
      a later reader trusts the test's name and believes the family's size is
      pinned; it is not pinned anywhere any more. The guard as a whole still reds
      in both directions (D1..D4 all RED), so nothing is unprotected -- this is a
      naming-vs-mechanism mismatch of exactly the kind the card's own worktree
      notes care about.
    evidence: CONFIRMED-by-execution (D1..D4 all red on the FIRST assert; the set-equality line is never what fires) plus proof by construction.
    suggestion: >-
      either drop the subsumed line and keep the set equality (the test's claim
      is then exactly what it does), or make the second derivation independent --
      e.g. cross-check the file set against the files named by
      ADDED_SINCE_BEFORE plus the BEFORE_ARTEFACT, which is a genuinely
      different door from PAGE_ISOLATION.

  - id: F-004
    severity: Minor
    defect: >-
      The card states the defect class as "any ink-coloured rule adjacent to an
      ink-coloured fill", and one sibling site outside the player shows exactly
      that pattern and is neither fixed nor mentioned: the guide page's demo
      strip.
    location: src/nonogram/admin/static/admin.css:343 (strip frame, 2x --border-width solid --grid-ink) and :346 (.guide-strip-cell[data-state="filled"] background --grid-ink)
    failure_scenario: >-
      on the guide page, a filled strip cell that touches the strip's own frame
      merges into it, exactly as the player's cells did; the strip's INNER
      divisions are fine (:345 is a 28 % ink divider), so the effect is one cell
      deep at each end of an illustrative legend.
    evidence: PLAUSIBLE-from-reading (structural -- the two declarations are in the diff's own file but outside the diff).
    mitigation_already_in_the_card: >-
      the Design context scopes the card to ".player-cell[data-state=\"filled\"]
      only", so this is correctly OUT of scope. It is recorded here so the class
      audit is complete and the orchestrator can decide whether it wants a
      follow-up card rather than discovering it later. Everything INSIDE the
      player is covered: admin.css:530/531 (fifth rules, right and bottom
      frame), :525/:527/:549/:552 (all four clue-gutter edges, including
      CARD-193's mirrored right/bottom gutters) are all swept by AC-2's ring at
      both viewports, with test_the_sampled_edges_really_include_a_clue_gutter
      measuring off the live boxes that a gutter really is flush against the
      grid. :523 (.player-corner) and :945 (a circled clue numeral) are never
      adjacent to a cell fill. The editor's board is unaffected: puzzle_edit.js
      uses neither .player-cell nor data-state, and .player-cell occurs only in
      admin.css, solver.js and puzzle_solve.html.

