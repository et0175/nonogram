answers_to_the_cycle_questions:
  q1_the_flagged_judgement_call: see ruling_on_g3 above -- SATISFIES G-3, both reshapes verified to red in both directions, D9 shuts the waiver door.
  q2_the_phone_hairline: >-
    MEASURED, by this cycle, through an independent door: 1 device px at dpr 1
    at BOTH 1440x900 (24.8750 px cells) and 390x844 (14.3906 px cells), 2 px at
    dpr 2 and 3 px at dpr 3, with zero antialiasing (per-channel distance 0 on
    every sampled pixel). It does NOT round to 0 anywhere this cycle looked.
    The implementer's "dpr > 1 is reasoning, not measurement" bound is stated
    honestly -- the file docstring says the pixel arms claim nothing about other
    device pixel ratios, every pixel test asserts tokens["dpr"] == 1 before
    reading, and no test anywhere relies on a dpr > 1 statement. This cycle's
    measurement CONFIRMS the reasoning rather than contradicting it. The one
    residual is F-002: the phone WIDTH figure lives in a card note, not in a
    test.
  q3_ac3_moves_layout: >-
    VERIFIED. Arm 1 (:576, every cell measured against the px --player-cell
    resolves to) kills MOVES-LAYOUT in both passes, exit 1 under RERAISING. Arm
    2 (:586) PASSES under it -- it genuinely survives, exactly as its docstring
    says, and the docstring names the surviving mutant. The rewrite is real work
    and the honesty is accurate.
  q4_tolerance_8: >-
    SAFE. The three reference colours are pairwise >= 55 per channel apart and
    every sampled pixel matched its reference at distance 0, so the window is
    slack rather than a fudge factor; --color-surface sits 7 from --grid-paper,
    i.e. inside the window, and was correctly dropped. A swatch that fails to
    paint cannot pass AS A COLOUR: it would show the backdrop, _tokens() then
    reds on the three-distinct and pairwise-outside-tolerance control (proved
    live by THIN-EQ-PAPER, which reds :212 and :215), and a wrong-but-distinct
    reference makes every downstream match FAIL rather than pass. The direction
    of failure is red, never green.
  q5_the_antialiasing_coincidence: >-
    RESPECTED everywhere. The disclaimer is in the right place and no other test
    leans on the statement it disclaims. The blank-board test uses byte
    identity, not a thin-pixel search. The only two "no --player-thin pixel"
    assertions in the file are taken on ALL-INK scanlines between two filled
    cells across a major rule, where ink antialiased against ink is still ink --
    measured by this cycle's accidental pre-fix run, which read exactly 0 thin px
    there. The AC-2 control asks only for "at least one" edge to disagree, so it
    is robust even where an ink/surface edge could blend toward --player-thin.
  q6_the_is_hinted_ordering: >-
    CONTROLLED, not merely true today. test_no_other_cell_state_gains_a_shadow
    does NOT cover .is-hinted and does not claim to (it names the four
    data-state values); the collision is covered by its own test,
    test_a_hinted_filled_cell_still_wears_the_hints_own_ring, and the
    FILLED-BEATS-HINT mutant kills exactly that test (:744/:745) and nothing
    else, exit 1 under the re-raising pass. Specificity is equal -- both
    selectors are (0,2,1) -- so file order decides, and .player-cell.is-hinted
    at admin.css:841 is well below the filled rule at :589; moving the filled
    rule below it produces the identical cascade outcome that the !important
    mutant produces, so the same arm reds.

