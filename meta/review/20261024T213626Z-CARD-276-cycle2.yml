corrections_to_the_brief:
  - >-
    The brief's framing of the terminal rule's next indirection -- "a definition
    decorated by an ALIASED decorator? Two decorators? A decorator applied with
    setattr after the fact?" -- is answered and none of it reopens the rule. The
    check at :2295 is `getattr(value, "decorator_list", None)`, i.e. decorator
    PRESENCE, so decorator identity cannot matter. The after-the-fact setattr
    case is R8's declared class. The brief expected the sixth appearance there;
    it is one storage over, in the surface authority FIX 1 made load-bearing.
  - >-
    The brief predicted the laundering derivation (X7) or the terminal rule's
    edge (X4) as step 8f's best target. Both are sound where I checked them. The
    weaker mechanism is the `surface` authority, which no mutant on this card
    touches and which FIX 1's whole closure depends on.
  - >-
    The brief asked whether the *args forwarder's and callback-parameter
    callee's declaration is honest. It is honest in direction and stale in fact:
    the *args forwarder REFUSES, and so does the attribute-alias case. Only the
    callback-parameter row is still silent.
  - >-
    I agree with the brief that `_outcome` must not be used for a lever reading
    and I used `_plant_refusals` throughout. One addition: on the F-1 shape even
    `_plant_refusals` reports a refusal under 16 of 32 subsets, all of them the
    plant's own `builtins` call. A non-empty attributed reading is still not a
    lever; the refusal's SHAPE is what settles it. That is F-4.
