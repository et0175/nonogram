verdict: >-
  The question this card exists to answer is answered NO. Fix round 1 closed
  every shape cycle 1 named -- F-1, F-2 and F-3 all reproduce as closed here,
  with my own plants, and the three cycle-1 corrections the round made to the
  adjudication are confirmed. But the hole moved one level of indirection
  again, which is this family's signature across all six appearances. FIX 1
  closed cycle 1's Critical by routing a resolved attribute chain into the
  own-instance surface rule; that rule's authority is built with ast.walk over
  the ClassDef, so every nested def/class ANYWHERE inside the class -- locals
  inside methods included -- is claimed as part of the class's attribute
  surface. Nine such names already stand on BookPDFGenerator. A geometry door
  installed on self from outside the text under any of those nine spellings is
  SILENT, with a bare literal page position, needing no plant scaffolding at
  all: the module's own text already supplies the laundering occurrence. The
  shipped control for exactly this shape (DOOR_SHAPES W21 / SURFACE_SHAPES_LAUNDERED
  S1) refuses only because its plant spells the attribute `_d`. Exhaustive over
  all 32 exemption subsets the shape has NO lever -- the only refusal ever
  attributable to the plant is the `builtins` one on its own getattr -- which is
  the exact condition this card's own docstring at :5035 calls "no lever".
  So: sixth appearance, not a resolved level. The mechanism work is otherwise
  strong and every committed figure reproduces; the card fails min_score on its
  central claim, not on its craft.

one_question_answered: sixth appearance -- the level is NOT resolved
