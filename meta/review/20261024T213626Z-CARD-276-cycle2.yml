findings:

  - id: F-1
    severity: critical
    title: >-
      The own-instance surface rule's authority counts every nested def/class
      inside the class, so nine spellings the module already contains launder a
      setattr-installed geometry door -- silent, undeclared, and with no lever
    file: tests/test_book_export_interior_cover.py
    line: 2089
    gating: true
    confidence: high
    evidence: |
      MECHANISM (a reading of :2089-2115). `surface[holder]` is built with
      `for node in ast.walk(holder)`, adding `node.name` for every FunctionDef /
      AsyncFunctionDef / ClassDef found anywhere beneath the ClassDef. ast.walk
      descends into method bodies, so a function defined LOCALLY inside a method
      enters the class's claimed attribute surface. The own-instance rule at
      :2613-2615 then passes any `self.X(...)` whose X is in that set.

      INDEPENDENT STRUCTURAL MEASUREMENT (own ast reimplementation, separate
      process, over src/nonogram/admin/book_pdf_generator.py, 816 ast.Call nodes):
        class BookPDFGenerator: shipped surface = 50 names
                                narrowed to direct members = 40 names
        the 9 names on the surface ONLY because of a nested local def,
        with where each one actually lives:
          line_image      :4342  inside create_guide_page
          technique_rows  :4350  inside create_guide_page
          set_page        :4389  inside create_guide_page
          fits_width      :4580  inside create_guide_page
          produce         :6869  inside interior_stream
          paragraph       :4432  inside set_page inside create_guide_page
          picture         :4438  inside set_page inside create_guide_page
          space           :4443  inside set_page inside create_guide_page
          technique       :4448  inside set_page inside create_guide_page
        attribute-callee sites in the real module that would newly refuse
        if the authority were narrowed to direct members: 0
      (Same measurement over all 15 classes: BookPDFGenerator is the only one
      with a non-empty difference.)

      THE CONVERSE THE PASS RESTS ON IS THE FALSE ONE. The refusal's own text at
      :2619-2627 reads "an attribute of this module's own instance that
      <Class> never spells, so it was installed from outside this text and may
      be a geometry door". The branch's `continue` at :2632 is UNCONDITIONAL, so
      being on the surface is taken as proof the attribute was NOT installed
      from outside the text. Both plant families above falsify that inference.

      PLANTS -- no scaffolding at all, body only, extra only `_S = "spec"`:
            setattr(self, "<name>", getattr(self, "page_" + _S))
            self.<name>(3 + len(section))
            first_answer_page = 1 + TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT
      _outcome, arm 07e8e1e716944ea5 / 36 / 5 / 5:
        self.produce         ()  SILENT
        self.set_page        ()  SILENT
        self.paragraph       ()  SILENT
        self.picture         ()  SILENT
        self.space           ()  SILENT
        self.fits_width      ()  SILENT
        self.line_image      ()  SILENT
        self.technique       ()  SILENT
        self.technique_rows  ()  SILENT
        CONTROL self._d      ('refusal',)   <- DOOR_SHAPES W21 / S1, same shape
      The door reached is the real one: `getattr(self, "page_" + _S)` with
      _S = "spec" is self.page_spec, GEOMETRY_DOORS' own member, and the
      position is `3 + len(section)` -- the bare front-matter literal this
      guard exists to report. Nothing is reported.

      NO LEVER, exhaustively. _plant_refusals over all 32 subsets of the five
      CALLEE_EXEMPTIONS, on the `produce` plant:
        subsets exposing the plant's own lines: 16/32
        minimal single drops: ['builtins']
        the complete set of refusal shapes seen under ANY subset:
          "a callee that is a builtin and is bound nowhere in this module"
        with all five classes in place: []
      That is the plant's own setattr/getattr, not anything that can see a
      door. This card's own docstring at :5035 states the standard: "A row
      whose only lever is `builtins` has no lever". By that standard this
      shape has none -- strictly worse than R8, which at least has a class and
      a named lever.

      BREADTH IS ALSO UNCONSTRAINED, measured with the committed instrument.
      Step 8f fired a line-count-preserving mutant (Y1) that narrows the
      authority to the holder's own direct members, over the 33-test door-axis
      class: pytest exit 0, 14 of 203 assertion nodes reached, 0 FAIL, every
      cell IDENTICAL to SHIPPED. Proven non-no-op first -- with Y1 live the
      three plants above read ('refusal',) instead of (), and the module cost is
      still sites=23 / vocabulary=6 / refusals=0. So the mutant moves the walk's
      verdict on nine shapes, costs this module nothing, and no assertion in the
      file can see it: the ADR-0039/R1 edge pair this claim has never had. Full
      domain in step_8f below.

      THE SYMMETRIC GAP TO FIX 2 (a reading, not a plant). The same `surface`
      loop adds a method's name with no `decorator_list` check, while
      `anchored_to_a_fixed_point` at :2295 refuses a DECORATED definition
      terminal for the stated reason that "the decorator replaces what the `def`
      binds, so the identity this walk reads off the text is not the identity at
      the call". BookPDFGenerator carries four decorated methods --
      interior_bitmap_mode (property), _grid_size, _payload, _puzzle_payload
      (staticmethod) -- all on its surface. FIX 2 added the terminal rule in one
      of the two places a definition terminal is read.

      NOT DECLARED: MEASURED_BLIND_SPOTS' five rows are the two VALUE rows, the
      CALL-GRAPH parameter-callee row, R3 (receiver this module does not define
      -- the plant above is on `self`, so R3 does not reach it) and R8 (a
      DEFINITION rebound where no store is visible -- the plant rebinds an
      attribute, not a definition). None covers this shape.
    remedy: |
      Either (a) close it, which step 8f measured as FREE: constrain the
      def/class branch at :2095-2098 to members of the holder's own body --
      `if parent.get(node) is holder and isinstance(...)`. Line-count-preserving,
      one line, test file only, G-1 unaffected, measured cost on this module 0
      refusals, and no test reds.
      Then add a decorator check to that branch for the same reason FIX 2 added
      one to the module-level terminal, and add a DOOR_SHAPES / SURFACE_SHAPES
      row whose spelling is one of the nine, so the control stops depending on
      the plant's choice of name. Or (b) declare it as a MEASURED_BLIND_SPOTS
      row with absorbed_by empty and the "no lever" asymmetry stated, as the
      VALUE and CALL-GRAPH rows already are. What it must not do is ship silent
      and unmentioned while the axis table says the axis is closed on callees
      this walk can anchor.
    disposition: gating -- orchestrator takes inline or records a gate override

  - id: F-2
    severity: major
    title: >-
      Cycle 1's F-1 is narrowed, not closed: one innocent RESOLVING store of the
      same spelling inside the CALLING class still launders a setattr-installed
      door, because the occurrence that resolves the chain is the occurrence that
      puts the spelling on the surface
    file: tests/test_book_export_interior_cover.py
    line: 2568
    gating: true
    confidence: high
    evidence: |
      FIX 1 made the attribute branch's `continue` conditional on a refusal
      (:2568-2582), so a RESOLVED chain falls through to the own-instance
      surface rule instead of past it. But the surface rule's authority is the
      same spelling stored in the class, and a resolving `self.X = <def>` store
      satisfies both conditions at once: it resolves the chain AND it puts X on
      the surface. So the fallback FIX 1 installed is defeated by construction
      whenever the laundering occurrence sits in the calling class.

      CONTROLLED TRIPLE, both arms self-identified:
        arm HEAD      07e8e1e716944ea5  DOOR_SHAPES=36 EXEMPTIONS=5 BLIND=5
        arm ced5e648  4a2a28eba300268e  DOOR_SHAPES=36 EXEMPTIONS=4 BLIND=4
        (fork point c2cb8e3e not measurable with this driver -- the class under
         test does not exist there; stated as a bound, not read as a result)

        A  S1 verbatim, no laundering                 HEAD ('refusal',)  ced5e648 ('refusal',)
        B  S1 + resolving store in an UNRELATED class HEAD ('refusal',)  ced5e648 ()
        C  S1 + resolving store of the SAME spelling
           in the CALLING class                       HEAD ()            ced5e648 ()
        E3 the declared edge row                      HEAD ()            ced5e648 ()
      B is cycle 1's F-1 and it IS closed -- that reproduces. C is the same
      Critical one indirection in, and it is silent at both revisions.

      C's body (extra = '\n_S = "spec"\n'):
            self._d = interior_page_count
            setattr(self, "_d", getattr(self, "page_" + _S)); self._d(3 + len(section))
            first_answer_page = 1 + TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT
      The setattr runs after the store, so at run time self._d IS self.page_spec
      and the call reaches the real door with the bare literal 3.
      A two-link variant (self._y = interior_page_count; self._d = self._y) is
      also silent.

      ATTRIBUTION CONTROL -- the silence is specifically the resolved pass, not
      the surface rule in general: the same plant with an OPAQUE innocent store
      refuses before the anchor is consulted.
        self._d = None    ('refusal',)  "an attribute bound to an expression at line 6718"
        self._d = 1 + 2   ('refusal',)  same
        self._d = interior_page_count  ()  SILENT

      LEVER: this one HAS a lever that names its mechanism. Exhaustive over 32
      subsets, dropping only "a chain whose terminal is a definition or an
      import" yields exactly one refusal attributed to the plant:
        (6719, "a callee whose alias chain this walk resolved to a definition or
         an import in this module's own text, whose run-time value it therefore
         reads off that terminal", '_d', 'self._d(3 + len(section))')
      So it is accountable -- but it is absorbed by a class whose declared
      residue (R8) is "a definition rebound where this walk can see no store",
      and this is an ATTRIBUTE installed from outside the text under a spelled
      name, which the surface rule's own comment at :2082-2088 claims as its
      territory ("setattr, __set_name__, a metaclass ... F-401's P1/P5/P8").
      This is the same pattern as CARD-262's F-502: a class absorbing a shape
      its reach statement does not name.

      WHY THE SHIPPED CONTROLS CANNOT SEE IT: `_attribute_callee_laundering`
      (:5227-5262) emits its laundering into `class _UnrelatedResolver`, and its
      own docstring says so -- "deliberately in a class with nothing to do with
      the call". Both laundering controls (:5601, :5672) therefore read exactly
      one of the two vehicles. They are honest about their own scope; the
      overclaim is in the prose (F-3).
    remedy: |
      Declare it: a MEASURED_BLIND_SPOTS row, absorbed_by "a chain whose
      terminal is a definition or an import", with the two-directional reading
      the table already supports (it passes, measured above). Correct the
      exemption class's reach statement in `anchored_to_a_fixed_point`'s
      docstring and in CALLEE_EXEMPTION_REACH's doc so the residue is not
      stated as the unseeable-rebind case alone. Closure is a successor's.
    disposition: gating -- declaration inline; closure to a successor card

  - id: F-3
    severity: major
    title: >-
      The fourth version of the sentence is false in two clauses -- "One of the
      two is closed" and "still false, of exactly that residue" -- and AC-6's
      own deliverable is falsified for the fourth consecutive round
    file: tests/test_book_export_interior_cover.py
    line: 1203
    gating: true
    confidence: high
    evidence: |
      Clause by clause against the code, in the axis-2 bullet at :1155-1262 and
      `_page_positions`' opening at :1530-1600.

      VERIFIED TRUE:
        - ":1156 closed on callees this walk can anchor to a FIXED POINT over
           the alias chain, with five named exemptions, each with a reading of
           its own" -- CALLEE_EXEMPTIONS is 5, CALLEE_EXEMPTION_REACH is 5 rows.
        - ":1159-1161 a callee it can anchor is one whose EVERY binding
           occurrence holds a name or attribute that is itself anchored, down to
           a binding this module's own text shows" -- matches :2275-2299.
        - ":1166 a decorated definition is not a terminal here and the chain
           onto it refuses" -- T1 ('refusal',), T2 ('refusal',), and my own
           P5 (terminal decorated by an ALIASED decorator) ('refusal',),
           P6 (two decorators, one a no-op) ('refusal',). The check is on
           decorator PRESENCE, so the brief's "aliased decorator / two
           decorators" do not reopen it.
        - ":1167-1170 a definition rebound where this walk can see no store at
           all is passed, declared as the exemption class, and exposed by
           removing it" -- R8 silent with all five classes, refused and named
           with that one dropped (reproduced, see F-2's lever block for the
           refusal text).
        - ":1175-1176 the chain's own bound and its cycle check refuse and
           report" -- reproduced; and G-7 holds, no silent cap found anywhere
           in the new mechanism.
        - the cost sequence 760 / 509 / 203 / 201 / 0 / 0 recomputed in a second
           domain by calling _page_positions directly: identical.

      MEASURABLY FALSE:
        - ":1203 'One of the two is CLOSED: an attribute is keyed by spelling
           alone, so one unrelated resolving occurrence of the spelling used to
           skip the own-instance surface rule and silence a setattr-installed
           door'". It is NARROWED. The word doing the work is "unrelated": with
           the occurrence inside the calling class the same Critical shape is
           silent (F-2), and with the spelling already on the class's surface it
           is silent with nothing appended at all (F-1).
        - ":1213 'So the sentence is still false, of EXACTLY that residue'".
           The residue also contains F-1's nine spellings and F-2's same-class
           vehicle. "Exactly" is the clause that fails.
        - the same overclaim in TestDoorAxis_...'s class docstring at
           :5293-5307: "Cycle 1 then found the level again, twice ... and this
           class holds both answers". It holds the answer for the
           unrelated-class vehicle of the first one.

      This is the fourth round in which this sentence ships asserting a reach it
      does not have, on the card whose stated purpose is to end that. The
      paragraph's own closing clause -- "a reader of the fourth version should be
      able to see what that cost" -- is the reason this is gating rather than a
      successor's: the remedy is prose, it is cheap, and shipping a fifth false
      assertion is the one outcome this card cannot afford.
    remedy: >-
      Replace "One of the two is closed" with the measurement: the unrelated-class
      vehicle is closed; the same-class vehicle and the class-surface vehicle are
      not. Drop "exactly" from :1213 and point at the new blind-spot rows. Correct
      :5293-5307 to say which answer the class holds.
    disposition: gating -- prose only, no mechanism change, no src edit

