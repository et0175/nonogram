          `_f = interior_page_count` / `_f(3 + len(section))`         ()  silent
        a callback parameter used as a callee (the declared row)      ()  silent
      So the bullet is conservative -- it declares more open than the walk is,
      which is the safe direction, and the brief asked whether the declaration is
      honest rather than for closure. It is honest in direction and stale in
