findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/solver/propagate.py
    line: 216
    title: "Rung tags change when the puzzle is transposed, so they are not a property of the puzzle"
    description: |
      RungTagger.record_row/record_column classify a first-sweep deduction by comparing
      the cells it settled against overlap_masks(runs, length), which is blind to what is
      already known on the line. In sweep 0 propagate examines all dirty rows first and
      then all dirty columns, so rows are always deduced from a blank line while columns
      are deduced with the cells the rows just wrote.

      Two measured consequences:

      1. line_dp is unreachable for a line examined from a blank board. Over 4000 random
         (runs, length) pairs, line_intersection with no known cells and overlap_masks
         agree exactly, 0 disagreements. Every line_dp tag in the system is therefore a
         column tag from sweep 0, not a technique.
      2. The same puzzle transposed grades differently. Over 224 line-solvable random
         grids, 205 (92%) produce a different rung histogram for the grid and its
         transpose. Example, a 7x7: {simple_overlap 30, line_dp 6, cross_line 13} versus
         {simple_overlap 30, line_dp 15, cross_line 4}.

      The implementation is faithful to the card and to ADR-0029, which pins the sweep
      definition ("the first sweep is a pass of the loop, not before any cross-line
      information exists"). The defect is in that definition, and this card is what makes
      it measurable. It matters now because ADR-0029/R1 derives a line-solvable puzzle's
      difficulty from the hardest rung its solve required, and CARD-076 is the next card
      to build on exactly these counts: a puzzle and its transpose are the same puzzle to
      a solver, and grading them differently makes the score an artifact of grid
      orientation.
    suggestion: |
      Resolve before CARD-076 grades on this data. Two candidate directions, both needing
      an ADR-0029 revision rather than a silent code change:

      a. Make the distinction knowledge-relative: compare a deduction against the overlap
         rule applied to the line's current known cells, so "needed more than overlap"
         means the same thing for a row and a column. Then define cross_line by where the
         known cells came from (a perpendicular write) rather than by sweep index.
      b. Keep the sweep definition but make the metric orientation-invariant, e.g. grade
         on the hardest rung present rather than on per-rung cell counts, and state in the
         ADR that within-rung counts are not comparable across orientations.

      Whichever is chosen, add a property test asserting that a grid and its transpose
      grade identically; that test is the missing guard on ADR-0029/R1.
    confidence: high
    source: static
