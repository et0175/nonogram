           pytest --collect-only -q
             tests/test_puzzle_solver_marking.py::TestSolverMarking_KeyboardAndLabels::test_each_tool_acts_on_a_single_key_press
           -> 6 tests collected  (Black/White/Clear x Enter/Space)
         Every NUMERATOR is backed by named cases (White-Enter, White-Space,
         Clear-Enter, ...); only the denominator is invented. This is the board's
         standing rule — a figure summarising rows is counted from the rows —
