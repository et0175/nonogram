findings:
  - id: F-001
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/static/admin.css
    line: 1483
    title: "The probe tint is not distinct from CARD-267's crosshair tint — dE76 2.55, measured in Chromium"
    description: |
      The card's Design context requires the probe tint to be distinct from
      CARD-267's crosshair tint and CARD-188's circles, and admin.css argues it
      at length ("14 % of a 6.6:1 ink into paper is a plainly warmer ground than
      either"). The fix round left this as "a claim with nothing checking it".
      Measured, it is not merely unchecked — for the three light states it is
      false.

      Resolved in Chromium itself from the shipped token values
      (scratchpad/review268/tints.py, canvas-resolved so color() and rgb()
      spellings land on the same bytes):

        probe light   color-mix(in srgb, #855d00 14%, #fffdf8) = (238, 231, 213)
        crosshair     --color-surface-hover                    = (241, 235, 221)
        dRGB (-3, -4, -8)   dE76 = 2.55

      dE76 2.55 is at the classic just-noticeable-difference threshold; for two
      small, non-adjacent grid cells it is the same colour. For comparison, the
      card's other two pairings are fine: probe vs the hint line's
      --color-accent-tint is dE 9.83, and the FILLED variants are plainly apart
      (probe-ink vs cross-ink dE 27.4, vs hint-ink dE 29.2). The defect is
      confined to the three light states — unknown, empty, maybe — which is the
      bulk of what a probe paints, because a probe is mostly "I am trying this
      row empty".

      Failure scenario: a player on a mouse opens a probe on a 20x20 and marks
      eight cells empty. The crosshair paints the whole hovered row and column
      in a tint 2.55 dE from the probe's. The pointer is always on the board, so
      the player cannot tell which light cells are the hypothesis and which are
      merely under the pointer — and reads a wrong board out of exactly the
      feature built to prevent that. The tint is the probe's only per-cell
      carrier of membership (the toggle carries it for the controls, per the
      card's own Standards bullet), so when it is unreadable the per-cell signal
      is gone.

      Mutation evidence that nothing holds this (T1, re-fired):
      dropping the mix from 14% to 1% makes the probe tint invisible against the
      paper (dE ~0.8) and the card's whole gate stays green — 39 passed, 0
      failed. T2 shows where the only boundary actually is: setting the probe
      tint byte-identical to the crosshair's DOES red
      test_the_crosshair_does_not_repaint_a_probe_cell, because that assertion
      compares computed-value STRINGS. String inequality, not
      distinguishability, is all that is held.

      Two secondary notes from the same measurement. (a) admin.css's "a 6.6:1
      ink" does not check out: #855d00 on #fffdf8 is 5.80:1, and tokens.css's
      own comment says 5.6:1 on surface / 5.0:1 on its tint — no pairing yields
      6.6. (b) tokens.css already ships --color-warning-tint (#f6ecd4), which is
      the direct-token choice the crosshair's and hint line's precedent would
      actually have taken (both use a bare token for the light tint and derive
      only the -ink variant); it is dE 3.74 from the shipped mix and does not
      resolve this either, so the fix is a stronger separation, not a token swap.
    suggestion: |
      Two parts, and the first is the owner's call, not the fix agent's: the card
      says "owner validates the look on a real puzzle render before merge", so
      put a rendered grid with a probe open under a hovered row in front of them
      and let them pick the separation. Candidate directions, none prescribed:
      raise the mix well above 14% (the crosshair sits 7.87 dE from paper, so the
      probe needs to be clearly past it, not 2.5 dE from it); or move the probe's
      signal off the ground channel entirely — an inset outline or a border on
      [data-probe] would be orthogonal to both ground tints and would survive any
      later tint added to the board.

      The second part is the test that makes it a checked claim rather than an
      argued one, and it is what stops this recurring: read the three computed
      grounds off one real page and assert a minimum perceptual distance between
      each pair (dE76 from the canvas-resolved bytes, which is what
      scratchpad/review268/tints.py already does in ~60 lines and needs no new
      dependency). Sweep both the light and the filled variant. That turns T1
      from a survivor into a kill and gives the next card on this board a
      standing guard instead of a paragraph.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/admin/static/solver_state.js
    line: 1089
    title: "Rule 6 decided silently: a pre-probe stroke redone during an open probe becomes a probe member"
    description: |
      Declared semantics rule 6 says "a probe never contains strokes made before
      it started". The shipped code breaks that for one reachable path, and the
      decision is recorded nowhere.

      Mechanism, from the code: on any recorded change solver.js's commit calls
      nextProbe(probe, next, "change"), which is
      `Math.min(probe, history.done.length)` — it can only ever lower the
      checkpoint. A redo RAISES done.length, so the checkpoint stays where it
      was and probeCells(history, probe), which iterates done[probe..], now
      includes the redone stroke.

      Failure scenario, five inputs: mark A, mark B, Undo (B is on the redo
      stack), press Probe (checkpoint = 1), press Redo. B comes back wearing the
      probe tint, and pressing Contradiction takes it away again. B was made
      before the probe existed. Verified against the card's own oracle:

        _oracle([mark(0,0), mark(1,1), undo, open, redo])
          -> {'probe': 1, 'members': [(1, 1)], ...}

      The board arithmetic is self-consistent (abandon still restores the
      checkpoint board exactly, because B was not in it), which is why this is
      a contract and tint problem rather than a wrong-board problem — and also
      why it is defensible as a reading. That is precisely the point: two
      reasonable implementations differ here, which is the definition of the
      ambiguity the card's own worktree note [AC-4's redo edge] told the
      implementation to surface rather than pick silently. The Divergences block
      surfaces the analogous CLOSED-probe case and argues it is not ambiguous;
      the OPEN-probe case, which is the one that actually contradicts the
      written rule, is not mentioned.

      Why no test catches it: tests/test_puzzle_solver_probe.py's `_oracle`
      encodes the same reading (its redo branch appends to `done` and then takes
      min(probe, len(done))), so the independent-oracle discipline — this card's
      strongest verification mechanism — is defeated by a shared assumption. The
      300-case corpus does reach the shape: I counted 10 of its 300 sequences
      redoing a pre-probe stroke into an open probe. They pass, asserting the
      behaviour as correct.
    suggestion: |
      Cheapest honest close is a recorded divergence, not a code change — the
      shipped reading ("the transaction is everything since the checkpoint,
      including a redo") is arguably the better one and the board arithmetic
      already holds. So: add a bullet to the card's "### Divergences from the
      block above" naming the path, the reading chosen, and why abandon stays
      correct; add one named case to _RULE_CASES ("6 — a pre-probe stroke redone
      during a probe joins it") so the decision is pinned by a case that says it
      out loud rather than by 10 anonymous corpus sequences; and state in the
      _oracle docstring that this is a decided reading rather than a reading of
      the rule, so the next reader does not mistake oracle agreement for rule
      compliance.

      If the owner prefers the literal rule instead, the change is to make
      "change" also raise the checkpoint when the move was a redo of a stroke
      that predates it — which needs more than one number, and is a bigger
      card than this one. Surface the choice; do not pick it again silently.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

