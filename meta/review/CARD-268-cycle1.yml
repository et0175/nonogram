  - id: F-007
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_puzzle_solver_probe.py
    line: 1324
    title: "The board does move down while a probe is open, and only the air is held in that state"
    description: |
      TheBarCostsTheBoardNoGround sweeps probe CLOSED at three viewports, and its
      docstring states the open case honestly: opening a probe makes the bar
      taller (Keep, Contradiction and the note appear) and at 390 px wraps it, so
      the board does move down for as long as the probe is open. The companion
      class holds the 1 px of air in that state (desktop-open, phone-open both
      green, and A2 shows phone-open is falsifiable), but nothing measures the
      consequence the card's own first constraint is about: #puzzle-player's
      focus scroll. The card measured 11 px against a half-cell tolerance of
      11.7 px on the closed layout, and the fix round measured 19 px — red — at
      8 px lower. An open probe moves the board by more than 8 px at 390 px,
      where the bar wraps.

      Failure scenario, keyboard user: a probe is open on a phone-width window,
      the player tabs to the board, Chromium smooth-scrolls further than the
      half-cell tolerance, and a keyboard drag lands a row off — the same defect
      the fix round spent a round on, in the one state no test visits.

      Bounded: it needs an open probe AND a keyboard drag AND a narrow viewport,
      it is self-inflicted and visible, and it ends when the probe does. The
      card's constraint is about the standing layout, which is held exactly. So
      this is the uncaptured state, not a demonstrated break.
    suggestion: |
      One parametrized case: open a probe, measure #puzzle-player's focus scroll
      the way the card's own bullet measured it (11 px today), and assert it
      stays inside the half-cell tolerance at 390x844 and 1280x720 — or, if it
      does not, say so in the card and let the owner decide, since the bar's
      wrap at 390 px is a deliberate design choice and shrinking the open bar is
      a design change rather than a bug fix.
