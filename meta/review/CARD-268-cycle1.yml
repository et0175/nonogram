    type: gap
    file: tests/test_puzzle_solver_probe.py
    line: 537
    title: "Rule 3 names hint strokes explicitly and no test makes one inside a probe"
    description: |
      Rule 3 is "every mark made (any brush: filled, empty, maybe; hint strokes
      too) belongs to the probe". AC-1's test drives all four brushes and two
      drags; nothing in the card drives the hint ladder to rung 3 inside a probe.

      Reading the code, it works: rung 3's reveal calls
      commit(record(history, hintStroke(...)), hint), which is the same choke
      point every other recorded change goes through, so the stroke lands past
      the checkpoint and probeCells picks up its cell like any other. It is also
      the one stroke kind with a flag of its own (hint: true) and the one whose
      cell the player did not choose, so "the player touched it under the
      hypothesis" — the card's stated justification for membership — is the
      weakest there. An untested clause of a numbered rule, in other words, and
      the one most likely to be decided differently by a later change.

      Failure scenario: a later card routes the hint reveal around commit (to
      stop it resetting the ladder, say) and the revealed cell silently stops
      being a probe member, so Contradiction leaves it behind on the board. No
      test in the family would notice.
    suggestion: |
      One arm on TestSolverProbe_MarksCarryTheTint: open a probe, press Hint
      three times to reach the reveal, assert the revealed cell is in _members
      and that Contradiction takes it back. Rung-3 driving is already in
      tests/test_puzzle_solver_hint.py and can be read from there.
