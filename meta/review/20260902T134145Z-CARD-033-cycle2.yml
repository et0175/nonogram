family_regression:
  determination: "the family persists but is decaying, and no cycle-2 finding gates"
  cycle1: "2 Important (high) + 1 medium + 4 low; score 7.5; gate FAILED"
  cycle2: "0 critical, 0 high, 1 medium, 3 low; score 9.0; gate PASSED"
  fix_introduced: [F-010, F-011, F-012, F-013]
  mechanism_1: >-
    The fix medium and the defect medium are the same. Every remedy in this family is
    itself prose — a docstring rationale, an intake-line amendment, a card section — so
    each fix pass enlarges the surface that can carry a false claim. The fix commit
    changed no code logic (one comment aside) and added roughly 350 lines of explanatory
    prose across the card, the intake file and four docstrings; three new false claims
    (F-010, F-011, F-012) appeared inside that new prose. This is not a code loop
    regenerating bugs — src/ is unchanged since e41724e apart from a comment — it is a
    prose-mass loop whose defect rate per added line is roughly constant.
  mechanism_2: >-
    Nothing in the suite discriminates prose. Of cycle 1's seven findings, exactly two
    (F-001, F-006) received mechanical checks; the other five are text and are guarded by
    nothing — reverting any of them leaves 1497 tests green. This is structurally the
    CARD-027 trap, with one decisive difference: on CARD-027 the unpinned remedy was for a
    CODE finding, whereas here all five unpinned remedies are for TEXT findings, where
    "pinning" would mean asserting on docstring content, i.e. pinning prose with prose.
    The code half of the fix pass is fully pinned and was re-derived independently this
    cycle (m6, m6h, the decode mutant — all killed).
  converging: true
  verdict: >-
    A human does NOT need to pick the source. Severity fell (2 Important -> 0), count fell
    (7 -> 4), and the implementation was independently re-verified this cycle by three
    routes the fix pass does not control: three targeted mutants, a Fraction-based oracle
    over >10,000 (N, ratio, orientation) cases, and a cell-for-cell reproduction of the
    README's 20-cell conversion table. A cycle 3 would most likely produce a fourth
    generation of low-grade prose findings at diminishing value.
