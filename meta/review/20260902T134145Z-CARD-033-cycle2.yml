    file: tests/property/test_grid_dimensions.py
    line: 1048
    title: "F-006's new test docstring says the bare run 'is the one that retries'; both runs retry, and its own next paragraph says so"
    description: |
      `test_a_bare_size_image_run_decodes_the_picture_exactly_twice` writes at line 1048:
      "Which is why the bare run below is the one that *retries*: ``bands.png`` at 10x10
      converts to an ambiguous grid that two pixel-nudges repair".

      Both runs retry. The shared helper asserts it for both, unconditionally:
      `assert puzzle.nudge.attempts == 2, extent` (line 1083), executed by
      `bare, _ = run(width=MIN_SUPPORTED)` (1086) and
      `explicit, _ = run(width=MIN_SUPPORTED, height=MIN_SUPPORTED)` (1087).

      The docstring's very next paragraph states the correct fact and contradicts the
      sentence above it: "both runs convert the same picture into the same grid by the
      same route". `tests/test_nudge.py:334` pins the same two nudges through the
      *explicit* `width=10, height=10` form, which is the direct refutation.

      The same sentence was propagated verbatim into the card
      (meta/kanban/cards/CARD-033.md:411-413, "The bare run is deliberately the one that
      *retries*"), so the defect exists in two places.

      What the test asserts is correct and is genuinely load-bearing — verified this cycle:
      inserting a second `load_greyscale(source)` into `image.source_shape` fails it at
      `assert 3 == 2`. Only the "which is why" causality is fabricated.
    suggestion: |
      Replace "the bare run below is the one that *retries*" with "both runs below
      *retry*" (or "the runs below are retrying runs"), and mirror the correction on
      CARD-033.md:411-413.
