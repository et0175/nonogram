corrections_to_the_brief:
  - >-
    "Verify that claim by constructing your own shapes, not theirs." The claim
    is HALF true, and the half that fails is the one that matters. On N-1 and
    N-2 the round really did fire shapes its tests were not written against
    and really did find the honest mechanism — its pen/touch re-attribution is
    correct, and I confirmed it with a mutant it did not fire (`touch always
    paints`, which survives all 33 precisely because the Region-off touch half
    is carried by CSS plus the compositor, not by gesturePaints). On N-3 it did
    not: all four write-plants are shapes the new assertions catch by
    construction (a POST literal dies on the forbidden `"method:"` string,
    sendBeacon on the string list, a new listener type on the multiset, a
    second key on the key pin), and none probes a safe-method request reached
    through a name other than `fetch(`. Three such plants survive all 33
    (M-2). So the pattern is broken in two of three places and repeated in the
    third — the fifth instance, in the round that set out to retire it.
  - >-
    "N-1's four cases ... check the narrowed claim is true AND that nothing
    worse hides behind its narrowness." The narrowed claim is TRUE, measured
    four ways: each loop-bound mutant reds on exactly the case the table pairs
    it with, so the four rows are four live controls. And something worse does
    hide behind it, one conjunct to the left: `sameNumbers`'s `a.length ===
    b.length` is the only thing refusing an under- or over-filled board, it
    has no control, and I measured the page announcing a 4x4 uniquely solvable
    puzzle SOLVED while one cell short (M-1). I also fired eight other
    weakenings of the same three functions — a short row line, a short column
    line, a shifted row index, a transposed column index, no trailing run
    push, `[0]` for an empty line removed, FILLED widened to not-EMPTY, and
    `run > 1` — and all eight DIE, which is a real credit to the table: it is
    only the length comparison that is uncovered, not the family.
  - >-
    "N-2's pen/touch split. Is that attribution right? Can you construct a
    mutant that breaks the Region-off touch behaviour and survives all 33?"
    The attribution is RIGHT, and yes: `event.pointerType === "touch" ? true :
    gesturePaints(...)` survives all 33. But that mutant is not a defect, it
    is the evidence FOR the round's reading — in Chromium with `touch-action:
    auto` the compositor fires pointercancel whatever gesturePaints returns,
    even with `event.preventDefault()` called, so the mutant is behaviourally
    equivalent on the one browser ADR-0038/R7 declares. The pen mutant
    (`pointerType === "pen" ? true : ...`) dies. So gesturePaints' touch
    branch is genuinely redundant in Chromium and genuinely load-bearing on a
    browser that honours preventDefault; the test's docstring says this
    correctly and I would leave it. The one thing it leaves out is a residual
    sentence: gesturePaints' TOUCH branch has no control on any browser this
    suite runs.
  - >-
    "N-3's three authorities. The round names what is outside all three: 'a
    write made by some future file other than play.js'. Is that the only
    hole?" No. I worked the brief's list and the answer splits cleanly by
    METHOD, not by file. A write from play.html inline, and an `<img src>` in
    play.html's markup, are both REFUSED (I built both; they red
    test_resume_is_local_and_the_page_writes_nowhere, and the img also reds
    the dependency-baseline guard). `navigator.sendBeacon` is refused by the
    string list. But three safe-method request APIs inside play.js — a renamed
    `fetch` binding via `globalThis.fetch.bind`, `new Image().src`, and a
    dynamic `import()` — each ship the whole board on every Reset with all 33
    green, because the EC-050 walk holds requests only to GET and to the
    origin while the AC-385 test holds them to the served PATH set. I did not
    test a data: or blob: URL, because neither exfiltrates; the exfil shapes
    are the three above. M-2.
  - >-
    "N-7's expected-reason fragments. Are the fragments specific enough that
    two different rules cannot share one, and is the 'one shared pair' it
    admits genuinely the same rule?" Yes to both, measured. The shared
    fragment comes from the single `cannot fit a line of` raise in `_line`,
    and both cases reach that one check — `clues-no-room` by it alone, which
    is what makes the rule's own control live. The distinctness assertion pins
    exactly one duplicate. More than that, the pairing is already catching the
    masking family it was written for: deleting the fit check makes
    `clues-too-long` fall through to the agreement rule and the fragment
    assertion names both reasons in its failure message, where cycle 2's
    truthiness-only assertion would have passed. The residual is coverage, not
    specificity: two validator branches still have no case at all (m-3).
  - >-
    "The declared residual ... is it stated correctly on the card now, and is
    the card's scope of the word 'closed' honest?" The residual is stated
    CORRECTLY and I re-derived the number rather than accepting it: `python
    player/assemble.py --capacity` prints 2.00 bits over three counted fields
    (height 1 value / 0.00, tier 4 values / 2.00, width 1 value / 0.00)
    against the 100-bit ceiling, with clues and key named exempt, and the
    deployed output itself now says the ceiling establishes only "no served
    field is wide enough to carry a grid". The card carries the 2N-across-a
    -library scale (lines 842-843, 883) and the architectural conclusion
    (lines 848-853, 885: EC-048's literal text is unsatisfiable by any
    ADR-0041 implementation, cycle-1 F-12 in requirements.yml is the real
    blocker, no requirement edited), and assemble.py's docstring carries the
    same in one new paragraph. That is the right verdict and the right route.
    The scope of the word "closed" is honest in the places that argue it and
    NOT honest in the two places that assert it in passing — assemble.py:37
    and CARD-283.md:180 both still say flatly "where EC-048 is closed" (m-5).
    Two lines.
  - >-
    "If this card is certifiable, say so." It is not, by two findings, and I
    want to be explicit about the cost I am imposing. M-1 is two table rows in
    a table that already has four of exactly that shape. M-2 is three lines
    copied from a sibling test twenty lines up the file, and I measured the
    control that proves they work. Together that is under ten lines and no new
    machinery; everything else I found is low. I am holding the card because
    the two of them are a wrong board announced solved and the player's whole
    board leaving the page, both on this card's own named AC and EC, both with
    all 33 green — not because the round's prose was wrong. Its prose this
