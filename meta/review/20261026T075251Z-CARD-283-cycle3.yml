verdict: >-
  All seven cycle-2 findings are closed, and this is the first round of the
  card that closed one by building the control against a shape its own fix was
  NOT written for — the pen. I re-fired every one on my own mutants: all four
  off-by-one ends of isClueSolved now die, each on exactly the case the card's
  table names (N-1); `const paints = true` dies on the new pen/touch test and
  nothing else (N-2); the tier narrowing is recorded, printed and controlled
  three ways (N-4); `check_out_dir(repo_root, force=True)` now raises and
  moving the check back behind `force` reds (N-5); the REPO_ROOT assertion
  goes through `check_out_dir` alone, four spellings x both force values, and
  `assemble(None, REPO_ROOT)` is gone from the file (N-6); and N-7's
  expected-reason pairing is not decoration — deleting the fit check makes
  `clues-too-long` fall through to the agreement rule and the fragment
  assertion catches it by name, which is the exact masking that twice needed a
  mutation round to find. The declared residual is stated correctly and I
  re-derived it: `--capacity` prints 2.00 bits, the card carries the 2N-across
  -a-library scale and the EC-048-is-unsatisfiable-by-any-ADR-0041
  -implementation conclusion, and routes it to cycle-1 F-12 in
  requirements.yml rather than patching it here.
  It is not certified, for two measured holes of the same family the brief
  told me to hunt — and I found both by constructing my own shapes, which is
  the test the round asked to be judged on and half-passed. (1) `sameNumbers`'s
  `a.length === b.length` conjunct has NO control: dropping it makes
  `isClueSolved` announce a board that is one cell SHORT solved, and reversing
  the comparison direction makes it announce a board one cell OVER solved —
  both leave all 33 green, and I measured both in the browser on a 4x4 and a
  3x3 board. That is AC-384's own sentence ("given one wrong cell, it does
  not"), one conjunct to the left of the four loop bounds the round closed
  (M-1). (2) EC-050's walk carries the WEAK request assertion. Three
  same-origin GET exfils of the whole board planted in play.js's reset
  handler — a renamed `fetch` binding, `new Image().src`, and a dynamic
  `import()` — each survive all 33, because
  `test_no_write_request_for_any_interaction` holds requests only to GET and
  to the origin, while its sibling `test_resume_is_local_and_the_page_writes
  _nowhere` already holds every request's PATH to the served file set. The
  identical plant moved into `commit()`, which the sibling reaches, dies. So
  the strong assertion exists three lines away from the test that needs it,
  and the round's residual ("a write made by some future file other than
  play.js is outside all three") is false as a statement of the ONLY hole
  (M-2). Both remedies together are under ten lines, and nothing else gates:
  three low findings and one prose inconsistency are the rest. Spend the last
  round on M-1 and M-2 and this merges.

