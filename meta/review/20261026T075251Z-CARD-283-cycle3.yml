findings:
  - id: M-1
    severity: medium
    title: >-
      `sameNumbers`'s length-equality conjunct has no control: dropping it
      makes isClueSolved announce a board ONE CELL SHORT solved, and reversing
      the comparison direction makes it announce a board ONE CELL OVER solved
      — both leave all 33 green.
    file: tests/test_public_player.py
    line: 1565
    gating: true
    confidence: high
    evidence: >-
      MEASURED by mutation and then by a browser probe that reads
      `isClueSolved` directly. play.js:168 is
      `const sameNumbers = (a, b) => a.length === b.length && a.every((n, i)
      => n === b[i]);` and it is called from nowhere but isClueSolved's two
      sweeps (lines 178, 182). Two one-line weakenings:
      (a) drop the length conjunct -> `(a, b) => a.every((n, i) => n ===
      b[i])`. A board whose every line's runs are a strict PREFIX of its clue
      is then solved. 33 passed / 0 failed on the whole module.
      (b) compare the other way -> `(a, b) => b.every((n, i) => n === a[i])`.
      A board whose every line's runs EXTEND its clue is then solved. 33
      passed / 0 failed.
      Neither is an equivalent mutant, and I pinned the live hazard in the
      browser with a throwaway probe (appended, run, removed, sha256
      verified). Unmutated it reads `[True, False, True, False]`; the four
      cases are a 4x4 UNIQUELY SOLVABLE puzzle (rows and columns both
      [[1,1],[0],[1,1],[0]]) with its solution `#x#x xxxx #x#x xxxx` and with
      the SAME board minus one cell `#x#x xxxx #xxx xxxx`, then a 3x3 pair
      differing by one EXTRA mark. Mutant (a) reads `[True, True, True,
      False]` — the board missing cell (2,2) is announced SOLVED. Mutant (b)
      reads `[True, False, True, True]` — the board with one extra mark is
      announced SOLVED. No line is empty in either, which is why the existing
      table misses them: a dropped cell usually makes some line read `[0]`,
      and `[0]` prefixes no nonzero clue, so only a board that keeps >=1
      filled cell in every line reaches this. Every case in the table is 5x1
      or 2x2, where that cannot happen.
      This is AC-384's own sentence ("given one wrong cell, it does not
      [fire]") on the card's correctness-critical rule, and it sits one
      conjunct to the left of the four loop bounds the round closed. The card
      does NOT overclaim here — the restated comment is scrupulously narrowed
      to the four loop-bound mutants — so this is not a false claim, it is the
      thing the narrowness was hiding, which is exactly what the brief asked
      to be checked. play.js and tests/test_public_player.py restored, sha256
      65b4224901a5e90102160d71ed3b7c55aeda59e219a030932190c9b25daae7e9 and
      d389a62390868bcc12a1609576daaa3a9ae33277ab45676d94b064740132adff.
    remedy: >-
      Two more rows in the same table, built the same way as the four
      index rows, each with no empty line:
      ("a line short of its clue", 5, 1, "#xxxx", [[1, 3]], [[1], [0], [0],
      [0], [0]], False) — the row's runs [1] prefix [1,3] and every column is
      exact, so it kills (a);
      ("a line past its clue", 5, 1, "#x#xx", [[1]], [[1], [0], [1], [0],
      [0]], False) — the row's runs [1,1] extend [1], every column exact, so
      it kills (b).
      Then state the claim as "both ends of both sweeps AND both directions of
      the run-list comparison", or leave the comment narrow and let the six
      rows carry it. Two lines, no new machinery.
    disposition: must fix before merge
  - id: M-2
    severity: medium
    title: >-
      EC-050's walk carries the WEAK request assertion (GET + same origin),
      while its sibling already holds every request's PATH to the served file
      set — so three same-origin GET exfils of the whole board, planted in
      play.js's reset handler, survive all 33.
    file: tests/test_public_player.py
    line: 1925
    gating: true
    confidence: high
    evidence: >-
      MEASURED, four plants and one control, all in play.js, all restored.
      Planted in the `actions.reset` click handler — a control the EC-050 walk
      drives twice (once in the deterministic sweep, again in the seeded
      24-step walk):
        * `globalThis.fetch.bind(globalThis)("/collect?b=" +
          history.board.cells.join(""))` — a renamed fetch binding: 33 passed;
        * `new Image().src = "/collect?b=" + history.board.cells.join("")`:
          33 passed;
        * `import("/collect.js?b=" + history.board.cells.join("")).catch(...)`
          — a dynamic import: 33 passed.
      Each ships all 100 cells of the player's board to the server on every
      Reset. `navigator.sendBeacon(...)` in the same place DIES (2 failed /
      31 passed), which is the shape the round fired.
      Why they survive, and why the fix is three lines: the walk's recorder
      refuses only a non-GET method (`writes == []`) and an off-origin URL
      (`all(request.startswith(url + "/"))`), and it asserts only that SOME
      request ends in `/puzzle/<key>.json`. It never asserts the request SET.
      `test_resume_is_local_and_the_page_writes_nowhere` DOES — lines
      1680-1686 compute `served` from `report.site_dir.rglob("*")` and assert
      `path in served or path == f"play/{key}"` for every request. The
      CONTROL: the identical renamed-fetch exfil moved into `commit()`, which
      a tap reaches, reds that sibling test and nothing else (1 failed / 32
      passed). So the strong assertion works and is three lines away from the
      test that needs it; the sibling simply never presses Reset, toggles
      Region, uses the undo/redo keys or drags, which is the whole point of
      the walk. I also listed what the walk actually records, so the allowlist
      is known to be tight: exactly six paths — /play/<key>, /play.js,
      /player.css, /solver_state.js, /tokens.css, /puzzle/<key>.json.
      Against the card: EC-050's registry text is "play state is persisted in
      the visitor's browser localStorage only and zero write requests leave
      the page", and the card's own AC-385 docstring sets the standard as "no
      request other than this page's own static assets was ever issued". Under
      these plants the play state leaves the page from eleven controls with
      every test green. And the round's residual statement — "a write made by
      some future file other than play.js is outside all three" — is wrong as
      a statement of the only hole: a write made by play.js, in a walked
      control, with a safe method and a non-`fetch(` name, is outside all
      three too.
    remedy: >-
      Copy the sibling's three lines into
      test_no_write_request_for_any_interaction: build `served` from
      `report.site_dir` and assert every recorded request's path is in it (or
      is `play/<key>`), in place of — or beside — the bare origin check. All
      three plants above die on it, measured by the D9 control. Then correct
      the residual sentence in the test and in the card to what remains after
      that: a write from a file other than play.js or play.html.
    disposition: must fix before merge
  - id: m-3
    severity: low
    title: >-
      "Every validator refuses, and says which value it refused" is false by
      two branches: `_line`'s run-length type/sign check and `_extent`'s LOWER
      bound have no case, and deleting each leaves all 33 green.
    file: tests/test_public_player.py
    line: 900
    gating: false
    confidence: high
    evidence: >-
      MEASURED, two mutants of player/assemble.py.
      (a) `_line`'s `if not isinstance(number, int) or isinstance(number,
      bool) or number < 0: raise ...` replaced by `numbers.append(number if
      isinstance(number, int) else 1)`: 33 passed. Called directly, the
      mutated `_line` ACCEPTS `[-1234567890123456789]`, `[-5, -7, 3]` and
      `[True, 2]` and returns them unchanged (the fit check `sum + len - 1 >
      length` never trips on negatives), where the real one refuses all four
      probes by name. So that branch is the only thing keeping arbitrary
      signed integers out of `clues` — the field EC-048's capacity argument
      EXEMPTS and whose narrowing (`144 clues per 10-cell line`) is the stated
      reason the exemption is tolerable. The code is right; the control is
      dead.
      (b) `if not MIN_SIZE <= value <= MAX_SIZE` -> `MIN_SIZE - 1 <= value`:
      33 passed, so a served extent of 9 would pass. The upper twin `<=
      MAX_SIZE + 1` DIES on the `width` case (MAX_SIZE + 1), so this is the
      same one-end-only asymmetry as N-1, in a different function: the table's
      two extent cases are MAX_SIZE+1 and 0, and 0 is still refused at 9.
      The docstring's sentence is the overclaim, not the code: thirteen cases
      and `assert len(cases) >= 13` read as a complete sweep of the validators.
    remedy: >-
      Two more pairs in the same dict: ("clues-run-sign", {... "rows":
      [[-1] + rest] ...}, "which is not a run length") and
      ("width-low", {**good, "width": MIN_SIZE - 1}, f"width {MIN_SIZE - 1} is
      outside"). Or, if the sweep is meant to be complete, derive it: assert
      the set of distinct `raise ValueError` messages reachable in
      `_line`/`_clues`/`_extent`/`_key`/`_served` is covered by the cases'
      fragments, so a new validator with no case reds. The first is two lines;
      the second is the authority-shaped version of what N-7 started.
    disposition: fix in this cycle if cheap, else carry as a named follow-up
