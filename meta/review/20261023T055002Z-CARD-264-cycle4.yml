      MEASURED_CLAIM_MISSES[2] now declares the residue as

        "a false type claim written as a subscript or a tuple display:
         list[list[bool]] and (0,) reach _is_type_expression..."

      _is_type_expression accepts anything that parses as an expression whose
      every ast.Name resolves in dir(builtins). That is strictly wider than "a
      subscript or a tuple display". Reproduce by calling

        _classify(span, *TestClaudeMd_EverySymbolItNamesExists._authorities())

      on each of these spans — every one returns ('type-expression', ''), i.e. is
      accepted with no defect, and none of them is a subscript or a tuple display:

        "[]"           -> ('type-expression', '')   list display
        "{}"           -> ('type-expression', '')   dict display
        "{'a': 1}"     -> ('type-expression', '')   dict display with items
        "frozenset()"  -> ('type-expression', '')   a call on a builtin
        "0"            -> ('type-expression', '')   bare numeric literal
        "0.5"          -> ('type-expression', '')   bare numeric literal
        "int | None"   -> ('type-expression', '')   a BinOp union

      The last is the one that makes this live rather than pedantic: the guarded
      paragraph the entry is about is the BOUNDARY-TYPES paragraph, where `int |
      None` is exactly the kind of span a future edit would write, and a reader of
      the declaration would conclude it is caught.

      This is the mirror image of the defect S-3 was created to repair. The spot-
      check found entry [2] WIDER than measured (it declared seven bare builtins
      missed that the guard catches); the repair made it NARROWER than measured.
      The brief's own standard: "A narrowing that overshoots is as much a defect
      as the overclaim it replaced."

      Worse, the new assertion at :3445 (`assert "subscript or a tuple display" in
      MEASURED_CLAIM_MISSES[2]`) PINS the under-wide wording, so a later reader who
      notices the gap has to defeat a control to fix it.
