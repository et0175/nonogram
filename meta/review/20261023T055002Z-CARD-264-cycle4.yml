  - id: O-1
    file: tests/test_web_server.py
    line: 2307
    title: "_independently_derived shares the ENTIRE traversal with the derivation it checks; only the name predicate is independent"
    note: |
      Measured, not inferred. The two functions share, line for line: the
      sorted(_PACKAGE_DIR.rglob('*.py')) walk, the owner computation
      (relative.parts[0] if len(parts) > 1 else path.stem), the cli_tests._ADAPTERS
      exclusion, ast.parse, ast.walk, and the FunctionDef|AsyncFunctionDef filter.
      The only independent axis is the name predicate.

      That is fine FOR WHAT THE CONTROL CLAIMS (:122-126 claims "every narrowing of
      this pattern is held", and all four narrowings I tried red). But the equality
      is structurally blind to any defect in the shared traversal. Measured:
      widening _ADAPTERS to include sourcing / difficulty / export moves BOTH sides
      identically and the equality holds in all three cases.

      Not a finding, for a measured reason: in today's tree every _ADAPTERS widening
      that sheds a non-floor member also sheds a floor member, so the floor pin at
      :2356 catches it (measured: +sourcing -> prod shrinks to {'parse_tier'},
      +difficulty -> parse_tier lost). The blind spot exists but is unreachable
      today. Worth a declared bound on _independently_derived's docstring at the
      next touch, not a fix now.
  - id: O-2
    file: tests/test_guard_integrity.py
    line: 3328
    title: "the keyword exemption's equality catches a GROWN exemption; a SHRUNK one is caught elsewhere"
    note: |
      A spot-check re-deriving ADR-0039/R3's "equality against today's sites" clause
      on MEASURED_KEYWORD_SPANS will find the equality at :3328 PASSING under a
      shrink. Measured: R3-SHRINK-KEYWORD-EXEMPTION (MEASURED_KEYWORD_SPANS ->
      ('choices=',)) kills at :3307, not :3328 — because `exempted` is recomputed
      from the same table, so both sides shrink together, and it is the main claim
      test (`type=` falls through to 'unanalysable' -> a defect) that reds.
      Both directions ARE held. The evidence line must cite :3307.
  - id: O-3
    file: src/nonogram/admin/pdf_generator.py
    line: 321
    title: "three U+2022 in a src/nonogram string literal — pre-existing, declared, not this card's"
    note: |
      Found while verifying G-6 structurally. Three U+2022 BULLET characters sit in
      an f-string at :321. They come from main (commit 1ceac072, CARD-056), not from
      this card — which touches zero files under src/ — and they are the declared
      case at tests/test_book_difficulty_dots.py:784 ("three U+2022 bullets in a
      prose paragraph about the difficulty levels"). Recorded so the next reviewer
      who runs the same structural check does not re-raise it.

verdict:
  risk_level: medium
  review_lane: deep
  certification: NOT CERTIFIED
  summary: >-
    Seven of the nine ids in fix round 3's contract certify cleanly, and the two
    that the escalation was actually about — S-1 and S-2, the controls that could
    not fail — certify with the strongest evidence in this review: 7 of 7 mutants
    killed at named linenos, and BOTH counterfactuals reproduced from e26e5473
    under the plant trap (157/157 green and 166/166 green, exactly as claimed).
    The fix round did the work it was asked to do.

    It did not finish it. The same round rewrote four declaration entries and keyed
    each only on a head fragment, so the substantive body of every one can be
    semantically INVERTED with both files green — including the literal
    F6-DECL-GUTTED mutant that fix round 2 was written to kill, which reds at
    e26e5473 and survives at 098ecd91 under a docstring that still says it reds.
    And S-3's narrowing overshot: the declared bound names two shapes where the
    measured bound is at least seven.

    Both are the card's own subject, one layer up. ADR-0039/R1 and R3 are therefore
    ✗ violated on the re-derivation this cycle was created to perform.
  key_concerns:
    - "F-1 — four declaration entries can be inverted or gutted green, and a docstring asserts the opposite. ADR-0039/R1."
    - "F-2 — the repair for an overclaim became an underclaim, and the new assertion pins it. ADR-0039/R3."
    - "The positive half is still the weak half on this card: three of this cycle's twelve certifications needed a counterfactual run to be worth anything, and the two ✗ verdicts both came from mutants, not from reading."
  approve_conditions:
    - "F-1 fixed: each declaration entry keyed on its operative clause, and the claim at :3340-3343 either re-measured or narrowed to what is held."
    - "F-2 fixed: MEASURED_CLAIM_MISSES[2] widened to the measured bound, the seven spans added to the missed side, and :3450's anti-re-widening assert re-aimed."
    - "The next cycle is a confirmation cycle on the fix delta only; S-1, S-2, S-4, W-1, B-1, B-2 and B-3 need not be re-derived unless the fix touches them."
  next_cycle_mode: "confirmation (differential) — both findings are new, so this cycle was NOT a pure confirmation; a full review is not required, but F-1's fix must be re-mutated, not read."
