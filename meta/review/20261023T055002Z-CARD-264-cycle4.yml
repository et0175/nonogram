      Widen the entry to the measured bound and re-key it. The measured bound is
      the branch's own predicate, which is already enumerable and already written:
      "a false type claim written as any expression every name in which resolves
      in dir(builtins) — a subscript, a tuple/list/dict display, a call on a
      builtin, a bare literal or a `|` union — which reaches _is_type_expression,
      is accepted for its *shape*, and is never compared against the annotations
      in the code."

