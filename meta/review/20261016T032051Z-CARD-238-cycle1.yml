  - id: F-007
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1113
    title: "The sandbox isolation the AC-3 test depends on is not itself asserted"
    description: |
      `test_the_outcomes_are_identical_with_and_without_the_log` is only
      meaningful if the copied module resolves its own sandbox root. It does
      today — I proved it with MUT-2, whose injected read PASSED in the
      with-log run and FAILED in the without-log run, which is only possible
      if it read `root/meta/kanban/suite-timing.log` (this worktree has no log
      at all, so a copy resolving the real root would have failed both ways
      and compared equal). But the test asserts nothing about that: if a
      future refactor made the copy resolve the real repo root, `present ==
      absent` and `set(present.values()) == {"PASSED"}` would both hold
      vacuously and the guard would go quiet — the same trap the card's own
      notes identify for the collected count.
    suggestion: |
      Add a positive control to the sandbox: write one extra fabricated test
      module into `root/tests/` that reads `root/meta/kanban/<stem>.log` and
      assert its outcome is PASSED in the with-log run and FAILED in the
      without-log run. That asserts the isolation directly rather than relying
      on it.
    confidence: high
