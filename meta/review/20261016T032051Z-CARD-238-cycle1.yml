  - id: F-009
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 1208
    title: "The sandbox subprocess has no timeout and inherits the parent environment"
    description: |
      `subprocess.run([...pytest...], cwd=root, capture_output=True)` carries
      no `timeout=`, so a hung sandbox pytest hangs the suite indefinitely
      rather than failing. It also inherits the parent environment, so a
      PYTEST_ADDOPTS set in a future CI (e.g. `-x`, `-p` plugins) would flow
      into both runs; the `present == absent` comparison survives that, but
      `set(present.values()) == {"PASSED"}` need not. The pre-existing
      shell-out at line 338 has the same no-timeout shape, so this is
      precedent rather than a new habit — but this one launches a whole pytest
      session, not a 50ms script.
    suggestion: "Pass `timeout=300` and `env={**os.environ, 'PYTEST_ADDOPTS': ''}`; on TimeoutExpired fail with the captured output."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
