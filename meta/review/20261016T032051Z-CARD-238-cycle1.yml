  - id: F-002
    severity: critical
    category: tech-debt
    type: bug
    file: tests/test_suite_profile.py
    line: 836
    title: "AC-4's ruling rests on two false statements about the real log, and the alternative it prescribes silently drops the rate field for half the log's rate-bearing entries"
    description: |
      `test_the_trailing_prose_shape_is_not_legal`'s comment justifies the
      ruling with two claims. Measured against
      /Users/omelnikova/PycharmProjects/PythonProject4/meta/kanban/suite-timing.log
      (read-only, md5 fd3e799a4ea30862d8d8e03966ae9349 before and after):

      1. "The one entry that wanted a note *after* the rate bracket, wave-38's
         card-212 gate, parenthesised it and parses." — There are TWO such
         entries, not one. Line 19 (wave-38 card-212-merge-gate) and line 24
         (wave-39 card-217-profiling-run, `[131ms/test] (solo profiling run,
         --durations=0 ...; artefact meta/profiling/...)`) both carry a
         parenthesised note after the bracket. Line 24 is the very entry the
         deleted `test_the_last_entry_is_this_cards_profiling_run` singled out,
         so it was in front of the author.

      2. "The convention the entries share is: commentary lives inside
         parentheses, and the rate bracket terminates the line." — Refuted by
         those same two entries: for 2 of the 6 rate-bearing entries the
         bracket does not terminate the line.

      And the consequence the ruling did not examine: because
      TIMING_LOG_LINE's `notes` group is a greedy `.*`, those two lines parse
      but their `rate` is swallowed into `notes`:

        line 19 -> rate='' , notes='7053 passed, 9 skipped, 0 failed) [159ms/test] (a first attempt...'
        line 24 -> rate='' , notes='7073 passed, 9 skipped, 0 failed) [131ms/test] (solo profiling run...'

        entries carrying a rate bracket in the text:        6
        parsed entries yielding a non-empty rate field:     3

      So the ruling's own load-bearing argument — "widening the regex would
      make the `notes` and `rate` fields ambiguous for every reader of the
      log (the cost trend is read off `duration` and `rate`)" — describes the
      status quo, not the counterfactual. Those fields are ALREADY ambiguous
      for half the log's rate-bearing entries, and they are ambiguous *because*
      the author took the parenthesised form the ruling prescribes. Per the
      review brief's criterion ("if even one entry contradicts the stated
      convention, the ruling is wrong and the parser, not the log, is at
      fault"), AC-4's premise does not hold, and G-3's conclusion ("no parser
      change was licensed and none was made") does not follow from it.

      This is not a one-line regex fix, which is part of why it needs a
      decision rather than a patch: making `notes` non-greedy (`[^)]*`) would
      recover `rate` for the plain shape but turn lines 19 and 24 — which
      parse today — into malformed lines. Accepting an optional trailing
      parenthesised note after the bracket is the shape the log actually uses.
    suggestion: |
      Re-derive AC-4 from the whole log, not from a sample, and decide the
      rate-loss deliberately. Concretely:
        1. Fix the comment's facts: two post-bracket entries (lines 19 and 24),
           and the bracket does not always terminate the line.
        2. Decide whether `rate` must be recoverable when a parenthesised note
           follows the bracket. If yes, this is a licensed parser change under
           a corrected AC-4 (the shape in question IS legal and is currently
           mis-parsed) — e.g.
             \((?P<notes>[^)]*)\)(?: \[(?P<rate>\d+ms/test)\])?(?: \((?P<extra>[^)]*)\))?$
           with a test asserting rate=='159ms/test' for the real line 19 and
           for the card-212 shape already sitting in REAL_SHAPES.
        3. If the owner prefers to leave the parser alone, say so explicitly
           and record that the log's `rate` field is unreliable for 3 of 6
           rate-bearing entries — otherwise the next cost-trend reading is
           computed off half the data without knowing it.
      Either way the bare-trailing-prose rejection (the CARD-217 gate line)
      can stand; it is the justification and the rate-loss that must be redone.
    confidence: high
    source: static
    violates: "G-3"
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1077
    title: "AC-3's skipif detector misses every spelling of a host-state skip except the bare decorator, including the standard module-level pytestmark idiom"
    description: |
      `_skipif_decorators` walks only FunctionDef/AsyncFunctionDef/ClassDef
      decorator lists and matches on `ast.unparse(decorator.func).endswith("skipif")`.
      Probed as a pure function — 5 of 5 alternative spellings MISSED:

        MISSED  pytestmark = pytest.mark.skipif(not LOG.exists(), reason=...)   # module-level, the standard pytest idiom
        MISSED  def test_x(): \n  if not LOG.exists(): pytest.skip(...)          # the imperative equivalent
        MISSED  skipper = mark.skipif  /  @skipper(not LOG.exists(), ...)        # aliased decorator
        MISSED  @pytest.mark.xfail(not LOG.exists(), reason=...)                 # same silence, different mark
        MISSED  def test_x(): \n  if not LOG.exists(): return                    # early return
        CAUGHT  (positive control) @pytest.mark.skipif(...)

      The module-level `pytestmark` miss is the worst of these: it is how
      pytest documents skipping a whole module, it would silence every test in
      the file, and `test_no_test_in_this_module_skips_on_host_state` would
      itself be one of the silenced tests.

      Mitigation, stated fairly: inside
      `TestSuiteTimingLog_FormatUnchanged` the behavioural test does catch
      these — MUT-4 (in-body `pytest.skip` on `live.exists()`, format class)
      was KILLED. Outside that class nothing catches them: MUT-5 (the same
      in-body skip in `TestSuiteProfile_RankingIsDeterministic`) SURVIVED with
      all 15 guard tests green. So the structural half of AC-3 is close to
      decoration, and the behavioural half is what holds the line.
    suggestion: |
      Extend the detector to the forms above: walk module-level assignments to
      `pytestmark` (and list elements thereof), match `xfail` with a positional
      condition, and add a body-level scan for `pytest.skip(...)` reached under
      a condition that touches the filesystem (`.exists()`, `os.path.isfile`,
      `glob`). Add each as a positive control alongside FABRICATED_SKIP. Then
      run the whole module in the sandbox (see F-001's suggestion) so the
      behavioural half covers every class, not one.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: high
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 862
    title: "test_the_same_note_parenthesised_is_legal_and_keeps_its_fields does not keep its fields, and the shape it pins is absent from the cross-check corpus"
    description: |
      The test's name asserts a property its body refutes:

        assert entry["rate"] == ""  # the bracket is no longer line-final

      The inline comment is honest, but the test *pins the field loss as
      correct* for the very shape AC-4 recommends as the remedy, under a name
      that says the opposite. This is the aspirational-green shape — a name
      echoing the AC's vocabulary over a body exercising the weaker case —
      and it is the single place where F-002's latent parser defect was
      visible and was instead certified.

      Two reinforcing weaknesses in the same territory:

      * `test_every_shape_the_real_log_uses_is_well_formed` includes the
        card-212 shape in REAL_SHAPES but asserts only
        `malformed_timing_lines(...) == []` and `len(entries) == 5`. Measured
        on REAL_SHAPES, that entry parses with rate='' and
        notes='7053 passed, 9 skipped, 0 failed) [159ms/test] (a first atte…'.
        So a test named "every shape the real log uses is well formed" is
        green over a shape whose rate field is destroyed. (Not a coverage
        reduction — the deleted test asserted the same `malformed == []` and
        no more — but it is where this should have been caught.)

      * The `ms/test] (` shape appears nowhere in the 1,576-line cross-check
        corpus (verified: no member of CORPUS, GOOD or BAD contains it). The
        seeded generator never emits a post-bracket note, so the corpus's
        breadth does not reach the one real-world shape where `notes` and
        `rate` are ambiguous. The independence of `_looks_like_an_entry` is
        genuine (see the Verdict), but the two implementations agree on this
        shape only by both ignoring the fields.
    suggestion: |
      Rename to `..._is_legal_but_loses_its_rate_field` (or fix the parser per
      F-002 and keep the name, asserting rate == '159ms/test'). Add a
      field-level assertion to `test_every_shape_the_real_log_uses_is_well_formed`
      for each of the 5 entries, so "well formed" means the fields come back,
      not merely that nothing is rejected. Add a post-bracket-note generator
      branch to `_seeded_entries` so the corpus and the cross-check reach the
      shape.
    confidence: high
    source: static
    violates: "G-2"
    root_cause: RC-2
    status: open
