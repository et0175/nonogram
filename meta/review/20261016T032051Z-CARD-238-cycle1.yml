  - id: F-001
    severity: critical
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1038
    title: "AC-1's AST guard misses 10 of 12 ways to re-introduce the live-log read; a mutant restoring the original coupling survives every guard"
    description: |
      `_live_log_references` only flags a string literal containing
      LIVE_LOG_STEM when that literal is a direct operand of a `/` BinOp or a
      direct arg/keyword of a Call. Anything that puts the name behind one
      level of indirection is invisible. Probed as a pure function (the guard
      takes source text, so this is exact, not inferred) — 10 of 12 evasions
      were MISSED:

        MISSED  LOG_NAME = "suite-timing.log"; REPO_ROOT / "meta" / "kanban" / LOG_NAME
        MISSED  os.path.join(str(REPO_ROOT), "meta", "kanban", NAME)
        MISSED  Path("meta/kanban/suite-" + "timing.log")
        MISSED  next((REPO_ROOT / "meta" / "kanban").glob("*.log"))
        MISSED  Path(*PARTS)
        MISSED  REPO_ROOT / "meta" / "kanban" / f"{STEM}.log"
        MISSED  a @pytest.fixture returning the path built from a hoisted name
        MISSED  Path("meta/kanban/%s.log" % "suite-timing")
        MISSED  PATHS["log"] out of a module-level dict
        MISSED  a slice of a longer string
        CAUGHT  "meta/kanban/{}.log".format("suite-timing")
        CAUGHT  .with_name("suite-timing.log")
        CAUGHT  (positive control) the original literal form

      The first one is decisive: it is not an evasion, it is a routine
      refactor — naming the filename — and it reproduces the exact coupling
      this card exists to remove. The sixth is the pattern this very module
      already uses in `_run_format_class`, so the file demonstrates its own
      bypass.

      Step 8f mutants in the real file (reverted from a pre-captured copy,
      md5 9b3064f4b75e0910496dca695864578d restored and verified):

        MUT-1  literal live read, format class        -> KILLED (rc=1)
        MUT-2  hoisted filename, format class         -> KILLED (rc=1) but only by
                                                         AC-3's behavioural test;
                                                         AC-1's guard stayed green
        MUT-3  hoisted filename, ANOTHER class        -> SURVIVED (rc=0, 15/15 green)
        MUT-5  in-body pytest.skip + live read,
               ANOTHER class                          -> SURVIVED (rc=0, 15/15 green)

      MUT-5 is the original defect verbatim — a host-conditional skip wrapped
      around a read of the gitignored log, green-with-a-skip on a machine
      without the file, red on one with a gate line in it — and all twelve
      AC-1 tests plus all three AC-3 tests pass over it.

      So the class docstring's claim ("AC-1: no test reads
      meta/kanban/suite-timing.log, proved structurally") and AC-1's own
      wording ("so a future test that re-introduces the read fails") are both
      false. The AST guard is the sole mechanism for AC-1, which is why this
      is Critical rather than Important: a surviving mutant against the sole
      test for a stated AC. The real defence that did fire — AC-3's
      `test_the_outcomes_are_identical_with_and_without_the_log` — is scoped
      to one class of one module, which is narrower than either claim.
    suggestion: |
      Either narrow the claim to what the guard proves, or widen the guard.
      Widening is cheap and keeps the AC: resolve names before judging. In a
      single-module AST walk that means collecting every
      `Assign`/`AnnAssign` whose value is a string literal (or an f-string, or
      a `+`/`%`/`.format()` of literals) containing LIVE_LOG_STEM into a
      tainted-name set, then flagging a `/` operand or Call argument that is
      an `ast.Name`/`ast.Attribute`/`ast.Subscript` resolving into that set —
      plus a flat ban on `glob`/`rglob` calls whose pattern ends `.log` under
      a `meta/kanban` path. Add each MISSED form above to REINTRODUCTIONS as a
      positive control so the widening is itself tested.

      Complementarily, broaden the behavioural guard, which is the part that
      actually bites: run the *whole module* in the sandbox rather than only
      `TestSuiteTimingLog_FormatUnchanged`, so a read re-introduced in any
      class is caught by outcome divergence. That alone would have killed
      MUT-3 and MUT-5.
    confidence: high
    source: static
    violates: "G-5"
