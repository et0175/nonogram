      with its controls as the card's own rule demands. (b) Whatever is NOT
      closed, state it as a declared bound in `Retention.by_name`,
      `retained_bitmap_bytes`, band:1789 and frame:3266, and delete the three
      universal phrasings ("however deeply nested and whatever form the pixels
      are in", "arbitrarily deep", "parked anywhere that is not a cache").

  - id: F-002
    severity: important
    gating: true
    confidence: high
    title: >-
      The widened consumer denominator cannot see an AUTOUSE fixture -- the
      shape that defeats the default-deny guard completely -- and the enumeration
      of what it "still cannot see" does not mention it
    file: tests/helpers/shared_fixture_controls.py
    line: 301
    also:
      - "tests/helpers/shared_fixture_controls.py:287 (declared_consumers)"
      - "tests/helpers/shared_fixture_controls.py:207 (_fixture_graph: the marker it reads carries .autouse and it is not read)"
      - "tests/test_shared_fixture_controls.py:359 (HOLE_ONE_SHAPES -- the five shapes, hand-written)"
    claim: >-
      declared_consumers:301 -- "What it still cannot see: a fixture taken at run
      time with ``request.getfixturevalue``, and a transitive chain whose middle
      link is defined outside ``namespace``. Both are declared". The card's
      §2 states three declared bounds and no fourth. The module docstring says
      "All four are closed".
    mechanism: >-
      A test counts as a consumer only if it ASKS: `asked = _parameters(member) |
      _marked_fixtures(...)`, intersected with the transitive closure. An autouse
      fixture is injected without being asked, so it contributes nothing to
      `asked` -- while pytest puts the shared fixture in EVERY item's
      `fixturenames`. In a module whose autouse fixture chains to the shared
      render, `declared_consumers` returns the empty set, so
      `absent = declared - collected` is empty for ANY selection and
      `refuse_unless_every_consumer_is_collected` passes unconditionally. That is
      not an under-count of the denominator, it is the denominator going to zero:
      the guard stops guarding, silently, in the pass direction.
    evidence: >-
      PROBE (pytest module kept outside tests/, in the scratchpad, run with
      ./.venv/bin/python -m pytest -p no:randomly -s): a module-scoped `shared`
      fixture plus `@pytest.fixture(autouse=True) def _always(shared)` and a test
      that asks for nothing. The test asserts, and it PASSES:
      `"shared" in request.fixturenames` is TRUE (pytest's own authority says the
      test consumes it) while `declared_consumers(module.__dict__, "shared")`
      prints `[]`. Same probe, second shape: `def testCamelCaseIsCollectedToo(self, shared)`
      in a `TestCamel` class IS collected by pytest (python_functions is
      unconfigured in pyproject.toml, so the default `test` PREFIX applies) and
      `declared_consumers` prints `[]` for it too, because
      `declared_consumers`/`_test_members` hard-code `startswith("test_")`.
      3 collected, 3 passed. (A third shape I probed -- a `Test` class nested
      inside a NON-Test class -- is NOT a gap: pytest does not collect it either.
      Recorded so cycle 2 does not chase it.)
      LIVE IN THIS TREE: `grep -rc "autouse=True" tests/` -> 5 occurrences in
      4 modules (test_admin_auth.py x2, test_admin_serving.py,
      test_card_037_upload_retry.py, test_card_044_preview_after_submit.py).
      The controls module's own words are "a module which starts importing the
      shared home is covered the day it does", so the denominator's completeness
      is a claim about every module, not only band and frame.
    why_it_matters: >-
      The card exists because a false negative in a default-deny guard is the one
      direction ADR-0039/R2 does not tolerate. Four declared-side shapes were
      closed and a fifth, of the same kind and strictly worse in effect, was
      neither closed nor declared. The shape set in `HOLE_ONE_SHAPES` is
      hand-written, and the predicate under it is default-ALLOW: a request shape
      the reading does not recognise makes a test a non-consumer. That is the
      CARD-245 pattern the brief names -- derived set, allow-list predicate.
    remedy: >-
      One pass, no src change. `_fixture_marker` already returns pytest's own
      `FixtureFunctionMarker`, and that object carries `.autouse` (verified:
      `FixtureFunctionMarker {'scope': 'module', 'autouse': True, ...}`). So:
      record autouse fixtures in `_fixture_graph`, and in `declared_consumers`,
      if any name in `_implying_fixtures(fixture, graph)` is autouse at module
      level (or at the class level in scope), return EVERY test in that scope as
      a consumer. Add the found-now / missed-before control pair to
      HOLE_ONE_SHAPES exactly as the four existing rows do -- the WITHOUT arm
      (`_as_card_218_read_it`) misses it, so the pair is real. Separately, derive
      the `test_`/`Test` prefixes from pytest's own `python_functions` /
      `python_classes` ini values instead of hard-coding them, or state the
      prefix assumption as a declared bound. Then re-state the enumeration at
      :301 and the card's §2 bound list so it names everything left open.

  - id: F-003
    severity: important
    gating: true
    confidence: high
    title: >-
      The new agreement guard reads only `def`/`class` statements, so a copy put
      back as an assignment or an alias is not refused -- and the claim is
      "never both"
    file: tests/test_shared_fixture_controls.py
    line: 224
    also:
      - "tests/test_shared_fixture_controls.py:209-237 (test_no_importer_defines_its_own_copy_of_a_shared_helper)"
      - "tests/helpers/shared_fixture_controls.py:14 (module docstring: \"refuses any consumer module that redefines a name this module exports\")"
    claim: >-
      shared_fixture_controls:14 -- the guard "refuses any consumer module that
      redefines a name this module exports". The test's own docstring -- "A
      module may import a helper or write its own -- never both."
    mechanism: >-
      `local = {node.name.lstrip("_") for node in tree.body if isinstance(node,
      (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))}`. Two narrowings in
      one line: only `tree.body` (so a definition inside `if TYPE_CHECKING:` or a
      `try:` block is out of view), and only the three definition node types (so
      a module-level `ast.Assign`/`ast.AnnAssign` to the name, a `lambda` bound
      to it, or `from x import y as case_of` is out of view). The CARD-218 state
      the guard exists to make impossible -- two readings of one question in one
      file -- is reachable by any of those spellings.
    evidence: >-
      MUTANT R2 (addition-shaped, in the REAL file; the card's M21/M23 are the
      same shape in the spelling the guard WAS written from): added to
      tests/test_book_pdf_band.py at module level a `def _probe_own_digest(page)`
      returning its own sha256, then `_page_digest = _probe_own_digest`, which
      rebinds the aliased import to a local second reading of the same question.
      Ran `pytest -o addopts='' -p no:randomly tests/test_book_pdf_band.py
      tests/test_shared_fixture_controls.py`: "65 passed, 250 warnings in 8.41s".
      ZERO FAILURE CELLS -- the file now has a local copy AND the import, and
      every call site uses the copy. File restored from the pristine copy;
      `git status --short -- tests/ src/` clean afterwards.
    why_it_matters: >-
      This is the card's headline Half-B mechanism and the thing the whole
      de-duplication rests on. ADR-0039/R2's durable form is that "the controls
      are the shapes the guard was NOT written from"; M21/M22/M23 are all `def`
      shapes, which is the one shape it was written from. A bypass this cheap
      means the guard certifies agreement it cannot see.
    remedy: >-
      One pass, no src change. Either (a) extend the AST reading to every binding
      form -- walk the whole tree rather than `tree.body`, and collect
      `ast.FunctionDef`/`AsyncFunctionDef`/`ClassDef` names, `ast.Assign` /
      `ast.AnnAssign` / `ast.AugAssign` Name targets, walrus targets, and
      `alias.asname` on `ast.ImportFrom`/`ast.Import` whose module is not the
      shared home -- or (b) better and derived (ADR-0039/R2): for each importer
      module already in `sys.modules` after collection, compare
      `getattr(mod, name).__module__` against `controls.__name__` for every
      shared name the module binds, which answers from the object itself rather
      than from a list of syntax shapes. Either way, add R2 above as a control
      alongside M21/M23, and narrow the "never both" / "redefines" wording to
      whatever the final reading really covers.

