  - id: F-001
    severity: important
    gating: true
    confidence: high
    title: >-
      Hole 2's widened walk claims "however deeply nested and whatever form the
      pixels are in"; three real page bitmaps parked at band module level are
      invisible to it and red nothing
    file: tests/helpers/shared_fixture_controls.py
    line: 537
    also:
      - "tests/helpers/shared_fixture_controls.py:555 (_step: the honest declaration, in a private helper)"
      - "tests/helpers/shared_fixture_controls.py:653 (retained_bitmap_bytes: \"a container nested arbitrarily deep\")"
      - "tests/test_book_pdf_band.py:1789 (\"a page parked anywhere that is not a cache, lands in the equality above and reds\")"
      - "tests/test_book_puzzle_frame.py:3266 (\"a page retained any of those ways reds here\")"
    claim: >-
      Retention.by_name is documented as "the module's own accumulators and
      anything they reach, however deeply nested and whatever form the pixels are
      in"; band's control says a page "parked anywhere that is not a cache ...
      reds"; frame's says "a page retained any of those ways reds here".
    mechanism: >-
      `_step` enters exactly: Mapping, list, tuple, set, frozenset, a
      module-level `functools._lru_cache_wrapper` (only with enter_caches=True),
      and `Test*` classes. Everything else returns []. An instance's __dict__ is
      never entered, `collections.abc.Collection` types outside the five
      concrete ones are not entered, and a cache not bound to a module-level
      name is in neither half (`_caches_of` reads module-level names only, and
      `_step` refuses to enter a wrapper when enter_caches=False).
    evidence: >-
      PROBE (script outside tests/, ./.venv/bin/python): with a 2550x3300x3
      stand-in, `retained_bitmap_bytes` reports 25,245,000 B for a module-level
      list (A), a container two deep (B) and a Test-class attribute (C) -- the
      card's M24/M25/M26 -- and reports 0 B for: a plain object's attribute (D),
      a dataclass field (E), a collections.deque (F), the SAME lru_cache held
      inside a module-level list (H), the same cache on a Test-class attribute
      (I), a functools.cached_property on an instance (J), and a default-argument
      closure (K).
      MUTANT R1 (addition-shaped, in the REAL file, pristine copy kept outside
      the worktree): parked three genuine page bitmaps at
      tests/test_book_pdf_band.py module level -- one numpy (3300,2550,3) uint8
      array on a plain (non-Test) object's attribute, one in a
      collections.deque, and one behind an @lru_cache bound inside a list rather
      than to a name -- 75,735,000 B in total, three whole page bitmaps.
      Ran `pytest -o addopts='' -p no:randomly tests/test_book_pdf_band.py`:
      "40 passed, 250 warnings in 6.30s". ZERO FAILURE CELLS. File restored from
      the pristine copy; `git status --short -- tests/ src/` clean afterwards.
    why_it_matters: >-
      D/E/F/J are not exotic: `_set_once` already produces numpy arrays, and the
      module-level holder-object and cached_property shapes are the obvious next
      refactor of exactly these files. Hole 2's declared channel was "a bitmap
      behind an @lru_cache", and that channel is closed only for a cache bound to
      a module-level name -- the claim "All four are walked now" is wider than
      what was built. This is the same false-negative-in-a-default-deny shape as
      hole 2 itself, re-created one level out, and the private `_step` docstring
      that states the truth is not the claim a reader of the control sees.
    remedy: >-
      One pass, two parts, no src change. (a) Widen `_step` cheaply and
      measurably: enter `collections.abc.Collection` instead of the five
      concrete container types (closes F), enter `vars(value)` for an instance of
      a user class that is not in `_OPAQUE` and is not a type (closes D, E, J),
      and when the walk meets an `_lru_cache_wrapper` that is NOT one of
      `_caches_of(namespace)`'s named module-level caches, enter it into by_name
      rather than skipping it -- an unnamed cache holding a page is unexempted
      retention by the exemption's own definition (closes H, I). Re-run the band
      and frame files to confirm the real globals() do not red, and add one
      found-now / missed-before control pair per new channel in
