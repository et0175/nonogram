  - id: F-005
    severity: minor
    gating: false
    confidence: high
    title: >-
      Band's exemption control carries a conjunct that cannot fail by
      construction -- `set(retained.by_cache) <= _lru_cache_names(globals())`
    file: tests/test_book_pdf_band.py
    line: 1825
    claim: >-
      band:1789 -- "The second assertion is the exemption's own control
      (ADR-0039/R3) -- the allowance covers exactly the names ``functools`` made
      caches of, so a third cache, or a page parked anywhere that is not a cache,
      lands in the equality above and reds."
    mechanism: >-
      `Retention.by_cache` is built as `{name: ... for name, cache in
      _caches_of(namespace).items()}` (shared_fixture_controls:696) and
      `lru_cache_names(namespace)` is `set(_caches_of(namespace))`
      (:641) -- the same function, the same namespace. `by_cache`'s key set is
      therefore a subset of `lru_cache_names` for every possible input, so the
      `<=` conjunct is a line that cannot fail. The first conjunct,
      `caches == {"_font_bytes", "_set_once"}`, IS failable and does bite
      (measured: see `reproduced` above).
    evidence: >-
      Probe: `set(r.by_cache) <= lru_cache_names(ns)` -> True, with
      `by_cache keys {'_cached'}` and `lru_cache_names {'_cached'}`, for a
      namespace holding one cache; and by construction for any other. CARD-218's
      own cycle 2 (F-005) was a conjunct deleted for exactly this reason, and
      THIS card wrote
      `TestSharedControls_TheCopiesCannotComeBack::test_a_denominator_read_off_another_module_is_refused`
      to stop it recurring -- then re-introduced one in band.
    remedy: >-
      Drop the `<=` conjunct, or give the claim a reachable subject: assert what
      actually could go wrong, which is that a page is reported in by_cache for a
      name that is not an lru_cache (unreachable today) or -- the useful version,
      and F-001's remedy (a) makes it reachable -- that a cache NOT bound to a
      module-level name lands in by_name rather than vanishing. Narrow the
      docstring sentence either way.

  - id: F-006
    severity: important
    gating: true
    confidence: high
    carried_from: "[FIX PRE-GATE on 6677cbf0] -- the open finding, ruled on here rather than re-discovered"
    title: >-
      Ruling on the open finding: narrowing the claim IS sufficient for AC-1, but
      only together with a fence on the three tests that now carry the lost term
      alone -- and CARD-220 is chartered to prune exactly those
    file: tests/test_book_toc.py
    line: 429
    evidence: >-
      The pre-gate's Q6 (off-by-one in `interior_stream`'s `first_answer_page`,
      src:6718) measured 4 red cells on the base tree and 3 on the converted
      tree, the lost one being
      TestBookToc_PageNumbersMatchTheWalk::test_each_row_points_at_the_page_the_walk_planned.
      I did not re-run Q6; I accepted it and instead verified its METHOD and its
      generality with a second, independent src mutant in the same two-arm shape
      (M29, F-004's evidence: base 21 cells, HEAD 14, the 7 lost being exactly
      the seven converted tests). I then traced the cause in the code rather than
      in the docstring: `_planned_rows` at tests/test_book_toc.py:231 passes
      `_solutions_divider_page(decided)` into `structural_toc_entries`, where
      production at src:6786 passes its own `first_answer_page - 1` computed at
      src:6718 -- and `grep -n first_answer_page src/nonogram/admin/book_pdf_generator.py`
      shows it is read at :6734 (an inert page_spec probe, per the code's own
      comment), :6786, :6976 and :6978 and is carried on no returned value, so no
      pure surface exposes it.
    ruling: >-
      I accept the pre-gate's measurement and its diagnosis, and I add the
      mechanism and one condition it did not state.
      THE MECHANISM: the term was lost because `_planned_rows` (tests/test_book_toc.py:231)
      must SUPPLY the solutions page to `structural_toc_entries`, and it supplies
      `_solutions_divider_page(decided)` -- a test-side re-spelling of production's
      `first_answer_page` (src:6718). Production builds the same rows at src:6786
      with its OWN `first_answer_page - 1`. So on the converted tree the solutions
      row carries a test-authored number where it used to carry production's, and
      that -- not the docstring -- is why Q6's off-by-one no longer reds it. It is
      structurally unreachable from any pure surface: `InteriorStream` carries
      neither `toc_entries` nor `first_answer_page` (the round's own G-5 finding),
      and `page_count` / `answer_page_count` do not read it.
      SUFFICIENCY: AC-1's "it fails if the plan changes" reads on the plan terms
      the test asserts, and those are mutant-covered (the card's M17b reds it). The
      defect is the docstring asserting coverage the test does not have --
      ADR-0039/R1, not AC-1. So narrowing is enough for AC-1. It is NOT enough on
      its own, because the pre-gate's own "no defect escapes" now rests on a single
      class, in a file CARD-220 is chartered to prune for redundancy. That is the
      half that gets forgotten.
    remedy: >-
      One pass, four edits, no src change.
      (1) Replace the last sentence of
      TestBookToc_PageNumbersMatchTheWalk::test_each_row_points_at_the_page_the_walk_planned's
      docstring ("Both are pure and neither draws; an off-by-one in either reds
      this.") with the two terms it really covers (`page_count`,
      `answer_page_count`) plus an explicit statement that `interior_stream`'s own
      `first_answer_page` (src:6718) is NOT covered here.
      (2) Say in `_solutions_divider_page`'s docstring that it is a test-side
      re-spelling of a production term, that the row's page is therefore
      test-authored on this tree, and that the production term's coverage lives in
      the rendering class -- with the Q6 cell counts (4 on base, 3 on HEAD).
      (3) FENCE: name, on CARD-219's AC-3 record and on CARD-220's card,
      TestBookToc_PageNumbersSurviveTheTitlePage::test_the_solutions_row_points_at_the_solutions_divider,
      ::test_the_comparison_would_have_caught_a_one_page_drift and
      TestBookToc_PageNumbersMatchTheWalk::test_the_named_pages_really_are_those_pages
      as the sole carriers of the `first_answer_page` term, with the Q6
      measurement, so the next card cannot prune them as redundant renders.
      (4) RAISE, do not make: exposing `toc_entries` and `first_answer_page` on
      `InteriorStream` is the durable fix -- it would delete `_solutions_divider_page`
      outright and restore the lost cell -- and it is a src change G-5 forbids
      here. It is NOT CARD-220's (that card is test deletion and has no src
      mandate): cut it as a successor card to CARD-219, with Q6's two-arm cell
      counts as its acceptance evidence.
    disagreement_with_pre_gate: >-
      Only one, and it is additive rather than corrective: the pre-gate frames the
      remedy as "either the claim narrows ... or `first_answer_page` gets exposed".
      Narrowing alone leaves the coverage standing on one class that a sibling card
      is chartered to delete, so the fence (3) is part of the remedy, not
      housekeeping.

