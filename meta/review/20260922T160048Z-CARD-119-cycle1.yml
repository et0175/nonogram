    file: tests/test_book_plan.py
    line: 276
    title: "G-3 never-regrade test cannot detect a regrade"
    description: |
      test_selection_never_regrades monkeypatches difficulty.score_difficulty/classify on the
      module object. book_plan.py binds names via `from nonogram.difficulty import ...`, so a
      future `from nonogram.difficulty import classify` in book_plan would bind the original
      function before the patch and the test would still pass. The test verifies only that the
      current code does not call a symbol it does not import.
    suggestion: |
      Replace (or supplement) with an AST assertion that book_plan imports exactly {Tier,
      tier_of_record} from nonogram.difficulty, or patch book_plan's own namespace.
