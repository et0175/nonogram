      Site 1 (new in 84fd9ded), tests/test_db_engine_lifecycle.py:710-713, in
      `TestEngineLifecycle_TheDbCoverageDoesNotQuietlyVanish`''s docstring:
      "... recorded on CARD-252, whose record is kept on
