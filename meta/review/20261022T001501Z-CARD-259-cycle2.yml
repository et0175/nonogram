      "every measured figure and declared bound of them is stated here, and every other
      docstring in this repository that names CARD-252 carries a pointer back here rather than
      restating one."

      Both are false on disk, and the counterexample is the same text cycle-1 F-101 itemised.
      tests/test_db_engine_lifecycle.py''s module docstring (lines 1-57) still restates FOUR of
      CARD-252''s record items; fix round 1 removed only the fifth (the waves/gates figure):

        * the defect mechanism -- module :13-15 "so a process that had already built the global
          engine for that URL kept it, pool and all, and connections opened before the DROP were
