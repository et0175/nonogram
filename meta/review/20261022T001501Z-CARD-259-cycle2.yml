    evidence: |
      ATTRIBUTION: INTRODUCED BY FIX 1. Checked at both commits, not by impression.
      `git diff 27ca88c7..84fd9ded -- tests/test_db_engine_lifecycle.py` contains exactly one
      added line carrying the phrase "restated in no docstring"; it is absent at d85b48b0 and
