          not exist`` and a ``UUID`` column arriving as the float ``inf`` so that
          ``uuid.UUID(hex=inf)`` called ``.replace`` on it" vs keeper :253-255, the same two
          signatures inside the motive sentence. These are a measured detail of the record, which
          is what Site 2''s "measured figure" clause is about;
        * AC-3''s withdrawal -- module :26 "**AC-3 ... is withdrawn.**" vs keeper :262
          "**withdrew** that acceptance criterion (AC-3)". Survival-table row 14 types this
          clause as `bound`, which is what Site 2''s "declared bound" clause is about;
        * the precondition-not-the-race bound -- module :33 "**So what is pinned here is the
          hazard''s PRECONDITION, not the absence of the race.**" vs keeper :277 "What the
          function therefore removes is the hazard''s **precondition**." Survival-table row 12
          types this as `bound` too.

      NOTHING REDS ON ANY OF IT, and that is the gating half. The derived deny-default asks only
      that a signature-carrying docstring hold the word-bounded dotted path
      (`_texts_not_pointing_at_the_keeper`, :503-516). The module docstring carries it twice
      (re-derived), so it is clean by construction however much of the record it restates. The
      exactly-one-text check that could bite applies only to the 12 figure/bound rows of
      `_CARD_252_CLAUSE_SURVIVAL`, i.e. to 12 named phrases -- and rows 12 and 14 pass only
      because the check is phrase-literal while the module docstring states the same two bounds
      in different words. The number-token class sweep the card reports ("only one token denotes
      the same measurement in two texts") enumerates NUMBER tokens, so it is structurally blind
      to a doubled signature string and to a doubled bound; its conclusion does not reach them.

      So this is cycle-1 F-101 in narrowed form -- a uniqueness claim with a counterexample on
      disk and no control that can fail -- reintroduced by the fix for F-101, in a text the fix
      wrote, plus one brand-new instance at Site 1 that is unqualified ("no docstring, this one
      included") and therefore false on its face.

