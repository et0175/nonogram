  - id: F-206
    title: 'the signature regex is not word-bounded on the right, and the comment beside it says every arm means the same thing by "word"'
    severity: low
    category: RISK
    confidence: high
    source: static
    attribution: 'introduced by fix 1 (84fd9ded) -- both the regex and the comment are new in this round'
    file: tests/test_db_engine_lifecycle.py
    line: 415
    evidence: |
      ATTRIBUTION: INTRODUCED BY FIX 1.

      tests/test_db_engine_lifecycle.py:415 `_CARD_252_SIGNATURE =
      re.compile(r"(?<![A-Za-z0-9_])CARD-252(?![0-9])")` -- the right assertion excludes digits
      only. :417-419, immediately below: `_WORD_BOUNDED =
      r"(?<![A-Za-z0-9_]){}(?![A-Za-z0-9_])"`, with the comment "One whole-word match, left and
      right. **Used for the globals, for the pointer and for the signature above**, so "word"
      means the same thing in every arm."

      It is not used for the signature. The signature uses a different right boundary, so
      `CARD-252a`, `CARD-252_old` and `CARD-252x` are signature matches while nothing else in
      the file would call them whole words. The asymmetry is defensible on its own terms
      (`(?![0-9])` is what stops `CARD-2521` from matching, and a letter cannot follow a card id
      in practice), but the comment asserting identity is false, and cycle 1''s whole gating
      family is sentences asserting what the mechanism does not do.

      Blast radius today: zero, measured -- the 11-text derived set is identical under
      `_WORD_BOUNDED.format("CARD-252")`. This is a Minor on the sentence, not on the regex.

      FIX: one word -- say the signature carries its own right boundary and why -- or use
      `_WORD_BOUNDED` for it and keep a digit-exclusion note.
    status: fixed
    fixed_in: 'fix round 2'
    fix_note: >-
      FIXED by deletion, the cheapest correct route: the false clause is gone from the comment rather than the regex being changed, because the regex is defensible on its own terms and changing it is mechanism. The _WORD_BOUNDED comment now reads "One whole-word match, left and right. Used for the globals and for the pointer." -- "and for the signature above, so 'word' means the same thing in every arm" DELETED. MEASURED, as asked: across every *.py in this worktree, `CARD-252` is followed by a letter or underscore ZERO times and by a digit ZERO times, so the looser right boundary has never matched something it should not; and the derived set is identical under either boundary -- 11 texts, the same 11 by (path, qualname), under re.compile(r"(?<![A-Za-z0-9_])CARD-252(?![0-9])") and under _WORD_BOUNDED.format("CARD-252"). Blast radius zero, measured rather than argued.

