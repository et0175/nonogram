ured by an independent ast walk: BEFORE 11 texts / 3 held to the parameters arms / 2 naming exactly one global / 6 pointer-only. AFTER: IDENTICAL -- 11 / 3 / 2 / 6; the identity set is exactly the three texts the >1 predicate held today, so no text changes role and the new predicate reds nothing new. A >= 1 threshold was MEASURED AND REJECTED: it pulls both module docstrings (tests/helpers/undefined_table_report.py:1 and tests/test_db_engine_lifecycle.py:1) into the names AND heads arms, and each would red on both -- they name `engine` once in ordinary prose and show neither spelling head, so a >= 1 threshold reds two legitimately pointer-only texts. The prose that invited the wrong inference is narrowed: the guard's ":851-853" sentence keeps "holds this docstring to naming each of them as a whole word" and DROPS "-- reword one of the three away and that control reds, per name"; the agreement's "The parameters" paragraph drops its predicate description, its declared bound and its measured split (15 -> 9 lines); session.py's paragraph describing the >1 threshold drops it (7 -> 4 lines). No sentence anywhere explains the new predicate.

