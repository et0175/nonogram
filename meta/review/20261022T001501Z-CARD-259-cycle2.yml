  - id: F-202
    title: 'the >1 role threshold lets a text reword itself out of the names arm; the same mutant killed before this round and survives now'
    severity: high
    category: BUG
    confidence: high
    source: static
    violates: 'ADR-0039/R1'
    attribution: 'introduced by fix 1 (84fd9ded) -- at d85b48b0 the three texts were a hand-written tuple held unconditionally; the role predicate that creates the escape is new in this round'
    file: tests/test_db_engine_lifecycle.py
    line: 1113
    evidence: |
      ATTRIBUTION: INTRODUCED BY FIX 1, and it is a measured regression, not a new claim.
      Read at both commits. At d85b48b0, tests/test_db_engine_lifecycle.py:880-884 built
      `texts` as a literal 3-tuple (conftest pointer, reset_engine docstring, the class
      docstring) and the names arm ran over all three unconditionally. At 84fd9ded, :1105-1109
      builds it by predicate: `if len(_names_shown_in(doc, names)) > 1`. A text that names 1 or
      0 globals leaves the set and is held to nothing but the pointer.

      MEASURED, plain-run domain (the committed instrument refuses tests/conftest.py by
      identity, `_refuse_forbidden_path` -- which I did not widen; G-3), cp -p backup in the
      scratchpad, restore in a trap, restore verified `shasum -a 256` equal AND `diff -q` clean,
      SHIPPED re-run (18 passed, 2 skipped, EXIT=0) before and after each:

        * ROLE-SLIP-ONE[conftest] -- tests/conftest.py:499, whole-word `SessionLocal` Z-filled
          (line count preserved, 12 chars for 12). Plain pytest over the whole lifecycle file:
          EXIT=1 at :1121, "…/tests/conftest.py:463 _rebuild_public_schema does not name every
          global _init_engine() creates (['SessionLocal', '_engine_url', 'engine']) as a whole
          word". KILLED.
        * ROLE-SLIP-TWO[conftest] -- the same single line, `SessionLocal` AND `_engine_url` both
          Z-filled. The text now names 1 global, drops out of `texts`, and the names and heads
          arms never see it. Plain pytest: EXIT=0. SURVIVED.

      The same two-name deletion at d85b48b0 could not have survived: the tuple held that text
      whatever it said, so `_names_shown_in(text, names) == set(names)` would have failed on
      {'engine'} != {'SessionLocal','_engine_url','engine'}.

      WHY THE SHIPPED MATRIX CANNOT SEE IT. AC-2 asks for "a per-name, per-text kill matrix",
      and the shipped matrix is exactly one name per text (DOC-NAME-DEL[name@text], nine cells).
      One name deleted leaves two named, which still clears the threshold -- so every cell in the
      matrix is on the side of the threshold where the arm still applies. The shape that defeats
