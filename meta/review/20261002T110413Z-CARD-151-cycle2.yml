findings:
  - id: F-006
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_start_admin_local.py
    line: 858
    title: "Surviving mutant ME: an empty ?dbname= overriding a non-empty path is untested, and its failure mode is a green tick on an unchecked database (introduced by fix 1, F-001 fix)"
    description: |
      scripts/start_admin_local.sh:54 matches `.*&dbname=([^&]*)` so an empty `?dbname=`
      overrides the path and DB_NAME becomes "" -> refused. That is correct: libpq takes the
      blank value and falls back to a database named after the user (parse_dsn on
      `postgresql://u@h:5432/nonogram_dev?dbname=` gives dbname ''). But the only test,
      test_an_empty_dbname_in_the_query_still_names_no_database (:858), uses
      `postgresql://someone@localhost:5432/?dbname=` — the path is already empty, so it
      cannot tell "empty query value overrides" from "empty query value ignored". Mutant ME
      (`[^&]*` -> `[^&]+`) passes all 36 tests. Demonstrated on a scratch copy through the
      suite's own run_script: with URL `postgresql://someone@localhost:5432/nonogram_dev?dbname=`
      and existing_dbs=[someone, stub_owner] (nonogram_dev absent) the real script exits 1
      "✗ DATABASE_URL names no database"; the ME mutant exits 0 printing
      "✓ PostgreSQL is running, database 'nonogram_dev' reachable (Homebrew)" while the psql
      model connected to dbname=someone. That is AC-2's forbidden shape (a green tick that
      the user-named database bought) and the corollary F-001 was about (named != checked).
      The corpus has no empty-dbname query value, so it does not catch it either.
    suggestion: |
      Change the URL in test_an_empty_dbname_in_the_query_still_names_no_database to
      `postgresql://someone@localhost:5432/nonogram_dev?dbname=` (keep existing_dbs without
      nonogram_dev, e.g. ["someone", STUB_USER]) — or add it as a second case beside the
      trailing-slash one. ME must then be killed.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: ce2574b
    dismissed_reason: null
    learned_pattern: null

  - id: F-007
    severity: low
    category: tech-debt
    type: risk
    file: scripts/start_admin_local.sh
    line: 56
    title: "A percent-encoded ?dbname= is named undecoded while psql checks the decoded name (fix 1 extends a pre-existing path quirk to the query)"
    description: |
      Measured offline: `.../nonogram_dev?dbname=nonogram%5Fother` -> script names
      'nonogram%5Fother', libpq and the panel connect to 'nonogram_other'; `?dbname=a%26b` ->
      'a%26b' vs 'a&b'; `?db%6Eame=other` -> script names the path's 'nonogram_dev' while
      libpq/panel use 'other'. psql still checks the database the panel uses (the full URL is
      passed), so the outcome is right and never an unsafe green; only the name in the
      ✓/✗ line is off. The path had the same quirk before this card (CARD-150 `##*/`).
      Also feeds the out-of-scope Docker `-d "$DB_NAME"`.
    suggestion: |
      Accept as documented (exotic spellings), or percent-decode DB_NAME (e.g.
      `printf '%b' "${DB_NAME//%/\\x}"`) when printing.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-008
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_start_admin_local.py
    line: 118
    title: "'Last ?dbname= wins' is claimed but untested (MC survives); the psql model's query parser diverges from libpq in untested corners"
    description: |
      The script comment (:39) and Fix-1 note claim last-wins like libpq (true: parse_dsn on
      `?dbname=a&dbname=b` gives 'b', and the script gives 'b'), but mutant MC (first wins)
      survives — no test repeats the key. Exotic: the panel's SQLAlchemy turns a repeated
      key into a tuple and fails. Model divergences from libpq, none exercised today:
      KEYWORDS (:118) is a 10-key subset, so valid libpq keys (target_session_attrs,
      sslrootcert, client_encoding, keepalives...) would be rejected by the model as unknown;
      parse_qsl decodes '+' to a space where libpq keeps '+'; an `options=` value containing
      '=' is accepted by the model and rejected by libpq ("extra key/value separator").
    suggestion: |
      Optional: add `?dbname=a&dbname=nonogram_dev` to the CarriesTheUrlsQuery class; widen
      KEYWORDS to libpq's list (or note the subset in the model's comment).
    confidence: high
    source: static
