    declared: "6 of 6 killed"
    observed: "9 of 9 killed (the implementer's 6, plus the 3 AC-4 mutants from cycle 1 re-run because the delta rewrote their covering test file)"
    detail:
      - "M1 floor_percent drops the epsilon: KILLED (3 failed)"
      - "M2 skip line -> {fit.kept:.0%}: KILLED (1 failed)"
      - "M3 moved line -> {fit.chosen_kept:.0%}: KILLED (1 failed)"
      - "M4 preview kept -> (fit.kept*100)|round|int: KILLED (1 failed)"
      - "M5 preview chosen_kept -> (fit.chosen_kept*100)|round|int: KILLED (2 failed)"
      - "M6 route updates only the first image (get_all_images()[:1]): KILLED (7 failed)"
      - "M7 SIZE_PRESETS large 30 -> 25: KILLED (26 failed)"
      - "M8 SIZE_PRESETS small short -> fixed: KILLED (12 failed)"
      - "M9 route ignores default_size: KILLED (18 failed)"
    hygiene: "run in a scratch git-archive copy of e28799f; the worktree was never edited. Every mutant restored and the restore asserted byte-for-byte before the next one."
  epsilon_judgement: |
    Correct, not merely convenient, with a ~5,800x safety margin in the
    direction that matters.

    The epsilon is added AFTER the x100, so its tolerance is 1e-9 of a PERCENT
    (1e-11 of a share) — two orders tighter than the task framing assumed.

    Soundness bound (exact, not sampled): _kept_share returns min(a,b)/max(a,b)
    for integers a = sw*eh, b = ew*sh, i.e. a rational p/q with
    q <= 30 * max(source dimension) since extents are capped at MAX_SIZE = 30.
    A share genuinely below a whole percent k satisfies
    k - 100p/q = (kq - 100p)/q >= 1/q, because the numerator is a positive
    integer. For that true shortfall to fall under the 1e-9 epsilon you need
    q > 1e9, i.e. a source dimension above 33,333,333 px — unreachable for an
    uploaded picture. The float error the epsilon absorbs is ~1e-14 at this
    magnitude, so the epsilon sits in a band five orders above the error it
    fixes and nine orders below the smallest real shortfall it could hide.

    Empirically: over 400,000 random reachable (sw, sh, ew, eh) combinations
    with source dimensions up to 20,000 px, floor_percent agrees with an exact
    Fraction floor in every case (0 mismatches); 174,636 constructed
    exactly-k/100 shares all print k; constructed just-below-k% shares are never
    rounded up; and the smallest POSITIVE gap to a whole percent observed is
    5.82e-06 percent, 5,820x the epsilon.

    90% boundary: floor_percent(0.9) == "90%", 0.899999 -> "89%",
    0.8999999999 -> "89%", and 0 of the 400,000 reachable shares below 0.9 print
    "90%". The card's purpose survives.
  new_e2e_tests: |
    Both pin what they claim, on genuinely disagreeing shares.
    100x350 at Medium: cannot_fit, Large's grid is 10x30, kept = 3000/3500 =
    6/7 = 85.714% exactly — floor 85, round 86. 300x700 at Medium:
    moved_to_large, the chosen 10x20 keeps 6000/7000 = 6/7 = 85.714% — floor 85,
    round 86. Neither is a number that merely happens to work: 6/7 is a third of
    a percent clear of both neighbouring integers. That the assertions would
    fail under round-to-nearest is not argued but demonstrated — M2/M3/M4/M5
    each revert one site and each is killed.

