  - id: F-006
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_phone.py
    line: 787
    title: "The mirrored crossing is held only by a declaration equality — no pixel or hit-test reading covers it, unlike the desktop corner"
    description: |
      MEASURED by mutant R4: deleting the `mirrored` term from the mirrored
      right corner's row marker (solver.js:612, `{ col: !duplicate, row:
      mirrored }` -> `{ col: !duplicate, row: false }`) reds exactly ONE cell
      — `TestSolverPhone_MirroredGutterSticks::test_the_mirrored_corner_sticks_to_the_right_too`
      (phone.py:787-806), an equality over `[className, position, top, left,
      right]`. 1 failed, 157 passed, 0 collection errors.

      The claim that marker carries is a painting claim — the docstring at
      clues.py:2499-2503 states it for the desktop corner: "otherwise the
      crossing is a hole through which the cells show". For the DESKTOP corner
      that claim has behavioural controls, and they fire: mutant R3 (deleting
      admin.css:625, the corner's z-index 3) reds `hit` as
      `'another gutter box'` instead of `'own box'` (clues.py:2499) AND reds
      the pixel sample as `(28, 35, 51)` = `--grid-ink`, i.e. the filled cells
      showing through (clues.py:2602). For the MIRRORED corner neither exists:
      `_in_view` computes a `corner` key (clues.py:2346) but the phone class
      never asserts it (phone.py:770-786 reads only `row` and `col`), and both
