findings:
  - id: F-001
    severity: critical
    category: ops
    type: bug
    file: src/nonogram/admin/static/solver.js
    line: 942
    title: "A small board's is-keeping-* classes go stale on any viewport change, and the stale stick makes half the visible cells untappable"
    description: |
      `keepCluesInView()` (solver.js:842) is reached from exactly two places:
      `redraw()` (:862) and `zoomed()` (:910). A viewport change reaches
      `redraw()` only through `:920` (`if (isBig) redraw();`) and `:942`
      (`if (!isBig) return;`). Before this card every viewport-dependent
      decision — CARD-193's mirror and CARD-212's ladder — applied only to a
      board big on one side, so that gate was correct. This card makes the
      rendering of EVERY board viewport-dependent, and the gate is now wrong:
      a board with both sides <= BIG_SIDE never re-measures.

      MEASURED, in this worktree at 023157e3 (reproduction script:
      /private/tmp/claude-501/-Users-omelnikova-PycharmProjects-PythonProject4/f7b1d54a-8309-4e9b-8cf1-e8633015b556/scratchpad/card271_review_probe.py):

        15x15, loaded at 1920x1500, zoomed to 200%
          -> keeping [True, True], overflow [0, 0]                 (correct)
        resize to 1024x768, waited 600 ms (4x RESIZE_SETTLE=150)
          -> keeping STILL [True, True]
             band [376.3, 270.4]  port [724, 540]  overflow [424, 518]
             cover/port = 0.520 and 0.501, both past STICK_MAX_SHARE 0.4
          -> the decision keepCluesInView's own terms give here: [False, False]

      Consequence, measured on that stale page: of the 70 cells whose centre
      lies inside `.player-stage`'s visible box, **35 are not reachable by a
      tap** — `document.elementFromPoint` at the cell's centre returns
      `TH.player-clue is-row is-stuck-row`, not the cell.

      Two controls make that refutable:
        * the same board at the same viewport reached by LOADING there:
          keeping [False, False], 0 of 140 cells blocked;
        * the same stale page after one zoom-out/zoom-in round trip (the only
          path that re-measures): keeping [False, False], 0 of 84 blocked.

      This is precisely the regression class the round measured and refused.
      solver.js:437-447 names it: "a 15 x 15 at 1024 x 768 and 200% zoom,
      where a 359.4 px row band over a 724 px stage swallowed the cells a
      recorded touch drag was aimed at" — share 0.496. The room condition
      refuses that configuration at load and at zoom; the resize path
      reinstates it.

      The reverse direction is stale too (measured): at 1024x768/200% the
      classes are correctly [False, False]; grown to 1600x1200, where the
      fresh decision is [True, True], they stay [False, False] — so the clues
      scroll away where the card's own rule says there is room.

      AC-5 ("Given a 15x15 board that fits its stage, then nothing observable
      changes") is the clause this breaks, for a state the AC's own test never
      enters.

      NO CONTROL CAN FAIL FOR THIS, and that is the second half of the
      finding. The mechanism whose absence this is — a re-measurement after a
      viewport change on a non-big board — does not exist, so there is no line
      to delete; the certifying evidence is the behaviour probe above with its
      two control runs. tests/test_puzzle_solver_clues.py:2530
      (TestSolverClues_SmallBoardsUnaffectedByStickiness::test_a_15x15_moves_nothing)
      is parametrized over three viewports but runs at 100% zoom and never
      resizes, and `grep -rn is-keeping tests/` shows only four sites in the
      whole suite (clues.py:2818-2819, :2906, :2941; fifth_rule.py:261) — none
      of them after a viewport change.

      Reachability caveat, stated so the severity is auditable: it needs a
      zoom and then a window resize / rotation / phone URL-bar collapse (the
      card's own comment at solver.js:931 names that last one as a real
      event), and it self-heals on the player's next zoom step. A reviewer
      could defensibly call this Important rather than Critical; it gates
      either way.
    suggestion: |
      Drop the `isBig` gate from the re-measurement, not from the redraw:
      in the resize handler (:941-945) call `keepCluesInView()` for every
      board on the debounced settle, and `redraw()` only when `isBig`; do the
      same in the `mirrorQuery` change handler (:919-921). `keepCluesInView`
      reads four numbers and toggles two classes, so running it for a small
      board costs nothing a resize does not already cost.

      The control AC-5 is missing: parametrize
      TestSolverClues_SmallBoardsUnaffectedByStickiness with a case that
      zooms, then resizes, then asserts `_room(page)["keeping"]` equals the
      decision re-derived from that viewport's own cover/port (the shape
      clues.py:2884-2890 already uses), and assert no visible cell's centre
      hit-tests to a gutter box (the `_IN_VIEW` `hit` classification already
      exists and would read `another gutter box` today).
    confidence: high
    source: static
    violates: AC-5
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_fifth_rule.py
    line: 252
    title: "The claim that licenses _board()'s two-class-state capture cites a control that cannot fail for the term the claim is about"
    description: |
      `_board()` (fifth_rule.py:268-275) takes the element screenshot with the
      `is-keeping-*` classes OFF and then, after the `finally` has put them
      back, evaluates `_GEOMETRY` — capture and geometry are read in two
      different class states. The docstring licenses that at :252-254:
      "Sticking is layout-neutral — ``_GEOMETRY`` below is the same either
      way, which is asserted in its own right by
      tests/test_puzzle_solver_clues.py
      ``TestSolverClues_TheRoomForAStuckBandIsMeasuredNotPredicted``".

      That class's `test_sticking_changes_neither_the_band_nor_the_overflow`
      (clues.py:2893-2919) asserts exactly three terms —
      `(loose["band"], loose["overflow"], loose["port"]) ==
      (stuck["band"], stuck["overflow"], stuck["port"])` at :2918-2919.
      `_GEOMETRY` (fifth_rule.py:148-162) reads NONE of them: it reads the
      table's own `width`/`height` and every `td.player-cell`'s offset from
      the table's rect. So the cited control cannot fail for the claim it is
      cited for — ADR-0039/R1's exact shape ("a claim whose control cannot
      fail is narrative, not coverage").

      MEASURED (probe C, the fifth-rule file's own board and viewport: 20x20
      at 390x844, stage scrolled to mid-axis): the two readings really ARE
      identical — table 471.453125 x 380.03125 in both states, 0 of 400 cells
      differ, and the restore is identical. So the helper is SOUND and the
      claim is TRUE; what is missing is the control, which is why this is
      Important and not Critical.

      Nothing in the suite would red if sticking ever did move a cell relative
      to the table: `grep -rn is-keeping tests/` finds four sites, and
      clues.py:2906 is the only one that toggles the classes off, comparing
      the three terms above.

      Certification: no mutant can kill this by deletion, because the control
      being asserted does not exist — that is the finding. The nearest
      available deletion confirms the shape: mutant R6 (removing `left: auto`
      from admin.css:624) was killed by exactly ONE cell, the declaration
      equality at phone.py:797-800, while every behavioural reading
      (`dRight == 0`, `hit`, the pixel samples) stayed green.

      Second, smaller instance of the same overclaim in the same helper: the
      docstring says "the classes go straight back so no later assertion in
      the same test sees a page this file invented", but `_UNSTICK`
      (:256-266) also writes `table.dataset.keptClasses` and never removes it,
      so the table keeps a `data-kept-classes` attribute for the rest of the
      page's life. Harmless today (nothing in that file reads the table's
      dataset), but it is part of the claim that is not true.
    suggestion: |
      One line in `_board()`: read `_GEOMETRY` inside the unstuck window too
      and assert the two readings are equal, so the file's own claim carries
      its own control —

          page.evaluate(_UNSTICK, False)
          try:
              png = page.locator(".player-board").screenshot(scale="css")
              loose = page.evaluate(_GEOMETRY)
          finally:
              page.evaluate(_UNSTICK, True)
          geometry = page.evaluate(_GEOMETRY)
          assert loose == geometry, "sticking moved the table's own geometry"
          return _image(png), geometry

      Alternatively extend clues.py:2918 to compare the cells' offsets from
      the table rect as well, and keep the citation. And have `_UNSTICK`
      delete `dataset.keptClasses` when it restores.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: risk
    file: src/nonogram/admin/static/solver.js
    line: 845
    title: "The band measurement's missing-box fallback fails OPEN toward sticking — the one direction the room condition exists to prevent"
    description: |
      `band()` answers `box === null ? 0 : …` (solver.js:845). A 0 band makes
      `affords` read `Math.min(overflow, 0) <= port * 0.4` — always true — so
      an axis whose labelled gutter cannot be found KEEPS, i.e. sticks. That
      is the board-eating direction: the whole point of STICK_MAX_SHARE
      (:426-456) is that a band floating over the cells costs the player the
      board, and the fallback chooses that outcome for the case it cannot
      measure.

      MEASURED: mutant R2 deleted the guard outright
      (`return box.getBoundingClientRect()[side];`) and all 158 tests of the
      5-file selection stayed green, 0 collection errors. So the branch is
      not under-tested, it is DEAD: every board `drawBoard` produces has
      rowGutters >= 1 and colGutters >= 1 with `duplicate === false` on the
      first of each, so `clueBox` (:516) always marks one `is-stuck-row` and
      one `is-stuck-col` th. There is no reachable consequence today, which
      is why this is medium and not high.

      Worth fixing anyway because it is one character of asymmetry: a future
      layout that draws an axis with no labelled gutter would silently stick
      it, and the failure would look like the five player-action regressions
      this card already paid for once.
    suggestion: |
      Fail closed: `return box === null ? Infinity : …` (or return the port so
      the axis simply does not keep). Note that the test-side reimplementation
      of the same expression (clues.py:2810-2812) deliberately mirrors
      solver.js, so it changes with it.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_zoom.py
    line: 1084
    title: "CON-021's panning control aborts on a stickiness precondition before it ever evaluates the recording assertion"
    description: |
      `test_zooming_and_panning_record_and_save_nothing` (zoom.py:1066) is
      G-4 / CON-021's control for panning. Inside the pan loop it asserts
      `_room(page)["keeping"] == [True, True]` (:1084) — a stickiness
      precondition — and the one assertion that IS the control,
      `_board_snapshot(page, puzzle) == before`, comes after the loop
      (:1087). So a stickiness regression reds this test with the recording
      property never evaluated.

      Two costs, both small but real: the failure is misattributed (it reads
      as a CON-021 breach when nothing was recorded wrongly), and on exactly
      the cycles where stickiness is broken, CON-021-under-panning is
      unverified while the report says a CON-021 test red.

      MEASURED: the pre-gate's P7' mutant (the room condition made total — no
      axis keeps) reds this test, per the card's own record at
      meta/kanban/cards/CARD-271.md "Handed to review cycle 1" item 3. My own
      R1 (deleting the per-axis row-band selector) reds 8 cells and NOT this
      one, because at 900x700/125% the mutated measurement still answers
      [True, True] — which shows the precondition is load-bearing for the
      test's outcome rather than incidental.

      MITIGATION, stated because it bounds the severity: CON-021's recording
      property is not solely held here. `TestSolverZoom_IsNotSavedAndSendsNothing`
      (zoom.py:481, pre-card) is an independent recording control for the
      zoom, and it has no stickiness precondition. That is why this is medium
      and why CON-021 is reported as ✓ holds in the system-contract block.
    suggestion: |
      Hoist the keeping check to a single precondition before the pan loop
      (one `assert _room(page)["keeping"] == [True, True]` after `_zoom_to`),
      so the loop contains only panning and the snapshot comparison is the
      only thing that can red inside the control's own subject.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_admin_design_tokens.py
    line: 419
    title: "\"CARD-271 adds a fifth selector to the list\" — the list it is added to now has six entries (a PG-1 sibling)"
    description: |
      The docstring this card adds says "CARD-271 adds a fifth selector to the
      list" (:419). The asserted list at :435-442 has SIX entries after the
      addition (the five CARD-212/CARD-193 right-hand-gutter rules plus
      `.player-board.is-keeping-rows .is-stuck-row.is-right`). Nothing
      re-derives the figure, so it is the same class the pre-gate filed as
      PG-1 (two comments quantifying a two-fifths bar as "half") — one more
      instance, this one in a file where the count IS mechanically present
      one line below the prose that gets it wrong.

      ANSWER TO HANDED ITEM 2, measured rather than read: the widening is
      safe and is in fact a strengthening.
        * `auto` can only be a value of an inset/box keyword in CSS; it is
          neither a colour nor a length, so no colour and no rule width can
          enter the five... six rules through it. The predicate those rules
          are judged by is `allowed` ∪ `var(--token)[ solid var(--token)]`
          (:447-457), and `background: auto` / `border-width: auto` are not
          valid declarations at all.
        * Because the selector list is an EQUALITY, the new rule had to join
          it — so admin.css:624 is now UNDER the guard, and a colour or a bare
          length written into it reds this test. Coverage went up, not down.
      Certified with two mutants rather than by reading: R8 (`background: red`
      written into the new rule) reds BOTH guards — the per-rule property
      sweep at clues.py:2953 and the token predicate in
      test_admin_design_tokens.py — and R9 (`right: 2px`) reds
      test_admin_design_tokens.py:453 with "'2px' is not a design token". So
      the widening lets neither a colour nor a bare length through, and the
      new rule really is inside the guarded set.
    suggestion: "Say \"a sixth selector\", or drop the ordinal and name the rule."
    confidence: low
    source: static
