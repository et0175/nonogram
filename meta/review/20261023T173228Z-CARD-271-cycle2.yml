findings:
  - id: F-101
    severity: medium
    category: tech-debt
    type: risk
    file: tests/test_puzzle_solver_clues.py
    line: 2968
    title: "_ROOM rounds `cover` to one decimal while solver.js's `affords` compares the raw float, so the derived cross-check can disagree with the source it re-implements"
    description: |
      `_verdict` (clues.py:2977-2982) is this card's central certification
      idiom: it re-derives keepCluesInView's decision from the page's own
      measurements and solver.js's constant, so that `keeping == _verdict(...)`
      is a cross-check rather than a tautology. Nine of the suite's assertions
      on this card rest on it, including both new F-001 controls
      (clues.py:2656, :2696), both new editor controls (editor_ui.py:4003,
      :4056) and the five-viewport room table (clues.py:3103).

      The two sides are not the same expression. solver.js:860-861:

          Math.min(overflow, bandSize) <= port * STICK_MAX_SHARE

      with `bandSize` the raw `getBoundingClientRect()[side]`. `_ROOM`
      (clues.py:2968-2969) answers

          cover = +Math.min(overflow, band).toFixed(1)

      and `_verdict` then compares that ROUNDED value against
      `port * STICK_MAX_SHARE`. `port` and `overflow` are integers on both
      sides (clientWidth / scrollWidth - clientWidth), so the rounding of the
      band's fractional part is the only divergence — and it is a divergence
      of the comparison, not just of the report: for a port of 980 the bar is
      392.0, and a true cover of 392.04 rounds to 392.0, so `_verdict` answers
      KEEP where solver.js answers NOT-KEEP. The window is +/-0.05 px wide and
      it is one-sided in the direction that makes the test agree with a page
      that is sticking when the rule says it should not.

      Not reachable in any configuration this card measures — the shares are
      0.364 and 0.496 either side of a 0.400 bar, and cycle 1 separately
      established that `affords`' `<=` edge is unreachable by construction —
      which is why this is medium and not high, and why no mutant can
      demonstrate it by deletion (there is no line whose removal produces a
      knife-edge board). What makes it worth the half point rather than a nit
      is WHERE it sits: the fix round edited this very expression in the name
      of "it moves with it or it stops being a cross-check" (the F-003
      comment at clues.py:2951-2955), tracked the value and left the
      precision, and ADR-0039/R2 is the rule about a guard's set being
      derived from its authority rather than resembling it.
    suggestion: |
      Keep `cover` rounded for the failure REPORT and compare the raw value in
      the decision. One line: have `_ROOM` return both, e.g.
      `coverRaw: [Math.min(overflow[0], band[0]), …]` beside the rounded
      `cover`, and have `_verdict` read `coverRaw`. Nothing else in the suite
      reads `cover` for anything but a message. Alternatively assert the two
      sides cannot straddle the bar — `abs(cover - port*SHARE) > 0.05` — so a
      knife-edge board reds as "this board is on the bar" instead of silently
      agreeing.
    confidence: medium
    source: static
    violates: ADR-0039/R2
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_puzzle_solver_fifth_rule.py
    line: 324
    title: "_quiet's fixed 4 x RESIZE_SETTLE doubles the wall-clock of tests/test_puzzle_solver_fifth_rule.py (13.4 s -> 27.4 s, measured), and the file runs on every impact-scoped cycle"
    description: |
      MEASURED, both ways, in this worktree: the file with `_quiet` intact is
      `17 passed in 27.35 s`; with only `page.wait_for_timeout(4 *
      _RESIZE_SETTLE)` replaced by `pass` (one line, line count preserved) it
      is `17 passed in 13.84 / 13.40 / 12.96 s` over three runs. So the settle
      costs ~14 s on one file, about +4 % of the 17-file cycle gate (which
      moved 354.4 s at 023157e3 to 367.77 s here). ~23 `_board` invocations
      across the file's 17 tests at 600 ms each accounts for it.

      Stated as low, with the counter-argument made rather than omitted,
      because the obvious cheaper shapes are both wrong here: the first
      `_board` of a test is NOT exempt (`page.set_viewport_size` itself fires
      `resize`, so a redraw is pending before the first capture too — I
      checked before claiming it), and the fixed wait is this suite's standing
      idiom (`_settled`, clues.py:2995, and zoom.py's resize tests), derived
      from the declared constant rather than guessed, which is what keeps G-7
      satisfied. It is also NOT the flake source engineering-standards §6
      warns about: deleting it makes the file flakier, not less (see the
      mutation table, X-B).

      The one shape that would be both deterministic and cheaper is polling
      the draw count until it has been stable for one RESIZE_SETTLE instead of
      waiting four — typically ~150-300 ms instead of 600 ms. Worth the owner
      knowing the number; not worth gating on.
    suggestion: |
      Optional: make `_quiet` poll — read `_DRAWS`, wait RESIZE_SETTLE, read
      again, and return as soon as two consecutive reads agree (cap at the
      current 4 x RESIZE_SETTLE so the worst case is unchanged). The
      correctness guard does not move: the draw-count comparison in `_board`
      (:355) is what makes the window sound, and it is independently
      controlled.
    confidence: high
