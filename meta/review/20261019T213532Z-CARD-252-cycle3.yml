  score: 8.0
  min_score: 8
  severity_gate: "FAILED — one open Important (C3-F-001). One is enough regardless of score. There is no cycle 4, so see `recommendation`."
  score_arithmetic: "10 − 1 (one Important) − 0.5 (one Minor) − 0.5 (recurrence: a gating finding in the same file / function / rule family for the THIRD consecutive cycle, which the rubric's meaning column treats as worse than an isolated finding; same deduction cycle 2 applied) = 8.0"
  family_regression_check: |
    BOTH of this cycle's findings are third-generation members of families that gated or were
    filed in cycles 1 and 2:
      C3-F-001 -> C2-F-001 -> F-002. tests/test_db_engine_lifecycle.py,
                  _private_global_sites_in and the AC-5 class docstring, ADR-0039/R1 + R2,
                  "a claim about reach refuted by measurement". GATING in all three cycles.
      C3-F-002 -> C2-F-002 -> F-003. The AC-4 db_required count's own description of its
                  divergences. Minor in all three cycles.
    What changed, and it matters for what to do:
      (a) Cycles 1 and 2 were the SAME defect in a wider shape — a finite spelling list with a
          fourth spelling. This cycle is NOT that: the spelling axis is genuinely closed, every
          shape either cycle reported is red, and the mechanism is a deny default rather than a
          list. The recurrence is on a different axis (argument binding and assignment-target
          syntax), reached only because the claim was written as a universal.
      (b) The traffic through the remaining hole is ZERO, measured. Cycle 2's three survivors were
          live idioms at 17 real sites; this cycle's two have no occurrences in the tree at all.
      (c) The product delta has been zero in cycles 2 and 3 and was never in question in cycle 1.
          Three review cycles have been spent on a test-tree guard, and none on the fix.
    So the loop is not regenerating the same defect — it is regenerating the same *claim habit*:
    each fix widens the mechanism and then describes it with a universal quantifier. The exit is
    not a fourth mechanism. It is to stop writing universals in this file and to pin the frontier
    with an assertion that can fail. That is what the recommendation asks for, and it is ~12 lines.
  recommendation: |
    MERGE WITH THE CLAIM CUT BACK.

    The Important survives and the mechanism is sound, which is exactly the case the brief's second
    option describes. Everything the card claims about the mechanism is true and I re-derived it:
    all three cycle-2 shapes are red (X1/X2 re-run by me as real-file mutants), the branch controls
    are real (B4 and B5 both killed by exactly the named controls plus the tree-wide guard), the
    declared residual is exactly the two sites it names and its edge reds, and all five triage
    numbers (0 / 9 sites in 6 pairs / 13 / 315 / 2) re-derive exactly from an independent walk of
    the tree. All six guardrails hold, G-1 by AST comparison rather than assurance. The product
    change is untouched and pinned.

    What is false is three sentences, and ADR-0039/R1's own remedy for a claim wider than its
    control is "narrowed to what is measured or deleted". Delete or narrow exactly these, all in
    tests/test_db_engine_lifecycle.py:

      1. :840-845 — "That second sentence is the whole claim, and it is deliberately one with no
         outside: there is no residual 'plus some other spellings it happens to see', because
         :func:`_private_global_sites_in`'s default is deny on every axis it can observe."
         DELETE. Replace with the binding frontier: the analysis is over positional argument
         binding and simple assignment targets; a keyword-bound `setattr` and an attribute target
         nested in a tuple/list/annotated/for/with target are outside it, measured at zero sites.
      2. :847 — "A claim about a finite shape list always has a fourth shape; this is the exit from
         that." NARROW to the first clause; delete "this is the exit from that".
      3. :374-375 — "The deny default is **total**, and that is the whole design." NARROW to
         "total over the shapes it binds", naming the two dispatch conditions.
      4. :133-134 — "The one direction that could fail **open** is a class renamed off pytest's
         ``Test*`` prefix". NARROW to two directions, naming the `__init__` shape (C3-F-002).

    And add the one thing that stops a fourth generation (~8 lines): a tree-wide assertion that no
    `setattr`-shaped call in tests/ has fewer than two positional arguments and no
    Tuple/List/AnnAssign attribute target names an engine global. Both are 0 today. That converts
    the new bound from a sentence into a control that can fail, which is what R1 and R3 ask for,
    and it is the only change here that makes the next cycle unnecessary rather than cheaper.

    If the board prefers not to touch the branch at all: merging as-is is defensible on risk
    (product delta zero, hole traffic zero), but it merges a false universal into a file whose
    whole subject is not writing false universals, and the retrospective should then pick the
    family up as a standing rule rather than a fourth card.
  is_this_guard_worth_keeping: |
    Asked directly, so answered directly: NO, not at this size. I would keep about a fifth of it.

    The economics. The card's product change is ~40 lines of `reset_engine()` plus one call site,
    and it is pinned by AC-1/AC-2 — deleting the call reds a real test. That is the card, and it
    was right in cycle 1. AC-5's private-globals guard is hygiene layered on top: it now costs
    nine module-level helpers, ~180 lines of AST machinery, ~220 lines of docstring that make
    claims about that machinery, and eleven control tests. In three review cycles it has caught
    exactly zero real violations — the nine sites it reports are the nine it was written around,
    and a full-tree triage this cycle found nothing new anywhere (0 unanalysable, 2 declared
    residual, 328 correctly out of scope). Every gating finding on this card has been about the
    guard's description of itself. The guard has consumed the entire review budget of a card whose
    product risk it does not touch.

    WHAT I WOULD KEEP (it is the part with the authority):
      1. `_global_names_assigned_by` + `test_it_resets_exactly_the_globals_the_builder_creates`.
         ~20 lines, and the one genuinely DERIVED authority in the file — it reads session.py's
         own AST, so a fourth global added to `_init_engine` tomorrow is inside the check that
         day. This is ADR-0039/R2's good case, and cycle-1 mutant R4 killed it. It protects the
         product change.
      2. `test_conftest_names_the_seam_at_its_call_site` (the AST call-site check) and
         `test_reset_engine_is_public_and_says_who_calls_it`. ~25 lines, and M1/M1b kill them.
      3. The exemption EQUALITY — but over a cheap scan, not an AST deny-default: count the three
         literal global names appearing as a hand-set attribute per file and hold that to
         `_EXEMPT_PRIVATE_GLOBAL_SITES`. A dozen lines. It reds on a new file, a new name or a
         tenth site, which is 95% of the value, and it makes no universal claim about reach — so
         it has nothing for a reviewer to probe.
    WHAT I WOULD RETIRE: `_is_setattr_call`, `_string_target_tail`, `_string_target_module`, the
    arity dispatch, and the five shape controls (X1/X2/X3, other-target, declared-bound) — roughly
    400 lines of code and docstring — replaced by a declared convention in session.py's docstring
    and one line in the engineering standards: "tests do not hand-set session.py's engine globals;
    test_db_url_driver.py and test_db_connect_timeout.py are the recorded exceptions; a new one is
    a card, not a commit." A convention a reviewer enforces, backed by a textual count that reds
    on a new file or name, is honest about being a convention. An AST deny-default is a proof
    claim, and a proof claim in a dynamic language will always have one more axis — this card has
    now paid three cycles to learn that at the rate of one axis per cycle.

    That retirement is a separate card, not this one's residue. Its one sentence would be:
    "Shrink CARD-252's AC-5 private-globals guard to the derived-globals check, the AST call-site
    check and a textual site-count equality, and replace its reach claim with a declared
    convention — the AST deny-default's claim surface has cost three review cycles and caught no
    real violation." Do that AFTER this card merges, so the merge is not held hostage to it.
