findings:
  - id: C3-F-001
    severity: important
    category: testing
    type: guard_narrower_than_its_claim
    file: tests/test_db_engine_lifecycle.py
    line: 438
    title: "There is a fourth axis: the deny default is total within the arity branches, not over them — a keyword-bound setattr and a tuple-target dotted assignment both reach session.py's engine globals and pass silently, and both are spellings the claim names as recognised"
    description: |
      Cycle 2's C2-F-001 is genuinely and structurally closed. I re-derived X1 and X2 as real-file
      mutants rather than taking them from the report, and both are now RED. B4 and B5 are both
      KILLED by exactly the controls the card names. All five of the reported triage numbers
      re-derive exactly. The residual is measured at the two sites it says, and its edge really
      reds. The mechanism is sound where it looks.

      It does not look everywhere, and the sentence that says it does is false.

      WHAT THE FILE CLAIMS (:836-847):
        "It recognises three spellings — a dotted assignment, ``setattr(obj, "name", …)`` in
        **both** the ``monkeypatch.setattr`` and the bare-builtin form, and
        ``setattr("dotted.path.name", …)`` ... **and it fails on anything ``setattr``-shaped
        whose target or whose attribute name it cannot read.** That second sentence is the whole
        claim, and it is deliberately one with no outside: there is no residual "plus some other
        spellings it happens to see", because :func:`_private_global_sites_in`'s default is deny
        on every axis it can observe."
      And at :374-375: "The deny default is **total**, and that is the whole design."

      WHERE THE DEFAULT STOPS. _private_global_sites_in dispatches on three conditions and nothing
      catches what falls between them:
        :431-437  `isinstance(node, ast.Assign)` and `isinstance(target, ast.Attribute)`
        :438      `_is_setattr_call(node) and len(node.args) >= 3`
        :465      `_is_setattr_call(node) and len(node.args) == 2`
      A setattr-shaped call with 0 or 1 positional arguments matches neither arity branch. An
      attribute target nested inside a Tuple/List target, or carried by an AnnAssign / for / with,
      is not an `ast.Attribute` in `node.targets` and matches no branch. In both cases nothing is
      recorded and nothing is appended to `unanalysable` — the silent pass ADR-0039/R2 names.

      MEASURED, TWO WAYS. Read-only probes (calling _private_global_sites_in on source text, so a
      silent pass is visible as ({}, []) rather than inferred from a green run) — 28 probes; the
      silent passes that reach a session global:
        A1  monkeypatch.setattr(app_session, name="engine", value=None)            SILENT PASS
        A2  monkeypatch.setattr(target=app_session, name="engine", value=None)     SILENT PASS
        A3  monkeypatch.setattr("nonogram.db.session.engine", value=None)          SILENT PASS
        A4  setattr(*TRIPLE)                                                       SILENT PASS
        B1  app_session.engine, app_session.SessionLocal = None, None              SILENT PASS
        B2  [app_session.engine] = [None]                                          SILENT PASS
        B4  app_session.engine: object = None                                      SILENT PASS
        B5  for app_session.engine in [None]: pass                                 SILENT PASS
        B6  with open("x") as app_session.engine: pass                             SILENT PASS
      Then as a real-file mutant: A1 and B1 appended to tests/test_db_isolation.py (a real,
      non-exempt file), applied together, restored from a `cp -p` backup verified byte-identical
      with `diff -q` and `shasum -a 256`. Result: TestEngineLifecycle_TheResetIsAPublishedSeam
      **14 passed** — the guard did not notice either one. And the two probe tests themselves
      **pass as tests**, i.e. they are executing reaches, not syntax: I confirmed the effect
      directly — `MonkeyPatch().setattr(app_session, name="engine", value=None)` leaves
      `app_session.engine is None` and `mp.undo()` restores it, and the tuple-target assignment
      sets both `engine` and `SessionLocal`.

      WHY THESE ARE NOT THE DECLARED BOUND. The bound (:867-877) is one bound said twice: the
      guard follows "names, not values" — a fixture-bound name, importlib into a local, a
      globals()/vars() write — plus the single corner where the target is a computed value AND the
      attribute name is non-literal. In A1 the target is the alias `app_session` (in
      _SESSION_ALIASES) and the name is the string literal `"engine"`; in B1 both are a plain
      dotted attribute chain. An AST walk can follow both completely. The guard has everything it
      needs and never asks. A1 is the `setattr(obj, "name", …)` spelling the claim names, under
      keyword binding; B1 is the "dotted assignment" the claim names, under tuple unpacking. This
      is a hidden limit, not a stated one — the same distinction cycle 2 drew and the same side of
      it.

      WHAT IS CORRECTLY HANDLED (so the finding is about the gap, not about the design). These all
      behave: `setattr(app_session, *REST)` -> FAILURE; 4 positional args -> SITE;
      `raising=False` as a 4th keyword -> SITE; `builtins.setattr(app_session, "engine", None)` ->
      SITE; `app_session.engine = app_session.SessionLocal = None` (chained) -> 2 SITES;
      `monkeypatch.setattr(app_session, "engine" if x else "SessionLocal", None)` -> FAILURE;
      `setattr(sys.modules["nonogram.db.session"], "engine", None)` -> FAILURE (the declared
      edge); `monkeypatch.delattr` / `monkeypatch.setitem(sys.modules, …)` -> silent, but neither
      *sets* a global so neither is in the claim; `sa = setattr; sa(app_session, "engine", None)`
      -> silent, and that one IS covered by the declared "names, not values" bound, so I do not
      raise it.

      THE ONE THING THAT MAKES THIS CHEAPER THAN CYCLE 2'S. Cycle 2's three surviving shapes were
      live idioms at 17 real sites in this tree. These are not: I counted the whole tree and there
      are **zero** setattr-shaped calls with fewer than two positional arguments and **zero**
      tuple/list/annotated attribute-assignment targets naming an engine global. The traffic
      through the hole is nil today. What is defective is a universally quantified sentence, which
      is precisely what ADR-0039/R1 targets — and R1's own prescribed remedy is "narrowed to what
      is measured or deleted", not a wider mechanism.

      FAMILY REGRESSION, STATED PLAINLY. Third consecutive generation: cycle-1 F-002 -> cycle-2
      C2-F-001 -> this. Same file, same function (_private_global_sites_in) and the same class
      docstring, the same two mandatory rules (ADR-0039/R1 + R2), the same defect class (a claim
      about reach refuted by measurement). Attributable to cycle 2's fix: the arity discrimination
      is new this cycle and is where the gap lives, and the "no outside" / "deny on every axis"
      sentences were both written this cycle. A fourth generation is near-certain if the remedy is
      another widening, which is why the recommendation below is a claim cut-back plus a measured
      frontier rather than a fix.
    suggestion: |
      Do NOT widen the mechanism a third time. Cut the claim to what is measured and then pin the
      new frontier so it cannot drift — about 12 lines in total, and it ends the generation chain
      because the bound stops being a sentence and becomes an assertion.

      (a) :840-847 — delete "That second sentence is the whole claim, and it is deliberately one
          with no outside: there is no residual 'plus some other spellings it happens to see',
          because :func:`_private_global_sites_in`'s default is deny on every axis it can
          observe." and delete ":847 this is the exit from that". Replace with: "The analysis is
          over **positional** argument binding and **simple** assignment targets: a `setattr`
          whose target or name arrives as a keyword, and an attribute target nested in a
          tuple/list unpacking or an annotated/for/with target, are outside it. Measured at zero
          sites in this tree, and asserted as zero below."
      (b) :374-375 — "The deny default is **total**, and that is the whole design." becomes "The
          deny default is total **over the shapes it binds**: every `setattr`-shaped call with two
          or more positional arguments, and every simple attribute assignment target."
      (c) :310 — "_is_setattr_call: Any ``setattr``-shaped call" becomes "Any call *named*
          `setattr`" (it is name-based; `sa = setattr` is correctly inside the "names, not values"
          bound, but the docstring currently over-promises).
      (d) Add the frontier assertion, inside
          test_no_test_file_outside_the_exemption_sets_those_globals or beside it: walk
          tests/**/*.py and assert that no `setattr`-shaped call has fewer than two positional
          arguments, and that no Tuple/List/AnnAssign attribute target names one of `names`. Both
          are 0 today (measured). That is a control that CAN fail — it reds the day somebody
          writes the shape — which is what R1/R3 ask for, and it is strictly cheaper and more
          honest than teaching the AST walk a binding model.
      If instead you widen: resolve keywords by name for the `setattr`/`monkeypatch.setattr`
      signatures and recurse into Tuple/List targets. It is ~15 lines, it needs two more controls,
      and it leaves `*args`, `AnnAssign`, `for` and `with` targets as the fifth axis — which is
      the argument for (a)-(d) rather than for this.
    confidence: high
    source: mutation
    violates: "ADR-0039/R1, ADR-0039/R2"
    root_cause: RC-1
    status: fixed
    fixed_in: f4e5730
    dismissed_reason: null
    learned_pattern: null
    family: "cycle-1 F-002 / cycle-2 C2-F-001 (AC-5 private-globals guard, ADR-0039/R1+R2, claim wider than mechanism) — THIRD consecutive generation, gating in all three"

  - id: C3-F-002
    severity: minor
    category: testing
    type: claim_wider_than_mechanism
    file: tests/test_db_engine_lifecycle.py
    line: 133
    title: "The AC-4 count's fail-open inventory says there is one such direction; there are two — a Test* class carrying an __init__ is collected by nobody and counted by the walk"
    description: |
      C2-F-002 is closed in the direction it named. Verified: the `Test` prefix filter is in place
      at :159-161, probe C7 (a db_required class renamed off the prefix) now returns
      `every=0, db_required=0, classes=set()` where cycle 2 measured AST 2 / pytest 0; the control
      test_a_class_renamed_off_pytests_prefix_is_not_counted asserts all three return values; the
      caller asserts `test_classes` non-empty at :723-728 so the filter cannot silently empty the
      walk; branch mutant B8's claim is consistent with that control's assertions. The five
      fail-closed divergences still bias to red — I re-measured all five (module `pytestmark`,
      class `pytestmark`, inherited marker, parenthesised marker, nested class: all
      `db_required=0`), plus `from pytest import mark` (1, correct) and the module's real shape
      (2, correct).

      But :133-140 now states the inventory as exhaustive: "The one direction that could fail
      **open** is a class renamed off pytest's ``Test*`` prefix". There is a second one. pytest
      refuses to collect a `Test*` class that has an `__init__` constructor — measured:

        @pytest.mark.db_required
        class TestHasInit:
            def __init__(self): pass
            def test_a(self): pass

        pytest:              "PytestCollectionWarning: cannot collect test class 'TestHasInit'
                              because it has a __init__ constructor" -> 0 collected
        _test_functions_in:  every={'TestHasInit::test_a'}, db_required={'TestHasInit::test_a'}
                             -> count stays at 2

      So the AC-4 count would stay green while the coverage it exists to protect went to zero —
      the same fail-open direction C2-F-002 was raised for, in a second shape, with the file now
      asserting that only one such shape exists.

      Filed Minor, matching the band of the two findings it continues, and for three reasons:
      pytest emits a loud PytestCollectionWarning for this shape so the loss is not silent in the
      run; acquiring an `__init__` on a test class is a strange edit, unlike a rename; and the
      module's two db_required tests remain independently pinned by the AC-1/AC-2 mutants.

      Also noted, not raised: the `Test` prefix is hardcoded rather than read from
      `python_classes`. pyproject.toml does not override it, so the filter matches the effective
      config today; it would diverge if the project ever set it.

      Family attribution: cycle-1 F-003 -> cycle-2 C2-F-002 -> this. Third consecutive cycle in
      the AC-4-count family, Minor every time. Attributable to cycle 2's fix: the exhaustiveness
      sentence was written this cycle.
    suggestion: |
      One docstring sentence, no code. :133-134 becomes "Two directions could fail **open**: a
      class renamed off pytest's ``Test*`` prefix — closed by the filter below — and a ``Test*``
      class that carries an ``__init__``, which pytest refuses to collect (with a
      PytestCollectionWarning) while this walk still counts its methods." Optionally add
      `and not any(isinstance(c, ast.FunctionDef) and c.name == "__init__" for c in node.body)`
      to the filter at :159 and extend the existing control; that closes it rather than declaring
      it, for two lines.
