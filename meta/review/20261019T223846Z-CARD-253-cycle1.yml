    title: "CARD-247's 'the brush's label is in four places, including the reset confirmation' claim is now false and was left standing"
    description: |
      This card deliberately corrected exactly this claim in two other files
      because the rename made it false — puzzle_solve.html's own {# #} header
      ("the menu item on this page, the hint below the board and solver.js's
      BRUSH_LABEL ... are the THREE places", :32-35, plus the new paragraph
      ":37-45" saying "The reset confirmation is NOT one of them any more") and
      solver.js's two comment lines. The third place the same claim lives was
      missed, and the card's notes say the file was opened and run
      ("brush_menu + marking (126 passed)"), so this is missed, not deferred:

        * :53-55  module docstring — 'The fourth brush reads **"Clear"**
          everywhere a human reads it — the menu item, the trigger, the usage
          hint and the reset confirmation'.
        * :227-230 class docstring — 'The label used to appear in four places
          and all four made the same claim: ... and the reset confirmation.'
        * :248 the test's NAME —
          test_the_item_the_trigger_the_hint_and_the_confirmation_all_say_clear.
        * :285 — '... the hint and the hidden reset confirmation' listed among
          what the rename touched and is rendered for the sweep.

      The shipped page disagrees: puzzle_solve.html:192 reads "Reset the
      board?" and :195 "Reset board". The confirmation element the test
      actually reads is #puzzle-player-confirm-text ("Every mark is cleared.",
      :253/:262), which this card did not touch — which is why the test is
      green, and why the staleness is invisible to the suite. Under
      ADR-0039/R1 that half of the claim is now narrative, not coverage: no
      mutant on the brush's label can red it, because the confirmation no
      longer carries the label.

      The suite now states both things about the same page: brush_menu says the
      confirmation says Clear; marking.py's new AC-1/AC-2 say it says Reset and
      not Clear. A future reader resolving that contradiction has no reason to
      prefer the newer one.

      Measured, not inferred: mutant M3 (the fourth brush renamed "Reset" in
      puzzle_solve.html:180) reds
      TestSolverBrushMenu_FourthBrushIsCalledClear::test_the_item_the_trigger_the_hint_and_the_confirmation_all_say_clear
      and ::test_no_user_facing_string_in_the_player_says_undecided — so the
      test is live and guarding, which is precisely why its wording matters.
    suggestion: |
      Narrow the claim to what is measured, in the same comment-only shape the
      card already used twice:
        * :53-55 — "the menu item, the trigger and the usage hint" (drop "and
          the reset confirmation"), with a half-sentence that CARD-253 moved
          the confirmation's wording to Reset and that what this file still
          pins there is the body line "Every mark is cleared.".
        * :227-230 — "used to appear in four places ... the fourth, the reset
          confirmation, no longer carries the label (CARD-253); what the first
          test still asserts about it is its body line."
        * :285 — same half-sentence.
      The NAME at :248 is the harder half and needs a decision recorded on the
      card, not a silent edit: renaming it is a RENAMED_SINCE_BEFORE entry (the
      card's "no rename table is owed" measurement covered the 19 locator
      strings, not the test name this change falsified) and G-4 forbids a
      casual rename. Either rename it with a proper rename-table entry, or keep
      the name and say on the card why a name that over-claims is being kept.
      The three docstrings are the part that must not ship as-is.
