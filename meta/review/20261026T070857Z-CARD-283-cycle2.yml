verdict: >-
  The fix round did the hard part honestly. All three cycle-1 gating findings
  are closed on their own mutations, re-fired here: the tier rule reverted to
  the old alphabet reds the new plant test, a POST planted in the reset
  handler and in the drag branch each reds EC-050's walk, and the last-column
  weakening of isClueSolved reds AC-384's table. The declared residual is
  CORRECT and I measured it end to end rather than accepting it: a bundle
  puzzle carrying base-64 of its own grid in title, in a field NAME, in
  "note", in "picture_name", in "difficulty_tier" and in a nested object
  assembles to a served file BYTE-IDENTICAL to the clean one (sha256
  6c8b81a525c89d6a both times), the served tier is one of four values, and
  2.00 bits is the whole of it. The tier vocabulary really is the enum's (a
  planted Tier.EXPERT reds the completeness test), the two clue-axis length
  checks are reachable one at a time, and swapping the two axes is caught by
  the oblong fixture. check_out_dir holds against "..", a symlink, another
  checkout, $HOME and "/". And the round caught a dead mutant of its own and
  fixed the control rather than the note.
  It is not certified, for one gating reason and three claims that measure
  false. The off-by-one family cycle 1 gated on is still open at one of its
  four ends: `for (let col = 1; col < width; ...)` — the column sweep never
  checking column 0 — leaves ALL 31 TESTS GREEN, so a board whose only wrong
  clue is column 0 would still be announced solved, which is the one case
  AC-384 exists for; and the fix round's own comment claims "an off-by-one at
  either end of either sweep reds" (F-2 / N-1). The pointer-type half of the
  drag rule is still a dead mutant (`const paints = true` — 31 passed), and
  the declaration excusing it is false: a real touch drag IS drivable from
  this suite through a CDP session, which I built and ran in twenty lines —
  Region off marked nothing, Region armed marked the line and disarmed itself
  (N-2). EC-050's completeness check is held to play.html's buttons, so a
  control that is not markup escapes it: a keydown binding planted in play.js
  that POSTs leaves all 31 tests green, against the card's "a new control
  cannot drop a path silently" (N-3). And `_tier`'s claim that a narrowed
  tier is "dropped into the report, which AssembleReport carries" is false —
  the report carries only schema-unknown names (N-4). Every remedy is small:
  one table row, twenty lines of CDP, one report field.

