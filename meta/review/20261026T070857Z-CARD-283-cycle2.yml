findings:
  - id: N-1
    severity: medium
    title: >-
      The off-by-one family is still open at one of its four ends: the column
      sweep never checking column 0 (`let col = 1`) leaves all 31 tests green,
      and the fix round's own comment claims that end is covered.
    file: tests/test_public_player.py
    line: 1377
    gating: true
    confidence: high
    evidence: >-
      MEASURED by mutation, play.js:180 `for (let col = 0; ...)` -> `for (let
      col = 1; ...)`: test_solved_fires_on_clue_satisfaction_only PASSES (1
      passed in 1.21s) and the WHOLE MODULE passes (31 passed in 4.61s), so
      with column 0's clue never checked the page would announce a wrong board
      solved and nothing in the card notices. The symmetric mutant `let row =
      1` DIES (1 failed, 30 passed), for the same structural reason cycle 1
      found: the height-1 cases make row 0 the only row. The gap is specific.
      The table's two new rows put the only error at the LAST index of each
      axis; no case has its only error at index 0 — case "every row right, one
      column wrong" (columns [[2],[0]] over "#xx#") has BOTH columns wrong, so
      skipping column 0 still trips on column 1, and the same for its row
      twin. The comment added with the fix says "These two put the only error
      at the far end of each axis, so an off-by-one at either end of either
      sweep reds"; measured, that is false at one of the four ends. AC-384's
      statement ("given one wrong cell, it does not") names exactly this case.
      play.js restored, sha256
      65b4224901a5e90102160d71ed3b7c55aeda59e219a030932190c9b25daae7e9.
    remedy: >-
      Two more table rows, built the same way as the last-index pair, whose
      only error is at index 0 of each axis — e.g. ("every row right, the
      FIRST column wrong", 2, 2, "#xx#", [[1], [1]], [[2], [1]], False) and
      its row twin ([[2], [1]] rows / [[1], [1]] columns). Then correct the
      comment, or state it as "both ends of both sweeps, one case each" and
      let the four rows carry it. Cheap and local.
    disposition: must fix before merge
  - id: N-2
    severity: medium
    title: >-
      The pointer-type half of the drag rule is still a dead mutant, and the
      declaration that it cannot be tested is false — a real touch drag runs
      from this suite in twenty lines through a CDP session, and I measured
      both directions with it.
    file: player/play.js
    line: 456
    gating: false
    confidence: high
    evidence: >-
      MEASURED twice. (a) The mutant is still dead: `const paints =
      gesturePaints(event.pointerType, region)` -> `const paints = true`
      leaves all 31 tests green, so card item 5's rule ("with Region off a
      touch drag pans the page instead of marking") has no control on this
      page at all; only its CSS shadow (`touch-action`) is read. (b) The
      excuse is false. I appended a probe to tests/test_public_player.py using
      only the fixtures already there plus `page.context.new_cdp_session(page)`
      and `Input.dispatchTouchEvent` (touchStart / touchMove / touchMove /
      touchEnd over three cells of row 5, then row 7), and measured: REGION
      OFF -> states ['unknown','unknown','unknown'], history.done.length 0 (so
      the drag marked nothing, which is gesturePaints' rule); REGION ARMED ->
      states ['filled','filled','filled'], done.length 1, isRegion() False
