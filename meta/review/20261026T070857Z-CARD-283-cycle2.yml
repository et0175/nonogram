corrections_to_the_brief:
  - >-
    "THE DECLARED RESIDUAL IS THE MAIN EVENT ... the honest answer may be 'the
    residual is correctly declared'." It is correctly declared, and I measured
    it rather than agreeing with it. The rebuild is total: a bundle puzzle
    carrying base-64 of its own grid in `title`, in `note`, in
    `picture_name`, in `difficulty_tier`, in a nested object AND in one of its
    field NAMES assembles to served bytes byte-identical to the clean
    payload's. The served file's whole content is (key, width, height, tier,
    clues); width and height are forced equal to the clue axis lengths, and
    that refusal is reachable in both directions and axis-swap-proof on the
    oblong fixture; the tier is four values. So the per-puzzle residual is
    exactly the two bits named. The brief's other candidates come out clean:
    the key is not store-controlled (player_bundle.public_key hashes the grid
    row-major, the store never writes it), the file name IS the key and is
    re-validated as 10 hex and matched to the payload, ordering is canonical
    (json.dumps sort_keys with indent 2, ensure_ascii, allow_nan False,
    explicit newline) and the clue field is integers only, so there is no
    byte-level writer artefact to carry a bit. One scoping note worth stating
    in the card rather than a new finding: the residual is two bits PER
    PUZZLE, so a library of N published puzzles is 2N bits of store-chosen
    signal, which is still the right thing to route to ADR-0041 rather than
    to patch here.
  - >-
    The clue exemption at the one-cell threshold is sound in the only sense
    available, and it is worth saying precisely: given ADR-0041/R5 the clues
    are a deterministic function of the stored grid, so they carry ZERO free
    bits — they carry the puzzle, which is the product. What they do carry is
    every cell by solving, which is why EC-048's literal text cannot be
    satisfied by any implementation of ADR-0041 and why cycle-1 F-12 is the
    real blocker for the word "closed". So the card's claim "EC-048's
    one-cell threshold is carried by the closed rebuild plus the enumerated
    domains" should be read as "carried for everything EXCEPT the two ADR
    exemptions and the two declared bits" — which is what assemble.py's
    docstring actually says, two paragraphs apart. I would state it in one
    place, because "this script's one open edge" is only true after the
    exemption is granted.
  - >-
    "Did the fix create new dead controls?" Yes, one, and it is in the family
    the brief told me to watch (N-1): the masking shape is the same — the
    column sweep's start index is refused by nothing, because no case in the
    table has its only error at index 0. The round's own dead mutant
    (clues-column-count) was a REFUSAL case masked by the agreement rule; I
    looked for that shape elsewhere and the two length cases are now live
    (measured one at a time), but the reason it keeps happening is N-7: the
    refusal loop never asserts WHICH reason was given.
  - >-
    "The round declared the touch-drag half as unverifiable — judge that
    declaration." It is false. I drove a real touch drag from this suite in
    twenty lines via `page.context.new_cdp_session(page)` +
    `Input.dispatchTouchEvent`, with no new dependency, and measured both
    directions of the rule the round left untested (N-2). setPointerCapture
    did not throw; the pointerIds are real. The mutant it would kill
    (`paints = true`) is still green across all 31 tests.
  - >-
    "The tier enumeration ... does that completeness check actually fail when
    the enum grows?" Yes — measured by adding `EXPERT = "expert"` to
    nonogram.difficulty.Tier (src/, restored and sha256-verified):
    test_the_served_tier_set_is_the_runtimes_tier_vocabulary reds. Note the
    authority is the enum; `book_plan.TIERS` is itself a hand-written tuple of
    three members, so it is a second opinion rather than a second authority,
    and the test's `len(...) == 3` means a legitimate fourth tier reds twice.
    I read that as deliberate (stop and think), not as a defect. The dropped-
    tier half of the question is N-4, and the answer is no: a dropped tier is
    not distinguishable from an absent one and no control notices.
  - >-
    F-8's "by name" is robust — `..`, a symlink to the repository root, the
    other checkout, $HOME and "/" are all refused, measured through
    check_out_dir alone. The two residuals I did find are not about names:
    --force absorbs everything including the checkout with no control saying
