      browser ADR-0038/R7 declares, and no new dependency. The test file was
      restored and verified (sha256
      3b274b26f9b1a4784e0c9143d11e6ec08962e7084d6f3b5cd5903caa149ed137).
    remedy: >-
      Add that probe as a real test with the mutant as its control: Region off
      + CDP touch drag leaves the board unknown and the history empty; Region
      armed + the same drag marks the line, records one stroke and disarms.
      That kills `paints = true` and closes the last of cycle-1 F-4. If the
      owner would rather not depend on a CDP session, the honest wording is
      "verifiable only through a CDP session, which we chose not to use", not
      "Playwright cannot produce it".
    disposition: fix in this cycle (cheap, and the recipe above is measured working)
  - id: N-3
    severity: medium
    title: >-
      EC-050's completeness check is held to play.html's BUTTONS, so a control
      that is not markup escapes it: a keydown binding planted in play.js that
      POSTs leaves all 31 tests green.
    file: tests/test_public_player.py
    line: 1711
    gating: false
    confidence: high
    evidence: >-
      MEASURED: a second branch in play.js's existing keydown listener — `if
      (event.key.toLowerCase() === "r") { fetch("/collect", {method: "POST",
      ...}); commit(record(history, resetStroke(history.board))); return; }` —
      is a new player-visible control that writes to a server, and the whole
      module passes (31 passed in 4.90s).
      test_every_player_control_is_in_the_ec_050_walk derives its authority
      from `data-player-tool` / `data-player-action` / `data-player-region` in
      play.html and from two aria-keyshortcuts strings, none of which can see
      a listener. So the card's "the control set is held to play.html's own
      buttons, so a reseed or a new control cannot drop a path silently" is
      true for buttons and false for key bindings and gestures; EC-050 says
      "for every interaction sequence". The same hole covers `pointercancel`,
      which no test produces (code read, not mutated). play.js restored,
      sha256 verified.
    remedy: >-
      Hold the listener set too, from the file that owns it: assert the
      multiset of `addEventListener("<type>"` types in play.js equals a
      declared set (pointerdown, pointermove, pointerup, pointercancel, click,
      keydown), and assert the keydown handler's guard is the single Ctrl/Meta
      +Z one (e.g. that play.js contains exactly one `document.addEventListener
      ("keydown"` and that the only `event.key` comparison in it is to "z").
      A new event type or a second key then reds, which is the completeness
      half ADR-0039/R1 asks for applied to the right authority.
    disposition: fix in this cycle if cheap, else carry as a named follow-up
  - id: N-4
    severity: low
    title: >-
      "dropped silently INTO THE REPORT, which AssembleReport carries" is
      false for the tier: a narrowed tier is reported nowhere, and a dropped
      tier is indistinguishable from an absent one.
    file: player/assemble.py
    line: 357
    gating: false
    confidence: high
    evidence: >-
      MEASURED. A bundle puzzle whose stored `tier` is "tqlhkuhxpmgj" (or
      "nonsense", or None) assembles to served `tier: ""` with
      report.dropped == (('<key>', 'title'),) and report.refused == () — the
      narrowing appears in neither, and `main()` prints only
      report.dropped's field names, so the CLI is silent too. The same bundle
      with `tier` ABSENT also serves `tier: ""` with the same report, so the
      two cases are indistinguishable to the owner. No test asserts anything
      about the report for a narrowed tier (the new plant test asserts the
      served value only). That is the one silence this field's own docstring
      promises is loud, and it matters operationally: if the Tier enum grows
      and SERVED_TIERS lags, every puzzle of the new tier loses its chip with
      nothing said — the completeness TEST is then the only thing that
      notices, and only in CI.
    remedy: >-
      Record it: either extend `dropped` to carry ('<key>', 'tier') when
      `_tier` narrows a non-empty stored value, or add a `narrowed` tuple to
      AssembleReport and print it in `main()`. Then assert it in
      test_a_tier_outside_the_vocabulary_carries_no_cell_to_the_site (the
      plant) and in the fixture's "Hard"/"" cases, so the claim has a control.
    disposition: fix in this cycle (small, and the docstring is already making the claim)
  - id: N-5
    severity: low
    title: >-
      --force is an exemption with no control for what it must not absorb:
      `check_out_dir(repo_root, force=True)` returns the repository root, so
      `assemble --out . --force` deletes the checkout.
    file: player/assemble.py
    line: 555
    gating: false
    confidence: high
    evidence: >-
      MEASURED (check_out_dir only, never assemble): with force=True the
      worktree root and the other checkout at
      /Users/omelnikova/PycharmProjects/PythonProject4 are both ALLOWED. The
      test exercises force only as a positive control (the planted notes are
      gone), so nothing states what force must still refuse — against
      ADR-0039/R3, which is in this card's own System contract and which the
      round applied correctly to F-10 one finding earlier. Related, same
      function: the docstring justifies the repo-root-by-name check with "its
      own tree happens to contain player/ and would otherwise depend on which
      name iterdir reached first", which is false twice — the foreign-name
      check builds the whole list and refuses if ANY name is foreign, so it is
      order-independent, and the allowed set contains "play", not "player", so
      the repo root fails it on `player` as well as on everything else.
    remedy: >-
      Move the `site.resolve() == REPO_ROOT` refusal above the `if force`
      branch so it is unconditional, and add the negative control (force=True
      on the repo root still raises). Then fix the two-sentence justification
      to what the code does.
    disposition: fix in this cycle (it protects the owner, like F-8 did)
  - id: N-6
    severity: low
    title: >-
      The repo-root control is written against the DESTRUCTIVE entry point —
      `assemble(None, REPO_ROOT)` on the real checkout — when the
      non-destructive one is public and is what the test is about.
    file: tests/test_public_player.py
    line: 783
    gating: false
    confidence: high
    evidence: >-
      Code read plus one measurement. The test calls
      `assembler.assemble(None, REPO_ROOT)` inside pytest.raises; if that
      guard ever stops firing while the call is still reached, the next line of
      assemble is `shutil.rmtree(site)` on the checkout. Today the hazard is
      latent rather than live: with check_out_dir not consulted at all, the
      earlier `pytest.raises(..., match="no assembled site has")` fails first
      and the test aborts before the REPO_ROOT call (measured — 1 failed at
      line 779, nothing deleted). But a change that widens `_site_entries`
      enough for the repo root to pass the foreign-name check while the
      by-name check is gone (see N-5's remedy, which removes that
      dependency) lands directly on the rmtree.
    remedy: >-
      Assert the refusal through `check_out_dir(REPO_ROOT)` (and
      `check_out_dir(REPO_ROOT, force=True)` once N-5 is fixed). Keep
      `assemble` in the test only for tmp_path targets.
    disposition: fix in this cycle (a one-line change to the call)
  - id: N-7
    severity: low
    title: >-
      The refusal table asserts THAT a reason was given, never WHICH — which
      is the root of the masking family this card has now hit three times.
    file: tests/test_public_player.py
    line: 881
    gating: false
    confidence: high
    evidence: >-
      Code read: the loop asserts `report.refused[0][1]` (truthiness) and
      nothing about its text, so a case refused by a mechanism OTHER than the
      one it is named for passes. That is exactly how `clues-no-room` was
      masked in the implementation round and how `clues-column-count` was
      masked in this one (both caught only by mutating, and both recorded
      honestly). The two new length cases are live — I re-fired each
      separately: deleting `len(rows) != height` reds the test, deleting
      `len(columns) != width` reds it naming `clues-column-count`, and
      SWAPPING the two axes is caught loudly by the oblong fixture (1 failed,
      16 errors, because the 25x15 puzzle stops being servable). So the cases
      are right today; what is missing is the thing that would have found both
      maskings without a mutation round.
    remedy: >-
      Make each case a (payload, expected-reason-fragment) pair and assert the
      fragment is in report.refused[0][1] — e.g. "clues.columns is not 10
      lines" for clues-column-count, "cannot fit a line of" for clues-no-room,
      "disagree on the filled count" for clues-disagree. Every future case is
      then self-checking.
    disposition: fix in this cycle (mechanical, and it retires a recurring family)

what_i_did_not_verify:
