  - id: F-009
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/static/solver_state.js
    line: 54
    title: "isBoard accepts a frozen cells array with holes, so setBoard paints data-state=\"undefined\" (failure-matrix F17 refuted)"
    description: |
      F17 declares that setBoard refuses, before any paint, a right-sized value with "a cell
      state outside unknown/filled/empty", so no cell ever gets data-state="undefined".
      isBoard checks states with `value.cells.every(...)`, and Array.prototype.every skips
      holes. Reproduced with node on the working tree:
      `isBoard(Object.freeze({width:20,height:20,cells:Object.freeze(new Array(400))}))` → true.
      setBoard would then accept that value and paint(...) writes cells[i] === undefined into
      every td's data-state. This is the symptom F-003 was raised for. It is reached only by a
      deliberately holey array (new Array(n) without fill), so the practical reach is small,
      but it is a declared bound the code does not hold, and the new test's five shapes do not
      include it.
    suggestion: |
      Check states by index so holes read as undefined, e.g.
      `Array.from(value.cells).every((s) => CELL_STATES.includes(s))` or a plain for-loop over
      0..length-1. Add `holeyCells: Object.freeze({ width: 20, height: 20, cells: Object.freeze(new Array(400)) })`
      to the `bad` map in test_set_board_refuses_a_value_that_is_not_a_board.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: 1b869aa
    dismissed_reason: null
    learned_pattern: null
  - id: F-010
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_page.py
    line: 676
    title: "isBoard's positive-integer-side clause is untested (mutant M15 survived)"
    description: |
      Removing `isSide(value.width) && isSide(value.height)` from isBoard leaves all 59 tests
      green. Through setBoard the mutant is equivalent, because the dimension check against
      the payload rejects any bad side. But isBoard is exported for CARD-161/162, and its
      comment promises "positive integer sides". Without the clause,
      `isBoard(Object.freeze({width:0,height:5,cells:Object.freeze([])}))` would be true.
    suggestion: |
      Add direct isBoard cases in the browser test, e.g. width 0, width 2.5, width "20" with a
      matching cells array, and assert false.
    confidence: high
    source: static
