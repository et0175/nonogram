    file: tests/test_nudge_reporting.py
    line: 90
    title: "Boundary value 1 untested: the singular-wording branch and the `nudged > 0` threshold's first true value have no coverage"
    description: |
      The diff introduces one threshold (`if nudged > 0`, cli.py:323) and one
      derived branch pair (`cell_word`/`verb`, cli.py:324-325) whose singular
      arms fire only at `nudged == 1`. No test in the repository drives the CLI
      with `puzzle.nudge.attempts == 1`: the two new tests pin 2 and 0, and no
      other test calls `cli.main` on a nudging run. Consequences:

      - Two of the four new production lines ("cell", "was") are dead as far as
        the suite is concerned — the singular sentence is never produced or
        asserted anywhere.
      - The mutant `if nudged > 1:` survives the entire suite. That mutant is
        not academic: the nudge cap is 5, so a single-nudge run is the most
        common non-zero case (tests/test_nudge.py:214-230 pins exactly such a
        run), and under the mutant the tool would alter one pixel of the user's
        picture and say nothing — precisely the outcome ADR-0004/FR-014 exists
        to prevent.

      The implementer's own worktree notes acknowledge the singular case is
      reachable ("the nudge cap is 5 so the count is always in 1..5 when
      nonzero") but no test was added for it.
    suggestion: |
      Add a third test to tests/test_nudge_reporting.py driving `cli.main`
      against a single-nudge run and asserting the exact singular line
      `"1 cell was nudged to reach a unique solution"`. The repo already has a
      pinned single-nudge scenario to reuse: `_ONE_SWITCH` + `_install_source`
      from tests/test_nudge.py (test_nudge_attempts_bounded_recovery_repairs_an_
      ambiguous_conversion, which pins `puzzle.nudge.attempts == 1`), so the
      monkeypatched scripted source can be lifted directly rather than hunting
      for a new one-nudge image fixture.
