  - id: F-002
    severity: medium
    category: feature
    type: gap
    file: tests/test_nudge_reporting.py
    line: 74
    title: "AC-041's test substitutes a random-mode run for the AC's stated image-conversion given"
    description: |
      AC-041 reads: "given an exported puzzle whose **image conversion** reached
      uniqueness with zero nudges, when the puzzle is exported, then no
      nudge-count line is printed."
      `test_export_omits_nudge_count_when_zero` instead runs `--mode random`
      (tests/test_nudge_reporting.py:73-74) — a mode that structurally cannot
      enter the nudge branch at all (orchestrator.py:1046 gates it on
      `request.mode == sourcing.IMAGE`). The test therefore verifies the
      `RetryCounter` default, not the AC's scenario.

      This is not merely pedantic. A concrete regression it cannot catch: if a
      future change made the image branch record an initial attempt (counting
      the conversion itself as attempt 1), every image-mode user would see a
      spurious "1 cell was nudged" line while this test stayed green, because
      random mode never touches that branch.

      A stronger fixture already exists and is pinned: `wide.png` at size 20,
      seed 1 converts uniquely on the first try with `nudge.attempts == 0` and
      `ready_for_export is True` (tests/test_nudge.py:573-580,
      test_a_unique_conversion_is_never_nudged) — whose own docstring says it
      exists so "CARD-017 can report '0 nudges' as a fact rather than as a
      default". Using it costs one changed argument list.
    suggestion: |
      Point the AC-041 test at `--mode image --image wide.png --size 20 --seed 1`
      (the pinned zero-nudge conversion), keeping the `"nudged" not in out`
      assertion as-is. Optionally keep the random-mode case as a second,
      non-AC test asserting other modes never print the line.
    confidence: high
    source: static
