      consulting the INV-002 gate (orchestrator.py:1146-1148). Such a run prints
      no "wrote" lines but still prints the nudge line. The only case where the
      current placement differs from printing right after `generate()` is the
      export `OSError` branch.

      No AC is violated (AC-040 requires the line on export; nothing forbids it
      otherwise) and the behaviour is arguably the right one — the picture was
      altered whether or not a file was asked for. The finding is that the
      recorded rationale claims a condition the code does not implement, which
      will mislead the next reader of that comment.
    suggestion: |
      Reword the comment to state what the code does: printed after a
      successful (or not-attempted) export, i.e. suppressed only when export
      failed — and say why that suppression is wanted (nonzero exit, no
      artifact produced, so a "2 cells were nudged" line would describe a file
      that does not exist).
