    file: src/nonogram/admin/app.py
    line: 384
    title: "Size-adjustment line is flashed for a rescued picture that was never stored"
    description: |
      adjustments.append(...) runs right after _generate_image_puzzle returns (384-389), before
      the quality filter (407-408 `continue`), measure_quality (401-404) and add_puzzle (414).
      Scenario: batch_quality_filter=60 (set at app.py:266), c12.jpg is abandoned at 17x10 and
      rescued at 16x10, scores 50 -> skipped. The results then read "No valid puzzles generated"
      plus "c12.jpg: generated at 16x10 - 17x10 had no unique solution". Likewise, if
      PILImage.open/measure_quality/add_puzzle raises after a rescue, the same picture gets both an
      adjustment line and an "Error processing c12.jpg: ..." line. The sentence is literally true
      (it was generated) but reads as "stored at 16x10". No test pins either behaviour.
    suggestion: |
      Append the adjustment after add_puzzle succeeds (next to generated_count += 1), keeping
      `used`/(width, height) in locals; add a test with quality_filter above the score.
    confidence: high
    source: static
