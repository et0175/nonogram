  - id: F-002
    severity: low
    category: tech-debt
    type: question
    file: src/nonogram/admin/image_manager.py
    line: 254
    title: "Square extent at 30x30 offers only a neighbour that flips the grid against the picture"
    description: |
      For a square extent the long axis is the picture's longer axis (254-257), and +1 is dropped
      at MAX_SIZE. Reproduced: a 1010x1000 picture at fixed 30 predicts (30, 30) and
      neighbour_extents returns [(29, 30)] - a portrait grid for a landscape picture
      (keeps ~0.948 of the ratio), while (30, 29) (~0.986) is never tried. Same at 20x20:
      [(21, 20), (19, 20)], never (20, 19). Reachable with the Large preset (fixed 30) for
      pictures within ~1.7% of square. The implementation follows the card's rule literally
      (AC-6 holds); it is the rule that undercuts its own "keeps the most of the picture" intent
      at the top of the range.
    suggestion: |
      Owner decision: for a square extent, consider "the -1 candidate shrinks the picture's
      SHORTER axis" (i.e. 30x30 landscape -> (30, 29)), or accept as-is. Not a blocker.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: tech-debt
    type: question
    file: src/nonogram/admin/app.py
    line: 57
    title: "A neighbour's non-abandon error replaces the predicted extent's abandonment message"
    description: |
      Only GenerationAbandoned is caught (57); anything a neighbour attempt raises propagates.
      Each generate() call sets its own 30 s deadline (orchestrator.py:1159,
      GENERATION_BUDGET_SECONDS=30.0), so a neighbour can raise SolverTimeout, or
      ImageNeedsManualCrop at a ratio boundary, after the predicted extent was abandoned. The
      batch then shows that error for an extent the user never saw, with no mention of the
      retry, instead of today's abandonment message. The card is silent on this case (AC-3
      covers only all-abandoned). Not reproducible on the owner's pictures: every call measured
      0.00-0.04 s.
    suggestion: |
      Either document it as intended or, on a neighbour's non-abandon error, stop and raise
      first_abandonment. Owner call.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-004
    severity: info
    category: tech-debt
    type: risk
    file: src/nonogram/admin/image_manager.py
    line: 274
    title: "Out of scope: ties go to the smaller extent, but a tie can never happen"
    description: |
      A tie in kept() between (w-1)/h and (w+1)/h needs source_ratio^2 = (w^2-1)/h^2, i.e.
      w^2-1 a perfect square: impossible for integer sides >= 10 (same for the portrait axis).
      So the card's tie rule can never fire with integer source dims, and nothing tests it.
      Harmless. Cost note: worst case per abandoned picture is 3 generate() calls x (1
      conversion + 5 nudges) = 18 solves and up to 3 x 30 s inside the synchronous Flask
      request (was 6 solves / 30 s).
    suggestion: "None required; noted for follow-up."
    confidence: high
