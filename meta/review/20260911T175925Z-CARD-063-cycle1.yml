findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/web/static/metadata.js
    line: 20
    title: "Bounds read has no fallback: missing data attributes silently yield no suggestions; null currentScript aborts the script"
    description: |
      SIZE_BOUNDS is read outside the try/catch that implements AC-138's graceful fallback.
      If a page loads metadata.js without data-min-size/data-max-size, parseInt(undefined) is NaN,
      suggestDimensions' loops never run and the user gets an empty suggestion list with no
      console message. If currentScript is null (type="module", or a later refactor moving the read
      into a callback), tag.dataset throws at load and the file-input listener is never attached.
      Before this diff the 10/30 defaults made the function self-sufficient. Both current pages
      render the attributes (verified), so nothing is broken today.
    suggestion: |
      Guard the read: if the tag or either attribute is missing/NaN, console.log a message and skip
      suggestions (or keep the listener and return []), so the failure is visible.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
