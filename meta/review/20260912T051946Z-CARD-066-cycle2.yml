findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_card_066_status_filter.py
    line: 113
    title: "The enum derivation is only half-pinned: hardcoding _PUZZLE_STATUSES itself still leaves the suite green"
    description: |
      test_ac2_the_options_come_from_the_status_enum monkeypatches the ROUTE GLOBAL
      (nonogram.admin.app._PUZZLE_STATUSES) and asserts the template renders whatever that
      global holds. That genuinely pins the template half of the chain — verified, not assumed:
      a scratch copy replacing the {% for value in statuses %} loop with four hardcoded <option>
      lines fails this test on BOTH assertions ('<option value="archived"' missing, and
      count 5 != 6), so cycle-1 F-001's mutant is dead.

      But the chain has two links, and the test's own docstring claims the second one: "a status
      added to `PuzzleStatus` has to appear without touching the page." Nothing verifies it.
      The test file never imports PuzzleStatus (the only occurrence of that name in the file is
      inside this docstring); STATUSES at line 17 is a hand-written tuple restating today's four
      values. Because the test monkeypatches the global away, it is insensitive to how the real
      global is built.

      Grounded with a fourth mutant: replacing app.py:47
        _PUZZLE_STATUSES = tuple(status.value for status in PuzzleStatus)
      with
        _PUZZLE_STATUSES = ("draft", "approved", "rejected", "in_book")
      leaves 45 passed across test_card_066_status_filter.py, test_puzzles_list_pagination.py
      and test_puzzle_review.py. So the anti-drift guarantee the worktree notes assert ("the page
      cannot drift from the store the way the preset tables did, CARD-065") is still one
      hardcode away from being silently false — the drift just moved from the template to the
      route. Concrete failure: someone adds PuzzleStatus.ARCHIVED, the store starts filtering on
      it, and the Status select never offers it, with a green suite.

      Minor, not gating: the code today IS enum-derived, the regression window is narrow (one
      line in one module), and the delta strictly improved on cycle 1 — this is the residue of
      F-001, not a new defect the delta introduced.
    suggestion: |
      Add one assertion that reaches the real enum, without the monkeypatch, e.g.
        from nonogram.admin.puzzle_review import PuzzleStatus
        def test_the_route_offers_exactly_the_enum():
            assert app_module._PUZZLE_STATUSES == tuple(s.value for s in PuzzleStatus)
      Kills the mutant above and costs nothing. Optionally derive the test-local STATUSES from
      PuzzleStatus too, so the other tests widen automatically when a member is added.
