  - id: F-003
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_book_puzzle_frame.py
    line: 707
    title: "test_the_frame_never_reaches_an_answer_tile cannot fail"
    description: |
      `assert not hasattr(tile, "frame")` over `compute_answer_page_layout(...).tiles`.
      `AnswerTile` is a `slots=True` frozen dataclass that has never carried a `frame`
      field, and nothing in this diff could add one — `_puzzle_frame` is called only from
      `compute_layout` and `_slot_layout`. The assertion is a structural tautology: it is
      true on main, true on HEAD, and true under every mutation of the frame code.

      It is also the wrong property. The card's claim is that FR-042's tiles carry no frame
      *on paper*; what would test that is the absence of a rule on a tile's outer edge, read
      off the rendered answer page. F-001 shows the project's own ink measurer currently
      reports `framed=True` on exactly those pages — so the untested property is not merely
      untested, it is the one the instrument gets wrong.
    suggestion: |
      Replace with a rendered-ink assertion on a real answer page: render an answer-key page
      and assert there is no full-height rule on the leftmost tile's own outer edge beyond
      its grid border, and no full-width rule on its top edge. Keep the structural assertion
      as a cheap companion if desired, but it must not be the whole test.
    confidence: high
    source: static
