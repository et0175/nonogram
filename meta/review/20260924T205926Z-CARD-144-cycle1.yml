    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/export/layout.py
    line: 85
    title: "The frame is traced to FR-041, which is the level-divider requirement, not a page-layout one"
    description: |
      Every new citation in this diff attributes the frame to FR-041. FR-041
      (meta/architecture/requirements.yml:3082-3125) is entirely about print order — easy
      then medium then hard, moves confined to a level, a divider page per non-empty level,
      unbroken puzzle numbers. It is CARD-128's FR. trace.yml:1834-1848 confirms it: its
      components are COMP-009/COMP-010 (not COMP-007), and its nine `tests:` are the
      divider and ordering tests.

      No FR, AC or EC anywhere in requirements.yml mentions a frame, a rectangle or a boxed
      clue band (grep). The frame is untraced scope, and the card's own
      "## Architecture context" declares `FR: FR-041 (book page layout)`, which is a
      decompose-time mis-labelling the implementation then propagated.

      Blast radius is documentation, but wide and permanent: layout.py:85, :421-426, :543,
      :640, :808, :1370; png.py:187, :253; pdf.py:32; page_ink.py:86, :183; the new test
      module's header; and the prose of both baseline fixtures. A reader following FR-041
      out of layout.py lands on the divider-page requirement.
    suggestion: |
      Either add the frame to FR-030/FR-032 (the book page geometry FRs) as a dated
      amendment with its own AC ids and retarget every citation, or state plainly in the
      card that the frame is an owner-requested untraced addition and cite CARD-144 alone
      rather than borrowing an FR id that means something else. The mechanical part —
      rewriting the citations — is a sed away while the card is still open.
    confidence: high
