  - id: F-004
    severity: medium
    category: tech-debt
    type: risk
    file: src/nonogram/export/layout.py
    line: 565
    title: "\"Placed page ⇒ framed\" is equivalent to \"book page ⇒ framed\" only by accident, and nothing pins it"
    description: |
      `PageSpec.framed` reads `self.parity is not None` when `frame` is None (layout.py:565).
      The G-4 workaround is sound today — I verified it, not assumed it:
      `src/nonogram/admin/book_page_spec.py:271` is the only `PageSpec(...)` construction
      carrying a parity anywhere in `src/` (the other is `DEFAULT_PAGE_SPEC`, parity None),
      and every consumer of a parity-bearing spec is book-side (`book_pdf_generator`,
      `book_proof`, `book_manager`/`app` for cell measurement only). `cli.py` and
      `src/nonogram/web/*.py` pass no `page_spec` at all. So "placed" and "book" name the
      same set of pages today, and CON-019 is safe.

      What is not safe is the statement. The rule is phrased as a property of *parity*, and
      the equivalence that makes it correct — "nothing but the book lays a puzzle on a trim"
      — is asserted in a docstring (layout.py:553-556) and pinned by no test. The first
      non-book placed page (a single-sheet trim preview, a poster export, a marketing
      render) silently acquires a frame, and the only thing that would catch it is someone
      re-reading that docstring.

      Note also that this already changes behaviour outside the book PDF: `book_proof.py:513`
      renders proof pages through `render_pages` on a parity spec, so proof pages are now
      framed. That is correct — they are proofs of book pages, and the card's proof renders
      show them framed — but it is a second consumer the card's "book pages only" wording
      does not name.
    suggestion: |
      Pin the equivalence rather than documenting it: a structural test in the spirit of
      `tests/test_cli.py`'s import guard that walks `src/nonogram/**/*.py` with `ast` and
      asserts `book_page_spec.py` is the only module constructing a `PageSpec` with a
      non-None parity. One test, and the day someone adds a second placed-page producer the
      suite says so instead of the docstring.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
