findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: tests/helpers/page_ink.py
    line: 207
    title: "The frame heuristic fires on the packed answer-key page, silently shifting columns/rows/cell/grid_left/grid_top there"
    description: |
      `drawing_of` decides a page is framed when the drawing's left edge falls inside the
      leftmost vertical rule's pixel span and the drawing's top edge inside the topmost
      horizontal rule's span (page_ink.py:207-209), then drops one rule group from each
      axis (:210-213).

      That condition is not unique to a frame. An FR-042 answer TILE carries no clue
      gutter, so the tile's own left/top edge *is* its grid's left/top border and the
      condition holds trivially. Measured against a verbatim reimplementation of main's
      `drawing_of` over the real baseline-book export (all 11 interior pages):

        interior 10 (answer key)  main: columns=15 rows=15 grid_left=234 grid_top=276 cell=59.00
                                  HEAD: framed=True columns=14 rows=14 grid_left=294 grid_top=336 cell=58.93
        interior 11 (answer key)  main: columns=30 rows=30 grid_left=148 grid_top=276 cell=37.73
                                  HEAD: framed=True columns=29 rows=29 grid_left=187 grid_top=315 cell=37.69

      Interiors 5 and 7 change too, and there the new reading is the correct one (15x15 and
      30x30 with the frame discounted). Interior 9 escapes only because its heading changes
      which group is topmost — so the misreading is data-dependent, not systematic, which is
      worse.

      No test breaks today: the full suite on this head is green bar the known e2e failure,
      and the only assertions that touch an answer page through this helper read `.left` and
      `.grid_right` (tests/property/test_book_pdf_geometry.py:399-407) — both computed before
      the drop and therefore unchanged. `left`, `top`, `grid_right` and `grid_bottom` are
      stable in every case I measured; `grid_left`, `grid_top`, `columns`, `rows` and `cell`
      are not.

      The new `Drawing.framed` field is documented (page_ink.py:86-87) as "whether the
      drawing is closed off by a book page's frame, read off the page". It answers True for
      pages that carry no frame. The card's own fixture note and
      `test_the_frame_never_reaches_an_answer_tile` both assert the opposite property.

      Failure scenario: CARD-146, or whoever next owns FR-042, writes
      `assert not drawing.framed` on an answer page to prove the frame stayed out of the key —
      it fails, and the cheapest-looking repair is to weaken the assertion. Or an answer-key
      geometry card measures a tile's printed cell with `drawing_of` and is told a 30x30 tile
      has 29 columns. Either way the instrument, not the page, is wrong, with everything green.
    suggestion: |
      Add a discriminator the answer tile cannot satisfy, or stop inferring. Two workable
      shapes:
        * have the caller state the page kind (`drawing_of(page, framed=...)`), which is
          what every call site already knows; or
        * keep the inference but require the frame candidate to be *outside* the grid's own
          pitch — e.g. the first gap in BOTH axes differs from the modal gap of the rest,
          which is true of a gutter and false of a uniform tile.
      Whichever is chosen, `Drawing.framed` needs the same "blank puzzle pages only" caveat
      the module already carries for `columns`/`rows` (page_ink.py:36-41), or an explicit
      guard that raises on a tiled page.
    confidence: high
    source: static
    violates: null
