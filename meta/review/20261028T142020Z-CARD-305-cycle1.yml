    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_book_divider_pages_option.py
    line: 127
    title: "No position/parity control for the off state, though a ±1-page precedent exists and the parity property test is an absent co-change peer"
    description: |
      The card names page numbering and parity (FR-043) as consequence #1 of
      four and is right that it is the widest: removing up to four interior
      pages moves every later page's number, and a page's gutter side comes
      from its parity. The new test file controls the page COUNT (four / two /
      zero delta), the TOC rows, the walk-vs-declared-count tripwire and the
      KDP estimate. None of those would catch a page drawn on the frame of a
      parity it no longer has.

      Two independent signals that this is the missing control, not a
      reviewer's preference:

        * [history] `tests/property/test_book_export_interior.py` co-changed
          with book_pdf_generator.py 22 times in 12 months and is absent from
          this diff. It is INV-013's property test ("each page's parity is
          its 1-based position in the interior"), and it hardcodes the
          divider model it is now one case of: `_divider_pages(puzzles)` =
          "one per named level" (line 457) and `page_number += 1  # the
          level's divider` (line 449), with no dividers-off arm.
        * [static] the board's own precedent for the mirror-image change —
          one page ADDED — is
          `tests/test_book_guide_page.py::TestGuidePage_ExtraPageShiftsEverythingByOneKeepingParity`,
          which asserts both that every page from the first puzzle/divider
          page onward carries the same content only shifted AND
          `test_every_pages_parity_still_equals_its_own_position`. CARD-305
          removes up to four pages and ships no equivalent.

      This is a coverage gap, not a demonstrated bug: I read the mechanism
      and it is structurally sound — `page_is_right_hand(page_number)` is
      `page_number % 2 == 1` (book_pdf_generator.py:3139-3148), every frame
      comes from `self.page_spec(page_number)` at draw time, and
      `puzzle_section` advances `page_number` inside the same branch that
      appends the divider, so there is no second place to tell. Severity is
      medium for that reason; it is Important because the invariant's
      coverage is what is missing.
    suggestion: |
      Add one cell: for the AC-253 book with dividers off, walk
      interior_stream and assert each emitted page's parity equals its
      1-based position (and, if cheap, that the pages after the first level
      are the same content shifted). Either in the new test file or as a
      second arm on tests/property/test_book_export_interior.py's
      `_divider_pages`, which is where the divider model already lives.
    confidence: medium
    source: history
    violates: INV-013
    root_cause: RC-3
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 3716
    title: "The route reads the checkbox with bool() instead of the module's declared reader, so an explicit \"0\"/\"false\" posts as ON"
    description: |
      `divider_input = bool(request.form.get("interior_divider_pages"))` makes
      every non-empty string True. A submission carrying the marker plus
      `interior_divider_pages=0`, `=false` or `=off` therefore stores True —
      the opposite of what it says. book_page_spec declares
      `_DIVIDER_PAGES_FALSE = {"0","off","false","no","n","f"}` and
      `divider_pages_from_stored` exactly for this vocabulary, and
      `_interior_divider_pages`'s own docstring calls that function "the one
      door onto the stored column", but the inbound path does not use it.

      Harmless for the shipped template, which renders `value="1"` and posts
      nothing when unticked — which is why no test catches it, and why this
      is Minor rather than a bug. It is a real sharp edge for the next client
      (a JSON-ish poster, a hand-built form, a future API) and it is
      inconsistent with the card's own "one door" framing.
    suggestion: |
      Read the field through the module's reader rather than bool():
      `divider_input = divider_pages_from_stored(request.form.get("interior_divider_pages") or False)`
      (or an explicit presence/truth split that consults _DIVIDER_PAGES_FALSE).
      Add one cell posting marker + "0" and asserting the column reads False.
    confidence: high
    source: static
    violates: null
    root_cause: RC-4
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

