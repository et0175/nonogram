findings:
  - id: F-001
    severity: high
    category: feature
    type: gap
    file: tests/test_book_divider_pages_option.py
    line: 403
    title: "AC-10's cell cannot fail on the defect it is nominated to catch (both mechanism mutants survive)"
    description: |
      The card nominates
      `TestDividerPages_PrintSetupStoresTheChoice::test_a_submission_without_the_control_leaves_the_stored_choice_alone`
      as "the one test that would have caught the defect this card most
      risked", and its docstring reasons: "Driven from 'off', because a book
      already at the default would pass this test whatever the code did."
      That reasoning is inverted. Driving from OFF is precisely the state in
      which the defect is invisible: if the marker mechanism is removed, the
      naive read is `bool(request.form.get("interior_divider_pages"))` ->
      `bool(None)` -> `False`, which is the value the test asserts. The
      mechanism's failure and its success produce the same stored byte.

      Measured, two mutants, one node each, line-count-preserving, target
      asserted at HEAD before each:

        M1  src/nonogram/admin/app.py:3715
            `if request.form.get("interior_divider_pages_present"):` -> `if True:`
            => AC-10's cell PASSES in both storage modes. SURVIVED.
        M2  src/nonogram/admin/book_manager.py:1003
            `if spec.interior_divider_pages is not None:` -> `if True:`
            => AC-10's cell PASSES in both storage modes. SURVIVED.

      Attribution control (the cell named must be the cell that reds): a
      discriminating test driving the same no-marker POST from the DEFAULT
      (ON) book reds on both mutants and passes at HEAD — M1: "2 failed, 2
      passed", the 2 failed being the discriminator in both modes and the 2
      passed being AC-10's own cell; M2 identical. So the production code is
      correct and the test is the defect.

      The card's second argument — "every other route test in the suite posts
      without the marker, so they are all that case" — I confirmed
      mechanically (`interior_divider_pages_present` appears in no test file
      but the new one, while 18 other test files POST to
      /book/<id>/setup-print). But every one of those books is at the default
      ON, and none of them asserts the divider column afterwards, so they
      exercise the path without discriminating on it either.
    suggestion: |
      Drive the no-marker POST from ON. Minimal edit inside the existing
      cell: before the no-marker POST, assert the book reads True, then POST
      without the marker, then assert it still reads True — i.e. keep the
      existing from-OFF leg (it is a fine second case) and add the from-ON
      leg, which is the one that can fail. Re-fire M1 and M2 afterwards and
      confirm both now red.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: compliance
    type: gap
    file: meta/kanban/cards/CARD-305.md
    line: 150
    title: "The recorded architect gap is under-scoped: EC-029, FR-041's body, FR-042's body, AC-253 and AC-293 are stale too"
    description: |
      The card's "What this card owes the architect" section names AC-254 and
      AC-292 and states the honest registry edit for them. Both calls are
      correct (confirmed below). But the same staleness reaches five further
      entries the card does not name, and one of them is heavier than either
      criterion it does name.

      Confirmed by reading meta/architecture/requirements.yml:

        * EC-029 (requirements.yml:3786-3796) — "the book PDF holds exactly
          one divider per non-empty level, immediately before that level's
          first puzzle, with puzzle numbers 1..n unbroken — FOR EVERY
          SEQUENCE, not only the measured examples." Now false for a book
          with the option off. This is an engineering constraint, i.e. a
          standing property, and its named property test
          `test_PropertyTest_BookOrder_GroupedByTierUnderAnyEditSequence`
          (tests/property/test_book_order.py:404) asserts
          `names == levels` through `assert_prints_grouped_with_dividers`
          (line 252-282) on every step of every trial, while creating every
          book through `create_book` and therefore always on the default. It
          passes, and it verifies nothing about the off state. That is the
          exact coverage shape the card correctly identifies for AC-254/292,
          one layer up, and it is the one the board treats as Important
          (missing EC coverage).
        * FR-041's requirement body (3691-3694) — "The book PDF prints a
          divider page (TERM-031) before the first puzzle of each level that
          holds at least one puzzle, carrying only the level's name" —
          unconditional prose.
        * FR-042's body (3814-3817) — "A 'SOLUTIONS' divider page precedes
          the answer key: one page ..." — unconditional prose.
        * AC-253 (3713-3717) — "the puzzle section's pages run divider
          'Easy', E1, E2, divider 'Medium', ...". Its `given` is "a Book 1
          profile book arranged ...", which an option-off book also
          satisfies, so it is false by exactly the argument the card makes
          for AC-292.
        * AC-293 (4024-4029) — "the answer key is 31 answer pages ... after 1
          SOLUTIONS divider page (32 pages ...)" — a concrete figure that is
          wrong for an option-off book.

      The card's AC-254 call is the subtler one and it is right: AC-254's
      `when` is "its divider pages are read", which is vacuous over an empty
      set, so AC-254 stays true and only needs the clause the card describes.
      AC-292's `then` is a universally quantified claim over books matching
      its `given`, so it genuinely goes false. AC-255/AC-256 stay true
      (AC-256 vacuously: "holds no 'Hard' divider page").
    suggestion: |
      Extend the card's owed-to-architect record to the five entries above
      before merge (the record itself, not the registry edit — that stays an
      architect-station job). The registry edit, when it happens: add a
      `given` clause naming the setting to AC-253, AC-254, AC-292 and AC-293;
      make the divider sentence in FR-041's and FR-042's bodies conditional;
      and amend EC-029's statement to quantify over books that print their
      dividers, plus a new criterion (or a second arm on
      `assert_prints_grouped_with_dividers`) for the off case.

      Per the board's standing rule, do NOT write
      `check: {kind: test, ref: <a test that does not exist>}` for the new
      off-case criterion — a planned ref reads as mechanically checked to
      both system_rules.py and this skill's Step 8h, which is strictly worse
      than the visible gap. Either write the off-state arm in
      tests/property/test_book_order.py in the same edit, or type the new
      criterion's check as `kind: review-lens` with a named card owing the
      flip.
    confidence: high
    source: model
    violates: EC-029
    root_cause: RC-2
    status: open
