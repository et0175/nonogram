  - id: F-007
    severity: info
    category: ops
    type: question
    file: migrations/versions/017_book_divider_pages.py
    line: 1
    title: "Out-of-scope: migration 017 is executed by no test, as was 013 before it"
    description: |
      No test in the repo applies migration 017. The only `upgrade(...,
      "head")` call, tests/test_db_url_driver.py:1115, is intercepted by a
      fake `engine_from_config` raising `Captured()` before any SQL runs, so
      it measures the driver name only. The board does have a precedent for
      the opposite (tests/test_book_plan_storage.py upgrades to "009"/"010",
      tests/test_batch_requested_tier.py to "014"), but migration 013 —
      which this one explicitly follows "in shape and in reasoning" — has
      none either, so 017 is at its precedent rather than below it.

      Not gating, and the card is honest about it: G-1 says three things
      assert the default and "only the third is load-bearing", which is
      exactly right — `divider_pages_from_stored(None) is True` is tested
      directly, so an unmigrated or unbackfilled row reads as dividers-ON
      regardless of what the DDL did. The reviewed consequence of the
      untested half is narrow: the `server_default=sa.true()` and the
