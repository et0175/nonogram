findings:
  - id: F-001
    severity: low
    category: feature
    type: risk
    file: tests/test_puzzle_solver_probe.py
    line: 893
    title: "On the one cell the hint and the probe share, membership is dash-only — and the dash is held by string inequality, the instrument cycle 1 condemned"
    description: |
      The channel move's whole argument is "two outlines that differ in STYLE
      are told apart at any colour distance". On every cell but one that is
      belt-and-braces: the ring is amber where nothing else is, and the six
      ground separations are measured against a floor of 20.

      On the cell that is both hinted and probed, it is the entire signal.
      `.player-cell.is-hinted[data-probe]` hands that cell the hint's accent
      COLOUR (admin.css:1563), so what distinguishes "revealed and a probe
      member" from "revealed" is the dash alone.

      Two gaps, both narrow:

      1. `test_the_ring_is_apart_from_the_hints_outline_by_SHAPE` holds that
         claim by comparing computed `outline-style` strings ("solid" !=
         "dashed"). String inequality of a computed value is exactly what cycle
         1's F-001 found insufficient for the colour case — a dash that renders
         as a continuous line would sail through it, as dE 2.55 sailed through
         the old crosshair assertion.
      2. Nothing measures that the dash is RESOLVABLE at the cell sizes this
         board actually reaches. `--player-cell-min` is 14 px normally but
         admin.css:691 drops it to 0 below 820 px, so a large board at phone
         width draws cells well under 14 px against a 2 px ring
         (`--player-rule-major` = 2 * --border-width). The owner's own render
         shows the effect at the gentle end: in
         04-probe-with-revealed-cell-phone-390x844-stage.png the revealed
         cell's green ring reads as very nearly solid.

      Failure scenario: a player on a phone with a 30 x 30 opens a probe and
      presses Hint to rung 3. The revealed cell wears a green ring that at that
      size is indistinguishable from an ordinary hint ring, so the player does
      not know it is part of the hypothesis; pressing Contradiction takes the
      revealed cell away with the rest and the reveal appears to have been
      undone by itself.

      Bounded, and that is why this is Minor and not Important: it is ONE cell
      (rung 3 reveals one), it needs a hint pressed to rung 3 inside a probe at
      a small cell size, the board arithmetic is correct throughout, and the
      probe's own controls (Keep / Contradiction, visible on the toolbar) carry
      membership for the session even when the per-cell signal is faint. The
      card's headline claim — the bulk of what a probe paints is legible — is
      measured and holds.
    suggestion: |
      Cheapest honest close is to say in the record what the SHAPE test
      actually holds (a style keyword, not a resolvable dash) so the next
      reader does not mistake it for a measured claim, and to note the
      small-cell case as a known limit of the channel.
      If it is worth a control: render the shared cell at the smallest cell
      size the clamp allows and assert the ring has at least N gaps across a
      side (readable off a canvas sample of the cell's edge row, the same
      instrument the dE test already uses), or make the ring's dash length a
      function of the cell so the period scales. Either is a design change and
      belongs to the owner, not to a fix round.
    confidence: medium
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_puzzle_solver_probe.py
    line: 1779
    title: "The focus-scroll control waits on a 700 ms fixed sleep, and its failure direction is a false pass"
    description: |
      `_FOCUS_SCROLL` ends with
      `await new Promise((resolve) => setTimeout(resolve, 700));` before reading
      the board's top. That is sleep-based synchronisation for the passage of a
      smooth scroll — the pattern engineering-standards §6 names — and it costs
      2.8 s of suite time across the four evaluations in the two parametrized
      cases.

      The direction matters more than the cost: if the smooth scroll has not
      settled in 700 ms the measurement is SMALLER than the truth, and the
      assertion is `scrolled <= halfCell`. So on a slow machine the control
      silently passes rather than flaking red — the failure mode that is
      invisible.

      It is not a new sin on this board: `wait_for_timeout` is used in five
      sibling files in the same family (crosshair x2, zoom x3, clues,
      fifth_rule, progress), so a fixed wait is established precedent here, and
      S1 shows 700 ms is long enough for the control to still discriminate (it
      reads 15 px when the bar is taller). That is why this is Minor.
    suggestion: |
      Poll instead of sleeping: read the board's top every frame until two
      consecutive readings agree (or until a cap), which is both faster in the
      common case and correct in the slow one. Chromium also fires `scrollend`,
      which would remove the wait entirely.
    confidence: high
