      Genuinely independent again in the sense that matters, with one residual
      shared assumption named honestly below.
    detail: >-
      Cycle 1's defect was a shared ARITHMETIC assumption (both sides clamped
      with min). That is gone: the oracle mints an int identity per mark and
      models no history object at all, the module filters frozen stroke objects
      out of a real history, and the two report DIFFERENT quantities for the
