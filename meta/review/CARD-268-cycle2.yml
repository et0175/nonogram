      corrected 5.80, not the struck 6.6); the 14 % value cycle 1 shipped is
      2.362 from the crosshair (the card's 2.36) and 10.197 from paper (10.20);
      --color-warning-tint vs crosshair 5.364 (5.36); T1e/T1f bracket 18.925 /
      20.469 (18.92 / 20.47); T5's survivor 69.17 (69). Every one counted from
      the values, not restated. (d) The cascade claim is true as stated:
      .player-cell.is-hinted (admin.css:925) and .player-cell[data-probe]
      (:1561) are both 0-2-0 and the probe is later, so it takes the shorthand;
      .player-cell.is-hinted[data-probe] (:1563) is 0-3-0 and later than
      .player-cell[data-probe][data-state="filled"] (:1562), also 0-3-0, so the
      accent wins on the shared cell — exactly what the third rule claims.
      (e) The owner's render exists and shows it: in 03-*-stage the nine members
      on the crosshair-tinted row 6 wear a plainly legible dashed amber ring on
      both the warm ground and on filled cells, while row 1's eight pre-probe
      filled marks wear nothing.
  f002:
    closed: true
    evidence: >-
      Derived. (a) The mechanism is sound: I checked that stroke identity
      survives every history move — `record` freezes one entry per step with the
      stroke as given, `undo` pushes `entry.stroke` onto `undone`, `redo` wraps
      that same object in a fresh entry, and all four `record` call sites in
      solver.js build a fresh stroke through makeStroke, which never memoises.
      So no two steps can share a stroke object and no pre-probe stroke can lose
      its identity. (b) probeStart's prefix assumption holds: record appends and
      drops `undone`, undo pops the tail, redo re-appends the top of `undone` —
      by induction the pre-probe strokes are always a prefix of `done`, so the
      walk and the oracle's total agree exactly when the invariant holds and
      disagree when it does not, which is the asymmetry the round claims.
      (c) Re-fired R1: 3 of the 5 arms of TestSolverProbe_StateIsPureAndStatesAreFour
      red, on the named rule cases, the seeded corpus and the checkpoint-prefix
      arm — the exact recorded cells. (d) The blast radius is provably confined:
      replaying the corpus generator in Python and running BOTH readings over
      12,000 sequences (40 seeds x 300), 196 disagree and ZERO disagree without
      reaching the pre-probe-redo shape. The rewrite changes behaviour only
      where F-002 said it should.
