  - id: F-007
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_admin_uniqueness_boundary.py
    line: 378
    title: "The cross-check corpus cannot generate a non-list row, so the test that justifies duplicating regrade._as_grid cannot see that whole divergence class"
    description: |
      `TestTheTwoGridReaders_AgreeWithEachOther` is the entire argument for
      reimplementing `regrade._as_grid` rather than importing it. Mutation N4 —
      delete `isinstance(line, list)` from `_as_readable_grid` — SURVIVED the
      full file.

      Measured why. `_corpus()` builds every row as a list comprehension, and
      its one malformation truncates a row; so it generates a non-list row
      **0 times in 300**. The two hand-written cases with a non-list row are
      `[[True], "no"]` (caught by the width check, not the type check) and
      `"not a grid"` (caught by the outer isinstance). No case reaches the
      check the mutant removes.

      The divergence is real, not theoretical: for `[[True, False], "no"]`
      both readers return None today, but the mutated reader returns
      `[[True, False], [True, True]]` — it reads a string row character by
      character — while `regrade._as_grid` still returns None. That is exactly
      the "the copies drifted apart" failure the cross-check exists to catch,
      and it is invisible to it.
    suggestion: |
      Add a non-list row **of the same width as row 0** to the hand-written
      cases (e.g. `[[True, False], "no"]`, `[[True], 1]`), and let the
      generator emit a bare string or int as a row with some probability.
      Then assert the corpus contains at least one such case, the way it
      already asserts the readable/unreadable split, so the hole cannot
      reopen silently.
    confidence: high
    source: static
    violates: null
    root_cause: RC-3
    status: fixed
    fixed_in: b70a050
    dismissed_reason: null
    fix_note: |
      the corpus now carries non-list rows at matching width, generated and hand-written, and test_the_corpus_reaches_the_row_type_check asserts they are present; mutant N4 (drop isinstance(line, list)) is now KILLED by test_they_agree_on_every_case
    learned_pattern: null

  - id: F-008
    severity: medium
    category: tech-debt
    type: bug
    file: src/nonogram/admin/puzzle_review.py
    line: 320
    title: "The write boundary's refusal lost its exception chain, and it is the log F-003's fix points at that goes blind"
    description: |
      Before the delta, both refusal paths carried the cause:
      `raise NotUniquelySolvable(...) from exc` for the `compute_clues` error
      and for `SolverTimeout`. `_why_this_is_not_a_puzzle` now returns a
      string, and the write path raises outside any handler, so the chain is
      gone entirely.

      Measured, on this head:

        ambiguous grid -> __cause__: None
        solver timeout -> __cause__: None, __context__: None

      `__context__` is None too, because the raise happens after the except
      block returned.

      This interacts with the other fix in the same commit.
      `batch_generator.py:377` logs the refusal with `exc_info=True`, and
      F-003's fix advertises that log as where the detail lives ("the admin log
      carries the per-candidate reasons"). After the delta that log records a
      NotUniquelySolvable with no cause attached — for a refusal caused by a
      solver timeout, the SolverTimeout and everything it carried no longer
      appear anywhere. The card's own AC-D path ("a solve that times out is
      refused rather than stored, and says so") is the one that lost the most.

      Behaviour is unchanged; this is forensic capability on a path the code
      itself calls unreachable, which is precisely the path where forensics is
      the only tool available.
    suggestion: |
      Keep the objection helper and re-attach the cause: have
      `_why_this_is_not_a_puzzle` return `(reason, cause)` (cause `None` for
      the verdict case), and raise `... from cause` at the write boundary. One
      line at each end, and the audit keeps reading reasons.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: b70a050
    dismissed_reason: null
    fix_note: |
      _why_this_is_not_a_puzzle returns (reason, cause); the write path re-attaches it with `from cause` and the audit drops it. Pinned both ways: test_the_refusal_carries_the_exception_that_caused_it and test_a_verdict_is_not_dressed_up_as_a_failure
    learned_pattern: null

