    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/book_select_puzzles.html
    line: 156
    title: "Tile looks the cell up by the raw id while `_book_cells` keys by `str(id)`"
    description: |
      `_book_cells` deliberately normalises its keys (`str(record.get("id"))`,
      app.py:2551) but the template reads `book_cells.get(puzzle.id)` without the
      same normalisation. Both storage modes hand out string ids today
      (`_row_to_dict` casts, legacy uses `f"puzzle_{n:06d}"`), so this is latent,
      not live. If a record ever carried a non-string id the lookup would miss
      silently and the tile would degrade to "not measurable" + a below-floor
      flag — a wrong verdict wearing the fail-closed posture, and the one shape
      the property test cannot catch because its corpus is string-keyed too.
    suggestion: |
      Key the context dict by the same value the template uses (drop the `str()`
      and key by `record.get("id")`), or expose the lookup already resolved per
      puzzle. Either way, state the id's type once.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 2561
    title: "An unreadable print spec is shown as N unmeasurable puzzles, never as the book's own fault"
    description: |
      When `book_page_spec(book)` raises, `_book_cells` logs a warning and
      returns `{id: None}` for every record. The owner then sees every tile
      reading "Cell cannot be measured on this book" with an override control
      offered, and the finalise summary reads "Below the 4.8 mm floor: N" with N
      "cell cannot be measured" entries — the cause (a stored trim/margin column
      that cannot be read) is server-side only. Ticking those overrides and
      submitting reaches `BookManager._below_floor_for`, which *raises* the same
      ValueError; the route catches it and flashes a raw `Error: <message>`.
      Fail-closed in both directions, so nothing wrong is admitted, but the
      remedy ("fix this book's Print setup") is never named on the screen.
    suggestion: |
      Have `_book_cells` report the spec failure distinctly (e.g. return
      `(cells, spec_error)`) and flash/banner "This book's trim cannot be read —
      re-save Print setup" on both screens, suppressing the per-tile override
      control in that state since no override can succeed.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
