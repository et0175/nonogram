    type: risk
    file: src/nonogram/admin/templates/book_select_puzzles.html
    line: 157
    title: "The floor verdict is stated twice — `_misses_the_floor` in Python, the same expression inline in Jinja"
    description: |
      The *cell* is one computation (G-1 holds), but the *verdict* is not: the
      finalise route uses `_misses_the_floor(cell)` (app.py:2586) while the tile
      recomputes it inline as `{% set below_floor = cell_mm is none or cell_mm <
      floor_mm %}` (book_select_puzzles.html:157). They agree today and the
      property test pins them to one another over 384 agreements, but the rule
      ("an unmeasurable cell misses the floor") now has two homes, and
      `_misses_the_floor` has fan-in 1 as a result.
    suggestion: |
      Pass a per-puzzle verdict alongside the cell (e.g. `book_cells[id] =
      (cell, misses_floor)`, or a second `below_floor_ids` set in the context)
      so the template renders a decision it was handed rather than one it makes.
    confidence: high
    source: static
