card_feedback:
  - >
    The card's Touches line names tests/test_admin_review.py, which the commit does not change.
    Harmless, but the line is now wrong and a reader will look for an edit that is not there.
  - >
    The card assumed AC-2's zero-solution arm was reachable from a grid payload. It is not, for
    the reason the store's own comment already records. The implementer caught this and said so
    in the notes; the card text should be amended rather than leaving the next reader to
    rediscover it.
  - >
    G-1's wording - "derived from the class rather than hand-listed (ADR-0039/R2: the set is
    enumerated, and defaults to deny)" - specifies that the *method set* be derived, and the
    implementation satisfies that literally while leaving the write predicate an allow-list.
    The guardrail would have been harder to satisfy vacuously if it had said what must default
    to deny: a method is presumed a grid writer unless it is on a justified read-only list.
  - >
    The card says nothing about enforcing MIN_SIZE/MAX_SIZE on the first HTTP-reachable grid
    write in the system (F-008). The implementer declared it out of scope on add_puzzle parity
    grounds, which is defensible, but the card should have decided it rather than leaving the
    judgement to the notes.
  - >
    The card's recommended "stage the verified grid keyed by puzzle id and a hash of the grid"
    does not mention that the staging store must distinguish grid *extents*, which turned out to
    be the single most load-bearing line in the mechanism (F-001). A card that recommends a hash
    should say what the hash must cover.
