summary: >
  The gate itself holds. I found no reachable write to Puzzle.grid that does not pass
  _refuse_unless_uniquely_solvable: save_edited_grid is the only writer, it calls the gate
  unconditionally before the write, the memo is only ever populated from a solve whose verdict
  was solution_count == 1 (timeouts and objections are never cached), the fingerprint is
  unambiguous across extents, eviction and a missing verification both fail closed, and the DB
  write is one session so a partial update is not reachable. The owner's settled decision is
  implemented faithfully (quality_score and recognizability untouched, manually_edited_at only
  on a stored edit) and the migration is symmetric and chain-correct. What is weak is the
  evidence, not the behaviour: the single line that stops the new memoisation reusing a proof
  across grid shapes is untested (demonstrated: with it removed a 2-solution grid is stored and
  the audit reports the table corrupt), and G-1 - the guardrail the card calls "the one that
  matters" - detects grid writes by an allow-list of four syntactic shapes, so it is
  default-allow where ADR-0039/R2 requires default-deny.

findings:
  - id: F-001
    severity: important
    file: src/nonogram/admin/puzzle_review.py
    line: 585
    claim: >
      The extent in the grid fingerprint is the one line stopping the new memo from handing a
      proof of one grid to a differently-shaped grid with the same row-major bits, and no test
      covers it. Mutant M2 (text = bits, extent dropped) survived the card's whole selection:
      161 passed.
    evidence: >
      Demonstrated under M2 on the in-memory store: verify_replacement_grid(pid, [[T,F,F,T]])
      (a unique 1x4) caches a proof under bits "1001"; save_edited_grid(pid, [[T,F],[F,T]])
      (the 2x2 diagonal, 2 solutions, same bits) then gets a memo HIT, never enters the solver,
      passes _refuse_unless_verified because the fingerprint and shown_for both match, and the
      row is written. audit_uniqueness() afterwards returns
      [('puzzle_000001', 'the clue set has 2 or more solutions ... (FR-006)')] - the exact
      corruption the card exists to prevent. Production (extent present) correctly raises
      NotUniquelySolvable. The docstring at _grid_fingerprint names this hazard explicitly
      ("a 2x6 and a 3x4 of the same bits would share a name") but nothing asserts it.
    suggested_fix: >
      Add a test that two grids with identical row-major bits and different extents get
      different fingerprints AND that a save of the reshaped grid is refused - e.g. verify a
      unique 1x4 [[T,F,F,T]], then assert save_edited_grid of [[T,F],[F,T]] raises
      NotUniquelySolvable (not EditNotVerified), and assert the stored row is unchanged.

  - id: F-002
    severity: important
    file: tests/test_puzzle_edit_store.py
    line: 816
    claim: >
      G-1's derived guard is default-ALLOW, not default-deny (ADR-0039/R2). The *method set* is
      derived from the class, but the write *predicate* (_binds_a_grid) is a hand-written
      allow-list of four syntactic shapes; a grid write in any other shape is classified as
      "not a write" and silently exempted from the reachability check.
    evidence: >
      Probing _binds_a_grid directly with nine plausible writer bodies, eight are invisible:
      db.query(Puzzle).filter(...).update({"grid": grid}) HIDDEN; Puzzle(**derived) HIDDEN;
      for column, value in derived.items(): setattr(row, column, value) HIDDEN;
      self.puzzles[pid].update(derived) HIDDEN; column = "grid"; setattr(row, column, grid)
      HIDDEN; a module-level helper _apply(row, grid) HIDDEN (also outside _methods_of's scope,
      which reads only PuzzleReviewService's own ClassDef body);
      payload = {"grid": grid}; self.puzzles[pid] = payload HIDDEN; row.grid[0][0] = True
      HIDDEN. Only target = row; target.grid = grid was CAUGHT. The hidden "dict update" shape
      is the one the production code itself uses in legacy mode (puzzle.update(derived) in
      save_edited_grid); save_edited_grid only enters the writer set because the DB branch in
      the same method happens to spell row.grid = ... out. Mutant M8 proved it: rewriting that
      DB branch as a behaviour-identical setattr loop made save_edited_grid drop out of the
      derived writer set entirely, and
      test_every_grid_writing_method_reaches_the_refusal still PASSED - the only test that went
      red was test_the_two_known_writers_are_in_the_derived_set, which is a hand-listed floor,
      i.e. exactly the snapshot-of-today's-methods the guardrail says must not be the mechanism.
      Correspondingly, test_the_detector_catches_a_bypass_it_has_never_seen's five params are
      one per branch of _binds_a_grid - they are the shapes it was written from, not shapes it
      has never seen, so they certify the branches but prove nothing about completeness.
    suggested_fix: >
      Invert the predicate to default-deny on the write side rather than the read side: treat
      every method that is not provably gated as a candidate and require it to reach the gate
      unless it is on a short, justified read-only allow-list (_row_to_dict,
      _all_rows_for_audit, audit_uniqueness, the filters) - or, cheaper and still honest, keep
      the shape list but add the missing shapes (a Call to .update()/.bulk_update_mappings()
      whose argument dict carries a "grid" key, setattr with a non-constant name, a Call with
      **kwargs where a dict literal with a "grid" key flows in, and module-level functions in
      the same file) and add a negative-control param per *new* shape so the list's growth is
      itself asserted.

  - id: F-003
    severity: important
    file: tests/test_puzzle_edit_store.py
    line: 1205
    claim: >
      test_016_is_the_head hardcodes the head revision, reintroducing the exact brittleness a
      previous card removed, and its docstring claims the opposite of what the assertion does.
    evidence: >
      The assertion is `script.get_heads() == [max(on_disk, key=int)] == ["016"]`. The trailing
      `== ["016"]` pins today's head by name, so migration 017 turns this test red on an
      unrelated card. tests/test_batch_requested_tier.py:300-302 records this as a mistake
      already paid for once: "This used to assert get_heads() == ['014'], which was true only
      until the next migration was written: CARD-222's 015 broke it, and hardcoding ['015']
      would have handed the same breakage to 016." The new test's own docstring says "Derived,
      not named ... the next migration moves it by itself", which the third term makes false.
      (test_016_revises_015 is the correct, card-local link assertion and is fine.)
    suggested_fix: >
      Drop the trailing `== ["016"]`, leaving `assert script.get_heads() == [max(on_disk, key=int)]`,
      which is the property the docstring describes and which 017 moves by itself.

  - id: F-004
    severity: minor
    file: tests/test_puzzle_edit_store.py
    line: 684
    claim: >
      test_a_second_edit_moves_the_stamp_forward cannot fail: `second >= first` is satisfied by
      a stamp that never moved. Mutant M7 (write manually_edited_at only when it is currently
      NULL) survived the whole selection: 161 passed.
    evidence: >
      With the stamp frozen after the first edit, the AC-8 class still passes because
      test_the_stamp_is_set_and_the_quality_columns_are_untouched only asserts `is not None`
      and this test only asserts `>=`. A puzzle hand-edited three times would then report the
      staleness of the first edit, which is precisely the thing the timestamp-not-boolean
      decision was chosen to answer.
    suggested_fix: >
      Assert strict movement with a controlled clock (freeze/inject `datetime.now`, or stamp
      the first edit to a known past value before the second) so `second > first` is provable
      without depending on wall-clock resolution.

  - id: F-005
    severity: minor
    file: tests/test_puzzle_edit_store.py
    line: 468
    claim: >
      test_a_legacy_in_book_status_refuses_it_as_well is self-skipping with a tautological
      assertion, so the legacy `status == in_book` arm of AC-4 may be covered in name only.
    evidence: >
      `assert harness.store.mark_in_book(puzzle_id, harness.new_book_id()) in (True, False)`
      is true for any bool return, and the following `if not in_a_book(...): pytest.skip(...)`
      means a mode in which mark_in_book stops recording membership turns the test green by
      skipping rather than red. The house rule the project already applies to DB-mode tests
      ("DB tests skip silently" / assert a minimum case count) is the same hazard.
    suggested_fix: >
      Set the legacy status directly (memory: self.puzzles[pid]["status"] = "in_book"; sqlite:
      UPDATE puzzles SET status='in_book') and assert the refusal unconditionally, with no skip.

  - id: F-006
    severity: minor
    file: src/nonogram/admin/puzzle_review.py
    line: 1005
    claim: >
      save_edited_grid runs the gate before the verification check, so an *unverified* save
      buys a full solve and writes its proof into the 16-entry memo - evicting the owner's
      pending verifications even though the save is then refused.
    evidence: >
      Order is `_row_an_edit_may_touch` -> `_refuse_unless_uniquely_solvable` (which calls
      `_remember_proof` on a miss) -> `_refuse_unless_verified`. Sixteen POSTs to
      /puzzle/<id>/edit carrying distinct well-formed grids and no prior verify therefore cost
      sixteen solves and clear every remembered verification, forcing the owner to re-verify
      (EditNotVerified) mid-flow. It fails closed, so nothing wrong is stored; the cost is
      solver budget and a confusing refusal. The chosen order is defended in the docstring on
      message-quality grounds, which is reasonable - the eviction side effect is the part that
      is not reasoned about anywhere.
    suggested_fix: >
      Either check `_refuse_unless_verified` against the fingerprint before the gate and only
      fall through to the gate for a verified grid (keeping the uniqueness message for the
      verified-then-mutated case), or have the save read the memo without writing to it
      (`_remembered_proof` only) and let a miss raise EditNotVerified before any solve.

  - id: F-007
    severity: minor
    file: src/nonogram/admin/puzzle_review.py
    line: 318
    claim: >
      The two-phase flow's correctness rests on one process holding the memo, but the worker
      count is an operator-settable environment variable, not a constant.
    evidence: >
      start.sh:34 is `--workers "${WEB_CONCURRENCY:-1}"`. The implementation notes justify
      instance-local staging with "the panel runs one gunicorn worker (CARD-086 G-4,
      start.sh)". With WEB_CONCURRENCY=2 a verify served by worker A and the Approve routed to
      worker B gives EditNotVerified roughly half the time. It fails closed (nothing wrong is
      stored) but the owner sees "verify it again" intermittently with no explanation, and the
      panel's deployment is dashboard-managed, so the variable is not under repo control.
    suggested_fix: >
      Note the dependency where it can be seen - a one-line assertion or boot-time warning when
      WEB_CONCURRENCY resolves above 1, or a comment in start.sh next to the flag - so the
      coupling is discoverable from the knob rather than only from this card's notes.

  - id: F-008
    severity: minor
    file: src/nonogram/admin/app.py
    line: 2466
    claim: >
      The new routes are the first to accept an unbounded, caller-chosen grid for CPU work, and
      neither MIN_SIZE/MAX_SIZE nor a request body cap applies.
    evidence: >
      `_refuse_unless_shaped_like_a_grid` bounds shape but not size; there is no
      MAX_CONTENT_LENGTH anywhere in src/nonogram; `_grid_fingerprint` materialises one char
      per cell before the solve. The only brake is the solver's ADR-0011 deadline, which runs
      after compute_clues and the digest. Authentication (the before_request gate at
      app.py:1262) limits the blast radius to an authenticated operator, and the implementation
      notes put MIN/MAX_SIZE deliberately out of scope on add_puzzle parity grounds - but
      add_puzzle is not reachable with an attacker-chosen extent and these routes are.
    suggested_fix: >
      Either apply limits.MIN_SIZE/MAX_SIZE in the store's write path (one refusal, same place
      as the others) or set app.config["MAX_CONTENT_LENGTH"]; record which, and why, in the
      notes rather than leaving the asymmetry implicit.

  - id: F-009
    severity: nit
    file: src/nonogram/admin/puzzle_review.py
    line: 80
    claim: _Verification.shown_for is unbounded while the memo itself is LRU-bounded at 16.
    evidence: >
      MAX_REMEMBERED_VERIFICATIONS caps the number of entries, not the size of one. Verifying
      the same grid for every puzzle in the table accumulates one id string per puzzle in a
      single entry's set. Bounded in practice by the row count (a verify requires an existing,
      unbooked row), so this is a shape note rather than a leak.
    suggested_fix: Cap or LRU-bound shown_for, or document that the row count is its bound.

  - id: F-010
    severity: nit
    file: src/nonogram/admin/app.py
    line: 2478
    claim: >
      A non-UUID <puzzle_id> reaches get_puzzle in DB mode and raises ValueError, so a JSON
      route answers with the HTML 500 page.
    evidence: >
      get_puzzle (puzzle_review.py:1453) calls uuid.UUID(puzzle_id) unguarded;
      _row_an_edit_may_touch calls it first. approve_puzzle/reject_puzzle have the same hole via
      in_a_book, so this is parity rather than a regression - but those routes answer HTML, and
      these two advertise JSON, so the editor script will get an unparseable body.
    suggested_fix: >
      Catch ValueError/TypeError in the two new routes and answer the existing 404 JSON body,
      or screen the id in get_puzzle as get_puzzles already does.

  - id: F-011
    severity: nit
    file: src/nonogram/admin/puzzle_review.py
    line: 925
    claim: >
      _refuse_unless_verified reads self._verifications directly instead of through
      _remembered_proof, so a save does not refresh the entry's LRU recency.
    evidence: >
      The gate call immediately before it does move_to_end, so the recency is refreshed on the
      current path and nothing is wrong today; the asymmetry is a trap for whoever reorders the
      two calls (see F-006).
    suggested_fix: Read through one accessor, or say in a comment why this one does not.

  - id: F-012
    severity: nit
    file: src/nonogram/admin/templates/_puzzle_table.html
    line: 72
    claim: >
      The new marker reuses `class="badge rec"` with data-edited but no data-level, while every
      other `badge rec` on the page is styled by data-level.
    evidence: >
      The recognizability cell on the next line is `<span class="badge rec" data-level="...">`.
      A data-level-keyed rule set will leave the new badge unstyled. The route test asserts the
      wording, which is the right thing to assert, so this is invisible to the suite - and the
      owner validates visually.
    suggested_fix: Give it its own class or a data-level value the stylesheet handles.

  - id: F-013
    severity: nit
    file: src/nonogram/admin/puzzle_review.py
    line: 931
    claim: >
      The verify/save pairing keys on str(puzzle_id) as given rather than a canonical UUID, so
      a verify with one spelling and a save with another (uppercase vs lowercase hex) will not
      pair.
    evidence: >
      shown_for.add(str(puzzle_id)) vs `str(puzzle_id) not in verification.shown_for`, while
      get_puzzle resolves both spellings through uuid.UUID. Unreachable from the routes (both
      take the id from the same URL), fails closed, so a note rather than a defect.
    suggested_fix: Normalise once (str(uuid.UUID(puzzle_id)) when it parses) on both sides.

