    severity: low
    category: feature
    type: gap
    file: src/nonogram/admin/app.py
    line: 2063
    title: "The disagreement warning is never shown at the moment a disagreeing plan is saved"
    description: |
      A successful POST whose resulting plan disagrees with the split redirects to puzzle
      selection with a success flash; the AC-203 warning only appears if the owner reopens
      Print setup. AC-203 ("when Print setup is rendered") is met literally, but FR-034's
      "the screen warns" is missed at the one moment the owner is making the choice.
    suggestion: |
      When new_plan.disagrees_with_split, add a warning flash on redirect (or re-render the
      page with the warning instead of redirecting).
    confidence: medium
    source: static
    violates: null
    root_cause: null
