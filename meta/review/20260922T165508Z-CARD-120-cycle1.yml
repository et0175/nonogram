findings:
  - id: F-001
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/book_manager.py
    line: 1078
    title: "revise_plan ignores the stored edited set: a hand-edited cell equal to the current prefill silently loses its edit and is later re-derived"
    description: |
      revise_plan decides which cells are hand-edited only by comparing the submitted value
      with prefill(shown.count, shown.split); current.edited is never read. After with_split
      keeps an edited cell whose value happens to equal the new split's prefill (exactly
      AC-202/AC-203's 21-25 x hard = 15 at 30/45/25), the next submission of Print setup -
      even an untouched "Continue" - drops the edit mark, and any later split/count change
      re-derives the cell. Reproduced: edit 12->15 at 40/40/20 (edited kept), change split to
      30/45/25 (edited kept, value 15), resubmit unchanged -> edited == frozenset(); change split
      back to 40/40/20 -> cell reverts to 12. Violates objective 3 / FR-034 / POL-007
      ("hand-edited cells keep their values"). The page even labels the cell "(hand-edited)"
      right before the submit that discards it. Every pass through Print setup is a submit
      (the only button is "Continue"), so this is reachable in normal use.
    suggestion: |
      Carry the stored edit set forward: a cell is edited if its submitted value differs from
      the value the page showed (shown.cell), OR it was in shown.edited and was left unchanged,
      OR it differs from prefill(shown). Only a deliberate change back to the prefill value
      clears it. Add a regression test for the three-submission sequence
      (edit -> split change -> unchanged resubmit -> split change back) in both modes.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: 3275b92
    dismissed_reason: null
    learned_pattern: null
