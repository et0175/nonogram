  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/db/models.py
    line: 126
    title: "MutableDict tracks top-level keys only; the plan's data is in nested lists"
    description: |
      The comment says the column is mutation-tracked, but MutableDict only notices top-level
      key assignment. An in-place edit such as row.distribution_plan["cells"][2][2] = 20 is not
      flagged dirty and would be silently lost. Today's code always assigns a whole new document,
      so nothing is broken; the comment overstates the guarantee.
    suggestion: |
      Say in the comment that the document must be replaced whole (plan_to_json), or use a
      nested-mutable type. No code change needed while save_plan keeps replacing the document.
    confidence: high
    source: static
