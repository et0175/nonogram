  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2045
    title: "Refused or trim-failed submissions re-render the stored matrix and mark split fields invalid regardless of which field failed"
    description: |
      On a refused plan only count/split are carried back; the 12 submitted cells are replaced
      by the stored ones, so the owner's other matrix edits are lost. When the trim fails
      (line 2062) `submitted` stays None and the whole plan input is discarded. The template
      (book_setup_print.html:104) sets is-invalid/aria-describedby on the three split fields
      even when the error was the count or a cell, pointing assistive tech at the wrong field.
    suggestion: |
      Carry the whole submitted form back on any refusal, and mark invalid only the field(s)
      named by the error (e.g. return the offending field name with InvalidPlan from
      _plan_from_form).
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 3275b92
    dismissed_reason: null
    learned_pattern: null
  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 1985
    title: "A stored plan that fails decoding makes Print setup a 500 with no way to overwrite it"
    description: |
      plan_from_json raises InvalidPlan for a malformed document; _plan_context calls get_plan
      unguarded on both GET and POST, so a corrupted row turns /setup-print into an error page,
      the only screen that could repair it.
    suggestion: |
      In _plan_context (and the POST current-plan read), catch InvalidPlan, log it, show
      DEFAULT_PLAN with a danger alert, and let a submission overwrite the stored document.
    confidence: medium
    source: static
