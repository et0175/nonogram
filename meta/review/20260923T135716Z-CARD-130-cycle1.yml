findings:
  - id: F-001
    severity: high
    category: feature
    type: gap
    file: src/nonogram/admin/templates/_stepper.html
    line: 26
    title: "The fifth step makes 'Step N of 4' wrong on all four step pages, three of them unguarded"
    description: |
      Adding General info as step 0 grew the printed list to 1..5, but every step
      page's own prose and breadcrumb still says "of 4". The contradiction is on
      the same screen, not in a distant file: step5-finalise-desktop.png shows
      "Step 4 of 4 for Winter Animals" above a stepper whose step 5 "Finalise &
      export" is marked current; step3-puzzle-selection-mobile.png shows
      "Step 2 of 4" above a stepper marking step 3 current.

      Stale copy, by file:
        - book_setup_print.html:12        "Step 1 of 4"       (GUARDED by G-4 — CARD-118)
        - book_select_puzzles.html:7,24   "· step 2", "Step 2 of 4"   (NOT guarded — and this
                                          card edited this very file, adding the Steps card at :31-36)
        - book_arrange_puzzles.html:7,13  "· step 3", "Step 3 of 4"   (NOT guarded)
        - book_arrange_puzzles.html:122   "Go back to step 2"  (now step 3)
        - book_arrange_puzzles.html:141   "worked out in step 4" (now step 5)
        - book_finalize.html:6,12         "· step 4", "Step 4 of 4"   (NOT guarded)
      Only book_create.html:19 was updated ("Step 1 of 5").

      The card's Worktree notes record the choice to leave all four alone so they
      stay "consistent with each other". Judged against the rendered screens that
      reasoning does not hold: they are not consistent with the stepper standing
      beside them on every one of those pages, which is the comparison the reader
      actually makes. This is NOT a [BLOCKER] guardrail conflict — every AC of this
      card is deliverable without touching a guarded file, so nothing was blocked —
      but it is a gap the card should have closed for the three files it could.
      Reinforced by history: book_finalize.html is a co-change peer of app.py
      (3 of the last 20 app.py commits) and is absent from this diff.
    suggestion: |
      Renumber the three UNGUARDED templates in this card: book_select_puzzles.html:7,24;
      book_arrange_puzzles.html:7,13,122,141; book_finalize.html:6,12 — "of 4" → "of 5",
      "· step N" → "· step N+1", "step 2" → "step 3", "step 4" → "step 5".
      book_setup_print.html:12 is G-4's (CARD-118): hand it over in that card's notes or
      open a one-line follow-up card, rather than leaving all four wrong. Better still,
      derive the number from the same list the macro holds so the copy cannot go stale again.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 2016
    title: "The edit route's refusal path is untested and silently discards what the owner typed"
    description: |
      edit_book's `except ValueError` branch (app.py:2026-2027) flashes and falls
      through to `render_template("book_create.html", book=book)` at :2035 — and
      book_create.html fills every field from `book.metadata.*` (lines 39, 47, 54, 62),
      never from `request.form`. So a refused submission re-renders the STORED book
      and throws away everything the owner typed in the other three fields.

      This is reachable from a browser: HTML `required` does not reject a
      whitespace-only value, and `_refuse_invalid_details` (book_manager.py:404-411)
      rejects `"   ".strip() == ""`. Type "   " into Book title plus a rewritten
      Description → error flash, description gone.

      It also contradicts the convention this repo's sibling step already established
      under review: setup_print's docstring (app.py:2265-2267) records "the page
      re-renders with everything the owner submitted and only the failing field(s)
      marked invalid" as CARD-120 review F-003.

      And the branch has zero test coverage. tests/test_book_workflow_steps.py tests
      refusal only at the manager level (test_a_refused_field_stores_nothing, :489-504);
      no test posts an invalid submission to /book/<id>/edit at all (grep of "edit" in
      the file: lines 54, 398, 415, 447 — all valid submissions or GETs). A new error
      path with no negative-scenario test is exactly what Step 8f's static check names.
    suggestion: |
      Carry the submission back: pass `request.form` (or a `submitted` dict) into
      book_create.html on the refusal path and prefer it over `book.metadata.*` when
      present, as setup_print does. Add a route-level test: POST title="   " to
      /book/<id>/edit, assert 200 (not a redirect), assert the stored four fields are
      unchanged, and assert the re-rendered form still carries the submitted description.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/book_create.html
    line: 53
    title: "BOOK_THEMES was introduced to stop theme drift, then not used by the form"
    description: |
      book_manager.py:393-395 adds `BOOK_THEMES = ("christmas", "halloween", "easter",
      "valentine", "generic")` with the comment "Named here rather than repeated per
      caller so that creating a book and revising one cannot come to disagree".
      The diff then rewrote book_create.html's five static <option> tags into a loop
      over a hand-written literal list of the same five values — a second statement of
      the vocabulary, in the file the constant was meant to protect. Fan-in of
      BOOK_THEMES is 1: only `_refuse_invalid_details` reads it. Add a sixth theme to
      the domain and the form silently cannot offer it; remove one and the form offers
      a value the domain refuses.
    suggestion: |
      Expose the vocabulary to the template — a `@app.template_global()` beside
      book_step_links, or `themes=BOOK_THEMES` passed from create_book/edit_book — and
      loop over it, keeping the display labels in a single mapping. Then BOOK_THEMES
      has the two callers its docstring claims.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2022
    title: "A theme-less edit submission silently rewrites the stored theme to 'christmas'"
    description: |
      `theme=request.form.get("theme", "christmas")` at app.py:2022 mirrors create_book
      at :1982, which is defensible on creation (there is nothing to lose). On an EDIT it
      is a silent overwrite: any submission that omits the field — a programmatic POST, a
      future partial form, a disabled <select> — quietly resets an easter/valentine book
      to christmas instead of being refused. `_refuse_invalid_details` would reject a
      `None` theme loudly; the default is what prevents that.
    suggestion: |
      In edit_book use `request.form.get("theme")` with no default and let
      _refuse_invalid_details refuse a missing theme, as it already does for the other
      three fields (which are passed without defaults on the same call).
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

