    title: "The detail page's stepper shows no progress at all — five identical upcoming links"
    description: |
      `book_steps()` with current=None yields neither is-done nor is-current, so a
      pdf_generated book's detail page renders five identical teal links
      (book-detail-desktop.png). The reasoning in the card is sound — the page is the
      book, not one of its steps — but it means the one screen an owner returns to is
