findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/image_manager.py
    line: 109
    title: "derive_extent's ValueError (non-positive source shape) is not caught, crashing whole-batch page renders"
    description: |
      predict_size() (image_manager.py:68-121) calls derive_extent(stated, None, src_width, src_height)
      at line 109 and catches only SizeTooSmallForSource (line 110) and NonogramError (line 120). But
      derive_extent -> _checked_extents raises a plain ValueError (not a NonogramError subclass) when
      source_width <= 0 or source_height <= 0 (src/nonogram/sourcing/random_grid.py, via
      src/nonogram/sourcing/image.py's _checked_extents). src_width/src_height come from _source_shape()
      (image_manager.py:42-65), which falls back to self.dimensions on any exception from source_shape().
      self.dimensions can genuinely be (0, 0): add_image() (image_manager.py:240-246) defaults dimensions
      to (0, 0) and only overwrites it inside a bare `except Exception: pass` around a second, independent
      PILImage.open() on the copied temp file — a failure here (distinct from the upload-time validation
      open) leaves a stored, "successfully added" ImageFile with dimensions=(0, 0).
      When that happens, _source_shape() calls source_shape(self.file_path), which itself fails (the same
      degenerate file), so its except Exception clause falls back to self.dimensions == (0, 0), and
      derive_extent(stated, None, 0, 0) raises ValueError, uncaught.
      This propagates out of predict_size() into two unprotected render_template() calls:
      app.py:289-292 (`preview_batch_images` GET — the normal page users land on right after upload) and
      app.py:307-310 (`generate_batch_puzzles` GET confirmation page), both of which loop over ALL images
      via `{% set dims = image.predict_size() %}` in image_preview.html/generate_batch.html with no
      try/except around the render. One degenerate image in the batch would 500 the whole preview page for
      every image in it, not just the broken one.
      Note: this exact failure mode pre-dates this diff — the old predict_size() did
      `aspect_ratio = img_width / img_height` on self.dimensions directly, which raised an uncaught
      ZeroDivisionError for the same (0, 0) input. This diff does not newly introduce the crash, but it
      does add an `except NonogramError` clause specifically for defensive purposes around this exact
      function without covering the one case that was already broken — creating false confidence that the
      function is now safe against bad input.
    suggestion: |
      Either catch ValueError alongside NonogramError around the derive_extent call (image_manager.py:109),
      or validate src_width/src_height > 0 in _source_shape() itself before returning, falling back to a
      safe minimum extent (e.g. (MIN_SIZE, MIN_SIZE)) rather than propagating.
    confidence: high
    source: static
