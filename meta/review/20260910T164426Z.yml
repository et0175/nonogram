  - id: F-005
    severity: medium
    category: tech-debt
    type: risk
    file: src/nonogram/admin/image_manager.py
    line: 42
    title: "predict_size() now performs a full image decode + pixel scan synchronously in per-batch page-render loops"
    description: |
      Before this diff, predict_size() was pure arithmetic on self.dimensions, which is read cheaply at
      upload time (PILImage.open(...).size, a header read, no full decode). Now, _source_shape()
      (image_manager.py:42-65) calls nonogram.sourcing.image.source_shape() on first access, which fully
      decodes the image (load_greyscale) and scans every pixel (ink_bounding_box's Image.point + getbbox)
      for a lookup table over the whole raster. This is cached per-instance, but the first call per image
      pays the full cost, and it now happens inside two request-synchronous template loops:
      image_preview.html (`{% set dims = image.predict_size() %}` in a `{% for image in images %}` loop,
      rendered from app.py:289-292 with no pagination) and generate_batch.html (same pattern, app.py:307-
      310). The route's own docstring/validation allows up to 200 images per batch
      (app.py:256-257, "Must be 1-200 images"), each up to 2000x2000 px (image_manager.py:152,
      MAX_DIMENSIONS). A full-batch first page load now pays up to 200 synchronous PIL decodes + numpy
      bbox scans before the response is sent, where it previously paid none.
    suggestion: |
      Compute and cache the ink bounding box once at add_image() time (alongside the existing dimensions
      read), the same way dimensions is already captured up front, rather than lazily inside the
      render-time predict_size() call — or explicitly document/measure the acceptable batch-size ceiling
      this adds latency to.
    confidence: medium
    source: static
    root_cause: RC-3
    status: open
    fixed_in: null
    dismissed_reason: null
