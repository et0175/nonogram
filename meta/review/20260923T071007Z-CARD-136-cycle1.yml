  - id: F-005
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_trim_persistence.py
    line: 393
    title: "Three G-4 assertions are tautologies in memory mode (get_book returns the live object)"
    description: |
      In memory mode BookManager.get_book returns the stored Book instance itself
      (book_manager.py:566-568), so `before` and `after` in test_nothing_but_the_trim_columns_moves
      are the same object. `after.status == before.status`, `after.floor_overrides ==
      before.floor_overrides` and `after.updated_at >= before.updated_at` therefore cannot fail in
      the [memory] parametrisation whatever set_print_spec does; only the literal `== "draft"` and
      the copied before_ids/before_titles discriminate. The same applies to
      `get_book(book_id).updated_at == before.updated_at` at line 291. Both assertions do
      discriminate in the [db] parametrisation, so the guardrail is still covered — but at half the
      case count the file claims.
    suggestion: |
      Snapshot the compared fields before the write (copy.deepcopy(before), or capture
      before.status / list(before.floor_overrides) / before.updated_at into locals) the way the test
      already does for puzzle_ids and puzzle_titles.
