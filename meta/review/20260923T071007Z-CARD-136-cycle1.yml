    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 2205
    title: "set_print_spec's False return is ignored and the two writes are separate transactions"
    description: |
      book_mgr.set_print_spec(book_id, spec) returns False when the book does not exist
      (book_manager.py:691, 703) and the route ignores it: it flashes "Print specs set: W x H cm"
      and redirects to the selection step regardless. The book was read at the top of the handler
      (app.py:2108), so a book removed between that read and the write produces a success message
      for a write that did not happen. The pre-existing save_plan call at app.py:2172 has the same
      shape, so this is the second occurrence rather than a new pattern — but it is the one this
      card introduces.

      Related, and the reason it matters more here than for save_plan alone: in DB mode the two
      writes now commit in two separate sessions (save_plan's `with self._session_factory()` at
      book_manager.py:643-651, then set_print_spec's at :700-709). A failure between them leaves the
      plan saved — which also returned the book to draft — and the trim not, i.e. exactly the
      half-applied submission AC-197's rule exists to prevent, reached by a different door than a
      refusal.
    suggestion: |
      Check both return values and flash "Book not found" (and re-render or redirect to the books
      list) when either is False. If the plan and the trim must land together, give BookManager one
      writer that sets both inside a single session, and have setup_print call that.
    confidence: high
