findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 654
    title: "set_print_spec's docstring promises a validation guarantee the PrintSpec type does not carry"
    description: |
      The docstring states: "``spec`` must be a PrintSpec: PrintSpecValidator.create_spec has already
      refused a trim outside KDP's bounds and rounded it to the two-decimal centimetres the column
      stores, so nothing reaches storage that book_page_spec would not read back — the posture
      save_plan takes towards a DistributionPlan."

      The analogy does not hold. DistributionPlan and Split enforce INV-005 in their own
      __post_init__ (book_plan.py:178-186, 221-237), which is what makes save_plan's identical
      sentence true. PrintSpec (print_specs.py:18-36) is a plain, non-frozen dataclass with no
      __post_init__ and no validation at all, so the isinstance check at book_manager.py:682 proves
      only the type, never that create_spec ever ran.

      Reproduced against this worktree:
        set_print_spec(bid, PrintSpec("999", "abc")) -> True; stored columns "999"/"abc";
        book_page_spec(book) then raises "book trim_height_cm must be a number of cm, not 'abc'".
      That is precisely the state the docstring says cannot reach storage, and the state _trim_cm
      (app.py:2593) had to grow a "Cannot be read" branch for. PrintSpec(None, None) is likewise
      accepted and silently resets the book to the Book 1 profile.

      Same root cause one layer up: tests/test_book_trim_persistence.py:432
      `test_it_accepts_nothing_but_a_validated_spec` is named for the guarantee but its body only
      asserts that a *dict* is refused — an unvalidated PrintSpec is never tried, and the test file
      constructs PrintSpec(*SIX_BY_NINE_CM) directly throughout, which is itself the bypass.

      No live defect: the single production caller (app.py:2205) passes a create_spec result. The
      cost is that the guarantee a second caller will rely on is not there, on the one storage
      boundary the project elsewhere insists must not trust its caller (ADR-0032/R1, "No caller's
      assurance substitutes for that check").
    suggestion: |
      Either enforce it — run PrintSpecValidator.validate_trim_size(spec.trim_width_cm,
      spec.trim_height_cm) inside set_print_spec and raise ValueError on refusal (also rejecting
      None columns) — or reword the docstring to say the caller is trusted and name the caller that
      must validate. If enforced, extend
      tests/test_book_trim_persistence.py::test_it_accepts_nothing_but_a_validated_spec with an
      out-of-bounds PrintSpec and a PrintSpec(None, None), so the test's name matches its body.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: bug
    file: src/nonogram/admin/app.py
    line: 2222
    title: "Reopening Print setup in inches and saving unchanged silently shifts the stored trim"
    description: |
      The GET now prefills the two fields from the stored centimetre columns (app.py:2222-2223) and,
      when the session's unit preference is inches, converts them with cm_to_inches, which rounds to
      two decimals (print_specs.py:66-70). A save converts back with inches_to_cm, also to two
      decimals. For a trim that is not a whole/half inch the round trip is lossy, so pressing Save
      without touching anything changes the trim of record.

      Reproduced end to end through the real routes in this worktree:
        POST setup-print unit=cm 15.00 x 20.00  -> stored "15.00"/"20.00"
        GET  setup-print with unit_preference=inches -> fields show 5.91 / 7.87
        POST setup-print unit=inches 5.91 / 7.87 -> stored "15.01"/"19.99"
      The shift is one-shot (15.01 and 19.99 are round-trip stable), i.e. 0.1 mm, but it is a silent
      mutation of the value the PDF's page size and every cell measurement are taken from, and KDP
      rejects interiors whose trim is not one of its exact sizes. Before this card the form always
      showed the profile default, so this path did not exist.
    suggestion: |
      Keep the stored centimetres as the value of record: either render the inch field but submit
      the untouched cm value when the owner did not edit it, or store the unit the owner chose
      alongside the trim and convert only on an actual edit. At minimum, only display the inch form
      when inches_to_cm(cm_to_inches(stored)) == stored.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2227
    title: "The new except ValueError wraps both conversions, so one unreadable column renders the other in the wrong unit"
    description: |
      The try block added at app.py:2227-2236 converts width and height together and swallows a
      ValueError from either. When only one column is unreadable, the readable one is left in
      centimetres while the unit selector still reads "inches".

      Reproduced: stored trim_width_cm = "not a number", trim_height_cm = "27.94",
      session unit_preference = "inches" -> GET /book/<id>/setup-print returns 200 with
      width="not a number" and height="27.94" under an inches selector. Here a correcting save is
      refused (27.94 in = 70.97 cm, beyond the 48 cm height bound), but with a smaller stored height
      — e.g. "15.00" — the same correcting save would store 38.10 cm without any refusal.

      The branch is also untested: no test in the suite performs a GET of setup-print with
      unit_preference set to "inches" (grep of tests/ for "inches" returns only the two POSTs in
      tests/test_book_trim_persistence.py:154 and :205), so this negative path is unexercised.
    suggestion: |
      Convert each field independently, or fall back to rendering the form in cm (and say so in the
      unit selector) when a stored value has no inch form. Add the missing negative test: a GET with
      unit_preference="inches" over (a) a readable trim, (b) one unreadable column.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
