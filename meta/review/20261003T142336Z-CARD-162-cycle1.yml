      (tests/test_puzzle_solver_progress.py) and the Worktree note "setBoard ... to an unsolved
      one unlocks" both demonstrate the contrary. A declaration claiming a stronger lock than the
      code has — same class as CARD-161's gating stale header.
    suggestion: |
      Reword to "(once locked, only reset — or the setBoard seam, which replaces the board — can)"
      or drop the parenthetical.
