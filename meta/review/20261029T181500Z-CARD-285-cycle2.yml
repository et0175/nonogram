dead_ref_hygiene: >-
  This report syncs into main, where the check-ref search is a TEXT search over
  tracked non-Markdown files and meta/review/** is NOT excluded from it, so a
  whole `path::name` spelled here reads as a definition. Device used: every
  `path::name` string in this file was extracted by regex and checked against a
  real `^\s*(def|class)\s+<name>\b` at that path in the card worktree at
  79ecafcb. Exactly three whole `path::name` strings appear in this file and
  all three resolve to a real `def`:
  tests/test_public_player_pages.py::test_assembled_site_is_self_contained
  (`def` at :2397),
  tests/test_public_player_pages.py::test_the_registrys_refs_for_this_file_resolve_or_are_card_285s
  (:1870), and
  tests/test_public_player_pages.py::test_the_deploy_page_is_the_only_place_that_holds_an_endpoint
  (:3015). AC-391's and AC-392's nodes are referred to by AC id or by bare
  name only -- both are defined (:2577 and :2679, collected in this cycle), so
  spelling them would have been honest; they are simply not needed in full.
  NAMES DELIBERATELY NOT SPELLED AS `path::name`: the four mutants that rename
  a definition away are described rather than named, and ADR-0041/R2's
  book-title exemption node (F-102's subject) is referred to by description
  only -- spelling it here would add a FIFTH resolver to the very silencer the
  finding is about. For the same reason this file spells no truncated prefix of
  it either.
  SEPARATELY: NEITHER ANALYTICS ENDPOINT IS SPELLED ANYWHERE IN THIS REPORT, by
  URL or by host. That is belt-and-braces -- I verified with three staged probes
  that `tests/test_public_player_pages.py::test_the_deploy_page_is_the_only_place_that_holds_an_endpoint`'s
  `:!meta` pathspec hides meta/review/ and meta/kanban/ entirely, so cycle 1's
  landmine cannot be re-armed from here. Cycle 1's hygiene rule is lifted and
  this report keeps it anyway.

