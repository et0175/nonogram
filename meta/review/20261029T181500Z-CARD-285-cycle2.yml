verdict: >-
  The fix round did what it said for five of its six claims, and I drove each
  one rather than reading the report. F-001 is genuinely closed: removing
  AC-390's route line reds the test, and a request tape over the same journey
  with the route in place shows 19 requests, one non-same-origin target, ZERO
  foreign responses and three aborts -- the same 19-request journey cycle 1
  taped with three HTTP 200s. F-003 is closed and the defusal is driven with
  three staged probes: `:!meta` hides meta/review/ AND meta/kanban/ while a
  second copy in docs/ still reds. F-002's two measured silent passes, F-005's
  two unreadable sinks and F-006's block split each have a control that dies
  when I mutate the line it names -- four mutants, four different assertion
  lines. F-008 is closed well: the bound now sits in the deploy page beside
  the R6 claim, and drift step 4 records that the "do not count locally" rule
  binds the suite. AC-392's rewording is cycle 1's wanted wording verbatim,
  it is NOT an AC weakened to match a weaker test -- it is strictly stronger
  than what it replaced -- and it adds no validator warning.

  The score is held below min_score by ONE gating finding, and it is the
  SAME defect class as cycle 1's F-002, one level up. The `//` form got a
  lookbehind; the two DOTALL block forms at :2017-:2018 did not, and they have
  no guard at all. Measured on a copy of the clean counted site: a `/* */`
  pair whose delimiters sit inside string literals swallows a live
  `s.src = "//host/x"` (JS) and a live `url("//host/x")` (CSS); an
  `<!-- -->` pair whose delimiters sit inside attribute values swallows a live
  `<script src="//host/x">`; and a `//` inside a regex literal swallows a
  following `fetch("/gone.json")`. All four are SILENT PASSES. That is exactly
  the clause this round promoted into AC-392's own `then:` -- "a reference
  shape the scan cannot classify is a failure" -- so the AC is right and the
  test does not keep it. And the round REMOVED the one sentence that used to
  admit the hazard: af160fd5's `_without_comments` declared "a string whose
  content held a bare `//` would be truncated"; 79ecafcb declares only the
  quote-led residual and calls it "the safe direction".

  Two things in the brief are measurably wrong and one of them is the
  correction the orchestrator told me to carry. See corrections_to_the_record
  -- the short version is that the validator greps the WHOLE `path::name`, the
  guard's bare-name sets resolve nothing, and main IS two warnings quieter
  than honest. Commit b440b490's original record was right.

