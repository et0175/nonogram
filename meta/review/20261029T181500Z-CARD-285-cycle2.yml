      gave that form a lookbehind (:2019) and I confirmed it works (mutant M4
      kills the control). It left the other two forms alone:

          :2017  re.compile(r"/\*.*?\*/", re.DOTALL)
          :2018  re.compile(r"<!--.*?-->", re.DOTALL)

      Neither has any guard, and both cross lines. `_without_comments` runs
      them over the WHOLE file before `_ATTR_TARGET`, `_IMPORT_TARGET`,
      `_CSS_TARGET`, `_URL_LITERAL` and `_PROPERTY_SINK` read it, so a
      delimiter pair anywhere -- including inside string literals and
      attribute values -- blanks everything between and takes live references
      with it. `_ABSOLUTE_TARGET` runs on the unstripped text and catches a
      full `https://` URL, so the evasion is exactly the protocol-relative
      form: the one cycle 1 called "the single cheapest way to add a tracker
      to a static site".

      MEASURED, each planted alone into a copy of the clean counted site
      inside the module's own `counted_site` fixture, scanned with the real
      `scan_site(probed, ALLOW_RUNTIME, ALLOW_STATIC)`, baseline asserted
      clean in the same run:

        zz-a-block-swallow.js      *** SILENT PASS ***
            const open = "/*";
            const s = document.createElement("script");
            s.src = "//evil.example/t.js";
            const close = "*/";
            stripped = 'const open = "\n\n\n";\n'

        zz-j-css-block-swallow.css *** SILENT PASS ***
            a{content:"/*"}
            @font-face{src:url("//evil.example/f.woff2")}
            b{content:"*/"}
            stripped = 'a{content:"\n\n"}\n'

        zz-b-html-swallow.html     *** SILENT PASS ***
            <p data-x="<!--"></p>
            <script src="//evil.example/t.js"></script>
            <p data-y="-->"></p>
            stripped = '...<p data-x="\n\n"></p>\n'

        zz-d-regex-literal.js      *** SILENT PASS ***
            const re = /\/\//; fetch("/not-in-this-tree.json");
            stripped = 'const re = /\\/\\\n'

      Each of those references is a shape the scanner's own pattern set reads
      perfectly well when it survives: the same `src="//evil.example/t.js"`
      planted without the delimiters is CAUGHT as `foreign`, which is the
      round's own probe-protocol-relative control.

      Why it is gating and not a note:
      (a) it falsifies AC-392's `then:` as this round rewrote it -- "a
          reference shape the scan cannot classify is a failure" -- in a
          security-shaped AC, and the AC/EC gate reads the AC;
      (b) it falsifies `scan_site`'s own qualified claim, which is careful
          about sinks "not in its set at all" and silent about references the
          stripper destroys: these ARE in the set;
      (c) it falsifies docs/deploy/player.md's allow-list sentence, "fails on
          every external reference it finds that is not here", for the same
          four shapes;
      (d) it is the same defect class that gated cycle 1, one level up, so
          fixing only the reported instance is the pattern the board keeps
          repeating.

      AND THE ROUND MADE THE RECORD WORSE WHILE FIXING THE CODE. At af160fd5
      `_without_comments` declared the unsafe residual: "a string whose content
      held a bare `//` would be truncated. Nothing in the served tree has one,
      and the cost of a false strip is a missed reference inside a string". At
      79ecafcb that sentence is gone; what is declared instead is only the
      quote-led case, labelled "the safe direction (a comment that is read as
      code can only produce a finding, never hide one)". The residual that can
      hide a finding is no longer written anywhere, and it still exists
      (zz-d). A reader of the current docstring would conclude the only
      residual is harmless.
    reproduction: >-
      Scratch detached worktree at 79ecafcb with PYTHONPATH=<copy>/src and
      nonogram.__file__ asserted under the copy. A probe test appended to the
      module (so it can take `counted_site`) that copytrees `report.site_dir`,
      asserts the baseline scan clean, then writes each plant above into the
      copy one at a time, prints `scan_site(probed, ALLOW_RUNTIME,
      ALLOW_STATIC)` filtered to the plant's own filename plus
      `_without_comments(body)`, and unlinks it. Output above. The file's blob
      hash was asserted back to 6bb15ab0... afterwards.
    recommendation: >-
      Do not let a block form start where a quote has already opened a string.
      The cheapest shape that matches the `//` fix is a lookbehind on each
      block opener -- `(?<![:"'`])/\*` and `(?<![:"'`])<!--` -- which is one
      character class each and kills three of the four plants; the regex-literal
      case wants the `//` form's lookbehind extended with `\\` and `/`. A
      stronger and simpler alternative is to stop trusting the stripper for
      this: run `_URL_LITERAL` and `_ATTR_TARGET` over the UNSTRIPPED text the
      way `_ABSOLUTE_TARGET` already is, and keep the strip only for
      `_IMPORT_TARGET` and `_CSS_TARGET`, which are the two patterns the
      measured false positives came from (player.css's English prose and
      solver_state.js:6's documented panel path). Either way: add each of the
      four plants to `test_no_homegrown_tracking`'s control set, so the fix
      has a control the way F-002's did, and restore a declaration of the
      residual that CAN hide a finding to `_without_comments`' docstring and
      to the deploy page's bound paragraph.
    confidence: high
    source: measured

  - id: F-102
    severity: medium
    category: maintainability
    type: gap
    gating: false
    file: tests/test_public_player_pages.py
    line: 92
    title: "The module docstring's ref table is a literal-set silencer for ADR-0041/R2's check ref, and the rewritten guard does not hold that line -- mutant SURVIVED"
    description: |
      The guard reads `refs` out of requirements.yml only. ADR rule check refs
      and trace entries are not in it. The module docstring's table carries
      SEVEN whole `path::name` strings; six are held both ways by
      `card_284 | card_285 <= defined` and the per-name `in table` loop. The
      seventh -- ADR-0041/R2's own check ref, the book-title exemption node
      CARD-284 flipped live at 8492b63c -- is held by nothing.

      MUTANT M-R4, and it SURVIVED: rename that `def` by one character and
        * tests/test_public_player_pages.py -> 33 passed, 0 skipped;
        * `grep -c "def <name>("` -> 0, and no definition exists anywhere;
        * `git grep -lw "<the whole path::name>" -- . ':(exclude)meta/architecture' ':(exclude)*.md'`
          still returns FOUR tracked files: this module's own docstring table,
          player/assemble.py, tests/test_public_player.py, and a CARD-284
          review YAML.
      So a MANDATORY ADR rule -- R2, the no-answers rule -- would read as
      mechanically checked with zero definitions, and nothing in the suite
      says so.

      The docstring argues the opposite in its own words: the table line exists
      "so that the string is greppable from code the moment the flip happens",
      because the prior resolvers were "two files that could lose a sentence
      without anybody noticing the ref had died with it. The defining module is
      the one place that cannot." Measured: as the table is held today, it can.
      The line was written before the flip, when the ref was deliberately
      un-named; after the flip nothing extended the hold to it.

      This is precisely CARD-308's subject arriving by an unlisted route, and
      CARD-285 is where it is visible. It is NOT, however, the route the brief
      named: `card_284` and `card_285` hold BARE names, and the validator
      resolves an AC `test:` by the whole `path::name`, so those sets silence
      nothing (see corrections_to_the_record).
    reproduction: "Scratch worktree at 79ecafcb; `sed -i ''` rename of the one `def` line (needle count asserted 1), then the git grep above and the module run; blob restored to 6bb15ab0..."
    recommendation: >-
      Hold the table to what it spells rather than to a hand-written subset:
      collect every `tests/<this file>::(\w+)` string out of `__doc__` and
      assert that set is a subset of `defined`. Four lines, it covers all seven
      today and every one added later, and it makes the docstring's "the
      defining module is the one place that cannot" true as written. Then say
      in the card that the hazard was found here and what shape it has, so
      CARD-308 inherits a measured instance rather than a theory.
    confidence: high
    source: measured

  - id: F-103
    severity: medium
    category: correctness
    type: inaccuracy
    gating: false
    file: scripts/assemble_player_site.py
    line: 208
    title: "The deploy helper COUNTS BY DEFAULT, so \"Do not count locally\" is a rule with no mechanism -- and the card's record says the default is the other way"
    description: |
      Two layers, opposite defaults, and only one of them is written down:
        * player/assemble.py takes `analytics=None` by default -- the card's
          "default-off" is true here, and every fixture goes through it;
        * scripts/assemble_player_site.py, the documented entry point, is
          OPT-OUT: `--no-analytics` at :208, and `if not args.no_analytics:` at
          :220 reads the deploy page and injects the tag. A bare
          `python scripts/assemble_player_site.py` produces a COUNTED tree.

      The card's round-1 record says: "the snippet is injected at assembly
      time, default-off ... With no flags -- every fixture, every local run --
      no tag is written." The second half is false for the helper, which is
      what a human runs. docs/deploy/player.md's drift step 4 then makes "Do
      not count locally" a rule enforced by remembering a flag, in a card whose
      whole subject is that a control which cannot fail is not a control
      (ADR-0039/R2's own framing, which this round promoted into AC-392).

      Not gating: the owner's numbers are the only thing at risk, the vendor is
      documented as skipping a 127.0.0.1 host (unasserted, as cycle 1 noted),
      and the suite never goes through the helper's main(). But it is the one
      place in this card where the safe path is the one you have to remember.
    reproduction: "Read of scripts/assemble_player_site.py:188-231 at 79ecafcb, against the card's round-1 'Resolution' paragraph and docs/deploy/player.md drift step 4."
    recommendation: >-
      Either invert it -- make counting opt-IN (`--analytics`) so the default
      obeys the documented rule and the deploy step is the one that is
      explicit -- or, if the helper must stay deploy-shaped, say so in the same
      breath as drift step 4 ("the helper counts unless told not to") and
      correct the card's 'every local run' sentence. The flag names in the doc
      and in argparse agree today; nothing holds them to each other, which is
      a second, cheaper thing to add.
    confidence: high
    source: measured

  - id: F-104
    severity: low
    category: testing
    type: inaccuracy
    gating: false
    file: tests/test_public_player_pages.py
    line: 2613
    title: "\"F-004…F-008 all taken\" is not accurate: F-007's code half was not taken, and `assert len(hosts) >= 1` is still the weak floor"
    description: |
      The fix round's record says "**F-004…F-008** all taken" and then
      enumerates four fixes: the comment-stripping control (F-004), the
      Worker/_PROPERTY_SINK sinks (F-005), the two-block split (F-006), and
      the deploy-page bound (F-008). F-007 is inside that range and is not in
      the list.

      What F-007 asked for, and what happened:
        * "exempt by the located URL alone, drop `host in entry[0] or`" --
          NOT done, and defensibly so: the predicate at :2659 is still the
          disjunction, and AC-391's docstring now ARGUES for it ("the
          disjunction is what keeps the exemption from depending on which of
          the two Chromium happens to fill in"). That is a legitimate refusal,
          and M-D's property survives either way. The three documents that
