findings:
  - id: F-001
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/image_to_puzzle.py
    line: 21
    title: "Admin-generated image-mode puzzles have no verified unique solution — the solver never runs"
    description: |
      image_to_grid() (image_to_puzzle.py:21-49, since ec18fb4 delegating to
      sourcing.image.generate) and create_puzzle_from_image() (lines 117-177) never call
      nonogram.solver or nonogram.orchestrator. The canonical pipeline for image mode
      (orchestrator.py:1231-1275, inside generate()) is materially different: it calls
      judge_candidate() on the converted grid (which runs the grid through clue derivation
      and the solver's uniqueness check), and if the candidate is NOT uniquely solvable, runs
      POL-002's bounded pixel-nudge loop (image_source.nudge + re-judge, up to a configured
      bound) specifically because a dithered image conversion has no guarantee of producing a
      uniquely-solvable nonogram — see the orchestrator module's own comment at line 1232:
      "the conversion runs exactly once... recovery is POL-002's bounded nudge instead" and
      raises GenerationAbandoned if no nudge attempt succeeds.
      Admin's image_to_puzzle.py has none of this: image_to_grid() returns whatever grid
      sourcing.image.generate() produces, and create_puzzle_from_image() computes clues and
      difficulty/quality directly from it with no solver call at any point. A grid produced
      this way can have zero solutions (self-contradictory — impossible for a human to solve)
      or multiple solutions (ambiguous — not a "logic puzzle" in the sense the rest of this
      product promises) and nothing in the admin pipeline would detect or report it. The
      puzzle is stored via puzzle_review.add_puzzle() (puzzle_review.py:149-229), which is a
      pure passthrough with no independent verification (grep-confirmed: no solver/clue
      cross-check anywhere in that function), and reaches the DB and the export flow as if it
      were as trustworthy as an orchestrator-verified puzzle.
      difficulty_score/difficulty_tier for these puzzles (image_to_puzzle.py:126-136) is
      computed purely from grid size ((width+height)/2, bucketed) — a direct symptom of the
      same bypass: there is no SolverSignals object to feed nonogram.difficulty.score_difficulty
      (which requires line-logic coverage, backtracking depth, and solve time from an actual
      solve), so admin substitutes a number that has no relationship to how hard the puzzle
      actually is, or whether it is solvable via logic at all.
    suggestion: |
      Route image-mode admin generation through orchestrator.generate() per image
      (GenerationRequest(mode="image", image=Path(file_path), image_filename=..., width=w,
      height=h)) instead of image_to_puzzle.create_puzzle_from_image(). This gives admin the
      same uniqueness guarantee, nudge recovery, and real difficulty score the CLI/web path
      already has "for free" — orchestrator.generate_batch() is NOT a drop-in replacement here
      (it has no per-item image-path parameter; it would need one puzzle per orchestrator.generate()
      call in a loop, as batch_generator.py already does for random mode via generate_batch()).
      Handle GenerationAbandoned per-image the same way app.py:372-373 already handles other
      exceptions in the batch loop.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/batch_generator.py
    line: 310
    title: "quality_score is a hardcoded constant (75) for every random-mode puzzle, and drives a real, silently-ineffective user-facing filter"
    description: |
      batch_generator.py:310 and :463 both do
      `quality_score = puzzle.quality_score if hasattr(puzzle, "quality_score") else 75`
      against a `puzzle` returned by orchestrator.generate_batch()/generate(). Grep-verified:
      orchestrator.py's Puzzle class (defined at line 505) has NO quality_score attribute
      anywhere in the file. The hasattr check is therefore always False, and every single
      random-mode puzzle generated through the admin panel has been stored with
      quality_score == 75, unconditionally, regardless of the puzzle's actual content.
      This is not cosmetic: app.py:75-76's batch-creation form exposes "Minimum Quality
      Score" as a real filter, and app.py:350 does
      `if puzzle_data["quality_score"] < quality_filter: continue` — silently dropping
      puzzles from the batch. For random-mode batches this filter is inert by construction:
      every candidate puzzle scores exactly 75, so the filter either passes the whole batch
      (threshold <= 75) or rejects the whole batch (threshold > 75) — it can never
      discriminate between an actually-good and an actually-bad puzzle, though the UI
      presents it as if it does. quality_score is also rendered directly to users as
      "Quality: X/100" in batch_status.html:144, book_select_puzzles.html:125,
      generated_puzzles.html:65, and puzzles_list.html:160/325.
    suggestion: |
      Either wire orchestrator's Puzzle to expose a real quality signal (see F-003's
      suggestion — nonogram.analysis.quality_metric already computes one, just for
      image-vs-generated comparison; a random-mode equivalent would need a different
      metric, e.g. derived from solver signals or clue density), or remove the "Minimum
      Quality Score" filter from the UI until a real measurement exists — a filter that
      cannot discriminate is worse than no filter, because it implies a guarantee that
      does not hold.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/image_to_puzzle.py
    line: 129
    title: "recognizability is hardcoded to 'medium' everywhere; a real, tested implementation exists and is never called"
    description: |
      image_to_puzzle.py:175 hardcodes `"recognizability": "medium"` for every image-mode
      puzzle (comment: "Images always medium recognizability" — stated as if it were a
      domain fact, not an implementation gap). batch_generator.py:311 and :464 do
      `getattr(puzzle, "recognizability", "medium")` against orchestrator.Puzzle, which
      (grep-verified) has no such attribute either — so random-mode puzzles get the same
      hardcoded "medium", always.
      Meanwhile src/nonogram/analysis/quality_metric.py defines a complete, purpose-built
      Recognizability enum (HIGH/MEDIUM/LOW, matching the DB's string values exactly) and a
      QualityMetrics dataclass (visual_similarity, silhouette_match, density_match,
      recognizability, quality_score) with a measure_quality() entry point — precisely the
      shape needed to compute both F-002 and this finding's fields for real, by comparing
      the generated grid against the source picture. It has its own passing test suite
      (tests/test_quality_metric.py) and is imported only by
      src/nonogram/generation/random_generator.py (itself never imported by any production
      code — see F-005) — zero production callers anywhere in cli/web/admin.
      meta/architecture/inputs/v2-batch-generation.md:75 lists "quality_score
      (auto-calculated)" as a raw requirement — the intent was real computation; the shipped
      code is a constant. This is model/intent-vs-reality drift, not merely an unimplemented
      feature quietly deferred: the code presents a specific, plausible-looking value ("medium",
      75/100) as if it were measured.
    suggestion: |
      Wire nonogram.analysis.quality_metric.measure_quality() into image-mode generation
      (compare the generated grid against the source picture it was derived from) — this
      closes both F-002 (image mode's half) and this finding for image mode directly. Random
      mode has no "source picture" to compare against, so its quality/recognizability need a
      different, explicitly-defined metric — or the fields should be nulled/omitted for
      random-mode puzzles rather than defaulted to a value indistinguishable from a real one.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/image_to_puzzle.py
    line: 91
    title: "Clue generation is reimplemented ad-hoc instead of calling nonogram.clues, dropping its ragged-grid guard"
    description: |
      image_to_puzzle.py's generate_clues() (lines 79-114) reimplements run-length clue
      encoding locally (its own encode_line at lines 91-103) instead of calling
      nonogram.clues.compute_clues()/encode_line() — which admin already imports and uses
      correctly elsewhere: app.py:1295-1296 calls `clues.encode_line(row)` /
      `clues.encode_line(...)` directly for a different code path. So admin is internally
      inconsistent about whether to reuse the canonical encoder or reimplement it.
      Two concrete divergences from the canonical version (src/nonogram/clues.py:64-83,
      87-103): (1) it returns `list`s (`clues if clues else [0]`) rather than the ADR-0012
      boundary `tuple`s nonogram.clues.encode_line/compute_clues return; (2) it has no
      equivalent of compute_clues's `zip(*grid, strict=True)` ragged-grid check — the
      canonical module's own docstring explains why that check exists: "A ragged grid is a
      programming error... and raises ValueError... rather than silently truncating the
      columns to the shortest row, which would produce clues that quietly disagree with the
      grid and so violate INV-001 without anything failing." Admin's version has exactly
      that failure mode available: `for j in range(width): column = [grid[i][j] for i in
      range(height)]` (lines 109-111) would raise an IndexError on an actually-ragged grid
      (not silently truncate), which is a different but still uncontrolled failure than the
      canonical module's explicit, named error.
    suggestion: |
      Replace generate_clues()'s body with a call to nonogram.clues.compute_clues(grid),
      converting the returned Clues namedtuple's rows/columns tuples to lists at the call
      site if create_puzzle_from_image's callers specifically need list-typed clues (check
      puzzle_review.add_puzzle's storage layer — DB JSON columns likely don't care either way).
    confidence: high
    source: static
    violates: null
    root_cause: RC-3
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/generation/random_generator.py
    line: 8
    title: "nonogram.generation and nonogram.analysis are undocumented, orphaned packages with a broken import style"
    description: |
      src/nonogram/generation/ and src/nonogram/analysis/ are not mentioned in
      src/nonogram/__init__.py's own architecture docstring (the package's own stated
      "canonical map": cli, web, orchestrator, sourcing, clues, solver, difficulty, export —
      nothing else). Grep-verified: nothing in src/nonogram/{cli.py,web/**,admin/**,
      orchestrator.py} imports either package; their only importers are each other
      (generation/random_generator.py imports analysis) and their own dedicated test files
      (test_random_generator.py, test_quality_metric.py, test_strategy_counter.py).
      random_generator.py:8-9 imports via `from src.nonogram.analysis...` — an absolute
      import rooted at the repo's `src/` directory name, not the installed/importable
      `nonogram` package every other module in the codebase uses. This only resolves because
      `python -m pytest` (the way this project's test suite is invoked) prepends the current
      working directory to sys.path, making the bare `src` directory importable as a
      namespace package from the repo root. Any other invocation style (the installed
      `nonogram` console script, `pytest` without `-m`, a different cwd) would raise
      ModuleNotFoundError on this import. Since nonogram.analysis.quality_metric is also
      importable directly as `nonogram.analysis.quality_metric` (confirmed — it's how F-003's
      suggested fix would import it), a caller mixing both import styles for the same module
      would get two distinct Python module objects for the same file, with incompatible class
      identities (isinstance failures between them) — not currently exercised anywhere, but a
      latent footgun if this package is ever wired into production per F-002/F-003's suggestion
      without first fixing this import.
    suggestion: |
      Before wiring nonogram.analysis into any production path (per F-002/F-003), fix
      random_generator.py:8-9 to `from nonogram.analysis...` (matching every other import in
      the codebase), and either document generation/ and analysis/ in the package's
      architecture docstring and meta/architecture model, or confirm they're superseded/dead
      and remove them — their current undocumented, unwired state is itself the drift.
    confidence: high
    source: static
    violates: null
    root_cause: RC-4
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

