  - id: F-009
    severity: low
    category: tech-debt
    type: gap
    file: meta/architecture/decisions/adr/0013-difficulty-scoring-formula.md
    line: 1
    title: "No ADR/invariant governs puzzle uniqueness, quality_score, or recognizability for admin's generation paths"
    description: |
      system_rules.py --scope 'src/nonogram/**' returns 8 rules, none of which constrain
      quality_score, recognizability, or uniqueness verification outside the aggregate
      orchestrator.Puzzle itself defines (INV-002, scope_unmapped_model — no trace.yml).
      admin's generation paths construct puzzle data as plain dicts, never instantiating
      orchestrator.Puzzle, so even a resolved INV-002 would not mechanically reach them. This
      is the structural reason F-001/F-002/F-003 could exist for as long as they evidently
      have without a system-contract check ever catching them (same pattern as CARD-048 from
      the previous review, here for a much more consequential area).
    suggestion: |
      Once F-001 routes admin through orchestrator.generate(), INV-002 starts applying
      mechanically. For quality_score/recognizability, consider a new ADR/CON stating the
      real metric's definition and scope (once F-002/F-003 are fixed) so future drift is
      mechanically checkable rather than rediscovered by review.
    confidence: medium
    source: model
