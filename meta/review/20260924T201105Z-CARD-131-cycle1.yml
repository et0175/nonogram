      says the guard exists precisely so the published decision cannot go stale:
      "the published refusal included, which is why no separate status re-check
      is needed beside this one". The remove side now carries the same decision
      with none of that protection.

      Failure scenario (DB mode): the book is draft when `get_book` reads it and
      is published by the time the write session commits; the puzzle is removed
      from a published book with no confirmation — INV-008 bypassed. EC-033 still
      holds through the race because the remove path demotes unconditionally.

      Probability is genuinely low: the panel binds loopback only (CON-015) and
      has one owner. Rated low for that reason, not because the asymmetry is
      intended — nothing in the diff or the worktree notes explains it.
    suggestion: |
      Either re-read the row's status inside the writing session and return
      `RemoveOutcome(False, needs_confirmation=True)` on drift, or adopt the add
      path's `_verdict_state` comparison. If the asymmetry is deliberate, say so
