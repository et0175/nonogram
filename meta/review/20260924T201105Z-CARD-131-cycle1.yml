    title: "A confirmation page that dropped the owner's floor overrides passes every test (surviving mutant)"
    description: |
      [static] Mutation M19: replacing
      `+ [(f"override_{pid}", "on") for pid in overrides]` with `+ []` in the
      selection step's `_ask_to_confirm` call leaves the whole card scope green
      (tests/test_book_published_confirm.py + tests/property/test_book_workflow.py
      + tests/test_book_floor.py: 148 passed).

      Failure scenario: the owner is on /book/<id>/select-puzzles for a published
      book, ticks a puzzle that prints below the 4.8 mm floor AND ticks its
      override control, and submits. The store asks for confirmation (nothing
      measured, nothing written). The owner presses "Confirm change". If the
      override hidden fields were ever lost from the carried submission, the
      re-POST's `_submitted_overrides(kept_ids)` (app.py:2801) returns `[]`, the
      store's floor pass refuses the puzzle by name, and the owner is told their
      explicitly-overridden puzzle is below the floor — with no indication that
      the confirmation screen is what ate their decision. INV-006 and INV-008
      interact here and nothing tests the interaction.

      Every confirmation test in the new file adds a single, above-floor puzzle,
      so the `overrides` leg of the carried submission is exercised by nothing.
    suggestion: |
      Add a store-and-route test: published book, selection step, one below-floor
      puzzle with `override_<id>=on` ticked; assert the confirmation page carries
      the `override_<id>` hidden field, drive `resubmit_confirmation`, and assert
      the puzzle joined AND `floor_overrides(book_id) == [that id]`. Both storage
      modes for the store half.
