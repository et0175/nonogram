    title: "The remove path's published check has no in-session re-check, unlike the add path's"
    description: |
      [static] `remove_puzzle_reporting_confirmation` reads the book through
      `self.get_book(book_id)` (line 1346, its own session in DB mode), decides
      the published question on that snapshot (1350-1357), then opens a *new*
