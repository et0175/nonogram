      every session into that name. CLAUDE.md line 42 now ends "the closed set the layering guard
      holds them to is `tests/test_cli.py`'s `_ADAPTERS`", so a reader who came for the adapter set
      is sent there deliberately. What they find: the VALUE is correct --
      `_ADAPTERS = frozenset({"cli", "web", "admin"})`, three names, which I verified matches the
      canonical map's three adapter rows. The PROSE around it is not, in all three places you
      measured: the module comment above it says "this set is closed at two names", the test is named
      `test_the_adapter_allowlist_is_closed_at_the_two_known_adapters`, and its docstring's first line
      says "ADR-0019's allowlist is two names, and staying two names is the rule" -- while the test
      body asserts `_ADAPTERS == {"cli", "web", "admin"}` and `_rank("admin") == _ADAPTER_RANK`.
      Why it is not blocking: the reader lands on the right set, and CLAUDE.md's own text is now
      count-free, so the net change for the reader is an improvement over "cli.py ... the only
      inbound adapter". But the specific failure mode the pointer newly enables is a reader
      concluding that "admin" is the erosion the guard warns about and that the set should be two --
      i.e. acting on the lying name to REMOVE a correct entry. That is a worse outcome than the stale
      count it replaced, and it is reachable only because of this card.
