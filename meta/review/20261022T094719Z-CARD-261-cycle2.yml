      assumed; `admin/`'s CAP-006 hole is pinned at exactly one name; the English-description hole is
      asserted to be a hole. The two gaps are I-1 and M-1.
  - rule: ADR-0006/R1 -- closed dependency baseline
    verdict: MET
    evidence: pyproject.toml untouched; the one import added across the card is stdlib `re` in a test file.
  - rule: "ADR-0007 -- layering: capability modules import neither cli, the orchestrator, nor each other"
