figures_re_derived:
  - figure: 13 rows in the canonical map / 13 components in the package
    method: >-
      `python -I` with the worktree's src first on sys.path, printing nonogram.__file__ to prove the
      main checkout's editable install did not answer. Independent of pytest.
    result: REPRODUCES
  - figure: "the five-row CAP coincidence, and admin as the only loose CAP mention"
    method: >-
      Re-derived twice and independently of the test. First by eye over `grep -n '^\s*Component'` on
      the puml: the five declarations whose fourth argument LEADS with a CAP id are sourcing/CAP-001,
      clues/CAP-002, solver/CAP-003, difficulty/CAP-004, export/CAP-005; admin's names CAP-006
      mid-sentence ("... and CAP-006 Book assembly (ADR-0033 ...)"); ComponentDb(persistence) names
      none. Second by running `_c4_components` in isolation -- 10 pairs, exactly those five carrying
      a CAP id. Against the canonical map, `_map_row_ids` gives exactly five rows with a CAP id, the
      same five modules, the same five ids. So the five-row agreement is not a coincidence resting on
      luck: it is one convention (lead the description with the capability) applied to exactly the
      five capability modules, and both artefacts follow it. The residual hole is one wide and it is
      `admin`.
    result: REPRODUCES
  - figure: "_id_defects' ten defect kinds -- all real, all distinct"
    method: >-
      Built 12 fabricated inputs and ran the shipped `_id_defects` on each. All ten keys fire for at
      least one input, so no kind is dead. Then checked distinctness exhaustively over all 90 ordered
      pairs: for each pair (i, j), is there an input where i fires and j does not? 86 pairs separated
      on the first 10 inputs; the remaining 4 separated on two more inputs I constructed for them
      (a COMP id enumerated for a module that has no row at all, which fires "the diagram enumerates
      and no row carries" alone; and an exempt module whose diagram entry and map row agree, which
      fires the two exemption kinds without firing the mispairing or invented-id kinds). So ten named
      kinds are ten behaviours, not eight wearing ten names.
      Separately: all ten are exercised by a COMMITTED case. Seven tests cover them, and every
      committed assertion is tight -- six compare the whole `defects` dict with `==`, so deleting any
      predicate reds, and the seventh subscripts the key, so deleting it raises KeyError.
