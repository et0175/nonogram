      readers' agreement, and CLAUDE.md's row/id ban. Not honoured for the class docstring's own
      claim that "the extent cannot now change in either direction ... without a red" (I-1a, Plant I
      green) nor for the canonical map's "two pipeline adapters" (M-1, Plant A green).
  - rule: ADR-0039/R2 -- the set is derived from an authority the runtime can enumerate, default-deny
