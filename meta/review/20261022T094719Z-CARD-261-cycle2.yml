findings:
  - id: I-1
    title: >-
      The corpus that measures the declared hole is not itself protected, and the new adapter-count
      denial misses the exact wording F-101 was raised about -- so the class's "the extent cannot
      change in either direction without a red" is false
    severity: important
    category: test-coverage
    file: tests/test_cli.py
    line: 1979
    root_cause: >-
      Both symptoms are the same defect: the reach of a reader and the strength of its corpus are
      pinned by QUANTITY (a >= 10 count; two positive assertions) rather than by the CASES that
      carry the claim. Everywhere else in this card the fixer pinned the claim-bearing artefact
      itself (_ADAPTERS' literal set, _WITHOUT_A_COMPONENT_ID's literal set, _LAUNCH_EDGE's literal
      tuple). The one control added this round did not get that treatment.
    evidence: >-
      SYMPTOM (a) -- PLANT I, the padable floor. TestComponentMap_WhatTheClaudeMdReaderAbsorbs's
      docstring claims: "every shape this reader must catch and every shape it is known to miss is a
      committed case below ... The extent cannot now change in either direction -- a narrowing that
      lets a tabular row through, or a widening that starts catching ordinary sentences -- without a
      red." The only structural protection is `assert len(self.CASES) >= 10`, a count over the whole
      tuple with no pin on the 5-must-catch / 5-known-miss split and no pin on any individual string.
      I replaced three of the five known-miss cases --
      `(False, "docs/GENERATION_ALGORITHM.md   the generation pipeline")`,
      `(False, "tests/README.md    the suite guide")` and, decisively,
      `(False, "`cli.py` is the only inbound adapter.")` -- with three near-duplicate must-catch rows
      (`orchestrator.py  COMP-002 ...`, `solver/  COMP-005 ...`, `clues.py  COMP-004 ...`), leaving
      the tuple at exactly 10 entries. RESULT: GREEN, pytest exit 0 over `tests/test_cli.py -k
      TestComponentMap`. No message, because nothing reds. The known-miss half of the corpus -- the
      half that is the entire point of the class, and the only committed artefact telling a reader
      that F-101's wording still evades `_claude_md_rows` -- shrank from 5 cases to 2 under a floor
      written "so it cannot silently shrink to the cases that happen to pass".
      Positive control that the corpus is live when not padded: PLANT B widened `_COMPONENT_ID` to
      `(?:COMP|CAP)-\d`, closing the declared hole. RED, 2 failures, naming the case:
      "_claude_md_rows' reach has changed; these lines no longer read the way
      TestComponentMap_WhatTheClaudeMdReaderAbsorbs says: ['sourcing covers CAP-001 and nothing
      else.']" -- so the fixer's "plant J" claim reproduces exactly. The defect is not that closing
      the hole passes; it is that DELETING the measurement passes.
      SYMPTOM (b) -- PLANT G, the denial's reach. I planted, as running prose immediately under
      CLAUDE.md's `## Architecture` heading: "Both inbound adapters import the orchestrator;
      `cli.py` is the only inbound adapter that parses argv." RESULT: GREEN, pytest exit 0 over
      `tests/test_cli.py tests/test_guard_integrity.py`. The second clause is the literal F-101
      defect -- the claim the card's `## Why` table measured as having misinformed briefs -- and
      `test_claude_md_states_no_count_of_adapters`' own docstring opens "The retired block's worst
      error was 'the only inbound adapter'", a shape `_ADAPTER_COUNT` cannot match because "only" is
      neither a word-number nor a digit.
      Positive control: PLANT H, "There are 3 inbound adapters in this tree." RED, 1 failure,
      `test_claude_md_states_no_count_of_adapters`.
      The measured shape of `_adapter_counts`, fed 32 forms through the shipped helper:
      CAUGHT -- "3 inbound adapters", "three inbound adapters", "**three** inbound adapters",
      "t**hree** inbound adapters", "All three inbound adapters", a count in a fenced code block,
      "two adapter modules", "two adapters: cli and web", "1 adapter exists".
      MISSED -- "Both inbound adapters", "`cli.py` is the only inbound adapter", "the sole inbound
      adapter", "a pair of inbound adapters", "a trio of inbound adapters",
      "The adapters: cli, web, admin" (an enumeration is a count), "adapters are cli.py, web/ and
      admin/", "There are three inbound entry points" (a count of adapters without the noun),
      "three distinct inbound process adapters" (three intervening words, bound is two),
      "three http-and-cli adapters" (\w+ does not cross a hyphen), "eleven adapters", "zero
      adapters", "adapters x2", "adapters number three in this tree".
      FALSE POSITIVES on the deny side -- "See section 3 about inbound adapters." reds;
      "no capability module adapters import anything" reds; "web/ grew in CARD-200; the four tests
      cover adapters" reds.
      The two-word bound and the emphasis stripping ARE documented precisely in the helper's comment
      and docstring, and the FP cost is declared there. What is not stated anywhere is that the
      non-numeral count spellings evade -- and `_adapter_counts`' docstring reads the other way:
      "this denies the one shape of it that matters here". Its only known-miss control is a single
      assertion on "which modules are adapters is the map's business", a string so unlike a count
      that it measures nothing at the edge.
    what_state_would_make_this_red: >-
      (a) A floor on each half of CASES (e.g. >= 5 must-catch and >= 5 known-miss), or an assertion
      that the specific counterexample strings are present -- in particular the "`cli.py` is the
      only inbound adapter." row, which is the card's own historical defect and the single most
      load-bearing entry in the corpus. (b) A CASES-style committed corpus for `_adapter_counts`
      itself, carrying "both", "the only", "a pair of", "a trio of", an enumeration, and "entry
      points" on the known-miss side, plus the three false positives above on the deny side -- and
      a one-line correction to `_adapter_counts`' docstring and to
      `test_claude_md_states_no_count_of_adapters`' docstring so neither claims a reach it lacks.
    does_that_state_exist_today: "No. Verified by execution: Plant I GREEN, Plant G GREEN."
    remedy_size: "roughly 30 lines, all inside tests/test_cli.py; no src change, no AC change."
  - id: M-1
    title: >-
      Declared bounds that carry no control of their own -- the "two pipeline adapters" count inside
      the canonical map. It is NOT a relocation of F-101, which is worth stating plainly.
    severity: minor
    category: test-coverage
    file: src/nonogram/__init__.py
    line: 75
    cluster: declared-bound-without-a-control
    evidence: >-
      PLANT A. I changed the canonical map's docstring to read "the FIVE pipeline adapters import
      ``orchestrator``" and "There are exactly FIVE adapters (ADR-0019)". RESULT: GREEN, 130 passed,
      pytest exit 0. The count has no control, exactly as the fixer declares in its own
      "what remains unheld" table ("none -- declared, not closed"). That row is the only one in that
      table whose "the control that asserts it is a hole" column says none, which breaks the table's
      own discipline and ADR-0039/R3's.
      THE PART THE BRIEF ASKED ME TO JUDGE, and my answer differs from the brief's premise:
      the defect did NOT move. `git show fac4896f:src/nonogram/__init__.py | grep -n adapter` shows
      the count was ALREADY in the canonical map before this card -- line 44 "the two adapters import
      ``orchestrator``" and line 46 "There are exactly two adapters (ADR-0019)". The card's edit to
      that sentence was to INSERT the word "pipeline", narrowing a pre-existing claim rather than
      importing a new one. CLAUDE.md's count was removed and not re-sited.
      WHAT A READER DOES IF IT IS WRONG, AND IS THAT BETTER OR WORSE THAN BEFORE: strictly better.
      Before, CLAUDE.md -- loaded in every session and extracted into every implementation brief --
      asserted "cli.py COMP-001 the only inbound adapter (argparse)", which was false of the tree and
      was the claim the card's `## Why` table measured. Now CLAUDE.md states no count and points at
      the canonical map and at `_ADAPTERS`; the canonical map's count is scoped ("the *pipeline's*
      adapters, not a count of every entry point in the tree: ``admin/`` is a third one"), is TRUE
      today, and sits three lines from held rows for `cli.py`, `web/` and `admin/` whose COMP ids are
      pinned to the C4 diagram. A reader who misreads the count has the correct row set on the same
      screen. So the fixer's argument for why this bound is different from CLAUDE.md's is sound on
      the evidence -- it is the absence of a control for a stated bound that costs here, not a
      relocation.
  - id: M-2
    title: >-
      Three figures in the fix hand-back that do not reproduce. The one that matters is the
      gate-breadth measurement: tests/test_guard_integrity.py also reads CLAUDE.md.
    severity: minor
    category: documentation
    file: meta/kanban/cards/CARD-261.md
    cluster: figures-that-do-not-reproduce
    evidence: >-
      (i) THE GATE-BREADTH MEASUREMENT IS FALSE AS STATED. The fixer's replacement justification for
      not running the broader gate is "`tests/test_cli.py` is the only test file that reads
      `CLAUDE.md`, the puml, or `capabilities.yml`". On the worktree's tree, distinguishing reads from
      prose mentions: 42 files under tests/ mention CLAUDE.md, and all but two are prose citations of
      its test-style rules inside docstrings. The two that READ it are tests/test_cli.py:1090
      (`_CLAUDE_MD = ... / "CLAUDE.md"`) and tests/test_guard_integrity.py:80
      (`GUIDANCE = REPO_ROOT / "CLAUDE.md"`), consumed at :2840 inside
      `TestTheInterpreterFloor.test_the_floor_is_declared_in_pyproject_and_followed_by_the_guidance`,
      which regex-scans for `python(\d+)\.(\d+)\s+-m\s+venv`.
      The CONCLUSION survives re-derivation on narrower grounds, which is why this is minor and not
      important: that second reader scans only the Commands section (CLAUDE.md line ~10), the card's
      CLAUDE.md diff is a single hunk at line 42, and I ran tests/test_guard_integrity.py green both
      at HEAD and under Plant G. The puml and capabilities.yml half of the claim IS true -- grep for
      `components-CTX-001`/`capabilities.yml`/`.puml` under tests/ returns only tests/test_cli.py
      (and tests/README.md prose).
      (ii) The CLAUDE.md diff hunk is `@@ -42,11 +42 @@`, not `@@ -42 +42 @@` as the hand-back writes
      it. The substance -- one hunk, inside the layout block -- holds; the notation understates that
      eleven old lines collapsed to one.
      (iii) The _id_defects taxonomy sentence "Four need no authority at all and hold
      unconditionally: an id claimed by two rows, an id no diagram enumerates, an id the diagram
      enumerates that no row carries, and a CAP id the capability registry does not list" is wrong
      for two of its four: both "a COMP id the component diagram does not enumerate" and "a COMP id
      the diagram enumerates and no row carries" are set differences against `authority`, so they do
      need it. Only "claimed by more than one row" (a count over `rows`) and the CAP-registry
      membership test hold with an empty authority. The ten kinds themselves are sound (see
      figures_re_derived); only the prose grouping is.
acceptance_criteria:
  - id: AC-1
    verdict: MET
    evidence: >-
      Re-derived without reusing the test's list, through a `python -I` script with the worktree's
      src first on sys.path (so the main checkout's editable install cannot answer -- the probe
      printed nonogram.__file__ as the worktree path, 13 rows, not the pre-card 11).
      `_component_modules(_MODULES)` = 13: admin, analysis, cli, clues, db, difficulty, errors,
      export, limits, orchestrator, solver, sourcing, web. `_canonical_map(nonogram.__doc__)` = the
      same 13 names in docstring order, 0 unanalysable. `_map_defects` empty.
  - id: AC-2
    verdict: MET
    evidence: >-
      The committed plants pass, and I added five of my own that the committed set does not contain.
      PLANT E: I line-wrapped the real `Component(clues, ...)` declaration in the C4 puml across two
      physical lines -- a shape none of the three committed parametrize cases covers. RED, 2
      failures: "unanalysable Component declarations: ['89: Component(clues, \"COMP-004 Clue
      Derivation\",']" and the full `_id_defects` dict naming three kinds at once.
      PLANT F: I made `Component(solver, ...)` non-line-leading (`  together { Component(solver,`),
      which `_COMPONENT_MACRO`'s `^\s*Component\w*\(` cannot see at all, so the declaration vanishes
      silently rather than being denied. RED anyway, caught downstream twice: "assert 9 >= 10" in
      test_the_diagram_parses_into_component_id_pairs, and `{'a COMP id the component diagram does
      not enumerate': ['COMP-005'], 'in the package, neither exempt nor paired by the diagram':
      ['solver']}`. So the parser's one blind spot is covered by the floor and by the default-deny
      behind it.
      PLANTS C and D settle cycle 1's fused-arm question by direct observation rather than by the
      kill matrix: neutering `_CLAUDE_MD_ROW` alone (-> `^(?!x)x`) reds 2 tests naming only
      ['conftest.py      # shared fixtures']; neutering `_COMPONENT_ID` alone reds 3 tests naming only
      ['The solver (COMP-005) is the correctness-critical component.', '# COMP-009 runs as its own
      process']. Disjoint case sets, each disjunct kills independently. Not two names for one patch.
  - id: AC-3
    verdict: MET
    evidence: >-
      CLAUDE.md carries no component row and names no COMP id (verified: `_claude_md_rows` on the
      shipped file returns []), points at `src/nonogram/__init__.py` and at `_ADAPTERS`, and the
      shape that shipped is stated with its three reasons in the card notes as the AC requires.
      F-106's rename is a widening of the stated breadth, not a narrowing of behaviour:
      `test_claude_md_carries_no_component_row_and_names_no_component_id`, with a message that says
      the id ban is wider than the row ban on purpose.
  - id: AC-4
    verdict: MET
    evidence: >-
      Re-derived both figures independently of the hand-back.
      `git diff -U0 fac4896f -- tests/test_cli.py | grep -c '^-[^-]'` -> 0.
      `git diff --numstat fac4896f -- tests/test_cli.py` -> `1028  0`.
      `git diff --numstat 604cc542 -- tests/test_cli.py` -> `781  14`.
      The 14 removed lines need no individual check against fac4896f: a numstat of 1028/0 against
      fac4896f is a proof that no fac4896f line was removed, so all 14 are lines 604cc542 itself
      added. I read them anyway -- they are the F-103 docstring rewrite of `_canonical_map`'s
      four-space rule (4 lines), the AC-5 description-bound paragraph that moved and grew (6 lines),
      the F-106 one-line bound sentence, and the F-106 rename's old def line plus its two message
      lines. All docstring/name text this card wrote.
      I also confirmed by AST that `_rank`, `_outward_imports`, `_MODULES`, `_component`, `_SHARED`,
      `_LAUNCH_EDGE`, `_ADAPTERS`, `_discover_modules`, `_package_imports`, `_imported_components`
      and `_relative_base` are byte-identical to fac4896f, source segment for source segment.
      AC-4's wording survives a second fix round intact and needs no amendment -- worth stating,
      because it is the AC a +1028-line test diff would most plausibly have outgrown.
  - id: AC-5
    verdict: MET_AS_WRITTEN
    amendment_verdict: ACCEPT
    evidence: >-
      The shipped artefact satisfies AC-5 as written: no component's description is claimed to be
      controlled, the bound is declared in `_map_defects`' docstring in its own paragraph, and
      `test_a_wrong_description_is_the_one_hole_that_stays_open` asserts the hole with the card's own
      literal defect (`difficulty.py COMP-006 CAP-004 not yet built (later card)`) passing both
      `_map_defects` and `_id_defects`.
      I judge the PROPOSED WORDING and not only the artefact. It does three things right. It replaces
      "description" with "English description", which is the substantive fix -- cycle 1's F-102 was
      possible only because a structured identifier with an authority had been folded into the word
      "description", and the amended text names the id columns and their authority file explicitly so
      the fold cannot recur. It adds "and assert that it is a hole", promoting ADR-0039/R3 from a
      practice the fixer chose into a requirement of the AC. And it keeps the same concrete example
      ("scores 0..100 from the solver's rung tags"), so the AC still points at a falsifiable instance
      rather than at a category.
      Two observations for the owner. First, this is an AC amended WITH evidence -- the amendment is
      proposed because a review cycle demonstrated the old wording's hole with three green plants,
      and the amended form is already satisfied by the shipped artefact -- which is the pass shape,
      not the "quietly outgrown" shape the board gates on. Second, the amendment's own new clause
      ("assert that it is a hole") is the clause I-1 shows is not uniformly honoured: the English
      description hole has
      `test_a_wrong_description_is_the_one_hole_that_stays_open`, `admin/`'s CAP-006 hole has
      `test_the_capability_pairing_reads_only_a_leading_cap_id`, CLAUDE.md's prose hole has the CASES
      corpus -- but the "two pipeline adapters" count (M-1) has nothing, and the CASES corpus itself
      is deletable (I-1a). Adopting the amendment makes those two gaps AC violations rather than
      declared bounds, which is an argument for adopting it and for fixing them in the same round.
