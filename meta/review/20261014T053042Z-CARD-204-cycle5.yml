  - id: F-4
    severity: info
    category: tech-debt
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2149
    type: question
    title: "_clipped_to's single-character floor can return a string wider than measure, after which the clamp has no x that holds it"
    description: |
      `while len(clipped) > 1 and font.getlength(clipped) > measure` stops at one
      character even if that character is still wider than `measure`. The caller
      then re-asks `caption_slot` with the over-wide width, which caps `width` at
      `measure` and reports the whole usable area — so the drawn glyph, anchored
      "rm" at `usable_right`, would extend past `usable_left`. This is the one path
      where CaptionSlot's documented promise ("no width keeps a caption wider than
      the usable area inside it, so the renderer must shorten it") is not actually
      restored by the shortening.
      Unreachable in practice by a wide margin: one glyph at 10 pt / 300 DPI is
      ~20 px, against a smallest measured packed-tile `measure` of ~1120 px and a
      full-page `measure` of 2287 px. Recorded as an observation, not a defect, and
      deliberately NOT counted in the score — the loop is pre-existing CARD-200
      code moved unchanged, and changing its floor would change the TOC's bytes,
      which is the whole reason the extraction was done unchanged.
