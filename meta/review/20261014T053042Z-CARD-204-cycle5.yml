findings:
  - id: F-1
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 4181
    title: "A clamped packed caption overprints the folio: _packed_answer_page still feeds _draw_folio the tile's drawing_right, not the caption's clamped right edge"
    description: |
      Fix 7 moved the caption's right edge from `placement.drawing_right` to
      `box.right`, and correctly told the FULL-PAGE consumer: `solved_puzzle_page`
      now passes `content_right = caption_right` (line 3997-3999) into
      `_draw_folio`'s collision check. The PACKED consumer was not updated.
      `_packed_answer_page` folds the caption's BOTTOM in (`content_bottom =
      max(content_bottom, corner_caption[0])`, line 4171) but still passes
      `content_right = corner_placement.drawing_right` (line 4181) — and its own
      comment at lines 4162-4169 states the premise Fix 7 has just falsified:
      "content_right/content_left already carry that tile's own
      drawing_right/drawing_left (the caption's right edge coincides with it)".
      With the clamp active they no longer coincide, because a packed tile's
      drawing is CENTRED inside its tile (that is why baseline pages 11-12 never
      moved under this card), so the tile has right-hand spare the clamp can push
      the caption into, all the way to the tile's `usable_right`, which on the
      corner column of a right-hand page IS the page's own folio corner.

      `_draw_folio` (line 1470-1481) then reads the stale figure: with no vertical
      room (`bottom - content_bottom < line_height`) it omits the folio only if
      `content_right > right - text_width`. The stale 2418 passes that test
      (2418 <= 2475 - 27 = 2448), so the folio IS drawn, into pixels the caption
      has already taken.

      REPRODUCED, twice, by rendering the real page and subtracting a reference
      render with the module-level `_draw_folio` monkeypatched to a no-op (the
      same ground-truth technique the existing collision test uses), so caption
      ink and folio ink are separated rather than conflated:

        * trim 21.59 x 27.94 cm (8.5 x 11 in — a standard KDP trim), KDP-minimum
          side margins, interior page 9 (right-hand), capacity-4 packed answer
          page of four 10x13 answers, long picture name:
          corner tile drawing_right = 2418, usable_right = 2475 = frame.right;
          caption_slot reports right = 2475 (clamped, +57 px);
          folio drawn: True; CAPTION INK INSIDE THE FOLIO'S OWN GLYPH BOX: 40 px.
          Same page with a short title ("Owl"): clamped = False, 0 px. So the
          collision is created by Fix 7's clamp, not inherited.
        * trim 21.59 x 17.78 cm, capacity-2, two 10x18 answers: identical result,
          40 px of caption ink inside the folio glyph box.

      A broad sweep (6 trim widths x 5 trim heights x capacities 2 and 4 x grid
      sides 10..30 on the corner tile) found 4 configurations where the predicate
      splits — clamp active, no vertical room, stale figure says "clear", true
      figure says "not clear". It needs a long picture name to trigger, which is
      exactly the input caption_slot exists for.

      No test covers it. The new packed class
      (TestBookSolvedAnswerKey_PackedCaptionWiderThanItsTileStaysInside) asserts
      tile containment only and never looks at the folio; the pre-existing
      TestBookSolvedAnswerKey_PackedCaptionDoesNotCollideWithTheFolio (CARD-203
      F-101) uses default short names, so its captions are never clamped.

      Severity: this is a visible print defect — a page number overprinted by
      caption glyphs — on a reachable, standard-trim configuration, introduced by
      the diff under review, in the repo's highest-defect-density file (30 of 56
      commits are fixes). It is narrower than the defect Fix 7 fixes (pre-fix the
      same caption ran 113 px across the gutter into the neighbouring tile), so
      Fix 7 remains a net improvement — but it is a new defect, not a residue.

      The mirrored left-parity exposure is the same root cause and is NOT
      separately filed: on an even page the corner tile is column 0, a clamped
      caption's left edge lands on that tile's `usable_left` = `frame.left`, and
      `content_left = corner_placement.drawing_left` under-reports the same way.
      I could not drive it to an overprint, because CARD-203's F-101 fix
      deliberately gates the `content_bottom` fold-in on `right_hand`, so the
      vertical predicate rarely fires there. Treat it as the same one-line fix's
      other half, not as a second finding.
    suggestion: |
      One line, mirroring what Fix 7 already did at the full-page call site: pass
      the corner caption's own reported right edge instead of the tile's
      drawing_right (and, for the left-parity half, derive content_left from the
      caption's box too — `box.left` is already on CaptionSlot, though
      _draw_solved_slot currently returns only the bottom and the right, so the
      return tuple may need its third element).

          content_right=(
              corner_caption[1]
              if corner_caption is not None
              else (None if corner_placement is None else corner_placement.drawing_right)
          ),

      Then delete the now-false premise from the comment at lines 4162-4169, and
      pin it: add a clamped-caption case to
      TestBookSolvedAnswerKey_PackedCaptionDoesNotCollideWithTheFolio (it already
      has the monkeypatch-the-folio-away harness; it needs only a long title and a
      shape with tile spare — 10x13 at capacity 4 on an 8.5x11 trim is a
      reproduction).
