  - id: F-2
    severity: high
    category: tech-debt
    file: src/nonogram/export/layout.py
    line: 1226
    type: gap
    title: "The clamp's min against usable_right survives mutation: no test exercises a floor-overflow layout, and on one the caption moves even though the text fits"
    description: |
      MUTATION CHECK (5 mutants on the clamp and the clip; 4 killed, 1 survived):

        M1 drop the clamp entirely      -> KILLED (7 tests fail)
        M2 off-by-one on the left stop  -> KILLED (3 tests fail)
        M3 drop `min(..., usable_right)`-> SURVIVED (224 passed)
        M4 drop the measure cap on width-> KILLED (2 tests fail)
        M5 negate the clip condition    -> KILLED (8 tests fail)

      So the clamp proper and the clip are genuinely pinned — the new tests do
      die when they break. The second stop is not. Two consequences, one root
      cause:

      (a) TEST GAP. `TestCaptionSlot_NoWidthEverLeavesTheUsableArea` sweeps 4
      shapes x 2 parities x 13 widths = 104 cases and asserts the count, which is
      good discipline — but every one of its layouts has `PagePlacement.fits ==
      True`. The class's comment believes the page-fit-bound 30x30 is the
      no-spare extreme ("where the flush edge and the margin coincide"); no-spare
      is not overflow. The `min` stop only binds when `drawing_right >
      usable_right`, which is precisely the `fits == False` regime this card's own
      AC-3 property test (test_TestLayout_FloorOverflowDirectionUnderRightAlignment,
      tests/property/test_book_layout.py:564) establishes exists and asserts the
      direction of. So the class's total claim ("no width ever leaves the usable
      area") is verified over a proper subset of the layouts the function accepts.

      (b) THE CLAIM IS OVERSTATED where it matters most for a merge. The fix's own
      summary, and the renderer docstring at book_pdf_generator.py:3751-3756 ("For
      every caption that fits beside its own grid the two are the same pixel, so
      CARD-203's right-alignment is untouched"), are false on a floor-overflow
      page. Measured, at a supported book configuration: a 30x30 puzzle on a
      10.0 cm or 10.16 cm trim at KDP-minimum side margins, even page, gives
      fits = False with drawing_right = 1138 against usable_right = 1106; a
      caption 300 px wide — one that fits with room to spare — now has its right
      edge at 1106 instead of 1138. CARD-203's caption position moves by 32 px
      (2.7 mm) on that page.

      The direction of the change is right (the old behaviour put caption ink 32 px
      into the gutter margin, following a drawing that overflows there), and
      layout.py's own comment at lines 1219-1225 discloses it honestly and
      explains the choice. What is missing is a test that pins it and a renderer
      docstring that does not deny it. Per Step 8f a surviving mutant is filed
      against the test, not the production code — that is what this is.
    suggestion: |
      Add the overflow regime to the sweep rather than writing a new class: one
      extra entry in `SHAPES` plus one extra spec (a 30x30 on a BOOK1-shaped spec
      narrow enough that `_expected_cell_mm < MIN_CELL_MM`, the same construction
      test_TestLayout_FloorOverflowDirectionUnderRightAlignment already uses), and
      one assertion that for such a layout `box.right == page.usable_right` for
      every width, which is what the `min` stop promises. Then correct
      book_pdf_generator.py:3751-3756 to say "for every caption that fits beside
      its own grid on a page the drawing itself fits" — layout.py's comment already
      has the accurate version.
