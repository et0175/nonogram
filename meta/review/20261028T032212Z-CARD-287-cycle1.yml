      observed: killed by the two-sided set equality, naming the guard class
    - mutant: S4 (a bare MENTION planted in a third scope)
      expected: survive
      observed: >-
        SURVIVED. It is a REAL planted mutant, not one that was never planted:
        the anchor occurs exactly once in the base and the plant goes into
        _attribute_callee_laundering (module-level function, lines 5457-5494),
        a genuine third scope the comments never name. A real negative control.
