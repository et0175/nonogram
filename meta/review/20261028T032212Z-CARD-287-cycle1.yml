      expected: survive, declared
      observed: >-
        SURVIVED, and the DECLARATION IS TRUE rather than merely humble. Checked
        independently by AST rather than by re-running the mutant: the
        Attribute-based derivation returns a list IDENTICAL to the Call-based
        one over this file, and the set of *.get_source_segment Attribute nodes
        that are NOT the func of a Call is EMPTY. The corrected docstring text
        is also true: what excludes a mention is the attribute-name match, since
        the mention this file contains spells the name as a string Constant.
    - mutant: R1 (reviewer's own) -- the derivation replaced by a SELF-CONFIRMING
        one that returns STDLIB_SEGMENT_SCOPES verbatim
      expected: must be killed by something
      observed: >-
