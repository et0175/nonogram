    severity: major
    title: >-
      AC-2's headline "dear test 15.04 predicted, 15.19 measured -- 1.0 %" is not
      an agreement; it is two compensating errors. The prediction's saving was
      built with the whole-source instrument of F-287-01 and subtracted from the
      card's SUPERSEDED 30.25 s baseline, while the 15.19 s it is compared to was
      measured against the round's own arm A of 27.88 s
    file: meta/kanban/cards/CARD-287.md
    line: 503
    gating: true
    confidence: high
    detail: >-
      prediction.txt computes saving = 2556 x 6.238 ms - 108 x 6.779 ms = 15.21 s
      and then "predicted new cost 30.25 - 15.21 = 15.04". 30.25 s is the figure
      the card's own REWRITTEN section records, not the figure the round measured:
      arm A measured the dear test at 27.88 s. Against the round's own arm A the
      prediction is 27.88 - 15.21 = 12.67 s versus 15.19 s measured -- 16.6 %
      out, not 1.0 %. The saving was over-predicted by 2.52 s (whole-source
      instrument) and the baseline over-stated by 2.37 s (host gap the card
      itself declares), and the two cancel. The card's sentence "Every delta
      above uses the round's own arm A as its denominator, so no percentage is
      inflated by that gap" is true of the A/B table and false of the figure the
      card leads with. This is CARD-292's headline defect in a new dress: a
      numerator and a denominator from two different domains.
