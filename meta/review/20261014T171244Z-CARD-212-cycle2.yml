  - id: G-004
    severity: low
    classification: Minor
    gating: false
    category: testing
    type: risk
    file: tests/test_puzzle_solver_clues.py
    line: 1621
    title: "The 22x14 draw-count case is pinned at 2 draws with 0.59 px of headroom, so a platform with classic scrollbars reds it for a non-regression"
    description: |
      The task asked me to be adversarial about this case specifically.
      Measured at HEAD on GRID_22x14 at 1280x720:

          plain board   24.5938 px   (+0.5938 over the bar -> the ladder tries a rung)
          doubled rung  23.3125 px   (-0.6875 under the bar -> the rung is refused)
          stage cqi     980 px,  --player-row-ch 27.45

      So the case is a genuine two-sided boundary and the parametrised entry
      `("22x14 on a laptop", GRID_22x14, DEFAULT_VIEWPORT, 2, 0)` in
      TestSolverClues_TheLadderStopsAtTheFirstRungThatFits encodes BOTH
      sides: 2 draws says "the plain board cleared the bar", 0 duplicates
      says "the doubled rung did not". That is the right instrument, and it
      does fail for the right reason in the direction that matters — if the
      doubled rung ever cleared the bar, this entry, the companion
      `test_a_22x14_whose_doubled_rung_misses_the_bar_draws_one`, and its
      `cell == approx(24.59, abs=0.05)` would all red together.

      The exposure is the other side. 0.5938 px of headroom on a 22-column
      board is about 13 px of stage width (22 x 0.59). A platform or setting
      with classic, space-taking scrollbars — Windows and most Linux defaults,
      or macOS with "Show scroll bars: Always" — removes ~15 px from the
      stage's inline size and drops the plain board under the bar, at which
      point the early-out fires, `draws` is 1 instead of 2, and the test reds
      while the behaviour is entirely correct (the board draws one gutter
      either way, which is what the user sees and what the sibling test
      asserts). The suite already carries this class of exposure in CARD-182's
      pinned DESKTOP_CELL, so it is not new — but this is the first test whose
      *pass* depends on a sub-pixel margin pointing one particular way.
    suggestion: |
      Make the test say why it expects 2, so that a scrollbar-shifted
      environment fails with a diagnosis instead of a mystery. In the 22x14
      test that already exists, measure the doubled candidate the way a
      reviewer does and assert the sandwich explicitly:

          plain, doubled = page.evaluate(...)   # set --player-row-gutters: 2, measure, restore
          assert doubled < 24 <= plain, (plain, doubled)

      Then the draw count is a consequence of a stated condition rather than
      a bare 2, and whoever hits it on another machine can see in one line
      which side moved.
    confidence: high
    source: dynamic
