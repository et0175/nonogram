confirmations:
  - id: X-001
    finding: F-001
    verdict: "CLOSED, and the stronger claim holds. Also corrects a number of MINE."
    evidence: |
      The fix is a trailing-debounced `resize` listener (solver.js:692-696,
      RESIZE_SETTLE = 150 ms) calling the same redraw(), behind the same
      `isBig` guard as the media-query listener.

      I re-ran my own cycle-1 instrument — one page load of the 30x25 at
      1920x1500, then a walk that never crosses 820 px — and at each stop I
      took the resized board AND a reload of the same puzzle at the same
      window in the same session:

          window       resized                              reloaded
          1500x1000    dup=0  cell=22.70  ox=0   oy=1       identical
          1100x900     dup=0  cell=17.63  ox=1   oy=0       identical
          900x800      dup=0  cell=14.39  ox=104 oy=0       identical
          back to 1920x1500  dup=55 feet=1 cell=28 ox=0 oy=0  identical

      Fields compared: duplicate count, tfoot rows, mirrored flag, cell
      width, stage overflow x and y. DIFF = none at all four stops, in both
      directions. Cycle 1's failure state (dup=55, 14.39 px cells, 376 px of
      in-stage horizontal overflow at 900x800) is gone.

      Draw cost of following the window, counted with the new mark: each
      resize-redraw of a board that can afford nothing is ONE draw (the walk
      accumulated 2 -> 3 -> 4 marks over two resizes, and the return to
      1920x1500 cost 2). So the listener is as cheap as F-002 made it.

      The debounce's trailing shape: during a drag the board is the old
      board until 150 ms after the last event, then correct. I judge that
      ACCEPTABLE and say so deliberately. A drag is a continuous gesture with
      no meaningful intermediate state, the stale board during it is the
      board the user was just looking at (not a broken one), and the
      alternative — redrawing per event — is the thing that made this
      listener look unaffordable in the first place. What I would not accept
      is the drag ending and the board staying wrong, and that is what the
      two new tests assert. The parameters of the debounce are a separate,
      Minor gap: G-001.

      Mid-interaction cost, checked rather than assumed: the stage's scroll
      offset SURVIVES a redraw (scrollTop 91 before and after a 1 px resize —
      which matters, because a board scrolled to its far edge is the whole
      point of this card), `hinted` is explicitly nulled rather than left
      dangling (solver.js:636), and marks/zoom/circles survive both
      directions (the new tests assert _board_snapshot equality and
      "150%" either side; my walk agrees). The one thing lost is the hint
      highlight: G-003.

      MY OWN ERROR, which the implementer caught and I confirm: cycle 1's
      F-001 said the reloaded board at 900x800 had "no overflow at all". It
      has 104 px — a 30-wide board at a 600-ish px stage is floor-bound and
      scrolls on a reload too. I had measured the resized state's overflow
      and inferred the reload's. The real delta the stale duplicates were
      costing was 376 -> 104 px, not 376 -> 0. The defect and its severity
      stand; one of my numbers did not, and the card's notes now record the
      correction rather than quietly adopting it.

      Pinned by: tests/test_puzzle_solver_zoom.py:724
      `test_a_resize_that_never_crosses_the_breakpoint_rechooses_the_layout`,
      :786 `test_a_resize_settles_on_the_layout_a_reload_would_have_given`
      (resize == reload as whole-shape equality — the right way to state it),
      :812 `test_a_board_too_small_to_double_is_not_redrawn_by_a_resize`
      (the guard, counted with the draw mark rather than inferred from the
      DOM). Mutants M-A (listener never redraws) killed by the first.
  - id: X-002
    finding: F-002
    verdict: "CLOSED. The monotonicity argument holds in the code as written, not only in prose, and the draw count cannot be satisfied by a draw that did not happen."
    evidence: |
      The restructure (solver.js:613-628) draws the LAST rung — today's
      rendering — first, returns it immediately when it is already under the
      bar, and when a doubled rung is tried and missed re-inserts the plain
      table it kept a reference to instead of rebuilding it.

      MONOTONICITY, checked three ways because the early-out's correctness is
      the whole argument.
      (1) Algebra over admin.css's min(): gutters enter the two width terms
      only as `- G*(...)` in the numerator and `+ G*(...)` in the
      denominator, and the column count enters the height term only as
      `+ C*depth` in the denominator, so each term is non-increasing in G and
      C. clamp(lo, min, hi) is monotone in min, and lo/hi do not depend on G
      or C, so the drawn cell is non-increasing in the gutter counts.
      (2) Exhaustively, by measurement: 210 board/viewport pairs (5 widths x
      7 heights x 6 viewports incl. 390x844, 820x900, 1280x720, 1440x900,
      1920x1080, 1100x700), each measuring the plain cell, then the cell with
      --player-row-gutters: 2, then with both at 2. **Zero counterexamples** —
      no pair where doubling an axis increased the cell by more than 1e-6.
      (3) The weak point of a monotone early-out is equality at the clamp's
      floor (both readings pinned at max(--player-cell-min, --player-col-floor)
      = up to 14.4 px), and that is harmless here: the early-out only needs
      "plain < 24 implies doubled < 24", and equal-and-both-14.4 satisfies it.
      So the code as written cannot discard a rung that would have qualified.

      DRAW COUNTS, re-measured independently (one page load each, counting
      `performance.getEntriesByName('nonogram-player-board-draw')`): 30x30
      @1280x720 = 1 (was 4), 30x25 @1440x900 = 1, 15x15 = 1, 22x14
      @1280x720 = 2, 20x12 @1280x720 = 2, 30x12 @1920x1080 = 2, 30x25
      @1920x1500 = 2 (was 1). Every number in the card's before/after table
      reproduces.

      Is the trade sound? Yes, and it is the right way round. The boards that
      pay the extra plain probe are the ones that CAN double, i.e. the ones
      on a roomy window where a draw is affordable and the user gets
      something for it; the boards relieved of three draws are the big ones
      on ordinary laptops, which are both the common case and the expensive
      one (~810 ms -> ~125 ms to an interactive board, cycle 1's measurement).
      Worst case is unchanged at 4 draws (plain + three rungs), and the
      missed-rung path is 2 rather than 3 because the plain table is
      re-inserted — which is itself pinned (mutant M-G, below).

      "Can the count be satisfied by a draw that does not happen?" No, and I
      tested exactly that: the mark is the first statement of drawBoard
      (solver.js:417), it is the only `performance.mark` call in the file
      (grepped), and mutant M-H — moving the mark out of drawBoard into
      redraw, so that one mark is left per redraw regardless of how many
      boards were built — is KILLED by the 20x12, 30x12 and 30x25-roomy
      cases. A mark that undercounts dies; a mark that is left without a draw
      has no call site to live in.

      Pinned by: tests/test_puzzle_solver_clues.py:1596
      `TestSolverClues_TheLadderStopsAtTheFirstRungThatFits::test_the_board_is_built_as_few_times_as_the_answer_needs`
      (7 parametrised cases). Mutants M-E (early-out removed) and M-G (plain
      rebuilt instead of re-inserted) killed by it; M-H killed by it.
  - id: X-003
    finding: F-003
    verdict: "CLOSED on all three parts, and the relaxed helper still catches what it caught — verified with mutants aimed at exactly that, not by reading."
    evidence: |
      (a) The sentence. The card's [The measured rule] paragraph now reads
      "no fixture x viewport PAIR the suite actually exercises changes its
      layout", flags the old wording as false, names all three of my pairs
      with their re-measured values (AC_GRID 25x15 @1440x900 = 15 duplicates
      at 24.36 px, AC301_GRID 20x20 @1440x900 = 20 at 24.88 px, GRID_16_WIDE
      16x15 @1440x900 = 15 at 28 px and @820x900 = 15 at 25.66 px), and says
      plainly that the green suite is luck rather than a property of the bar.
      Every figure matches my own measurement. It also records that it
      repeated the false claim to the orchestrator, which is the part I would
      have asked for.

      (b) The helper. `_RULES` now groups clue boxes by `data-line` into one
      list per gutter and `_assert_every_fifth_line_heavier`
      (tests/test_puzzle_solver_page.py:645) asserts `1 <= len(gutters) <= 2`,
      `len(gutter) == count` per gutter, and the old fifth-line comparison
      inside each gutter. That is the minimum: on a single-gutter board it is
      arithmetically the same assertion as before (one gutter, `min` over the
      same values, the same expected pattern, and the length check that used
      to be implicit in the flat comparison is now explicit), and the only
      thing it newly tolerates is a second gutter — which is the behaviour it
      was blind to.

      The real question is whether it still catches things, and I did not
      take that on trust. Two mutants aimed at it:
        M-I  the duplicate row box loses `.major-below`, so the fifth-line
             pattern reads correctly in the left gutter and wrongly in the
             right one -> KILLED, and the kill names
             `TestSolverPage_EmphasisesEveryFifthLine::test_PropertyTest_every_size_...`
             — i.e. the regrouped helper in the regrouped corpus is what
             catches it, which is precisely the regression I warned about.
        M-J  the duplicate's `data-line` is off by one -> KILLED (the
             per-gutter length check fails, and the clues tests' line-order
             assertions fail with it).
      The implementer's own M22 (flatten the gutters again) is the third
      mutant in that family and they report it killed by the same test.

      (c) The corpus and the band. `(20, 12)` is in the seeded corpus with
      `assert doubled >= 1` beside it, so the corpus cannot drift back out of
      the doubling band in silence — a better fix than the one I suggested,
      because it fails loudly rather than just happening to cover the case.
      And the band itself now has its own tests at the suite's default
      viewport: `TestSolverClues_MidSizeBoardsDoubleOnAnOrdinaryLaptop`
      (tests/test_puzzle_solver_clues.py:1642) asserts a 20x12 draws both row
      gutters at 26.88 px with the same numbers and the same heavy rules in
      each gutter, and `test_a_22x14_whose_doubled_rung_misses_the_bar_draws_one`
      (:1686) takes the other side of the boundary. The 22x14 case's own
      fragility is G-004.
  - id: X-004
    finding: "F-004 .. F-008 (cycle 1's five Minor findings)"
    verdict: "All five closed; I checked each against the diff rather than against the card's 'done'."
    evidence: |
      F-004: admin.css:517-521 now states that no rule selects .is-mirrored
      any more and that it is a state marker only — and `grep -n is-mirrored
      src/` confirms that is still true at HEAD (one setter in solver.js, no
      selector anywhere).
      F-005: the measurement table's closest-call line now reads 23.47 px /
      0.53 px under the bar, matches my measurement exactly, and adds the
      spread I asked for (the same size doubles or not depending on the
      grid's deepest row clue, with AC_GRID as the counter-example). The
      owner-decision paragraph is now choosing between two measured numbers
      rather than one wrong one.
      F-006: `assert fit["overflowY"] <= 6` on a measured 5
      (tests/test_puzzle_solver_clues.py:1184), with the docstring rewritten
      to say it is the known column-band residue and not a budget. Exactly
      the fix suggested.
      F-007: the token test strips `/* ... */` before scanning and runs both
      its regexes against the stripped text
      (tests/test_admin_design_tokens.py:143-157) — so the comment this card
      added, which discusses `.is-right` at length, can no longer be read as
      a selector.
      F-008: redraw()'s comment no longer claims the discarded rungs are
      never painted; it says they are "replaced within this same task, so no
      frame is ever produced from one", which is true and checkable. The
      mirror file's test count is corrected from four to five.
      C-2's non-finding suggestion was taken too: the ring-clearance test now
      runs on CARD-193's phone mirror as well
      (tests/test_puzzle_solver_clues.py:1556
      `test_the_phone_mirrors_single_right_hand_gutter_too`), on the board
      that carried that defect longest. It passed in my run.
  - id: X-005
    finding: "Blast radius of the fix"
    verdict: "No regression found. One global listener and one mark per draw, both exercised."
    evidence: |
      171 tests passed across the six files the fix touches plus _phone.py
      and _mirror.py — the two that own the measurements most likely to feel
      a change in how many boards get built and when (CARD-182's pinned
      DESKTOP_CELL, CARD-193's mirror DOM and borders). Cycle 1's comparable
      subset was 163; nothing that was green went red, and the five new tests
      all executed.
      The two cross-cutting additions were considered specifically. (1)
      `performance.mark` inside drawBoard runs for every board the player has
      ever drawn, including every 15x15 in the suite: no test reacted, and the
      only consumers of the mark name are the two new probes (grepped). (2)
      The `window` resize listener is registered once, behind `isBig`, so a
      15x15 never redraws — asserted by draw count, not inferred, in
      tests/test_puzzle_solver_zoom.py:812, and mutant M-A's sibling in the
      card's own set (M18, the guard ignoring board size) is reported killed
      by that same test.
      What I could not reach, and would send to the merge gate: the seven
      player test files I did not run this cycle (listed in
      coverage.not_reached), of which _hint.py and _resume.py are the two a
      new global redraw trigger could plausibly disturb.

