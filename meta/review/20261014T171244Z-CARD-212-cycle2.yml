  - id: G-005
    severity: low
    classification: Minor
    gating: false
    category: documentation
    type: gap
    file: tests/test_puzzle_solver_page.py
    line: 721
    title: "The corpus comment says the random tail's cases are unchanged; their sizes are, their grids are not"
    description: |
      The new comment above the seeded corpus says: "The random tail is drawn
      after it, so those cases are unchanged". Half right, and the half that
      is wrong is the half a reader would rely on.

      `(20, 12)` is inserted as the eighth FIXED entry and the `while` loop
      still draws five random sizes afterwards, so the five random SIZES are
      byte-identical to before (the rng call order and count are unchanged —
      I checked by reading, and the five sizes I replayed in cycle 1 are
      still the ones in the corpus). But the per-grid seed is drawn inside the
      loop, one `rng.randrange(10**9)` per size, and there are now thirteen
      sizes instead of twelve: every size from index 7 onward gets the seed
      that used to belong to its predecessor. So the five random boards are
      different grids of the same sizes, and (20, 12) itself takes the seed
      that used to produce the eighth board.

      It changes nothing about what the test proves — the sizes drive the
      layout, the grid only shifts --player-row-ch by tenths of a pixel, the
      new `doubled >= 1` assertion is what keeps the corpus honest, and the
      whole file ran green. It is a claims-vs-code nit of exactly the kind
      this project asks reviewers to sweep for, in a comment written to
      reassure the next reader that nothing moved.
    suggestion: |
      "The random tail's SIZES are drawn after it and so are unchanged; their
      per-grid seeds shift by one, so those five boards are different grids of
      the same sizes." One clause.
