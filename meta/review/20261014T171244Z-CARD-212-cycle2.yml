findings:
  - id: G-001
    severity: low
    classification: Minor
    gating: false
    category: testing
    type: gap
    file: src/nonogram/admin/static/solver.js
    line: 693
    title: "The debounce is unpinned in both of its parameters: RESIZE_SETTLE can be 5000 ms and the coalescing can be removed entirely, and every test stays green"
    description: |
      Two of my nine mutants survived here, and they are the two that define
      the listener's cost:

        M-D  `const RESIZE_SETTLE = 150;` -> `5000;`
             tests/test_puzzle_solver_zoom.py -k SurvivesADoubledRedraw: ALL PASS.
        M-B  `clearTimeout(resizeSettling);` deleted, so every resize event
             schedules its own redraw instead of one at the end
             tests/test_puzzle_solver_zoom.py -k SurvivesADoubledRedraw: ALL PASS.

      Both survive for the same structural reason. The new tests reach their
      assertions through `page.wait_for_function(...)`, whose default timeout
      is 30 s, so any settle delay up to ~30 s reads as success; and
      `test_a_board_too_small_to_double_is_not_redrawn_by_a_resize`
      (tests/test_puzzle_solver_zoom.py:812) waits `page.wait_for_timeout(500)`
      — described as "four times RESIZE_SETTLE" — which is a bound on the
      *absence* of a redraw, not on the presence of one, and passes just as
      happily when RESIZE_SETTLE is 5 s. M-B survives because
      `page.set_viewport_size` fires exactly ONE resize event, so a listener
      with no coalescing is indistinguishable from one with it; the suite has
      no multi-event case.

      Why this is worth writing down rather than shrugging at. The card's
      comment states both properties as fact — "Long enough that dragging a
      window edge redraws once at the end rather than on every event, short
      enough that letting go feels like it settled immediately" — and this
      project's standing rule is that a comment claims only what the code and
      its tests demonstrate. More to the point, the coalescing is the reason
      the listener is affordable at all: the card's own stated hesitation at
      cycle 1 was the cost of a redraw, F-002's early-out was built to make
      this listener cheap, and a new DRAW_MARK exists precisely so that cost
      is countable — and then the one cost the listener introduces is the one
      thing not counted. A later edit that drops the clearTimeout turns a
      window drag into one full redraw per resize event (dozens) with nothing
      going red.

      Not gating: the behaviour is right today, both mutants are
      cost-only (the final board is identical either way), and no AC or
      standing rule is touched.
    suggestion: |
      Two cheap pins, both using machinery the fix already added:

      1. Bound the settle. Pass a timeout to the waits in the two new resize
         tests — `page.wait_for_function(..., timeout=600)` — so a settle
         delay over ~0.6 s reds them. One argument, twice.
      2. Count the coalescing. In one new test, dispatch a burst of synthetic
         events and assert the draw marks rise by one settle's worth rather
         than by the number of events:

             before = page.evaluate(DRAWS)
             page.evaluate("() => { for (let i = 0; i < 8; i++) "
                           "window.dispatchEvent(new Event('resize')); }")
             page.wait_for_timeout(500)
             assert page.evaluate(DRAWS) - before <= 2   # not 8

         That kills M-B and M-D together, needs no viewport changes, and is
         the natural use of the mark the card introduced.
    confidence: high
    source: dynamic
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

