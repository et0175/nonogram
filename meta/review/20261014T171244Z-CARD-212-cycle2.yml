verdict:
  summary: >-
    All three gating findings are genuinely closed, and closed in the strong
    form rather than the convenient one. The resized board is measurably the
    board a reload draws — identical on every field I compare, at four
    windows, both directions — and the card corrected a number of mine in the
    process rather than adopting it quietly. The early-out's monotonicity
    premise holds in the code as written (algebraically, and with zero
    counterexamples in 210 measured board/viewport pairs), the draw counts
    reproduce exactly, and the mark that pins them cannot undercount — a
    mutant that moves it out of drawBoard dies. The regrouped fifth-line
    helper is the minimum relaxation and still catches a duplicate with the
    wrong rule or the wrong data-line, verified with two mutants aimed at
    that specific risk. My own mutation set found three survivors, all of
    them cost-or-boundary rather than behaviour: the debounce's two
    parameters are unpinned and the bar's exact-equality case is
    unreachable. Those, a hint highlight that a 1 px resize now erases, a
    sub-pixel draw-count pin on the 22x14 boundary, and one imprecise comment
    are the whole remainder — five Minor findings, none gating.
