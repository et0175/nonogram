  - id: G-003
    severity: low
    classification: Minor
    gating: false
    category: ux
    type: risk
    file: src/nonogram/admin/static/solver.js
    line: 636
    title: "A hint's highlight is now erased by a 1 px window resize, where before it took crossing 820 px"
    description: |
      Measured on a 30x30 at 1280x720: click Hint -> 1 cell carries
      `.is-hinted`; resize the window from 1280 to 1279 px (a no-op for the
      layout: the board redraws to the same single-gutter rendering) and wait
      out the settle -> **0 cells carry `.is-hinted`**, while the "Hints: 1"
      readout survives. The mechanism is pre-existing and deliberate —
      `redraw()` sets `hinted = null` with the comment "the old highlighted
      element no longer exists" (solver.js:636) — and the card discloses the
      cost honestly ("exactly as a breakpoint-crossing redraw has since
      CARD-193"). What changed is the exposure: the trigger moved from a rare
      event (crossing the phone breakpoint) to an ordinary one (any window
      resize of any big board, including the resize that mobile browsers fire
      when the URL bar collapses on scroll).

      A hint is the one piece of this UI whose whole purpose is a transient
      "look here". Losing it to a stray resize is small but it is squarely in
      the card's own territory: the fix made the board follow the window, and
      the one view-state that does not survive the journey is the one the
      player was told to look at.

      Not gating: nothing recorded is lost (the hint is counted in the
      history and the count survives), the player can hint again, and the
      card states the cost rather than hiding it.
    suggestion: |
      Keep the hint as coordinates rather than as an element and re-apply it
      after a redraw — about three lines, and it uses the row-major
      `cellElements` the redraw already rebuilds:

          let hintedAt = null;            // { row, col } instead of the element
          // in the hint path:   hintedAt = hint ? { row: hint.row, col: hint.col } : null;
          // at the end of redraw():
          if (hintedAt) cellElements[hintedAt.row * payload.width + hintedAt.col]
            .classList.add("is-hinted");

      Pin it with one assertion inside the existing resize test: hint, resize,
      and the same cell still carries .is-hinted. If the owner would rather
      keep today's behaviour, say so in the notes as a decision instead of as
      an accepted side effect — it is now reachable by accident.
    confidence: high
