findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: meta/architecture/decisions/adr/0022-grid-extent-and-size-range.md
    line: 404
    title: "R4's widened scope overclaims: admin's call to derive_extent transfers the no-top-clamp arithmetic, but admin deliberately suppresses R4's 'refused ... never silently clamped' clause"
    description: |
      R4's statement text has two clauses: (a) the longer-side/no-top-clamp
      derivation arithmetic, and (b) "A source whose ratio exceeds N/5 is
      refused with a message naming the smallest N that would accommodate
      it, never silently clamped." The new History entry (line ~404-417)
      and Negative-consequence bullet (line ~299-313) assert, for both R3
      and R4, that "their checks genuinely do reach admin's behaviour
      through those shared functions" — stated as a blanket claim covering
      the whole rule.

      Verified independently: src/nonogram/admin/image_manager.py's
      predict_size() (lines 108-119) does call derive_extent directly, so
      clause (a) genuinely transfers — confirmed by reading
      random_grid.derive_extent/_derived_extent, which never clamps the
      longer side. But on SizeTooSmallForSource (derive_extent's own
      refusal, raised when the source exceeds N/5), predict_size does NOT
      refuse: it loops candidate N upward until one works and silently
      returns that instead (image_manager.py:113-119), per its own
      docstring: "ask for the smallest N that can, rather than surface a
      CLI-style refusal in this UI." That resolved (width, height) is then
      fed straight into create_puzzle_from_image at the four call sites in
      app.py (lines 341, 1161/1196, 1193/1196, 1224/1227) — so the actual
      generated puzzle uses the silently-substituted N, not the size the
      user configured, and with no message identifying that a refusal
      occurred or which N was substituted (only predicted_width/height are
      surfaced via to_dict(), with no "refused, using N because ..." text).
      This is exactly the class of gap the ADR's own new R2 rationale
      warns against ("a scope that lists territory a rule's check cannot
      reach is a worse audit surface than an honestly absent one") but
      applied asymmetrically: the card caught it for R2 and excluded R2,
      and caught the "shared function" half of the argument for R4, but
      did not check whether R4's own second clause is actually reached by
      admin's calling code before writing "their checks genuinely do reach
      admin's behaviour" as a blanket statement covering all of R4.

      This is not a new bug introduced by this diff — image_manager.py is
      untouched by this change, and this behaviour predates CARD-048. The
      finding is about the accuracy of the ADR's own claim now that R4's
      scope.code includes admin: a future system-contract audit reading
      "ADR-0022/R4 scope includes src/nonogram/admin/**" plus the History
      entry's "genuinely do reach" language would reasonably conclude
      admin fully honours R4, when in fact only the arithmetic half does.
    suggestion: |
      Narrow the claim rather than the scope: either (a) qualify the
      History/Consequences language to say R4's *derivation arithmetic*
      (not its refusal-and-message clause) is what transfers to admin via
      derive_extent, mirroring the precision already applied to R2's
      exclusion, or (b) file a small follow-up card to surface an explicit
      "requested size N unavailable, using N' instead" message in the
      admin UI so the refusal clause genuinely transfers too. Either is a
      documentation-only or trivial-scope fix consistent with this card's
      size; it does not require re-deriving anything else in the ADR.
