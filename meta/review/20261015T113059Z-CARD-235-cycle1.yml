  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: meta/profiling/card-235-poll-interval-ab.txt
    line: 46
    title: "The 92.97 s GIL figure is quoted from the one measurement whose own table contradicts the mechanism"
    description: |
      The decision (0.05 s over 0.01 s) is robust and I confirmed it three
      independent ways: the two committed full-suite profiles (family total
      256.57 s at 0.05 vs 306.45 s at 0.01, with host drift running *against*
      0.05 — the rest of the suite was 90 ms/test in the 0.05 run against
      84 ms/test in the 0.01 run), and both rounds of the maybe.py A/B on
      `total`. That part of the review is clean.

      The *stated mechanism and its number* are weaker than three places in the
      tree now assert them to be:

        * The cited table's own first row refutes monotonic contention. At
          0.5 s the serve thread wakes least often of the three, so under the
          stated mechanism it should have the cheapest `call`; measured, it has
          the dearest — 345.20 s, 99.09 s above 0.05 s's 246.11 s. The file
          notes that family-only runs are not comparable to full-suite slices
          but never addresses this contradiction inside its own table, and the
          92.97 s figure is read off that same column.
        * Round 2 of the confirming maybe.py A/B has 0.01 s and 0.05 s tied
          *exactly* on call (51.46 s each). The claim that it "ranks the three
          intervals the same way" holds for `total`, not for `call`, which is
          what the mechanism is about.
        * The full-suite pair, normalised for the 7 % remainder drift, supports
          roughly 61–76 s — not 92.97 s.

      Why this is worth a cycle's attention at all: the card exists because
      CARD-217 committed a confident per-test attribution that one run's shape
      supported and the mechanism did not. Committing a second attribution of
      the same kind — to three decimal places, in a constant's docstring that
      also sets policy ("which is why this is a constant per file and not one
      shared between them") — reproduces the defect this card just paid to find.
    suggestion: |
      Keep the decision and the artefacts; soften the three statements of the
      mechanism (the constant's docstring in tests/test_puzzle_solver_page.py,
      meta/profiling/card-235-poll-interval-ab.txt, and the "Why 0.05 s" section
      of card-235-browser-teardown.md) to a direction-only claim, cite the
      full-suite pair as the primary evidence rather than the family-only table,
      and state the 0.5 s row's anomaly instead of leaving it for the next reader
      to find.
    confidence: high
    source: static
