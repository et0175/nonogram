findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_page.py
    line: 725
    title: "Nothing fails when the fixture stops applying the poll interval — the 126 s saving is unguarded"
    description: |
      Step 8f mutant M2: restore the pre-card statement
      `thread = threading.Thread(target=server.serve_forever, daemon=True)`
      while leaving `_SERVE_POLL_INTERVAL_S = 0.05` in place — i.e. the shape a
      future refactor of this fixture would most plausibly take — and run the
      card's own guard file:

          tests/test_browser_fixture_scope.py .................... [100%]  20 passed

      The stdlib 0.5 s poll is back, the entire 126.35 s teardown saving is
      gone, and not one of the twenty tests notices.

      Root cause: every AC-1 bar in `_failed_bars` is computed from two
      committed text artefacts (`suite-durations-20261015.txt` vs
      `card-235-durations-after.txt`), which no code change can move. The one
      live value read from the code is the declared constant in the last bar,
      `saving["after_teardown"] / after_tests >= _SERVE_POLL_INTERVAL_S + 0.02`,
      and that bar is one-sided in the wrong direction: raising the constant
      makes it strictly more lenient (0.0275 >= 0.52 is False), so it can only
      ever fire when the constant is *lowered*, which would be an improvement.

      Mutant M1 (constant 0.05 -> 0.5, kwarg still passed) *is* caught, but
      only obliquely, by `test_the_bars_reject_the_pre_fix_teardown`'s
      `assert len(missed) == 5` — and its failure message then reads "a
      reverted poll interval still clears some of AC-1's bars, so those bars do
      not test anything", which is a misleading diagnostic for "somebody
      reverted the poll interval".

      The claim this contradicts is in the code: MIN_SECONDS_SAVED's comment
      calls these bars "regression tripwires set below that with headroom".
      They are tripwires on the artefact text, not on the code. The ACs cannot
      be blamed for the hole — AC-3/5/6 were written for a behavioural risk
      that shows up in test outcomes, whereas a constant that silently stops
      being applied is a performance regression invisible to every test
      outcome. That risk arrived with the chosen solution and has no guard.
    suggestion: |
      Add one behavioural guard, about a second of suite time, to
      tests/test_browser_fixture_scope.py — pin the behaviour, not the literal:

        * start a werkzeug server exactly as `live` does, call `shutdown()` and
          assert it returns well under the stdlib default (e.g. < 0.2 s), so the
          test fails whichever way the interval stops being applied; or
        * monkeypatch `threading.Thread` around one `live` setup and assert the
          recorded `kwargs["poll_interval"] == _SERVE_POLL_INTERVAL_S`.

      While there, make `test_the_bars_reject_the_pre_fix_teardown` say what it
      means when the constant itself moved, instead of reporting it as "the
      bars do not test anything".
    confidence: high
    source: static
