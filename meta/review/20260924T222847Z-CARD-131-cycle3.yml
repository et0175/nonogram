findings:
  - id: F-201
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 3169
    title: "The new comment claims `shown_ids` \"cannot change the outcome\"; deleting the leg is indeed inert, but corrupting it silently reorders the newly added puzzles"
    description: |
      [static + measured] The fix round chose cycle 2's F-102 option "keep it and
      document why it is inert" over "drop it". The comment (app.py:3169-3178)
      now reads: "`shown_ids` cannot change the outcome: `kept_ids` IS the whole
      kept selection, so on the re-POST `_fold_tab_into_selection` either drops
      everything and re-adds the ticks, or keeps everything and the
      `dict.fromkeys` dedupe collapses the repeat — the same set either way."

      The REASONING is correct, and I verified its conclusion rather than
      accepting it: mutant Y1 (the leg replaced by `+ []`) SURVIVES the scope,
      and a probe through the rendered form confirms it is a genuinely
      equivalent mutant — the admitted puzzles land in the book in the same
      order either way. So the leg is provably inert against DELETION, which is
      the only case the reasoning covers.

      The CLAIM is broader than the reasoning, and it is false. Two further
      mutants of the same leg survive the whole scope (158 passed, exit 0) and
      are NOT equivalent:
        - Y5 `+ [("shown_ids", pid) for pid in kept_ids[:1]]`
        - Y2 `+ [("shown_ids", pid) for pid in overrides]`
      Measured through the rendered confirmation form on the mixed submission,
      under Y5 the three admitted puzzles land in the book at ticked-positions
      [1, 0, 3] where pristine gives [0, 1, 3] — the two overridden tiles swap.
      Mechanism: a PARTIAL `shown_ids` makes `_fold_tab_into_selection`
      (app.py:2786) keep `[pid for pid in _kept_selection(book_id) if pid not in
      shown]` non-empty, so `kept + ticked` puts the unshown ids first and
      `dict.fromkeys` then freezes that order. The order handed to
      `add_puzzles_reporting_refusals` is the order new puzzles are placed
      inside their level, i.e. INV-009's "within a level the order is the
      owner's arrangement" — and it is what the printed book prints in.

      Why this is Minor and not the family escalation: the leg's realistic
      failure mode is deletion, which is genuinely inert; the damage under
      corruption is a reversible within-level ordering (the arrange step can fix
      it), not a store-persisted INV-006 override or a lost membership. But the
      comment is now load-bearing documentation — the reason the leg was kept —
      and the next reader will take "cannot change the outcome" at face value.
      A plausible refactor that re-sources the leg (e.g. from
      `request.form.getlist("shown_ids")` rather than `kept_ids`) lands exactly
      in the uncovered case.
    suggestion: |
      One-line correction, not a code change: say what was proved — "dropping
      `shown_ids` cannot change the outcome (the dedupe collapses the repeat);
      a PARTIAL `shown_ids` would reorder the joiners inside their level, which
      is why the leg carries the whole kept selection and nothing else." If the
      leg is ever re-sourced, an assertion on the joiners' order in
      test_a_mixed_submission_carries_each_decision_and_invents_none (it already
      computes `[pid for pid in ticked if pid in held]`, which is order-blind by
      construction — compare against `held`'s own order instead) closes it.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

