    title: "Module docstring still says image mode 'has no grid source yet (CARD-015)' — false on both halves"
    description: |
      The module docstring's third framing paragraph reads:

        "The naming layer is called directly only for the ``image`` mode, which
         has no grid source yet (CARD-015)."

      Both clauses are now untrue:

      1. Image mode HAS a grid source — `src/nonogram/sourcing/__init__.py:48`
         registers `IMAGE: image.generate` in `_SOURCES`, and an end-to-end run
         (`--mode image --image pictures/cat.jpg --size 10`) writes a real puzzle.
      2. The naming layer is no longer "called directly only for image mode":
         this diff's own AC-090 happy-path test goes through the full
         `generate(...)` pipeline for image mode (tests/test_naming.py:275), while
         `test_a_library_run_without_a_key_is_still_named_before_it_fails`
         (tests/test_naming.py:253) calls `name_for` directly for LIBRARY mode.

      This is the same overclaim the diff correctly fixed one function away, in
      `test_the_auto_name_names_the_mode_it_was_generated_in`'s docstring
      (tests/test_naming.py:192-194) — which is what makes leaving the module-level
      twin a half-fix rather than an untouched pre-existing artifact. The file is in
      the diff and the identical sentence was edited in it.
    suggestion: |
      Reword the paragraph to describe what the file now does, e.g.:

        "*The name is checked on the aggregate, not on a helper's return value*,
        wherever the pipeline can produce one: AC-042/043/044/090 say 'when the
        puzzle is created', so those assertions are about ``generate(...).name``.
        The naming layer is called directly only where the run is expected to fail
        downstream (a library run with no key, an image run with no usable stem) —
        naming's own reasoning about a request, before sourcing gets it."
