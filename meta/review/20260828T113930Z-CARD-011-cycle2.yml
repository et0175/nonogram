  - id: F-009
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/orchestrator.py
    line: 760
    title: "Decomposed (NFD) non-ASCII names still lose their accents in the stem"
    description: |
      NEW in cycle 2, non-gating, and NOT a regression introduced by the fix.

      `\w` matches Unicode letters and digits but not combining marks (category
      Mn/Mc), so a name in NFD form is still mangled: --name "e\u0301clair"
      (the decomposed spelling of "éclair") sanitizes to stem "e-clair", because
      the combining acute becomes a "-". The precomposed NFC "café" now works
      correctly, so the same user-visible name behaves differently depending on
      which normalization form the shell/input method produced.

      Milder than F-001 in every respect — the stem is still contained, still
      readable, still non-empty (no misleading fallback), and the aggregate keeps
      the name verbatim per AC-044 — and the old ASCII-only regex produced the
      identical "e-clair", so nothing regressed. Recorded because it is the last
      residue of RC-1 and because it will resurface in CARD-014's PDF header.
    suggestion: |
      Normalize before sanitizing: `unicodedata.normalize("NFC", puzzle.name)`
      ahead of the `sub()` at orchestrator.py:760. One import, one call, and it
      makes the stem independent of the input's normalization form. Add an NFD
      case to the parametrized test if adopted.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

