    description: |
      Carried from cycle 1. Confirmed untouched: the orchestrator delta is one
      hunk at :716, and `_validated_name` (:262) is unchanged.

      One refinement the fix cycle introduces, worth folding into the eventual fix
      rather than opening a separate finding: the widened allow-list makes the stem
      unbounded in *bytes* as well as in characters. A 100-character CJK name is
      300 UTF-8 bytes — fine on APFS (255-character limit, verified: the write
      succeeds on this machine) but over NAME_MAX on ext4/NTFS (255 bytes).
      F-005's suggested "~200 characters" bound should therefore be expressed
      against the encoded length, not the character count.
