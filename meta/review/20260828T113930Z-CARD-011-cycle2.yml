    file: src/nonogram/orchestrator.py
    line: 722
    title: "Non-ASCII --name silently loses its filename identity (truncated, not fallback)"
    description: |
      CYCLE-2 CONFIRMATION — VERIFIED FIXED.

      (a) Regex changed as claimed. orchestrator.py:722 now reads
          `_UNSAFE_STEM_CHARACTERS = re.compile(r"[^\w.-]+")`, with a comment
          recording why \w is Unicode-aware on a str pattern.

      (b) Path traversal still fully blocked. Re-ran and extended the adversarial
          corpus to 71 names against the real `_filename_stem` — ../../escaped,
          20x ../ + etc/passwd, /etc/passwd, //etc//passwd, ..\..\win,
          ..\..\..\Windows\System32\drivers\etc\hosts, C:\Windows\win.ini,
          \\server\share\file, NUL bytes ("a\x00b", "\x00", "a\x00/../../b"),
          ".", "..", "...", "....", ".hidden", "~/secrets", "$HOME/x",
          CR/LF/TAB, and the lookalike/format set U+202E (RTL override),
          U+2044, U+FF0F, U+2215, U+29F8, U+200B, U+200D, U+00A0, U+FEFF,
          U+0085, U+2024, U+FF0E, U+3002. Result: 0 escapes. Every stem stayed a
          single path component (no os.sep, no NUL, never "", "." or ".."; lexical
          normpath join always resolved inside the target directory).

          Stronger than the corpus, and the reason the fix is safe by construction:
          an exhaustive scan of all 1,114,112 Unicode codepoints found that
          (i) 0 codepoints matched by \w are in category Cc/Cf/Zs/Zl/Zp, and
          (ii) 0 codepoints matched by \w NFKD-decompose to "/", "\\", ":" or NUL.
          Python's \w on a str is `ch.isalnum() or ch == '_'`, i.e. Unicode L*/N*
          plus underscore — no separator, control or format character can be in it.

      (c) Non-ASCII survives intact: кот-2026, мой-пазл-1, café, Grüße-2026,
          日本語, パズル-01, 한글이름, Ω-omega, naïve_name, Ⅻ-roman, ½-vulgar,
          and astral-plane 𝔘𝔫𝔦𝔠𝔬𝔡𝔢 all round-trip unchanged. The cycle-1
          truncations ("café"->"caf", "кот-2026"->"2026") are gone.
    suggestion: null
