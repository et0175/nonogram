verdicts:
  paint_fill_widening:
    decision: "JUSTIFIED -- it closed a real route, and the new exemption set is genuinely derived"
    rederived_by_me: >-
      I built the shape and tried it, as asked. A grid walked as thin filled
      rectangles over a real layout's 11 vertical and 11 horizontal GridLines
      emits 22 `re f` operators at the layout's own positions and its own
      thick_rule/thin_rule widths (1.92 px and 0.96 px) -- the identical grid,
      with ZERO m and ZERO l, so AC-3's drive half (which reads m/l pairs) would
      not see it either. I then loaded the PRE-fix stroke_violations out of
      85414ac7 as its own module and ran it on that walk: [] -- ADMITTED. The
      post-fix guard returns two violations. So the paint='fill' exception was
      admitting a complete third grid walk, which is precisely what AC-3 exists
      to prevent, and dropping it was not scope creep but the same finding one
      layer down.
    is_the_new_exemption_set_derived: >-
      YES, and the shape is right. The GUARD consults only the derived predicate
      (a function is exempt exactly when it takes a parameter named `grid`) and
      no longer consults what a call paints. The two-name equality in
      test_the_only_exempt_stroker_is_the_solution_dependent_one is not a
      substitute for that derivation -- it is a change-detector over which
      functions actually USE the exemption, read off the module by _strokers_of,
      which now reads all eight derived doors. And it is load-bearing in exactly
      the way cycle 1 predicted it would need to be: mutant L1 gives a
      non-exempt function an UNUSED grid= parameter and plants a stream.line
      inside it -- the laundering route -- and that cell reds. draw_answer_cells
      belongs in the set for the one reason the exemption encodes: its filled
      cells' EXISTENCE is a function of the solution, which no routine without
      the grid could place. The controls are shapes the detector was not written
      from (module level, nesting, name binding, a class method, a bare
      close_path, a curve, a round mark, a paint decided elsewhere, and the
      thin-fill grid itself as a parametrized control with a one-parameter
      sibling that is denied).
  declared_clip_divergence:
    decision: "DECLARING IS RIGHT for this card -- exactly right, not a defect being documented"
    rederived_by_me: >-
      Both strings and both widths, independently. My own raster instrument
      (hooking PIL.ImageDraw.ImageDraw.text over a real min-trim interior walk)
      shows the raster page setting 'Puzzle 2 - Owl in a P...' with the ellipsis,
      alongside 'Puzzle 1 - Snowflake' whole and the two full answer pages'
      captions absent: 1 whole, 1 clipped, 2 omitted. The measures, at the
      caption's own 42 px: FreeTypeFont.getlength('Puzzle 2 - Owl in a P<ell>') =
      491.9844 and the /Widths sum = 492.8700, a delta of 0.8856 px across a 492
      px string. The whole caption measures 514.9688 / 515.0040. And the
      straddling integer measure is UNIQUE: exactly one integer in 1..515 makes
      the raster loop produce the raster string and the vector loop the vector
      string, and it is 492 -- COMP-007's caption_slot figure, so the cell's
      straddle search lands on the production boundary rather than on a
      convenient one.
    why_right: >-
      /Widths is what a PDF viewer sums, so the vector page's clip is correct for
      its reader; FreeType is what rasterises the bitmap, so the raster page's
      clip is correct for its. Both loops are the SAME rule -- clipped[:-2] +
      ellipsis while the width exceeds the measure -- applied with each medium's
      own correct measure. Neither writer invented a discrimination. The two
      alternatives that would force agreement are both worse: make the vector
      writer measure with getlength and its page overflows its declared slot in
      a real viewer; make the raster writer sum /Widths and it clips a character
      it has room for -- and that loop lives in book_pdf_generator.py, the
      declared hotspot whose blob this card correctly never opened.
      Three further facts carry the decision. (1) It is LATENT, not printed:
      _write_pdf chooses no medium per page until CARD-298, so no shipped book
      contains both pages today, and CARD-298 is the named owner. (2) It is now
      VISIBLE where before the fix round a one-character clip move passed 596
      cells: mutant D3 (the declaration deleted) reds 2 cells, so the divergence
      is real and the declaration load-bearing; mutant D4 (the declared raster
      string moved one character) reds 4 cells, so a STALE entry reds rather
      than going quiet. (3) The reason is machine-checked, not told: both
      readings are clips of the same caption, exactly one loop step apart, and
      the two engines' widths of the raster string straddle an integer measure
      by under one pixel.
    one_qualification: "see F2-03 -- the declaration's stated impossibility is stronger than what is established"
  declared_survivors:
    - id: S15
      what: "leader_dots' trim loop (cycle 1's M8)"
      decision: "LEGITIMATELY DECLARED"
      rederived_by_me: >-
        Mutant D12 deletes the trim loop outright: SURVIVED, 225 cells. And it
        deserves to -- in my own independent reimplementation with firing
        counters the trim loop fires 0 times over 1,003,001 reachable cases AND
        0 times over the synthetic n-indexed exact sums k=0..2000, which is the
        domain where the grow loop fires 888 times. So this loop is dead in both
        domains, the declaration's bound is now TRUE rather than false, the cell
        asserts the bound rather than the identity, and G-1 is the right reason
        to keep the code.
    - id: N9
      what: "the EC corpus's `clipped` bucket"
      decision: "LEGITIMATELY DECLARED, and better than a bare declaration"
      rederived_by_me: >-
        Mutant N9 deletes the `clipped += 1` increment: SURVIVED, 273 cells --
        unreachable on this corpus, as declared (measured printed + omitted +
        clipped == 24 with clipped == 0). What makes it legitimate rather than
        merely admitted is that the figure is PINNED and the pin is a
        measurement: mutant N9c tightens `clipped == 0` to `clipped == 1` and
        reds test_the_title_prints_only_on_answer_pages_across_a_corpus, so the
        zero is measured and a corpus that starts clipping reds on that figure
        instead of inflating `omitted`. It is also double-covered: a clip
        mis-sorted into `omitted` would push `printed` below its own 18 floor and
        red there too. One observation, not a finding: the elif predicate that
        recognises a clip here is a second, independent implementation of the one
        in _caption_reading and is never executed truthily on this corpus, so it
        is unverified code -- but every way it could be wrong reds some cell.
        (For completeness: my N9b, loosening `clipped == 0` to `>= 0`, survived,
        which is uninformative by construction -- loosening a true assertion can
        never red. Recorded so the row is not read as a finding.)
  absence_of_any_recording_pass:
    decision: "ADEQUATE for the claims this round certifies -- and I measured that rather than reasoned it"
    rederived_by_me: >-
      I built a recording instrument (outside tests/, per G-8) that rewrites
      every ast.Assert at any depth into a try/except keyed on its own lineno and
      RE-RAISES, so it keeps propagation as well as attribution. Per the standing
      rule I proved it on a bare `assert x == y` BEFORE trusting any zero: it
      reports ok 1 / fail 0 when holding, ok 0 / fail 1 when failing, re-raises
      with the empty message that broke a sibling card's rewriter, and reports a
      genuinely unexecuted assert as absent. Applied to the four classes carrying
      the certified claims -- TestAnswerTiles_ReuseTheGridRoutine (35 asserts),
      TestAnswerKey_IsTheOnlyPlaceTheTitleIsPrinted (20),
      TestVectorAnchors_ThePositionsAndNotOnlyTheStrings (26) and
      TestToc_TheLeaderRunNeedsNoCorrectionOnThisFace (14): 95 of 95 asserts
      REACHED, 0 NOT-REACHED. So no subsumed arm is hiding behind a plain-pass
      cell count in the cells that matter.
    my_own_false_positive_declared: >-
      My first run reported one NOT-REACHED assert at
      test_book_solved_answer_key.py:2461 (the `if profile == "book1"` control
      that AC-2's non-vacuity rests on). That was MY artefact: my driver passed
      the profile as "book-1" while the fixture's param is "book1", so
      _recorded's else-branch handed me the min-trim book twice and the Book 1
      arm never ran. Corrected, the class is 20 of 20. Recorded in full because
      it is the exact hazard the brief names -- a mis-driven recording instrument
      reports NOT-REACHED, which is indistinguishable from a survivor -- and
      because a reviewer who hid it would be making the same mistake the round
      under review is being judged for.
    judgement: >-
      Where a recording pass would have been load-bearing, it is not needed here
      for a reason worth stating: plain-pass tracebacks already give
      first-failing-assert attribution for free, and the fix round's structure
      splits its claims across one-assert-per-decision cells rather than piling
      arms into one cell -- which is why 24 of my 26 mutants red a cell set of
      1-4 and the two broad ones (20 and 36 cells) are mutants of the shared
      derivation, where a wide blast radius is the correct signal. The round was
      right to declare the gap rather than hide it, and wrong only in implying
      it could not be closed cheaply.

