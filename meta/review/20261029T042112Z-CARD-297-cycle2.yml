verdict: >-
  CERTIFIES this cycle at 8.5. All five of cycle 1's blocking findings are
  closed, re-derived by me rather than relayed, and the fix round's central
  numbers reproduce to the digit in independent domains: the door count (8 of
  16, my own tokeniser and a wider path alphabet), the clip divergence (491.9844
  vs 492.8700 px, delta 0.8856, a UNIQUE straddling integer measure of 492), the
  leader-dot identity failures (56 of the first 200, first at n=9, twelve inside
  120-153, the exact list), the reachability sweep (0 firings over 1,003,001
  reachable cases, 888 grow firings on the synthetic sums, worst relative error
  2.200e-16), the threshold pair (72.888 vs 73, no integer between them), the
  operator alphabet (TOC 6, answer 13, union 13, B/c/h absent on both profiles)
  and the collection gate (9570 -> 9674, +104/-0, comm -23 empty).

  All SIX of cycle 1's surviving mutants are dead, and in every case the cell
  the fix round named is the cell that reds. The widening beyond the finding is
  justified on measurement, not taste: I built the thin-filled-rectangles grid,
  confirmed it draws the identical 11+11 rules as 22 ``re f`` operators with
  ZERO m and ZERO l, loaded the PRE-fix guard out of 85414ac7 and watched it
  ADMIT that walk, and watched the post-fix guard deny it. The declared clip
  divergence is the right call for this card and is machine-checked in both
  directions, including a stale-entry tripwire. Both declared survivors are
  legitimate. My own recording pass found 95 of 95 asserts reached across the
  four classes carrying the certified claims, so the absence of a recording pass
  hid nothing that mattered.

  Three MINOR findings remain, none of them product-correctness, none blocking.
  The sharpest is a residual hole in the very mechanism this cycle rebuilt: the
  derivation's domain is ``vars(cls)``, so a drawing door on a BASE class of
  ``ContentStream`` is invisible to it and a grid walk through that door is
  admitted with every guard cell green. It is NOT live at HEAD -- today's class
  inherits only ``object`` and ``dir()`` and ``vars()`` agree on its sixteen
  members -- so it is a durability gap in the derivation, not an open route, and
  I decline to inflate it into a blocker on the second-to-last cycle.

