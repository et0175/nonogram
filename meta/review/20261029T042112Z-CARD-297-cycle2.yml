door_count_fourth_derivation:
  answer: "8 of 16 -- the fix round's figure is RIGHT"
  independence: >-
    Deliberately a different door from the fix round's. It does NOT use the
    project's own pdf_vector.operator_tokens: I enumerate the public surface with
    dir(cls) rather than vars(cls), tokenise each member's `operators` with my
    own regex (string literals stripped first, then every 1-3 character
    alphabetic token taken), and classify against the FULL PDF path alphabet --
    19 operators, m l re c v y h S s f F f* B B* b b* n W W* -- rather than the
    fix round's eight-member {m,l,re,c,h,S,f,B}. A wider alphabet and a wider
    enumeration, and the answer is the same set.
  members_included_and_why:
    - "begin_path -> emits `m`. A moveto starts a path; the grid walk cycle 1 drove went through it."
    - "line_to -> emits `l`. A lineto IS a ruled line."
    - "close_path -> emits `h`. Closes a subpath, so it is part of constructing one."
    - "curve -> emits `c`. A Bezier can approximate any rule."
    - "line -> emits `m l S`. The obvious door."
    - "rectangle -> emits `re S`. The second obvious door, and with paint='fill' the thin-rectangle grid."
    - "paint -> emits `S` ALONE. This is the member cycle 1's six omitted, and it is a door: S/f/B are the painting operators, and an unpainted path puts no ink on a page, so paint is the member that makes every constructed path real."
    - "round_mark -> emits `m c c c c h f`. The other member cycle 1's six omitted; a disc is a path like any other."
  members_excluded_and_why:
    - "to_points -> emits nothing (a unit conversion)"
    - "render -> emits nothing (encodes what was already recorded)"
    - "media_box -> a property, emits nothing"
    - "operators -> a property, emits nothing"
    - "stroke_grey -> emits `G` only (a colour-space state setter)"
    - "fill_grey -> emits `g` only (a colour-space state setter)"
    - "stroke_width -> emits `w` only (a line-width state setter)"
    - "text -> emits `g BT Tf Td Tj ET` and no path operator. Worth stating explicitly because it is the one genuinely arguable exclusion: a rule set as a run of underscore glyphs, or a disc set as a round dingbat, really does put a mark on a page without a path operator. It is excluded here because the guard is a PATH guard, and because that route is round_mark's own docstring's NAMED LIMIT with CARD-298 as owner -- declared open, not claimed shut. I agree with that disposition."
  three_circulated_counts_reconciled: >-
    Cycle 1's report body said six and listed line/rectangle/curve plus the
    begin_path/line_to/close_path trio "finished by paint()", treating paint as
    the finisher rather than a door and mentioning round_mark separately; the
    card's own quotation of cycle 1 already says eight and names all eight. So
    the 6 and the 8 are the same measurement with paint and round_mark counted
    differently, and 8 is the correct count. It is now load-bearing for AC-3 and
    the shipped cell commits to the eight names as an equality.

