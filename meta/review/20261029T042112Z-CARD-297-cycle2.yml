findings:
  - id: F2-01
    severity: minor
    confidence: high
    source: measured
    category: test-quality
    type: gap
    file: tests/test_book_solved_answer_key.py
    line: 2718
    blocking: false
    title: >-
      The rebuilt derivation's domain is ``vars(cls)``, so a drawing door on a
      BASE class of ContentStream is invisible to it and a grid walk through that
      door is admitted with every guard cell green -- the same route one refactor
      removed, though NOT live at HEAD
    description: >-
      ``_public_members`` reads ``vars(cls)`` -- the class's own ``__dict__`` --
      rather than ``dir(cls)``. Against today's ``ContentStream`` that is
      complete and I verified it independently: the class inherits only
      ``object``, and my own ``dir()``-based enumeration returns exactly the same
      sixteen names, so the shipped 8-of-16 is right and the guard has no hole
      today.

      Built and measured, not reasoned. I constructed the one refactor the
      committed change-detectors cannot see: a mixin carrying one drawing method
      (``hatch``, which walks begin_path/line_to/paint), mixed in ahead of
      ``ContentStream``, with the class's own sixteen public members left intact.
      ``_content_stream_doors`` returns the same eight doors and an empty
      ``_UNCLASSIFIED_DOORS``; ``_public_members`` returns sixteen;
      ``test_the_watched_set_is_derived_from_the_class_and_not_listed`` and
      ``test_every_unwatched_member_is_excluded_by_its_own_measurement`` are both
      GREEN; and ``stroke_violations`` on a loop that rules the grid through
      ``stream.hatch`` returns ``[]``.

      The committed cells DO catch the likely variants, which is why this is
      minor and not important. Moving an existing door onto a base class trips
      ``len(members) == 16``; adding a new door to ``ContentStream`` itself trips
      ``_UNCLASSIFIED_DOORS == ()`` (mutant D6 confirms that cell is
      load-bearing) and ``len(members) == 16`` as well. Only the specific
      combination -- a NEW door on a NEW base class, own surface unchanged --
      slips through.

      The ``vars()`` choice is deliberate rather than careless: it is what makes
      ``test_a_member_added_to_the_class_is_watched_without_being_listed``'s
      ``doors == ("zigzag",)`` work on a subclass. That is the one line the fix
      would also have to change.
    failure_scenario: >-
      A later card factors ``ContentStream``'s path construction into a
      ``_Paths`` mixin so a second stream class can share it, and adds one method
      there -- a polyline helper, or a hatch. CARD-233 then rules a solution
      tile's grid through it. Every cell in the AC-3 guard class stays green, and
      the third grid walk AC-3 exists to prevent lands with the suite passing,
      exactly as it would have before this cycle's fix.
    mutation: >-
      In-process, not a file mutant, because adding a base class cannot be made
      line-count-preserving. Reproduce by mixing a drawing method in ahead of
      ContentStream while re-binding its own sixteen members, then calling
      _content_stream_doors and the two guard cells against the result:
      doors unchanged at 8, unclassified (), both cells GREEN,
      stroke_violations on a `stream.hatch` grid walk -> [].
    remediation: >-
      Two lines. (1) ``_public_members`` iterates ``dir(cls)`` instead of
      ``vars(cls)``, filtering to names that are not private -- then an inherited
      door is driven and watched like any other. (2)
      ``test_a_member_added_to_the_class_is_watched_without_being_listed`` asserts
      ``"zigzag" in doors`` rather than ``doors == ("zigzag",)``, since the
      subclass will now also report the inherited eight, and gains one case
      planting the door on a BASE class rather than on the subclass -- which is
      the shape the derivation was not written from.

  - id: F2-02
    severity: minor
    confidence: high
    source: measured
    category: documentation
    type: false-claim
    file: meta/kanban/cards/CARD-297.md
    line: 0
    blocking: false
    title: >-
      The assert census the fix round ships as a CORRECTED figure is itself
      labelled with the wrong revision -- 277/212 is 193329ed, not HEAD, which is
      282/212 -- repeating one commit later the exact defect class it was closing
    description: >-
      Cycle 1's F-297-08 item 7 found the round's "225/163 asserts instrumented"
      to be PRE-FIX figures, HEAD being 233/169. The fix round corrected that and
      shipped a four-revision census counted, correctly, from
      ``git show <rev>:<path>`` so the worktree cannot contaminate it.

      Three of the four rows reproduce exactly in my own count: 6b0dfa30
      136/149, 1a42e8d7 225/163, 85414ac7 233/169. The fourth does not. 277/212
      is the count at ``193329ed``; at HEAD ``f9681797`` it is **282/212** --
      ``f9681797`` adds the threshold cell
      ``test_the_two_media_omit_at_the_same_slack_for_every_integer``, whose five
      asserts the census does not include.

      So the census was taken before the round's own last commit and then
      labelled "its HEAD" -- a figure-with-the-wrong-revision, which is precisely
      the shape of the finding it was correcting. Nothing downstream depends on
      the number; what makes it worth a row is that it is the one figure of the
      four that is not reproducible as labelled, in a card whose cycle-1 score
      was driven entirely by claims-layer accuracy.
    failure_scenario: >-
      A cycle 3 or a merge gate re-derives the census to check the trend, gets
      282/212, and cannot tell whether five asserts were added after the round
      reported or whether the round's instrument differed from theirs -- the same
      five minutes cycle 1 spent on the 225/163 version.
    mutation: "n/a -- a figure, and its control is recomputation, which is what this is: ast.Assert counts over `git show <rev>:<path>` for all four revisions plus 193329ed."
    remediation: >-
      One edit to the hand-back/worktree notes: label the census row 193329ed
      and add the HEAD row as 282/212, or re-take it at f9681797. Worth a line in
      the notes saying the count moved because f9681797 is itself a test commit,
      which is the useful fact rather than an embarrassing one.

