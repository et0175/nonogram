mutation_check:
  ran: true
  protocol: >-
    SHA-256 of every target asserted before each plant and after each restore
    (all restores ok, every target pristine afterwards, and
    `git status --porcelain -- src/ tests/ meta/architecture/` empty at the
    end); PYTHONDONTWRITEBYTECODE=1 with a __pycache__ sweep before AND after
    every run; restore from the in-memory original, never `git checkout --`;
    plants located BY TEXT with an asserted single occurrence, never by line
    number; the collected count asserted to be exactly 1 on every run; one cell
    per node id; -o addopts= spelled WITHOUT quotes in the subprocess argv.
  baseline: "both AC-139 node ids green unmutated (0.79s random, 0.14s image)"
  theirs_refired:
    - "R1  batch_generator.py:474 -> []                       | random FAILED (:531) | image PASSED (cross-site)"
    - "R2  app.py:1993 -> []                                  | random PASSED (cross-site) | image FAILED (:531)"
    - "R3  batch_generator.py:474 -> ['simple_overlap']       | random FAILED (:518) | image PASSED (cross-site)"
    - "R4  app.py:1993 -> ['simple_overlap']                  | random PASSED (cross-site) | image FAILED (:518)"
    - "R5a store always derives (puzzle_review.py:946 -> if True), call sites pristine | random PASSED | image PASSED — no spurious red, the control is correct"
    - "R5b R5a + batch_generator.py:474 -> ['simple_overlap'] | random FAILED at :532, the HAND-OFF identity arm, verbatim `assert tuple(names) == _strategies_from_grid(grid)` | image PASSED (cross-site) — the arm really is isolated"
    - "R6  LADDER_EXTENT -> MIN_SIZE | 9 runs: 7 FAILED (all at :571, the floor), 2 PASSED — NOT a control, exactly as the round itself recorded. See the figures note below."
    - "R7' IMAGES = (bird1.jpg, bird1.jpg), i.e. two pictures with an equal ladder — my variant of R7, which needed no third fixture | image FAILED at :621 `assert 1 == 2` | random PASSED (cross-site). This also PROVES the two shipped ladders differ."
    - "R8  search.py:629 ladder truncated to its first rung | random FAILED at :571 | image FAILED at :621 — reds at any extent, and the identity arms at :518/:532 stay green under it, which is the discrimination the round claimed. The card's table lists only the random cell; the image cell dies too."
  mine:
    - "X1  batch_generator.py:474 -> ['simple_overlap','line_dp','probe_contradiction'] — a FULL in-vocabulary ladder, not a prefix like R3 | random FAILED (:518) | image PASSED (cross-site)"
    - "X1b app.py:1993, same constant | random PASSED | image FAILED (:518): ('simple_overlap','line_dp','probe_contradiction') == ('simple_overlap',)"
    - "X2  batch_generator.py:474 -> list(reversed(puzzle.strategies)) — ORDER only, same multiset | random FAILED (:518)  | image PASSED (cross-site)"
    - "X2b app.py:1993, reversed | random PASSED | image FAILED (:518): ('probe_contradiction',...,'simple_overlap') == ('simple_overlap',...,'probe_contradiction')"
    - "X3  orchestrator.py:1303 guess append made unconditional — the G-5 INDEPENDENCE probe | random FAILED (:518) | image FAILED (:518): ('simple_overlap','guess') == ('simple_overlap',). Had the test fetched its expectation through record_difficulty, both sides would have moved together and X3 would have survived."
    - "X4  app.py:1993 -> list(puzzle.strategies)[:1] | random PASSED | image FAILED (:518): ('simple_overlap',) == ('simple_overlap','line_dp','probe_contradiction')"
    - "X4b batch_generator.py:474 -> list(puzzle.strategies)[:1] | random FAILED (:518) | image PASSED (cross-site)"
    - "Y1  app.py:2284 `strategy = None` deleted — AC-142's criterion | named node PASSED (SURVIVED) | 88 tests across four files PASSED (SURVIVED). This is F-009."
  totals: "16 plants, 31 node-id cells fired. 15 plants behave correctly (every same-site cell killed, every cross-site cell a correct discrimination, R5a a correct no-op, R6 correctly NOT a control). 1 plant SURVIVED everywhere: Y1 -> F-009."
  figures_remeasured:
    - "10x10 density 50, two independent samples with two different instruments: 88 of 100 candidates single-rung with 3 of 10 batches single-rung throughout; and 113 of 120 single-rung with 5 of 12 batches single-rung throughout (this second one read through a spy on add_puzzle, i.e. exactly what the test observes; handed and stored lengths were identical on all 120). Pooled 201/220 = 91.4% single-rung, 8/22 = 36% of batches degenerate. The card's 89 of 100 and 4 of 10 are both inside sampling range. CONFIRMED."
    - "20x20 density 50, 16 batches: 21 of 160 candidates single-rung (card: 26 of 160), 0 of 16 batches single-rung throughout (card: 0 of 16), per-batch cost 0.35-0.92s (card: 0.3-0.7s; my top end is under CPU contention from a sibling worktree's suite). CONFIRMED within one standard error (SE on n=160 is ~2.9 points)."
    - "The ~1e-8 arithmetic CHECKS OUT and is conservative: at the card's p=0.1625, p^10 = 1.28e-8; at my measured p=0.131, p^10 = 1.5e-9. The same arithmetic is what makes R3/R4 robust rather than lucky — the constant only survives a batch in which EVERY candidate is single-rung."
    - "The two picture ladders: bird1.jpg -> ('simple_overlap',), bird2.jpg -> ('simple_overlap','line_dp','probe_contradiction'), read off three independent mutant failures (X1b, X2b, X4) and identical on every run. They DIFFER, so the :621 distinctness assertion plus the :518/:532 identity assertions make NO constant able to pass the image half. CONFIRMED."

