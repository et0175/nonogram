disclosures_judged:
  double_run_of_the_suite: >-
    ACCEPTED, and the remedy is adequate. Verified rather than taken on trust:
    meta/kanban/.full-suite.lock does not exist (no residue), and no orphaned
    pytest belongs to this card — the only two live pytest processes on the
    host are the sibling CARD-330 worktree's own, confirmed BY CWD with lsof
    (no python process anywhere has a cwd under PythonProject4-card-318), and
    they were left alone. The remedy is the right one: the committed harness
    spells `-o addopts=` unquoted in the argv AND asserts `ran == 1` on every
    single run (scratchpad/card318fix/final_mutants.py:98), which is the only
    control that can catch this class — a wrong addopts shows up as a collected
    count, not as an error. Its docstring :11-12 names the trap in the spelling
    that caused it.
  committed_instruments: >-
    NOT A DEVIATION, and not raised as a finding. The precedent exists on this
    board: CARD-309 committed scratchpad/card309/census-converted.txt and
    impact.txt, CARD-330 committed scratchpad/card330/mutate.py. Commit
    e817eb34 adds three files, all under scratchpad/card318fix/, none under
    src/ or tests/. Committing the instrument behind a cited figure is the
    better practice and e817eb34 should be KEPT: I re-fired the round's own
    cells from my own harness and got the same verdicts, which is only
    checkable because the harness and its protocol are on disk.
  R6_self_correction: >-
    TO THE ROUND'S CREDIT, and confirmed by measurement. R6 was written as the
    random floor's control, passed, and the round recorded it as a FAILED
    MUTANT rather than as a passing test — then re-measured the figure its own
    comment had carried and corrected it. My 9 firings of R6 give 7 FAILED / 2
    PASSED, all failures at :571: it reds probabilistically, so it is not a
    control, which is precisely the round's conclusion. Replacing it with R8
    (reds at any extent, 2 of 2, while leaving the identity arms green) is the
    correct substitution. This is the behaviour the board wants and it counts
    upward in the score.
