  - id: F-201
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_difficulty_dots.py
    line: 672
    title: "draw.line is unguarded and draws a round mark: a complete second three-dot glyph lands with 548 green, and FLAT_METHODS' stated reason for not guarding it is factually false"
    description: |
      FLAT_METHODS (line 676, with "line" at 679) is justified at lines 672-675 by:
      "a straight line, a rectangle and the four calls that only *measure* have no vertex
      list and no string to hide a dot in". That is false for `line`. Pillow's
      `ImageDraw.line(xy, fill, width, joint)` takes an arbitrary-length coordinate
      sequence and draws a *connected polyline* (PIL/ImageDraw.py:226-232 →
      `self.draw.draw_lines(xy, ink, width)`), and with `joint="curve"` it even rounds the
      joints with `pieslice`. `line` is therefore a vertex-taking method sitting outside
      VERTEX_BOUNDED_METHODS (654) with no bound, no absence claim and no named limit.

      The package itself already writes uncountable vertex lists to it — `draw.line(ends, ...)`
      (export/png.py:186), `draw.line(list(side), ...)` (export/png.py:217),
      `book_pdf_generator.py:1429/1441/4703/4713`, `export/pdf.py:395` — so `line` is the one
      round-capable method with both an uncountable-argument precedent and zero guard.

      EXECUTED (mutant L1, its own fresh pytest process, export/png.py restored from a byte
      copy and shasum-verified back to b43169cc…): a module-level helper
      `_draw_tier_dots_as_polylines(draw, box, rank)` that draws exactly this card's glyph —
      filled dots as a 240-radius fan of two-point `draw.line` calls, outlined dots as one
      closed 33-point `draw.line` polyline — **548 passed, 0 failed**. Mutant A2 (the same
      route behind `from PIL.ImageDraw import Draw` bound to the canonical name `draw`) also
      **SURVIVED** 548 green.

      The marks really are round, measured independently of the guard (standalone Pillow
      script, no nonogram import): the fan's filled dot is 41x41 px, aspect 1.000, 1329 ink
      px against `draw.ellipse`'s 1313 at the same radius (fill-vs-ellipse ratio 1.007 vs
      0.995) — indistinguishable on a printed page. The polyline ring is 43x43, aspect 1.000.

      This is not covered by any of the three named limits in the class docstring
      (1215-1230): `line` is inside ImageDraw, the call is written syntax (not `getattr`),
      and no string is involved. Worse, the blind spot is *blessed* by a control:
      `test_a_flat_shape_is_not_caught` (1350) pins `draw.line([(0, 0), (1, 1)])` as
      deliberately not-caught — true for two points, and the exact mechanism a 33-point ring
      uses.
    suggestion: |
      Human decision, not a one-line fix — which is why this escalates rather than recycles.
      Two coherent options, each with a real cost:
      (a) Move `line` into VERTEX_BOUNDED_METHODS. Then the 13 honest `draw.line` call sites
          must each pass a countable display or earn an exemption, and at least two of them
          (`draw.line(ends, ...)`, `draw.line(list(side), ...)`) cannot — they are computed by
          construction, so the exemption list would carry ~6-13 entries, each needing the
          "why it cannot draw a round mark" second assertion that NON_DRAW_RECEIVER_SITES has.
          That is a card, not a line, and it is exactly the regress the fix cycle correctly
          refused to enter for receivers.
      (b) Stop asking a syntax walk to prove "no second round mark" and switch the AC-4
          promise to the instrument that can: render a page and measure the ink (the project
          already owns both halves — _ink/_ink_box in this very file, and the roundness metric
          used above is four lines of numpy). A render-and-measure guard is blind to spelling
          altogether and is what CARD-207's printed proof will do anyway.
      Either way the class docstring's route-3 sentence ("a circle built out of vertices is
      bounded") and FLAT_METHODS' "no vertex list" rationale must be corrected first — they
      are false as written, today, on disk.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: deferred
    fixed_in: null
    dismissed_reason: >-
      AC-4 narrowed by owner decision 2026-10-16 (card amendment, item 1/5). The
      false half is fixed in the narrowing pass: FLAT_METHODS' rationale no longer
