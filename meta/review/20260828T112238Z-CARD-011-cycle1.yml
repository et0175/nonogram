  - id: F-008
    severity: info
    category: tech-debt
    type: question
    file: src/nonogram/orchestrator.py
    line: 409
    title: "Puzzle.name is Optional, so AGG-001's 'named at creation' stays representable-as-violated"
    description: |
      FR-015 and AGG-001 say every puzzle has a name set at creation, but the field
      is `name: str | None = None`. That leaves an unnamed aggregate constructible,
      which forces `_filename_stem` to carry a None branch and will force CARD-014's
      PDF header to carry one too. The docstring justifies it by analogy to
      grid/clues, but those are genuinely progressive while the name is not.

      Recorded as a question, not a defect: making the field required would have
      meant editing the five hand-built `Puzzle(...)` call sites in
      tests/test_export_{json,image,csv}.py, tests/test_orchestrator.py,
      tests/test_sourcing_library.py and tests/test_cli.py — all outside this card's
      declared `Touches:`. Optional was the in-scope choice, and it is tested
      (tests/test_naming.py:511), not dead.
    suggestion: |
      When a later card legitimately touches those test files, consider making
      `name` required and deleting the None branches rather than propagating one
      into CARD-014's PDF header.
