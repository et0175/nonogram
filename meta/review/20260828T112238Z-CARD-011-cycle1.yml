  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/orchestrator.py
    line: 259
    title: "DEFAULT_NAMES is process-wide mutable state and name_for() mutates on a read"
    description: |
      `DEFAULT_NAMES = NameContext()` is a module-level singleton whose `issued` set
      grows without bound, and `NameContext.name_for()` — a query-shaped method —
      mutates it via `_disambiguated`. Harmless in production (CON-001: one puzzle
      per invocation, so `issued` never exceeds one entry) and correct for ADR-0018's
      "current run's naming context", but it makes the default path order-dependent
      inside one process: two tests calling `generate(request)` without `names=` in
      the same clock minute would see the second name carry a "-1" suffix. Today
      exactly one test takes that path (tests/test_naming.py:576) and it asserts
      loosely (`startswith("random-")`), so nothing is flaky now — this is a latent
      trap for the next test that wants an exact default name.

      Related: an explicit --name is deliberately not recorded in `issued`, so in a
      future batch mode a user-supplied name equal to an auto-name would not
      disambiguate. Not reachable today.
    suggestion: |
      Either add an autouse fixture that gives each test a fresh
      `orchestrator.DEFAULT_NAMES`, or note the ordering dependency in the
      NameContext docstring so the next author does not assert an exact default name.
      Optionally rename `name_for` to something command-shaped (`issue_name`) to make
      the mutation visible at the call site.
    confidence: high
    source: static
