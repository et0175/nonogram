findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/orchestrator.py
    line: 718
    title: "Non-ASCII --name silently loses its filename identity (truncated, not fallback)"
    description: |
      `_UNSAFE_STEM_CHARACTERS = re.compile(r"[^A-Za-z0-9._-]+")` is an ASCII-only
      allow-list, so every non-ASCII letter in a user-supplied --name is replaced
      before the stem is built. Verified by execution against the built package:

          --name "мой-пазл-1"  -> file "1.json"
          --name "кот-2026"    -> file "2026.json"
          --name "café"        -> file "caf.json"
          --name "Grüße-2026"  -> file "Gr-e-2026.json"
          --name "кот"         -> file "random-2026-08-28-1421.json"

      Only the last case takes the documented "sanitizes to nothing -> fall back to
      the convention" path (orchestrator.py:755). The mixed-script cases do NOT fall
      back: they produce a truncated, misleading filename with no warning — which is
      precisely the name/file drift this card's consolidation exists to prevent.

      Nothing in FR-015, ADR-0016 ("both components sanitized for filesystem-safe
      characters") or CON-001 restricts --name to ASCII, and non-ASCII letters are
      filesystem-safe on APFS/ext4/NTFS. The allow-list is stricter than the ADR
      requires, and the extra strictness is what causes the loss.

      This is code added by this diff (_filename_stem and the regex are both new),
      on the user-input-to-filesystem surface the card newly created.
    suggestion: |
      Widen the class to Unicode word characters, which preserves the traversal
      property exactly (\w never matches "/", "\\", ":", NUL, or Cf format
      characters such as U+202E, and never matches U+2044 / U+FF0F lookalike
      slashes — verified against the same 29-name adversarial corpus):

          _UNSAFE_STEM_CHARACTERS = re.compile(r"[^\w.-]+")   # str pattern => Unicode \w

      Keep the `.strip("-.")` and the empty-stem fallback unchanged. Then add the
      stem assertions F-002 asks for, including a mixed-script case.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
