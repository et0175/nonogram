    title: "The sanitizer's output stem is never asserted, so F-001 passed a green suite"
    description: |
      `test_a_name_keeps_its_shape_on_the_aggregate_however_the_file_is_spelled`
      is the only test covering sanitization of ordinary names, and it asserts
      `puzzle.name == name`, `path.parent == tmp_path` and `path.suffix == ".json"`.
      The suffix is guaranteed by the export registry, not by the sanitizer, and the
      parent is guaranteed by `export.write`'s `directory` argument — so no assertion
      in the parametrized case constrains what the sanitizer actually produced. Its
      three cases ("a b/c", "cat:2026", "cat*") are all ASCII.

      Only two names in the whole file pin a stem: "../../escaped" -> "escaped"
      (line 528) and "..." -> startswith("random-") (line 553). Everything between
      those two extremes is unverified, which is exactly the band F-001 lives in.
    suggestion: |
      Assert `path.stem` in the parametrized test, with the expected value in the
      parameter list, and extend the cases to include at least one mixed-script name
      (e.g. "кот-2026" or "Grüße-2026") and one name with an extension-like tail
      ("name.json"). This turns the parametrization into a real characterization of
      the sanitization rule rather than a smoke test.
    confidence: high
