  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/orchestrator.py
    line: 755
    title: "An over-long --name surfaces as OSError/exit 5 after the whole run, not as InvalidPuzzleName/exit 3"
    description: |
      The stem is unbounded, so a --name longer than the filesystem's NAME_MAX
      reaches the writer. Verified end to end with a 300-character name:

          nonogram: error: [Errno 63] File name too long: '.../xxx….json'
          exit 5

      No traceback and no data loss (cli.main's OSError handler at cli.py:241 does
      its job), but two things are off. The exit code says EXPORT_REJECTED, while the
      CLI's own grouping rule is "what the user has to do about the failure" — here
      the user must change --name, i.e. INVALID_INPUT (3), the same group AC-045's
      empty name lands in. And the failure arrives only after a full generation run
      (up to ADR-0001's 30s budget) has been spent and discarded, whereas AC-045's
      sibling rejection happens before the seed is drawn.
    suggestion: |
      Add a length bound to `_validated_name` (e.g. reject a name whose sanitized
      stem would exceed ~200 characters) so an unusable name is refused inward, up
      front, as InvalidPuzzleName — same place, same exit code and same
      "no puzzle is created" property AC-045 already establishes.
    confidence: high
    source: static
