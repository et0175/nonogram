  - id: F-021
    severity: info
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2542
    title: "[pre-existing, not this card] a hand-typed empty ?status= turns the approved-only default off"
    description: |
      `status = request.values.get("status", "approved")` returns the default only
      when the key is ABSENT. `?status=` (present, empty) yields `""`, the store's
      `if filter_opts.status:` is then falsy, and the step offers draft and
      rejected puzzles as if they were approved — and the hidden `status` field
      then carries `""` through every subsequent tab switch and page move.

      Identical code is in the base at 2dd96af (`request.args.get("status",
      "approved")`), so this card neither introduced nor widened it; the only
      change is `args` -> `values`, which is what makes the filters survive a fold.
      Noted for a follow-up card, not for this one.
    suggestion: |
      `status = request.values.get("status") or "approved"` on this route and on
      the puzzle-list route that shares the pattern.
    confidence: high
    source: static
