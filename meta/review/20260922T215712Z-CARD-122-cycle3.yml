findings:
  - id: F-017
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/puzzle_review.py
    line: 768
    title: "tier_rank's SQL trim() and Python .strip() are not the same trim, so one stored spelling can rank differently in the two backends"
    description: |
      The tier rank is derived two ways and the claim (puzzle_review.py:57-62) is
      that they cannot drift because the SQL CASE table is *built by calling* the
      Python `_tier_rank`. The table's keys agree, but the normalisation applied
      before the lookup does not:

        * SQL   — `case(_TIER_RANK_BY_SPELLING, value=func.trim(func.lower(Puzzle.difficulty_tier)), ...)`
                  ANSI `TRIM()` removes spaces only.
        * Python — `_tier_rank` -> `difficulty.tier_of_record` -> `parse_tier`,
                  which does `text.strip().lower()`; `str.strip()` removes every
                  whitespace character.

      So a row stored as `"easy\t"` ranks 3 (ungraded, else_) in the DB branch and
      0 in the in-memory branch and in the route's `_tab_order` cross-check. The
      blast radius is bounded and is NOT the cycle-1/cycle-2 defect class: the set
      of rows is unchanged (the tier plays no part in `longest_side_range`), so no
      row can be hidden — only misplaced within the page the store handed over,
      because the route's `sorted(..., key=_tab_order)` would then genuinely move
      it. `func.lower` vs `.casefold()` is the same shape of gap and is a no-op for
      ASCII tier spellings.

      Probability is low: the pipeline writes the `Tier` enum value, and no path in
      the diff lets a user type a tier with a tab or newline in it.
    suggestion: |
      Normalise identically on both sides — either `func.trim(func.lower(col))`
      against a Python key built with `" ".join(value.split())`-style
      normalisation, or feed the CASE `value=` through the same replace/trim chain.
      Cheapest honest alternative: add a row carrying a non-space whitespace tier
      to `test_both_backends_spell_the_same_book_tab_order`'s corpus and let the
      test say which answer is correct.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-018
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2339
    title: "The lock guards each dict operation but not the fold's read-modify-write, and _keep_selection can write into an already-evicted store"
    description: |
      Cycle-2's F-015 asked for the mutations of `_pending_selections` to be
      guarded, and they are: `_selection_store`, `_kept_selection`,
      `_keep_selection` and `_drop_selection` each take
      `_pending_selections_lock` for one dict operation, none of them holds it
      across a call that takes it again, and there is no lock-ordering cycle — the
      finding as filed is resolved and the docstring's claim (app.py:2247-2252) is
      literally true.

      Two residuals the claim does not cover, both requiring concurrency:
      (1) `_fold_tab_into_selection` (app.py:2346-2350) is a read-modify-write
          across THREE separate acquisitions — `_kept_selection`, then
          `_keep_selection`, then `_kept_selection` again. Two interleaved POSTs
          for the same session and book (two browser tabs, or a double submit)
          can have the second overwrite the first's fold with a list computed
          before it.
      (2) `_keep_selection` calls `_selection_store(create=True)`, releases the
          lock, then re-acquires it to assign `store[book_id]`. If the map evicted
          that token in between (33rd session), the assignment lands in an
          orphaned dict and the tick is lost in silence.

      Nothing committed is at risk in either case — `add_puzzles_to_book` is the
      only commit point and does not read this map — and the panel is a
      single-user loopback tool (CON-015), which is why this is Minor rather than
      Important.
    suggestion: |
      Give the fold one critical section: acquire the lock once and do
      read-filter-write inside it (a private `_fold_locked(store, book_id, shown,
      ticked)`), and have `_selection_store` return the token with the store so
      `_keep_selection` can re-check membership under the same acquisition. Or
      state in the docstring that the guarantee is per-operation, not per-fold.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-019
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_admin_filter_side_range_and_name.py
    line: 261
    title: "The cross-backend order test deliberately builds a tie-free corpus, so BOOK_TAB_SORT's id tie-break is never compared across backends"
    description: |
      `test_both_backends_spell_the_same_book_tab_order` says so itself: "the
      corpus has no tie for the id to break", because the two stores mint
      different ids (UUID vs `puzzle_NNNNNN`) and rows are compared by
      `source_image`. That is the right call for THAT test, but it leaves the
      fourth sort term — the one that decides the order for every real tab, where
      many easy 20x20s tie on (tier_rank, shorter_side, longer_side) — compared in
      neither direction.

      I derived by hand that the two agree: `_row_to_dict` yields `str(uuid)`, the
      route and the in-memory branch both compare that string, and a canonical
      UUID's dashes sit at identical indices in every representation, so hex-order,
      byte-order and lexicographic order coincide. That is reasoning, not a run —
      and reasoning about "the two backends agree" is exactly what cycles 1 and 2
      cost this card.
    suggestion: |
      Add one case to the DB-backed test that stores two rows tying on
      (tier_rank, shorter_side, longer_side) and asserts the rendered order equals
      `sorted(ids)` — the ids differ between backends, but each backend can be
      checked against its OWN sorted id list, which is the property that matters.
    confidence: high
    source: static
