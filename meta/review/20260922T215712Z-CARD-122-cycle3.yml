  - id: F-020
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/book_select_puzzles.html
    line: 135
    title: "\"Clear this page\" moves the live counter to a number that does not stick unless the owner then submits"
    description: |
      `clearAll()` unticks this page's checkboxes and calls
      `updateSelectionCount()`, which immediately rewrites the aria-live counter
      (e.g. "37 puzzles selected" -> "7 puzzles selected"). Nothing is sent to the
      server until the owner presses a tab, a page, Apply, Clear-all or Add. If
      they instead leave by "Skip", "Cancel" or the browser's back button, the
      server-side kept set still holds those ids and the next render says 37 again.
      Symmetrically for "Select all on this page".

      This is inherent to "ticks are folded on submit" and is the same for an
      ordinary manual untick, so it is not a defect introduced by the fix — but
      the two named bulk controls make it look like a committed action in a way a
      single checkbox does not.
    suggestion: |
      Either say it in the footer text the page already carries ("changes on this
      page are kept when you move or add"), or make the two bulk controls submit
      buttons that fold and redirect like every other control on the screen.
    confidence: high
    source: static
