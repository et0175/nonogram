    title: "New token-level bullets in the _wrapped docstring miss the × branch's consumed M token"
    description: |
      The fix's bullets are stated as the rules of the function for any text, but the
      over-wide × branch (lines 578-586) appends the token after × raw and skips it
      (index += 2), bypassing the dot and × rules for that token. Repros at the 42 px face:
      _wrapped("aaaa × ·", f, 157) -> ['aaaa ×', '·'] (a line starts with a dot that has a
      word before it, against bullet 3); _wrapped("aaaa × × bbbb", f, 111) -> ['aaaa ×',
      '×', 'bbbb'] (the second × has a token before and after but is neither grouped nor
      kept off a line start, against bullet 2). Also "a × that opens text is not joined to
      anything" is false for "× · aa" -> ['× · aa'] and "× × bb" -> ['× × bb'].
      Unreachable (the note never has a dot or × as M; G-2 freezes its wording) and the
      outcome guarantees paragraph is already scoped to the note's text, so Minor.
    suggestion: |
      Add one clause, e.g. "the token after a × is taken as M whatever it is, and no other
      rule applies to it", and drop "is not joined to anything" for an opening ×
      (say "is not grouped with the token after it"). Docstring-only.
