verdict: >-
  NOT CERTIFIED at 7/10. The production code is a faithful, careful port and the
  declines (AC-3, AC-4's missing routine) are sound and honestly recorded. What
  blocks certification is the thing this card exists to deliver: controls that
  can see the new medium. Four of its structural claims are measurably wider
  than their controls, and three of them were measured by planting exactly the
  artefact the control names and watching the suite stay green — a 32-gon filled
  disc on the difficulty legend (248/248 green), a complete second grid
  implementation in the guarded module (4/4 green), and the page's entire body
  text set in 50 % grey (35/35 green). All four are in the family this board
  escalates on. Every fix is small and local to the test tree; none asks for the
  drawing to change. Baseline suite state at ef487a9a, verified by node id:
  tests/test_book_guide_page_vector.py (35) +
  tests/test_book_pdf_vector_primitives.py + tests/test_book_difficulty_dots.py
  = 248 passed; blast radius (test_book_interior_type_floor, test_book_page_frame,
  test_collected_names, test_suite_profile, test_book_pdf, test_export_pdf) =
  580 passed. G-6 holds — node-id set difference on both modified test files
  shows nothing removed or renamed.

findings:
  - id: F-1
    severity: major
    title: >-
      "No `c` operator is exactly no round shape" is false, and it is the whole
      of AC-3's substitute tripwire — a 32-gon disc on the legend passes
    file: tests/test_book_guide_page_vector.py
    line: 695
    gating: true
    confidence: high
    evidence: >-
      AC-3 is declined (soundly) and replaced by
      TestGuidePage_DifficultyLegendCarriesNoRoundShapeToday, whose
      test_no_guide_page_emits_a_curve_operator states the equivalence in as
      many words: "PDF has no circle, ellipse or arc operator in a content
      stream (ADR-0042, CARD-294), so 'this page draws no round shape' is
      exactly 'this page emits no `c`'. Nothing is classified by eye." The same
      claim is written in the card's Worktree notes ("PDF has no circle
      operator, so no `c` is exactly no round shape") and in
      tests/test_book_difficulty_dots.py's VECTOR_RECEIVER_NAME comment ("A
      content stream's only round shape is ContentStream.round_mark").
      MEASURED: ContentStream carries begin_path / line_to / close_path / paint
      (src/nonogram/admin/book_vector.py:823-837) — an arbitrary polygonal path
      builder that emits only `m`, `l`, `h` and a paint operator. I added a
      32-gon filled disc beside each tier name in draw_legend (the exact shape
      CARD-229 would need) and ran
      tests/test_book_guide_page_vector.py + test_book_pdf_vector_primitives.py
      + test_book_difficulty_dots.py: 248 passed, 204 warnings. Green through
      test_no_guide_page_emits_a_curve_operator (no `c`),
      test_the_writer_never_reaches_the_round_mark_primitive (no "round_mark("),
      CARD-294's TestVectorVocabulary_TheRoundMarkRouteTheOldGuardCannotSee, the
      EC property test (a fill emits no `w`, and `0 g` is already allowed),
      TestGuidePage_EveryDiagramStaysInsideItsOwnBox (the legend is not a line
      diagram) and the difficulty-dots receiver guard (begin_path/line_to/paint
      are not Pillow draw-method names, so the walk never sees them). File
      restored; sha256 ad692521f4b5fa74a66f72954545de64d26c28b5a64b311b8bec1de6ea5bfebc
      verified. The consequence is precisely the one the card writes down as its
      reason for declining AC-3: "CARD-229 inherits AC-3, and when it draws the
      dots CARD-294's own ... reds at the same moment, which is the alarm that
      card built." That alarm does not fire on a polygonal disc, and a polygonal
      disc is the cheaper implementation.
    remedy: >-
      Either (a) close the route — assert that no module outside the vocabulary
      writes begin_path/line_to (or bound a path's vertex count the way
      MAX_FLAT_VERTICES bounds draw.polygon, which is the precedent already in
      the tree), or (b) restate the claim honestly: "no `c`" is "no Bézier",
      not "no round shape", and carry the polyline route as a NAMED limit with
      an owner, exactly as FLAT_METHODS already carries draw.line's polyline
      hole with CARD-241 beside it. (b) is cheap and keeps the decline sound;
      what must not survive is the sentence asserting the equivalence.
    disposition: open

  - id: F-2
    severity: major
    title: >-
      AC-4's default-DENY guard has a hand-written attribute set with a false
      derivation claim; a second grid implementation spelled around it passes
    file: tests/test_book_guide_page_vector.py
    line: 354
    gating: true
    confidence: high
    evidence: >-
      AC-4 requires "a structural check shows no second grid implementation in
      the file", "derived per ADR-0039/R2 from the module's AST, default-DENY".
      The set of FUNCTIONS is derived from the AST; the set of ATTRIBUTES
      (GRID_ATTRIBUTES, 7 names) is hand-written, and its stated derivation is
      false. The docstring says it is "Derived from what
      book_pdf_generator._stroke_drawing/_write_clues/draw_example_line read
      between them ... so the set is the shape of the thing being guarded and
      not a list of names that happened to come to mind". MEASURED by walking
      those three functions' ASTs: between them they also read Layout's `frame`,
      `thick_rule` and `thin_rule`, all three omitted from GRID_ATTRIBUTES. Add
      them and the guard reports two more functions —
      touching == {_stroke_layout, _write_clue_digits, diagram_box, diagram_left,
      draw_line_diagram, translation, guide_page, pad} — i.e. the set as written
      is exactly the subset that keeps the module green, which is the opposite
      of derived. Worse, every guarded name has an unguarded synonym one level
      down: Layout exposes `grid_lines` (= vertical_lines + horizontal_lines) and
      `clue_entries` (= row_clues + column_clues) as properties over fields that
      are NOT in the set. MEASURED: I appended `_second_grid(stream, layout)` to
      src/nonogram/admin/book_guide_vector.py — a complete second grid
      implementation drawing every ruled line via layout.grid_lines, the frame
      via layout.frame, and every clue digit via layout.row_clues +
      layout.column_clues at a size derived from layout.cell — and ran
      tests/test_book_guide_page_vector.py::TestGuidePage_WorkedExampleReusesTheGridRoutine:
      4 passed. File restored and sha256-verified. Related overstatement in the
      module itself: _Diagram.translation's docstring says it lives there "so
      that the page itself never reads a Layout's grid — which is what
      CARD-296's AC-4 guard holds it to", but guide_page reads
      icon_layout.thick_rule at book_guide_vector.py:964.
    remedy: >-
      Derive GRID_ATTRIBUTES from an enumerable authority rather than writing it
      out: the Layout dataclass's own fields plus its properties, minus a named
      and justified allow-list (dpi, page, rows, columns, width, height, ...).
      That makes `grid_lines`, `row_clues`, `column_clues` and `cell` guarded by
      construction, and it will then flag guide_page and _Diagram.pad — give
      those two a role in ROLES (reading `thick_rule` for the paste pad is a
      legitimate role, and naming it is the point) rather than shrinking the set
      back. If the set stays hand-written, delete the derivation sentence.
    disposition: open

  - id: F-3
    severity: major
    title: >-
      EC(ADR-0042/R3)'s tone check cannot see any text tone — the whole guide
      set in 50 % grey passes
    file: tests/test_book_guide_page_vector.py
    line: 851
    gating: true
    confidence: high
    evidence: >-
      TestPropertyTest_GuidePage_WriterDerivesNoGeometryAcrossTrims says "the
      operands a derived number would show up in are the ones checked here: the
      `w` stroke widths, the `g`/`G` tones and the `Tf` type sizes", and ADR-0042/R3's
      statement names tone explicitly ("Every coordinate, width and tone it
      emits comes from COMP-007's Layout"). The tone assertion is
      `re.findall(r"(?m)^(-?\d+(?:\.\d+)?) [gG]$", stream)` — anchored to a whole
      line. ContentStream.text (src/nonogram/admin/book_vector.py:916) emits its
      fill tone INLINE: `f"{_number(_grey(grey))} g BT /{resource} ... Tj ET"`,
      one operator per line, so the `$` never matches and NO text tone is ever
      read. MEASURED: I changed the body-text call in guide_page
      (book_guide_vector.py:1158) from grey=_BLACK to grey=0.5 — every paragraph,
      heading and note of both guide pages set in 50 % grey — and ran
      tests/test_book_guide_page_vector.py: 35 passed. The module's own docstring
      calls black "the only tone this page inks" (_BLACK, :160) and the written
      page would be grey in print. File restored and sha256-verified. The path
      tones (fill_grey/stroke_grey on their own lines) ARE covered, so the
      assertion is not vacuous — it is blind to the majority of the page's ink.
    remedy: >-
      Read tones with the same shape the file's own `_SHOWN` regex already uses
      for text objects — match `(NUMBER) g` wherever it occurs, not only at a
      line start — or tally tones through pdf_vector rather than a local regex,
      and add the inline case to tests/helpers/pdf_vector.py so every page card
      of the phase inherits it. One line; the corpus and the assertion already
      exist.
    disposition: open

  - id: F-4
    severity: major
    title: >-
      The new `stream` receiver exemption is granted on a bare name with no
      binding rule behind it, and measurably reopens cycle 2's M2 control
    file: tests/test_book_difficulty_dots.py
    line: 1033
    gating: true
    confidence: high
    evidence: >-
      _is_vector_receiver returns True for any ast.Name spelled `stream`, and
      _is_accounted_receiver then excuses it for any method in
      VECTOR_STREAM_METHODS = {line, rectangle, text}. Its docstring says it is
      "Deliberately as narrow as _is_draw_receiver's own first clause and for the
      same reason". That is the claim that is wider than its control: the name
      `draw` is narrow because TWO sibling rules bind it to real draw objects —
      test_every_draw_object_in_the_package_is_spelled_draw (every
      ImageDraw.Draw(...) binding that yields a name must yield DRAW_RECEIVER_NAME)
      and test_every_imagedraw_annotated_parameter_is_spelled_draw. NOTHING in
      the tree asserts that a thing called `stream` is a ContentStream, so the
      exemption is name-shaped, not type-shaped. MEASURED against the guard's own
      helpers on fabricated sources: for
      {"fake.mod": "def _rogue(stream, rank):\n    stream.line([32 points], fill=1, width=3)\n"}
      the pre-CARD-296 rule reports
      [('fake.mod', '_rogue', 'line', 'stream')] and the HEAD rule reports [].
      That is cycle 2's M2 control (an unannotated parameter handed the real draw
      object) with the name changed to `stream` and the method to `line` — and
      `line` is the route FLAT_METHODS documents at length as a KNOWN hole
      ("review cycle 3 (F-201) landed a complete second three-dot glyph that way
      with the suite green"). `_draw_calls` under the vertex guard sees nothing
      either, and the binding and annotation rules see nothing, so all four
      mechanisms are blind at once. WHAT IS SOUND, re-fired and confirmed: the
      narrowing itself is load-bearing — deleting the three subtractions from
      _excused_vector_methods reds
      test_the_vector_stream_receiver_is_excused_only_for_marks_that_cannot_be_round
      (1 failed, 29 passed), so the _RoundCapableSurface stand-in is the right
      call and the round's measurement of it is honest. The defect is the
      receiver predicate, not the method set.
    remedy: >-
      Give the name `stream` the binding rule the name `draw` has: assert that
      every ContentStream(...) binding in the package that yields a name yields
      `stream`, and that no ImageDraw.Draw(...) binding and no ImageDraw-annotated
      parameter is spelled `stream`. Add a control in the shape the file already
      uses — the M2 mutant with the parameter renamed to `stream` and the method
      changed to `line` — so the route cannot quietly reopen again.
    disposition: open

