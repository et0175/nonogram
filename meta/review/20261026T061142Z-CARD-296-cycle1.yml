what_i_did_not_verify:
  - >-
    The full suite. Forbidden by the brief and never run. I ran the three touched
    test files (248 passed) and a six-file blast radius chosen for the guards this
    card could plausibly disturb — test_book_interior_type_floor.py (CON-020's
    sibling), test_book_page_frame.py (the figure-declared-once guard the round
    reports firing on it), test_collected_names.py, test_suite_profile.py
    (G-8's snapshot), test_book_pdf.py and test_export_pdf.py (ADR-0042/R4, R5):
    580 passed. Files outside those nine are unmeasured by me.
  - >-
    The renders. I did not look at ~/Documents/nonogram-reviews/CARD-296/; I took
    the orchestrator's comparison of vector against raster as given, as instructed.
  - >-
    The port's string-for-string fidelity against create_guide_page. I verified
    the two places the port's arithmetic could diverge structurally (the single
    hoisted `pad = icon_layout.thick_rule`, which matches
    book_pdf_generator.py:4361, and diagram_box against draw_example_line's crop
    at :3056-3073) but I did not diff the two pages' section order, fallback
    ladder or string set line by line against the raster method. G-1 compliance
    rests on the orchestrator's render comparison plus those two checks.
  - >-
    Whether CARD-229's dots, when written, will actually take the polyline route
    F-1 leaves open. F-1 measures that the route exists and that every alarm stays
    green on it; it does not predict what CARD-229 will write.
  - >-
    The remaining 10 of the round's 16 reported mutations. Under the 2026-10-25
    refire policy I re-fired in full the ones I gate on (3 planted artefacts of my
    own) plus a 6-mutation sample of the round's (clamp removal, title recorded
    and not drawn, the sCapHeight zero guard, the long_loca branch collapse, the
    _excused_vector_methods subtraction, an invented stroke width). Every sampled
    one reded the cell the round NAMED, with no collateral; I did not re-fire the
    rest.
  - >-
    poppler's independent readings beyond what ran here. pdftotext is installed on
    this host (no skips in the 248), so AC-5's extraction check really executed,
    but I did not independently rasterise the guide or check dot roundness with
    poppler — AC-3 is declined, so there is nothing to read back.

corrections_to_the_brief:
  - >-
    I agree with all five items the orchestrator pre-verified, and re-derived two
    of them in passing: _PROBE_CLUES is indeed ((1,),) and N-2's fix at
    book_vector.py:587 is real and controlled. One refinement rather than a
    disagreement: AC-3's DECLINE is sound, but the tripwire that stands in for it
    is not (F-1). The decline's reasoning — the legend has had no dots since
    CARD-221, CARD-229 is the inheritor, G-1 forbids drawing its design — survives
    intact; what fails is the sentence that makes "no `c`" mean "no round shape".
  - >-
    Brief item 1 (does guide_page produce what its tests claim, or do writer and
    reader share an assumption?): for TEXT the answer is no — the record-vs-stream
    equality is a genuine two-sided control and I could not find a second
    divergence site. The shared assumption is elsewhere: it is between the EC
    test's tone regex and ContentStream.text's inline tone (F-3), and between the
    round-shape claim and the path builder (F-1).
  - >-
    Brief item 2 (is the clamp correct for every diagram, and is a declared box
    never checked?): the clamp is correct for every line diagram the page draws,
    not just the three sampled — the two structural classes (framed, unframed)
    are both covered, and the unframed icon layout provably has no clue entry to
    leave unclamped. The unchecked declared boxes are the pipeline's and the
    legend's (F-8), with no live overflow.
  - >-
    Brief item 3 (does AC-4's guard fail in both directions, and does it bind?):
    it fails in both directions — the assertion is a set EQUALITY and names both
    halves. It does not bind, for a reason the direction of the question did not
    reach: the hole is the ATTRIBUTE set, not the function set (F-2).
  - >-
    Brief item 5 (does the difficulty-dots narrowing let through anything real?):
    the narrowing is sound and the decision taken is the right one — the stand-in
    surface makes it load-bearing, measured. What lets something through is the
    RECEIVER predicate beside it (F-4). The round was right that a ContentStream
    needs a route and right not to widen a round-shape bin; it gave the new name
    the exemption without the binding rules that make the old name safe.
  - >-
    Brief item 6 (are the synthetic faces valid enough?): yes. They are
    well-formed where it matters, the branch controls bind, and the one claim I
    thought might be decorative — that the offset table is built the way
    _sfnt_tables checks it — turns out to be true and load-bearing. This is the
    best-controlled part of the round.
  - >-
    One thing the brief did not ask and the card should carry: the architectural
    finding the round routed to CARD-298 is understated in one respect. Because
