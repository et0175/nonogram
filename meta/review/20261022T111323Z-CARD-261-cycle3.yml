verdict_statement: >-
  PASS, with bounds. Not an escalation, and I am not hedging between them.
  The round did everything the owner scoped for it, and I verified each by execution rather than by
  reading: I-1(a) is closed -- the padding attack that reached exit 0 last cycle now reds naming the
  sentence, and a same-meaning paraphrase reds too, so the pin is to the string and is genuinely a
  different instrument from a floor. I-1(b) is closed -- cycle 2's Plant G verbatim now reds naming
  the line. M-1 is closed in its scoping half with a control derived from the package walk, and the
  fixer's reason for leaving the number uncontrolled is a measurement I reproduced independently.
  AC-5's amendment is adopted with its provenance and its superseded wording kept beside it. The
  certification ran, its domain reproduces element for element through the committed instrument, and
  the two new cells on the padding attack are genuinely independent -- which I established by
  neutering each arm alone, because the matrix alone could not have shown it. All six guardrails hold,
  G-4 in both directions, and the worktree is restored and clean.
  Against that, one Important finding: the one-word gap narrowing is a two-way regression I proved by
  running the same two plants against both revisions. A plain two-adjective count of adapters now
  evades the guard whose purpose is to refuse one, and a sentence stating no count now reds claiming
  it states one. Neither edge is a committed case and the comment declares the cost at the wrong
  boundary. It is real, it is the riskiest edit of the round exactly as the owner predicted, and it is
  about four lines from being closed. It does not touch the card's deliverable and the guard's net
  reach is better than it was, which is why it is a bound the owner accepts by merging rather than a
  reason to escalate a card that has no fourth cycle to spend.
  8.5 on cycle 1's basis, which clears min_score 8.0, and +0.7 against the recorded 7.8, which clears
  min_improvement. I have said plainly in score_basis that on one consistent basis this round's
  improvement is small, because cycle 2's artefact was already worth about 8.45 and its FAIL was
  largely a baseline artefact -- and that a reviewer re-basing the way cycle 2 did would land at 7.95.
  The owner should know the bar is straddled by the convention and not by the evidence. On the
  evidence, the artefact is worth merging.
