merge_sequencing_card_261_vs_card_264:
  question: "Is CARD-261 safe to merge ahead of CARD-264, given that this card creates the reachable pointer into that prose?"
  answer: >-
    YES, safe to merge ahead, and I would not hold CARD-261 for it -- but land CARD-264's AC-7 next
    rather than later, and I would say so on the board rather than leave it to the queue.
    WHAT I VERIFIED. The pointer exists and is deliberate: CLAUDE.md:42 ends "the closed set the
    layering guard holds them to is `tests/test_cli.py`'s `_ADAPTERS`". What a reader finds there is
    correct in VALUE -- `_ADAPTERS = frozenset({"cli", "web", "admin"})`, three names, byte-identical
    to fac4896f by AST at line 748 -- and wrong in PROSE in exactly the three places cycle 2
    measured, all still present and still untouched: the comment at :744 ("this set is closed at two
    names"), the test name at :905
    (`test_the_adapter_allowlist_is_closed_at_the_two_known_adapters`) and its docstring's first line
    at :906 ("ADR-0019's allowlist is two names, and staying two names is the rule"). Counts
    identical to fac4896f for all three. Nothing renamed, correctly.
    WHY MERGING AHEAD IS SAFE. The reader lands on the right set, and CLAUDE.md's own text is now
    count-free where before it asserted "cli.py ... the only inbound adapter" -- which was false of
    the tree and was the claim the card's `## Why` table measured. The net change for a brief is an
    improvement in every direction. And this round ADDS a second place that reds if the set changes:
    M-1's scoping control asserts every member of `_ADAPTERS` imports the orchestrator and that there
    are three of them, which I verified reds (M20 on its sibling arm) -- so a reader who acts on the
    lying name by REMOVING "admin" now breaks two tests instead of one. That makes CARD-264's rename
    cheaper, not more urgent as a blocker.
    WHY NOT LATER. The specific failure mode the pointer newly enables is a reader concluding that
    "admin" is the erosion the guard warns about and that the set should be two -- acting on the
    lying name. That is a worse outcome than the stale count it replaced, it is reachable only
    because of this card, and the window stays open until CARD-264 lands. Not blocking; next.

