findings:
  - id: I-1
    title: >-
      The one-word gap narrowing is a two-way regression against feb3e6b5, and neither new edge is
      a committed case: a plain two-adjective count of adapters now evades the guard, and a
      sentence stating no count now reds as if it stated one
    severity: important
    category: test-coverage
    file: tests/test_cli.py
    line: 1126
    root_cause: >-
      ONE root cause with two opposite symptoms. _ADAPTER_COUNT was re-tuned against cycle 2's
      32-form sweep -- but that sweep was built to probe the OLD numeral-only, two-word-gap
      pattern, so it contains no form at either edge the new pattern creates. The widening on what
      counts as a quantity (both/only/sole/a pair of/...) and the narrowing of the gap from two
      words to one were validated against each other's old corpus and never against their own new
      boundary. ADAPTER_COUNT_CASES therefore has 22 cases and not one of them sits at either new
      edge, while the class docstring asserts that "every shape this reader must catch and every
      shape it is known to miss is a committed case below".
    evidence: >-
      SYMPTOM (a) -- A CATCH LOST. PLANT B1: "The pipeline has three distinct inbound adapters."
      inserted as running prose immediately under CLAUDE.md's `## Architecture` heading. A plain
      count of adapters, two adjectives from the noun -- the exact F-101 defect class this guard
      exists to refuse.
      AT 335c641e: GREEN, PYTEST_EXIT=0 over tests/test_cli.py + tests/test_guard_integrity.py
      (-k "TestComponentMap or Interpreter"). No message, because nothing reds.
      AT feb3e6b5 (previous round's tests/test_cli.py restored from git, same CLAUDE.md plant):
      RED, PYTEST_EXIT=1, test_claude_md_states_no_count_of_adapters, naming the line:
      "CLAUDE.md states a count of adapters again ... ['40: The pipeline has three distinct inbound
      adapters.']". So this is a regression introduced by THIS round, demonstrated by execution in
      both states rather than inferred from the regex.
      Positive control that the guard is live: PLANT B3, the same sentence with one adjective
      ("three inbound adapters") -- RED, PYTEST_EXIT=1, same test, naming the line.
      SYMPTOM (b) -- A FALSE POSITIVE GAINED. PLANT B2: "Only the adapters import the orchestrator;
      nothing else does." -- a sentence that states no count whatever, and a plausible thing to
      write in CLAUDE.md's layering paragraph.
      AT 335c641e: RED, PYTEST_EXIT=1, test_claude_md_states_no_count_of_adapters, message
      "CLAUDE.md states a count of adapters again ... ['40: Only the adapters import the
      orchestrator; nothing else does.']" -- which is false of the sentence.
      AT feb3e6b5: GREEN, PYTEST_EXIT=0. Also a regression from this round, and it lands exactly in
      the class the fixer names as the REASON for the narrowing: "a deny-side guard that reds on a
      sentence stating no count is one the next card switches off rather than obeys."
      THE FULL BOUNDARY SWEEP, 44 forms of my own construction through the shipped helper in an
      isolated `python -I` process with the worktree's src first on sys.path (nonogram.__file__
      printed as the worktree copy, so the editable-install trap is excluded):
      CAUGHT -- zero gap words ("three adapters"); exactly one gap word ("three inbound adapters",
      "2 inbound adapters", "twelve inbound adapters", "zero inbound adapters", "no inbound
      adapters", "the only inbound adapter", "Both inbound adapters", "a pair of inbound adapters",
      "a handful of inbound adapters"); "the sole adapter"; "a couple of adapters"; "eleven
      adapters"; markdown emphasis anywhere across the gap ("three **inbound** adapters",
      "**three** inbound adapters", "**three inbound adapters**"); a backticked noun ("three
      inbound `adapters`"); a count right after punctuation ("(three inbound adapters)").
      MISSED, AND DECLARED -- enumeration ("The adapters: cli, web, admin"), another noun ("There
      are three inbound entry points"), "adapters x2", "adapters number three in this tree",
      hyphenated ("three http-and-cli adapters", "three cli-side adapters"), three gap words
      ("three distinct inbound process adapters").
      MISSED, AND NOT DECLARED AT THE SHIPPED BOUNDARY -- exactly two gap words: "three distinct
      inbound adapters", "2 distinct inbound adapters", "three inbound python adapters", "Both
      known inbound adapters", "a pair of distinct inbound adapters". A parenthetical in the gap:
      "three (inbound) adapters", "three inbound (argparse) adapters". A comma in the gap: "three,
      inbound adapters". A line break between count and noun: "three inbound\nadapters",
      "three\nadapters" (the reader is line-by-line, so this one is structural rather than fixable,
      and it is stated nowhere).
      FALSE POSITIVES AT 335c641e, NOT COMMITTED -- "Only the adapters import orchestrator" (NEW
      this round: the old pattern missed it), "no new adapters needed" (pre-existing), "two of the
      three adapters import it" (pre-existing), "ADR-0019 section 2 adapters discussion"
      (pre-existing -- so the cross-reference FP class the narrowing was justified by closing is
      NARROWED, not closed: a digit one word from the noun still reds).
      The three committed false-positive cases all evade for the GAP reason, not the quantity
      reason, so none of them measures the edge the widening created.
      IS THE CONTROL'S NAME, MESSAGE AND DOCSTRING TRUTHFUL? Mixed, and this is the part that
      earns the severity. _adapter_counts' docstring says the reach excludes "a number more than
      one adjective away ('three distinct inbound process adapters')" -- the CLAUSE is truthful
      (two adjectives is more than one) but the EXAMPLE is three words wide for a bound that
      shipped at two, so a reader calibrates on the wrong form. The inline comment at :1119 is
      worse: "The declared cost of the narrower bound is that 'three distinct inbound process
      adapters' evades" states the cost at the wrong boundary outright. Nothing anywhere declares
      the parenthetical, the comma or the line break. And the class docstring's "every shape this
      reader must catch and every shape it is known to miss is a committed case below" is false for
      eight measured forms. The MESSAGE is the sharpest problem: "CLAUDE.md states a count of
      adapters again" is asserted of "Only the adapters import the orchestrator", which states no
      count, and a message that misdescribes the offending line is how a deny-side guard gets
      deleted.
      WHAT IS NOT WRONG, STATED SO THE FINDING IS NOT READ AS WIDER THAN IT IS: the round's primary
      objective is met. I-1(b) is genuinely closed -- PLANT F, cycle 2's Plant G verbatim ("Both
      inbound adapters import the orchestrator; `cli.py` is the only inbound adapter that parses
      argv."), RED at PYTEST_EXIT=1 naming line 40. The literal F-101 sentence is now denied, which
      it was not for a whole cycle. Net reach: the widening bought roughly eight new catch forms
      including the card's own historical defect, and closed three measured false positives; the
      narrowing cost three measured catch forms and opened one new false positive. The guard is
      substantially better at its job than at feb3e6b5. The defect is that the cost side is neither
      committed nor truthfully bounded, on a card whose entire subject is claims that carry no
      control.
    what_state_would_make_this_red: >-
      (i) A committed case at the shipped boundary -- (True, "three distinct inbound adapters") if
      the owner wants the catch restored, or (False, "three distinct inbound adapters") if the
      narrower bound is accepted; either way the two-gap-word form stops being unmeasured.
      (ii) (False, "only the adapters import the orchestrator") on the allow side, which would red
      today and so forces the pattern to be fixed rather than the claim reworded -- the quantity
      alternation needs "only"/"sole" to require a following determiner-free noun phrase, or an
      explicit exclusion of "only the"/"no new".
      (iii) One-line corrections to the :1119 comment (the cost is at TWO intervening words, not
      three) and to the class docstring's universal claim.
      Measured cost of the whole remedy: about six lines in tests/test_cli.py, no src change, no AC
      change.
    does_that_state_exist_today: "No. Verified by execution: B1 GREEN at 335c641e, B2 RED at 335c641e."
    merge_decision_input: >-
      Acceptable as a listed bound. It does not touch the card's deliverable (the derived,
      default-deny row-set and id-column controls), it is confined to one deny-side guard over one
      documentation file, and the net reach change is positive. It is listed in bounds_the_owner_
      accepts_by_merging and is worth a follow-up card, not a fourth cycle.

  - id: M-1
    title: >-
      The self-checking hole test is real in its planter and flattering in its hole. I closed the
      hole by the route a later card would actually take and the test stayed green
    severity: minor
    category: test-coverage
    file: tests/test_cli.py
    line: 1621
    cluster: a-hole-assertion-that-cannot-notice-the-hole-closing
    evidence: >-
      THE HALF THAT IS REAL, VERIFIED FIRST. PLANT C1: the canonical map's count reworded past the
      planter, "the two pipeline adapters import" -> "the 2 pipeline adapters import", one line, line
      count preserved. RED, PYTEST_EXIT=1,
      test_the_maps_adapter_count_is_the_other_hole_that_stays_open, message verbatim: "the lie was
      not planted -- the canonical map no longer words its adapter count the way this test rewrites
      it, so this test has stopped measuring anything". The claim reproduces exactly. This is a
      genuinely good shape and I want it on the record as verified, because it is the strongest
      instrument on the card.
      THE HALF THAT IS NOT. The test's other two arms assert `not _map_defects(...)` and
      `not _id_defects(...)` over the lie, and its docstring says "A later card that gives the count
      an authority will red here and delete this test deliberately." That is false as stated.
      PLANT C2: a later card closes the hole the natural way -- a NEW test that regex-reads the
      stated count out of the docstring and holds it to a walk-derived figure
      (`assert set(stated) == {"two"} and len(stated) == 2` plus `assert len(_ADAPTERS) - 1 == 2`).
      The hole-test is untouched and its planter is still satisfied. RESULT: GREEN, PYTEST_EXIT=0.
      The hole is closed and the test that asserts the hole is open does not notice.
      PLANT C3, so that C2 is not a closure that closes nothing: C2's new control plus cycle 2's
      Plant A lie on disk (two -> five in both sentences). RED, PYTEST_EXIT=1, naming the figure:
      "AssertionError: ['five', 'five'] ... assert ({'five'} == {'two'}". So the closure is real and
      C2's green is a true defeat.
      WHY IT CANNOT WORK, MEASURED RATHER THAN ARGUED. The planted lie changes exactly three lines
      of the docstring -- 71, 75 and 78 -- and every one of them sits at indent 0. `_canonical_map`
      skips every line that does not start with four spaces, and `_map_row_ids` is anchored on a
      name in column one. Measured in an isolated process: `_canonical_map(doc) ==
      _canonical_map(lie)` is True (13 rows, 0 unanalysable, both sides), `_map_row_ids(doc) ==
      _map_row_ids(lie)` is True, and `_map_defects` is `{}` on both. The two defect arms are
      therefore not merely weak -- they are provably identical to arms already asserted by
      `test_every_component_the_walk_finds_appears_exactly_once` and
      `test_the_map_and_the_diagram_agree_on_every_id`, and can only fail if THOSE fail. They can
      red for one reason only: a later card adding prose reading to `_map_defects`/`_id_defects`
      specifically, which is not how anyone would close this.
      CONTRAST, because the card gets this right elsewhere:
      `test_a_wrong_description_is_the_one_hole_that_stays_open` feeds a FABRICATED three-line map
      whose English description is the lie and asserts both defect functions pass on it. That one
      does red if the functions start reading descriptions. It is a real hole-assertion; the
      adapter-count one is a real planter wrapped around two duplicates.
    what_state_would_make_this_red: >-
      Narrow the docstring's claim to what the arms can see ("a later card that closes this inside
      _map_defects or _id_defects will red here"), or replace the two duplicate arms with one that
      can actually observe closure -- e.g. an AST assertion that no test in this file reads the
      count out of the docstring prose. Two lines either way.
    does_that_state_exist_today: "No. Verified by execution: C1 RED, C2 GREEN with C3 proving the closure genuine."

  - id: M-2
    title: >-
      The by-value pin list omits the one known-miss case cycle 2's own positive control depended
      on, so two of five known-miss slots stay padable and the CAP-widening loses its named detector
    severity: minor
    category: test-coverage
    file: tests/test_cli.py
    line: 2177
    cluster: a-pin-list-that-pins-the-wrong-five
    evidence: >-
      THE INSTRUMENT IS GENUINELY DIFFERENT FROM A COUNT, AND I ESTABLISHED THAT FIRST.
      PLANT A1, the owner's paraphrase attack: the pinned row
      `(False, "`cli.py` is the only inbound adapter.")` replaced by
      `(False, "cli.py is our sole inbound adapter.")` -- same meaning, same side, tuple length
      unchanged, and still a true known-miss for `_claude_md_rows` (so
      `test_every_case_reads_the_way_this_class_says_it_does` stays green). RED, PYTEST_EXIT=1, and
      the message answers the owner's question in its own words: "It is not interchangeable with
      another case". So the pin is to the STRING, not to the claim, deliberately, and it says so.
      That is a different instrument from a floor: cycle 2's attack was a SUBSTITUTION and this
      refuses substitutions.
      PLANT A2, reorder: CASES reversed, membership identical. GREEN, PYTEST_EXIT=0. Nothing reds
      that should not -- every pin is an `in` test, so the corpus is order-independent. The fixer's
      reordering was a message-quality choice and carries no hidden coupling.
      PLANT A4a, the must-catch side: the pinned `(True, "conftest.py      # shared fixtures")`
      substituted. RED, PYTEST_EXIT=1, naming it -- "One disjunct of the reader catches it and the
      other does not, so it is what keeps the two from being measured as one arm." So BOTH sides are
      pinned by value, not only the known-miss side. PLANT A4b, an UNPINNED must-catch case
      (`# COMP-009 runs as its own process` -> `# COMP-001 also runs as its own process`): GREEN.
      THE RESIDUAL, WHICH IS THE FINDING. Five known-miss cases, three pinned by value, so two
      slots are still met by arithmetic. PLANT A3: the two unpinned known-miss cases
      (`` `difficulty.py` is not yet built.`` and `sourcing covers CAP-001 and nothing else.`)
      replaced by two spellings of ONE mechanism already covered by a pinned case
      (`notes/README.md    the other guide`, `misc/README.md     the third guide`), tuple length 10,
      sides still 5/5. GREEN, PYTEST_EXIT=0. The known-miss floor is back to counting for 40% of
      that side.
      AND THE PADDING COSTS A REAL MEASUREMENT. `sourcing covers CAP-001 and nothing else.` is the
      ONLY corpus case that detects cycle 2's Plant B, the positive control cycle 2 used to prove
      the corpus live. PLANT PlantB-alone (`_COMPONENT_ID` widened to `(?:COMP|CAP)-\d`): RED,
      PYTEST_EXIT=1, TWO tests -- `test_the_capability_registry_pairs_no_module` AND
      `test_every_case_reads_the_way_this_class_says_it_does`, the latter naming the case:
      "['sourcing covers CAP-001 and nothing else.']". PLANT A3b (A3's padding plus the same
      widening): RED, PYTEST_EXIT=1, but only ONE test --
      `test_the_capability_registry_pairs_no_module`, whose message reads "capabilities.yml now
      names a component id outside a comment -- it may have become a second authority for the
      CAP-to-module pairing", which is FALSE of the cause. The mutant is still killed, by a
      neighbour, with a misdiagnosis.
      WHY THIS IS MINOR AND NOT A REOPENING OF CYCLE 2's I-1a: cycle 2's attack reached exit 0 --
      the measurement was deleted silently. Mine reaches exit 1. The suite still reds; what is lost
      is the arm that NAMES the offending case, which is the whole reason this card pins by value.
      The two cases the fixer left unpinned are mostly redundant (I checked: a `\s{2,}` widening is
      caught by the pinned `docs/GENERATION_ALGORITHM.md` row, and a `(?:\.py|/)` narrowing is
      caught by `test_the_two_row_readers_accept_exactly_the_same_lines`) -- EXCEPT the CAP one,
      which is load-bearing and unpinned. The pin list pins four redundant-ish cases and one
      load-bearing one, and misses the other load-bearing one.
    what_state_would_make_this_red: >-
      Add `"sourcing covers CAP-001 and nothing else."` to the known-miss by-value pin loop -- one
      line. It is the case that measures the COMP/CAP boundary of `_COMPONENT_ID` and nothing else
      in the corpus does.
    does_that_state_exist_today: "No. Verified: A3 GREEN; A3b RED but with the naming arm silent and the surviving message misattributing the cause."

  - id: M-3
    title: Three figures in the fix-round-2 notes that do not reproduce
    severity: minor
    category: documentation
    file: meta/kanban/cards/CARD-261.md
    cluster: figures-that-do-not-reproduce
    evidence: >-
      (i) THE ":2194" CELL DOES NOT EXIST. The notes say of M17: "Under the re-raising pass only
      `:2194` reds". `tests/test_cli.py` has 155 `ast.Assert` nodes and 2194 is not one of their
      linenos (measured by `ast.walk`; 2194 is the fourth line of the :2191 assert's message
      string). The instrument is keyed on assert linenos and its own contract refuses "a reading
      that records an assert lineno the matrix has no cell for", so :2194 cannot have come out of
      the matrix. I fired the instrument myself (below) and the re-raising cell is `:2191`.
      Everything else in that sentence holds -- one FAIL, short-circuit, and I measured 68 arms
      reached under re-raising against 72 under recording, which is the short-circuit the sentence
      describes.
      (ii) "FIVE STRINGS BY VALUE" on the adapter corpus is SIX. The notes' change table says
      `test_the_adapter_count_cases_that_carry_the_claim_are_pinned_by_value` carries "(>= 12 deny /
      >= 10 allow, five strings by value)". Counted in the shipped file: three deny-side strings
      pinned by value (the long F-101 sentence, "`cli.py` is the only inbound adapter.", "Both
      inbound adapters import the orchestrator.") and three allow-side (the three false positives)
      = six. The floors reproduce exactly (12 deny, 10 allow, 22 cases).
      (iii) "THIS ROUND REMOVES ONE LINE THIS CARD ITSELF ADDED" is twelve. The AC-4 paragraph says
      the round "removes one line this card itself added (the `assert len(self.CASES) >= 10,
      self.CASES` floor)". `git diff --numstat feb3e6b5 HEAD -- tests/test_cli.py` is `321 12`. The
      twelve are the two `_ADAPTER_COUNT` comment lines, the two old regex lines, the four
      `_adapter_counts` docstring lines about the two-word bound, two docstring lines in
      `test_every_case_reads_...`, the floor assert itself, and one blank line. The PROPERTY the
      paragraph is defending is intact -- see acceptance_criteria AC-4 -- but the count understates
      the edit by eleven lines, and the same `grep -c '^-[^-]'` method that produced the "0" figure
      would also miss a removed blank line, which is worth knowing.
    note: >-
      None of the three changes a verdict and none of them is a claim about behaviour. Recorded
      because the card's own standard is that a figure reproduces.

