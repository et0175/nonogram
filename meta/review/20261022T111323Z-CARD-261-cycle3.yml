score_basis:
  basis_used: "cycle 1's: 10 minus deductions"
  why: >-
    I do NOT re-base. Cycle 1 computed 10 - deductions and reached 7.5 (two Important findings,
    2.5 of deductions). Cycle 2 computed 8.7 - deductions and reached 7.8 (0.9 of deductions).
    Those are not two denominators for one measurement -- they are two different KINDS of number.
    Cycle 1's is penalty-only subtraction from a notional perfect; cycle 2's folds an absolute
    quality judgement of the artefact into the baseline and then subtracts penalties again. The
    proof they are incommensurable: cycle 2's own 0.9 of deductions, placed on cycle 1's basis,
    gives 9.1 -- which is plainly not what cycle 2 meant by "7.8". So arithmetic cannot reconcile
    them; one of the two has to be re-derived, and I re-derive cycle 2 onto cycle 1's basis rather
    than the reverse, because cycle 1's basis is the board's original one and the only one all
    three cycles can share.
  cycle_2_re_derived_on_cycle_1s_basis: >-
    Cycle 2 held one Important (I-1, one root cause, two executed symptoms) and two Minor clusters
    (M-1, M-2). Cycle 1 priced two Importants at 2.5 total, i.e. ~1.25 each. On that weighting
    cycle 2's artefact scores 10 - 1.25 - 0.15 - 0.15 = 8.45.
  the_consequence_stated_plainly: >-
    The owner's suspicion is confirmed and it cuts in an uncomfortable direction. On one consistent
    basis the three cycles read 7.5 -> ~8.45 -> 8.5. Cycle 2's recorded +0.3 was indeed largely an
    artefact of the changed baseline: the real cycle-1-to-cycle-2 improvement was about +0.95, and
    cycle 2 most likely should have PASSED at feb3e6b5 rather than failing on min_improvement.
    The corollary is that THIS round's improvement on a single basis is small -- about +0.05 to
    +0.1 -- because the artefact cycle 2 scored 7.8 was already worth ~8.45. I score the artefact,
    not the delta, and I say this out loud rather than leaving the owner to find it: the case for
    passing cycle 3 is that the artefact clears 8.0, not that this round moved it far.
  figure_on_the_other_basis: >-
    For completeness, because the bar is straddled by the choice of basis and hiding that would be
    the dishonest move. On cycle 2's absolute-artefact basis the shipped state at 335c641e is worth
    about 9.0 before deductions (cycle 2 said 8.7 for feb3e6b5; both gaps it priced are closed, the
    pins are string-identity rather than arithmetic, the planter self-check is real, and the
    certification ran). 9.0 - 0.6 - 0.15 - 0.15 - 0.15 = 7.95, which FAILS. I report the 8.5 as my
    score because the basis is cycle 1's and because I weight my one Important at 1.0 rather than
    cycle 2's 0.6 (it is a regression against the previous round, not a standing gap), but the
    owner should know that a reviewer re-basing the way cycle 2 did would land at 7.95 and that the
    difference between pass and escalate here is 0.55 of baseline convention, not 0.55 of evidence.

overall_score: 8.5
score_arithmetic: >-
  Baseline 10 (cycle 1's basis, penalty-only).
  MINUS 1.0 for I-1 (Important, one root cause, two executed symptoms in OPPOSITE directions):
  the one-word gap narrowing is a measured two-way regression against feb3e6b5. A plain count of
  adapters two adjectives from the noun now evades the guard whose entire purpose is to refuse one
  (B1: RED at feb3e6b5, GREEN at 335c641e), and a sentence stating no count at all now reds with
  the message "CLAUDE.md states a count of adapters again" (B2: GREEN at feb3e6b5, RED at
  335c641e). Neither new edge is a committed case; the inline comment declares the cost with a
  three-word example for a bound that shipped at two. Weighted at 1.0 rather than cycle 1's ~1.25
  per Important because the blast radius is one deny-side guard's edge on one documentation file,
  and at more than cycle 2's 0.6 because it is a loss against the previous round rather than a
  standing gap. -> 9.0
  MINUS 0.15 for M-1 (Minor: the hole test's hole-assertion is flattering. Its planter self-check
  is real and I verified it; its two defect arms are provably duplicates of live arms and cannot
  fail for the reason the docstring states. I closed the hole by the natural route and the test
  stayed green). -> 8.85
  MINUS 0.15 for M-2 (Minor: the by-value pin list omits the one known-miss case that cycle 2's own
  positive control depended on, so two of five known-miss slots remain padable and the CAP-widening
  loses its named detector -- at exit 1 rather than exit 0, which is why this is Minor and not a
  reopening of cycle 2's I-1a). -> 8.70
  MINUS 0.15 for M-3 (Minor: three figures in the fix hand-back that do not reproduce -- the
  ":2194" cell, "five strings by value" on the adapter corpus, and "this round removes one line").
  -> 8.55
  Rounded to 8.5. Bar is min_score 8.0: CLEARS. min_improvement 0.5 against the RECORDED 7.8:
  +0.7, CLEARS. Both gates clear on the board's recorded figures; see score_basis for what they
  look like on one consistent basis.
verdict: PASS_WITH_BOUNDS

