the_disclosed_wrinkles_judged:
  - wrinkle: "The matrix was fired twice; a blank-line reflow shifted linenos by 2-3; verdicts claimed identical mutant for mutant, figures from the second firing against the committed bytes."
    verdict: SOUND_AND_CORRECTLY_DISCLOSED
    evidence: >-
      I cannot re-observe the first firing and I do not need to: the disclosure is checkable at the
      only point where it matters, which is whether the REPORTED linenos belong to the committed
      bytes. They do. Every cited cell -- :2191, :2200, :2201, :2285, :2307, :2323, :1614 -- is an
      `ast.Assert` lineno in the committed file (verified against the full 155-lineno set), and the
      two I re-fired myself came back at exactly those addresses against the committed bytes. A
      figure taken from the first firing would be 2-3 off and would have been refused by the
      instrument's own "no cell for this lineno" rule, so a stale cell could not have survived into
      the table silently. The one wrong address in the notes (:2194) is a transcription error in
      prose, not a stale cell: it is not an assert lineno at ANY offset of 2 or 3 either (2191 is,
      2197 is not). Disclosure accepted.
  - wrinkle: "A floor or by-value pin cannot be certified by weakening its own assertion, because the instrument refuses an edit that moves the target's assert topology; so those arms are certified by mutating the ARTEFACT they pin (M17 for CASES, M20 for the docstring's scoping sentence)."
    verdict: A_SOUND_SUBSTITUTION_WITH_ONE_RESIDUAL_GAP_THE_FIXER_DID_NOT_NAME
    evidence: >-
      The substitution is sound, and it is sound for a reason worth stating precisely. Mutating the
      ARTEFACT is the better experiment, not merely the permitted one: neutering an assert measures
      whether the assert is reachable, while mutating the artefact measures whether the assert
      catches the attack it was written for. M17 is the attack that defeated the previous round and
      M20 is the attack on the scoping sentence; both are the real adversary. So this is a bound in
      a bound's clothing, not a gap in one.
      THE RESIDUAL the fixer did not name, which I measured: artefact mutation certifies the arms
      the artefact mutation happens to reach, and nothing tells you which arms it missed. Of the six
      by-value pins in the CASES test and the six in the adapter test, M17 exercises exactly two
      (:2191 and :2201, both confirmed). The other arms -- the two known-miss pins at :2210, the two
      must-catch pins at :2220, and all six adapter-corpus pins -- are not certified by M17 at all.
      I covered four of them by hand (A1 at :2191, A4a at :2220, A4b as the negative control, A3 and
      A3b at the floor), and PLANT A3's GREEN is exactly what artefact mutation on its own would
      never have found: an attack that satisfies every arm M17 exercises and still deletes a
      measurement. So the substitution is sound AND the matrix's twenty mutants do not establish
      that every pin has its own control. That is a bound on the certification, and it is the one I
      would want written down.
  - wrinkle: "16 of 20 recording-pass mutants exited 0 and 15 of those carry FAIL cells -- pytest's exit code is not a kill signal here."
    verdict: AGREED_AS_A_PROPERTY_OF_THE_INSTRUMENT_NOT_AN_ANECDOTE
    evidence: >-
      Reproduced on my own firing: BOTH of my two recording-pass mutants exited 0 while carrying
      FAIL cells (M17 "exit 0 with 72 reached and 2 FAIL"; M18 "exit 0 with 72 reached and 1 FAIL").
      Two of two, independently of the card's fifteen of sixteen and of the sibling card's
      measurement an hour earlier. That is three independent measurements of the same thing on two
      cards.
      It is a PROPERTY, not a coincidence, and the mechanism is in the instrument's own contract:
      `Pass.RECORDING` is "the same transformer with one difference: whether its handler
      re-raises". With the handler swallowing, a failing arm records FAIL and the test completes, so
      pytest sees a passing test and exits 0. Any mutant whose kills are all attributable inside the
      recording pass -- which is the normal case -- exits 0 by construction. The four that exit 1
      are the ones where something ALSO failed outside the transformer's reach.
      WORDING tests/README.md could absorb, offered because the owner asked for it in those terms:
      "Under `Pass.RECORDING` the instrumented handler does not re-raise, so a test with a failing
      arm still completes and pytest exits 0. A recording-pass exit code is therefore not a kill
      signal: read the FAIL cells, and read the exit code only as the precondition the instrument
      already enforces (0 or 1, never 2-5). A kill is an ANY-RED over the cells across both passes.
      Measured on CARD-261 as 15 of 16 mutants exiting 0 while carrying FAIL cells, and on CARD-262
      independently; a test-level reading would have published every one of them as a survivor."
      This is worth more than another mutant and I would land it as a doc line on the next card that
      touches that file.

