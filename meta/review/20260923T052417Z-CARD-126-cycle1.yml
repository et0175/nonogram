    title: "reorder_puzzles' new gate runs before its book-exists and membership checks"
    description: |
      The `is_level_order` gate is the first statement of `reorder_puzzles`, ahead of
      both storage branches. Two consequences for a public method whose docstring
      still promises "False if book not found":

      * `reorder_puzzles("does-not-exist", <ungrouped>)` now raises `LevelBoundary`
        instead of returning `False`;
      * an order that neither matches the membership nor is grouped reports the
        grouping complaint, not the membership one ("Puzzle IDs must match book's
        current puzzles"), which is the more actionable of the two.

      Both are reachable only by a caller other than `_move_within_level`, and both
      raise a `ValueError` subclass either way, so nothing in the repo misbehaves.
      Related co-change signal: `tests/test_book_manager.py::test_reorder_puzzles`
      (3/16 co-changes with book_manager.py) was not updated and now passes
      vacuously — its manager has no `puzzle_store`, so every tier is `None`, every
      order is trivially "grouped" and the new gate never fires there.
    suggestion: |
      Move the gate below the book lookup and the membership check in each branch
      (or hoist a `get_book` + membership check above it), so the refusals are
      reported in cause order and the documented `False` for an unknown book
      survives. While there, add a store-backed case to
      tests/test_book_manager.py::test_reorder_puzzles so that file's coverage of
      the method is not vacuous.
