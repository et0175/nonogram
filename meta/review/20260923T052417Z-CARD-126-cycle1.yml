  - id: F-001
    fixed_in: "00ad374"
    status: fixed
    severity: low
    category: tech-debt
    type: bug
    file: src/nonogram/admin/templates/book_arrange_puzzles.html
    line: 107
    title: "Page-break indicator restarts its page numbering inside every level"
    description: |
      The page-break divider's `{% if loop.index % 3 == 0 and not loop.last %}` /
      `page {{ (loop.index // 3) + 1 }}` was written against one flat loop over the
      whole book. The diff nests that loop inside the new per-level loop, so
      `loop.index` now counts from 1 again at each level heading. A book with four
      or more puzzles in two different levels therefore renders "PAGE 2" twice and
      never "PAGE 3", and a level of 3 or fewer shows no divider at all however far
      into the book it sits.

      The attached render only has 4 easy / 3 medium / 2 hard puzzles, so exactly one
      divider appears and the defect is latent there; it is visible from the template
      alone (arrange-puzzles.html:107-109) and reproduces with any level of >= 4.
    suggestion: |
      Number the divider off the running book position instead of the level-local
      loop counter — the route already computes it: the row carries
      `puzzle.order` (1..n across the whole book). Replace the condition with
      `{% if puzzle.order % 3 == 0 and not loop.last %}` and the label with
      `page {{ (puzzle.order // 3) + 1 }}`, or drop the indicator here and let
      CARD-128 reinstate it once divider pages exist (they will shift the page
      arithmetic again).
    confidence: high
    source: static
