  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 1248
    title: "_tier_of resolves the whole membership one store read at a time on every order operation"
    description: |
      `_tier_of` (book_manager.py:1248-1266) eagerly resolves every id it is given,
      and `_stored_tier` (1281) issues one `puzzle_store.get_puzzle` per id — which in
      DB mode opens its own session and runs its own query
      (puzzle_review.py:1113-1116). Three paths now pay that:

      * `_move_within_level` (1242) reads all N members just to swap two adjacent
        ids — for the default 150-puzzle book (DEFAULT_PLAN) that is ~150 sessions
        per click of an arrow button, where the old code did one UPDATE;
      * `reorder_puzzles` (1150) does the same for the submitted order, and it does it
        *before* the book-exists check, so an unknown book still costs N reads;
      * the arrange route calls `book_mgr.puzzle_levels` (app.py:2766), which resolves
        every member, and then calls `puzzle_review.get_puzzle(puzzle_id)` again per
        row for display (app.py:2777) — the same rows fetched twice, ~2N queries to
        render one page.

      This is a local single-user admin panel on SQLite, so the wall-clock cost is
      modest and no test observes it; it is filed as waste with a cheap fix, not as
      a user-visible defect.
    suggestion: |
      Two independent cheap wins: (a) make `_tier_of` lazy/memoised — return a
      closure that reads a row on first ask and caches it — so `place_in_level`'s
      backwards scan and `moved_within_level`'s two lookups only touch the rows they
      actually inspect; (b) in the arrange route, take the tier from the puzzle dict
      the route already fetched (`puzzle["difficulty_tier"]`) rather than having
      `puzzle_levels` re-read it, e.g. by letting `puzzle_levels` accept a
      pre-built `tier_of`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

