    file: tests/test_puzzle_solver_phone.py
    line: 125
    title: "AC-1's mechanism (b) 25x15 claim is asserted in the binding AC text as 'confirmed' but has zero executable test backing"
    description: |
      CARD-193.md AC-1 (line 50) states, as part of the AC's literal, binding text:
      "(b) a board at least 25 cells wide hits its own fit-term ceiling (≈13.35 px at
      width 25 ...) ... breaking cell-uniformity itself — confirmed for a 25×15 board
      with single-digit columns". The word "confirmed" implies a demonstrated,
      re-checkable fact the same way mechanism (a)'s 30×30 claim is demonstrated by
      `test_the_stage_scrolls_exactly_when_the_column_floor_exceeds_the_fit[30x30]`
      (tests/test_puzzle_solver_phone.py, parametrized over GRIDS).

      No such test exists for mechanism (b). `GRIDS_SINGLE_DIGIT_COLS` (line 159) holds
      only `"15x15"`; grep across test_puzzle_solver_phone.py and test_puzzle_solver_mirror.py
      confirms no 25x15 single-digit-column fixture is ever built or measured by any
      executable test. AC-1's own cited tests
      (TestSolverPhone_BoardFitsThePhoneWidth, TestSolverPhone_BoardFitsWithoutScrollingWhenColumnsStaySingleDigit)
      do not exercise this board/construction at all. The entire mechanism (b) claim —
      the TR-height-rounds-on-MAJOR_EVERY-rows phenomenon — lives only in a code comment
      (lines 125-144) and in this card's Worktree notes prose.

      I independently verified the underlying technical claim is TRUE: I built two ad-hoc
      Playwright probes (a tight-column single-digit 25x15 at seed 19325, matching the
      implementer's own construction 1, and an independently-seeded random single-run-per-row
      25x15 at seed 777) and both reproduced the exact phenomenon described — uniform column
      width (9.1094px and 13.0469px respectively) but non-uniform row height ({13,14}px and
      {13.0469,14}px), snapping exactly on rows 5, 10 and 15 (the MAJOR_EVERY boundaries).
      So the claim is accurate, but it is NOT locked in by any test in the shipped suite: a
      future change to admin.css's border weights, the fit formula, or Chromium's own
      table-layout rounding could silently falsify or fix this claim and nothing in CI
      would notice, leaving AC-1's text stale in exactly the way this redo was itself
      escalated over (the AC making a claim its own test suite doesn't demonstrate).
    suggestion: |
      Either add a durable test (a `GRIDS_SINGLE_DIGIT_COLS["25x15"]` fixture plus an
      assertion that TR heights are non-uniform / sides differ, mirroring the pattern of
      `test_the_stage_scrolls_exactly_when_the_column_floor_exceeds_the_fit`), or soften
      AC-1's text from "confirmed" to "observed once, not test-covered" so the AC does not
      overstate its own test backing. The fix is cheap and does not require resolving any
      new ambiguity — the mechanism is already fully understood and documented.
