findings:
  - id: F-201
    severity: low
    category: tech-debt
    type: risk
    file: meta/architecture/decisions/adr/0036-book-page-geometry-via-page-spec.md
    line: 149
    title: "ADR-0036/R3's comment compresses the non-monotone floor back into the one number the card proved does not describe it"
    description: |
      The rule's bound list reads "bounded by the pages it renders, by a near-square footprint, by
      a filled mark, by a mark of at least 7 px across, and by DARKNESS". "At least 7 px across" is
      the single floor the fix's own measurement refutes: the instrument does see a 4 px disc
      (fill 0.9549) and a 5 px one (1.0695), and does not see a 6 px one (0.8488) — I reproduced
      the whole table. round_ink.py:135-139 states this correctly ("Under 7 px across the verdict
      is the raster's accident rather than the shape's ... a 6 px disc is not round, a 4 px one
      is"); the ADR comment does not, and the ADR is the artefact a future card reads first.
      The error direction is conservative — it claims less reach than the instrument has — so it
      cannot hide a round mark, which is why this is Minor and not a reopening of RC-1. But the
      card's own thesis is that no single number describes this bound, and the architectural
      record is the one place that still says otherwise.
    suggestion: >-
      One clause: "by a mark whose diameter the fill metric can resolve — from 7 px up always, and
      below 7 px the raster's accident rather than the shape's (measured table in
      DISC_VERDICT_BELOW_THE_SMALLEST_DOT)". Naming the table also gives the comment the floor's
      control, which it currently names only for darkness.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-202
    severity: low
    category: tech-debt
    type: risk
    file: tests/helpers/round_ink.py
    line: 102
    title: "\"discriminates on silhouette only\" is the right generalisation under the wrong word — the metric also reads interior density"
    description: |
      The card's main defence against the next gap is "It discriminates on silhouette only. Every
      bound below is a corollary of that one sentence ... every non-silhouette property of ink —
      its darkness, its colour, its opacity — is open by construction." I judge the *claim* true
      and well placed: the metric's only input is the thresholded boolean mask (page_ink.ink_mask),
      so everything thresholding discards is open, and that does predict the grey gap cycle 1
      found rather than merely record it. It appears where a reader of R3 will see it — the lead
      sentence of round_ink.py's bound list, ADR-0036/R3's comment (0036-*.md:146), the
      TestRoundMarkOnThePage_TheBoundaryIsMeasured docstring, the new darkness test's docstring,
      and the ADR History.
      The word is the problem. "Silhouette" ordinarily means outline, and the second bullet of the
      very list this sentence introduces contradicts that reading: a hollow ring has the same
      outline as a filled disc and is not round, because `fill` counts the ink *inside* the box.
      A reader taking "silhouette" literally would conclude the fill bound is inconsistent with
      the generalisation, when in fact both follow from "the binary ink mask".
    suggestion: >-
      Gloss it once, at round_ink.py:102 and in ADR-0036/R3's comment: "it discriminates on the
      binary ink mask alone — a region's footprint and the ink inside it — and on nothing else".
      Same sentence, same force, and the hollow bound becomes a corollary instead of an exception.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

