  - id: F-204
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_difficulty_dots.py
    line: 2871
    title: "Page attribution is keyed on id() of a live image, which the unplaced assertion cannot fully guard"
    description: |
      F-009's per-page fix takes the page from `id(draw._image)` in the spy and resolves it after
      the render via `number_of = {id(page): number for ...}`, with an assertion for keys that
      resolve to no page. That assertion catches a draw object on a *stranger* image, but not the
      one case it cannot see: a temporary image drawn on, freed, and its address reused by a page
      created later — CPython reuses ids freely. The result would be a silent misattribution of a
      declared dot to the wrong page, i.e. a weakening of exactly the property the fix adds.
      Currently controlled, which is why this is Minor rather than a gap: the `unplaced` assertion
      is silent on the real book (so nothing today draws on a non-page image at all), and
      test_the_glyph_the_one_site_draws_is_found_and_accounted_for compares
      `sorted(found) == sorted(declared)` including the page number, so a misattribution on the
      honest book reds a test. The residual risk is a future renderer that draws onto a scratch
      image.
      Noted also because the comment at 2866-2869 presents the id() route as forced ("the site is
      handed a draw object and never a page number"), which is true of the site but not of the
      harness: the spy could count renders instead.
    suggestion: >-
      Hold the page in a nonlocal counter the `banded`/page loop advances, or key on the image
      object itself in a dict with the page list keeping it alive (`{page: number}` is not
      hashable for PIL images, but an `enumerate` over a list of `(image, number)` and an
      identity scan is three lines and has no reuse failure mode). Either removes the hazard the
      assertion cannot reach.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

