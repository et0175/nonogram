  - id: F-004
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/web/pages.py
    line: 212
    title: "`result_page`'s docstring claims CLI parity it does not have"
    description: |
      `result_page`'s docstring (pages.py:212-216) and the module docstring (pages.py:20-23) both
      say the page "Reports what `cli._run_generate` prints for the same run and nothing else".
      Checked against cli.py:454-484 — it is wrong in both directions, three times:

        * The page ALWAYS prints the seed (pages.py:225, `<p>seed: <code>{seed:d}</code></p>`).
          The CLI prints it only under `if request.seed is None:` (cli.py:454-455). A run with a
          user-supplied seed is echoed by the page and not by the CLI.
        * The page prints the puzzle NAME (pages.py:224). The CLI never prints the name — its only
          output lines are `seed: ...`, `wrote {path}`, and the nudge line.
        * The CLI additionally prints FR-014's nudge count (cli.py:480-483). The page does not.

      This is the exact "overclaiming prose" pattern the last four cards each shipped one of, and it
      is the load-bearing kind: the claim is what a reader would rely on to conclude the two adapters
      cannot drift. Precedent for treating this as a real finding rather than a nit is this project's
      own — CARD-033 cycle-1 F-005 forced a test rename plus a requirements amendment for exactly the
      same defect class ("a test called 'sets both sides' whose body asserts (30, None) is a false
      claim in prose, which this project's review contract does not permit").
    suggestion: |
      State what the page actually reports and why it differs, rather than claiming parity: the page
      reports the puzzle's name, the seed unconditionally (a page has no scrollback, so ADR-0015's
      "report the seed when it was drawn" is discharged by always showing it), and the files written;
      the CLI's nudge line is not reproduced. If parity IS wanted, the fix is in the code, not the
      prose.
    confidence: high
    source: static
    violates: null
    root_cause: RC-3
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/web/pages.py
    line: 10
    title: "\"Everything a page interpolates goes through html.escape without exception\" is contradicted twice in the same file"
    description: |
      pages.py:10-11 states the absolute rule. Two interpolations in the same module do not follow it:
        * `_shell`'s `title` is interpolated raw into `<title>{title}</title>` (pages.py:199) — and
          `_shell`'s own docstring (pages.py:186-192) says so explicitly: "``title`` is interpolated
          unescaped and is therefore never caller data".
        * `failure_page`'s `summary` is interpolated raw into
          `<p data-outcome="{FAILURE}">{summary}</p>` (pages.py:271); its Args entry says "A literal
          from the handler, never caller data".
      Both are SAFE today — all four call sites pass string literals (handler.py:441/447/450 pass
      three literals; `result_page`/`failure_page` pass literal titles) — so this is not a live XSS.
      But the module docstring asserts an invariant the code does not hold, while the two function
      docstrings assert the real (weaker, conditional) rule. A future card reading the module
      docstring and passing an error's own text as `summary` would introduce stored-reflected markup
      into a page whose top-level contract says that is impossible. The escaping rule is precisely
      the kind of claim that must not overstate.
    suggestion: |
      Narrow the module docstring to the rule the code actually holds: everything that came off the
      wire is escaped at its interpolation point; `_shell`'s `title` and `failure_page`'s `summary`
      are contract-bound to be literals and are interpolated raw. Consider escaping `summary`
      anyway — it costs one call and removes the caveat.
    confidence: high
    source: static
    violates: null
    root_cause: RC-3
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

