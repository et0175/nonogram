findings:
  - id: F-001
    severity: critical
    category: compliance
    type: risk
    file: src/nonogram/web/handler.py
    line: 227
    title: "Any web page the user visits can drive POST /generate and write files to a path it chooses"
    description: |
      VERIFIED FROM THE CODE, NOT FROM THE CARD'S SUMMARY, AND CONFIRMED ON THE WIRE.

      `_dispatch` (handler.py:227-247) reads exactly one request header, `Host`. An AST sweep over
      every string constant in `src/nonogram/web/` finds no occurrence of `Origin`, `Referer` or
      `Sec-Fetch-Site` outside the docstrings that admit they are not read. CON-010's declared check
      `PropertyTest_WebServer_RejectsAnyCrossOriginOrForeignAuthorityRequest` has 0 hits under
      `tests/`; AC-054..AC-058 and EC-004 have 0 implementations. The card's summary of this is
      accurate and, if anything, understated — it is not overstated.

      A browser sets `Host` from the *target*, so a genuine cross-site form POST from
      `https://evil.example.com` to `http://127.0.0.1:8765/generate` carries `Host: 127.0.0.1:8765`
      and passes the check. Reproduced against a live `LoopbackHTTPServer`: a POST carrying
      `Origin: https://evil.example.com`, `Referer: https://evil.example.com/attack.html`,
      `Sec-Fetch-Site: cross-site`, `Sec-Fetch-Mode: navigate` returned 200, ran the full pipeline,
      and wrote pwned.png/.json/.csv/.svg into an attacker-named absolute directory. The attack needs
      no reply, so same-origin policy and CORS are irrelevant — this is textbook CSRF against a local
      daemon, and the whole exploit is one auto-submitting `<form method=post>`.

      WHAT AN ATTACKER CAN ACTUALLY ACHIEVE — measured, each bound checked rather than assumed:

      * `out` IS genuinely arbitrary. `submission.py:177` does `out=Path(out)` with no confinement,
        `orchestrator.py:1363` uses it verbatim as `directory`, and `export.write`
        (export/__init__.py:269) calls `directory.mkdir(parents=True, exist_ok=True)`. Verified:
        an absolute path is honoured and its whole tree created; a relative `../../traversal-escape`
        escapes the server's cwd and is created. With no `out` the files land in `Path.cwd()`, i.e.
        wherever the user launched `nonogram serve`.
      * An existing file is NOT overwritten. ADR-0017's `_free_path` auto-suffixes; verified — a
        second identical request produced `pwned-1.json` beside `pwned.json`. There is no
        data-destruction primitive here.
      * The filename is constrained. `_sanitized_component` (orchestrator.py:1437) reduces the stem
        to `[\w.-]+` and strips leading/trailing dots, so no dotfile and no traversal via `name`
        (verified: `=cmd|'/c calc'!A1` -> `cmd-c-calc-A1`). The extension comes from a fixed set of
        five: .json .png .svg .csv .pdf.
      * The content is NOT attacker-chosen text. The bytes are a generated puzzle; the `name` reaches
        the filename stem but I could not find it in the JSON or SVG payload, so there is no
        content-injection primitive.

      CONCRETE WORST CASE: while `nonogram serve` is running, any page the user opens in any tab can
      silently, repeatedly and in parallel create directory trees at any absolute path the user can
      write, and drop up to five files per request (a ~72 KB PNG among them) into them — burning one
      solver thread per request up to ADR-0011's deadline, on an unbounded `ThreadingHTTPServer`.
      The realistic harms are disk exhaustion and filesystem litter at chosen locations, CPU
      exhaustion, and planting a file where another program will later read it — the last one bounded
      by the target path not already existing and the extension being one of five. It is a genuine
      unauthenticated remote filesystem-write primitive; it is not code execution and not data loss.

      MERGE JUDGEMENT. The violation predates this card, CON-010/NFR-004 carries five acceptance
      criteria and a property of its own, none of them on CARD-020, and the card disclosed the gap
      and corrected CARD-019's misattributing docstrings rather than hiding it. All of that is to the
      card's credit and none of it changes the state of the system after the merge. Before this card
      a cross-origin page could make the server render a string constant; after it, the same request
      runs the pipeline and writes files at a path the attacking page chooses. That is a change in
      kind, on a command a non-technical user is invited to run and leave running while browsing.
      Recommendation: do NOT merge as-is.
    suggestion: |
      Preferred, and cheap enough that the already-required cycle 2 absorbs it: add the refusal to
      `_dispatch` beside the existing `Host` check — same shape, same rank, decided before routing,
      answered with a status code, no domain knowledge, squarely inside ADR-0019/R1's "HTTP
      concerns only". Roughly:
        * refuse when `Sec-Fetch-Site` is present and is not `same-origin` or `none`;
        * refuse when `Origin` is present and its authority is not in `ALLOWED_HOSTS`.
      Both headers are sent by every modern browser on a cross-site form POST and neither can be
      suppressed by page script, so this closes the browser-mediated reach that the `Host` check
      explicitly does not. Note this is a partial down-payment on NFR-004, not its closure — the
      NFR-004 card for AC-054..AC-058 + EC-004 and the missing property test is still needed.

      Intake status, checked: a `@security` backlog entry for exactly this WAS filed on `main` at
      f1bad64 ("docs(backlog): NFR-004/CON-010 unimplemented, and CARD-020 raises its stakes",
      2026-09-03), and its own wording is "it should gate the web UI being used at all". So the
      record exists and this finding does not duplicate it; what is still open is the SEQUENCING
      decision, which is what this finding puts to the human.

      Fallback if the board insists on scope discipline: merge CARD-020 but do not advertise or ship
      `nonogram serve`, and cut the NFR-004 card as the immediately next one, blocking any release
      that exposes `serve`. Answering the direct question: `nonogram serve` is NOT safe to hand to a
      non-technical user today — that user is precisely the one who will start it, leave it running
      and browse the web in the same session, which is the entire precondition.
    confidence: high
    source: static
    violates: CON-010
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/web/submission.py
    line: 177
    title: "An unregistered export format (or a NUL in `out`) escapes as an unhandled ValueError and drops the connection"
    description: |
      The card's §5 says in as many words: "No unhandled exception and no raw traceback may ever
      reach the browser." Two reachable bodies break the first half.

      `export.for_format` (export/__init__.py:186-192) raises a bare `ValueError` — its docstring
      says "Deliberately *not* a `nonogram.errors` type, for the same reason `sourcing.for_mode`
      makes the same choice: an unsupported format is rejected by argparse's `choices` at the
      adapter". That is the IDENTICAL contract the implementer cited to justify the `mode` check in
      `submission.py:146-149` — but `export_formats` is passed through unchecked at
      `submission.py:172`. `handler._generate` catches `NonogramError` and `OSError` only, so the
      `ValueError` propagates out of `do_POST`.

      Verified against a live server:
        POST export_formats=bogus                -> connection dropped, ValueError traceback on stderr
        POST export_formats=png&export_formats=bogus -> connection dropped, AND the PNG was already
                                                        written before the crash — a partial export
                                                        with no response at all.
        POST out=bad%00dir                       -> connection dropped; Path.mkdir raises
                                                    ValueError("embedded null character in path"),
                                                    which is not an OSError either.
      Control: export_formats=png -> 200.

      No raw traceback reaches the browser (that half of §5 holds — it goes to server stderr and the
      socket closes), and strictly EC-003 speaks of "any *domain* error", which a ValueError is not.
      But the browser gets a dead connection instead of the structured failure page the whole card
      exists to produce, and the `out=NUL` case is an asymmetry the web adapter *introduced*: a NUL
      cannot appear in argv, so the CLI cannot reach this path at all.
    suggestion: |
      Discharge the same contract for `export_formats` that was discharged for `mode`: check the
      posted values against `export.FORMATS` in `submission.read` and report unreadable ones through
      the existing `Submission.unreadable` channel. `pages.py` already imports `export` for the
      checkbox list, so the offered set and the accepted set become one object exactly as
      `pages.MODES` did — and this is route-table membership, not domain validation, by the same
      argument that cleared the `mode` check.

      For `out`, the narrow fix is to add `ValueError` to `_generate`'s existing non-domain except
      arm (`except (OSError, ValueError)`), or to refuse a NUL byte in the body at the transport
      layer beside `MAX_BODY_BYTES`. Add a test for each; note that today the export-format path has
      no test at all, which is why the suite is green on a crash.
    confidence: high
    source: static
    violates: EC-003
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

