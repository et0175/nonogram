  - id: F-011
    severity: info
    category: tech-debt
    type: question
    file: src/nonogram/web/submission.py
    line: 146
    title: "G-2 adjudication: both disclosed adapter refusals are legitimate"
    description: |
      Recorded as an explicit verdict because the implementer disclosed the tension and asked for it.

      (a) `int()` on size/density/seed (submission.py:132-142) — LEGITIMATE. ADR-0019/R1's own
      allowlist names "request parsing" as an HTTP concern. `GenerationRequest.width/density/seed`
      are typed `int | None`; a non-numeric string cannot be placed in them, so this is the web
      spelling of argparse's `type=int`, which `cli.py` applies at the same rank. G-2 enumerates what
      must reach the domain — an out-of-range size/density, an unsupported difficulty, an empty name
      — and none of those is this: verified that 60, 500, "extreme" and " " all travel inward and
      come back as SizeOutOfRange / InvalidDensity / UnsupportedDifficulty / InvalidPuzzleName
      (`_REAL_FAILURES`, each cross-checked against the untouched pipeline's own exception).

      (b) `mode not in pages.MODES` (submission.py:146-149) — LEGITIMATE, and it is the adapter
      refusing a value that is not in its own route table, not domain validation. Decisive: `mode` is
      a DISPATCH KEY, not a value a domain rule judges — it selects which capability module runs —
      and `sourcing.for_mode` has explicitly delegated the check to the adapter by contract, its
      docstring saying "a user typing an unsupported mode is rejected by argparse's `choices` at the
      adapter" and raising a bare `ValueError` rather than a `NonogramError` if one arrives anyway.
      `cli.py` discharges the same delegation with `choices=`. Without it `mode=bogus` becomes the
      dropped connection of F-002. Note also that G-2's own enumeration conspicuously omits `mode`.
      Drift risk is closed rather than argued: `test_a_mode_the_form_does_not_offer_is_refused_the_way_argv_is`
      asserts `set(pages.MODES) == set(_argv_mode_choices())`, reading argparse's choices off the
      built parser, so the two vocabularies cannot diverge silently.

      NOTHING ELSE VALIDATES THAT SHOULD NOT. Confirmed by reading every branch in submission.py and
      handler.py: `library_key`, `name`, `difficulty`, `density` and `export_formats` are all carried
      as posted; the remaining refusals (`Host`, `Content-Length`, `MAX_BODY_BYTES`, the 404) are
      transport-level, measured in bytes or header names and answered with a status code.
      The inverse defect is what F-002 records: `export_formats` sits under the SAME bare-ValueError
      contract as `mode` and was NOT given the same treatment.
    suggestion: "No change required for (a) or (b). The asymmetry with export_formats is F-002."
