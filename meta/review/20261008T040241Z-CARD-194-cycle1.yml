findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/static/solver.js
    line: 648
    title: "A pen (or any non-cancelled touch/pen) drag that moved was read as a click on its start cell when Region was off"
    description: |
      pointermove only updated gesture.dragging when gesture.paints was true, so for a touch/pen
      gesture with Region off (paints = false), gesture.dragging stayed false regardless of actual
      movement. pointerup's click path used done.start unconditionally when !done.dragging, so a pen
      drag that moved several cells but reached pointerup without a pointercancel (confirmed via a CDP
      probe using Input.dispatchMouseEvent with pointerType "pen": Chromium does not reliably cancel a
      pen gesture the way it does a touch gesture) was marked as a click at the starting cell instead
      of marking nothing, violating the card's own "pen counts as touch" decision and the "a tap is a
      click, a drag is not" rule (CARD-194 target behaviour #8/#10).
    suggestion: |
      Track gesture.dragging unconditionally in pointermove (gate only the preview paint on
      gesture.paints); in pointerup, when done.dragging is true but done.paints is false, do nothing
      (refresh() and return) instead of falling through to the drag-commit or click branches.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: "src/nonogram/admin/static/solver.js (pointermove/pointerup, this cycle)"
