  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/pdf.py
    line: 306
    title: "PDF pages are content-sized, not A4 — and write_pdf's docstring plus a test name claim otherwise"
    description: |
      `Layout.width/height` is `grid_right + margin` / `grid_bottom + margin`
      (layout.py:498-499) — the size of the *drawing*, A4-constrained but not A4.
      For a PDF that number becomes the page's /MediaBox, so the emitted pages
      are (measured, all sizes at 300 DPI + the 12 mm band):
        4x4   63.2 x  75.2 mm     20x20 200.1 x 212.1 mm
        10x10 115.3 x 127.3 mm     50x50 205.6 x 217.6 mm
      A 10x10 puzzle therefore prints as a 115x127 mm page, not an A4 sheet.
      That is inherited geometry the card was told to reuse (CON-006, G-2), no
      AC or ADR states a page size, and the physical scale is correct — so this
      is a design question, not a defect.

      What *is* inaccurate is the claim: `write_pdf`'s docstring says
      `resolution` "is what makes the pages A4-sized in the document", and
      tests/test_export_pdf.py::test_the_written_pages_are_a4_sized_at_the_print_resolution
      is named for A4 while its assertion computes the content size. The
      statement is true only in the sense that the page is A4-*constrained*.

      Checked and cleared: the 12 mm header band cannot push a page past A4
      height — `_fit_cell` takes min(width-fit, height-fit) and width binds for
      every square grid up to 50x50 (worst measured height 223.5 mm vs 297 mm).
    suggestion: |
      Reword write_pdf's docstring to "reproduces the intended physical size
      instead of Pillow's 72-DPI assumption" and rename the test to
      test_the_written_pages_carry_the_layout_size_at_the_print_resolution.
      Whether the MediaBox should be full A4 with the drawing centred is a
      product decision for a follow-up card, not a fix here.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/pdf.py
    line: 313
    title: "Pillow stores RGB pages as lossy JPEG (/DCTDecode) — artifacts and ~11x the bytes on a pure line drawing"
    description: |
      Measured on the produced file, not inferred: every page object in the
      emitted PDF carries `/Filter /DCTDecode` and `/ColorSpace /DeviceRGB` —
      Pillow's PdfImagePlugin JPEG-encodes any RGB image. Decoding the embedded
      stream back and diffing against `pdf.render_pages()`'s own raster on a 4x4
      puzzle: max per-pixel deviation 45/255, 248 pixels deviating by >20, and
      1473 pure-white pixels turned grey — mild JPEG ringing around the rules
      and clue digits of an artifact whose whole point (png.py's INK/BACKGROUND
      comment) is "no anti-aliased grey in the paper". Size cost on a 50x50:
      1,428,100 bytes of PDF vs 127,303 bytes for the equivalent PNG.
      Not a merge blocker — the degradation is invisible at print size and no
      AC or NFR constrains it — but it is an unflagged property of a deliverable
      the card describes as a print artifact.
    suggestion: |
      Try `puzzle_page.save(..., quality="keep"/95)` or convert the pages to
      mode "1" for a lossless CCITTFaxDecode stream; mode "1" would destroy the
      clue digits' anti-aliasing that png.py's _MODE comment deliberately keeps,
      so measure before switching. Worth a one-line experiment, not a redesign.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

