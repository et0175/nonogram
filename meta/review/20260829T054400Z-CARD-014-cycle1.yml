    title: "A non-ASCII --name renders as .notdef boxes in the PDF header"
    description: |
      Verified independently, not taken from the card's notes: with
      `ImageFont.load_default(size=60)`, the glyph bitmaps for "—" (U+2014),
      "–" (U+2013), "…" (U+2026) and every letter of "кот"/"café" are
      byte-identical to the bitmap for the permanently-unassigned U+FFFE, i.e.
      the .notdef box. The card correctly solves the *separator* case by
      stroking the em dash as a rule, but the *name* case is untouched: CARD-011
      keeps `--name` verbatim (AC-044/AC-045 permit any non-blank string), so
      `--export pdf --name кот` ships a PDF whose AC-046 header reads as three
      tofu boxes. The filename is unaffected (the sanitizer is Unicode-aware).

      Not raised above Minor deliberately: every in-card fix violates a
      guardrail — a font package reopens ADR-0006/G-1, and mangling the name to
      fit the font contradicts AC-044's verbatim requirement. The implementer
      escalating rather than deciding is the correct move; what is missing is
      that the escalation currently lives only in the card's worktree notes and
      has not reached meta/kanban/backlog.md, where Wave 7's surfaced findings
      went.
    suggestion: |
      Route to the user/architect as a decision, and record it in
      meta/kanban/backlog.md at `done`:
        (a) ship a DejaVu-class TTF as package data (a data file, not a
            dependency — arguably does not reopen ADR-0006, but is a decision
            the architect should make explicitly), or
        (b) accept ASCII-only headers and say so in the CLI help for --name, or
            reject non-ASCII --name at the CLI boundary as a domain error.
      Do not fix inside CARD-014.
    confidence: high
