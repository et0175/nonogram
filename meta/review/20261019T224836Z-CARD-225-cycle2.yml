findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1444
    title: "The F-006 remedy's mechanism is dead and its cited control cannot fail -- two mutants survive"
    description: |
      Fix cycle 1 declared F-006 fixed "structurally rather than incidentally", added two
      statements to production, and cited one new test as pinning the distinction. Measured,
      none of that is load-bearing.

      **What the code does.** `BookPDFGenerator.__init__` already reads the sheet:
      `frame = page_frame(self.page_spec(1))` at book_pdf_generator.py:3958 (unchanged by this
      card -- present on main at :3897). So a book whose stored print specification cannot be
      laid out raises `ValueError` in the **constructor**, before any member is measured,
      before any pre-read, and before any try block. Reproduced directly with the fix's own
      remedy deleted:

          puzzle_page_plan(book_with_trim_width_cm="abc", puzzles)
            -> ValueError("book trim_width_cm must be a number of cm, not 'abc'")

      **The two mutants.**
        * **M10** -- delete `generator.page_spec(1)` (book_pdf_generator.py:1444, the statement
          whose comment at :1438-1443 says `cell_sizes` "would read it again inside the try
          otherwise"): **0 failures** over tests/test_book_pdf.py, test_book_floor.py,
          test_book_select_floor_tiles.py, test_book_cell_size.py, test_book_page_numbers.py,
          test_book_arrange_page_breaks.py. Re-run solo against
          `TestBookPdf_UndrawablePuzzleAbortsNamingThePuzzle`: 10 passed.
        * **M14** -- move `section_plan`'s `spec = self.page_spec(1)` (and the TOC measurement
          it feeds) to **below** the cell-map try, i.e. revert exactly the ordering the comment
          at :6327-6334 says is what keeps a book-level fault out of the per-puzzle handler:
          **0 failures** over the same six files.

      **The four committed claims the survivors refute.**
        1. book_pdf_generator.py:1438-1443 -- "read **outside** the try below ... so it stays
           the bare ValueError it has always been rather than becoming a per-puzzle abort
           naming all 120 of them. `cell_sizes` would read it again inside the try otherwise."
           The "otherwise" is unreachable; the statement at :1444 is dead code (a bare
           expression whose value is discarded).
        2. book_pdf_generator.py:6327-6334 -- "without this ordering a book-level fault would
           come back out of that handler as a per-puzzle RuntimeError listing all 120 members
           ... Stated by this one call rather than left to the TOC measurement's position in
           this method." It is still left to a call's position -- the constructor's -- which
           the fix did not find. (The statement itself is a legitimate small improvement: it
           saves a second `page_spec` call. Only the reason given for it is false.)
        3. tests/test_book_pdf.py:1253-1262 --
           `test_an_unreadable_print_specification_is_the_books_own_failure`'s docstring says
           an unreadable stored trim "used to arrive at the per-puzzle handler above and come
           back out as RuntimeError(...) -- 120 numbers for a failure that belongs to none of
           them", and that "Both entries read the sheet before the handler now, so the
           distinction ... is kept by the caller too". The test passes identically with either
           caller mechanism removed, so it is a control that cannot fail -- **ADR-0039/R1**,
           severity `mandatory`, in so many words ("A claim whose control cannot fail is
           narrative, not coverage, and must be narrowed to what is measured or deleted").
        4. CARD-225.md failure-matrix row **F-3b** -- "Both entries read the sheet once,
           before the cell map's handler, so the distinction `_unmeasurable_members` already
           drew is kept by the callers too ... Pinned by
           `test_an_unreadable_print_specification_is_the_books_own_failure`." Same claim,
           committed into the card's declared failure semantics.

      **A fifth consequence, pre-existing but now mis-documented.**
      `_unmeasurable_members`' `spec_is_readable is False` branch (book_pdf_generator.py:4060-4069)
      is unreachable from either production entry for the same reason, yet its docstring
      describes that case as the live one ("Should none refuse -- a book whose sheet itself is
      unreadable ... every member is named"). Cycle 1's F-006 dismissal was right that the
      120-number message was never producible; it got the cause wrong, and the fix was built
      on the wrong cause.

      **What is NOT wrong.** The behaviour is correct on every tree: a bad stored spec is a
      bare ValueError from both entries, and the new test asserts that truly. The finding is
      that the claim is wider than its mechanism, which on this board is the finding.
    suggestion: |
      Narrow the claims to what is measured, and make the test discriminate something.
        1. Replace the two comments' counterfactual with the real mechanism, naming the line:
           "an unreadable stored print specification raises in `BookPDFGenerator.__init__`
           (`page_frame(self.page_spec(1))`), before any member is measured, so a book-level
           fault can never reach the cell map's handler. This read is kept only to avoid a
           second `page_spec` call / is redundant and removable." Delete the dead
           `generator.page_spec(1)` at :1444, or keep it and say it is a belt-and-braces
           statement with no control, not a mechanism.
        2. Give the test the control it claims, which is cheap: drive the shape the
           constructor cannot catch -- construct the generator on a good book, then make the
           spec unreadable (`generator.book.trim_width_cm = "abc"`) and call `section_plan` /
           `puzzle_page_plan`. On that path the pre-read IS what decides, M10/M14 both red, and
           `_unmeasurable_members`' `spec_is_readable` branch becomes reachable rather than
           dead. If that path is judged not worth supporting, say so and delete the branch and
           both statements instead -- what is not acceptable is a committed failure-matrix row
           citing a control that cannot fail.
        3. Amend failure-matrix row F-3b to the mechanism that actually holds it.
