  - id: F-007
    severity: info
    category: feature
    type: question
    file: meta/kanban/cards/CARD-225.md
    line: 41
    title: "AC-1's wording promises more uniformity than F-9 delivers -- worth one render before the owner meets it in print"
    description: |
      AC-1 says "every one of them is drawn at the same cell size, measured off the ink", and
      the card's title is "One cell size per grid size across the whole book". Failure-matrix
      row F-9 declares the exception: a two-up page draws
      `min(book cell A, book cell B, pair fit)`, so when the pair's own two-up fit is below the
      grid size's book cell, a paired member of a grid size prints **smaller** than a single
      member of the same grid size in the same book. Worked arithmetic on Book 1: three 13x13s
      with 1-deep gutters have a book cell of 7.5 mm; two of them paired fit at about 7.27 mm
      (pair height / 28 cells), the third prints alone at 7.5 mm.
      This is declared, deliberate and physically necessary, and the AC-1 test exercises a book
      whose members do not pair -- so nothing here is broken. It is flagged because it is the
      one thing in this card's geometry that the owner can see on paper and that the card's
      own headline denies.
    suggestion: |
      Not a code change. A render worth asking for before merge, since it is cheap and the
      owner validates visually: one Book 1 interior holding three 13x13 easy puzzles at 1-deep
      gutters -- two will share a page, one will print alone -- exported to
      ~/Documents/nonogram-reviews/CARD-225 and eyeballed for whether the ~0.23 mm difference
      between the paired grids and the single grid reads as wrong on the page. If it does, the
      question is for FR-040/AC-4, not for this card. Separately, AC-1's wording could gain
      "...on the book's single pages" so the headline and F-9 stop disagreeing.
