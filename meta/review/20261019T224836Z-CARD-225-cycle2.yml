  - id: F-003
    severity: low
    category: compliance
    type: question
    file: meta/architecture/requirements.yml
    line: 3405
    title: "EC-027's statement does not name the cap its own property test now enforces -- the EC-021 propagation gap's twin, undeclared"
    description: |
      EC-027 (requirements.yml:3405-3418) reads: "a page holds two only when their tiers are
      equal, they are consecutive in the book order and fit at a shared cell of at least
      7.0 mm; a puzzle that could pair with its successor under that rule is never left alone
      by the in-order walk". It names no sheet and no cap.

      Its named property test's module docstring now reads (tests/property/test_book_pairing.py:11-20):
      "they fit at one shared cell of at least 7.0 mm **on a sheet capped at the smaller of
      their two grid sizes' book cells** (CARD-225)". The card's own hand-built refusal book
      instantiates the difference: three 22x10 members, a pair whose own two-up fit is
      7.254 mm (>= 7.0) that is nevertheless **not** paired, because a third member takes the
      grid size's book cell to 6.80 mm.

      So EC-027's second clause admits two readings that differ exactly on the F-8 shape --
      "fit at a shared cell" as the pair's own fit (the pair could pair, the walk leaves it
      alone, the clause is **false**) or as the fit on the sheet the book offers (the clause
      holds). The implementation and the test pick the second; the registry says neither.

      This is the same registry-propagation gap the card correctly declared for EC-021 (its
      F-13, and cycle-1's F-004): NFR-008's 2026-10-17 amendment (commit 91609aa) moved the
      printed cell from a puzzle to a grid-size-per-book and did not propagate into the
      consistency ECs that quote it. The card declared it for EC-021 and routed the wording to
      the architect station. For EC-027 it declared the **behaviour change** (failure-matrix
      row F-8, naming EC-027) and that the property can now see it -- but nothing records that
      EC-027's own wording is now under-determined, although fix cycle 1's opening sentence
      names EC-027 as "the one whose verdict the card actually moved".

      Filed Minor, not Important, because the second reading is the natural one and a skeptic
      can fairly say EC-027 never specified the sheet, so nothing in the registry is falsified
      -- unlike EC-021's "no two of them can disagree about a puzzle", which became flatly
      untrue. `meta/architecture/**` is untouched by this card and must stay so.
    suggestion: |
      Card-side, cheap and in scope: one line in the card's findings-for-the-orchestrator
      block, symmetric with F-13 -- "EC-027's statement does not name the sheet the shared cell
      is fitted on; since NFR-008's amendment the pairing verdict depends on the grid size's
      book cell, and the property test states that explicitly while the registry does not.
      Routed to the architect station; no registry edit from a delivery card."
      Architect-station, not this card: add the cap term to EC-027's statement (or say
      explicitly that "fit at a shared cell" means the fit on the sheet the book offers), and
      re-check AC-248..AC-250 against it.
    confidence: medium
    source: model
