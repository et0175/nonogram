  - id: F-005
    severity: info
    category: tech-debt
    type: question
    file: tests/test_book_pdf.py
    line: 1277
    title: "A tautological assertion in the new F-006 test"
    description: |
      `assert not isinstance(raised.value, RuntimeError), message` sits inside
      `with pytest.raises(ValueError)`. `RuntimeError` is not a subclass of `ValueError`, so a
      RuntimeError would never reach that line -- `pytest.raises(ValueError)` would have let it
      through and failed the test first. The assertion can never fire. Harmless (the real
      discriminator is the `pytest.raises(ValueError)` itself, which does work), but it reads
      as the test's main guard.
    suggestion: |
      Delete the line, or replace it with the assertion that carries the intent --
      `assert type(raised.value) is ValueError, message`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: info
    category: ops
    type: risk
    file: tests/property/test_book_pairing.py
    line: 745
    title: "The walk half now runs the whole-book cell map per book -- about 16k added compute_layout calls, no timing taken"
    description: |
