    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_book_pairing.py
    line: 470
    title: "F-8 and F-9's regression surface inside the property is one hand-built book each"
    description: |
      `_book_cell_books()` returns exactly two books; the walk half consumes both, the rendered
      half consumes only the first. Measured here, with the two books removed from the corpus
      generators: over the 3600-book sweep `refused_on_book_cell == 0` **and**
      `book_cell_lowered == 0`, and over the 24-book rendered sweep `shared_binds == 0`. So
      each of the three counters is satisfied by exactly one occurrence from exactly one
      hand-built book, and F-9 (a pair paired at a lowered cell) is exercised on the **plan**
      only -- its ink is pinned elsewhere, by
      tests/test_book_cell_size.py::TestBookCellSize_SharedPageTakesTheSmaller::test_both_slots_are_drawn_at_the_smaller_of_the_two_book_sizes.

      That is the same one-case surface cycle-1's F-003 criticised, now moved inside the
      property rather than removed -- which is a real improvement (the counters make the
      corpus unable to shrink silently, and the 3600-book sweep still certifies the new term
      never changes a verdict it should not), but it is worth saying plainly rather than
      letting "the property now sees F-8" read as "F-8 is swept".

      Measured context for the judgement, not an argument against the two books: the shape is
      **rare, not unreachable**. Over 80,000 off-corpus books from the same `_puzzle`
      generator (4 seeds x 20,000) F-8 occurred **2** times (seeds 1271 and 7) and F-9 **0**
      times -- roughly 1 book in 40,000 for F-8. Reaching it by sweeping would need O(10^5)
      books, ~30x the current corpus and far outside engineering-standards section 6's
      100-1000-case budget, so hand-building is the right mechanism. The committed wording in
      `_book_cell_books`' docstring ("essentially never ... measured over the 3600-book sweep
      below, the shape occurs zero times") is accurate; only the paraphrase "the sweep provably
      cannot produce it" overstates it.
    suggestion: |
      Parametrise the two books instead of fixing them: `_member(columns, 10, ...)` over
      columns in 22..24 with two or three depth pairs each gives ~6 F-8 cases and ~6 F-9 cases
      for no rendering cost in the walk half, and the counters become `>= 4` rather than
      `>= 1`. Also feed `_book_cell_books()[1]` (the F-9 book) to the rendered half, or say in
      its docstring that F-9's ink is pinned in tests/test_book_cell_size.py and name the test.
    confidence: high
    source: static
    violates: null
