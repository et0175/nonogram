family_regression:
  statement: |
    BOTH of this cycle's gating findings fall in a family that already produced a gating
    finding in cycle 1, on two independent readings of "family":
      * by rule — cycle-1 F-005 was a committed docstring claiming a discrimination a mutant
        refuted (ADR-0039/R1's shape). Cycle-2 F-001 is the same shape, now in two production
        comments, a test docstring and a committed failure-matrix row.
      * by file/function — cycle-1 F-002 and F-006 were both about
        `book_pdf_generator.puzzle_page_plan` / `section_plan`'s abort naming and the sheet
        read in front of it. Cycle-2 F-001 and F-002 are in exactly those two functions,
        introduced by the commit that fixed F-002 and F-006.
    So this is two consecutive cycles whose gating finding sits in one family, and the loop is
    regenerating the defect rather than converging on it. The signal is not the count (10
    findings closed, 14 of 18 mutants killed, the hardest finding closed on the mechanism) --
    it is that the fix for a claim-vs-mechanism finding was itself written as a claim without a
    control, in the same file, in the same cycle. Attribution: F-001 and F-002 are both
    attributable to fix cycle 1 (new code and new comments at 0cba979). F-003, F-004, F-006 and
    F-007 are not -- F-003 and F-007 predate the fix (ba6c5b7 / the registry), F-004 is a
    property of the fix's chosen mechanism rather than a defect in it, F-006 is an unavoidable
    cost of the correct fix.
    Recommendation for the retro, not for this card: the standing rule this board keeps
    re-learning is "a comment that names a mechanism must name the line that enforces it, and
    a comment that names a test must be refuted by deleting the mechanism." That is ADR-0039/R1
    already; what is missing is that the fix station runs the deletion, not only the addition.
    The cheapest enforcement is a fix-cycle obligation: for every claim a fix commits, run the
    mutant that deletes the claimed mechanism and record the failure count -- fix cycle 1 ran
    seven mutants (M-A..M-G) and every one of them was an ADDITION's control; not one deleted
    the F-006 remedy it was asserting.
