    title: "Mirrored boards change the row-clue header's DOM/reading order relative to its cells (documented trade-off, not independently verified)"
    description: |
      In mirrored mode, drawBoard appends each row's td.player-cell elements before its
      th.player-clue.is-row box (line.append(box) moved to after the cell loop), so a screen
      reader's linear reading order meets a row's cells before the row header that names its
      clue. The implementer explicitly flagged this in the card's own Worktree notes ("[Mirror
      placement]... DOM order changes for mirrored boards: a screen reader meets the row clue
      after the row's cells. Record this in the PR.") as a known, deliberate consequence, not
      an oversight. No automated a11y check (axe-core or otherwise) covers this card — Step 8g
      ran as a static read only, per the task's instructions (review.visual is OFF).
