  - id: F-001
    severity: critical
    category: feature
    type: gap
    file: tests/test_puzzle_solver_phone.py
    line: 226
    title: "AC-1, AC-2 and AC-11 are literally contradicted by the measured, owner-sanctioned behavior; the AC text (card + requirements.yml) was never re-cut to match the final ruling"
    description: |
      AC-1 requires "the stage's scrollWidth is <= its clientWidth" for all four named boards;
      AC-2 requires the 30x30's cells to be "narrower than 14 px"; AC-11 requires
      ".player-stage does not scroll sideways". Measured (and confirmed by me independently
      re-running the tests): all three GRIDS fixtures (15x15, 25x15, 30x30) measure ~14.39 px
      at 390 px — NOT narrower than 14 px (AC-2 fails) — and .player-stage's scrollWidth DOES
      exceed its clientWidth for all of them, because each has a two-digit column clue and
      CARD-196's --player-col-floor (14.4 px for 2 digits) exceeds the fit term (AC-1 fails).
      tests/test_puzzle_solver_page.py:1253 (TestSolverPageFits::test_a_phone_width_page_never_scrolls_sideways,
      AC-11) asserts `stageScrolls is True` — the literal opposite of AC-11's "does not scroll
      sideways" — left there deliberately, with a comment explaining why, rather than the
      `False` the card's own Worktree notes ("[Other tests that change]") predicted.

      The implementer did not hide this: Worktree notes "The col-floor interaction with
      AC-1/AC-2/AC-11" documents the exact same measurement and explains the tests assert a
      TRUE, different, conditional property ("stage scrolls iff the column floor exceeds the
      fit") instead of the AC's literal "never scrolls" / "narrower than 14 px". That is a
      correct, well-cross-checked implementation of the owner's own final ruling, quoted
      verbatim in the card's Worktree notes: "Clue numbers and the '?' mark never render below
      12 px: where a board cannot fit at 12 px, it scrolls sideways (this overrides the
      fit-to-width rule for numerals only)." I confirm meta/architecture/requirements.yml's
      FR-044 AC-343 (line 4092) and AC-354 (line 4160) still read with the PRE-ruling wording
      ("cells at the 24 px phone floor", respectively silent on the override) — the card's own
      escalation routing step "(2) /forge:architect: delta on requirements.yml for AC-354 and
      AC-343 to match the ruling" was never executed, and CARD-193's own AC-1/AC-2/AC-11 prose
      in meta/kanban/cards/CARD-193.md was likewise never re-cut (routing step 3), despite the
      same file's Worktree notes explicitly anticipating this exact tension before
      implementation began.

      Verdict (the orchestrator's own framing, (a) vs (b)): this is predominantly (b), a
      requirement/decomposition artifact gap, not a code defect — for three reasons. First,
      GRIDS["15x15"]/["25x15"]/BIG are G-1-pinned, pre-existing CARD-182 fixtures (seeds 182,
      1825, 1830) shared with TestSolverPhone_DesktopSizingUnchanged; swapping them for a
      hand-built single-digit-column grid risks moving DESKTOP_CELL's pinned 1440 px values
      (G-1) and was correctly avoided. Second, the owner's OWN final ruling text explicitly
      names and accepts this exact trade-off ("where a board cannot fit at 12 px, it scrolls
      sideways") — the code is not wrong, the AC prose is stale. Third, constructing a
      uniquely-solvable 15..30-cell grid where EVERY row and column run is single-digit (so the
      literal AC would hold) is a real, two-axis construction problem, not a one-line fixture
      swap — unlike _deep_row_clues's one-axis (row-only) deliberate construction. AC-11's
      fixture (`_unique_grid(MAX_SIZE, MAX_SIZE, seed=31)`, tests/test_puzzle_solver_page.py)
      is NOT G-1-shared, so there is more latitude there, but the same two-axis construction
      difficulty applies.

      Severity: filed as Critical per this review's own AC-failure rule (three ACs' literal
      text is measurably false), but the fix is NOT a code change to admin.css/solver.js — it
      is a requirements-artifact reconciliation. Routing, not a redo, is the correct next step.
    suggestion: |
      Do not send this back to the implementer for a code fix — the code correctly implements
      the owner's final ruling and the tests verify a true, cross-checked property. Route per
      the card's own already-drafted plan: (1) /forge:architect delta on
      meta/architecture/requirements.yml AC-343 and AC-354 to state the 12 px-numeral-floor
      override explicitly; (2) /forge:kanban decompose: re-cut CARD-193's (or a follow-up
      card's) AC-1, AC-2 and AC-11 text to the conditional property the tests actually verify
      ("the stage scrolls iff the column-numeral floor exceeds the fit") instead of a blanket
      "never scrolls" / "narrower than 14 px" guarantee the architecture cannot make once
      CARD-196 pinned a 12 px numeral floor. Optionally, as a separate enhancement (not a
      blocker): a deliberately constructed single-digit-row-and-column fixture (extending
      _deep_row_clues's technique to both axes) would let a future card demonstrate the
      best-case fit-to-width behavior the original (pre-CARD-196) AC-1/AC-2 draft intended,
      without touching the G-1-pinned fixtures.
