ruling_on_the_section_6_snapshot_disclosure:
  the_facts_i_established:
    - "§6's fenced block is lines 520-609 of the document, 90 lines."
    - >-
      Against bd2128b5 it is verbatim: `git show bd2128b5:meta/kanban/config.yml
      | sed -n '42,131p'` is 90 lines, `diff` is EMPTY, and sha256 is equal -
      186f76e9cdce5d3bbe1d786376471a85a3b2bc291363fd642efc7aab5f9d80d2 both
      sides, which is the same digest the document publishes.
    - >-
      The blob shas are as the document states: bd2128b5 and e4d33dfa both
      4a03afc785ab59c8d1e52afb89d145022c0a1248.
    - >-
      Main has since moved. At 5e440f2f the blob is
      5e0dcc9d2f4b040b816e44acdf071e8cbf583f44, the truth table went from 4
      cases and 3 rows to 5 cases and 5 rows, the (d2) column was added, all
      three rejected forms are now named with their failure directions, and the
      42-131 line window no longer yields the same content at all (the diff
      against the snapshot is 3 hunks).
  ruling: >-
    NAMING THE COMMIT IS SUFFICIENT FOR THE SNAPSHOT, AND IT IS STILL A FINDING -
    but for a narrower reason than "the board has moved", and that distinction
    is the ruling. A snapshot is of a revision; a section that names its
    revision, publishes the blob sha and proves the extraction by digest has
    discharged the duty a snapshot carries, and holding a committed artefact to
    track a sibling file that a different agent edits afterwards would be a rule
    no card could satisfy. I therefore do NOT find against the staleness as
    such. What I do find against is one clause the card wrote in the present
    tense about a thing it does not own: "and is unchanged at `main`'s head".
    That is a verifiable claim about main, it was true when written, and it is
    FALSE at the revision this card will merge into - and the standing rule here
    is that a claim states only what can be demonstrated, which this one no
    longer can. The second, lighter reason it is worth a line: the section's own
    declared purpose is to carry the convention "so it survives the worktree",
    and the version it preserves is the one from BEFORE this card's own fix
    round contributed (d2) and the rejected-form rows to it - so the artefact
    that exists to preserve the convention preserves the pre-contribution
    draft. It is a MINOR and not gating because a reader of this document is not
    actually misled about the instrument: §7's F-201 inset, four pages earlier,
    carries the five-case table and both traces, and the prescribed form is the
    same in both. One line fixes it either way - re-extract at 5e440f2f, or date
    the clause. I note explicitly that I did NOT take the framing offered to me
    as the answer: I measured the snapshot against both revisions before ruling,
    and I am declining the broader version of the charge.
  recorded_as: F-301

findings:
  - id: F-301
    severity: minor
    title: >-
      §6's snapshot is verbatim at the commit it names, but its present-tense
      claim that the blob is unchanged at main's head is false at 5e440f2f
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 499
    gating: false
    confidence: certain
    evidence: |
      What the document claims (lines 496-502):
        "**This is a snapshot of `main` at `bd2128b5`, lines 42-131 of
         `meta/kanban/config.yml`, and it is verbatim as of fix round 2
         (2026-10-27).** The blob it quotes landed at **`e4d33dfa`** ... and is
         unchanged at `main`'s head: `git rev-parse e4d33dfa:...` and
         `bd2128b5:...` are both `4a03afc785ab59c8d1e52afb89d145022c0a1248`."
      The snapshot half HOLDS, by my own extraction:
        $ sed -n '520,609p' meta/profiling/card-292-per-test-ceiling.md > doc_s6.txt
        $ git show bd2128b5:meta/kanban/config.yml | sed -n '42,131p' > cfg_bd.txt
        $ wc -l  ->  90 and 90
        $ diff doc_s6.txt cfg_bd.txt
        (no output)
        $ shasum -a 256 doc_s6.txt cfg_bd.txt
        186f76e9cdce5d3b...  doc_s6.txt
        186f76e9cdce5d3b...  cfg_bd.txt
      The main's-head half does NOT:
        $ git rev-parse bd2128b5:meta/kanban/config.yml   4a03afc785ab59c8d1e52...
        $ git rev-parse 5e440f2f:meta/kanban/config.yml   5e0dcc9d2f4b040b816e4...
        $ diff doc_s6.txt <(git show 5e440f2f:... | sed -n '42,131p')
        3 hunks - the table grows from 4 cases / 3 rows to 5 cases / 5 rows,
        (d2) is added, all three rejected forms are named, and the window's
        last 16 lines are displaced past line 131 entirely.
      Caused by the orchestrator editing config.yml at 5e440f2f AFTER the
      extraction - so this is not sloppiness, it is a claim with a shelf life.
    remedy: >-
      One line. Either re-extract at 5e440f2f and publish the new sha, or
      replace "and is unchanged at `main`'s head" with "unchanged at `main`'s
      head as of `bd2128b5`; `5e440f2f` has since extended the table to five
      cases, which §7's inset already carries". No figure moves either way.

  - id: F-302
    severity: minor
    title: >-
      The five-case table's (d) column reproduces only for a wrapper the
      document never shows, and the same label carries different values in §6's
      snapshot table four pages earlier
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 721
    also_at: ["meta/profiling/card-292-per-test-ceiling.md:537"]
    gating: false
    confidence: certain
    evidence: |
      §7's table (lines 719-723) heads its column "(d) a `zsh -c` whose argv
      says *pytest*" and gives, for `pgrep -fi 'python.*pytest'`, (d) = 0.
      §6's snapshot inside the SAME document (line 537) gives the same
      instrument, under the same label (d), the value 1. Both are right, for
      different wrappers - which is the point:
        (d-i) /bin/zsh -c 'sleep 10; : run the pytest suite'     <- says pytest, not python
          pgrep -f 'pytest' 1 | -fi 'python.*pytest' 0 | 'm pytest' 0
          | 'bin/python -m pytest' 0 | 'MacOS/Python.*pytest' 0
        (d-ii) /bin/zsh -c 'sleep 10; : python -m pytest tests/foo.py'
          pgrep -f 'pytest' 1 | -fi 'python.*pytest' 1 | 'm pytest' 1
          | 'bin/python -m pytest' 0 | 'MacOS/Python.*pytest' 0
      §7's whole (d) column reproduces EXACTLY for (d-i) and not for (d-ii);
      main's convention at 5e440f2f defines its (d) as `: python -m pytest
      tests/foo.py`, i.e. (d-ii), and annotates that cell `*` with the reason
      ("it depends on the wrapper's wording, which is itself the
      disqualification"). The document prints the argv for (d2) - inside the
      negative-control trace - and for no other wrapper, so the one column
      whose value turns on the wrapper's wording is the one column whose
      wrapper is not shown.
      Why it is worth a line on THIS card: an instrument has a domain, and the
      domain is part of every figure. Four cells here are figures whose domain
      is a string the document does not quote, in the table that is the round's
      instrument evidence. No figure in it is WRONG, which is why it is minor:
      the prescribed row reproduces in all five columns, no deciding cell is
      touched, and the rejection of row 2 stands on its (d2) false positive
      regardless of (d).
    remedy: >-
      One line - print (d)'s argv in the table's caption or its trace, as (d2)'s
      already is. Optionally note that §6's snapshot labels a different wrapper
      (d), which F-301's re-extraction would resolve on its own.

  - id: F-303
    severity: minor
    title: >-
      The board convention's own re-measured table has one cell that does not
      reproduce - cycle 2's remedy is a false NEGATIVE on the console-script
      launch, not a 1
    file: meta/kanban/config.yml
    line: 60
    also_at: ["meta/kanban/cards/CARD-292.md:600 (the fix-round-2 table, same cell)", "meta/kanban/config.yml:60 at 5e440f2f"]
    gating: false
    confidence: certain
    evidence: |
      main at 5e440f2f records, and the card's fix-round-2 section repeats:
        pgrep -f 'm pytest'   (c)0  (d)1  (d2)1  (a)1  (b)1
      Measured here, with the live argv printed in the same breath:
        (b) .venv/bin/pytest <two files> --collect-only
            live argv: /Library/Frameworks/Python.framework/Versions/3.14/
              Resources/Python.app/Contents/MacOS/Python
              /Users/.../.venv/bin/pytest <two files> --collect-only -o addopts= -q
            pgrep -f 'pytest'                  = 1
            pgrep -fi 'python.*pytest'         = 1
            pgrep -f 'm pytest'                = 0      <- FALSE NEGATIVE
            pgrep -f 'bin/python -m pytest'    = 0
            pgrep -f 'MacOS/Python.*pytest'    = 1
      The mechanism is plain once the argv is in view: the console script's
      command line contains `bin/pytest`, never ` -m pytest`, so a pattern
      anchored on "m pytest" cannot match it. Every other cell of that table
      reproduced for me, including all five of the prescribed row.
      This does not weaken the card - it STRENGTHENS the fix round's refusal of
      the remedy cycle 2 prescribed: that remedy is wrong in BOTH directions
      too, false-positive on a wrapper and false-negative on one of the two
      launch shapes the convention itself enumerates. I record it because the
      standing rule is that a figure's control is recomputation, and this one
      is the one figure on the card that failed it.
    remedy: >-
      The orchestrator corrects one cell in meta/kanban/config.yml (and the
      matching cell in CARD-292.md's fix-round-2 table) to `0 FN`. NOT this
      card's to commit - both paths are board state the brief forbids touching
      - so it is carried to the merge gate.

  - id: F-304
    severity: info
    title: "The class audit's \"18 mentions\" is a count with no stated method; I get 24"
    file: meta/kanban/cards/CARD-292.md
    line: 619
    gating: false
    confidence: certain
    evidence: |
      $ grep -c 'pgrep' meta/profiling/card-292-per-test-ceiling.md        -> 37 lines
      $ grep 'pgrep' ... | grep -vc 'MacOS/Python'                         -> 27 lines
      of those 27, three are not a command form (the `usage:` line the binary
      prints at 670, the `-c`-flag sentence at 662, and the `man pgrep`
      SYNOPSIS sentence at 681), leaving 24 lines that name a defective form.
      The audit's SUBSTANCE is what matters and it holds - I classified all 24
      and none prescribes a defective form (see
      declarations_tested_rather_than_read.the_class_audit_of_defective_forms).
      Recorded only so the number is not carried forward as a measurement: it
      is a count whose door is unstated, on a card about exactly that.
    remedy: "none needed; state the method if the count is kept."

  - id: F-305
    severity: info
    title: "CARD-302 exists as a card file but appears on no board list"
    file: meta/kanban/board.md
    line: 74
    gating: false
    confidence: certain
    evidence: |
      $ grep -c CARD-302 meta/kanban/board.md meta/kanban/backlog-scored.yml
        board.md 0 ; backlog-scored.yml 0
      against CARD-296 (4 in board.md), CARD-295 (9), CARD-292 (9). The
      wave table's `unscheduled` row enumerates 31 ready cards by id and
