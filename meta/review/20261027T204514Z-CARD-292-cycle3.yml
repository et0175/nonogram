verdict: >-
  CERTIFIED (8.5 of 10, threshold 8). Both of cycle 2's gating findings are
  closed and I re-derived each through a door the card did not use. F-201 is
  closed properly rather than plausibly: I reproduced the whole five-case
  instrument table myself, and the prescribed form
  `pgrep -f 'MacOS/Python.*pytest' | wc -l` reads 0 idle, 0 on three different
  pytest-mentioning shell wrappers, and 1 on both real launch shapes - and I
  took the positive control inside my own re-run of the card's declared blast
  radius, twice (t=40 s and t=140 s, prescribed 1, blind form 0, with the live
  argv printed). So AC-6 is MET, on the cell §8.2 says decides it. F-202 is
  closed and I confirmed its domain claim through a THIRD door - statically,
  from the test's own code (36 DOOR_SHAPES rows x 2 arms removed singly, plus
  36 with both removed, every one routed through `_plant`, which substitutes a
  three-line body into the module's text), and incidentally through the card's
  own page-cache probe, whose 108 reads of the real module per run are one read
  per analysis followed by a plant. The round's load-bearing declaration, that
  the whole test-tree change is prose, is TRUE and I proved it more strongly
  than the round claimed: canonicalising docstrings rather than deleting them
  gives identical dumps, the node census is identical at 18,620 nodes, all
  1,685 non-docstring constants are identical, and EXACTLY ONE docstring
  changed - the class at line 6322, which is F-202's correction. The round's
  own best finding reproduces exactly: the revision cycle 2 reviewed was RED on
  this card's own declared blast radius, the attribution is exact, and the fix
  (not naming the switches, rather than widening a standing guard's allowlist)
  is the right one - I fired a mutant that establishes the cell the fix named is
  the cell that reds. I re-ran the blast radius myself at HEAD and it is GREEN -
  2325 collected, 2310 passed / 15 skipped / 0 failed, exit 0, one summary line,
  both skips attributed by name. I also CLOSED the bound fix round 2 could only
  declare. It is not a 9 because two one-line prose defects survive on the
  branch and both are in the class this card exists to police - an instrument's
  domain left unstated (F-302) and a provenance claim that has stopped being
  true (F-301) - and because I found one cell of the board's own re-measured
  truth table that does not reproduce (F-303). None of them moves a figure, a
  conclusion or a deciding cell.

