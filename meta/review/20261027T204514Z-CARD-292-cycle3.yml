priority_one_the_closed_bound:
  what_fix_round_2_declared: >-
    "Whether any cell OTHER than the full-suite-lock one among the 29 files
    reads a `.md` path - the reach of the guard that bit is measured, the
    absence of a second is not."
  verdict: CLOSED. I enumerated it instead of leaving it declared.
  method: >-
    AST over all 29 files (every read_text / read_bytes / open / iterdir /
    rglob / glob / walk call, every string constant containing ".md", every
    constant containing "grep" or "ls-files"), plus `grep -rn` for '*.md',
    `suffix == ".md"`, `endswith(".md")` and PROSE_SHAPES, plus a read of every
    git invocation that runs against the LIVE repo rather than a tmp_path plant.
  result: |
    Exactly ONE cell among the 29 files reads the repository's .md CONTENT
    tree-wide, and it is the one that bit:
      tests/test_full_suite_lock.py::test_nothing_in_the_tree_sets_either_of_the_guards_env_switches
      - `["git", "grep", "-l", "-e", OVERRIDE, "-e", LOCK_PATH_VAR]` at
        tests/test_full_suite_lock.py:505, cwd = the repo, no pathspec at all.
      - exempts only OVERRIDE_NAMERS (three exact paths) and .md/.yml under
        ("meta/kanban/cards/", "meta/review/"). meta/profiling/ is not exempt.
    TWO further cells touch meta/profiling/ non-.py files by NAME ONLY, and the
    distinction is load-bearing:
      tests/test_suite_profile.py `_tracked_under_guard` runs
      `git ls-files -z -- tests meta/profiling` (line 3908) and returns EVERY
      tracked path, not just *.py. `_guarded_sources` then filters
      `.endswith(".py")` (line 3975), so every content read is .py; the only
      consumer of the unfiltered list writes a sandbox in which non-.py files
      are SYMLINKED, never read (`if source.suffix == ".py": write_bytes(...)
      else: symlink_to(...)`, with `assert len(mirrored_names) > 100`).
      So an ADDED or RENAMED artefact under meta/profiling/ is in scope there;
      its TEXT is not.
    tests/test_guard_integrity.py resolves the same two territories with a
    plain walk restricted to *.py (`_python_sources`, line 131).
    Every other .md the 29 files read is a NAMED, fixed, different file -
    CLAUDE.md, scripts/README.md, docs/GENERATION_ALGORITHM.md,
    meta/kanban/backlog.md, meta/kanban/board.md,
    meta/profiling/card-23{5,6}-*.md, meta/profiling/card-243-*.md - or a
    tmp_path plant. NOTHING globs '*.md' under meta/profiling/; the only glob
    there is `PROFILING_DIR.glob("suite-durations-*.txt")`.
    No test on the branch names meta/profiling/card-292-per-test-ceiling.md as
    a path at all - the one mention (tests/test_book_export_interior_cover.py:1124)
    is a comment.
  answer_to_the_general_question: >-
    What that selection is sensitive to in meta/profiling/ is: (1) the TEXT of
    any tracked file there, through one cell, for exactly two tokens - the two
    guard switch names; and (2) the SET OF PATHS there, through the sandbox
    mirror, which needs every non-.py entry to exist and be symlinkable. It is
    sensitive to nothing else - not to figures, not to prose, not to .md
    content beyond those two tokens.

