      what AC-6 asks of a host cell. Does the round's reasoning hold? YES, and
      for the reason it gives: a 1 reachable on the very command that produced
      the 0s, and unreachable on a wrapper, is the pair of controls, and neither
      alone would do. The document's declared bound on the instrument - it keys
      on the framework re-exec path, so a non-framework venv would make it blind
      in the same way its predecessor is, and it is verified on this box only -
      is correctly stated as a bound and is the honest shape. The load-average
      half of AC-6 is met as before: `sysctl -n vm.loadavg` works and is
      recorded at both ends of both rows.

