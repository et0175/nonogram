verdict:
  summary: >-
    This is a measurement card and the measurement is sound. I re-derived every
    one of the roughly twenty headline figures from the committed artefact with
    a parser I wrote from scratch, and all twenty reproduce exactly — including
    the overlap, the union, the phase split, the 96 %-of-teardown claim and the
    ms/test gap. The committed rankings are byte-identical to the script's
    stdout (I diffed all 82 rows). The script is deterministic across runs and
    across tie orderings, and deterministic by construction rather than by
    luck. The render set is the card's own grep taken literally — 29 paths, as
    the agent says, not the card's 19 — and the browser family's boundary is
    conservative rather than generous: three other browser-driven files were
    left out, which would have raised the family from 39.78 % to 40.77 %. The
    three defects the agent reported in the card's own instructions are all
    real, and the two mutants it logged as equivalent really are equivalent,
    which I established by proof and by a 200922-input differential fuzz rather
    than on its say-so. M10's tautology was really there and is really fixed.
    G-1 holds by diff with zero deleted lines in the whole card.

    The contention caveat is the one piece of reasoning that does not hold up
    (N-001): the premise that the sweep favoured the render hypothesis has the
    exposure backwards, since the browser family is the wait-bound one. The
    conclusion survives anyway, and by a wide margin — the browser family would
    have to shed 170.8 s to lose, more than the ~161 s the entire four-minute
    sweep could have added to the whole suite, and the per-test teardown
    distribution inside the family is unimodal and uniform across all twelve
    files with no sign of a contention spike. So the finding is about the
    argument, not the answer.

    The rest is test-coverage gaps around the *values* rather than the
    mechanism: the frozen render set, the share denominators and the committed
    document itself are reproduced correctly but pinned by nothing (N-002,
    N-004), and one test will red the first time a downstream card re-profiles
    as instructed (N-003). None of these is gating.
  gating_findings: []
  cycle1_findings_closed: []
  min_score: 8
  meets_min_score: true
  score_delta: null
  min_improvement: 0.5
  meets_min_improvement: null
  cycles_used: 1
  max_cycles: 3
  recommendation: >-
    Clears min_score 8 at 9.0 on cycle 1. Proceed to the merge gate; no fix
    cycle is required. I do believe the conclusion the four downstream cards
    have been re-pointed on — the browser family at 39.78 % of attributed time
    and 95.6 % of teardown is the right target, and the re-pointing text in
    CARD-218/219/220 matches the measurement I verified. Two optional
    improvements are worth taking whenever CARD-218 next touches this area,
    because they are cheap and they protect the number everything now depends
    on: (1) turn the existing `--verify-render-set` machinery into a test so
    the frozen set cannot drift (N-002), and (2) one test asserting the
    committed hotspots blocks are substrings of `report(...)` so the document
    cannot drift from the artefact (N-004). N-003 should be fixed before any
    card commits a second profile, or that card's suite reds for doing the
    right thing. N-001 is a prose fix to the caveat and costs no re-run.
