    file: "tests/test_suite_profile.py"
    line: 98
    title: "`test_exactly_one_artefact_is_committed` contradicts the dated naming convention it ships with, and will fail the suite the first time CARD-218/219/220 do what they are told."
    description: |
      `test_exactly_one_artefact_is_committed` (:98) asserts
      `len(_artefacts()) == 1` over `PROFILING_DIR.glob("suite-durations-*.txt")`.

      Three things in this same card contradict it:
      - the `artefact_path` fixture two definitions below (:57-61) takes
        `found[-1]`, i.e. it is written to pick the newest of several;
      - `test_artefact_is_named_for_its_date` (:105) and the README's
        "Naming convention: `<YYYYMMDD>`, the UTC date of the run, on both the
        durations file and the hotspots file, so a profile and its analysis
        always pair by name" exist precisely so that more than one can coexist;
      - CARD-218 step 4, CARD-219 step 4 and CARD-220 step 6 each instruct
        "Re-profile solo (CARD-217's command) and record before/after".

      The moment one of those cards commits `suite-durations-<newdate>.txt`,
      this test reds, and it reds for doing the right thing. The stated
      rationale ("multiple profiles would make 'the' profile ambiguous") is
      sound but is enforced in the wrong place: ambiguity would come from the
      hotspots document not naming its source, and the hotspots document
      already names its source by filename *and* sha256.
    suggestion: >-
      Replace the equality with an invariant that survives a second profile:
      assert that every `suite-durations-*.txt` has a `suite-hotspots-*.md` of
      the same date beside it, and that the newest pair is the one the rankings
      cite. Keep `found[-1]`.
