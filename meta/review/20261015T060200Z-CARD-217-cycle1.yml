findings:
  - id: "N-001"
    severity: "medium"
    classification: "Minor"
    gating: false
    category: "correctness-of-analysis"
    type: "flawed-reasoning"
    file: "meta/profiling/suite-hotspots-20261015.md"
    line: 118
    title: "The contention caveat's argument has the exposure backwards — the browser family, not the render set, is the wait-bound one. The conclusion survives, but not for the stated reason."
    description: |
      The caveat (hotspots :113-121, repeated in the card's ledger) argues: the
      sweep "biases I/O-bound tests upward relative to CPU-bound ones — i.e. it
      works *in favour* of the render hypothesis, and the render hypothesis
      still lost. The conclusion is therefore safe in the direction that
      matters."

      The premise is wrong, and wrong in the direction that would matter if the
      margin were thin. The render-heavy set is Pillow/ReportLab page
      composition: in-process, CPU-bound, and the artefact's own phase split
      agrees (176.82 s of its 195.42 s is `call`, 0.03 s is teardown). The
      browser family is the wait-bound one: out-of-process Chromium driven over
      CDP, where the measured cost is latency on another process's scheduling.
      Its teardown alone is 137.97 s, 0.327 s per test, for work the Python
      process spends almost entirely blocked. A host sweep that takes CPU away
      from everything inflates blocked-on-another-process time more than it
      inflates in-process compute. So if the sweep favoured anyone, it favoured
      the winner, not the loser.

      The conclusion nevertheless holds, by two arguments the document does not
      make and should:

      (a) A magnitude bound. The window was ~4 min of a 930.81 s run with
      pytest's CPU share at 25 % instead of 76 %. Work that would have taken
      240 x 25/76 ~= 79 s on a quiet host took 240 s, so the *total* excess
      across every test that ran in that window is at most ~161 s. For the
      render set to overtake the browser family, the browser family would have
      to shed 170.8 s (366.19 - 195.42) with the render set gaining nothing.
      That is more than the entire sweep could have added to the whole suite,
      so the ordering is robust even under the maximally adversarial
      assignment of every contended second to the browser family.

      (b) Direct evidence from the artefact that the browser family was not
      spiked. I computed per-test teardown for all 422 browser tests. Per-file
      means are 0.198-0.413 s across all twelve files; overall mean 0.327,
      median 0.370, stdev 0.144, max 0.520; the 0.1 s histogram is
      {0.0: 41, 0.1: 22, 0.2: 37, 0.3: 81, 0.4: 141, 0.5: 100} — unimodal,
      tightly clustered, no second mode and no outlier file. A four-minute
      contention spike runs through whichever one or two files were executing
      at the time and would have left a visible cluster of inflated teardowns
      in those files only. There is none. The 0.33 s/test browser teardown is
      structural.

      Third, corroborating: 930.81 s sits at the *fast* end of the 939-1123 s
      band set by the two cleanest prior gates on near-identical suites, so the
      sweep's net cost was small in absolute terms too.

      I am recording this as a finding rather than waving it through because
      the agent's instinct (reason about which way your own noise pushes your
      answer) is exactly right and the card's ledger praises it as such — but
      the argument as written would pass a thinner margin that it should not,
      and a future reader will reuse the reasoning, not the margin.
    suggestion: >-
      Replace the "I/O-bound vs CPU-bound" sentence in the caveat with the
      magnitude bound (a) and the teardown-dispersion evidence (b). Both are
      computable from the committed artefact, so neither costs a re-run. The
      per-file teardown means are a four-line addition to rank_durations.py if
      you want them generated rather than asserted.
    confidence: "high"
    source: "dynamic"
    violates: null
    root_cause: null
    status: "open"
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: "N-002"
    severity: "medium"
    classification: "Minor"
    gating: false
    category: "testing"
    type: "gap"
    file: "meta/profiling/rank_durations.py"
    line: 60
    title: "The frozen render-heavy set — the constant the card's second-ranked number depends on — is pinned by no test; dropping a path from it survives all 74 tests."
    description: |
      RENDER_HEAVY_SNAPSHOT (:60-90) is the definition of the render
      hypothesis. 21.23 % is whatever that tuple says it is. I ran the mutant
      "drop `tests/test_book_toc.py` from the frozen set" against
      tests/test_suite_profile.py: **SURVIVED**, 74 passed. So does any other
      single-path deletion or addition, by the same logic.

      The only test that touches the set,
      `test_render_share_counts_only_the_frozen_set`
      (tests/test_suite_profile.py:277), checks the *filtering behaviour* with a
      two-line synthetic artefact naming `tests/test_book_pdf.py`. It would pass
      with 28 of the 29 paths removed.

      The script already ships the mechanism to close this —
      `regrep_render_set()` (:400) and the `--verify-render-set` flag — and it
      works: I ran it and it printed "render-set drift: none". No test calls
      it. I also re-ran the card's own grep at HEAD and it returns exactly the
      29 committed paths, so the set is correct *today*; it is simply not held
      correct.

      This matters more than a usual test gap because CARD-218/219/220 are all
      told to re-profile and compare, and the render share is the number two of
      them are scoped against.
    suggestion: >-
      One test: call `ranker.regrep_render_set(REPO_ROOT / "tests")` and assert
      it equals `set(ranker.RENDER_HEAVY_SNAPSHOT)`, skipping if tests/ is
      absent. That turns the existing --verify-render-set machinery into a
      guard instead of a courtesy, costs ~0.1 s, and kills the mutant above.
