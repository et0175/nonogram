confirmations:
  - id: "X-001"
    finding: "Re-derive every headline number from the committed artefact, independently, and check for double counting and for a shifting denominator."
    verdict: "CONFIRMED in full. Every figure reproduces exactly. No double counting. One denominator throughout."
    evidence: |
      I wrote my own parser against meta/profiling/suite-durations-20261015.txt
      and imported nothing from rank_durations.py. It read 21238 phase records
      over 7082 test ids, attributed 920.63 s. Side by side, claim vs my value:

        browser family (12 x tests/test_puzzle_solver_*.py)
          366.19 s / 39.78 % / 422 tests / 868 ms   ->  366.19 / 39.78 % / 422 / 868
        render-heavy frozen set (29 paths)
          195.42 s / 21.23 % / 1079 tests / 181 ms  ->  195.42 / 21.23 % / 1079 / 181
        tests/property/*
          140.19 s / 15.23 % / 184 tests / 762 ms   ->  140.19 / 15.23 % / 184 / 762
        render INTERSECT property      70.75 s / 7.68 %   ->  70.75 / 7.68 %  (11 tests)
        render UNION property         264.86 s / 28.77 %  ->  264.86 / 28.77 %
        property that is not render    69.44 s / 7.5 %    ->  69.44 / 7.54 %
        admin-local trio              117.16 s / 12.73 % / 83 / 1412 ms -> exact
        everything-but-browser        554.44 s / 6660 tests / 83 ms     -> 554.44 / 6660 / 83.25
        setup / call / teardown       89.07 / 687.19 / 144.37 s, 9.67 / 74.64 / 15.68 % -> exact
        browser share of teardown     137.97 of 144.37 = "96 %"  ->  137.97 / 144.37 = 95.6 %
        render call/teardown          176.82 / 0.03 s    ->  exact
        property call/teardown        136.46 / 0.00 s    ->  exact
        tests under 0.1 s             6057, "7.4 %"      ->  6057, 68.29 s, 7.42 %
        slowest single test           30.94 s, 3.36 %    ->  exact
        top 10 / top 50               16.4 % / 32.1 %    ->  16.40 % / 32.08 %
        test_book_pdf_geometry.py     48.66 s in 4 tests ->  exact
        attributed / wall             920.63 of 930.81, 98.9 %, 10.18 s unattributed -> exact

      Double counting: the only overlap between any two rows is render INTERSECT
      property, and it is declared on its own line. 195.42 + 140.19 - 70.75 =
      264.86 exactly, so the union row is a union and not a sum. The four
      families in the conclusion table are pairwise disjoint: no
      tests/test_puzzle_solver_*.py path is in RENDER_HEAVY_SNAPSHOT or under
      tests/property/, and the admin trio is in none of the three. Their
      inclusion-exclusion total is 748.21 s = 81.3 % of attributed, under 100 %
      as it must be.

      Denominator: every percentage in the conclusion table, the phase table
      and both rankings is over the same 920.63 s of attributed time, stated as
      such in the script header, the document preamble and ranking 3 (which
      additionally reports the wall-clock share, 20.99 %). I checked no figure
      switches silently between 920.63 and 930.81.

      Arithmetic in the growth argument: 7082 - 5858 = +1224 tests; 931 - 398 =
      +533 s; 366.19/533 = 68.7 % -> "69 %"; 422/1224 = 34.5 % -> "34 %";
      868/83.25 = 10.43 -> "10.4x"; 931/7082 = 131 ms/test; 398/5858 = 68
      ms/test. All check out. The wave-30 row of suite-timing.log (line 4)
      confirms 5858 / 398 s.

      Internal consistency of the artefact with its own header: the header
      claims 7074 tests with a call phase and 8 skipped at setup carrying only
      setup+teardown. My phase-shape census: {(call,setup,teardown): 7074,
      (setup,teardown): 8}. 7074 + 8 = 7082 = 7073 passed + 9 skipped. The
      21238 records = 7074*3 + 8*2 exactly. The artefact is not truncated and
      its header is not a transcription error.

  - id: "X-002"
    finding: "AC-3: is the committed conclusion the one the data supports? Is the render set honestly re-defined at 29 rather than chosen to lose, and is the browser family's definition quietly generous?"
    verdict: "CONFIRMED on both counts, and the browser family's definition is in fact conservative — it understates the family."
    evidence: |
      Render set, honesty of the 29: I ran the card's own grep at HEAD —
      `grep -rlE "interior\(|solved_puzzle_page|interior_stream|render_pages|puzzle_pages|export_book|create_guide_page|proof_pages" tests --include="*.py" | sort`
      — and it returns exactly 29 paths, byte-identical to
      RENDER_HEAVY_SNAPSHOT (:60-90). Not 19, not a curated subset. The
      re-definition is honest: it is the card's own grep taken literally, and
      it is the *larger* set, so 21.23 % is the generous reading of the render
      hypothesis, as the document claims. Two of the 29 are helpers carrying no
      tests (tests/helpers/book_corpus.py, tests/helpers/pdf_pages.py), which
      is why ranking 3 says "files in the frozen set: 29, files that
      contributed timings: 27" — that distinction is printed, not hidden. The
      script's own `--verify-render-set` reports "render-set drift: none" (I
      ran it).

      Browser family, generosity: the family is the 12 `tests/test_puzzle_solver_*.py`
      files. I checked each actually drives Chromium — every one references the
      shared `browser_page` fixture (11 to 347 references each) and all twelve
      carry chromium/playwright markers. Then I checked the other direction,
      which is the one that would expose generosity: are there files in the
      family that are *not* browser-driven? No. And are there browser-driven
      files *outside* the family? Yes — three
      (tests/test_book_finalise_guide_preview_layout.py,
      tests/test_book_setup_print_mobile.py, tests/test_books_list_mobile.py)
      also use `browser_page`, and they hold a further 9.11 s over 12 tests.
      Including them would move the family from 366.19 s / 39.78 % to
      375.30 s / 40.77 %. The agent drew the line at the filename prefix and
      thereby left 9 s on the table against its own conclusion. That is the
      opposite of a generous boundary.

      So the verdict stands as written: neither of the card's two hypotheses is
      where the time is; between them render (21.23 %) beats corpus (15.23 %);
      together they are 28.77 %; the browser family alone is 39.78 % and holds
      95.6 % of teardown. I believe this conclusion.

  - id: "X-003"
    finding: "The two mutants the agent logged as equivalent. A wrongly-claimed equivalent mutant is a surviving mutant."
    verdict: "The equivalence claim is CORRECT, for both mutants and for the pair applied together. Verified by proof and by differential fuzz, not accepted on assertion."
    evidence: |
      I applied all three and ran the full 74-test file: E1 (drop `^` from
      TIMING_LOG_LINE) SURVIVED, E2 (drop the blank/comment guard in
      `parse_timing_line`) SURVIVED, E3 (both) SURVIVED — reproducing exactly
      what the agent reported.

      Then I checked whether "survived" means "equivalent" rather than
      "untested". It means equivalent:
      - `TIMING_LOG_LINE` is used in exactly two places (rank_durations.py:330
        and :351) and both use `.match()`, which anchors at position 0
        regardless of `^`. `re.MULTILINE` is not set anywhere in the module. So
        the `^` is provably redundant for every call site that exists.
      - Every input the guard short-circuits is an input the anchored pattern
        rejects anyway: the pattern requires `\d{4}-` at position 0, and a
        blank line, a `#`-prefixed line, a `##`-prefixed line and a
        whitespace-indented line all fail that at the first character. So the
        guard can only ever turn a `None` into a `None`.

      Then I fuzzed it rather than trusting the proof. I built four
      implementations (original, E1, E2, E3) and ran them over 200922 inputs:
      the structured cross-product of 11 prefixes x 5 suffixes x 2 good line
      shapes, every single-character substitution and insertion at every
      position of a known-good line, and 200000 random strings drawn from the
      alphabet the format uses. **0 differences.** All four agree on every
      input, including the full groupdict, not just the None/not-None verdict.

      The agent's judgement call — replace an equivalent mutant rather than log
      it as a false survivor — was the right one and was reported accurately.
      One forward-looking note: the `^` is redundant only because both call
      sites use `.match()`. `TIMING_LOG_LINE` is a module-level constant, so a
      future caller reaching for `.search()` would silently change behaviour.
      Keeping the `^` (as the code does) is the right defensive choice; this is
      a reason not to "simplify" it later, not a finding.

  - id: "X-004"
    finding: "M10 was reported as initially tautological — comparing against the constant it was meant to pin — and surviving until fixed. Does the fixed version actually pin the literal?"
    verdict: "CONFIRMED fixed, and the fix is the right one. Both halves of the constant are now pinned as literals and both mutants die."
    evidence: |
      `test_report_lists_fifty_tests_and_twenty_files`
      (tests/test_suite_profile.py:209) now opens with
      `assert (ranker.TOP_TESTS, ranker.TOP_FILES) == (50, 20)` and carries a
      comment at :212-214 explaining exactly why: "Comparing against
      ranker.TOP_TESTS would be tautological: it would pass just as happily if
      the constants were changed." The row-counting half of the test then
      asserts `len(tests_rows) == 50` and `len(files_rows) == 20` against
      regex-extracted rows of the real report, so it pins both the constant and
      the rendered output.

      I ran both mutants: `TOP_TESTS = 50 -> 10` KILLED, `TOP_FILES = 20 -> 5`
      KILLED. The agent's self-report is accurate — this one genuinely was
      tautological and genuinely is fixed.

  - id: "X-005"
    finding: "The three defects the agent found in the card's own instructions. These are the reasons to trust or distrust everything else it reports."
    verdict: "All three CONFIRMED true. The agent followed the card's instructions literally, hit three real problems, fixed them, and documented each in both the artefact header and tests/README.md."
    evidence: |
      1. `-q` becomes `-qq`. pyproject.toml:85 is `addopts = "-q"`. The card's
         step 1 command adds another `-q`, raising the quiet level to `-qq`, at
         which pytest emits no "N passed ... in Xs" line. True. The committed
         artefact's body indeed ends at the last duration row with no summary
         line (I checked the tail), and the script carries a documented header
         fallback (:240-251) for exactly this. The fallback is load-bearing and
         tested: my mutant "drop the header fallback" was KILLED by
         `test_header_is_used_when_the_body_has_no_summary` (:181), and the
         priority is right too — `test_bodys_own_summary_wins_over_the_header`
         (:175) pins that the real summary beats the transcription when both
         exist.
      2. `--durations=0` is not enough. True: pytest's `--durations-min`
         defaults to 0.005 s and suppresses everything below it regardless of
         `--durations=0`. The consequence the agent claims is also real and I
         measured it: 6057 of 7082 tests finish under 0.1 s and hold 68.29 s,
         7.42 % of attributed time — most of which sits under the 5 ms floor
         and would have vanished, shifting every per-file share. Both flags are
         stock pytest, so G-2 holds.
      3. "19 render-heavy files" is 29. True, re-verified by running the card's
         own grep (see X-002). 27 modules + 2 helpers.

      All three are defects in the card, not in the work, and each was handled
      by doing the correct thing and writing down why. This is the single
      strongest signal in the card: the agent did not quietly paper over
      instructions that did not work.

  - id: "X-006"
    finding: "AC-2's determinism claim, including determinism across orderings of equal durations and on a different artefact."
    verdict: "CONFIRMED. Byte-identical across runs, tie-break present and load-bearing, and deterministic by construction rather than by luck."
    evidence: |
      Two consecutive invocations of
      `rank_durations.py meta/profiling/suite-durations-20261015.txt` produced
      files with the same sha256
      (cab5c031bec11f25a5262a4d4f7623e6b0d09fc02e2a830d3027d9fa38710a5d), `cmp`
      clean, both exit 0 with empty stderr.

      Across orderings of equal durations: `rank_tests` sorts on
      `(-total, nodeid)` (:358) and `rank_files` on `(-seconds, path)` (:370),
      so ties resolve on a total order of strings, not on dict insertion order.
      I removed the test-ranking tie-break (`key=lambda t: -t.total`) and the
      mutant was KILLED by `test_equal_durations_break_ties_on_id_not_on_dict_order`
      (:252), which builds three equal-duration ids in a deliberately
      non-alphabetical insertion order and asserts the alphabetical result.

      On a different artefact: the determinism is structural, not
      artefact-specific. Nothing in `report()` reads the clock, the
      environment, the cwd or the filesystem — the only inputs are the parsed
      profile, `source.name` and the sha256 of the bytes. The one filesystem
      read in the module, `regrep_render_set`, is behind `--verify-render-set`,
      sorts its `rglob`, and writes only to stderr; I confirmed stdout is
      unaffected by running with and without the flag. Float formatting is
      fixed-width `:.2f`/`:.3f`. Dict iteration is insertion-ordered and the
      insertion order is the artefact's line order. So the contract in the
      module docstring ("stdout is a pure function of the artefact's bytes")
      is actually true, not just asserted.

  - id: "X-007"
    finding: "Are the 74 artefact-shape tests vacuous? Would AC-1/AC-2/AC-4/AC-5's tests actually fail on a bad artefact?"
    verdict: "NOT vacuous. I mutated the committed artefact itself in four ways and every one was caught. AC-4 tests detection logic, not a self-written header string."
    evidence: |
      The sharpest version of this question is: corrupt the artefact rather
      than the code, since the artefact is the thing the agent wrote by hand.
      Four artefact mutants, all KILLED:
        A1 header `solo run: yes` -> `no`                     KILLED
        A2 delete the `host:` header line entirely            KILLED
        A3 `result:` claims "7070 passed, 9 skipped, 3 failed" KILLED
        A4 `wall clock:` inflated 10x so attribution falls below 90 % KILLED
      A1/A2 die on `is_admissible_profile` and the parametrised
      `test_dropping_any_required_field_makes_it_inadmissible` (:357); A3 dies
      on `test_header_records_a_passing_run` (:122); A4 dies on
      `test_attributed_time_accounts_for_nearly_all_of_the_wall_clock` (:163).
      A truncated artefact would die on the records/tests ratio assertion at
      :135 (`2.9 < records/tests <= 3.0`) and on the phase-shape census at :143.

      On the review brief's specific AC-4 worry — that it might assert a string
      in a header the agent wrote itself: `test_the_committed_artefact_is_admissible`
      (:372) is that test, and it is one of thirteen in the class. The other
      twelve exercise real logic on synthetic input: `other_pytest_processes`
      against four invocation forms that must be detected and three bystanders
      that must not (including `tail -f pytest-output.log`, the false positive
      the agent found and fixed with `(?:\s|$)` instead of `\b`), own-pid
      exclusion, grep-self exclusion, and
      `test_a_comment_below_the_table_cannot_supply_a_header_field` (:375),
      which is the one that actually matters — it proves a note at the foot of
      a contended artefact cannot declare the run solo. My mutants against both
      functions (T4 `is_admissible_profile -> True`, T5
      `other_pytest_processes -> []`) were KILLED, as was T3 (make
      `parse_header` not stop at the table).

      Separately I re-ran all thirteen of the agent's own logged mutants M1-M13
      (directly or via an equivalent edit at the same site). All thirteen
      KILLED. The agent's mutation report is accurate and not inflated — see
      mutation_check below for the full table including three survivors the
      agent did not try.

  - id: "X-008"
    finding: "G-1: no existing test edited, deleted, skipped or reordered — verified by diff, not by assertion."
    verdict: "CONFIRMED by diff."
    evidence: |
      `git diff --name-status 56c716e..HEAD` is four `A` and one `M`. The `M`
      is tests/README.md. `git diff --numstat` shows zero removed lines in all
      five files. `git diff 56c716e..HEAD -- tests/ | grep -c '^-[^-]'` is 0 —
      not one deleted line anywhere under tests/. No existing test file is in
      the diff at all, so nothing could have been skipped or reordered. The
      only addition to the test tree is tests/test_suite_profile.py, 74 new
      tests, which I ran: 74 passed in under a second, no skips (the two
      skipif tests ran because the gitignored log is present in this worktree
      — see N-005).

      The card's claim that the next merge gate should read ~7147 (7073 + 74)
      follows arithmetically and matches.

