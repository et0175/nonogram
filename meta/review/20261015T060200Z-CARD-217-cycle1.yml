  - id: "N-006"
    severity: "low"
    classification: "Minor"
    gating: false
    category: "design"
    type: "scope-mismatch"
    file: "meta/profiling/rank_durations.py"
    line: 310
    title: "AC-4's admissibility check is narrower than its own title: it cannot see the kind of contention that actually happened, and nothing calls it at profile time."
    description: |
      `is_admissible_profile` (:310) and `other_pytest_processes` (:287) are
      good, well-tested functions — my mutants against both were killed (see
      mutation_check T4, T5), and they test real detection logic over synthetic
      `ps` output rather than, as the review brief worried, asserting a string
      in a header the agent wrote. `test_bystanders_are_not_detected` even
      pins the `tail -f pytest-output.log` false positive the agent found and
      fixed, which is the sharpest test in the class.

      Two limits are worth recording, neither a defect against AC-4 as the card
      words it ("Given another pytest process is running"):
      - Nothing calls either function during a profiling run. The solo check
        was performed by hand with `ps`, and the README documents it as a
        manual step. `is_admissible_profile` is consumed only by its own tests
        and by `test_the_committed_artefact_is_admissible` (:372).
      - `is_admissible_profile` returns True for this artefact, and would have
        returned True for a run with a 1-minute load average of 140 — which is
        exactly what happened. The honest contention in this run was *not* a
        rival pytest, and the admissibility predicate is blind to it.
      So "refuses to record a contended run" is true for the contention AC-4
      names and not for the contention that occurred. The caveat is in the
      header as prose; nothing mechanical catches it.
    suggestion: >-
      Optional, and probably for CARD-218 rather than here: have the profiling
      wrapper call `other_pytest_processes(subprocess ps output)` and abort,
      and record `loadavg before/after` as two more header fields so a future
      `is_admissible_profile` can grow a load threshold. Not worth a fix cycle
      on this card.
    confidence: "high"
    source: "dynamic"
