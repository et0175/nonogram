  - id: F-010
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/web/handler.py
    line: 281
    title: "'Neither header can be set or suppressed by page script' is stronger than the spec for Origin"
    description: |
      `_cross_origin_refusal`'s docstring (handler.py:281-284): "Neither header can be
      set or suppressed by page script — both are forbidden header names to
      ``fetch``/XHR — so a request carrying neither is not the attacker's shape and is
      served (AC-058)."

      "Set" is correct for both. "Suppressed" is not correct for `Origin`: a
      cross-origin GET (a `no-cors` fetch, an `<img>`, a top-level navigation) simply
      does not carry one — suppression by construction, not by script.

      The CONCLUSION is sound and worth stating explicitly since this is a security
      guard: the dangerous route is `POST /generate`, and every cross-origin POST
      carries `Origin` — the Fetch standard requires it for any method other than
      GET/HEAD, `no-cors` fetches and plain `<form method=post>` included. A
      cross-origin GET with neither header reaches only `GET /`, a constant string.
      And on any browser implementing fetch metadata (Chrome 76+, Firefox 90+,
      Safari 16.4+) `Sec-Fetch-Site: cross-site` catches the GET case too.
    suggestion: |
      "Neither header can be *set* by page script — both are forbidden header names
      to ``fetch``/XHR. `Origin` is additionally *mandatory* on every cross-origin
      request whose method is not GET/HEAD, which is what makes 'absent means served'
      safe for the one route that writes files: a cross-origin `POST /generate`
      always carries one. A cross-origin GET may legitimately carry neither, and
      reaches only the constant form page."
    confidence: high
    source: static
