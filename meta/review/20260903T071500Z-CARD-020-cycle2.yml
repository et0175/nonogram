    title: "\"four files\" is wrong at four new sites — the attack body writes two"
    description: |
      Four sites written by the cycle-1 fix commit describe the blast radius of the
      cross-origin hole as four files. Measured: it is two.

        * tests/test_web_server.py:1434-1435 — `_ATTACK_FIELDS`: "a real submission
