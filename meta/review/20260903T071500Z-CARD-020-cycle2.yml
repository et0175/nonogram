findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_web_submission.py
    line: 810
    title: "The CLI/web error-taxonomy drift guard is tautological — it cannot fail in the direction its docstring claims"
    description: |
      `test_the_walked_corpus_is_the_whole_hierarchy` asserts, at line 810:

          assert set(cli._EXIT_CODES) <= set(_ERROR_CLASSES)

      and its banner (tests/test_web_submission.py:787-792) says this "pins it
      against `cli._EXIT_CODES`: every class the CLI has an exit code for is a class
      this page must be able to show, which is the concrete form of 'keep the two
      error taxonomies telling the same story' (ADR-0019). Neither adapter grows a
      class the other has never heard of."

      The assertion cannot fail. `_ERROR_CLASSES` is built by `_error_hierarchy()`
      (tests/test_web_submission.py:705-726), a transitive walk of
      `errors.NonogramError.__subclasses__()`, so it is BY CONSTRUCTION every loaded
      NonogramError subclass. `cli._EXIT_CODES` is declared
      `dict[type[NonogramError], ExitCode]` (cli.py:93) and every key is such a
      subclass, imported by `cli.py` and therefore loaded. A subset relation between
      a set and its own construction-guaranteed superset is not a check.

      PROVEN BY MUTATION, not by argument. I deleted the exact drift the sentence
      claims to catch — `GenerationAbandoned: ExitCode.GENERATION_FAILED` removed
      from `cli._EXIT_CODES` (cli.py:113), i.e. the CLI silently losing a mapping the
      web page still renders — and re-ran the test:

          pytest tests/test_web_submission.py::test_the_walked_corpus_is_the_whole_hierarchy
          -> 1 passed

      (cli.py restored immediately; md5 b81ef08e04b13a978bae652ea1564a8f before and
      after, `git diff --stat` empty.)

      This is not a cosmetic nit. The card was told in as many words to "keep the two
      taxonomies telling the same story" (CARD-020 "What to implement" item 5, citing
      the drift risk ADR-0019 names as the accepted cost of two adapters), the
      Worktree notes claim a mechanical guard for it
      ("`test_the_walked_corpus_is_the_whole_hierarchy` pins
      `set(cli._EXIT_CODES) <= set(hierarchy)` so neither adapter can grow a class
      the other has never heard of"), and there is no such guard. An unmapped class
      falls through `exit_code_for`'s MRO walk to `INTERNAL_ERROR` (cli.py:127-130)
      and nothing anywhere reports it.

      EC-003 itself is NOT at risk: the property's real arms (30 monkeypatched cases
      over the walked hierarchy, 7 real submissions) are strong and are killed by my
      X5 mutant at 40 failures. What is missing is only the drift guard this one
      assertion claims to be.
    suggestion: |
      Either make the assertion real or withdraw the claim. Real version — pin the
      direction that can actually drift, the CLI's table being INCOMPLETE relative to
      the hierarchy the page renders:

          unmapped = set(_ERROR_CLASSES) - set(cli._EXIT_CODES) - {errors.NonogramError}
          assert not unmapped, sorted(c.__name__ for c in unmapped)

      That fails the moment `errors.py` grows a class `cli.py` has no row for — which
      is the drift ADR-0019 names — and my mutation above would have killed it. If
      the project would rather let `INTERNAL_ERROR` be the deliberate catch-all, then
      delete line 810 and strike the "neither adapter grows a class the other has
      never heard of" sentence from the banner AND from CARD-020's Worktree notes,
      because as written both assert a guarantee that does not exist.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: null
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/web/pages.py
    line: 16
    title: "The rewritten escaping rule is still false — 12 of 23 interpolations are unescaped, one of them wire-derived"
    description: |
      Cycle-1's F-005 replaced two contradicting statements with two agreeing ones.
      Both are still wrong:

        * pages.py:16-18 — "Exactly one interpolation is *not* escaped —
          :func:`_shell`'s ``title``".
        * pages.py:202-203 (`_shell`) — "It is the only unescaped interpolation in
          this module".

      Counted from the AST rather than by eye: **23 f-string interpolations, 11
      escaped, 12 NOT escaped** —
        pages.py:139 `_STYLE`, :148 `_options(MODES)`,
        :163 `_options(list(difficulty.Tier), ...)`, :174 `_checkboxes(...)`,
        :210 `title`, :211 `_STYLE`, :214 `body`, :270 `SUCCESS`, :271 `seed`,
        :272 `written`, :305 `FAILURE`, :307 `listed`.

      `_shell`'s own f-string alone holds three of them (`title`, `_STYLE`, `body`),
      so "the only unescaped interpolation in this module" is refuted two lines below
      where it is written.

      One of the twelve is genuinely data off the wire: `result_page`'s `{seed:d}`
      (pages.py:271). The form's `seed` box -> `submission.read`'s `int()`
      (submission.py:159) -> `GenerationRequest.seed` -> `Puzzle.seed` -> the page.
      It is safe, but NOT by the stated rule ("Everything that came off the wire goes
      through :func:`html.escape` at the point it is interpolated") — it is safe
      because the `:d` format spec admits only an int. The prose names neither the
      exception nor the mechanism.

      No caller-supplied *text* reaches the markup unescaped, so this is not a
      security defect — that half of F-005 is genuinely fixed. It is a rule a future
      author cannot apply: open `result_page`, see `{seed:d}` bare, compare to
      "exactly one interpolation is not escaped", and conclude the docstring is
      unreliable.
    suggestion: |
      State the rule over what it is about — caller-supplied *strings* — and name
      both guards:

        module docstring: "Every string that came off the wire is escaped at the
        point it is interpolated. Two interpolations of non-literal data are not, and
        each has its own guard: `_shell`'s `title` (bound by its own docstring to be
        a literal) and `result_page`'s `{seed:d}` (a format spec that admits only an
        int). Every other interpolation is a module literal or a fragment already
        escaped by the function that built it."

        `_shell`: "`title` is the only *caller-supplied string* interpolated without
        escaping; `body` is unescaped too and is contractually pre-escaped by the
        caller."
    confidence: high
    source: static
