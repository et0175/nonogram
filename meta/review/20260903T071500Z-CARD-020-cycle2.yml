  - "AC-058 ✓ satisfied — TestWebServer_AllowsRequestsWithNoOriginMetadata, two arms (no metadata; no headers at all). This is the criterion that decides whether the refusal is shippable, and my own 20 over-refusal probes all returned 200."
  - "EC-004 ✓ satisfied — the property named in CON-010's check: 294 refused / 58 served cases, both minimums asserted inside the consuming tests, ids asserted distinct, and each of EC-004's named shapes (#, ?, non-numeric port, empty port, Origin: null) asserted present in the corpus. The refused sweep asserts 400, no form, no data-outcome, AND an empty tmp_path afterwards — so 'never routed to a handler' is checked by its consequence on disk, not only by a status code. The served sweep is the bound: a blanket 400 satisfies the first sweep completely and fails this one on row one."
  - "NFR-004 ✓ satisfied for the two routed methods; see F-004 for the 501 path."
  - "CON-010 ✓ satisfied; its declared check ref, dead at cycle 1, now resolves."

scope_gate:
  verdict: pass
  note: >-
    The diff delivers six requirements beyond the card's slice (NFR-004, CON-010,
    AC-054..AC-058, EC-004). The owner approved this explicitly, and as a reviewer I
    concur on three independent grounds: (1) it stays inside ONE component — every
    line is in src/nonogram/web/, which is COMP-008, and trace.yml already routes
    NFR-004 and CON-010 to COMP-008 alone ("nothing inward of it can observe or
    affect the request headers"); (2) it is genuinely transport-level — the added code
    reads header names and an authority and answers with a status code, knows nothing
    about a puzzle, and ADR-0019/R1's declared check is green; (3) the card is what
    turned the pre-existing violation from "a cross-origin page can read a static
    string" into "a cross-origin page can run the pipeline and write files at a path
    it chooses", so merging without it would ship the escalation. Two tests were
    removed and both were replaced by their positive counterpart, not deleted:
    test_post_is_not_implemented_in_this_card -> test_post_is_routed_and_an_unhandled_method_still_is_not,
    and test_the_package_really_does_no_request_mapping_yet ->
    test_the_package_serves_exactly_the_two_routes_it_describes. No test weakened.

family_regression:
  verdict: ARMED — not yet firing, but this is the first of the two cycles it needs
  detector: "review.family_regression: on — escalates on TWO CONSECUTIVE cycles whose new GATING findings are attributed to the previous fix AND fall in one file/function family"
  family: >-
    "Prose in the touched files asserts more than the shipped code does" — cycle-1's
    own RC-3, verbatim. It is RC-2 in this report.
  attribution:
    fix_introduced:
      - "F-003 — the six 'four files' sites were WRITTEN BY the fix commit a017d74 (`git diff 177ba57..a017d74 | grep -c '^+.*four files'` = 6). Brand-new, and wrong: the attack body posts png+json and writes two."
      - "F-002 — this is the SAME SENTENCE cycle-1's F-005 remedy rewrote ('Exactly one interpolation is not escaped' is a +line in a017d74). The remedy replaced a false statement with a different false statement: 12 of 23 interpolations are unescaped, and one of them, `{seed:d}`, is wire-derived."
      - "F-007 — the 400/505 'no status line and no headers whatsoever' sentence was REWORDED by cycle-1's F-006 remedy (it appears as a -line in a017d74) and the over-generalization survived the rewrite: it is true of three of parse_request's four 400/505 exits, not four."
      - "F-006 — the `_ALLOWED_FETCH_SITES` padded-spelling comment came in with the cross-origin work of a017d74 and is refuted by the stdlib on this interpreter."
    not_fix_introduced:
      - "F-001 (the only HIGH) — `_EXIT_CODES` appears twice in the IMPLEMENTATION commit 177ba57, so the tautological assertion and its banner predate the fix pass. Cycle 1 MISSED it; cycle 1 did not create it. This is a coverage gap in the previous review, not a regenerated defect."
      - "F-004 — the module banner is likewise from 177ba57."
      - "F-005 — a model artifact, untouched by either commit."
  determination: >-
    The family REPRODUCES and four of its five symptoms are attributable to cycle-1's
    own fixes, which is the detector's exact shape. It does NOT fire yet, and I want
    to be precise about why rather than lenient: the rule requires TWO CONSECUTIVE
    cycles of fix-attributed gating findings in one family, and cycle 1 was the first
    review of the card — its findings were attributed to the implementation, not to a
    previous fix. Cycle 2 is therefore the FIRST such cycle. The detector is ARMED.
    IF cycle 3's new gating findings are again prose-overclaim in
    web/pages.py / web/handler.py / tests/test_web_*.py, the detector fires and the
    card should ESCALATE to a human rather than take a fourth pass — which it cannot
    anyway, since max_cycles is 3 and cycle 3 is terminal.
  mechanism_named: >-
    An ABSOLUTE quantifier ("exactly one", "the only", "all six", "each class", "four
    files", "every ... is stripped twice") asserted over a whole module or a whole
    stdlib code path, written from the author's mental model rather than counted from
    the artifact. Every instance in RC-2 is falsified by a mechanical count that takes
    seconds: an AST walk of the interpolations, a `grep -c` of the call sites, one
    `export_puzzle` run, one `parsestr` call, reading four lines of `parse_request`.
    The defect is not carelessness about facts — the surrounding reasoning is
    consistently excellent and, where I checked it, correct — it is that the
    quantifier is never checked against the thing it quantifies.
  counter_evidence_the_fix_pass_earned: >-
    The card's other large body of new prose HELD UP under independent checking, and
    the score should reflect that this is a narrow recurrence rather than pervasive
    unreliability. I verified, and they are all correct: parse_request really does
    collapse a leading '//' (CPython gh-87389, in the installed 3.14.3 source); only
    the mode=='image' branch of orchestrator.generate advances the nudge counter
    (orchestrator.py:1223); cli.py:454 prints the seed only when request.seed is None;
    library sourcing reads nothing from disk, so `generate` cannot raise OSError today;
    the form has exactly nine distinct field names; 65536 over a realistic body is ~2
    orders of magnitude; every Host header really is read; the eight-status
    enumeration's membership and its 4/5 split are exactly right; the corpus floors
    294/58 against 200/40; _MINIMUM_ERROR_CLASSES = 12; "seven bodies, seven domain
    errors"; the for_mode/for_format quotations are verbatim; the OSError-arm-is-wider
    claim; result_page's three CLI-parity differences. And ZERO dead test-name arrows.

review_method_note: >-
  The exhaustive prose audit of the seven changed files was delegated to a subagent
  and its findings were then RE-DERIVED BY ME before being filed — I did not accept
  any of them on report. F-001 by mutation (a row deleted from cli._EXIT_CODES, test
  still green, cli.py restored and md5-verified); F-002 by an AST walk of every
  interpolation in pages.py; F-003 by running export_puzzle on the attack body and
  counting the files; F-004 by an AST walk for submission.read / cli.build_parser
  call sites inside the three AC classes; F-006 by calling the stdlib's own header
  parser; F-007 by reading parse_request's four 400/505 exits against line 374.
  Attribution to the implementation vs the fix commit was established with
  `git show 177ba57:` and `git diff 177ba57..a017d74` per claim.

engineering_standards:
  - "Contract-first APIs — N/A. No OpenAPI spec exists and none is mandated: this is a stdlib http.server adapter serving one HTML form to one local user (ADR-0020, CON-008), not a public API. No client generation applies."
  - "Property tests for ECs — ✓. EC-003 and EC-004 each have a genuine multi-case property test present in the diff, not merely named."
  - "E2E coverage — the project ships a web UI, and the AC tests DO drive a real socket end to end (a bound LoopbackHTTPServer, real HTTP over the wire, real files on disk). That is stronger than a mocked component test. What is NOT covered is the browser layer: no browser test, and — see coverage.visual — no human has looked at a rendered page."
  - "Test-suite cost — ✓. tests/test_web_server.py + tests/test_web_submission.py run in 9.2s for 279 tests. The one time.sleep in the touched files (test_web_server.py:1027) is inside an Eventually-style polling helper with a deadline, which is the correct pattern, and the diff adds zero sleeps. The AC-051 budget assertion uses GENERATION_BUDGET_SECONDS+10 (40s), generous enough not to flake."
  - "Observability — N/A at this scale. BaseHTTPRequestHandler's access log is the only logging and no credential, body or secret reaches it."
  - "Minimalism (§9) — ✓. Three new module-level helpers (_port_is_well_formed, _origin_is_local, _host_is_local's widening) each have >1 call site; submission.py is a new module with one caller but it is the ADR-0019/R1 mapping boundary, which R1 names explicitly."
  - "Documentation freshness — see F-007 (the repo README, pre-existing gap). No per-directory READMEs exist in this project."

security:
  verdict: "the cycle-1 critical is genuinely closed"
  notes:
    - "The refusal is decided BEFORE routing (handler.py:357, inside _dispatch, ahead of the ROUTES lookup at :362), so a route added by a later card inherits it rather than having to remember it. Pinned by test_the_host_check_runs_before_the_router."
    - "The three authorities (Host header, Origin header, absolute-form request target) are judged by ONE function, _host_is_local — which is why M3 and M4 each kill three tests across two different signals. This is the right shape: three notions of 'local' is how one of them drifts."
    - "400 rather than 403 is the model's choice, not the fix agent's, and the fix agent was right to follow it: NFR-004's threshold and AC-054/055/056 all say 400 in as many words, and AC-053's shipped guard (test_the_package_contains_no_authentication_vocabulary) fails the suite on a 403 CODE literal under web/. I confirmed that guard reads the AST and excludes docstrings by node identity, which is why handler.py:319's prose mention of '403' does not trip it."
    - "Referer is deliberately not consulted. Correct: a referrer policy the attacking page controls can suppress it, so a rule resting on it is one the attacker can switch off. Neither NFR-004, CON-010 nor EC-004 mentions it."
    - "No injection surface: nothing user-controlled reaches SQL, a shell, a template engine or an eval. The one filesystem path a poster controls (`out`) is by design — the CLI grants exactly the same power (CON-007 parity) — and it is now unreachable cross-origin, which was the whole of F-001."
    - "No secrets, credentials or auth headers in the diff, in logs, or in any response body."
    - "Every body that echoes something off the wire is html-escaped AND carries nosniff AND is text/plain or a page whose interpolations are escaped: the 400 host/refusal bodies, the 404 path, the failure page's reasons. Pinned by test_a_refused_host_is_not_echoed_as_markup and test_the_refused_origin_is_not_echoed_as_markup."

performance:
  verdict: "no new hot path"
  notes:
    - "One generation per request, synchronously, bounded by ADR-0011's existing deadline against ADR-0001's 30s (ADR-0021, guardrail G-3). No new loop, query, lock or cache."
    - "MAX_BODY_BYTES (64 KiB) is a new and correct bound: http.server bounds request lines and header counts and nothing else, so without it a Content-Length: 4000000000 would be read into memory in full. The read is min(declared, cap) and the 413 is written after at most the cap's worth is drained, which is what lets the refusal actually be delivered rather than resetting the client."
    - "Python's own 4300-digit str->int limit means a huge `size` value raises ValueError and is caught rather than burning CPU. Verified with a 5000-digit field."
    - "The refused-corpus property test opens 294 short-lived connections against one server in ~2s. Acceptable; it is the only test in the suite of that shape."
