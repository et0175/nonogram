        * tests/test_web_submission.py:~2032 — "the pipeline ran and wrote four
          files into a directory the [attacking page named]"

      `_ATTACK_FIELDS` (tests/test_web_server.py:1428-1435) requests
      `export_formats=png` and `export_formats=json` — two formats. Measured
      directly:

          orchestrator.export_puzzle(generate(... export_formats=('png','json') ...))
