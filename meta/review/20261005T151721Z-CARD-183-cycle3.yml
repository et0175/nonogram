findings:
  - id: F-013
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_puzzle_solver_hint.py
    line: 909
    title: "Control test reads a 440 ms animation across two round trips after the click"
    description: |
      test_without_reduced_motion_the_hinted_cell_animates asserts getAnimations().length == 1 (line 909) and then,
      in a second evaluate, destructures getAnimations()[0] (_FADE, line 876). player-hinted-in runs for
      2 x --duration-base = 440 ms with no fill, so once it ends getAnimations() is empty and the test fails
      (TypeError on a.animationName). Fix 2 added the second round trip. Measured in this review: 5-43 ms
      from click to the last read over 12 hints (about 10x headroom), so not flaky in practice, and the same
      pattern already exists in test_puzzle_solver_progress.py (220 ms banner). The Worktree note's
      "no mid-animation sampling" is literally true, but the read still needs the animation to be running.
    suggestion: |
      Read the length, the name and the keyframes in one evaluate, or pause the animation first
      (td.getAnimations().forEach(a => a.pause())) so the read no longer depends on time.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
