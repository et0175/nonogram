  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_difficulty_dots.py
    line: 3836
    title: "The widened margin's box assertion pins one member of a 16-way tie"
    description: |
      `assert widened.closest.box == (2181, 477, 2187, 487)` identifies the
      region that sets the 1.8182 margin, but that region is not unique. I
      re-derived the whole distance distribution over the baseline interior at
      grey 208 independently: sixteen regions, all 7x11 letter stems, sit at
      exactly 1.8181818..., and `_interior_ink` keeps the first one it meets
      (`if distance < here[key][0]`), so which box wins is page-and-region
      iteration order. The asserted box is indeed the first (page 0), so the
      test is green and deterministic today — but any text added or moved ahead
      of that stem on page 0 changes the winner while the margin, the binding
      tolerance and every claim the test makes stay identical. The failure then
      arrives with the message "the widened threshold's margin is no longer
      carried by aspect", which is not what happened.
      The margin value, the binding-tolerance assertions and both headroom
      assertions are unaffected: those are tie-independent.
    suggestion: |
      Assert the tie class rather than one member: `widened.closest.width,
      widened.closest.height == (7, 11)` (plus the existing aspect/fill
      assertions), or `widened.closest.box in <the measured set>`, or record the
      tie explicitly (`sum(1 for r in ... if dist(r) == margin) == 16`). The
      black threshold's box assertion needs no change — 1.8859 is a singleton
      there (next value 2.2727).
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_difficulty_dots.py
    line: 3391
    title: "The palette enumeration cannot see two classes of tone the bound list claims the package does not draw"
    description: |
      `_flat_tones` collects only module-level assignments of three EQUAL ints,
      and that enumeration is what both bound lists lean on when they say
      "nothing the package draws is on the far side of it" (tests/helpers/round_ink.py
      lightness bullet) and "none of them is a tone the package draws"
      (ADR-0036/R3's comment, and the ADR History paragraph). Two classes are
      provably outside the walk: a module-level UNEQUAL triple (e.g.
      `(230, 225, 235)`, luminance 227 — lighter than MARK_LEVEL and so
      invisible to the guard) and a tone that is not a module-level constant —
      the walk's own control at line 3610 asserts that `LOCAL = (90, 90, 90)`
      inside a function is NOT found, i.e. the blindness is pinned as intended
      behaviour rather than recorded as residue.
      The claim is TRUE on this head — I grepped every 3-int literal in
      src/nonogram and the only colour constants are INK (0,0,0), BACKGROUND
      (255,255,255) and _SOLVED_GRID_GRAY (160,160,160); the unequal triples
      (GUIDE_BASIC_RULE_CLUE, book_plan's splits) are not colours — and the
      open route is itself declared as the `colour` bound with a control. So
      this is not a false claim, it is a true claim whose guard would not
      notice it becoming false in the same shape F-001 of CARD-241 did one
      class narrower (ADR-0039/R2's default-deny).
    suggestion: |
      Extend the walk's sibling assertion rather than the walk: collect
      module-level unequal int-triples too and assert each is either a declared,
      controlled non-colour (GUIDE_BASIC_RULE_CLUE and book_plan's splits are
      the current set) or has ITU luminance < MARK_LEVEL. That makes the
      "nothing lighter is drawn" half mechanical for the class it currently
      asserts by inspection, at the cost of one more AST pass over sources the
      file already parses.
    confidence: high
    source: model
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_difficulty_dots.py
    line: 3808
    title: "The 1.8 floor now has 1% headroom against a quantised measurement, so the next type-raster change reds it"
    description: |
      Judged as asked rather than taken on the card's word. The floor is still
      the right number: the false-positive boundary is 1.0, the measured margin
      is 1.8182, and the book's population is EMPTY between 1.0 and 1.8182 (I
      measured the histogram at grey 208: 1.8182 x16, 1.8859 x1, then 2.1749 x84,
      2.2770 x878), so 1.8 sits in a gap, not on a cliff. The hand-change is
      understood, not incidental, and I re-derived both sides: the stem that set
      `aspect_headroom` at grey 128 is 6x11 (aspect 0.5455, off-aspect 2.2727,
      fill inside tolerance); at grey 208 it is 7x11 (aspect 0.6364 -> 1.8182,
      fill 0.8599 -> off-fill 1.1675, outside), so it stops setting the aspect
      room and starts setting the margin, while the 99x94 block is literally
      unmoved (fill room 1.8859 at both).
      The residual risk is not erosion of an existing region — the quantities
      are quantised — it is a NEW raster: one more pixel of stem width (8x11 ->
      1.364, 8x12 -> 1.667) lands below the floor with the guard still 36% clear
      of a false positive. With the interior redesign's amendments already on
      main (91609aa), the next card touching page type will very likely red this
      floor and have to re-derive it.
    suggestion: |
      Keep 1.8 (lowering it is what AC-2 exists to prevent), but make the
      expected failure mode legible: say in the assertion message that a drop
      towards ~1.3-1.7 on a letter-stem family is a type-raster change to be
      re-derived, and that only a drop towards 1.0 is a guard problem. Pairing
      this with F-001's tie-class assertion removes the misleading first failure.
    confidence: low
