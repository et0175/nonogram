  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: meta/kanban/cards/CARD-028.md
    line: 47
    title: "The card overstates FR-018: its statement names only the CLI, not the web adapter"
    description: |
      The card's requirement-gap paragraph says "FR-018 and CON-011 both state that the rule
      applies to the web adapter". CON-011 does, verbatim ("to both inbound adapters (CLI and
      web UI)", requirements.yml:1578). FR-018 does not: its statement is
      "Carry grid extent on a generation request as a WIDTH and a HEIGHT rather than as one
      square size. **The CLI** expresses the pair through the single existing flag..."
      (requirements.yml:617-625). FR-018 is adapter-agnostic in its subject and CLI-specific in
      every example it gives; it never mentions the web UI.

      Small, and it does not change the conclusion — CON-011 alone carries the obligation, and
      the gap is real either way — but the card's prose is the artifact that survives, and this
      project's standing concern is prose that claims more than the source says.
    suggestion: |
