  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_web_submission.py
    line: 1509
    title: "The 200-string fuzz arm contributes no discriminating power the structured groups do not already have"
    description: |
      Measured, not asserted. The corpus is 369 tokens / 310 distinct, from four sources:
      9 named shapes, 54 bare-sweep values, 6 int-tolerance probes, a 100-pair NxM product,
      and 200 fuzz draws (`tests/test_web_submission.py:1509-1512`).

      Kill counts per source, computed against six candidate mutants of `_extent_token`
      (three-part token allowed / second side dropped / adapter-side 10..30 check / uppercase
      separator / `.strip()` before split / empty half accepted):

                            named  bare  tolerance  NxM-product  fuzz-200
        3-part allowed          1     0          0            0         0
        drop-height             0     0          0          100         4
        adapter range check     0    47          2           70        52
        uppercase separator     1     0          0          100         6
        strip() before split    0     0          0            0         0   (equivalent mutant)
        empty half accepted     2     0          0            0         2

      The fuzz arm kills nothing that a structured group does not already kill, for any mutant.
      Its composition explains why: 150 of 200 draws are distinct, **33 of them are the empty
      string**, and 122 of 200 fall into the single already-saturated `non-int, one part`
      category. Its one genuinely novel contribution across all 200 draws is `" 0x-4"` — the
      only corpus token that combines an `int()` tolerance (leading space, leading sign) with
      the `NxM` separator.

      That last point is the useful half of this finding: the interaction cell is the one place
      a native reimplementation would plausibly diverge from `cli._extent_token`, and the corpus
      reaches it once, by accident, out of 200 random draws — while all 6 deliberate tolerance
      probes are bare and all 100 product tokens are plain digits.

      Two related weaknesses in the anti-shrink guard (`_MINIMUM_EXTENT_CORPUS = 250`,
      tests/test_web_submission.py:1533-1541): it counts tokens, not distinct tokens, so a
      future edit that collapsed the fuzz draw to 200 empty strings would still pass; and the
      59 duplicate tokens mean arm 1 runs `""` 34 times.
    suggestion: |
      Cut the fuzz draw from 200 to ~30-40, and spend the saved cases on the empty interaction
      cell: add explicit tolerance-plus-separator tokens such as `" 20x30 "`, `"+20x-30"`,
      `"2_0x3_0"`, `"20x 30"`, `"20x+30"`. That trades ~330 near-duplicate cases for five that
      probe the only shape where the two parsers could realistically part company. Also assert
      `len(set(_EXTENT_TOKEN_CORPUS)) >= _MINIMUM_EXTENT_CORPUS` rather than `len(...)`, so the
      guard measures diversity rather than length.

      Not a defect in what is there — the named / bare / tolerance / NxM-product groups
      (169 tokens) are well-structured and each earns its kills, wall-clock cost is +0.78s
      total, and building a large seeded corpus by hand with a minimum-count assertion is
      CLAUDE.md's stated convention. This is a proportionality note, not a correctness one.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: compliance
    type: gap
    file: meta/architecture/inputs/raw-requirements.md
    line: 138
    title: "The missing web-surface acceptance criterion has no durable intake record"
    description: |
      Verified: AC-062..AC-065 are all CLI-phrased ("the CLI invoked with `--size 30x20`",
      requirements.yml:628-658), FR-018's own statement names only the CLI ("The CLI expresses
      the pair through the single existing flag", requirements.yml:617-625), and CON-011 is the
      one that carries the web adapter ("to both inbound adapters (CLI and web UI)",
      requirements.yml:1578). So the gap the card describes is real, and the card correctly did
      **not** invent an AC — `meta/architecture/requirements.yml` is untouched by the diff.

      What is missing is the durable record. The card says the gap was "reported as an
      architect-station gap in the decompose run report"; a run report is ephemeral and the
      card file itself is deleted at `done`. This project's queue for exactly this is
      `meta/architecture/inputs/raw-requirements.md`, and it carries a precedent from three days
      ago in the same shape — line 138, "AMENDS AC-049's `given` ... Source: CARD-020
      implementation + cycle-1 review", filed rather than hand-editing `requirements.yml`.
      Nothing in that file mentions CARD-028 or the web extent surface.

      Judgement on the second half of the question: the EC **is** adequate evidence for the
      card's behavioural claim — the property is real, it is checked against an independent
      oracle, and five injected mutants of the parser are all killed. What the EC cannot do is
      record that `requirements.yml` still owes a web-surface criterion.
    suggestion: |
      Append one entry to `meta/architecture/inputs/raw-requirements.md` in the existing style:
      FR-018/CON-011 apply to both inbound adapters but AC-062..AC-065 are CLI-phrased, so the
      web surface of the extent pair has no acceptance criterion; source CARD-028 decompose +
      cycle-1 review, 2026-09-03; the shipped behaviour to formalize is
      `PropertyTest_WebForm_ExtentJudgedByDomainNotAdapter`. Do not hand-edit requirements.yml.
