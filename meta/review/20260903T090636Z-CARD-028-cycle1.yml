  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_web_server.py
    line: 1958
    title: "CARD-028 falsifies the docstring of test_the_form_offers_the_same_option_surface_as_the_cli, which names this card by number"
    description: |
      `test_the_form_offers_the_same_option_surface_as_the_cli` (tests/test_web_server.py:1940-1975)
      documents the CLI/web option divergence, and its docstring makes three claims that this
      diff turns false:

        * "its ``size`` box takes one number" (line 1964) — as of this card it takes `N` or `NxM`.
        * "What the form cannot yet say is ``WxH``" (line 1967) — the form now says it;
          `pages.py:178-181` advertises `WxH` and `submission._extent_token` parses it.
        * "CARD-028 adds it and both halves of this assertion drop back to their pre-CARD-027
          shape" (line 1967-1968) — a prediction that did not come true. The assertion at
          lines 1975-1976 is unchanged and still correct, because the residual divergence is a
          *naming* one (argv dest `extent` vs form field `size`), not the capability gap the
          docstring attributes it to.

      The assertion still passes and still guards what it should, so nothing is broken. What is
      wrong is the explanation: the docstring is the mechanism by which the next reader learns
      *why* the two sets differ, and it now tells them the web adapter is "feature-incomplete"
      in exactly the way this card completed. This is the same overclaiming-prose defect class
      the project has been closing for ten cards, and the docstring pre-registers this card as
      the one obliged to reconcile it.
    suggestion: |
      Edit the third bullet of that docstring (tests/test_web_server.py:1958-1968): state that
      CARD-028 closed the capability half of the divergence, and that what remains is the
      argv-dest-vs-form-field-name spelling (`extent` vs `size`), which is why the assertion
      keeps its shape rather than dropping back. Two or three sentences; no assertion change.
    confidence: high
