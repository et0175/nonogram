      as an array first, which is the more expensive of the two ways to get the same four
      integers." The implementation deliberately does NOT use NumPy for the bbox scan - it's
      pure Pillow (point() + getbbox()). This is a documentation-only inaccuracy inherited from
      the origin review finding's framing; it doesn't affect correctness of the fix or its tests,
      but a future reader tracing "why is NumPy imported here" against this test file's docstring
      would be looking for something that isn't there in that specific function's path.
    suggestion: |
