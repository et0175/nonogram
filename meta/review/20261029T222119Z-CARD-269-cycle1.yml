    title: "The branch reddens a clean tree: two deterministic failures in tests/test_puzzle_solver_resume.py, a blast-radius file the round neither adapted nor reported"
    where: "tests/test_puzzle_solver_resume.py:451 and :675 (the Hint press sites); the assertions that fail are :445 and :669"
    detail: >-
