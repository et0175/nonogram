  - id: F-2
    severity: gating
    confidence: certain
    source: measured
    title: "Rung 2 produces zero visible change on the shipped page; the ladder's explanation never reaches a sighted player, and no on-page copy mentions it"
    where: "src/nonogram/admin/static/admin.css:923 (.player-announce); src/nonogram/admin/static/solver.js ladderExplainText and the Hint handler; src/nonogram/admin/templates/puzzle_solve.html:230"
    detail: >-
      #puzzle-player-announce is position:absolute, 1px x 1px, clip:rect(0 0 0 0)
      -- a visually hidden live region (measured 1x1 on a live page). Every
      sentence this card ships goes only there. MEASURED by SHA-256 of
      element screenshots taken after getAnimations() settled: after rung 1 the
      board hashes 096a5d1bff66 and the toolbar caab001602a1; after rung 2 the
      board hashes 096a5d1bff66 and the toolbar caab001602a1 -- BYTE-IDENTICAL.
      (Rung 1 does differ from blank, and rung 3 differs from both, so the
      instrument reads real differences.) The re-fade does not rescue it: the
      class is toggled off and on inside one task with no forced reflow between,
      so the animation coalesces and does not restart -- and under
      prefers-reduced-motion there is no animation at all.

      The consequences compound: on the exhausted board rungs 1 AND 2 both
      highlight nothing and say nothing visible, so a player presses Hint twice
      and sees a dead button before the third press finally reveals -- strictly
      worse than CARD-183's one-press reveal, which always did something
      visible. Check on a clean board is likewise a button that does nothing
      visible. And the one visible channel that does exist, the line tint, is
      --color-accent-tint #e6efec against the board's #fffdf8 paper: a measured
      contrast ratio of 1.15:1, far under WCAG 2.1 SC 1.4.11's 3:1 for a
      graphical object needed to understand the content. The same tint also
      carries two different meanings (rung 1's "deduce here" and Check's "an
      error is here") with nothing but the hidden sentence to tell them apart.

      Every AC is written as "the live region says ...", so all ten pass while
      the feature does not reach the player.
    why_it_matters: >-
      This is a Category: feature, player-facing card whose title is "point at
      the line, EXPLAIN THE DEDUCTION, and only then reveal". The explanation
      is the middle third of the card and it is invisible to the majority of
      players. The captures read legible only because the round made the live
      region visible to take them -- the instrument displays something
      production does not, which is the same family as the mid-fade catch the
      round made on itself.
    judgement_requested_answer: >-
      Shipping with no on-page mention is NOT acceptable, and not merely as
      documentation debt. With the announce region hidden, the on-page
      paragraph is the only channel that could explain two presses that do
      nothing visible. The owed one-sentence copy change is load-bearing, not
      cosmetic, and the ladder should not ship before it or before rung 2 gains
      a visible channel.
    suggested_fix: >-
      Either (a) give rung 2 a visible channel -- the simplest being a visible
      hint line in the toolbar's existing slot rather than only the hidden
      region -- or (b) escalate to the owner that rungs 1-2 are AT-only and get
      a decision, since it changes what the feature is. In both cases the
      pinned-copy guardrail needs the owner to unblock
      tests/test_puzzle_solver_marking.py::test_the_page_copy_describes_the_new_click
      so the paragraph can name the ladder and Check. Separately, raise the
      tint's contrast or add a second channel (a border on the line's edge
      cells) so the one visible cue clears 3:1.

