verdict: >-
  The engineering here is above this board's average and most of the round's
  claims hold under independent measurement. The pure module is well shaped,
  the 1800-line seeded reason corpus is a real property test with counted
  near-misses AND an independent re-check of the claims the module made, M5
  reproduces exactly and its certified pair is genuinely two independent
  assertions, every figure the owner decided on (268 / 186 / 82) re-derives to
  the pixel, the 1440 px control really does buy the threshold-moved
  distinction, and the colour the round reverted to IS the design token --
  confirmed by sampling the capture: (230, 239, 236) = #e6efec =
  --color-accent-tint. The round catching its own mid-fade instrument and
  writing the trap into admin.css is the right reflex and it worked.

  Three things gate it, and the first is not a judgement call.

  THE BRANCH IS RED. tests/test_puzzle_solver_resume.py is 15/15 at the base
  560d7e09 and 13/15 at bcd136b5, deterministic across two runs. Both failures
  are the ladder's own supersession reaching a file the round neither adapted
  nor reported: TestSolverResume_ReloadRestoresBoardCountsAndHistory::test_reload_restores
  and TestSolverResume_SavesEveryChangeWithoutARequest::test_saves_every_change
  each press Hint ONCE and assert the board (resp. the localStorage entry)
  changed. Under the ladder one press changes neither. The round's own
  correction 2 says "G-5's blast radius is wrong -- two further existing files
  had to change"; it is wrong by THREE, and the third is left failing. This is
  in the card's own guardrail territory: the second failure is the save, which
  G-3 and AC-9 are both about. `grep -rln '"Hint"' tests/` returns seven player
  files in two seconds and names it. F-1.

  THE LADDER'S MIDDLE RUNG IS INVISIBLE TO A SIGHTED PLAYER. #puzzle-player-announce
  is a 1x1 clipped region (admin.css:923; measured 1x1 on a live page), so every
  sentence the ladder produces goes only to assistive technology. Measured by
  SHA-256 of the rendered board and toolbar after getAnimations() settled: rung
  2's board and toolbar are BYTE-IDENTICAL to rung 1's (board 096a5d1bff66,
  toolbar caab001602a1 for both). The rung whose whole job is "explain the
  deduction" -- half this card's title -- changes nothing a sighted player can
  see. On the exhausted board rungs 1 AND 2 both produce nothing visible at
  all, and Check on a clean board produces nothing visible at all; CARD-183's
  Hint produced a visible cell change on every press, so the ladder introduces
  presses that are indistinguishable from a dead button. The on-page usage
  paragraph mentions neither Hint, nor Check, nor the ladder. The captures
  look legible only because the live region was MADE VISIBLE to take them --
  the instrument shows something production does not. F-2.

  THE SUPERSESSION IS RECORDED NOWHERE EXECUTABLE. AC-327, AC-329 and AC-334
  are still live and unamended in requirements.yml, each now FALSE of the
  shipped code, each with a `test:` ref that resolves to a live class now
  asserting the opposite. meta/architecture/inputs/raw-requirements.md -- where
  the card says the FR-044 delta goes -- was not touched by either commit. And
  the card says twice that it "does not edit requirements.yml" while bcd136b5
  edits it. One AC was amended; three were left to read satisfied and
  mechanically checked while stating the retired behaviour. This is the
  CARD-308 / CARD-319 defect class one level up: the ref is alive, the
  requirement is dead. F-3.

  Nothing here asks the owner to relitigate either decision. The 1280 px
  toolbar and the AC-333 amendment are both sound and both re-derive; what
  does not hold is the evidence the card cites for the first (F-4) and the
  units it states it in (F-5).

