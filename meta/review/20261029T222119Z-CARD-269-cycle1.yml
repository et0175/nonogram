  - id: F-5
    severity: important
    confidence: certain
    source: measured
    title: "The toolbar figures 187 px -> 223 px are a bottom-edge coordinate written as a height, in three places"
    where: "meta/kanban/cards/CARD-269.md (owner decision 1); src/nonogram/admin/static/admin.css (the .player-counters comment); tests/test_puzzle_solver_percent.py's test_shares_the_buttons_row_at_1280 docstring"
    detail: >-
      MEASURED on the shipped page at 1280 x 900, live region hidden:
      getBoundingClientRect().height of BOTH .player-toolbar and
      #puzzle-player-controls is 39 px without the Check button and 75 px with
      it. The toolbar's top is y=148, so its BOTTOM is 148+39 = 187 and
      148+75 = 223. The two numbers committed as heights are bottom-edge
      coordinates of a viewport-relative rect; they depend on everything above
