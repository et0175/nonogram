  - id: F-6
    severity: important
    confidence: certain
    source: measured
    title: "ADR-0039/R2 overclaim: the announce table cannot be checked against the authority, because it is not exported"
    where: "src/nonogram/admin/static/solver.js:1232-1240 (the LADDER_REASON comment) and :1240 (const LADDER_REASON); src/nonogram/admin/static/solver_state.js:789-792 (HINT_REASONS' comment)"
    detail: >-
      Both comments claim the suite asserts LADDER_REASON's keys ARE
      HINT_REASONS. LADDER_REASON is a module-private `const` -- `grep
      "export.*LADDER_REASON"` returns nothing -- so no test can read its keys,
      and no test does. What the suite actually does
      (TestSolverHintLadder_SecondPressExplains::test_each_reason_is_announced_on_a_board_where_it_holds)
      is assert `set(_reason_boards()) == set(HINT_REASONS)` and then drive one
      real board per reason. That catches a MISSING sentence -- ladderExplainText
      throws a RangeError at the press -- but not an EXTRA key, which is dead
      and undetected; and the Python side's _REASON_SENTENCE is a hand-written
      transliteration of LADDER_REASON, so what is really cross-checked is two
      hand-written tables against three driven boards.

      The card's own sentence is wrong in a further way: it attributes this to
      "HINT_RUNGS / RUNG_EVENTS" as "an enumerable authority the announce table
      is checked against". The announce table is keyed by HINT_REASONS;
      HINT_RUNGS keys nothing in the announce path. The rung dispatch in the
      Hint handler is a two-way ternary over a three-valued rung, derived from
      no authority at all -- a fourth rung added to HINT_RUNGS would silently
      render the explain text.
    why_it_matters: >-
      R2's whole point is that a guard's set comes from an authority the runtime
      can enumerate. The mechanism that exists is decent; the claim written
      beside it is wider than the mechanism, which is the exact family
      ADR-0039 was promoted to stop.
    suggested_fix: >-
      Export LADDER_REASON (or a frozen array of its keys) and assert the
      equality directly in the pure-module test; that is two lines and makes
      both comments true. Correct the card's sentence to name HINT_REASONS.
      Optionally derive the rung dispatch from HINT_RUNGS so a new rung is a
      loud failure like an unknown event already is.

  - id: F-7
    severity: minor
    confidence: certain
    source: measured
    title: "hintLine's null is three structural paths, not one; the third is unreachable only via a duplicated projection that no page test guards"
    where: "src/nonogram/admin/static/solver_state.js hintLine (:775-:786) and knownLine (:748-:760) against hintCell's inline `known` (:636-:639)"
    detail: >-
      hintLine returns null (a) when hint is null, (b) when hint.deduced is not
      true, and (c) when BOTH line() calls return null because lineForced does
      not force the cell on either axis. (a) is unreachable from the UI -- the
      Hint handler returns on `hint === null` before calling it -- and is
      exercised directly by the pure-module test's `noCell` case; folding it
      into "not a deduced cell" is a definitional choice the comment makes
      explicit, so it is honest. (b) is the exhausted state the card is about.
      (c) is the "I could not tell" null the brief asks about, and it is
      unreachable ONLY because knownLine reproduces hintCell's projection
      exactly -- the same `state === truth ? state : UNKNOWN`, the same row and
      column construction -- so an axis hintCell found forcing is an axis
      hintLine finds forcing. That is a parallel-maintained duplicate, not a
      shared helper.

      MEASURED: mutating knownLine's projection to `return state;` (wrong marks
      at face value -- breaking exactly the invariant the no-drift claim rests
      on) leaves EVERY page test green; only
      TestSolverHintLadder_ThePureModule::test_the_ladder reds, on its 1x3
      knownLine unit assertion. 52 page tests pass. In particular
      TestSolverHint_IgnoresWrongMarks -- the class that owns AC-328 -- passes,
      because it never presses rung 1 or rung 2 on a board with wrong marks.
      G-4 and the solver_state.js comment both say AC-328 holds "at every rung
      by construction"; the construction has no control.
    why_it_matters: >-
      With that projection drifted, rungs 1-2 would announce the exhausted
      sentence on a board that is NOT exhausted -- a user-visible falsehood of
      exactly the kind this card exists to remove -- and nothing the player
      meets would catch it. The claim's reach is wider than its control
      (ADR-0039/R1).
    suggested_fix: >-
      Either have hintCell call knownLine (G-4 preserves its signature and
      semantics; the body is free), which makes the invariant structural, or
      add one page-level case to TestSolverHint_IgnoresWrongMarks that presses
      rung 1 and rung 2 on the wrong-marks board and asserts the line is the
      one the correct-marks-only oracle picks.
    on_the_brief_question: >-
      ANSWER: behaviourally one case, structurally three, with one path's
      unreachability resting on an untested invariant. A null meaning
      "exhausted" and a null meaning "I could not tell" would indeed be
      indistinguishable to rungs 1-2, and today only a duplicated five-line
      projection keeps the second from occurring.

  - id: F-8
    severity: minor
    confidence: certain
    source: measured
    title: "The rung-3 row of the frozen transition table is unreachable in production"
    where: "src/nonogram/admin/static/solver_state.js RUNG_AFTER_PRESS (:715-:719); src/nonogram/admin/static/solver.js's Hint handler"
    detail: >-
      MEASURED: changing `[RUNG_REVEAL]: RUNG_POINT` to `RUNG_EXPLAIN` reds
      ONLY TestSolverHintLadder_ThePureModule::test_the_ladder; 52 page tests
      pass. The handler branches to commit() before reaching nextRung whenever
      rung === RUNG_REVEAL, so `nextRung(3, "press")` is never called from the
      UI; the real 3 -> 1 reset is commit()'s `nextRung(rung, "change")`. Five
      of the six (rung, event) pairs are reachable in production; this one is
      not, and the comment justifies it with the mechanism that in fact does
      the work somewhere else.
    why_it_matters: >-
      Minor -- a total function is a defensible shape and the derived table test
      does cover the row. Reported because the brief asks, and because the
      comment attributes the ladder's wrap to a row nothing executes, which
      will mislead the next reader (CARD-263 is already slated to reuse
      nextRung unchanged).
    suggested_fix: "Keep the row; change the comment to say the wrap exists so nextRung is total, and that production reaches rung 1 after a reveal through commit()'s 'change'."

  - id: F-9
    severity: minor
    confidence: certain
    source: measured
    title: "'Assigning the SAME string is a no-op in the DOM' is false, so the stated reason for rung 2's silence on the exhausted board does not exist"
    where: "src/nonogram/admin/static/solver.js, the LADDER header block above ladderPointText"
    detail: >-
      MEASURED with a MutationObserver on the shipped page: setting
      announce.textContent to an identical string produces a mutation record
      (1, the same as the first assignment). Per the DOM spec the textContent
      setter runs "string replace all", which removes the existing text node
      and inserts a new one -- never a no-op. So whether a repeated rung-2
      answer is re-announced is AT-dependent, not "silent by the platform's
      rule". On the exhausted board rung 2 writes the identical sentence, so by
      the card's own rule 6 that press is a no-op in the hidden channel too and
      a no-op in the visible one (F-2) -- the press has no observable effect
      anywhere.
    suggested_fix: "Correct the comment to say what is true: the string is reassigned, and whether AT repeats it is the AT's choice. Then decide rung 2's exhausted behaviour deliberately rather than inheriting it from a false premise."

  - id: F-10
    severity: minor
    confidence: certain
    source: measured
    title: "Check reads enabled and silently does nothing during a drag"
    where: "src/nonogram/admin/static/solver.js: refresh()'s `actions.check?.setAttribute('aria-disabled', String(locked))` against the Check handler's `if (gesture || player.locked()) return;`"
    detail: >-
      MEASURED mid-drag on a live board: Check reports aria-disabled="false"
      while Hint reports "true", and Check's handler returns early on the same
      gesture. Hint includes `gesture !== null` in its attribute; Check does
      not. Card rule 9 specifies only the lock for Check, so the handler's
      gesture guard is undeclared behaviour on top of the declared contract.
    why_it_matters: "An aria-disabled=\"false\" control that does nothing is the a11y failure mode aria-disabled exists to prevent; reachable with a second pointer on a touch device."
    suggested_fix: "Pick one: drop the gesture guard from the handler (Check changes nothing, so running mid-drag is harmless), or add `gesture !== null` to the attribute as Hint has it, and say which in the card."

  - id: F-11
    severity: minor
    confidence: certain
    source: measured
    title: "The round's third correction is RIGHT: the runs-complete second half is a permanent surviving mutant"
    where: "src/nonogram/admin/static/solver_state.js hintReason (:849-:852)"
    detail: >-
      MEASURED: deleting `&& cells.every((state, i) => state === FILLED ||
      forced[i] === EMPTY)` leaves 53/53 green in the card's own test file. The
      reasoning holds: given forced !== null a placement exists, and a placement
      consistent with `cells` must fill every FILLED cell; with marked === total
      there are exactly as many marked cells as any placement fills, so every
      placement's filled set IS the marked set, so every other cell is EMPTY in
      every placement and forced[i] === EMPTY. The clause cannot fail on its
      own. The round kept it with an honest note instead of a comment implying
      two guards, which is the right call -- and no test claims to cover that
      half, so nothing is laundered.
    why_it_matters: "Reported as a verified-correct correction, not a defect. It is a permanent surviving mutant and should be declared as such wherever this round's mutant tally is quoted, so a future mutation sweep does not read it as a new gap."
    suggested_fix: "None required. Optionally name it in the card's mutation record as a KNOWN survivor with its proof, so the next sweep's count is interpretable."

judgements_requested:
  "1_is_hintLine_s_null_one_case_or_several_collapsed": >-
    SEVERAL, COLLAPSED, and the collapse is sound for two of the three. Three
    structural return-null paths; (a) hint === null is unreachable from the UI
    and explicitly folded into the comment's definition; (b) the fallback is
    the exhausted state; (c) "neither axis forces it" is the "I could not tell"
    null and is unreachable only by an untested duplicated projection. See F-7,
    with the measurement.
  "2_can_rungs_1_2_drift_from_rung_3_s_cell": >-
    NO, and the mechanism is sound. commit() is the single choke point every
    recorded change passes through -- I traced all seven call sites (click
    :1801, drag :1795, undo/redo :1892 and :1981, reset :1959, rung 3 :1916,
    and setBoard, which routes through marking.commit at :1111) -- and it calls
    nextRung(rung, "change") and setLadderLine(null) before anything else. The
    board therefore cannot change between rung 1 and rung 3, hintCell is a pure
    function of (board, payload), and hintLine's row axis is indexed by
    hint.row with the cell at hint.col, so the cell is in the line by
    construction. `editing` is a const (:758), so edit mode cannot toggle under
    the ladder. TestSolverHintLadder_FirstPressPointsAtALine::test_the_cell_the_third_press_will_reveal_is_on_that_line
    pins it where the player meets it. No drift found.
  "3_is_HINT_RUNGS_RUNG_EVENTS_a_genuine_enumerable_authority": >-
    PARTLY, and the card misattributes it. The authority that does real work is
    HINT_REASONS, and the announce table is NOT checked against it because it
    is not exported (F-6). There ARE second hand-written lists: RUNG_AFTER_PRESS
    mirrors HINT_RUNGS, _REASON_SENTENCE (test) mirrors LADDER_REASON (source),
    knownLine mirrors hintCell's projection, and the rung dispatch is a ternary
    derived from nothing. UNREACHABLE ROW: yes, one -- (3, "press"), measured
    (F-8). The other five pairs are reachable, and the derived table test does
    drive all six.
  "4_does_M5_reproduce_and_is_its_pair_two_independent_assertions": >-
    YES to both, measured rather than argued. Reconstructed M5 as the
    one-line `setLadderLine(line)` -> `setLadderLine(line ?? { axis: "row",
    index: hint.row })`: it highlights row 1 (15 cells + rowClue 0) on the
    exhausted board and reds EXACTLY ONE test,
    TestSolverHint_FallsBackToTheSolution::test_the_first_two_presses_say_no_line_decides_and_point_at_nothing,
    at tests/test_puzzle_solver_hint.py:898 -- the _lined assertion -- while all
    seven sibling node ids in that class and the two ladder classes stay green.
    Exactly as the card claims.

    The pair is INDEPENDENT. The converse mutant M5b (one word changed in
    LADDER_EXHAUSTED) reds the SAME test at :899 -- the _announced assertion --
    having PASSED :898. So each mutant kills exactly one half and neither
    assertion implies the other. The card's justification for asserting both is
    sound.

    On the mutant discipline more broadly: the nine mutants are NOT itemized
    anywhere in the repository -- only M5's effect is described in prose, and
    `grep -rn "CARD-269"` over meta/ finds no mutant record. The discipline
    described (needle unique, blob sha both sides, __pycache__ swept) is the
    right one and I applied it myself, but the claim "nine mutants" cannot be
    audited or reproduced from what is committed, and F-11 is a tenth, known
    survivor that the tally's phrasing does not accommodate.
  "5a_did_the_four_adapted_classes_keep_every_assertion": >-
    YES, verified line by line against the base. Every one of the four is a
    pure `_hint(page).click()` -> `_reveal(page)` substitution with no
    assertion removed or loosened, and several classes GAINED assertions:
    TestSolverHint_FallsBackToTheSolution's reveal test gained the empty-line
    assertion, TestSolverHint_KeyboardAndNoRequest gained per-rung "nothing
    changed" checks inside the key loop plus a whole Check-by-keyboard arm, and
    TestSolverHint_ReducedMotion gained the line-highlight zero and a second
    control that it rises. The superseded set really is seven classes.
  "5b_is_G5_s_blast_radius_two_files": >-
    NO -- THREE. Both files the round names are genuinely marked in place
    (test_puzzle_solver_maybe.py names G-5 and the word "unforeseen" explicitly;
    test_puzzle_solver_percent.py documents the change thoroughly but does NOT
    use the word or name G-5, so the card's "both marked in place as
    unforeseen" is a hair generous). The third, test_puzzle_solver_resume.py,
    is neither adapted nor marked and is RED. F-1.
  "5c_does_the_runs_complete_second_half_really_cannot_fail": >-
    IT REALLY CANNOT, and I measured it rather than accepting the argument:
    deleting the clause leaves 53/53 green. The round's reasoning reproduces.
    No test claims to cover that half, so the honest note understates nothing
    and covers nothing that was being claimed. F-11.
  "6_do_the_five_toolbar_numbers_re_derive_and_does_the_1440_control_work": >-
    FOUR OF FIVE RE-DERIVE EXACTLY; the fifth is mislabelled.

    268: the counters' max-content width at 1280 WITHOUT Check -> 268 px
    (pair 147 + Progress 101 + 20 gap). EXACT.
    186: the counters' width at 1280 WITH Check -> 186 px. EXACT.
    82: 268 - 186 = 82, and independently the history group goes 359 -> 441 =
    +82 when Check is added. EXACT, confirmed two ways. (Check's own button box
    is 73 px; the 82 is the room it costs, which is how the card uses it.)
    1440 fits all three: Progress and Errors both at top 149, toolbar 39 px,
    counters 346 px on one row. EXACT.
    187 -> 223: these are bottom-edge coordinates, not heights. F-5.

    THE 1440 CONTROL DOES ACHIEVE THE DISTINCTION. The 1280 assertion
    (`pt >= eb`) and the 1440 assertion (`wpt < web and wet < wpb`) are the two
    halves of a discriminator: the same inequality is FALSE at 1280 and TRUE at
    1440 on the shipped tree, so a change that broke the layout at both widths
    reds the 1440 control while a change that merely moved the threshold reds
    neither. That is exactly the "threshold moved, not layout broken" shape the
    owner's decision needs, and it is the strongest single piece of test design
    on this card.
  "7_does_AC_333_s_ref_resolve_to_a_real_class": >-
    YES. `TestSolverHint_PlacesTheButtonAndTheCounter` resolves to a real
    `class` line at tests/test_puzzle_solver_hint.py:777 -- the exact line the
    card states -- and `grep -rn hintIsLastChild tests/` returns nothing, so
    the renamed internals are gone and the class name survives. The amended
    `then:` is genuinely asserted: got["group"] == [..., "hint", "check"],
    checkIsLastChild, checkFollowsHint, hintsFollowErrors, at both 1440 and
    390. The ref is NOT dead and the check was made in the right order. One
    residue: that class's DOCSTRING still says the AC-333 clause is "part of
    what the ladder supersedes -- surfaced in the report, not decided quietly
    here", which bcd136b5 made stale. One sentence.
  "8_is_the_ladder_legible_to_a_player_from_the_captures": >-
    THE CAPTURES ARE LEGIBLE; THE SHIPPED PAGE IS NOT. In the captures rung 1's
    tinted row and clue box read clearly, the exhausted state (07/08) reads
    exactly as the card wants, and Check's named row (05) reads. But the
    captures were taken with the live region MADE VISIBLE -- their own README
    says so -- and the sentences they show do not appear on the shipped page at
    all. With the region in its shipped 1x1 clipped state, rung 2 is
    byte-identical to rung 1, the exhausted rungs show nothing, and Check-clean
    shows nothing. F-2.

    On the colour: the shipped captures' highlight samples (230, 239, 236) =
    #e6efec = --color-accent-tint exactly, and the alt set samples
    (215, 225, 220); tokens.css is byte-identical to meta/design/tokens.css.
    THE REVERTED COLOUR IS THE TOKEN, confirmed at pixel level, and the
    captures do support that -- they were taken settled, or they would read
    lighter than the token. The round's catch and revert were right.
  "9_is_shipping_with_no_on_page_mention_acceptable": >-
    NO. See F-2's judgement_requested_answer. Reverting the copy addition
    rather than editing a forbidden file was the correct call under the
    guardrail, and the follow-up is not this round's to take -- but the gap is
    not cosmetic documentation debt, because the on-page paragraph is the only
    remaining channel that could explain two presses with no visible effect.
  "10_is_CARD_263_s_path_report_only_and_untouched": >-
    CONFIRMED. `git diff 560d7e09..bcd136b5` touches neither errorCount in
    solver_state.js nor the #puzzle-player-errors counter in solver.js or the
    template. The card's statement of what CARD-263 must decide -- that
    "Errors: N" is a live role="status" region updated on every mark, so making
    the count cost a press means hiding or freezing a counter CARD-162 shipped
    -- is accurate, and leaving it to an owner decision is right.
  "11_are_the_two_deliberate_divergences_sound": >-
    BOTH SOUND, both recorded. The sibling class (rather than extending
    TestSolverHintModule) keeps each class docstring true about which card it
    covers, which is this tree's convention. Clearing lastClick on a ladder
    press and a Check press is semantically right -- they ARE inputs, and the
    reset confirmation already follows that rule -- and I verified the test it
    protects, TestSolverClickFollowsTheBrush in test_puzzle_solver_marking.py,
    passes untouched in the impact run.

positives:
  - "The 1800-line seeded reason corpus (TestSolverHintLadder_TheReasonIsNeverALie) is the strongest test on the card: minimum counts per reason asserted inside the test, BOTH near-miss populations counted rather than merely present (>=150 overlap-with-a-mark, >=400 one-run-short), and -- the part that matters most -- the claims the module DID make are re-verified against their own preconditions rather than against the oracle that shares them. That last loop is what rescues the Python _reason() from being a mere transliteration of the JS."
  - "The exhausted-state pair (sentence AND empty highlight) is load-bearing and independently so, measured both ways."
  - "The 1440 px control is a genuine discriminator, not a decoration."
  - "Every new AC class carries an in-test negative control that rises."
  - "The getAnimations() self-catch, and writing the trap into the admin.css comment rather than only into the card, is the right shape for a measurement lesson."
  - "Node-id and diffstat discipline is exact: 8 files +1895/-65 and +29/-0/-0/-0 both re-derive to the digit."
  - "The ladder genuinely removes the falsehood it set out to remove: on the exhausted board rungs 1-2 no longer hand over a cell while claiming a missed line deduction. That is real and it is the card's point."

