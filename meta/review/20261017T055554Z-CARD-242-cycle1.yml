  - id: F-002
    severity: high
    category: tech-debt
    type: risk
    file: tests/test_guard_integrity.py
    line: 328
    title: "the executor set is hand-written where an enumerable authority exists, and its default on an unrecognised call is a silent pass"
    description: |
      _CHECK_LOG_EXECUTOR_GROUPS enumerates 18 names by hand. ADR-0039/R2 is mandatory and has
      two clauses, and the diff meets neither:

      1. "derived from an authority the runtime can enumerate, not hand-written". 17 of the 18
         names are offered by an authority that is enumerable at runtime - `system`, `popen`,
         `execv*`, `spawn*`, `posix_spawn` by dir(os); `run`, `call`, `check_call`,
         `check_output`, `Popen`, `getoutput`, `getstatusoutput` by dir(subprocess). Only `main`
         has no authority, and that is precisely the case R2 routes to a named exemption under
         R3. The rule's own docstring argues against a dir() PROJECTION ("dir(os) offers 300-odd
         names of which these few execute") - which is an argument against an unclassified
         projection, not against the classification table the sibling module already uses for a
         surface of 88 (PYTEST_SURFACE) and 300-odd (STDLIB_DIRECTORY_SURFACE). The measured
         cost of skipping it is the card's own disclosed miss G-19: `runpy.run_path`, a name
         dir(runpy) offers and no classification table would have let through unjudged.

      2. "Where no such authority exists the guard defaults to DENY: a shape it cannot analyse
         is a FAILURE, never a silent pass." The polarity here is the opposite. A module-scope
         binding whose name reaches a call the set does not hold stays exempt and the guard is
         silent - which is exactly what G-17 (alias), G-18 (getattr), G-19 (unenumerated) and
         G-20 (local wrapper) record. Four of the six residues this card declares exist only
         because of the polarity, not because the question is unanswerable.

      The R2-conformant shape is feasible here, measured rather than asserted: with the
      executor test removed from _executed_names entirely (any call taints), the real tree
      yields exactly two sites - `CHECK_LOG_OPTION` in tests/test_guard_integrity.py and
      `SANDBOX_CONTROL_MODULE` in tests/test_suite_profile.py. That is two named exemptions
      held to an equality under R3, which is the pattern ADR-0039/R3's own check ref
      (test_the_dingbat_exemption_is_only_for_a_module_that_cannot_draw) implements.

      This is a new set introduced by this diff - CARD-239's rule had no executor set at all -
      so it is in scope, and R2's own note says a guard written today is reached by
      forge:review Step 8h rather than by the existing check ref.
    suggestion: |
      Either derive the set the way the sibling does - a classification table over
      dir(os) | dir(subprocess) | dir(runpy) with every name judged as an executor or as
      KIND_NEITHER with a reason, the set being that table's projection, plus the existing
      per-member discriminating control - or flip the polarity to R2's deny default: taint on
      any call, and carry `CHECK_LOG_OPTION` and `SANDBOX_CONTROL_MODULE` as two named
      exemptions with a control each and an equality against the sites that exist today. The
      second is the smaller change and the measurement above says it costs exactly two
      exemptions.

      If neither is taken, the honest minimum is to narrow the claim: say in the docstring that
      the set is hand-enumerated with no authority behind it, that the guard's default on an
      unrecognised call is a PASS, and record that polarity choice as a decision rather than
      leaving four of its consequences as separate bounds.
    confidence: medium
    source: model
    violates: ADR-0039/R2
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 2058
    title: "the real-tree exemption test asserts a lower bound where ADR-0039/R3 asks for an equality"
    description: |
      test_the_prose_the_real_tree_holds_is_present_and_still_silent asserts
      `len(bindings) >= 2` and `len({path for path, _ in bindings}) >= 2`, then that the rule is
      silent on those files. ADR-0039/R3 asks for an exemption to be "held to an equality
      against the sites that exist today", and the rule's own check ref does exactly that (the
      dingbat exemption pins the modules carrying the codepoint today), as does the sibling's
      test_the_host_state_silences_elsewhere_are_exactly_the_measured_ones.

      With a lower bound, a third module-scope site mentioning the option can appear and be
      absorbed with no test noticing. The cost is smaller than it would be for an unconditional
      exemption - a new site is absorbed only while it reaches no executor, which is the
      intended semantics - which is why this is Minor rather than part of F-001.
    suggestion: |
      Assert the set of (file, target) pairs equals the two that exist today -
      ("tests/test_guard_integrity.py", "CHECK_LOG_OPTION") and
      ("tests/test_suite_profile.py", "SANDBOX_CONTROL_MODULE") - so a third absorbed site is a
      failing test that has to be judged, and keep the >= 2 assertions as the message.
    confidence: high
