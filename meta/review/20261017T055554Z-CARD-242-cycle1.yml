findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 444
    title: "the three settling passes are a reach claim with no control that can fail, and their residue is undisclosed"
    description: |
      _executed_names settles the taint relation with a fixed `for _ in range(3)` and the
      docstring states that as the step's reach ("Three passes, so a chain settles backwards
      from the executor").

      Measured in-process against the deployed module (no file on disk was edited): mutating
      `range(3)` to `range(1)` or `range(2)` leaves EVERY assertion in the file green - all 12
      entries of CHECK_LOG_INVOCATIONS still reported, all 4 of NOT_A_CHECK_LOG_INVOCATION
      still silent, all 7 of MEASURED_CHECK_LOG_MISSES still [], all 8 exemption controls, all
      18 executor controls, the taint-step pin and the real-tree walk. Only the implementer's
      own M-C (`range(0)`) is killed, which is the weakest mutant in the family. So the number
      3 is narrative: nothing distinguishes it from 1.

      The residue the number leaves is also undisclosed. Because the step runs BACKWARDS from
      the executor, a chain declared in Python's normal define-before-use order propagates one
      link per pass, so four links exceed the budget and are missed:

          import subprocess
          C0 = "python r.py --check-log PATH"
          C1 = [C0]
          C2 = [C1]
          C3 = [C2]
          C4 = [C3]
          def _never_called() -> None:
              subprocess.run(C4)

      _check_log_invocations returns [] on that source (measured; depths 1-4 are reported,
      depth 5 and beyond are not). It is not an entry in MEASURED_CHECK_LOG_MISSES and not a
      sweep row G-17..G-22, so AC-6 ("whatever it still cannot see is recorded as a measured
      miss with a control") is not met for this route.

      The direction choice makes it worse rather than neutral. The implementation notes justify
      running backwards on the grounds that "the option-bearing end was already answered by the
      substring predicate", which is sound as to WHICH question to ask - but reverse-declared
      chains settle in one pass at any depth (measured: depths 1-6 all reported), while
      forward-declared chains cost one pass per link. The budget therefore bites exactly the
      ordering idiomatic Python uses, and the notes do not say so.
    suggestion: |
      Make it an actual fixpoint and delete the number: loop `while` the `executed` set keeps
      growing. The set is bounded by the names the module binds, so it terminates, and the
      claim then matches the mechanism with no residue to disclose and no magic constant for a
      later "optimisation" to shrink silently.

      If the bounded form is kept deliberately, it needs both halves R1 asks for: a positive
      control that is caught at range(3) and MISSED at range(2) (a three-link forward chain),
      and an entry in MEASURED_CHECK_LOG_MISSES plus a sweep G row for the four-link forward
      chain above, with the define-before-use asymmetry stated in the docstring.
    confidence: high
    source: static
    violates: ADR-0039/R1
