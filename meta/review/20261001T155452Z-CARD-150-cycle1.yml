  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: scripts/start_admin_local.sh
    line: 117
    title: "The two Docker branches check the database by NAME only, so they can green-tick a different server than the panel will read"
    description: |
      `docker exec nonogram-postgres psql -U postgres -d "$DB_NAME" -c "SELECT 1"`
      (:117) and the docker-compose equivalent (:119) use only the name sliced
      out of `$DATABASE_URL`; they discard its host, port, user and password.
      The Homebrew branch (:121) uses the URL itself. The Docker branches are
      tried FIRST, so with `DATABASE_URL` exported at a non-Docker server and a
      container that happens to hold a database of the same name, step [1/6]
      prints a green tick for a database the panel will never read — the card's
      own defect, one branch over.

      Narrow in practice (the default URL points at localhost:5432, which is
      where docker-compose maps the container), and the card puts the Docker
      paths out of scope "beyond making their check and the Homebrew check
      agree", so this is a residual rather than a contract breach. Noted because
      neither Docker branch has any runtime coverage: `_DOCKER_STUB` always
      exits 1 by design, so these two changed lines are verified by `bash -n`
      and reading only.
    suggestion: |
      Either document the limitation at the branch, or make the Docker branches
      assert the URL too (e.g. skip them when DATABASE_URL_SOURCE is "exported
      by the caller" and its host is not localhost). Out of this card's scope —
      a backlog note is an acceptable resolution.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: scripts/start_admin_local.sh
    line: 36
    title: "DB_NAME is string-sliced, so degenerate URL shapes make the tick lie again, and a driver-qualified URL the app accepts is refused"
    description: |
      `DB_NAME="${DATABASE_URL##*/}"; DB_NAME="${DB_NAME%%\?*}"` (:36-37) is a
      textual slice, not a URL parse. Two consequences:

      1. `export DATABASE_URL=postgresql://postgres@localhost:5432/` yields
         `DB_NAME=""`. `psql "$DATABASE_URL"` then connects to the server's
         DEFAULT database and succeeds, so step [1/6] prints
         "✓ PostgreSQL is running, database '' reachable (Homebrew)" — a green
         tick naming no database, which is the shape of the original defect.
         This one fails in the UNSAFE direction.
      2. `src/nonogram/db/session.py:69` `normalized_url` deliberately preserves
         an explicit driver, documenting that `postgresql+psycopg://` "is
         somebody's decision". `psql` does not understand that scheme, so the
         script now refuses a DATABASE_URL the panel would have used, reporting
         it as "Database 'x' is not reachable" rather than as an unsupported
         scheme. Fails in the safe direction, but the diagnosis misleads.
    suggestion: |
      Reject an empty DB_NAME explicitly ("DATABASE_URL names no database") and,
      if cheap, warn when the scheme is not one psql accepts
      (`postgresql://`/`postgres://`). Both are one `case`/`if` each.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

