      requires Prerequisites to name it. It drives none of them, so G-2 is
      untouched, and it relaxes by itself as each sibling is fixed. Proved
      both ways: with the old unqualified sentence restored it FAILS
      (`assert 'setup_admin_local.sh' in <prerequisites>`); with the scoped
