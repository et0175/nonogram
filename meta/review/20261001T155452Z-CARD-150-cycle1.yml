findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_start_admin_local.py
    line: 305
    title: "AC-3's message-capture clause is unverified — the mutant that throws alembic's message away survives all 18 tests"
    description: |
      Mutant M3a: remove `2>&1` from
      `if MIGRATION_OUTPUT="$(alembic upgrade head 2>&1)"; then`
      (scripts/start_admin_local.sh:186). The script then prints exactly the
      pre-card defect — alembic's message discarded — and all 18 tests pass.

      Measured side by side with identical stubs (scratchpad harness, stdout and
      stderr captured separately):
        pristine  -> stdout: "  alembic upgrade head said:" / "    FAILED: boom from alembic"   stderr: (empty)   exit 1
        mutant    -> stdout: "  alembic upgrade head said:" / "    (no output)"                 stderr: "FAILED: boom from alembic"   exit 1
      and `pytest tests/test_start_admin_local.py` on the mutant: 18 passed.

      Mechanism: `_ALEMBIC_STUB` (:73) writes its message with `printf ... >&2`, and
      `run_script` builds `Run.output` as `completed.stdout + completed.stderr`.
      So alembic's message is present in `run.output` whether the script quoted
      it or whether it merely leaked past the script to the terminal.
      `test_alembics_own_message_reaches_the_output` cannot tell those apart —
      which is precisely the distinction AC-3 is about ("alembic's own message
      appears in the output"). It is the only test for that clause.

      The production code is correct (verified live, above), so this is a finding
      against the test, not the script: the regression it exists to prevent is
      currently undetectable.
    suggestion: |
      Assert the script's OWN quoting rather than the message's presence anywhere.
      The script pipes the captured text through `sed 's/^/    /'`, so only the
      script can produce the four-space-indented form:

          for line in self.MESSAGE.splitlines():
              assert f"    {line.strip()}" in run.output, ...
          assert "(no output)" not in run.output

      Either assertion alone kills M3a. Alternatively keep stdout and stderr
      separate in `Run` and assert on stdout only — that also hardens the other
      17 tests against the same class of leak.
    confidence: high
    source: static
    violates: "AC-3"
    root_cause: RC-1
    status: fixed
    fix_note: |
      Fixed in the test, as the finding says: the script was already correct
      and is byte-identical (sha1 ba6aeb47c164f083ed529f4f0aa3e5a8df8e395d).
      `Run` now carries `stdout` and `stderr` separately alongside the
      unchanged `output` (= stdout + stderr), so no existing assertion was
      weakened, retargeted or removed.
      `test_alembics_own_message_reaches_the_output` keeps its three original
      assertions and adds two the leak cannot satisfy: every line of
      `MESSAGE` in the four-space-indented form that only the script's own
      `sed 's/^/    /'` can produce, asserted against the script's **stdout**,
      and `"(no output)" not in run.output`.
      M3a re-run both ways with the pristine snapshot restored by copy and the
      sha1 re-verified:
        mutant (`$(alembic upgrade head)`) -> 1 failed, 18 passed; the failure
          is `assert "    FAILED: Can't locate revision identified by
          'deadbeef'" in run.stdout`, with stdout showing `    (no output)`
          and the message sitting in stderr.
        pristine -> 19 passed.
      So M3a is now KILLED. The file holds 19 tests, all executing, no
      skipif/importorskip/marker.
