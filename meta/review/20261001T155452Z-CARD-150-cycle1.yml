  - id: F-002
    severity: medium
    category: tech-debt
    type: bug
    file: scripts/README.md
    line: 11
    title: "AC-4's own fix adds a false statement: 'a DATABASE_URL you exported yourself wins' is untrue for two of the three scripts the section governs"
    description: |
      The new Prerequisites bullet (scripts/README.md:9-14) states, unqualified,
      "a `DATABASE_URL` you exported yourself wins over it". `## Prerequisites`
      (line 5) precedes `## Scripts` (line 16), which documents three scripts:
      `start_admin_local.sh` (:18), `setup_admin_local.sh` (:51),
      `run_admin_tests.sh` (:71). The claim is true only for the first.

        scripts/setup_admin_local.sh:64  export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nonogram_poc"
        scripts/run_admin_tests.sh:24    export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nonogram_poc"

      Both overwrite the caller exactly as start_admin_local.sh did before this
      card. setup_admin_local.sh additionally still carries the other two
      defects verbatim: the bare `psql -c "SELECT 1"` Homebrew branch (:40) and
      the swallowed migration failure (:70-74, "⚠ Migrations may have issues").

      This is the card's own defect class — its Worktree notes name it: "all
      three were *descriptions*, and all three passed every test the project
      had". A reader who follows Prerequisites, exports DATABASE_URL and then
      runs setup_admin_local.sh gets nonogram_poc silently, which is the harm
      the card exists to remove. AC-4's test suite cannot see it: every README
      assertion is driven from a run of start_admin_local.sh only.

      ("**The scripts never create a database**" in the same bullet IS true —
      verified: grep for createdb/CREATE DATABASE/create_database across
      scripts/ finds only README prose and advice text in diagnose_postgres.sh.)
    suggestion: |
      Scope the sentence to the script it describes, e.g.:
      "`start_admin_local.sh` honours a `DATABASE_URL` you exported; the other
      scripts here still hardcode the project default." Fixing the sibling
      scripts is a separate card (their files are outside this card's Touches).
    confidence: high
    source: static
    violates: "AC-4"
    root_cause: null
    status: fixed
    fix_note: |
      All three documented scripts read first. `start_admin_local.sh` resolves
      the URL above the banner and honours an exported value, reporting the
      source at step [4/6]; `setup_admin_local.sh:64` and
      `run_admin_tests.sh:24` both still
      `export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/nonogram_poc"`
      over the caller's value. The sentence is scoped to be true, and now
      states the exception rather than hiding it:

        "The project default is
        `postgresql://postgres:postgres@localhost:5432/nonogram_poc`. In
        `start_admin_local.sh`, a `DATABASE_URL` you exported yourself wins
        over that default; `setup_admin_local.sh` and `run_admin_tests.sh` do
        not yet honour it — both still export the project default over
        whatever you exported, so edit them or set the URL afterwards."

      The sibling scripts are NOT touched (separate card). The companion claim
      "**The scripts never create a database**" is left as it stands: verified
      true of all three (`createdb`/`CREATE DATABASE` appear only in README
      prose and in diagnose_postgres.sh advice text).
      The reviewer's note that AC-4's suite cannot see this class of error is
      also answered, cheaply:
      `TestStartAdminLocal_ReadmeMatchesTheScript::test_a_claim_about_the_scripts_names_the_script_it_holds_for`
      requires the Prerequisites section still to state the precedence, then
