  2_verdict_on_the_tests_to_board_coupling:
    the_coupling: >-
      LEGITIMATE and sanctioned. Reading card files from tests/ is anticipated
      by this tree: tests/test_suite_profile.py:3581-3588 carries an explicit
      allowed-negative for "a card-registry walk, of which this repo invites
      many". The import of tests.full_suite_lock is legitimate (five tests/
      modules do it; main_repo_root is driven in both directions by
      tests/test_full_suite_lock.py:778-779), and no import-direction guard
      objects because tests/test_cli.py's walk is rooted at _PACKAGE_DIR
      (:781) and sees src/nonogram only. test_book_pdf.py is nevertheless the
      FIRST test in this tree to assert over real card files rather than
      synthetic ones, so it is the precedent, and it should be set carefully.
    resolving_the_board_to_the_main_working_tree: >-
      WRONG as implemented — see F2-001, reproduced on the real test. The
      round's diagnosis of WHY a naive read fails is correct and I reproduced
      it (304 vs 308 cards, CARD-309 among the four missing); the remedy makes
      the cell's verdict a function of a tree the branch does not control, and
      the docstring's claim that CI and a fresh clone see no difference is
      false of that verdict. Failure modes: in a fresh clone or any
      non-worktree checkout of this unmerged branch, the cell reds at :2123 on
      a card that is not a typo; and at any time, a board edit on main
      (CARD-309 marked done, renamed or removed) changes this branch's test
      result with no commit to this branch. In this repo's actual CI the harm
      is latent only because there is no CI: `ci/` and `.github/` do not exist
      on main or on the branch.
  3_is_the_bound_honestly_placed_and_is_there_a_third_direction:
    placement: >-
      HONESTLY PLACED. It is stated in three places and the earliest of them
      is where a reader meets the claim, not after believing it:
      `RasterDeclaration.expires_with`'s own field docstring (the first thing
      a reader of the field sees) states the two directions and that neither
      implies the other; the _RASTER_DECLARATIONS block states them again
      under an explicit heading "The bound both directions leave"; and
      ADR-0042/R2's comment states what its ref does NOT reach. The round also
      genuinely CORRECTED the old claim rather than appending to it — the
      sentence that AC-3's expiry check "exists to force" the shrink is
      replaced with the measurement that it forced the conversion direction
      only. One place still carries the old half-claim: the CARD itself
      (see amendments 1 and 2).
    third_direction: "YES — attribution. See F2-003. Not covered by either test, and it is the direction cycle 1's F-002 defect actually lay in."
  4_are_the_four_AST_pins_still_at_880_untouched:
