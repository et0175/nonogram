findings:
  - id: F2-001
    severity: important
    confidence: high
    source: "measured — reproduced on the real test"
    title: "The landing guard's board root reaches outside the branch, and the docstring's defence of that is measurably false of the test's verdict"
    where: "tests/test_book_pdf.py:1961-1986 (_board_cards), failing assertion at tests/test_book_pdf.py:2123"
    node_id: "tests/test_book_pdf.py::test_no_declaration_outlives_the_cards_that_remove_it"
    what: >-
      `_board_cards()` returns `full_suite_lock.main_repo_root(<repo>) /
      "meta" / "kanban" / "cards"`. In a linked worktree that walks back to the
      main checkout, which is why the cell is green here. In an ORDINARY
      checkout `.git` is a directory, `main_repo_root` falls through to
      `return worktree` (tests/full_suite_lock.py:167), and the board read
      becomes the BRANCH's own 304-card snapshot — which does not contain
      CARD-309.md, the card all five interior declarations now name. The
      typo assertion at :2119-2123 then fires on a card that is not a typo.
    reproduction: >-
      Instrument proven on the unmutated tree FIRST, so a crash or an empty
      selection could not be mistaken for a result:
        PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -o addopts='' -p no:randomly -q \
          tests/test_book_pdf.py::test_no_declaration_outlives_the_cards_that_remove_it \
          tests/test_book_pdf.py::test_a_declaration_outliving_its_done_card_is_a_defect
        -> 2 passed (2 selected, nothing skipped)
      Then the same two node ids with ordinary-checkout semantics, imposed by
      an OUT-OF-TREE pytest plugin (no file in the worktree modified, no
      mutant, blob untouched) whose only act is
      `full_suite_lock.main_repo_root = lambda worktree: worktree`:
        PYTHONPATH=<scratchpad> ... -p ci_plugin <same two node ids>
        -> 1 failed, 1 passed
        FAILED test_no_declaration_outlives_the_cards_that_remove_it
        tests/test_book_pdf.py:2123: AssertionError
          Left contains one more item: 'CARD-309'
      Independent second reading, re-implementing the two board assertions
      from scratch against both trees: main board 308 files, named cards all
      present; this worktree's board 304 files, CARD-309 missing, statuses
      [(CARD-231, ready), (CARD-299, ready), (CARD-309, None)].
    the_false_claim: >-
      `_board_cards`'s docstring and the commit message both say: "In an
      ordinary checkout it returns the checkout itself, so CI and a fresh
      clone see no difference." The first clause is true. The conclusion is
      false: the no-difference case is PRECISELY the case that reds, because
      the board it then reads is the snapshot the redirection exists to avoid.
    severity_reasoning: >-
      Important, not gating. It is a false RED, never a false green. The
      merge gate runs from the main working tree, so merge is not blocked;
      after merge, main's tree carries CARD-309.md and a fresh clone of main
      is green. And this repo has no CI pipeline at all — `ci/` and
      `.github/` are absent on both main and the branch — so the "CI reds"
      half is latent rather than live. What keeps it at `important` is the
      tracked false claim (cycle 1's F-004 class) plus the durable property:
      the cell's verdict is a function of a sibling WORKING TREE the branch
      does not control — not of a commit, so it is not reproducible from the
      commit, and it includes whatever is uncommitted there (this session
      observed `M meta/kanban/dispatcher.state` in that tree at one point and
      clean at another, without any commit to this branch in between).
      Marking CARD-309 `done` on main reds this branch's suite with no commit
      to this branch.
    what_is_NOT_wrong_here:
      - "The coupling itself is sanctioned, not novel. tests/test_suite_profile.py:3581-3588 carries an explicit allowed-negative case for `a card-registry walk, of which this repo invites many`, added by its own review cycle 2 (F-104). test_suite_profile.py is green."
      - "The import is legitimate and the cited precedent is real. Five tests/ modules import full_suite_lock (conftest.py, kill_matrix.py, test_book_pdf.py, test_full_suite_lock.py, test_kill_matrix.py). main_repo_root specifically is driven in BOTH directions by tests/test_full_suite_lock.py:778-779 (linked -> main, main -> main), so it is not an untested helper."
      - "No import-direction guard objects. tests/test_cli.py's structural walk is rooted at `_PACKAGE_DIR.rglob(\"*.py\")` (:781) — src/nonogram only — so it never sees tests/ imports."
      - "The reason the redirection was added is real and I reproduced it: without it, CARD-309 reads as a card the board never heard of, i.e. the typo case, and the live cell would ship red. The round's diagnosis is right; the remedy chosen is what I am objecting to."
    recommendation: >-
      Preferred: hoist the LANDING direction out of tests/ into the board's
      own gate, where the board is the authority and the tree-under-test
      problem does not arise, leaving tests/ with the conversion direction and
      the synthetic control (which is the half that carries the real
      discrimination anyway). Second best: keep `_board_cards()` but split the
      two clauses — the landing clause strict, the "named card is on the
      board" clause tolerant of a board snapshot older than the declaration.
      NOT by a conditional skip: a skipped gate test is an ungated door.
      Minimum, and non-negotiable before merge: delete the false sentence.
    cost: "minutes for the docstring; ~1h for the hoist"
  - id: F2-002
    severity: important
    confidence: high
    source: "measured on main"
    title: "The bare-name ref is a shim, and on main it is ALREADY text-revived by this card's own cycle-1 review YAML"
    where: "meta/architecture/decisions/adr/0042-book-interior-is-vector-cover-stays-raster.md:403"
    what: >-
      The spelling is correct for this validator and I verified why, not just
      that: `symbol_exists` (validators/utils.py:237-264) is
      `git grep -lw <name> -- . <excludes>`, and the excludes are built at
      :336-338 as exactly `[":(exclude)<arch_root>", ":(exclude)*.md"]`.
      `split_check_ref` (:268) splits on commas only. So a `path::name` ref is
      one literal symbol that cannot match, and the bare name is the only
      spelling that resolves — R5's own measured precedent in the same file.
      BUT the resolver is a pure TEXT search and meta/review/**, meta/kanban/**
      and meta/profiling/** are NOT excluded. Measured on main today:
        git grep -lw "test_every_raster_page_is_declared_with_its_reason" \
          -- . ":(exclude)meta/architecture" ":(exclude)*.md"
        -> meta/review/20261029T073500Z-CARD-298-cycle1.yml   (rc=0)
      That file is tracked (`git ls-files meta/review/ | grep CARD-298`) and
      holds the literal three times. It is not a definition. So after merge,
      ADR-0042/R2's check reads alive even if the test is deleted or renamed —
      the exact mechanism of ADR-0042/R4 and FR-046, arrived at from the other
      side.
    verdict_asked_for_by_the_brief: >-
      The bare name is the right END STATE given this resolver, and the round
      was right to deviate from the brief. It is nevertheless a SHIM against a
      text resolver, and it should be RECORDED as one rather than left to read
      as a clean flip.
    recommendation: >-
      Record the shim on CARD-307, which already owns R4 — one line beside
      R4's entry: "R2's bare-name ref resolves correctly today and is already
      text-revived on main by CARD-298's own review YAMLs; both refs want the
      same resolver fix (a definition-shaped search, or excluding
      meta/review/ and meta/kanban/ from the pathspec)." Do NOT change R2's
      spelling: the alternative is strictly worse (108 warnings, a fresh DEAD
      check ref, which the round measured and I reproduced the mechanism of).
    disclosure: "This review YAML adds another reviving hit for the same literal. Unavoidable given the resolver; stated rather than hidden."
    cost: "minutes (a line on CARD-307)"
  - id: F2-003
    severity: minor
    confidence: high
    source: "measured"
    title: "A THIRD direction is uncovered: attribution. Nothing checks that a card named in expires_with is a card that will actually remove the exception"
    where: "tests/test_book_pdf.py:1619-1624 (format only), :2048 (status only)"
    what: >-
      The brief asks whether a third uncovered direction exists. It does, and
      it is cycle 1's F-002 defect itself. `expires_with` is read in exactly
      three places, all in tests/test_book_pdf.py and all measured by git grep
      over src/ and tests/: the finding message (:1612), a
      `re.fullmatch(r"CARD-\d+")` FORMAT check (:1620), and the new landing
      walk (:2048). Nothing checks that the named card plausibly owns the
      conversion. CARD-299 was named for five kinds and converts no page;
      the retarget to CARD-309 is a HUMAN judgement that happens to be right
      (I verified CARD-309's Touches names book_pdf_generator.py and the four
      vector writers), and a future `expires_with=("CARD-231",)` on TITLE
      would be accepted silently and would merely defer the red.
      Sub-case: a named card that is `parked` reads cleanly and is not done,
      so the declaration is never challenged. `parked` is in _BOARD_STATUSES
      and one card on the board carries it.
    why_it_is_minor: >-
      The degradation is graceful in the direction that matters: a mis-named
      card that closes without converting REDS the landing cell, which is the
      "come and look" behaviour wanted. So this is a residual bound to state,
      not a hole to close here — closing it mechanically would mean a test
      reading another card's Touches, deepening exactly the coupling F2-001
      objects to.
    recommendation: >-
      Name it in the registry comment's "The bound both directions leave"
      paragraph (src/nonogram/admin/book_pdf_generator.py, the
      _RASTER_DECLARATIONS block), which today names only the
      done-vs-converted bound. One sentence: the board is the authority for
      "done" and for nothing else — that the card named is the card that
      removes the exception is a human claim, and a parked card holds a
      declaration indefinitely without challenge.
    cost: "minutes"
  - id: F2-004
    severity: minor
    confidence: high
    source: "measured"
    title: "The status counts in the docstring have already drifted — in the same file whose next comment refuses to restate a count for exactly this reason"
    where: "tests/test_book_pdf.py:1945-1951"
    what: >-
      The docstring records "``done`` 264, ``ready`` 39, ``in progress`` 2,
      ``blocked`` 2, ``parked`` 1" of 308, measured 2026-10-29. Measured on
      main today, same day: done 265, ready 39, in progress 1, blocked 2,
      parked 1, of 308. CARD-291 moved from `in progress` to `done` on its
      merge (70f8e07e), two cells out within hours. Thirty lines later, at
      :2098-2102, the same commit writes "A floor, deliberately NOT the
      count: ... a number restated beside the mapping is the drift CARD-261
      found twice." The docstring commits the sin its own neighbour names.
    what_is_NOT_wrong: >-
      The load-bearing part — the five-spelling SET — is mechanically PINNED,
      not guessed, which is what the brief asked. The live cell asserts every
      one of the >=300 cards has a status this file can read
      (tests/test_book_pdf.py:2111-2114), so a sixth spelling on the board
      reds. ADR-0039/R2's direction is satisfied.
    recommendation: "Drop the five counts, or replace them with the floors the test already asserts (>=200 done, >=10 non-done)."
    cost: "minutes"

