verdict: >-
  Strong, unusually well argued work with a measured hole in the exact claim it
  was created to answer. The canonical rebuild is real: no unnamed bundle field
  reaches the site, the served file is byte-equal to a rebuild from five fields,
  the byte-identical state-module copy holds, and 4 of the round's 26 declared
  mutants re-fired on exactly the control named. But the capacity bound is
  measured against the wrong threshold: EC-048 forbids data from which ANY
  solution cell is recoverable, while the deployed bound only excludes a whole
  grid, and 56 of a published 10x10 answer's 100 cells travel end to end
  through the served `tier` field with check_capacity() satisfied and the
  card's own EC-048 sweep reporting the site clean (F-1, measured). Two of the
  card's four AC/EC controls are also measurably dead for cases their own
  statements name: a fourth weakening of `isClueSolved` (drop the last column)
  leaves all 23 tests green (F-2), and EC-050's seeded walk performs no drag
  and never presses Reset, so a planted POST on either path is missed by every
  test in the card (F-3). All three are cheap and local to fix. Not certified;
  re-run after the three gating findings.

findings:
  - id: F-1
    severity: high
    title: >-
      The served `tier` is a 56.46-bit channel: 56 cells of a published answer
      reach the site with the capacity check satisfied and the EC-048 sweep
      clean. The MIN_SIZE**2 ceiling is the wrong comparison for EC-048's
      one-cell threshold, and the tier value space is a hand-written superset
      of an enumerable domain (ADR-0039/R2).
    file: player/assemble.py
    line: 202
    gating: true
    confidence: high
    evidence: >-
      MEASURED. `SERVED_VALUE_SPACE["tier"]` counts every lowercase string of
      1..12 characters (99,246,114,928,149,463 values = 56.46 bits) of the
      65.25 bits the bound spends, against CAPACITY_CEILING_BITS = MIN_SIZE**2
      = 100. I stored `difficulty_tier` = a 12-character base-26 encoding of
      the first 56 cells of GRIDS["min"]'s answer ("tqlhkuhxpmgj"), assembled,
      and read it back: the served puzzle/<key>.json carries the string
      verbatim, the 56 bits decode to an EXACT match of the answer's first 56
      cells, report.capacity_bits = 65.25 < 100 (so `check_capacity` passes),
      report.refused is empty, and `sweep_tree(site)` returns {} — the tier is
      12 characters, below MIN_TOKEN = 15, so the belt cannot see it either.
      EC-048's registry statement forbids "data from which any solution cell is
      recoverable"; the deployed argument ("a channel that cannot hold the
      smallest published grid cannot hold any grid") only excludes a whole
      grid, so it does not establish the rule it is offered for. The precondition
      is a store-written tier outside easy/medium/hard — which is precisely the
      threat model CARD-282 cycle 2 routed to this card (a field whose
      provenance is a named good source). Separately, the alphabet-and-length
      rule is hand-written while the runtime has an enumerable authority
      (src/nonogram/admin/book_plan.py TIERS = EASY/MEDIUM/HARD), which
      ADR-0039/R2 — in this card's own System contract — forbids.
    remedy: >-
      Derive the served tier set from the tier enum rather than from an
      alphabet: load the vocabulary the way `_limits()` loads limits.py (or
      keep a 3-label allow-list with a completeness test against the enum per
      ADR-0039/R1-R2) and drop anything else to "". `SERVED_VALUE_SPACE["tier"]`
      then becomes 4 (three labels plus "") and total capacity ~10.8 bits. Then
      state the ceiling against EC-048's actual threshold (one cell = 1 bit) or
      say explicitly that the bound is "no served field is wide enough to be
      worth encoding in" plus "every non-exempt field is drawn from an
      enumerated domain" — the second clause is the one that actually closes it.
    disposition: must fix before merge
