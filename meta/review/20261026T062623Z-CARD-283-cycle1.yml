    The validator deltas (main 121 warnings with AC-383..386 DEAD; this
    worktree 117 with all four resolved; COMP-011's "code not present yet"
    info gone). Accepted from the orchestrator, not re-derived.
  - >-
    Any suite outside tests/test_public_player.py. Per the brief the full suite
    was never run; NONOGRAM_FULL_SUITE_LOCK was redirected on every run. G-1
    and G-2 were verified structurally instead — `git diff 423c09f3..HEAD
    --name-only` is exactly the six files, none under src/.
  - >-
    A real phone and a real iOS Safari. I did verify the riskiest layout claims
    under Chromium MOBILE EMULATION (viewport 390x844, is_mobile, has_touch,
    device_scale_factor 3) against the 30x30 board, and they hold — cell 29 px,
    document horizontal overflow 0, both clue gutters computed `sticky`, the
    far corner scrolled into view inside the stage with the row clues still
    visible and the page still not scrolling, and a real `touchscreen.tap`
    marks a cell. That is emulation, not WebKit, and `position: sticky` inside
    a scroll container plus `touch-action` are exactly where iOS diverges.
  - >-
    Pinch zoom (asserted only as "not forbidden"; unchanged by this review).
  - >-
    Vercel itself. The rewrite is exercised through the same vercel.json the
    host would read, but no deploy was made.
  - >-
    A live `export_bundle` -> `assemble` pass. The assembler still has only
    fixture bundles under it, whose field names come from
    player_bundle.PUZZLE_FILE_FIELDS; F-1's channel was measured on a fixture,
    and what a real store writes into `difficulty_tier` was not surveyed
    beyond finding the enum that defines the domain.
  - >-
    22 of the round's 26 declared mutants. I re-fired 4 as a sample (title
    carried through the served schema; the state-module copy gaining a byte;
    the 18 px cell floor; the heavier rule on every line) and all four red on
    exactly the control named, so the record reads as honest. The ones I
    re-fired in full are the mutations behind the gating findings above.

corrections_to_the_brief:
  - >-
    The wide-screen empty stage box IS a defect rather than intended
    scroll-container behaviour, and it is mild. Measured: 942 px of empty
    bordered box beside a 465 px board at 1440 px (F-11), with a one-line
    remedy. No assertion anywhere reads the desktop layout.
  - >-
    The brief's second question (assemble.py loading limits.py by path)
    resolves in the round's favour. For a moved file `spec_from_file_location`
    returns a spec whose SourceFileLoader raises FileNotFoundError on
    `exec_module`, so the script fails loudly at import; the `if spec is None`
    RuntimeError is genuinely unreachable (its `pragma: no cover` comment is
    honest, if its message is dead text). The single-sourcing is also
    cross-checked from the test tree — `CAPACITY_CEILING_BITS == MIN_SIZE *
    MIN_SIZE` and the MAX_SIZE+1 / 0 extent cases hold the assembler's values
    to `nonogram.limits`. There is no control for the loud failure itself, and
    I do not think one is worth writing.
  - >-
    "Is the rebuild genuinely a rebuild, can an unnamed field reach the site?"
    — verified, yes it is a rebuild and no. `served_puzzle` constructs the
    object literally, asserts its key set against SERVED_SCHEMA, and the
    served bytes are held byte-for-byte to an independent rebuild from (key,
    extent, tier, clues); the file name is the validated key; index.json and
    book/<slug>.json are left out and named in the report. The only
    copy-through paths are the two exempt/narrowed ones, which is where F-1
    and F-5 land. Re-fired the round's "title carried through" mutant: both
    named controls red.
  - >-
    "Does the sweep's live control actually fail if the sweep breaks?" — for
    the base-64-of-the-packed-grid reading, yes: EXEMPT_FIELDS is
    {clues, key, puzzle_keys}, so the bundle's titles are NOT redacted and the
    control sees them. But it is one positive control for one decoder: break
    base32, base85, hex or the cell-alphabet folding and the control still
    passes on base64 alone. Worth one case per decoder family if the sweep is
    meant to be load-bearing (it is explicitly called "a belt", so I am not
    gating on it).
  - >-
    The round's F-2 understates its own support. It presents "the header shows
    no title" as a body-vs-AC divergence resolved in the AC's favour; EC-048's
    registry statement forbids "the picture name" in any served asset by name,
    so the card body's "the header with title and tier" was never
    implementable. The decision is required, not chosen.
  - >-
    Two bookkeeping notes. The round's F-1 says the five files are left staged
    and uncommitted so the validator's `git grep` can see them; they are
    committed at ddd22515, so that paragraph is stale. And
    meta/kanban/cards/CARD-283.md is MODIFIED-but-uncommitted in the worktree
    (250 added lines — the round's own worktree notes), so a merge that takes
    only the committed revision would lose them.
