  - id: F-5
    severity: medium
    title: >-
      "clues cannot be borrowed as a free numeric channel" is false as stated —
      the exempt field's own capacity is 143 bits at 10x10 against a 100-bit
      ceiling, and `_clues` accepts clue sets no grid can produce.
    file: player/assemble.py
    line: 301
    gating: false
    confidence: high
    evidence: >-
      MEASURED. Under `_line`'s rule a line of 10 cells admits 144 distinct
      clues (7.17 bits); 20 lines of a 10x10 therefore carry 143.4 bits, and a
      30x30's 60 lines carry 1263.3 bits — both above CAPACITY_CEILING_BITS =
      100. The validation is fit-the-line plus filled-count agreement between
      the axes, which does not imply the clue set came from a grid:
      `_clues({"rows": [[1,1]] + [[0]]*9, "columns": [[2]] + [[0]]*9}, 10, 10)`
      is ACCEPTED (both axes total 2) although no grid realises it. So the
      field is exempt by ADR-0041 (R5/R1 and R2's own second sentence), not by
      anything this module establishes; the clue values' integrity rests on the
      exporter computing them with compute_clues upstream, which is where the
      real guarantee lives.
    remedy: >-
      State the exemption as what it is — "clues and key are exempt by
      ADR-0041/R2; their integrity is ADR-0041/R5's, upstream of this script" —
      and delete the stronger claim, or close it for real by checking the
      served clues solve to exactly one grid whose ADR-0041/R1 key equals the
      file's name. The second option is the only one that makes the exemption
      self-supporting, and it needs the solver, so it is an ADR-level decision
      about what the static build may depend on, not a worktree one.
    disposition: reword the claim this cycle; the realizability check is an ADR question
  - id: F-6
    severity: low
    title: >-
