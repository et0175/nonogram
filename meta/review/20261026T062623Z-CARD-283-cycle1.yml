  - id: F-10
    severity: low
    title: >-
      The third-party-asset guard carries an unused exemption with no control
      ("or openapi.vercel.sh in text"), which ADR-0039/R3 — in this card's
      System contract — forbids.
    file: tests/test_public_player.py
    line: 1511
    gating: false
    confidence: high
    evidence: >-
      `assert "https://" not in text or "openapi.vercel.sh" in text` runs over
      play.js and play.html only. The string occurs nowhere in either file — it
