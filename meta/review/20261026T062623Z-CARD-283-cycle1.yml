  - id: F-11
    severity: low
    title: >-
      On a wide screen the bordered stage spans the page while the board fills
      a fraction of it — a real cosmetic defect, not scroll-container
      behaviour, and no test reads the desktop layout at all.
    file: player/player.css
    line: 168
    gating: false
    confidence: high
    evidence: >-
      MEASURED in headless Chromium at 1440x900: for the 10x10 the stage is
      1408 px wide and the board 465 px, leaving 942 px of empty bordered box
      to the right of the board (for the 30x30 it is 22 px, so the effect
      scales with how small the puzzle is). `.player-stage` is a block element
      with `overflow: auto`; a scroll container only needs the available width
      when its content overflows, so the full-width box is not required by the
      scrolling behaviour the comment defends. This confirms the orchestrator's
      visual reading and answers its question: a defect, mild.
    remedy: >-
      `.player-stage { width: fit-content; max-width: 100%; }` (optionally
      `margin-inline: auto`) keeps the border on the board and leaves the phone
      behaviour — content wider than the stage, stage scrolls, page does not —
      unchanged. Worth one desktop-width assertion so the regression is
      measurable.
    disposition: fix in this cycle; the owner validates visually
  - id: F-12
    severity: low
    title: >-
      EC-048's registry text carries no clue exemption, so the served clues
      violate its literal wording; the exemption exists only in ADR-0041/R2's
      second sentence and Context.
    file: meta/architecture/requirements.yml
    line: 5086
    gating: false
    confidence: high
    evidence: >-
      EC-048 reads "no file carries a solution grid, a filled-cells encoding,
      the picture name, or data from which any solution cell is recoverable".
      Every served puzzle/<key>.json carries the clues, from which every cell
      of a uniquely solvable puzzle is recoverable by solving — which the card
      states honestly as a bound it does not close and which ADR-0041 sanctions
      ("the solved state is detected from clue satisfaction alone"). As written,
      the EC is unsatisfiable by the design its own ADR mandates, and a future
      reader has to reconstruct the exemption from the ADR. Same family as the
      round's F-4 (EC-048's ref naming only the bundle half), and like it,
      outside this card's declared Touches.
    remedy: >-
      Amend EC-048 to name the clue projection as the one sanctioned exemption
      (as it already names the picture name as forbidden), and make the ref the
      comma-separated pair the round's F-4 asks for. Architect/owner edit, one
      card of its own or a kanban follow-up.
    disposition: report only (outside Touches); raise with the architect

