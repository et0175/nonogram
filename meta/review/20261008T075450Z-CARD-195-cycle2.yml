  - id: F-004
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/static/admin.css
    line: 497
    title: "A pinch on a board cell (AC-6's own scenario — Region off, the default) committed a real native browser page pinch-zoom, not just this card's own --player-zoom"
    description: |
      Found via the owner's visual inspection of midpinch-duck15-phone-200.png (upside-down
      column-clue numerals) and confirmed with CDP's Page.getLayoutMetrics: after the exact
      touchStart/touchMove/touchEnd sequence AC-6 exercises, window.visualViewport.scale
      committed to ~1.54 with a nonzero offset (the native zoom commits asynchronously — not
      yet visible immediately after touchEnd, only after a short settle, which is also why the
      cycle-1 AC-6 test — checking only window.scrollX/scrollY, which stay 0 regardless — did
      not catch it). Root cause: .player-cell's touch-action was "auto" whenever Region is off,
      and touch-action is evaluated by the compositor thread before the main thread's JS runs,
      so solver.js's own preventDefault() calls (pointerdown of the second finger, pointermove
      during the pinch) could not retroactively cancel a native gesture the compositor had
      already committed to recognizing.
    suggestion: |
      Fixed: touch-action: auto → pan-x pan-y on .player-cell (Region-off case only; the
      Region-on case, touch-action: none, is untouched). pan-x pan-y preserves single-finger
      panning (confirmed: all of test_puzzle_solver_phone.py's and
      test_puzzle_solver_brush_menu.py's actual pan/drag behavioral tests stayed green,
      unedited) while dropping the browser's own pinch-zoom/double-tap-zoom eligibility, so
      solver.js's own pinch handler is the only thing that can act on a two-finger touch
      starting on a cell. Verified fixed via the same Page.getLayoutMetrics check (scale back
      to 1, offset back to 0) and via a mutation check (reverting the CSS value made the
      strengthened AC-6 assertion fail with the exact scale value observed in the original bug,
      1.5384615659713745, then passed again on revert).
    confidence: high
    source: static
    violates: "G-1 (this card's own: zoom must change no browser-visible state beyond --player-zoom); pinch rule (a) (a pinch on a cell is THIS card's own zoom, nothing else)"
