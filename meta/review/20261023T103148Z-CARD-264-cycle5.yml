findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 3157
    title: "The declared-miss contract's \"adding one, deleting one ... all red\" is wider than any case or mechanism holds: deleting the span-equality check leaves 167/167 green"
    description: |
      The contract written above `_MEASURED_TABLE_LINE_KEYS` states, as clause 2:
      "Gutting a line, inverting it, adding one, deleting one, or moving a keyed phrase
      onto a neighbouring line of the same entry all red." The card repeats it
      (`## Worktree notes -- fix round 4`, SEMANTICS 2: "adding a line or dropping one
      all red, by line number"). Three measurements refute the claim as stated.

      (a) MUTANT SURVIVES. `tests/test_guard_integrity.py:3157` --
      `if span != len(element_keys):` -- is the only code that implements the
      add/delete directions. Mutating it to `if False and span != len(element_keys):`
      (line-count preserving, `old` pre-counted at exactly 1 occurrence) leaves the
      suite green: `tests/kill_matrix.py`, target `tests/test_guard_integrity.py`,
      selection the whole file, 210 ast.Assert nodes, SHIPPED 0 FAIL of 210 reached at
      pytest exit 0 with 167 collected -- mutant M2-SPAN-EQ-DROP reports exit 0, 210
      reached, **0 FAIL**. Confirmed at test level by a plain run of the mutated file:
      **167 collected, 167 passed, exit 0**. `_unkeyed_declaration_lines` has no reader
      outside this file (grep over tests/*.py), so that run is the complete reading.

      (b) THE ADD DIRECTION HAS NO CASE AT ALL. Appending an unkeyed continuation line
      to the fabricated entry used by
      `test_the_line_keying_control_reds_on_a_gutted_or_inverted_line` gives, from the
      deployed function, `['fab.py:2: MEASURED_FABRICATED_MISSES[0] spans 3 source
      line(s) and carries 2 key(s)']` -- and `[]` once :3157 is bypassed. That test's
      own docstring enumerates "the four ways a declaration can move out from under its
      key" (gutted / inverted / moved / dropped); "adding one" is the fifth way the
      contract claims and it is constructed nowhere. The round's 216-variant sweep does
      not cover it either -- its four mutations are gut, drop-a-word, alter-a-character
      and swap-with-the-line-above, none of which changes an entry's line count. My own
      197-variant replication inherited the same blind spot.

      (c) THE DELETE DIRECTION IS SILENT WHEN BOTH HALVES ARE CO-EDITED, which is the
      realistic edit. Dropping the declaration line
      `" trailing / and no _PATH_SUFFIXES suffix), not read as a keyword, and"` from
      `MEASURED_CLAIM_MISSES[2]` **together with its key phrase** gives a deployed
      verdict of `[]`, and every value-read assert in the entry's committed case still
      passes (`"whose span reaches _is_type_expression"`,
      `"whose every ast.Name resolves in dir(builtins)"`, `"not a bare identifier
      chain"` are all still present). The floor pin at `:4703` (`assert keyed >= 45`)
      reads 56 after the co-edit and does not notice -- the measured figure is 57, so
      the pin carries 11 lines of slack. The clause that silently leaves is the path/
      keyword arm this very round added as F-2, i.e. the contract permits the entry to
      shrink back to exactly the round-3 wording that round 4 exists to correct.

      The `dropped` case does not discriminate the mechanism: with :3157 bypassed it
      still reds, but at `fab.py:3` instead of `fab.py:2` and for a different reason (a
      neighbouring line failing a phrase check) -- a misattribution, not a control.

      Diagnosis of why the round did not find this: 8 of its 9 mutants mutate
      declaration text or a comment figure, and the 9th reverts one behaviour change.
      None deletes a mechanism the contract's claims name -- the board's own rule ("a
      fix must mutate by DELETING each mechanism its claims name") is what this
      survivor is the price of.
    suggestion: |
      Two halves, both in the same commit (widening a claim and pinning its shape are
      the same edit):
      1. Narrow the claim, or hold it. Either restate clause 2 (and the card's SEMANTICS
         2, and `test_the_line_keying_control_...`'s docstring) to the four directions
         that are constructed, or keep the five and add the two missing cases to the
         fabricated table: a line appended with no key (reds via :3157) and a line
         dropped together with its key (needs the next item to red at all).
      2. Pin each entry's key shape to a measured equality rather than a floor. Replace
         `assert keyed >= 45` with an equality against a per-table
         `{name: (entries, lines)}` declaration re-derived from
         `_MEASURED_TABLE_LINE_KEYS` -- today 5 tables / 12 entries / 57 lines -- so a
         co-edited shrink has to be a deliberate edit to that figure. A floor cannot
         see a shrink, which is the whole of (c).
      What would still be uncertified if this shipped on my word alone: that the new
      equality itself can fail (it needs its own mutant -- shed one key group and
      confirm the red names the table), and that the two added cases are not satisfied
      by the same accidental neighbour-line mismatch that carries `dropped` today. Both
      require a measurement no reviewer's prescription supplies.
    confidence: high
