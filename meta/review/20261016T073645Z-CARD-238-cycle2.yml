findings:
  - id: F-101
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_suite_profile.py
    line: 1289
    title: "The residual-miss disclosure is false: the whole-module comparison catches only couplings whose outcome varies with the SANDBOX log, and a plausible-refactor live-log read survives all 41 guard tests"
    description: |
      `_live_log_references`' docstring (lines 1287-1296) states of its three
      disclosed misses: "All three are caught by the behavioural comparison in
      :class:`TestSuiteTiming_CollectsTheSameWithAndWithoutTheLog`, which judges
      the whole module by outcome rather than by spelling". The class docstring
      (lines 1739-1741) makes the same promise: "What it cannot see -- a path
      assembled across modules, or read at run time -- is caught by outcome
      instead, in the class below."

      The orchestrator asked for that claim to be verified by mutation. It does
      not hold. Three executed mutants, each reverted from a pre-captured copy
      (md5 c97b27fbb2b25943a867af2136e61f52 / 1dab65e2e0d79581ef5dd48d971968fe
      restored and verified after every one):

        MUT-R  the log path constant defined in meta/profiling/rank_durations.py
               (`LIVE_TIMING_LOG = Path(__file__).resolve().parents[2] / "meta"
               / "kanban" / "suite-timing.log"`), read by a test as
               `ranker.timing_log_entries(ranker.LIVE_TIMING_LOG.read_text())`,
               on a host where the log exists   -> SURVIVED, 41 passed
        D2b    `Path(os.environ.get("CARD238_MUT_LOG", ...))` pointing at a file
               that exists (the disclosed env-var miss)  -> SURVIVED, 41 passed
        D1c    a sibling module under tests/ reached through the sandbox's
               per-file symlink, reading `REPO_ROOT / "pyproject.toml"` where
               REPO_ROOT = Path(__file__).resolve().parent.parent
                                                          -> SURVIVED, 41 passed

      D1c is the mechanism and it generalises: `_build_sandbox` mirrors `tests/`
      as symlinks and symlinks `meta/profiling` wholesale, so ANY module reached
      that way has `Path(__file__).resolve()` resolve through the link to the REAL
      repository. Its paths therefore point at the real tree, its outcome does not
      change between the with-log and without-log sandboxes, and
      `present == absent` plus `set(present.values()) == {"PASSED"}` both hold
      vacuously. MUT-R is that mechanism carrying the card's actual defect: a test
      asserting on the live log, red on a machine without it and green on one with
      it — CARD-234-green-at-11-skips vs CARD-235-red-at-9 restored verbatim —
      with every guard green.

      MUT-R is a plausible refactor, not deliberate evasion. The test module
      already loads the ranker (`_load_ranker()` / `ranker.*`), the card's own
      declined Option 2 is "a `rank_durations.py --check-log` subcommand", and
      `meta/profiling/rank_durations.py` is now in this card's `Touches:` — so the
      log path constant landing there is the single most likely next move. The AST
      guard cannot see it because `_test_sources()` walks `tests/` only; the
      comparison cannot see it because `meta/profiling` is symlinked.

      This is cycle 1's F-001 one indirection further out, with the aggravating
      difference that the code now asserts in writing that the case is covered. A
      disclosed gap is a bounded claim; a gap the docstring says is closed is not.
    suggestion: |
      Any one of these closes it; the first makes the disclosure true as written.
        1. Copy `meta/profiling` into the sandbox instead of symlinking it (and
           copy, not symlink, any `tests/` file the module imports), so a
           cross-module path resolves the SANDBOX root and its outcome does flip
           with the log. Then add MUT-R as a positive control: a fabricated module
           outside `tests/` whose outcome must be PASSED with the log and FAILED
           without, exactly as SANDBOX_CONTROL_MODULE already does for `tests/`.
        2. Widen `_test_sources()` to the tracked `*.py` under `meta/profiling/`
           as well as `tests/` — one line, and it catches MUT-R structurally.
        3. If neither is wanted, correct both docstrings to what is true: the
           comparison catches a coupling only when its outcome changes with the
           sandbox log, so a path that resolves the real repository root from
           outside `tests/` is caught by NEITHER guard. State it, and the claim
           becomes honest again.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1395
    title: "A module-level pytest.skip(allow_module_level=True) on the log silences the whole module including both guards, and neither guard sees it"
    description: |
      `_skipif_decorators`' docstring claims "All six forms are now reported" and
      names its two remaining limits (a helper that skips; a skip keyed on an
      environment variable). It misses a third, which is pytest's own documented
      imperative module-skip and the exact twin of the `pytestmark` form cycle 1
      called the worst of the five (F-003):

        MUT_TIMING_LOG = REPO_ROOT / "meta" / "kanban" / "suite-timing.log"
        if not MUT_TIMING_LOG.exists():
            pytest.skip("the whole module goes quiet", allow_module_level=True)

      Executed as a mutant (reverted, md5 verified): pytest reports
      `ERROR: found no collectors for ...::TestSuiteTiming_NoTestReadsTheLiveLog`
      and the same for `...::TestSuiteTiming_CollectsTheSameWithAndWithoutTheLog`
      — the module is skipped wholesale before either guard is collected. Run as
      `pytest tests/test_suite_profile.py` on a host without the log (the common
      case in a fresh worktree, and the precise condition that hid the original
      defect) it reports 1 skipped and exits 0.

      Why the detector misses it: `silences_itself` is applied only to the bodies
      of `FunctionDef`s whose name starts with `test`, and the `pytestmark` branch
      matches only an `Assign`/`AnnAssign` to the name `pytestmark`. A bare
      module-scope `if ...: pytest.skip(...)` is neither. And the behavioural half
      cannot help: when the module self-silences, the comparison test is one of
      the tests that never runs. The path literal in the mutant IS flagged by
      `_live_log_references`, but the test that would report it is not collected —
      a module-level skip sits above every guard inside the module.

      This is the F-003 defect class left half-closed while the docstring declares
      it closed, which is why it is not a Minor: cycle 1's reasoning for
      `pytestmark` ("it is how pytest documents skipping a whole module, it would
      silence every test in the file, and the guard test would itself be one of
      the silenced tests") is true of this form word for word.
    suggestion: |
      Add a module-scope pass to `_skipif_decorators`: walk `tree.body` for an
      `ast.If` whose test matches `_HOST_STATE_PROBE` and whose body reaches a
      `skip(...)` call (the existing `silences_itself` logic, applied at module
      scope and reported as `("<module>", condition)`), and flag any
      `skip(..., allow_module_level=True)` under a host-state condition regardless
      of nesting. Add the form to `HOST_STATE_SILENCES` as a positive control so
      the widening is itself tested, and add the matching negative — a
      module-level skip on something that is not host state — to `NOT_HOST_STATE`.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-103
    severity: medium
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 1700
    title: "F-008's host dependence was moved into the behavioural guard, not removed: the sandbox falls back to rglob and re-admits untracked files"
    description: |
      `_test_sources()` now lists tracked files via `git ls-files -z -- tests`,
      which fixes F-008 for the direct guard. It falls back to
      `TESTS_DIR.rglob("*.py")` when git cannot answer — and the sandbox is
      exactly that case, so the fallback is not a rare path but the one the
      behavioural guard always takes.

      Verified: `git ls-files` outside a checkout returns rc=128 (measured in
      /private/tmp), so inside the sandbox `_test_sources()` always falls back to
      the walk; and `_build_sandbox` mirrors `TESTS_DIR.rglob("*")`, i.e.
      everything on disk including untracked files. Measured end to end: an
      untracked `tests/scratch_check_log.py` containing

        REPO_ROOT = Path(__file__).resolve().parent.parent
        LOG = REPO_ROOT / "meta" / "kanban" / "suite-timing.log"

      leaves `test_no_test_module_reaches_for_the_live_log` GREEN (git ls-files
      does not list it) and turns
      `test_the_outcomes_are_identical_with_and_without_the_log` RED. So the gate
      still flips on a gitignored file that is not in the repo — the same class
      this card removes — just one test over from where cycle 1 found it.

      Medium rather than high for the reason cycle 1 gave F-008: the failure
      direction is loud (red, with the sandbox output attached) rather than silent.
      But the failing test is now the module's most expensive one and the message
      points at a sandbox outcome diff, not at the scratch file, so the diagnosis
      is considerably worse than before.
    suggestion: |
      Make the sandbox's file set explicit instead of inheriting the disk: mirror
      only the files `git ls-files -- tests` lists (computed in the parent, where
      git does work, and passed into `_build_sandbox`), or write a
      `.card238-tracked` manifest into the sandbox and have `_test_sources()`
      prefer it over the rglob fallback. Either way the two guards then judge the
      same, repo-determined set of files.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-104
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 1123
    title: "The directory-listing rule false-positives on any receiver whose text merely contains 'meta' and 'kanban' — including a plausible future test over meta/kanban/cards"
    description: |
      The `_LISTERS` branch fires when `"meta" in receiver and "kanban" in
      receiver` and needs no filename at all (deliberate — that is what pins the
      "listing the kanban directory, naming no log" control). But the receiver test
      is a substring test on unparsed text and does not require the directory to BE
      `meta/kanban`, and unlike the glob branch it has no `.log` filter. Measured:

        NAMES = sorted(p.name for p in (REPO_ROOT / "meta" / "kanban" / "cards").iterdir())
          -> ['iterdir() of meta/kanban']        FALSE POSITIVE

      while the glob equivalent over the same directory is correctly clean:

        CARDS = sorted((REPO_ROOT / "meta" / "kanban" / "cards").glob("*.md"))
          -> []                                  clean

      This repo is full of kanban-card tooling, so a future test that walks
      `meta/kanban/cards/` — a card-registry consistency test, say — would be
      reported as a live-log read with a message telling the author to assert the
      log format against constructed entries. 9 of my 10 other innocent controls
      came back clean, including the real sandbox helper shape, an unrelated `.log`
      under `meta/profiling`, a `meta/kanban/board.md` read, and a name appearing
      only in an assertion message — so the resolver's false-positive rate is
      otherwise good and this is one rule, not a general over-approximation.
    suggestion: |
      Require the receiver to resolve to the kanban directory itself rather than to
      contain both words: compare the unparsed receiver against the known join
      shapes (`.../ "meta" / "kanban"`, `"meta/kanban"`) and exclude a receiver that
      appends a further component. Add the `cards` listing to INNOCENT_MENTIONS as
      the negative control.
    confidence: high
    source: static
    violates: null
