  - id: F-105
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1200
    title: "Four more single-module bindings the taint tracker does not resolve, one of them a literal written directly in the join"
    description: |
      Probed as a pure function against 12 evasions of my own (beyond the fix's 21
      controls and 3 disclosed misses). 7 were caught, including the ones that
      matter most — a function-local assignment, an augmented assignment, a
      SimpleNamespace attribute, `str.join` of tainted parts, a default-valued
      `root` parameter, `with_suffix`, and a fixture. Five were missed; one is
      F-101's exemption case, and these four are the rest:

        MISSED  OTHER, NAME = "x.txt", "suite-timing.log"   (tuple-unpacking target)
        MISSED  REPO_ROOT / "meta" / "kanban" / (n := "suite-timing.log")   (walrus)
        MISSED  for name in NAMES: ... / name               (for-loop target)
        MISSED  class Paths: LOG = "..."  then Path(Paths.LOG)   (class attribute)

      Causes: `_tainted_names` only binds `ast.Name`/`ast.Attribute` targets of
      `Assign`/`AnnAssign` (so a `Tuple` target and a `for` target bind nothing),
      `_string_values` has no `ast.NamedExpr` arm, and a class-body assignment is
      keyed as `LOG` while the use site unparses to `Paths.LOG`.

      The walrus case contradicts a specific sentence in `_is_pathish`' docstring:
      "A literal written directly where a path is used is flagged either way." It
      is not — one wrapper node is enough. Low severity because all four die on
      the behavioural comparison (verified by executing the class-attribute form:
      KILLED on outcome divergence), so no mutant among them survives; the defect
      is the over-stated sentence plus four cheap gaps in a resolver whose whole
      point is that one-step refactors do not get through.
    suggestion: |
      Four small additions to `_tainted_names`/`_string_values`: bind `ast.Tuple`
      targets element-wise (and `ast.Starred` within them), bind `ast.For` targets
      from `_string_values(node.iter)`, add an `ast.NamedExpr` arm returning
      `_string_values(node.value)`, and key a class-body assignment under both
      `LOG` and `<ClassName>.LOG`. Add all four to REINTRODUCTIONS, and either fix
      or soften the "flagged either way" sentence.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-106
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 1376
    title: "_skipif_decorators reports every conditional skip, not host-state ones, and misses a skip gated on a hoisted exists() flag"
    description: |
      Two opposite inaccuracies in the same function, both measured, both Minor
      because the module's own assertion is `declared == []` and the path half of
      the coupling is caught elsewhere.

      Over-reporting. `conditions_in` reports EVERY `skipif`/conditional-`xfail`
      condition it finds; `_HOST_STATE_PROBE` is applied only to in-body skips and
      early returns. Measured: `@pytest.mark.skipif(sys.platform == 'win32',
      reason="posix only")` -> `[('test_x', "sys.platform == 'win32'")]`. So the
      function name, its docstring ("for every host-state silence") and the test
      name `test_no_test_in_this_module_skips_on_host_state` all over-claim: what
      is really enforced is "this module carries no conditional skip at all".
      Harmless today and arguably the safer rule, but it bans a legitimate future
      platform or DATABASE_URL skip here under a message about host state, and
      `NOT_HOST_STATE` carries no decorator-level negative control for it.

      Under-reporting. Hoisting the probe out of the condition turns it off:

        _MUT_HAVE = MUT_TIMING_LOG.exists()
        def test_x():
            if not _MUT_HAVE:
                pytest.skip("not here")

        -> _skipif_decorators(...) == []        MISSED

      That is cycle 1's decisive miss (hoisting a name past a text-level test) one
      layer over, and it is not among the two limits the docstring discloses. The
      full mutant dies — the AST guard catches the path literal and the outcomes
      diverge — so the skip half alone is Minor; but combined with F-101's exempt
      path shape it is one half of a coupling that no structural guard sees.
    suggestion: |
      Resolve names before judging the condition, the way `_live_log_references`
      now does: taint module-level names bound to a value whose source text matches
      `_HOST_STATE_PROBE`, and treat a condition mentioning such a name as host
      state. Separately, either apply `_HOST_STATE_PROBE` to decorator conditions
      too and rename nothing, or keep the stricter rule and rename the function and
      the test to what they enforce ("no conditional skip in this module"), adding
      a platform-skipif case to NOT_HOST_STATE in the first case.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

