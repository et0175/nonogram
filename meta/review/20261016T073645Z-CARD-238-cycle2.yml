  - id: F-108
    severity: info
    category: tech-debt
    type: question
    file: tests/test_suite_profile.py
    line: 611
    title: "The seeded generator excludes parentheses from notes by design, so the one field case where lazy and greedy notes could diverge is outside the 1,589-line corpus"
    description: |
      Informational, not charged: I verified there is no divergence to find. The
      generator's comment is explicit — "Notes deliberately exclude parentheses and
      brackets" — which is right for the mutation scheme, but it means no corpus
      line puts a `)` inside `notes`, and that is the only place where the greedy
      -> lazy change could in principle assign a different `notes`. My own probe
      settles it: on `(7000 passed (whoa), 0 failed) [159ms/test] (an aside)` the
      lazy group backtracks to the same `notes` the greedy one produced, because
      the trailing anchors force it. The field-level assertions in
