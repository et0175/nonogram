  - id: F-008
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/books_list.html
    line: 24
    title: "Neither the aria-sort values nor the `partial` status word has an assertion — both mutants survive"
    description: |
      Two of the fix round's three production changes carry no test, in a file
      whose 20 tests pin every other decision this card made by name (AC-230..235,
      CK-1..CK-5). Verified by mutation on f94f29e, both restored and verified:

        * `books_list.html:24` — swapping the macro's values to
          `aria-sort="{{ 'none' if sort == column else 'descending' }}"`
          (i.e. announcing the sorted column as unsorted and the unsorted one as
          sorted descending) leaves the whole card file green: 20 passed.
        * `books_list.html:84` — reverting `data-status="partial"` to the batch
          lifecycle's `generating`, which is exactly what cycle-1 F-003 asked to
          be removed, also leaves 20 passed.

      `grep -rn aria-sort tests/ src/` finds the attribute only in the template
      itself; the card's file asserts `aria-valuenow` (line 321) and its absence
      for a plan-less book (line 587) but never the status word. So neither
      F-003's nor F-004's fix is pinned, and either can be undone by a later
      edit — or by an autoescape change — without a red test. The escaping risk
      is not hypothetical: `{{ sort_order('completeness') }}` renders unescaped
      only because a Jinja macro returns `Markup`; a future `|e`, a `|string`
      filter, or moving the attribute into a Python-side string would emit
      `aria-sort=&#34;descending&#34;` and silently drop the attribute.

      Graded Minor, deliberately and against the letter of the mutation rule
      (which defaults a survivor to Important): the mutated surface is two
      presentational attributes on a single-user internal panel, cycle 1 graded
      both underlying findings low/info, and no AC, EC or invariant depends on
      either. It is a real coverage gap, not a behaviour defect — the rendered
      output is correct today (verified directly, see below).
    suggestion: |
      Two assertions in tests/test_books_list_plan_stats.py close it, in the
      style the file already uses:

        assert 'aria-sort="descending"' in thead_of(shelf.listing())
        assert 'aria-sort="none"' in thead_of(shelf.listing())
        assert 'data-status="partial"' in row  # and "complete" for a full book

      A third asserting `aria-sort="descending"` moves to the Created head under
      `?sort=created` would pin the macro's argument too.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: 2046b80
    fix_note: |
      Seven tests added to tests/test_books_list_plan_stats.py, named in the
      style the file already uses, and both surviving mutants now die.

      CK-6 TestBooksList_SortableHeadsAnnounceTheirOrder (4 tests):
        * the sorted head carries the raw text `aria-sort="descending"` and the
          other sortable head `aria-sort="none"`;
        * the pair SWAPS under `?sort=created`, which pins the macro's argument
          as well as its values;
        * exactly two heads carry the attribute, and they are Puzzles and
          Created — a non-sortable head claims no sort state;
        * `aria-sort=&` appears nowhere in the page and `aria-sort="` appears
          exactly twice, so an escaped render is red.
      CK-7 TestBooksList_PlanBarSaysWhichFillItIs (3 tests):
        * 132/150 draws `data-status="partial"`, and `generating` appears
          nowhere in the bar;
        * 150/150 and 160/150 both draw `data-status="complete"`.

      Three read helpers added beside the file's existing fragment readers —
      `head_of`, `heads_of`, `plan_bar_of` — all returning RAW markup, because
      whether the attribute is an attribute at all is the thing at stake.

      MUTATION EVIDENCE (each applied, run, restored, restore verified by
      sha256 e79dd668…fac4 on books_list.html):
        * swap the macro's values to `'none' if sort == column else
          'descending'` -> KILLED, 2 failed: CK-6's
          test_the_sorted_head_is_descending_and_the_other_is_none and
          test_the_pair_swaps_when_the_other_column_is_sorted. This is the
          exact mutant that survived this cycle.
        * revert `partial` to `generating` -> KILLED, 1 failed: CK-7's
          test_a_partly_filled_book_is_partial. The second survivor.
        * `{{ sort_order(...)|forceescape }}` on both call sites -> KILLED,
          3 failed, including test_the_attribute_is_markup_and_not_escaped_text.
          The escaping failure mode this finding named is therefore red.

      One correction to this finding's own description: `|e` and `|string` are
      NOT that failure mode — both were tried as mutants and both left 27
      passed, because `escape()` and `soft_str()` are no-ops on `Markup`. The
      reachable escaping mutations are `|forceescape` and moving the attribute
      into a Python-side string the route passes in; the test is written against
      the shape both produce, and the correction is recorded in CK-6's
      docstring so the next reader does not re-derive it.

      New tests EXECUTE, none skip: 7 passed, 0 skipped in in-memory mode (the
