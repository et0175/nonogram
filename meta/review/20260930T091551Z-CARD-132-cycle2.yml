  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/books_list.html
    line: 23
    title: "Sortable heads carry no aria-sort and the ↓ glyph is unlabelled"
    description: |
      Cycle-1 finding. Confirmed fixed in f94f29e and verified by rendering
      /books in all three sort states (default, ?sort=created, ?sort=bogus):

        <th scope="col" class="text-end" aria-sort="descending"><a class="sort"
          href="/books?sort=completeness" aria-current="true">Puzzles
          <span aria-hidden="true">↓</span>
          <span class="visually-hidden">, sorted descending</span></a></th>
        <th scope="col" aria-sort="none"><a class="sort"
          href="/books?sort=created">Created</a></th>

        * `aria-sort` is on the `<th>`, not on the `<a>` — correct: the
          attribute belongs to the columnheader role, which `<th scope="col">`
          maps to.
        * Both values are valid ARIA tokens (`ascending | descending | none |
          other`), and `none` is the honest value for a sortable-but-not-sorted
          column — the list offers descending order only, so no ascending mode
          is invented.
        * The non-current sortable column claims no direction it does not have,
          and the non-sortable columns carry no `aria-sort` at all.
        * The values swap correctly under `?sort=created`, and an unknown
          `sort` value falls back to the completeness head.
        * No escaping artifact: the macro's output renders raw
          (`aria-sort="descending"`, not `aria-sort=&#34;…&#34;`) because a
          Jinja macro returns `Markup`. Searched for `aria-sort=&` in all three
          renders: none. This is the fix's one fragile mechanism — see F-008.
        * No double-announcement with `aria-current`, which announces "current",
          a different word from the `visually-hidden` ", sorted descending".
