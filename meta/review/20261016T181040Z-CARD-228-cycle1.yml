findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_difficulty_dots.py
    line: 566
    title: "AC-4's round-mark guard claims a coverage its method partition does not have; the getattr hole is not the only hole"
    description: |
      The AC-4 reinterpretation itself is ACCEPTED (see the markdown report): asserting that the
      package holds exactly one function putting a round mark on a page is the strongest form of
      AC-4 available while G-4/G-5 forbid building the four callers, and it does bind them.

      What fails is the width of the mechanism against the width of the claim. Three statements in
      the file assert package-wide coverage:

        * line 566, FLAT_METHODS' docstring: "Unguarded, and said so — none of them can draw a circle."
        * line 564, ROUND_ENOUGH_METHODS' docstring: "nothing in the package calls them at all, so
          there is no second route to a dot for ELLIPSE_METHODS to have to cover."
        * line 658, the test class docstring: "The walk is over the whole package, so CARD-207,
          CARD-229, CARD-231 and CARD-233 cannot each grow their own circles wherever they end up
          drawing."

      All three are false, and `test_the_method_classification_covers_every_pillow_draw_method` does
      not detect it: it proves the partition is EXHAUSTIVE over dir(ImageDraw.ImageDraw) (verified
      true on the installed Pillow 12.3.0 — 19 public methods, zero missing, zero extra), never that
      the bin assignments are semantically right. The load-bearing claim is the assignment, and it
      has no control that can fail.

      Demonstrated by execution, each as a single mutant against
      tests/test_book_difficulty_dots.py + tests/test_book_interior_type_floor.py + tests/test_cli.py,
      every file restored and hash-verified afterwards:

        H1  a rogue second tier glyph in src/nonogram/export/png.py drawn with
            draw.text(xy, "●"*rank + "○"*(3-rank))          -> SURVIVED (186 pass)
        H2  the same glyph as a 32-gon via draw.polygon(pts)          -> SURVIVED
        H3  the same glyph as a filled disc via draw.point([...])     -> SURVIVED
        C1  CONTROL: the same glyph via draw.ellipse(box)             -> KILLED
            (test_the_package_draws_a_round_mark_in_exactly_one_function)

      C1 proves the instrument works; H1-H3 are three unguarded routes to a second dot glyph. Two
      details raise this above academic:

        * `polygon` is binned FLAT while `regular_polygon` is binned ROUND_ENOUGH — yet
          ROUND_ENOUGH's own docstring names "a 24-gon" as the approximation route it exists to
          cover, and draw.polygon is strictly more capable than draw.regular_polygon. The partition
          is internally inconsistent with its own stated rationale.
        * the `text` route is the single most likely way CARD-207 will actually implement this.
          Its header already goes through _set_band's draw.text call, so appending "●●○"
          to the band string is the cheapest implementation available, and the G-2 test that would
          notice a text-drawn dot spies only on _draw_difficulty_dots, not on the band.
          CON-020's floor would not catch it either: a 14 pt bullet clears 10 pt.

      Routes that leave ImageDraw entirely (Image.paste of a circular mask, ImageDraw.floodfill, a
      pre-rendered PNG asset) are also outside the guard, since the set is derived from
      dir(ImageDraw.ImageDraw).
    suggestion: |
      Either narrow the three claims to what the walk measures — "no module writes a call to an
      ellipse-family Pillow method outside this one function" — or widen the mechanism. Widening is
      cheap and keeps the stronger claim: move `polygon`, `point` and `bitmap` into
      ROUND_ENOUGH_METHODS (they are already asserted to be called nowhere, so
      test_no_module_approximates_a_round_mark_another_way covers them for free — verify that is
      still true for `polygon`/`point`/`bitmap` before moving them), and for `text`, which IS called
      package-wide, add the narrow assertion the G-2 test already has the machinery for: no
      draw.text call anywhere in src/nonogram/ passes a string containing a geometric-shape
      codepoint (U+25A0..U+25FF, U+2022, U+2219). Then restate FLAT_METHODS' docstring as
      "unguarded for shape, guarded for dingbat content" rather than "none of them can draw a circle".
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fix_note: |
      The guard now covers four routes instead of one, and names what it cannot
      cover. PARTLY DISMISSED PREMISE, stated rather than edited around: the suggestion's
      claim that `polygon`, `point` and `bitmap` are "already asserted to be called
      nowhere" is false — `draw.polygon` is called at book_pdf_generator.py:1895 (the
      pipeline diagram's three-vertex arrow head) and `point` twice in sourcing/image.py
      as `Image.point`, which the walk could not tell from a draw call. Moving either
      would have turned test_no_module_approximates_a_round_mark_another_way red on
      honest code. So: `bitmap` moved to ROUND_ENOUGH (control: planted draw.bitmap ->
      red); `polygon`/`point` got VERTEX_BOUNDED_METHODS with a MAX_FLAT_VERTICES=4 bound
      on countable literal vertex lists, an uncountable list failing rather than passing
      (controls: H2's 32-gon -> red, H3's computed disc -> red, the real arrow head and
      Image.point -> pass, both pinned as not-caught controls); receiver discrimination
      via _is_draw_receiver with its own completeness test (control: a second draw-object
      spelling -> red). The text route was closed WIDER than suggested, because the
      suggested form misses the realistic case: CARD-207 builds its band string at the
      caller, so the literal is nowhere near a draw.text call. The rule is now "no string
      literal anywhere in src/nonogram/ holds a ROUND_DINGBATS codepoint", with one
      earned exemption (admin/pdf_generator.py, three prose bullets) whose justification
      is itself asserted — the exempt set must equal the set of modules carrying such a
      codepoint, and that module must make no draw-object call and contain no ImageDraw
      (control: H1's draw.text with a BLACK CIRCLE literal -> red). All three overshooting statements narrowed;
      the class docstring now names the routes outside ImageDraw (Image.paste of a mask,
      floodfill, a pre-rendered asset) as a limit this instrument cannot reach. Each
      control was run in its own fresh process, file restored and shasum-verified.
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/export/layout.py
    line: 1333
    title: "Four of the five DifficultyDots.__post_init__ refusals the card claims are exercised by nothing"
    description: |
      The card's Worktree notes state that __post_init__ "refuses a row that cannot say what it
      means — an empty row, a rank of zero, dots of unequal size, dots that overlap, and a stroke of
      half the diameter or more", and conclude that "AC-3 and AC-6's 'not three outlined dots' are
      therefore partly structural: those values are unconstructible".

      Two of the five refusals are genuinely pinned, and they happen to be the two the ACs lean on:
        * the empty-row / filled-range refusal — test_the_type_cannot_express_an_empty_or_unfilled_row
        * the ring-closing stroke refusal      — test_the_type_refuses_a_stroke_that_closes_the_ring
      So AC-3's and AC-6's structural claim survives this finding.

      The other four have no test at all. Each of these mutants left all 186 tests in
      tests/test_book_difficulty_dots.py + tests/test_book_interior_type_floor.py +
      tests/test_cli.py green (one mutant per isolated subprocess; every file restored and
      hash-verified afterwards):

        layout.py:1333  `if self.stroke < 1:`                      -> disabled -> SURVIVED
        layout.py:1337  `if len(diameters | heights) != 1:`        -> disabled -> SURVIVED
        layout.py:1345  `if len(tops) != 1:`                       -> disabled -> SURVIVED
        layout.py:1348  `if left <= right:`  (the overlap refusal) -> disabled -> SURVIVED

      These are not equivalent mutants: disabling them makes the type accept rows it is documented
      to refuse. They are unreachable only because the single constructor cannot currently produce
      such a row — which is precisely the circularity: the refusals are cited as what makes bad
      values unconstructible, while the only evidence they work is that nothing constructs them.
      A later card changing the measurement (CARD-229's key strip is a declared consumer) would
      silently lose four invariants with no failing test.

      Verified separately, and clean: the refusals cannot be BYPASSED by the one caller.
      difficulty_dots is the only constructor; it builds through DifficultyDots(...) so
      __post_init__ always runs, and dataclasses.replace would re-run it. _draw_difficulty_dots
      never constructs one.
    suggestion: |
      Add four one-line pytest.raises cases beside the two that already exist in
      test_the_type_cannot_express_an_empty_or_unfilled_row — a zero stroke, two dots of different
      diameters, two dots on different tops, and two overlapping dots. Four lines closes the claim.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fix_note: |
      test_the_type_refuses_every_row_it_documents_as_impossible constructs
      DifficultyDots directly with a zero stroke, unequal diameters, different tops and
      overlapping dots. Controls: each of layout.py:1333/1337/1345/1348 disabled in its
      own fresh process turns that test red (each previously survived with 186 green).
      The finding's two confirmations are kept and still hold, and the card's overreaching
      "refuses a row that cannot say what it means" sentence is corrected in its notes.
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/export/layout.py
    line: 1252
    title: "DIFFICULTY_DOT_RATIO's stated derivation is not pinned; the only test that uses it re-derives from the constant under test"
    description: |
      The constant's docstring derives 0.3 carefully (HEADER_FONT_MM 5 mm on a HEADER_BAND_MM 12 mm
      band, cap height ~0.7 em => the word's own capitals stand 0.29 of the band). Nothing tests
      that relationship.

      Measured: DIFFICULTY_DOT_RATIO 0.3 -> 0.9 is KILLED (by
      test_the_glyph_leaves_room_for_the_widest_tier_word), but 0.3 -> 0.45 SURVIVES — a 50 %
      taller dot passes every test in the three files.

      The two tests that look like they pin it do not:
        * test_a_dot_never_outgrows_its_share_of_the_box asserts
          `dots.diameter <= (bottom - top + 1) * DIFFICULTY_DOT_RATIO` — it re-derives the bound
          from the constant under test, so it holds for any value. This is the exact anti-pattern
          CLAUDE.md names ("Prefer an independent second implementation over re-deriving a value
          with the same function you're testing").
        * test_the_stroke_ratio_is_what_keeps_them_apart asserts only `0 < DIFFICULTY_DOT_RATIO < 1`.
      The other two ratios ARE pinned by independent measurement: GAP_RATIO 0.5 -> 0.1 breaks the
      fifth-of-a-dot clearance sweep, and a STROKE_RATIO at or above 0.5 is refused by the type.
    suggestion: |
      Pin the derivation rather than the number: assert the dot's diameter at the book band
      (HEADER_BAND_MM deep) is within a pixel or two of the cap height of HEADER_FONT_MM type —
      an independent second computation from the two font/band constants, not from
      DIFFICULTY_DOT_RATIO. That is the assertion the docstring already argues for.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fix_note: |
      test_the_dot_is_the_cap_height_of_the_band_it_sits_on pins the derivation
      with a second, independent measurement: the dot at a HEADER_BAND_MM-deep box
      (142 px, width-unbounded so the height cap decides) against the RENDERED cap height
      of a capital in the band's own face at HEADER_FONT_MM (43 px vs the dot's 42), two
      pixels of tolerance; the 0.7-em rule of thumb asserted separately and loosely.
      Nothing is computed from DIFFICULTY_DOT_RATIO. Controls: 0.45 is now red (it
      survived cycle 1); 0.32 is still green, so the pin is on the derivation, not on a
      bit pattern. test_a_dot_never_outgrows_its_share_of_the_box is left alone — it
      bounds the width term usefully and the height term is now pinned independently.
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
