    title: "The type's overlap refusal permits touching dots, while the invariant it is cited for says they never touch"
    description: |
      __post_init__ raises only when `left <= right` of the previous dot, so two dots at
      `left == right + 1` — adjacent, visually one smear — are accepted. The corpus invariant
      test_no_two_dots_of_a_row_touch asserts the strictly stronger `left - right - 1 >= 1`, and the
      card names the invariant as "no two dots touch". The measurement never produces a touching
