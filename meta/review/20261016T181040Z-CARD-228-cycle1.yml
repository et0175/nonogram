      claim/mechanism mismatch rather than a live defect — but it is the mismatch that makes
      F-002's overlap mutant survivable in both directions.
    suggestion: "Make the refusal `left <= right + 1` so the type enforces the invariant the tests and the card state."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fix_note: |
      `left <= right` -> `left <= right + 1`, message "two dots of the row overlap
      or touch". test_the_type_refuses_two_dots_that_merely_touch pairs the touching row
