    severity: low
    category: tech-debt
    type: gap
    file: tests/helpers/page_ink.py
    line: 103
    title: "pdf_page_boxes duplicates pdf_pages.py's parser walk, in the ink-measuring helper"
    description: |
      `pdf_page_boxes` opens `PdfParser.PdfParser(buf=data)` and walks
      `parser.pages` / `read_indirect` — byte for byte the same traversal
      tests/helpers/pdf_pages.py:30-40 already performs, which is where cycle
      1's F-002 suggested putting it. page_ink.py's own docstring scopes it to
      "measure a rendered book page's drawing off its own ink"; a MediaBox is
      not ink, and the helper now has two unrelated jobs and a second copy of
      the Pillow-internals coupling to maintain when Pillow's PdfParser moves.
      The parsing itself is sound — it mirrors the established precedent
