findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 514
    title: "A row that is not a mapping still aborts the export without naming anything"
    description: |
      The fix round's new failure contract is "either a file matching the page
      plan, or no file and a message naming the puzzle". There is a third
      outcome it does not cover. A row that is not a mapping at all is read
      defensively at :495 (`puzzle.get("id") if hasattr(puzzle, "get") else
      None`), fails in `_payload`, and is logged and dropped — but the very
      next statement, `tier_breakdown(puzzles)` (:514), iterates *every*
      member including that row and calls `puzzle.get("difficulty_tier")` on
      it, raising a bare AttributeError out of the generator. The owner gets
      neither a book nor a named puzzle, and the warning that was just logged
      is the only clue.
      Not reachable through the store's write path today (rows come from
      `puzzle_review.get_puzzle`, which returns dicts), which is why this is
      Minor and not Important. The comment at :492-494 is accurate about its
      own narrower concern (not raising inside the except handler) — the gap
      is that the module's contract now promises more than :514 delivers.
    suggestion: |
      Either read the tier through the same defensive shape
      (`tier_of_record(puzzle.get("difficulty_tier") if hasattr(puzzle, "get")
      else None)` inside `tier_breakdown`), or drop non-mapping rows once, up
      front, before either pass sees them.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

