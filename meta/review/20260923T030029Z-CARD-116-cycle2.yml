  - id: F-003
    severity: low
    category: tech-debt
    type: question
    file: tests/test_book_pdf.py
    line: 600
    title: "TestBookPdf_PagePlanGuardIsLive cannot tell the new guard from the old one"
    description: |
      The test monkeypatches `interior_page_count` itself to return
      `planned(count) + 1` and asserts the guard fires. That mutation makes
      the *old* form (`interior_page_count(len(answer_pages))`) fire
      identically, so the test certifies only that the comparison executes —
      it pins no behaviour the rewrite introduced. The fix agent states this
      plainly and the class docstring's claim ("what this test pins is that
      the guard is *live* at all") is no stronger than what is checked, which
      is why this is a note rather than a finding against the docstring.
      Worth recording because the guard's stated value — catching a future
      change to the interior's make-up that forgets the plan — remains
      unverified: `len(payloads)` and `len(answer_pages)` are equal by
      construction on every input the loop can complete, and both diverge
      together under a two-up page or a per-level divider.
    suggestion: |
      Either accept it as a liveness check (and say so in one line where the
      value is claimed), or make it real: monkeypatch the *page-building* side
      instead — e.g. have `create_divider_page` append nothing — so the pages
      built stop matching a plan that was not patched.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
