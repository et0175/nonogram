findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/app.py
    line: 1254
    title: "Prediction endpoint disagrees with a real save for any out-of-range size value (AC-3)"
    description: |
      The endpoint accepts `value` as any integer and hands it straight to
      `size_fit()`, where `_own_extent` CLAMPS it into MIN_SIZE..MAX_SIZE
      (image_manager.py:297 for "short", :310 for "fixed"). The save path does
      something different: `ImageManager.update_image_size` (image_manager.py:586-589)
      *silently ignores* a value outside MIN_SIZE..MAX_SIZE and keeps the previously
      stored one. The two policies diverge, so the live prediction is not "what the
      page would render after a save" (AC-3).

      Reproduced against the worktree with the Flask test client (300x200 picture,
      default "medium" upload, stored size_value=20):
        mode=short value=5   -> endpoint answers 15x10; after POSTing that form the
                               stored size_value is still 20 and the puzzle is 30x20.
        mode=fixed value=5   -> endpoint 30x20  vs saved 20x13.
        mode=fixed value=45  -> endpoint 30x20  vs saved 20x13.
        mode=fixed value=500 -> endpoint 30x20  vs saved 20x13.
      Every in-range value (10, 20, 30) matches on both modes.

      Reachable from the UI: the number input carries min/max attributes, but the
      page's own submit handler calls `e.preventDefault()` and rebuilds a FormData by
      hand (image_preview.html:362), so native constraint validation never runs and
      an out-of-range number is posted as typed. The user is shown one grid and gets
      another - the exact complaint this card exists to fix, one input class over.

      The card's own AC-3 test escapes this because it computes its expectation by
      assigning `image.size_mode, image.size_value = mode, value` directly and calling
      `size_fit()`, bypassing `update_image_size` - i.e. it asserts parity with the
      mechanism the endpoint already uses, not with a save.
    suggestion: |
      Make one function own "is this value acceptable, and what does it mean".
      Either (a) have the endpoint apply the same acceptance rule as
      `update_image_size` - out of range means "keep the stored value" - and predict
      from that, or (b) return 400 for a value outside MIN_SIZE..MAX_SIZE and have
      the JS surface it, and separately fix `update_image_size` to stop silently
      discarding input. Extend the AC-3 test to drive an actual POST to
      /batch/preview-images and compare the endpoint's answer with the stored
      configuration's size_fit() afterwards, including 5, 45 and 500.
    confidence: high
    source: static
    violates: "AC-3"
    root_cause: RC-1
    status: open
