  - id: F-008
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 1277
    title: "Out of scope: get_image/remove_image on the shared module-global manager is a check-then-act with no lock"
    description: |
      `remove_batch_image` reads `get_image(file_id)` then calls `remove_image(file_id)`.
      `ImageManager` holds a plain dict with no lock and lives in a module-global
      singleton (image_manager.py:627-635) shared by every request thread, so two
      concurrent removes of the same id can race: the second finds the image, then
      `remove_image` returns False and the branch flashes nothing at all (the elif
      has no else). Harmless in practice for a single-operator admin panel and
      pre-existing for every other mutating route; noted, not gating.
    suggestion: |
      If this is ever multi-user, guard ImageManager's dict with a lock and collapse
      the route to a single `remove_image` call whose False result flashes "not found".
    confidence: medium
    source: static
