  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/templates/image_preview.html
    line: 300
    title: "refreshPrediction has no request sequencing; applyToAll guarantees two racing requests per card"
    description: |
      `refreshPrediction` fires a `fetch` and writes whatever comes back into the
      card - there is no request token, no AbortController, no debounce. The
      rendered state is therefore last-RESPONSE-wins, not last-REQUEST-wins.

      `applyToAll()` (image_preview.html:325) makes this certain rather than
      theoretical: for every card it sets the mode select and dispatches `change`
      (-> fetch with the NEW mode and the OLD value), then sets the number input and
      dispatches `change` (-> fetch with the new mode and the new value). Two
      requests per card are always in flight, and on a 20-picture batch that is 40
      concurrent GETs over a 6-connection browser pool. If the first response lands
      second, the card displays the prediction for a configuration the form no longer
      holds, and it stays wrong until the user touches that card again - a stale
      predicted output, which is complaint #2 in the card's Why.

      The same race is reachable with one card: each spinner click on
      `<input type=number>` fires `change` immediately in Chrome/Firefox.
    suggestion: |
      Keep a per-card sequence number (e.g. `const seq = ++pending[fileId]` before
      the fetch, and drop the response when `pending[fileId] !== seq`), or store an
      AbortController per fileId and abort the previous request. Either also fixes
      the applyToAll double-fire; alternatively have applyToAll set both fields and
      call refreshPrediction once per card instead of dispatching two change events.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

