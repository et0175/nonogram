    file: src/nonogram/admin/app.py
    line: 1149
    title: "requested_tier_label docstring overclaims: 'guess' is not a tier but labels as Hard"
    description: |
      The docstring says the filter returns None "for None or any value that is not a tier".
      tier_of_record reads the retired word "guess" as Tier.HARD (ADR-0031/R3), so
      requested_tier_label("guess") == "Hard" (reviewer probe with worktree src on PYTHONPATH).
      create_batch can never store "guess" (parse_tier refuses it), so no user impact, but the
      claim goes beyond what the code does and what TestBatchRequestedTier_LabelFilter shows.
    suggestion: |
      Narrow to "None for None or any value tier_of_record does not read as a tier", or add a
      ("guess", "Hard") case to the LabelFilter parametrization and say so.
    confidence: high
    source: static
