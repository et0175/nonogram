findings:
  - id: F-201
    severity: high
    category: tech-debt
    type: gap
    file: tests/README.md
    line: 598
    title: "Bound 2's justification for declaring the flag-off blind region instead of mechanising it is refuted on both AC-7 anchors"
    description: |
      The declared-bounds entry for bound 2 (tests/README.md:595-603; identical text at
      CARD-260.md:280-284) is the one place the cycle-1 fix chose a declaration over a
      mechanism, and it justifies that choice with a measurable claim:

        "The one fail-closed set that would contain it, 'every NOT-REACHED arm in a file
         that spawns anything', would relabel the three arms AC-7's second anchor
         reproduces as NOT-REACHED for a parent-side error, breaking the card's own
         independent evidence."

      Re-derived with the instrument's own rule, it does not hold on either anchor:

        * anchor 2 — tests/test_db_engine_lifecycle.py. `km.child_dependent_linenos(src)`
          returns `frozenset()`: the file contains no spawn-shaped call at all. grep over
          it for subprocess|Popen|check_output|check_call|spawn|popen|fork|execv|
          multiprocessing|os.system matches exactly one line, :263, and that line is a
          COMMENT ("``src.`` because the Alembic subprocess imports the package that
          way"), so it is not in the AST. The rejected rule's precondition ("a file that
          spawns anything") is FALSE there, so it would relabel nothing — including the
          three NAMES-BLIND arms at :878/:889/:897 the sentence names.
        * anchor 1 — tests/test_full_suite_lock.py. 7 of its 130 arms ARE child-dependent
          (671, 674, 678, 685, 689, 694, 698), but the anchor reproduces 130 of 130 PASS
          and reached, i.e. zero NOT-REACHED arms, so the rejected rule has nothing to
          relabel there either.

      Under the only other available reading of "a file that spawns anything" — every run,
      because the instrument itself spawns the pytest child — the claim becomes trivially
      true but the rule it rejects becomes a straw man, and the "one fail-closed set"
      clause is still wrong: a rule scoped to targets that actually contain a spawn breaks
      neither anchor. The argument fails either way.

      What is NOT in dispute: the bound's *reading* is correctly measured
      (test_ac3_the_flag_off_reading_on_a_child_spawning_target_is_the_bound compares the
      flag-off and flag-on cells on the same mutant), and both figures now state the flag.
      The defect is the unfalsified, and false, justification carried in a "Declared
      bounds" list whose own header says five of seven are measured rather than asserted —
      ADR-0039/R1's "a claim whose control cannot fail is narrative, not coverage, and must
      be narrowed to what is measured or deleted".
    suggestion: |
      Either (a) delete the parenthetical and state the bound without the
      rejected-alternative argument, or (b) replace it with the measurement: name that
      anchor 2's target has no spawn-shaped call and anchor 1 has no NOT-REACHED arm, so
      the cost of a target-scoped fail-closed rule on this card's own evidence is zero.
      If (b), the cheap mechanism the argument was used to rule out is available and
      relabels no cell: with child_instrumentation off, derive from the target's AST
      whether it contains any spawn-shaped call — the module already has _SPAWN and
      child_dependent_linenos — and carry that in figure() beside the flag, so a
      NOT-REACHED on a spawning target is flagged per run rather than only in the README.
      Keep the cell vocabulary as it is; the finding is about the claim, not the cells.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-202
    severity: high
    category: tech-debt
    type: bug
    file: tests/kill_matrix.py
    line: 1222
    title: "A mutant pytest killed outside any assert publishes a FAIL-free, all-NOT-REACHED matrix at exit 1"
    description: |
      F-005's fix made the exit code the publishing precondition and refuses 2/3/4/5,
      with the stated reason (README's refusal table, kill_matrix.py:62-69) that "the
      matrix such a run produces is all-NOT-REACHED and FAIL-free, which is exactly the
      shape of a mutant every arm survived". Exit **1** produces that identical shape and
      is admitted with no cross-check.

      Measured, in a scratchpad target (never under PythonProject4*): a mutant that makes
      the selected test raise before its first assert publishes

        ERROR-BEFORE-ARM / recording pass over km_probe2.py: 0 PASS, 0 FAIL,
        2 NOT-REACHED, 0 BLIND of 2 assertion nodes (collected tests: 1; pytest exit 1;
        child instrumentation off)

      pytest killed the mutant. The matrix reports no FAIL at all, and a consumer counting
      kills as FAIL cells (CARD-259 is the declared consumer) reads it as "no arm killed
      it" — trap 1's recorded cost, "a killed mutant recorded as a survivor", reached
      through a door the F-005 fix left open. The same shape is accepted for SHIPPED:
      _refuse_unless_clean only checks `matrix.failed` and, on the first reading, has no
      baseline, so a SHIPPED that errored in a fixture at exit 1 becomes an all-NOT-REACHED
      baseline against which `shipped_between` compares vacuously.

      Honest mitigation, stated so the finding stays refutable: nothing is hidden —
      Matrix.figure() prints `pytest exit 1` and the cell counts, and KillMatrix.figure()
      prints the reached count ("0 reached"). So this is a declared-but-unrefused shape, not
      an invisible one. But F-005's own fix rejected exactly that standard ("exit_code was
      stored and read by nothing"), and the instrument's doctrine elsewhere is that an
      unattributable shape is a FAILURE, never a silent pass (_resolve_selection's own
      words; ADR-0039/R2).

      The detection is free and, on this card's evidence, false-positive-free: in the
      recording pass an assert failure never propagates, so exit 1 can only come from a
      non-assert failure; in the re-raising pass a propagating assert records FAIL first,
      so a FAIL cell exists. "exit_code == 1 and no cell is FAIL" is therefore always an
      unattributed failure. It does not fire anywhere in the 62-test suite, nor on either
      AC-7 anchor (anchor 2's killed mutants all red a named arm at exit 1).
    suggestion: |
      Cross-check the exit code against the cells in _measure, next to the existing
      `exit_code not in _RAN_EXIT_CODES` gate: when `exit_code == 1` and no cell is FAIL,
      the run recorded a failure no arm accounts for. Fail closed for SHIPPED (it is the
      baseline every later reading is trusted against) at minimum. For a mutant, either
      raise the same way or — if a refusal is judged too strict for a campaign — carry the
      condition in the figure as its own named term rather than leaving it to a reader to
      notice "exit 1" beside "0 FAIL"; do not invent a new cell state (bound 2's
      relabelling cost argument applies there for real). Add the control both ways: a
      mutant that errors before its first assert, and a mutant killed at an assert, which
      must still publish.
    confidence: high
    source: static
    violates: ADR-0039/R2
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

