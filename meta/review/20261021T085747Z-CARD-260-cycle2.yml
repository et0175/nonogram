      Read literally, G-2 ("refuses to start if `meta/kanban/.full-suite.lock` exists") is
      a refusal on existence, and the code refuses only a foreign, non-stale,
      non-overridden holder. Three reasons the substance is nevertheless intact:
        1. The hazard the lock exists for is two DIFFERENT trees running heavy pytest on
           one host (full_suite_lock.verdict's own comment and CARD-225's gate). An
           own-tree lock is written by a gate that then runs, in that tree, the very suite
           the instrument's tests belong to; refusing it means the instrument cannot run
           inside the gate that must certify it. That is not a hypothesis — it was measured
           once, as build gate 3's 23 LockHeld reds with one cause, and the opposite is now
           measured too (build gate 4: 8690 passed with the real lock held naming this
           worktree, no override).
