           full_suite_lock.current_verdict() and raises only on its refusal, so the
           instrument is neither stricter nor laxer than the hook that admitted the pytest
           it runs inside. Being stricter reds a suite the board decided to run; being
           laxer would start a run whose child that same hook kills. Four states are held
           to the owner's own answer in test_g2_the_refusal_is_its_owners_verdict_and_not_a_second_opinion.
        3. The relaxations that arrive with the verdict (STALE_SECONDS, the override) are
           the lock design's, not this card's, and neither is silent — full_suite_lock's
