  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/orchestrator.py
    line: 700
    title: "RecoveryLog omits the one signal that would distinguish 'K too small' from 'K irrelevant'"
    description: |
      ADR-0024 defers K's calibration and names RecoveryLog as the data it needs. The tally
      records redraws, repairs, fallback-region repairs, lineages at the K cap and lineages
      with no repairable region — but not lineages whose repair reproduces a grid the same
      lineage already judged. That case is not hypothetical: the AC-113 test's own docstring
      describes it ("the repair swaps them back — the lineage oscillates between two grids
      and never converges"), and measured over 1502 real ambiguous candidates at 10x10-15x15
      it accounts for 154 repeat attempts across roughly 10% of lineages.
      It matters specifically for the deferred decision: a lineage that oscillates provably
      gains nothing from a larger K, so lineages_at_repair_cap — the field ADR-0024 will read
      as the "K was too tight" signal — currently mixes lineages that were still making
      progress with lineages that were cycling. The recalibration would read the wrong number.
    suggestion: |
      Add a `lineages_that_revisited_a_grid` (or `repeat_attempts`) field to RecoveryLog,
      incremented when a computed Repair's grid equals one the lineage already judged. The
      cheap sufficient test is comparing the new Repair's (emptied, filled) against the
      previous one's (filled, emptied) — O(1), no grid hashing needed for the 2-cycle that
      accounts for the observed cases. This is observability only; it does not change the
      pair-choice rule and so needs no ADR-0024/R4 amendment.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "RecoveryLog.repeated_attempts — orchestrator.py; tests in tests/test_orchestrator.py and tests/property/test_recovery_bound.py"
