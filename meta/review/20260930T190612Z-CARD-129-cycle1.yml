findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 857
    title: "InteriorCounts.unreadable is written and never read — a genuine export failure is silently degraded to \"About N\""
    description: |
      `_interior_counts` wraps `BookPDFGenerator(book).interior_stream(...)` in a bare
      `except Exception as unreadable` (app.py:884) and stores the reason on
      `InteriorCounts.unreadable` (app.py:857, set at :895). Nothing consumes it:
      grep over `src/nonogram/admin/` and `tests/` finds no reader, the route never
      passes it to the template, and `book_finalize.html` uses only `page_count` and
      `page_count_exact`.

      That matters because the handler is broader than the case it was written for.
      `interior_stream` also raises on the two loud plan tripwires it documents
      ("the page plan prints ..., not puzzles 1..n", "the answer key holds ...") and
      on `answer_key`'s RuntimeError for an unmeasurable grid. Those are correctness
      guards, and after this card the Finalise screen answers all of them with
      "About N interior pages" and no trace — the owner meets the real failure later,
      at download. app.py's own precedent for exactly this condition is to log it
      (`app.logger.error("Book %s has an unreadable print specification (%s); ...")`
      at :3296 and :3339); the new path does not.
    suggestion: |
      Either log it — `app.logger.info`/`warning` with the book id and
      `counts.unreadable`, matching app.py:3296's shape — or pass it to the template
      beside `page_count_exact` so the "About" figure can say why it is a bound.
      Narrowing the `except Exception` to the sheet-builder's own ValueError would be
      better still: a plan tripwire would then surface instead of being absorbed.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 919
    title: "counts is None silently skips the gate, and the book leaves draft while the screen says it cannot be counted"
    description: |
      `_kdp_gutter_refusal` returns `None` when `counts is None` (app.py:919-921), so
      `save_and_finish` falls through to `set_book_status(READY_FOR_PDF)`. That state
      is reachable: a member row whose `grid` is not a non-empty rectangle makes
      `interior_stream` raise (through `answer_key`) *and* makes
      `unpaired_interior_page_count` raise (`_grid_extent`, book_kdp.py:334-345), so
      both arms of `_interior_counts` fail and it returns `None`.

      The two halves of the route then disagree: the screen renders "The interior's
      pages cannot be counted — check the book's puzzles and its print setup"
      (book_finalize.html:88) while the action lets the book out of draft. No AC
      covers this and the pre-card route had no gate at all, so it is a gap rather
      than a regression — and the docstring calls it deliberate ("a different
      complaint and not this one's to make") — but a finalise that cannot count the
      interior also cannot know whether KDP would take it.
    suggestion: |
      Refuse on `counts is None` with the message the template already carries, so
      the action and the screen tell the owner the same thing. One line in
      `_kdp_gutter_refusal`, and a test beside AC-179's for a book with a malformed
      grid row.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_kdp.py
    line: 232
    title: "rounding the STORED gutter half-up to two decimals accepts a gutter below KDP's minimum"
    description: |
      `gutter_refusal` compares `_rounded(stored) >= _rounded(minimum_cm)`
      (book_kdp.py:232) with `_rounded` quantizing to two decimals ROUND_HALF_UP
      (:128). Applied to the *stored* value that rounds it up, so a gutter in
      [0.945, 0.9525) reads as 0.95 and passes. Reproduced on this head:

          gutter_refusal(150, stored_gutter_cm(row with "0.945"))  -> None
          gutter_refusal(300, 1.265)                               -> None
          kdp_min_gutter_cm(150)                                   -> 0.9525

      0.945 cm is below KDP's 0.375 in, so that book is accepted at finalise and
      rejected at upload — the exact failure this card exists to prevent, admitted
      through a 0.0075 cm window.

      The docstring's premise is that the window cannot arise: "the `books` table
      keeps margins as centimetre strings with two decimals". That is a convention,
      not a constraint — `src/nonogram/db/models.py:154` declares
      `gutter_margin_cm = Column(String, nullable=True, default='1.27')`, and
      `stored_gutter_cm` accepts any finite decimal string. The provenance of such a
      value is the same hand-edited/legacy row AC-179's own 0.60 cm comes from, which
      the card's test docstring says is the only way a non-profile margin reaches the
      column at all. Probability is low (a three-decimal hand edit inside a 0.075 mm
      band); the direction of the error is the unsafe one.
    suggestion: |
      Keep the two-decimal minimum (so "0.95" is still 0.375 in) but quantize the
      stored value *down*: compare
      `stored.quantize(STORED_PRECISION, rounding=ROUND_FLOOR) >= _rounded(minimum_cm)`.
      "0.95" still passes, "0.945" refuses. Add the two cases to
      `TestKdpGutterTable::test_the_stored_two_decimal_form_of_a_band_is_that_band`,
      which currently pins 0.95 and 0.94 and would not notice either way.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: bug
    file: tests/test_book_export_interior_cover.py
    line: 374
    title: "tautological assertion in a re-aimed test: the \"no ~\" check inspects a five-character slice that can never hold one"
    description: |
      `assert "~" not in body.split('data-interior-page-count')[1][:40]`.
      The attribute name occurs twice in the rendered `<dd>` —
      `data-interior-page-count="7" data-interior-page-count-exact="true"` — so
      `split` yields three parts and part [1] is always `'="7" '`: five characters,
      before the `-exact` attribute and long before the `>` that a `~` would follow.
      Reproduced both ways on this head: with `exact="false"` and a rendered `~7`,
      part [1][:40] is still `'="7" '` and the assertion still passes.

      It is one of the two assertions the card deliberately re-aimed, so it deserves
      the note even though the behaviour is covered in substance by the
      `data-interior-page-count-exact="true"` assertion on the line above and by
      `TestBookFinalise_PageCountIsTheExportsPagePlan`, which compares the figure to
      the downloaded file's page count.
    suggestion: |
      Assert on the rendered text instead, e.g.
      `assert f'-exact="true">{_interior_pages(3, 1)}</dd>' in body`, which pins the
      absence of the "~" prefix positionally, or split on
      `'data-interior-page-count-exact="true">'`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_kdp.py
    line: 235
    title: "the refusal text states an upper bound as an exact count, where the screen marks it \"About\""
    description: |
      On the fallback path (`exact=False`) the count is the sheet-free upper bound,
      and the template says so — "About 180 interior pages" / "~180". The refusal the
      same number produces does not: `gutter_refusal` renders "This book's interior
      runs to {page_count} pages" (book_kdp.py:235), and `_kdp_gutter_refusal` passes
      `counts.page_count` without consulting `counts.exact`. For AC-179's own corpus
      the bound is exact (verified below), so the wording is true there; for a book
      whose interior_stream failed for some other reason it is not.

      The direction is safe — the bound can only name a band at or above the true one,
      so the gate over-refuses rather than under-refuses — but the owner reads a
      precise-sounding number on the one surface that is supposed to explain the
      refusal, and is told "About" that same number two inches below it.
    suggestion: |
      Pass `counts.exact` into the refusal and let it say "runs to about N pages"
      on the fallback path, so the two surfaces the one reader feeds agree in wording
      as well as in value.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
