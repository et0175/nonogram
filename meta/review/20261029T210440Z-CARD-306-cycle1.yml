answers_to_the_brief:
  m5_closure_covers_every_path: >-
    **NO.** The call-argument arm collects `ast.Constant` nodes that sit
    directly in a `Call`'s `args` or a keyword's `value`. I enumerated the paths
    a number can take and measured each against both arms with the allowlisted
    value 2: direct literal — call-arm RISES; **local variable one hop —
    both silent**; **module constant — both silent**; **tuple literal argument
    — both silent**; **list literal argument — both silent**; **starred tuple —
    both silent**; **dict value — both silent**; **f-string — both silent**;
    **default argument — both silent**; **unary minus `f(-2)` — both silent**
    (it parses as `UnaryOp(USub, Constant)`, so it escapes even at ZERO hops);
    **arithmetic in the argument `f(1 + 1)` — both silent**. Nested call `f(g(2))`,
    an attribute constant `f(C.w)` and a comprehension-built argument do rise,
    but only because a bare Constant still sits in some call's argument list.
    The escape set is precisely: any value in {0, 1, 2, 0.0, 2.0} reaching a
    call through any expression that is not a bare `ast.Constant` argument — and
    `2` is the QR border weight the whole closure exists for. M-A confirms it on
    the real module. **This is M5 one notch out, which is what the brief
    suspected.** Note that `f(-2)` is not even one notch out: it is the direct
    form the arm claims to catch.
  corpus_exercises_both_arms_and_refusal_reachable: >-
    **Both arms yes, refusal no (by design, and said so).** 47/13 re-derived
    independently of the test and confirmed on a wider 240-case sweep (162/78);
    `seen == 107` cross-checks it from the rule count. The refusal is
    unreachable from every production composer — 0 reachable in 300 pages —
    because `qr_slot` answers None on exactly the figure `footer_is_clear`
    reads. It fires when provoked, and `draw_sheet_furniture`'s docstring states
    the unreachability rather than implying coverage. Honest.
  g1_3_of_14_reproduces: >-
    **YES, exactly.** Rebuilt from scratch out of tree; 14/14 byte-identical
    base vs head, and the 1-px centred-folio shift in the base tree moves 3 of
    14 (pages 05, 07, 09). The instrument is the right shape and is what was
    run. One caveat worth carrying: 3 of 14 is the sensitivity of *that* plant —
    only three interior pages carry a centred footer folio — so the reading's
    reach over the other 11 pages rests on the frame rules and the QR block,
    which this plant does not move.
  all_kinds_module_right_boundary: >-
    **YES — right-sized, not scope creep.** The module is kind-agnostic in the
    only sense that matters: it takes a `SheetFurniture` value object and
    contains no per-kind code, so "built for all kinds" costs nothing beyond
    "built for one". Its import set is the minimum that breaks the cycle
    (`book_vector`, `book_vector_draw`, `export.layout` — asserted by set
    equality), and I verified the asymmetry it is built around: book_guide_vector:103,
    book_toc_vector:60 and book_answer_vector:62 each import book_pdf_generator
    at module level, so they cannot be called from its page walk. Wiring only
    the two reachable kinds is the correct stop. The one scope fact the card
    hides is the RASTER refactor of `_draw_two_up_qr_groups` into
    `_two_up_qr_insets` (F-306).
  book_puzzle_vector_claim_still_true: >-
    **TRUE, relocated honestly, with a naming debt.** The module is
    **AST-identical ignoring docstrings** between 560d7e09 and 77b6998d — I
    checked by stripping docstrings from both parses and comparing `ast.dump`.
    So "draws no sheet furniture" is still literally true *of that module*. The
    re-point is not a claim rescued by moving the goalposts quietly: the
    docstring says in terms what moved and what did not, and the test adds a
    control — `assert len(composed) > len(shown)` — proving the composed
    production page really does carry more, so the narrowed reading is a
    statement about the module and not about a page nobody draws on. The debt is
    the class NAME (F-307): `TestPuzzlePage_DrawsTheDrawingAndTheBandAndNoSheetFurniture`
    now reads, to anyone scanning node ids, as a false claim about the shipped
    puzzle page. Kept for G-3.
  do_refusal_pattern_survives_its_controls_gaps: >-
    **PARTLY.** Measured, per row, with `_XOBJECT_PAINT.search`:
    `"/Im0 Do"` FIRES; `"Do"` alone (start AND end of row) FIRES; tab-separated
    FIRES; hex string `<446F>` silent (**correct** — that is text); `"/Im0Do"`
    silent (**correct**); `"(Done. Do) Tj"` silent (the control). **Misses**:
    `"q\n/Im0 Do\nQ"` as one appended operator is **silent**, and so is a
    CR-separated one — PDF treats CR, LF, FF and NUL as whitespace and the class
    is only `[ \t]`. Since the ONLY way to reach the refusal is to append an
    operator by hand, appending a multi-line `q … Q` block is at least as likely
    as a single-line one, so the miss is on the live path. **False positive**:
    `"… Td (Scan Do now) Tj ET"` **FIRES** — a text literal containing `" Do "`
    is refused as an XObject paint. The docstring's claim that a token match
    means "a literal string's (…Do…) body … is not mistaken for one" is true
    only for the two bodies the control chose. No live footer string contains
    `" Do "` today ("Solve it online", "Puzzle N · Solve it online",
    "nonogram.example/p/NNN", "20 x 25", digits), so nothing ships broken —
    but CARD-210 edits that link line.
  residuals_accurately_costed: >-
    **Two of three yes; one is contradicted inside the production module.**
    (1) The QR link's 9 device px / 0.76 mm: the TEST asserts `offset == 9` and
    9/300 in = 0.762 mm, and I re-measured the face — 42 px at the footer size,
    ascent/descent (39, 10), so 9 is a real ink descent bounded by the declared
    descent, exactly as the test's second assertion says. The card is right.
    **But book_sheet_vector.py's `_set_at_baseline` docstring says "35 px at the
    book's 300 DPI…"** — 2.96 mm, nearly four times the truth, no figure in this
    system, and the sentence trails off unfinished. F-302.
    (2) The chequer's 1 device px: Pillow's inclusive `rectangle` vs a PDF `re`
    is right, 1/300 in = 0.0847 mm matches the module's own "0.085 mm", and the
    test genuinely compares **boxes** (via a spy on the production
    `_draw_qr_placeholder`) and disclaims ink equality in terms. Accurate.
    (3) guide/toc/answer carry no frame: true, and necessarily so — they cannot
    be called from the generator's page walk at all, so this is a statement
    about unreachable code and the converting card's work. Accurate.
  dropout_floor_authority_correct: >-
    **YES on the authority; NO on where it is applied.** ADR-0037:290 reads, in
    the rule block itself: "R2 binds the **puzzle grid's** rules and nothing
    else. Page furniture — the interior header rule, the footer hairline, a
    divider — is NOT a grid rule and never was … Furniture that must not drop
    out on press is held to the same 2-device-pixel floor, but for the dropout
    reason directly and not through R2, so it needs no exemption from R2 and
    must not claim one." That is verbatim what the round did, and its History at
    :183-:186 confirms the entry exists because CARD-222's review read it the
    other way and wrote an exemption measured vacuous. **The vacuous-exemption
    precedent is NOT repeated.** The figures reproduce: `_pt_to_px_at_least(0.6)
    == 3` (header) and `_pt_to_px_at_least(0.4) == 2` (hairline) at DPI 300.
    The error is in four places (the card, `FURNITURE_FLOOR_PX`'s comment,
    `draw_page_rule`'s docstring and the new ADR-0042 History entry): they say
    the 2-device-pixel floor is "applied inside `interior_frame` by
    `_pt_to_px_at_least`". It is not — that function is a **ceiling**:
    `_pt_to_px_at_least(0.2) == 1`, below the floor. The floor holds because the
    two point constants were chosen so it does, and layout.py:1987 says exactly
    that ("Two device pixels is the floor, and this rule sits on it"). F-303.

