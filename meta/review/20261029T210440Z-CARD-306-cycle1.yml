  declared 0.76 mm descent on the link line" is the precise one.

root_causes:
  - cluster: "an AST guard is written against the shape the author just wrote, not against the shapes the value could take"
    findings: [F-301, F-305]
    note: >-
      Both arms and the control were authored from the M5 plant's own text. The
      value arm enumerates values and the call arm enumerates one syntactic
      position; neither enumerates *bindings*. The control then hard-codes the
      plant's source needle, so the instrument's apparent reach is the plant's
      reach. The repair is the same for both: express the arm over the module's
      numeric constants by their PARENT NODE (which positions a justified
      literal may occupy) rather than by value or by argument position, and
      build the control by mutating the tree rather than the text.
  - cluster: "a figure stated in prose is not held by anything that runs"
    findings: [F-302, F-303]
    note: >-
      The 35 px and the "_pt_to_px_at_least applies the floor" claims both sit
      in docstrings and an ADR entry where no assertion reaches them. The tests
      beside them assert 9 and assert >= 2, so the code is right and only the
      prose is wrong — which is the class CARD-269 escalated this wave and the
      class this round itself repaired in `_RASTER_DECLARATIONS`.

findings:
  - id: F-301
    severity: high
    category: test-quality
    type: issue
    gating: false
    file: tests/test_book_puzzle_page_vector.py
    line: 2795
    title: "M5's closure catches the literal but not the binding: an allowlisted value one hop out passes every AC-3 cell"
    description: |
      `test_no_number_is_handed_to_a_drawing_call` collects `ast.Constant`
      nodes that sit directly in a `Call`'s `args` or a keyword's `value`, and
      asserts the list is empty. `test_the_module_writes_no_coordinate_of_its_own`
      asserts the module's numeric constants are exactly
      `SHEET_VECTOR_LITERALS = {0, 1, 2, 0.0, 2.0}` (:2750). Together they are
      default-DENY on two axes — but their intersection leaves a window, and the
      window contains the exact transcription M5 was.

      **Measured, on the real module, out of tree.** I added `_QR_BORDER_PX = 2`
      at module level in `book_sheet_vector.py` and replaced `_draw_qr_group`'s
      `stream.stroke_width(stream.to_points(furniture.frame.footer_rule.width))`
      with `stream.stroke_width(stream.to_points(_QR_BORDER_PX))` — the raster
      placeholder's own literal border weight, numerically identical on a book
      page, which is what made M5 invisible to every page reading. Result:
      `test_the_module_writes_no_coordinate_of_its_own` PASSES (2 is on the
      allowlist), `test_no_number_is_handed_to_a_drawing_call` PASSES (the
      argument is a `Name`, not a `Constant`), `test_the_icons_border_is_the_hairlines_own_weight`
      PASSES (2 == 2), and all 61 behaviour cells pass. Run alone: **3 passed.**
      The same holds for a local variable (`border_px = 2`).

      The escape set is exactly: a value in {0, 1, 2, 0.0, 2.0} reaching a call
      through anything that is not a bare `Constant` argument. I enumerated the
      shapes against both arms with the value 2: local variable, module
      constant, tuple literal, list literal, starred tuple, dict value,
      f-string, default argument, `f(1 + 1)` — **all silent on both arms**. And
      `f(-2)` is silent too, which is not even one hop out: `-2` parses as
      `UnaryOp(USub, Constant(2))`, so the arm's claim to catch the direct
      literal is itself qualified.

      The card says "the round found a blind spot in its own guard and closed
      it". It narrowed it by one notch. AC-3's own words are "a second
      transcription is a FAILURE", and the second transcription most likely to
      be written here — the QR border weight — still passes. ADR-0039/R2 asks
      for a set derived from an enumerable authority and treats an unanalysable
      shape as a FAILURE; the call-argument arm treats a non-Constant argument
      as *absent* instead.
    recommendation: |
      Express the arm over **positions a justified literal may occupy** rather
      than over values or over one argument slot. Concretely: walk the module's
      `ast.Constant` numeric nodes with parents attached and assert each one's
      parent node type against a small enumerated allowlist — `Compare`
      (`modules <= 0`), `BinOp` with `Mod` (the parity), `BinOp` with `Div` (the
      halving), `AnnAssign`/`arguments.defaults` on the dataclass (the type-size
      defaults) — and FAIL on any other parent, which closes `Assign` and
      `Call` in one stroke and does not depend on the value at all. A cheaper
      stopgap that still closes the measured hole: assert the module has no
      module-level numeric assignment and no numeric `Assign` inside a function
      whose name reaches a stream call.
    confidence: certain
    source: "measured — mutant M-A and M-A2, plus a 14-shape AST enumeration"

  - id: F-302
    severity: medium
    category: correctness
    type: issue
    gating: false
    file: src/nonogram/admin/book_sheet_vector.py
    line: 333
    title: "`_set_at_baseline`'s docstring states the link residual as 35 px where the test asserts 9, and the sentence is unfinished"
    description: |
      The docstring says the typed link "sets its ink one descender lower here
      than the raster page sets it: 35 px at the book's 300 DPI…" — with a
      trailing ellipsis, an unfinished sentence — and then points the reader at
      `test_the_footer_lines_sit_where_the_raster_page_sets_them`, which asserts
      `offset == 9`.

      35 px at 300 DPI is 2.963 mm; 9 px is 0.762 mm. The card declares 0.76 mm
      and is right. I re-measured the bundled face at the footer's own size:
      `type_px(INTERIOR_FOOTER_LINE_PT, DPI)` is 42 px and
      `face.getmetrics()` is `(39, 10)` — so the declared descent is 10 px and
      the measured ink offset is 9, bounded by it exactly as the test's second
      assertion says. **35 is not any figure in this system.**

      This is the class the round itself repaired two commits later in
      `_RASTER_DECLARATIONS` ("a declaration whose reason has expired is
      precisely what that registry's own `_landing_findings` has a class for"),
      and the class CARD-269 escalated this wave: a production docstring
      teaching a falsehood, with nothing that runs holding it.
    recommendation: >-
      Replace "35 px at the book's 300 DPI…" with "9 device px (0.76 mm) at the
      book's 300 DPI", finish the sentence, and consider whether 35 was a
      mis-transcription of something else worth keeping.
    confidence: certain
    source: "measured — re-ran the face metrics and read the assertion"

  - id: F-303
    severity: medium
    category: documentation
    type: issue
    gating: false
    file: tests/test_book_puzzle_page_vector.py
    line: 3094
    title: "The 2-device-pixel floor is attributed to `_pt_to_px_at_least` in four places; that function applies a ceiling, not a floor"
    description: |
      `FURNITURE_FLOOR_PX`'s comment says the floor is "applied inside
      `interior_frame` by `_pt_to_px_at_least`". The same sentence appears in
      `draw_page_rule`'s docstring (book_sheet_vector.py:256), in the card's
      correction block, and in the new ADR-0042 History entry.

      `_pt_to_px_at_least` (src/nonogram/export/layout.py:2223) is
      `_mm_to_px_at_least(points * MM_PER_POINT)` — the fewest whole pixels that
      measure **at least** the stated weight. It is a ceiling on the conversion,
      not a minimum of 2. Measured:
      `_pt_to_px_at_least(0.6) == 3`, `_pt_to_px_at_least(0.4) == 2` (both
      figures the round states, correct), but **`_pt_to_px_at_least(0.2) == 1`**
      — below the claimed floor. Nothing enforces 2 px anywhere.

      The floor holds because `INTERIOR_HEADER_RULE_PT = 0.6` and
      `INTERIOR_FOOTER_RULE_PT = 0.4` were chosen so that the ceiling lands on
      >= 2, which layout.py:1987 says in terms ("Two device pixels is the floor,
      and this rule sits on it — no exemption is claimed or needed").

      This makes the card's new EC **more** load-bearing than its own prose
      claims, not less: `test_every_frame_rule_meets_the_floor` is the only
      thing in the tree that would catch a future point constant chosen below
      0.24 pt. Worth correcting precisely because this very ADR entry is the
      correction of an earlier misattribution.
    recommendation: >-
      In all four places, say "held by the two point constants, whose
      `_pt_to_px_at_least` conversion lands at 3 px and 2 px at 300 DPI, and
      guarded by `TestPropertyTest_SheetFurniture_EveryFrameRuleMeetsTheFurnitureFloor`"
      rather than "applied by `_pt_to_px_at_least`".
    confidence: certain
    source: "measured — called the function on 0.6, 0.4, 0.2 and 0.1"

  - id: F-304
    severity: medium
    category: correctness
    type: issue
    gating: false
    file: src/nonogram/admin/book_vector.py
    line: 1118
    title: "`_XOBJECT_PAINT`'s `[ \\t]` class is narrower than PDF whitespace and wider than its control admits"
    description: |
      `_XOBJECT_PAINT = re.compile(r"(?:^|[ \t])Do(?:[ \t]|$)")`, searched per
      row of `stream.operators`. Avoiding `\b` is right and the board's trap
      list is honoured. The class is the problem, in both directions. Measured
      per row:

      * `"/Im0 Do"` FIRES, `"Do"` alone FIRES (start and end both covered, since
        each operator is its own list entry and `^`/`$` are string anchors),
        tab-separated FIRES, `<446F>` (the hex encoding of "Do") silent and
        `"/Im0Do"` silent — all correct.
      * **`"q\n/Im0 Do\nQ"` appended as ONE operator is SILENT.** So is a
        CR-separated one. PDF's own whitespace set is space, tab, CR, LF, FF and
        NUL; the class is two of the six. The docstring argues the only way to
        reach this refusal is to append the operator by hand — and a hand-written
        `q … Q` block appended as one entry is at least as natural as a bare
        single-line `Do`. The miss is on the only live path.
      * **`"0 g BT /F1 10 Tf 10 10 Td (Scan Do now) Tj ET"` FIRES** — a text
        literal containing `" Do "` is refused as an XObject paint, with a
        message about the page painting one. The negative control chose
        `"Done. Do"` and `"Dodo"`, which both happen not to match because the
        character after `Do` is `)`. The docstring's claim that the token match
        means "a literal string's (…Do…) body … is not mistaken for one" is
        true of those two bodies and false in general.

      No live string trips it today — "Solve it online", "Puzzle N · Solve it
      online", "nonogram.example/p/NNN", "20 x 25" and the folio digits are the
      whole set — so nothing ships broken. But CARD-210 is the card that edits
      the link line, and a false refusal here fails the whole book write.
    recommendation: >-
      Widen the class to PDF's whitespace (`[ \t\r\n\f\x00]`) so a multi-line
      appended operator cannot slip through, and either split each row on PDF
      whitespace and compare tokens outside `(…)`/`<…>` delimiters, or state
      plainly in the docstring that the check is token-ish over a row and that a
      literal containing a space-delimited `Do` would be refused. Add
      `"Scan Do now"` and a newline-separated `q\n/Im0 Do\nQ` to the controls.
    confidence: certain
    source: "measured — ten shapes run through the compiled pattern"

  - id: F-305
    severity: low
    category: test-quality
    type: issue
    gating: false
    file: tests/test_book_puzzle_page_vector.py
    line: 2833
    title: "The call-argument arm's control is keyed on a verbatim source needle, so it reds for the wrong reason on the mutant it exists to catch"
    description: |
      `test_the_call_argument_walk_sees_the_numerically_identical_plant` builds
      its plant with
      `source.replace("stream.to_points(furniture.frame.footer_rule.width)", "stream.to_points(2)")`
      and then `assert planted != source`.

      Under F-301's mutant the needle no longer exists, so that assertion fails
      — the cell reds while the arm it is the control for stays green. A
      reviewer who ran the mutant and saw "1 failed" would conclude the guard
      caught the transcription. It did not; I had to run the three guard cells
      alone to see it (3 passed). The same red fires on any legitimate refactor
      that touches that one line.
    recommendation: >-
      Build the plant by mutating the parsed tree (swap the `Call`'s argument
      node for `ast.Constant(2)`) rather than by string replacement, or at
      minimum assert the needle's presence as its own named check so a missing
      needle reports "the control's anchor moved" and not "the plant was
      detected".
    confidence: certain
    source: "measured — observed under M-A and M-A2"

