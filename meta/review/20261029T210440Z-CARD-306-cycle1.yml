verdict: >-
  The work is strong and most of the round's load-bearing claims reproduce
  exactly. G-1's instrument is real and I rebuilt it from scratch: all 14 raster
  interior pages are byte-identical between 560d7e09 and 77b6998d, and shifting
  the centred folio one pixel in the base tree moves **exactly 3 of 14** digests
  (pages 05, 07, 09) — the 3-of-14 proof is what was actually run. The 47/13
  footer split is not hoped for: I re-derived it from COMP-007 independently of
  the test (47 clear, 13 blocked of 60) and widened it to an independent
  240-page sweep (162/78), so both arms of the all-or-nothing verdict are
  exercised. The ADR-0037/R2 correction is **exactly right** — ADR-0037:290 says
  furniture "needs no exemption from R2 and must not claim one" and holds it to
  the 2-device-pixel dropout floor directly, which is what the round did, and
  the vacuous-exemption precedent is not repeated. `book_puzzle_vector` is
  AST-identical ignoring docstrings, so its claim is genuinely narrowed, not
  quietly preserved: the re-pointed class says so in prose *and* carries an
  in-test control that the composed page shows more. Node ids re-derived 236 →
  259, 23 added, 0 removed. 774 impact tests pass, 0 skipped.

  **The headline claim does not survive.** M5's closure is one notch narrower
  than the card says. I planted `_QR_BORDER_PX = 2` at module level and used it
  as `to_points(_QR_BORDER_PX)` — the raster placeholder's own literal border
  weight, the exact transcription M5 was, one hop out — and **all three AC-3
  guard cells passed**, `test_no_number_is_handed_to_a_drawing_call` included.
  The only cell that reddened did so because its own `source.replace` needle had
  vanished, which reads like a catch and is not one. The two arms are each
  default-DENY on their own axis, but their intersection leaves open exactly
  {0, 1, 2, 0.0, 2.0} reached through any expression that is not a bare
  `ast.Constant` in an argument position — and that set contains the one number
  the whole closure exists for. Three smaller things are measurably off: a
  production docstring states the link residual as **35 px** where the test
  asserts and I re-measured **9 px**; the dropout floor is attributed in four
  places to `_pt_to_px_at_least`, which applies a ceiling and not a floor
  (`_pt_to_px_at_least(0.2) == 1`); and the `Do` pattern's `[ \t]` class is both
  narrower than PDF whitespace (a newline-separated `Do` escapes) and wider than
  its own control admits (a text literal containing `" Do "` fires). None is a
  shipped defect. No gating finding.

