owner_render: >-
  **The comparison supports the round's claim, with one visible and declared
  difference.** I viewed vector-single-1.png against raster-single-1.png and
  vector-two-up-1.png against raster-two-up-1.png. Single page: band, header
  rule, grid, clue digits, footer hairline, centred folio "6", right-hand
  "10 x 10" label, chequer icon, "Solve it online" and
  "nonogram.example/p/001" are in the same places, at the same sizes, to the eye
  at full-page scale. Two-up: one centred folio "4", two named invitations
  ("Puzzle 1 · Solve it online", "Puzzle 2 · Solve it online"), two links, two
  chequers, **no grid-size label** — correct for a page with two sizes — and the
  pair matches the raster twin. The one difference I can see is the typed link
  sitting a hair lower in the vector pages relative to its invitation line,
  which is precisely the 9 px / 0.76 mm baseline-vs-ink-box residual the round
