    file: src/nonogram/admin/app.py
    line: 1003
    title: "AC-4 incomplete: the not-modelled refusal for an inexact count still says 'runs to N'"
    description: |
      _kdp_gutter_refusal composes three refusal texts. Two now say "about N" for an inexact
      count, but the KdpPageCountNotModelled branch returns str(unmodelled) unchanged:
      "KDP gutter table not modelled above 300 pages: this interior runs to 350. ..."
      Reproduced: InteriorCounts(page_count=350, exact=False, ...) with gutter '0.6' returns that
      text. MAX_MODELLED_PAGE_COUNT is 300, so any book with ~250+ puzzles and an unlayable print
      spec hits it, while the screen says "About 350". AC-4 ("the refusal for an inexact count
      uses the same 'about' wording as the screen") is not met on this branch, and the sheet-free
      upper bound is stated as a fact. The rewrite is also done by str.replace on book_kdp's prose
      (app.py:1006-1009), which silently no-ops on a rewording.
    suggestion: |
      Apply the same treatment to the not-modelled text when not counts.exact (e.g. replace
      f"runs to {n}." with f"runs to about {n}.", or build the message in app.py), and add a test
      in TestFinaliseGutter_InexactRefusalSaysAbout with page_count > MAX_MODELLED_PAGE_COUNT and
      exact=False asserting "about".
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
