    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 940
    title: "Malformed-row discrimination can downgrade a real tripwire to a WARNING and None"
    description: |
      Any exception from interior_stream is classified as 'malformed row' if
      unpaired_interior_page_count(puzzles) raises ValueError, regardless of what interior_stream
      actually raised. A book holding a malformed row AND hitting an exporter tripwire is logged
      at WARNING with the misleading message "a row's answer cannot be packed". The book still
      cannot leave draft and no "About N" is shown, so AC-1 holds, but the exporter bug is
      misattributed.
    suggestion: |
      Classify by the exception itself (RuntimeError whose __cause__ is ValueError from
      answer_key's "could not be laid out"), or log at ERROR when the caught exception is not that one.
    confidence: medium
    source: static
