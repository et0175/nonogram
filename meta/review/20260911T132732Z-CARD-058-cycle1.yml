  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/generate_batch.html
    line: 43
    title: "predict_size() and size_substitution() each recompute _predict_size_detailed() independently"
    description: |
      Both templates call `image.predict_size()` and then
      `image.size_substitution()` in the same render pass. Each call
      re-runs `_predict_size_detailed()` (re-clamps `stated`, re-runs
      `derive_extent`, and for the substitution path re-runs the
      `range(stated, MAX_SIZE + 1)` search loop) from scratch — the two
      public methods don't share one cached result. `_source_shape()` is
      cached on the instance so the expensive part (image re-decode) isn't
      duplicated, and the remaining arithmetic is cheap, so this is not a
      performance problem at today's batch sizes. It is a minor missed
      opportunity given the Worktree notes' own stated rationale for
      `_predict_size_detailed()` ("computed once so the two can never
      silently disagree") — the two calls per image do still compute it
      twice, just consistently.
    suggestion: |
      Optional: cache `_predict_size_detailed()`'s result on the instance
      the same way `_source_shape()` is cached, if batch sizes grow enough
      for this to matter. Not worth blocking on for a 0.25d card.
