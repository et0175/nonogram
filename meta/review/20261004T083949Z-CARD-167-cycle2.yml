      11 pt. A sweep of 80 trims (widths 10-30, heights 14-48 cm, counts 150/50/50/50) under-reads on 20 (e.g. 11x17,
      10x25, 20x14 cm). CON-020 itself holds by construction (one 11 pt face for all body text, title >= body), so this
      is not a breach, but the floor test can only be applied to hand-picked trims, and its docstring frames the failure
      as "a copy problem to fix" while the same orphan ("way." alone) still prints on 11x17 cm.
    suggestion: |
      Either measure per-line size with a reference matched to the line's own tallest glyph class (x-height vs cap), or
      state in the docstring that the measurement is valid only where every line reaches cap height and list the trims
      it is applied to; optionally note the orphan as copy follow-up.
