    title: "Guard reads only the URL path; a query-string dbname could redirect the connection"
    description: |
      `_database_name` takes the last path segment minus the query. A URL like
      `postgresql://u@h/nonogram_test?dbname=nonogram_dev` passes the guard while libpq/psycopg2 may honour
