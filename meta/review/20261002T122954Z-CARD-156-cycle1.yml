    category: tech-debt
    type: risk
    file: tests/conftest.py
    line: 246
    title: "Session-level DROP SCHEMA has no lock_timeout and leaks the engine on failure"
    description: |
      The per-test TRUNCATE sets `lock_timeout = '10s'` so a leaked session errors instead of hanging, but
      the once-per-session `DROP SCHEMA public CASCADE` does not; with four pipelines sharing nonogram_test,
      any open connection holding a lock on a public table blocks it until the hang guard kills the run.
      If the DROP raises, `engine` is never disposed (only the alembic-failure branch disposes it).
    suggestion: "SET LOCAL lock_timeout in the same engine.begin() block; wrap setup in try/except that disposes the engine."
    confidence: medium
