  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_card_156_db_fixture.py
    line: 54
    title: "AC-2 spy is swallowed by _unreachable_reason, so a guard moved after the probe makes the test skip, not fail"
    description: |
      The spies raise AssertionError. `_unreachable_reason` (conftest.py:79) catches `Exception` and turns
      it into an "unreachable" reason, after which db_session calls pytest.skip (conftest.py:289-291). If
      the guard at conftest.py:288 were moved below the reachability check (i.e. a connection attempt
      before the refusal — exactly what AC-2 forbids), `request.getfixturevalue("db_session")` raises
      Skipped, which `pytest.raises(pytest.fail.Exception)` does not catch (Skipped and Failed are sibling
      OutcomeExceptions). The test is reported SKIPPED — green in a "0 failed" gate — and
      `assert connection_attempts == []` is never reached although the list is non-empty.
    suggestion: |
      Make the spy record and return a failing stub without raising into the code under test, or convert a
      skip into a failure in the test (catch pytest.skip.Exception and pytest.fail on it), and assert
      `connection_attempts == []` in a finally/teardown so it runs whatever the fixture raised.
    confidence: high
    source: static
