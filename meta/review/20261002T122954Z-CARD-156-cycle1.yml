    file: tests/test_card_156_db_fixture.py
    line: 104
    title: "AC-3 test cannot detect a per-test schema rebuild (session scope -> function scope survives)"
    description: |
      Both AC-3 tests list `_test_database_tables` as their first parameter, before `per_test_sql`
      starts listening, by design ("what per_test_sql sees is exactly db_session's own per-test work").
      If `_test_database_tables` (conftest.py:207) were function-scoped, pytest would build it — DROP
      SCHEMA public CASCADE + alembic upgrade head — for every test, still before the listener, and
      `db_session`'s `request.getfixturevalue("_test_database_tables")` (conftest.py:292) would return the
      per-item cached instance. No DROP is ever observed, TRUNCATE is still seen, batches count is 0,
      alembic_version == heads: both tests pass. The class is named SchemaIsBuiltOncePerSession and is
      the sole test for AC-3 ("no DROP per test"), yet the one regression that reintroduces a per-test
      DROP is invisible to it.
    suggestion: |
      Observe the session fixture across tests: e.g. record the yielded engine (or a module-level build
      counter incremented inside _test_database_tables) on the class in test 1 and assert identity/count==1
      in test 2; or in test 2 drop `_test_database_tables` from the signature, start `per_test_sql` first
      and assert no DROP/CREATE while db_session resolves (the session fixture is already built by test 1;
      guard with a skip if test 2 runs alone).
    confidence: high
