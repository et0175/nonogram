verdict: >-
  DOES NOT CERTIFY at 7.0, on one guardrail miss and one measured
  mis-attribution. Everything else in this commit is of a quality I would have
  certified at 9: the four AST pins really were re-derived and I re-derived all
  four myself, the default-DENY claims are all four real and I proved the one
  the dispatch doubted with my own two-branch experiment, and the F2-01 fix
  ships with controls that bite.

  WHY IT DOES NOT CERTIFY. (1) G-6 is not met. ADR-0042/R2's check is still
  `check: {kind: review-lens}` at the branch HEAD. The card's item 3 says
  "flip R2's check likewise" and G-6 says "R2's lens must not survive this
  card". The round instead wrote, into the ADR itself, "CARD-298 leaves the
  flip to the merge, as this board does, and records that it is owed". I
  measured that convention and it does not exist: the two other cards on this
  board carrying the identically worded guardrail both landed the flip in
  their OWN feature commit -- CARD-227 in `7d86a869`, CARD-294 in `0c63a328`.
  The flip is a one-line edit, the named test exists and is green, and leaving
  it undone means the rule this card exists to make mechanically checked stays
  a lens on main with nobody owing it. (2) All five `expires_with=('CARD-299',)`
  values are wrong, and the mechanism the card advertises as the thing that
  will notice cannot notice it. CARD-299 is test-side only (measured: its
  Touches names six test modules, requirements.yml and the ADR -- not one file
  under `src/`), so it converts no page; and `_declaration_findings` fires the
  expiry finding only when a page's medium actually CHANGED, so when CARD-299
  lands with nothing converted the five entries go silently stale. That is the
  card's own guard failing to catch a real mis-attribution, in the direction
  ADR-0042/R2's statement is actually written in ("once CARD-231 lands, the
  divider's exception goes with it").

  Both are small to fix and neither is a product-correctness defect. No book
  this product ships changes a byte on this branch, and I verified that rather
  than assuming it.

  WHAT I CERTIFY POSITIVELY, each from a run. (a) The four default-DENY claims
  are real defaults, not two-branch classifiers with a fallback -- and
  `_UNCLASSIFIABLE` is a genuine third outcome, which I proved by building the
  round's two probe pages myself and running three classifiers over them (see
  findings/positive.default_deny). (b) The four AST pins were RE-DERIVED, not
  bumped: I reproduced the OLD figures from the base module's source and the
  NEW figures from HEAD's, through the test's own analyser and through two
  analysers I wrote from scratch. A bumped pin would have failed that test.
  (c) The widened `zigzag` assertion is a widening: it pins nine names where
  it used to pin one, and it preserves `unclassified == ("zigzag",)` verbatim.
  (d) G-1, G-2, G-3, G-4, G-5 and G-7 all hold, measured. (e) ADR-0006/R1's
  substance holds: pyproject.toml is a 0-file diff and the only import lines
  added to `src/` are stdlib `enum` and a `from nonogram.admin.book_vector
  import (...)` block.

