  - id: F-001
    severity: important
    gating: true
    confidence: high
    source: measurement
    title: "G-6 is not met: ADR-0042/R2's check is still `review-lens`, and the stated reason for leaving it is a board convention that does not exist"
    where: "meta/architecture/decisions/adr/0042-book-interior-is-vector-cover-stays-raster.md:403 (branch 283164a9)"
    what_the_card_asks: >-
      Item 3: "Write tests/test_book_pdf.py::test_every_raster_page_is_declared_with_its_reason
      and flip R2's check likewise." G-6: "ADR-0042/R2's lens must not survive
      this card." The Architecture context line adds "R2 lands here".
    what_the_commit_did: >-
      It rewrote R2's statement, rewrote R2's comment block to say "The test now
      EXISTS and is green", named three node ids beneath it -- and left
      `check: {kind: review-lens}` in place, with the sentence "CARD-298 leaves
      the flip to the merge, as this board does, and records that it is owed."
    how_i_reproduced_it: >-
      (1) `awk '/^- id: ADR-0042/{id=$3} /check:/{print id": "$0}'` over the ADR
      at HEAD -> R2 is review-lens. (2) The claimed convention, tested against
      the board: `grep -rn "lens must not survive" meta/kanban/cards/*.md`
      returns four cards -- CARD-227 (G-6, ADR-0037/R2), CARD-294 (G-8,
      ADR-0042/R5), CARD-298 (G-6, this one) and CARD-299 (G-9, ADR-0042/R6).
      Of the two that are done, BOTH flipped in their own feature commit:
      `git log -S "TestBookGridRules_HasThreeWeights" -- .../0037-*.md` ->
      `7d86a869 feat(book): CARD-227 the printed grid gets the owner's three
      rule weights`; `git log -S "ref: test_the_interior_embeds_the_projects_own_face"
      -- .../0042-*.md` -> `0c63a328 feat(book-export): the interior's vector
      drawing vocabulary...`, which is CARD-294's own feature commit. Neither
      flip waited for a merge.
    why_it_matters: >-
      The flip is the whole point of the rule's half of this card. Left as a
      lens, ADR-0042/R2 reads to system_rules.py and forge:review Step 8h as a
      rule a human must look at, when a derived, default-DENY, corpus-swept test
      for exactly its statement now exists and is green. The failure mode is the
      mirror of the one the round correctly refused for R1: there, a flip would
      have overclaimed; here, a non-flip underclaims and leaves nobody owing it,
      because the card will close and its Touches already name the ADR.
    cost_to_fix: >-
      One line: `check: {kind: test, ref: "tests/test_book_pdf.py::test_every_raster_page_is_declared_with_its_reason"}`
      on R2, in the style R5 already uses in the same file. The ref resolves (the
      def exists at tests/test_book_pdf.py and passed in my impact run).
    also_owed_with_it: >-
      The card's Trace line says "R2's check becomes a live test ref here, so
      only its trace row is re-stamped in this card". Measured:
      meta/architecture/trace.yml contains NO ADR-0042 rule rows at all --
      `grep -n "ADR-0042" meta/architecture/trace.yml` returns two prose
      mentions (lines 1813 and 1853) and nothing resembling a row, and a grep
      for "0042/R2" or "0042/R5" returns nothing. So there is no R2 trace row
      to re-stamp and that instruction is unactionable as written. Either the
      card's Trace line or trace.yml's shape needs amending; the commit is not
      at fault for not doing the impossible.

  - id: F-002
    severity: important
    gating: false
    confidence: high
    source: measurement
    title: "All five `expires_with=('CARD-299',)` values name a card that converts no page, and no card on the board converts them"
    where: "src/nonogram/admin/book_pdf_generator.py, _RASTER_DECLARATIONS entries for PageKind.TITLE, GUIDE, TOC, ANSWER, PUZZLE"
    measurement: >-
      (1) CARD-299's declared scope, read from the main repo
      (meta/kanban/cards/CARD-299.md:19): Touches names
      tests/test_book_interior_type_floor.py,
      tests/property/test_book_export_interior.py,
      tests/property/test_book_layout.py, tests/property/test_book_two_up.py,
      tests/test_book_pdf.py, tests/test_book_pdf_memory.py,
      meta/architecture/requirements.yml and the ADR. NOT ONE FILE UNDER src/.
      Its items 1-5 re-express assertions, move the registry's verifying tests,
      write R6's guard and flip R6's check. Nothing in it writes a page.
      (2) Board sweep for a card that would: I read every
      meta/kanban/cards/CARD-*.md Touches line for `book_pdf_generator`. Of the
      non-done ones (CARD-207/208/209/210/226/229/230/231/232/233/273/289), none
      is the ADR-0042 interior conversion; CARD-231 is the divider redesign
      only, and CARD-295/296/297 (all done) built the four vector page writers,
      three of which still cannot be called from the interior's walk at all.
      So the five entries name the wrong card AND the right card does not exist.
    answer_to_the_dispatchs_question: >-
      NO -- AC-3's expiry mechanism will NOT red when CARD-299 lands without
      converting anything, and I measured why rather than inferring it. The
      expiry finding in `_declaration_findings`
      (tests/test_book_pdf.py:1607-1613) fires on `declaration is not None and
      _RASTER not in media` -- i.e. only when the page's medium has ACTUALLY
      CHANGED. CARD-299 changes no medium, so the pages stay raster, the
      declarations stay matched, `findings` stays empty, and the five entries go
      silently stale on the day their own `expires_with` is satisfied.
      Independently: `expires_with` is read in exactly two places in the whole
      tree -- tests/test_book_pdf.py:1611 (message formatting) and :1618 (a
      `re.fullmatch(r"CARD-\d+", card)` FORMAT check). Nothing anywhere reads
      a card's status. The field is documentation wearing a guard's clothes.
    so_the_cards_own_claim_is_half_true: >-
      The registry's docstring says the set "shrinks by deletion as each
      converting card lands -- which is precisely what AC-3's expiry check
      exists to force". AC-3's check forces the CONVERSION direction (page went
      vector, entry left behind) and I confirm it does that well. It does not
      and cannot force the LANDING direction, which is the direction
      ADR-0042/R2's statement is written in: "once CARD-231 lands, the divider's
      exception goes with it". If CARD-231 ships a redesigned divider that is
      still a bitmap, the declaration's reason is spent and nothing reds.
    disagreement_with_the_card: >-
      I disagree with the card's framing, backed by the measurement above, on
      one point: the declared set of seven is honest and I endorse it, but five
      of its seven `expires_with` values currently point at a card that cannot
      discharge them, and the card's own text ratifies that ("TITLE / GUIDE /
      TOC / ANSWER / PUZZLE (each expiring with CARD-299)"). The card needs
      amending as much as the code does.
    suggested_fix: >-
      Either (a) retarget the five to the card that will actually convert the
      pages, which means cutting it -- the decompose station owes it, and
      CARD-295 already names CARD-298 for the related puzzle-page furniture gap,
      which CARD-298 also cannot close; or (b) keep CARD-299 named and add
      CARD-299 the obligation to re-target or delete them, stated on CARD-299.
      Either way the honest reading today is "blocked by work nobody owns", and
      that is worth writing into the reasons, which currently read as though
      CARD-299 were the converting card.

  - id: F-003
    severity: minor
    gating: false
    confidence: high
    source: measurement
    cluster_root: "same root cause as F-002: an expiry declared as data with no mechanism that reads the expiry condition"
    title: "AC-3's test simulates the conversion well, but the `expires_with` tuple itself has no control of any kind beyond a format regex"
    judgement_the_dispatch_asked_for: >-
      "Judge whether this actually simulates CARD-231's landing or merely
      toggles a dict." It does substantially more than toggle a dict, and I
      checked each step. It lifts the divider's declaration, asserts
      `page_medium(DIVIDER) is PageMedium.VECTOR`, builds a REAL ContentStream
      at the real divider page frame with a real `text()` operator, writes it
      through PRODUCTION's `_write_pdf`, and classifies the result off the
      WRITTEN BYTES (`_page_media(data) == [_VECTOR]`). Only then does it
      restore the entry -- and the restore is the defect being simulated, not a
      shortcut. So: a real simulation of the conversion direction.
    the_two_bounded_weaknesses: >-
      (1) It cannot simulate CARD-231 writing a vector divider, because no
      vector divider writer exists; the ContentStream is hand-built. Unavoidable
      and correctly so. (2) It calls `_declaration_findings` on a hand-built
      `{PageKind.DIVIDER: set(media)}` rather than through `_media_by_kind` over
      a real interior, so the live interior path is not exercised in the expired
      direction. That path IS exercised in the converted direction by
      test_no_interior_page_carries_an_image_xobject_in_a_mixed_file, over a
      whole real interior with TITLE lifted, so the gap is narrow -- but the
      same test could have been written over `export_interior` with TITLE,
      which would have closed it.
    why_it_matters_more_than_the_card_predicted: >-
      The dispatch is right that this mechanism is now load-bearing for five
      more declarations than the card predicted. On that heavier load its one
      real gap (F-002's landing direction) is the one that will be reached
      first, because CARD-299 is the next card in the phase.

  - id: F-004
    severity: minor
    gating: false
    confidence: high
    source: measurement
    title: "A test docstring cites an off-tree probe file that does not exist anywhere"
    where: "tests/test_book_export_interior_cover.py, the CALLEE_EXEMPTION_COST comment block (~:3651): \"an AST census written for this card (``scratchpad/card298/ast_delta.py``) reads +42 ``ast.Call`` nodes\""
    measurement: >-
      The path does not exist. The card-298 worktree has no `scratchpad/`
      directory at all (`ls` -> No such file or directory). The main repo's
      `scratchpad/` holds card284, card284fix and card305 only. So the named
      artefact cannot be opened by anyone.
    what_i_did_about_it: >-
      I re-derived the figure myself rather than trusting it: `ast.Call` node
      count over book_pdf_generator.py is 838 at 8b307c22 and 880 at HEAD,
      delta exactly +42. So the CLAIM is true and the cross-check is sound. It
      is the CITATION that is dangling.
    why_it_matters: >-
      G-7 is right to keep probes out of tests/, but a cross-check whose
      provenance is a path nobody can open is a cross-check nobody can re-run,
      which is the same failure shape as a dead check ref one level down. Either
      commit the census under meta/profiling/ (where rank_durations.py and the
      migration census already live, and where the ADR-0042 phase has precedent
      for exactly this), or state the derivation in the comment in a form a
      reader can re-execute in one line. The derivation is in fact a one-liner,
      which is what makes the dangling path avoidable.

  - id: F-005
    severity: minor
    gating: false
    confidence: high
    source: measurement
    title: "M8's repair is an adequate mutation control but not a second authority: the \"different door\" is the same door, re-indexed"
    where: "tests/test_book_pdf.py::test_the_page_kinds_are_the_positions_the_plan_itself_states"
    judgement_the_dispatch_asked_for: >-
      "Decide whether that is an adequate independent reading or a restatement,
      and whether the weakness is honestly bounded or merely mentioned."
      Verdict: ADEQUATE AS A CONTROL, OVERSTATED AS INDEPENDENCE, and the
      weakness is bounded for two of its three parts and unmentioned for the
      third.
    measurement: >-
      The test's docstring says the kinds are "read a second time, off a
      different authority ... the public BookPDFGenerator.section_plan door".
      That is the SAME door production reads: interior_stream itself does
      `decided = self.section_plan(puzzles)` (book_pdf_generator.py:7102) and
      `section = decided.pages` (:7112). The test calls the same method and
      reads the same attribute, getting the same objects in the same order. And
      the kind discrimination is the same predicate transcribed twice --
      production writes `PageKind.DIVIDER if isinstance(entry, DividerPagePlan)
      else PageKind.PUZZLE`, the test writes `if isinstance(entry,
      DividerPagePlan): ... elif isinstance(entry, PuzzlePagePlan): ...`.
    what_is_genuinely_independent: >-
      The ORDERING authority, and only that: production reads kind-at-position
      from enumeration order, the test from `entry.page_number`. That is a real
      second fact and it is worth having -- it would catch a SectionPlan whose
      `pages` order disagreed with its own page_numbers, which nothing else
      checks. And because the test carries its own transcription of the
      predicate, a production-only mutant in the kind mapping IS killed. So the
      M8 shape dies here, structurally. I did not execute M-A (mutation
      deferred, see coverage.mutation) and I therefore report this as a
      structural derivation, not as a measured kill.
    the_unmentioned_third_part: >-
      The docstring honestly names the front matter and the answer tail as "the
      same arithmetic restated". It does NOT name the shared `isinstance`
      predicate, and it claims the two readings "share nothing about which KIND
      sits at which position" -- which is one step too strong, since both derive
      the kind from the plan object's class. Also unmentioned: the answer tail is
      not production-equivalent. Production guards the SOLUTIONS divider on `if
      payloads:`; the test guards it only on `generator.divider_pages` and takes
      the answer count from `stream.answer_page_count`. On a book with no
      drawable member the two disagree. The corpus always has payloads, so the
      branch is unexercised rather than wrong -- but it is a restatement that
      diverges, which is strictly worse than one that does not.

  - id: F-006
    severity: nit
    gating: false
    confidence: high
    source: measurement
    title: "AC-1's \"refused before the buffer exists\" is not true of the representation refusal (and cannot be)"
    measurement: >-
      In `_write_pdf`, the `mode` check and the `len(kinds) != page_count` check
      both precede `written = BytesIO()`. The two representation refusals (a
      bitmap under a VECTOR medium, a ContentStream under a RASTER one) are
      inside the `for page in _as_planned(pages, page_count)` loop, after the
      buffer, the header and the catalog have been written. Necessarily so: the
      pages arrive one at a time from a generator (CARD-145), so their types
      cannot be known before the buffer exists.
    why_it_is_only_a_nit: >-
      The substance holds. The buffer is a local BytesIO and the TypeError
      propagates out of the method, so nothing half-written escapes -- which is
      the property tests/test_book_pdf_memory.py's
      TestBookPdfMemory_NothingHalfWrittenEscapes owns, and whose two cells this
      commit correctly updated for the new keyword. The docstring the round
      wrote is accurate ("anything else raises before it is written" -- before
      the PAGE is written). It is AC-1's and the dispatch's wording that
      overstates. Amend AC-1, not the code.

positive:
  default_deny:
    question: "are the four default-DENY claims real defaults, or two-branch classifiers with a fallback?"
    verdict: "all four are real. Four for four."
    claim_1_page_medium:
      real: true
      measurement: >-
        `page_medium` has two independent defaults, not one. (a) `if not
        isinstance(kind, PageKind): raise TypeError` -- so the string "puzzle",
        None, 0 and the PageKind CLASS itself all raise rather than reaching a
        medium. Driven over all four by
        TestWritePdf_RefusesWhatItCannotWrite::test_the_decider_refuses_something_that_is_not_a_page_kind.
        (b) For something that IS a kind, `RASTER if kind in
        _RASTER_DECLARATIONS else VECTOR` -- so raster requires a declaration
        and a NEW page kind is vector by default. That is the direction
        ADR-0042/R2 asks for; an allow-list of vector kinds would have been the
        inverse and would have let a forgotten kind ship as a bitmap.
    claim_2_page_media:
      real: true
      is_unclassifiable_a_genuine_third_branch: "YES -- measured, not read"
      measurement: >-
        I built the two probe pages MYSELF, out of tree, with the same
        PIL.PdfParser construction the test uses (a page naming both an
        /XObject and a /Font, and a page with an empty resource dictionary),
        confirmed each is a readable PDF whose resource keys come back as
        {'Font','XObject'} and set() respectively, and ran THREE classifiers
        over them:
          3-branch (shipped):        both -> unclassifiable, neither -> unclassifiable
          2-branch, image tested 1st: both -> raster,        neither -> vector
          2-branch, font tested 1st:  both -> vector,        neither -> raster
        So BOTH two-branch spellings misclassify BOTH probes, and
        test_a_page_whose_medium_cannot_be_determined_is_a_defect (which
        asserts `== [_UNCLASSIFIABLE]` for each) kills either one. The else arm
        is not a fallback onto a medium: `_UNCLASSIFIABLE` is never returned as
        a medium and `_declaration_findings` turns it into a finding
        unconditionally, ahead of every other clause.
      probes_are_not_in_the_tree: "confirmed -- built in-memory into a BytesIO inside the test function; the diff adds no file under tests/"
    claim_3_representation_refusal:
      real: true
      both_directions: true
      measurement: "two `isinstance` guards raising TypeError, one per arm, each driven by its own cell (test_a_bitmap_under_a_vector_declaration_is_refused, test_a_stream_under_a_raster_declaration_is_refused). See F-006 for the one wording correction."
    claim_4_kinds_length:
      real: true
      measurement: "`if len(kinds) != page_count: raise ValueError`, before the buffer. Driven by test_a_kind_list_that_is_not_one_per_page_is_refused."
    ac_4_non_vacuity:
      cell_exists: true
      where: "tests/test_book_pdf.py::TestWritePdf_TheMediumIsChosenInOnePlace::test_the_decider_is_the_only_function_that_reads_the_registry"
      what_it_asserts: "`reads == ['page_medium']` -- exactly one Load of _RASTER_DECLARATIONS in a function, and that function is the decider. Removing the registry read entirely would make `reads == []` and red it, which is precisely the vacuity the dispatch asked me to check for."
      second_non_vacuity_cell: "test_the_writer_asks_the_decider_once_per_page asserts `callers == {'_write_pdf': 1, 'produce': 1}` -- so the decider is actually called, by name, from exactly the two places."
      the_four_plants: >-
        Confirmed, and three of the four are genuinely not the obvious second
        if/else: (1) a second if/else in the page loop -- the obvious one;
        (2) a medium inside a dict literal `{PageKind.TITLE: PageMedium.VECTOR}`;
        (3) a helper `def _medium_for(kind): return PageMedium.VECTOR`;
        (4) `if PageKind.TITLE in _RASTER_DECLARATIONS` in another function.
        The guard's allow-shape is narrow enough to catch all four: a
        `PageMedium.<member>` attribute is permitted ONLY inside the decider or
        as an ast.Compare operand, so Assign, Return, Dict-value and argument
        positions all report. `test_each_plant_is_found` also asserts the clean
        string reports nothing, so both directions are driven on the same pure
        function.
      one_honest_caveat: >-
        `test_the_shipped_module_decides_in_one_place` and
        `test_each_plant_is_found` both route through the same `findings()`
        classmethod, so they are not independent OF EACH OTHER -- a defect
        inside `findings()` reds both or neither. That is the right design (one
        implementation, driven from both sides) and the dispatch's own standard
        for _declaration_findings; noting it so the cell count is not read as
        two independent readings.
  ast_pins:
    question: "were the four pins RE-DERIVED or BUMPED?"
    verdict: "RE-DERIVED. All four. This is the strongest thing in the commit."
    method: >-
      For each pin I measured BOTH sides: I extracted the base module source
      (`git show 8b307c22:src/nonogram/admin/book_pdf_generator.py`) and ran the
      SAME instrument over the base source and over HEAD's. A bumped pin fails
      that test immediately, because the OLD figure would not reproduce from the
      OLD source. All four old figures reproduced exactly.
    pin_1_inside_17_to_18:
      re_derived_by_me: true
      independence: "fully independent -- I wrote my own ast walk from scratch (count ast.Call whose callee name is in ('page_spec','book_page_spec'); count matching FunctionDefs) rather than calling the test's helper"
      result: >-
        base 17 calls / 1 def; HEAD 18 calls / 1 def. I then attributed the
        extra call by resolving each call's enclosing function by descent:
        base's enclosers are default_toc_frame, __init__, page_spec, cell_sizes,
        _puzzle_page_spec, create_guide_page, create_title_page,
        create_divider_page, create_toc_page, _two_up_page, solved_puzzle_page,
        _packed_answer_page x2, section_plan, interior_stream x3. HEAD's list is
        identical PLUS `vector_title_page` at line 5013. So the one added call
        is `self.page_spec(page_number)` inside vector_title_page, exactly as
        the comment names it, and the definition count is unmoved at one.
    pin_2_position_site_count_24_to_25:
      re_derived_by_me: true
      result: >-
        Ran the test's own `_page_positions(source=...)` against both sources
        out of process. BASE -> 24 sites, vocabulary unchanged at the six
        POSITION_NAMES, 0 refusals, kinds {door argument: 6, parameter default:
        6, assignment: 5, augmented: 3, loop: 2, argument: 2}. HEAD -> 25 sites,
        same vocabulary, 0 refusals, kinds identical EXCEPT `parameter default`
        6 -> 7. I then diffed the row SETS: ADDED = exactly one row,
        `('parameter default', 'vector_title_page(page_number)', '1')`; REMOVED =
        empty. Row-by-row attribution confirmed; nothing drifted in the other 24.
    pin_3_guide_counting_8_to_9:
      re_derived_by_me: true
      independence: "fully independent -- my own outermost-expression walk over GUIDE_PAGE_COUNT Load names"
      result: >-
        base 8, HEAD 9. The 8 base sites and 8 of the 9 HEAD sites are the same
        expressions; the one added site is at HEAD line 7387, `range(1 +
        TITLE_PAGE_COUNT, TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT + 1)` in
        interior_stream's page-kind walk -- character-for-character the same
        spelling as produce()'s own guide range at HEAD line 7445, which is the
        claim the comment makes ("so the two walks read as one walk"). And the
        spelling choice is load-bearing: as `[PageKind.GUIDE] * GUIDE_PAGE_COUNT`
        the expression would contain no TITLE_PAGE_COUNT and would red the
        INNER assertion of that test, which is what the comment says was
        measured.
    pin_4_callee_exemption_cost:
      re_derived_by_me: true
      result: >-
        BASE source through the shipped analyser -> ((), 776), (('builtins',),
        522), (('builtins','definitions and imports'), 204), (+parameters, 202),
        then 0, 0 -- the EXACT four old figures. HEAD source -> 816, 546, 212,
        210, then 0, 0 -- the exact four new ones. The old pins reproduce from
        the old source, which is the signature of a re-measurement and the
        opposite of a bump.
      attribution_reconciles_arithmetically: >-
        Step deltas from my own ladder: total refusals +40 (776->816);
        builtins absorbs 16 more (step 254 -> 270), definitions-and-imports
        absorbs 16 more (318 -> 334), parameters absorbs 0 more (2 -> 2),
        receiver-attribute absorbs 8 more (202 -> 210). 16 + 16 + 0 + 8 = 40,
        with no remainder. The comment's three named groups sum to exactly those
        three numbers: 16 builtins (isinstance x4, TypeError x3, range x3, len
        x2, type x2, ValueError, tuple), 16 definitions/imports
        (RasterDeclaration x7, page_medium x2, dataclass, page_frame,
        ContentStream, write_face_objects, write_vector_page,
        interior_face_bytes, interior_face_metrics), 8 receiver attributes
        (page_kinds.extend x5, pdf.next_object_id x3 -- and I checked that
        third one: next_object_id goes 3 -> 6 in _write_pdf because the three
        font ids are allocated under `if any_vector`).
      cross_domain_check_reproduced: >-
        +42 ast.Call nodes (838 -> 880), measured by me. Residual against the
        +40 refusals is exactly 2, and I can name both: `self.page_spec` and
        `self.vector_title_page`, whose receiver `self` IS a definition this
        module makes, so they resolve rather than refuse. `append` nets zero
        because `image_refs.append(...)` became a dict subscript assignment
        while `page_kinds.append(...)` appeared. Two readings, one
        reconciliation, no unexplained remainder -- the round's claim, and it
        holds under my own measurement. See F-004 for the one problem: the file
        the comment cites for this does not exist.
  zigzag:
    question: "is the widened assertion a widening or a weakening?"
    verdict: "a WIDENING, unambiguously"
    measurement: >-
      Old: `assert doors == ("zigzag",)`, twice. That tuple was only ever true
      BECAUSE of the vars() defect -- it measured a subclass whose own __dict__
      held one member while the eight doors it really exposes sat outside the
      reading. New: `assert set(doors) == set(_STROKERS) | {"zigzag"}` -- still
      an EQUALITY, now over nine names instead of one, so it pins eight members
      it previously could not see. zigzag is still required in the set (it is an
      explicit term of the union). And the second half is preserved verbatim:
      `unclassified == ("zigzag",)` with the probe removed, which also requires
      the eight strokers to remain CLASSIFIED -- so the widened surface did not
      widen the verdict.
      Two incidental improvements: the old second assertion was a single `and`
      conjunction whose failure message could not say which half broke; it is
      now two asserts with messages.
      One incidental loss, immaterial: tuple ordering is no longer pinned (set
      equality). `_public_members` returns `sorted(...)`, so the order is
      deterministic anyway, and with one element the old ordering pinned nothing.
    the_fix_is_bounded_by_its_own_cells: >-
      `set(_STROKERS)` could in principle follow a shrinking _STROKERS, so I
      checked it is pinned elsewhere:
      test_the_derivation_is_unmoved_on_the_shipped_class asserts `len(_STROKERS)
      == 8`, and the live guard cell asserts the eight names literally and
      `len(members) == 16`. It cannot drift silently.
    f2_01_itself: >-
      Correct, and I checked the one thing that would have made dir() unsafe
      here: metaclass leakage. `dir()` on a class does NOT merge the metaclass's
      own public surface in CPython 3.14 (measured: 'mro' not in
      dir(ContentStream); a class with a metaclass defining `helper` reports no
      public names). dir(ContentStream) minus underscores is exactly the same 16
      names vars() gives, so the fix is a no-op at HEAD, which is what makes it
      safe to ship inside a merge gate. The over-returning version is caught by
      the LIVE cell (`_UNCLASSIFIED_DOORS == ()`) and by `len(members) == 16`
      and by `set(_NOT_A_DOOR_BECAUSE) == unwatched`, not by inspection.
  book_vector_public_surface:
    question: "is making write_face_objects and write_vector_page public the minimum change, and does write_vector_pdf really route through the new function?"
    verdict: "minimum change, and yes it routes -- not a copy"
    measurement: >-
      The diff shows write_vector_pdf's loop body DELETED and replaced by a call
      to `write_vector_page(pdf, stream, page_refs[index], contents_refs[index],
      font_ref)`; the deleted lines and the new function's body are the same
      statements, so there is one definition and no second transcription.
      Likewise `_write_face(...)` became `write_face_objects(...)` at the one
      existing call site, with the body unmoved. Two names changed visibility,
      nothing else; no signature changed, no behaviour changed, and the one
      affected docstring reference was updated
      (tests/test_book_pdf_vector_primitives.py).
    is_the_single_definition_claim_asserted_or_argued: >-
      ARGUED, not asserted -- and that is a real gap, though a small one. No
      test holds the package to "exactly one definition of what a vector page
      object looks like". What IS asserted is the consequence:
      TestVectorFontObjects_TheDescriptorStatesTheFacesOwnMetrics reads every
      /FontDescriptor value back off a written file, and
      test_no_interior_page_carries_an_image_xobject_in_a_mixed_file asserts
      `len(embedded_faces(data)) == 1` on a mixed file and `== []` on a
      raster-only one -- so a second transcription that disagreed would be
      caught on the values. I do not raise this as a finding: AC-4's AST guard
      is the precedent for how this board would assert it, and extending that
      guard to book_vector.py is a reasonable thing for a later card to want
      rather than a defect in this one.
  adr_0006_r1:
    checked_as_substance_not_by_the_dead_ref: true
    measurement: "`git diff --name-only 8b307c22..HEAD -- pyproject.toml` -> 0 files. `git diff 8b307c22..HEAD -- src/ | grep -E '^\\+(import|from) '` -> exactly two lines: `import enum` (stdlib) and `from nonogram.admin.book_vector import (` (internal). No third-party runtime dependency added."
    note_on_the_ref: >-
      The ref this card's system contract names for ADR-0006/R1 is DEAD -- zero
      definitions anywhere in this repo. I am naming it here only to say it is
      dead, and I do not report ADR-0042/R4's or ADR-0006/R1's verification
      through it. ADR-0042/R4's own check in the ADR points at a DIFFERENT and
      live test in tests/test_export_pdf.py, which is the one that actually
      closes the baseline.

