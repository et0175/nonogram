findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 945
    title: "The in-memory branch has no equivalent of the DB-mode concurrency guard, and its stated reason is not the real one"
    description: |
      `measured_on = _verdict_state(book)` is computed at :919 and then used only
      by the DB branch (:974). In the legacy branch the published refusal is made
      at :915-916 and the mutation happens at :948-956, with the whole floor
      measurement (one `puzzle_store.get_puzzle` per submitted id, :743) in
      between — a window that did not exist on `main`, where the status check sat
      immediately before the mutation. Werkzeug's dev server is threaded, so a
      concurrent publish landing in that window writes membership onto a
      published book.

      The docstring's justification (:880-881, "The in-memory branch has one live
      object throughout and needs no such check") is not the reason it is safe:
      one live object is precisely what can mutate underneath the add. The real
      reason is CON-015's single-user loopback posture, which `set_book_status`
      states explicitly at :1453-1466 and this method does not.
    suggestion: |
      Either re-read `book.status` immediately before the mutation in the legacy
      branch (one line, free on a live object, and it closes the branch's only
      real window), or replace the docstring sentence with the same CON-015
      caveat `set_book_status` already carries.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 964
    title: "The DB-mode guard narrows the F-001 window but does not close it, and the docstring does not say so"
    description: |
      The re-read at :965 and the writes at :987-998 sit in one session, but
      under the pysqlite dialect (and under Postgres READ COMMITTED) the SELECT
      takes no write lock and the transaction only really opens at the first
      write — so a writer committing between :965 and :1000 is still lost. This
      is the same residual exposure `set_book_status` documents at :1453-1466
      ("the check and the write are not atomic ... the exposure is the whole DB
      layer's ... accepted because the panel is a single-user loopback tool").
      The new "Consistency of the verdict with the write" section (:867-881)
      omits that caveat and reads as a stronger guarantee than the code gives.
    suggestion: |
      Add one sentence to the "Consistency of the verdict with the write"
      section mirroring `set_book_status`'s, naming what the guard does close
      (a decision made on a snapshot that has since moved) and what it does not
      (a commit landing between the re-read and this session's first write).
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 800
    title: "floor_refusals reads the book twice, so its overrides and its cells can come from two snapshots"
    description: |
      `floor_refusals` calls `self.floor_overrides(book_id)` (:800, one
      `get_book`) and then `self.below_floor(book_id, ...)` (:801, a second
      `get_book`). In DB mode those are two separate sessions, so the stored
      overrides and the trim every cell is measured on can come from two
      different states of the row — the read-only shape of exactly what cycle
      1's F-001 was about. It is read-only (this is CARD-123's tile and
      finalise-count door), so the worst case is a stale verdict on screen
      rather than a bad write, and `add_puzzles_reporting_refusals` does NOT go
      through here (it reads once at :912 and uses `_below_floor_for`).
    suggestion: |
      Read the book once and reuse it, the way the add already does:
      `book = self.get_book(book_id)`; `allowed = set(book.floor_overrides) | {str(p) for p in overrides}`;
      `return [r for r in self._below_floor_for(book, puzzle_ids) if r.puzzle_id not in allowed]`.
      It also halves the store round-trips CARD-123's tile will make.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 907
    title: "The de-dup keeps the original id objects while the outcome reports their string form"
    description: |
      `submitted = list({str(pid): pid for pid in puzzle_ids}.values())` (:907)
      keys on `str(pid)` but keeps the *original* object as the value, while
      `refused` (:924) and `AddOutcome.admitted` (:928) are both stringified.
      A caller passing a `uuid.UUID` would therefore have a UUID object appended
      to `book.puzzle_ids` (:950 / :987 compare `pid not in existing` against a
      set of strings, so it is always "new") while the outcome it gets back
      names the string. Every caller today passes strings and the shape predates
      this card, but the method now also *reports* ids, which makes the split
      worth removing.
    suggestion: |
      `submitted = list(dict.fromkeys(str(pid) for pid in puzzle_ids))` — one
      form from the top, which is what the comment at :904-906 already claims
      ("keyed on the id's string form because that is the form the floor, the
      store and the book's own list all speak").
    confidence: medium
    source: static
