  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2582
    title: "\"Added N puzzle(s)\" counts ids that were already members and ids that match no stored puzzle"
    description: |
      Both routes flash `len(outcome.admitted)` (app.py:2582 and :3110).
      `AddOutcome.admitted` is "the submitted ids the floor let through", which
      by design includes an id already in the book (documented at
      book_manager.py:246-248) and a phantom id the floor deliberately does not
      judge (book_manager.py:682-690). So an owner re-pasting three ids the book
      already holds is told "Added 3 puzzles to book" when nothing joined. This
      matches what the routes showed before the card (`len(puzzle_ids)`), so it
      is not a regression — but the F-004 design change was the moment the store
      gained the information needed to say it accurately.
    suggestion: |
      If CARD-123 wants an honest count, have `AddOutcome` carry the newly
      written ids as well (the add already computes `new_puzzles` at :949/:986)
      and flash that; otherwise leave it and note the choice in the card.
