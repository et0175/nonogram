    line: 78
    title: "The deploy-path normalisation in migrations/env.py has no covering test, and only its ONLINE branch was ever broken"
    description: |
      `migrations/env.py` is the second place a bare `DATABASE_URL` reached SQLAlchemy, and
      it is on the deploy path — render.yaml's `buildCommand` ends in `alembic upgrade head`.
      Including it in the card is right (see the verification below), but zero tests reach
      this file: `grep -rl "run_migrations_online\|run_migrations_offline\|migrations.env" tests/`
      returns nothing relevant, and the card's own AC→test table does not claim any. So the
      half of the outage that lives in the build step is fixed by inspection only.

      Two facts I verified that the card's SCOPE+ note gets slightly wrong, and that matter
      for what a test should pin:

      * The **online** branch was genuinely broken. `engine_from_config` → `create_engine`
        → `import_dbapi()`; on 2.1.0 with psycopg v3 absent that is
        `ModuleNotFoundError: No module named 'psycopg'`. Fixing it is load-bearing.
      * The **offline** branch was never broken. `context.configure(url=...)` only needs
        `URL.get_dialect()`, which loads the dialect CLASS without importing the DBAPI —
        confirmed on 2.1.0: `make_url("postgresql://u:p@h/db").get_dialect()` returns the
        psycopg dialect happily while `import_dbapi()` raises. The offline change is
        harmless consistency, not a fix.

      I did verify the offline branch still works end to end and leaks nothing: under the
      2.1.0 venv with psycopg v3 absent,
      `DATABASE_URL="postgresql://panel:<secret>@db.example.com:5432/nono" python -m alembic upgrade head --sql`
