      Pin the online branch — the one that failed. A test that imports nothing from alembic's
      runtime can still assert the contract: monkeypatch `sqlalchemy.engine_from_config` and
      exec/ invoke `run_migrations_online` with `DATABASE_URL` set to a bare `postgresql://`,
      then assert the configuration dict's `sqlalchemy.url` parses to
      `postgresql+psycopg2`. Failing that, a much cheaper alternative that still closes the
      gap: assert in tests/test_db_url_driver.py that the string
      `normalized_url` produces for env.py round-trips — i.e. that
      `make_url(normalized_url(raw).render_as_string(hide_password=False))` equals
