  - id: F-003
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/db/session.py
    line: 97
    title: "`except ArgumentError` misses ValueError: a realistic malformed DATABASE_URL escapes the documented RuntimeError and the `from None` shield"
    description: |
      The docstring promises: "Raises RuntimeError: if ``database_url`` is not a URL
      SQLAlchemy can parse." It does not, for a whole class of unparseable URLs. `make_url`
      raises a bare `ValueError` (from `int(port)`), not `ArgumentError`, when the authority's
      port is not an integer — and identically on SQLAlchemy 2.0.52 and 2.1.0:

        postgresql://u:p@2001:db8::1:5432/db  -> ValueError: invalid literal for int() with base 10: 'db8::1:5432'
        postgresql://u:p@h:notaport/db        -> ValueError: invalid literal for int() with base 10: 'notaport'
        postgresql://u:p@h:/db                -> ValueError: invalid literal for int() with base 10: ''

      The first is not a contrived input: an unbracketed IPv6 connection string is the single
      most common `DATABASE_URL` typo, and the card's own EC-1 corpus includes `2001:db8::1`
      as a host precisely because that shape is known to be delicate — but the corpus builds
      it through `URL.create`, which always renders the brackets, so the malformed spelling
      is never exercised. `test_an_unparseable_url_is_rejected_without_quoting_the_password`
      parametrises four inputs, all of which happen to fail through `ArgumentError`.

      Consequences, in order of seriousness:
      1. The operator-facing contract is false. Instead of the actionable
         "DATABASE_URL is not a URL SQLAlchemy can parse (scheme: 'postgresql')", the panel
         raises a bare `ValueError: invalid literal for int()` out of `get_session()`.
      2. EC-1's shield does not apply on this path — no `from None`, no `_scheme_of`. I
         verified there is **no password leak** here: neither the ValueError message nor its
         traceback contains the secret on either version, and `__context__` is None. So EC-1
         itself still holds; what is missing is the guarantee, not the outcome.
      3. It is a silent asymmetry between two spellings of "bad URL", which is exactly the
         class of difference this card exists to abolish.
    suggestion: |
      Widen the handler to `except (ArgumentError, ValueError)` — `ArgumentError` is not a
      `ValueError` subclass, so both are needed — and add the IPv6-without-brackets and
      non-numeric-port spellings to
      `test_an_unparseable_url_is_rejected_without_quoting_the_password`'s parametrisation.
      That parametrised test already asserts the message, `__cause__ is None` and
      `__suppress_context__ is True`, so two new ids give the widened handler the same
      guarantees the ArgumentError path has. (Mutation-verified that those assertions bite:
      dropping `from None` fails all four existing ids.)
    confidence: high
    source: static
    violates: EC-1
    root_cause: RC-2
    status: fixed
    fixed_in: "f36c4ed"
    fix_note: |
      Fixed. `src/nonogram/db/session.py` now catches
      `(ArgumentError, ValueError)` — both, since ArgumentError is not a
      ValueError subclass — and the docstring says why, naming the
      `int(port)` family explicitly. Three parametrise ids added to
      `test_an_unparseable_url_is_rejected_without_quoting_the_password`:
      `ipv6-host-without-brackets`
      (`postgresql://panel:{secret}@2001:db8::1:5432/nono`), `non-numeric-port`
      and `empty-port`. They inherit that test's existing message /
      `__cause__ is None` / `__suppress_context__ is True` assertions, so the
      widened handler carries the same EC-1 guarantees as the ArgumentError
      path. Verified on both versions; narrowing the handler back to
      `except ArgumentError` fails exactly those three ids on both.

      WHY THE CORPUS MISSED IT, and what was decided: the corpus builds every
      URL through `URL.create`, which always brackets an IPv6 host, so the
      malformed spelling cannot exist in it. Decision: do NOT add raw-text
      shapes to the corpus. Its whole value is that each expected field is the
      `URL` object's own field, independent of the function under test;
      hand-written text would mean reimplementing percent-encoding in the test,
      which is how a test ends up agreeing with a bug (the card's own
      reasoning). Raw text that SQLAlchemy *cannot* parse has no URL object to
      come from anyway, so its home is the unparseable parametrisation — which
      is where the three new ids went. Recorded in the card notes.
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: compliance
    type: risk
    file: src/nonogram/db/session.py
    line: 100
    title: "`_scheme_of` runs INSIDE the except block, so a raise there re-exposes SQLAlchemy's URL-echoing ArgumentError as an unsuppressed __context__"
    description: |
      The `from None` on line 102 only takes effect once the `RuntimeError` is constructed.
      `_scheme_of(database_url)` is evaluated first, inside the handler, and it calls
      `str.partition` on the caller's value. Hand `normalized_url` a non-`str` and the
      sequence is:

        make_url(b"postgresql://u:hunter2@h/db")
          -> ArgumentError("Expected string or URL object, got b'postgresql://u:hunter2@h/db'")
        ...caught; then _scheme_of(bytes)
          -> TypeError("a bytes-like object is required, not 'str'")
             with __context__ = that ArgumentError and __suppress_context__ = False

      The printed traceback therefore carries "During handling of the above exception,
      another exception occurred" followed by SQLAlchemy's message **with the full URL and
      its password in it** — literally the mechanism the docstring says `from None` exists to
      block. Demonstrated on both 2.0.52 and 2.1.0 (secret present in the formatted
      traceback and in the exception chain; `None` input takes the same route via
      `AttributeError`).

      Kept at Minor because it is **not reachable from any of today's three callers**:
      `os.getenv` and `config.get_main_option` return `str` or `None`, `_init_engine` rejects
      falsy values before calling, and conftest passes a str. It is a latent trap in a
      function that is now imported from three modules, not a live leak.
    suggestion: |
      Compute the scheme before the try, or make `_scheme_of` total
      (`if not isinstance(database_url, str): return "<not a string>"`). Either way the
      handler's body becomes incapable of raising, which is the property the `from None` is
      relying on.
    confidence: high
    source: static
    violates: EC-1
    root_cause: RC-2
    status: fixed
    fixed_in: "f36c4ed"
    fix_note: |
      Fixed by construction. The scheme is computed BEFORE the `try`
      (`scheme = _scheme_of(database_url)`) and `_scheme_of` is now total for
      any input (`if not isinstance(database_url, str): return "<not a
      string>"`), so the except block's body contains nothing that can raise
      and SQLAlchemy's URL-echoing `ArgumentError` can never resurface as an
      unsuppressed `__context__`. Both halves are commented with the reason.

      Guarantee asserted:
      `test_a_non_string_cannot_resurface_sqlalchemys_url_echoing_message`
      passes bytes (carrying a secret), None, int and object, and checks the
      FORMATTED TRACEBACK — not just `str(error)`, which would pass even with
      the chain intact — for the secret and for "During handling of the above
      exception", plus `__cause__ is None` and `__suppress_context__ is True`.
      Mutation-checked: restoring `_scheme_of` inside the handler and making it
      non-total fails this test on both versions.
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_db_url_driver.py
    line: 88
    title: "POSTGRES_DRIVER is cross-checked against pyproject's `db` extra only — requirements.txt, the manifest the Render build installs, has its DBAPI line unchecked"
    description: |
      `test_the_shipped_driver_is_the_one_the_project_installs` reads
      `pyproject.toml`'s `[project.optional-dependencies].db` and asserts
      `{driver, f"{driver}-binary"}` intersects it. It works, in both directions —
      mutation-verified: setting `POSTGRES_DRIVER = "psycopg"` fails 4 tests on 2.0.52,
      including this one.

      But render.yaml's buildCommand is `pip install -r requirements.txt`. pyproject's `db`
      extra is not what production installs. The suite cross-checks the two files' **SQLAlchemy**
      lines (`test_the_two_files_agree_on_the_sqlalchemy_requirement`, written because "they
      drifted once already") and does not cross-check their **DBAPI** lines. So swapping
      `psycopg2-binary` for `psycopg` in requirements.txt while leaving pyproject alone
      passes the whole suite and reproduces the outage on the next deploy — the same
      two-files-one-fact drift the card set out to close, one line over.

      Also worth noting against the caller's question: the drift cross-check lives in
      `TestDbUrl_DriverIsNamedNotInherited` (AC-1), not in
      `TestDependencyBaseline_SqlalchemyIsNotCapped` (AC-3). AC-3's class asserts only the
      absence of a `<` cap in both files, their mutual agreement on the SQLAlchemy line, and
      G-1's Pillow+NumPy baseline.
    suggestion: |
      In `test_the_shipped_driver_is_the_one_the_project_installs`, union the requirement
      names from `_requirements()` with the `db` extra's, or add a fourth assertion to
      `TestDependencyBaseline_SqlalchemyIsNotCapped` extending
      `test_the_two_files_agree_on_the_sqlalchemy_requirement` to the psycopg2 line.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: "f36c4ed"
    fix_note: |
      Fixed as suggested, and made bidirectional in both files.
      `test_the_shipped_driver_is_the_one_the_project_installs` now builds the
      requirement-name set for BOTH manifests (pyproject's `db` extra and
      requirements.txt, via a new `_requirement_names` helper that strips
      specifiers, extras and markers) and, for each, asserts that the
      PostgreSQL DBAPIs it names are non-empty AND a subset of
