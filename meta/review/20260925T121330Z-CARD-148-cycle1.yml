    title: "Out of scope: AC-2 and AC-3 are literally mutually exclusive — routing to the architect station as a requirement defect is the right call"
    description: |
      Read literally, AC-2 ("a test fails if the installed SQLAlchemy would resolve a bare
      `postgresql://` to a driver that is not installed") and AC-3 ("the cap is removed and
      the suite passes uncapped") cannot both hold: on 2.1.x with only psycopg2 installed,
      SQLAlchemy's bare default IS an uninstalled driver. I agree with the caller's routing:
      record it as a requirement defect for the architect station rather than reword the
      card to match the code. The implementation's reading — assert that the DBAPI **the
      panel's engine resolves to** is importable, plus that the panel's answer is invariant
      to SQLAlchemy's default — is the only reading that serves the card's stated intent, and
      it is the stronger of the two: the literal reading would make a healthy 2.1.x install
      red over a driver the project deliberately does not ship, and a test that can be
      satisfied by pinning a version number tells nobody anything on the day the next
      default moves. The architect station should also pick up the card's own "[Architect
      station]" note: nothing in the model says who chooses a driver, or that a version
      ceiling is a dated decision needing a review trigger. Both cost a production outage.
    suggestion: "No code change. Requirement defect for the architect station; do not reword AC-2 to match the implementation."
