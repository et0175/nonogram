      into the harness.

      But nothing pins it. The card's "## SCOPE+" section states the change is "covered by
      the existing `test_the_reachability_verdict_is_taken_once_per_url`". It is not.
      That test (tests/test_db_connect_timeout.py:166) counts `create_engine` invocations
      against a black-hole port and asserts `probes == 1` and `first == second`. Both hold
      whichever argument the probe is handed: on 2.1.0 the raw-URL version raises
      `ModuleNotFoundError: No module named 'psycopg'`, which `except Exception` catches and
      turns into a stable, non-None reason — so the memoisation assertions still pass.

      Mutation-verified (Step 8f, mutant 4): reverting line 71 to `database_url` and running
      `test_the_reachability_verdict_is_taken_once_per_url` + the whole of
      tests/test_db_url_driver.py gives **29 passed, exit 0 on SQLAlchemy 2.0.52 AND on
      2.1.0**. The mutant survives under production's exact resolution. A future edit can
      undo the one argument that stops the harness lying, and the suite will not notice.
    suggestion: |
      Add one discriminating assertion. The cheapest shape that needs no live database:
      monkeypatch `sqlalchemy.create_engine` (the module attribute — `_unreachable_reason`
      imports it inside the function, so patching `sqlalchemy.create_engine` works, exactly
      as test_db_connect_timeout.py already does) and assert the captured first positional
      argument is a `URL` whose `drivername == f"postgresql+{db_session.POSTGRES_DRIVER}"`
      when the probe is handed a bare `postgres://`/`postgresql://`. That is the same
      capture technique
      `test_create_engine_receives_the_named_url_with_its_password_intact` already uses for
      the production path; it kills the mutant on both versions.
      Also correct the card's SCOPE+ claim, which currently reads as coverage that exists.
