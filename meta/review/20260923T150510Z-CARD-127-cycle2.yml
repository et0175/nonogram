  - id: F-102
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_pdf_two_up.py
    line: 238
    title: "_ink's new `origin` parameter is dead — no call site ever passes it"
    description: |
      The F-005 fix gave `_ink` an `origin: int = 0` parameter and a docstring
      explaining that it is "the crop's own x on the page, so `left` comes back in
      page pixels rather than in the strip's". The only caller, `_band_ink`
      (line 272), crops at `x = 0` and passes nothing, so `origin` is always 0 and
      the offset arithmetic is a no-op. Harmless today, but it is a parameter whose
      documented purpose no code demonstrates: a later caller cropping a narrower
      window would have to guess whether the helper's `left` convention was ever
      exercised, and the answer is no.
    suggestion: |
      Drop the parameter (and the paragraph about it) — `_band_ink` already takes
      the full trim width, which is what makes `left` a page coordinate — or add
      the one caller that needs it.
    confidence: high
    source: static
