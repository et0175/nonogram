  - id: F-103
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_book_export_interior.py
    line: 213
    title: "The F-006 bias shrinks the free-extent sweep by a third with no counter pinning what is left"
    description: |
      `pairing = index % 3 == 1` replaces 9 of the corpus's 28 cases with 3-4
      puzzles drawn from the small corner (`rng.randint(10, 20) x rng.randint(10,
      14)`), so the freely drawn 10..30 extents now come from 19 cases instead of
      28. Every floor the test asserts is about routes, covers, parities and page
      make-ups — none is about extent, so a further narrowing of the free branch
      (or another bias added later) would erode the large-extent half of this
      property silently, which is exactly what the project's "assert a minimum case
      count inside the test so the corpus can't silently shrink" rule exists to
      prevent.
      Verified as NOT a skew in the dimensions that are pinned: `index % 3` against
      `route = ROUTES[index % 4]` has period 12 over 28 cases, so all four routes
      receive pairing cases (finalise 3, generator 2, download-pdf 2, generate-pdf
      2) and each keeps at least 4 free cases; `seen["empty book"] >= 1`,
      `seen["with cover"]/[.. without] >= 5`, `seen["non-empty book"] >= 10` and the
      route floor all still pass.
    suggestion: |
      Count it like the others, e.g. `seen["large puzzle"] += 1` when
      `max(width, height) > 20` and assert a floor (>= 5) beside the new two-up
      floors, so the branch the bias took cases away from is pinned too.
    confidence: high
    source: static
