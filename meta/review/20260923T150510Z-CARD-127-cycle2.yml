    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 990
    title: "The new ids-parallelism ValueError is a documented error path with no test"
    description: |
      The F-001 fix added `if ids is not None and len(ids) != len(payloads): raise
      ValueError(...)` and documented it in `puzzle_pages`'s `Raises:` block
      ("naming the wrong puzzle is worse than naming none"). Nothing exercises it:
      a grep of tests for "must be parallel" returns nothing, and the only two
      callers pass either a correctly parallel list (`interior`) or no ids at all
      (tests/property/test_book_pairing.py:287). By the project's own negative-
      scenario rule this is a rejection path added without a rejection test, so a
      future refactor that drops or inverts the guard is invisible to the suite —
      and the guard exists precisely because the failure it prevents (an id list
      out of step with the payloads) would name the WRONG puzzle in an abort
      message, which is the failure mode the whole F-001 fix is about.
    suggestion: |
      One test beside the new layout-time cases:
        with pytest.raises(ValueError, match="parallel"):
            BookPDFGenerator(book).puzzle_pages([payload], ids=["a", "b"])
    confidence: high
    source: static
