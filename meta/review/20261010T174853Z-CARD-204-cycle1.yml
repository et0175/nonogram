findings:
  - id: F-1
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/export/layout.py
    line: 2040
    title: "Fix 1's folio reservation can silently un-pair two puzzles that would otherwise share a two-up page, based solely on the page number's digit count"
    description: |
      compute_pair_layout's Fix-1 refit (lines ~2026-2057) only re-fits a
      smaller shared cell when the lower slot's natural spare at the
      *unreserved* cell is below folio_reserve_px, then calls
      _placed_cell_mm again with outside_mm widened by the reserve. This
      refit is algebraically self-consistent for *cell size* (verified: the
      trigger condition "natural_spare_px < reserve_px" is exactly the
      condition under which widening flips the binding constraint to width
      and shrinks the cell by exactly enough — confirmed both by direct
      algebra and by executing compute_pair_layout against the real
      BOOK1_PROFILE geometry). What it does NOT guard is TWO_UP_MIN_CELL_MM
      (7.0mm): compute_pair_layout's existing floor check
      (`if exact_cell_mm < _exact_mm(TWO_UP_MIN_CELL_MM): return None`,
      applied to the REFIT cell) can now reject a pair whose *unreserved*
      cell was comfortably above 7.0mm, purely because satisfying the
      folio's reserve pushed the refit cell below the floor.

      Reproduced directly (not merely argued): two identical puzzles
      (25 columns x 6 rows, row-clue depth 2, column-clue depth 2 — well
      inside CON-011's 10..30 range) on the real BOOK1_PROFILE PageSpec
      (8.5x11in, 0.5in gutter, 0.375in outside/top/bottom, cell_cap=7.5mm):
        - unreserved shared cell: 7.1731mm (comfortably >= TWO_UP_MIN_CELL_MM)
        - page 99 (2-digit folio, reserve=54px): cell shrinks to 7.0038mm,
          still pairs
        - page 100 (3-digit folio, reserve=81px): compute_pair_layout
          returns None — the identical pair REFUSES to pair
      The same two puzzles, same shapes, same tier, same adjacency —
      whether they share a page depends only on whether their page number
      has two or three digits. This directly contradicts Fix 1's own
      stated guarantee in the Worktree notes ("a tiny, consistent gap...
      never more [than the reserve needs]") and in book_pdf_generator.py's
      own code comment at the call site ("so _draw_folio's
      horizontal-clearance check always passes on a two-up page") — neither
      anticipates an outright pairing refusal.

      This is a real, plausible production scenario, not a contrived edge
      case: the project's own market research (Amazon nonogram market
      snapshot) targets books with a median ~120 pages, where 3-digit page
      numbers are the norm for most of the book, not a corner case. A
      75-100+ page book could have puzzle pairs that would print two-up in
      the first ~99 pages but silently split into two single pages once
      the page numbering crosses into 3 digits — changing the book's own
      page count and puzzle-to-page assignment for a reason that has
      nothing to do with the puzzles themselves and that nobody asked for.

      No test catches this. tests/property/test_book_pairing.py's own
      900-case corpus (the independent oracle this fix leans on) caps each
      synthetic "book" at `rng.randint(1, 8)` puzzles, so its own page
      numbers never exceed roughly 10-11 (`range(3, 3+len(plan))`) — never
      reaching a 3-digit folio at all. The corpus is therefore structurally
      incapable of exercising the exact regime (large reserve relative to a
      pair's own natural spare) where this defect manifests, independent of
      how many random seeds are tried. tests/test_book_page_numbers.py's
      own `test_two_up_page_s_folio_now_has_reserved_room` only exercises
      the fixed baseline book/puzzles, not a sweep near the TWO_UP_MIN_CELL_MM
      boundary.
    suggestion: |
      Decouple "does this pair satisfy INV-010/FR-040's own fit rule" from
      "is there room for the folio": e.g. compute the pairing decision
      first using the *unreserved* cell (as before Fix 1), and only apply
      folio_reserve_px as a strictly cosmetic adjustment within whatever
      cell that first decision already settled on — never let the reserve
      change *whether* a pair is accepted, only how it draws once accepted.
      Concretely: run the existing unreserved _placed_cell_mm fit first; if
      it is >= TWO_UP_MIN_CELL_MM, the pair is accepted at that cell
      regardless of the reserve; only then, if the lower slot's own natural
      spare at that (already-accepted) cell is less than folio_reserve_px,
      either (a) accept a smaller actually-drawn cell for cosmetic padding
      without ever dropping below TWO_UP_MIN_CELL_MM, or (b) accept the
      full fitted cell and simply omit the folio for that specific page
      (falling back to _draw_folio's own pre-existing "omit rather than
      collide" rule, which is exactly what G-6/AC-3's degenerate-case
      precedent already does elsewhere in this same card). Either keeps
      page count stable for a reason under the owner's control, instead of
      a side effect of page-number length. Add a property test sweeping
      `page_number` across 1/2/3-digit boundaries (not just a fixed
      baseline book) asserting that compute_pair_layout's accept/refuse
      verdict is page-number-invariant whenever the unreserved cell is
      strictly above TWO_UP_MIN_CELL_MM.
    confidence: high
    source: static
    violates: INV-010
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-2
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/layout.py
    line: 2168
    title: "_slot_layout's docstring claims the outer_reserve_px clamp protects against the MIN_CELL_MM floor-overflow case, but that case is unreachable for a two-up slot"
    description: |
      _slot_layout's new docstring says the reserve clamp
      (`min(outer_reserve_px, max(spare, 0))`) exists so "it cannot make
      the pre-existing MIN_CELL_MM floor-overflow case (AC-3, G-6)...
      overflow any further." For a two-up slot this scenario is actually
      unreachable: compute_pair_layout already refuses (returns None)
      any shared cell below TWO_UP_MIN_CELL_MM (7.0mm), which is well
      above MIN_CELL_MM (2.0mm) — the only floor _placed_cell_mm ever
      applies internally. By the time _slot_layout runs for a two-up
      pair, `spare` for either slot is provably >= 0 (confirmed
      algebraically: cell_mm <= width_fit always holds except when the
      2.0mm MIN_CELL_MM floor pushes cell_mm above width_fit — and that
      specific condition implies cell_mm < 7.0mm, which compute_pair_layout
      has already refused before _slot_layout is ever called). The clamp
      itself is harmless (defensive, not incorrect), but the docstring
      describes protecting against a scenario that cannot occur on this
      call path, which could mislead a future reader into thinking a
      two-up slot can legitimately overflow the way a single puzzle page
      can.
    suggestion: |
      Either note in the docstring that the floor-overflow branch is
      unreachable for a two-up slot specifically (compute_pair_layout's own
      TWO_UP_MIN_CELL_MM gate already excludes it) and the clamp is kept
      only for defensive symmetry with compute_layout's single-page
      formula, or drop the AC-3/G-6 cross-reference from this docstring
      since those ACs/guardrails are about the single-page path only.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-3
    severity: info
    category: tech-debt
    type: gap
    file: tests/property/test_book_pairing.py
    line: 239
    title: "The 900-case pairing property corpus cannot reach a 3-digit page number, by construction"
    description: |
      _puzzle's own corpus and the outer loop's `order = [_puzzle(rng) for
      _ in range(rng.randint(1, 8))]` cap each synthetic book at 8 puzzles;
      `entry.page_number` runs from 3 to at most roughly 3+8=11. Since
      _folio_reserve_px scales with the page number's own digit count, the
      property test's own cross-check against Sheet.shared_cell_mm
      (which independently re-derives the identical refit rule, including
      the same unstated assumption that triggering the refit always
      succeeds in freeing enough room) can never exercise a reserve large
      enough to probe the boundary F-1 describes, regardless of the RNG
      seed or case count. This is exactly the gap that let F-1 ship
      untested — not a flaw in the oracle's math (which matches production
      byte for byte within the regime it reaches), but a corpus-size limit
      that excludes the regime where the two diverge in practice.
    suggestion: |
      Extend the corpus (or add a dedicated, narrower property test) to
      vary `page_number` independently of the book's own puzzle count —
      e.g. a parametrized sweep over page_number in {9, 10, 99, 100, 999}
      against puzzles whose unreserved cell sits within a few folio-widths
      of TWO_UP_MIN_CELL_MM, so a future regression in this exact area
      fails loudly instead of silently.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

