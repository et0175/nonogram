findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/db/session.py
    line: 146
    title: "`_scheme_of` still echoes a secret placed before the first `://`"
    description: |
      `_scheme_of` documents itself as returning "the text before `://`, which is
      the one part that cannot be a secret", and `normalized_url`'s docstring
      promises "the message names the scheme and nothing else". Both claims are
      demonstrably false for one class of raw text:

          >>> _scheme_of("postgresql:hunter2-do-not-print-me://h/db")
          'postgresql:hunter2-do-not-print-me'
          >>> normalized_url("postgresql:hunter2-do-not-print-me://h/db")
          RuntimeError: DATABASE_URL is not a URL SQLAlchemy can parse
            (scheme: 'postgresql:hunter2-do-not-print-me'). ...

      Verified under SQLAlchemy 2.1.1 in the worktree. `str.partition("://")`
      returns everything before the FIRST `://`, which is only a scheme when the
      string is shaped like a URL; for a malformed value it is an arbitrary
      prefix, and EC-1's guarantee ("the password never reaches ... an exception
      message") depends on that prefix being credential-free.

      This is Minor, not Important, on reachability: every realistic malformed
      `DATABASE_URL` puts its credentials AFTER a `://` (`postgresql://u:p@...`)
      or has no `://` at all (`postgres:u:p@host/db` → `<no scheme>`, safe — also
      verified). No production caller can produce the leaking shape. But EC-1 is
      stated as a standing property rather than an outcome, and cycle 1 already
      routed one finding (F-004) at exactly this seam, so the remaining half
      belongs on the record rather than in nobody's head.
    suggestion: |
      Narrow what goes into the message to something that cannot carry a
      credential — e.g. `scheme.partition(":")[0]` (a real scheme has no colon)
      or a charset/length cap, and correct both docstrings so the claim matches
      the code. One line plus an added parametrise id
      (`credentials-before-the-separator`) alongside the existing unparseable
      corpus.
    confidence: high
    source: static
    violates: EC-1
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: meta/kanban/cards/CARD-148.md
    line: 0
    title: "The Fix-1 note's claim about F-004 is false for one of its two halves (mutant M12 survived)"
    description: |
      The card's `[Fix 1]` note states of F-004: "the scheme is computed
      **before** the `try` and `_scheme_of` is total for any input ...
      **Reverting either half fails it on both versions.**"

      Only one half is true. Mutation M12 — `_scheme_of(database_url)` moved back
      INSIDE the except handler, with its `isinstance` guard kept — leaves
      `tests/test_db_url_driver.py` fully green: 37 passed, exit 0, on BOTH
      SQLAlchemy 2.0.52 and 2.1.1. The companion mutant M11 (the `isinstance`
      guard removed, hoisting kept) IS killed on both, on
      `test_a_non_string_cannot_resurface_sqlalchemys_url_echoing_message`.

      So the totality half carries the entire guarantee and the hoisting half is
      untested defence-in-depth. To be fair to the code: M12 is an EQUIVALENT
      mutant — because `_scheme_of` is total, calling it inside the handler
      cannot raise, so behaviour is byte-identical and EC-1 still holds. The
      defect is in the note, not the implementation: it asserts a test
      discrimination that does not exist, which is the same "the prose says the
      coverage is there" pattern that made cycle 1's F-001 survive undetected
      for a cycle.
    suggestion: |
      Either (a) correct the note to say what is actually pinned — "the totality
      of `_scheme_of` is what the test discriminates; the hoisting is
      belt-and-braces against a future edit that makes it partial" — or (b) pin
      the hoisting too, by monkeypatching `_scheme_of` to raise and asserting the
      `RuntimeError` still arrives with no `__context__` chain. (a) is the honest
      and cheaper choice; the property under (b) is already covered by M11.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: migrations/env.py
    line: 78
    title: "EC-1's no-log half is unpinned on the one path where the password is necessarily plaintext"
    description: |
      EC-1 has two halves: "the password never reaches a log OR an exception
      message". For `normalized_url` both are pinned —
      `test_no_password_in_the_corpus_reaches_a_log_record` (caplog at DEBUG over
      all 260 corpus URLs, asserting the record list is EMPTY) and
      `test_an_unparseable_url_is_rejected_without_quoting_the_password`.

      `migrations/env.py` is the one place the password must become plaintext
      text — `engine_from_config` takes a string-keyed dict, so
      `render_as_string(hide_password=False)` is correct there, as cycle 1 and
      the card both argue. The fix round pinned that path's *driver naming*
      (`TestMigrations_TheDeployPathNamesTheDriver`) and the *round-trip
      losslessness* (`test_the_text_round_trip_that_alembic_forces_is_lossless`),
      but nothing pins that the plaintext dict does not reach a log or an
      exception message.

      I verified the property HOLDS today, which is why this is Minor and not
      Important. Under SQLAlchemy 2.1.1 with a synthetic secret, on the
      `engine_from_config` path: a dead-port connect failure, a live-server
      connect, and an absent-driver `ModuleNotFoundError` all carry the secret in
      neither `str(error)` nor the formatted traceback; `alembic.ini` sets
      `logger_sqlalchemy` (qualname `sqlalchemy.engine`) to WARNING and never
      enables `echo`; and `tests/conftest.py`'s probe reason (`str(error)`, which
      becomes a printed skip reason) is likewise clean —
      `_unreachable_reason` returned `No module named 'psycopg'` and `None`,
      no secret. The gap is that all of that is true by luck of configuration
      rather than by assertion, and `logger_sqlalchemy = INFO` or a stray
      `echo=True` is a one-line edit away.
    suggestion: |
      Extend `TestMigrations_TheDeployPathNamesTheDriver` with a caplog-style
      assertion inside the existing subprocess — the probe already has the
      captured output in hand; assert the secret appears nowhere in the
      subprocess's stderr (which is where `alembic.ini`'s console handler
      writes), rather than only in the parsed CONFIG line. Roughly two lines, no
      new subprocess, no new database.
    confidence: high
    source: static
    violates: EC-1
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

