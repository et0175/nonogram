live_database_findings:
  summary: "The strongest first-hand confirmation of this card's value found in either cycle, and it required the live Postgres that did not exist at cycle 1."
  detail: |
    With `nonogram_test` live, migrated to head (alembic_version 012, 7 tables)
    and `DATABASE_URL` set, `tests/test_db_e2e_smoke.py` behaves like this:

      main   + SQLAlchemy 2.1.1  → ssssss   (6 db_required tests SKIP, exit 0)
      main   + SQLAlchemy 2.0.52 → F.F.F.   (3 fail)
      branch + SQLAlchemy 2.1.1  → F.F.F.   (the same 3 fail)

    On `main` under production's resolution the harness reports a database that
    is demonstrably right there as unreachable, because `_unreachable_reason`
    hands `create_engine` the raw URL and the attempt dies in `import_dbapi()`
    with `ModuleNotFoundError: No module named 'psycopg'` — which its
    `except Exception` faithfully records as a skip reason. Every db_required
    test then passes as a green skip. That is this repo's known
    "DB tests skip silently" hazard, inside the gate, under exactly the
    resolution that broke production — and cycle 1 could only reason about it.
    The branch's conftest change (SCOPE+, cycle 1's F-001) makes the harness tell
    the truth: the same 3 tests that fail on main under 2.0.52 now fail on the
    branch under 2.1.1, an identical failure set.
  preexisting_defect_surfaced: "Those 3 failures (`relation \"puzzles\" does not exist` from psycopg2, and a route assertion) are PRE-EXISTING on main and reproduce there under 2.0.52 with no part of this card applied. They are not this card's and must not gate it — see the Out-of-scope finding below. Note they only become visible once DATABASE_URL is set; the standard gate leaves it unset, so the suite is unaffected by this merge."
  ec1_on_a_real_connection: "A genuine connection failure's exception and traceback carry no secret: dead-port `OperationalError`, absent-driver `ModuleNotFoundError`, and conftest's probe reason were all checked with a synthetic password under 2.1.1 — absent from `str(error)` and from the formatted traceback in every case. A real authentication failure could NOT be forced on this machine: `pg_hba` is `trust` for loopback, so a wrong password connects successfully. That one path remains unobserved (it is the only EC-1 surface still reasoned about rather than seen)."
  side_effects: "None left behind. The project's own `db_session` fixture drops and recreates `puzzles`/`batches` by design during those runs; afterwards all 7 tables and `alembic_version` = 012 are present, verified. `nonogram_dev` was never touched; no database was created or dropped."

out_of_scope:
  - id: O-001
    file: tests/test_db_e2e_smoke.py
    title: "3 db_required tests fail against a live migrated Postgres — pre-existing on main, on both SQLAlchemy versions"
    detail: "`test_app_instantiates_with_db_services`, `test_batch_persistence_to_db`, `test_create_batch_route_works`. Reproduced on `main` with SQLAlchemy 2.0.52 and the live database, with none of this card applied, so it is not this card's defect. Root cause looks like `tests/conftest.py::db_session` importing `engine` BY VALUE (`from nonogram.db import engine, ...`) before `_init_engine()` has rebuilt it for the monkeypatched `DATABASE_URL`, so `Base.metadata.create_all(engine)` targets a different engine than the test's session — worth a card, not a hand-patch here. Flagged because this card is what makes them visible under SQLAlchemy >= 2.1."
  - id: O-002
    file: tests/test_db_url_driver.py
    line: 283
    title: "`_POSTGRES_DBAPIS` is a closed allowlist, so an unrecognised ADDITIONAL DBAPI is invisible"
    detail: "The check is `(manifest names) & _POSTGRES_DBAPIS`. Any unrecognised spelling that is the manifest's ONLY DBAPI fails closed (verified: `psycopg2_binary`, a `@ <url>` direct reference and a deleted line all make the intersection empty and the test red — M9). What slips through is an unrecognised DBAPI added BESIDE `psycopg2-binary` (say a future `psycopg3` or `psqlpy`). That shape does not reproduce the outage — the outage was a substitution, which is caught — so this is a residue of the allowlist design, not the hole cycle 1's F-005 named."
  - id: O-003
    file: tests/test_db_url_driver.py
    line: 573
    title: "The EC-1 corpus cannot express parseable raw text that `URL.create` never renders"
    detail: "Three classes: unencoded delimiters in credentials (`postgresql://u:p@ss@h/db`, which SQLAlchemy reparses as password 'p' + host 'ss@h'), surrounding whitespace (a trailing newline from an env file becomes database `db\\n`), and an uppercase DRIVER token (`postgresql+PSYCOPG2://`, which the code lowercases). All three were probed by hand under 2.1.1; none can break EC-1, because `normalized_url`'s only mutation is `url.set(drivername=...)` — 'nothing else moves' is structural, and the corpus is corroboration rather than proof. Recording the classes so the next reader does not have to re-derive them."
  - id: O-004
    file: migrations/env.py
    line: 20
    title: "[carried, cycle 1 F-007] `from src.nonogram.db.session import normalized_url` — the `src.`-prefixed double-import shape"
    detail: "Belongs to CARD-139's sweep, as cycle 1 routed. Harmless for a pure string function (no enum or class identity crosses), but this card widens the precedent by one import. Unchanged by the fix round."
  - id: O-005
    file: meta/kanban/cards/CARD-148.md
    title: "[carried, cycle 1 F-008] AC-2 and AC-3 are literally mutually exclusive as written — a requirement defect for the architect station"
    detail: "Routed at cycle 1 and still correct: on 2.1.x with only psycopg2 installed, SQLAlchemy's bare default IS an uninstalled driver, so AC-2 read literally would make a healthy uncapped install permanently red. The implementation's reading (assert the driver THE PANEL RESOLVES TO is importable, plus an invariance test against SQLAlchemy's default) is the right one. Fix the AC text where it was written; do not reword the card to match the code."
  - id: O-006
    file: meta/architecture
    title: "[carried, cycle 1] ADR-0006/R1's declared `check.ref` is dead, and nothing owns 'who chooses a driver'"
    detail: "`TestDependencyBaseline_IsExactlyPillowAndNumpy` is not a collectible node id — only a docstring binding at tests/test_export_pdf.py:622,1250; the live test is `test_the_dependency_baseline_is_still_closed` (tests/test_export_pdf.py:1249). Separately, the card's own [Architect station] note is right that `POSTGRES_DRIVER` is now a load-bearing architectural fact living in a capability module's constant, and that ADR-0006/R1 says what may be INSTALLED but nothing about who CHOOSES a driver or about pinning discipline. Both cost a production outage this week. Route via /forge:architect."
