  - id: F-006
    severity: low
    category: tech-debt
    file: tests/test_book_puzzle_frame.py
    line: 3068
    type: risk
    title: "The read-only controls' completeness is held by 'this class is last in the file', which nothing asserts - ADR-0039/R2's enumeration shape"
    description: |
      Both ...IsNotMutated classes state in their docstrings that they run last
      on purpose ("pytest collects a module in file order", "It is the last
      class in the module"), and their completeness depends on it: they digest
      the shared pages AFTER every consumer has had them. Nothing in the diff
      asserts the position, and nothing enumerates the consumers.

      So the read-only property is held by the consumers that happen to exist
      today, in the order they happen to sit in, rather than by an authority the
      runtime can enumerate. That is the shape ADR-0039/R2 names: a set that is
      hand-held rather than derived.

      Concretely: a future card appends a new class after
      TestPuzzleFrame_TheSharedInteriorIsNotMutated, takes `pages`, and draws a
      debug marker on pages[0] without copying. Every assertion in the file
      still passes - the control already ran, and every later measurement in
      the new class is of the mutated page. The failure lands nowhere.

      This is `low` and not gating because the control does catch all the
      consumers that exist now (verified: the P6-shape mutant, a consumer
      drawing on the shared page, reds the control), and because collection
      order is deterministic here (no pytest-randomly, no xdist installed, so
      file order is stable).

      Related and also low, both consequences of equality-against-an-accumulator
      rather than a derived count:
      * _FIFTH_RULE_RENDERS == [self.PUZZLE] would red SPURIOUSLY if any future
        class subclassed TestBookPdf_EveryFifthGridLineWider (the inherited
        class-scoped fixture executes a second time, appending a second entry,
        with the conversion intact). No test-class subclassing idiom exists in
        tests/ today - grep for `^class Test.*\(Test` returns nothing - so this
        is latent, not live.
      * under pytest-xdist all three controls go vacuous at once (each worker
        executes the fixture once and sees a one-entry accumulator). Parallel
        execution is explicitly out of scope under G-6, so this is noted for
        whoever takes it, not charged here.
    suggestion: |
      Derive the consumer set instead of relying on position. The same
      _SHARED_TAKINGS counter F-002 needs makes this checkable: hold it to an
      equality against the tests that declare the fixture, collected off
      request.session.items (a runtime-enumerable authority), so a newly
      appended consumer either reds the control or forces the author to
      re-derive the number. Keep the "last in the file" comment, but as an
      explanation of the ordering, not as the guarantee.
    confidence: high
    source: static
    violates: ADR-0039/R2
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-007
    severity: low
    category: tech-debt
    file: tests/test_book_pdf_band.py
    line: 266
    type: question
    title: "snowflake_interior asserts a property of its CONSUMERS, which turns a one-line rename into six ERROR cells instead of one FAILED cell"
    description: |
      Confirmed first that it is safe: the fixture names
      TestBookPdf_PuzzlePageCarriesNoPictureTitle and
      TestBookPdf_AnswerKeyCarriesPictureTitle by reference from above their own
      definitions (lines 266-270, classes at 519 and 578). This CANNOT break
      collection - the names resolve in the module globals at fixture-execution
      time, long after the module is fully imported. All 10 selections in the
      F-002 matrix collect and pass on the intact tree, including selections
      that run only one of the two classes.

      Then reproduced the diagnosis myself (line-count preserving,
      AnswerKey.NAME -> "Iguanodon", sha256 959bdff36b91... re-verified after
      restore): exit 1, 31 passed, 6 ERRORS. Each error carries the full
      message, which is good - it names the class, both names, and both
      remedies: "TestBookPdf_AnswerKeyCarriesPictureTitle reads a book titled
      'Iguanodon', and this fixture draws 'Snowflake': it needs a render of its
      own, or this fixture needs its name".

      So the mutant IS killed with named cells, not on an exit code. The
      judgement the orchestrator asked for: the PLACEMENT is defensible, the
      SHAPE is not ideal.

      * Defensible: the invariant is "these two classes read one book", which is
        a property of the pair, and the fixture is the only place that holds
        both. Asserting it there is strictly better than letting one class
        silently measure the other's book, which is the alternative.
      * Not ideal: six ERROR cells spread over three classes (both sharing
        classes' four tests and both of the control class's tests) is a worse
        first impression than one FAILED cell on a test named for the
        invariant, and ERROR is the cell type this board's own mutation
        discipline warns about reading as a kill. It also means the mutation
        controls themselves error out, so they can diagnose nothing while the
        fixture is broken.

      No gate: the diagnosis arrives and is correct.
    suggestion: |
      Keep the fixture's assertion as a precondition, and add one focused test
      in the control class that owns the claim - e.g.
      test_both_classes_read_the_fixtures_book, asserting
      {TestBookPdf_PuzzlePageCarriesNoPictureTitle.NAME,
       TestBookPdf_AnswerKeyCarriesPictureTitle.NAME} == {_puzzle()["puzzle_name"]}
      without taking the fixture. A rename then produces one FAILED cell naming
      the invariant, plus the fixture's errors as corroboration, instead of six
      errors and no failure.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

