findings:
  - id: F-001
    severity: critical
    category: tech-debt
    type: bug
    file: tests/test_book_puzzle_frame.py
    line: 931
    title: "The shared-render digests retain 433 MB of page bitmaps to the end of the session - the exact session-scope retention the fixtures' own docstrings claim to avoid, and AC-5's substance"
    description: |
      MEASURED, three ways, and this is the card's own stated risk that nobody
      had measured.

      1. Peak RSS (/usr/bin/time -l, one file per run, base c7cca514 vs HEAD
         4ae0d825 in two detached scratch worktrees so the tree under review was
         never touched):

           tests/test_book_puzzle_frame.py   657.5 MB -> 958.1 MB  (+300.6 MB, +45.7 %)
           tests/test_book_pdf_band.py      1215.9 MB -> 1569.0 MB (+353.2 MB, +29.0 %)
           both files, one run               1327/1356 MB -> 1781/1719 MB (+~400 MB, +30 %)

      2. What is retained, read out of sys.modules at pytest_sessionfinish by a
         40-line plugin kept outside tests/ (so it could not join
         rank_durations.py's frozen render set):

           tests.test_book_puzzle_frame._SHARED_DIGEST:        10 entries, 252,450,000 B (240.8 MB)
           tests.test_book_pdf_band._SHARED_SNOWFLAKE_DIGEST:   8 entries, 201,960,000 B (192.6 MB)
           tests.test_book_pdf_band._FIFTH_RULE_RENDERS:        1 entry, 0 B (3 ints - not implicated)

         433.4 MB, alive AFTER both module fixtures have been finalised,
         because pytest keeps test modules in sys.modules for the session.

      3. The project's own unit. test_book_pdf_memory.py:38 records that four
         2550x3300 RGB pages move ru_maxrss by 134 MB - 25,245,000 B per page,
         which is exactly the per-entry size measured above. So the retention is
         18.0 PAGE BITMAPS held for the rest of the run, in a module whose
         accepted peak is 2.00 page bitmaps (line 235) and which exists because
         "a page alive while the next is built" was a real defect (CARD-145).

      WHY THIS IS A FINDING AND NOT A TRADE-OFF:

      * It contradicts the diff's own documented rationale. Both fixture
        docstrings say "Module, not session (the card's rule 2): a session
        fixture would hold this book's page bitmaps alive for the rest of the
        run". The fixture does not - and the module-level list the fixture
        populates does, by the same volume. The stated reason for choosing
        module scope is defeated by the mechanism added in the same hunk.
      * AC-5 is substantively failed. Its gloss - "the fixture must not keep
        more pages alive at once than the single-test path did" - is violated:
        at the moment the control runs, one book of Image objects AND one book
        of its bytes are both live, i.e. 2x the pages the class-scoped path
        kept, plus permanent retention the old path had none of.
      * AC-5 has no live control, which is an ADR-0039/R1 failure at the AC
        level. Its named verifier is "test_book_pdf_memory.py's existing peak
        assertions", and that file states at line 84 that its measured peak
        "is not the process's peak, and this module does not claim it is" - it
        instruments its own _live dict (line 420). It is structurally incapable
        of failing on a retention in two other modules. Nothing else in the
        repo guards process memory either: grep for RLIMIT_AS|peak_rss|
        max_rss|tracemalloc across tests/ hits test_book_pdf_memory.py alone,
        and its RLIMIT_AS test is the one skip this kernel refuses. So this
        regression is invisible to every guard the board has.

      FAILURE SCENARIO (inputs/state -> wrong outcome): a full-suite run on a
      box or container with a 2 GB memory ceiling. After
      tests/test_book_puzzle_frame.py and tests/test_book_pdf_band.py have
      finished and been torn down, 433 MB of page bytes remain charged to the
      process for the remaining ~1400 s of the suite. tests/
      test_book_export_interior_cover.py (344 s, the suite's largest file) then
      runs on a 433 MB smaller budget than it did before this card. The
      observable outcome is an OOM or a swap-thrashed run in a file this diff
      has nothing to do with, with no guard pointing back here - exactly the
      displaced-diagnosis shape the card's rule 2 was written to prevent.

      COST/BENEFIT, stated plainly: the conversion buys 11 renders / ~1.55 s of
      CPU (the pre-gate's integer) and pays 433 MB of permanent retention plus
      ~400 MB of peak. In a repo that has a card about peak memory, that is the
      wrong side of the trade.
    suggestion: |
      One line per file, strictly better, and it loses nothing - the controls
      compare bytes for equality, so a cryptographic digest of the bytes is an
      equivalent witness at 32 B instead of 25,245,000 B per page:

        # tests/test_book_puzzle_frame.py, in the `pages` fixture
        _SHARED_DIGEST.extend(hashlib.sha256(page.tobytes()).digest() for page in drawn)
        # ... and in the control
        if hashlib.sha256(page.tobytes()).digest() != drawn

        # tests/test_book_pdf_band.py, identically for _SHARED_SNOWFLAKE_DIGEST

      18 entries x 32 B = 576 B instead of 454,410,000 B. Retained-bytes delta
      becomes nil; peak RSS returns to within noise of the base; every one of
      the five controls keeps the same discriminating power (re-run the mutant
      matrix to confirm - P1/P2/P3/P4/P6 should red identically). hashlib is
      stdlib, so ADR-0006/R1 is untouched.

      Then say so in the fixture docstrings, because the current wording is now
      the claim that was wrong: "module, not session" has to be true of
      everything the fixture leaves behind, not only of the fixture's own
      return value.

      Re-measure peak RSS after the fix and record the figure - this card's
      rule 2 is a memory rule and has never once been checked with a memory
      measurement.
    confidence: high
    source: static
    violates: AC-5
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    file: tests/test_book_pdf_band.py
    line: 1588
    type: gap
    title: "All three 'one render served...' controls pass with the mechanism DELETED under a single-node-id or -k selection, and both band controls pass under `-k one_render`"
    description: |
      The orchestrator asked which selections make a control pass vacuously.
      Measured with a 4x10 matrix (3 line-count-preserving scope mutants plus
      the intact tree, x 10 selections), both files' sha256 re-verified after
      every restore. Cells, not exit codes:

        mutant                            whole-file        control-class     control-node
        pages module->function            2 failed  KILL   1 failed  KILL    1 passed  VACUOUS
        snowflake module->class           1 failed  KILL   2 passed VACUOUS  1 passed  VACUOUS
        fifth-rule page class->function   1 failed  KILL   1 failed  KILL    1 passed  VACUOUS
        (intact)                          green            green             green

      and additionally, with `-k one_render` on tests/test_book_pdf_band.py
      (2 selected, 35 deselected):

        snowflake module->class           2 passed  VACUOUS
        fifth-rule page class->function   2 passed  VACUOUS

      No spurious reds anywhere: the intact tree is green under all 10
      selections, including the two files in reverse order and the `-k` subset.
      So the controls are sound under the selection the gate actually uses, and
      that is why this is `high` and not `critical`.

      WHY IT STILL GATES. Each control's own docstring makes a universal claim
      it does not hold: "Put the scope back to function and there are five, and
      this goes red"; "Widen the fixture's scope back to function, or narrow it
      to class, and this holds more than one book's worth of pages and goes
      red". Under `-k one_render` - the most natural way a human re-checks a
      control named test_one_render_served_the_whole_module - the class-scope
      mutant is reported GREEN. A control that answers "fine" to a selection it
      cannot analyse is a silent pass where ADR-0039/R2 requires default-deny,
      and the docstring turns that into a claim the next reader will trust.

      MECHANISM. All three controls assert an equality on a counter that only
      the selected tests increment: len(_SHARED_DIGEST) == len(pages), and
      _FIFTH_RULE_RENDERS == [self.PUZZLE]. One execution of the fixture and
      one consumer are indistinguishable from one execution and six. The
      control measures "executions", never "executions against consumers", so
      narrowing the selection narrows the denominator with it.

      FAILURE SCENARIO: a future card widens `pages` back to function scope by
      accident (e.g. deleting the scope= argument while editing the docstring),
      then verifies with `pytest tests/test_book_pdf_band.py -k one_render` or
      a single node id because the whole file costs 7 s. Both controls report
      green. The conversion is gone, the 11 renders are back, and the card's
      own control signed it off.

      Also note, for the record rather than as a gate: the pre-gate's P3 claim
      that "the claim holds in both directions" is true only of the whole-file
      selection; the module->class mutant survives a single-class selection, as
      the second row above shows.
    suggestion: |
      Make the counter measure both halves, so a narrowed selection reds
      (default-deny) instead of passing. Cheapest shape that does not need a
      skip (tests/test_guard_integrity.py's silence census forbids adding one):
      count fixture executions AND consumer takings, and assert both.

        _SHARED_RENDERS: list[int] = []      # one entry per fixture execution
        _SHARED_TAKINGS: list[str] = []      # one entry per test that took it

      then in the control:

        assert len(_SHARED_RENDERS) == 1, (...)
        assert len(_SHARED_TAKINGS) == EXPECTED_CONSUMERS, (
            "this control only means something when the whole module ran: "
            f"{len(_SHARED_TAKINGS)} of {EXPECTED_CONSUMERS} consumers were "
            "selected. Run the file, not a subset."
        )

      with EXPECTED_CONSUMERS held to an equality against the consumers that
      exist (which is also the fix for F-006) - a derived number, not a
      hand-written one, e.g. counted off request.session.items filtered by the
      fixture name. Under a node-id or `-k` selection that second assert reds
      with a message that says exactly why, which is the honest answer, and
      under the whole-file selection nothing changes.

      Whatever shape is chosen, the docstrings' universal claims must be
      narrowed to the selection they actually hold for - that narrowing is
      ADR-0039/R1's own remedy ("must be narrowed to what is measured or
      deleted").
    confidence: high
    source: static
    violates: ADR-0039/R2
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: high
    category: tech-debt
    file: meta/kanban/cards/CARD-218.md
    line: 94
    type: gap
    title: "AC-3, AC-4 and AC-6 each name a TestCuration_* verifier that exists nowhere in the tree; the round substituted differently-named controls without recording the substitution, and the pre-gate did not catch it"
    description: |
      The mandated AC-vs-body check. Grepped every *.py under tests/ for each
      class the ACs name:

        TestCuration_ConvertedFilesKeepTheirTestCount    (AC-3) -> no file
        TestCuration_SharedRenderIsNotMutatedAcrossTests (AC-4) -> no file
        TestCuration_NoSharedInteriorStream              (AC-6) -> no file
        TestSuiteProfile_ArtefactExistsAndIsComplete     (AC-2) -> tests/test_suite_profile.py  (exists)

      Three of the card's six ACs therefore name verifiers that have never been
      written - not by this card and not by any predecessor. As written those
      three ACs are check_ref_missing in the ADR-0039 sense: they LOOK
      mechanically checked and are not, which is worse than carrying no check,
      because a missing check is visible and a dead one is not.

      What actually stands in for each, and whether it is adequate:

      * AC-3 - adequate, but it is a MEASUREMENT, not a test. The round and the
        pre-gate both established the collected set by `comm` over sorted node
        ids (removed = 0, added = exactly 5). I confirm the counts
        independently: base 95 + 34 = 129 pass, HEAD 97 + 37 = 134 pass. But
        nothing in the tree reds if a later card deletes one of those 129, so
        AC-3's standing guarantee does not exist - only a one-off observation
        does.
      * AC-4 - adequate and genuinely tested, by the two
        ...TheSharedInteriorIsNotMutated / ...TheSharedSnowflakeInteriorIsNotMutated
        classes, subject to F-002's selection caveat.
      * AC-6 - NO control of any kind. It is satisfied by inspection only: both
        fixtures return list[Image.Image], neither returns a generator or an
        InteriorStream. True, and I verified it, but "verified by a reviewer
        reading the diff" is precisely what the card's AC said a test would do.

      The implementation notes say "The five are the controls AC-4 and AC-6 ask
      for" - which silently renames AC-4's verifier, claims AC-6's verifier
      among them when none of the five tests a stream, and does not mention
      AC-3's verifier at all. The fix pre-gate re-derived the collected-set
      delta but never checked the ACs' named tests against the tree.

      FAILURE SCENARIO, and it is about to happen: the brief states this same
