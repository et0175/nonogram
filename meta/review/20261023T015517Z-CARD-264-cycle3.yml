    finding, because the prose describing its changes stayed; fix round 2 closed
    it and this cycle re-derived the closure clause by clause.
  unmeasured:
    churn: "not_applicable -- the six files' 12-month churn was not mined. The diff's provenance is fully known from the five named commits on the branch, which is a stronger signal here than a churn count."
    defect_density: "not_applicable -- same reason"
    bus_factor: "no_eligible_fact -- every commit in this repository carries the same author identity, so the signal cannot discriminate"
    aggregate_check_site_mutant: "not_applicable -- removing every deadline check removes the bound the target proves, so termination cannot be expected, and G-7 forbids characterising it by elapsed time"

could_not_check:
  - "The full suite was not run (binding instruction). Every pytest, kill_matrix and plant invocation exported NONOGRAM_FULL_SUITE_LOCK=/tmp/card264-cycle3.lock, and each child run printed the confirmation that it read that path and not the board's own meta/kanban/.full-suite.lock, which was never read, written or created."
  - "MEASURED_CLAIM_MISSES[0]'s entry-keying assertion (:3323) was verified by reading rather than by a fired mutant. Two of the three entries' keying assertions WERE fired and killed (:3335, :3349) and the third is the same construct; the residual risk is that one assertion's text does not match its entry, which a reading does establish."
  - "The cause of TestWebGuards_EveryStructuralLoopAssertsNonEmpty's invisibility to kill_matrix was not reproduced -- third cycle in a row. The class's set-axis vacuity case therefore has no instrument-level certification, only an ordinary green run."
  - "G-6's independent codepoint sweep covers the six changed files only. The whole-tree claim rests on the structural fact that no src/ path is in the diff, not on a tree-wide scan."
  - "CON-005 and CON-012 were not exercised; their verdicts are ⚠ unchecked with the typed reason, never holds."
  - "The docs page's truth is established by this review's manual re-derivation against tests/test_cli.py, src/nonogram/__init__.py and src/nonogram/web/__init__.py. NO committed control holds it. See the first out_of_scope entry -- this is what the card ships uncertified."
  - "No review of CARD-265's content beyond the two lines the docs page cites. Whether the withdrawn controls arrived there intact is the orchestrator's question."

restoration:
  shasum_c: "OK for every file in both plant manifests, after every plant"
  diff_q: "no difference for any manifest member, after every plant"
  git_status_porcelain: "exactly the two entries present before this review began -- ' M meta/kanban/cards/CARD-264.md' and the untracked worktree-local cycle-2 report. Nothing added, nothing changed."
  card_file_untouched: "meta/kanban/cards/CARD-264.md sha256 c948ec7712a4e8e96309373f22da1545d2ee278c27af0661448b0a6e2ff5bc76 before the first plant and after the last"
  whole_diff_sanity: "git diff --stat main...HEAD unchanged at 6 files, +1471/-26 after every mutation and plant; git rev-parse HEAD = e26e54733fddd8942e67da664372b2129f727170"
  src_files_touched_transiently: "src/nonogram/web/__init__.py only (plants PL3 and PL4), restored from the cp -p backup and verified three ways. No solver file was touched in this cycle."
  report_committed: false
