verdict_section: |
  ## Verdict

  PASS at 9.6, and this is the certification of record.

  Fix round 2 did what it claimed, and I re-derived every claim rather than
  carrying one. The gating finding is closed: the docs page is now true of HEAD
  clause by clause -- the quotation matches tests/test_cli.py:743-745 word for
  word, the present tense is back, the fabricated test-class citation is gone
  (zero hits in src, tests and docs), the _adapter_counts scoping claim is
  accurate, the CARD-265 fold claim matches CARD-265.md, and M-7's stale :40 is
  replaced by a by-name pointer that resolves. It is also still better than
  main's version, whose seven line citations are each off by one against the
  very file both sides share and whose CLAUDE.md:45 cross-reference is false.

  The round's most load-bearing claim holds: both mutants cycle 2 measured as
  SURVIVING are dead, each at the assertion added for it --
  F6-DECL-GUTTED at tests/test_guard_integrity.py:3349 and AST-MISS-3-GUTTED at
  tests/test_web_server.py:2466, both in both passes, both an instance of the
  recording-pass trap that has misled this card seven times (exit 0 with a FAIL
  cell). All five declared-miss narrowings were re-measured independently and
  none overshoots: M-1's joiner set is exactly {'.', ';'} by an exhaustive
  single-character sweep, matching the declaration; M-2's lookup table really is
  caught, so dropping it was right, and a mutant that re-widens the entry to
  cycle 2's text reds; M-4's two shapes are real misses and the member arm it
  leaves undeclared really does catch; M-3's three entries are each keyed on
  their own text; M-6's count is gone with nothing standing in its place. Eleven
  mutants fired, eleven killed, zero survived. Eight on-disk plants, every one
  red with its message quoted. Both rules cycle 2 marked ✗ -- ADR-0039/R1 and
  ADR-0039/R3 -- now hold on re-judgement.

  I also attacked two things nobody had. One was a suspected tautology in AC-4's
  set check, since _DOMAIN_VALIDATORS is derived from the same walk the check
  consults; a mutant that adds a dead member by hand reds it on four cells, so
  the suspicion is refuted and no finding is filed. The other was the comment
  recording the substring arm's zero unique detection: with the arm fully
  disabled on disk, a prose-only plant still reds at the exemption equality, so
  the comment is true and the arm correctly has no control of its own.

  Two corrections to the brief, reported rather than reconciled. CON-009 plus
  CON-010 collects 9, not 8 -- six plus three. And the CON-010 trap is real: by
  its declared check name the selection collects ZERO and pytest exits 5, which
  is how two earlier rounds reported a security boundary as green on an empty
  room. Selected by its three functions it is green: 9 collected, exit 0.

  Four Minor residuals remain, all prose: an unenumerated case/quoting variance
  in the new dependency declaration, an ordinal that points two assertions off,
  the uncontrolled "six sites" figure, and a truncated quotation. None of them
  blocks the merge and none is worth another cycle.

  **What ships uncertified, named here because naming it is this cycle's job:**
  nothing in the tree holds a docs/how-it-works claim to the code it cites --
  no test reads that directory at all. The page is correct today because I
  checked it by hand; it has no control, and CARD-265 is about to change the
  very lines it quotes. That gap must be carried onto CARD-265 or a new card
  rather than closed with this one. Two smaller items also ship uncertified and
  are listed in could_not_check: MEASURED_CLAIM_MISSES[0]'s keying assertion
  was verified by reading rather than by a fired mutant, and
  TestWebGuards_EveryStructuralLoopAssertsNonEmpty's blindness to kill_matrix is
  unreproduced for the third cycle running, so the set-axis vacuity case inside
  it has only an ordinary green run behind it.
