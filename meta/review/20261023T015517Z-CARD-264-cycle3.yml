        1 assert MEASURED_DEPENDENCY_CLAIM_MISSES
        2 assert extras, "pyproject.toml declares no extras"
        3 assert _dependency_claim_defects(unquoted_extras, ...) == []
        4 assert _dependency_claim_defects(denial, ...) == []
        5 assert len(caught) == len(members), caught
        6 assert all(f"only in the {extra!r} extra" in defect ...)
        7 assert "without backticks" in ...[0]
        8 assert "a denial of a runtime distribution" in ...[1]

      The assertion the sentence describes is 5/6, not 3; 3 is one of the two
      declared misses. The sentence is only true read as "the third of the
      three things the previous paragraph just enumerated", which is a
      defensible reading and is probably what was meant -- but "the third
      assertion" invites a reader to count asserts, and a reader who counts
      lands on the wrong one. On this card in particular, a prose pointer a
      reader checks against the code and finds off by two is the exact defect
      class the card exists to remove.
