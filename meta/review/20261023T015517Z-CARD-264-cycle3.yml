findings:
  - id: m-1
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 3060
    title: "MEASURED_DEPENDENCY_CLAIM_MISSES' headline examples are narrower than the arms behind them: a third evading shape is unenumerated, and the 'caught backtick-independently' positive does not survive a respelling"
    description: |
      The new declaration is accurate where it states its mechanism and
      narrower where it states its example, and two shapes fall in the gap.
      Measured against the live _dependency_claim_defects with pyproject's own
      tables:

        "... the `Dev` extra is dev-only"      -> []   (MISSED)
        '... the "dev" extra is dev-only'      -> []   (MISSED)
        "... `psycopg2_binary` is db-only"     -> []   (MISSED)

      The first two are the restatement arm being both case-sensitive and
      backtick-exact (`f"`{extra}`" in paragraph`), while mentioned() for
      members is re.IGNORECASE. Entry [0] says "an extra restated by name
      WITHOUT BACKTICKS", which does not describe either -- though the clause
      that follows it ("because the restatement arm looks for f\"`{extra}`\"
      and nothing else") does cover them, which is why this is Minor and not
      a violation of ADR-0039/R3.

      The third is the comment block's positive claim, at :3063-3066: "a
      restatement by *member* is caught backtick-independently, because
      mentioned() matches on a word boundary and not on quoting". True of
      quoting; not true of spelling -- the pattern is
      rf"(?<![\w-]){re.escape(name)}(?![\w-])", so 'psycopg2-binary' is caught
      and the underscore spelling a reader may well write is not. The claim is
      stated without that qualification.
    suggestion: |
      Two one-line changes, no new mechanism. (a) Reword entry [0]'s example to
      the mechanism it already names -- "an extra restated by name in anything
      but exact backticks, `{extra}` with that spelling and case" -- so the
      example and the clause agree. (b) Qualify the positive claim: "caught
      backtick-independently, for the distribution's own spelling". Either is
      cheap, and the existing control (DEP-DECL-0-GUTTED, which reds at :3640)
      already covers the reworded text.
    confidence: high
