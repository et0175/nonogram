    fix_note: |
      the expected cause is now derived in the test — corrupt.png is decoded with PIL and what it raises becomes the expectation — so a Pillow reword updates it automatically and a constant no longer passes. Mutants R1 (cause replaced by a literal) and R2 (cause replaced by the exception class name) both KILLED, and R3 confirms the path half is still pinned
