  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_web_upload.py
    line: 318
    title: "The rewritten upload assertion is satisfied by any constant cause, so it no longer checks that the decoder's explanation reaches the user"
    description: |
      The old assertion pinned Pillow's sentence, which was fragile and never
      matched this fixture. The replacement asserts our half of the template on
      each message and then `web["cause"] == cli["cause"]`.

      Mutation M4 — replace the decoder's half in
      `sourcing/image.py:261` with a constant:

        f"cannot read image {str(source)!r}: {error}"
          ->  f"cannot read image {str(source)!r}: unreadable"

      SURVIVED the whole of tests/test_web_upload.py. A constant equals
      itself, so an equality check between the two surfaces passes while the
      message stops explaining anything. (M3, dropping the path, was KILLED —
      our half of the template is still pinned.)

      The trade was deliberate and the robustness half of it is right: the
      test should not break when Pillow rewords. But "both surfaces agree" is
      only half of what the old assertion covered, and the half that was lost
      is the half a user reads.
    suggestion: |
      Derive the expected cause in the test instead of hardcoding or dropping
      it: open `corrupt.png` with PIL inside the test, capture `str(exc)` from
      the failure, and assert both surfaces' cause equals *that*. Wording-
      independent — a Pillow reword updates the expectation automatically —
      and a constant no longer passes, because the constant will not equal
      what PIL actually said.
    confidence: high
    source: static
