  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/books_list.html
    line: 67
    title: "The plan bar borrows the ProgressBar state word \"generating\" for a partially filled book"
    description: |
      `data-status="{{ 'complete' if stats.complete else 'generating' }}"`
      (books_list.html:67) reuses the batch-job state vocabulary
      (components.md:146) for a book that is not generating anything — it is
      partially assembled. It renders correctly, because admin.css has no
      `[data-status="generating"]` rule and the bar falls through to the default
      `--bs-progress-bar-bg: var(--color-accent)` (admin.css:112), which is the
      accent fill the inventory specifies for that state. So this is a
      vocabulary defect in the DOM, not a visual one: a later CSS rule written
      for real batch "generating" behaviour (the inventory's "auto-refresh")
      would silently reach this bar too.
    suggestion: |
      Use a state word that names what this bar shows — e.g.
      `data-status="{{ 'complete' if stats.complete else 'partial' }}"` — and add
      `partial` to ProgressBar's state list in components.md alongside F-002.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: f94f29e
    fix_note: |
      Two parts. Template: the plan bar is `data-status="partial"`, not the batch
      lifecycle's `generating` — it shows a fill level, not a job in flight, so a
      future rule written for real batch behaviour cannot reach it. Rendering is
      byte-identical: neither word has a `.progress-bar[data-status=...]` rule
