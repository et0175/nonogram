findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2155
    title: "/books goes from one query to one store read per member of every book (N+1)"
    description: |
      `_book_member_records` (app.py:2155-2171) calls
      `puzzle_review.get_puzzle(str(puzzle_id))` once per member id, and
      `books_list` calls it once per book (app.py:2272-2275). In DB mode each
      `get_puzzle` opens its own session and issues its own query
      (puzzle_review.py:1105-1116), and `_book_plan_stats` additionally calls
      `get_plan`, which re-reads the same `books` row `get_all_books` already
      loaded (book_manager.py:703-712) — the `Book` dataclass carries no plan
      field (book_manager.py:73-94), so that second read is forced by the
      existing API.

      Before this diff `/books` was one query (`get_all_books`). It is now
      1 + B + sum(len(book.puzzle_ids)) round trips; at the DEFAULT_PLAN of
      150 puzzles a shelf of 10 filled books is ~1500 sessions per render.
      The route has high fan-in as a destination: 17 `url_for("books_list")`
      redirects in app.py land on it after create/delete/finalise/arrange
      actions, so the cost is paid on most book-editing actions, not only on
      a deliberate visit.

      Graded low, deliberately: no NFR pins admin page latency, `meta/design/brief.md`
      states the audience is "one Puzzle Creator at a desk ... Nobody else looks
      at this UI", and the same per-member read pattern is already what the
      readiness gate (`BookManager._selection_records`) and the selection screen
      do. The production shelf size could not be measured (see
      metrics.unmeasured.production_data_scale), so this is a scaling risk with a
      named mechanism rather than a demonstrated slow page.
    suggestion: |
      `PuzzleFilter` already carries `book_id` and `filter_puzzles` exists
      (puzzle_review.py:102-190, 815), so one filtered read per book — or one
      for the whole page — could replace the per-id loop; note `filter_puzzles`
      caps `limit` at 100, so a 150-puzzle book needs paging or a new bulk
      accessor. Leaving it as is and revisiting when a shelf grows past a
      handful of full books is also defensible; if so, record the choice in the
      card's worktree notes so the next reader does not re-derive it.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    fix_note: |
      Left open by decision, not overlooked. Graded low by the reviewer and
      accepted as such: no NFR pins admin page latency, the panel is one Puzzle
      Creator at a desk (meta/design/brief.md), and the same per-member read
      pattern is already what the readiness gate and the selection screen do.
      Revisit when a shelf grows past a handful of full books, or when CARD-131
      releases book_manager.py and a bulk selection-records accessor can serve
      the gate, the selection screen and this list at once. On the backlog.
    dismissed_reason: null
    learned_pattern: null

