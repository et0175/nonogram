  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/books_list.html
    line: 12
    title: "Sortable heads carry no aria-sort and the ↓ glyph is unlabelled"
    description: |
      The two new heads are real `<a href>` links that work with JavaScript off
      (`url_for('books_list', sort=column)`) and get a visible focus ring from
      `a:focus-visible` (admin.css:38-39) — both verified. State is announced only
      as `aria-current="true"`, which says "current" but not "sorted, descending";
      the `<th>` carries no `aria-sort`, and the `↓` is plain link text with no
      `aria-hidden`, so it is read out as a glyph beside the column name.
      components.md:48 specifies "current column marked with ↑/↓", but this list
      offers no ascending order, so ↑ never appears and the arrow carries no
      information a sighted user could act on either.

      This follows the house pattern (`_puzzle_table.html:21` uses the same
      `aria-current`, though with `href="#"` and JS, which is strictly worse than
      what this card did), so it is a systemic nit rather than a regression this
      card introduced.
    suggestion: |
      Put `aria-sort="descending"` on the sorted `<th>` and wrap the arrow in
      `<span aria-hidden="true">`; if the same is done to `_puzzle_table.html`
      it belongs in a design-system card rather than this one.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: f94f29e
    fix_note: |
      Both heads this card added now carry `aria-sort` on the `<th>` via a new
      `sort_order()` macro: "descending" for the current column, "none" for the
      other — sortable but not sorted. The list offers descending order only, so no
      ascending mode is invented and `aria-sort` states what is true. The ↓ is
      `<span aria-hidden="true">` and the direction repeats as
      `<span class="visually-hidden">, sorted descending</span>` — the Bootstrap 5.3
