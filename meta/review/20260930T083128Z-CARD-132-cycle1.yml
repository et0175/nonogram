  - id: F-005
    severity: low
    category: feature
    type: question
    file: src/nonogram/admin/app.py
    line: 2254
    title: "An over-plan book outranks an exactly-on-plan one, and that third ordering decision is unrecorded"
    description: |
      The completeness key is `-Fraction(actual, planned)` with no cap
      (app.py:2251-2256), so a book at 160 / 150 (ratio 16/15) sorts ahead of a
      book at 150 / 150 (ratio 1) and ahead of everything else. The displayed
      figures cap at 100 (`percent`, app.py:2226) and `complete` is
      `actual >= total` (app.py:2227), so both rows draw a full green
      "complete" bar; only the hint text distinguishes them. For a list the card
      describes as a to-do list against the plan, the book that is 10 puzzles
      over its plan arguably has more work outstanding than the one that is
      exactly on it, so "most complete first" putting it first is at least
      debatable.

      AC-234 pins only 150/150 > 132/150 > 20/100, and the card records two
      open decisions (the plan-less tail, one hint list) but not this one. No
      test covers an over-plan book's position.
    suggestion: |
      Decide and record it: either keep the uncapped ratio and say so in the
      card's "two decisions" section (making it three), or clamp the sort ratio
      to 1 so exactly-on-plan books lead and over-plan books tie with them,
      broken by `get_all_books` order. Either way, pin it with a test beside
      TestBooksList_PlanlessBookSortsLast.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: f94f29e
    fix_note: |
      The owner ruled on 2026-09-30: an over-plan book **ties** with an on-plan one.
      `_books_by_completeness`'s ratio is now
      `-min(Fraction(1), Fraction(actual, planned))`, so 160 / 150 no longer sorts
      ahead of 150 / 150 or of anything else, and the tie keeps `get_all_books`'
      newest-first order through the existing stable sort. The rationale — /books is
      a to-do list, and a book ten over its plan still has work to do, namely decide
      which ten to drop — is recorded as the third decision in the card's worktree
      notes beside the two already there, and in the function's docstring.
      The clamp is for the order **only**: the row still reads "160 / 150" and still
      carries its "over 10" hint, and `percent` / `complete` are untouched (they cap
      on their own account). Pinned by the new
      `TestBooksList_OverPlanBookTiesWithOnPlanBook`, three cases beside
      `TestBooksList_PlanlessBookSortsLast`: the over-plan book does not lead an
      on-plan one made after it, the tie flips with creation order rather than with
      the excess (so it is a tie and not a reversed ranking), and the row's figures
      and hint are unchanged. Verified to fail on the pre-fix uncapped key.
    dismissed_reason: null
    learned_pattern: null

