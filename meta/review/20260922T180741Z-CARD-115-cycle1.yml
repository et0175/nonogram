findings:
  - id: F-001
    severity: high
    category: feature
    type: risk
    file: src/nonogram/admin/book_page_spec.py
    line: 97
    title: "MIN_SIDE_MARGIN_MM refuses the stored gutter ADR-0036/AC-179 requires the book to lay out with"
    description: |
      book_page_spec raises ValueError for any stored gutter_margin_cm below
      6.35 mm (MIN_SIDE_MARGIN_MM, book_page_spec.py:97 and the check at
      :225-230). ADR-0036's accepted clarification "Gutter margin and page
      count" (decisions/adr/0036-book-page-geometry-via-page-spec.md:62) says
      the opposite: "the book always lays out with its stored gutter margin
      ... Finalising a book refuses when the actual page count needs a larger
      gutter than the one stored." FR-030/AC-179 (requirements.yml, CARD-129)
      states the scenario in numbers: "a book storing a 0.60 cm gutter margin
      whose interior PDF runs to 180 pages ... finalise is refused, naming
      KDP's 1.27 cm minimum ... the stored gutter is not changed". 0.60 cm =
      6.0 mm < 6.35 mm, so with this builder that book cannot be laid out at
      all: the PDF (CARD-116), the proof pages (CARD-118) and the finalise
      page count (CARD-129) all go through book_page_spec and would die with
      "book gutter_margin_cm is 0.6 cm, below the 0.635 cm minimum side
      margin" instead of the KDP refusal the AC requires.
      The refusal is pinned by a test — TestBookPageSpec_MinimumSideMargin
      parametrises both columns with exactly AC-179's "0.60" value
      (tests/test_book_page_spec.py:305-308) — so it will have to be undone
      later rather than merely extended.
      CON-018 sources the 0.25 in figure to the OUTSIDE margin only ("0.375 in
      outside leaves room for trim variance above KDP's 0.25 in minimum");
      applying it to the gutter has no source in the model, and KDP's gutter
      minimum is page-count dependent, which is precisely why the ADR moved it
      to finalise.
    suggestion: |
      Narrow the minimum to outside_margin_cm (keep the named-column message),
      or drop the minimum entirely — PageSpec.__post_init__ already refuses a
      non-positive usable area, and the builder's own gutter+outside >= width
      check covers the degenerate case. Leave the gutter's KDP minimum to
      CARD-129's kdp_min_gutter_cm(page_count) at finalise. Change the gutter
      half of TestBookPageSpec_MinimumSideMargin accordingly (an assertion that
      a 0.60 cm gutter still BUILDS a sheet is the useful pin, since AC-179
      depends on it).
    confidence: high
    source: model
    violates: AC-179
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_page_spec.py
    line: 180
    title: "The stored-form rule makes a stored \"0.95\" mean 9.525 mm, not 9.5 mm"
    description: |
      _stored_mm returns the profile's exact millimetres whenever the stored
      string equals the profile's 2-decimal storage form ("0.95" -> 9.525 mm,
      book_page_spec.py:178-181). An owner who deliberately stores 0.95 cm
      gets 0.9525 cm. The delta is 25 micrometres — far below any print
      tolerance — and the rule is the only way AC-272/AC-273's exact 206.375 /
      9.525 mm hold for a book that stores the card-mandated default "0.95",
      so this is a documented trade-off, not a defect. It is still a
      value-dependent branch in a conversion function: "0.94" and "0.96" are
      read literally while "0.95" is not, and nothing outside this module
      knows that. Only outside_margin_cm is affected in practice (21.59 /
      27.94 / 1.27 are exact in cm as well as inches).
    suggestion: |
      Keep, but consider a follow-up: store the exact profile value
      ("0.9525") once AC-181's wording and migration 011's server default can
      be widened, and delete the equality branch. At minimum keep the module
      docstring paragraph that explains it (already present) and mirror it
      wherever the columns are written.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/print_specs.py
    line: 157
    title: "create_spec defaults the margins but still validates none of them"
    description: |
      create_spec now fills empty margins from BOOK1_PROFILE
      (print_specs.py:157-158) but passes any supplied margin through
      unvalidated — non-numeric, negative, or below the builder's minimum —
      while the trim is validated. Such a value would be stored and only blow
      up later inside book_page_spec as a ValueError, far from the form.
      Unreachable today (setup_print calls create_spec with trim only,
      app.py:2129-2132), which is why this is Minor rather than a gate.
    suggestion: |
      When Print setup starts accepting margin fields, add a
      validate_margins() beside validate_trim_size that refuses the same
      values book_page_spec refuses, so the refusal happens at the form with
      the field named.
    confidence: high
