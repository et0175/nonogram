findings:
  - id: F-001
    severity: medium
    classification: Important
    gating: true
    category: correctness
    type: defect
    file: src/nonogram/admin/static/solver.js
    line: 621
    title: "A doubled board stays doubled through a window resize and ends up with 14.39 px cells and 376 px of in-stage horizontal overflow, where the same board reloaded at that size has none — and the mirror never behaved this way"
    description: |
      The card lists this as known-open and out of scope. Measured, it is a
      user-visible regression against pre-card behaviour at the same viewport,
      not a missing nice-to-have.

      Probe (Chromium, 30x25 `_unique_grid(30, 25, seed=212)`, one page load,
      resized without ever crossing the 820 px media query):

          at 1920x1500 (as loaded):  dup=55  cell=28.00  no overflow
          resized to 1500x1000:      dup=55  cell=18.38  stage overflow x=0,  y=9
          resized to 1100x900:       dup=55  cell=14.39  stage overflow x=176, y=0
          resized to 900x800:        dup=55  cell=14.39  stage overflow x=376, y=44
          RELOAD at 900x800:         dup=0   cell=14.39  no overflow at all

      So after a plain window drag the player is left with a board whose cells
      are 14.39 px — 9.6 px under the 24 px bar the duplicate is conditional
      on, i.e. the rule the whole card is built around is violated by a factor
      of 1.7 — and with 376 px of horizontal scroll inside the stage that the
      reloaded board does not have. The cells are at the clamp's floor, so the
      duplicate is no longer buying the player anything: it is costing a
      sideways scroll on a board that would otherwise fit.

      The card's stated reason for deferring is false, and that is the part
      that matters for the record: "The mirror has always behaved this way."
      It has not. The mirror's condition IS `mirrorQuery.matches`, the thing
      the listener at solver.js:621 listens to, so a mirrored board can never
      be stale with respect to its own rule — crossing 820 px in either
      direction redraws it immediately (verified: the card's own AC-8 test at
      tests/test_puzzle_solver_zoom.py:616 relies on exactly that, and my
      probe sees the mirror appear and disappear on cue). CARD-212's condition
      is a continuous pixel measurement that is re-evaluated ONLY when that
      same 820 px query fires. This card is the first to put a continuous
      condition behind a discrete trigger, so it is the first that can be
      stale. The listener's guard was widened to
      `payload.width > BIG_SIDE || payload.height > BIG_SIDE`, which shows the
      trigger was thought about; the trigger itself was not.

      Reachability is ordinary: open a puzzle maximised on a 1920-wide screen,
      then put the window back to half-screen. Nothing is lost (history, zoom
      and marks all survive, and a reload restores a sane board), which is why
      this is Important and not Critical.
    suggestion: |
      Smallest change that closes it: re-run the existing `redraw()` when the
      viewport changes, not only when the breakpoint flips. One listener next
      to the mirrorQuery one at solver.js:621, debounced to an animation frame
      and guarded so it only redraws when the chosen rung would actually
      differ:

          let pending = 0;
          window.addEventListener("resize", () => {
            if (payload.width <= BIG_SIDE && payload.height <= BIG_SIDE) return;
            cancelAnimationFrame(pending);
            pending = requestAnimationFrame(() => {
              const drawn = { rows: Number(table.style.getPropertyValue("--player-row-gutters")),
                              cols: Number(table.style.getPropertyValue("--player-col-gutters")) };
              redraw();  // or: redraw() only if the settled rung != drawn
            });
          });

      Pin it with one test in tests/test_puzzle_solver_zoom.py next to AC-8:
      load the 30x25 at 1920x1500 (dup=55), resize to 1100x900 WITHOUT
      crossing 820 px, and assert the duplicates are gone, the stage does not
      scroll horizontally, and the marks + zoom survived. Note that F-002's
      early-out makes this listener affordable; done naively a redraw is up to
      four full draws, which is the card's own stated reason for hesitating.
    confidence: high
    source: dynamic
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    classification: Important
    gating: true
    category: performance
    type: defect
    file: src/nonogram/admin/static/solver.js
    line: 584
    title: "The ladder builds and lays out the board up to four times per draw: a 30x30 at 1280x720 — the suite's own default and a common laptop size — takes ~4x as long to reach an interactive board, and ends up drawn exactly as before this card"
    description: |
      `redraw()` draws each rung into the live stage and measures it
      (solver.js:584-588). For a board big on both axes the ladder has four
      rungs, and a board that can afford none of the duplicates walks all four
      — building ~900 cells plus gutters and forcing a synchronous layout each
      time — to arrive at the layout it had before this card.

      Measured apples-to-apples, same board, same viewport, same final DOM.
      The only difference is the number of rungs: HEAD, versus a one-line
      probe that makes `layoutLadder()` return just its last rung (applied,
      measured, reverted, admin.css/solver.js verified byte-identical):

          30x30 @1280x720 (4 rungs, dup=0):  goto->interactive 807/907/951 ms,
                                             domContentLoaded 732 ms, load 877 ms
          30x30 @1280x720 (1 rung,  dup=0):  goto->interactive 125/218/228 ms,
                                             domContentLoaded 129 ms, load 217 ms
          30x30 @2560x1440 (2 rungs, dup=30): goto->interactive 474/490 ms
          30x30 @2560x1440 (1 rung):          goto->interactive 133/229 ms
          15x15 @1280x720  (1 rung, never big): 101/129 ms either way

      ~600-700 ms of wasted work on the largest supported board (CON-011
      caps sides at 30) at the most ordinary desktop width, every load. The
      2560 column is the control: halve the rungs, halve the cost, so the
      extra time is the discarded draws and not the final board.

      Two aggravations. (1) It is paid by the boards that gain nothing: a
      board that cannot afford a duplicate pays the most, and at 1280x720
      that is every board 16x16 and up (my sweep: 30x30, 30x25, 25x20, 24x24,
      19x26 all land on rung 4 there). (2) It is the stated reason F-001 was
      deferred ("a redraw is up to four draws now"), so the cost is also
      blocking the fix for the other Important finding.

      No declared rule is violated — I swept requirements.yml and there is no
      NFR for the player's render time — and nothing is incorrect. It is a
      measured 4x regression in time-to-board, introduced with no mitigation
      and no mention outside a parenthetical.
    suggestion: |
      Smallest change, and it keeps the card's "measure, never re-derive the
      clamp" principle intact: draw the FALLBACK rung first and early-out.
      Doubling an axis only ever increases a subtrahend (the width terms) or a
      denominator (the height term) in admin.css's min(), so the doubled cell
      is always <= the single-gutter cell — monotone. Therefore if the plain
      board already measures under DOUBLE_MIN_CELL, no rung above it can
      qualify and the ladder can stop at one draw:

          cellElements = drawBoard(stage, payload, plain, zoom);   // today's rendering
          if (drawnCell(zoom) >= DOUBLE_MIN_CELL) { ...walk the doubled rungs... }

      That turns the common "cannot afford it" case into 1 draw (from 4) and
      leaves the "can afford it" case at most one draw worse than today.
      Pin it with an assertion on the draw count rather than on a timing: a
      counter incremented in drawBoard and exposed for the test, or
      `performance.mark` per draw, asserted as 1 for a 30x30 at 1280x720 and
      <= 2 for a 30x12 at 1920x1080. A timing assertion would be flaky; a
      draw count is exact, and it is also what would keep F-001's resize
      listener honest.
    confidence: high
    source: dynamic
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    classification: Important
    gating: true
    category: testing
    type: gap
    file: meta/kanban/cards/CARD-212.md
    line: 213
    title: "The 24 px rule's stated justification is false — three existing fixtures change their layout at viewports the suite uses — and the band the constant really switches on (mid-size boards at the default 1280x720) has no test, while the one existing guard that covers that ground goes red when pointed at it"
    description: |
      The Worktree notes defend DOUBLE_MIN_CELL = 24 with: "measured, 24 px is
      the bar at which **no existing fixture at any viewport the suite uses
      changes its layout**". Measured again, independently, that is not true.
      Each line below is a page load in Chromium; `dup` is the number of
      aria-hidden duplicate clue boxes actually drawn:

          AC_GRID        25x15  (tests/test_puzzle_solver_page.py:98)   @1440x900  dup=15  cell=24.36
          AC301_GRID     20x20  (tests/test_puzzle_solver_page.py:100)  @1440x900  dup=20  cell=24.88
          GRID_16_WIDE   16x15  (tests/test_puzzle_solver_mirror.py:46) @1440x900  dup=15  cell=28.00
          GRID_16_WIDE   16x15  (same fixture)                         @820x900   dup=15  cell=25.66

      1440x900 is `DESKTOP` in tests/test_puzzle_solver_mirror.py:37 and the
      viewport CARD-182's pinned DESKTOP_CELL is measured at; 820x900 is used
      by tests/test_puzzle_solver_phone.py's AC-3 test. So three existing
      fixtures do change their layout at viewports the suite uses. The notes'
      own measurement table even contains the counter-evidence (20x20 and
      25x20 marked **rows** at 1440x900) — the sentence above it generalises
      from fixture+viewport PAIRS that happen to be exercised together to
      "no fixture at any viewport", which is a different and false claim.
      The suite is green only because no test pairs those fixtures with those
      viewports. That is luck, not a property of the bar.

      The same measurement shows where the feature really lives, and it is not
      where the tests look. At the suite's DEFAULT viewport — 1280x720, which
      every browser test that never calls set_viewport_size uses — row-clue
