confirmations:
  - id: C-1
    about: "The survived mutant M11 (term 1 of the clamp's row multiplier) — the task asked for confirmation or refutation"
    verdict: "CONFIRMED equivalent. The implementer's reasoning is correct and the threshold they quote (~20 px) is exact."
    evidence: |
      Two independent ways.

      (1) Algebra. With W = 100cqi, R = rule + rule-major, C = cols,
      S = row-ch, G = row gutters, and N = numeral-min (12px):
          term1 = (W - G(R + 0.6*N*S)) / C
          term2 = (W - G*R) / (C + 0.36*G*S)
      term2 < term1  <=>  0.36(W - G*R) > 0.6*N*S/S... expanding and dividing
      by G*S > 0 gives  (W - G*R) > (0.6*N/0.36)*C + 0.6*N*G*S, which is
      exactly the condition term2 > 0.6*N/0.36 = 20. So term 2 is the smaller
      of the two precisely when its value exceeds 20 px; term 1 can only be
      the binding term BELOW 20 px. And if term1 is binding, term2 <= 20, so
      the mutated min() is also <= 20 — still under DOUBLE_MIN_CELL = 24, so
      the rung is rejected either way. The "20" is 0.6 * --player-numeral-min
      / 0.36, which is why the note that "a lower DOUBLE_MIN_CELL would make
      it load-bearing" is also right.

      (2) Execution. I applied M11 to admin.css (the only change: term 1's
      `var(--player-row-gutters) *` -> `1 *`) and re-measured ten
      board/viewport pairs chosen to include every rung and both the suite's
      and the owner's sizes. Every single one is IDENTICAL to HEAD in both the
      layout chosen and the cell measured:
          30x25@1920x1500 dup=55 28.00 | 30x12@1920x1080 dup=12 28.00
          25x20@1920x1080 dup=45 24.33 | 20x12@1280x720  dup=12 25.62
          16x10@1280x720  dup=10 28.00 | 22x14@1280x720  dup=0  24.59
          20x20@1440x900  dup=20 25.84 | 16x15@820x900   dup=15 27.23
          30x25@1700x1500 dup=55 26.16 | 30x30@2560x1440 dup=60 24.73
      admin.css restored and verified byte-identical against a pre-captured
      copy, and `git checkout --` run on top. Keeping the multiplier for
      arithmetic consistency is the right call and is documented, not claimed
      as killed.
  - id: C-2
    about: "Item 6 — the right-hand gutter's first ring drawing over the heavy frame, and the claim that CARD-193's phone mirror has carried it since it shipped"
    verdict: "BOTH CONFIRMED, and the fix covers the mirror."
    evidence: |
      Measured on CARD-193's phone mirror itself — 390x844, the 30x30 BIG
      fixture, `.is-mirrored` true — as the signed clearance between the first
      row number's ring (getComputedStyle(span, '::before').left/width, plus
      its border) and the clue box's inner (left) border edge, over all 30
      boxes, worst case:

          HEAD, with .is-row.is-right's mirrored margin:        +7.75 px
          pre-fix geometry restored inline on the same page
          (margin-left: 0; margin-right: 1.45ch, i.e. main's rule):  -2.72 px

      A negative clearance is the ring crossing the heavy frame into the
      cells, so the mirror did carry the defect and the new rule fixes it on
      the mirror, not only on the duplicate. I restored the pre-fix geometry
      with inline styles in the page rather than by editing admin.css, so this
      measurement cost no file change. The new pin,
      TestSolverClues_RowRingsStayInsideTheirOwnBand
      (tests/test_puzzle_solver_clues.py:1523), checks the 1920x1500 duplicate
      and not the 390 px mirror — worth one parametrised viewport, since the
      mirror is where the bug has been living for a week.
  - id: C-3
    about: "Item 4 — the duplicate must not cost accessibility or correctness"
    verdict: "CONFIRMED by the real accessibility tree, not by the attributes."
    evidence: |
      A 30x25 at 1920x1500 with all four gutters drawn (dup=55), read through
      CDP Accessibility.getFullAXTree (Playwright's page.accessibility is gone
      in this version):
          rowheader 25 (unique names 25), columnheader 30 (unique names 30),
          names appearing more than once: 0, ignored nodes 837 of 2961,
          cell 754 (750 grid cells + 4 corners), row 27 (25 body + head + foot)
      So each of the 55 clue sequences is exposed exactly once and the 55
      duplicates are ignored, which is more than the card's own test
      establishes (it reads the attributes and the closest('[aria-hidden]')
      ancestry). Correctness of the circles is also sound by construction and
      by measurement: clueNumbersOf groups boxes by data-line and then
      transposes to one entry per clue NUMBER holding its twin spans, so
      paintCircles structurally cannot set one and miss the other, and the
      new AC-4 test additionally measures the ring's computed width/colour on
      both. And nothing double-counts anywhere else: `grep -rn player-clue
      src/` outside solver.js/admin.css returns nothing — there is no second
      consumer of the clue boxes (no counter, no progress calculation, no
      hint path reads them).
  - id: C-4
    about: "Item 5 — the two touched existing tests"
    verdict: "Both relaxations are at or near the minimum, and nothing they used to catch is uncaught. No finding."
    evidence: |
      (a) tests/test_puzzle_solver_mirror.py:78 `_is_corner` went from
      `cls.split() == ["player-corner"]` to `"player-corner" in cls.split()`.
      It is used four times, always as "which KIND of element is at this end
      of the row" (headFirst/headLast), never to assert the corner's side — so
      the equality was incidental, and the side it would now let through is
      covered by a different test in the same file:
      TestSolverMirror_HeavyLinesMatchTheLeftLayout
      (tests/test_puzzle_solver_mirror.py:171) measures the corner's left and
      right border widths, which is exactly where `.is-right` has its effect
      (the card reports it killing mutant M13). A strictly smaller relaxation
      exists — assert the class set is a subset of {"player-corner",
      "is-right"} — but the difference is cosmetic given the border test. All
      5 tests in the file pass unedited (the notes say "all four"; it collects
      five).
      (b) tests/test_admin_design_tokens.py gained a test and changed no
      existing assertion (`git diff` shows a pure append after line 114). The
      two token tests the card names are byte-unchanged at :80 and :86 and ran
      green. Its one weakness is the regex, recorded as F-007.
  - id: C-5
    about: "Item 3 — the third known-open item, and the card's four-rung reachability claim"
    verdict: "Item (a) is a defect (F-001). Item (b) is acceptable with a recorded cost, but its pin is loose (F-006). Item (c) is acceptable as scope. The ladder's four rungs are genuinely reachable."
    evidence: |
      (b) The columns-only rung at 1200x1100, measured: a 25x20 draws 25
      duplicate column boxes in a tfoot with 0 px of stage overflow (1 px
      horizontal) and a 24.47 px cell; a 20x20 there overflows the stage by
      4 px vertically with a 26.42 px cell. That is the same order as the
      3-5 px a single-gutter board already has at that viewport, the stage
      scrolls, and nothing is unreachable — acceptable, with the loose
      assertion noted as F-006.
      (c) A mirrored board with doubled columns: I confirmed by reading
      drawBoard that it composes (thead/body/tfoot all 1+W cells, the
      `mirrored || rowGutters === 2` corner condition covering the tfoot) and
      found no (board, viewport) pair in my sweep that reaches it. Untested
      and unclaimed is the right call; drawBoard would, however, silently draw
      ONE row gutter while the clamp charges for two if a future ladder ever
      produced `mirrored && rowGutters === 2`, and the comment at solver.js:386
      is the only thing preventing that. Not worth a finding today.
      Rungs: I observed all four in the wild — both axes (30x25@1920x1500,
      dup=55), rows only (30x12@1920x1080, dup=12), columns only
      (25x20@1200x1100, dup=25, tfoot=1), and today's rendering incl. the
      mirror (30x30@390x844).

