findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/db/session.py
    line: 290
    title: "AC-4 unmet: a formatter-wrapped `setattr(` reaches the globals, is not in the declared 'blind to' list, and is not counted (mutant M3c survived)"
    description: |
      Both convention texts — src/nonogram/db/session.py:290-293 (reset_engine's
      docstring) and tests/test_db_engine_lifecycle.py:696-702 (the guard class's
      docstring) — bound the scan's blindness in these words:

        "It is blind to every spelling that does not put one of the three literal
         names beside a `setattr(` or a `.<name> =`."

      and then enumerate the blind cases: a runtime-computed name, a
      globals()/vars() write, importlib into a local, a sys.modules swap,
      monkeypatch.delattr, a list-unpacking target, and a whole-path string
      target. I verified every one of those is genuinely blind, and verified the
      card's headline (the keyword-bound `monkeypatch.setattr(app_session,
      name="engine", value=None)` — CARD-252 cycle 3's C3-F-001 hole — IS counted;
      that claim is true).

      But the regexes in _hand_set_spellings (tests/test_db_engine_lifecycle.py:316)
      are `setattr\([^()\n]*?["']NAME["']` — the character class excludes BOTH
      newlines and parentheses. So two further spellings put the literal name as an
      argument of a `setattr(` call, reach the globals, are NOT in the blind list,
      and are NOT counted:

        (a) the call wrapped across lines — exactly what any formatter produces
            once the line passes the column limit:
                monkeypatch.setattr(
                    app_session, "engine", None
                )
        (b) a receiver argument that itself contains parentheses:
                setattr(sys.modules.get("nonogram.db.session"), "engine", None)
                setattr(session_module(), "engine", None)

      Certified, not argued. Mutant M3c: shape (a) appended as a new test function
      to tests/test_db_isolation.py — a file no exemption lists — left the AC-5 class
      at **5 passed**. The same hand-set written on one line (mutant M3) and as a
      dotted assignment (M3b) each killed
      test_no_test_file_outside_the_exemption_sets_those_globals. So the gap is in
      the mechanism, not in my reading of it, and it is reachable by the single most
      likely way a contributor would actually write the line.

      This is the AC-4 failure specifically, not a request for more reach: AC-4 says
      the convention text must say what it does not enforce, "the failure this card
      exists to end is a guard whose claim is wider than its mechanism". A reader of
      the bullet above concludes a wrapped setattr is counted. It is not. The claim
      is wider than the mechanism, in the one sentence written to stop that.

      Not a live miscount today: I swept tests/**/*.py by AST for every real
      `setattr` call carrying one of the three names and compared against the text
      scan — zero real sites are missed, and the tree-wide count is byte-equal to
      _EXEMPT_HAND_SET_SITES (9 sites, 6 pairs). So this is a disclosure defect with
      a latent miss, not a broken exemption. Hence Important, not Critical.
    suggestion: |
      Cheapest honest fix, and the one that matches this card's own thesis (narrow
      the claim to what is measured rather than widen the mechanism): add the two
      cases to the "blind to" bullet in BOTH texts — src/nonogram/db/session.py's
      reset_engine docstring and
      TestEngineLifecycle_TheResetIsAPublishedSeam's docstring — e.g. "...and a
      `setattr(` call whose literal name does not sit on the same line as the
      `setattr(` (any formatter-wrapped call), or whose receiver argument itself
      contains parentheses." One sentence per text.

      If instead the reach is wanted: _hand_set_sites_in could scan the joined
      source with the newline exclusion dropped (`[^()]*?` under re.DOTALL) — but
      that changes the counts and would need the equality re-measured plus a new
      control arm, and it still leaves case (b). Prefer the disclosure fix; the
      card's whole argument is that a small true claim beats a large one.

      Either way, add an arm to test_the_count_reds_on_a_new_file_a_new_name_and_a_tenth_site
      (or a sibling) that pins the chosen behaviour, so the next cycle does not
      re-discover this by probe.
    confidence: high
    source: static
    violates: "AC-4"
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: meta/architecture/decisions/adr/0039-guard-coverage-claims-need-controls.md
    line: 20
    title: "ADR-0039/R2's deny-default clause is consciously traded away, but the ADR is still Accepted / Revised: —"
    description: |
      ADR-0039/R2 (severity: mandatory, scope tests/**) states: "A guard's set is
      derived from an authority the runtime can enumerate, not hand-written. Where
      no such authority exists, the guard defaults to deny: a shape it cannot
      analyse is a FAILURE, never a silent pass." Its own trailing comment names
      this very case: "A completeness test over a hand-enumerated set of syntactic
      shapes is not a completeness test, because no authority enumerates the shapes."

      The new guard splits cleanly against that rule. Its NAME set satisfies the
      first clause and does so measurably — I re-derived D1 (a fourth global added
      to and retired by session.py, then hand-set in a non-exempt file → KILLED) and
      D2 (the same with the name set hardcoded to today's three → 5 passed, green).
      The derivation is load-bearing, exactly as the card reports.

      Its SHAPE set does not. Two hand-written regexes, no enumerable authority, and
      a shape it cannot see is a silent pass (M3c). The card is open about this —
      "the guard no longer defaults to deny, because it no longer claims the reach
      that made a deny default necessary; that trade is the card" — and the board's
      own retro endorsed the shrink, so this is a decision, not an oversight. The
      defect is that the decision lives in a worktree note while ADR-0039 still
      reads Status: Accepted, Revised: —, severity: mandatory. Left as is, the model
      asserts a discipline the tree knowingly does not hold — which is the same
      "claim wider than mechanism" failure this card exists to end, one layer up —
      and the next guard-shrink card re-litigates it from scratch.

      Filed Minor, not Important, for two reasons: the better-scoped reading is that
      R2's first clause (the one with teeth, and the one D1/D2 certify) holds; and
      the fix edits meta/architecture/, which this card's `Touches:` explicitly
      excludes ("meta/architecture/ — no").
    suggestion: |
      Do not edit it from this worktree. Open a follow-up card to amend ADR-0039:
      add to R2 a sanctioned alternative to the deny-default — a guard MAY instead
      drop the reach claim entirely, provided the narrowed claim is stated where the
      mechanism lives and every remaining claim keeps a failing control (R1) — and
      cite CARD-252/CARD-254 as the measured case. That is the rule the board
      actually decided; R2 as written forbids it.
