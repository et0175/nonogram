  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/sourcing/image.py
    line: 527
    title: "nudge()'s Returns clause promises exactly attempt_number flips; nudge_cells only guarantees 'up to'"
    description: |
      nudge()'s docstring Returns says "with ``attempt_number`` cells flipped",
      unconditionally, while nudge_cells' own contract says "Up to ``count``"
      and genuinely returns fewer when the grid holds fewer than `count` cells
      (the greedy spacing pass plus the shortfall fill are both capped by the
      cell count). Unreachable through generate() — random_grid.MIN_SIZE is 10,
      so every conversion has >= 100 cells against a cap of 5 — but nudge is
      exported in image.__all__ and a future caller reading only its docstring
      would over-trust it.
    suggestion: |
      Either weaken nudge()'s Returns to "up to ``attempt_number`` cells
      flipped" (matching nudge_cells), or raise on
      `attempt_number > height * width` the way the `< 1` guard already treats a
      caller-wiring bug.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: question
    file: src/nonogram/orchestrator.py
    line: 125
    title: "COMP-002 imports the concrete sourcing.image module, bypassing the for_mode dispatcher"
    description: |
      `from nonogram.sourcing import image as image_source` is the first time
      the orchestrator names a concrete mode module; every other source
      interaction goes through sourcing.for_mode(request.mode). It is legal
      under ADR-0007 (tests/test_cli.py's rank walk puts sourcing at rank 2 and
      orchestrator at rank 1, so the direction is outward) and defensible —
      nudging is not part of the GridSource protocol, and the call is gated
      behind `request.mode == sourcing.IMAGE`. The consequence is visible in the
      tests: _install_source monkeypatches orchestrator.sourcing.for_mode while
      image_source.nudge stays the real function, i.e. the source and its
      recovery mechanism now resolve through two different channels.
    suggestion: |
      No change needed for this card. If a second image-like mode ever lands,
      move nudge behind the dispatcher (e.g. an optional capability lookup
      alongside for_mode) rather than adding a second direct import.
    confidence: high
