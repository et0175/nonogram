  - id: F-504
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_suite_profile.py
    line: 1243
    title: "Two exclusion reasons are plausible-sounding and wrong (os.popen, os.system), and subprocess — this module's own idiom for listing files — is outside _SURFACE_NAMESPACES entirely"
    description: |
      This is the answer to "is the exclusion list honest on a sample". I
      sampled ~60 of the 307 entries across all 18 reasons. Eighteen of the
      18 reasons are defensible and the four guard groups are right: the
      listers, globbers, wrappers and probes all belong where they are, the
      probe group is deliberately over-inclusive (fd reads classified as
      probes, which widens what is reported and cannot hide anything), the
      env-var survivor and the except-handler/`open` bound are both
      classified KIND_NEITHER with the honest reason and carry negative
      controls. No actual directory enumerator is parked in an exclusion.

      Two reason texts are nonetheless wrong as written:

      * `popen` sits in "file-descriptor plumbing; **it names no directory**
        and answers no presence question" (lines ~1452-1462). `os.popen("ls "
        + str(KANBAN))` names a directory and lists it.
      * `system` sits in "process, signal or scheduling control, **not the
        filesystem**" (lines ~1353-1369). `os.system("ls " + str(KANBAN))`
        is the filesystem.

      Measured: both shapes return [] from `_live_log_references`, as does
      `subprocess.run(["git","ls-files",str(KANBAN)])`.

      And `subprocess` is the sharper half: it is not an exclusion at all,
      because `_SURFACE_NAMESPACES` is `(os, os.path, glob, pathlib.Path)` —
      itself a four-member hand-written set whose completeness nothing can
      test (RC-1). `subprocess` is excluded by not being looked at. That
      matters here more than it would elsewhere, because shelling out to list
      files is THIS MODULE'S OWN house idiom: the docstring at line 24 counts
      "six `git ls-files` listings behind :func:`_files_under_guard`". A
      future author copying the module's own pattern to find logs under
      meta/kanban writes `subprocess.run(["git","ls-files","meta/kanban"])`
      and the path guard says nothing.

      Why Minor and not gating: a shell-out to list a directory is deliberate
      evasion rather than a plausible refactor in a test asserting on timing
      data — unlike F-501's join spelling. The silence detector also still
      fires on `listdir(`-shaped conditions, and a shell-out that produces a
      host-state skip through an `if` is caught by the probe pattern if the
      condition text names a probe. No mutant was constructed that survives
      on this route alone.
    suggestion: |
      Two sentence edits and one recorded bound: move `popen`, `system` and
      the `spawn*`/`exec*` family into a reason that says what is true — "can
      reach any directory through a shell, which this guard does not parse;
      a listing written this way is a recorded bound, not a covered case" —
      and add a line to `_SURFACE_NAMESPACES`' docstring stating the four
      namespaces are a judgement whose completeness is not measured, in the
      same explicit-non-claim form A11 uses for the other-platform handful.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-505
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_suite_profile.py
    line: 1704
    title: "_unwrapped peels only single-argument calls, so os.path.relpath(KANBAN, REPO_ROOT) is not seen through — a peel-shape arity bound that neither the audit nor the generated controls can reach"
    description: |
      `_unwrapped` (lines 1704-1733) peels a call whose function tail is in
      `_PATH_WRAPPERS` only when it has exactly one argument, plus a
      no-argument method. The audit polices WHICH names are wrappers; nothing
      polices which CALL SHAPES the peel accepts, and the two generated
      templates (`WRAPPED_DIRECTORY_SOURCE`, `WRAPPED_DIRECTORY_METHOD_SOURCE`)
      are the only two shapes exercised — so the shape set is a two-member
      hand enumeration behind an audited name set (RC-1 again, two layers in).

      Measured:

        os.listdir(os.path.relpath(KANBAN, REPO_ROOT))   -> []   MISSED
        os.listdir(os.path.relpath(KANBAN))              -> ['listdir() of meta/kanban']
        os.listdir(str(KANBAN))                          -> ['listdir() of meta/kanban']
        os.listdir(str(KANBAN.resolve()))                -> ['listdir() of meta/kanban']   (nested peels fine)

      `relpath`, `commonpath` and `fspath`-with-a-second-argument are the
      members where a second argument is natural. Minor because the direction
      is "peels less, so catches less" on a shape nobody writes in a test,
      and because `test_every_path_wrapper_is_seen_through`'s comment is now
      honest about being non-vacuity of the peel and nothing more — it no
      longer claims to bound anything.
    suggestion: |
      Either accept arity > 1 when the FIRST argument resolves to the kanban
      directory, or add `os.path.relpath(KANBAN, REPO_ROOT)` to
      MEASURED_STRUCTURAL_MISSES so the bound is a control that goes red when
      the peel grows, which is the pattern the rest of the file now uses.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-506
    severity: low
