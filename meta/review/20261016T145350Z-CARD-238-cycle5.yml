findings:
  - id: F-501
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_suite_profile.py
    line: 1851
    title: "RECORDED BOUND (owner stop rule): a directory built with os.path.join / Path.joinpath is invisible to the path guard, and compounded with the already-disclosed except-handler bound it yields a surviving mutant that restores this card's own defect"
    description: |
      KIND / SEVERITY CALL FIRST, because the owner's stop rule turns on it:
      this is **another member of an unfalsifiable set** — the set of spellings
      that BUILD the kanban directory. The audit this cycle delivered polices
      the spellings that READ it. Per the owner's pre-commitment ("if you find
      another member of an unfalsifiable set, the card merges with that hole
      recorded; there is no cycle 6") this is a recorded bound, NOT a reason to
      stop the card. It is reported at full strength anyway because the owner
      asked for that, and because the recording needs to be precise enough to
      be actionable later.

      The falsified claim, tests/test_suite_profile.py:1850-1851
      (`_live_log_references` docstring):

        "... or a listing of that directory **by any spelling**
         :data:`STDLIB_DIRECTORY_SURFACE` **classifies as one**."

      `listdir` IS such a spelling, the directory IS that directory, and the
      guard returns []. Measured as pure functions (module imported by path,
      no edit):

        os.listdir(os.path.join(REPO_ROOT, "meta", "kanban"))      -> []  MISSED
        KANBAN = os.path.join(REPO_ROOT, "meta", "kanban");
          os.listdir(KANBAN)                                       -> []  MISSED
        os.listdir(REPO_ROOT.joinpath("meta", "kanban"))           -> []  MISSED
        os.listdir(os.path.join(os.getcwd(), "meta", "kanban"))    -> []  MISSED
        -- controls, same listing, directory built with `/` --
        os.listdir(REPO_ROOT / "meta" / "kanban")                  -> ['listdir() of meta/kanban']
        os.listdir(Path.cwd() / "meta" / "kanban")                 -> ['listdir() of meta/kanban']

      Note the second-order inaccuracy this exposes. `os.path.join` and
      `joinpath` are classified KIND_NEITHER, reason "pure path-string
      arithmetic; it consults no filesystem" — true of the function in
      isolation, and beside the point: the guard does not need `join` to
      consult a filesystem, it needs to recognise the directory `join` built.
      And `joinpath`'s entry in NOT_A_PATH_WRAPPER ("a wrapper that names
      another directory is not peeled") asserts a miss whose correctness is
      indistinguishable from this hole: `REPO_ROOT.joinpath("meta","kanban")`
      names exactly the kanban directory, and the negative control passes for
      the wrong reason.

      EXECUTED END TO END, in a tracked guarded source other than this module
      (tests/test_clues.py, reverted from a pre-captured copy, md5
      942627df2b6df5a003bf52775ab1d398 restored and verified after every
      plant). The card's declined Option 2 shape — "find whatever .log is
      under meta/kanban" — so the source names no log at all, plus the
      except-handler skip that the file already discloses as a bound (sweep
      D5, NOT_A_CONDITIONAL_SILENCE):

        KANBAN = os.path.join(REPO_ROOT, "meta", "kanban")
        def test_the_timing_history_is_present_and_nonempty() -> None:
            try:
                names = sorted(n for n in os.listdir(KANBAN)
                               if n.endswith(".log"))
                first = names[-1]
            except (FileNotFoundError, IndexError):
                pytest.skip("no timing history on this host")
            assert Path(os.path.join(KANBAN, first)).read_text().strip()

        both guard classes                 -> 250 passed, rc=0   SURVIVED
        the mutant's own verdict,
          meta/kanban with no *.log        -> 1 SKIPPED
        the mutant's own verdict,
          one *.log present                -> 1 PASSED

      That last pair is this card's defect verbatim: CARD-234-green-by-skipping
      vs CARD-235-red/green-on-the-same-code, restored, with every guard green.

      THE JOIN SPELLING IS THE LOAD-BEARING SUBSTITUTION, measured both ways:

        `/` join   + except-handler skip -> 2 failed (path guard + behavioural)  KILLED
        os.path.join + `if not names:`   -> 2 failed (silence equality + behavioural) KILLED
        os.path.join + except-handler    -> 250 passed                          SURVIVED

      So neither bound alone survives; the compound does, and the undisclosed
      half is the join spelling. This is precisely cycle 4's lesson ("the
      Critical's lesson was that two sets compounded") recurring one layer
      out — which is why I am calling it a member of the family rather than a
      fresh defect.

      Why the behavioural half cannot help: `_run_module_in_sandbox` runs only
      `tests/test_suite_profile.py` plus the sandbox control node, so a
      coupling in any of the other ~220 guarded sources has the two structural
      rules as its sole defence. That is stated accurately in the docstring at
      lines 2029-2043; it is the stated bound, not a new one.

      Blast radius, stated honestly: nothing in the repo today uses this
      shape. `os.path.join` in a pathlib-idiomatic repo plus an
      except-handler skip is a moderately contrived combination — each half
      plausible on its own, the pair less so. That, plus the stop rule, is
      why this is filed `high` and explicitly NOT as a gate.
    suggestion: |
      For the record, not for this cycle. The durable fix is the same move the
      audit made one level down: stop enumerating by hand.

      1. Teach `_kanban_directories` / `_joined_components` the two other join
         spellings — an `ast.Call` to a name whose tail is `join` or `joinpath`
         whose string arguments spell `meta`, `kanban` — and add the three
         measured shapes above to REINTRODUCTIONS so each gets a control that
         `test_the_control_for_each_spelling_depends_on_the_set` can police.
      2. Then make the DIRECTORY-construction spellings an audited projection
         of STDLIB_DIRECTORY_SURFACE too (a KIND_JOINER group), so the next
         one is a red test rather than a review finding — otherwise this
         finding is occurrence seven in waiting.
      3. Correct line 1850-1851 to what the mechanism holds: a listing of that
         directory when the directory is reached by a `/` join, a single
         string, or a classified wrapper around one — and name
         `os.path.join`/`joinpath` in MEASURED_STRUCTURAL_MISSES so the bound
         goes red the day the resolver grows past it.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-502
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_suite_profile.py
    line: 3389
    title: "The audit hard-codes THIS interpreter's surface into the guards: five version-gated members make the suite red on a lower interpreter inside the declared requires-python range — the card's own anti-pattern, in a new variable"
    description: |
      A DIFFERENT defect, not a member of the family — judged on its own
      merits. It is the one thing this cycle newly introduced that makes the
      suite's verdict depend on something other than the code it judges.

      `test_a_spelling_the_guards_use_is_a_real_stdlib_name`
      (lines 3389-3404) asserts that every non-KIND_NEITHER classification
      exists on the running interpreter's surface, exempting KIND_NEITHER
      and "no others" (the comment at 1221-1228 states this deliberately).
      Five members of the guards are version-gated:

        glob0, glob1        — undocumented glob internals, deprecated in
                              CPython and slated for removal
        is_junction         — pathlib.Path, 3.12+
        isjunction          — os.path, 3.12+
        isdevdrive          — os.path, 3.12+

      Measured, without editing the file — a pytest plugin that deletes those
      five attributes before collection, simulating an interpreter that lacks
      them:

        test_a_spelling_the_guards_use_is_a_real_stdlib_name -> FAILED
          "a spelling classified into one of the guards is not a public
           callable of os, os.path, glob or pathlib on this host:
           ['glob0', 'glob1', 'is_junction', 'isdevdrive', 'isjunction']"
        test_every_spelling_the_stdlib_offers_is_classified  -> passed
          (the completeness direction is correctly tolerant)

      Two reasons this matters rather than being a curiosity:

      * `pyproject.toml:9` declares `requires-python = ">=3.9"`. On any
        interpreter below 3.12 inside that declared range the suite is RED on
        a test that says nothing about the code. (CLAUDE.md says 3.14 for
        dev; the pyproject/CLAUDE.md inconsistency is pre-existing and not
        this card's, but this cycle is what makes it bite.)
      * `glob.glob0`/`glob1` are new members THIS cycle added ("no reason to
        exclude them survived the asking", sweep A12). They are the two
        likeliest to disappear from a future CPython, at which point the
        suite goes red because a spelling nobody can write any more is
        missing from a guard that no longer needs it. The red is a false
        alarm about a non-risk.

      The file discloses the OTHER direction and only that direction
      (lines 1217-1228): "A platform or version offering a name this host
      does not ... makes the completeness audit red until that name is
      classified -- which is the audit working, not failing." A platform or
      version *lacking* a name this host has is not mentioned, and that is
      the direction that is wrong. So the disclosure is one-sided, and the
      stated bound is narrower than the real one — structurally the same
      prose-vs-mechanism gap this card keeps producing, but with the error
      pointing the other way, which is why it is not RC-1.

      Severity judgement: `high`, not critical. The failure mode is LOUD
      (a red test naming exactly what to do), which is the opposite of the
      silent skip this card exists to remove, and there is no CI in the repo
      (no .github/, no ci/) so nothing but a deliberate interpreter change
      triggers it today. But it is a real, measured, newly-introduced
      dependence of the suite's verdict on the host, on a card whose whole
      thesis is that such a dependence is not a gate.
    suggestion: |
      One line, and it removes the class rather than the symptom: derive the
      guards from the intersection rather than asserting equality with the
      table.

        _LISTERS  = _classified(KIND_LISTER)  & frozenset(_stdlib_directory_surface())
        _GLOBBERS = _classified(KIND_GLOBBER) & frozenset(_stdlib_directory_surface())
        ... and likewise for _PATH_WRAPPERS and _HOST_STATE_PROBES

      Then every set is automatically correct on every interpreter, the
      completeness direction keeps all its power (an unclassified name is
      still red), `test_the_listing_sets_are_exactly_the_classified_spellings`
      becomes an equality against the same intersection, and
      `test_a_spelling_the_guards_use_is_a_real_stdlib_name` can be dropped
      or restricted to "a classified name that no supported interpreter has
      ever offered". Failing that, exempt a declared VERSION_GATED set with
      the version each name arrived in, and say so in the comment at 1217.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-503
