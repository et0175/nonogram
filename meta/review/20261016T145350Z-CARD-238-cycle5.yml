    title: "The meta-guard mutates module-level globals with setattr; correct today, but it makes the module unsafe under any parallel or randomised runner"
    description: |
      `test_the_control_for_each_spelling_depends_on_the_set` (lines
      3320-3340) rebinds `_LISTERS`/`_GLOBBERS` on the live module object to
      measure each control's discriminating power, restoring in a `finally`.

      It is correct as written and it is the single most valuable test this
      cycle added (verified below), so this is a note, not a complaint about
      the design. But it is shared mutable global state in the unit tier
      (engineering-standards §6, "serialization without a reason"): under
      `pytest-xdist`, `pytest-randomly`, or any future `-n auto`, another
      test in the same worker reading `_LISTERS` mid-window sees a narrowed
      set, and the 10 parametrised cases each open that window twice per
      REINTRODUCTIONS entry. Nothing in the file records the constraint.
    suggestion: |
      Add one line of comment stating the module must not be run under
      xdist/randomly because of this rebinding — or, better, pass the sets as
      a parameter: `_live_log_references(source, listers=..., globbers=...)`
      defaulting to the module globals, so the test narrows an argument
      instead of a global and the window disappears.
