findings:
  - id: F-101
    severity: high
    category: tech-debt
    type: gap
    file: tests/property/test_book_export_interior.py
    line: 941
    title: 'PARITY_GUTTER_MM states a measured figure that does not reproduce by its own method'
    description: |-
      The docstring of PARITY_GUTTER_MM (:941) says: "Measured on this corpus's own first case
      through :func:`_expected_drawing_left_mm`: 20.4500 mm on the left-hand page against
      30.4500 mm on the right-hand one, 10.0000 mm apart." The card's Worktree notes repeat the
      same pair under "Figures re-derived from the production path, at the end".

      Run exactly that method on exactly that input and the answer is different. With
      rng = random.Random(PARITY_SEED) and the corpus's own first case (tier, then
      rng.randint(1,3), then _unpairable_puzzle -- the test's own order),
      _expected_drawing_left_mm(puzzles[0], 6, gutter_mm=20.0, outside_mm=10.0) = 10.0000 and
      the same call at page 5 = 20.0000. Sweeping all 12 cases and both is_lower values, the
      pair is 10.0000/20.0000 for nine cases, 16.7000/26.7000 for two (cases 5 and 10) and
      12.9500/22.9500 for one (case 7). 20.4500/30.4500 occurs nowhere in the corpus. The
      "10.0000 mm apart" half IS correct and reproduces for every case.

      A second, inconsistent figure survives one docstring away, and it is the one the card
      claims it caught: test_PropertyTest_BookExport_ParityCountsFromTheTitlePage's own
      docstring (:1024) still says "the right-hand spec is 5.0 mm away". The card's Worktree
      notes say "the first draft of PARITY_GUTTER_MM's docstring said the two parities were
      5.0 mm apart ... The docstring now states 10.0 mm and names the function it was measured
      through" -- true of PARITY_GUTTER_MM, false of the test it documents. Three figures for
      one quantity (5.0 apart, 10.0 apart, and an absolute pair implying neither) now sit within
      85 lines of each other.

      WHAT WOULD MAKE THIS RED, AND WHETHER THAT STATE EXISTS: no test fails, and none can.
      The test's own assertions are live measurements with a > 4.0 separation floor and a
      < 0.1 mm tolerance, so they pass on the true 10.0 mm separation and would pass on the
      claimed one too. That is the violation: ADR-0039/R1 says a claim needs a control that can
      fail, and these figures have none. The refutation is reproducible in one command, which is
      what makes the finding refutable rather than a worry.
    suggestion: |-
      Either re-measure and restate -- the corpus's first case is 10.0000 mm (left-hand) against
      20.0000 mm (right-hand), and the corpus maximum is 16.7000/26.7000 -- or narrow both
      docstrings to the only quantity the test actually controls, the 10.0000 mm separation, and
      fix ":1024"'s "5.0 mm away" to 10.0 mm. If the absolute pair is worth keeping, derive it in
      the test (an assert on _expected_drawing_left_mm's value for case 0) so the number has a
      control that can fail.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: 'fix round 1 — card/206-interior-title-page'
    fix_note: |-
      tests/property/test_book_export_interior.py:941 now states one figure, the one that reproduces:
      the two parities are exactly PARITY_GUTTER_MM - PARITY_OUTSIDE_MM = 10.0000 mm apart, measured
      through _expected_drawing_left_mm over all 12 cases and both is_lower values (maximum deviation
      from 10.0: 0.0). No absolute pair is stated, because none describes the corpus (10.0/20.0 for
      nine cases, 16.7/26.7 for two, 12.95/22.95 for one -- a drawing's left edge is that page's own
      side margin plus half the drawing's own spare, and the spare varies with the puzzle). The AC-4
      docstring's "5.0 mm away" is now "PARITY_GUTTER_MM - PARITY_OUTSIDE_MM = 10.0 mm away". The
      figure has a control now: the separation assertion was tightened from a "> 4.0" floor to an
      exact equality against gutter - outside, per case. MUTANT MODEL_DRIFT
      (_expected_drawing_left_mm's right-hand margin, gutter_mm -> gutter_mm + 5.0) kills exactly that
      assertion and nothing else. DOMAIN: tests/kill_matrix.py RECORDING pass over
      tests/property/test_book_export_interior.py::test_PropertyTest_BookExport_ParityCountsFromTheTitlePage,
      52 ast.Assert nodes, SHIPPED 0 FAIL of 11 reached (pytest exit 0, 1 collected test), child
      instrumentation off, aggregate ANY-RED; MODEL_DRIFT exit 0, 11 reached, 1 FAIL at :1122. The old
      floor survives that same mutant, which is why it could not red on three readings of one
      quantity. Class sweep: every other figure in the diff was re-derived (see the card's fix-round
      notes); one more, "1186 px against 1191 px" in tests/test_book_pdf_memory.py, reproduces in no
      domain and was deleted rather than restated.
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 6696
    title: 'a bare page-position literal survives in interior_stream, in the exact blind spot the card declared covered'
    description: |-
      interior_stream computes first_answer_page twice. The second, at :6747, is the derived one
      this card fixed. The first, at :6696, is still

          first_answer_page = 3 + len(section)

      and is passed straight to self.page_spec(first_answer_page) for
      _degrade_infeasible_packed_pages. This is the literal 3 the card's own "What to implement"
      names as "the bug this card is most likely to ship", in the same function as the position it
      did fix, nine statements earlier.

      NEITHER DECLARED CONTROL CAN SEE IT, and the two were declared to cover each other.
      TestBookPdfStructure_NoPositionCountsTheGuideWithoutTheTitlePage enumerates only the
      outermost expressions containing a GUIDE_PAGE_COUNT load; this expression contains neither
      constant, so it is not in the enumerated set at all -- the declared honest bound, verbatim.
      The bound then says that shape "is covered behaviourally by
      test_each_position_is_counted_from_the_constant_not_a_literal". It is not: that test moves
      TITLE_PAGE_COUNT and re-reads the written interior, and this value reaches no byte of the
      output, so the monkeypatch case is green whatever it is. I enumerated the module myself by
      AST (every assignment to a page-ish name whose value holds an int Constant, every page-ish
      keyword argument with a literal, every page-ish parameter default, across
      book_pdf_generator.py, book_kdp.py and book_page_spec.py): this is the only surviving site.
      Every other position the card names -- produce()'s title and guide ranges, the TOC page
      number, section_plan's first_page, the real first_answer_page, structural_toc_entries' guide
      row, interior_page_count's formula, puzzle_pages'/puzzle_section's defaults, and
      book_kdp.unpaired_interior_page_count (which states no front-matter term of its own and
      delegates to interior_page_count) -- is derived from the constant. Claim 1 of the review
      brief therefore holds everywhere except here.

      WHAT WOULD MAKE THIS RED, AND WHETHER THAT STATE EXISTS: it is not red today, and I
      measured that rather than assumed it. page_frame(page_spec(n)) is parity-invariant in size
      (2196 x 2994 px on both parities of the wide-gutter book; only the origin moves), and
      _degrade_infeasible_packed_pages returns the identical plan for every page_spec(1..15) on
      the baseline corpus. So the value is inert and the site is pre-existing (it reads
      "3 + len(section)" at the merge base too, 27ca88c7:6625). What is NEW in this card is the
      claim: TITLE_PAGE_COUNT's own docstring says "Every front-matter position after it counts
      from here rather than from a literal", and the card's Worktree notes say "every downstream
      position counts from the constant". Both are false of :6696, and the declared exemption that
      is supposed to bound them carries no control that can fail and no equality against the sites
      that exist today -- which is ADR-0039/R3's exact prohibition. The latent risk is real but
      second-order: the day the degrade pass becomes position- or parity-sensitive, or
      TITLE_PAGE_COUNT moves again, nothing in the suite reds.
    suggestion: |-
      Cheapest correct fix: derive it like its sibling --
      first_answer_page = 1 + TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT + toc_page_count + len(section) + 1
      -- or, better, hoist the single derived assignment at :6747 above the degrade pass and delete
      the duplicate, so the function has one first_answer_page rather than two with different
      values. If the representative-spec reading is worth keeping, rename the local
      (representative_page) so it stops reading as a page position, and record it as a named
      exemption with its own control under ADR-0039/R3. Either way, narrow the "every position"
      wording in TITLE_PAGE_COUNT's docstring and in the card to what the two guards actually
      measure.
    confidence: high
    source: static
    violates: ADR-0039/R3
    root_cause: RC-1
    status: fixed
    fixed_in: 'fix round 1 — card/206-interior-title-page'
    fix_note: |-
      TWO halves, and the route taken was WIDEN THE GUARD. (1) The literal is gone: interior_stream
      computed first_answer_page twice and now computes it once, derived -- 1 + TITLE_PAGE_COUNT +
      GUIDE_PAGE_COUNT + toc_page_count + len(section) + 1 -- hoisted to where the bare "3 +
      len(section)" was, with the duplicate nine statements later deleted. What the degrade pass needs
      was measured rather than copied: page_spec(n) differs across interior positions 1..20 in exactly
      one field (parity), the usable area is one value (190.500 x 253.492 mm) and page_frame one size
      (2550 x 3300 px) for every n, and _degrade_infeasible_packed_pages returns an identical plan on
      both parities for a feasible 2-up, a 4-up that splits into singles and a 2-up that falls back to
      singles, and over page_spec(1..20) on two real books. The probe therefore needs a placed spec,
      not a position, and the real first answer page is one. (2) The claim now has a control.
      _page_position_sites derives the module's page positions from the one geometry door they must
      all reach (page_spec/book_page_spec, ADR-0036/R2), grows the vocabulary to a fixed point through
