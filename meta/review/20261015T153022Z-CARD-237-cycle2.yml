    title: "The live sibling's equality assertion is tautological — the same pure function on the same two arguments"
    description: |
      test_this_hosts_measured_export_passes_the_new_guard asserts

          _assert_the_export_fitted_with_room(real_streaming, real_floor) == measured_export

      where measured_export is _export_marginal_cost(real_streaming, real_floor) three
      lines above, and the guard's return value IS _export_marginal_cost(streaming, floor)
      (line 1052/1066). Same deterministic function, same two objects: the equality holds
      by construction and cannot fail for any implementation of the guard that returns its
      own marginal — including one that asserted on the child's TOTAL and then returned the
      marginal. The sibling's equality (== WORST_RECORDED_EXPORT_BYTES, line 1553) does not
      have this problem, because there the expected value is independent of the guard.

      The test is NOT vacuous overall — the guard call itself can fail (marginal >= 16
      bitmaps), which is the half AC-2 asks a measurement to carry, and that half is real.
      Only the trailing equality is decorative. This is the pattern CLAUDE.md names
      explicitly ("prefer an independent second implementation over re-deriving a value
      with the same function you're testing").
    suggestion: |
      Either drop the equality and keep the bare guard call (the assertion that matters),
      or re-derive the expectation independently:
          assert _assert_the_export_fitted_with_room(real_streaming, real_floor) == (
              real_streaming.report["resident"] - real_floor.report["resident"]
          )
      which is what AC-1's test at line 1467 already does and which can actually fail.
    confidence: high
