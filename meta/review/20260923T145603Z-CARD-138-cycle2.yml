findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/batch_create.html
    line: 180
    title: "querySelector('form') binds the clear-images form once pictures are loaded"
    description: |
      Pre-existing on main and NOT a regression from this card — but the fix
      round added a comment (lines 194-198) reasoning about exactly this
      selector, so this is the cheapest moment to notice it.

      Rendering the template with a non-empty `loaded_images` gives the form
      order: /batch/clear-images, /batch/from-images, /batch/create. So
      `document.querySelector('form')` (line 180) matches the "Start over"
      form, not the upload form. Consequences in that state: pressing
      "Start over" runs getSelectedFiles(), finds 0 files, calls
      e.preventDefault() and alerts "Select at least one image file …" — the
      button never works; and the upload form loses its guard entirely.

      The new comment's own claim ("that one matches the first form on the
      page, never this one") is literally true and the new listener is
      correctly bound by id, so nothing this card added is broken.
    suggestion: |
      Give the upload form an id (e.g. `id="imageUploadForm"`) and change line
      180 to `document.getElementById('imageUploadForm')`, matching the
      pattern the card just introduced for the random form.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

