  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 1105
    title: "A flashed error discards the operator's difficulty, count and size"
    description: |
      On a refused request (out-of-range count, unsupported tier) the route
      flashes and falls through to `_render_batch_step_one()`, which renders
      the random form from defaults only: Any selected, count reset to
      DEFAULT_BATCH_COUNT, size reset to 20. The image half of the same page
      does better — it restores default_size and quality_filter from the
      session (app.py:1122-1123).

      Mild: HTML5 `min`/`max` catch most bad counts client-side, and the tier
      select cannot produce an unsupported value unless the request is forged.
    suggestion: |
      Persist the three random-form fields in the session the way
      batch_default_size / batch_quality_filter already are, and pre-select
      them on re-render.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

