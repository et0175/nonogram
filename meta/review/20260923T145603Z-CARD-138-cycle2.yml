    title: "The MIN_RANDOM_BATCH_COUNT comment describes intra-card history as repo history"
    description: |
      batch_generator.py:33-36 and the mirroring comment at app.py:951-955 say
      the bound "was a bare 10 here *and* a bare `min=\"10\"` in
      batch_create.html". Verified against main: `git show
