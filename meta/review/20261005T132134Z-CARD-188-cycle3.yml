    title: "Rule A at the far edge is untested: `end < length` -> `end <= length` survives"
    description: |
      M3 survives every pure-tier test. The mutant stops a walk at a closed run that reaches the
      walk's far edge. On fitting lines it is equivalent (rule B or the other walk circles the same
      numbers), so AC-1/AC-3 cannot see it. It differs only on marks that fit no placement,
      e.g. clue (1, 2), marks "WWWWWWWWWD": the card's rule A circles the "1", the mutant circles
