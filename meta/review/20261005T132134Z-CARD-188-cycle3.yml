findings:
  - id: F-006
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_clues.py
    line: 670
    title: "No test pins the ring's vertical position: a ring moved off (even wholly above) its number passes the whole clues suite"
    description: |
      Step 8f mutation check. admin.css:518 `top: calc(50% - var(--player-circle) / 2)` -> `top: 0`
      (M7) and -> `top: calc(-1 * var(--player-circle))` (M9, the ring drawn entirely above its
      digits) both SURVIVE tests/test_puzzle_solver_clues.py in full. _RINGS computes ring top/bottom
      but the asserts use them only for pairwise gaps (a uniform per-axis shift leaves every gap
      unchanged) and the pill aspect; digit clearance is asserted left/right only (lines 670-671),
      _LOOK reads no position at all. So the CSS comment's "centred on the number" (admin.css:490)
      and "the pill clears its digits by at least 0.5 px" (admin.css:502), and the docstring's
      "clears its digits by at least half a pixel on each side" (line 615), hold vertically only by
      the owner's eyeball. This is the F-001 defect class (ring crossing the digits) on the untested
      axis. Current code is correct (all renders show centred rings) - the gap is regression
      protection; fix is test-only.
    suggestion: |
      Add textTop/textBottom to _RINGS and assert, for every ring (or every circled ring) in
      test_two_digit_rings_clear_their_digits_on_a_30x30 at all three viewports, that the ring's
      vertical centre equals the digits' text-box centre within ~0.5 px (the range rect uses the
      font's content area, about 1.3em, which can exceed the ring's inner height, so assert centring,
      not containment). Re-run M7/M9: both must be killed.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
