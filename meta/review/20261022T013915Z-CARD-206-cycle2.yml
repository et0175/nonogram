findings:
  - id: F-201
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_export_interior_cover.py
    line: 1125
    title: 'the widened guard fails open on every page-position shape its vocabulary cannot reach, and the bound that is supposed to say so is unmeasured and partly false'
    attribution: 'INTRODUCED BY FIX 1 (91a51395). _page_position_sites, GEOMETRY_DOORS, POSITION_LITERALS and the class docstring''s "What this still cannot see" paragraph are all new in that commit; none of them exists at 3a3dfc8f.'
    description: |-
      The class docstring says :meth:`_page_position_sites` "enumerates **every page position in the
      module**, derived rather than listed", and TITLE_PAGE_COUNT's docstring now delegates its own
      claim to it ("That sentence is a claim, and this is the control it is held to"). The
      enumeration is a name-based fixed point seeded from the geometry door: a value handed to a
      door becomes a vocabulary NAME, and only bindings of a vocabulary name are read as sites. A
      position whose value never passes through a bare Name therefore never enters the vocabulary,
      and a binding shape the site walk does not handle is never read.

      MEASURED, on the real module's own text, with the real vocabulary present. I took
      book_pdf_generator.py as it stands, replaced the three-line derived first_answer_page
      assignment with nine different line-count-preserving shapes that each hide the literal 3, and
      ran the analyser on the result (in memory; no file on disk was mutated for this). Base
      reading: 6 names, 25 sites, 0 offenders.

        CAUGHT  V0  bare literal (the proven control)        -> 1 offender
        ESCAPED V1  list container + subscript               -> 0 offenders
        ESCAPED V2  dict container                           -> 0 offenders
        ESCAPED V3  tuple-unpack assignment                  -> 0 offenders
        ESCAPED V4  augmented assignment (+= 3)              -> 0 offenders
        ESCAPED V5  functools.partial onto the door          -> 0 offenders
        CAUGHT  V6  keyword-only call into the door          -> 1 offender
        ESCAPED V7  comprehension target into the door       -> 0 offenders
        ESCAPED V8  attribute assigned in this module        -> 0 offenders
        ESCAPED V9  starred call into the door               -> 0 offenders

      Eight of nine escape with the guard reporting 0 offenders. The causes are mechanical and each
      is a missing branch: ast.Assign with a Tuple target is skipped (the walk requires
      isinstance(target, ast.Name)), ast.AugAssign is not in the site walk at all, an
      ast.comprehension target is not in it either, and a value reached through a Subscript, a
      Starred, an Attribute or a partial never becomes a Name so never enters the vocabulary.

      AND THE DECLARED BOUND IS WRONG ABOUT ITS OWN COVER -- which is, verbatim, what cycle 1's
      F-102 was. The docstring's "What this still cannot see, **measured rather than assumed**"
      paragraph names three things: an attribute of a plan object, a position computed in another
      module, and a wrong position spelled 0 or 1. None of the eight shapes above is any of them.
      Worse, one of the three sentences is false as written: "where that attribute was *set* is a
      site in its own right, but only if it was set in this module" -- V8 measures the opposite.
      `self.page_number = 3 + len(section)` IS set in this module and is NOT a site, because the
      Assign walk only reads Name targets. (It happens to be true of the way this module actually
      sets such attributes today, through keyword construction, which the keyword loop does reach --
      but that is not what the sentence says.)

      AND the paragraph is headed "measured rather than assumed" while nothing measures it: there is
      no control for any of the three bounds, and no equality. The test asserts floors --
      `len(sites) >= 18` and `len(vocabulary) >= 4` against a real 25 and 6. The fix-round notes give
      the reason as "the count is a figure no control could fail on", which inverts what an equality
      is for: an equality against the sites that exist today is precisely a control that can fail,
      and it is what ADR-0039/R3 asks for by name.

      WHAT WOULD MAKE THIS RED, AND WHETHER THAT STATE EXISTS: nothing, and no. The module has zero
      offenders today -- I re-derived all 25 sites and every one is derived from the constants -- so
      there is NO live defect and this is not a correctness finding. Two things make it gating
      anyway. (1) It breaks two rules of this card's own kept System contract: ADR-0039/R2's
      "a shape it cannot analyse is a FAILURE, never a silent pass" (eight silent passes, measured),
      and ADR-0039/R3's equality and measured-bound clauses. (2) It is the SAME FAMILY as cycle 1's
      gating F-102, in the same place: a universal claim about page positions whose declared blind
      spot does not describe the mechanism's real blind spot. Cycle 1 refuted a declared bound by
      measurement; fix 1 replaced it with another declared bound that measurement refutes.

      What is genuinely better, and should not be lost in the fix: the mechanism now catches the
      shape F-102 actually found (C3_PLANTED_LITERAL kills exactly one assertion node, re-derived
      here), it has two controls that can fail (C4, C5, both certified), and hoisting the assignment
      made first_answer_page LIVE in the exported output, so the behavioural monkeypatch case can
      now see it too (C1, certified). The claim is what outran the mechanism, not the other way
      round.
    suggestion: |-
      Three routes, any one of which closes it; prefer the cheapest that makes the claim true.
      (a) NARROW THE CLAIM to what the analyser reaches -- "every page position bound to a name in
      this module", not "every page position in the module" -- and replace the three-sentence
      paragraph with the measured list above, each shape named, and at least one of them with a
      failing control (the V-series above are ready-made, and they run with no file on disk mutated:
      _page_position_sites takes a source string).
      (b) FAIL CLOSED, which is what ADR-0039/R2 actually asks: make an expression handed to a door
      that the analyser cannot resolve to a vocabulary binding a FAILURE unless it is a named
      exemption with its own control. `plan.page_number` at :5401 would be the first exemption.
      (c) Hold the set to an EQUALITY (6 names, 25 sites) rather than to floors, so the day a site
      appears or disappears the guard says so. "A figure no control could fail on" is not a reason
      against an equality; it is the thing an equality fixes.
      Whatever route is taken: delete or correct the "where that attribute was set is a site in its
      own right" sentence, which is false by measurement, and drop "measured rather than assumed"
      from a paragraph that measures nothing.
    confidence: high
    source: static
    violates: ADR-0039/R2
    also_violates: ADR-0039/R3
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-202
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_book_export_interior.py
    line: 1123
    title: 'F-101''s replacement equality is an algebraic identity of the test''s own model and survives a production parity failure'
    attribution: 'INTRODUCED BY FIX 1 (91a51395) -- it is the assertion that replaced F-101''s uncontrolled figure, tightened from a `> 4.0` floor.'
    description: |-
      The tightened assertion is

          separation_mm = PARITY_GUTTER_MM - PARITY_OUTSIDE_MM
          assert abs(abs(right_hand_mm - left_hand_mm) - separation_mm) < 1e-6

      and both right_hand_mm and left_hand_mm come from _expected_drawing_left_mm, the test module's
      own millimetre model, whose body is

          left_margin = gutter_mm if page_number % 2 else outside_mm
          return left_margin + max(spare, 0.0) / 2

      with `spare` independent of parity. The difference of the two readings is therefore
      gutter_mm - outside_mm identically, for any puzzle, any cell and any spare -- so the assertion
      is an algebraic identity of the model and holds for every input. "Asserted exactly, per case"
      is literally true and the per-case variation is illusory: the same identity 12 times.

      MEASURED, not reasoned. C6_PARITY_BLIND (production: book_page_spec._parity made to return ODD
      for every page, so parity stops moving the side margins at all) kills :1135 and :1140 -- the
      two arms that read the page's own ink -- and :1123 SURVIVES. C7_MODEL_DRIFT (an edit to the
      model itself) kills :1123 and nothing else. So the equality's domain is the model, while the
      docstring frames the quantity as a property of production geometry ("parity moves the usable
      area sideways by the whole gutter - outside ... so the two specs put the same drawing exactly
      that far apart").

      WHY THIS IS MINOR AND NOT A REPEAT OF F-101: the figure is now correct and reproduces (24/24
      readings, deviation 0.0), the assertion CAN fail (C7), and the parity claim against production
      is genuinely carried -- by :1135 and :1140, which C6 kills. Nothing is unmeasured; one
      assertion's domain is narrower than the sentence beside it suggests.
    suggestion: |-
      One line of prose, not a new mechanism: say in the docstring that the separation assertion
      pins the MODEL (and is what would red if _expected_drawing_left_mm or the two PARITY constants
      drifted), and that the production parity claim is carried by the two ink arms below it. If a
      production-side control for the separation is wanted, the cheap one already exists in the
      render evidence -- page 6 at 9.991 mm against page 7 at 19.981 mm on interior-widegutter.pdf.
      Do not add a sentence without the mutant that proves it, which is the rule fix 1 worked to.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-203
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_export_interior_cover.py
    line: 1242
    title: 'GEOMETRY_DOORS'' second member is inert: book_page_spec''s first argument is the book, not the position'
    attribution: 'INTRODUCED BY FIX 1 (91a51395) -- GEOMETRY_DOORS is new in that commit.'
    description: |-
      The seed loop reads a door call's FIRST positional argument:

          if called(call) in doors and call.args:
              feed(call.args[0], "door argument", called(call))

      but the signature is `book_page_spec(book: object, page_number: int = 1)` -- args[0] is the
      BOOK. So in this module the member contributes no position at all: its two call sites feed
      `None` (:3163) and `self.book` (:4043) into the site list as "door argument" sites, and the
      real position at :4043 (args[1]) is never seeded by the door.

      MEASURED by running the derivation with each member alone:

          doors=("page_spec", "book_page_spec")  -> 6 names, 25 sites
          doors=("page_spec",)                   -> 6 names, 23 sites
          doors=("book_page_spec",)              -> 0 names,  2 sites
          doors=()                               -> 0 names,  0 sites

      So book_page_spec adds two non-position sites and nothing else. The door-removal control
      asserts only that the EMPTY seed set yields nothing; it cannot distinguish a member that
      carries the whole set from one that carries none. ADR-0039/R1 asks for exactly that
      distinction per set member -- "caught WITH the set member present, missed WITHOUT it" -- and
      book_page_spec has no such control because there is nothing it catches.

      WHAT WOULD MAKE THIS RED: nothing. It costs no coverage today, because page_spec is the method
      every position in this module reaches. It matters if a later card routes a position straight to
      book_page_spec, which the docstring's own wording invites ("the one geometry door they must all
      reach ... page_spec/book_page_spec"): that position would be invisible, and the set would look
      as if it covered it.
    suggestion: |-
      Either seed the position slot per door (args[1] for book_page_spec, args[0] for page_spec,
      plus the page_number keyword, which the vocabulary already reaches by accident), or drop
      book_page_spec from the set and say in the comment that page_spec is the module's only door --
      which is what the class docstring already says in the singular. Whichever is chosen, give the
      member a control that can fail, per ADR-0039/R1.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-204
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_memory.py
    line: 3073
    title: 'four page-position expressions spell GUIDE_PAGE_COUNT as a bare literal 2 while the comment above them names the constant'
    attribution: >-
      PRE-EXISTING, not introduced by this card and not by fix 1. At the merge base 27ca88c7 these
      lines read `1 + 2 + plan.toc_page_count + len(plan.pages)`; the implementation commit 3a3dfc8f
      edited each one to insert TITLE_PAGE_COUNT and left the 2 as it found it. Noted because the
      card's own named defect is a page count spelled as a literal, and because the line now carries
      one named constant beside one unnamed one.
    description: |-
      tests/test_book_pdf_memory.py:3073, :3095, :3469 and :3480 all read

          1 + TITLE_PAGE_COUNT + 2 + plan.toc_page_count + len(plan.pages)

      while the comment immediately above the first of them writes the same formula as
      `1 + TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT + toc_page_count + ...`. The file already imports
      TITLE_PAGE_COUNT, so importing GUIDE_PAGE_COUNT beside it is free.

      This is outside the widened guard's reach by design -- it enumerates src/nonogram/admin/
      book_pdf_generator.py, not the test tree -- so no control sees it, and none is claimed to.
      It is filed as the one place in this card's own diff where the shape the card exists to
      remove still appears.

      WHAT WOULD MAKE THIS RED: nothing. The value is right at today's constants and the four tests
      pass; they would silently disagree with production the day CARD-201's guide changes length.
    suggestion: 'Import GUIDE_PAGE_COUNT into tests/test_book_pdf_memory.py and replace the four literal 2s with it, so the expression reads as the formula its own comment writes.'
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

family_regression:
  fires: true
  statement: >-
    UNAMBIGUOUSLY, YES. Cycle 1's two gating findings were (F-101) a figure whose control could not
    fail on what it claimed and (F-102) a universal claim about page positions whose declared blind
    spot did not describe the mechanism's real blind spot. Fix 1 closed both defects and then
    reproduced the second one in the mechanism it built to close it: F-201 is a new universal
    ("enumerates every page position in the module") with a new declared blind spot that does not
    describe the real one -- eight measured counterexamples in the module's own context, and one of
    the three declared bound sentences false by measurement. F-202 is a narrower echo of the first:
    the replacement figure is correct and controlled, but its control's domain is the test's own
    model rather than the production property the sentence beside it describes.
  what_fix_1_did_NOT_do: >-
    Said plainly, because it is evidence and not an absence of findings. Fix 1 introduced no
    correctness defect, no AC regression, no guardrail breach, no relaxed assertion and no new
    unreproducible figure. Its src change is one hoisted assignment that I re-derived as correct and
    that strictly STRENGTHENS the card (the value is now live in the exported output, so the
    behavioural case can see it, which cycle 1 had measured it could not). Its one deleted figure
    ("1186 px against 1191 px") was deleted rather than restated. Every figure it published
    reproduced here to the digit, including the ones nobody asked it to re-derive.
  escalation_opinion: >-
    NOT an escalation recommendation. The sibling card escalated after a fix round ADDED a sentence
    in each of two rounds; this round deleted two claims, deleted a figure, tightened an assertion
    and added exactly one mechanism -- with three controls, two of them certified here by mutant.
    The recurrence is in the one sentence that describes the new mechanism's reach, and it is a
    docstring edit plus (optionally) one equality to fix. Cycle 3 should be enough.

