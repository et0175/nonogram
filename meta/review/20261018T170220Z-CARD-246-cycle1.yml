  - id: F-011
    severity: minor
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 174
    claim: >
      Double-click safety on Approve is real but accidental: two clicks before the first
      response fire two POSTs (withdraw() runs only after the await), and both succeed only
      because CARD-245 deliberately does not consume a verification. Nothing on this page
      records that dependency, and no test covers a double Approve.
    evidence: >
      Read off the code against puzzle_review.save_edited_grid's docstring ("A verification is
      not consumed by a save"). Two in-flight approvals also mean the two responses race to
      write the message; with any future change that consumes the proof, the second would
      report "Nothing was stored" after the first stored it.
    suggested_fix: >
      Disable Approve/Save for the duration of their request (which also fixes F-001's root
      cause) and name the CARD-245 guarantee in a comment or a test.

