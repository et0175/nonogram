ac_coverage:
  AC-1: covered - list row (server) and detail-modal card (browser), both reaching the editor of that very puzzle; a third test pins that the link opens the right id.
  AC-2: covered - payload (server, incl. a 12-case seeded corpus where the row's width/height columns deliberately disagree with the grid) and drawn cells (browser). M1 killed.
  AC-3: covered for the happy path, with a real control (test_the_unchanged_assertion_can_fail fails for the right reason - the grid comparison, not the stamp). NOT covered where the board moves between Save and Approve (F-002, F-004).
  AC-4: covered - Cancel stores nothing, keeps the board, hides Approve, and the edit is then provably still usable (saved afterwards).
  AC-5: covered-in-name-only at the edges. The sequential refusal is well covered (words, no Approve, store unchanged, and the owner can go on). The reachable interleaving leaves a refusal beside a live Approve (F-001), a dropped connection produces an exception and silence rather than words (F-003), and the booked 409 produces words the owner cannot act on (F-005).
  AC-6: covered, and the rule is the one the AC demands. The refusal names the cells 1-based, sends no request, and rests on answerOfBoard returning grid:null (M5 killed by 4 tests). The narrowing is asserted separately and is provably not the guarantee (M10 reproduced). A crafted POST is closed by CARD-245's strict boolean gate, which CARD-245's own suite covers ([[1,0]] -> 422 on both routes).
  AC-7: covered in all three halves, independently - control absent on the list (M3 killed), control absent on the card (browser), GET refused (M2 killed), both POSTs refused (M9 killed, only that test).
guardrail_coverage:
  G-1: genuinely covered. One read of payload.mode; the player's path through all four branches is unchanged; the player's payload is still exactly six keys; 161 player tests green here; the hint `?.` is a no-op where the button exists. One of its two localStorage tests is vacuous (F-006), the claim survives via the other.
  G-2: covered in substance (the editor's page loads solver.js, puzzle_edit.js creates no element), but the glob is a literal guard rather than the completeness guard claimed (F-007).
  G-3: genuinely covered, by the stubbed grade (score 7 / fiendish shown, easy absent) and a stubbed 422. The file-text test beside it is weak (F-013) but not load-bearing.
  G-4: covered - role="status" aria-atomic always present and not display:none, buttons outside the region, accessible names contain the visible text (mutants on both the list link and the modal link died), whole flow driven from the keyboard including focus moves. No pageerror listener (F-003's evidence).
  G-5: covered - no http(s) in the template, no new dependency, baseline test named as the survivor.
  G-6: respected - no test file but the new one is touched; CARD-245's GET canary is intact and the page took its own URL.

