summary: >
  The architecture of this card is right and the parts the brief asked me to attack hold up.
  The mode flag really is read in exactly one place, the player's path through all four of its
  branches is byte-identical to before, 161 player tests are green, and three of my mutants on
  the flag's individual effects died for the right reasons. The AC-6 code-based argument that
  overruled the orchestrator is TRUE (COLOUR_ORDER is FILLED->EMPTY->UNKNOWN, so White twice on
  a filled cell yields a blank; a confirmed Clear blanks everything), the refusal does not
  depend on the narrowing (M10 reproduced exactly: all four brushes restored kills only the
  narrowing test), and no third state can reach the store by any path - answerOfBoard returns
  no grid, and a crafted POST meets CARD-245's strict boolean gate, which its own suite covers.
  AC-7's three refusals are independently pinned (three separate mutants, three separate
  deaths). G-3 is proved, not asserted. CARD-245's suite is untouched and the editor took its
  own URL rather than retiring the GET canary.
  What is weak is the two-phase flow's behaviour at its edges, and all of it is in this card's
  own 200-line script. I demonstrated three defects in a browser: a refusal message can be left
  standing beside a live Approve button (AC-5's explicit "offers no Approve"), a stroke made
  during the confirmation is silently left out of the store while the page announces "This grid
  is the stored puzzle now", and a dropped connection leaves the page stuck on "Checking this
  grid..." with an uncaught rejection and no word to the owner - with refusalText's
  "could not be reached" branch sitting there unreachable as evidence that case was meant to be
  handled. Two of my mutants survived, both on properties the card states as its headline
  claims: Approve re-reading the board passes all 49 tests, and deleting the withdraw() that is
  the whole mechanism behind "a refusal is never shown an Approve" passes all 49 too. One
  control is vacuous: the editor's "writes nothing into the player's save" test passes with the
  browser save switched fully back on, because serializeState independently refuses a non-blank
  start - the claim survives only through its end-to-end sibling.

findings:
  - id: F-001
    severity: important
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 164
    claim: >
      AC-5 is breached by a reachable interleaving: the page shows "This grid cannot be saved
      and nothing was stored" with the Approve button still on offer, and that Approve stores a
      grid. onSave withdraws a pending Approve only at the TOP of the call, and the refusal
      branch (code !== 200) returns without withdrawing - so when two verifies are in flight
      and the refusal lands last, the refusal text overwrites the grade while #puzzle-editor-
      decide stays visible and `verified` stays set.
    evidence: >
      Demonstrated in Chromium (temporary probe, since deleted). Puzzle seeded solid 10x10;
      verify_replacement_grid wrapped so the FIRST call sleeps 3s. Board set to
      two_cell_diagonal (2 solutions) -> Save (request 1, slow) -> board set to EDITED
      (uniquely solvable) -> Save (request 2, fast). Request 2 lands first: grade shown,
      Approve offered. Request 1 then lands 422 and the message becomes "This grid cannot be
      saved and nothing was stored. refusing to store a grid: the clue set has 2 or more
      solutions ... press Save again." while _approve_offered(page) is still True. Pressing it
      posts the EDITED grid - a grid the owner is at that moment being told cannot be saved.
      The same hole is unpinned: mutant M6 (delete `withdraw();` from the top of onSave) left
      49/49 green, because every tested refusal is reached with no Approve already on offer.
      Nothing disables Save while a request is in flight, so the owner needs only to click
      Save, paint, and click Save again on a board whose solve takes a second or more - which
      the project's own notes say mid-density 40x40 does.
    suggested_fix: >
      Give each Save a sequence number (or an AbortController) and ignore any response that is
      not the latest; disable Save while a verify is in flight; and call withdraw() on the
      refusal branch as well, not only at the top of onSave. Add a test that reaches a refusal
      WITH an Approve already on offer - that single test kills both this and M6.

  - id: F-002
    severity: important
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 182
    claim: >
      A stroke made while the confirmation is up is silently not stored, and the page then
      states the opposite. Approve correctly posts `verified` (the graded grid), but nothing
      compares it with the board the owner is now looking at, and the success message says
      "Saved. This grid is the stored puzzle now" - while the board on screen is a different
      grid, which the owner has every reason to believe they just saved.
    evidence: >
      Demonstrated in Chromium (probe, since deleted): open the editor, set the board to
      EDITED, Save, wait for the grade, then White-click cell (9,9) and press Approve. The
      store holds EDITED (the verified grid, correct per CARD-245) while the board shows
      EDITED-minus-(9,9); the message reads "Saved. This grid is the stored puzzle now, with
      the difficulty shown above. Go on editing and press Save again to change it further."
      The owner's last stroke is in no store and no warning, and the sentence that would have
      told them ("press Save again to change it further") reads as advice for FURTHER edits,
      not as "the stroke you just made was not included".
    suggested_fix: >
      Compare the board against `verified` when Approve is pressed (answerOfBoard(getBoard())
      deep-equal, or keep the verify response's grid_hash) and, when they differ, refuse with
      "the board changed since you pressed Save - press Save again" instead of committing; or
      make the success message name what was stored ("the grid you verified") rather than
      "this grid".

  - id: F-003
    severity: important
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 105
    claim: >
      A dropped connection is not handled at all: `fetch` is not wrapped, so a network failure
      rejects out of onSave/onApprove, the message stays on "Checking this grid..." forever and
      the owner is told nothing. refusalText's own fallback branch ("The panel could not be
      reached - try Save again.") can only be produced by an HTTP status that is not
      200/404/409/422, so it is unreachable dead code - the case it was written for is exactly
      the one that escapes.
    evidence: >
      Demonstrated in Chromium (probe, since deleted): page.route("**/edit/verify", abort) then
      Save. The message is 'Checking this grid...' two seconds later, the page emitted an
      uncaught 'Failed to fetch', and Save is still enabled. On Approve the same failure is
      worse: the request may or may not have committed and the page says neither. AC-5's
      standard is "stated in words the owner can act on, not an exception"; here it is an
      exception in the console and silence on screen. No test in the new file installs a
      pageerror listener, so an uncaught rejection on this page is invisible to the suite.
    suggested_fix: >
      try/catch around the await in post() (or in both handlers), returning {code: 0, body:
      null} so the existing fallback text is reached; assert it with a route.abort() test, and
      add a pageerror listener to the editor's browser fixtures.

  - id: F-004
    severity: important
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 176
    claim: >
      "Approve sends THIS value and never re-reads the board" is the card's central client-side
      property and no test pins it. Mutant M4 replaced `const grid = verified;` with
      `const grid = answerOfBoard(player.getBoard()).grid;` and all 49 tests passed.
    evidence: >
      M4 run on the whole file: 49 passed, 12.00s, exit 0. No test paints between Save and
      Approve, so the two implementations are indistinguishable to the suite. Blast radius
      today is bounded by CARD-245 (an unverified grid is a 409, so the mutant degrades to a
      refusal rather than storing an unseen grade) - but that makes this card's own guarantee
      a property of the OTHER card, asserted nowhere, and it is the same missing test as F-002.
    suggested_fix: >
      One test: Save, paint one cell, Approve; assert the store holds the verified grid and
      that no POST carried the painted grid (the request listener the file already uses in
      test_nothing_is_even_sent_for_a_board_that_is_not_an_answer).

  - id: F-005
    severity: important
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 94
    claim: >
      The two 409s are not told apart, and the booked one is given the not-verified one's
      advice. A puzzle that enters a book while the editor is open answers "Cannot edit a
      puzzle that is in a book", and the page wraps it in "Press Save to check this grid
      again." - an instruction that can never succeed, for an owner who has an edit on screen
      they cannot store.
    evidence: >
      Demonstrated in Chromium (probe, since deleted): open the editor, assign the puzzle to a
      book server-side, Save. Message: "Nothing was stored. Cannot edit a puzzle that is in a
      book. Press Save to check this grid again." The file's own comment at line 87 records
      the conflation ("409 a conflict (not verified, or a book holds the puzzle)"). CARD-245
      distinguishes them in `_edit_refusal` precisely so a caller can; this caller does not.
    suggested_fix: >
      Branch on the message (or ask CARD-245 for a machine-readable `reason`), and for the
      booked case say the puzzle is now in a book and this edit cannot be stored - and stop
      inviting a retry. Add it to the AC-7 class, which currently tests the booked POST only
      from the server side.

  - id: F-006
    severity: minor
    file: tests/test_puzzle_editor_ui.py
    line: 963
    claim: >
      test_the_editor_writes_nothing_into_the_players_save is vacuous: it passes with edit
      mode's NO_SAVE removed entirely. It cannot fail for the claim it is named after
      (ADR-0039/R1).
    evidence: >
      Mutant M2 (`const save = browserSave(saveKey(payload.id));`, i.e. the player's save
      restored in edit mode) run against that test alone: 1 passed, exit 0. The reason is
      solver_state.js serializeState line 830 - it returns null unless the history's first
      board is all-UNKNOWN, and an edit-mode history starts FILLED/EMPTY, so write(null) only
      ever calls forget(). The G-1 claim does survive, through
      test_a_solve_in_progress_survives_a_visit_to_the_editor, which M2 does kill (with the
      save on, the editor restores the player's save, opens on the player's half-solved board
      and then overwrites the entry on its first stroke). So the seam is covered - by the other
      test, not by this one.
    suggested_fix: >
      Make the vacuous test meaningful by seeding a localStorage entry for this puzzle before
      opening the editor and asserting it is byte-identical afterwards, or retire it with
      test_a_solve_in_progress_survives_a_visit_to_the_editor named as the survivor (G-6).

