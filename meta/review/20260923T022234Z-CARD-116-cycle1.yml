findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 468
    title: "Render failure now aborts the whole book export — untested, and the error names no puzzle"
    description: |
      The rewrite moved the try/except from around "build the payload AND render the
      two pages" to around "build the payload" alone. That part is right and needed
      (dropping before positions are handed out is what keeps later pages' parity
      correct). The consequence, however, is a user-visible change of failure
      semantics that no test pins and whose message lost the one fact that made it
      actionable.

      Reproduced in this worktree against a three-puzzle book (good, broken, good):
        * clues_rows = 5 (non-iterable)        -> _payload raises -> puzzle dropped,
          6 pages, remaining positions correct. This is the intended path, and it is
          the only failure class the first-pass drop actually catches.
        * grid = None                          -> render_pages raises TypeError
          ("'NoneType' object is not subscriptable") -> the whole export fails.
        * row clues present, column clues empty -> render_pages raises ValueError
          -> the whole export fails.
      Before this card, both of the latter were caught and the puzzle skipped, so the
      owner got a book minus one puzzle. Now the owner gets no book at all, and the
      route (app.py:3164-3166 / :3010-3012) flashes the raw exception text, which
      names no puzzle id — the old path at least printed it. On a 120-puzzle book,
      one bad row becomes an unexplainable "Error generating PDF: 'NoneType' object
      is not subscriptable".

      Neither branch has a test. The first-pass drop exists precisely to keep the
      page plan and the parities consistent when a puzzle disappears, and that
      property — the one this restructuring was for — is unverified.
    suggestion: |
      1. Name the puzzle when the render fails, so the flash is actionable:
         wrap the loop body of interior_pages (or _puzzle_and_answer's caller) and
         re-raise as
             raise RuntimeError(f"puzzle {puzzle_id} could not be drawn: {e}") from e
         carrying the id from the source dict (keep the id alongside the payload in
         the first pass).
      2. Add two tests to tests/test_book_pdf.py:
         - a payload-unbuildable puzzle between two good ones: assert the interior is
           the 6-page plan and that the surviving puzzle pages still sit at the left
           edges their own 1-based positions give them (i.e. the drop did not
           mis-parify page 3);
         - a render-unbuildable puzzle (grid=None): assert interior_pages raises and
           that the message names the puzzle id.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf.py
    line: 236
    title: "AC-177's \"at 300 DPI\" clause is not asserted — the test reads the raster, not the page box"
    description: |
      tests/helpers/pdf_pages.py returns each page's embedded image (pdf_pages ->
      Image.open of the DCT stream), so TestBookPdf_PageSizeEqualsStoredTrim asserts
      the raster is 1800x2700 px. It never reads the page's MediaBox, which is what a
      printer (and KDP) actually measures. A regression that changed _save_pdf's
      dpi=(300,300) would leave every test in this card green while producing a book
      of the wrong physical trim — the exact defect the card exists to fix.
      I measured it by hand during this review and the behaviour is correct today:
      the 6x9 interior's pages are MediaBox [0,0,432,648] pt = 6.0 x 9.0 in. So this
      is an evidence gap, not a defect.
    suggestion: |
      In TestBookPdf_PageSizeEqualsStoredTrim add one assertion over the page tree,
      e.g. via PIL.PdfParser: for every page, MediaBox == [0, 0, 432.0, 648.0] (and
      [0, 0, 612.0, 792.0] on the Book 1 profile in
      TestBookPdf_EmptyMarginsFallBackToBook1Profile). A small
      tests/helpers/pdf_pages.pdf_page_boxes() would serve both.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 511
    title: "The page-plan self-check cannot fire"
    description: |
      `if len(pages) != interior_page_count(len(answer_pages))` compares the list the
      function just built against the same arithmetic that built it: pages is
      1 + count + (1 + count if count else 0) and interior_page_count(count) is
      1 + count + (count + 1 if count else 0), with count == len(answer_pages) by
      construction. It reads as a guard against drift between the Finalise screen's
      plan and the emitted file, and guards nothing. (Pre-existing; the diff rewrote
      the surrounding code and docstring, so it is worth closing here.)
    suggestion: |
      Make it check the plan against the input rather than the output — e.g.
      interior_page_count(len(payloads)) — or drop the check and cover the
      screen-vs-file equality in the test that already exports through the route
      (CARD-129 owns the exact equality per the docstring).
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
