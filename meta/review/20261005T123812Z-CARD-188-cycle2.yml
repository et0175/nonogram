  - id: RC-1
    title: "The out-of-layout ring is sized from the cell and digits only, not bounded by the column's content box or pitch, and is centred on the span (half a rule-width off the column centre); only 1440 and 390 are tested, not the 14 px cell floor"
    finding_ids: [F-004, F-005]
findings:
  - id: F-004
    severity: high
    category: feature
    type: gap
    file: tests/test_puzzle_solver_clues.py
    line: 606
    title: "The 30x30 ring test claims the smallest desktop cell (about 17 px) but the floor is 14 px, where neighbouring two-digit rings touch"
    description: |
      The class docstring says the 30x30 at 1440 is "the smallest desktop cell, about 17 px", and the
      test asserts there that no two rings touch (the CSS comment admin.css:496-498 likewise ties
      "touches no other ring" to 17 px / 24 px cells). But the board clamps the cell at
      --player-cell-min: 14px (admin.css:384, used by the clamp at 399-402), and a 30x30 reaches it
      on ordinary desktop windows: probe at 1100x700 and 900x600 measured cell 14, ring 13.5 x 12.31,
      min ring gap 0.00 px with 4 touching pairs (e.g. adjacent "30" column rings at 335.55-349.05 and
      349.05-362.55), digit clearance 0.69 px, column rings lapping 0.75 px onto the vertical rules
      and row rings 0.16 px onto the horizontal rules. Cause: the ring is centred on the span, whose
      box excludes the th's right rule, so the column before a heavy rule and the heavy column sit
      13.5 px apart centre-to-centre while the ring is 13.5 px wide. A DPR-1 screenshot at 1100x700
      (scratchpad c188_1100_cols_x6.png) shows the fused pairs. The docstring makes the 17 px case
      read as the worst case and hides the untested floor (intent vs reality drift, fix-introduced).
    suggestion: |
      Add the 14 px floor to test_two_digit_rings_clear_their_digits_on_a_30x30 (e.g. a 1100x700
      viewport, assert cell == 14) and correct the docstring. Then make the ring fit it: centre the ring
      on the column rather than the span (offset left by half the th's right border), and/or cap
      --player-ring at the cell pitch less a small gap (min(..., cell - 2*ring width)) while keeping
      the 0.5 px digit clearance. Add a floor-size render for the owner (AC-10).
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-005
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/static/admin.css
    line: 505
    title: "Column pills lap onto the vertical column rules (0.5 px at 1440, 0.75 px at the floor); owner call"
    description: |
      The known limitation in the [Fix 1] notes, confirmed by measurement and visible in
      30x30-desktop-1440-board.png: next to a heavy rule the "30" and "22" pills both cross it and
      read as joined. Spec 8 does not forbid it and the CSS comment does not claim otherwise, so this
      is an owner-visible trade-off (keeping the ring inside the content box leaves about 0.45 px of
      digit clearance), not a contract break.
    suggestion: "Ask the owner at AC-10 whether lapping the rules is acceptable; if not, the F-004 re-centring/cap addresses both."
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
