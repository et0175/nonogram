    line: 15
    title: "An empty POST body falls back to stored values instead of the (empty) submission"
    description: |
      `{% set entered = submitted if submitted is defined and submitted else none %}`
      treats a falsy request.form as "nothing submitted", so a POST carrying no form
      fields at all re-renders storage — the pre-F-002 behaviour. Not browser-reachable
      (all four inputs are `required`, so a browser always submits all four keys), and
      in that case nothing the owner typed exists to lose, so the practical harm is nil.
      Noted because it is a latent condition inside the fix's own new line.
    suggestion: "Use `submitted is defined and submitted is not none` if the distinction is ever wanted; otherwise leave it and note why."
