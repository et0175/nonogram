  - id: F-101
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/book_create.html
    line: 49
    title: "The new refusal screen leaves the rejected field unmarked (FormField 'invalid' state missing)"
    description: |
      The F-002 fix added a refusal render path to book_create.html in edit mode, but
      renders no `is-invalid` class, no `aria-invalid="true"` and no `aria-describedby`
      on the field `_refuse_invalid_details` rejected. meta/design/components.md's
      FormField entry lists "invalid (danger border + hint)" as a required state, the
      card's own Design context names "FormField (reuse on general-info edit)", and the
      sibling step page already implements exactly this pattern
      (book_setup_print.html:104-106, 113-116, 140-144: `plan_error_fields` ->
      `is-invalid` + `aria-invalid="true"` + `aria-describedby="plan-error"`).

      The harm is visible in the cycle-2 evidence screenshot
      .forge-screens/CARD-130/cycle-2/step1-general-info-refused-desktop.png: the
      rejected title was three spaces, so the carried-back value renders as a visually
      empty, unmarked input, and the only cue is a page-level banner with no
      programmatic association to the control. A screen-reader user gets no link
      between the error and the input at all; the automated axe scan that would have
      caught this did not run (a11y.log: @axe-core/playwright not installed).
    suggestion: |
      Follow setup_print's pattern: have _refuse_invalid_details (or a thin wrapper in
      edit_book) name the offending field the way _PlanFormError names plan fields,
      pass `error_fields` to the template alongside `submitted`, and mark the input
      with `is-invalid` + `aria-invalid="true"` + `aria-describedby` pointing at the
      flash banner's id. No new component or CSS is needed — .form-control.is-invalid
      already exists.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

