findings:
  - id: F-001
    severity: high
    category: feature
    type: gap
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 49
    title: "The AC-7 asymmetry claim is falsified at four sites, including the card's own reason for not treating AC-7 as a guardrail conflict"
    description: |
      Fix cycle 2's F-002 guard (`if (inFlight === "approve") return;`,
      puzzle_edit.js:580) makes Back to edit a refusal in the approve window:
      a silent early return that neither spends the turn nor says anything.
      The guard itself is right and well pinned (MU-D kills, MU-H kills on the
      other side). What was not re-derived is every standing statement of the
      asymmetry it changed. Four sites, all grep-citable, all now false:

        1. src/nonogram/admin/static/puzzle_edit.js:48-53 (the header's
           "NEITHER EXIT CAN OUTRUN THE STORE" paragraph, the file's
           authoritative statement of AC-7): "Back to edit is not an exit from
           the page, so it has nothing to outrun and *nothing to refuse*;
           pressed mid-flight (which only a script can do, the pair being
           hidden) *it does what it always did, spending the turn and saying
           the edit is still there*." In the approve window it now does
           neither.
        2. src/nonogram/admin/static/puzzle_edit.js:434 (inFlightIs's
           comment): "Back to edit does NOT: *it is refused by nothing*."
        3. tests/test_puzzle_editor_ui.py:2882 (the AC-7 test class
           docstring, under the heading "The asymmetry, and why it is not a
           gap"): "it has nothing to outrun and *is refused by nothing*. ...
           its mid-flight behaviour is CARD-246's unchanged". It is CARD-246's
           unchanged only in the verify window now; the named pin
           (test_a_back_to_edit_taken_mid_flight_is_not_undone_by_the_answer)
           covers only that window, correctly.
        4. meta/kanban/cards/CARD-250.md:312-317 — the section the implementer
           headed "The one place AC-7 is read narrowly, flagged for the
           reviewer": "Back to edit is **not** refused ... **Not treated as a
           guardrail conflict**, because both halves of AC-7's *then* clause
           hold for both buttons."

      Site 4 is the load-bearing one: AC-7's then-clause is "the page does not
      navigate **and says so**". For Back to edit in the approve window half
      one holds and half two no longer does, so the premise that dismisses the
      guardrail question is no longer true. This is the same defect class as
      review cycle 1's F-001 on this same card — a criterion reading wider
      than the behaviour — which the orchestrator resolved by amending AC-5's
      text so the criterion read true. AC-7's record has not had that
      treatment.

      No behavioural defect is claimed: the path is owner-unreachable
      (#puzzle-editor-decide is `hidden`/display:none in both in-flight
      windows, so only a script reaches either button there), silence is the
      right choice (a press that cannot stop the store must not speak over the
      store's answer), and G-1's named test is green and untouched. The
      finding is that the written record of what AC-7 means is false at every
      place it is written, and fix cycle 2's own step-6b asserted the opposite
      ("DECLARATIONS F-002 — confirmed. The guard does not change what any
      declaration says"), which is why no site was updated.
    suggestion: |
      Documentation only — do not change the guard. Four edits plus one
      decision:
        * puzzle_edit.js:48-53 — say that Back to edit is refused in the
          approve window and only there, silently and by design, and why
          (it cannot stop the store, and the store's answer is the sentence
          the owner must read); keep "it is not an exit, so it has nothing to
          outrun".
        * puzzle_edit.js:434 — narrow "it is refused by nothing" to "it is
          never told it is busy: the one window in which it is refused is
          silent on purpose (see onBackToEdit)".
        * tests/test_puzzle_editor_ui.py:2882 — same narrowing, and say that
          the named pin covers the verify window, which is the only window in
          which CARD-246's behaviour still exists.
        * CARD-250.md:312-317 — replace "both halves of AC-7's then clause
          hold for both buttons" with what is true: for Back to edit the
          "says so" half holds in the verify window and is deliberately
          silent in the approve window, on a path no owner can reach.
        * Then the orchestrator's call, as with AC-5 in cycle 1: either amend
          AC-7's text so the criterion reads true, or record the deviation as
          a decision on the card. Either closes it; leaving the claim as it
          stands does not.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

