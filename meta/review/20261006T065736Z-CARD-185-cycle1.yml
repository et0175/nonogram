      no-op kind only for `done` (_corrupt 'no-op' inserts into save['done']). If the check
      regressed, a corrupted redo stack would be accepted and the trailing undo loop would pull one
      extra done stroke into the redo stack: a wrong restored history instead of a blank start.
    suggestion: |
