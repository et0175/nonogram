    title: "After a reset, the next change re-saves the whole pre-reset history"
    description: |
      The confirmed reset removes the key (solver.js:548), but the reset is a recorded stroke, so
      the next commit writes serializeState of the full history including the pre-reset strokes
      (redo of a reset also writes rather than removes). Reset, one mark, reload: Undo walks back
      through the reset and the 'cleared' marks return. This matches the card text ('the next
      recorded change writes the entry again') and in-page behaviour, but owner default (a) is
      phrased 'Reset clears it'. Owner should confirm.
    suggestion: |
      Confirm with the owner. If reset should cut the saved history, have serializeState save from
      the last reset stroke onward (or start a fresh history on confirmed reset). Otherwise record
      the behaviour in default (a).
