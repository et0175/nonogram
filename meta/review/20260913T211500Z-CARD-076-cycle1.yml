    title: "The guard-the-guard test writes its probe module into the repo's tests/ directory"
    description: |
      test_the_rule_catches_a_module_that_started_classifying writes
      tests/__tier_guard_probe__.py and removes it in a finally block. The very next
      test, test_the_rule_leaves_the_legitimate_shapes_alone, takes tmp_path and writes
      there instead — so the fixture was available and not used.
      An interrupt between write and unlink (Ctrl-C, a killed worker, a crash) leaves a
      module in the directory pytest collects from, where the next run picks it up as a
      test file.
    suggestion: |
      Use tmp_path, exactly as the sibling test does. The walk takes an explicit path
      argument, so nothing requires the probe to live under tests/.
