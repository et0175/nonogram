    title: "Architectural card ships a materially changed failure boundary with no declared failure matrix"
    description: |
      CARD-076 is Complexity: architectural, and its section list runs Why / What to
      implement / Acceptance criteria / Engineering constraints / Guardrails / System
      contract / Architecture context / Worktree notes — there is no `## Failure matrix`.
      On an architectural card that declaration is owed, and here it is not a formality:
      this card changed what a user sees when POL-004 cannot be satisfied, and nothing
      in the contract says so.

      Measured, same seeds on both trees, 10 requests per cell:
        --difficulty easy, 15x15 d45:  9/10 succeed -> 0/10
        --difficulty easy, 20x20 d50: 10/10 succeed -> 4/10
        --difficulty hard, 15x15 d45:  0/10 -> 9/10
        --difficulty hard, 20x20 d50:  0/10 -> 10/10

      The grading is correct — those puzzles genuinely need probe contradiction, and
      calling them Easy was ADR-0013's error — so this is not a code defect. But
      "a tier request that used to always succeed now always abandons" is exactly the
      failure semantics an architectural card's matrix exists to state before the fact.
      The card's Rollback line covers reverting the branch; nothing covers the live
      behaviour.
    suggestion: |
      Add a short `## Failure matrix` to the card (retroactively is fine) naming the one
      failure-bearing boundary this card moves: POL-004 exhausting its shared 20-attempt
      budget when the requested tier is not reachable at the requested extent/density,
      surfacing as GenerationAbandoned. State that no bound changed and no new failure
      mode was introduced — only which requests reach the existing one.
    confidence: high
