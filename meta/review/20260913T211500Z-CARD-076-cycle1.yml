  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 143
    title: "Four admin tier consumers were left out of the fourth-member sweep, and count by display label"
    description: |
      The card's objective 4 is "every Tier consumer handles the fourth member
      (ADR-0025 Negative)", and it enumerates CLI, web form, exports, PDF filename,
      admin badge and image_to_puzzle. Four consumers are missing from that list and
      from the diff, all of them counting or filtering puzzles by tier:

        src/nonogram/admin/book_pdf_generator.py:143-145  easy/medium/hard counts
        src/nonogram/admin/app.py:1013-1015               the same three counts for a book
        src/nonogram/admin/templates/puzzles_list.html:66-69  the difficulty filter options
        src/nonogram/admin/app.py:617, 832, 1234          the filter's request arg

      Two problems compound. (a) All of them compare against the display labels
      "Easy"/"Medium"/"Hard", while a row written through the generation pipeline stores
      the enum *value* — app.py:473 persists `puzzle.difficulty_tier`, a StrEnum whose
      value is lowercase. This is pre-existing: it is the identical mismatch the card
      DID fix in the badge (puzzles_list.html:163, now `|lower`), and the same reasoning
      applies one file over. (b) None of them has a fourth branch, so once (a) is fixed —
      by this card's own badge precedent, or by CARD-077's re-grade — a book's difficulty
      summary counts Guess puzzles as none of the three and silently under-reports.

      The user's stated workflow is assembling printed books from these summaries, so a
      count that omits a whole tier is a mislabelling risk, not a cosmetic one. The badge
      fix in this diff establishes both that the mismatch is real and that fixing it is
      in this card's scope.
    suggestion: |
      Apply the badge's own fix to the other four sites: compare case-insensitively
      against Tier values, and give Guess its own branch in the two count blocks. If
      that is judged too wide for this card, file it as a card of its own and say so in
      CARD-076's notes — but do not leave one consumer fixed and four not, which is the
      state most likely to read as "handled".
    confidence: high
    source: static
