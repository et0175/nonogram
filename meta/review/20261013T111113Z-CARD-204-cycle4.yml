findings:
  - id: F-9
    severity: high
    category: compliance
    type: gap
    file: meta/architecture/requirements.yml
    line: 2983
    title: "FR-040's iff clause and EC-027's 'never left alone' property are now false, and the EC's own oracle was updated to match the code rather than the drift declared"
    description: |
      VERIFIED, not inferred. FR-040's statement (requirements.yml:2983-3002) is
      bidirectional — "Two puzzles share one book page when, AND ONLY WHEN, their
      tiers are equal, they are next to each other in the book order, and both fit
      at one shared cell of at least 7.0 mm. The shared cell is THE LARGEST CELL,
      capped at the 7.5 mm standard cell, at which (a) ... (b) ..." — and EC-027
      (requirements.yml:3087) states the walk property directly: "a puzzle that
      could pair with its successor under that rule is NEVER LEFT ALONE by the
      in-order walk ... for every order, not only the measured examples."

      Fix 4 falsifies both clauses:

      * REFUSAL. On my own 900-case seeded sweep of random pair geometries on
        Book 1 (independent seed and generator from the fix agent's), of 193 pairs
        that pair unreserved, 10 (5.2%) are refused with the fixed reserve — the
        fix agent measured 9/176 (5%), so the figure reproduces. This is not a
        unit-function artefact: the suite itself pins a production counterexample.
        `tests/property/test_book_pairing.py`'s `_tight_pair` (two 25x6 puzzles,
        row- and column-clue depth 2, Book 1 trim) fits at a shared cell of
        7.1731 mm — adjacent, same tier, above the 7.0 mm floor, i.e. exactly the
        pair EC-027 says must never be left alone — and
        `test_PropertyTest_BookPairing_ReserveIsTheBookSOwnScaleNotAPageNumber`
        asserts `tight_early_target.pair is None` through `generator.puzzle_pages`
        in all three regimes.
      * SMALLER-THAN-LARGEST CELL. 18/193 (9%) of pairs commit a cell below
        FR-040's "largest cell" formula. Demonstrated mechanically: reverting
        EC-027's own oracle to the unreserved formula (mutant M5b, dropping
        `reserve=True` from `Sheet.shared_cell_mm`'s three call sites) makes
        `test_PropertyTest_BookPairing_InOrderSameTierFittingNeighboursOnly` fail
        on cell_mm 7.38124 vs FR-040's 7.3859 — i.e. the oracle was changed to
        encode Fix 4's rule, and that change is load-bearing for the test's green.

      None of this is a code defect: the owner's 2026-10-12 decision explicitly
      authorises a verdict that depends on "the pair's own geometry plus one
      fixed, compile-time constant," and that is exactly what ships. The defect is
      that the change is recorded nowhere a future reader or the model itself
      would find it:

      1. FR-040's statement, AC-242..AC-249 and EC-027 are unamended, and no
         architect-station deferral is recorded — unlike this same card's F-4,
         which declared the FR-032 text gap the correct way, and unlike cycle 2's
         F-5 remedy (b), which named exactly this amendment as the alternative to
         decoupling. This is the same failure shape as cycle-3's F-7 (a covering
         test adjusted so the suite agrees with the code), one layer up: an EC
         instead of a card AC.
      2. The card's own guardrail G-5 ("this card repositions a pair's slots, it
         does not change which puzzles pair") is still written as true.
      3. `compute_pair_layout`'s docstring (src/nonogram/export/layout.py:1918-1965)
         describes the cost as "paying a smaller cell is therefore the exception
         ... and only ever as much smaller as the reserve actually needs" and says
         a refusal happens "exactly as the unreserved path already would be" — it
         never states that the reserve can refuse a pair the unreserved path would
         have accepted. A reader of the function cannot learn the 5% cost from it.
      4. The owner-visible consequence of the 5% — fewer two-up pages means a
         LONGER interior for the same puzzle set, i.e. more pages and a higher KDP
         print cost, on a product whose own market snapshot tracks page counts —
         is stated nowhere at all, in any layer.

      Severity: Important, not Critical. The mechanism is correct and
      owner-authorised and must not be touched. What is missing is declarative.
    suggestion: |
      Documentation and declaration only — NO code change, and no need to re-run
      the full suite:
      1. On CARD-204: amend G-5 to say what is now true (pairing eligibility gains
         one fixed compile-time term by the owner's 2026-10-12 decision; ~5% of
         otherwise-pairing pairs are refused and ~9% commit a slightly smaller
         cell), and add a [Not in this card] architect-station deferral for the
         FR-040 statement + EC-027 text in exactly the shape F-4 used for FR-032.
      2. In `compute_pair_layout`'s docstring, replace "exactly as the unreserved
         path already would be" with the measured truth: the reserve can refuse a
         pair the unreserved fit would have accepted (measured ~5% on an
         adversarial sweep, ~0% on real book puzzles, which mostly pair at the
         7.5 mm cap), and name the consequence (a slightly longer interior).
      3. Optionally surface the page-count/print-cost consequence to the owner
         once, so the tradeoff they signed is the one they see.
    confidence: high
    source: model
    violates: "EC-027"
    root_cause: RC-1
    status: open
