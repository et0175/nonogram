family_verdict:
  question: "Does Fix 4 escape the F-1 / F-5 / F-7 family, or is it its fourth instance?"
  answer: "It escapes the coupling half (F-1, F-5) decisively, and satisfies F-7's substantive complaint. It reproduces, in a milder form, F-7's secondary complaint about the record — see F-9."
  why_the_constant_is_categorically_different: |
    F-1 and F-5 were not about the reserve's SIZE; they were about its PROVENANCE.
    In both, the reserve was a measurement taken off the artefact being laid out —
    this page's own number (F-1), this book's own worst-case page number (F-5) — so
    `compute_pair_layout` stopped being a function of the pair and became a function
    of the pair AND its surroundings. Two consequences followed, and both are the
    actual defect: the same pair got different verdicts in different places, and the
    pairing decision became circular (pairing determines the page count, the page
    count determined the reserve, the reserve determined pairing), so inserting one
    puzzle early in a book could silently re-pair pages hundreds of pages later.
    A compile-time constant has neither property. `_folio_reserve_px` takes only
    `dpi`; `self.dpi = DPI` unconditionally; there is one production call site; and
    no page-, book- or payload-derived quantity can reach `folio_reserve_px` or
    `outer_reserve_px` through any parameter, default, kwarg or closure. The
    function is a pure function of (two clue sets, PageSpec, constants) again —
    which is exactly the status `TWO_UP_MIN_CELL_MM` already has inside the same
    invariant. I verified this three ways beyond reading: 0 verdict and 0 cell
    disagreements between parities over 900 random pairs; identical verdict, cell
    and 108 px gap for the same pair at interior pages 3 and 303 of differently
    sized books (the suite's own test, re-run); and the exact gap holding over 1800
    adversarial symmetric pairs. The re-fit cannot reintroduce it either: it is
    gated on `natural_spare < folio_reserve_px`, both operands derived from the
    pair's geometry and the constant, and I proved the headroom guarantee is
    algebraically tight (if `natural_spare < R` then the cap and the height fit both
    exceed `(W-R)/across`, so the re-fit is width-bound and `spare == R` exactly;
    confirmed with exact Fraction arithmetic, and the px->mm round trip is exact —
    `9.525 + 9.144` reprs as `18.669`).
    What a constant DOES share with a book-scale measurement is that it participates
    in the verdict at all, and so can refuse a pair. The owner's decision accepts
    that explicitly. The difference is that the refusal is now a property of the
    pair alone — identical in every book, on every page, forever — which is a
    knowable, testable rule, where F-1/F-5's was not.
