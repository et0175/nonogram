    learned_pattern: null

  - id: F-10
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 482
    title: "FOLIO_RESERVE_DIGITS' 4-digit ceiling sits exactly on _draw_folio's `<=` boundary and is asserted only in prose — no test exercises a 4- or 5-digit folio on a two-up page"
    description: |
      Measured, and the agent's claim is exact: every decimal digit of the packaged
      face advances 27.0 px at FOLIO_PT/300 DPI, `getlength("9999") == 108.0`, the
      widest 4-digit string is 108.0, and `_folio_reserve_px(300) == 108`. So
      `_draw_folio`'s clearance test `content_right <= right - text_width`
      (book_pdf_generator.py:1437) is satisfied at four digits with exactly ZERO
      slack, and at five digits (`getlength("10000") == 135.0`) it fails and the
      folio is omitted — which is the pre-existing omit-rather-than-collide path,
      so the agent's "degrades gracefully" claim is true and the cliff is declared
      in FOLIO_RESERVE_DIGITS' own comment. Two gaps remain:
      * No test exercises a 4-digit or 5-digit page number on a two-up page.
        `test_the_fixed_reserve_is_identical_across_book_scales` only asserts
        `len(str(page_number)) >= 3`, and the corpus-wide AC-1 test runs on the
        13-page baseline book (1-digit folios). The exact-equality boundary the
        whole ceiling rests on is therefore unverified: any change in the packaged
        face's digit advance or in kerning silently moves the 4-digit case from
        "draws" to "omitted" with no failing test (the fixture's
        `font_fingerprint` guards rendered pages, not this boundary).
      * The gap itself is exact by construction and I confirmed it: for integer
        `reserved`, `drawing_right_exact == usable_right_exact - reserved`, and
        `_round_px` of two values differing by an integer differs by that integer,
        so the measured gap is 108 px with no rounding slack in either parity
        (1800 adversarial cases, 0 deviations). So the boundary is sound today —
        it is only untested.
      Practically unreachable (no CON-018 trim is bound near 1000 pages), which is
      why this is Minor rather than Important.
    suggestion: |
      One cheap test in tests/test_book_page_numbers.py: assert `_draw_folio` draws
      for a synthetic page number 9999 on a two-up page with the fixed reserve, and
      omits for 10000 — pinning both the declared ceiling and the declared
      degradation in two lines, so a font change fails loudly instead of silently
      dropping folios.
    confidence: high
    source: static
