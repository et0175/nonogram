    title: "Surviving mutant: both comparison classes stay green with the reserve removed from their reference geometry — they are translation-blind, so the Fix-4 helper change was hygiene, not coverage"
    description: |
      MUTATION RESULT (M4, the only survivor of five). Removing all three
      `folio_reserve_px=_folio_reserve_px(generator.dpi)` arguments that Fix 4 added
      to `TestBookPdfMemory_EveryPageAfterTheGuideIsByteIdenticalShiftedByOne::_reference`
      (:1838), `TestBookPdfMemory_ContentAboveTheFooterBandIsUnchanged::_reference`
      (:2029) and `::_qr_boxes` (:2067) leaves both classes green (10 passed).

      This confirms the fix agent's story that the suite was green with a wrong
      reference — but the mechanism is not a "tolerance": it is the per-slot
      `_ink_bbox_crop` normalisation, which cancels any pure translation of a slot
      BY DESIGN (the class's own docstring explains at length why it must, since
      the flush edge mirrors with parity). So these two classes never could see a
      108 px lower-slot shift, and the stale `_qr_boxes` mask — a white rectangle
      at a position 108 px from the real icon — does not break them either.
      The absolute lower-slot position IS pinned, by three other modules
      (`test_book_two_up.py`'s new property test, `test_book_export_interior.py`'s
      `_expected_drawing_left_mm`, `test_book_puzzle_frame.py`'s
      `_expected_pair_boxes`), so this is not a coverage hole in the behaviour —
      it is a class whose comparison is weaker than its name suggests, and whose
      docstrings do not say so.
    suggestion: |
      Add one sentence to both classes' docstrings: the comparison is deliberately
      translation-invariant per slot and therefore does NOT pin either slot's
      absolute x — that is <name the three modules that do>. Optionally assert the
      reference's own lower-slot `drawing_right` equals production's once, so the
      helper's correctness is checked rather than merely intended.
