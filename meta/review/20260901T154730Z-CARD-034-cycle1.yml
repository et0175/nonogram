findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: bug
    file: tests/property/test_layout_cell_size.py
    line: 340
    title: "The EC-010 property test's docstring states the wrong witness count (116/108); measured 129/121"
    description: |
      test_the_sheet_turns_landscape_exactly_when_the_grid_is_wider_than_tall's
      docstring says an implementation that turned the page on the drawing's
      shape "agrees with EC-010 almost everywhere and splits from it on **116**
      of these 1764 cases — 108 wide grids that draw tall behind a deep column
      gutter, 8 tall grids that draw wide behind a deep row gutter."

      Re-measured by replaying the test's own loop (same SEED, same pattern
      order, same `(width > height) != (geometry.width > geometry.height)`
      predicate): the count is **129 = 121 wide + 8 tall**. The 8 is right; the
      total and the wide half are not. The same figure is reached by all three
      plausible readings of "the drawing" — Layout.width/height (129), the
      drawing minus margins (129), and the totals `_fit_cell` receives (129) —
      so this is not an ambiguity in what was measured.

      The same 116 is mirrored in CARD-034's Worktree notes ("plus a floor of
      100 on the cases where grid shape and drawing shape disagree (there are
      116)").

      This is the only re-measured figure in the card's footprint that does not
      reproduce. Every other one does, exactly: band reservation moves 441 of
      1764 cases by at most 0.5080 mm with per-pattern counts 72/151/11/207;
      crossover 1.403x portrait and 0.637x landscape; printable 186/261 mm
      portrait and 273/174 mm landscape; smallest corpus cell 46 px / 3.895 mm
      at 30x29 checkerboard with a 45x44 drawing; floor thresholds 92/129
      portrait and 135/86 landscape; 234 failures (151 checkerboard + 72 random
      + 11 sparse, first at 10x25 checkerboard) with the band reservation
      removed over the three pre-existing patterns; 840 wide cases with 444 up
      and 117 down, best +2.12 mm at 25x10 checkerboard (4.83 -> 6.94), worst
      26x25 alternating 6.86 -> 4.57 with a 27x38 drawing.

      The assertion itself (`grid_and_drawing_disagree >= 100`) is unaffected
      and still holds with margin. The defect is the stated fact, which in this
      codebase is held to be true.
    suggestion: |
      Change 116 -> 129 and 108 -> 121 in the docstring at
      tests/property/test_layout_cell_size.py:340, and the "(there are 116)" in
      CARD-034.md's Worktree notes -> 129. Consider raising the floor from 100
      to something closer to the measured value (e.g. 110) now that the true
      count is known, so the corpus cannot lose a fifth of the witness set
      unnoticed.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_export_image.py
    line: 186
    title: "_assert_fits_printable_area's docstring claims it fails on a wrongly-turned page; it does not for the always-portrait direction"
    description: |
      The helper's docstring says the printable area is derived from the grid
      "so that a page turned the wrong way is measured against the sheet it
      should have been printed on and fails."

      The first half is true and was verified (it reads geometry.columns/rows,
      never geometry.orientation — so it is genuinely independent of the value
      under test, which is what G-5's sibling requirement asks for). The
      "and fails" half is false in the direction that matters most. Probed by
      monkeypatching layout._orientation_for to always return "portrait" and
      calling the helper on the card's own AC grids:

          40x20  -> helper PASSED on a wrongly-portrait page
          45x25  -> helper PASSED
          30x10  -> helper PASSED

      The reason is structural: a page fitted to the portrait sheet is smaller
      than one fitted to landscape, and a smaller drawing trivially fits the
      landscape bound it is then measured against. Only the reverse error (a
      tall grid wrongly turned landscape, whose width can reach 273 mm against
      portrait's 186 mm) is caught.

      The property test's own `_assert_the_page_fits_a4` DOES catch
      always-portrait — verified by mutation, see the note below — but it does
      so through the wide-grids-that-draw-tall witnesses (F-001's set), not
      through the ordinary wide shapes this helper is applied to.
    suggestion: |
      Either narrow the claim ("...measured against the sheet it was owed —
      which catches a tall grid wrongly turned landscape; the reverse error
      produces an under-sized page that any sheet holds, and is caught by the
      explicit orientation assertions above"), or add an equality-shaped check
      that the drawing actually uses the sheet it was owed rather than merely
      fitting inside it.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_export_pdf.py
    line: 73
    title: "_a4_bounds_pt's landscape branch is never exercised — no PDF test uses a wide grid"
    description: |
      `_a4_bounds_pt` was added to make the PDF suite's A4 bounds
      orientation-aware, but every grid the two A4-bound PDF tests use is
      square or tall: ANSWER (test_both_written_pages_carry_the_layouts_geometry_within_a4)
      and the parametrized 10x10, 30x30, 10x25, 10x26
      (test_a_titled_page_still_fits_a4_at_the_cell_sizes_nfr_005_produces).
      So `geometry.columns > geometry.rows` is never true and the landscape
      return is dead in this suite.

      Confirmed by mutation: all three orientation mutants (always-portrait,
      squares-landscape, orientation-from-the-drawing) were killed, but none of
      them killed a single test in tests/test_export_pdf.py.

      This matters more than it would have before the card: the PDF is the only
      format that actually draws the header band, and on a landscape sheet the
      printable height falls from 261 mm to 174 mm, which is why the band
      reservation's bite trebled from 172 to 441 corpus cases. NFR-006's effect
      on the format with the least headroom is uncovered in that format's own
      suite. (The geometry itself IS covered end-to-end by the property test's
      `_assert_the_page_fits_a4` across all 441 extents including landscape,
      and the PDF page box is derived from the rendered image size at
      `resolution=DPI` rather than from a hard-coded MediaBox, so the residual
      risk is low — hence Minor, not Important.)
    suggestion: |
      Add one wide case to the parametrize list of
      test_a_titled_page_still_fits_a4_at_the_cell_sizes_nfr_005_produces —
      e.g. `pytest.param(26, 25, _alternating_rows, id="wide-grid-draws-tall")`,
      which is the worst landscape loser in the corpus (6.86 -> 4.57 mm, a
      27x38 drawing) and therefore the case where a titled landscape page has
      the least room.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_export_image.py
    line: 680
    title: "AC-104's printable-area check runs on a leaked loop variable, so it only checks the portrait layout"
    description: |
      test_the_same_larger_dimension_does_not_guarantee_the_same_cell_size ends:

          for geometry in (turned, upright):
              assert _cell_mm(geometry) <= layout_module.comfort_cap_mm(40)
          _assert_fits_printable_area(geometry)

      The trailing call uses the loop variable left bound after the loop, i.e.
