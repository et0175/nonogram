  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_layout_cell_size.py
    line: 295
    title: "'Everything else in this file reads the literals' is not true of layout.DPI, which is read by the EC-010 oracle and pinned nowhere"
    description: |
      `test_the_module_encodes_the_chosen_values_and_nothing_else`'s docstring
      says: "The one place the literals above and the module's constants are
      tied together. Everything else in this file reads the literals." The
      module docstring makes the same claim ("the module's constants are pinned
      against these literals once, in the first test, and everything else is
      built from the literals").

      Verified true for every NFR-005 decided value — CELL_COMFORT_MM,
      MAX_CELL_MM, MIN_CELL_MM/FLOOR_MM, PAGE_WIDTH_MM/PAGE_HEIGHT_MM against
      A4_SHORT/LONG_EDGE_MM, PAGE_MARGIN_MM, HEADER_BAND_MM are all pinned in
      that one test, so the focus question ("do the literals silently drift the
      day a constant changes?") answers *no* for all of them. One exception:
      `layout.DPI` is read directly at lines 109, 130, 228, 229, 230, 236, 237,
      259, 261 and 262 — including inside `_independent_cell_px`, the oracle
      EC-010 is checked against — and a grep over tests/ finds no test pinning
      DPI to 300 anywhere in the tree.

      Consequence, small but real: the oracle takes its resolution from the
      module it is supposed to be a second opinion on. A change to DPI moves
      the oracle and the implementation together, and no test in this file (or
      any other) would notice. Both EC-008's ceiling and EC-010's comparison
      happen to be robust to a uniform DPI change, so this is a claim defect
      rather than a coverage hole with teeth — but the claim is absolute and
      the exception is in the newly-added oracle.
    suggestion: |
      Either add `DPI = 300` to the literal block and `assert layout.DPI == DPI`
      to the tie-down test (one line, and it makes the sentence true), or narrow
      the sentence to what holds: "…the module's decided *geometry* constants
      are tied to the literals here; DPI is read from the module, since it is a
      unit conversion rather than one of NFR-005's decided values."
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

