findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: docs/GENERATION_ALGORITHM.md
    line: 470
    title: "Hard's yield collapse (20.3% -> 7.0% in the batch density band) is measured but its consequence for --difficulty hard and the book's Hard quota is not stated"
    description: |
      The card's own measured table, now in §7 of the doc and in
      tests/property/test_difficulty_calibration.py's docstring, records the tier split
      moving 64.1/15.6/20.3 -> 64.1/28.9/7.0 on a 315-puzzle corpus drawn at the
      density `orchestrator.generate_batch` hardcodes. Medium's side of that move is
      documented everywhere. Hard's is not: Hard's per-candidate yield in the band the
      book generator actually uses fell by ~3x, which is the number POL-004's resample
      loop races against MAX_RETRY_ATTEMPTS = 30, and which the book's default 30/45/25
      plan (FR-034, gated by ADR-0035/R1 / INV-007) has to fill 25% of.
      §8.3's only acknowledgement is the appended clause "the non-Easy remainder is now
      mostly Medium rather than mostly Hard", which states the direction and not the
      magnitude, and §8's `--difficulty` paragraph was rewritten for Medium only
      ("A request for Medium at an unlucky extent/density still resamples") while
      leaving the Hard side silent.
      Not a challenge to 90.0 — the owner chose to make Hard mean "a lot", and Hard
      becoming rarer is the content of that decision. The gap is that the doc the card
      updated does not say the whole true thing about it, so the next person to watch a
      `--difficulty hard` request abandon, or a book stall short of its Hard cell, has
      no pointer from here.
    suggestion: |
      Add one measured sentence to §7 (beside the new distribution table) and to §8.3:
      Hard's per-candidate yield at the batch density falls from ~20% to ~7%, so a
      `--difficulty hard` request at density 50 now leans on POL-004's 30-attempt budget
      where it previously did not, and §8.3's existing practical rule ("generate Hard at
      45") becomes load-bearing rather than advisory. scripts/measure_difficulty_cutoff.py
      already prints the per-density and per-bucket tables that support the figure — cite
      its run rather than deriving a new one.
    confidence: high
    source: static
