adversarial_notes:
  - >-
    [Adversarial] dropped false positive: "visit_Assert never calls generic_visit, so a nested
    assert is missed" — an Assert statement's children are expressions, so an Assert cannot
    contain an Assert; and run_one's `assert instr_lines == linenos` against an independent
    ast.walk enumeration would catch any miss. Recomputed: 130 == 130.
  - >-
    [Adversarial] dropped false positive: "the instrument writes the test file through
    ast.unparse, so the tests that read the tree's own text measure the unparsed text instead of
    the committed text" — checked each reader: test_the_guard_cannot_turn_a_refusal_into_a_skip
    reads tests/full_suite_lock.py, which is never instrumented; _scan uses git grep over the
    working tree and tests/test_full_suite_lock.py is in OVERRIDE_NAMERS either way; the
    conftest arms read tests/conftest.py, which is written verbatim. No measurement is distorted.
  - >-
    [Adversarial] dropped false positive: "-o addopts= drops pythonpath = [\"src\"], so the
    instrument's runs import a different nonogram" — addopts and pythonpath are separate ini
    keys and only addopts is overridden; and the 41-test selection imports tests.full_suite_lock,
    not src/nonogram. The baseline is 41 passed in both the instrument's run and mine.
  - >-
    [Adversarial] dropped false positive: "the tab-split in _tracked_index is an uncontrolled
    mechanism — nothing reds if it becomes split()[3]" — true but equivalent in today's tree: 0
    tracked paths under either prefix contain a space, so the two spellings cannot be told apart.
    The docstring states it as the reason for the choice, not as something a test catches, so the
    two-mutant rule does not bite. Noted as an equivalent mutant, not filed.
  - >-
    [Adversarial] dropped false positive: "assert_lock_absent() runs after the mutated files are
    written, so the instrument does not 'refuse to start' in the order its docstring claims" —
    it does refuse before any pytest runs, and SystemExit passes through the finally block that
    restores all three files. The ordering in the docstring is loose; the behaviour is safe.
  - >-
    [Adversarial] dropped false positive: "the fix added an exemption while widening the shape
    claim" — refuted against the diff rather than the prose: no +/- line touches any of the
