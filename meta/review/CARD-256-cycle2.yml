  - id: F-007
    severity: high
    category: ops
    type: gap
    file: meta/kanban/cards/CARD-256.md
    line: 470
    title: "the 84-of-130 bound is an instrumented-domain figure stated as a property of the mutant set; the recording wrapper hides every real-process kill, and the matrix under-attributes them"
    description: |
      The fix introduces, as its headline new bound: "A bound the card never stated: 84 of 130
      assertions are killed by no mutant in this set. Overwhelmingly CARD-255's pure-function
      arms ... the honest statement is the number together with the reason."

      The number recomputes in the domain it was measured in: from results-sweep.json, 46 of
      the 130 linenos record FAIL under at least one of the 23 mutants, so 84 record none, and
      the baseline is 130 PASS / 0 NOT-REACHED. I re-derived both independently. The reason is
      also largely right — I mapped the 84 to their enclosing tests and the great majority are
      CARD-255's pure-function arms (10 in test_same_tree_is_exact_identity..., 10 in
      test_a_value_that_is_not_an_absolute_path..., the stale/threshold/future-stamp rules, the
      age fallbacks, the skip-API rules), and of the 26 assertion entries this card added or
      reshaped, only three are in the 84.

      What is not true is that those 84 are killed by no mutant in the set. MEASURED:

        instrument, M-Q instrumented   :1104 PASS  :1115 PASS  :1136 PASS  :1167 PASS
        my plain run, M-Q, --tb=line   :1104 FAIL  :1115 FAIL  :1136 FAIL  :1167 FAIL

      All four are in the 84. The cause is the instrument's own mechanism, and the fix names
      the mechanism one paragraph earlier without drawing this consequence: the recording
      wrapper swallows AssertionError, and the file's real-process cases start CHILD pytest
      processes that run SELECTION = test_no_lock_file_is_the_ordinary_case out of the SAME
      instrumented file. Under M-Q the child's :105 fails, the wrapper swallows it, the child
      reports "1 passed" with rc 0, and so the parent's `result.returncode == 0` and
      `"1 passed" in combined` arms record PASS. The fix correctly added the plain runs to
      recover the TEST-level signal; it then kept stating PER-ASSERTION figures from the
      instrumented run alone, where those same arms cannot fail by construction.

      Two consequences, both in the card's principal evidence:
        1. the 84 is an upper bound on "uncontrolled", not the count of it — measured, at most
           80, and the four counterexamples are exactly the premises the record dismisses as
           "they establish that the run happened";
        2. the kill matrix under-attributes every real-process arm. It shows M-Q killing
           :105/:106 and nothing else; a plain run shows M-Q killing :105, :1067, :1104, :1115,
           :1136 and :1167. A reader asking the matrix "what controls the redirected real run's
           premise?" is told "nothing", and that is the instrument's suppression, not the suite.

      This is cycle 1's defect class one layer down — a measurement whose domain is not the
      domain it is reported over — and it was created by the fix for cycle 1's finding.
      ADR-0039/R1: the claim states more than the code and its tests demonstrate.
    suggestion: |
      Two parts, both cheap, neither a code change.

      (a) State the domain on every per-assertion figure, and state the instrument's limit as a
      bound: "N of 130 record no FAIL under any mutant IN THE INSTRUMENTED RUN; the recording
      wrapper suppresses AssertionError, so any assertion whose truth depends on a child
      pytest's outcome cannot record FAIL there — those arms are measured in the plain runs,
      at test level."

      (b) Recover the per-assertion plain-domain signal, which costs one flag: run the plain
      pass with `--tb=line` (or `-rA`) and parse the `file:lineno` of each failure, as I did.
      That gives the real-process arms their rows and turns the 84 into a measured number. The
      alternative — a second instrumented pass whose handler records and then RE-RAISES
      (`except AssertionError: _c256_rec(ln, 'FAIL'); raise`) — reproduces plain semantics
      exactly, so NOT-REACHED there is plain-run reachability; keeping both passes gives
      within-test attribution AND cross-process fidelity.

      Certification for cycle 3: the restated figure with its domain named, plus the four
      linenos above appearing in M-Q's row (or an equivalent plain-domain derivation). No code
      moves, so it can be confirmed by reading the restated record against one re-run of M-Q
      with --tb=line.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-008
    severity: high
    category: ops
    type: gap
    file: meta/kanban/cards/CARD-256.md
    line: 462
    title: "the reason given for :1174 being unkilled is refuted by a run and contradicts the card's own F-006 bound in the same commit"
    description: |
      The fix states: "And `:1174` is killed by nothing in the set — not a dead control: only a
      *new* verdict phrase would red it, which is precisely the enumeration bound F-006 now
      declares. That is bound (a) made visible rather than asserted."

      The conclusion is right and I confirmed it; the mechanism is wrong, and it is the exact
      inverse of what F-006 declares six paragraphs later. :1174 asserts that none of the three
      ENUMERATED phrases appears in a no-lock run. A new (fourth) phrase is not in that list, so
      a fourth phrase cannot red it — which is the whole content of F-006's bound (a).

      MEASURED, both ways, by hand (cp -p backup, restored, diff -q and shasum -a 256 clean,
      line-count preserving, board lock absent before and after):

        M-4B  current_verdict()'s no-lock branch returns a FOURTH phrase
              -> 41 passed. The phrase is printed in the run's own output and :1174 stays
                 green. Nothing in the file notices.
        M-1174 the same branch returns an ENUMERATED phrase ("ignoring a stale lock ...")
              -> 1 failed, 40 passed; the single failing assertion is :1174 and nothing else.

      So :1174 is not a dead control — its control fails, cleanly and alone — but what makes it
      fail is an enumerated phrase reaching a run that should have none, not a new phrase. The
      sentence as written would tell the next card that :1174 guards against a fourth verdict
      message, which is the one thing it provably does not do, and which F-006 was added to
      declare. ADR-0039/R1.

      Worth keeping: M-1174 is the clean single-assertion kill for :1174 that the 23-mutant set
      lacks, and it costs one substitution.
    suggestion: |
      Replace the clause with the measurement: ":1174 is killed by nothing in the 23-mutant
      set, and its control is not dead — a mutant that makes a no-lock run emit one of the
      three enumerated phrases (current_verdict's no-lock branch returning a 'stale' message)
      reds :1174 alone. What it cannot see is a FOURTH phrase, which is F-006's bound (a),
      measured: a fourth phrase on the same branch leaves all 41 tests green."

      Certification for cycle 3: a read of the restated clause, plus the two-line mutant above
      re-run once if the station wants the row in the matrix.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

instrument_verdict:
  claim_1_every_assert_node: >-
    HOLDS. Instrument.visit_Assert is reached through NodeTransformer.generic_visit at any
    depth (an Assert statement cannot contain another Assert, so the absent generic_visit call
    inside the visitor loses nothing), and run_one asserts the transformer's lineno list equals
    an independent ast.walk enumeration of the mutated source. Independently corroborated two
    ways: my own ast.walk count is 130, and a sys.monitoring LINE tracer — a wholly different
    mechanism — reached all 130 of those linenos in the 41-test selection.
  claim_2_pristine_and_line_preserving: >-
    HOLDS. The mutant is a text substitution onto the cp -p backup content, with three guards:
    count(old) == 1, equal newline counts, and equal splitlines() length after the replacement;
    instrumentation happens after, on the mutated text, so the recorded linenos are the
    committed file's. I applied eleven mutants by hand under the same three guards and all
    eleven held.
  claim_3_per_pid: >-
    HOLDS as implemented, and the rationale is real: SELECTION (:927) is
    tests/test_full_suite_lock.py::test_no_lock_file_is_the_ordinary_case, so every child
    pytest does run asserts from this same file. Records are keyed rec-<pid>.txt, the outer run
    is the pid with the most distinct linenos, child pids are reported separately. This is also
    where the limit in F-007 lives: separating the pids does not stop the child from executing
    the instrumented file.
  claim_4_also_plain: >-
    HOLDS and was decisive. 24 instrumented plus 24 plain rows in results-sweep.json; nine of
    the plain rows match my own independent runs exactly (BASELINE 41 passed; M-Q 6 failed;
    M-A 2; M-R2 4; M-TP 1; M-T 1; M-K 1; M-RD 10; M-Q2 rc 4 with nothing collected).
  claim_5_restore_discipline: >-
    HOLDS. Restores run in a finally block from the cp -p backup, verified with diff -q AND
    shasum -a 256, raising SystemExit on either check; no git command appears anywhere in the
    file. Corroborated: all three files in the worktree are byte-identical to their HEAD blobs,
    and git status shows tests/ clean.
  undeclared_limit: >-
    The recording wrapper suppresses AssertionError, so the instrument's "reached" is
    reachability-under-suppressed-AssertionError — strictly wider than plain-run reachability —
    and any assertion whose truth depends on a child pytest's outcome cannot record FAIL at all.
    The fix names the mechanism for test-level results and does not declare it for its own
    per-assertion figures. That is F-007.
  rows_checked_without_the_instrument:
    - "M-Q — 6 of 41 red, the six named; plain-run arm :105 only. AGREES."
    - "M-Q2 — rc 4, nothing collected, one ERROR line. AGREES (no assertion runs at all)."
    - "M-A — 2 red; the unit test's only failing arm is :820. AGREES (one arm, not four)."
    - "M-R2 — 4 red, failing arms include :1107 and :1118. AGREES (the two new kills are real)."
    - "M-RD — 10 of 41 red, arm :795. AGREES (F-002(a) confirmed, G-5 not implicated)."
    - "M-TP — reds :750 alone. AGREES (the fix's own addition is killable)."
    - "M-T — reds :698 alone, :750 green. AGREES (the two halves are isolated)."
    - "M-K — reds :614 alone in a plain run. AGREES (F-005's subsumption)."
    - "M-WIDE (mine, not in the set) — PROSE_SHAPES widened by .sh reds :750 and :685."
