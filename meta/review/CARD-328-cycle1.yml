claims_verified:
  twelve_facts_and_totality:
    verdict: confirmed
    how: >-
      Imported the module and counted the dict compared_surface() returns:
      len == 12, keys exactly dot.declarations,
      keyframes.player-solved-in, keyframes.player-solved-flash,
      sweep.selector, sweep.animation.{name,duration,easing,delay,step},
      reduced-motion.block-count, reduced-motion.coverage, wave.expression.
      disagreements() is a comprehension over surface.items() -- total over the
      keys by construction, read from the code and not the docstring. A fact in
      the surface therefore cannot be silently dropped. The `len(surface) >= 12`
      floor stops the surface shrinking.
  nine_agree_three_diverge:
    verdict: confirmed
    how: >-
      Re-derived from the rows, not quoted: 9 agree
      (dot.declarations, both keyframes, reduced-motion.block-count,
      sweep.animation.name/duration/easing/step, wave.expression), 3 diverge
      (sweep.selector, sweep.animation.delay, reduced-motion.coverage), and
      set(disagreements) == set(DECLARED_DIVERGENCES) is True.
  three_divergences_legitimate:
    verdict: legitimate_as_divergences_but_under_constrained
    how: >-
      All three are real design differences, not drift: the public page has no
      panel chrome, play.js genuinely writes data-solved on every render, and
      the `, 0` is a fallback. Each reason is substantive and well over the
      120-char floor. But a future REAL drift inside any of the three is
      indistinguishable from the declared one -- see IMP-1.
  found_by_behaviour_not_selector:
    verdict: confirmed
    how: >-
      Confirmed twice. In code: sweep_rule filters on
      `FLASH in declarations(body).get("animation", "")` after stripping
      reduced-motion blocks, and asserts exactly one match. Empirically: under
      N1 the admin selector changed and the rule was still found and reported.
  no_line_numbers:
    verdict: confirmed
    how: >-
      grep for `<file>.css:NNN`, `line NNN` and bare 3+ digit literals across the
      709 lines returns only card ids (328, 255, 294), ADR ids (0041, 0039,
      0038), the commit id 2400501b, the year 2026 and the 120-char reason
      floor. No file line number anywhere, so a +129-line insertion above the
      surface cannot move a fact.
  reduced_motion_correction:
    verdict: confirmed_independently
    how: >-
      `grep -c 'prefers-reduced-motion'` = 4 in admin.css and 1 in player.css,
      but `grep -c '@media (prefers-reduced-motion'` = 1 and 1. admin.css lines
      872, 1059 and 1259 are prose comments; only 1061 opens a block. So BOTH
      sheets have exactly one block, the orchestrator's correction is right, and
      the card's original "4 vs 1" was a string count read as a block count.
      Coverage confirmed at 5 selectors (.player-toolbar, .player-toolbar *,
      .player-stage, .player-stage *, the sweep) vs 2 (the banner, the sweep).
      The guard correctly declares the COVERAGE and compares the COUNT
      separately, leaving the count undeclared because it agrees at 1 = 1 --
      declaring it would have been the stale exemption the same AC forbids.
  per_assertion_measurement:
    verdict: confirmed
    how: >-
      The AC-1 and AC-2 families really are split one arm per claim (5 and 8
      separate node ids, each collected and named). Every mutant's kill is
      attributable to a named arm, which I verified by capturing `FAILED
      <nodeid>` lines with `-v -rf -o addopts=''` rather than reading a total.
      The arm sets I measured match the card's table exactly for all four
      re-fired mutants.

findings:
  critical: []
  important:
    - id: IMP-1
      status: fixed
      fixed_in: null
      fix_round: 1
      title: >-
        Each declared divergence exempts the WHOLE fact, so real drift inside
        one is invisible -- four reviewer mutants survived
      ac_refs: [AC-4]
      guardrail_refs: [G-5]
      system_contract_refs: ["ADR-0039/R1", "ADR-0039/R2"]
      files:
        - tests/test_public_player_agreement.py
      confidence: high
      source: mutation
      detail: >-
        DECLARED_DIVERGENCES exempts three facts by KEY, and nothing constrains
        what may differ within an exempted key. The card's Worktree notes claim
        per-exemption mitigations, and they are weaker than they read:
        sweep.animation.delay is backstopped only by the trailing step LITERAL,
        reduced-motion.coverage only by the block COUNT, and sweep.selector by
        nothing at all. I fired four mutants into the exempted content; all four
        survived with 23 passed and exit 0, and in each case I dumped the
        exempted fact's value under the mutant to prove the guard had READ the
        change and stayed green.
      failure_scenario: >-
        A future card edits admin.css's sweep selector from
        `.player-cell[data-state="filled"]` to `[data-state="empty"]` -- perhaps
        while refactoring state names. The admin panel now flashes the empty
        cells and the public page flashes the filled ones: the two players
        disagree about what solving looks like, which is the exact defect
        2400501b existed to fix and the exact drift this card was written to
        catch. tests/test_public_player_agreement.py stays green, because
        sweep.selector is a declared divergence and "it differs" is all the
        guard ever asks. The same shape hides a 3x-slower admin sweep (N2) and,
        more seriously, hides either sheet dropping the sweep from its
        prefers-reduced-motion block (N3/N4) -- an accessibility regression that
        also contradicts this card's own Design-context standard, "the reveal
        must keep working under prefers-reduced-motion exactly as 2400501b
        shipped it".
      why_important_not_minor: >-
        This is a claim card; the guard IS the deliverable and mutation is the
        agreed discipline for judging it. The card body promises "a change to
        either kind is visible instead of silent", and for the declared kind
        that is false. G-5 asks each exemption for a shape constraint; the table
        has one, the individual exemptions do not, which is the CARD-255 shape
        one level down -- a licence over a whole fact rather than over a stated
        difference.
      suggested_direction_report_only: >-
        Constrain the residue rather than the key: normalise the declared
        difference away and assert what is left agrees. For sweep.selector,
        assert both selectors end with the same
        `.player-cell[data-state="filled"]` key and differ only in the leading
        hook. For sweep.animation.delay, rewrite `var(--player-wave, 0)` to
        `var(--player-wave)` and then assert delay equality. For
        reduced-motion.coverage, assert each sheet's block names that sheet's
        own sweep selector with animation switched off. Each would have killed
        the corresponding probe. Not fixed here -- reported, per the brief.
  minor:
    - id: MIN-1
      status: fixed
      fixed_in: null
      fix_round: 1
      title: >-
        The "the texts differ" half of
        test_the_comparison_is_over_declarations_and_not_over_rule_text cannot fail
      ac_refs: [AC-1]
      system_contract_refs: ["ADR-0039/R1"]
      files: [tests/test_public_player_agreement.py]
      confidence: high
      source: static-analysis+experiment
      detail: >-
        The arm asserts `_squeezed(rules(admin_css)[DOT]) != rules(public_css)[DOT]`
        -- it squeezes the admin operand and leaves the public one RAW. A raw CSS
        declaration body always begins with the whitespace following `{` (' ' in
        admin.css, '\n' in player.css) while _squeezed strips leading and
        trailing whitespace, so the two can essentially never be equal. I tested
        it by collapsing player.css's dot rule onto one line byte-identical to
        admin.css's -- a pure reformat, zero pixels moved -- and the arm still
        passed (23 passed). So the sub-assertion the card credits with
        "stopping a later simplification into admin_rule == public_rule" is a
        tautology.
      failure_scenario: >-
        A later card "simplifies" the dot comparison to a text comparison. The
        reviewer looks for the arm that is supposed to catch that, sees it green,
        and concludes the protection is live. It never was: only the second
        assert in that method (declarations equal) carries weight, and that one
        would be deleted by the very simplification in question.
      impact_on_mutant_table: >-
        None. M1-M4 kill this arm through its SECOND assert, so the card's table
        is unaffected and remains accurate.
      suggested_direction_report_only: >-
        Squeeze both operands, or assert the specific property that must hold
        (e.g. the admin rule is one line and the public rule is more than one),
