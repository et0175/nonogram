      `test_a_fourth_divergence_in_the_compared_surface_is_reported` and
      `test_the_disagreements_are_exactly_the_declared_ones`.
    reservation: >-
      The literal AC is met. What is NOT caught is drift INSIDE an
      already-declared divergence -- see finding IMP-1. The card body's claim
      "a change to either kind is visible instead of silent" is false for the
