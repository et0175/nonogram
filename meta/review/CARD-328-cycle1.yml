summary: >-
  A strong, honest claim card. Every figure the card states that I could
  re-derive, I re-derived and it held: the 12 facts, the 9/3 split, the exact
  identity of the three divergences, the 1 = 1 reduced-motion block count and
  the prose-comment explanation for the old "4 vs 1", the 23/23 node ids, the
  5/8/3/7 class split, the 103-pass impact set with an empty skip set, the 664
  tree-scanning passes, and the two G-1 SHAs. The mutant table is not just
  directionally right -- all four mutants I re-fired killed with the exact arm
  sets the table names, including the subtle three-not-four note for M3/M4. The
  anti-vacuity arms are real, which I established by injection rather than by
  reading: six separate ways of making a parse return empty, six kills. The
  guard carries no line numbers and finds the sweep by behaviour, both verified.
  The one substantive gap is that the three declared divergences are exemptions
  over whole facts: inside them, real drift -- including the admin flashing the
  wrong cells, and either sheet losing its reduced-motion suppression -- is
  invisible, which I demonstrated with four surviving mutants. That is a
  tightening of the deliverable the card describes rather than a defect in what
  it built, and it is cheap to close. Score 8; certification waits on IMP-1.
