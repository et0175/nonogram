acceptance_criteria:
  AC-1:
    verdict: met
    evidence_derived_by_reviewer: >-
      5 node ids collected under
      TestPlayerLooksAgree_TheDotIsDeclarationForDeclarationTheSame (counted from
      `--collect-only -q -o addopts=''`, not quoted). The comparison really is
      over parsed declarations: `declarations()` splits on ';'/':' and squeezes
      values, so it is order- and format-insensitive by construction. I re-fired
      M1 (admin side) and M4 (public side): both KILLED, and the kill is
      attributable -- `test_the_two_declaration_sets_are_equal` reds in both.
      Anti-vacuity verified by injection: V1 (_RULE regex never matches) and V4
      (declarations() always empty) both red, 12 and 9 arms respectively.
    reservation: >-
      One sub-assertion inside
      test_the_comparison_is_over_declarations_and_not_over_rule_text is vacuous
      -- see finding MIN-1. The AC's substance is unaffected.
  AC-2:
    verdict: met
    evidence_derived_by_reviewer: >-
      8 node ids collected. The "found by behaviour, not by selector" claim is
      true in code (sweep_rule filters rules by `FLASH in declarations(body)
      ["animation"]`, with reduced-motion blocks stripped first) AND empirically:
      under my N1 mutant the admin sweep's selector changed and the guard still
      located the rule and read back the new selector. M5 (admin `* 12ms` ->
      `* 13ms`) re-fired KILLED at `test_the_per_cell_step_agrees`. V3 (brace walk
      returns nothing) and V6 (step regex never matches) both red; V6 reds exactly
      the one arm the card names.
  AC-3:
    verdict: met
    evidence_derived_by_reviewer: >-
      3 node ids. M7 (solver.js `row + col` -> `row`) re-fired KILLED at
      `test_both_players_set_the_wave_to_the_same_expression` and
      `test_the_wave_is_the_cells_row_plus_its_column`. V2 (wave regex never
      matches) reds `test_each_player_sets_the_wave_exactly_once` and
      `test_the_wave_is_the_cells_row_plus_its_column` but NOT the equality arm
      ([] == []) -- which is precisely why the shape constraint and the
      independently written WAVE_EXPRESSION are both needed. They are both
      present. The pointer comment added to play.js is a whole-line `//` comment
      and is correctly skipped by `_js_code_lines`, so it cannot be parsed as a
      second setter.
  AC-4:
    verdict: met_with_reservation
    evidence_derived_by_reviewer: >-
      Re-derived independently by importing the module and calling
      compared_surface(): 12 facts, 9 agree, 3 diverge, and the 3 that diverge
      are EXACTLY DECLARED_DIVERGENCES (set equality True). disagreements() is
      total over the surface by construction (a dict comprehension over
