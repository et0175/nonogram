# ---------------------------------------------------------------
# Not findings. Judgements I was asked for, non-actions I endorse,
# and notes the next card inherits.
# ---------------------------------------------------------------
judgements:
  - id: J-1
    title: "The q/Q non-refusal argument is CORRECT, and holds more strongly than the card states"
    verdict: endorse
    detail: >-
      The card's argument is that a saved graphics state moves a path operand
      only if something moved the CTM between `q` and `Q`, and the only
      operator that can is `cm` — so refusing `cm` closes the q/Q dependency.
      I tested it rather than reasoning about it, and the mechanism is
      stronger than the stated one: `cm` is refused at ANY position in the
      stream, so the CTM is provably identity for the WHOLE stream and the
      "between the two" qualifier is not even needed. Probed: `q rect Q` reads
      the same box as the bare rect; `q q q rect` likewise; and
      `2 0 0 2 0 0 cm q Q rect` REFUSES, so there is no q/Q arrangement that
      can restore a CTM that was never concatenated. A malformed mid-path `q`
      (`10 10 q 20 20 re f`) refuses too, via the starved-operand branch.
      On the exhaustive side: within a content stream PDF 1.7 gives `cm` as
      the sole CTM operator; the other three routes by which an operand can
      land somewhere else — a Form XObject's own `/Matrix` via `Do`, an inline
      image's implicit unit-square mapping via `BI`, and a shading via `sh` —
      are all refused. The remaining unrefused operators that could still make
      the reading wrong (`W` clip, `gs` soft-mask/alpha) do not move an
      operand and are filed as F-010; they are held out by the binding cell,
      not by this argument. Finally, the non-refusal is itself pinned: my
      MUT-R6 (add `q`/`Q` to the refused set) is KILLED, so the "q/Q are read,
      not refused" control is load-bearing rather than decorative.
  - id: J-2
    title: "The binding's home is tests/test_book_difficulty_dots.py, not the co-change peer — the round was right to go against the suggestion"
    verdict: endorse
    detail: >-
      I checked all three of the round's reasons and the import claim, and
      found a fourth reason it did not make.
      (1) MEASURED TRUE: exactly two files mention node `stream_marks` — its
      own defining module and this test module — so the vector arm is its only
      consumer.
      (2) MEASURED TRUE, and it is the strongest reason: scratchpad/card331/
      mutate.py hard-codes `MODULE = "tests/test_book_difficulty_dots.py"` and
      builds every plant's node id as `f"{MODULE}::{node}"`, so a cell in the
      peer module literally CANNOT be a target of this card's mutant harness.
      Add G-5's node-id gate (scoped to this module) and the 195-cell baseline
      and a peer cell sits outside all three instruments. The round's phrase
      for this — "F-002's defect in a different costume" — is accurate.
      (3) TRUE: the cell it widens (the `PAINTS_THAT_FILL`-is-a-subset cell) is
      already in this module's vector-arm class.
      (4) MINE, and decisive: tests/test_book_pdf_vector_primitives.py does
      not reference `stream_marks` at all. Putting a `stream_marks` vocabulary
      guard there would put the guard in a module that never calls the thing
      it guards.
      THE IMPORT CLAIM IS CORRECT. CLAUDE.md's ban is scoped to lateral
      imports inside `src/nonogram` — its structural guard "walks
      `src/nonogram/**/*.py` on disk with `ast`" — and CLAUDE.md itself
      blesses the test-tree form, saying node `mask_runs` "is cross-checked
      against `clues.encode_line` from the test tree instead, where the import
      is legal". The precedent count is UNDERSTATED rather than wrong: the
      module's comment says "sixteen other modules" (17 total) and I measure
      **45 test files / 95 `from tests.test_` import lines** repo-wide, with
      the cited tests/test_book_cell_size.py:64 real. Understating a precedent
      strengthens the argument.
      THE PEER IS NOT LEFT UNGUARDED. It carries 57 of its own cells, imports
      `book_vector` directly, and loses nothing here (0 diff lines). And the
      authority the binding rests on has its own guard at
      tests/test_book_solved_answer_key.py:3086, so the binding has two
      anchors and not one.
      NO DOUBLE COLLECTION, measured three ways — see
      measurements.double_collection.
  - id: J-3
    title: "NOT recording cm/Do/sh as BOUND: entries is correct — and it is structurally required, not merely defensible"
    verdict: endorse
    detail: >-
      A bound in this module's vocabulary is what the instrument CANNOT see;
      the typed-glyph bound is the model case. After the fix, cm/Do/sh are
      refusals — the instrument sees them and raises. A refusal is the opposite
      of a bound, so adding them would assert blindness where the reader is now
      loud. Stronger than that: the bounds cell asserts
      `all(bound.caught is False for bound in MEASURED_MARK_BOUNDS)`
      (tests/test_book_difficulty_dots.py:5780), and a refused operator IS
      caught — so a cm/Do/sh row in `MEASURED_MARK_BOUNDS` would red that
      cell. The non-action is enforced by an existing assertion, not just
      argued. Leaving `MEASURED_MARK_BOUNDS` and the struck-bound agreement
      cell untouched (0 diff lines on both definitions) is right. Note N-2
      records the one thing missing: the REASONING is not written into the
      card.
  - id: J-4
    title: "NOT editing meta/kanban/config.yml's stale figure was the right call"
    verdict: endorse
    detail: >-
      CARD-317 was in a concurrent fix round on the same shared config, and a
      conflict there would red a merge gate over a comment — a real cost for
      zero substance. The round did the right thing twice over: it left the
      file alone AND recorded in its own figures table that the comment is
      stale and whose file it is to correct, so the staleness is visible rather
      than silently inherited. The owner has since made the edit on main
      (config.yml now records `forge_1  0 error(s), 90 warning(s), 0 info`,
      re-measured 2026-10-31 after CARD-318 closed ten dead refs, 100 -> 90 as
      sets), which matches my own run exactly. See note N-3 for the one-word
      consequence at merge.

notes:
  - id: N-1
    title: "Standing hazard, inherited by CARD-322: RASTER_ARM_FUNCTIONS' completeness is still undrived"
    severity: out-of-scope
    confidence: low
    learned_pattern:
      pattern_summary: >-
        Real finding outside the card's declared scope (a file the card must
        not edit); deferred to a backlog follow-up rather than wrong.
      dismissed_count: 3
    detail: >-
      F-004 is closed exactly as cycle 1 filed it, and cycle 1 explicitly
      accepted the hand-listed shape, so I do not re-rate it. But the fix
      extended a LIST, not the mechanism: the only guard on the set is
      `set(_raster_arm_sources()) == set(RASTER_ARM_FUNCTIONS)`, which checks
      that every listed name has a source and cannot catch a name that SHOULD
      be listed and is not — which is precisely the hole cycle 1's M10
      exploited to survive at 189 passed. A future function added to the raster
      arm and not added to the 5-name tuple reopens it identically, with
      MUT-18 surviving again. ADR-0039/R1's first clause asks for "a
      completeness test written before the set". The imminent exposure is
      CARD-322, which is the next card to touch this arm and which will
      re-point it. Worth one recorded line in the card's "What was NOT done"
      section so the next card inherits the hazard rather than rediscovering
      it; filed as a note, not a finding, because cycle 1 ruled on the shape.
  - id: N-2
    title: "The BOUND non-action's reasoning is not written into the card"
    severity: out-of-scope
    detail: >-
      The card documents the reasoning for its other judgement calls (q/Q, the
      binding's home, the render-set refusal, the retraction) but says nothing
      about why cm/Do/sh were NOT recorded as bounds and why
      `MEASURED_MARK_BOUNDS` was left untouched. The reasoning is correct and
      structurally enforced (J-3), so nothing is at risk — but a deliberate
      non-action on a frozen registry with no record is the kind of thing a
      later card re-litigates. One line in the existing "What was NOT done,
      and why" section would close it.
  - id: N-3
    title: "The card's config.yml sentence becomes false at merge, through no fault of the card"
    severity: out-of-scope
    detail: >-
      The figures table says "`meta/kanban/config.yml:17-22` carries a stale
      2026-10-29 comment saying 102; it is wrong and is not this card's file to
      correct". True when written; the owner has since corrected that comment
      on main to 90 with the staleness kept visible, so the sentence and its
      line reference now describe a defect that no longer exists. A one-word
      edit at merge ("carried", past tense, or a pointer to the owner's
      correction) keeps the card's record honest. Not the card's error.
  - id: N-4
    title: "The card carries no impact-scope figure"
    severity: out-of-scope
    detail: >-
      The figures table records the module baseline, the mutant tally, the
      operator surface and the validator, but no impact-scope run. That is
      defensible (impact scope is a review-side measurement and cycle 1's YAML
      carried it), and mine is in measurements.impact_scope. Noted only so the
      absence is not read as an omitted re-derivation.

