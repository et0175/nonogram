    file: src/nonogram/admin/app.py
    line: 3323
    title: "The Finalise screen's \"~N\" page figure is now a far looser upper bound than before this card (302 vs ~182 on the default plan)"
    description: |
      `interior_page_count(len(puzzles_in_book))` — the one-argument call the
      Finalise screen makes (src/nonogram/admin/app.py:3323) — still means
      "one puzzle page and one answer page per puzzle". Before FR-042 that was
      loose only by the two-up pairing saving; since this card it is also loose
      by the whole of the answer-key packing. On the default 150-puzzle plan
      the screen now shows ~302 for an interior that writes roughly 182 pages
      (1 guide + <=150 puzzle pages + 1 divider + 30 answer pages), a ~65%
      overstatement.

      This is not a defect of this card's code and it is not fixable inside it:
      G-5 forbids editing app.py, and CARD-129 (status `ready`, `Depends on:
      CARD-134`, `Touches:` app.py + templates/book_finalize.html) already owns
      making the figure exact (EC-034/AC-271). The direction is the safe one —
      the covering test states why (an understated count would send a book to
      KDP under a spine that does not fit) — and the card's notes do say "the
      bound is now wider". What is missing is the magnitude, which is what
      makes it read as a nit rather than as a number the owner will see on
      screen until CARD-129 lands.
    suggestion: |
      No code change here. Record the number on CARD-129 (or in CARD-134's
      worktree notes) so its acceptance criteria are written against a known
      starting error rather than against "wider": the generator already reports
      the exact value via `Interior.page_count` / `BookExport.answer_page_count`,
      so CARD-129's fix is to read that instead of re-planning from the count.
    confidence: high
