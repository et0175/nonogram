findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/static/admin.css
    line: 101
    title: "Comment ties --space-2 to the sm control's padding, which is Bootstrap's literal .5rem"
    description: |
      The calc() uses 2 * var(--space-2) for "the sm control's inline padding", but the
      padding actually applied is Bootstrap 5.3's .form-control-sm literal (.25rem .5rem);
      admin.css:43 overrides only min-height. The two are equal today by value, not by
      reference, so a change to --space-2 would silently change the reserved width
      without changing the real padding. The test (390 px, Chromium) would catch a
      shrink, not an over-wide growth.
    suggestion: |
      Either set .plan-matrix input's padding-inline to var(--space-2) explicitly so the
      calc and the padding share one source, or reword the comment to "Bootstrap's sm
      padding (.5rem, equal to --space-2)".
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
