  - id: F-004
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/app.py
    line: 2342
    title: "Every download renders both files"
    description: |
      _export_book always runs export_book, which renders every interior page (render_pages per puzzle,
      book_pdf_generator.py:248-270) and the cover. A "Download cover" click therefore renders the whole
      interior only to discard it, and an interior download encodes a 2550x3300 cover page it throws away.
      For a ~120-page book the cover button costs a full interior render.
    suggestion: |
      Let the route render only the requested part (e.g. export_cover()/export_interior() helpers beside
      export_book, both reused by export_book), or cache per request.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: 4d68b8e
    dismissed_reason: null
    learned_pattern: null
  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2237
    title: "Finalise page count re-derives the interior layout instead of using the export's count"
    description: |
      page_count = 1 + n + (n + 1 if n else 0) duplicates interior_pages' make-up. It already diverges
      when a puzzle fails to render (interior_pages skips it silently, book_pdf_generator.py:267-270) and
      will diverge once CARD-116/INV-010/INV-011 pair puzzles or pack answers 6-up. EC-034 requires the
      finalise count to equal the interior's (CARD-129's half), so this formula is a trap for that card.
    suggestion: |
      Leave a pointer comment naming CARD-129, or derive the number from a shared page-plan function
      that interior_pages also uses.
