findings:
  - id: F-001
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/app.py
    line: 2284
    title: "Stale 'cover uploaded' flag silently exports the generated title cover"
    description: |
      _uploaded_cover (app.py:2284-2290) returns None when the stored file is missing, and the export
      then falls back to the generated title cover without any signal. The Finalise screen's
      cover_uploaded (app.py:2240) reads only the session flag book_<id>_cover_data, so it keeps saying
      "your cover image" (book_finalize.html Cover file card). The file defaults to
      $TMPDIR/nonogram_book_covers (app.py:2249-2252), which macOS purges and which does not survive a
      host change, while the signed session cookie outlives it. Result: the owner downloads a cover file
      for KDP that is not the one the screen promises.
    suggestion: |
      Derive cover_uploaded from _uploaded_cover/_stored_cover_path file existence (and clear the stale
      session keys when the file is gone), or refuse part=cover with a flash when the flag is set but
      the file is missing. Add a test: upload, delete the stored file, assert the screen no longer says
      the cover is uploaded / the download warns.
    confidence: medium
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 4d68b8e
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/app.py
    line: 2262
    title: "Cover file keyed by book id only: sessions overwrite each other; never cleaned on book delete; EXIF orientation dropped"
    description: |
      path = <cover_dir>/<book_id>_cover.png is shared by every session; a second browser uploading for the
      same book replaces the first's cover. delete_book never removes it. The JPEG EXIF orientation is not
      applied before re-encoding to PNG, so a phone-photo cover can print rotated.
    suggestion: |
      Apply PIL.ImageOps.exif_transpose before save; unlink the cover in delete_book; accept the shared
      name as intended for the single-owner panel or add the session id to the name.
    confidence: medium
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: 4d68b8e
    dismissed_reason: null
    learned_pattern: null
