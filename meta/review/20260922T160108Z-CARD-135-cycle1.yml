    severity: low
    category: tech-debt
    type: gap
    file: tests/property/test_book_export_interior.py
    line: 212
    title: "Parity assertion is tautological"
    description: |
      The property test checks page_is_right_hand(k) == (k % 2 == 1), which is the function's own body
      (book_pdf_generator.py:72). It observes nothing about the PDF. Harmless now (no parity-bearing
      content exists before CARD-116) but the test name claims parity is verified.
    suggestion: |
      Drop the list comparison (keep page_is_right_hand(0) raising and page 1 being the guide), or note
      explicitly that parity observation lands with CARD-116's mirrored margins.
    confidence: high
    source: static
