card_feedback:
  - >
    The worktree copy of CARD-245.md still carries the pre-amendment Touches line
    (tests/test_admin_review.py, no models.py/migration/template); main's copy was amended in
    24bebf4. Neither version lists src/nonogram/admin/static/admin.css or start.sh, which this
    fix cycle touches. Reconcile at merge so the field matches the commits.
  - >
    G-1's wording was the hole cycle 1 named and the fix satisfied it by inverting. Worth
    promoting into a standing rule rather than re-learning per card: a static guardrail must say
    what defaults to deny AND that an exemption is machine-checked, because "derived from the
    class" was satisfiable with a default-allow predicate underneath it, and "default-deny" is
    still satisfiable with a positive catalogue of write shapes underneath that (F-101). The
    durable form of the rule is: the exemption set is derived, every entry is checked, and the
    *controls are the shapes the guard was not written from*.
  - >
    The card's AC-3 asks for solver entries to be counted. The extent round trip shows the same
    counter answers a second, sharper question (was this save answered from another grid's
    proof), which is worth a line in the card's notes as the pattern for the next memo.
