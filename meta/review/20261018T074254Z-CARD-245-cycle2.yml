summary: >
  Every fix the cycle claims is real, and every control it added bites: nine targeted mutants,
  eight killed, and the one survivor is a shape the fix itself declares out of reach. F-001 is
  closed by a genuine round trip (M2, which survived 161 tests in cycle 1, now fails 7). F-003
  is closed. F-002's direction is now right and its residue is much narrower: the catalogue is
  of writes rather than grid-writes, the parse is the module, all nine shapes cycle 1 probed are
  caught and parametrised, the ten-entry exemption list is machine-checked (save_edited_grid is
  refused on both counts, so it cannot be excused) and is dwarfed by the 33 methods derived out
  read-only. What stops F-002 being fully closed is one unstated and incorrect premise in the
  "freshly built local" alias pass: a fresh container holding references to durable rows is
  treated as not-durable-state, so three real, ungated grid writes added to the production module
  are classified read-only and the G-1 assertion stays green. That is one important rather than
  three, it is test-only, and it needs a specific spelling (an intermediate `list(...)`/`{}`, or a
  reused name) that the ordinary loop form does not have. Both disagreements the fix raises with
  cycle 1 — F-012 "styled but indistinguishable, not unstyled" and F-005 "understated" — are
  correct and I verified each against the source. Production movement is confined to what the
  dispatcher listed; app.py, models.py, the migration and start.sh's default are untouched.

findings:
  - id: F-101
    severity: important
    file: tests/test_puzzle_edit_store.py
    line: 1086
    supersedes: F-002
    claim: >
      G-1's inversion is sound in direction but its "freshly built local" exemption is unsound:
      a fresh container that holds *references* to durable rows is still treated as not durable
      state, so a write through it is not a mutating shape at all and the method is classified
      provably read-only — out of the candidate set entirely, never asked whether it reaches the
      gate. Three real grid writes added to the production module pass the whole G-1 class.
    evidence: >
      Each body below was inserted into PuzzleReviewService as a new method that never calls the
      gate, and `pytest tests/test_puzzle_edit_store.py::TestPuzzleEdit_EveryGridWriteGoesThroughTheOneRefusal`
      reported 21 passed, exit 0:
      (A) `batch = list(self.puzzles.values()); batch[0]["grid"] = grid`;
      (B) `rows = {}` / `for pid in pids: rows[pid] = self.puzzles[pid]` / `for row in rows.values(): row["grid"] = grid`;
      (C) `row = {}` / `row = self.puzzles[pid]` / `row["grid"] = grid` (a reused name: one
      assignment anywhere in the body marks the name fresh for the whole body).
      In legacy mode `self.puzzles.values()` yields the live row dicts - the test harness
      deep-copies in `Harness.row` for exactly that reason - so all three durably corrupt the
      store. The control (D), the same write spelled `for row in batch: row["grid"] = grid`,
      IS caught (1 failed, test_every_candidate_writer_reaches_the_refusal_or_is_excused), which
      shows the hole is a spelling accident rather than a drawn boundary. `_fresh_locals`'
      docstring asserts the premise that makes it invisible - "a slot of a fresh container is
      still not durable state" and "where such a local *goes* is a separate write and is seen on
      its own" - and `_mutating_shapes`' stated bound names only imported helpers and mutators
      outside MUTATORS, so this case is claimed sound rather than declared out of scope.
    suggested_fix: >
      Treat a fresh container as fresh only while nothing durable has been put into it: drop a
      name from `_fresh_locals` when any value reaching it is rooted at `self` (or at a
      parameter), and drop it entirely if the name is rebound to a non-fresh value anywhere in
      the body. Then add (A), (B) and (C) as three more parametrised controls beside the nine, so
      the next widening is itself asserted.

  - id: F-102
    severity: minor
    file: tests/test_puzzle_edit_store.py
    line: 1357
    claim: >
      `_reaches` checks *reachability* of the gate through call edges, not that the write happens
      after it, so "goes through the one refusal" is asserted as "mentions the one refusal
      somewhere". A writer that stores first and proves afterwards, or that proves only in a
      branch that does not write, satisfies G-1.
    evidence: >
      `_analyse_source` on `def store_then_prove(self, row, grid): row.grid = grid;
      self._refuse_unless_uniquely_solvable(grid)` returns ungated == []. So does
      `if flag: return self._refuse_unless_uniquely_solvable(grid)` followed by
      `row.grid = grid` on the other branch. Not a regression - cycle 1's version was reachability
      too, and the real path's ordering is pinned behaviourally (AC-2, and mutant N1's 7
      failures) - but the guard's own docstring says "must reach the gate", which is weaker than
      what G-1 asks for and weaker than a reader of the class will assume.
    suggested_fix: >
      Either say in the class docstring that the static half proves the gate is *on the call
      graph* and the behavioural half proves it is *in front of the write*, naming which tests do
      the second; or require the gate call to dominate the write within the method body.

  - id: F-103
    severity: nit
    file: src/nonogram/admin/puzzle_review.py
    line: 602
    claim: >
      The open item the fix flagged is fine as code, but the reason given for it is not true.
      `_remember_proof` reads `self._verifications.get(...)` directly, and the stated
      justification is that the insert path needs the entry "without the recency side effect" -
      yet the very next lines call `move_to_end(fingerprint)` unconditionally, so reading through
      `_remembered_verification` would be behaviour-identical (one redundant `move_to_end`).
    evidence: >
      puzzle_review.py:604-610: `verification = self._verifications.get(fingerprint)` ... then
      `self._verifications.move_to_end(fingerprint)` on both branches. The actual reason the
      direct read is acceptable is the one the test encodes: `_remember_proof` is one of the
      memo's own three methods (MEMO_OWNERS), and an owner reading its own structure is not the
      F-011 hazard. Mutant N4 (reverting `_refuse_unless_verified` to the raw dict) is killed by
      test_nothing_outside_the_memos_own_methods_touches_it, so the pin itself bites.
    suggested_fix: >
      Correct the sentence - "the memo's own insert path, which does its own `move_to_end`" - so
      the next reader is not told a side effect is avoided that is not avoided.

  - id: F-104
    severity: nit
    file: tests/test_puzzle_edit_store.py
    line: 1065
    claim: >
      `_symbols` keys by `Class.method`, so two same-named functions in one class silently
      overwrite each other. A property getter/setter pair collapses to whichever is written last.
    evidence: >
      `found[f"{node.name}.{member.name}"] = member`. Python's `@x.setter` must follow the
      getter, so today the *setter* (the writer) is the one kept and the guard fails safe; the
      reverse order, or an `@overload`/conditional redefinition, keeps the reader and hides the
      writer. test_the_parsed_symbols_are_the_methods_the_store_runs asserts
      `runtime <= parsed` by name, which a collapsed pair still satisfies.
    suggested_fix: >
      Key duplicates with a counter suffix, or assert that no `Class.method` key is written
      twice, so a collapse is a failure rather than a silent loss.

  - id: F-105
    severity: nit
    file: src/nonogram/admin/puzzle_review.py
    line: 1030
    claim: >
      Legacy mode stores the caller's grid object by reference (`puzzle.update(derived)` with
      `derived["grid"] = grid`), so a caller that keeps and mutates the list it passed mutates
      stored state without re-verification.
    evidence: >
      No copy on either side; `Harness.row` deep-copies precisely because "memory mode hands out
      the live dict". Unreachable from the routes (the grid is request JSON, discarded after the
      response) and identical to `add_puzzle`'s existing behaviour, and production runs Postgres,
      where the column is serialised. A shape note, not a defect.
    suggested_fix: Deep-copy on the legacy write, or note the aliasing beside it.

