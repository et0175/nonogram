    file: tests/test_guard_integrity.py
    line: 409
    title: "the `passes` knob's claim that no guard sets it has no control, and setting it at a guard call site would silently restore the bound F-001 removed"
    description: |
      The docstrings state the knob's reach twice: ":409 `passes` is that control's knob and not
      the rule's" and ":504 The deployed rule passes it on unset, and no guard sets it."

      Re-derived: true today. `grep -n "passes=" tests/test_guard_integrity.py` returns exactly
      six hits, all inside `test_the_settling_loop_runs_to_a_fixpoint_and_not_to_a_count`; the
      deployed rule's own call is `_executed_names(tree, executors, passes)` with `passes=None`.

      What has no control is the claim's persistence. A guard call site that later passed
      `passes=3` - `test_no_guarded_source_invokes_the_check_log_subcommand`, the real-tree
      exemption test - would narrow the deployed rule back to the exact depth bound this cycle
      removed, and every control in the file would stay green: the fixpoint test calls the
      function with its own explicit arguments, so it measures the mechanism rather than the
      configuration the guard runs it under. The file already has the machinery to pin this -
      `test_the_invocation_rule_is_the_one_the_guard_runs` reads this module's own `ast` to pin
      three adjacent claims of exactly this shape (the taint step runs inside the rule, no test
      calls the helpers directly, every declared `EXEMPT_*` key is branched on).

      This is the third instance of one exposure rather than a new one: `exemptions=` and
      `executors=` have carried it since 3668c70 and cycle 1 did not raise it, which is why this
      is Minor and not a re-opening of F-001.
    suggestion: |
      One assertion in the existing AC-4 pin: in `TestCheckLog_TheDeliberateReader`, no call to
      `_check_log_invocations` outside the per-knob control tests may pass a keyword argument -
      so narrowing a width at a guard call site is a failing test rather than a silent narrowing.
      Alternatively record it as a sweep G row, which is this board's other legal answer.
