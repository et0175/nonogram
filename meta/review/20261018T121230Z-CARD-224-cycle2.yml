production_geometry_change:
  verdict: >
    Characterised correctly and, within the stored and reachable geometry, safe. The one
    unsafe direction is F2-001.
  a_no_stored_page_moves:
    status: confirmed-but-near-vacuous
    how: >
      Enumerated through the real recorders with _placed_drawing_top instrumented: the
      baseline book makes exactly 33 placement calls and the proof recording 81 (9 placed
      drawings on each of the 9 trims, not 9 in total). 0 of 114 differ in verdict or row
      between the shipped and the retired condition, which is why neither fixture was
      re-recorded - and book_baseline_card224.json is indeed absent from the fix commit while
      proof_baseline_card224.json is +39/-0.
      The corpus is not representative of the change, and the statement should not be read as
      evidence of safety: all 114 stored placements are in the "ratio" branch, none within
      10x of the threshold for the book (min spare 267 px, 19x the 14.29 px threshold) and
      none within 2x for the proof sheets (min spare 43 px, 3x). "No stored page moves" would
      have held for almost any threshold the fix could have picked, and the two fixtures give
      the degraded branch zero coverage.
  b_all_28_omit_their_footer_group:
    status: confirmed-exactly
    how: >
      Reproduced independently: five sheets (the AC-3 sweep's four plus the 160 mm trim
      AC-4 uses) x 11,028 placements = 55,140; 28 disagreements, every one of them ratio ->
      footer; spare 12.405..14.143 px; move +12 or +13 px; vertical_bound "footer" on all 28;
      qr_slot(layout) is None on all 28, 0 exceptions; drawing_bottom exceeds area_bottom by
      4-5 px on all 28, which is what makes the renderer's all-or-nothing footer condition
      refuse the group. Per sheet: six-by-nine 9, the 100 mm trim 7, the 160 mm trim 12,
      Book 1 at both parities 0.
      Caveat on the framing: 28 is the count for those five sheets, not a bound on the
      admissible space. A 216 x 180 mm sheet alone yields 90 disagreements (216x240 yields 14,
      216x200 yields 6); qr_slot is None on every one of those too, so the property holds,
      but "28 placements" should not be quoted as the size of the change.
  c_interactions:
    caption_slot: >
      No interaction. The guard is _draw_solved_slot's slack >= gap_px + line_height = 73 px;
      over all 28 moved placements the smallest slack is 348 px, and 0 captions are newly
      omitted. caption_slot itself is horizontal-only.
    two_up_and_packed: >
      Unreachable. _placed_drawing_top has exactly one call site in layout.py (inside
      compute_layout); _slot_layout and _packed_tile_layout pass vertical_bound="slot" as a
      literal. Pairing verdicts and the committed cell cannot change.
    proof_pages: 0 of 81 placements change.
    direction_of_move: >
      The fix's "down 12-13 px" is right and worth recording, because it is counter-intuitive:
      on a 12-14 px spare, 42% of it is only 5.3-5.9 px while the band's lift is ~17.7 px, so
      the band's foot is the LOWER of the two rows and refusing the ratio pushes the drawing
      DOWN past the footer rule. The docstring says exactly this ("in (iii) the band's foot is
      the lower of the two rows"). Measured: old_top 294/295 -> new_top 307 == band_bottom.
  d_band_mm_margin:
    status: not-acceptable-as-left
    how: >
      Every figure the fix states is right (lift 17.717 px, threshold 14.286 px, headroom
      3.431 px against 5.717 px before, flip at 9.676 mm against 8.128 mm). The judgement is
      that 3.4 px is not the whole story: the flip point moved outward, so the fix enlarged
      the unsafe range and populated it - 19 new defective pages at band_mm 8.5/9.0 mm where
      the retired condition had none. The new assertion that pins the coupling is sound as far
      as it goes (it kills the 1/16 lift mutant) but it pins one sheet at band_mm 12.0 taken
      from the test module's own literal, so it is a tripwire on an arithmetic claim and not on
      the property. See F2-001.

figure_corrections_adjudicated:
  - id: 1
    subject: F-007's 112 px vs the fix's 113 px
    ruling: the fix is right, and the review was repeating an unverified docstring
    how: >
      Measured: on tests/test_layout_two_up.py's own BOOK1_ODD the gap between the single
      page's drawing_top and the upper slot's is 113 px, and the test asserting it passes. The
      retired docstring's 112 was two errors at once: it was the FLOAT (0.42 x spare = 112.14
      px), not the inter-row gap, and it was computed on CON-018 as amended - a profile that
      module does not use. On the amended profile the gap is 94 px, which is what the PDF-level
      sibling pins. Cycle 1's substantive point (the figure was promised and not measured) was
      correct; its number was not. Residual: F2-008.
  - id: 2
    subject: F-008's "8.1 mm" - whose bound it is
    ruling: the fix is right on both counts
    how: >
      Derived independently. The sweep's footer-branch predicate is ink_bottom > area_bottom,
      which includes the drawing's own ceil(thick/2) = 3 px overhang, so it survives while
      lift + 3 > threshold; qr_slot's predicate is drawing_bottom > area_bottom and has no
      overhang, so it needs lift > threshold. With threshold 12 px (retired) that is band_mm >
      6.096 mm and > 8.128 mm; with 14.286 px (shipped) it is > 7.65 mm and > 9.676 mm. The
      binding one - the first to break as the band shrinks - is qr_slot's. So cycle 1's "at a
      band under 8.1 mm ... both fail" was wrong about "both": between 6.1 and 8.13 mm only
      qr_slot's assertion failed. The fix's retired pair (6.1 / 8.13) and new pair
      (7.65 / 9.68) both reproduce.
  - id: 3
    subject: the "126 (trim, extent) pairs" count
    ruling: no one is reproducibly right; the phenomenon is, and that is what matters
    how: >
      My own scan (Book 1's width, heights 100..300 mm in 1 mm steps, extents 5..15, every
      depth, cell_cap=18.0) finds 8 violating (trim, extent) pairs under the retired condition
      and 0 under the shipped one. The fix's coarser scan found 4; cycle 1 claimed 126. All
      three are different search spaces and none of the three published its parameters fully
      enough to reproduce, so the count is not a fact about the code - the direction is, and
      all three agree on it. The fix's handling (flag its own 4, decline to doubt the 126) is
      the right call; cycle 1's 126 should not be carried forward as a figure.
  - id: 4
    subject: the fix's addition - the AC-3 sweep's _clears could not have seen cycle 1's margins
    ruling: the fix is right, and leaving _clears alone is the right call, but not silently
    how: >
      Confirmed by reading the predicate and by measurement: _clears compares against the
      rules' rows, and the worst ink-vs-ROW margin over the swept corpus is 3.984 px against a
      worst ink-vs-INK margin of 3.000 px, so the sweep has a 1 px blind spot and cycle 1's
      0.555 px was never in its reach. Leaving it is defensible because the new condition makes
      the ink-vs-ink margin >= 1 px by arithmetic and the threshold test pins the arithmetic -
      I verified the inequality holds over the whole admissible space. What is not defensible is
      that the blind spot is undocumented at the site and that the class docstring asserts the
      opposite. See F2-003.

