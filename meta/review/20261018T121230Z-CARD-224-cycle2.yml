summary: >
  Both of cycle 1's importants are closed, and F-001 is closed in substance and not only in
  prose: measured over the FULL admissible space (extents 5..40 on both axes, every clue
  depth, 11,028 placements per parity) the worst clearance between the drawing's outermost
  ink and the header rule's outermost ink rose from cycle 1's 0.659 px to 3 px, and the
  cell_cap=18.0 mm defect class is gone (my own scan: 8 violating (trim, extent) pairs
  under the retired condition, 0 under the shipped one). The production-geometry change is
  characterised exactly: I reproduced 55,140 placements, 28 disagreements, spare
  12.405..14.143 px, 12-13 px of downward move, and qr_slot(...) is None on all 28 with no
  exceptions. The one new important is the other side of the same coin: the threshold moved
  outward, so the `band_mm` window in which a degraded page keeps a drawn footer rule grew
  from < 8.13 mm to < 9.68 mm, and at band_mm 8.5/9.0 mm the shipped condition produces
  pages whose ink crosses a footer rule that IS stroked where the retired condition produced
  none. Unreachable through the only stored PrintProfile - exactly the reachability status
  the fix used to justify F-001's own correction, which is why it is reported rather than
  waved past.

findings:

  - id: F2-001
    severity: important
    file: src/nonogram/export/layout.py
    line: 2575
    claim: >
      The fix's own account of the risk it introduced: "the fix states its own change
      narrows the band_mm coupling margin from 5.7 px to 3.4 px of headroom (17.72 px lift
      against a 14.29 px threshold)", and
      test_a_positive_spare_too_small_to_clear_the_rule_also_reports_footer's docstring:
      "below about 9.7 mm the inequality flips ... No stored profile is near it, so the
      coupling is pinned here rather than designed away." book_pdf_generator._draw_page_frame
      still states the placement and the renderer "agree by construction, which is what makes
      'no drawing ink crosses a rule that is drawn' true of every page".
    evidence: >
      The arithmetic checks out (lift = band_px/8 = 17.717 px at 12 mm; clearance = 6;
      threshold = 6/0.42 = 14.286; headroom 3.431 px, against 5.717 px under the retired
      12 px threshold), but the consequence is understated. The flip point for band_mm moved
      OUTWARD with the threshold, from 8.128 mm to 9.676 mm, so the fix did not merely narrow
      a margin - it enlarged the unsafe band_mm range by 1.55 mm, and that new strip is
      populated. Demonstrated, and independently re-run by me from the fix's own modules:
      PageSpec(width_mm=215.9, height_mm=160.0, top_mm=13.97, bottom_mm=11.938,
      gutter_mm=outside_mm=12.7, band_mm=9.0, cell_cap=7.5, min_thin_rule_mm=0.25,
      parity=ODD) with a 23x9 grid behind 5-deep gutters gives, on the shipped condition,
      vertical_bound="footer", drawing held at the band foot (row 271), drawing_bottom =
      1396 == area_bottom = 1396, so qr_slot(layout) is NOT None and the whole footer group
      is drawn - while the drawing's ink_bottom is 1399, three rows past the footer rule's
      own row. EC-022's "no drawing or clue ink crosses either rule" is violated on a page
      that strokes the rule. The retired condition on the same page returns "ratio" with
      drawing_bottom 1388 / ink_bottom 1391, five rows clear: no violation.
      Counted over five trim heights (160/200/240/279.4/300 mm) x extents 5..40 x two depth
      patterns: at band_mm 8.5 the shipped condition yields 2 such pages and the retired one
      0; at 9.0 it yields 17 and the retired one 0. Below ~8.13 mm the class is pre-existing
      (7 vs 2 at 8.0 mm). At 9.5 mm and above neither yields any.
      Two consequences for the claims as written:
      (a) "_draw_page_frame ... they agree by construction" is false for band_mm < 9.68 mm.
      What makes them agree is the value of a PrintProfile field, not the construction - the
      renderer decides from a pixel and the placement from a verdict, and this is precisely
      the case where the two disagree. The fix added the coupling sentence to that docstring
      and left "by construction" standing next to it.
      (b) Nothing in the suite can catch it. The new coupling test asserts lift > threshold
      on one sheet whose band_mm is the test module's own literal 12.0 (tests/
      test_book_puzzle_frame.py's BAND_MM), not BOOK1_PROFILE.band_mm; the AC-3 sweep's four
      sheets all carry band_mm 12.0; the only module that varies band_mm at all,
      tests/property/test_book_layout.py, asserts drawing_top's row and never qr_slot or the
      footer rule. An owner lowering BOOK1_PROFILE.band_mm to 9 mm would red exactly one
      test - tests/test_book_page_spec.py:396, which pins the constant - and would be told
      nothing about the footer rule.
    suggested_fix: >
      Make the degraded placement safe rather than coincidentally safe: hold the drawing at
      max(band_bottom, area_bottom - drawing_height + 1) so the degraded row is never ABOVE
      the footer rule while the footer group is drawn, or refuse the ratio only down to the
      lift and return the third verdict below it. Failing that, replace "agree by
      construction" with the inequality it actually rests on, and add one shallow-band sheet
      (band_mm 9.0) to the AC-3 sweep so the footer branch is swept where the coupling bites
      - the sweep's two footer-branch assertions are exactly the two that fail on the case
      above.

  - id: F2-002
    severity: minor
    file: tests/test_book_puzzle_frame.py
    line: 2230
    claim: >
      AC-3's claim, narrowed per the reviewer's instruction: "the sweep below covers extents
      10..30 in steps of 2 on both axes at two clue-depth patterns on four sheets, which is
      484 cases and not the admissible space."
    evidence: >
      The narrowing is otherwise accurate (CON-011 does admit 5..40; the odd extents and
      every other stored trim really are unswept), but the case count is wrong by a factor
      of two and the module says so itself: the loop's own guard is
      `assert checked >= 4 * 11 * 11 * 2`, i.e. 968, and I instrumented the loop - it runs
