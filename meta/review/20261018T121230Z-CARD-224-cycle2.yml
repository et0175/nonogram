settled_from_cycle_1:

  - id: F-001
    status: closed
    how: >
      The condition now tests each gap. Substance verified three ways, none of them a rerun
      of the implementer's own script.
      (1) Full admissible space, not the swept corner: extents 5..40 x 5..40, every clue
      depth 1..(min+1)//2, Book 1 at both parities - 11,028 placements each. Zero violations
      of either rule's INK, and the worst header ink margin is 3 px (at 18x21 depth 9),
      against cycle 1's 0.659 px at 39x35. Worst footer ink margin 7 px. Every non-ratio
      placement has qr_slot(...) is None.
      (2) The cell_cap=18.0 mm class cycle 1 named: Book 1's width, trim heights 100..300 mm,
      extents 5..15, all depths (11,658 cases). Reimplementing the retired condition
      alongside the shipped one, 8 (trim, extent) pairs put ratio-branch ink on the header
      rule's ink under `spare < 2 * clearance` and 0 do under the shipped condition - at a
      heavy rule of 14 px the shipped worst margin is still 3 px.
      (3) Mutation: cycle 1's surviving M5 is dead. `spare < 2 * clearance`,
      `gap_below < clearance` alone, `spare <= 0` and `clearance ... + 0` are all killed, each
      by test_the_clearance_threshold_is_the_gap_above_and_not_half_the_spare.
      The test itself is sound rather than lucky: the straddle grid is width-bound (the cell
      is 193.675/28 = 6.917 mm, below the 7.5 mm cap), so the drawing's height is constant
      across the 41 trim heights and the spare is strictly monotone in height - exactly one
      flip is guaranteed if the boundary is interior, and the test asserts >= 15 cases of each
      verdict and that both verdicts occur, so a degenerate sweep cannot satisfy it. The
      clearance is derived in the test from 0.6 pt / 0.4 pt written out plus the layout's own
      committed thick_rule, not imported. The positive-spare assertion on the refused case is
      real (it is what kills the `spare <= 0` mutant).
      Residuals: the strictness pixel is unpinned (F2-006) and the gap_below disjunct is
      unreachable (F2-006); the new threshold's far side is F2-001.

  - id: F-002
    status: closed
    how: >
      The class now carries WIDE_GUTTER_MM 20.0 / NARROW_OUTSIDE_MM 10.0 with its own
      _unequal_pages/_unequal_expected_left_mm, the inequality is restored in
      test_it_is_not_the_left_hand_page_a_miscount_would_give_it on that book, each of the two
