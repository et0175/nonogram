      "7 passed": every test in both re-aimed classes survived the miscount before this fix.
      book_page_spec.py is in none of the four commits (`git show --name-only 85b6e45` and
      `git diff --name-only cc4430b..HEAD`), and the file was restored from a pre-mutation
      copy with `git status` clean.
      Bonus: F-006's new premise kills the same mutant
      (TestBookPdf_ParityNeverMovesTopEdge::test_the_two_drawings_share_a_top_pixel_row
      failed, as did test_book_pdf_memory's parity test), so the two findings close together.

