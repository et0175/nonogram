    suggested_fix: 968 in all three places, or state it as "4 sheets x 121 extents x 2 depths".

  - id: F2-003
    severity: minor
    file: tests/test_book_puzzle_frame.py
    line: 2288
    claim: >
      `_clears` - "whether a drawing whose ink runs ink_top_mm..ink_bottom_mm touches
      neither rule of the puzzle area", "the one predicate the sweep and its control both
      use"; and the class docstring: "The drawing's ink, not its boundary, is what clears:
      every rule in it is stroked centred on its boundary, so the box grows by half a heavy
      rule at each end, and the furniture rules spread about their own rows the same way."
    evidence: >
      `_clears` compares the drawing's ink against `_puzzle_area_mm`'s two values, which are
      the furniture rules' own ROWS, not their ink extents. The header rule is 3 px and
      stroked centred on its row, so its ink reaches one row below area_top: a drawing whose
      ink sits on the rule's ink still satisfies `area_top < ink_top_mm`. The sweep therefore
      cannot see a one-pixel violation in either direction, which is exactly what cycle 1's
      0.555/0.659 px measurements were - the fix says this in its report and is right.
      Measured on the shipped tree over the swept corpus: worst ink-vs-ROW margin (what
      `_clears` checks) 3.984 px, worst ink-vs-INK margin (what AC-3 claims) 3.000 px - a
      1 px blind spot. Leaving `_clears` alone is the right call now, because the new
      condition makes the ink-vs-ink margin >= 1 px by arithmetic
      (gap_above >= ceil(thick/2) + ceil(furniture/2) + 1 > ceil(thick/2) + furniture//2),
      and the threshold test pins that arithmetic. What is wrong is that neither the
      predicate's docstring nor the class's says so, and the class's sentence about the
      furniture rules spreading "the same way" asserts the opposite - a reader is told the
      comparison accounts for a spread it does not account for. The control test's docstring
      ("rejects a drawing whose ink reaches either rule") repeats it.
    suggested_fix: >
      One sentence on `_clears` naming the row-vs-ink distinction, why it is tolerable
      (the arithmetic now guarantees >= 1 px, pinned by the threshold test) and what it
      cannot see; and strike the misleading half of the class docstring's sentence.

