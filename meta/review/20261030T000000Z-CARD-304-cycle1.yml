      totals) is the pytest-reported session time.
    why_it_matters: "R4's domain clause, self-applied: two readings of the same quantity differ by ~1 s and the paragraph mixes them without saying so. The paragraph's conclusion is unaffected."
    fix: "Say 'wall' (or quote the session range 2.7–3.4 s) in the paragraph."

