      rather than prescriptions in a tracked file.
    fix: "Retitle to 'Instruments that are not written down as prescriptions'."
  - id: F-011
    severity: low
    confidence: measured
    title: "The class's cost figure (3.74–4.03 s) does not declare which reading it is."
    where: "tests/test_suite_profile.py — module docstring"
    measured: >-
      Five runs of the class alone: pytest-reported 2.72, 2.95, 3.01, 3.20, 3.40 s;
      wall 3.73, 3.80, 3.87 s. The card's figure matches WALL, i.e. it includes
