score_rationale: >-
  8. Every acceptance criterion lands and was verified by measurement rather than
  read. The card's central claim — that the prescribed awk instrument is already
  correct, with controls — was reproduced here by an independent implementation and
  holds in all six realizable cases. The two-harness split, which the brief asked
  to be tested for decorativeness, is necessary and orthogonal in both directions,
  each proved with a constructed witness. The novel result (zsh execs its last
  command, so three negative controls were passing vacuously) is real, correctly
  diagnosed, and its fix reds under mutation.
  Against that: F-001 leaves the same vacuity in the one case the round itself
  added, and two tracked files — including ADR-0039/R4's REACH comment now on
  main's path — assert a control that does not execute. F-002 leaves the card's
  newest instrument without the control its sibling got. F-003, F-004, F-008 and
  F-011 are four more figures in the record that this review measured to be wrong
  or overstated, in a card whose subject is figures measured wrong. None blocks an
  AC and all are small edits, but six inaccuracies in the record of THIS card is a
  pattern rather than a nitpick, and that is what separates 8 from 9.
  F-001 is a three-line change and is recommended before merge: it is the only
  finding that makes a committed ADR sentence untrue.
