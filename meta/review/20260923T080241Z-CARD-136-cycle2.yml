findings:
  - id: F-101
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/app.py
    line: 2221
    title: "An empty or absent trim field in cm mode silently overwrites the stored trim with the Book 1 profile and flashes success"
    description: |
      In centimetre mode the route passes the raw form value straight through
      (app.py:2221-2222, `width_cm = width_input`). `PrintSpecValidator.create_spec`
      then applies `width_cm = width_cm or DEFAULT_TRIM_WIDTH_CM` (print_specs.py:155-156),
      so an empty string and a missing field are both indistinguishable from
      "the owner asked for the Book 1 profile". Before this card that only produced a
      display string; now it is written to the two print columns the PDF's page size and
      every cell measurement are taken from.

      Reproduced end to end through the real route on this working tree (memory mode,
      /private/tmp/.../scratchpad/probe.py):
        POST unit=cm width=15.24 height=22.86   -> stored ('15.24', '22.86')
        POST unit=cm width=""    height=22.86   -> 302 to /select-puzzles,
                                                   stored ('21.59', '22.86')
        POST unit=cm (no width/height keys)     -> 302 to /select-puzzles,
                                                   stored ('21.59', '27.94')
      Both submissions flash "Print specs set: ... cm" and redirect on to puzzle
      selection; the owner's chosen trim is gone and nothing says so.

      The inches branch refuses exactly the same input — `_submitted_trim_cm("", stored)`
      falls through to `inches_to_cm("")`, which raises ValueError and the route reports
      "Error: Invalid inch value:" (probed: 200, columns unchanged). So the two units
      disagree about what an empty trim field means, which is what marks this as
      unintended rather than a policy.

      This is not a fix-round regression — the cm branch is unchanged by the fix delta —
      but it is the same defect class the fix round just closed one layer down: cycle 1's
      F-001 made `set_print_spec` refuse a value the reader could not read back, on the
      stated ground that "no caller's assurance substitutes for that check"; the route
      still converts an absent value into a silent, valid-looking profile write before
      that check can see it. The HTML `required` attribute on both inputs
      (book_setup_print.html:45-46,54-55) keeps a normal browser out of this path, so
      there is no live defect for the owner today — the cost is the same as F-001's:
      the storage boundary the card exists to make authoritative accepts a submission
      that loses the value of record, and nothing in the 78-case file covers it.
    suggestion: |
      Refuse an empty/absent trim field in the route rather than defaulting it: treat
      `width_input`/`height_input` in ("", None) as an error ("Trim width is required")
      before create_spec is called, in both unit branches, so cm and inches behave the
      same. (Changing `create_spec`'s `or DEFAULT` is the wrong lever — its defaulting is
      what a genuinely trim-less caller wants.) Add the missing negative cases to
      tests/test_book_trim_persistence.py: a POST with width="" and a POST with no
      width/height keys, both asserting the stored columns are untouched and no success
      flash, in both storage modes.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2280
    title: "Endorsed residual: the plan and the trim still commit in two DB transactions"
    description: |
      The fix round resolved the ignored-return half of cycle 1's F-004 (verified: a book
      deleted from inside the writer call now yields 302 to /books with exactly one flash,
      ('error', 'Book not found'), and no success message). The declared residual stands:
      in DB mode save_plan (book_manager.py:643-651) and set_print_spec (:726-745) commit
      in two separate sessions, so a failure between the commits can leave the plan stored
      and the trim not.

      Reviewer's verdict on that owner-visible choice: ACCEPTABLE for this card, and this
      finding exists to keep it visible rather than to block it. Grounds — (a) AC-197's
      actual rule is about a *refused* submission, and that is fully honoured: both the
      plan check and create_spec precede either write; (b) the half-applied state persists
      nothing unreadable or invalid — the book simply keeps its previous, valid trim, and
      the owner is told "Book not found" rather than "saved"; (c) no INV-005..INV-013
      invariant spans the two writes; (d) the state is self-healing — reopening Print setup
      and pressing Save stores the trim; (e) the admin panel is a single-owner loopback
      surface (CON-015) with no concurrent writer, so the window needs a mid-request DB
      failure, not a race.
    suggestion: |
      Leave as is for CARD-136. If the window ever matters, the follow-up is one
      BookManager writer that sets the plan and the trim inside a single session, called
      once from setup_print — the card's Worktree notes already record this.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-103
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2113
    title: "_submitted_trim_cm's docstring says \"the exact string the page rendered\" but the code compares against the stored trim"
    description: |
      The helper's discriminator is `cm_to_inches(stored_cm) == str(submitted_inches).strip()`
      (app.py:2125) — the inch form of the *stored* trim, not of whatever the page last
      rendered. The two coincide on a prefill-from-storage render, which is the case the
      docstring describes, but not after a refused submission, where the fields carry the
      owner's own entries back (app.py:2331-2333). In that state an unchanged resubmission
      is converted rather than kept. That outcome is correct (relative to storage it *is*
      an edit), so this is a precision problem in the declared contract, not a behaviour
      bug — but the declared design change is exactly the thing a later cycle re-reads, and
      it should describe what the code does.

      The second-meaning cost itself is real and correctly bounded: an owner who
      deliberately types the rendered inch string wanting its exact centimetre value gets
      the stored one instead (15.00 cm rather than 15.01 cm for "5.91"). At <= 0.1 mm on a
      trim KDP wants exact, keeping the stored value is the better of the two readings;
      the alternative (a tolerance window) would swallow a deliberate one-step edit, as the
      docstring argues. Verified: untouched inches save keeps ('15.00','20.00') across five
      round trips, a real edit to 6/9 still stores ('15.24','22.86'), and one edited field
      converts while the other is kept.
    suggestion: |
      Reword to "the inch form of the stored trim — the string a prefill renders into the
      field", and note the refused-submission case explicitly.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-104
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2327
    title: "The cm downgrade does not rewrite the session, so correcting an unreadable trim silently drops the inches preference"
    description: |
      The F-003 fix sets the local `unit_preference = "cm"` without touching
      `session["unit_preference"]` (verified: after the downgraded GET the session still
      reads "inches" while the page renders cm radio + "cm"/"cm" suffixes). That is the
      right call for the render — it is a per-request fact, not a preference change — but
      the consequence is that the correcting submission from that page carries unit="cm"
      and line 2184 then overwrites the session with "cm". An owner who worked in inches,
      hit a book with an unreadable column, and corrected it comes out of the flow in
      centimetres, with nothing said.

      Impact is cosmetic and the state is self-consistent at every step (the page, the
      radio, the two suffixes and the reading of the next submission all agree — confirmed
      by TestBookTrim_ThePageCarriesOneUnit in both storage modes). Noted because it is the
      one loose end of the declared "unit_preference is now the unit the PAGE is in"
      design change.
    suggestion: |
      Either accept and say so in the docstring (one sentence: the correcting save adopts
      the page's unit), or restore the remembered unit by rendering a hidden field with the
      session's unit and only overwriting the session when the radio was actually the
      owner's choice.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
