findings:
  - id: F-7
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/export/layout.py
    line: 2072
    title: "Fix 3 reintroduces the exact 100%-of-two-up-pages folio loss the owner's Fix-1 decision ('Reserve folio room') was built to prevent — not a rare, pair-dependent degradation as the fix's own commit message and docstrings claim"
    description: |
      This card's own implementation-pass notes (meta/kanban/cards/CARD-204.md,
      lines 448-466, written BEFORE Fix 1 ever existed) already proved, in
      the project's own words: "CARD-200's page-number folio is now
      permanently omitted on every two-up page, on both parities, for
      every puzzle — not just a tight-fit one. Under reading (b),
      drawing_right == usable_right exactly on every ODD (right-hand) page
      and drawing_left == usable_left exactly on every EVEN one,
      algebraically, regardless of the puzzle's own spare... this is a
      real, visible, permanent loss of a shipped feature (the page
      number) on every two-up page of every book." That exact finding is
      why the owner was explicitly consulted and decided "Reserve folio
      room" (Fix 1, CARD-204.md:536-541) — a decision this review's cycle
      1/2 history treated as settled and out of scope.

      Fix 3 (this cycle's subject) deletes the entire reserve mechanism
      from compute_pair_layout/_slot_layout to resolve F-5's INV-010
      violation. That resolution is correct and independently verified
      (see the system_contract INV-010/G-5 lines above). But removing the
      reserve also removes the only thing that was buying the folio its
      horizontal room — and the underlying geometry fact the card's own
      pre-Fix-1 notes already proved has not changed: the right-alignment
      ("reading (b)") flush formula in _slot_layout pins the lower slot's
      OUTER-corner edge exactly to usable_right (ODD/right-hand page) or
      usable_left (EVEN/left-hand page), with the formula's entire natural
      "spare" always landing on the GUTTER side instead, regardless of
      either puzzle's own width. This is not a docstring assumption — I
      verified it directly against the live code with a deliberately
      asymmetric pair (upper 25 columns, lower 10 columns — clearly NOT
      tied as the pair's width-binding member):

        ODD page:  lower.drawing_left=1470, usable_left=150  (gutter-side gap=1320)
                   lower.drawing_right=2438, usable_right=2438 (OUTER gap=0)
        EVEN page: lower.drawing_left=113,  usable_left=113   (OUTER gap=0)
                   lower.drawing_right=1080, usable_right=2400 (gutter-side gap=1320)

      The outer-corner gap is exactly 0 in both parities, even though the
      lower slot is far narrower than the pair's own binding ("across")
      member. This directly contradicts _slot_layout's own docstring
      (export/layout.py:2072-2077, NEW text written by this same Fix-3
      commit): "spare is deliberately not forced to 0: when the lower
      slot is narrower than the pair's own width-binding ('across')
      member, spare is positive and the drawing sits short of the outer
      edge on its own" — this sentence is false for the actual formula
      (the "+spare" term only ever appears on the gutter side of the
      anchor, never the outer side, in either parity arm of the ternary
      at lines 2110-2114). The same mischaracterization is repeated in
      book_pdf_generator.py's _two_up_page docstring (lines 3538-3544:
      "the folio draws when that natural slack is enough and is correctly
      omitted, page by page, when it is not — a page-local degradation")
      and in the Fix-3 commit message itself ("Losing the folio on some
      two-up pages with tight natural slack is an accepted, page-local
      degradation, never a pairing-time one").

      The project's OWN new regression test, written in this same commit,
      correctly states the opposite of the mischaracterization above:
      tests/test_book_page_numbers.py's
      test_two_up_page_s_folio_is_once_again_always_omitted (lines
      542-573) says in its own docstring: "the lower slot's drawing is
      flush with the usable area's outer margin by construction, ON EVERY
      PARITY, WHATEVER THE PUZZLE'S OWN EXTENT... which made
      _draw_folio's 'omit rather than collide' check fire on every
      two-up page." This is the correct statement, and it directly
      contradicts the "pair-dependent"/"varies pair-to-pair" framing used
      everywhere else in this same fix to justify the trade as minor and
      accepted.

      The corpus-wide AC-1 test was weakened to hide this: at
      tests/test_book_page_numbers.py:170-172,
      TestBookPageNumbers_EveryInteriorPageShowsItsOwnNumber's own
      assertion changed from "every interior page carries a folio" to
      "every interior page except the [hardcoded] two-up page carries a
      folio" — which only works because this particular baseline book has
      exactly one two-up page. CARD-200's own AC-1 (meta/kanban/cards/
      CARD-200.md:181-186) states the ONLY exception is "a page whose
      bottom slack is too small to fit one line" — a vertical-only
      exception. It does not say "every two-up page, unconditionally,"
      which is what the code now does. A real book with several same-tier
      adjacent pairs (the common case this card's own INV-010 pairing
      exists to produce) loses the page number from every one of those
      pages — not an edge case, the default outcome for the entire page
      kind.

      Unlike F-4 (the FR-032 text gap), which this card explicitly routed
      to architect-station for an owner/model decision, this regression
      was not routed anywhere: it is asserted as "accepted" in prose by
      the same commit that (demonstrably, in its own second docstring)
      knows the claim is not pair-dependent. The owner who explicitly
      decided "Reserve folio room" at Fix 1 has not been asked whether
      removing that room again, permanently, is acceptable.
    suggestion: |
      This needs the owner's explicit re-decision, the same way Fix 1's
      original owner decision was obtained — do not resolve it in prose
      inside a worktree note a second time. Two honest paths, both
      requiring sign-off before merge:
        (a) Reposition the folio (not the pairing/cell-size decision) —
            e.g. draw it at the gutter-side corner on two-up pages only,
            where this fix's own geometry now guarantees real slack
            collects, as CARD-204.md:463-466 already flagged as the
            available fix back when this was first discovered, pre-Fix-1;
            or
        (b) Get the owner to explicitly accept the universal loss (update
            CARD-200's AC-1 to carve out two-up pages by name, not by
            page-number coincidence, and get a sign-off comparable to
            Fix 1's own "Reserve folio room" decision record).
      Either way, fix the two self-contradicting docstrings
      (export/layout.py:2072-2077, book_pdf_generator.py:3538-3544) so
      they stop claiming pair-dependent variability the code does not
      have — a future reader trusting either docstring will reach the
      same wrong conclusion this fix's own commit message did.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

