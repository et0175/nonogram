findings:
  - id: F-001
    severity: high
    category: correctness
    type: gap
    gating: true
    file: tests/test_book_interior_type_floor.py
    line: 429
    title: "The clue-digit refusal is keyed on `puzzle` alone -- the exempt sub-floor faces live on TWO page kinds, and the vector ANSWER writer draws them"
    description: |
      stream_faces refuses a vector page with
      `assert kind.value != "puzzle"`. The card, requirements.yml's new CON-020
      comment and the ADR's new R6 comment all describe the subject as "a vector
      puzzle page" and "205 Tf operands".

      MEASURED, on this HEAD, by instrumenting the file's OWN spy recording and
      joining each call to its page's PageKind (probe run in the scratch copy of
      HEAD, not in the worktree):

        exempt faces by (page kind, pt)
          ('answer', 10.56): 64     ('answer', 8.64): 258
          ('puzzle', 13.20): 118    ('puzzle', 8.64): 204

        sub-floor faces by (page kind, spy kind, exempt, pt)
          ('answer', 'other', True, 8.64): 258
          ('puzzle', 'other', True, 8.64): 204

      So 258 of the 462 exempt sub-floor faces are on ANSWER pages, drawn by
      `('nonogram.admin.book_pdf_generator', '_write_clues')` -- an EXEMPT_CALLER --
      322 times per book. And the vector answer writer draws them too:
      src/nonogram/admin/book_answer_vector.py:403 calls
      `draw_clue_digits(stream, slot, face, grey=grey)`.

      Consequence: the day PageKind.ANSWER's raster declaration is lifted,
      stream_faces does NOT refuse the page -- it reads it, and
      below_floor_in_its_medium reports 258 faces at 8.64 pt as CON-020
      violations. StreamFace has no `exempt` concept at all, so nothing filters
      them. That is exactly the "205 false violations" failure mode the puzzle
      refusal was written to avoid, on the larger half of the same subject.

      This is the card's own standard turned on its own work: it refused item 4
      because a guard derived from a wrong enumeration is worse than no guard,
      and then keyed its one shipped exemption-refusal on an enumeration it did
      not measure.
    reproduction: >-
      git archive HEAD into a scratch tree (asserted to import its own src);
      add a probe module that calls
      tests.test_book_interior_type_floor.recording("book1", arial=True) and
      _pages_by_kind("book1"), groups the calls with `c.exempt` and
      `c.points < FLOOR_PT` by page kind, and prints them; run with
      -o addopts='' -p no:randomly -s. Independently:
