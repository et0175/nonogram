    refusal is keyed on is incomplete, and that is F-001, this cycle's gating finding.
  4_was_item_4s_refusal_justified: >-
    YES, and I re-derived THREE of its four measurements independently rather than the
    one the brief asked for. See refusal_re_derivation below. The strongest argument --
    "an idiom count cannot express that the set is empty" -- is SOUND, and I measured
