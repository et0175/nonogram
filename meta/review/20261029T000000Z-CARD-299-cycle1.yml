answers_to_the_brief:
  1_is_the_medium_gating_sound: >-
    MOSTLY YES, with one structural hole (F-002). Soundness, point by point:
    (a) THE STREAM ARM IS GENUINELY REACHABLE AND `pages=None` REALLY IS THE
    DISCRIMINATOR. I verified the cleverest claim in the diff directly: with
    _RASTER_DECLARATIONS[TITLE] lifted, I forced pdf_vector.page_media to return
    [RASTER] and called _title_page_is_blank(data, None, ...) -- it raises TypeError,
    because the bitmap arm's first act is pages[0].convert("L"). So a helper that fell
    through to the bitmap arm cannot pass with pages=None. The claim is not faked.
    In the floor module the discriminator is `len(asked) == 1` over a wrapper around
    pdf_vector.type_sizes, which an unreached arm would leave empty; also genuine.
    (b) THE TWO ARMS CANNOT DISAGREE DESTRUCTIVELY ON THE FLOOR, because
    below_floor_in_its_medium is a UNION -- a sub-floor face found by either arm fails
    the assertion. The coverage function is also a union, which is permissive, but in
    the right direction (a kind that letters in either medium counts as covered).
    (c) ON A MIXED-MEDIUM INTERIOR -- what CARD-309 will produce -- the floor module
    survives (it goes to export_interior/page_media/content_streams directly), but
    tests/property/test_book_export_interior.py DOES NOT: see F-002. The guide arm
    fails by name (I drove it; AssertionError naming the missing writer), which is the
    behaviour ADR-0039/R2 asks for. The puzzle page fails loudly (F-001's subject).
    (d) _UNCLASSIFIABLE IS A REAL THIRD BRANCH, not a fallback, and I did not take it
    on trust. It is driven on REAL PDFs -- not monkeypatched -- at
    tests/test_book_pdf.py:2318-2319, where a page naming both /XObject and /Font and
    a page naming neither both classify UNCLASSIFIABLE, and that test now exercises
    the moved pdf_vector.page_media through the delegation. The branch's own new
    unclassifiable tests are monkeypatched, but the real-page proof exists beside them.
  2_did_the_non_vacuity_floor_survive_in_full: >-
    SUBSTANTIALLY YES -- the semantic vocabulary is carried across unchanged and its
    mutant reds (M-1, reproduced). The medium-independent vocabulary is NOT COMPLETE
    in the sense ADR-0039/R2 means: see F-003. LETTERING_KINDS is a hand-written
    frozenset of five strings, no test ties it to PageKind, and the assertion
    intersects it with the plan -- so a page kind that letters only in the stream and
    is absent from the set is required of nobody. That is precisely the hole the brief
    asked about. The conditional shape of the semantic floor
    ({"guide","divider","band"} always, plus "footer label"/"answer caption" only when
    book != "min-trim") is carried across verbatim; the brief's unconditional quote was
    wrong and the round's correction 2 is right -- confirmed at HEAD :566-:572.
    Judgement on the declared band survivor: see M-2 -- pre-existing, narrower than
    declared, acceptable.
  3_guard_or_gap: >-
    A GUARD, not a gap -- the refusal is an `assert` inside stream_faces, so the page
    does NOT drop out of the set: CON-020's two verifying cells ERROR the day a vector
    puzzle page appears, with a message naming what the stream owes. I drove it
    (TestInteriorType_TheStreamArmIsReached::test_a_vector_puzzle_page_refuses...,
    green, and it is an AssertionError, not a skip or a continue). Refusing by page
    KIND is also the right default: the alternative -- exempting 8.64 pt by its value
