  - id: F-002
    severity: high
    category: correctness
    type: gap
    gating: true
    file: tests/property/test_book_export_interior.py
    line: 807
    title: "The converted module's own call site cannot survive the medium change -- `pdf_pages` hard-fails on a vector page, so the three stream arms are unreachable in situ"
    description: |
      The three medium-gated helpers are called at :899-:901 with `interior`,
      which comes from `interior = pdf_pages(interior_bytes)` at :807.
      tests/helpers/pdf_pages.py:29-47 loops EVERY page and does
      `page[b"Resources"][b"XObject"]`, then asserts `len(xobjects) == 1,
      "a book page is exactly one image"` and `Filter == DCTDecode`.

      MEASURED: with _RASTER_DECLARATIONS[TITLE] lifted so production's own writer
      emits one real vector page, `pdf_pages(data)` raises
      `KeyError: b'XObject'`. (Found while trying to drive
      _no_interior_page_is_the_cover's vector arm; the KeyError is from
      collections/__init__.py:1148 inside PdfParser's dict lookup.)

      So on the first mixed-medium interior the property test dies at :807, BEFORE
      any of the three medium-gated helpers runs. Their stream arms are reachable
      only by calling them directly with `pages=None`, which is what the new
      non-dormancy class does.

      This falsifies, as measured, the central claim the diff makes in its own
      block comment at :422-:428: "The declarations shrink underneath these
      helpers without the call sites changing, which is the only order that works."
      The call site DOES have to change. It is a loud failure, not a silent pass,
      so this is not a correctness hole today -- but the module's conversion is
      incomplete in the one respect the conversion was for, and the prose says
      otherwise.

      Scale of the remaining reader debt, derived: 16 test modules plus 3 helpers
      (book_corpus, page_ink, pdf_vector) read an interior through pdf_pages.
      This card converted 2 modules, one of which still routes through it.
    reproduction: >-
      In a scratch copy of HEAD, a probe that monkeypatch.delitem's
      book_pdf_generator._RASTER_DECLARATIONS[PageKind.TITLE], exports the baseline
      interior through BookPDFGenerator(corpus_book()).export_interior(...), and
      calls tests.helpers.pdf_pages.pdf_pages on the bytes -> KeyError: b'XObject'.
    recommendation: >-
      Either make the call site medium-aware in the same way the helpers are (read
      `pdf_vector.page_media` first and build `pages` only for the raster indices),
      or strike the "without the call sites changing" sentence and name the card
      that owes :807 and tests/helpers/pdf_pages.py -- which is the same card that
      owes the other 15 modules. The second is cheaper and is the honest record;
      the sentence as written will be read by CARD-309 as a promise.
    confidence: high
    source: measured

  - id: F-003
    severity: medium
    category: tech-debt
    type: gap
    gating: false
    file: tests/test_book_interior_type_floor.py
    line: 384
    title: "LETTERING_KINDS is hand-written where PageKind is the enumerable authority -- a new lettering kind is a silent pass (ADR-0039/R2)"
    description: |
      `LETTERING_KINDS = frozenset({"guide", "toc", "divider", "puzzle", "answer"})`
      is the whole of the medium-independent vocabulary, and the assertion is
      `planned = LETTERING_KINDS & set(_pages_by_kind(book))` then
      `planned <= kinds_covered_in_their_medium(book)`.

      Measured: PageKind has exactly seven members (COVER, TITLE, GUIDE, TOC,
      DIVIDER, PUZZLE, ANSWER), so the set IS complete today -- COVER is not
      interior and TITLE is blank by AC-283. `grep -rn LETTERING_KINDS tests/`
      finds 4 hits, all inside this one module, and no test compares it to
      PageKind.

      But the intersection makes an unlisted kind invisible rather than fatal: add
      an eighth PageKind member that letters, and `planned` simply does not
      include it, and the floor the card exists to keep non-vacuous goes quiet for
      it. ADR-0039/R2 says a guard's set is derived from an enumerable authority
      and an unanalysable shape is a FAILURE, never a silent pass -- the authority
      is `book_pdf_generator.PageKind`, already imported in this module.
      This is the same defect class as F-001, one level up.
    recommendation: >-
      Derive it: `LETTERING_KINDS = {k.value for k in PageKind} - _NOT_INTERIOR_LETTERING`
      with `_NOT_INTERIOR_LETTERING = {"cover", "title"}` and each exclusion
      carrying its reason, so a new member defaults INTO the required set. A
      one-line assertion that the exclusion set is a subset of the enum's values
      then makes a renamed member a failure too.
    confidence: high
    source: measured

  - id: F-004
    severity: medium
    category: test-quality
    type: issue
    gating: false
    file: tests/test_book_interior_type_floor.py
    line: 940
    title: "The medium-independent `mutant` cell is set algebra and cannot fail for any implementation"
    description: |
      TestInteriorType_TheNonVacuityFloorCanFail::test_dropping_a_page_kind_reds_the_medium_independent_assertion
      ends with, for each `dropped` in `planned`:
        assert not planned <= (covered - {dropped})
      For any sets P, C and any d in P, `P <= C \ {d}` is false by construction,
      because d in P and d not in C \ {d}. The loop proves a fact about Python's
      frozenset, not about kinds_covered_in_their_medium, below_floor_in_its_medium,
      the generator, or the medium gating. It passes on every possible
      implementation of all four, including one that returns a constant.
      The two assertions ABOVE it in the same cell (`planned` non-empty,
      `planned <= covered`) are real and do work; only the loop sold as the mutant
      is empty.
      The sibling cell
      test_dropping_a_semantic_kind_reds_the_coverage_assertion is weaker than it
      reads for the same reason -- filtering `kind != "band"` out of a list and then
      asserting "band" is absent cannot fail -- but it at least executes the real
      recording.
      AC-1's second mutant is NOT lost by this: the real control is M-1, which I
      reproduced, and it reds the shipped assertion on a real deletion. So the
      claim stands; one of its two advertised demonstrations does not.
    reproduction: "Set algebra; also: the loop body contains no call into the module under test."
    recommendation: >-
      Replace the loop with a mutant on the PRODUCER: make _pages_by_kind or the
      recording drop a kind (as M-1 does for the semantic arm) and assert the real
      assertion reds -- or delete the loop and let M-1's style carry AC-1's second
      mutant, which it already does.
    confidence: high
    source: measured

