  - id: F-006
    severity: low
    category: test-quality
    type: issue
    gating: false
    file: tests/property/test_book_export_interior.py
    line: 561
    title: "_no_interior_page_is_the_cover's vector arm is a no-op that restates its own branch condition, and two of the three vector arms are driven by no test"
    description: |
      Inside `else:` (i.e. `medium != RASTER`), the vector arm asserts
      `pdf_vector.RASTER not in media[page_number - 1 : page_number]` -- a
      one-element slice of the same list the branch was taken on. It cannot fail.
      The docstring is candid that the arm "needs no comparison at all", and the
      media-fact argument (a vector page cannot be the raster-permanent cover) is
      sound -- so this is a style/clarity finding, not a correctness one.
      MEASURED: I drove the arm with `object()` as the cover page and it passes,
      which is the proof that nothing is compared.
      Related dormancy, measured: no test in this branch drives
      _page_two_is_the_guide's vector arm or _no_interior_page_is_the_cover's
      vector arm -- I had to write probes. Driven by hand, the guide arm does fail
      by name as advertised (AssertionError matching "no vector ... guide writer"),
      and there is genuinely no `BookPDFGenerator.vector_guide_page` (the only
      vector_* page methods are vector_title_page, vector_puzzle_page,
      vector_two_up_page, vector_puzzle_pages). Also: the stream arm of
      below_floor_in_its_medium is never exercised with a NON-EMPTY list anywhere
      -- the title-lift test asserts `faces == []`, and the discrimination test
      bypasses stream_faces and calls pdf_vector.type_sizes on
      vector_puzzle_page(...).operators directly. The two halves are each proven;
      their composition is not.
    recommendation: >-
      Drop the no-op assert and say in a comment that a vector page is discharged
      by the medium fact; and add one cell that drives the full
      below_floor_in_its_medium with a non-empty stream contribution (a lifted
      TITLE declaration plus a monkeypatched type_sizes returning a sub-floor size
      is enough) so the union is exercised, not just its operands.
    confidence: high
    source: measured

