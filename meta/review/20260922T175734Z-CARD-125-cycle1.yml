findings:
  - id: F-001
    severity: low
    category: feature
    type: risk
    file: src/nonogram/export/layout.py
    line: 1686
    title: "_slot_layout re-states compute_layout's placed-page assembly; drift guarded by one example"
    description: |
      Cell fitting is not duplicated (compute_pair_layout calls _placed_cell_mm with a
      combined drawing and a doubled band, which satisfies objective 3). But _slot_layout
      (layout.py:1686-1762) copies the placed-page branch of compute_layout
      (layout.py:1393-1469): usable-width centring, the max(spare, 0)/2 rule, _boundaries,
      gutter slicing, _rule_widths, clue font size and the full Layout/PagePlacement build.
      A later change to the single placed page (clue font ratio, centring, margin field)
      must be made in both places. The only cross-check is
      TestPairLayout_UpperSlotSharesSinglePageTopRow::test_at_the_same_cell_the_upper_slot_is_the_single_page,
      a single 10x10 at the cap.
    suggestion: |
      Add a seeded property: for paired corpora where the cap binds (or with a spec whose
      cell_cap equals the pair's cell), assert pair.upper's grid_lines, clue_entries,
      strokes and drawing_left equal compute_layout(*first, spec_with_that_cap). Optionally,
      in a later card, route compute_layout's placed branch through _slot_layout (G-2
      permits a behaviour-preserving refactor; the golden test only covers the default path,
      so the page-spec tests would be the guard).
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: feature
    type: question
    file: src/nonogram/export/layout.py
    line: 1631
    title: "Lower slot is anchored to the bottom margin; not fixed by FR-040/ADR-0036, and its heavy bottom rule always straddles the margin"
    description: |
      FR-040 and the ADR-0036 "Two-up pages" clarification fix only the shared cell,
      "each under its own band" and the earlier puzzle in the upper slot. The card adds that
      the upper drawing's top edge is at top + band and that the lower slot sits "below its
      own band". Neither text says where the lower slot sits vertically. Bottom-anchoring
      (lower_band_top = page_bottom - lower_down*pitch - band) is a valid reading. It keeps
      each band against its own drawing and puts the spare height between the puzzles, and
      the owner proof (10x10+10x10, 26.35 mm spare) reads well. The alternative reading,
      flush under the upper drawing with the spare at the bottom, is equally compliant, so
      CARD-127's PDF tests could assume either. A side effect is that the lower drawing's
      bottom boundary always equals usable_bottom, and png._draw_grid strokes lines centred
      on their position. So the 6 px heavy bottom rule extends about 3 px (0.25 mm) into the
      bottom margin on every two-up page. On a single page that only happens when the height
      term binds. PagePlacement.fits ignores stroke width, as before.
    suggestion: |
      Have the architect station record the bottom-anchored choice in FR-040 (or the
      ADR-0036 clarification) so CARD-127's PDF criteria pin it. Keep the stroke
      half-width intrusion as an accepted, pre-existing convention, or inset
      lower_band_top by half a heavy rule if the owner wants strokes strictly inside the
      margin.
    confidence: medium
    source: model
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: info
    category: tech-debt
    type: risk
    file: src/nonogram/export/layout.py
    line: 1622
    title: "Two-band height doubled in float before exact conversion"
    description: |
      two_bands_mm = 2 * page_spec.band_mm is converted with _exact_mm(repr) for the fit,
      while placement uses 2 x _exact_px(band). For about 6% of arbitrary-precision band
      floats, Fraction(repr(2*b)) != 2*Fraction(repr(b)) (sampled). A 2586-case fuzz of such
      bands produced 0 exceptions or bad pairs, and a real band is 12.0 mm. Not gating.
    suggestion: |
      Pass the band exactly (for example, derive the fit's two-band spec from
      2 * _exact_mm(band)) if PageSpec ever accepts a Fraction band. Otherwise leave it.
    confidence: low
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
