verdict: >-
  Strong, honest work with one disqualifying defect of exactly the family this
  board escalates for.

  What is genuinely good, measured rather than taken on the round's word: AC-3
  is a model of a priced measurement — the shipped kappa swapped for the
  minimax 0.5519150244935105 reds two tests through the two-sided
  `2.0e-4 <= relative <= 3.0e-4` floor, so the accuracy figure is a measurement
  and not a formality; the artefact's §1 line counts (24 for the round shape,
  12 for the straight-line vocabulary, 13 for `round_mark`) reproduce exactly
  under an independent `ast` count; AC-1's three claims each have a control
  that fires (`FACE_BASE_FONT` -> "Helvetica" reds it, dropping `/FontFile2`
  reds it, and the committed `test_the_face_check_above_can_fail` catches a
  changed face); `/WinAnsiEncoding` -> `/MacRomanEncoding` reds the `pdftotext`
  test, so the encoding is independently controlled; `pdffonts` — an
  independent tool no test in the diff uses — reports the hand-rolled font
  object as `DejaVuSans / TrueType / WinAnsi / emb yes / sub no`, i.e. the
  sfnt work really does produce a valid, readable embedded face; and every
  width the reader computes matches FreeType (through
  `PIL.ImageFont.getlength`) to the unit on every code sampled, so the 934
  lines of hand-written sfnt parsing are *correct*. The ADR-0042/R5 flip is
  right for the reason the round gives (verified at
  `validators/utils.py:268-279` and `:336-338`: the ref splits on commas only
  and the search excludes the arch root plus all `*.md`; the bare name
  resolves to exactly one tracked file, `tests/test_book_pdf.py`, where it is
  the definition). All eight guardrails hold: no page drawn,
  `book_pdf_generator.py` and `pyproject.toml` untouched, probe in `scripts/`,
  and `tests/test_cli.py` + `test_guard_integrity.py` + `test_suite_profile.py`
  + `test_book_difficulty_dots.py` are 857 passed with the new module on disk.
  The judgment to add a tripwire rather than widen
  `TestDifficultyDots_HasExactlyOneDrawingSite` is correct and honestly
  worded — that guard's own docstring already scopes its claim to "the four
  routes a static walk can see", so a non-Pillow route does not falsify it,
  and the new class disclaims being a derived enumeration rather than
  borrowing ADR-0039/R2's language.

  What stops certification: `PropertyTest_VectorFont_EmbeddedOncePerDocumentAcrossPageCounts`
  **is not collected by pytest at all**. This repo configures no
  `python_classes`, so the default `Test*` applies and every other
  `PropertyTest_*` in this tree is spelled `def test_PropertyTest_...`; this is
  the first bare `class PropertyTest_...` and it collects zero tests. The
  declared control for EC(ADR-0042/R5) — the 24-book corpus, the per-page
  slope that the EC says "is the rule, not the count", and its own
  "a per-page face would be caught" control — never runs, and it reads exactly
  like a pass: no skip, no error, just absent from a green 145. The card's test
  table and the comment this card added to ADR-0042/R5 both cite that node id
  as where the slope is verified; both citations are dead. That is a claim
  with no control that *can* fail, one step worse than the four consecutive
  cards this board escalated for, and it is a one-line fix.

  Below that, three controls are weaker than their prose says. The `/Widths`
  array — the primary product of the riskiest file in the diff — is only
  self-consistent: replacing every width with a constant 600 passes 89/89,
  because `FontMetrics.advance` and the PDF `/Widths` come from the same
  function and the only check compares the writer against a render laid out
  from the writer's own numbers. `test_the_same_page_renders_the_same_type_at_two_resolutions`
  is labelled "the independent half of AC-4" but renders one and the same PDF
  at two resolutions, so it cannot fail on any writer defect — proved by
  mutation: scaling the `Tf` operand by `dpi/72` reds three tests and not that
  one. And the `/FontDescriptor`'s entries carry docstring rationales with no
  control behind any of them. None of these is a behavioural defect — the code
  is right — but each is a claim wider than its control, which is the thing
  this board gates on.

  Every fix here is small: rename one class, add a three-line FreeType
  cross-check, rewrite one test to vary the writer's DPI, add one length
  floor, and correct two sentences of prose. Fix F-1 and F-2 and this is an 8.

