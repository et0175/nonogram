  - id: F-5
    severity: minor
    title: >-
      "cp1252, which *is* `/WinAnsiEncoding`" is true with two exceptions, one
      of which prints visible ink
    file: src/nonogram/admin/book_vector.py
    line: 122
    gating: false
    confidence: high
    evidence: >-
      The module states the identity twice as exact — at :122-128 ("the PDF
      encoding the embedded face is declared with, and the Python codec that
      *is* it. `WinAnsiEncoding` is CP-1252") and in the round-1 notes
      ("`encode_text` gates every string through `cp1252`, which *is*
      `/WinAnsiEncoding`"). PDF 1.7 Annex D.2 differs from CP-1252 at two
      codes: `0xA0` is `space` (not `nbspace`) and `0xAD` is `hyphen` (not
      `softhyphen`).
      Measured: `encode_text(" ")` -> `b"\xa0"` and
      `encode_text("­")` -> `b"\xad"`, both accepted without complaint.
      So a soft hyphen — an *invisible* character in the source string — is
      set by a conforming viewer as a **visible hyphen** on the printed page.
      It is neither refused (which is `UnrepresentableText`'s whole rationale,
      :231-238: "Raised rather than substituted, because the substitute is a
      `.notdef` box on a printed page ... one that cannot be fixed after the
      book is printed") nor faithfully rendered. U+00AD is reachable from any
      pasted or imported title or puzzle name a page card sets.
      The `/Widths` happen not to diverge (both emit the DejaVu advances 318
      and 361, which are `space`'s and `hyphen`'s), so this is a glyph-identity
      difference only, and the 5 codes CP-1252 leaves undefined
      (0x81/0x8D/0x8F/0x90/0x9D) are correctly absent from `/Widths` and
      unreachable through `encode_text`, exactly as :359-373 says.
    remedy: >-
      Either name the two exceptions in the `TEXT_ENCODING` comment ("cp1252
      is `/WinAnsiEncoding` except at 0xA0 and 0xAD, which WinAnsi maps to
      `space` and `hyphen`"), or — better, given the refusal's own argument
      about ink that cannot be fixed after printing — have `encode_text` refuse
      U+00A0 and U+00AD by name alongside the characters it already refuses,
      with a case in `TestVectorVocabulary_RefusesWhatItCannotDraw`. Whichever
      is chosen, drop the unqualified "*is*".
    disposition: open

