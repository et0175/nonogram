  - id: F-2
    severity: major
    title: >-
      The `/Widths` array is only self-consistent — every width can be replaced
      by a constant and the whole claim-bearing suite still passes
    file: src/nonogram/admin/book_vector.py
    line: 417
    gating: true
    confidence: certain
    evidence: >-
      `font_metrics` builds `widths_1000` from `hmtx`/`maxp`/`cmap`, and
      `FontMetrics.advance` sums the same dictionary. The PDF `/Widths` array
      (`_write_face`, line 906) is built from that same dictionary. The only
      test that measures a string's width —
      `TestVectorPrimitives_AnIndependentEngineFindsEachShape::test_the_text_is_inked_on_the_baseline_the_writer_named`
      — compares poppler's ink box against `metrics.advance(word)`, and poppler
      lays those glyphs out *from the `/Widths` the writer emitted*. So both
      sides of that comparison come from one function.
      Measured by mutation (file restored and sha256-verified afterwards:
      463d19a41d63aabcda5dcb0c0e597af36f19e69f2cfecf54afa729ffc6732419):
      replacing the comprehension at :417-420 with
      `widths = {code: 600 for code, point in encoded.items()}` ->
      `pytest tests/test_book_pdf_vector_primitives.py tests/test_book_pdf.py
      -o python_classes="Test* PropertyTest*"` gives **89 passed, 0 failed**.
      With 300 instead of 600, exactly one test fails. So the control's
      discrimination window on the whole `/Widths` array is roughly a factor of
      two — 600 against a true mean advance near 700 is a visibly mis-set line
      (glyph ink wider than its advance, letters touching) that the suite
      cannot see.
      The claim this is wider than is explicit, at :270-279: "the embedded face
      is declared `/TrueType` with `/WinAnsiEncoding`, for which a viewer
      consults neither `GPOS` nor `kern`. So this is the width the viewer will
      use, not an estimate of it — which is what lets a caller centre a string
      without either side knowing the other's rasteriser." Nothing in the diff
      can fail if that is false, and CARD-295/296/297 will centre every string
      in the interior on it.
      The code is in fact correct, which is why this is major and not critical:
      cross-checked against FreeType through
      `PIL.ImageFont.truetype(BytesIO(interior_face_bytes()), 1000).getlength(ch)`,
      the emitted widths match to the unit on every code sampled
      (0x20 318, 0x2D 361, 0x41 684, 0x44 770, 0x48 752, 0x52 695, 0xB7 318,
      0xE9, 0x30, 0x39, 0x61, 0x7A, 0x97 — zero mismatches above 1.5/1000 em).
      The missing thing is the control, not the behaviour.
    remedy: >-
      Add the independent re-derivation the project's own test style asks for.
      Pillow is already in the dependency baseline and is FreeType-backed, so
      `PIL.ImageFont.truetype(BytesIO(interior_face_bytes()), 1000).getlength(ch)`
      is a second implementation reading the same `hmtx`: assert it against
      `interior_face_metrics().widths_1000[code]` over the whole 32..255 range
      (it agrees exactly today), and assert the same for `cap_height`,
      `ascent` and `descent` against `ImageFont.getmetrics()`. Three lines,
      no new dependency, and it turns the sfnt reader from self-consistent into
      checked. Tightening
      `test_the_text_is_inked_on_the_baseline_the_writer_named`'s
      `0.1 * advance_px` tolerance would not fix this, since both sides move
      together.
    disposition: open

  - id: F-3
    severity: major
    title: >-
      "The independent half of AC-4" cannot fail on any writer defect — it
      renders one PDF twice instead of writing two
    file: tests/test_book_pdf_vector_primitives.py
    line: 636
    gating: false
    confidence: certain
    evidence: >-
      `test_the_same_page_renders_the_same_type_at_two_resolutions` builds a
      single `ContentStream` at one DPI, writes one `data`, and renders *that
      same byte string* at 300 and 600, asserting the ink height doubles. The
      writer's DPI is never varied, so the assertion is a property of poppler's
      rasteriser, not of the vocabulary: it holds for any PDF that renders
      text at all, whatever the writer did to `size_pt`.
      Measured: with `text()`'s `Tf` operand changed to
      `_number(size_pt * self.dpi / 72.0)` — the exact "multiplied by DPI
      somewhere downstream" defect AC-4 exists to exclude — three tests red
      (`test_the_tf_operand_is_the_same_at_every_dpi`,
      `test_the_text_poppler_reads_back_is_the_text_that_was_shown`,
      `test_the_text_is_inked_on_the_baseline_the_writer_named`) and this one
      is **not** among them: 3 failed, 86 passed.
      AC-4 as a criterion is still covered — `test_the_tf_operand_is_the_same_at_every_dpi`
      reds on that mutation and the stream is the last thing `write_vector_pdf`
      touches before `zlib.compress`, so there is no transformation downstream
      of the assertion point. What is false is this one test's stated role: the
      docstring calls it "The independent half of AC-4" and the file's module
      docstring says "every shape claim here is made on a raster produced by
      `pdftoppm`".
    remedy: >-
      Make the writer the variable: build two `ContentStream`s at 300 and 1200
      DPI with the same physical geometry in millimetres and the same
      `size_pt`, write two PDFs, render each at a fixed render DPI, and assert
      the cap height in *millimetres* is the same for both to within a pixel.
      That version reds on the `dpi/72` mutation and makes the "independent
      half" label true. Failing that, retitle it to what it checks (that
      poppler scales a page linearly) and stop calling it AC-4's independent
      half.
    disposition: open

