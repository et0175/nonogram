corrections_to_the_brief:
  - >-
    "Claim-bearing tests: 145 passed, 0 skipped" reproduces exactly, and
    poppler is present — but the figure is not the evidence it reads as. Three
    declared tests are missing from it, silently (F-1). 145 is the count of
    what pytest collected, and the uncollected class contributes no skip and no
    error. The pre-gate's inference "the zero skips confirm poppler is
    present, so AC-2's independent half genuinely executed" is sound for AC-2;
    the same figure says nothing about EC(ADR-0042/R5).
  - >-
    "A test that checks a writer against its own reader proves only that two of
    the author's functions agree. AC-2 claims an INDEPENDENT engine (poppler).
    Verify that independence is real for EVERY primitive." Confirmed real for
    every primitive AC-2 names — line, rectangle (stroked and filled), grey
    tone (measured as `round(255*0.35)` exactly), curve (bounding box, area
    against `pi r^2` within 1%, and every inked pixel's radius), and text
    (both `pdftotext` and the raster). The skip cannot read as a pass: the
    `skipif` reason names the absence, and `tests/helpers/pdf_vector.py` raises
    `RuntimeError` rather than returning empty if poppler is present but
    produces nothing. The independence gap is one level down, inside the text
    primitive: the *advances* that position those glyphs are the writer's own
    numbers on both sides of the comparison (F-2).
  - >-
    "`validators/utils.py:276` splits a check ref on commas only ... This is
    settled; the brief was wrong and the round was right." Confirmed at
    :268-279. I would add the half that makes the round's choice provably
    right rather than merely safe: `code_search` (:336-338) searches with
    `:(exclude)<arch root>` and `:(exclude)*.md`, and under that pathspec R5's
    bare name resolves to exactly one file — `tests/test_book_pdf.py`, where it
    is the `def`. R5's new ref is honest in the strong sense, not just
    non-dead. R4's is not (F-9).
  - >-
    "AC-4 ... Does that assertion actually discriminate — would it still pass
    if the code multiplied by DPI somewhere downstream of the assertion point?"
    The stream-side assertion discriminates and there is no downstream to hide
    in: `write_vector_pdf` only `zlib.compress`es `stream.render()`. The
    `dpi/72` mutation reds `test_the_tf_operand_is_the_same_at_every_dpi`
    plus two poppler text tests. But the test the round labels AC-4's
    "independent half" does not discriminate at all (F-3).
  - >-
    "Does the font embedding actually produce a valid, readable font in the
    PDF, verified by something other than the writer?" Yes — but by nothing in
    the diff. `pdffonts` (not used by any test here) reports `DejaVuSans /
    TrueType / WinAnsi / emb yes / sub no`, which is precisely what the card
    claims; it reports `uni no`, i.e. no `/ToUnicode` CMap, and extraction
    still works through the standard encoding, so that is a non-issue for a
    simple WinAnsi font. The descriptor's numbers are unverified (F-4); the
    widths are correct but unverified (F-2); `cap_height` is the one sfnt
    value with a real control.
  - >-
    "The round added `TestVectorVocabulary_TheRoundMarkRouteTheOldGuardCannotSee`
    as a tripwire ... Judge whether that tripwire is honest about what it is,
    and whether leaving the old guard un-widened is the right call or a hole."
    Honest, and the right call — no finding. The tripwire's docstring states
    that it is a pattern match over source text and "narrower than ADR-0039/R2
    would want of a guard that had to stand alone", naming the two evasions it
    is blind to. And the old guard is not falsified by the new route:
    `tests/test_book_difficulty_dots.py:1267` already scopes its claim to
    "exactly one function draws a round mark through any of the **four routes a
    static walk can see**", with every other route a named limit, and points
    at CARD-241's spelling-blind ink instrument for the universal guarantee.
    Both tripwire tests have a non-vacuity floor (`len(found) > 20`, and the
    `count("def round_mark(") == 1` beside the empty-set assertion), so neither
    is vacuous. Verified green with the new module in the tree: 857 passed
    across tests/test_cli.py, test_guard_integrity.py, test_suite_profile.py
    and test_book_difficulty_dots.py.
  - >-
    "`book_vector.py` is 934 lines" — confirmed, and the card's own round-1
    report still says nothing about the count, so the pre-gate's correction
    stands uncontested.
  - >-
    On the pre-gate's second correction (the ADR-0025 circular-supersession
    error that is not there): I did not re-run the validator, so I neither
    confirm nor dispute it. The pattern it names — a specific claim no reading
    supports — is the same family as F-8 and F-9 in this cycle, which is worth
    noting as a trend rather than as a new finding.
  - >-
    Layering, which the brief flagged as test-enforced: no violation.
    `admin` is one of the three names in `tests/test_cli.py:748`'s
    `_ADAPTERS`, so `book_vector.py`'s `from nonogram.export.pdf import
