      `tests/test_export_pdf.py::` prefix, in the same `## Rules` YAML block
      the card edited two lines below, and the round had already established
      (and measured) that bare names are this model's live spelling. Noting it
      is defensible; it is thin.
    remedy: >-
      Strip the `tests/test_export_pdf.py::` prefix from R4's `check.ref`,
      leaving `ref: test_the_dependency_baseline_is_still_closed`, keep the node
      id in the comment beside it exactly as R5 now does, and re-run the
      validator to confirm 0 errors / 122 warnings is unchanged. Correct the
      round's attribution to "55 tracked non-markdown files, none of them a
      definition" or drop the specific attribution. If the board prefers R4
      untouched here, raise it as a named card rather than a comment, so the
      owing is tracked.
    disposition: open

