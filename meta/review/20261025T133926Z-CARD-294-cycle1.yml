  - id: F-7
    severity: minor
    title: >-
      The sfnt reader fails with a raw `struct.error` on a truncated face and
      silently embeds a CFF-flavoured sfnt as `/FontFile2`
    file: src/nonogram/admin/book_vector.py
    line: 283
    gating: false
    confidence: certain
    evidence: >-
      `_sfnt_tables` reads the table count from bytes 4..6 and never checks the
      sfnt version tag at bytes 0..4, and `font_metrics` indexes
      `tables["head"]`/`["hhea"]`/`["OS/2"]`/`["hmtx"]`/`["maxp"]` directly.
      Measured against `font_metrics`:
      face truncated to 2 KB -> `error: unpack requires a buffer of 2 bytes`
      (a raw `struct.error`); empty bytes -> the same; the real face with its
      version tag rewritten to `OTTO` -> **no error**, `upem=2048 ascent=928
      widths=219`; the real face with the table count inflated to 5000 -> **no
      error**, same values.
      `write_vector_pdf(..., face_bytes=b"OTTO" + face[4:])` then writes a
      381,528-byte file with CFF-flavoured bytes inside `/FontFile2`, which is
      spec-invalid, with no complaint. So the answer to "does it fail loudly or
      silently emit a broken font" is: loudly but with an uncontrolled
      exception type on truncation, and *silently* on an unexpected-but-
      structured layout.
      The module declares its own `ContentStreamError` hierarchy and uses it
      for exactly two sfnt cases (no Windows/Unicode BMP cmap at :332, a
      non-format-4 cmap at :334) — the general malformed case is outside it.
      Scope-limited: `face_bytes` is documented as existing only so AC-1's
      control can embed something else, the shipped face is the one in the
      repository, and no page card can reach the argument. Hence minor.
    remedy: >-
      Two lines in `font_metrics`: reject a version tag that is not
      `b"\x00\x01\x00\x00"` or `b"true"` with a `ContentStreamError` (`/FontFile2`
      is for TrueType outlines only — a CFF face belongs in `/FontFile3`), and
      wrap the table lookups so a missing table raises `ContentStreamError`
      naming the tag rather than `KeyError`/`struct.error`. Add the truncated
      face to `TestVectorVocabulary_RefusesWhatItCannotDraw`, which already has
      a case per refusal.
    disposition: open

