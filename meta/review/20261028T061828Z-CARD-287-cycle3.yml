priority_two_adjudications:
  ac1_same_run_share:
    question: Cycle 2 said 22.0 %; fix round 2 said 21.2 % and could not establish 22.0 %. Who is right?
    answer: >-
      NEITHER IS "THE" SHARE, AND THE HONEST ANSWER IS A BAND. Both are correct
      single-run readings of a quantity with genuine run-to-run spread, and
      each station published the end of the distribution that suited its point.
      I re-derived it a third time -- three further processes, arm A's blob
      swapped in and restored under `git hash-object`, ONE cProfile object per
      process, numerator and denominator off that one object, caller >= callee
      asserted inside the probe (it held in all three), and each half of the
      ratio read a SECOND way inside the same run (pstats.total_tt beside
      sum(tottime), the callee's cumtime beside the caller's).
    five_same_run_readings: |
      station        numerator  denominator   share
      cycle 2          14.383      65.32     22.02 %
      fix round 2      14.523      68.39     21.24 %
      cycle 3 rep 1    14.367      67.465    21.30 %
      cycle 3 rep 2    14.305      66.457    21.52 %
      cycle 3 rep 3    14.175      64.835    21.86 %
      -- numerator  14.175 .. 14.523  (2.5 % spread)
      -- denominator 64.835 .. 68.39  (5.5 % spread)
      -- share       21.24 .. 22.02,  mean 21.59, median 21.52
      the card's CROSS-RUN cell: 14.366 / 68.35 = 21.02 %
    who_is_right: >-
      FIX ROUND 2 IS SUBSTANTIALLY RIGHT and cycle 2 OVERSTATED THE SEVERITY.
      Fix round 2's structural point is confirmed and strengthened: the
      numerator is stable and the profiled total is not, so a share assembled
      from two runs is not a share -- and the error it introduces is small
      because the cross-run cell lands inside the same-run band. Against the
      MEAN of the five same-run readings the card's 21.0 % is out by 0.57 pp,
      not 1.0 pp. But fix round 2 then took the other end: "0.2 pp" is the
      distance to its own single run, exactly as "1.0 pp" was the distance to
      cycle 2's. And "could not establish cycle 2's 22.0 %" is too strong --
      my rep 3 reads 21.86 %, which rounds to 21.9 and shows 22.0 is reachable
      on this host, not an artefact.
    what_the_cell_should_read: >-
      A band. "approximately 21.5 % -- five same-run readings on this host give
      21.2 / 21.3 / 21.5 / 21.9 / 22.0 %, the numerator stable at 14.2-14.5 s
      and the profiled total not, at 64.8-68.4 s", with the cross-run 21.0 %
      named as out by 0.2-1.0 pp depending on the run. The card already states
      the three-reading spread, which is the honest half; what it still does is
      lead with one figure and one distance. Recorded as F-C3-01, minor.
    unchanged_by_this: >-
      The conclusion AC-1 draws is untouched in every reading, and I re-derived
      its two robust cells in the same runs: the planting idiom is 0.052-0.065 s
      (0.08-0.10 %) of the profiled total over 108 calls, and `str.replace` is
      0.012-0.013 s over 216 calls. 2 556 `get_source_segment` ncalls in all
      three reps.
  f_c2_05_invariants:
    question: >-
      Fix round 2 reports that `diff`'s own edit script gives 75 either way, so
      TWO measures are invariant under the line-count change (sections touched
      and the diff edit script) and only the positional comparison is not.
    answer: >-
      HALF RIGHT, AND THE HALF THAT IS WRONG IS AN ACCOUNTING CHOICE THE
      SENTENCE DOES NOT NAME -- which is the same defect F-C2-06 was about. I
      re-derived it with my own captures on the committed blob and compared
      them FOUR ways, using the system `diff` AND `difflib.SequenceMatcher` as
      an independent second implementation of the same measure; the two agree
      exactly on every row.
    measured: |
      injection at the hot site   lines  positional  diff '<'  diff '>'  two-sided  sections
      one character APPENDED      1752        75        75        75       150      6 of 52
      one character DROPPED       1744      1543        83        75       158      6 of 52
      (difflib's own opcodes give the identical 75/75/150 and 83/75/158)
    verdict_on_the_claim: >-
      The '>' SIDE of the edit script IS 75 either way -- so fix round 2's
      point stands in the reading the card's own table column uses ("`diff`
      one-sided"), and that column is correct. But the edit script as a whole
      is NOT invariant: the '<' side goes 75 -> 83 and the two-sided total
      150 -> 158, because the drop really does remove 8 lines and `diff` really
      does account for them. So of the measures on that table exactly ONE is
      fully invariant: the SECTION SET -- the same six sections (AC6
      real/shipped sites, AC6 real/no-door-arms sites, AC6 real/follow-terms
      sites, and the PLANTED_LITERAL / DERIVED_INSTEAD / EXEMPTED_TERM
      outcomes), under both injections, re-derived here. Fix round 2's own log
      carries the disproof of its own sentence at line 72 -- "two-sided ... =
      158" against the append's 150 -- and reports it without noticing.
      Recorded as F-C3-02, minor. The card's conclusion is unaffected: the
      capture is sensitive at both sites and is not self-confirming, and the
      measure the card now leads with is the right one.
    also_not_invariant: >-
      The per-line content count INSIDE those sections: fix round 2's own log
      reads 75 for the append and 103 for the drop (its comparator zips a
      section's lines pairwise, so a re-wrap inflates it). Only the section SET
      survives the re-wrap.

priority_three_the_718_domain:
  claim: >-
    718 is one PLANTED analysis over the 7 334-line DOOR_SHAPES[0] text, while
    the REAL module's analysis gives 716 at the same site, deterministic across
    three processes and three hash seeds.
  verdict: CONFIRMED, and strengthened; this is a real finding no review had
  rederived: |
    $ # rev3/f03_rev3.py, committed blob b34512e8, my own loader, worktree cwd
    REAL module  (src/nonogram/admin/book_pdf_generator.py): len(sites)=24  {1761: 716, 2938: 24}
    PLANTED DOOR_SHAPES[0]                                 : len(sites)=24  {1761: 718, 2938: 24}
    _counting_expressions()                                : 8 expressions  {1460: 8}
