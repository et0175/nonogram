findings:

  - id: F-C3-01
    severity: minor
    title: >-
      AC-1's headline share is published as one figure with one distance
      ("21.2 % ... it moves the figure by 0.2 percentage points") when five
      same-run readings on this host span 21.2-22.0 % and the cross-run cell is
      out by 0.2-1.0 pp depending on the run. The card states the spread of the
      three readings it knows and then still leads with a point estimate
    file: meta/kanban/cards/CARD-287.md
    line: 480
    gating: false
    confidence: high
    detail: >-
      This is the smaller half of F-C2-01, and the card's correction of it is
      right in substance: the provenance defect was real, the cross-run cell is
      withdrawn, the column is relabelled with both readings in the cell, the
      caller >= callee inequality is asserted inside the probe, and the scope
      is stated precisely (CARD-292's profiled-over-unprofiled defect really
      was avoided). What survives is a precision claim. "0.2 percentage points"
      is the distance from the cross-run cell to fix round 2's own single run,
      exactly as cycle 2's "1.0" was the distance to its own; against the mean
      of the five same-run readings it is 0.57 pp. And "could not establish
      cycle 2's 22.0 %" is too strong -- my third rep reads 21.86 %. The
      numerator is stable across all five (14.175-14.523 s, 2.5 %) and the
      profiled total is not (64.835-68.39 s, 5.5 %), which is the card's own
      lesson and is the reason a single reading cannot be the share. NOT
      GATING: every conclusion AC-1 draws is unchanged in every reading, the
      domain of the published cell is stated, and the remedy is one sentence.
    evidence: |
      $ zsh rev3/ac1_driver.sh   # arm A blob 8741bd33 swapped in and restored,
                                 # 3 processes, ONE cProfile object each
      arm A blob: 8741bd33f9c05b0d6eee381d2ef8e84eb09f78cf
      NONOGRAM_TEST_HANG_SECONDS=<unset>   lock: absent
      ##### rep 1
        UNPROFILED wall 27.67 s   PROFILED wall 67.47 s   factor x2.438
        DENOMINATOR two readings: sum(tottime)=67.465  pstats.total_tt=67.465  delta=0.000000
        ast.get_source_segment ncalls=2556 tottime=0.009 cumtime=14.367
        ast._splitlines_no_ff  ncalls=2556 tottime=13.627 cumtime=14.357
        caller>=callee (same run): 14.367 >= 14.357 -> True
        SHARE = 21.30 %
      ##### rep 2   cumtime=14.305 / sum(tottime)=66.457  -> SHARE = 21.52 %
      ##### rep 3   cumtime=14.175 / sum(tottime)=64.835  -> SHARE = 21.86 %
      restored blob: b34512e81d6429ad44add62dc123fe61e595faf4 OK   (git status clean)

      with the other two stations' same-run readings:
        22.02 (cycle 2)  21.24 (fix round 2)  21.30  21.52  21.86  -> mean 21.59
        card cross-run 21.02 -> 0.57 pp from the mean, 0.22 from the nearest,
        1.00 from the farthest.
    remedy: >-
      State the cell as a band -- "approx 21.5 %, five same-run readings
      21.2-22.0 % on this host" -- and replace "moves the figure by 0.2
      percentage points" with "by 0.2-1.0 pp depending on the run, 0.6 pp
      against the mean". Drop "could not establish cycle 2's 22.0 %": it is
      reachable. One sentence; no re-measurement owed.

  - id: F-C3-02
    severity: minor
    title: >-
      "two of them are invariant across every injection above: the section set
      and `diff`'s own edit script (75 either way)" -- only the SECTION SET is
      invariant. The edit script is 75 either way on its '>' side only; its '<'
      side goes 75 to 83 and its two-sided total 150 to 158, and fix round 2's
      own log records the 158 without noticing it
    file: meta/kanban/cards/CARD-287.md
    line: 724
    gating: false
    confidence: high
    detail: >-
      The sentence claims invariance for a measure that is invariant only under
      one of its two accountings -- and WHICH accounting is exactly the
      distinction F-C2-06 was raised about, two paragraphs later on the same
      card. The card's TABLE is correct, because its column is headed "`diff`
      one-sided"; it is the prose generalisation that overstates. The cause is
      not subtle: the drop injection really removes 8 lines from the capture
      (1 752 -> 1 744), and `diff` accounts for them on the deleted side, so
      83 = 75 + 8. The conclusion the paragraph exists to support is unaffected
      -- the capture is sensitive at both changed sites and is not
      self-confirming, the same six sections move under both injections, and
      leading with the sections is the right choice. NOT GATING: it is one
      clause, and the figure a reader would check (the table) is right.
