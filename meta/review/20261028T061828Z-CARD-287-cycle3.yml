verdict: >-
  CERTIFIED (8.5 against a threshold of 8), up from cycle 2's 8.0, zero gating.
  Fix round 2 closed what it claims, introduced nothing, and the one thing it
  did in code is right: E1 (node.lineno -> node.end_lineno) is KILLED by the
  positive control with `assert [('Foo', 5)] == [('Foo', 4)]`, fired by this
  station on the committed blob, and the same mutant still SURVIVES on the
  superseded blob `eb2bbf81` -- so the premise of the fix is verified here and
  not read from cycle 2's report. The plant is still a call in a FOREIGN scope
  and still asserts the CLASS rather than the method, so the equality still
  means what STDLIB_SEGMENT_SCOPES is spelled for; S3 still kills naming
  `_attribute_callee_laundering` at 5487, S4 still survives as the negative
  control, M1 and N2 still survive as declared. G-1 held: I re-ran the
  52-section capture on BOTH arms with my own loader and comparator and got
  sha256 `223019c2...` on each, identical to each other and to the round's
  `before.txt`/`after2.txt`, 0 of 52 sections differing and positional diff 0.
  All nine of cycle 2's findings are closed on evidence re-derived here.
  Fix round 2 corrected cycle 2 twice and both corrections are adjudicated
  below: on AC-1's share it is substantially RIGHT and cycle 2 overstated the
  severity, but the honest answer is a BAND, not either number -- five same-run
  readings give 21.2 / 21.3 / 21.5 / 21.9 / 22.0 %, so the cross-run cell is
  out by 0.2-1.0 pp depending on which run you pick and by 0.6 pp against the
  mean (F-C3-01). On the sensitivity invariants it is HALF right: `diff`'s edit
  script is 75 either way only in its ONE-SIDED '>' reading; the '<' side goes
  75 -> 83 and the two-sided total 150 -> 158, so the section SET is the only
  fully invariant measure on that table (F-C3-02). The new domain finding is
  CONFIRMED and strengthened: 718 is the planted analysis and 716 the real
  module, deterministic across six processes (three randomised hash seeds and
  three fixed ones), the domain is now stated at all three places the census
  appears, and it moves no downstream figure -- 2 556 and 23x36 + 24x72
  re-derived here and the 716/718 lives at a different call site entirely.
  Every `(test: ...)` ref on the card resolves to a real `def`. What remains is
  three minors, none gating, none a mechanism. No cycle 4 exists and none is
  needed.

