findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_book_answer_key.py
    line: 374
    title: "answer_key_of stopped pinning how many dividers the interior opened"
    description: |
      The helper's guard went from `assert len(dividers) == 1` to
      `assert dividers` + `divider = dividers[-1]`, and — the substantive part —
      the expected SOLUTIONS position is now `2 + (len(dividers) - 1) + puzzle_count`,
      i.e. it is derived from the OBSERVED number of divider pages rather than
      from the independently computed `level_count(puzzles)` that the same file
      already defines two functions higher (`first_answer_page`, line 213).
      The helper can therefore no longer refute "the interior opened one divider
      too many": both sides of its comparison move together.

      Failure scenario: a regression in `_level_runs`
      (src/nonogram/admin/book_pdf_generator.py:954) that splits one level into
      two runs — e.g. a tier representation that stops being a singleton, so
      `is` stops matching — adds a spurious divider to a single-level book.
      `answer_key_of` recomputes `expected` from the 2 observed dividers and
      passes. The regression is still caught downstream, because the byte-exact
      `expected_answer_page(..., first_answer_page(puzzles) + offset, ...)`
      comparisons DO use the independent `level_count`, and a shifted answer page
      changes its parity and therefore its pixels — which is why this is medium
      and not high. But the helper every test in the file routes through has
      stopped being evidence.
    suggestion: |
      `expected = first_answer_page(puzzles) - 1`, and keep an exact divider
      count: `assert len(dividers) == level_count(puzzles) + 1`.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 887
    title: "interior_page_count's one-argument upper bound is only asserted on single-level books"
    description: |
      `level_dividers` left out defaults to `min(len(TIERS), puzzle_count)`, and
      the card's claim is that this keeps "called with the count alone, this is
      an upper bound on every book" true. I VERIFIED the claim holds and is
      tight: a 3-puzzle 3-level book plans 11 and writes 11; the 4-puzzle
      3-level baseline book bounds at 13 and writes 11. So this is a coverage
      gap, not a defect.

      The gap: the two assertions that state the bound —
      tests/test_book_export_interior_cover.py:669 and :690
      (`interior_page_count(puzzle_count) >= written` / `>= pages`) — run only on
      that module's books, which are "three easy 20x20s", i.e. ONE level. Nothing
      in the suite asserts the bound on a two- or three-level book. Mutation M5
      (`min(len(TIERS), n)` -> `min(len(TIERS) - 1, n)`, which makes the bound
      genuinely wrong for a 3-level book) was killed only by the two
      exact-figure assertions on the Finalise screen's "~11" string, never by a
      bound assertion.

      Failure scenario: a later change narrows the divider term (or CARD-129
      replaces it) in a way that understates a 3-level book. CARD-129's gutter
      refusal consumes exactly this number next wave; the suite would report the
      break only as a changed cosmetic figure in one HTML assertion, which is
      the kind of failure a fix agent re-points rather than investigates.
    suggestion: |
      Add one case to TestBookFinalise_PageCountIsTheExportsPagePlan whose book
      is easy+medium+hard, asserting `interior_page_count(n) >= written` there
      too — the tight 3-puzzle 3-level case (bound 11, actual 11) is the
      boundary value and is currently untested.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1402
    title: "puzzle_section's \"payloads are in print order\" precondition is documented but unguarded"
    description: |
      `puzzle_section` states in its docstring that `payloads` is "the book in
      print order", and the `dividers <= 3` property that `interior_page_count`'s
      default bound (F-002) rests on is true only for a grouped input:
      `_level_runs` cuts MAXIMAL RUNS, so an ungrouped list of n tier changes
      yields n named runs and n divider pages. The method validates `ids`
      parallelism (line 1402) but not the ordering premise, and it does not call
      `print_order` itself.

      Today this is safe: `interior_stream` calls `print_order(puzzles)` first
      (line 1861) and is the only production caller. But `puzzle_section` is
      public and is already called directly from
      tests/property/test_book_order.py:243 and :308, and CARD-129 — which must
      compute the interior's EXACT page count — is the obvious next direct
      caller. A CARD-129 implementation that hands it the stored (legacy mixed)
      order gets several dividers per level, silently exceeds `min(3, n)`, and
      the `_as_planned` tripwire will not catch it because it is handed the same
      measured `dividers` value.
    suggestion: |
      Either call `print_order` inside `puzzle_section` (it is idempotent, so
      the interior_stream call becomes free), or assert
      `len(_level_runs(payloads)) <= len(TIERS) + 1` at the top with a message
      naming the precondition.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

