    title: "Nothing pins the Status select to the PuzzleStatus enum"
    description: |
      The worktree notes claim the option list is "derived from the PuzzleStatus enum, so the
      page cannot drift from the store the way the preset tables did (CARD-065)". The property
      is true of the code — a scratch copy with a fifth enum member (ARCHIVED = "archived")
      renders options ['', 'draft', 'approved', 'rejected', 'in_book', 'archived'] — but it is
      not pinned: replacing the {% for value in statuses %} loop with four hardcoded <option>
      lines leaves the whole suite green (21 passed, tests/test_card_066_status_filter.py +
      tests/test_puzzles_list_pagination.py). test_ac2 asserts each of four literal values is
      present, which a hardcoded list satisfies by construction, so the anti-drift guarantee is
      an unverified claim rather than a tested one.
    suggestion: |
      Assert the select's option values equal the enum, e.g.
      `assert re.findall(r'<option value="([^"]*)"', select)[1:] == [s.value for s in PuzzleStatus]`
      — that fails the moment the template restates the list or the enum gains a member.
    confidence: high
