    title: "The ValueError branch's statuses= is untested, and the note overstates what it prevents"
    description: |
      No test provokes the `except ValueError` re-render, so removing `statuses=_PUZZLE_STATUSES`
      from it leaves the suite green (21 passed). The behaviour was verified by hand instead:
      `/puzzles?size=999` (also size=0, quality_min=500, limit=0) reaches the branch and renders
      200 with the full select (options ['', 'draft', 'approved', 'rejected', 'in_book']); with
      the argument removed the same URL still returns 200 but the select silently degrades to
      the "Any" option only (options ['']). So the addition is correct and load-bearing, but the
      worktree note's "the select would fail to render on a filter error" is wrong in kind — the
      failure is a silent empty control, not a raised error, which is exactly the sort of
      regression a test would have to catch because nothing else signals it.
    suggestion: |
      Add a test that hits the error branch and asserts both the "Filter error" flash and that
      the Status select still offers every status (e.g. GET /puzzles?size=999&status=approved).
    confidence: high
