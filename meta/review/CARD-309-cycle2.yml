findings:
  - id: F2-001
    severity: high
    category: enabler
    type: bug
    file: meta/kanban/cards/CARD-309.md
    line: 139
    title: "AC-5's newly-written M5 sentence asserts the very thing the same commit's own corrected table measured false"
    description: |
      Added by 180b64f0 (these are `+` lines in `git diff 50d2c627..HEAD --
      meta/kanban/cards/CARD-309.md`), inside the **AC-5 verdict** — the section
      the merge gate reads:

        "**M5** (the same cycle at module level) also dies, but **not there** —
         see the corrected mutant table in *"[Fix round 1, 2026-10-30]"*: CPython
         refuses the import at collection, so the AST cell never runs and M6 is
         the cell's only real control."

      The same commit's own table, ~900 lines later, says the opposite of M5 and
      attributes the collection death to M5x:

        | M5  | ... `if False:` + from ... | **1 red, and it is that cell** |
        | M5x | ... the same cycle UNGUARDED | **the suite does not collect at all ... 0 cells run** |

      Re-fired in this worktree, whole impact set, caches swept, target SHA-256'd
      before the plant and after the restore:
        * M5 (the card's own `if False:` plant, copied from
          ~/Documents/nonogram-reviews/CARD-309/probes/mutate.py:86-90) —
          **1 failed / 355 passed**, and the one red is exactly
          `TestAssemblyPoint_TheDirectionIsResolvedAndNotHidden::test_the_generator_imports_none_of_the_writers_that_import_it`.
          The cell RUNS and it CATCHES.
        * M5x (unguarded, cycle 1's own m5.py plant) — collection dies:
          `ImportError: cannot import name 'FOLIO_PT' from partially initialized
          module`, via conftest.py:12 -> app.py:79 -> book_kdp.py:105 ->
          book_pdf_generator.py:401 -> book_guide_vector.py:103. **0 cells run.**

      So all three of the sentence's assertions about M5 — "also dies, but not
      there", "CPython refuses the import at collection", "the AST cell never
      runs" — are false of M5 and true only of M5x. Only its conclusion ("M6 is
      the cell's only real control") is right, in the narrow sense the table
      states: M6 is the only mutant that plants an import the interpreter
      actually executes.

      This is ADR-0039/R4: a measurement recomputed and refuted must be retracted
      *everywhere it was written*. The round wrote the refutation and, in the same
      commit, re-wrote the refuted claim in the AC verdict. Severity is set by
      symmetry with cycle 1's own F-001, which was Important for exactly this
      shape — a false sentence whose policy conclusion was right.

      Failure scenario: CARD-322's implementer reads AC-5 (the natural entry
      point — it is the AC that passed and is "the card"), learns that the
      direction cell has no module-level control, and treats the cell as
      aspirational when a re-fire shows it is the one guard in the tree that
      catches an admin->admin lateral the layering guard cannot see. Mitigation,
      stated because it is real: the sentence points the reader at the table that
      contradicts it.
    suggestion: |
      Re-word AC-5 to the table's own finding: M5 (`if False:`-wrapped) reds
      exactly that cell and nothing else; M5x (unguarded) is un-plantable and
      kills collection with 0 cells run; M6 is therefore the cell's only control
      over an import the interpreter executes. Same for M7 — see F2-005.
    confidence: high
    source: static
    violates: ADR-0039/R4
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F2-002
    severity: high
    category: enabler
    type: gap
    file: meta/kanban/cards/CARD-309.md
    line: 1036
    title: "The new control's own reach column is an expected-node-union measurement — the exact harness defect the round names as its root cause — and MF-3's reach is 54, not 3"
    description: |
      The round diagnoses its own instrument, correctly and in strong terms:

        "**The root cause of both mis-statements is the harness, and it is worth
         naming:** round 1's `mutate.py` ran only the **union of the node ids it
         expected to red**. A mutant's reach outside that union was therefore
         invisible by construction, and the 'cells it reds' column was really the
         'cells it was expected to red' column."

      That defect is fixed in `fix-round1-harness/refire.py` (`IMPACT` = the three
      modules; the M-series column really is counted from the rows — I reproduced
      M8 at 3 and M11 at 7 exactly). It is **not** fixed in
      `fix-round1-harness/mutate.py`, the harness that measured MF-1..MF-6 — the
      certification evidence for the gating finding's fix. Its node argument is
      literally the expectation:

        CONTROL = "tests/test_book_pdf.py::TestRasterDeclarations_TheCommentAgreesWithTheRegistry"
        NEIGHBOURS = (…test_no_declaration_names_the_card_that_is_closing,
                      …test_no_declaration_outlives_the_cards_that_remove_it)
        "MF-1": (…, (CONTROL,) + NEIGHBOURS)     # 6 node ids
        "MF-5": (…, (CONTROL,))                  # 4 node ids
        "MF-6": (…, (CONTROL,))                  # 4 node ids

      Re-fired here over the whole impact set (356 cells):
        MF-1  1 red  (the card: "1 red, 5 passed")        — number right
        MF-2  1 red  (the card: "1 red, 5 passed")        — number right
        MF-3  **54 red** (the card: "3 red")              — 18x understated
        MF-5  1 red                                        — right
        MF-6  1 red                                        — right

      MF-3's 54 is not a stray: collapsing `PageKind.PUZZLE:` onto
      `PageKind.COVER:` leaves PUZZLE undeclared, so `page_medium(PUZZLE)` returns
      VECTOR and **every puzzle page in every book changes medium**. 51 geometry,
      parity, trim and export cells red alongside the 3 the card names. So MF-3 is
      not the clean "prose versus registry" isolate the row describes — it is a
      shipped-behaviour mutant whose mirror-arm kill is confounded with 51 others,
      and the row says none of that.

      ADR-0039/R4: "A figure's DOMAIN — which population, which revision, which
      arm — is part of the figure." The MF column states no population. MF-1/MF-2
      partially disclose theirs ("5 passed" implies 6 nodes) and MF-3/MF-4 do not.

      Nothing the card claims about *which cell catches what* is wrong — all three
      MF-3 cells it names do red, and 0 of 6 mutants survive. What is wrong is the
      reach figure and its undeclared domain, one page after the round names that
      exact instrument defect as the cause of its other two corrections.

      Failure scenario: the next card reads "MF-3 — the registry loses an entry …
      3 red" as evidence that removing a declaration is a contained, prose-level
      change, and schedules CARD-322's first conversion as a 3-cell edit. The real
      number for one kind is 54 in this three-module set alone — which is the same
      shape as the card's own blocker (189+75 across 22 modules) and should have
      pointed at it.
    suggestion: |
      Re-fire MF-1..MF-6 through refire.py's whole-impact-set path (or give
      mutate.py the same IMPACT default) and re-state the reds column with its
      population named. Add one line to MF-3's row recording that the plant also
      flips PUZZLE's medium, so its kill is not an isolate.
    confidence: high
    source: static
    violates: ADR-0039/R4
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

