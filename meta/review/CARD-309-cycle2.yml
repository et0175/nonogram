  - id: F2-004
    severity: low
    category: enabler
    type: gap
    file: tests/test_book_pdf.py
    line: 2500
    title: "The new control reads only the `#:` block, and ~30 lines of removal prose inside the registry literal are outside it"
    description: |
      `comment_block` anchors on `^_RASTER_DECLARATIONS\b` and walks UP while lines
      start with `#:`. Everything the control sees is that block. The registry
      literal itself then carries a second, longer prose block as plain `#`
      comments between `PageKind.DIVIDER`'s entry and `PageKind.TITLE`'s — which is
      where the card's narrative about removal actually lives ("**CARD-309 built
      the assembly point and did NOT convert a kind**", "**CARD-322 is the card
      that removes these four**"). A future false past-removal claim written there
      is unguarded by both arms.

      This is a bound, not a false claim: the `#:` block says "holds **these
      lines** to the mapping", which is exactly what it does, and the two sentences
      F-001 found were both in the `#:` block, so the control covers the site of
      the measured defect. Also worth recording as a bound: the mirror arm requires
      *some* already-happened removal claim, not a correct count — after CARD-322
      removes four entries, a prose claim of one removal satisfies it.
    suggestion: |
      If CARD-322 writes its removal narrative inside the dict literal, extend
      `comment_block` to the contiguous `#` run inside the literal, or move the
      narrative up into the `#:` block the control reads.
