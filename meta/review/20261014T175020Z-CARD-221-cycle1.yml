confirmations:
  - id: X-001
    finding: "AC-1 and the faithfulness of its simulation (the coordinator's aim 1)"
    verdict: "HOLDS, and the simulation is faithful for the property it claims. One residual, recorded as F-005."
    evidence: |
      The worry was that a path refusal in a process that has already loaded
      a face is not a machine without the font. I checked the three ways
      that could bite and then went around the test entirely:

      1. Caching. `grep -n 'lru_cache|@cache|cached_property'` over
         src/nonogram/admin/ and src/nonogram/export/ finds four caches in
         book_pdf_generator: `_band_font_bytes` (packaged bytes),
         `_band_font` (packaged face), `default_toc_frame` (pure geometry,
         no font) and nothing else. `_guide_face` is deliberately uncached.
         So no measurement taken in the on-host run can be reused by the
         off-host run. There is no font-keyed memo anywhere in the interior
         path.
      2. Reach. The negative control
         (test_the_comparison_can_tell_the_pre_card_face_from_this_one)
         restores the pre-card lookup and asserts the moved set is exactly
         [1,2,3,4,6,8,10]; it runs and passes on this Mac, so the simulation
         demonstrably reaches the interior's faces here.
      3. The stronger version. I wrote my own plugin that patches
         ImageFont.truetype process-wide at plugin-import time — before
         collection, not inside a test — and ran the eight book test files
         under it: 330 passed, 2 skipped, 0 failed. The on-host counts for
         the same files are the same tests passing. So the claim does not
         depend on the in-test monkeypatching at all.

      And a mutant the card's set did not have (MR-3): a PARTIAL
      reintroduction of the defect — `_guide_face` returns the host's Arial
      for size 42 only (the TOC entry size) and the packaged face otherwise.
      This changes a page's pixels without changing the page count, which is
      the sharpest edge of AC-1. KILLED by
      test_every_page_of_the_baseline_book_is_the_same_page_on_both_faces,
      test_the_minimum_trim_is_the_same_book_on_both_faces and
      test_no_font_is_loaded_from_a_filesystem_path — and NOT by
      test_the_page_count_and_its_gutter_band_agree_on_both_faces, which is
      the correct separation and tells you which test holds which half.

      What the test cannot see, and nothing here can: a different FreeType
      build rasterising the same packaged face. F-005.
  - id: X-002
    finding: "The deleted scatter guardrail (the coordinator's aim 2)"
    verdict: "The deletion is JUSTIFIED, and what replaced it is genuinely stronger. One figure in the justification is stale — folded into F-001."
    evidence: |
      I re-measured the deletion's premise myself rather than taking it.
      Exporting the baseline book at HEAD and comparing interior pages 1 and
      2 against the two stored CARD-200 JPEG fixtures:

          page 1: 639,187 of 8,415,000 px differ = 7.596%; ink-mask
                  disagreements 287,496; of 20,536 sampled, 18,232 (88.8%)
                  are NOT explained by a 1 px displacement at the deleted
                  instrument's own 64-grey tolerance.
          page 2: 886,216 px = 10.531%; ink-mask 495,242; 19,936 of 20,636
                  sampled (96.6%) unexplained.

      Against a 1% ceiling and a zero-outlier assertion, both pages are off
      by an order of magnitude on one bound and categorically on the other.
      The claim the deleted test made — "the deviation from CARD-200 is a
      sub-pixel scatter" — is not true of a deliberate face change and
      cannot be restated. The re-anchoring argument is also right as far as
      it goes: the test's own `moved > 0` makes a same-render reference
      vacuous by construction.

      What matters more is that the replacement is not weaker. The scatter
      test was a BOUND on an admitted deviation; the guide pages are now
      compared digest-for-digest against book_baseline_card221.json by
      TestBookPdfMemory_PagesAreUnchanged, UNCONDITIONALLY (the same_face
      skip is gone), with `compared == BASELINE_PAGE_COUNT` asserted so the
      comparison cannot quietly stop covering a page, and with
      `set(baseline["font_dependent_pages"]) == set()` asserted so a future
      host lookup has to come back and declare itself
      (tests/test_book_pdf_memory.py:1320-1348). A later card that displaces
      a worked-example diagram — the scenario the deleted test named — now
      fails an exact comparison instead of a 1% bound. The two JPEG
      fixtures survive (G-5) and keep their integrity check inside
      test_the_guide_pages_are_the_documented_exception_not_an_unbounded_one
      (:1974), which I verified is checked against the CARD-200 baseline
      (the class's `baseline` fixture loads book_baseline_card200.json),
      not against the new one.

      The only loss is the 3x3 displacement INSTRUMENT, which a future card
      wanting to admit a bounded scatter would have to rewrite. I do not
      think that justifies keeping a test that cannot state a true claim.
  - id: X-003
    finding: "AC-6 — the gating shrinks honestly (the coordinator's aim 3)"
    verdict: "HOLDS. No gate was removed whose condition still holds, measured rather than argued."
    evidence: |
      The direct test of 'red on somebody's machine' is to BE that machine.
      Under my process-wide off-host plugin the eight book test files give
      330 passed, 2 skipped, 0 failed, and the property/export/CLI set gives
      159 passed — the same 159 as on host. The only font-related skip is the
      one gate the card ADDED, with the reason it names.

      Remaining gates, enumerated rather than sampled:
      `grep -rn 'pytest.skip|skipif|warnings.warn' tests/test_book_*.py
      tests/helpers/book_corpus.py` returns exactly four — the new
      host_offers_a_second_face skip (test_book_interior_face.py:354) and
      three pre-existing setrlimit/platform skips in
      test_book_pdf_memory.py. No font gate survives anywhere.

      Dangling references: `grep -rn 'font_fingerprint|MACHINE_FACE_SIZES|
      _lettered_as_recorded|scatter_is_bounded'` over tests/, src/, docs/
      and meta/architecture/ finds no live code and no architecture `check:`
      ref — only historical prose and the superseded fixtures, which G-5
      requires to keep their own values. So deleting these names leaves no
      dead reference in the model.

      The added gate is correctly placed: it is above every assertion in the
      one test that is nothing but a contrast, and the rest of the module is
      ungated. Its own condition is measured (two faces drawn and compared
      as pixels), not assumed from `os.path.exists`.
  - id: X-004
    finding: "The two changed type-floor probes (the coordinator's aim 4)"
    verdict: "Both are RIGHT, not merely different. Verified by independent measurement and by a mutant."
    evidence: |
      ASCENDER_TO_DESCENDER_PROBE "Hg" -> "dg". Measured at a 400 px em in
      the packaged face: Hg inks 375 px (0.9375 of the em), dg 387 px
      (0.9675). The finding is correct — DejaVu's ascender (top at y=68)
      clears its cap height (y=80), so a cap-to-descender probe under-states
      the extent of a mixed-case line by 12 px in 400. Under-stating the
      probe's ratio OVER-states the recovered point size, which is the
      lenient direction for a floor, so the old probe was wrong in the
      dangerous direction (it read the page's 11 pt body as 11.52).

      I also checked the new probe is not itself short, by sweeping every
      printable ASCII glyph's top and bottom at 400 px: the ascender top
      (68) and the descender bottom (455) that "dg" spans are the extremes
      for every character the guide page can set — `( [ { @ / Q` all sit
      inside it; the only ASCII glyph that exceeds it is "|" (1.0 of the
      em), which the interior does not print. So 0.9675 is the true ceiling
      of an ordinary line, not a second approximation.

      folio_reference()/folio_band(). "Hdlk" inks 0.760 of the em to its
      baseline, "1" 0.730 — I reproduced both through the test module's own
      helpers. A 10 pt folio is 31 px of digit, so against the text probe it
      reads 31/0.760 = 9.79 pt, a false breach of a floor it sits exactly
      on, and against its own probe 31/0.730 = 10.19 pt. The split is
      necessary. The same reasoning generalises correctly in
      `line_reference`: "agrees on" (a wrapped line of the 10 cm page 2)
      tops out at x-height, 0.5725 of the em, and against the ascender
      probe would read 8.21 pt while being set at 11.

      Teeth, not leniency — mutant MR-2, FOLIO_PT 10.0 -> 9.5: 8 tests red
      across tests/test_book_interior_type_floor.py and
      tests/test_book_guide_page.py, the guide-page check reporting
      "a line of type measures 9.53 pt" — i.e. the new probe recovers a
      deliberately-shrunk folio to within 0.03 pt. The probe change removed
      a false positive without creating a false negative.

      `folio_band` is also a real improvement on "assume the last band":
      it asserts the band ends on the frame's own bottom edge, is no wider
      than four digit-heights, and sits in the outer corner.
  - id: X-005
    finding: "The re-aimed tests (the coordinator's aim 5)"
    verdict: "All four re-aimings still fail for their original reason. One cosmetic residue, F-008."
    evidence: |
      - Wrong-sentence -> wrong-LABEL control
        (tests/test_book_guide_page.py:1280). Still a negative control of
