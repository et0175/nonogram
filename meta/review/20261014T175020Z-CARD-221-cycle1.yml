  - id: F-002
    severity: medium
    classification: Important
    gating: true
    category: correctness
    type: regression
    file: tests/test_book_page_numbers.py
    line: 234
    title: "At the 10.00 cm minimum trim the card takes the folio off guide page 2 as well — the same 'a page goes out unnumbered' outcome the owner spent a shipped constant to prevent on the TOC page, at the same trim, never put to them"
    description: |
      The card's own test change records it and nothing escalates it. At
      tests/test_book_page_numbers.py:234 the min-trim assertion is
      tightened from `missing <= {1, blank_puzzle_page, answer_page}` to
      `missing == {1, 2, blank_puzzle_page, answer_page}` — page 2 is newly
      in the set.

      Measured by me, same book, same process, only the face swapped
      (`monkeypatch.setattr(book_pdf_generator, "_guide_face", host_face)`
      against HEAD):

          packaged (HEAD):          7 pages, folios on [3, 4, 6], missing [1, 2, 5, 7]
          host Arial (pre-card):    7 pages, folios on [2, 3, 4, 6], missing [1, 5, 7]

      And confirmed by eye in the owner's own renders:
      min-10.00x10.00cm__guide-page2__host-arial-before.png carries a "2" in
      the bottom-left corner; __fix1-packaged-dejavu.png does not.

      The card's measurement table has the number ("guide page 2 last form,
      10.00 cm | 93 px under the frame (folio drawn) | — | **18 px (folio
      omitted)**"), but it appears nowhere in "What this card could NOT
      close", nowhere in the fix-cycle-1 ledger, and nowhere in the
      orchestrator's summary — while its exact sibling, the TOC page losing
      its folio at the same trim, became Block 2 and moved a shipped
      constant. The owner's own stated principle, now written into
      TOC_GROUP_GAP_PT's docstring, is "the next change ... should fail on
      its own arithmetic rather than silently un-number a page"; this card
      un-numbers one and the suite was edited to expect it.

      Two things I checked before calling this Important rather than
      Critical, and both belong in the escalation. First, the fix cycle's
      234 px does NOT recover it: at the 10 cm trim the ladder was already
      drawing its bare form, which never printed the sentences, so page 2
      still ends 18 px inside the frame against the folio's 49 px line —
      measured on HEAD, after the ruling. Second, that whole page is already
      broken at that trim on both faces: `fits_width` is false for every
      fallback form and page 1 overruns the sheet by 212 px, which the card
      records as pre-existing. So the honest framing is "a 10 cm book's
      guide pages were already unprintable, and this card also takes page
      2's number" — but that is a sentence for the owner to read, not one
      for a reviewer to supply on their behalf.
    suggestion: |
      No code change asked for. Put it where the other two consequences are:
      a third entry in the card's "What this card could NOT close" with the
      93 px -> 18 px measurement, the two renders that show it, and the
      reason it is not closable inside this card (the gap constant does not
      reach a guide page; the ladder has no form that fits that trim at
      all). Then one of:
        (a) the owner accepts it as part of the already-broken 10 cm guide
            page and it is carded with the fits_width exhaustion as one
            "guide pages do not fit the minimum trim" card; or
        (b) if an unnumbered interior page is never acceptable, that is a
            second constant/ladder decision of the same shape as Block 2.
      Whichever it is, tests/test_book_page_numbers.py:220-240's comment
      should say that page 2's folio was lost by CARD-221 and is accepted,
      rather than describing the set as simply "stated exactly rather than
      bounded".
