        so both sides are real and the margin is 1.05 pt (F-008).
      - F-11's three alignment checks
        (tests/test_book_guide_page_type.py:771-915). The claim is "a
        no-bleed image lands at frame.left, not one heavy rule left of it",
        and the legend is still such an image. The new `legend_ink_extent`
        does build its expectation from the function under test, which
        alone would be self-consistent rather than independent — but the
        premise assertion in `assert_legend_is_flush` ("51 px of a 46 px em
        is not a side bearing", :838) is what closes that, and the card's
        own M7 is the proof it fires. The pre-existing negative control
