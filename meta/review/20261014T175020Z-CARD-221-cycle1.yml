  - id: F-003
    severity: medium
    classification: Important
    gating: true
    category: correctness
    type: defect
    file: src/nonogram/admin/templates/book_finalize.html
    line: 127
    title: "The Finalise screen still previews the three difficulty sentences the page no longer prints, and a passing test now certifies that divergence"
    description: |
      book_finalize.html:126-132 renders, under the heading
      "What the difficulty labels mean", a `.guide-difficulty-box` with
      `<strong>{{ label.name }}</strong><p>{{ label.text }}</p>` per column.
      `label.text` is `DifficultyLabel.text`, which the card deliberately
      keeps and the page deliberately stops printing. So the screen the
      owner finalises a book on shows a bordered box with three sentences,
      and the PDF it produces has an unruled row of three words.

      tests/test_book_finalise_guide_preview.py:622,
      `test_the_difficulty_box_carries_the_three_sentences_verbatim`, is
      untouched by this card and still green — so the divergence is not
      merely unnoticed, it is asserted. That file's whole purpose is that
      the preview matches the page; the sibling test at :630,
      `test_the_difficulty_sentences_appear_nowhere_else_in_contradictory_wording`,
      exists specifically to stop the screen carrying a second, conflicting
      description of the tiers. It now carries the only description, and the
      page carries none.

      The agent flagged this in the card's notes, priced it ("a one-line
      template change plus [the preview test]") and routed it to CARD-229. I
      disagree with the deferral on the card's own reasoning: Block 1's
      argument for dropping the rule was that a drawing must not make a
      claim it no longer honours, and a preview is a claim about a page.
      CARD-229 is unscheduled; a book finalised before it lands is proofed
      against a screen that is wrong about its own guide page.
    suggestion: |
      Either (a) do the one line now — drop the `<p data-guide-difficulty-text>`
      from the template, re-aim
      test_the_difficulty_box_carries_the_three_sentences_verbatim to
      test_the_difficulty_legend_carries_the_three_labels (the same
      re-aiming this card did twice in tests/test_book_guide_page.py), and
      keep DifficultyLabel.text as data for CARD-229 exactly as the card
      argues; or (b) get the owner's explicit "the preview may lie until
      CARD-229" and record it in the card beside the other two rulings. What
      should not ship is the current state, where the only record of the
      divergence is a note in a card and the panel's own test says the
      preview is right.
    confidence: high
    source: static
