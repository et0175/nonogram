mutation_check:
  enabled: true
  status: partial
  mutants: 3
  killed: 3
  survived: 0
  restore_verified: true
  rationale: >-
    deferred(cost) for the full capped set — three Important findings are
    open (F-001, F-002, F-003), and the cost ladder puts a full mutation
    sweep on the candidate cycle, not on a cycle that is going to be
    followed by a fix. The three run here are not a sweep: each answers a
    specific question the task asked and that the card's own ten mutants do
    not reach. M1 restored the WHOLE pre-card lookup, so nothing had probed
    a partial reintroduction; nothing had probed the floor the new folio
    probe measures; and the task asked me to verify M6 rather than take it.
    A full set on the next cycle should aim at what I left alone: the
    `_toc_entries_per_page` capacity arithmetic, `folio_band`'s three
    structural assertions, and `host_offers_a_second_face`'s own
    discrimination.
  results:
    - "MR-1 (independent rebuild of the card's M6) `_draw_difficulty_legend` prints each gloss under its name, unruled and wrapped to the column → KILLED, 2 failed / 11 passed. The killing assertion is the SENTENCE_OPENINGS word probe added in 0153281 (tests/test_book_guide_page.py:1274), NOT the bordered-box template at :1255 — which confirms both halves of the agent's account: the old half really is blind to an unruled reprint, and the new half really closes it."
    - "MR-2 `FOLIO_PT` 10.0 → 9.5 (aimed at the new folio_reference probe: does the floor still have teeth after the probe was loosened from 0.760 to 0.730?) → KILLED, 8 failed / 79 passed across tests/test_book_interior_type_floor.py and tests/test_book_guide_page.py, reporting 'page 1: a line of type measures 9.53 pt'. The probe recovers a deliberately-shrunk folio to within 0.03 pt, so the change removed a false breach without opening a real one."
    - "MR-3 `_guide_face` returns the host's Arial for size 42 only (the TOC entry size), packaged otherwise — a PARTIAL reintroduction of the defect that moves pixels without moving the page count → KILLED by test_every_page_of_the_baseline_book_is_the_same_page_on_both_faces, test_the_minimum_trim_is_the_same_book_on_both_faces and test_no_font_is_loaded_from_a_filesystem_path; NOT killed by test_the_page_count_and_its_gutter_band_agree_on_both_faces, which is the correct separation of the two halves of AC-1."
  restore_evidence: "Each mutant was applied to src/nonogram/admin/book_pdf_generator.py with an in-process `assert s.count(old) == 1` guard, run, then reverted with `git checkout -- src/nonogram/admin/book_pdf_generator.py` before the next. After the last revert, `git status --porcelain -- src tests` is EMPTY (verified and re-verified at the end of the review), and `git status --porcelain` shows only ' M meta/kanban/cards/CARD-221.md' — the orchestrator's own card sync, which was already modified when I arrived and which I did not touch. No file was deleted or globbed; my off-host plugin and every scratch script live in the session scratchpad, outside the repository. This report is the only file I wrote inside the worktree."

verdict:
  summary: >-
    The engineering is excellent and the determinism claim survives a
    harder attack than the card made on itself. I ran the book suite under a
    process-wide off-host simulation applied before collection — 330 passed,
    2 skipped, 0 failed — audited every cache in the interior path to rule
    out a primed face, and killed a partial reintroduction of the defect
    that the card's own M1 would have missed. The two type-floor probes are
    right rather than merely different: I re-derived 0.9375/0.9675 and
    0.760/0.730 independently, swept every ASCII glyph to confirm "dg" is
    the true ceiling of an ordinary line, and proved with a FOLIO_PT mutant
    that the looser folio probe still catches a half-point breach to within
    0.03 pt. The deleted scatter guardrail is justified — I re-measured its
    premise at 7.596% and 10.531% of the page against a 1% ceiling — and
    what replaced it (all thirteen pages, unconditional, with the compared
    count and the empty font_dependent_pages both asserted) is stronger than
    what went. M6's slip reproduces exactly as reported, and the test
    0153281 added is what kills it.
    What gates is not the code. The fix cycle updated every figure that is
