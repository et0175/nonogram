findings:
  - id: F-001
    severity: medium
    classification: Important
    gating: true
    category: documentation
    type: defect
    file: tests/test_book_toc.py
    line: 1218
    title: "Four provenance records still describe the pre-ruling branch — including the AC-4 sweep's own docstring, which states in prose that the test fails, while the test passes"
    description: |
      The fix cycle moved TOC_GROUP_GAP_PT to 8.0, dropped the difficulty
      sentences, converted all three strict xfails and re-recorded the
      baseline. Every place where a figure is ALSO an assertion was updated
      and is correct. Every place where the same figure is only narrated was
      not. Four instances, all verified against HEAD by running or parsing:

      1. tests/test_book_toc.py:1196-1242 — the docstring of
         `test_the_gaps_leave_the_folio_its_line_on_every_trim_kdp_admits`,
         the test AC-4 names. It still says "which is why the constant is
         8.5 pt" (:1198) and, as its own bolded paragraph, "**At the shipped
         8.5 pt the 10.00 cm trim is 2 px short, and this test says so by
         failing.**" (:1218), closing with "CARD-221 is forbidden that change
         (its G-6) and records the measurement here instead." The constant at
         src/nonogram/admin/book_pdf_generator.py:635 is 8.0, the test is an
         ordinary passing test (I ran it), and its own body three paragraphs
         below asserts `worst[0] == 55` and `worst[0] - folio_line == 6`.
         A test whose docstring says it fails and whose body says it passes
         is the exact false-claim shape this card's Block 1 argued against
         when it renamed `_draw_difficulty_box`.

      2. tests/fixtures/book_baseline_card221.json, `why_a_new_baseline`.
         Its third paragraph, "TWO MEASURED CONSEQUENCES THE CARD COULD NOT
         CLOSE ... see ... the two strict xfail markers that carry the
         figures", asserts three things that are false of HEAD: that page 2
         drops to the labels form and is therefore "a shorter page" (it
         draws the captions form again; measured: page 2's digest moved in
         the fix cycle and interior_bytes ROSE), that the 10.00 cm trim's
         "four 8.5 pt group gaps leave 47 px ... so that page prints
         unnumbered" (it is four 8.0 pt gaps, 55 px, and the page prints its
         folio — I rendered it), and that two strict xfail markers carry the
         figures (`grep -rn xfail tests/test_book_*.py` finds none). The same
         file's `interior_bytes_note` and `changed_pages_note` WERE updated
         and now contradict it inside one fixture. This is the field AC-5
         points at.

      3. tests/helpers/book_corpus.py:443 — the chain ledger's CARD-221
         entry records "``interior_bytes`` 3498430 -> 3463959". The fixture
         written in the same commit says 3464123, the card says 3464123, and
         the exported interior really is 3464123 (asserted by
         test_the_interior_file_is_the_length_it_was_recorded_with, which I
         ran green). 3463959 is 164 bytes off and matches nothing on the
         branch: at 9862ecd this same line correctly read "falls from
         3498430 to 3369113", so the wrong figure was introduced by the fix
         cycle, not inherited.

      4. tests/test_book_pdf_memory.py:263-272 — the comment that justifies
         deleting the scatter guardrail quotes "page 1 ... 7.596% ... page 2
         in 11.442%, with 254,766 and 581,547 differing pixels". I
         re-measured both pages against the two CARD-200 JPEG fixtures at
         HEAD: page 1 is 639,187 of 8,415,000 = 7.596% (exact match, 287,496
         ink-mask disagreements), page 2 is 886,216 = 10.531%. 11.442% is
         the pre-fix-cycle page 2, which the fix cycle redrew.

      None of this is a code defect and no test is wrong. It matters because
      this chain's entire value is that a later card can trust what the
      fixture and the docstring say about why a page looks as it does — and
      the next reader of `why_a_new_baseline` will be told page 2 is short
      because it lost its captions, which is the opposite of true.
    suggestion: |
      Four text edits, no code, no re-recording:
      1. Rewrite the two stale paragraphs of the sweep's docstring in the
         past tense the rest of the file already uses ("at the 8.5 pt this
         constant carried into CARD-221 ... the owner moved the gap to 8.0"),
         and delete "and this test says so by failing" / "CARD-221 is
         forbidden that change".
      2. Rewrite `why_a_new_baseline`'s third paragraph as the two
         consequences the OWNER CLOSED, with the figures the other fields in
         that file already carry (234 px against 4 px; 8.5 -> 8.0 pt, 47 ->
         55 px). It is the one field a reader of the chain starts at.
      3. book_corpus.py:443: 3463959 -> 3464123.
      4. test_book_pdf_memory.py: re-measure or label page 2's 11.442% /
         581,547 as the pre-fix figure. The argument is unaffected (10.531%
         is still ten times the ceiling and ~96% of the moved pixels are
         still outliers by the deleted instrument's own rule — I sampled
         19,936 outliers in 20,636 sampled moved pixels), so this is a
         figure fix, not a re-argument.
    confidence: high
    source: dynamic
