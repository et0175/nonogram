  - id: F-002
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/app.py
    line: 28
    title: "DATABASE_URL captured at module-import time, silently breaking create_app()'s per-call DB-mode contract"
    description: |
      admin/app.py's top-level `if os.getenv('DATABASE_URL'):` block (lines 28-35) runs exactly
      once, the first time nonogram.admin.app is imported, and binds the module-level
      session_scope global then. Every later create_app() call reuses that frozen binding
      regardless of the environment at call time. db/session.py:8's
      `DATABASE_URL = os.getenv('DATABASE_URL', None)` has the identical defect one layer down.
      Reproduced live: importing admin.app with DATABASE_URL unset, then setting it and calling
      create_app() again, still yields session_scope: None. tests/conftest.py's `app` fixture
      docstring explicitly assumes "will use DATABASE_URL env var for DB-backed services" per
      call — this assumption is false whenever nonogram.admin.app was already imported earlier
      in the same Python process with a different DATABASE_URL state (e.g. during pytest
      collection, before any monkeypatch.setenv fixture has run).
    suggestion: |
      Read os.getenv('DATABASE_URL') inside create_app() itself (not at module scope) and
      inside _init_engine()/session_scope() on each call, not from a frozen module-level
      constant. Add a regression test that imports admin.app with DATABASE_URL unset, then
      sets it and calls create_app(), asserting DB-backed mode actually engages.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: high
    category: compliance
    type: risk
    file: src/nonogram/admin/app.py
    line: 55
    title: "No authentication on 10 mutating admin routes, combined with wildcard CORS and an un-overridden default SECRET_KEY"
    description: |
      Zero auth-related identifiers (login_required, @auth, check_auth, Authorization,
      HTTPBasicAuth, require_login, api_key/API_KEY) found anywhere in admin/app.py.
      Access-Control-Allow-Origin: "*" (line 55) applies to every response via
      @app.after_request, including POST/DELETE routes (approve/reject puzzle, delete puzzle,
      generate batch, upload image, generate/download PDF). app.config["SECRET_KEY"]
      (line 47) falls back to the literal "dev-key-change-in-production" if unset; the
      committed render.yaml does not list SECRET_KEY among its envVars.
    suggestion: |
      Verify what, if anything, gates network access to this deployment. Either add an auth
      layer to admin/app.py's mutating routes, or explicitly confirm and document the existing
      network-level protection (Render access control, VPN, IP allowlist). Confirm SECRET_KEY
      is actually set out-of-band in the Render dashboard, and add it to render.yaml's envVars
      (as a generated secret, not a literal) so a fresh deploy from the IaC file doesn't
      silently fall back to the public default.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

