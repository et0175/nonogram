  - id: F-001
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/app.py
    line: 895
    title: "Exception handler crashes with AttributeError, masking the real PDF-generation failure"
    description: |
      Inside generate_book_pdf_download's except Exception block, `book.id` is accessed, but
      `book` is a Book dataclass (from book_mgr.get_book()) which has `book_id`, not `id`.
      Every failure inside the try block (lines 847-895) currently surfaces as an unrelated
      AttributeError/500 instead of the intended flash("Failed to generate PDF: ...") + redirect.
      This is the third occurrence of the same Book.id-vs-.book_id mismatch in this codebase:
      first fixed in templates (commit da7e81d), second fixed this session in the same file's
      /api/puzzle/<id>/details endpoint.
    suggestion: |
      Change `book.id` to `book.book_id` at line 895. Also grep the codebase for any other
      `book.id` / `b.id` / `book.title` access on a Book dataclass instance (as opposed to a
      SQLAlchemy Book ORM row, which does have `.id`) — this bug class has recurred 3 times.
    confidence: high
    source: static
