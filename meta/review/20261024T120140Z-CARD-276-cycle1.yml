findings:
  - id: F-1
    severity: critical
    gating: true
    title: >-
      The fixed point resolves a key whose identity it has not established:
      attributes are keyed by spelling alone, so one resolving occurrence
      anywhere in the module licenses every call on that spelling — and the
      resolved pass is now ungated, where the fork point's was a declared
      exemption
    file: tests/test_book_export_interior_cover.py
    line: 2455
    adr: ADR-0039/R2 (a shape the guard cannot analyse is a FAILURE, never a silent pass) and ADR-0039/R3 (an exemption is a claim, held to an equality, with its residue a measured bound carrying its own failing control)
    ac: AC-1 (the level, not the instance), AC-4 (the class is gone, not retired in place)
    evidence: >-
      Driven through _plant/_outcome directly, outside pytest, against the
      worktree's committed bytes. `bound` keys an attribute as
      ("an attribute", node.attr) (line 1928) and anchor_key keys an attribute
      target the same way (line 2154) — spelling alone, across every receiver,
      every class and every scope. So anchored_to_a_fixed_point returns True for
      a spelling as soon as ONE binding occurrence of it resolves, anywhere in
      the module, and the attribute branch at 2455-2459 then `continue`s,
      skipping the own-instance surface rule (2475-2493) and the
      external-attribute exemption (2495-2508). The own-instance surface rule is
      the mechanism whose own comment (lines 2029-2035) claims it covers "an
      attribute installed from outside the text (`setattr`, `__set_name__`, a
      metaclass), which is F-401's P1/P5/P8".
      PLANT A2 (body replacing DERIVED_POSITION, extra appended after module end):
        body = 'setattr(self, "_d", getattr(self, "page_" + "spec"))\n'
               'self._d(3 + len(section))\n'
               'first_answer_page = 1 + TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT'
        extra = 'class _Resolver:\n    def __init__(self):\n        self._d = interior_page_count\n'
      `_outcome` printed `()` — SILENT. The real bound geometry door page_spec
      is installed on `self` by setattr, called with the bare literal 3 in a
      page position, and the walk reports neither an offender nor a refusal.
      `_plant_refusals` for the plant's own window is empty.
      CONTROL (non-vacuity, and attribution of the cause): the IDENTICAL plant
      with `extra=""` printed `('refusal',)`, at line 6719:
      "an attribute of this module's own instance that BookPDFGenerator never
      spells, so it was installed from outside this text and may be a geometry
      door". So the single unrelated resolving occurrence of the spelling `_d`
      is exactly what launders it. `_plant` itself asserts DERIVED_POSITION
      occurs once and the body is 3 lines, so the plant cannot pass vacuously.
      THREE MORE SHAPES, same mechanism, all SILENT, each with its own refusing
      control without the resolving occurrence:
        B1  `__set_name__` installing by setattr (no Store on the attribute) +
            `class _Resolver: self._door = interior_page_count` -> ()
            ; without _Resolver -> ('refusal',) at 6718, the surface rule.
            B1 is DOOR_SHAPES row W29 with the installer's spelled store
            replaced by setattr and one resolving occurrence appended — i.e.
            a row this card asserts refuses, silenced by appending one
            assignment.
        B2  a metaclass `__getattr__` returning the door + _Resolver -> ()
        B3  `__getattr__` installed on the class by setattr + _Resolver -> ()
      NO LEVER. Exhaustive search over all 16 subsets of CALLEE_EXEMPTIONS
      (callee_exemptions=) found no setting under which the `_d` call is
      refused; the only refusals that appear when `builtins` is dropped are the
      plant's own `len`/`setattr`/`getattr` calls, not the door call. All four
      door_arms settings ([], ['callee identity'], ['door spelling'], both) give
      0 refusals for `_d`. So the shape has no exemption class, no cost step, no
      MEASURED_BLIND_SPOTS row and no control of any kind.
      IT IS ALSO A REGRESSION IN ACCOUNTABILITY. I drove the fork point's own
      guard (git show c2cb8e3e:tests/... exec'd in memory with __file__ inside
      the worktree's tests/, nothing written to tests/): A2 is silent at
      c2cb8e3e too, BUT
      `_plant_refusals(A2, RES, callee_exemptions=[... minus ONE_STEP_ANCHOR])`
      returns [(6719, 'a callee anchored one step and no further: this walk read
      the binding occurrence and did n...')]. At the fork point the silence had a
      named class, a cost step and a lever. This card deleted the class and left
      the silent pass behind it, which is verbatim what CARD-262's own
      ONE_STEP_ANCHOR docstring recorded about "Fix 1": "it was in no exemption
      list, cost nothing in the sequence below and no control could see it".
      THE SHAPE IS NOT ANY DECLARED ROW. MEASURED_BLIND_SPOTS' R3 reads "the
      EXTERNAL-ATTRIBUTE class: a setattr install on a receiver this module does
      not define ... W21 with the receiver changed from `self` to any object:
      `own_instance` is False". A2/B1/B2/B3 keep the receiver as `self`,
      own_instance is True, and the surface rule — not the external-attribute
      exemption — is the mechanism that is bypassed.
      REMEDY, MEASURED, AND FREE. In-memory mutant making the attribute
      branch's `continue` conditional on a refusal having been appended (one
      line, 2455-2459, in this card's own file — no src/ change, G-1 intact):
      A2 -> ('refusal',); module cost 0 refusals (23 sites, 6 vocabulary, 0
      refusals, identical to shipped); all 36 DOOR_SHAPES rows match their
      declared outcome; CHAINS_THAT_RESOLVE E1 -> [] and E2 ->
      ['a geometry door referenced without being called'], both as declared; all
      7 CHAINS_THAT_MUST_NOT_BE_SILENT rows -> ('refusal',). Nothing declared
      moves and the edge survives.
    confidence: high
    remediation_owner: this card (cycle 2)

  - id: F-2
    severity: major
    gating: true
    title: >-
      The premise that makes passing a resolved chain safe is false — a
      decorator puts an unspelled door at a `def` terminal — and the fixed
      point destroys the exemption lever that gated the same callee one
      alias earlier
    file: tests/test_book_export_interior_cover.py
    line: 2168
    adr: ADR-0039/R1 (a claim states only what the code and its tests demonstrate) and ADR-0039/R3
    ac: AC-1
    evidence: >-
      anchored_to_a_fixed_point's docstring (2168-2173) states the safety
      argument for the resolving pass: the chain is followed "until it reaches a
      binding this module's own text shows -- a ``def``, a ``class`` or an
      ``import``, whose identity is therefore visible, and which a geometry door
      cannot stand at without being **spelled**, which the pre-existing
      reference arm refuses". The card repeats it in section 1 ("Why passing a
      resolved chain is safe, and why that is the claim's edge").
      A decorator falsifies the premise. PLANT D2:
        extra = '_S = "spec"\nimport sys as _sys\n\n'
                'def _mk(f):\n'
                '    return getattr(_sys.modules[__name__], "book_page_" + _S)\n\n'
                '@_mk\ndef _deco_door(spec, position):\n    return position\n'
        body  = '_a = _deco_door; _b = _a\n'
                '_b(None, 3 + len(section))\n'
                'first_answer_page = 1 + TITLE_PAGE_COUNT + GUIDE_PAGE_COUNT'
      `_deco_door` is a `def` in this module's own text, so the chain resolves;
      at run time the decorator has replaced it with the real imported door
      book_page_spec, whose name is assembled ("book_page_" + _S) and never
      spelled, so the door-spelling arm never sees it. `_outcome` -> `()`,
      SILENT, and `_plant_refusals` is empty.
      AND THE LEVER IS GONE. The same callee called DIRECTLY (D3,
      `_deco_door(None, 3 + len(section))`, same extra) is also silent under the
      shipped exemptions, but it is ATTRIBUTABLE: dropping "definitions and
      imports" gives [(6718, "a callee bound by a definition or an import in
      this module's own text")]. Route it through one alias (D2) and dropping
      "definitions and imports" gives [] — because the resolving anchored
      branch at 2415 `continue`s before the definitions/imports branch at
      2356-2369 is reached. So this card strictly REMOVED an ADR-0039/R3 lever
      that existed at the fork point: a def-bound callee is gated, the same
      callee one alias away is gated by nothing. The same holds for C3, the
      variant whose decorator returns `getattr(BookPDFGenerator, "page_" + _S)`.
      NOTE FOR THE FIX ROUND, so it is not discovered the hard way: the naive
      symmetric fix in the Name branch (route a resolved chain past the anchored
      branch) is NOT free. I measured it in memory: CHAINS_THAT_RESOLVE E1 and
      E2 then fall into the ungated fall-through refusal ("a callee whose
      binding occurrences this walk recorded but has no branch for"), so the
      declared edge rows CHANGE. The correct shape is to resolve the chain to
      its TERMINAL key and apply that terminal's own branch and exemption, which
      is design work, not a one-line change. The attribute-branch fix in F-1 is
      the free half; this is the half that needs thought.
    confidence: high
    remediation_owner: this card (cycle 2)

