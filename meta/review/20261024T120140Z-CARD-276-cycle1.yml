    no restore was needed): (a) the conditional-continue fix, which closes F-1
    at 0 cost with every declared table unchanged; (b) the symmetric Name-branch
    version, which breaks CHAINS_THAT_RESOLVE E1/E2 into the fall-through
    refusal. Both results are in F-1 and F-2.

