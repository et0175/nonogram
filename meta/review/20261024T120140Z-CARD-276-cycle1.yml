    on this module, so no behavioural control for it can come from the module's
    text and every one must come from a plant. That is why F-1 and F-2 took
    plants to find and why neither the 104-test file nor 8 mutants could see
    them. The next card in this family should budget plants as the primary
    evidence, not as prudence — and should require, as a standing rule, that a
    guard key which identifies a value by SPELLING alone must either carry the
    receiver or refuse, because that is the level this card left open.

