    file: tests/test_book_export_interior_cover.py
    line: 1502
    adr: ADR-0039/R1
    ac: AC-6, AC-1
    evidence: >-
      Two claims, both added or rewritten by this diff, both falsified by F-1
      and F-2:
      (1) `_page_positions`' opening sentence, lines 1502-1505: "It fails closed
      on the whole door axis -- callee identity resolved to a **fixed point**
      over the alias chain, door spellings closed over the grammar", and at
      1521-1524 "On the door axis the default is **deny**: every ``ast.Call`` is
      refused unless this walk can positively anchor its callee from the
      constructs in this module's own text that bind a name". A2's call on
      `self._d` is "positively anchored" only by an occurrence of the same
      spelling in an unrelated class; its own callee is bound by nothing this
      module's text shows, and it is not refused.
      (2) The class docstring's axis table, lines 1183-1193, keeps the dead
      sentence *"A call whose callee's identity this walk cannot derive is a
      refusal"* and annotates it "**closed by CARD-276**: the sentence is true
      again, of a fixed point rather than of one step". It is not true again.
      A2, B1, B2, B3 and D2 are each a call whose callee's identity this walk
