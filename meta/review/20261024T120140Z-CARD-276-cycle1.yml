verdict: >-
  The chain-LENGTH level is genuinely resolved; the LEVEL as a whole is not.
  The hole moved exactly one more level of indirection, from "follow the alias
  chain" to "the key the chain is keyed on, and the terminal it lands on". Two
  plants reach the real geometry door with a bare literal page position and the
  walk reports nothing — no offender, no refusal — and neither has any lever:
  no subset of CALLEE_EXEMPTIONS and no DOOR_ARMS setting reds either. One of
  them is a strict accountability REGRESSION against the fork point, where the
  same shape was silent but attributable to the declared ONE_STEP_ANCHOR class.
  This is the family's fifth appearance. The remedy for the larger of the two is
  one line in this card's own file and costs 0 refusals with every declared
  table unchanged (measured), so a cycle 2 is affordable and worth taking.

