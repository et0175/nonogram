rulings_requested_by_the_brief:
  container_step_bound:
    reproduced: true
    evidence: >-
      Q3 `_t = [interior_page_count]; _d2 = _t[0]` -> ('refusal',) at 6719
      ("a local name bound to an expression at line 6718"); the same chain
      without the container, `_a = interior_page_count; _d2 = _a`, -> () and
      resolves. The orchestrator's reading is exact.
    ruling: >-
      COVERED IN SUBSTANCE, non-gating, worth one line. The claim the
      orchestrator was worried about — that "the transitive step costs 0
      refusals" might be read as "the walk resolves them" — is already
      forestalled in the shipped file: CALLEE_EXEMPTION_COST's attribute doc
      (3182-3190) states the 0 explicitly as "not one of this module's 816 calls
      reaches a callee key with an ``anchored`` binding occurrence at all -- the
      ``unreadable`` and ``opaque`` branches run first and catch every one of
      them". I verified that independently rather than taking it: instrumenting
      both anchored branches gives 0 hits in each over 816 ast.Call nodes. So
      the cost figure is not claiming resolution. What remains unstated is the
      precision loss itself — a container step refuses even onto a terminal the
      walk CAN see — which is fail-closed and therefore a bound, not a defect.
      It has no declared row and no control, which is acceptable only because it
      cannot hide a door. Recommend one sentence on ANCHOR_RESOLUTION_DEPTH or
      anchored_to_a_fixed_point; do not gate on it.
  parametrise_per_row:
    holds: true
    evidence: >-
      `./.venv/bin/python -m pytest -o addopts='' -q --collect-only` on
      TestDoorAxis_TheNextIndirectionIsNotSilentEither and
      TestGuardProse_EveryNamedControlExists collected 14 node ids, including
      test_a_chain_of_any_length_is_read_or_refused_and_never_silent[I1] through
      [I7] and test_a_chain_whose_terminal_this_module_shows_is_resolved_not_refused[E1]
      and [E2]. Whole file collects 104, matching the round's "104 passed".
      Every cell count the card reports is per-assertion-addressable.
  zero_cost_class_second_half:
    holds: true
    evidence: >-
      CALLEE_EXEMPTIONS_THAT_COST_THIS_MODULE_NOTHING = () and the attribute doc
      at 3209-3212 states the vacuity in so many words ("With it empty the
      second half of the narrowed rule ... is vacuous, and that is stated rather
      than left to be discovered: what carries the claim today is the equality
      itself"). Recomputed: the four-step cost sequence strictly drops at every
      step (760 -> 509 -> 203 -> 201 -> 0), so the equality does carry it.
  is_the_level_resolved:
    answer: "NO — this is the family's fifth appearance"
    basis: >-
      Answered with plants, not reading. The chain-LENGTH half IS resolved and
      the edge holds: I reproduced the orchestrator's Q1/Q2 reading from the
      other side and the mechanism discriminates by terminal, not by length.
      But F-1 and F-2 are two leverless silent door reaches, both one level of
      indirection beyond the one this card closed: the key the chain is keyed on
      (spelling-only, so a resolving occurrence launders every call on that
      spelling) and the terminal it lands on (a decorator can put an unspelled
      door at a `def`). F-1 is additionally a loss of accountability against
      c2cb8e3e, which had a named class and a lever for the same shape.

