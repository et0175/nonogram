      The diff rewrites reset_engine()'s closing claim from '**This docstring is the only
      statement of that convention and of the bound below**' to '**This docstring is the only
      statement of that convention, of CARD-252's record above, and of the bound below.**'
      That added clause is false on disk, and the drift it is supposed to prevent has already
      happened.

      tests/test_db_engine_lifecycle.py's MODULE docstring (lines 1-57) is a fourth text that
      states CARD-252's record in substance and in places verbatim: the defect mechanism ('kept
      it, pool and all, and connections opened before the DROP were handed back out after it'),
      the withdrawn AC-3 ('**AC-3 -- a deterministic reproduction of that corruption -- is
      withdrawn.**'), the precondition-not-the-race bound ('**So what is pinned here is the
      hazard''s PRECONDITION, not the absence of the race.**'), the two gate signatures
      (relation "puzzles" does not exist; uuid.UUID(hex=inf)), and the build-gate measurement.
      The same paragraph of reset_engine()'s docstring sends the reader to that very file.

      Measured drift, in my own domain (word-bounded regex over ast.get_docstring on both):
        keeper, src/nonogram/db/session.py:264  -- 'Four consecutive WAVES of this board''s build gates reported failures that reproduced on no second run'
        fourth text, tests/test_db_engine_lifecycle.py:15 -- 'Four consecutive BUILD GATES on this board reported failures that reproduced on no second run'
      Four waves of gates and four gates are two different measurements of the same evidence,
      live in two texts at once. This is the uncontrolled-doubling failure mode the card exists
      to retire, inside the card's own subject.

      ADR-0039/R1: what state would make a test red? None. Nothing in the repository reads that
      module docstring -- grep for __doc__/ast.get_docstring across tests/ returns only
      reset.__doc__ (:774), type(self).__doc__ (:879), _rebuild_public_schema.__doc__ (:881) and
      app_session.reset_engine.__doc__ (:882). The new AC-2 control reads three texts and that is
      not one of them, so a fifth copy tomorrow would also red nothing. AC-1 ('each clause of
      CARD-252's record appears **once**') is therefore not met as stated.
    suggestion: |-
      Either (a) narrow the sentence to what is measured -- e.g. 'of the convention and of the
      bound below, and of CARD-252's record except what tests/test_db_engine_lifecycle.py's
      module docstring states about why the hazard could not be forced' -- and reconcile the two
      'Four consecutive ...' sentences to one measurement; or (b) add the module docstring as a
      fourth entry in the AC-2 control's `texts` tuple, which costs one line and makes the
      uniqueness claim's scope the control's scope. (b) is cheaper and closes the drift. Do not
      leave the unqualified 'only statement of CARD-252's record' standing.
