findings:
  - id: F-001
    severity: high
    category: feature
    type: gap
    file: src/nonogram/admin/batch_generator.py
    line: 566
    title: "A targeted batch that runs out of its time budget reports no tier, and the new comment claims it does"
    description: |
      The diff threads the requested tier into the CARD-093 early-stop sentence and into a
      new abandoned-candidates sentence, but not into the `not_attempted` (time-budget)
      sentence at batch_generator.py:566-573 nor into the store-refusal sentence. The
      comment introduced at batch_generator.py:512-520 states "A batch that asked for a
      tier says so in every sentence below (CARD-138)", which is false for two of the four.

      Reproduced against this head (worktree on PYTHONPATH, orchestrator.generate scripted,
      orchestrator.generate_batch called with an injected monotonic that expires after five
      candidates), for `create_batch(count=20, sizes=[10], difficulty_tier="hard")`:

        status: BatchStatus.COMPLETE  stored: 5
        NOTE: "15 of 20 were never attempted: the batch reached its time budget first.
        This is not bad luck — the same request will stop in the same place — so ask for
        fewer puzzles, or for a smaller size. A puzzle costs about 0.06s at 20x20 and
        about 3.9s at 30x30, which is the whole of the difference."

      This matters because it is the shortfall mode the card's own feature makes MORE
      likely, not less: POL-004's resample multiplies the per-candidate cost, so a hard
      batch at 25-30 cells reaches BATCH_BUDGET_SECONDS (75s) far sooner than an untargeted
      one. The owner filling a book's medium/hard quota is handed a note that never names
      the tier and whose advice ("ask for fewer puzzles, or for a smaller size") omits the
      one lever that actually caused the cost — asking for Any. That is the card's
      objective 3 ("report honestly when it gives up") unmet on its most likely path.
      No test in tests/test_batch_difficulty_target.py covers not_attempted with a tier.
    suggestion: |
      Carry the tier into the not_attempted sentence the way the abandoned branch does —
      e.g. "{not_attempted} of {count}{target} were never attempted: ... ask for fewer
      puzzles, for a smaller size, or for Any difficulty, since a tier puts a resample
      behind every candidate" — and add a test. `orchestrator.generate_batch` already takes
      `budget_seconds` and `monotonic` as injectable parameters, so the case is scriptable
      without a real clock (wrap generate_batch, or pass them through). Alternatively,
      narrow the comment at :512-520 to the sentences that actually carry the tier — but
      the honest-reporting objective argues for fixing the note, not the comment.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

