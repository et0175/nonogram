findings:
  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 813
    title: "The identity keying is correct today and unreachable-to-break, but a future break is silent: no labels AND no notice (no count check)"
    description: |
      The review focus's own finding, judged on its merits: `_printed_places` writes
      `places[id(plan.printed[number - 1])]` (app.py:813) and the route reads
      `places.get(id(puzzle), {})` (app.py:3560), so the screen's labels depend on the
      row objects the route holds being the *same objects* the plan carries, across a
      module boundary.

      **Is it correct today? Yes, on every path that exists.** Verified, not assumed:
        * `print_order` (book_pdf_generator.py:414-420) builds `ranked = list(puzzles)`
          and returns `ranked[index]` — the same objects, reordered, never copies;
        * `section_plan` appends `printed.append(puzzle)` — the row itself
          (book_pdf_generator.py:1872);
        * the route calls `puzzle_review.get_puzzle(puzzle_id)` **once** per member and
          puts that one object into both `rows` (which the template iterates) and
          `puzzles_in_book` (which `_printed_places` receives), so both modes are safe:
          legacy in-memory returns the stored dict (puzzle_review.py:1107) and DB mode
          returns a fresh `_row_to_dict` (1116) — freshness is irrelevant because it is
          fetched once and reused;
        * the inverse collapse (two rows that ARE the same object) needs a book holding
          one puzzle twice, which `book_manager` forbids on both branches
          (`new_puzzles = [pid for pid in puzzle_ids if pid not in existing]`,
          book_manager.py:1223 and 1263) as well as inside one submission.
      So there is **no reachable failure today**, and the keying is strictly better than
      the `str(id)` it replaced for the case F-003 named.

      **Is the concern real? Yes, as a regression-detection gap, not as a bug.** If the
      coupling ever stops holding — a copy, a re-fetch, a `print_order` that builds new
      objects — every lookup misses, no exception is raised, `page_plan_failed` stays
      False, and the screen renders with no page labels and no notice: the exact
      silent-misinformation mode F-002 was fixed to remove. Nothing in the code detects
      "the plan holds N printed rows and I labelled 0 of them".

      Mitigating evidence, measured rather than assumed: mutant M2 injected precisely
      that break (keying by an object the route never holds) and **17 tests failed**,
      including `test_a_planned_book_shows_no_such_notice`. The suite therefore guards
      the coupling for in-memory mode; what it cannot guard is a mode or refactor the
      corpus does not exercise (DB-mode row plumbing, a future caller of
      `_printed_places` that passes its own copies).
    suggestion: |
      Keep the identity key — it is the safest of the three candidates — and close the
      detection gap, not the keying:
        (a) cheapest and sufficient: after the lookup loop, compare the labelled rows
            with the plan's own count and flip the existing flag —
            `if sum(1 for p in puzzles_in_book if p["page"] is not None) < expected:
             page_plan_failed = True`, where `expected` is `len(plan.printed)` returned
            from `_printed_places` (a third return value, or a small result object). A
            total miss then renders the notice the fix already built, and a partial miss
            is reported instead of drawn.
        (b) if a key with no identity coupling is wanted, the stable one is the row's
            **position in the caller's list**: `print_order` already works on positions
            (`book_level_order(range(len(ranked)), ...)`), so `SectionPlan` could carry
            `printed_positions: List[int]` and the route could zip by index. But note it
            is not strictly better: a positional key fails *unsafely* (a row gets another
            row's page) where identity fails *safely* (no label at all), and it would
            reintroduce the collapse for a duplicated row object. Identity + (a) is the
            better combination; do not swap the key on its own.
    confidence: high
    source: static
    violates: null
    root_cause: RC-3
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-006
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 3546
    title: "The declared exception set routes the walk's own precondition ValueError to the book-fault warning, not to the ERROR clause it was written for"
    description: |
      F-002's fix declares `(RuntimeError, ValueError)` as "the failures the seam
      declares" and logs them as a one-line warning naming the book, reserving
      `except Exception` + `logger.exception` for "a bug in `_printed_places` itself".
      The set is right about breadth — I read every raise on the path and there is
      nothing outside it that ought to be a warning: `book_page_spec` raises only
      `ValueError` (book_page_spec.py:202, 208, 210, 218, 255, 261, 266, and it converts
      `decimal.InvalidOperation` itself), and the walk raises `ValueError`/`RuntimeError`
      only.

      There is one *vice-versa* case, which is the direction the fix cared about.
      `puzzle_pages` and `puzzle_section` each open with
      `if ids is not None and len(ids) != len(payloads): raise ValueError("ids must be
      parallel to payloads: ...")` — a **caller precondition**, i.e. exactly the
      "renamed plan field / changed index" class the second clause exists to log with a
      traceback. It would land in the warning clause instead: no traceback, and a log
      line that reads like a book whose stored specification is at fault. Not reachable
      today (`section_plan` appends `ids`/`printed`/`payloads` in lockstep in one loop,
      so the lengths cannot diverge), and the screen behaves identically either way —
      only the log's classification is wrong, which is the whole thing the fix bought.
    suggestion: |
      Optional and cheap: either narrow the warning clause to the failures that really
      come from stored data (catch `ValueError` around the `BookPDFGenerator(book)` /
      `page_spec` construction, and let the walk's precondition reach the ERROR clause),
      or say in the comment that a parallel-ids ValueError is a seam bug logged at
      WARNING and is left that way deliberately. A comment is enough — the state is
      unreachable.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-007
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/book_arrange_puzzles.html
    line: 83
    title: "A row the book will not print is rendered inside the previous page's run with no marker (the mixed state the notice does not cover)"
    description: |
      The mixed state the fix round created coverage for but not UI for. When *some*
      rows lack labels — a member whose stored record `_payload` cannot read, which
      `test_an_undrawable_member_shifts_no_other_rows_page` now constructs — the plan
      exists, so `page_plan_failed` is False and no notice appears (correct: the plan is
      not missing). The row is still listed, and carries no `data-page` and no break of
      its own. In document order that puts it **between** the "page 3" and "page 4"
      labels, so a reader applying the screen's own convention ("the rows under a label
      are on that page") reads it as printing on page 3 alongside its neighbour — while
      the book will not print it at all, and the label does not say "· two puzzles".
      The test pins exactly this rendering (`shown_rows(markup) == [3, None, 4]` with
      labels `["page 2 · Easy divider page", "page 3", "page 4"]`), so it is deliberate
      rather than overlooked — but nothing on the screen distinguishes the row.

      Much milder than F-002's total case, and that asymmetry is real: here the row is
      locally anomalous (its neighbours carry numbers), whereas a blanked screen is
      uniform and therefore unreadable as a failure. The export logs and drops the same
      row, so the book is right either way. Display only.
    suggestion: |
      One line in the row, guarded by the flag that already exists in the context:
      `{% if not puzzle.page %}<span class="text-muted">not printed — see step
      {{ stepper.book_step_number(4) }}</span>{% endif %}` (tokens only, no literal),
      or fold it into F-005's count check and report "n of m rows could not be placed"
      with the existing notice. Either way the rule stays: the screen reports the plan,
      it does not compute one.
    confidence: medium
    source: static
    violates: null
    root_cause: RC-3
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

fix_round_verification:
  - "F-001 (the unreproducible measurement) — the pin test genuinely re-derives. `test_extent_alone_would_disagree_with_the_book_on_this_corpus` computes `measured` from corpus_books() → corpus_rows() → planned_by_hand()'s own `offered` log → compute_pair_layout under two flattenings, and asserts `measured == CORPUS_MEASURED`, a module-level **literal** dict {books 24, puzzles 164, same_tier_neighbours 99, verdicts_offered 93, flips 10/10}. Nothing in the assertion is computed by the thing it checks: `same_tier_neighbours` is counted in the test body from an independent re-sort (its only overlap with planned_by_hand is _RANK), `puzzles` from the corpus generator, the flips from the layout authority. The two extra asserts (offered <= same-tier neighbours; flips > 0) are the properties that survive a re-seed. It is not a test that cannot fail."
  - "F-001's widening of planned_by_hand — `offered: Optional[List[...]] = None` is a pure out-parameter: `paired` is computed before the append, the append is inside `if offered is not None`, and no branch of the walk reads it. planned_by_hand still imports only nonogram.export.layout and nonogram.admin.book_page_spec, never book_pdf_generator, and AC-4 calls it with the default. Independence from the generator's walk is intact; the parameter only stops the measurement being a fourth implementation."
  - "F-002 (the catch-all) — the declared set is right in breadth (every raise on the path read; see F-006 for the one misclassified direction). The notice renders where the fix claims: inside `{% if puzzles %}`, above the first level group, i.e. where the first page label would have been. Its guard is real (mutant M6 killed by exactly the test that asserts it) and the two-clause distinction is real (mutant M7 killed by exactly the traceback test). tests/test_admin_design_tokens.py green; no new colour/px/font literal entered the template; the markup is book_setup_print.html:91's pattern. The mixed state degrades sanely for the plan (no shifted pages, proven by test_an_undrawable_member_shifts_no_other_rows_page and mutant M3) but not for the reader — F-007."
  - "F-003 (identity keying) — `SectionPlan.printed` is purely additive on the export path: `interior_stream` reads puzzles/ids/payloads/pages and never `printed`; the dataclass is constructed by keyword in the one place that builds it, so the new positional field breaks no caller (`grep SectionPlan(` = 1 construction site, plus `dataclasses.replace` in one test). The eager half of interior_stream is still the same three steps in the same order (the whole-diff removal list shows only the moved block), the answer-key input and both 1..n tripwires are untouched, and tests/test_book_pdf.py, tests/test_book_pdf_two_up.py, tests/test_book_answer_key.py, tests/property/test_book_export_interior.py and the A4 goldens are green on 71f9b41. Cycle 1's strongest guarantee is not eroded. The keying itself: correct today, no reachable failure — F-005 covers the detection gap."
  - "F-004 (AC-4's key) — `shown_plan` counts the rows carrying `data-page` 1..n in document order, and `data-page` is emitted exactly when the identity lookup hit, i.e. exactly for the rows the plan holds. That IS the plan's numbering, not a new coincidence: print_order and the screen's grouping are the same order (INV-009, re-verified), and if they ever parted the page *values* would part too and the comparison would fail rather than silently realign. The regression is caught: mutant M8 restored the old membership-counting numbering and `test_an_undrawable_member_shifts_no_other_rows_page` failed — it is the only test in the file that can tell the two apart, which is exactly why the fix added it."
