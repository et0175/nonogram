  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_band.py
    line: 920
    title: "Docstrings claim the pixel tests catch any second offset copy of a band, but a copy that lands on the drawing's ink passes them all"
    description: |
      The section comment (lines 919-924) says: "A second copy drawn at an offset either widens or
      heightens the line ... or makes a line of its own ... both fail the tests. Two copies drawn at
      exactly the same spot ... that case is the recorder's (AC-3)". The class docstring of
      TestBookPdf_BandPrintsOnceInTheExportedPdf (lines 1123-1125) says it "Fails if _set_band ... or
      COMP-007's header ... prints a second, offset copy of a band, or if a band's line turns up on
      any other page". Both claims are wider than the tests. Mutant: a second _set_band draw.text at
      center_y + 300 (and again at + 700). Both are clearly printed on page 3: the y+300 copy sits over
      the column clues (render at scratchpad/m3_y300_page3.png). All 9 pixel-class tests still pass.
      _lines merges the copy with the clue or grid ink into a line that matches no reference, so
      _find reports exactly the original five bands. The strip test only looks at the 12 mm strip.
      Only the recorder (TestBookPdf_ExtraBandDrawNeverReachesAWrittenPage) fails. The same blind
      spot applies to "turns up on any other page": a band set over other ink on a divider or answer
      page would not be found. The card's verdict still stands, because the recorder covers the gap.
      But the AC-1 test cell and the comments say the pixel class proves something it does not.
      This is the over-claim pattern behind the wave 28-32 escalations.
    suggestion: |
      Narrow the wording at lines 919-924 and 1123-1125: the pixel class catches a second copy that
      lands in clear space (the band strip, the margins, the gap between slots) or that touches the
      band line. A copy that overlaps other ink (clues, grid, captions), like a copy at the same spot,
      is caught only by the recorder (AC-3). Optionally add a Worktree-notes line recording mutant
      y+300 (pixel class survives, recorder kills).
