findings:
  - id: F-201
    severity: medium
    category: tech-debt
    type: gap
    file: tests/property/test_export_roundtrip.py
    line: 10
    title: "Two entries in the module docstring's index still name functions that do not exist"
    description: |
      Lines 10-14 map two of the card's engineering constraints onto pytest
      function names:

          PropertyTest_Export_MetadataCarriesBothDimensionsForAnyPuzzle  (ADR-0023/R1)
              -> test_metadata_carries_both_dimensions_for_any_puzzle
          PropertyTest_Export_RejectsEveryVersionOtherThanItsOwn  (ADR-0023/R2)
              -> test_rejects_every_version_other_than_its_own

      Neither snake_case name exists anywhere in the repo:
      `grep -rn "def test_metadata_carries_both_dimensions_for_any_puzzle\|def
      test_rejects_every_version_other_than_its_own" tests/` returns nothing.
      The real functions are
      `test_property_export_metadata_carries_both_dimensions_for_any_puzzle`
      (line 613) and `test_property_export_rejects_every_version_other_than_its_own`
      (line 682) — the index is missing the `test_property_export_` prefix on
      both arrows.

      Provenance, so the fix is aimed correctly: these arrows were written in
      6a69090 with the functions already carrying the longer names, so they
      have never resolved. Cycle 1's F-002 examined this exact index block and
      asserted the opposite — "every other entry in it ... resolves to a real
      function" — which is why the fix commit corrected only the AC-060/AC-061
      entries and left these two. This is the same defect class F-002 named
      (an index claiming a mapping that does not exist), still live in the
      cycle-2 code.

      Bounded, not fatal: the PascalCase trace-ids DO resolve by grep, because
      each real function's own docstring opens with its id (lines 614 and 683).
      So the two ADR-0023 engineering constraints are genuinely verified and
      the check-refs are findable — it is the index's arrows, and only those,
      that are dead. Hence medium rather than the high cycle 1 gave F-002,
      where the target tests did not exist at all.
    suggestion: |
      Change the two arrows to the actual function names:
      `test_property_export_metadata_carries_both_dimensions_for_any_puzzle`
      and `test_property_export_rejects_every_version_other_than_its_own`.
      Worth pairing with the standing rule proposed in the family-regression
      note: a cheap grep gate (every `-> test_...` arrow in a test module's
      index resolves to a `def` in that module) would have caught this and
      cycle-1's F-001/F-002 mechanically.
    confidence: high
    source: static
