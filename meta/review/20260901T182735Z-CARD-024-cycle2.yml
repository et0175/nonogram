  - id: F-207
    severity: info
    category: ops
    type: risk
    file: tests/property/test_export_roundtrip.py
    line: 1
    title: "Family regression across three cards — proposal for a standing rule"
    description: |
      Cycle-1's F-002 and F-003 were both "a docstring asserts a checkable fact
      that does not hold as stated". Per the orchestrator, the same family has
      since dominated CARD-032 and CARD-034. This cycle's F-201, F-202 and
      F-203 are three more members, in this card's own files:
        * F-201 — an index arrow naming a function that does not exist (the
          same index block cycle 1 audited and cleared);
        * F-202 — four claims citing a superseded AC, a stale size range, and
          a removed metadata key;
        * F-203 — a commit message claiming a fix the commit does not contain.

      That is four cards in a row. It is a project-level pattern, not a
      per-card slip, and it is worth promoting to a standing rule rather than
      re-learning card by card. Two mechanical checks would have caught every
      instance above except F-203:
        1. every `-> test_...` arrow in a test module's traceability index
           resolves to a `def` in that module (catches F-201, and cycle-1's
           F-001/F-002);
        2. no docstring or comment cites an AC/FR/EC id whose
           requirements.yml status is `superseded` (catches F-202).
      Both are grep-and-parse, no new dependency. Suggest routing through
      forge:retrospective's family-clustering step for promotion into an ADR
      rule or a requirements delta.
    suggestion: "Raise with forge:retrospective as a family for promotion into a standing rule; the two checks above are cheap enough to run in the CI gate."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
