      request is no longer merely large, it is INVALID". The corpus's choice
      of 1..50 is still defensible — the export boundary is deliberately wider
      than the source-mode range, and the file says so at lines 188-192 — but
      the authority it cites for the number no longer exists.

      Two neighbouring statements in the same file have the same shape:
