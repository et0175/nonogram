  - id: F-106
    title: '`_claude_md_rows` denies more than it claims: any CLAUDE.md line containing `COMP-<digit>` anywhere, prose or fenced code block'
    severity: minor
    category: test-coverage
    file: tests/test_cli.py
    line: 1136
    evidence: |
      The test is named `test_claude_md_states_no_component_row_of_its_own` and its message says
      "CLAUDE.md carries component-map rows again". The implementation is broader: `_COMPONENT_ID =
      re.compile(r"COMP-\d")` is searched anywhere in any line of the whole file, with no scoping to the
      layout block and no exclusion of fenced code blocks.

      PROBED the two patterns directly against candidate future lines:
        REDS: 'The solver (COMP-005) is the correctness-critical component.'   <- ordinary prose, one id
        REDS: 'conftest.py      # shared fixtures'                            <- inside a code block
        PASS: 'docs/GENERATION_ALGORITHM.md   the generation pipeline'        <- multi-segment path
        PASS: 'tests/README.md    the suite guide'
      So a future card that wants to name a single component id in a sentence -- a legitimate and likely
      thing for an instruction file -- has to either not do it or edit this guard, and the failure message
      will tell it that it added a "component-map row". Deny-side, so it cannot hide a defect; it is a
      false-positive cost and a naming/message mismatch, which is why it is Minor rather than Important.
      Fix: either scope the search to the layout block, or rename the test and the message to what the
      control actually forbids (no component row AND no component id anywhere in CLAUDE.md) and say in the
      docstring that the id ban is deliberate.
    status: open

