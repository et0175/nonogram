verdict: >-
  The card does what it set out to do in the direction it measured: both maps are corrected, the
  canonical map now carries 13 rows for the 13 components the import walk enumerates, the control is
  derived from the package rather than hand-written, it denies in four directions and each deny names
  the offender, and the layering guard is provably untouched. Two findings gate. Both are the card's
  own subject applied to the card's own output -- a claim shipped into CLAUDE.md that no control can
  fail on, and a column of the canonical map that is silently unheld although an enumerable authority
  for it exists in this repository. Neither is a code defect; both are control-coverage defects, which
  is the only class of defect a card like this can have.

findings:
  - id: F-101
    title: 'CLAUDE.md''s control forbids the row SHAPE, not the component CONTENT -- and the shipped file already carries an uncontrolled component claim'
    severity: important
    category: test-coverage
    file: CLAUDE.md
    line: 42
    evidence: |
      The shipped sentence ends: "One thing the retired block got wrong is worth repeating here
      because a brief is acted on: there are **three** inbound adapters (`cli.py`, `web/` and
      `admin/`), not one."

      Nothing can red on that clause. The only control that reads CLAUDE.md is `_claude_md_rows`
      (tests/test_cli.py:1137), which flags a line only if it matches `^\s*[A-Za-z_]\w*(?:\.py|/)\s{2,}\S`
      or contains `COMP-\d`. I fed that reader the shipped clause verbatim: it does not match either
      pattern. So the count "three" and the three module names are a partial, unpinned second copy of
      the map in the file the card set out to remove the map from.

      EXECUTED PLANT (diagnosis half, not certification). I appended a full prose restatement of the
      component map to CLAUDE.md, immediately above the layering paragraph, carrying four of the exact
      falsehoods the card''s `## Why` table measured -- "cli.py is the only inbound adapter", "library
      and image modes still future work", "difficulty.py is not yet built", "export/ is not yet built
      either" -- with no tabular rows and no COMP ids. Result: `pytest tests/test_cli.py -k
      TestComponentMap` -> 11 passed, 96 deselected; full `tests/test_cli.py` -> green. The drift the
      card exists to prevent came straight back, in the file every session loads, with zero signal.
      Restored: `shasum -a 256 -c` OK on all three files plus `diff -q`.

      WHAT STATE WOULD MAKE IT RED: none exists. No control reads CLAUDE.md for component content.
      DOES THAT STATE EXIST TODAY: yes -- the inline adapter clause is in the file as shipped.

      Partial backstop, stated so the finding is not overdrawn: `_ADAPTERS = frozenset({"cli", "web",
      "admin"})` (tests/test_cli.py:748) is pinned literally, so a fourth adapter reds there and forces
      a deliberate edit; and `__init__.py` would need a fourth adapter row because the row set is
      derived from the walk. CLAUDE.md''s "three" is the one of the three places that rots silently --
      which is exactly how "the only inbound adapter" rotted from 2026-09-08 to 2026-10-22.

      GATING REASON: ADR-0039/R1 -- a claim needs a control that can fail; a claim whose control cannot
      fail is narrative and must be narrowed or deleted. ADR-0039/R3 -- the bound the author declared
      ("prose with no ids evades it", in the `TestComponentMap_ThereIsOneRowPerComponentAcrossBothFiles`
      docstring) carries no control for what it must not absorb; nothing in the suite pins the extent of
      that hole, so a future reader cannot tell prose-that-evades from prose-that-reds without running
      the experiment I just ran. And AC-3''s own stated purpose -- "exactly one place a row can drift
      from" -- is not reached for the adapter count. The author''s own argument against a held CLAUDE.md
      copy ("rows pinned by name beside unpinned prose is a control that looks stronger than it is")
      applies to the clause that was kept.

      MINIMAL FIX, either one: (a) delete the count and have the clause point at the canonical map and
      at `_ADAPTERS` instead of restating a number; or (b) keep it and give the bound a control --
      a committed test that pins what `_claude_md_rows` does and does not absorb, including a prose
      component statement, so the hole is measured instead of asserted in a docstring.
    status: open

  - id: F-102
    title: 'The canonical map''s COMP-id/CAP-id columns are unheld, an enumerable authority for them exists, and the declared bound absorbs them under the word "descriptions"'
    severity: important
    category: test-coverage
    file: tests/test_cli.py
    line: 1182
    evidence: |
      `_map_defects` compares only the NAME token of each row against the walk''s component set. The
      COMP id and CAP id that follow the name are never read by anything.

      EXECUTED PLANTS (diagnosis half) on src/nonogram/__init__.py, each restored and digest-verified:
        C. `solver/          COMP-005  CAP-003` -> `solver/          COMP-004  CAP-009`
           (a wrong component id AND a CAP id that belongs to nothing) -> 11 passed. GREEN.
        D. `clues.py         COMP-004` -> `clues.py         COMP-005`
           -> two rows now claim COMP-005, COMP-004 has vanished from the map entirely -> 11 passed.
           GREEN.
        E. `difficulty.py`''s description replaced by "not yet built (later card)" -- the literal defect
           this card was raised to fix -> 11 passed. GREEN. (This one is the declared AC-5 bound and I
           file no finding on it; it is here to show the three plants are the same single mechanism.)

      WHAT STATE WOULD MAKE C OR D RED: none. DOES THAT STATE EXIST TODAY: no -- all 13 ids are
      currently correct, which is why this is a coverage gap and not a live defect.

      THE AUTHORITY EXISTS. `meta/architecture/c4/components-CTX-001.puml:93` carries
      `Component(difficulty, "COMP-006 Difficulty Scoring", "Python - difficulty.py", ...)`, and lines
      :100 and :102 do the same for COMP-009/`admin/` and COMP-010/`db/`. The id-to-module pairing is
      enumerable from the model the project already keeps, which is precisely what ADR-0039/R2 asks a
      guard''s set to be derived from.

      WHY THE BOUND IS HONEST BUT NOT NARROW. `_map_defects`'' bound paragraph says the control "holds
      the **row set** and nothing else... cannot judge a row''s **description**", and offers
      "scores 0..100 from the solver''s rung tags" as the example. A reader takes "description" to mean
      the English gloss. A COMP id is not an English gloss: it is a structured identifier, with an
      authority, that `meta/architecture/trace.yml` and the C4 diagrams key on, and it is the first
      thing CLAUDE.md''s new sentence names when it defines what the map is ("which module carries which
      COMP id, and what each one does"). The bound as worded absorbs that column without naming it.

      GATING REASON: ADR-0039/R3 -- an exemption is a claim, and every exemption carries a control for
      what it must NOT absorb. This one absorbs an enumerable column silently. ADR-0039/R2 -- where an
      authority the runtime can enumerate exists, the set is derived from it. Note that CLAUDE.md''s
      prose does NOT overclaim here (it says the classes "hold that docstring to the modules"), so this
      is an under-specified bound plus an unused authority, not a false statement.

      MINIMAL FIX, either one: (a) extend `_map_defects` with a fourth row-level comparison against the
      ids enumerated from `meta/architecture/c4/components-CTX-001.puml`, which also closes "two rows
      claim one id"; or (b) if that authority is judged too soft to pin, name the COMP-id and CAP-id
      columns explicitly in the bound paragraph as unheld, say that an authority exists and was not
      used, and add the two-rows-one-id case as a stated, measured hole.
    status: open

  - id: F-103
    title: '`_canonical_map`''s docstring attributes the four-space rule to the "::" literal blocks; the parser actually claims every four-space-indented line in the docstring'
    severity: minor
    category: documentation
    file: tests/test_cli.py
    line: 1105
    evidence: |
      The docstring reads: "A map row is a line indented exactly four spaces -- the literal blocks the
      docstring introduces with ``::`` -- whose first token is a module or package name." The code never
      looks for `::`; it is `if not line.startswith("    "): continue` over the whole docstring. The deny
      region is therefore the entire docstring, not the three `::` blocks.

      EXECUTED (both restored, digests verified):
        B1. added `For example::` + a blank line + `    nonogram generate --size 20 --density 30` to the
            docstring -> 3 failed, 8 passed. The failure names the line:
            "unanalysable map lines: ['nonogram generate --size 20 --density 30']".
        B2. same with `    $ nonogram serve` -> 3 failed, 8 passed.

      MY VERDICT ON BOUND 3: this is default-deny working, not a brittle parser. ADR-0039/R2''s words are
      "a shape it cannot analyse is a FAILURE, never a silent pass", the failure names the offending line,
      and the remedy a future card needs (indent differently, or shape it as a row) is obvious from the
      message. The author declared the cost accurately in the worktree notes. The only defect is that the
      parser''s own description of its reach is looser than its reach -- a claim about a control, which is
      this card''s family. One clause fixes it: say the deny region is every four-space-indented line in
      this docstring, `::` block or not.

      WHAT STATE WOULD MAKE IT RED: nothing -- a docstring is not executed. DOES THAT STATE EXIST: the
      mismatch is in the file as shipped.
    status: open

  - id: F-104
    title: 'The 63% figure''s denominator does not reproduce on the tree it shipped: 46,260 is the pre-card tree, 46,289 is 604cc542'
    severity: minor
    category: documentation
