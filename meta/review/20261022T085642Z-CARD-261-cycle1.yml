      WHY THIS IS ONLY MINOR, verified rather than assumed: `grep -nE "29,?358|46,?2[0-9][0-9]|63%"` over
      `CLAUDE.md` and `src/nonogram/__init__.py` returns nothing. The figure was never shipped into either
