    status: open

acceptance_criteria:
  - id: AC-1
    verdict: MET
    evidence: >-
      Re-derived independently, twice, without reusing the test''s own list. My own walk of
      src/nonogram/**/*.py taking the top-level name under the package yields 13 components:
      admin, analysis, cli, clues, db, difficulty, errors, export, limits, orchestrator, solver,
      sourcing, web -- identical to the set the test derives from `_MODULES`. I then re-implemented
      `_canonical_map` in an isolated script (`python -I`) and ran it over both docstrings:
      fac4896f gives 11 rows, 0 unanalysable, missing ['errors', 'limits']; 604cc542 gives 13 rows,
      0 unanalysable, 0 missing, 0 rows naming no component, 0 duplicates. The card''s red reason
      (11 of 13, errors.py and limits.py carried as prose) reproduces exactly.
  - id: AC-2
    verdict: MET with a noted weakening
    evidence: >-
      Both deny directions are demonstrated, and each failure names the offender -- I ran the four deny
      branches by hand through the plants in F-101/F-102 and they name the module, the row, the duplicate
      and the unanalysable line respectively. The weakening: the COMMITTED plants are set-level
      (`_component_modules(_MODULES) | {"planted_component"}`) rather than on-disk, so the committed
      suite never exercises a real new file through the walk. That is the shape `_outward_imports`
      already uses and the card sanctions it, and a real on-disk module would red through AC-1''s test
      because `_MODULES` is derived at import -- I confirmed this by planting a 4-space-indented line in
      the real docstring (F-103) and watching the real composition red. Also noted:
      `test_removing_the_planted_module_passes` asserts exactly what
      `test_every_component_the_walk_finds_appears_exactly_once` asserts, so it is a duplicate rather
      than a second observation. No finding filed.
  - id: AC-3
    verdict: 'MET as to the shape; the reasoning is sound but the one inline clause is not justified -- see F-101'
    evidence: >-
      The shape shipped is the first of the two the AC offers: `grep -n "COMP-" CLAUDE.md` returns
      nothing, the layout block is gone, and `git diff` shows exactly one hunk at CLAUDE.md:39. The
      three-part argument for that choice is sound, and I checked each part rather than accepting it.
      (1) The drift really was in both copies and in different places -- fac4896f''s docstring had the
      five "(later card)" annotations and CLAUDE.md had the stale adapter and sourcing clauses; I read
      both. (2) The claim that a held copy would carry descriptions, which no enumeration can hold, is
      confirmed empirically: my plant E put "not yet built (later card)" back on `difficulty.py` and all
      11 tests stayed green, so a pinned-rows/unpinned-prose copy is exactly as weak as the author says.
      (3) G-2 does forbid a third copy. The decision is right. What is not justified is the exception it
      carved: the inline adapter clause is a partial second copy whose prose is unpinned, which is the
      condition argument (2) was used to rule out.
  - id: AC-4
    verdict: MET
    evidence: >-
      Verified the zero-removed-lines claim myself: `git diff -U0 fac4896f..604cc542 -- tests/test_cli.py
      | grep -c "^-[^-]"` returns 0, and `--numstat` reads `261 0 tests/test_cli.py`. So `import re` is a
      pure insertion and `_ADAPTERS`, `_SHARED`, `_LAUNCH_EDGE`, `_rank`, `_outward_imports`, `_MODULES`
      and `_component` are byte-identical to fac4896f. Re-ran the existing parametrisation rather than
      asserting it: the 17 walk/layering guards pass, exit 0, matching the implementation''s figure.
  - id: AC-5
    verdict: 'MET as written; the bound is honest but not narrow -- see F-102'
    evidence: >-
      The bound is declared in `_map_defects`'' docstring in its own paragraph, and it is true: a row may
      be present, unique and describe its module wrongly and the control passes (plant E, green). No test
      in the diff claims otherwise. The shortfall is scope, not honesty -- the paragraph names
      "descriptions" and silently includes the COMP-id and CAP-id columns, for which an authority the
      runtime can enumerate exists at meta/architecture/c4/components-CTX-001.puml.

