      "`find src/nonogram -name '*.py' | xargs wc -l | tail -1` for the denominator".
      Run at 604cc542 that command returns 46,289, not 46,260.

      RE-DERIVED BOTH WAYS. At 604cc542: denominator 46,289 (`wc -l`; a Python newline count gives 46,291,
      two files lacking a trailing newline), numerator 29,358, so 63.4%. At fac4896f (the pre-card tree,
      extracted with `git archive` into a scratch directory): denominator 46,260, numerator 29,358. The
      29-line gap is exactly this card''s own `+55/-26` on `src/nonogram/__init__.py`, so the figure was
