  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/generated_puzzles.html
    line: 216
    title: "The server's refusal reason is now sent and then discarded — the owner sees a bare \"Error\" badge"
    description: |
      `_action_result` puts a `message` in every JSON body, including the refusals
      ("Cannot approve a puzzle that is in a book", app.py:1976 / 1999). The fetch handler
      never reads it: a non-2xx throws at generated_puzzles.html:201 and the catch writes
      `<span class="badge" data-status="failed">Error</span>` (line 219). Because the JSON
      branch returns before `flash(...)` (app.py:1984 / 2007), no message reaches the next
      page load either.

      FAILURE SCENARIO: the owner rejects a puzzle that a book holds. The badge reads
      "Error"; reloading the page shows the puzzle unchanged with no explanation, and the
      CARD-100 wording that exists specifically to stop them hunting for a missing row is
      never shown on the JavaScript path.

      NOT a regression — before this diff the fetch followed the 302, consumed the flash in
      the redirected GET, and then LIED, painting "✓ Approved" over a refused puzzle. The
      new behavior is strictly more truthful and is correctly inside the card's scope
      ("a failed action changes nothing"). The finding is that the diff introduces a
      `message` field with no consumer while a one-line change would surface it.
    suggestion: |
      In the catch, read the body when there is one and show its `message` (an alert, or a
      title on the badge) instead of the bare word "Error".
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/templates/generated_puzzles.html
    line: 216
    title: "A throw inside applyActionCounts would repaint a SUCCEEDED action as \"Error\""
    description: |
      `return response.json().then(data => applyActionCounts(...), () => {})` (lines 216-219)
      runs inside the success `.then`. The second argument guards a JSON-parse failure, but a
      synchronous throw inside `applyActionCounts` itself rejects the returned promise and
      falls through to the shared `.catch` (line 220), which re-enables the action button and
      overwrites the already-correct status badge with "Error" — for an action the server
      actually performed.

      TRIGGER: a button rendered with `data-bulk-action` but missing `data-confirm-one` /
      `data-confirm-many` makes line 175 call `.replace` on `undefined`. Today the macro
      always emits the three attributes together, so this is narrow — but it is exactly the
      shape of failure a future edit to the bulk-button markup would introduce, and the
      symptom (a successful reject reported as failed) is worse than the cause.
    suggestion: |
      Apply the counts in a `.finally`-style step, or wrap the `applyActionCounts` call in
      its own try/catch, so bulk-button bookkeeping can never retroactively mark a completed
      per-puzzle action as failed.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

