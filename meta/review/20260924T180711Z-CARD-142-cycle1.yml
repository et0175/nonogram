findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_batch_bulk_button_state.py
    line: 158
    title: "AC-1's \"the confirmation names 1\" clause is not covered: deleting the script's sentence-rewiring leaves the whole suite green"
    description: |
      `_assert_wiring` (tests/test_batch_bulk_button_state.py:158-171) pins four source
      strings: the Accept header, `[data-bulk-action]`, `button.disabled = count === 0`,
      and `data.action_counts` after `fetch(`. It pins NOTHING about the second half of
      the display rule — the three lines at
      src/nonogram/admin/templates/generated_puzzles.html:175-179 that build the sentence
      from `data-confirm-one`/`data-confirm-many`, substitute `{n}`, and reassign
      `form.onsubmit`.

      MUTATION EVIDENCE (mutant M5): deleting exactly those three lines leaves all 20 tests
      in this file, plus tests/test_card_068_batch_curation.py,
      tests/test_admin_review_actions.py and tests/test_card_100_book_membership.py, green.

      FAILURE SCENARIO with that regression shipped: on the batch screen, reject one puzzle
      by fetch. `Delete rejected` correctly becomes enabled (that half is pinned), but
      clicking it shows the confirmation the page was RENDERED with —
      "Delete all 0 rejected puzzles in this batch? This cannot be undone." — the stale
      digit. That is literally half the bug CARD-142 exists to fix ("the `disabled` state
      AND the number their confirmation names", card line 45), and nothing in the suite
      notices.

      `_apply_counts` cannot close this: it is a reimplementation of the INTENDED display
      rule, read off the rendered data attributes. It describes what the page WOULD show if
      the script did its job; it never observes whether the script does it. The two halves
      are asymmetric — the `disabled` half has a (string-level) pin, the sentence half has
      none.

      Related: mutant M6 (`count === 0` -> `count !== 0`) was killed only because
      `_assert_wiring` asserts that exact source text. That is change-detection, not
      behavior verification — the same class of assertion CARD-034 removed
      (`assert "if" in content`). The production code is correct today; what is missing is
      the assertion that would catch it going wrong.
    suggestion: |
      Extend `_assert_wiring` so the sentence half is pinned as tightly as the disabled
      half — e.g. inside the post-`fetch(` slice, assert the script reads both
      `dataset.confirmOne` and `dataset.confirmMany`, substitutes the placeholder
      (`.replace('{n}'`), and reassigns the form handler (`form.onsubmit`). Better still,
      pin the call rather than the expression: assert `applyActionCounts(` appears inside
      the `fetch(` slice and that the function's body reads both data attributes — this is
      also less brittle than matching `button.disabled = count === 0` verbatim (F-002).
      Re-run mutant M5 afterwards; it must go from SURVIVED to KILLED.
    confidence: high
    source: static
    violates: null
