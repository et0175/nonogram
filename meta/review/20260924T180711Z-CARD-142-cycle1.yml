    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_batch_bulk_button_state.py
    line: 167
    title: "`_assert_wiring` matches a JavaScript expression verbatim, so a behavior-preserving reformat fails the suite"
    description: |
      `assert "button.disabled = count === 0" in script` (line 167) matches the expression
      character-for-character. A behavior-preserving edit — `button.disabled = (count === 0);`,
      a rename of the loop variable, or a prettier pass on the template — fails the suite
      while the page still behaves correctly. Combined with F-001, the wiring assertion has
      the worst of both: it fails on harmless edits and passes on a harmful one.
    suggestion: |
      Pin a stable, intentional marker instead of an expression's spelling — the name of the
      function the fetch handler must call, and the attribute names it must read.
