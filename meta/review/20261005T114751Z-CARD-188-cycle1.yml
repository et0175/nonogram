  - id: F-003
    severity: low
    category: feature
    type: risk
    file: src/nonogram/admin/static/admin.css
    line: 500
    title: "CSS round() makes the clue layout depend on Chrome 125+ / Firefox 118+ / Safari 15.4+"
    description: |
      If round() is unsupported, --player-circle-k and --player-clue-m are invalid at computed time,
      so the clue numbers lose their height, line-height and margins together. Admin-only POC, owner
      uses a current browser, so low risk; not stated anywhere.
    suggestion: "Note the browser floor in the comment, or give height/margin a fallback declaration before the round()-based one."
