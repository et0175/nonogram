    severity: low
    category: feature
    type: gap
    file: tests/test_puzzle_solver_clues.py
    line: 576
    title: "The --grid-ink value is read but never compared"
    description: |
      `ink` (the resolved --grid-ink) is only asserted non-empty (line 585); the "grid-ink, as the
      digit" check compares the border colour with the span's text colour, which would also pass
      if both moved off the token.
    suggestion: "Compare look['colour'] with the rgb of --grid-ink (resolve via a probe element), or drop the unused read."
    confidence: high
