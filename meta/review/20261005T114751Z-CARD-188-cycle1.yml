findings:
  - id: F-001
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/static/admin.css
    line: 508
    title: "Two-digit clue numbers turn into circles their digits do not clear on a 30x30 board at 1440 px"
    description: |
      Spec 8 says two-digit numbers (up to 30) get a pill that still clears the digits. On a 30x30
      board at 1440x900 (cell 18.16 px) a probe measured every two-digit row AND column number at
      w = h = 16.16 px (a circle, not a pill), text width 13.1 px, digits 0.7 px inside the 1 px ring
      at the midline, so the digit corners cross the ring (zoomed screenshot confirms "12" touching it).
      Row: --player-clue-w = 16.6 px, but --player-clue-m rounds (18.16-16.6)/2 = 0.78 to 1 px, so
      width = cell - 2 = 16.16 = the circle. Column: the cap min(..., cell - rule-major) = 16.16 px.
      At 390 px (cell 24) the pill is 22x20 with 1.3 px clearance - marginal. AC-9 and AC-10 only
      exercise a 15x15 board (cells 28/24 px), so neither catches it; the CSS comment
      "or a pill as wide as its digits need" is not true at the board size CON-011 allows.
    suggestion: |
      Keep the one-cell slot but let multi-digit numbers clear their digits at small cells, e.g. for
      --player-clue-digits >= 2 reduce the box height (or the letter-spacing) so w > h, or round
      --player-clue-m down (round(down, ...)) and accept a negative margin only where needed. Add a
      30x30 case (1440 and 390) to TestSolverClues_TheCircleIsVisible asserting a two-digit row and
      column number is a pill clearing its text plus both borders, and add a 30x30 render to AC-10.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
