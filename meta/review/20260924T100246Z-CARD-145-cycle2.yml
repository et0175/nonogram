findings:
  - id: F-101
    severity: high
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1015
    title: "F-6's ordering claim is refuted: swapping the interior/cover statements leaves all 25 tests green at 1.00 page bitmaps"
    description: |
      The cycle-1 fix split `BookExport(interior=..., cover=...)` into two
      statements and justified it, in a NEW production docstring paragraph
      (book_pdf_generator.py:1010-1018) and in the card's failure-matrix F-6
      row, with: "The order is what keeps a cover page from being alive beside
      an interior page … a reader reordering two kwargs would silently double
      the peak."

      That is false, and mutation-verified false. On a sandbox copy of the
      module I swapped the two statements so the cover is written FIRST:

          stream   = self.interior_stream(puzzles)
          cover    = self.export_cover(book_title, cover_image)
          interior = self._write_pdf(stream.pages, stream.page_count)

      Result: `25 passed` — peak still exactly 1.00 page bitmaps. The reason is
      structural and is in the same file: `export_cover` (line 1055) hands
      `_cover_page` — a GENERATOR (lines 1057-1061) — to `_write_pdf`, so the
      cover bitmap is built inside the writer's walk and released by the
      writer's own `del page` before `export_cover` returns. No cover page can
      survive one statement into the next, whichever statement runs first.

      What actually pins the cover half of F-6 is the page-factory seam plus
      the four `del`s, not the ordering. I verified that too: an `export_book`
      that builds the cover page eagerly and holds it across the interior write
      measures 2.00 and fails `test_the_whole_book_holds_one_page_bitmap_at_a_time`;
      an `export_book` that materialises its interior measures 9.00 and fails
      the same test.

      Why this is not a nit: the card hands this producer to CARD-128 next, and
      this paragraph is the first thing a reader of `export_book` sees. It
      teaches that statement order is load-bearing (it is not) and, by
      implication, that the `del`s and the lazy `_cover_page` are not (they
      are). The failure matrix carries the same refuted clause, so the
      declaration a future reviewer checks against is wrong at the mechanism
      level while its numeric bound (9 pages seen, peak == 1 x 25,245,000 B) is
      correct and measured.
    suggestion: |
      Correct both statements of the mechanism rather than the code — the
      two-statement form is fine to keep for readability. In the docstring,
      replace the ordering claim with what is actually true and tested: the
      cover is built lazily inside `_write_pdf` (`_cover_page` is a generator),
      so no cover bitmap outlives `export_cover`; the peak of one page is held
      by the four `del`s and is pinned by
      `TestBookPdfMemory_InteriorAndCoverStillSeparate::test_the_whole_book_holds_one_page_bitmap_at_a_time`
      plus `::test_a_page_built_outside_the_writer_is_still_seen`. Amend F-6's
      row the same way (keep its numeric bound; drop "the ordering the bound
      depends on"). If the ordering is to stay declared as load-bearing, it
      needs a test that fails on the swap — and there is nothing to pin, which
      is the point.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_pdf_memory.py
    line: 670
    title: "On a font mismatch the pixel test silently compares 6 of 8 pages — no skip, no message, same floor either way"
    description: |
      The narrowed skip is a real improvement over cycle 1's all-or-nothing one
      and I verified its premise: the ONLY machine-face calls on an interior
      page are book_pdf_generator.py:919 (48), :920 (28) and :964 (60) — the
      guide page and the divider, i.e. interior pages 1 and 5 exactly;
      line 873's 72 is the cover, correctly excluded from MACHINE_FACE_SIZES.
      `assert machine_face == {1, 5}` is a genuine guard against someone
      widening `font_dependent_pages` to silence the comparison.

      The residual: when `same_face` is false the loop does a bare `continue`
      (line 670) and the test reports PASS with no indication that it compared
      six pages instead of eight. The only visible signal anywhere in the run is
      the separate SKIPPED on
      `test_the_interior_file_is_the_length_it_was_recorded_with`. And the floor
      `assert compared >= BASELINE_PAGE_COUNT - len(machine_face)` is the same
      `>= 6` on the recording machine, where the honest assertion is `== 8`.
    suggestion: |
      Make the budget explicit:
      `assert compared == BASELINE_PAGE_COUNT - (0 if same_face else len(machine_face))`
      and, when `same_face` is false, emit the reason (a `warnings.warn` or a
      `pytest.skip`-free `print`/`record_property`) so a green run on a Linux
      box says on its face that two pages of G-1 evidence were not compared.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-103
    severity: low
    category: tech-debt
    type: risk
    file: tests/helpers/book_corpus.py
    line: 214
    title: "MACHINE_FACE_SIZES is hand-transcribed from the generator, and editing it is an unguarded second way to make the fingerprint mismatch"
    description: |
      `MACHINE_FACE_SIZES = (48, 28, 60)` mirrors three literals in
      book_pdf_generator.py (919, 920, 964) with nothing tying the two
      together. Two consequences, both modest:

      (a) if a later card changes one of those sizes, the fingerprint keeps
          pinning a size no page is lettered at. This does NOT hide a pixel
          regression — `font_fingerprint()` reads no production code, so the
          digest comparison still runs and still fails — but the cross-machine
          claim the fingerprint makes quietly stops being true.

      (b) the re-record itself was legitimate (the fingerprint is a digest of
          PIL + the Arial file at three sizes, computed with zero production
          code, and the `pages` array in the fixture is byte-for-byte the
          merge-base's — I diffed it, and confirmed the fingerprint matches on
          this machine so all 8 digests were really compared). But that means
          the fixture's loud "NEVER regenerate" warning does not cover the
          helper: editing `MACHINE_FACE_SIZES` flips `same_face` to false and
          silences pages 1 and 5 plus the whole byte-length assertion, without
          touching the warned file.
    suggestion: |
      Either read the three sizes off the generator's own constants (promote
      them to named module constants there and import them in the helper), or
      add one line to the helper's docstring pointing at the three call sites
      by line so a reader can re-derive the transcription — plus a note that
      changing this tuple invalidates the fixture's fingerprint and is a
      baseline change, not a test-helper tweak.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-104
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_memory.py
    line: 102
    title: "PAGE_FACTORIES is a hardcoded list with no test that it covers every page-returning method"
    description: |
      The extended instrument is real — I confirmed it non-vacuously: an
      `export_book` that builds the cover eagerly and holds it measures 2.00
      and fails, which a producer-only probe would have read as 1.00. The
      `id(page)` keying is also sound: `weakref.finalize`'s callback runs during
      deallocation, before CPython can reuse the address, so a dead page's entry
      is always gone before a new page can collide with it — and an
      under-registration would show up as `probe.seen` falling short of the
      asserted 8 / 179 / 9, which is checked in all three places.

      The gap is coverage of the seam itself: `PAGE_FACTORIES` names six methods
      by string, and nothing asserts that those are all of `BookPDFGenerator`'s
      page-returning methods. CARD-128 adding a new page factory (a per-level
      divider) and holding its output outside the writer would be invisible to
      the factory seam. Narrow, because a page that is actually written is still
      seen through `_write_pdf`'s producer — the blind spot is only a page built
      and held and never written.
    suggestion: |
      One cheap guard in the module: assert that every public/underscore method
      of `BookPDFGenerator` whose return annotation is `Image.Image` appears in
      `PAGE_FACTORIES` (the annotations are already there — `create_guide_page`,
      `create_divider_page`, `_blank_page`, `_two_up_page`, `_answer_page`,
      `create_cover_page` all declare `-> Image.Image`).
    confidence: high
    source: static
    violates: null
    root_cause: null
