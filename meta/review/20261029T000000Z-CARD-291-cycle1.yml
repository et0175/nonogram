      `TestPuzzleEditor_Guardrails::test_the_refusal_vocabulary_is_load_bearing_on_both_sides`
      holds app.py's EDIT_REFUSAL_REASONS and the client's
      REFUSALS_THAT_NEVER_WRITE as an EQUALITY, so card item 5 -- which gives
      the edit route a new refusal reason -- cannot be implemented inside the
      declared Touches. The ADR is the R3 flip the card explicitly owes and
      meta/architecture/ is permitted. The two unedited declared modules are
      G-4's own subject and are green untouched. Net: zero unjustified growth,
      but the card's Touches line as written would have mis-scoped the next
      reviewer and the next concurrency check (app.py is a declared HOTSPOT).
    fix: "amend Touches to add src/nonogram/admin/static/puzzle_edit.js, tests/test_puzzle_editor_ui.py and the ADR path, and record that test_puzzle_review.py / test_bulk_operations.py needed no edit (G-4 holds with zero fixture edits) rather than silently dropping them"
  - id: F-004
    severity: minor
    confidence: high
    title: "the predicate name diverges from the card: approvability_of(...) -> Approvability | None, not needs_guessing(...) -> bool"
    where: "meta/kanban/cards/CARD-291.md:69 vs src/nonogram/admin/puzzle_review.py approvability_of"
    judgement: "justified, NOT scope drift -- but the card text must be amended so a later reader does not 'restore' the literal name"
    measured_reasons: >-
      Three, and two of them are measurements rather than taste. (a) AC-395
      requires a THIRD outcome with its own distinct message; a bool cannot
      carry it, and `test_the_two_refusals_are_worded_apart` plus the route's
      own assertion (`Approvability.UNVERIFIABLE.value in message` AND
      `Approvability.NEEDS_GUESSING.value not in message`) are what hold the
      two sentences apart. (b) Two booleans would mean two `strategies_for`
      calls, i.e. TWO budgeted re-solves on the unbelieved path -- I measured
      `_approvability` at exactly 1 solve per call, so the enum halves a cost
      the two-predicate shape would have doubled (and F-002 shows what one
      extra call already costs). (c) `GridNotApprovable.verdict` is the SAME
      enum member, asserted by AC-396 (`refused.value.verdict ==
      Approvability.NEEDS_GUESSING`), so the edit refusal and the approve
      refusal cannot drift into two vocabularies.
    fix: "amend card item 2 to name approvability_of / Approvability and state the three-outcome and one-solve reasons in one line"
  - id: F-005
    severity: informational
    confidence: high
    title: "the surviving `FR-046 requirement has no tests yet (status: partial)` warning is NOT this card's to clear -- the round is right, and now measured"
    where: "meta/architecture/trace.yml FR-046 row, `status: partial`; emitted at forge_1 .../validators/trace.py:73"
    measured: >-
      The warning fires on `status: partial` ALONE. Read the validator: trace.py
      lines 71-73 emit it with no reference to the entry's `tests:` list --
      which for FR-046 already holds all five node ids. There is no `status:
      partial` string anywhere in requirements.yml (grep -c -> 0) and FR-046
      has no `status` key there at all; the warning comes from trace.yml only.
      Board-wide: 43 of 75 trace rows are `partial` and 32 are `covered`; 40 of
      the 43 list no tests at all, and the three that DO are NFR-001 (1 test),
      **FR-045 (15 tests)** and FR-046 (5 tests). FR-045 is the precedent the
      card itself cites, and its row is still `partial` with 15 live tests.
    conclusion: >-
      Flipping FR-046 alone to `covered` would be an inconsistent, board-wide
      convention change made by one card, and the card's named precedent did
      not do it. The card's claim at line 112 ("FR-046's planned-test warnings
      ... are this card's job to clear") is satisfied for 5 of the 6 FR-046
      warnings; the sixth belongs to a separate board-level card, together with
      the standing hazard the owner's own memory records about this warning
      being misread as a missing `tests:` key.
    fix: "amend the card to say 5-of-6 and name the sixth as out of scope by the FR-045 precedent; file the convention flip as its own card"
  - id: F-006
    severity: informational
    confidence: medium
    title: "EC-051's vocabulary scoping is a measured narrowing today, and a durability gap tomorrow"
    where: "tests/test_approval_guess_gate.py analyse() `vocabulary` + _status_writes's docstring"
    measured: >-
      Axis B is scoped to the three modules that name `PuzzleStatus`; axis A
      (the literal word / enum member / subscript spelling) is tree-wide. A
      module that is NOT in the vocabulary and writes a PUZZLE row's `status`
      from a non-literal (`row.status = request.form["status"]`) is invisible
      to both axes. No such site exists today -- I enumerated every `.status =`
      / `["status"] =` / `status=` in src/nonogram outside the two gated
      modules and all 17 of them write BookStatus or BatchStatus on the
      books/batches tables.
    conclusion: >-
      The bound is honestly stated in the right place (the guard's own
      docstring) and it is MEASURED, not claimed, by
      `test_the_modules_in_the_status_vocabulary_are_measured`, which also
      plants a probe proving axis A still catches the enum member outside the
      store module. I record this as a shape of the catalogue, not a defect,
      and I decline to inflate it into a finding against the card.
  - id: F-007
    severity: informational
    confidence: high
    title: "the edit refusal is slightly broader than AC-396's wording: a truthy book_id puts a row behind the door whatever its status"
    where: "src/nonogram/admin/puzzle_review.py _refuse_a_grid_the_approval_door_would_not, `... or PuzzleReviewService._holds_a_book(puzzle.get('book_id'), status)`"
    note: >-
      AC-396 says "an approved or in-book puzzle"; the implementation also
      refuses a row whose `book_id` is truthy under any status. Conservative,
      consistent with FR-046's intent (a row a book is built on is behind the
      door), and near-unreachable in practice because `assign_to_book` sets the
      status too. Recorded so a later reader does not mistake it for a bug, not
      as a change request.

