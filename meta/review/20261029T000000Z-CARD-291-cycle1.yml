findings:
  - id: F-001
    severity: minor
    confidence: high
    title: "the ref-resolution test accepts a ref whose test is SKIPPED -- a green ref over an ungated door"
    where: "tests/test_approval_guess_gate.py:2023-2036 (test_the_registrys_check_refs_for_this_card_all_resolve)"
    measured: >-
      Mutant M-10. Adding `@pytest.mark.skip("probe")` above
      `def test_unknown_verdict_fails_closed` (AC-395's ref) gives "36 passed,
      1 skipped" and `test_the_registrys_check_refs_for_this_card_all_resolve`
      still PASSES. The check is `name in globals() and callable(value) and
      value.__module__ == __name__` -- which is "a module-level function of
      this name exists", not "it runs and asserts". A `skip`/`skipif` mark
      satisfies all three.
    why_it_matters: >-
      This is the exact hazard this board has a standing rule about: a skipped
      gate test is an ungated door, and this module's whole purpose is that a
      ref cannot read as mechanically checked while nothing backs it. The
      module makes the no-skip claim in PROSE (docstring lines 36-39, "There is
      no db_required marker anywhere in this file and so no test here can skip
      green") and asserts nothing. The claim is true at HEAD -- I measured 0
      skip markers in the file and 0 skips in its 37 tests -- so this is a
      durability gap in the mechanism, not an open hole today.
    fix: >-
      One assertion beside the two that are already there: for each of the five
      refs, require the resolved function to carry no skip/skipif mark (e.g.
      `not any(m.name in {"skip", "skipif"} for m in getattr(fn,
      "pytestmark", []))`), and the same for the module's own `pytestmark`.
    answers_dispatch_question: "2 -- yes, there is one remaining way for that test to pass with a ref that does not run, and it is a skip mark, not the __module__ filter"
  - id: F-002
    severity: minor
    confidence: high
    title: "the approve ROUTE pays the verdict twice -- 2 solver entries where the service pays 1 -- and the cost test does not drive the route"
    where: "src/nonogram/admin/app.py the approve route (`elif (verdict := puzzle_review.approvability_of(puzzle_id))` followed by `elif puzzle_review.approve_puzzle(puzzle_id)`), against tests/test_approval_guess_gate.py:463 test_the_happy_path_does_not_enter_the_solver"
    measured: >-
      I monkeypatched `nonogram.admin.puzzle_review.solve` with a counter and
      drove the real route through app.test_client(). Results: believed stored
      list -> 0 solves, HTTP 200. UNBELIEVED stored list (["line_logic"]) ->
      **2 solves**, HTTP 200. Refusal with an unbelieved list -> 1 solve, HTTP
      409 (the route short-circuits, correctly). The service path for the same
      row -> 1 solve. The route asks `approvability_of` and then
      `approve_puzzle` re-asks `_approvability` inside `_set_status`.
    why_it_matters: >-
      The card's cost note and `_approvability`'s docstring both say the gate
      enters the solver "not at all" on the happy path. That claim HOLDS for
      the normal population -- 0 solves measured, because generation and the
      two-phase edit both write a solver-written list, and `add_puzzle` fills
      an empty one in from its own proving solve (puzzle_review.py:946-949, so
      `strategies_used=[]` really is NOT a re-solve trigger -- the round's
      correction is right and I confirmed it). The doubling hits only rows
      whose stored list no solver wrote: legacy `[]` rows and invented names.
      For such a row near limits.MAX_SIZE it is two budgeted searches of wall
      clock on one button press. `test_the_happy_path_does_not_enter_the_solver`
      drives only `store.service.approve_puzzle`, so the route's cost is
      unmeasured and this doubling is invisible to the suite. Bulk is NOT
      affected: `set_batch_status` asks `_approvability` once per row (measured
      via M-3's counts).
    fix: >-
      Either let the route reuse the verdict it already holds (pass it into
      `_set_status`, or have the route approve only when `verdict is
      Approvability.OK` and keep `_set_status`'s own check as the store-level
      backstop it is), or -- at minimum -- add a route arm to
      test_the_happy_path_does_not_enter_the_solver so the number is measured
      wherever the owner actually meets it.
  - id: F-003
