verdict: >-
  CERTIFIES at 9.0. Every claim below comes from a run in the card worktree, and
  the two claims the dispatch asked me to probe rather than accept both survive
  probing.

  (1) The five FR-046 check refs and ADR-0032/R3 are now HONESTLY mechanically
  checked, and the docstring table is not a dressed-up version of the defect. I
  confirmed the mechanism by measurement, not by reading: the whole
  `path::name` string occurs in the test module at exactly five places, all of
  them lines 16-20 of the module docstring (`grep -n
  'test_approval_guess_gate.py::' tests/test_approval_guess_gate.py` -> 16,17,
  18,19,20 and one prose mention at 1979; the `def` lines do NOT contain the
  `path::` prefix and so match nothing). So the table really is what the
  validator reads. What makes it honest rather than decorative is that
  `test_the_registrys_check_refs_for_this_card_all_resolve` asserts the two
  facts SEPARATELY and derives the set from the registry: the refs are parsed
  out of requirements.yml with a regex (not restated), each must resolve to a
  module-level callable whose `__module__ == __name__`, and each must then
  appear in `__doc__`. A ref therefore cannot be green in pytest and dead in
  the model, nor alive in the model with no test. I probed the count half,
  which the orchestrator had not: inserting a sixth
  `tests/test_approval_guess_gate.py::...` ref into FR-046's block in
  requirements.yml reds it at line 2021 with `assert 6 == 5`, and the blob
  restored clean. One residual remains and it is F-001 below.

  (2) EC-051's derivation is a real measurement with a stated bound, NOT a
  catalogue that reads broader than it is, and it is emphatically not a
  deny-everything guard. Measured on the real tree: 67 files, 1113 function
  symbols, and exactly SIX candidates -- 0.5 % of the symbols. Five of the six
  reach the gate on the call graph; the sixth is the one machine-checked
  exemption. Axis B's direct writer set is three symbols (`_set_status`,
  `save_edited_grid`, `set_batch_status`); `add_puzzle` is correctly NOT a
  candidate because it writes a provably non-approved constant. A guard that
  flagged everything would pass every writer probe; this one classifies 1107 of
  1113 symbols as writing nothing, which is what makes the five read probes
  load-bearing rather than ornamental.

  (3) The gate's per-door controls are real. I executed five deletion mutants,
  one per gate site, and every one of them is killed by the AC test that owns
  that door -- ADR-0039/R1's "missed WITHOUT it" half, which the card asks for
  and which no in-suite test can assert about itself. Both halves of the
  exemption list bite: a sixth entry reds the size pin, and a REAL door moved
  onto the list reds `test_every_exemption_is_still_unable_to_approve`
  independently of the size pin.

  (4) The out-of-scope edits were forced, measured both ways. Replacing
  `needs_guessing` with a different token on EITHER side of the
  `EDIT_REFUSAL_REASONS` / `REFUSALS_THAT_NEVER_WRITE` seam reds
  `TestPuzzleEditor_Guardrails::test_the_refusal_vocabulary_is_load_bearing_on_both_sides`
  (app.py side at test_puzzle_editor_ui.py:985, client side at :989) AND
  `::test_every_refusal_carries_a_reason_the_editor_branches_on`. Card item 5
  genuinely cannot be implemented inside the declared `Touches`.

  Four MINOR findings and three informational notes. None is a
  product-correctness defect, none is gating, and none of the four would
  survive as a defect if the card's text were amended to match what was built.

