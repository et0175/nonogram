score_rationale: >-
  9.0. Five gate sites, five biting controls, measured by me as deletion
  mutants rather than inferred -- including one (M-4) that reds the static and
  the behavioural half for different reasons, which is the cleanest possible
  demonstration that neither stands in for the other. The EC-051 derivation is
  a real measurement (6 candidates from 1113 symbols, 0.5 %), its exemption
  list is machine-checked and bites in both directions, and its bound is stated
  in the guard's own docstring and measured by a test that plants a probe to
  prove the scoping narrows rather than holes. The registry/docstring binding
  closes the exact defect this card arrived with, and I proved the mechanism is
  the docstring table by locating every occurrence of the grepped string. G-1
  verified as a literal byte-for-byte row no-op on both verdict paths rather
  than read off a docstring; G-2/G-3 verified as an absence in the diff; G-4
  verified with ZERO deleted lines anywhere in tests/ and zero new skips.
  Deducted 1.0 for the four minor findings, weighted toward F-001 (the one
  mechanism-durability hole, in the mechanism this card exists to build) and
  F-002 (a doubled solve at the route, in the one place the cost claim is not
  measured). Both are one-line-to-small fixes and neither is a correctness
  defect. Above min_score 8; no gating finding.

