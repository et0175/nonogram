      the real UI flow reduced small to fixed-10 and auto to fixed-20. The fix is necessary for this
      card, but it also restores "max" mode for auto. On all 13 owner pictures that moves generation
      from the fixed-20 derivation (b1 17x20, c11 20x13) to max mode (b1 26x30, c11 30x20), with
      every picture now at 30 on the long side. The behaviour is correct (preview and generation now
      agree), but it is outside the card's declared scope and its size is not stated in the notes.
      No test pins "max" through the save round trip, and solver time and abandonment rates at 30
      were not measured.
    suggestion: |
      Tell the owner that auto batches now generate at up to 30 on the long side. Add a round-trip
      test for "max" beside the "short" one.
