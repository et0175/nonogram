    title: "'Too elongated ... part of its length is cropped' note is false in two reachable cases"
    description: |
      The same text is in generate_batch.html:55, and the docstring at image_manager.py:202-207
      makes the same claim. The note says part of the picture's length is cropped, but:
      (a) size_value > 10 (preview per-image "Short Side" or Apply-to-all): 250x100 at short 15
      gives 30x12 with 100% retained. Nothing is cropped; the short side dropped from 15 to 12,
      which the note never mentions. The same holds for 200x100@20 -> 30x15 and 150x100@25 -> 30x20.
      (b) Beyond 6:1 at the preset itself: 800x100 predicts 30x10, but generation raises
      ImageNeedsManualCrop (37% retained), so the picture is refused, not cropped. The fixed-mode
      fallback shares this pre-existing refusal; the new text is what misdescribes it.
    suggestion: |
      Branch the message on outcome: retained-ratio fallback ("short side reduced to S to fit 30"),
      floor-bound crop ("part of its length is cropped"), and beyond-6:1 ("will be refused; crop the
      picture"). Add one test at size_value > 10.
