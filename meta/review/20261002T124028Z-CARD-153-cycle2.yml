findings:
  - id: F-007
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/app.py
    line: 4251
    title: "Introduced by the F-005 fix: Save and finish turns any non-plan exception into an unlogged 500 labelled 'page plan could not be built'"
    description: |
      The new `try: counts = _interior_counts(book, members_in_order()) except Exception as broken_plan:
      return render_template("500.html", ...), 500` relies on the helper having already logged the
      error. But the helper logs only exceptions raised by interior_stream (app.py:930-955). Anything
      else raised inside that try — members_in_order() (puzzle_review.get_puzzle,
      book_mgr.get_puzzle_title: a database error on the Postgres-backed panel), or a non-ValueError
      from the BookPDFGenerator constructor — is caught, rendered as "This book's page plan could not
      be built ...: <msg>" and returned normally, so neither the helper nor Flask logs anything.
      Reproduced: monkeypatching panel.books.get_puzzle_title to raise KeyError('db went away') and
      POSTing save_and_finish gives a 500 page with "page plan could not be built" and
      caplog.records == [] (on main, the same request is logged by Flask as
      "Exception on /book/<id>/finalize [POST]" with traceback). This contradicts objective 1 of the
      task contract ("Let the plan tripwires (and any other unexpected exception) propagate as the
      errors they are, logged with a traceback") and misattributes a DB error to the page plan.
    suggestion: |
      Narrow the try to what the helper logs: call members_in_order() before the try, and in the
      except log anything the helper did not (e.g. `app.logger.exception(...)` unless the exception
      came from interior_stream — simplest: let _interior_counts mark the exception it logged, or
      catch only RuntimeError/the helper's re-raise and let everything else propagate to Flask's
      handler). Add a test: a non-plan exception on Save and finish is logged with its traceback.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
