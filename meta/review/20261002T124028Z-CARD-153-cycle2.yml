    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 994
    title: "Surviving mutant: _is_an_unpackable_row's second condition (rows fail the sheet-free count) is untested"
    description: |
      Mutant M5 (drop the `unpaired_interior_page_count(puzzles)` check, return True whenever the
      error is a RuntimeError caused by a ValueError) survived 218 tests. The pairing walk raises
      exactly that shape — "puzzle <id> could not be laid out" from compute_pair_layout
      (book_pdf_generator.py:1912-1916) — for an exporter/layout bug on clean rows, and under the mutant
      it would be downgraded to None + WARNING. AC-1 is unaffected (the two tripwires carry no cause, M4
      is killed), so this is not the sole test of an AC; it leaves the F-002 discrimination half-pinned.
    suggestion: |
      Add a test: monkeypatch compute_pair_layout (or answer_key) to raise RuntimeError(...) from
      ValueError on a book with well-formed rows, and assert _interior_counts re-raises and logs at ERROR.
    confidence: high
