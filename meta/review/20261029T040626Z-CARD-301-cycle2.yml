verdict: >-
  **All three of cycle 1's important findings are closed, each one load-bearing
  by its own deletion mutant rather than by its author's account, and the fix
  round's additions are the best-measured work on this card so far.** I
  re-derived every guardrail and every claim the orchestrator pre-gated, fired
  21 mutants of my own under a `PYTHONDONTWRITEBYTECODE=1` + `__pycache__`
  sweep on both sides of every change, and verified each blob back to HEAD
  after each one. Footprint is 5 paths at merge-base `6b0dfa30`; `git diff
  --name-only 6b0dfa30...HEAD -- src/` is **0** and `pyproject.toml` is **0**
  diff lines, so G-1 and G-2 hold structurally. Collection is **9581** with
  **0** `bench_generate` node ids and **11** in the new module; the impact gate
  reads **600 passed, 1 xfailed, 0 skipped** in 48.08 s with zero `SKIPPED`
  lines under `-rs`, matching the baseline to the test.

  **F-1 is closed and the three new assertions are the whole catcher.** The
  deletion mutant proves it in the only way that counts: gut the three new
  asserts to nine lines of filler, apply cycle 1's `DENSITIES = (30,40,50,60)
  -> (50,60,70,80)`, and the module reads **1 failed / 10 passed** with the one
  red being `[XPASS(strict)]` on the gate — cycle 1's hole, reconstructed
  exactly. Restore them and the same mutant reads **2 failed / 9 passed in
  0.26 s** with the corpus pin among the failures, killed at `:286`. The
  literal twenty-row spelling earns its place beyond the shape pin: the
  comprehension-order mutant (`for seed in SEEDS for density in DENSITIES` ->
  `for density ... for seed ...`) is invisible to `DENSITIES`, to `SEEDS` and to
  every shape assertion, and reds **at `:288` alone**. `SEEDS` reds at `:287`
  alone. Three asserts, three distinct defects, three sole catchers.

  **F-3 is closed, and the camouflage is genuinely removed rather than
  relocated — I drove the validator rather than reading it.** The
  two-fragment `RETIRED_LABEL` assembly does defeat the validator's door:
  `git grep -lw BenchGenerate_20x20_p95Under5s -- . ':(exclude)meta/architecture'
  ':(exclude)*.md'` exits **1** in this worktree, while the same search at
  `main` returns three files including `tests/bench_generate.py`. Driven
  through `validate.py --root meta/architecture`: branch baseline is
  byte-identical to a clean `6b0dfa30` arm; restoring the label with NFR-001
  `partial` is byte-identical to the baseline (the latency claim); the label
  plus `covered` reads **1** NFR-001 ERROR at the first cut `6f721e57` and
  **2** at this HEAD, so gate 3 — the ERROR half, as the fix round correctly
  re-derived against my own and cycle 1's wrong severity map — is loud now and
  was silent before. All three asserts of the new control are sole catchers:
  `:643` (the node id absent from NFR-001's `tests:`), `:644` (the retired
  label present *alongside* the correct node id), `:641` (the registry and the
  matrix disagreeing); and with `:644` gutted, `F3d` survives 10/10, which is
  the single-point-of-failure the brief asked me to check for and which the
  docstring declares.

  **F-2 is closed.** The old node id does not resolve (`ERROR: not found`), the
  new one collects, the retired spelling lands twice in the live module
  (`:68`, `:478`) so a `git grep` for any of the three external references
  reaches it, and the planted-third-file control reds at `:502` naming
  `tests/card301_planted_third.py` and passes when it is removed, worktree
  clean. **G-4 is byte-unchanged**: with docstrings stripped, the only code
  difference against `main` in that module is the rename itself;
  `MIN_DECLARING_NAMES = 5000` and the default-deny walk are line-identical.

  **G-5 re-derived in my own domain.** `XFAIL_REASON` is 1390 chars with
  sha256 `9554bc42bccd59bb341923574eb8f4e7532099f225a114226731541fd0393b2e`,
  and `main`'s decorator string — pulled by walking `main:tests/bench_generate.py`
  for `reason=` keywords and `ast.literal_eval`-ing them — is the same length
  and the same digest, `==` True. `P95_CAP_SECONDS`, `SIZE`, `DENSITIES`,
  `SEEDS`, `CORPUS`, `_P95_RANK`, `_ALLOWED_OVER_CAP` are AST-identical to
  `main`, now pinned by assertions that each kill their own mutant.

  **What is left is two minors, neither in the mechanism.** The trace control's
  docstring states four validator totals without naming which forge
  installation produced them, and the two installations on this machine
  disagree by one ERROR *and by exit code*; and the fix round's stated reason
  for declining F-9's control ("both doors agree once the registry and trace
  are right") is measurably false, though the decision it supports is right
  for a different and stronger reason. Both are recorded, neither gates. The
  step-8f campaign this cycle owed is delivered and found no undeclared
  survivor.

