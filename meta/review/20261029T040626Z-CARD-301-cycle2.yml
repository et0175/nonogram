prescribed_edits:
  recommendation: "NONE. Certify at 9.0 and land it."
  reasoning: >-
    Both of my findings are minor, neither is in a mechanism, and this is the
    second-to-last cycle. Per the board's standing rule — `max_cycles` is a
    cycle budget, not a last-mile rule — I must say what the merge gate alone
    would establish about any edit I prescribe, and for these two the honest
    answer is: **not the thing that matters.** N-1's fix is one clause in a
    docstring naming a validator installation. The merge gate would re-collect
    the module (11 node ids) and re-run the impact set (600/1/0), so it would
    establish that the suite is unchanged — and nothing at all about whether
    the newly written figure is the one the newly named door produces, because
    no test and no gate recomputes a validator total. An edit whose only
    interesting property is unverifiable by the gate that would certify it is
    an edit better made with the measurement in hand, which is now in this
    report. N-2 is a record correction with no code to change; it belongs in
    CARD-301's worktree notes, where the merge gate reads nothing and
    establishes nothing either way.
  if_the_owner_wants_them_anyway: >-
    Then make both in one commit, paste the `forge_1` door's own summary line
    into the commit message (since no gate will recompute it), and treat the
    merge gate's 600/1/0 + 11-node-id re-collection as the whole of what it
    certifies about that commit. Do not spend the third cycle on them.

family_regression_note: >-
  Not triggered: none of my findings is gating, so there is no family of gating
  findings attributable to the fix round's edits. One pattern is worth the
  retrospective rather than this cycle, though, and it is a convergence signal
  rather than a divergence one: the *validator-figure* family has produced a
  flaw in three consecutive rounds — the implementation round's "56 warnings"
  (wrong), cycle 1's 0/108/0 (right, and right at the door it named, but the
  door was in a non-standard checkout), and the fix round's four totals (right,
  same unnamed door). Each round's figure was better than the last and the
  conclusion was right every time; what never got written down was *which
  validator*. The fix is a convention, not a card: a committed validator figure
  names its installation, because this machine has two and they disagree about
  the exit code.

recommended:
  - "Land it. The hole is closed, the route is measured rather than argued, and every mechanism the card points at now reds when the thing it describes is broken."
  - "At merge, carry into the card's worktree notes: (a) N-2's corrected statement about the two doors, since 'both doors agree' will otherwise be read as a backstop that does not exist; (b) DEL-1, so the next card that wants a control-count pin knows the >= 8 floor leaves three deletions silent; (c) H-1, because `-o addopts=''` is now a documented trap with a second form."
  - "Open a card (or update the plugin) for H-2: the plugin-cache forge validator exits 1 on a clean tree over a false ADR supersession cycle that the other checkout already fixes. That is a CI gate reporting a failure nobody caused."
  - "ADR-0001:23's dead node id is still owed at merge, unchanged from cycle 1."
