findings:
  - id: N-1
    severity: minor
    gating: false
    confidence: certain
    source: measured
    file: tests/test_nfr001_generation_time.py
    line: 613
    title: >-
      The trace control's docstring states four validator totals and names the
      door only as "validate.py --root meta/architecture" — but the two forge
      installations on this machine disagree by one ERROR and by exit code, so
      the figures are not reproducible from the docstring alone
    evidence: >-
      The docstring says "Door: `validate.py --root meta/architecture` from the
      repo root, captured `> file 2>&1`, counted from the validator's own
      summary line", then gives 0 errors / 108 warnings / 0 info for the
      baseline and for the label-restored-with-`partial` arm, 1 error at
      `6f721e57` and 2 errors at this HEAD. Through
      `/Users/omelnikova/MyProjects/forge_1/forge/skills/architect-validate/scripts/validate.py`
      every one of those reproduces: baseline `0 error(s), 108 warning(s), 0
      info` exit 0; label + `partial` byte-identical to it; label + `covered` at
      HEAD `2 error(s), 107 warning(s)`. Through
      `/Users/omelnikova/.claude/plugins/cache/adverax/forge/2026.8.17/skills/architect-validate/scripts/validate.py`
      the same four read 1/108/0 **exit 1**, 1/108/0, 2 errors and 3 errors —
      every one exactly one ERROR higher, and the baseline **fails** rather than
      passes. The extra ERROR is `circular supersession: ADR-0025 -> ADR-0031
      -> ADR-0025`, present identically on a clean `6b0dfa30` arm and in the
      primary checkout, so it is not this card's. Its cause is the older
      installation's regex `supersed(?:es?|ed\s+by)` counting the back-pointer
      as a second edge; the `forge_1` copy uses `supersedes?:?` and carries the
      comment "counting it as a second edge turned every properly two-sided
      supersession into a cycle". Note also that the plugin-cache figures
      coincide with what the board's documented `grep -c '^\[ERROR'` trap
      produces (anchored ERROR count 0, unanchored `[WARN ` count 108), which
      is why this needed two doors to separate rather than one.
    failure_scenario: >-
      A later cycle or the merge gate re-runs "the validator" to check this
      card's trace repair, resolves `validate.py` through the plugin cache (the
      installation a `forge:architect-validate` invocation reaches in this
      session), sees `1 error(s)` and exit 1 on an unmutated branch, and either
      attributes the ADR-0025 error to CARD-301 or concludes the docstring's
      figures were fabricated. Both are wrong, and the docstring gives the
      reader nothing to tell them apart. The exit-code difference is the
      sharper half: a gate reads the exit code, and these two installations
      disagree about whether this tree passes.
    fix: >-
      One clause in the docstring: name the installation the figures came from
      (`forge_1`'s checkout), and add that the plugin-cache 2026.8.17 copy
      reads one ERROR higher throughout because of a known supersession-regex
      defect it has since fixed. No code change.
  - id: N-2
    severity: minor
    gating: false
    confidence: certain
    source: measured
    file: tests/bench_generate.py
    line: 3
    title: >-
      F-9's declination rests on "both doors agree once the registry and trace
      are right"; measured, they do not — the validator's door is permanently
      blind to a rename of this gate, because the module's own docstring
      text-resolves the node id by AC-5's design. The decision is still right,
      for the stronger reason the round did not give.
    evidence: >-
      F9a (the node id re-quoted contiguously at `bench_generate.py:3`):
      **SURVIVED**, 23 passed over both test files — nothing in the suite
      objects, exactly as declared. F9b (same, plus the gate renamed to
      `..._under_5sX`): **KILLED** at `:541` (`missing == []`, resolved against
      `globals()` filtered by `callable`) and at `:365`, so the camouflage
      cannot make a dead ref pass *in the suite*. But the validator's door
      tells a different story: with the gate renamed and the node id **not**
      re-quoted anywhere, NFR-001 flipped to `covered`, the validator reports
      **no** dead-link ERROR for `tests/test_nfr001_generation_time.py::test_20x20_p95_is_under_5s`
      — and `git grep -lw` for that node id under the validator's pathspec
      returns exactly one file, `tests/test_nfr001_generation_time.py` itself;
      excluding that file the grep exits 1. The module's docstring is the sole
      text source, and it is there deliberately (its own line 12-13: "written
      out in full because a check ref is only alive if a `git grep` finds it in
      a code file") and required by AC-5. So dropping the suffix from
      `bench_generate.py:3` removed a redundant second text source and changed
      nothing about the validator's blindness; the doors are structurally
      unequal and always will be for this ref.
    failure_scenario: >-
      The next card reads "both doors agree" and treats the validator's dead-ref
      ERROR as a backstop for this gate's existence. It is not one: the ref will
      read ALIVE to `git grep -lw` for as long as AC-5's own requirement is
      satisfied, whatever happens to the `def`. Only the in-suite `:541`
      resolution catches a rename, and nothing catches wholesale deletion of
      the module (see DEL-1 in the mutant table).
    fix: >-
      A record correction, not an edit: state that the validator's text door is
      blind to a rename of this gate *by construction* (AC-5 requires the node
      id to appear in a code file, and the module that defines it is the file
      that does), and that `test_the_registry_names_this_module_and_every_ref_resolves`
      at `:533-541` is the only door that reds. Belongs in CARD-301's worktree
      notes at merge.

