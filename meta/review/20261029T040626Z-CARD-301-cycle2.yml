measurement_hazards_encountered:
  - id: H-1
    title: "`-o addopts=''` is a shell idiom, and inside a subprocess argv it silently means 'run the whole suite'"
    detail: >-
      My own campaign harness passed `"-o", "addopts=''"` through
      `subprocess.run` with no shell, so pytest received `addopts` set to the
      literal two-character string `''`, shlex-split it into an empty
      positional argument, resolved that to the rootdir, and collected
      **9581** tests instead of the module's 11. I caught it at four minutes
      of CPU on the first mutant (the symptom reads as a pathologically slow
      mutant, not as a scope error), killed it, restored every blob by hash,
      and re-ran with `"-o", "addopts="`, which collects 11. Measured both
      forms side by side to confirm: `addopts=''` -> 9581 collected,
      `addopts=` -> 11. **No figure in this report came from the aborted run,
      and the full-suite lock was never taken** (the run was killed before
      completion). Recording it because the board's documented fix for the
      stacked-`-q` trap is spelled with quotes, and the quotes are the bug as
      soon as the command stops going through a shell.
  - id: H-2
    title: "Two forge installations, one of them with a supersession-regex defect, disagree about this tree's exit code"
    detail: >-
      See N-1. `~/.claude/plugins/cache/adverax/forge/2026.8.17` reports a
      false `circular supersession: ADR-0025 -> ADR-0031 -> ADR-0025` and exits
      1 on an unmutated `main`; `/Users/omelnikova/MyProjects/forge_1/forge`
      does not and exits 0. The defect is pre-existing, is not CARD-301's, and
      is already fixed in the second checkout, whose regex comment names the
      cause. Worth a card of its own or a plugin update — a validator that
      exits 1 on a clean tree cannot be a gate.
  - id: H-3
    title: "The pycache hazard did not bite, because it was defended against"
    detail: >-
      `PYTHONDONTWRITEBYTECODE=1` plus a `__pycache__`/`*.pyc`/`.pytest_cache`
      sweep ran before and after all 21 mutants and every restore. No result in
      this report failed to reproduce after a sweep, so no survivor here is a
      cache artefact and no kill here is a stale-bytecode kill.

