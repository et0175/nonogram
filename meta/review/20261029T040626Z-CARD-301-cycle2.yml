declared_survivors_verdict:
  - id: M6edge / the declined widening
    verdict: >-
      **The declination holds, and its measurement is understated rather than
      overstated.** I built the proposed rule rather than taking the round's
      word: `ast.get_docstring` on `tests/bench_generate.py`, whitespace
      normalised, split on sentence boundaries, flag any sentence matching
      `(pytest|suite)` and `(collect\w*|runs?|ran|execute\w*)`. Over 35
      sentences it returns **3 hits on arrival** — and the first hit is the
      *positive* statement the rule exists to protect ("**pytest does not
      collect this file, and since CARD-301 that is deliberate rather than
      accidental.**"), the second is the retired-claim recital, the third is
      the cross-reference to the collected module. The rule cannot distinguish
      an affirmation from a negation, and any polarity-aware variant is a new
      natural-language problem inside a prose guard. So the widening would red
      immediately, the narrowing was the right move, and the declared survivor
      stays a declared survivor with a reason that is true. The structural pin
      the comment names as reaching the general case does reach it: `D-2`
      (planting `test_gate_verdict` back into the benchmark) is killed at
      `:450`, so prose claiming the suite runs the file is false *and cannot
      become true by accident*, which is the residual's real bound.
  - id: F-9's missing in-suite control
    verdict: >-
      **The declination holds in outcome; its stated reason does not — see
      N-2.** "Both doors agree once the registry and trace are right" is false:
      measured, with the gate renamed the validator reports no dead-link ERROR
      for it, because the module's own docstring is the `git grep` match and is
      required to be. What makes the declination right is the asymmetry rather
      than the agreement — `:541` resolves the ref against `globals()` filtered
      by `callable`, which is strictly stronger than `git grep -lw`, reds on a
      rename (F9b), and reds in the same commit as the rename. A control
      asserting "`bench_generate.py` does not quote the node id" would protect
      the weaker door only, and would not protect it, since the stronger
      door's own file supplies the same text. **Not adding it was correct.**
  - id: DEL-1
    verdict: >-
      **New declared survivor of my own, with a reason I believe is true.**
      Renaming `test_the_trace_matrix_names_this_modules_gate_for_nfr001` out
      of collection (prefix `_retired_`) survives: 9 passed, nothing reds. The
      module's only existence floor is `assert len(defined) >= 8` at `:538`
      against 11 declared, so up to three of the card's own controls can be
      deleted silently, and `tests/test_collected_names.py` checks
      collect*ibility*, never existence. I declare rather than gate this for
      two reasons: the loose floor is the same deliberate pattern as
      `MIN_DECLARING_NAMES = 5000` against a measured 6,348 (a bound far below
      the count so ordinary deletions do not red it, far above zero so an empty
      walk cannot read clean), and the defect is a property of this board's
      guard idiom rather than of this card. It is named here so the next card
      that wants a control-count pin knows the gap is measured, not assumed.

mutations_refired:
  method: >-
    Own harness under
    /private/tmp/claude-501/-Users-omelnikova-PycharmProjects-PythonProject4/c614013f-3aed-4267-b97b-f6b7c4245f96/scratchpad/card301review2
    — never the shared root, a sibling card's agents are live. Every mutant
    asserts all five branch paths are at their HEAD blob by `git hash-object`
    before it applies, asserts its own `old_str` occurs exactly once, restores
    with `git show`/`git checkout --` (never `git checkout <rev> -- <path>`,
    which stages), and re-asserts all five blobs by hash afterwards.
    `PYTHONDONTWRITEBYTECODE=1` throughout and a `find -name __pycache__ -prune
    -exec rm -rf` + `*.pyc` + `.pytest_cache` sweep **before and after every
    mutant**, per the fix round's timestamp-`.pyc` hazard. Plain passes with
    `-o addopts=` and `--tb=line`, selected by node id or by module with the
    14 s gate explicitly `--deselect`ed; figures counted from the rows.
  recording_instrument: >-
    Built and proven before use, per the brief: an `ast` transformer wrapping
    every `assert` in `try/except AssertionError/except BaseException` with a
    per-line `_REC` dict pre-seeded `NOT-REACHED` and dumped at `atexit`, so no
    assertion short-circuits and a crash is reported as `CRASH:` rather than as
    a survivor. Proven on a deliberately failing bare `assert x == y` twice —
    once under pytest (reported `FAIL: assert 1 == 2`) and once with no pytest
    rewriting at all, where the `AssertionError` message is genuinely empty and
    it reported `FAIL: <bare assert, empty message>`, not `NOT-REACHED` and not
    a crash. In the event the plain passes gave unambiguous single-cell
    attribution for 20 of 21 mutants, so the recorder was needed only as the
    guarantee that a zero would have been readable.
  deletion_shaped_and_line_count_preserving: true
  refired_from_cycle_1:
    - id: F1a (cycle 1's Mcorpus / the orchestrator's pre-gate)
      mutation: "tests/bench_generate.py: DENSITIES = (30, 40, 50, 60) -> (50, 60, 70, 80)"
      named_cell: ":286"
      observed: "KILLED at :286. 2 failed, 9 passed in 0.26 s; the failures are the corpus pin and [XPASS(strict)]."
