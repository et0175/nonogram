findings:
  - id: F-101
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 3162
    title: "A confirmation page that fabricated a floor override for every ticked puzzle passes every test (surviving mutant N4)"
    description: |
      [static] Mutation N4: `+ [(f"override_{pid}", "on") for pid in overrides]`
      -> `... for pid in kept_ids` leaves the whole card scope green
      (tests/test_book_published_confirm.py + tests/property/test_book_workflow.py
      + tests/test_book_floor.py, 156 tests, exit 0).

      Cycle 1's F-001 pinned one direction of this expression — an override the
      owner GAVE must survive the screen. The other direction — only the
      overrides the owner gave may survive it — is pinned by nothing, because
      the new test `test_pressing_confirm_carries_the_floor_override_with_it`
      (tests/test_book_published_confirm.py:543-589) ticks exactly ONE puzzle
      and overrides exactly that one, so `kept_ids == overrides` and the two
      readings are indistinguishable. That is the identical single-item blind
      spot cycle 1 named in F-002 for the `puzzle_ids` leg; the fix added a
      three-puzzle test for that leg and re-introduced the shape on this one.

      Failure scenario: the owner is on /book/<id>/select-puzzles for a
      published book, ticks 40 puzzles, one of which prints below the 4.8 mm
      floor, and does NOT tick its override. The store asks. The owner presses
      "Confirm change". With the mutant, the screen carries `override_<X>` for
      all 40; the re-POST's `_submitted_overrides` (app.py:2801) returns all 40;
      the store's `allowed` set (book_manager.py:1184) admits X, and
      `newly_overridden` (book_manager.py:1191) PERSISTS a floor override for X
      that the owner never gave. INV-006 ("a member below the floor is a member
      only together with an explicit override stored for that puzzle id") is
      then satisfied by an override the confirmation screen invented — and it
      survives every later trim change, which is exactly what CARD-121 item 4's
      override-pruning comment exists to prevent.

      Production code is correct today; the finding is against the test, per the
      surviving-mutant rule.
    suggestion: |
      Extend `test_pressing_confirm_carries_the_floor_override_with_it` (or add
      a sibling) to a submission of at least two puzzles where only one carries
      an override: assert the confirmation's fields carry `override_<tiny>` and
      NOT `override_<other>`, drive `resubmit_confirmation`, and assert
      `floor_overrides(book_id) == [tiny]` — i.e. the set, not just the
      membership. A second below-floor puzzle ticked WITHOUT an override, still
      refused by name after the confirm, kills the mutant on the behaviour
      rather than on the field list.
    confidence: high
    source: static
    violates: INV-006
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 3161
    title: "The confirmation's `shown_ids` leg is provably inert — the surviving mutant is dead weight, not missing coverage"
    description: |
      [static] Mutation N7: dropping `+ [("shown_ids", pid) for pid in kept_ids]`
      entirely leaves the card scope green (exit 0). Unlike F-101 this is not a
      coverage gap: the field cannot change the outcome. On the re-POST,
      `_fold_tab_into_selection` (app.py:2777-2788) computes
      `kept = [pid for pid in _kept_selection(book_id) if pid not in shown]`
      and then `_keep_selection(book_id, kept + ticked)`, and
      `_keep_selection` de-duplicates with `dict.fromkeys` (app.py:2765).
      Because `kept_ids` IS the whole kept selection (it is the return value of
      `_fold_tab_into_selection` on the original POST), `shown` either covers
      everything (field present: kept = [], result = ticked) or covers nothing
      (field absent: kept = everything, result = everything + ticked, deduped to
      the same list). Same set, same order, either way.

      Worth recording because a reader of the worktree notes ("the tests drive
      that rendered form ... so a confirmation page carrying the wrong fields
      fails") would reasonably believe this leg is load-bearing and covered. It
      is neither.
    suggestion: |
      Either drop the `shown_ids` leg and say in the comment why the fold does
      not need it on a re-POST, or keep it and add the one case that would make
      it matter (a confirmation submitted after the owner ticked more puzzles on
      another tab) — but do not leave it as an untestable field that reads as
      covered.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
