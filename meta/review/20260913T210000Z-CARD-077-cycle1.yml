  - id: F-009
    severity: low
    category: tech-debt
    type: question
    file: src/nonogram/admin/regrade.py
    line: 478
    title: "_as_grid coerces non-boolean cells, which is the opposite of what its docstring promises"
    description: |
      The module docstring says a malformed row is "a data defect, reported
      rather than guessed at", and _as_grid's own docstring frames itself as
      "reading, not validating". But the read is `bool(cell)` per cell, so a
      JSON grid of strings, ints or nulls is silently coerced into a boolean
      grid and graded as a puzzle rather than reported UNREADABLE_GRID. Shape is
      validated strictly (rectangularity, non-emptiness); cell type is not
      validated at all.

      Filed Minor rather than as the intent-drift Important the lens would
      default to, because I cannot demonstrate a reachable failure: ADR-0012
      fixes the boundary type at list[list[bool]], JSON round-trips booleans
      faithfully, and no writer in the repo produces non-bool cells. The
      divergence between the stated posture and the code is real; its blast
      radius today is not.
    suggestion: |
      Either reject a non-bool cell (`if not isinstance(cell, bool): return
      None`), which matches the docstring, or keep the coercion and say so in
      the docstring — that a truthy cell is read as filled, deliberately,
      because a JSON column has no bool guarantee.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: a3ab9dc+fix
    dismissed_reason: null
    learned_pattern: null

  - id: F-010
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/regrade.py
    line: 346
    title: "Every solve runs inside the open write transaction, with no bound on the run as a whole"
    description: |
      regrade() loads all rows with .all() and solves each one inside the
      session the caller opened; on the POST path session_scope commits only
      after the last solve returns. The budget is per row
      (GENERATION_BUDGET_SECONDS = 30s) with no ceiling on the run, so worst-
      case wall clock is rows x 30s — 43 minutes at production's 86 rows — with
      a SQLite write transaction held throughout and a Flask request blocked on
      it.

      Measured reality is nowhere near that: 16 rows in 0.15s locally, 86 rows
      in 1.3s on Render, and the card's own notes say "the batch is not long-
      running". The admin has no background-job machinery to reach for either
      (no threading anywhere in src/nonogram/admin/). So this is a latent
      scaling property, not a present defect — worth recording because the
      table only grows and the failure mode (a half-minute-per-row stall behind
      a lock) is invisible until it is not.
    suggestion: |
      Nothing now. If the table grows past a few hundred rows, either bound the
      run as a whole and report the unreached rows as a fourth skip reason, or
      commit in batches of N rows — the capture-once guard already makes a
      partially-applied run safe to resume.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: wontfix
    fixed_in: null
    dismissed_reason: |
      Latent scaling property, not a present defect: measured 0.15s over 16 rows and 1.3s over 86, and the admin has no background-job machinery to move the loop into. Recorded in the card's Worktree notes for when the table grows.
    learned_pattern: null
