  - id: F-004
    severity: high
    category: ops
    type: risk
    file: src/nonogram/admin/regrade.py
    line: 378
    title: "On the production DB the legacy columns would capture already-re-graded values as 'pre-run'"
    description: |
      _capture_legacy_grade's guard is exactly right and that is the problem.
      The guard is `legacy_difficulty_tier IS NULL`, which answers "has this
      row's original grade been captured?" — a question that is only equivalent
      to "has this row been overwritten?" while this batch is the sole writer.

      For the Render production database it is already false. All 86 rows were
      re-graded out of band on 2026-09-13, before migration 006 existed, so
      every row now carries an ADR-0029 score and tier while
      legacy_difficulty_tier is NULL. Running 006 + this batch on that database
      captures the 2026-09-13 values into columns the card's Why section, the
      migration docstring and the confirmation page all describe as the pre-run
      grades — and the capture-once guard then closes permanently on the wrong
      values, which is precisely the failure NO_LEGACY_TIER was designed to
      prevent for a different cause.

      The card's registered mitigation for its ⚑ point-of-no-return risk
      ("old values copied to legacy columns before overwrite") is therefore void
      for the one database where the risk is real. The actual pre-run record for
      production is render-grades-backup.json, which is session-scoped scratch
      and not durable.
    suggestion: |
      No code change is required — this is a precondition, and stating it is the
      fix. Either (a) backfill legacy_difficulty_score/legacy_difficulty_tier on
      the production rows from render-grades-backup.json immediately after
      `alembic upgrade 006` and before the batch runs, which restores the
      columns' stated meaning; or (b) record in the card's Worktree notes and on
      the confirmation page that for the production database the legacy columns
      hold the 2026-09-13 re-grade, not the original grades. Either way, persist
      render-grades-backup.json somewhere durable first.
    confidence: high
    source: inferred
    violates: null
    root_cause: null
    status: fixed
    fixed_in: a3ab9dc+fix
    dismissed_reason: null
    learned_pattern: null

