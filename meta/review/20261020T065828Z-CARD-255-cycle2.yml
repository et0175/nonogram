    dismissed_reason: null
    learned_pattern: null

  - id: F-105
    severity: low
    category: ops
    type: risk
    file: tests/README.md
    line: 311
    title: "The new `trap ... EXIT` stays armed for the profiler's whole shell and can delete a gate's lock"
    description: |
      F-010's fix added `trap 'rm -f "$LOCK"' EXIT` to the profiling snippet, at
      top level. The trap is armed when the line runs and stays armed until that
      shell exits — not until the profile ends. The snippet is pasted into an
      interactive shell (the section's own framing: "Take the lock for the
      duration ... and remove it when done"), so the sequence

          human profiles, deletes the lock with the documented `rm -f`,
          keeps the terminal open;
          a gate takes meta/kanban/.full-suite.lock;
          the human closes the terminal

      fires the trap and deletes a LIVE gate's lock, switching this guard off for
      the remainder of that gate — the silent direction this card exists to
      close, reached through the fix for the finding about the opposite direction.

      Narrow (it needs that ordering) and strictly better than cycle-1's
      no-trap state in the Ctrl-C case it was written for. Reported because the
      snippet is now load-bearing and because `rm -f` on a path the shell does
      not own is what makes it reach past the profile.
    suggestion: |
      Scope the trap to the profile rather than the shell — either run the block
      in a subshell, `( trap 'rm -f "$LOCK"' EXIT; ...; )`, or add `trap - EXIT`
      on the line after the documented `rm -f "$LOCK"`.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-106
    severity: info
    category: ops
    type: question
    file: tests/full_suite_lock.py
    line: 226
    title: "The one real-producer shape whose verdict the isabs clause changes: gate.sh invoked with a relative worktree argument"
    description: |
      Answering the brief's question directly — is there a lock a real producer
      could write that the guard now refuses and previously allowed? Yes, exactly
      one: `gate.sh <worktree> <out> <why>` takes its worktree as an argument
      (`WT="$1"`, gate.sh:5) and writes `worktree: $WT` verbatim, then `cd "$WT"`
      and runs pytest there. Invoked relatively —
      `gate.sh ../PythonProject4-card-255 out.txt "build gate"` — the lock reads
      `worktree: ../PythonProject4-card-255`, and from inside that worktree that
      value resolves to the worktree itself. Probed: pre-fix True (the gate's own
      run proceeds), post-fix False (the gate refuses itself at exit 4, naming
      `'../PythonProject4-card-255' is not an absolute path`).

      This is the intended direction and not a defect: pre-fix that same lock
      ALSO resolved to every other worktree's own path, so it disabled the guard
      board-wide in silence (F-001). Loud self-refusal with the reason printed is
      the better of the two. Recorded so the orchestrator knows the standing
      requirement explicitly: keep passing gate.sh an absolute worktree. The four
      dedicated scripts hardcode absolute paths; gate.sh is the only one that
      could be called otherwise, and it lives outside the repo where no test can
      reach it.

      Also recorded here: the directory-at-the-lock-path trick in
      test_a_lock_that_cannot_be_read_is_not_the_same_as_no_lock does exercise the
      `except OSError` branch (M-D killed it through both of its assertions), but
      the docstring's stated reason for preferring it over `chmod 0o000` is not
      reproducible on this host — `chmod 000` then `read_text()` raises
      PermissionError for euid 501 here. The claim is about other hosts (root,
      some ACL/NFS setups) and the directory route is strictly more
      deterministic, so the choice is right; only its justification is
      unverifiable where it is written.
    suggestion: "No change asked for. Optionally narrow the docstring's reason to 'a directory is deterministic on every host' rather than a claim about chmod."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
