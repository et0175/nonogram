  - id: F-104
    severity: low
    category: ops
    type: risk
    file: tests/test_full_suite_lock.py
    line: 611
    title: "F-008's new AST rule reaches exactly one name past the text rule it sits behind"
    description: |
      The fix added, inside test_the_guard_cannot_turn_a_refusal_into_a_skip, an
      AST pass asserting no call in the module resolves to
      {skip, skipif, importorskip, xfail, add_marker, exit}, with the docstring
      framing it as "the claim itself, read off the module's syntax".

      Judged against that framing: the text rule immediately above it (lines
      606-610) already asserts the substrings "skip", "add_marker" and "xfail"
      are absent from the whole file, and it runs first in the same test. So five
      of the AST rule's six names cannot fire — if the text rule passes, no call
      can be spelled `skip`, `skipif`, `importorskip`, `xfail` or `add_marker`.
      The AST rule's only independent member is `exit`.

      That one member is demonstrably live, which is why this is a note and not a
      violation: mutant M-G (`raise pytest.UsageError(said)` ->
      `pytest.exit(said)`) was killed by the AST rule and by nothing else —
      1 failed, every real-run test green. So the fix did buy a control that did
      not exist, just a narrower one than the docstring implies.
    suggestion: |
      Either say in the docstring that the AST rule's reach past the text rule is
      the non-skip exit APIs (and widen it to the ones that matter: `exit`,
      `Exit`, `wasxfail`), or drop "skip"/"skipif"/"importorskip" from
      forbidden_apis so the two rules do not overlap and each one's reach is
      readable.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
