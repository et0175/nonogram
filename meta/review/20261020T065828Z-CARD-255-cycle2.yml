findings:
  - id: F-101
    severity: high
    category: ops
    type: gap
    file: tests/test_full_suite_lock.py
    line: 414
    title: "The override scan's new prose allowlist exempts two whole directories by prefix, with no control and no equality against the shapes that exist there"
    description: |
      The F-004 fix did the right thing to the scan — it is now the whole tracked
      tree, and M-H proves it (an `export NONOGRAM_IGNORE_FULL_SUITE_LOCK=1`
      appended to scripts/run_admin_tests.sh reds the test post-fix and was GREEN
      under the cycle-1 body). But it paid for that reach with a new exemption:

          OVERRIDE_PROSE = ("meta/kanban/cards/", "meta/review/")
          ...
          if path not in OVERRIDE_NAMERS and not path.startswith(OVERRIDE_PROSE)

      `OVERRIDE_NAMERS` is three exact paths — an equality, which is what
      ADR-0039/R3 asks for. `OVERRIDE_PROSE` is two open-ended directory
      prefixes with no constraint on the file's shape, and nothing tests that it
      cannot absorb a real setter.

      Probed live in this worktree, not reasoned about:

          meta/kanban/cards/run-the-suite.sh   (chmod +x)
          meta/review/run-the-suite.sh         (chmod +x)
          both containing: export NONOGRAM_IGNORE_FULL_SUITE_LOCK=1
                           exec pytest "$@"
          git add -N both  ->  git grep -l NONOGRAM_IGNORE_FULL_SUITE_LOCK
                               lists both
          pytest tests/test_full_suite_lock.py::test_nothing_in_the_tree_sets_the_override_for_a_run
          ->  1 passed

      Two live in-tree setters, test green. (Both files removed and the index
      reset afterwards; `git status` verified clean.)

      This is cycle 1's standard applied to the new clause, not a higher one:
      F-004 gated on the fact that an export in scripts/run_admin_tests.sh
      *would* switch the guard off and leave the test green — nobody had
      actually written one. The same sentence is now true of two directories
      instead of one file.

      It is also the exact shape ADR-0039/R3's own comment records as the reason
      the rule exists: "CARD-239 cycle 2 is the counter-example this rule exists
      for: the fix for a too-narrow predicate added an exemption that re-opened
      the same route one hoist later, and its controls tested only what it
      exempted." R3 is `severity: mandatory`.

      What is NOT the finding: the prefixes are correctly spelled with trailing
      slashes, so a sibling directory (`meta/review-archive/`, `meta/reviews/`)
      does not match — checked. And both prefixes are load-bearing, not
      speculative: in this worktree `git grep` hits
      meta/kanban/cards/CARD-255.md, and in the main checkout it also hits the
      tracked meta/review/20261020T062654Z-CARD-255-cycle1.yml. Per-card
      filenames are why a prefix was reached for; the problem is only that the
      prefix was not bounded to the shapes those directories hold.
    suggestion: |
      One clause, and it restores the equality R3 asks for while keeping the
      per-card flexibility the prefix was reached for:

          PROSE_SHAPES = (".md", ".yml")
          ...
          and not (path.startswith(OVERRIDE_PROSE) and path.endswith(PROSE_SHAPES))

      Its control is the probe above, as a test: write an executable
      `*.sh` naming the override under each exempted prefix (tmp_path plus a
      monkeypatched REPO, or `git add -N` in a throwaway clone), and assert the
      offender list is non-empty. That is "caught with the exemption removed,
      missed with it in place" for the new exemption, which is what the existing
      M-H control does for the scan but not for the allowlist.
    confidence: high
    source: model
    violates: ADR-0039/R3
    root_cause: RC-1
    status: open
