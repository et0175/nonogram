  - id: F-103
    severity: low
    category: ops
    type: gap
    file: tests/test_full_suite_lock.py
    line: 573
    title: "The documented exit code 4 has no control: `returncode != 0` accepts pytest.exit"
    description: |
      The card's "What a gate sees now" block states the refusal is "exit 4,
      before collection", and exit 4 is what the guard actually produces
      (`pytest.UsageError` -> USAGE_ERROR; probed live here with an injected
      foreign lock: EXIT=4). No test holds it. All six real-run assertions are
      `result.returncode != 0` / `== 0` (lines 573, 631, 653, 667, 678, 689).

      Measured, not asserted: mutant M-G replaced
      `raise pytest.UsageError(said)` with `pytest.exit(said)` — exit code 2,
      not 4 — and every real-run test stayed green; only the new AST rule
      reddened. So the exit *code* claim has no control at all, and the only
      thing standing between it and a silent change is a text/AST rule about
      the word "exit".

      Low because nothing consumes the code: all five gate scripts record
      `EXIT=$?` and none branches on 4 (read). It is a claim in card prose with
      no mechanism, which on this board is a family worth naming even when the
      blast radius is a log line.
    suggestion: |
      Change the AC-1 real-run assertion to `result.returncode == 4` (and say in
      one line why 4: UsageError is the only outcome, and a different code means
      the abort moved to a different mechanism).
    confidence: high
