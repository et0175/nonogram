    type: gap
    file: tests/test_book_pdf_band.py
    line: 1145
    title: "Class docstring's 'within about a line's height sideways' sufficient condition is contradicted by M1"
    description: |
      The class docstring says the class "Fails if ... prints a second copy of a band on rows with no
      other ink within about a line's height sideways". Measured on page 3: the band line is 57 px tall
      (ink box 57x432); mutant M1's copy spans cols 180-611 and the grid starts at col 716, a 104 px gap
      (about 1.8 line heights), yet every pixel test stays green (rerun this cycle). _lines splits a row
      group sideways only at a gap as wide as the whole group is tall, and the group beside the drawing is
      the 1158 px grid. The next sentence explicitly carves out "a copy beside the drawing (a side margin)",
      and the section comment uses the phrase as a necessary condition ("found only on rows ..."), which is
      true, so no reader is misled about any measured case. Only the general rule is loose. Not gating.
    suggestion: |
      Replace "within about a line's height sideways" with "sideways closer than the height of the tallest
      ink sharing its rows (about a line's height in the band strip, slot gap and top/bottom margins; the
      ~1158 px grid beside the drawing, which is wider than the side margin)". Do the same at line 924 if wanted.
