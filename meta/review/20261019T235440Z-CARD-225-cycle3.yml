findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 6356
    title: "`section_plan`'s and `_unmeasurable_members`' comments assert a universal reachability that a one-line probe refutes — the read does do work, on a path no test and no production caller reaches"
    description: |
      Two sentences fix cycle 2 wrote state an absolute about reachability:

        * book_pdf_generator.py:6356-6358 (`section_plan`): "**Its position makes no claim.** A
          book whose stored print specification cannot be laid out **never reaches this method at
          all**: `__init__` laid the same sheet out when the generator was built and raised there".
        * book_pdf_generator.py:4072-4080 (`_unmeasurable_members`): the deleted `spec_is_readable`
          branch "was unreachable from both production entries, because
          :meth:`BookPDFGenerator.__init__` lays the sheet out when the generator is built and
          raises there, so **nothing holding an unreadable sheet ever gets as far as a payload**".

      **Measured, on this tree.** A book whose spec becomes unreadable *after* the generator is
      built does reach `section_plan`, and on that path `section_plan`'s own `spec =
      self.page_spec(1)` is what refuses it. Probe (pristine c62e8f6):

          gen = BookPDFGenerator(book)      # constructor read succeeds; the sheet is fine
          book.trim_width_cm = "abc"        # unreadable AFTER construction
          gen.section_plan(rows)
            -> ValueError: book trim_width_cm must be a number of cm, not 'abc'

      and with M14 applied (that read made non-raising), the same probe gives:

          -> RuntimeError: puzzle 1, 2, 3 could not be laid out: book trim_width_cm ...
             __cause__ = ValueError: book trim_width_cm must be a number of cm, not 'abc'

      which is precisely the per-puzzle abort for a book-level fault that failure-matrix row F-3b
      forbids. So the read's position is load-bearing on that path, `_unmeasurable_members` is
      reachable with an unreadable sheet on that path (it names all three members), and the two
      absolutes are false as written.

      **What is NOT wrong, and why this is Minor rather than Important.** No production caller can
      reach it: all six construction sites of the admin generator build it fresh and use it
      immediately within one request (book_pdf_generator.py:1437, app.py:827/946/5463/5642,
      book_proof.py:764), `self.book` is assigned at exactly one site, and there is no
      alternate constructor, cached instance, `__new__` or `cached_property` on the class
      (pdf_generator.py:344's `_pdf_generator` singleton is a different, reportlab-based class of
      the same name). The deletions fix cycle 2 made are therefore safe — verified independently:
      `grep -rn spec_is_readable src tests` finds no reference outside the docstring that records
      its removal, so no test reached the deleted branch. And the comments' *operative* claim
      ("Moving this read under that try fails no test", "nothing here is stated as a mechanism")
      is TRUE and I re-measured it: M14 survives with 0 failures over the 335-test selection.

      The hazard is maintenance, not behaviour: the comment tells the next reader that the
      statement is not a mechanism, which reads as licence to move or delete it, and doing so
      would silently reintroduce the F-3b failure mode on the post-construction path.

      **Family.** This is the claim family — a committed sentence wider than what holds — which
      gated cycle 1 (F-005) and cycle 2 (F-001), and it is attributable to fix cycle 2.
      **It is NOT the third generation** in the sense the brief defines: the claim's deletion
      mutant was run, it survives, and the comment correctly predicts that survivor. What is
      unmeasured here is a reachability absolute, not a coverage claim with a dead control.
    suggestion: |
      Two words, in both places. Replace the absolute with its true scope: "no **production**
      caller reaches this method with a sheet that will not lay out — all six construction sites
      build the generator fresh and use it immediately — so this read's position is not what holds
      row F-3b; the mechanism and its mutant (M19) are in `__init__`. It does still refuse a book
      whose spec became unreadable after construction, which no caller does and no test drives."
      Same for `_unmeasurable_members`' sentence. No code change: the statement earns its keep
      (it feeds the TOC measurement) and the deletions were correct.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: feature
    type: bug
    file: meta/kanban/cards/CARD-225.md
    line: 52
    title: "The 13x13 worked arithmetic in the scope statement is wrong — the owner-visible gap is 0.371 mm, not the ~0.23 mm the card tells them to expect"
    description: |
      F-007's claim fix narrowed AC-1 and the `## What to implement` scope statement, and attached
      a worked case to both. The narrowing itself is correct and I verified it (see below). The
      arithmetic is not.

      **The committed figures** (`## What to implement` item 1, and the fix-cycle-2 F-007 note):
      "three 13x13s at 1-deep gutters on Book 1 have a book cell of 7.5 mm, the pair of them fits
      at about **7.27 mm**, and the third prints alone at 7.5 mm — a **~0.23 mm** difference the
      owner can see on paper."

      **Measured on this tree**, production path, Book 1, three 13x13 members at (1, 1) gutters:

          book cell map          = {(13, 13): 7.5}
          _pair_cell_mm cap      = 7.5
          plan                   = page 1: numbers=(1, 2) PAIR, page 2: numbers=(3,) SINGLE
          PairLayout.cell_mm     = 7.128738095238095      (both slots identical)
          off the ink            = 7.1250 mm (pair page) vs 7.4963 mm (single page)
          difference             = 0.3713 mm

      So the pair prints at **7.13 mm**, not 7.27 mm, and the gap the owner will see is
      **0.371 mm** — about **60% larger** than the card's figure. (7.27 would need ~203.6 mm of
      pair height; the real figure implies ~199.6 mm. The missing ~4 mm is the band / folio
      reserve the quick `pair height / 28 cells` derivation omitted.)

      **What IS right, and measured.** The narrowing's substance holds: AC-1's "every one of them
      **that prints on a single page**" is exactly what its test measures — `TestBookCellSize_
      SameGridSizeSameCell`'s three 20x20s at row gutters 3/7/10 produce three SINGLE pages
      (`numbers=(1,), (2,), (3,)`, probed directly), all drawn at 6.35 mm = the deepest member's
      own fit, so the parenthetical "this AC's test uses a book whose members do not pair" is true
      rather than assumed. The pairing exception is real: the 13x13 case above is a member of a
      grid size printing smaller than its single-page sibling, exactly as row F-9 declares. And
      the geometry did NOT change: `export/layout.py` is unedited by the whole card, no band
      constant assignment appears in the card's src delta, and the fix delta's src half is one
      deleted statement, one deleted unreachable branch and comments.

      **Why this matters beyond prose.** It is the figure the owner's render brief would carry.
      Told to look for 0.23 mm they may read a 0.37 mm step as a defect, or vice versa — and this
      is the one risk on this card that review cannot close, since no test can see a cell that is
      wrong to the eye.

      **Family.** Claim family, attributable to fix cycle 2 (the figure originated in cycle 2's
      F-007 finding and was copied into the card rather than re-derived). Third reading of the
      family by shape; **not** the third generation by the brief's definition — there is no
      mechanism to delete here, only a number nobody measured.
    suggestion: |
      Replace both occurrences of the worked case with the measured one: "three 13x13s at 1-deep
      gutters on Book 1 have a book cell of 7.5 mm; the two that share a page print at
      **7.13 mm** and the third prints alone at **7.50 mm** — a **0.37 mm** difference the owner
      can see on paper (measured off the ink: 7.1250 mm vs 7.4963 mm; PairLayout.cell_mm =
      7.128738)." Same correction in the fix-cycle-2 F-007 note and in cycle 2's F-007 record.
      AC-1's own wording needs no change — it carries no number. Then brief the owner's render
      with 0.37 mm.
    confidence: high
    source: static
