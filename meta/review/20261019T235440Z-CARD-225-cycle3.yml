  - "F-001 CLOSED, and closed on the mechanism — this is the strongest closure on the card. The two dead statements and the unreachable branch are gone (`grep -rn spec_is_readable src tests` finds only the docstring recording the removal; no test reached the branch). The replacement claim is load-bearing and its control reds exactly as declared: M19 -> 3 failed, the same three the card names, and the failure mode is precisely what the test docstring predicts — `RuntimeError: puzzle 'First-15x15', 'Second-15x15' could not be laid out`, raised at book_pdf_generator.py:1466 out of `puzzle_page_plan`, the entry whose own pre-read was deleted. M19's edge was probed and has no hole: six production construction sites, all fresh-and-immediate; one assignment to `self.book`; no alternate constructor, cached instance, __new__ or cached_property; pdf_generator.py:344's same-named singleton is a different class. Residue: one universal sentence refuted on the post-construction path (F-001 this cycle, Minor)."
  - "F-002 CLOSED — and this is the honest form the brief asked for. M13 re-measured at 0 failures over the 335-test selection, which is what the comment now PREDICTS rather than contradicts. A comment that names its own survivor is not a coverage claim, so ADR-0039/R1 has nothing to bite on. The reachability reason behind it ('not constructible through this entry') is not independently derived and is recorded as unverified in coverage — nothing rests on it."
  - "F-003 CLOSED — EC-027's divergence is declared card-side as orchestrator finding 4, symmetric with F-13's treatment of EC-021, and no registry file moved: `meta/architecture/**` is absent from `git diff --name-only 7bc93c1 c62e8f6`. The registry wording stays the architect station's, as the brief directs."
  - "F-004 CLOSED — every figure verified independently, not taken from the card. 18 books, nine per family (BOOK_CELL_COLUMNS 22/23/24 x three depth pairs); counters measured 9 / 9 / 4 against floors 6 / 6 / 3; REFUSING_ACROSS 28 -> 190.5/28 = 6.80 mm (below 7.0, F-8) and LOWERING_ACROSS 27 -> 190.5/27 = 7.056 mm (above 7.0, below the pair's own fit, F-9), both arithmetics correct. M22 reds the walk half at `1 >= 6`; M23 reds the rendered half at `2 >= 3`; M21 (`_pair_cell_mm` -> None) still reds BOTH halves on the page structure (`assert [(1, 2), (3,)] == [(1,), (2,), (3,)]` at :822 and the interior page count at :1036), not on a counter — so the corpus grew without the property starting to lean on its fixtures, which was the thing to check. The sweep alone still supplies every pre-existing minimum (verified by running it with the fixtures removed). Residue: two shared floors diluted (F-003 this cycle, Minor)."
  - "F-005 CLOSED — `assert type(raised.value) is ValueError` replaces the assertion that could never fire, with a comment saying why. Re-derived: RuntimeError is not a subclass of ValueError, so the old line sat downstream of a `pytest.raises(ValueError)` that would already have let a RuntimeError through. The new assertion is reached by both entries in the loop and is the one the intent needed."
