  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: tests/property/test_book_pairing.py
    line: 913
    title: "The 18 hand-built books dilute two pre-existing sweep-only floors that fix cycle 2's re-derivation did not revisit"
    description: |
      The three CARD-225 counters are intact and I verified every figure the card claims —
      `refused_on_book_cell` = **9**, `book_cell_lowered` = **9**, `shared_binds` = **4**, against
      floors 6/6/3; with `_book_cell_books()` removed from the walk corpus both CARD-225 counters
      are **0** over the sweep, so the families really are their sole source. That half is sound.

      What was not revisited is the floors the hand-built books now also feed. The walk half's
      pre-existing minima were measured on the sweep alone and are still worded that way:

          assert books  >= 3595, books      # comment: "3600 less the near_threshold tolerance"
          assert paired >= 100,  paired

      Measured, both ways:

          with the 18 books:  books=3618  paired=106+9=115  pages=16039  below_cap=81
          sweep alone:        books=3600  paired=106        pages=15994  below_cap=72

      So:

        * `books >= 3595` — the comment's stated reasoning ("the book floor is 3600 less the
          `near_threshold` tolerance, which is the only way a case leaves the loop without
          counting") is now off by 18: the corpus is 3618, so the effective tolerance on the
          sweep is 23, not 5. A sweep silently shrunk to 3577 books still passes.
        * `paired >= 100` — headroom on the sweep is **6** (106), while the F-9 family contributes
          **9** pairs. The fixture contribution now exceeds the headroom, so a sweep regression of
          7 or more paired pages would be masked by the fixtures. At cycle 1, with one F-9 book,
          the contribution was 1 against the same headroom of 6; the parametrisation to nine books
          per family is what crossed the line.

      Nothing is masked **today** — I ran the walk half with the 18 books removed and the two
      CARD-225 floors relaxed to `>= 0`, and every pre-existing minimum still passes on the sweep
      alone, which is the check the brief asks for: the sweep still supplies the universal half
      with its pre-existing minima intact. This is a loss of future discriminating power, not a
      broken guard, and no CARD-225 claim rests on either floor.

      Fix cycle 2's DECLARATIONS F-004 re-derived "the property module's docstring,
      `_book_cell_books`' docstring, both corpus generators' docstrings and all three counter
      comments" — i.e. exactly the CARD-225-specific surface. The shared counters the same loop
      increments were out of that scope.

      **Family.** The corpus family (cycle-1 F-003, Important; cycle-2 F-004, Minor), attributable
      to fix cycle 2. A dilution, not a claim-vs-mechanism defect, and not a weakened assertion —
      no floor value was lowered.
    suggestion: |
      One line each, so the floors stay sweep measurements: raise them past the fixture
      contribution — `assert books >= 3613` and `assert paired >= 109` — and amend the `books`
      comment to say the corpus is 3600 swept plus 18 hand-built. Or, cleaner and what I would
      do: count the hand-built books into their own locals so the pre-existing floors keep reading
      the sweep only, and the two families' contributions stay where the three CARD-225 counters
      already put them.
    confidence: high
    source: static
