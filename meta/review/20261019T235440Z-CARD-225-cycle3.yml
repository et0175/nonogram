family_regression:
  statement: |
    **Attribution, per finding.** F-001 (the reachability absolute), F-002 (the 13x13 figure) and
    F-003 (the diluted floors) are all attributable to fix cycle 2 — all three are text or corpus
    parameters the fix commit introduced. F-004 is not attributable to either fix cycle (c0d35c0
    predates both).

    **Families.** F-001 and F-002 are the claim family, which gated cycle 1 (F-005) and cycle 2
    (F-001). F-003 is the corpus family (cycle-1 F-003 Important, cycle-2 F-004 Minor). So both
    families produce a third reading, and the detector fires on both. That must be said plainly.

    **But the third generation is NOT there, and this is the finding that decides the card.**
    The brief defines it sharply: "For every claim it left standing, find the deletion mutant that
    is supposed to kill it and run it. A claim whose deletion mutant does not red is the third
    generation." I ran them. There is no such claim. Every sentence fix cycle 2 left standing that
    names a mechanism has a deletion mutant that reds — M19 (3 failed, the named test among them,
    with the exact failure mode the docstring predicts), M20 (2 failed, with the declared [alone]
    survivor), M21 (both halves, on the page structure), M22 (1 >= 6), M23 (2 >= 3). Every sentence
    that names a survivor has one — M13, M14, and M24 which I invented to test the one disclaimer
    the card did not mutate ("No test pins that branch"), and which survives as claimed. The dead
    mechanism of cycle 2 is deleted, and nothing referenced it. The attribution error of cycle 2 is
    corrected in the code, in both entries' comments, in the test docstring, in the helper's
    docstring and in failure-matrix row F-3b, and the row now names its own killing mutant.
    That is a genuine generational change in how the fix station works, not a third repetition.

    **What the third reading actually is, and why it is cheaper by an order of magnitude.** The two
    claim-family residues are a different species from their parents. Cycle 1's and cycle 2's
    defects were *coverage* claims: a sentence crediting a mechanism, with a control that could not
    fail. Both of this cycle's are claims with **no mechanism to delete** — one is a universal
    reachability assertion ("never reaches this method at all"), one is a number copied forward
    without being recomputed ("~7.27 mm"). No mutant can catch either; only a probe and a
    calculator can, which is what I spent the cycle's mutation budget's remainder on. That is a
    real pattern and worth one line in the retro, but it is not the loop regenerating the defect:
    the loop fixed the defect it was told to fix, by the method it was told to use, and left two
    unmeasured sentences of a kind the method does not address.

    **For the retro, not for this card.** The standing rule ADR-0039/R1 already covers claims with
    controls. The gap this cycle exposes is one layer out: **a committed figure is a claim too, and
    its control is recomputation.** The cheapest enforcement is a fix-cycle obligation symmetric to
    the one that worked here — for every number a fix commits into an AC, a scope statement or a
    failure-matrix row, re-derive it from the code in the same cycle and record the derivation,
    exactly as every mechanism now gets its deletion mutant. Fix cycle 2 ran five deletion mutants
    and did not run one calculator.
