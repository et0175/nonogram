findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_memory.py
    line: 1158
    title: "TestBookPdfMemory_PagesAreUnchanged's docstring still names card144.json as the current baseline — now two recordings stale"
    description: |
      The class docstring says the evidence is "``tests/helpers/book_corpus.BASELINE_FIXTURE``,
      currently ``tests/fixtures/book_baseline_card144.json``" and narrates a supersession chain
      that ends at CARD-144 ("succeeded twice since ... by CARD-128 ... and by CARD-144"). It also
      says "Its two predecessors sit beside it" when there are now four.

      BASELINE_FIXTURE has pointed at card149.json since 2a18cf2 and points at card146.json after
      43b7a6b. `git log -L 1158,1200` shows the docstring was last touched by 837075b (CARD-144);
      CARD-149 introduced the staleness, this card inherits and extends it by one link.

      This is exactly the intent↔reality drift the docstring itself guards against: the aspirational
      layer names a fixture the test does not read. It is also the strongest co-change signal in the
      history — tests/test_book_pdf_memory.py changed with book_pdf_generator.py in 3 of the latter's
      last 23 commits and is absent from this diff — and it stands out because this card updated the
      *other* narrative of the same chain (tests/helpers/book_corpus.py's BASELINE_FIXTURE comment,
      "Three recordings" -> "Five recordings") meticulously.

      Not a correctness defect: the test reads BASELINE_FIXTURE, not its own prose, and it is green.
    suggestion: |
      In the docstring, say "currently ``tests/fixtures/book_baseline_card146.json``", extend the
      chain sentence to CARD-149 (guide-page type) and CARD-146 (the two-up frame), and change
      "Its two predecessors" to name the four. Cheapest done in this card, which already owns the
      chain's newest link; otherwise a one-line follow-up.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_puzzle_frame.py
    line: 1218
    title: "AC-3's cross-presentation comparison does not itself discriminate a 1 px placement error; its sibling does, with 0.49 px of margin"
    description: |
      AC-3 is worded "frame placement on a two-up page straddles its boundary exactly as a single
      page's does, so the two presentations agree", and
      `test_a_two_up_slot_and_a_single_page_place_the_stroke_alike` is the test that actually
      compares the two presentations. Measured: with the frame's left side moved 1 px inward
      (mutant M3), that test PASSES. The mutant is killed only by its sibling
      `test_each_slots_left_side_straddles_the_drawings_left_edge`, and the margin is thin:
      `abs(outside - inside)` measures 3.492 against `_STRADDLE_SLACK_PX = 3.0`.

      The cause is structural, not an oversight: `_STRADDLE_SLACK_PX` has to absorb two whole-pixel
      steps (the fractional boundary and Pillow's even-width centring), and a 1 px offset moves the
      asymmetry by 2 — inside the budget the cross-page comparison spends on
      `abs((paired[0]-paired[1]) - (alone[0]-alone[1])) <= 3.0`. Whether the sibling kills it
      depends on which way this pair's fractional boundary happens to fall; on a corpus whose
      boundary fell the other way the same 1 px offset would measure ~1.5 and survive both.

      Weight this low, deliberately: a 1 px offset is not a plausible regression mode here, because
      the code binds the four coordinates verbatim off `slot.frame` with no arithmetic at all — the
      realistic regressions are a dropped side or a wrong width, and those are killed 12-14 items
      wide (M1, M2, M5). The finding is that the AC's headline claim rests on a neighbouring test
      and on a fortunate fraction, not on the comparison the AC names.
    suggestion: |
      Optional. If AC-3's own test is to carry the claim, compare the stroke's first pixel against
      its boundary directly — e.g. assert `abs((paired[0] - alone[0])) <= 1` on top of the existing
      sum/asymmetry pair, or assert the offset in the same direction on both presentations — rather
      than only the difference of asymmetries, whose budget is already spent on two unavoidable
      rounding steps.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

