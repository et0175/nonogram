  - id: F-203
    severity: low
    category: ops
    type: risk
    file: tests/full_suite_lock.py
    line: 102
    title: "LOCK_PATH_VAR is a silent bypass of the guard: no announcement, and the tree scan that exists for the override does not scan for it"
    description: |
      This is the direct answer to the brief's closing question, and it is yes —
      one silent failure mode, not covered by any test that can fail.

      `lock_path()` (line 166-171) reads `NONOGRAM_FULL_SUITE_LOCK` and, when set,
      reads that path instead of the board's lock. Probed live in this worktree:

          NONOGRAM_FULL_SUITE_LOCK=<a path with no lock> pytest tests/test_clues.py
          -> 386 passed.  current_verdict() == (True, None).  report_line() == None.

      A run allowed that should have been refused, printing nothing at all —
      whereas the override walks past a lock loudly, by design, through
      pytest_terminal_summary. The quieter of the guard's two env switches is the
      one with no announcement.

      And it is the one with no control. `test_nothing_in_the_tree_sets_the_override_for_a_run`
      greps for `guard.OVERRIDE` only, so an in-tree setter of the *path* var is
      outside the scan that exists for the *override* var. The route is concrete,
      not hypothetical: `scripts/run_admin_tests.sh` is a pytest wrapper
      (`CMD="pytest"`, with a block of `export` lines at :70-83) and is precisely
      the file cycle 1's F-004 was about — cycle 2's M-H proved the widened scan
      reds when an `export NONOGRAM_IGNORE_FULL_SUITE_LOCK=1` is appended to it.
      Append `export NONOGRAM_FULL_SUITE_LOCK=/tmp/none` to the same file instead
      and the scan stays green while every run through that wrapper ignores the
      board's lock in silence.

      The guard's own docstring asserts the condition that makes this safe —
      "Unset — which is every real run, gate or agent — the path is
      :func:`default_lock_path`" (line 104-106) — and nothing holds it. That is
      ADR-0039/R1's shape on code this card wrote.

      Filed low rather than Important, and the reasoning is the probability, not
      the consequence. Today no in-tree file sets it (`git grep` finds only the
      guard, its test file, and CARD-255.md's own notes); `tests/README.md` does
      not document it (checked), so a human following the documented protocol
      never meets it; and its one documented purpose, stated at the definition, is
      "this guard's own tests: they must never create or delete the board's real
      lock" — a seam the brief itself mandates. Setting it in a real run is a
      deliberate act by someone reading the guard's source past the sentence that
      tells them not to. The override, by contrast, is documented in README as the
      way out and printed in every refusal: designed to be set. The remedy is two
      tokens.
    suggestion: |
      Two changes, either of which closes it; the first is the cheaper and matches
      the control that already exists:

      1. Widen the existing scan to both variables — the predicate and the
         exemptions are unchanged, only the grep:

             ["git", "grep", "-l", "-e", guard.OVERRIDE, "-e", guard.LOCK_PATH_VAR]

         `OVERRIDE_NAMERS` already covers the three files that legitimately name
         it, and `OVERRIDE_PROSE`+`PROSE_SHAPES` already covers CARD-255.md.
         Verified: that grep over the main checkout adds no hit outside those four.

      2. Make the redirection loud, so it cannot be silent even when nothing
         scanned for it: in `current_verdict()`, when `os.getenv(LOCK_PATH_VAR)`
         is set, return the announcement line naming the redirected path even on
         the no-lock branch. The guard already has the mechanism
         (`_ANNOUNCEMENT` + pytest_terminal_summary) and the card's own principle
         ("the one thing worse than that is a suppression nobody can see in the
         output") asks for it.

      And narrow the sentence at line 104-106: "Unset — which is every real run,
      gate or agent" is a claim about the environment that nothing verifies.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
