  - id: F-204
    severity: info
    category: ops
    type: risk
    file: tests/test_full_suite_lock.py
    line: 735
    title: "F-104's narrowed claim is one count and one name off: the set has seven names, and pytest.Exit does not exist on the installed pytest"
    description: |
      The docstring now states the syntax rule's independent reach, which is what
      F-104 asked for, and the structure of the claim is right. Two inaccuracies
      remain in the narrowed sentence itself.

      First, the count. Enumerated mechanically: the text rule forbids three
      substrings (`"skip"`, `"add_marker"`, `"xfail"`), which block 5 of the AST
      set's names (skip, skipif, importorskip, add_marker, xfail); `forbidden_apis`
      now holds **seven** names, so the independent reach is 2. The docstring says
      "five of the six names below cannot be spelled anywhere in the module" — a
      stale count from before `Exit` was added. "what the second adds to the first
      is exactly two names" is correct, so the sentence contradicts itself by one.

      Second, `Exit`. Measured: `hasattr(pytest, "Exit")` is False on the installed
      pytest (3.14 venv) — mutant M-P (`raise pytest.Exit(said)`) dies with
      `AttributeError: module 'pytest' has no attribute 'Exit'. Did you mean:
      'exit'?` and takes down three tests with INTERNALERROR. The AST assertion
      does fire on it (:773, "the lock guard calls ['Exit']"), so the name is not
      inert as a rule, but the mutant it guards against cannot run on this pytest.
      So "stated reach equals measured reach" is true for `exit` and vacuous for
      `Exit`: the independently-reached *usable* API is one name.

      No change asked for in the predicate — forbidding a name that does not exist
      is free and survives a pytest upgrade that adds it. Recorded because the
      sentence this delta rewrote to be exact is not yet exact.
    suggestion: "Change 'five of the six names below' to 'five of the seven names below', and say that of the two the syntax rule independently reaches, `exit` is the live API and `Exit` is forbidden against a pytest that exports it (this one does not)."
