  - id: F-205
    severity: info
    category: ops
    type: risk
    file: tests/README.md
    line: 311
    title: "The trap's ordering is right and the hazard is now named, but the disarm sits on the happy path only — a Ctrl-C leaves it armed"
    description: |
      Ordering, checked against the failure the trap is for: correct. The lock is
      written first and the trap armed after, so the trap is never armed over a
      path this shell does not own at arm time, and the disarm is in the same
      statement as the documented `rm -f` (`rm -f "$LOCK"; trap - EXIT`) rather
      than a line that can be skipped independently. That is strictly what F-105
      asked for.

      "Cannot delete a lock it does not own": not quite, and the residue is in the
      path the trap exists for. On a Ctrl-C mid-run in an interactive shell — the
      framing of the section, which tells a human to paste these lines — SIGINT
      kills the foreground `pytest`, the shell survives, and the human never
      reaches the disarm. The trap stays armed with the lock still on disk; after
      they clean up by hand and keep the window open, a later window-close runs
      `rm -f "$LOCK"` against whatever is at that path then, which may be a live
      gate's. Pasted as a script rather than interactively, the shell exits on
      SIGINT and the trap fires correctly, so the hazard is interactive-only.

      Not escalated, because the README now states this hazard in its own words
      ("a trap left armed in an open terminal deletes whatever is at that path
      whenever you later close the window, and by then the lock there may be a
      live gate's") and offers the form that closes it. The residue is only that
      the form which closes it is the parenthetical and the form which does not is
      the snippet.
    suggestion: "Promote the parenthetical to the snippet: wrap the three steps in `( ... )` so the trap's lifetime is the subshell's, and keep the top-level `trap`/`trap - EXIT` pair as the note for people who prefer it."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

