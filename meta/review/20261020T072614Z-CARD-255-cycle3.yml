  - id: F-201
    severity: low
    category: ops
    type: risk
    file: tests/test_full_suite_lock.py
    line: 464
    title: "The shape clause bounds the extension; its docstring claims it bounds executability, and the control's own chmod is decorative"
    description: |
      The clause's docstring opens: "The shapes those two directories are exempted
      *for*: prose, never anything a shell can run", and the control's docstring
      ends "an executable under an exempted prefix is still an offender".

      Measured: the predicate cannot see the mode bit. In a throwaway git repo
      outside the real meta/ (/private/tmp/.../scratchpad/symprobe), with
      `git add -Af`:

          100755  meta/review/exec-setter.yml       -> exempt (gets through)
          100755  meta/kanban/cards/exec-setter.md  -> exempt (gets through)
          100755  elsewhere/setter.sh               -> OFFENDER (caught)

      all three listed by `git grep -l NONOGRAM_IGNORE_FULL_SUITE_LOCK`, all three
      fed to the shipped `_override_offenders`. So an executable `.md`/`.yml`
      carrying the export under either prefix is absorbed — the one shape of the
      four the brief named that gets through, and it is the one the introducing
      sentence says cannot.

      The control confirms it from the other side. Mutant M-O — the probe's
      `if written.suffix == ".sh": written.chmod(0o755)` replaced by `pass` —
      SURVIVED, 36 passed. Nothing in the file asserts executability, because
      nothing can. What the probe actually proves is that a **non-`.md`/`.yml`**
      file under an exempted prefix is caught, executable or not; the chmod is
      atmosphere.

      Why this is not the third generation of cycle 1's family, stated explicitly:
      each generation's reachable hole is strictly narrower, and this one is not
      reachable by any mechanism on this board. Nothing executes files out of
      `meta/review/` or `meta/kanban/cards/` — they hold review YAML and card
      prose; `git ls-files -s` over both finds zero 100755 entries today; and the
      plausible shape (a runner, i.e. any non-prose extension) is caught and has
      a uniquely-attributable control (M-L at :587). Cycle 1's F-004 and cycle 2's
      F-101 were each about a file a human or a gate would *run*; this is about a
      file nothing runs. It is R1's remedy clause, not R3's hole.
    suggestion: |
      Either narrow the claim to what is measured — the clause bounds the
      file's *extension*, not whether a shell could run it — or close the axis,
      which is cheap because an exact equality is available: `git ls-files -s`
      over both prefixes is 542 entries, all mode 100644, so the probe can assert
      the exemption also requires a non-executable mode and the census stays an
      equality. Narrowing the sentence is sufficient; R1's own wording is "must be
      narrowed to what is measured or deleted". The two sentences to change are
      tests/test_full_suite_lock.py:464 ("prose, never anything a shell can run")
      and :555 ("an executable under an exempted prefix is still an offender").
    confidence: high
