findings:
  - id: F-001
    severity: high
    category: enabler
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 565
    title: "Shipped comment on _RASTER_DECLARATIONS claims CARD-309 removed an entry; it removed none"
    description: |
      The registry's module comment was rewritten for the state the card then
      REVERTED, and the rewrite survived the revert. It now reads:

        "Two of these are the ADR's own; the rest are CARD-298's findings, ONE
         FEWER SINCE CARD-309."
        "... No count of them is written here on purpose — CARD-309 REMOVED ONE
         ENTRY and a number in this comment would have been the drift CARD-261
         found twice, in a comment nobody re-reads when the mapping shrinks."

      Re-derived at HEAD by importing the module: 7 entries (COVER, DIVIDER,
      TITLE, GUIDE, TOC, ANSWER, PUZZLE) — byte-identical in count to `main`.
      CARD-309 removed nothing. Both sentences are false, and the second is
      false in the act of invoking CARD-261's drift precedent as its reason.

      Failure scenario: CARD-322's implementer opens the registry to find out
      how far R1 has got — which this very comment nominates as "the one honest
      reading" — reads that one entry is already gone, and plans four
      conversions where five remain. The card's re-cut makes "the declarations
      must be honest" the surviving half of AC-1; the declaration DATA is
      honest, this prose is not, and it is the half a reader reaches first.
    suggestion: |
      Restore the comment to a statement true of a registry that did not shrink:
      CARD-309 built the assembly point, re-pointed five entries at CARD-322,
      and removed none. Keep the no-count rule (it is right), drop the
      "one fewer"/"removed one entry" clauses.
    confidence: high
    source: static
    violates: ADR-0042/R2
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: enabler
    type: gap
    file: meta/kanban/cards/CARD-322.md
    line: 157
    title: "The F-307 rename is handed to CARD-322 in CARD-309's prose only, and CARD-322's G-5 forbids it exactly as CARD-309's did"
    description: |
      CARD-309 declines CARD-306's F-307 debt (the class name
      `TestPuzzlePage_DrawsTheDrawingAndTheBandAndNoSheetFurniture`) and records:
      "Raised for CARD-322, which converts the kinds and SHOULD CARRY THE RENAME
      WITH A GUARDRAIL THAT PERMITS IT."

      Measured on this branch:
        * `grep -rn "F-307\|NoSheetFurniture" meta/kanban/` returns CARD-238,
          CARD-306 and CARD-309 — and NOT CARD-322. The debt appears nowhere in
          the receiving card.
        * CARD-322.md:157 reads "**G-5: no test deleted, renamed, skipped or
          merged** — `parametrize` ids included." — the same unqualified
          prohibition, with no exemption for this class.
        * `git diff main..HEAD --name-only` shows CARD-322.md is not touched by
          this card, so no amendment was even attempted.

      Declining the rename WAS right (G-5 is authoritative at the task level and
      may only be weakened at the decompose station — that reasoning is correct
      and is the one part of this finding that is not a defect). But the
      hand-off is a claim about another card's guardrail that is false of that
      card, and the hand-off is not where its reader will look.

      Failure scenario: CARD-322 runs, converts the puzzle page, hits the same
      class, consults its own guardrails, finds G-5 unqualified, declines on
      identical grounds, and routes the debt onward — the loop this card had the
      chance to break. A false name survives two more cards while two card
      records each assert it is someone else's.
    suggestion: |
      Either amend CARD-322 (add the F-307 rename to its "What to implement" and
      qualify its G-5 with the named exemption — a decompose-station edit), or
      card the rename on its own. Correct CARD-309's claim that CARD-322 already
      carries a permitting guardrail.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

