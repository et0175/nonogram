  - id: F-297-07
    severity: minor
    confidence: high
    source: measured
    category: test-quality
    type: gap
    file: src/nonogram/admin/book_vector_draw.py
    line: 470
    title: >-
      Four single-expression deletions in the undeclared +214 hunk change the page
      and nothing reds — draw_folio's outer-corner choice, its right-hand clear
      predicate, and set_right_from_top's right alignment
    description: >-
      Mutants of my own on this card's least-pinned new code, each
      line-count-preserving, each run against 596 cells across 10 test files
      (tests/test_book_solved_answer_key.py, test_book_toc.py,
      test_book_guide_page_vector.py, test_book_puzzle_page_vector.py,
      test_book_pdf_vector_primitives.py, test_book_difficulty_dots.py,
      test_book_grid_rules.py, test_book_interior_type_floor.py,
      test_book_page_numbers.py, test_book_answer_key.py):

      SURVIVED (596 passed each):
      X3  draw_folio: `x = right - advance_px(...) if right_hand else left`
          -> `x = left`. The folio prints at the INNER edge on every right-hand
          page. FR-043 says bottom-OUTER corner.
      X5  draw_folio: the right-hand clear predicate reads content_left instead
          of content_right.
      X7  set_right_from_top: the right alignment dropped — a TOC row's page
          number is set left-aligned AT the measure's far edge, i.e. running off
          into the margin.
      X2  book_toc_vector.clipped_to: [:-2] -> [:-3] (see F-297-03).
      MX3 draw_folio: the LEFT-hand clearance arm replaced by an unconditional
          pass (`clear = True`). Independently found; see below.

      CAUGHT, and credited:
      X4  draw_folio's omit-rather-than-collide rule made dead -> reds
          test_a_page_given_twice_its_rows_prints_no_folio.
      X6  set_right_middle's middle-em dropped -> reds
          test_the_caption_is_right_aligned_on_the_slot_comp_007_reports.
      X8  ascent_px -> 0 -> reds test_a_page_given_twice_its_rows_prints_no_folio.

      The pattern is clean and worth naming: the three new anchors' VERTICAL
      halves are pinned (X6, X8 red) and the HORIZONTAL halves are not (X3, X7
      survive). AC-4 reads every TOC row's number, name and folio as VALUES
      against the page plan, which is what it asks for; no cell reads any of them
      as a POSITION. That is why the card's own item 1 — "each row's page number
      right aligned on the measure's far edge" — has no control.

      MX3 is the same gap by parity rather than by axis, and it is the cleanest
      single statement of this finding. draw_folio's docstring sells the
      omit-rather-than-collide rule and reads content_right / content_left
      symmetrically, but only the RIGHT-hand arm has a control (the round's own
      M5). The left-hand arm can be replaced with an unconditional pass and the
      whole 596-cell set stays green. So of draw_folio's four decisions — omit or
      not, which corner, right-hand clearance, left-hand clearance — exactly ONE
      (omit or not) has a control.
    failure_scenario: >-
      CARD-298 wires the vector writers into _write_pdf. Every right-hand page of
      the table of contents and the answer key prints its folio at the gutter
      instead of the fore-edge, and every TOC page number starts at the measure's
      right edge and runs into the trim margin. 9641 tests pass. The owner finds
      it on the first render.
    mutation: "X3, X5, X7 above; each restored with git show HEAD:<path> > <path> then git checkout -- <path>; both private worktrees left clean."
    remediation: >-
      One cell per anchor, reading the Td operand rather than the string: assert
      the folio's x equals right - advance_px(text, ...) on a right-hand page and
      left on a left-hand one, and assert a TOC row's number ends at frame.right.
      The file already has _pt/_flip for the conversion and _shows() for the
      operands, so this is a short addition, not a new instrument.

  - id: F-297-08
    severity: minor
    confidence: high
    source: measured
    category: documentation
    type: non-reproducing-figure
    file: meta/kanban/cards/CARD-297.md
    line: 0
    title: "Eight figures or enumerations in the round's account do not reproduce"
    description: >-
      Recorded as findings in their own right per this board's rule. Two were
      already known off before this review (the QR caller list and the AC-5 call
      chain); three are new.

      (1) QR enumeration. The round said the QR functions are "reached only from
      _blank_page and _draw_two_up_qr_groups". My ast census over src/: qr_slot
      has 6 call sites — book_pdf_generator._draw_two_up_qr_groups (x2),
      book_proof._fallback_spots, export/layout.qr_caption,
      export/layout.qr_group_insets, export/png.render_image; _draw_qr_placeholder
      has 2 (_draw_two_up_qr_groups, png.render_image); _draw_qr_caption has 2
      (_blank_page, _draw_two_up_qr_groups). The CONCLUSION survives intact — see
      verified_claims.qr.

      (2) AC-5 call chain. The round reported
      difficulty_dots <- _draw_difficulty_dots <- _draw_difficulty_legend <-
      create_guide_page. Measured: difficulty_dots has 1 call site (correct),
      round_mark has 0 in src/ (correct), but _draw_difficulty_dots has ZERO
      references of any kind in src/, and _draw_difficulty_legend's body contains
      no reference to it (its only _draw* calls are _draw_difficulty_legend,
      _draw_folio, _draw_pipeline_diagram, from create_guide_page). The chain is
