findings:
  - id: F-297-01
    severity: important
    confidence: high
    source: measured
    category: test-quality
    type: gap
    file: tests/test_book_solved_answer_key.py
    line: 2581
    title: >-
      AC-3's guard is default-DENY over two of ContentStream's six
      operator-emitting doors; a complete grid walk through
      begin_path/line_to/paint passes it, and the stroker-set pin cannot see
      that shape either
    description: >-
      _STROKERS = ("line", "rectangle") is a HAND-LISTED set of two names, while
      ContentStream (src/nonogram/admin/book_vector.py:716-946) exposes six doors
      that put marks on a page: line, rectangle, curve, and the path-construction
      trio begin_path / line_to / close_path finished by paint(). The guard's own
      docstring claims 'Everything that can put a ruled line on a page is
      collected first'. It is not.

      Measured, not reasoned. I called stroke_violations() on four planted
      sources and it returned [] for three of them: a loop over
      tile.vertical_lines drawn with begin_path/line_to and finished with
      paint('stroke'); the same via curve(); and the same via round_mark(). Only
      the .line/.rectangle spellings are caught. I then confirmed the first shape
      is not theoretical — a real ContentStream fed that exact code emits
      ('0 G', '1 w', '24 228 m', '24 12 l', '48 228 m', '48 12 l', '72 228 m',
      '72 12 l', 'S'): three ruled lines on a page, a complete grid walk, zero
      violations reported.

      _strokers_of() (line 2898) reuses the same _STROKERS tuple, so
      test_the_only_exempt_stroker_is_the_solution_dependent_one's equality on
      {"draw_solved_joins"} is blind to the same shape. Both halves of AC-3's
      structural claim share one hand-listed vocabulary.

      What I could NOT break, and should be credited: the EXEMPTION half is
      sound. "grid" in _parameters() is an exact name match over
      posonly/args/kwonly/vararg/kwarg, so `grid_lines` is correctly DENIED
      (measured). An unused `grid=None` parameter does launder a .line call past
      stroke_violations — but test_the_only_exempt_stroker_is_the_solution_dependent_one
      then reds on the stroker set, so that route is closed. The six controls
      genuinely are shapes the detector was not written from (module level,
      nesting, name binding, two paint spellings, class method) rather than six
      branches: I traced each to the code path it exercises and they collapse
      onto three distinct mechanisms with three independent readings over them.
    failure_scenario: >-
      CARD-233 (queued, gated) gives a solution tile one header. A round
      implementing it writes the tile's rules as a polyline —
      begin_path/line_to over the line sequence, one paint — because that is one
      stroke instead of eleven and is the obvious optimisation. AC-3's guard
      stays green, the stroker-set equality stays green, and the third grid walk
      AC-3 exists to prevent lands with the whole suite passing. The drive half
      (test_the_routine_draws_a_real_answer_tile_that_is_not_a_layout) would not
      notice either: it asserts `expected <= drawn` over the lines emitted, and a
      polyline emits the same m/l pairs.
    mutation: >-
      Not a src mutation — the hole is in the guard, so the demonstration is a
      planted source. Reproduce with:
      python -c "import sys; sys.path[:0]=['.','src']; import tests.test_book_solved_answer_key as T;
      print(T.stroke_violations('def draw(stream, tile):\n    for line in tile.vertical_lines:\n        stream.begin_path(line.position, line.start)\n        stream.line_to(line.position, line.end)\n    stream.paint(\"stroke\")\n'))"
      -> []  (expected: one violation, since `draw` takes no `grid`).
    remediation: >-
      Derive _STROKERS instead of listing it: take ContentStream's public
      methods and subtract the ones that provably emit no path operator (the
      state setters g/G/w, to_points, media_box, text, operators, render). That
      makes the set default-DENY by construction and self-maintaining, which is
      what ADR-0039/R2 asks. Minimum acceptable fix: add curve, begin_path,
      line_to, close_path, paint and round_mark to the tuple, and add a seventh
      control planting the begin_path/line_to/paint shape so the gap cannot
      reopen.

  - id: F-297-02
    severity: important
    confidence: high
    source: measured
    category: test-quality
    type: false-claim
    file: tests/test_book_toc.py
    line: 2779
    title: >-
      M8/M8b's conclusion is right but its declared bound is FALSE — "exactly to
      150" fails at 12 counts inside the very 120-153 production range the
      docstring cites, and the control passes by sample selection
    description: >-
      This board's standing bar is that a declared survivor is legitimate only if
      the docstring states the bound AND the bound is true. The bound is stated
      ("sums per-glyph /Widths and divides once, so n dots measure EXACTLY n times
      one dot — tested to 150") and it is false.

      test_the_measure_is_linear_in_a_repeated_dot asserts exact float equality at
      five sampled counts (1, 2, 3, 17, 150) at size = type_px(TOC_ENTRY_PT, DPI),
      and its docstring reports that as linearity "exactly to 150". Re-measured
      twice independently, at the production DPI (BookPDFGenerator.dpi = DPI =
      300, book_pdf_generator.py:4070, size 42 px, dot 13.356 px):
      advance_px("."*n) != n*advance_px(".") for 56 of n in 1..200, first
      counter-example n = 9, then 13, 15, 18, 19, 25, 26, 29, 30, 35.

      The sharpest part: it fails at TWELVE counts inside the range the docstring
      itself names as the production range ("measured on Book 1: 120 to 153") —
      n = 120, 123, 127, 130, 134, 137, 140, 141, 144, 147, 148, 152. The five
      sampled counts all happen to fall in the ~72% that hold, so the control
      passes by sample selection rather than because the property is true. Other
      DPIs break earlier still: first break n = 3 at 1200 DPI, n = 15 at 600 DPI.

      The stated MECHANISM is self-refuting on its own terms. Summing then
      dividing once computes (318*n)/1000, which is precisely NOT n*(318/1000) in
      binary floating point. "Divides once" is the reason the two differ, not the
      reason they agree. The irony is that the raster measure it contrasts itself
      against IS exactly linear — getlength(".") returns the integer 13.0, so
      n*13.0 is exact for every n tried, including all of 120..153.

      THE CONCLUSION NONETHELESS SURVIVES, and this correction matters enough to
      state plainly. I had a first measurement suggesting the grow loop was
      behaviourally live, from feeding it run = advance_px("."*n) — the exact true
      sums. A wider sweep in the right domain overturns that: across 500,000
      fractional runs spanning 0-2550 px (the widest stocked trim's full usable
      width at DPI 300), the trim loop fires 0 times and the grow loop fires 0
      times, worst relative error 3.4e-16 — orders of magnitude too small to move
      int(run // dot) across an integer boundary. A real run is dot_right -
      dot_left, a difference of two page coordinates, so the n-indexed true sums
      are a synthetic input a page cannot produce. Only well outside any reachable
      page (13,197 px at 600 DPI) does the grow loop fire at all — which confirms
      it is the EXACTNESS argument that fails, not the smallness one.

      So M8/M8b are legitimately DEAD and not legitimately DECLARED: right answer,
      wrong reason, and a control that cannot distinguish the two. The same shape
      as the AC-5 call chain and the QR enumeration — this round's recurring
      pattern is a sound conclusion resting on an argument that does not hold.

      The RASTER half of the same class is sound and is a real finding, properly
      recorded: test_the_raster_measure_is_linear_at_this_size_too is exactly
      linear for every n in 1..600 at every integer size 8..120 px (0
      counterexamples, re-measured in PIL — an independent engine from the /Widths
      sum). So item 11's §6.6 claim — that create_toc_page's own two loops are
      inert too, asserted rather than pruned per G-1 — HOLDS and is credited.
    failure_scenario: >-
      No product risk today; the risk is to the next reader. The declaration tells
      the next reviewer that two surviving mutants are fully accounted for, and
      the account given is false. A later card that changes TOC_ENTRY_PT, the
      interior DPI or the packaged face will re-read "n dots measure exactly n
      times one dot" as a structural property of summing /Widths, conclude the
      loops cannot fire at the new size, and delete them — at which point the
      smallness argument that actually protects them is gone along with the
      record that it was ever the real reason.
    mutation: >-
      M8 and M8b both re-fired (line-count-preserving, each correction loop
      replaced by `if False: pass`, blob asserted == HEAD:<path> first): both
      survive, 65 passed / 192 passed. Confirmed as declared. The CLAIM's edge
      mutated separately and independently twice: exact-equality sweep over
      n in 1..200 at the cell's own size (56 failures, first at n = 9, twelve
      inside 120..153), then the reachable-run sweep (500k runs, 0 firings) that
      rescues the conclusion.
    remediation: >-
      No src change; the code is right and the loops should stay (G-1). Replace
      the false exactness argument with the true smallness one: "the two spellings
      differ by at most 4e-16 relative, orders below one dot's width, so
      int(run // dot) is never off by one for any run a stocked trim can hold".
      Then widen the control from five hand-picked counts to either a sweep with
      that error bound, or — better, because it tests the property that actually
      matters — a sweep over reachable RUN values rather than over dot counts.
      That makes the cell prove the thing the survival rests on.

  - id: F-297-03
    severity: important
    confidence: high
    source: measured
    category: test-quality
    type: gap
    file: src/nonogram/admin/book_answer_vector.py
    line: 357
    title: >-
      AC-2's cross-medium substitution is blind to CLIPPING — the one axis the two
      media are known to measure differently — and the 10x10 trim clips a title
      today; the edge mutant on _clipped_to_measure survives 596 cells
    description: >-
      All four cells that read a title filter by exact membership in the set of
      UNCLIPPED strings: test_every_answer_page_prints_its_pictures_name uses
      `title in page` for the full title; test_the_two_media_omit_the_same_captions
      and test_the_minimum_trim_omits_its_captions_rather_than_shrinking_them use
      `text in wanted` where wanted = {answer_caption(number, title)}; and the EC
      corpus uses `if picked[index] in shown`. A clipped caption is in none of
      those sets, so it lands in the "omitted" bucket on BOTH sides and the
      cross-medium equality passes.

      That matters because clipping is live today. Measured, min-trim profile
      (10x10 cm, _kdp_min_book), the strings the vector answer pages actually set:
      the packed page prints 'Puzzle 1 — Snowflake' in full and
      'Puzzle 2 — Owl in a …' CLIPPED; the two full answer pages print no caption
      and no folio at all. On Book 1 all four print in full. So of four solution
      slots on the minimum trim, two carry no name, one carries a truncated name,
      and one is intact.

      And it is the one axis a port is most likely to break. This card's own
      book_toc_vector header admits it: the raster page measures with
      FreeTypeFont.getlength and this one with the embedded face's /Widths, and
      "the two agree to within a fraction of a dot's advance". A clip boundary is
      exactly where a fraction of an advance decides an outcome — and that is the
      comparison the substitution cannot make.

      Mutation, line-count-preserving, in src/nonogram/admin/book_answer_vector.py's
      _clipped_to_measure: clipped[:-2] -> clipped[:-3] (the vector caption clips
      one character more than the raster path). 596 passed across 10 test files.
      The same edge on book_toc_vector.clipped_to: 596 passed. Removing clipping
      ENTIRELY from the ANSWER writer is caught (2 cells red, both min-trim), so
      that mechanism is covered at present/absent but not at its edge — which is
      the two-mutant rule this board applies to any comment claiming what a test
      catches.

      The TOC writer's byte-identical copy is weaker still: deleting
      book_toc_vector.clipped_to's ellipsis loop ENTIRELY also survives. That is
      an undeclared survivor on a path the module docstring itself calls inert
      ("It cannot fire for any row the structural list builds on any trim CON-018
      stocks ... a future section's name is not this card's to bound") — a stated
      bound with no cell proving it, the same family as F-297-02. The asymmetry is
      itself informative and defensible: the answer writer's copy is live and
      covered, the TOC's is dead and unguarded, which is exactly why the round's
      decision not to share the routine between the two writers was right. But the
      TOC copy needs the one-line bound its docstring promises, or a declaration.
    failure_scenario: >-
      CARD-233 or CARD-298 changes the caption's measure, its size, or the face.
      The vector answer page's clip lands one character from the raster page's, so
      the printed book's answer key reads 'Puzzle 2 — Owl in …' where the
      raster-mode build reads 'Puzzle 2 — Owl in a …'. Every cell in this card
      stays green, because both media's clipped strings are absent from the
      unclipped set and the sets still agree. The owner finds it by eye on a
      render, which is the loop this card's cross-medium cells exist to replace.
    mutation: "see description — both edges fired, both survive 596 cells; the whole-mechanism mutant reds 2 cells."
    remediation: >-
      Assert the caption STRING, not its membership in the unclipped set: collect
      the caption each medium actually set per slot and assert the two lists are
      equal element for element. That single change makes both edge mutants red,
      turns the blind 'omitted' bucket into three distinguishable outcomes
      (printed / clipped-to-X / omitted), and records the clipping that the
      minimum trim does today — which is a product fact no cell currently states.

  - id: F-297-04
    severity: important
    confidence: high
    source: measured
    category: test-quality
    type: gap
    file: tests/test_book_solved_answer_key.py
    line: 2339
    title: >-
      The operator allow-list advertised as default-DENY admits c, h and B —
      exactly round_mark's vocabulary, which nothing on these pages emits — so the
      cell cannot be the round-shape tripwire its sibling needs, and that sibling
      uses the reading CARD-296's F-1 already measured as insufficient
    description: >-
      test_the_operator_alphabet_is_closed_at_what_these_pages_draw documents
      itself as "Default-DENY over the operators, not a search for Do", then
      allows 16 operators. Measured: the TOC and answer streams of both profiles
      emit 13 — BT ET G S Td Tf Tj f g l m re w. The three surplus members are
      B, c and h, which are precisely the moveto/four-curves/close/paint shape
      CARD-296 pinned as a round mark
      (test_a_round_mark_is_one_moveto_four_curves_a_close_and_a_paint).

      So the subset test has slack exactly where the card's own limit cell needs
      it tight, and the two cells in this file disagree about whether `c` is
      allowed: test_no_answer_page_draws_a_round_mark_today asserts
      `" c\n" not in text` while its sibling permits c unconditionally.

      Worse, that limit cell's reading is one this board already measured as
      insufficient — one card ago. CARD-296's F-1 is titled "'no c is exactly no
      round shape' was false": a round shape can be approximated by a polyline
      (m/l only, both already allowed) or set as a round dingbat glyph, and
      CARD-296's fix round 1 had to close the route with a vertex bound before
      review cycle 2 accepted it. CARD-297 reaches for the superseded reading plus
      a textual `"round_mark" not in source` check, which a polyline approximation
      also passes.
    failure_scenario: >-
      CARD-233 wires the difficulty dots onto a solution tile header and, as
      CARD-296's own card predicted ("if it uses round_mark ... and nothing in the
      tree if it approximates one"), approximates the disc with a short polyline.
      test_no_answer_page_draws_a_round_mark_today stays green (no c, no literal
      'round_mark'), the alphabet cell stays green (m and l are allowed), AC-5's
      stated limit silently stops being true, and CARD-233 never gets the signal
      this cell was written to give it.
    mutation: >-
      Demonstrated by measurement rather than mutation, which is stronger here:
      the emitted set is {BT,ET,G,S,Td,Tf,Tj,f,g,l,m,re,w} and allowed \ emitted =
      {B, c, h}. A subset assertion with three never-emitted members cannot fail
      on any of the three.
    remediation: >-
