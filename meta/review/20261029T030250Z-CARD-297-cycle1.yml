  - id: F-297-05
    severity: important
    confidence: high
    source: measured
    category: traceability
    type: dead-ref
    file: meta/kanban/cards/CARD-297.md
    line: 91
    title: >-
      The EC's test: ref names a class that does not exist, and the only thing
      making the project's symbol resolver accept it is a docstring sentence this
      round wrote
    description: >-
      The card's EC(ADR-0042/R3) names the Test-less spelling of the property
      class. pyproject.toml sets no python_classes, so pytest's default `Test`
      prefix applies and a class under that name would hold tests pytest silently
      never collects. The round renamed it with the prefix, stated the reason in
      the class docstring, and the reasoning is correct — the shipped class
      collects (6 passed by node id) and the rename is the right call.

      The problem is what makes the old name still resolve. The validator's ref
      check (validators/utils.symbol_exists) is `git grep -lw`, a TEXT search.
      `git grep -lw` on the card's spelling exits 0 and lists two files: the card
      itself, and tests/test_book_solved_answer_key.py — where the ONLY match is
      line 3281, a prose sentence inside the class docstring reading "The card
      names this property <the Test-less spelling>". The word boundary means the
      real class name does not match. So a name with no definition reads as alive,
      and the single thing keeping it alive is a sentence written in the same round
      that renamed it. The ref is not under meta/architecture/, so the validator
      does not read it today — but meta/review/ IS in scope, and a future review
      YAML quoting the name would revive it there.
    failure_scenario: >-
      A later card's AC/EC gate resolves the card's EC ref, finds it 'exists',
      and reports the property as mechanically checked. Or the docstring sentence
      is tidied in a routine edit and the ref goes dead with no warning, because
      nothing connects the two.
    remediation: >-
      Correct the card's EC test: to the shipped class name (the prefixed
      spelling). Then reword line 3281 so it is not a resolver — e.g. "the card
      names this property with the prefix dropped; it is spelled with the prefix
      here so pytest collects it" — stating the rule without restating the dead
      token. Note that this review YAML deliberately does not write the token
      either, for the same reason.

