verified_claims:
  zero_conversion_and_the_70_bitmaps:
    round_claim: "Converts ZERO pixel-reading sites; net +70 page bitmaps, +183 ImageDraw, +298 Mpx; 68 to the two _Recorded walks, 2 to AC-1's positive control; test_book_toc.py 0 -> 0 on 11 new cells."
    verdict: CORRECT SEQUENCING, NOT A DIFFERENT CARD
    reasoning: >-
      Judged, not recited. Three things decide it.

      First, the figures are honest and the attribution is exact — reproduced in
      an independent instrument (see metrics.bitmap_census), including the per-class
      68/68/68/70 pattern that proves the walk is paid once, and the TOC file's
      delta of exactly 0 across +11 cells (1414 page bitmaps on both sides).

      Second, the cost is small where it matters. +70 is +6.2% on a file that
      already held 1133, and the real price is +1.39 s wall on that file (4.40 ->
      5.79 s); all 60 new cells together run in 0.81 s. A card that spent 298 Mpx
      to buy AC-2's only available reading has not blown a budget.

      Third, and decisively: there is no cheaper door for the AC as written. AC-2's
      second half must be read "over the whole interior, not over the answer
      section", and the interior is still mostly raster. A raster page's text is
      pixels, so the only ways to know what one printed are to render and OCR it,
      or to spy on ImageDraw.text during a render. Both require the render. The
      round took the cheaper of the two and cached it module-scoped at one walk per
      profile.

      So the zero conversions are right for the reason the round gives:
      _write_pdf still chooses medium per BOOK, not per page, until CARD-298, so
      the raster answer pages are what ships, and converting their assertions
      would trade a control on what ships for a control on what does not. I
      verified the premise — book_pdf_generator.py is byte-identical to main on
      both sides (blob 7a515eea), so no page changed medium.

      One deduction, and it lands on the card: G-5 says "Convert the answer/TOC
      ones". Every pixel-reading site in the file is pre-existing and every one of
      them IS an answer-page site (all 20 numpy reads sit below line 2000, in the
      CARD-197/198/202 classes). So G-5 asks for a conversion that CARD-298 must
      precede. That is a card defect of the same family as F-297-06, not a round
      failure — but it should be recorded on the card so the next round does not
      re-litigate it.
  ac5_redefinition:
    round_claim: "AC-5's premise is false in two parts; met 'in the only form today's design admits' — the real narrowest packed-tile band, COMP-007's ladder, drawn through round_mark, read by poppler, with a failing control and a cross-medium cell, wired onto no page, plus a test-shaped limit."
    verdict: THE MECHANISM IS ACCEPTED; THE BOOKKEEPING IS REJECTED
    reasoning: >-
      The premise is false, and more deeply than the round argued. Not only does
      the header print a word (band_identity -> "Puzzle 12 · Hard"): no page in
      the book prints difficulty dots at all. Measured, ast census over src/:
      _draw_difficulty_dots has ZERO references of any kind, difficulty_dots has
      exactly one call site (from inside _draw_difficulty_dots), round_mark has
      zero. The whole glyph is unreachable from production. AC-5's subject does
      not exist.

      I checked CARD-228's and CARD-296's own text rather than the round's
      quotation of them, and both quotations hold. CARD-228's AC-5 is "the
      smallest box any caller gives it" and CARD-228 explicitly defers "what each
      caller actually puts there" to CARD-207/229/231/233; its three review cycles
      each verified the zero-caller state as intended ("0 callers in src/ by
      design, G-5"). CARD-296's card declines its own round-shape AC as
      unsatisfiable, and its implementation pre-gate confirms both halves.

      So is this card's AC-5 satisfied or redefined? Redefined — but LOUDLY, which
      is the distinction that matters here. The class docstring states "Nothing is
      wired into a page", names CARD-233 as the owner of the design, and
      test_no_answer_page_draws_a_round_mark_today states the limit as a test
      rather than as prose. The claim is therefore exactly as wide as its control,
      which is the opposite of the claim-wider-than-its-control family. And the
      construction buys something real that a bare decline would not:
      test_the_vector_ladder_is_the_geometry_the_raster_ladder_draws asserts
      raster.dots == vector.dots and raster.diameter == vector.diameter, so
      whoever wires CARD-233 inherits a pinned cross-medium geometry instead of
      two independent derivations.

      What I reject is the bookkeeping, on two counts. (a) Two cards now face the
      identical situation and resolve it two different ways — CARD-296 declined its
      AC and named the inheritor; CARD-297 kept its AC and satisfied it against a
      synthetic box. The board should not carry both precedents. (b) The limit cell
      reaches for a reading CARD-296's F-1 already measured as insufficient — see
      F-297-04. Fix F-297-04 and amend AC-5 per F-297-06, and the mechanism stands
      as shipped.
  ac2_cross_medium_substitution:
    round_claim: "AC-2's first half cannot hold on every profile, so it is asserted as cross-medium agreement plus two non-vacuity controls; the EC corpus asserts 18 print / 6 omit with both floors inside the test."
    verdict: THE SUBSTITUTION IS NECESSARY, BUT IT IS BLIND ON THE AXIS THAT MATTERS
    reasoning: >-
      The literal was unsatisfiable, not merely inconvenient, and the card itself
      proves it: AC-2 says "each solution tile's header carries the picture's name"
      while AC-6's own note in the same card records that the caption is omitted on
      the 10x10 cm minimum trim. Measured, min-trim: 2 of 4 solution slots carry no
      name. So AC-2's "each" cannot be met, and the AC needs amending (F-297-06)
      rather than the round needing to meet it.

      Given that, cross-medium agreement is the right shape, and the non-vacuity
      controls are better than the round claimed for them. `assert vector` fires on
      BOTH profiles, and on Book 1 the set is pinned to all four titles, so the
      agreement is never between two empty sets. The EC corpus's two floors
      (printed >= 18, omitted >= 6) are in effect an EQUALITY, because the corpus
      has exactly 24 answer pages — 18 + 6 with both floors leaves no slack. That
      is a well-built corpus and I credit it.

      But the substitution is blind precisely where the port is most likely to
      break. Every title reading in the card filters by exact membership in the set
      of UNCLIPPED strings, so a clipped caption falls into the 'omitted' bucket on
      both sides and the equality survives. Clipping is live today ('Puzzle 2 — Owl
      in a …' on the minimum trim), and the two media measure width with different
      engines — which this card's own TOC header admits agree only "to within a
      fraction of a dot's advance". Demonstrated: the vector clip can land one
      character from the raster clip and 596 cells pass. See F-297-03; the fix is
      to compare the caption strings element for element rather than their presence
      in a set of unclipped ones.
  downstream_module_restructure:
    round_claim: "Implemented the three page writers as BookPDFGenerator methods first; that added four self.page_spec(...) calls and red two measured figures in tests/test_book_export_interior_cover.py (inside 17 -> 21, CALLEE_EXEMPTION_COST 776 -> 808), a file G-5 forbids touching; so both writers moved downstream, adding no geometry-door call."
    verdict: THE SHAPE IS RIGHT, AND IT WAS FORCED RATHER THAN CHOSEN
    reasoning: >-
      Re-derived both figures without touching that file's content.

      As they stand: both cells pass on HEAD and on base, and an independent ast
      walk (counting ast.Call nodes whose callee names page_spec/book_page_spec)
      gives inside=17, outside=6 on BOTH sides — the asserted values. So the round
      really did not move them.

      Counterfactual: three BookPDFGenerator methods carrying exactly four
      self.page_spec(...) calls planted into book_pdf_generator.py, test file
      untouched. inside 17 -> 21 exactly, and the cell reds with assert 21 == 17.
      The round's primary figure reproduces to the digit. The companion figure
      moves and reds but lands on 782 under my plant, not 808 — recorded in
      F-297-08 as direction-confirmed, number-unverifiable, since the rejected code
      was never committed.

      One consequence the round did not report, which strengthens its case: the
      plant also moves that walk's LAST step from 0 to 3, breaking the shipped
      arm's zero-refusal property outright.

      So this is not page-kind logic hidden in the wrong layer to dodge a test. It
      is a module boundary the project's own door-axis invariant selects: the walk
      exists to keep a page POSITION from being computed in a second place, and a
      generator method computes one while a function taking the sheet does not.
      The chosen shape is also the majority precedent — CARD-296's guide_pages has
      exactly this signature, down to spec_for arriving as a callable.

      Worth flagging forward, not against this card: CARD-295's vector_puzzle_pages
      IS a generator method, so after this card the tree holds two shapes for one
      concern (1 method, 3 module functions). CARD-298 should reconcile them.
  scope_growth:
    round_claim: "Three undeclared paths — two new src/ modules and book_vector_draw.py +214 — citing CARD-295's precedent for creating modules under an unchanged Touches, and no import added."
    verdict: ACCEPTED — THE GROWTH IS SMALLER AND BETTER-BEHAVED THAN ITS OWN CITED PRECEDENT
    reasoning: >-
      Measured against Touches. Of six declared paths, 2 were touched
      (test_book_solved_answer_key.py, test_book_toc.py) and 4 were not — and the
      four untouched are byte-identical to base, verified by blob:
      book_pdf_generator.py 7a515eea, test_book_answer_key.py b7797dbf,
      test_book_qr_slot.py 7af0034c, test_layout_answer_tiles.py b684413e. Three
      undeclared paths added. Scope gate is on, so that is a real finding on paper.

      It does not survive contact with the precedent the round cites. CARD-295
      declared 4 paths and shipped 11, created book_puzzle_vector.py AND
      book_vector_draw.py as new modules under an unchanged Touches, added +117 to
      book_pdf_generator.py, and reached 50 lines into
      tests/test_book_export_interior_cover.py — the very file CARD-297's G-5 now
      forbids. Against that, CARD-297 ships 5 files, 3 undeclared, 0 deletions, not
      one existing line modified anywhere in the tree, and stays out of the
      forbidden file entirely. It is strictly more disciplined than the card it
      cites.

      The one undeclared path that deserves a second look is the +214 in
      book_vector_draw.py, because it is a declared hotspot's neighbour and
      because it is where my own surviving mutants landed (F-297-07). Not a scope
      objection — a coverage one.

      The no-import claim holds: 0 added import lines in that hunk (measured over
      the diff), so test_the_routine_imports_nothing_that_knows_a_page_kind's
      exact-set assertion at tests/test_book_puzzle_page_vector.py:1473 is
      undisturbed, and that file passes in the impact set.
  dead_code_settlement:
    question: "Is _draw_difficulty_dots genuinely unreachable, or reached by a path an ast call-census cannot see?"
    verdict: GENUINELY DEAD IN src/, AND NOT THIS CARD'S FINDING
    reasoning: >-
      Settled three ways. (1) ast census over all of src/: zero references of any
      kind — not a call, not a bare Name, not an attribute. (2) Its only two
      mentions in src/ are its own `def` at book_pdf_generator.py:1739 and a
      docstring cross-reference at book_guide_vector.py:901. (3) The one path a
      call-census could miss is dynamic dispatch, and I checked it: nothing in
      src/ does getattr on the generator module by a computed name for this
      symbol, and the only getattr-style rebinding of it anywhere is in
      tests/test_book_difficulty_dots.py (a spy that restores the original and
      asserts the restoration at :4218 and :4481). So it is unreachable from
      production.

      It is NOT a finding against CARD-297, and calling it one would be wrong.
      The zero-caller state is deliberate, pre-existing, and recorded three times:
      CARD-228's review cycles 1, 2 and 3 each verified it as the card's intent
      ("0 callers in src/ by design, G-5"), CARD-241's G-4 freezes the glyph and
