      (3) "On the 10x10 cm trim the title prints nowhere in the interior." Does
      not reproduce. Measured on the min-trim profile: 1 of 4 titles prints in
      full ('Snowflake'), 1 prints clipped ('Owl in a …'), 2 are omitted. The
      COMMITTED test is correct and scoped honestly — its docstring says "Asserted
      on the full answer pages ... A packed page's tiles are shorter than the page
      and may still have room" — so this is a narrative overstatement of a correct
      cell, not a bad cell.

      (4) "The two media's omission thresholds (72.9 px vector vs 73 px raster)
      agree for every integer slack." NO SUCH ASSERTION IS IN THE DIFF. grep over
      the whole diff for 72.9, 'threshold' and 'every integer slack' returns
      nothing; grep for 'slack' returns seven hits, all prose. The claim has no
      committed control.

      (5) "CALLEE_EXEMPTION_COST's first step 776 became 808." Direction confirmed,
      number not reproducible. I planted three BookPDFGenerator methods carrying
      exactly four self.page_spec(...) calls (the test file itself never edited)
      and the cell red, but the first step moved 776 -> 782, not 808: that step
      counts refusals over ALL ast.Call nodes in the generator (838 on both sides)
      and my plant added 10. 808 implies the rejected code added ~32 countable
      calls, which is plausible but was never committed and so cannot be checked.
      The companion figure DOES reproduce exactly: inside 17 -> 21.

      (6) "13 mutants, ALL DELETION." Inaccurate. 11 of 13 are disablements
      (`False and ...`); M10 is a SUBSTITUTION ("grid" -> "grid_never") and M11 is
      an ADDITION (name=None -> name=payload.name) in
      src/nonogram/admin/book_pdf_generator.py — a file the diff does not touch at
      all. M11 is good practice as a raster-side control and the harness restored
      the file correctly; it is simply not a deletion, and the deletion-only claim
