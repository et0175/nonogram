      count and that each `old` string occurs exactly once at HEAD.)

      (7) "225 asserts instrumented in the answer-key file, 163 in the TOC file."
      These are the PRE-FIX (1a42e8d7) figures. At HEAD they are 233 and 169 — the
      fix commit added asserts. Reproduces as a pre-fix figure, not as the HEAD
