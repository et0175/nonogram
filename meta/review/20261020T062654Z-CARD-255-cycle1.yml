      live gate stale — out of this card's reach, and the gate's own
      "no other pytest alive" check still stands in front of it.
    suggestion: "Clamp the display: `age = 'in the future (clock skew?)' if age_seconds < 0 else f'{age_seconds:.0f}s'`."
