  - id: F-009
    severity: info
    category: ops
    type: question
    file: tests/full_suite_lock.py
    line: 97
    title: "A lock naming a removed worktree wedges every other tree for up to 6h"
    description: |
      Holder identity being a path, a lock left by a worktree that no longer
      exists matches nothing (`_same_tree` on a nonexistent path returns False,
      probed) and so refuses every run on the host until STALE_SECONDS elapses.
      That is the designed trade — the alternative, a pid rule, is
      unimplementable here for the reason the card gives — and the refusal
      names the override on the line below. Recorded as the operational cost of
      the chosen rule, not as a defect: the board's merge discipline removes a
      card's worktree AT merge, which is also when its gate has finished and
      deleted the lock.
    suggestion: "No change asked for. If it bites, `rm` is the documented answer and the refusal prints the path."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: dismissed
    fixed_in: null
    dismissed_reason: >-
      Recorded, not fixed, on purpose: a filesystem-existence check would hand a live gate's window away whenever its path is briefly unreadable, which is the defect this card removes. The override is the documented escape, named on the line below every refusal, and merge discipline removes a worktree at merge — which is also when its gate has deleted its lock. Recorded in the card's cycle-1 notes.
    learned_pattern: null

