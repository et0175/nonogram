findings:
  - id: F-001
    severity: high
    category: ops
    type: bug
    file: tests/full_suite_lock.py
    line: 272
    title: "A relative `worktree:` value makes a foreign lock a silent pass"
    description: |
      `_same_tree` (tests/full_suite_lock.py:186-194) resolves both sides with
      `os.path.realpath`, which resolves a RELATIVE path against the *reading*
      process's cwd. Gates run pytest from the worktree root, so a foreign
      holder's lock reading `worktree: .` resolves, inside every other
      worktree, to that worktree — and `verdict()` returns `(True, None)`:
      the run proceeds and prints nothing at all.

      Probed live in this worktree, not reasoned about:
        lock = holder: FOREIGN gate CARD-254 / at: <now> / worktree: . / commit: deadbee
        NONOGRAM_FULL_SUITE_LOCK=<lock> pytest <one test>  ->  exit 0, "1 passed",
        no "full-suite lock" line anywhere in the output.
      The pure function agrees: verdict(..., worktree=str(this_worktree())) ->
      (True, None).

      This is the one direction the card cannot afford. The module's own
      docstring (lines 22-25) adopts ADR-0039/R2 — "a shape the guard cannot
      analyse is a refusal, never a silent pass" — and implements it for the
      analogous unanalysable shape, a lock that names NO worktree
      (lines 291-298, with its own test at tests/test_full_suite_lock.py:165).
      A value that cannot be resolved to a tree is the same shape, and it gets
      the opposite verdict.

      Reachability is not hypothetical. All three gate scripts write
      `worktree: $WT` absolutely (verified by reading gate.sh, gate-247.sh,
      gate-251.sh in the orchestrator's scratchpad), so no producer triggers it
      today — but tests/README.md:302-310, changed by this very card, now
      instructs a human to hand-write the lock, and a human writing
      `worktree: .` gets a lock that disables the guard everywhere and says so
      nowhere. That is CARD-225's defect restored with the control in place.
    suggestion: |
      Treat a non-absolute `worktree:` the way a missing one is already
      treated. In `verdict()`:

          held_by = fields.get("worktree")
          resolvable = bool(held_by) and os.path.isabs(os.path.expanduser(held_by.strip()))
          if resolvable and _same_tree(held_by, worktree):
              return True, None

      and extend the `unnamed` explanation to cover "names a path I cannot
      resolve to a tree". Control: the same shape as
      test_a_lock_that_names_no_worktree_is_refused_rather_than_assumed_ours,
      with `worktree: .` and with a relative sibling path, asserting
      `allowed is False`.
    confidence: high
    source: static
    violates: ADR-0039/R2
    root_cause: RC-1
    status: fixed
    fixed_in: 346671ed
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: high
    category: ops
    type: gap
    file: tests/test_full_suite_lock.py
    line: 274
    title: "The override-scan test claims the tree but scans three paths, missing the in-tree pytest runner"
    description: |
      `test_nothing_in_the_tree_sets_the_override_for_a_run` is AC-4's premise
      — "an override the producers set is not an override". Its docstring says
      "what is checkable here is the tree: nothing **in it** may set the
      variable for a run". What it actually runs is

          git grep -l NONOGRAM_IGNORE_FULL_SUITE_LOCK -- tests src pyproject.toml

      a hand-written three-path set. `scripts/run_admin_tests.sh` is an
      in-tree pytest runner that already `export`s DATABASE_URL and
      TEST_DATABASE_URL for the suite (verified by reading it), and it is a
      co-change peer of tests/conftest.py (2 of the last 16 conftest commits
      touched it). Adding `export NONOGRAM_IGNORE_FULL_SUITE_LOCK=1` there
      would switch this guard off for every run through that script and leave
      this test green. The same hole covers scripts/README.md (which documents
      the runner), start.sh, Dockerfile, docker-compose.yml, .env.example,
      Procfile, railway.json and render.yaml — none is scanned.

      Measured: `git grep -l` over the WHOLE tree returns
      meta/kanban/cards/CARD-255.md, tests/README.md, tests/full_suite_lock.py;
      over the scanned set it returns two of those. So the pathspec is
      currently load-bearing for nothing and costs the claim its reach.
      (Secondary, same mechanism: `git grep` searches tracked files only, so an
      untracked runner is invisible either way — worth a sentence in the
      docstring.)

      This is ADR-0039/R1's exact target ("a claim whose control cannot fail is
      narrative, not coverage, and must be narrowed to what is measured or
      deleted") and ADR-0039/R2's ("a guard's set is derived from an authority
      the runtime can enumerate, not hand-written"), both curated INTO this
      card's system contract.
    suggestion: |
      Drop the pathspec so the scan is the tree the claim names:

          ["git", "grep", "-l", guard.OVERRIDE]

      The allowlist already pins the three files legitimately allowed to name
      it, so widening the scan costs nothing and makes the claim equal its
      measurement. Add `meta/kanban/cards` to the allowlist (card prose names
      the variable) or restrict the scan to `tests src scripts pyproject.toml
      Dockerfile start.sh docker-compose.yml .env.example` and say in the
      docstring that gate scripts outside the repo are outside the claim.
    confidence: high
    source: history
    violates: ADR-0039/R1
    root_cause: RC-2
    status: fixed
    fixed_in: 346671ed
    dismissed_reason: null
    learned_pattern: null

