  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_ink_mode.py
    line: 291
    title: "G-2's pre-encode test re-derives the conversion with the same function it is testing"
    description: |
      `test_no_mark_moves_on_any_page_bitmap` computes `grey = np.asarray(page.convert("L"))`
      itself and compares it to `rgb[:, :, 0]`. It therefore verifies a property of Pillow's
      `Image.convert("L")`, not a property of `_write_page`'s conversion — even though its
      docstring says "The conversion is the writer's own".

      Demonstrated by mutation M5a: injecting a softening into `_write_page`
      (`page = page.convert(mode).point(lambda v: 1 if v == 0 else v)`) leaves this test GREEN.
      The mutant was killed, but by two other tests —
      `test_the_two_files_hold_the_same_marks_page_for_page` and EC-1's
      `test_the_two_modes_agree_on_every_page_of_every_book` — both of which read the levels
      back off the two written files.

      CLAUDE.md states the convention this crosses: "Prefer an independent second
      implementation over re-deriving a value with the same function you're testing."
      G-2 is genuinely enforced; it is enforced one layer out from where this test claims.
    suggestion: |
      Either reword the docstring so it does not claim to be testing the writer (it tests that
      the page has no colour to lose and that ITU-R 601-2 is the identity on such a page —
      both worth testing), or have it pull the converted page out of the writer, e.g. by
      capturing the image handed to `pdf.write_obj` via a one-call spy, so the assertion
      binds to `_write_page`'s own conversion.
    confidence: high
    source: static
