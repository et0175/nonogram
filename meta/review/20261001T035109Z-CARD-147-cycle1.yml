    title: "The baseline's headline claim conflates two things the digests cannot both show"
    description: |
      `changed_pages_note` (and the Worktree notes) say "the unmoved pages are the evidence
      that the colour space moved and the ink did not". Only the second half follows. Because
      `tests/helpers/pdf_pages.py` ends with `convert("RGB")`, the digests are computed on
      (v, v, v) whatever the file declares, so they are blind to the colour space **in
      principle** — an unmoved digest is evidence about the ink and about nothing else. The
      colour space is established elsewhere, correctly: by `interior_bytes` (−15.17%) and by
      `tests/test_book_pdf_ink_mode.py::pdf_image_objects`, an independent non-normalising
      reader.

      The fixture already states this correctly two keys later, in `interior_colorspace_note`
      ("A reader checking the colour space must read it off the PDF's image XObjects … because
      the shared helper normalises exactly this away"), so this is a loose sentence in a
      document that elsewhere disambiguates itself, not a false claim about the code.
    suggestion: 'Reword to "the unmoved pages are the evidence that the ink did not move; interior_bytes and interior_colorspace are the evidence that the colour space did."'
