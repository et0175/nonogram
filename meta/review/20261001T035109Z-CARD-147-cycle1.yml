  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 2515
    title: "_write_page keeps a mode=\"RGB\" default, contradicting the card's own design rationale one layer down"
    description: |
      `_write_pdf(..., *, mode: str)` is correctly a required keyword — the stated reason being
      that the two files of one export disagree about it and "a default would hide that at the
      one place it matters". `_write_page(..., mode: str = "RGB")` then reinstates exactly such
      a default on the method that actually performs the conversion. Its only caller is
      `_write_pdf`, which always names the mode, so the default is currently dead; but a future
      second caller that omits it would silently write DeviceRGB pages into a black-and-white
      book's interior, which is precisely the failure the required keyword exists to prevent.
    suggestion: 'Make `mode` positional-required (or keyword-only without a default) on `_write_page` too; the single call site at :2492 already passes it.'
