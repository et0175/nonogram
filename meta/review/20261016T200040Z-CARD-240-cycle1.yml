findings:
  - id: F-001
    severity: low
    category: clarity
    type: nit
    file: meta/architecture/requirements.yml
    line: 4120
    title: "'exactly one closed run of the line' has a second, wrong reading the code does not do"
    description: |
      The committed clause is accurate on its plain reading (exactly one closed run
      HAS that length), which is the reading the code implements. But the scope of
      "exactly one" can also attach to the line's run count — "the line has exactly
      one closed run, and the number is its length" — which is strictly narrower than
      rule C and is contradicted by AC-347's own named test: TestSolverClues_RuleExamples
      .STOPS carries ((1, 2), "DDWDW.....") → [True, True], a line with TWO closed runs
      (lengths 2 and 1) where rule C circles both numbers because each length occurs
      once among the closed runs. A reader who takes the narrow reading would think
      that row is a test bug — which is the exact failure mode this card exists to
      remove, one register quieter. The code's own comment (solver_state.js:382-386)
      avoids the ambiguity by phrasing it as "the line holds exactly one closed run of
      that length".

      On the caller's question — whether clarity was traded for the validator
      heuristic — my judgement is NO, or very nearly so: the rejected wording
      ("unique in its clue and whose length is held by exactly one closed run")
      carries the same attachment ambiguity, so the rework cost little or no clarity.
      The residual ambiguity predates both drafts and is also present in CARD-213's
      originating F-002 suggestion ("matched by exactly one closed run"). It is worth
      recording only because a strictly clearer wording exists at zero validator cost.
    suggestion: |
      Optional, and a card note is an acceptable alternative to an edit. If edited:
      "…or a number whose value is unique in its clue, where exactly one closed run of
      the line has that length". Verified here — this wording leaves validate.py's
      output BYTE-IDENTICAL to the committed tree's (0 errors / 86 warnings, `diff`
      empty), so it adds no "and", trips no heuristic and needs no AC split (G-1 safe).
