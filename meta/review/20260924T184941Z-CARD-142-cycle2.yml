fix_verification:
  - finding: F-001
    claim: "FIXED — _applier_source slices applyActionCounts by brace depth; the sentence half pinned inside it; M5 flips SURVIVED -> KILLED"
    verdict: CONFIRMED
    evidence: |
      Re-ran M5 myself from a byte-exact snapshot: deleting the five lines that build
      the sentence, substitute {n} and reassign form.onsubmit now FAILS
      test_rejecting_one_puzzle_enables_delete_rejected_naming_one ("the singular
      sentence must be read"). Three further mutants confirm the pin is not a single
      lucky string: M14 (drop only the {n} substitution) and M15 (always read the
      plural attribute) are both killed too.

      The brace-depth slicer was probed directly for the hole the task named. It
      CANNOT slice nothing: the loop starts at the function's opening brace, which
      raises depth to 1 before the `depth == 0` test can ever fire, so the shortest
      possible slice is the whole `function applyActionCounts(...) { ... }`. On the
      real script it returns 725 characters and `"fetch(" in slice` is False — it
      really is the function's own body and not the surrounding handler, so the
      assertions inside it are not satisfiable by code elsewhere in the page.
      Two degenerate probes: a `}` inside a `//` comment truncates the slice to 70
      chars and the assertions FAIL LOUDLY (fails closed — safe); an unbalanced `{`
      inside a string literal over-extends the slice to 4875 chars and would let the
      assertions be satisfied by code outside the function (fails open — but requires
      someone to write an unbalanced brace in a string inside this one function).
      Neither is the vacuous-empty-slice hole that was asked about.
  - finding: F-002
    claim: "FIXED — verbatim match replaced by _DISABLED_BELOW_ONE; verified both directions"
    verdict: CONFIRMED (with a residual, N-1)
    evidence: |
      Both directions re-derived, not accepted: M6 (`!== 0`) KILLED, M9a
      (`button.disabled = ( count===0 ) ;`) PASSES. The regex is anchored to `.disabled`
      and to `=== 0`, so `=== 1`, `= false`, and the assignment disappearing are all
      caught. The weakness the task asked about is real but narrow: `\\w+` matches any
      identifier, so M9b (`button.disabled = index === 0;`) passes. That is a
      semantically wrong operand slipping through — filed as N-1 (Minor), not as a
      regression of F-002, because the assertion is strictly stronger than the verbatim
      string it replaced (which would have rejected M9a and accepted nothing better).
  - finding: F-003
    claim: "FIXED by surfacing — non-2xx reads the body, throws data.message, falls back to 'HTTP <status>'; the catch builds the badge through the DOM"
    verdict: CONFIRMED (partial surfacing, see N-2 and N-5)
    evidence: |
      generated_puzzles.html:203-212 and :234-243 read as claimed. Markup injection is
      genuinely impossible on this path: `badge.textContent = 'Error'` and
      `badge.title = error.message` are DOM property assignments with no HTML parsing,
      and `statusBadge.innerHTML = ''` only clears. The one remaining `innerHTML` writes
      in this handler (the ✓ Approved / ✕ Rejected badges) are constant literals with no
      interpolation. Traced the data path: `message` is composed server-side in app.py
      (:1977 / :2000) from fixed sentences or `f"Puzzle {puzzle_id} approved"`, and
      puzzle_id only reaches a success message for a puzzle that exists (i.e. a
      store-generated id) — and even then it lands in a `title` property as text.
      Fallback: correct in all three cases I could construct — an unparseable body (a
      Flask 500 HTML page) rejects response.json() and the second callback throws
      'HTTP 500'; a parsed body with no `message` key, an empty `message`, or a literal
      `null` body all take `|| fallback` because of the `(data && data.message)` guard;
      a network-level failure never reaches this branch and arrives at the catch with
      its own TypeError message.
      Two gaps, both Minor: the safety property itself is untested (M12 survives, N-2),
      and "surfaced" here means a `title` tooltip — the visible badge still reads the
      bare word "Error" (N-5).
  - finding: F-004
    claim: "FIXED — applyActionCounts in its own try/catch inside the success .then, logging instead of falling through"
    verdict: CONFIRMED
    evidence: |
      generated_puzzles.html:228-238. The try/catch is inside the fulfilment callback of
      `response.json().then(...)`, which is itself inside the success branch, so a
      synchronous throw in applyActionCounts is caught there and the returned promise
      still fulfils — it can no longer reach the shared `.catch` at :243 and can no
      longer re-enable the action button or repaint an already-correct badge. The
      cycle-1 trigger (a bulk button rendered without data-confirm-* making `.replace`
      run on undefined) now logs and stops. M11 (removing the try/catch) is KILLED, so
      the fix is pinned, not merely present.
      On "does swallowing hide a real failure the user needs to see": it hides exactly
      one thing — the bulk buttons staying stale, which is CARD-142's own bug returning
      silently. That is a genuine cost, but it is strictly better than the alternative it
      replaced (reporting a completed approve/reject as failed), it is logged to the
      console, and the counts self-correct on the next successful action or any reload.
      Not a finding; noted in the verdict.
