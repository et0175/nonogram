    line: 210
    title: "The unparseable-body fallback is unpinned, and losing it strands the row rather than showing an error"
    description: |
      `response.json().then(data => { throw … }, () => { throw new Error(fallback); })`
      at :208-211. MUTATION EVIDENCE (M16): replacing the rejection handler with
      `() => {}` passes all 117 tests. With that regression, a non-2xx whose body is not
      JSON — a Flask 500 HTML error page, a proxy's error document — makes the inner
      promise FULFIL rather than reject, so the outer `.then` returns normally, the
      shared `.catch` never runs, and the row is left with its action button disabled
      and the spinner still showing, with no badge and no message at all.

      The code as written is correct; the failure-handling branch simply has no
      assertion holding it in place. Worth naming because the branch exists precisely
      for the case the tests cannot produce (this suite's refusals all come back as
      well-formed jsonify bodies).
    suggestion: |
      Pin the fallback the same way the rest of the handler is pinned — assert the
      post-`fetch(` slice contains `'HTTP ' + response.status` and that the non-ok
      `response.json()` call has a two-argument `.then`. Alternatively use
      `.catch(() => { throw new Error(fallback); })` on the inner promise, which is
      harder to delete by accident.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

