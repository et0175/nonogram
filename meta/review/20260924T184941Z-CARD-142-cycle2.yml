  - id: N-6
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_batch_bulk_button_state.py
    line: 222
    title: "The fix round introduced two new brittle source pins — the same class F-002 was raised to remove"
    description: |
      Two of the ten assertions the fix round added are matched on spelling rather than
      on intent, which is the pattern cycle 1's F-002 flagged:

        line 219  `assert "data.message" in after_fetch`
        line 222  `assert re.search(rf"try\s*\{{[^}}]*{APPLIER}\(", after_fetch)`

      The first fails on a behaviour-preserving rename or destructure
      (`const { message } = data`). The second requires that NO `}` appear between
      `try {` and the call, so wrapping the call in any braced construct — `try { if
      (counts) { applyActionCounts(...) } }` — fails the suite while the page behaves
      identically.

      Both are much weaker instances than the original F-002 (they pin identifiers and a
      control-flow keyword, not a full expression's spelling), and both do their job
      today: M10 and M11 are killed by them. Named so the tail is visible, not because
      either should gate.
    suggestion: |
      Leave them. If they are ever touched, match `message` by name inside the non-ok
      slice rather than as `data.message`, and match `try` and the call separately
      (`"try {" in slice and APPLIER + "(" in slice`) rather than in one anchored regex.
    confidence: high
    source: static
