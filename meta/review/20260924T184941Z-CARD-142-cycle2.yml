findings:
  - id: N-1
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_batch_bulk_button_state.py
    line: 174
    title: "_DISABLED_BELOW_ONE's `\\w+` admits a wrong operand, so `button.disabled = index === 0` passes"
    description: |
      `_DISABLED_BELOW_ONE = re.compile(r"\.disabled\s*=\s*\(?\s*\w+\s*===\s*0\s*\)?")`
      matches any identifier on the left of `=== 0`. MUTATION EVIDENCE (M9b): replacing
      `button.disabled = count === 0;` with `button.disabled = index === 0;` leaves all
      117 tests in the scoped run green, although the page would then disable whichever
      button happened to be first in the NodeList and enable the rest regardless of
      their counts.

      This is not a regression of F-002 — the regex is strictly stronger than the
      verbatim string it replaced, and it correctly kills `!== 0`, `=== 1` and the
      assignment disappearing. It is the residual of trading spelling for shape.
    suggestion: |
      Bind the operand to the name the applier actually uses, e.g.
      `r"\.disabled\s*=\s*\(?\s*count\s*===\s*0\s*\)?"` — `count` is a name the page
      chose on purpose, the same category of intentional marker the fix round already
      pins for APPLIER and the two dataset attributes, and it costs nothing in
      reformat-tolerance.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
