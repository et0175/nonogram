      disappears on any subsequent re-render of that badge. The code comment states the
      trade-off explicitly ("the badge stays one word wide"), so this is a deliberate
      choice rather than an oversight — but it is worth the owner's confirmation, since
      the finding it answers was specifically about the reason not reaching them.

      Nothing else on the page shows it either: the JSON branch returns before
      `flash(...)` (app.py:1981/2004), so a reload after a refusal carries no message —
      which is what makes the tooltip the only channel.
    suggestion: |
      Ask the owner (this is a visual-judgement call — see the standing note that
      image/UI changes get an eyeballed render, not just green tests). If a tooltip is
      not enough, the cheapest honest alternative is an inline text node beside the
      badge, or reusing the page's existing flash/alert region, both of which keep the
      sentence as text.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
