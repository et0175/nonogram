- id: F-004
  severity: info
  category: tech-debt
  type: question
  file: tests/test_admin_import_consistency.py
  line: 100
  title: The guard covers relative imports only, not the wider class of ways the tree can double
  description: 'AC-1''s rule is `ImportFrom` with `level > 0`. The doubling hazard is broader: `__import__`/`importlib.import_module`
    on a `src.`-prefixed string, a `sys.path` insert, `sys.modules` aliasing, or a re-export under a second
    name would all recreate it and all pass the guard.


    Verified there is no such vector in the tree today: 0 `src.`-prefixed imports anywhere under `src/`;
    0 `sys.modules` manipulation anywhere under `src/`; and the only dynamic-import uses under `admin/`
    are `importlib.resources` for font/asset loading (`book_pdf_generator.py:260`, `book_proof.py:75`)
    and an inline `__import__(''datetime'')` (`puzzle_review.py:1058`) — stdlib lookups, not package doubling.
    A new admin module IS covered the day it lands for the relative-import rule (the walk is `rglob` over
    disk, not a name list). It is not covered for the other vectors.


    Noted rather than filed against the card: AC-1 is worded as the relative-import property and the guard
    implements exactly that. Widening it to the hazard class would be a scope increase, and there is nothing
    in the tree for it to catch.'
  suggestion: 'Optional follow-up: extend the same walk to flag a string literal starting `src.nonogram`
    passed to `importlib.import_module`/`__import__`, and any `sys.path`/`sys.modules` write under `src/nonogram/admin/`.'
  confidence: high
