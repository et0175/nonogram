findings:
- id: F-001
  severity: medium
  category: tech-debt
  type: risk
  file: scripts/start_admin_local.sh
  line: 158
  title: The launcher's new spelling depends on the editable install, and the script never checks for
    it
  description: 'The declared SCOPE+ changed line 158 from `--app src.nonogram.admin.app` to `--app nonogram.admin.app`.
    The two spellings do not resolve by the same mechanism. The old one resolved from the working directory
    (line 89 does `cd "$PROJECT_ROOT"`, and `python -m` puts cwd on sys.path, where `src/` is a package
    directory). The new one cannot resolve that way — `nonogram` lives at `src/nonogram`, so cwd on the
    path yields `src.nonogram`, never `nonogram`. It resolves only through the editable install''s .pth
    in site-packages.


    Measured: with the editable-install path entry dropped from sys.path, `find_spec(''src.nonogram.admin'')`
    is True and `find_spec(''nonogram'')` is False.


    The script never establishes that precondition. Step 2 (lines 92-99) checks only that the `.venv`
    DIRECTORY exists; there is no `pip install -e .` step and no import check anywhere in the 158 lines.
    So the script can reach line 158 with a venv that cannot import `nonogram`, where the old spelling
    would have worked. Secondary effect: the .pth holds an ABSOLUTE path (`/Users/omelnikova/PycharmProjects/PythonProject4/src`),
    so from any second checkout the launcher now serves whatever tree the install points at rather than
    the checkout the script lives in. Benign today — worktrees have no `.venv`, so the script exits at
    step 2 (verified: no `.venv` in the CARD-139 worktree).


    The trade is clearly correct: the failure is loud and immediate (ModuleNotFoundError before a single
    request) where the old spelling''s failure was a silent live 500 on a real screen. The finding is
    that the card''s worktree note asserts the unprefixed name "resolves from any working directory" without
    naming the new dependency it introduces — which overstates the safety argument for the one line taken
    outside the card''s own scope.'
  suggestion: Add an install check to step 2, e.g. `python -c 'import nonogram' 2>/dev/null || pip install
    -e .`, so the precondition the new spelling needs is established rather than assumed. Alternatively
    note the dependency in the line-158 comment, which currently explains only why the prefix was dropped.
  confidence: high
  source: static
  violates: null
  root_cause: null
  status: fixed
  fix_note: 'Added a guard clause to scripts/start_admin_local.sh immediately after the venv is
    activated (step 3) — the earliest point at which the script''s own name for the venv''s interpreter
    (bare `python`, as used on the launch line) exists, so no second way of naming the interpreter
    was introduced. It runs `python -c ''import nonogram''` and, on failure, prints the coloured ✗
    line, names the command to run (`pip install -e .` in the activated venv, from $PROJECT_ROOT)
    and exits 1 — matching the register of the existing Python, PostgreSQL and venv checks. It
    deliberately does NOT install anything on the developer''s behalf. A comment above it states the
    precondition the reviewer measured: `nonogram` resolves only through the editable install''s path
    entry, never from the working directory, because the package lives at src/nonogram.


    Evidence. `bash -n scripts/start_admin_local.sh` clean (no output, exit 0). Passes correctly:
    the project venv''s interpreter runs `import nonogram` → exit 0, resolving to
    /Users/omelnikova/PycharmProjects/PythonProject4/src/nonogram/__init__.py; the guard block itself,
    run with that interpreter first on PATH, printed "✓ Project importable (editable install present)"
    and fell through to the launch line, exit 0. Fires correctly: the system python3 with PYTHONPATH
    unset runs `import nonogram` → ModuleNotFoundError: No module named ''nonogram'', exit 1; the guard
    block, run with that interpreter symlinked as `python` on PATH, printed "✗ Project not installed
    in the virtual environment", the pip install -e . instruction, and exited 1 — the launch line was
    never reached.


    Untouched, as required: the launch line, the argument parsing, the Postgres check, the
    DATABASE_URL export and `alembic upgrade head`. The script was not run end to end (it hardcodes
    DATABASE_URL=…/nonogram_poc, absent on this machine); no database was created, dropped or
    recreated. Full suite re-run because AC-1''s guard walks files on disk: 5381 collected, 5372
    passed, 2 failed, 7 skipped — the two failures are the pre-existing ones. The card''s worktree
    note that claimed the unprefixed name "resolves from any working directory" was corrected in
    place to name the editable install as the only resolver, with a pointer to the [Fix 1] block.'
  fixed_in: meta/kanban/cards/CARD-139.md § Worktree notes → [Fix 1]; scripts/start_admin_local.sh
    (guard clause after the venv activation in step 3)
  dismissed_reason: null
  learned_pattern: null
