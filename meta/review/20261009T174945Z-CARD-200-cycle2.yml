findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_page_numbers.py
    line: 713
    title: "Packed-answer-page F-1 fix is correct but its dedicated regression class doesn't cover the one real half-filled corner case"
    description: |
      src/nonogram/admin/book_pdf_generator.py:3806-3809 computes `corner_index`
      and gates `corner_placement` with `corner_index < len(layout.slots)`. This
      is the correct operator (verified: it matches PackedSolvedLayout's
      documented and constructed fill order — contiguous from index 0, row-major,
      confirmed by reading compute_packed_solved_layout's own slot-building loop
      in src/nonogram/export/layout.py).

      Mutation test performed (capture/mutate/test/restore, verified clean
      afterwards): changing the operator to `<=` survives undetected against
      tests/test_book_page_numbers.py alone (all 14 tests, including both new
      TestBookPageNumbers_FolioNeverCollidesWithTheGrid packed-answer tests,
      pass unchanged) — because both of that class's packed-answer tests use a
      fully-filled plan (4-of-4 and 2-of-2), where `corner_index < len(slots)`
      and `corner_index <= len(slots)` agree.

      The gap matters because the scenario the mutant actually breaks is real
      and reachable: `plan_small_answer_pages` (src/nonogram/admin/book_answer_key.py)
      explicitly produces "a page holding the last 1 if one is left over" —
      a capacity-2 PackedAnswerPage with exactly one answer. Probed directly
      (not merely reasoned): a 1-of-2 packed page at an odd (right-hand) page
      number puts `corner_index == len(layout.slots)` exactly, the one value
      where `<` and `<=` disagree — with `<=`, `layout.slots[corner_index]`
      is an IndexError (slots has only index 0).

      This is NOT a live production bug: the actual (unmutated) code uses the
      correct `<` and was verified by direct execution (a scratch probe
      building a real single-answer PackedAnswerPage at page numbers 7 and 8)
      to render without error and omit/draw the folio correctly on both
      parities. It is also not an undetected regression risk suite-wide: running
      the same mutant against the broader related test set (test_book_pdf.py,
      test_book_pdf_two_up.py, test_book_solved_answer_key.py, etc. — 8 files)
      produces ~16 failures/errors elsewhere, so the full suite (the 6833-test
      run this review was handed) would catch a real regression here. The gap
      is specifically that F-1's own dedicated "the folio must never collide"
      regression class claims to cover every corner-slot-empty case but relies
      on unrelated tests to actually pin this one.
    suggestion: |
      Add a test to TestBookPageNumbers_FolioNeverCollidesWithTheGrid
      constructing a single-answer PackedAnswerPage (capacity 2) and calling
      _packed_answer_page at an odd (right-hand) page_number, asserting it
      renders without exception and the folio is drawn (since the one filled
      slot is the left/non-corner position on a right-hand page, there is
      nothing to collide with) — mirroring the existing
      test_packed_answer_page_still_draws_when_the_corner_tile_has_room
      control but with a genuinely unfilled corner rather than a fully-filled
      page.
    confidence: high
