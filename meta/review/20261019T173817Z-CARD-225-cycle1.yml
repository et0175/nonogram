  - id: F-002
    severity: medium
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1430
    title: "puzzle_page_plan's documented failure contract is now false, and its abort surface widened silently"
    description: |
      The new `cell_sizes(payloads)` call runs BEFORE `puzzle_pages`, so an unmeasurable member
      now aborts the editor's page-count walk through `book_cell_sizes` rather than through the
      pairing walk's named RuntimeError. Measured on both trees with the repository's own
      `tests/test_book_pdf.py::_unmeasurable_puzzle` fixture (15 row clues, no column clues):

        | case                     | main (7bc93c1 .. ac7d0d7)                                  | this branch |
        | same-tier neighbour      | RuntimeError "puzzle #1, #2 could not be laid out: ..." with __cause__ | ValueError "clue sets disagree about the grid: ...", __cause__ None, no position |
        | alone in its tier        | planned fine (1 page)                                      | the same bare ValueError |
        | different-tier neighbour | planned fine (2 pages)                                     | the same bare ValueError |

      Two separate problems, one line apart:

      (a) The `Raises:` block at book_pdf_generator.py:1418-1422 still reads "RuntimeError: a
          pair the walk offered could not be measured -- a member whose clue sets disagree
          about its grid. **The message names it.**" That is now false for every one of the
          three cases above: the exception is a ValueError, carries no cause, and names
          nothing. This is the standing contract
          `TestBookPdf_UndrawablePuzzleAbortsNamingThePuzzle` states in so many words ("Both
          stages abort, both name the id -- which is the whole contract"), and the card's own
          F-3 amendment applied the remedy to `section_plan` only, although the same commit
          edited `puzzle_page_plan` two lines away.

      (b) The abort surface widened: a member with no same-tier neighbour was never offered to
          `compute_pair_layout` and so never aborted this entry; it does now. Production
          impact is contained -- app.py:2722's handler catches `(ValueError, RuntimeError)` and
          the editor reports "unknown" -- but the log line the owner is sent to loses the
          position of the culprit, which is the only handle a 120-puzzle book offers. No row of
          the declared failure matrix covers this boundary (F-3 is about `book_cell_sizes` and
          its `section_plan` wrapper; F-14 is about callers handed no map).
    suggestion: |
      Route the editor entry through the helper that already exists:

          try:
              sizes = generator.cell_sizes(payloads)
          except ValueError as unmeasurable:
              raise RuntimeError(
                  f"puzzle {generator._unmeasurable_members(payloads, None)} could not be "
                  f"laid out: {unmeasurable}"
              ) from unmeasurable
          return generator.puzzle_pages(payloads, cell_sizes=sizes)

      ... and leave the `Raises:` block as written, since it then becomes true again. This
      closes the hole rather than papering it: `_unmeasurable_members` is pure and already
      proven on the `section_plan` path, the exception type returns to the one the docstring
      and app.py:2722 both expect, and the widened surface becomes a named abort instead of an
      anonymous one. Add one case to `TestBookPdf_UndrawablePuzzleAbortsNamingThePuzzle`
      driving `puzzle_page_plan` directly for the "alone" shape -- that is the case that does
      not exist on main at all and so has never been pinned anywhere.
      If instead the widening is judged wrong (the editor should still answer for a book with
      one bad member), the fix is a per-member fallback in `cell_sizes`, and that needs its own
      failure-matrix row -- say which, do not leave both readings live.
    confidence: high
    source: static
