  - id: F-007
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_cell_size.py
    line: 1010
    title: "The cost corpus is rebuilt and re-measured once per test, six times"
    description: |
      `TestBookCellSize_TheCostOfABookWideCell._measure()` is a plain method, called by all six
      tests of the class. Each call builds 60 seeded books (~1388 random grids, each through
      `compute_clues`) and then runs `book_cell_mm` twice per member (once inside
      `book_cell_sizes`, once for the "before" figure) -- so the corpus is constructed six
      times and ~16.6k `compute_layout` calls are made where ~2.8k would do. No timing was
      taken (the brief forbids it this cycle), so this is stated structurally, from the call
      graph, not from a measured cost.
    suggestion: |
      Make `_measure` a module- or class-scoped cached fixture (or `@functools.lru_cache` on a
