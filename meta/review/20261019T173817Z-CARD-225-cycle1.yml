    title: "The add gate's cost is now proportional to the book's size"
    description: |
      `_member_clue_sets` adds one bulk `get_puzzles` over the book's current members, and
      `book_cell_sizes` then runs `compute_layout` once per prospective member, on every add
      submission -- so a 150-puzzle book pays 150 layout computations to judge one new puzzle
      where it previously paid one. One query, pure arithmetic, no threshold in the registry,
      and no timing taken (forbidden this cycle). Recorded so the figure is on the record
      before anyone measures the selection step and is surprised.
    suggestion: |
      Nothing to do now. If it ever shows up: only the submitted puzzles' grid sizes need
      measuring, so the member walk could be filtered to members sharing a grid size with the
      submission before `book_cell_sizes` is called -- that is an identical result over a
      strictly smaller set, because the map's other keys are never read.
