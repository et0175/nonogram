  - id: F-004
    severity: medium
    category: compliance
    type: gap
    file: src/nonogram/admin/app.py
    line: 4148
    title: "The declared EC-021 divergence (F-13) is correctly scoped but has no test on either side of its bound"
    description: |
      EC-021's second clause, verbatim from meta/architecture/requirements.yml:2237-2239 --
      "the tile's cell, the add refusal and the finalise count all come from the one computation
      FR-030's PDF uses, so **no two of them can disagree about a puzzle**". After this card the
      add refusal and the finalise count read `book_cell_sizes` (a membership's figure) and the
      tile reads `book_cell_mm` (the candidate's own fit), so two of them CAN disagree. The card
      declares this (F-13, a STRUCTURE note, and finding 1 to the orchestrator), bounds it
      ("tile figure >= gate figure, always") and routes the wording decision to the architect
      station without taking it. I agree with all three of those calls: the clause became
      unsatisfiable for a non-member candidate on 2026-10-17 when NFR-008's amendment landed
      (commit 91609aa) WITHOUT propagating to EC-021, so the root cause is a registry
      propagation gap, not this card, and the card cannot fix it without editing
      meta/architecture/**, which its own scope forbids. The declaration is also durable: it is
      committed, both in the card (committed on main at 154ac60) and in `_book_cells`' own
      docstring.

      What is NOT done is the part that IS this card's:

        * **The user-visible face of the divergence has no test.** A candidate whose grid size
          already has a deeper member in the book now shows an UNFLAGGED tile with a figure
          above the floor, and is then refused by the add gate. That loop -- clean tile, refused
          add -- is new behaviour introduced by this diff and no test exercises it. The nearest
          tests (`tests/test_book_select_floor_tiles.py`) stub both doors and so assert that
          neither screen judges for itself, which is a different property.
        * **The bound has no test.** "tile >= gate, always" is structurally true (the gate's
          figure is a min over a set that always contains the candidate itself, hence <= the
          candidate's own fit) but nothing pins it, so a later change that made the tile read a
          membership's figure for the wrong membership would be silent.
        * **EC-021's own property test cannot see any of it.** Verified by executing the
          corpus: `tests/property/test_book_membership_floor.py::puzzle_shapes()` returns 24
          shapes with 24 DISTINCT extents, so each of its 384 decisions has one member per grid
          size and the shared figure is the per-puzzle figure throughout. The card states this;
          I confirmed it rather than taking it.
    suggestion: |
      Card-side (closable in this cycle):
        1. One test on the selection tab for the divergence's surface: a book already holding a
           deep 30x30, a shallow 30x30 candidate, then assert (a) the tile shows the candidate's
           own fit with no below-floor flag, (b) `books.below_floor(book_id, [shallow])` refuses
           it naming the smaller figure, and (c) tile figure >= refusal figure. This closes the
           bound and makes the divergence a pinned, intentional behaviour instead of an
           undocumented one; it is deliberately an assertion OF the divergence, not against it,
           so it will not have to be rewritten when the registry decides.
      Architect-station (NOT this card, and should not block it):
        2. Amend EC-021's "no two of them can disagree" clause, or re-scope it to the gate and
           the finalise count, and re-point its property test. Until then EC-021 is knowingly
           unmet and its named test reports green on a property that is false in a case it never
           generates. Widening that corpus is the right move for the amending card, not for this
           one -- the card's refusal to widen a standing property's corpus is correct.
    confidence: high
    source: model
