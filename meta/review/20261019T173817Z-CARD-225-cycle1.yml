  - id: F-001
    severity: medium
    category: feature
    type: gap
    file: src/nonogram/admin/book_page_spec.py
    line: 566
    title: "book_cell_spec's two refusal paths are unverified -- the mutant removing both survives"
    description: |
      `book_cell_spec` is a new public export (added to `__all__`) with three behaviours: lower
      the flat cap, refuse a `CellCapPolicy.COMFORT_CURVE` spec, and refuse a `cell_mm` that is
      not a finite positive number. `grep -rn "book_cell_spec" tests/` returns ZERO hits: no
      test file in the repository mentions the function, and its only caller
      (`BookPDFGenerator._puzzle_page_spec`) never passes it a bad value, so nothing can reach
      either refusal through a caller either.

      Measured, not inferred. Mutant: both `raise ValueError` blocks deleted, the COMFORT_CURVE
      branch replaced by `return replace(spec, cell_cap=float(cell_mm))`. Result: **287 passed,
      0 failed** over tests/test_book_cell_size.py, tests/test_book_page_spec.py,
      tests/test_export_a4_golden.py, tests/property/test_cli_exports_byte_identity.py and
      tests/test_layout_page_spec.py -- the five files that could plausibly cover it. The file
      was restored from a byte-identical backup and `diff -q` confirmed identical.

      Why this matters beyond coverage arithmetic: the COMFORT_CURVE refusal is the mechanism
      the card's own ADR-0036/R1 verdict cites ("book_cell_spec *refuses* a spec with
      CellCapPolicy.COMFORT_CURVE rather than giving a CLI sheet a book cell"). As shipped,
      that sentence is true of the code and invisible to the suite: a future edit that gives a
      CLI/A4 sheet a book cell would be caught only if it also broke the A4 golden, which it
      need not. The same applies to failure-matrix rows F-5 (`cell_mm` above the cap is a
      no-op) and F-6 (ValueError naming the argument): both are declared, both are real on
      reading, neither is cited to a test.
    suggestion: |
      Three direct unit tests in tests/test_book_page_spec.py (or beside the new file):
        1. `book_cell_spec(BOOK1_ODD_or_equivalent, 9.0)` returns a spec whose cap is still the
           profile's 7.5 mm -- F-5, and the structural half of G-1 stated as a test rather than
           as an argument;
        2. `book_cell_spec(a_spec_with_cell_cap=CellCapPolicy.COMFORT_CURVE, 6.0)` raises
           ValueError -- the ADR-0036/R1 guard;
        3. `book_cell_spec(spec, x)` raises ValueError for x in (0, -1, float("nan"),
           float("inf"), True) -- F-6, including the `isinstance(cell_mm, bool)` clause, which
           is the one branch no plausible production value reaches.
      These close the hole because the refusals are pure input validation on a function with a
      single internal caller: a direct call is the only thing that can reach them, so a direct
      test is both necessary and sufficient. Re-run the mutant above afterwards; it must red.
    confidence: high
