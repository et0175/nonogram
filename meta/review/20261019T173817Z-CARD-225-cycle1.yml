  - id: F-003
    severity: high
    category: feature
    type: gap
    file: tests/property/test_book_pairing.py
    line: 462
    title: "EC-027's pairing property is green over a corpus that cannot instantiate F-8, the pairing change this card ships"
    description: |
      This card changes a pairing verdict: F-8 declares that a pair whose smaller grid-size book
      cell is below TWO_UP_MIN_CELL_MM is refused even when the pair's own two-up fit clears
      7.0 mm. The standing property that governs the pairing walk -- EC-027 / INV-010 / FR-040 --
      cannot see that, for two independent reasons, and is green for both:

        * `test_PropertyTest_BookPairing_InOrderSameTierFittingNeighboursOnly` (line 490) calls
          `BookPDFGenerator(sheet.book).puzzle_pages([p.payload for p in order])` with **no
          `cell_sizes`**, i.e. the F-14 fallback. That is a legal contract for `puzzle_pages`,
          but it is no longer the path production takes, so the 3600-book corpus certifies the
          pre-card rule.
        * `..._interior_pages` (line 587) does drive the real path, but filters the corpus:
          `extents = {(p.columns, p.rows) for p in order}` / `if len(extents) != len(order):
          continue` (lines ~608-612). Every book it keeps has at most one member per grid size,
          so the book-wide cell is identically each member's own fit and the oracle cannot
          diverge. The filter's stated reason is a different one ("so the sequence read off the
          pages identifies the puzzles"), so nothing in the file records that it is now also
          what keeps the oracle valid.

      The oracle itself, `_expected_pages` (line 420), is now a model of the superseded rule:
      it decides each offer with `sheet.shared_cell_mm(first, second, reserve=True)` -- the
      pair-only fit -- with no term for the grid size's book cell. Its own docstring warns that
      "one disagreement would desynchronise every later page of the book", which is exactly the
      failure mode the filter is currently hiding.

      That the divergence is real is proved by the card's own
      `TestBookCellSize_SharedPageTakesTheSmaller::test_a_pair_whose_book_cell_falls_under_the_two_up_minimum_is_refused`:
      one hand-built case where production refuses a pair that `_expected_pages` would pair. So
      the whole of F-8's regression surface is that single hand-built case, while the 3600-book
      property that exists to catch systematic pairing drift is structurally blind to it. The
      card recorded precisely this blindness for EC-021's corpus (its finding 2) and not for
      EC-027's -- the one whose verdict it actually moved.
    suggestion: |
      Preferred, and it closes the hole: in `..._interior_pages`, stop identifying puzzles by
      extent -- key the read-back on the per-puzzle id/name the rows already carry
      (`puzzle.as_row(f"p{index}")` already gives each a unique id) -- then drop the
      distinct-extent filter and add the book-wide term to `_expected_pages`:
      group the printed order by `(columns, rows)`, take the min of `sheet.cell_mm(...)` within
      each group, and cap each offer's `shared_cell_mm` by the smaller of the two groups' cells
      before comparing against TWO_UP_MINIMUM_MM. `tests/property/test_book_pdf_geometry.py`'s
      `Sheet.book_cell_mm` in this same diff is the exact helper to copy, and that file's
      `shared_binds >= 1` assertion is the pattern for proving the new term is not a no-op --
      add the same kind of counter here.

      Cheaper and WEAKER, stated as such: leave the corpus alone and write the validity
      condition at the filter and in `_expected_pages`' docstring ("this oracle models the
      pair-only fit and is sound only while no book here holds two members of one grid size"),
      plus one targeted non-property case for F-8. That documents the hole instead of closing
      it -- the next person who relaxes the filter for an unrelated reason still gets a
      mysterious red -- so take it only if the orchestrator wants the corpus work on its own
      card, and say so on that card.
    confidence: high
    source: model
    violates: EC-027
