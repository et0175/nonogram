  - id: F-005
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_book_cell_size.py
    line: 274
    title: "The M6 guard's docstring claims a discrimination that test does not have -- measured"
    description: |
      `TestBookCellSize_SameGridSizeSameCell::test_the_size_is_the_books_and_not_one_levels`
      says: "A map built per level would print the Easy 20x20s at 7.5 mm and the Hard one at
      6.35 mm -- two cells for one grid size, in one book ... Added because a mutant that sized
      each level's slice on its own survived everything else in this file (CARD-225, mutant
      M6)."

      Reproduced the mutant to check: `puzzle_section`'s call changed from
      `cell_sizes=cell_sizes` to `cell_sizes=... self.cell_sizes(payloads[start:end])` (the
      per-level slice). Result over tests/test_book_cell_size.py: **1 failed, 42 passed**, and
      the single failure is
      `TestBookCellSize_SharedPageTakesTheSmaller::test_the_pair_is_capped_by_a_member_in_another_level`.
      The test quoted above PASSES under the mutant. (Backup restored, `diff -q` identical.)

      So its counterfactual is false as shipped: with a per-level map the Easy 20x20s do NOT
      print at 7.5 mm, because single pages are drawn from `SectionPlan.cell_sizes` in
      `interior_stream` and never see the slice at all -- which the card's own notes say
      plainly ("the first pins the claim's substance, the second is the one that can see the
      mutant"). The honest statement and the committed statement differ, and it is the
      committed one the next reader meets: they will believe a per-level regression is covered
      twice when it is covered once, by a test two classes away. This is the claim-vs-mechanism
      family the last three waves have each produced a finding in, and it is now sitting inside
      the test written to close that family.
    suggestion: |
      Rewrite the docstring to what the test demonstrates -- "a grid size can straddle FR-041's
      levels and the book's single pages are all sized from SectionPlan.cell_sizes, so the
      level a member is graded into does not change its cell; the mutant that sizes a level's
      slice is observable only on the pairing path, which
      test_the_pair_is_capped_by_a_member_in_another_level pins" -- and cross-reference that
      test by name so the pair is legible as a pair.
      Better, if the orchestrator wants the claim to be true rather than corrected: give this
      test the discrimination its docstring asserts by driving `puzzle_section` directly with
      the Easy slice and asserting the cell is still the book's. That is the only way a
      per-level map becomes observable on the single-page path, and it would make the two tests
      independent guards rather than one guard and one witness. Either remedy is acceptable;
      what is not is leaving a committed docstring that a 60-second mutation refutes.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

