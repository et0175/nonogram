findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_admin_design_tokens.py
    line: 90
    title: "`in` is a CSS length unit as well as a color-mix() keyword, so one literal shape escapes the token predicate while its docstring claims none can"
    description: |
      `_VALUE_STRUCTURE` must allow the words `calc`, `color-mix`, `in` and `srgb`
      so that `color-mix(in srgb, …)` survives the strike. But `in` is also a CSS
      length unit, and the alternation is written `(?:calc|color-mix|in|srgb)\b`
      with a boundary only on the right — so `in\b` matches the unit suffix of a
      bare inch length. Measured against the shipped helper:

        calc(1in + var(--border-width)) ........ PASSES (should be reported)
        calc(var(--x) + 2in) ................... PASSES (should be reported)
        var(--a) 1in ........................... PASSES (should be reported)
        calc(1px + var(--x)) ................... reported
        calc(1em + var(--x)) ................... reported
        color-mix(in srgb, var(--a) 28%, #fff) . reported

      Three claim sites say no literal can get through:
      `_untokenised`'s docstring — "``calc()`` and ``color-mix()`` therefore pass
      only while every colour and length argument inside them is a token: a
      literal anywhere in one survives the strike"; the test's docstring — "nor
      for a hard-coded length, which is reported the same way"; and admin.css's
      comment — "reports any value that is not a var(--token) or a
      calc()/color-mix() over tokens". Each is a universal, and each is refuted
      by the three values above.

      Calibrated deliberately low, and the calibration is the point of the
      finding rather than an apology for it. This is NOT the ADR-0039/R1 defect
      cycle 1 filed: that control could not fail, and this one demonstrably does
      — five literal shapes injected into the real rules all go red, including
      one hidden inside the `color-mix()`, and neutralising the predicate reds
      the broken-on-purpose rules. The gap is that a universal claim is one
      obscure unit broader than the mechanism. Blast radius is nil: the escape
      needs an author to write inch units in a screen stylesheet inside one of
      four pinned rules, and `grep -nE '[0-9](in|cm|mm|pc|pt)\b'` over admin.css
      finds none today. Raising this to Important would be inflating a Minor to
      force a third cycle, which it does not deserve.
    suggestion: |
      One character of regex, or one word of docstring — either closes it.
      (a) Require a boundary on the left of the unit-ambiguous word:
          `_VALUE_STRUCTURE = re.compile(r"(?:calc|color-mix|srgb)\b|\bin\b|[-+*/0-9.,%() ]")`
          and add `calc(1in + var(--border-width))` to the `broken` control so the
          fix carries its own failing case (measured: it passes today, so the case
          would be red before the regex change and green after).
      (b) Or narrow the three claim sites to "a literal length or colour in the
          units this stylesheet uses", per ADR-0039/R1's second option.
      (a) is cheaper and keeps the claim.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_puzzle_editor_ui.py
    line: 816
    title: "AC-7's \"no control carries the word Clear\" is swept over button TEXT only, so an attribute-borne name would pass"
    description: |
      The guard collects `re.findall(r"<button\b[^>]*>(.*?)</button>", html)` and
      strips tags from the captured text, so the sweep sees inner text and
      nothing else. A control whose name lives in an attribute —
      `aria-label="Clear board"`, `title=`, an `<input value=>` — would satisfy
      it. AC-7's wording is "no control on that page carries the word 'Clear'",
      which is the broader claim.

      Measured, no "Clear" is reachable today by any route, so the AC is not
      materially over-stated: `grep -n Clear src/nonogram/admin/templates/
      puzzle_edit.html` returns exactly two hits, both inside the `{# … #}`
      header block (lines 1–69) that Jinja never renders; the page's own
      aria-labels are "Marking tool", "History", "Brush: <label>", "Zoom",
      "Zoom in", "Zoom out"; and solver.js writes `Brush: <label>` from a
      two-brush editor menu that no longer offers the fourth brush at all.
      The page is not all-buttons, though — puzzle_edit.html contributes 19
      `<button>` and no other control element, but it `{% extends "base.html" %}`,
      which adds 8 `<a>` nav links and one more button. None of those carries
      "Clear" either. Recorded so that a future card adding an icon button named
      by `aria-label`, or a nav entry, does not inherit a guard that reads as
      broader than it is.

      AC-7's other two clauses ARE guarded, and all three mutants are red
      (measured here, template restored byte-identically after each):
        reset button Reset -> Clear ....... red on `assert "Reset" in labels`
        reset button Reset -> Wipe ........ red on `assert "Reset" in labels`
        title Reset the board? -> Clear ... red on the title assertion
        accept Reset board -> Clear board . red on `assert not [... "Clear" ...]`
      The player half of the collision is the owner's recorded `### [Decision]`
      and is deliberately not re-raised.
    suggestion: |
      One line, and it is the cheaper of the two options because the rendered
      page is already clean: `assert "Clear" not in html, ...` over the whole
      rendered page passes today (both template occurrences are inside the Jinja
      comment), so AC-7's guard can take the same whole-page form AC-1's sweep
      already uses on the player, and keep the per-button assertions as the
      useful failure message. Narrowing the claim to "no button on that page is
      labelled Clear" is the alternative, and is what the guard measures now.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

