      parsed at 98482d2c and at HEAD, every docstring stripped, `ast.dump`s
      identical, so the whole test-tree change is comments and docstrings.
    verdict: TRUE, reproduced independently
    evidence: |
      My own script (git show of each blob, ast.parse, strip the leading string
      Expr of every Module/FunctionDef/AsyncFunctionDef/ClassDef, ast.dump):
        98482d2c src_chars 323063 src_sha 2117d8771b2b docstrings_stripped 109
                 dump_len 392100 dump_sha cacfd93827a6d51cb1daf580
        db0e1a3e src_chars 324759 src_sha 710e91634749 docstrings_stripped 109
                 dump_len 392100 dump_sha cacfd93827a6d51cb1daf580
        SOURCE identical: False
        STRIPPED AST DUMPS IDENTICAL: True
      The sources differ by 1,696 characters and the stripped ASTs do not differ
