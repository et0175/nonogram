resolution_of_the_ratio_conflict:
  question: "cycle 1 said 8.2x / 80 %; fix round 1 says 8.0x / 87.7 %. Which is right?"
  answer: >-
    FIX ROUND 1 IS RIGHT, and cycle 1 was not wrong so much as under-sampled.
    These are not two incompatible figures; they are two readings of one quantity
    whose run-to-run spread is wider than the gap between them. Cycle 1 took ONE
    pair (2.2835 / 0.2792 = 8.18x) and rounded to 8.2x. The fix round took three
    pairs back to back in one process (8.11 / 8.02 / 8.04) and headlines the mean
    as 8.0x. I took three of my own, in a new process on a different machine
    state, and got ratios 8.083 / 8.291 / 7.688 - mean 8.010x. My own spread
    (7.69-8.29) STRADDLES both published figures, which settles it: 8.0x is the
    better-supported statement of the same measurement, and "8.2x" is inside the
    noise of it rather than a rival claim.
  the_two_percentages_are_two_different_quantities: >-
    The 80 % and the 87.7 % are not in conflict either, and the fix round is
    right to publish both with their doors named. 87.7 % is the split's share of
    the stdlib arm BY DIFFERENCE between the two unprofiled arms - I measured
    87.5 % (mean (2.3708-0.2960)/2.3708). 80 % was cycle 1's cProfile CUMTIME
    share of ast._splitlines_no_ff - I measured 77.7 % cumtime and 73.7 % tottime
    under cProfile. The round states 76 % tottime / 80 % cumtime, which lands
    between my reading and cycle 1's. Every one of those four numbers is a
    correct answer to a different question, and the document now says which
    question each answers.
  the_withdrawal_is_correct: >-
    The round's argument for withdrawing 9.9x / 90 % as a MIXED instrument is
    sound and I verified its load-bearing half. It claims 0.2864 s is the
    magnitude of the UNPROFILED memoised arm and nowhere near the profiled one.
    Measured: unprofiled memoised arm 0.2804-0.3121 s; profiled memoised arm
    0.7415 s (the round says 0.7323 s). So the published pair divided a profiled
    stdlib arm by an unprofiled memoised one and cannot be two readings of one
    instrument. The round's arithmetic cross-check also holds: 108 x 2.8429 s =
    307 s against a measured before-cost of ~113 s.
  a_correction_cycle_1_was_owed: >-
    The fix round is RIGHT about `man pgrep` too, and cycle 1 was sloppy. Cycle 1
    wrote that it confirmed `[-Lfilnoqvx]` "against `man pgrep`'s SYNOPSIS". On
    this box the binary's USAGE line reads `[-Lfilnoqvx]` and man's SYNOPSIS
    reads `[-Lafilnoqvx]`. Cycle 1 quoted the usage line and attributed it to the
    manual - a door mis-stated by one step, which is the card's own subject. It
    bears on the question the brief asks: on this detail cycle 1 copied rather
    than reproduced. Neither spelling contains a `c`, so cycle 1's conclusion
    stood; its citation did not.

findings:
  - id: F-201
    severity: major
    title: >-
      The replacement rival-pytest instrument cannot see a venv-launched pytest
      on this box - it reads 0 either way - and the round's new positive control
      reports a reading that command cannot have produced
    file: meta/profiling/card-292-per-test-ceiling.md
    line: 546
    also_at: [338, 446, 754, "meta/kanban/config.yml:51 on main at d77fa29c"]
    gating: true
    confidence: certain
    evidence: |
      What the document now claims, at SS7's F-001 inset (lines 537-548):
        "**And the working form has a positive control, which a host cell needs
         as much as an assertion does.** A cell that reads 0 because it is broken
         and a cell that reads 0 because the box is quiet are indistinguishable
         from the figure alone ... So the replacement was checked both ways on
         this box in fix round 1: **0** with no pytest running, and **1** taken
         deliberately while this fix round's own pre-gate (SS8.2) was running in
         the background. The cell can rise, and it rose."
      I tried to reproduce the rise and could not. First, incidentally: while my
      P1 run (542 tests, 131.78 s, started as `$PY -m pytest ...` from a script,
      exactly the card's own shape) was in flight, sampled at 25 s and at 45 s:
        rival-pytest start: 0
        rival-pytest DURING the run (positive control): 0
          matching processes:            <- `pgrep -fl` printed nothing
        rival-pytest DURING, second sample: 0
        pytest exit=0 ... 542 passed in 131.78s
      Then deliberately, with the readings as the measurement:
        -- with NO pytest running --
          pgrep -f 'bin/python -m pytest' | wc -l  = 0
          pgrep -f 'm pytest'             | wc -l  = 0
          pgrep -f pytest                 | wc -l  = 0
        -- with a venv-launched pytest DEFINITELY running (pid 16489, alive=yes) --
          its argv: /Library/Frameworks/Python.framework/Versions/3.14/Resources/Python.app/Contents/MacOS/Python -m pytest tests/
          pgrep -f 'bin/python -m pytest' | wc -l  = 0     <- CANNOT RISE
          pgrep -f 'm pytest'             | wc -l  = 1
          pgrep -f pytest                 | wc -l  = 1
        -- after kill --
          pgrep -f 'm pytest'             | wc -l  = 0
      The mechanism, which is why this is certain and not a flake: this venv's
      `bin/python` is a framework Python, and a framework Python RE-EXECS itself
      through Python.app, replacing argv[0]. So the literal string
      `bin/python -m pytest` never appears in a running pytest's command line
      here:
        $ python -c "import os,sys,subprocess; print(sys.executable); \
            print(subprocess.run(['ps','-o','command=','-p',str(os.getpid())],...))"
        sys.executable    /Users/.../PythonProject4/.venv/bin/python
        ps -o command=    /Library/Frameworks/Python.framework/Versions/3.14/
                          Resources/Python.app/Contents/MacOS/Python -c ...
      I also checked the one way a spurious 1 could be manufactured - the asking
      shell's own argv containing the pattern - and it does not happen here:
        $ /bin/zsh -c "pgrep -f 'bin/python -m pytest' | wc -l; \
                       pgrep -fl 'bin/python -m pytest'"
        0
        (nothing matched)
      So the cell is a FALSE-NEGATIVE generator: 0 when quiet, 0 when contended.
      Why gating, in the card's own words: this is "the silent-empty-cell failure
      AC-6 exists to prevent, committed inside AC-6's own artefact" - the sentence
      the document writes about `pgrep -fc`. The spelling changed; the defect did
      not. And the round did not merely inherit it: it ADDED a claim that the cell
      had been shown to rise, which is the one thing that would have closed the
      class, and that claim is false here. SS8.2's `0 / 0` cells therefore stand
      in exactly the position SS8's withdrawn `0 / 0` stood in - almost certainly
      the true value, with a door that cannot establish it - except that SS8 is
      honest about that and SS8.2 is not. The same prescription is in SS4 (line
      338), in SS6's snapshot (line 446) and, because SS6 is verbatim by
      construction, in main's own board convention at d77fa29c.
    remedy: >-
      Use a pattern that matches the process as it actually appears. Proved to
      work above: `pgrep -f 'm pytest' | wc -l` reads 1 with a venv pytest running
      and 0 when it is gone. Re-take SS8.2's four rival-pytest cells with it and
      re-write the positive-control paragraph with the trace it actually produces
      (including the 0 that the old pattern returns WITH a pytest running, which
      is the strongest sentence available here). The prescription in main's
      meta/kanban/config.yml needs the same correction, after which SS6 is
      re-extracted and names the new commit. Nothing else in the document moves.

  - id: F-202
    severity: major
    title: >-
      The round's own correction of F-005 ships a wrong DOMAIN into a standing
      docstring - no analysis in that test is over the real module, and the 0-2
      group's texts are not small
    file: tests/test_book_export_interior_cover.py
    line: 6333
    also_at: ["meta/profiling/card-292-per-test-ceiling.md:183"]
    gating: true
    confidence: certain
    evidence: |
      What ships, at tests/test_book_export_interior_cover.py:6331-6336:
        "``_page_positions`` makes **716** such calls per analysis of the
         unplanted **390,485-byte (381 KiB)** module, and the door-axis controls
         run **108** analyses in one test -- but **25,873** calls in total,
         measured, which is NOT 716 x 108: counted per analysis, **36** of the
         108 are over the real module (716-721 calls each, 99.9 % of all the
         calls) and the other **72** are over the small planted texts, at 0-2
         calls each."
      and the same table in the document at lines 182-184.
      THE COUNTS ARE EXACTLY RIGHT. I instrumented the test with my own shim over
      `_source_segment`, wrapping `_page_positions` to attribute calls per
      analysis:
        wall 27.99s  analyses 108  door calls 25873  mean 239.6
        call-count distribution: [(0, 53), (1, 17), (2, 2), (716, 1), (717, 13),
                                  (718, 8), (719, 10), (720, 3), (721, 1)]
        analyses with >100 calls: 36  range 716-721  sum 25852 (99.9%)
        analyses with <=100 calls: 72  range 0-2  sum 21
      THE ATTRIBUTION IS WRONG, on both halves. Capturing the `source` argument
      of `_page_positions` itself (signature
      `(cls, source=None, doors=None, follow_terms=False, door_arms=None,
      callee_exemptions=None)`):
        planted text: 108 analyses, calls 0-721, sum 25873 (100.0%)
        distinct planted source lengths: 32, range 389122 .. 389385
        analyses that saw the EXACT real source (389,177 chars): 0
      * NONE of the 108 analyses is over the real module. Every one is over a
        planted text, because the test's only door is
        `self._outcome(self._plant(body, extra), door_arms=...)`, and `_plant`
        returns `source.replace(cls.DERIVED_POSITION, body) + extra` - the whole
        module with three lines swapped, plus an appended tail.
      * The 72 are NOT over "small planted texts". Their texts are the same
        ~389,000 characters as the other 36. They make 0-2 calls because the arm
        or exemption under test has been REMOVED, so the walk anchors almost
        nothing - the discriminator is `door_arms`, not text size.
      The document contradicts itself on this without any measurement at all: an
      analysis "over the real module" cannot produce 721 calls, because the real
      module produces exactly 716 - which is the figure in the preceding sentence
      of the same docstring, and which I reproduced:
        $ CLS._page_positions()        # source=None, the real module
          segment() door calls       716
          of those, located          649
          unlocated (early return)   67
      Why gating: this is a mechanism claim, shipped into tests/ where no mutant
      can catch it (the AST-equality proof means it is pure prose), stating a
      domain the code does not have - on a card whose headline defect was an
      instrument's domain leaking into a figure, in the very passage written to
      correct a domain defect. It is cycle 1's F-002 shape exactly: a claim the
      card's own code refutes, in the version a future reader finds first. The
      conclusion it supports - "a per-analysis figure may not be multiplied by
      the analysis count" - survives untouched and is correct; only the reason
      given for it is wrong, and the true reason is more interesting.
    remedy: >-
      One sentence in each of the two places. Something the measurement supports:
      "all 108 analyses are over PLANTED texts (the module's own ~389,000
      characters with three lines swapped, 32 distinct lengths); 36 of them run
