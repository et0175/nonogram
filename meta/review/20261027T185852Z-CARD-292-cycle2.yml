judgement_on_the_f008_decline:
  verdict: >-
    HONEST, and the consequence is correctly stated. This is a declared bound,
    not a hole wearing a declaration.
  why: >-
    The decline states the hole in the sharpest available terms - "the memo's
    EXISTENCE is guarded ... its USE at the one hot call site is not, so this
    file's cost can return to SS3.2's 113 s with no cell firing anywhere in the
    suite" - names the two cold stdlib sites a control would have to discriminate
    (1438 and 2913, which I verified are the only two remaining
    `ast.get_source_segment` call sites outside the equivalence class), and gives
    two reasons that are both true rather than rhetorical. I tested both halves
    of the consequence rather than reading them: M1 kills on the exact named cell
    with the exact named figure (assert 9816 == 1), and M10 leaves the memo's
    whole guard class green (5 passed) and the split-count cell green, because
    that cell calls `_source_segment` directly and never goes through the hot
    call site. The second reason for declining is also mechanically true: an AST
    assertion that `segment()` resolves to `_source_segment` WOULD red on M10, so
    SS8.1's row - the one cycle 1 independently reproduced - would stop describing
    the tree. A fix round over figures changing what the tree asserts is the thing
    this board's max_cycles rule exists to prevent. The only thing missing is an
    owner for the deferred control, which is F-203 and is a minor.
