verdict: >-
  NOT CERTIFIED (7 of 10, threshold 8). Fix round 1 is good, careful work and
  most of it holds under independent re-derivation: eight of cycle 1's ten
  findings are CLOSED and I re-derived the load-bearing figure in each of them
  myself, usually through a different door than the card used. The AST-equality
  declaration - that the whole test-tree change is comments and docstrings - is
  TRUE and I reproduced it independently. P1's declared survival is TRUE and its
  stated consequence is the real one. P2's declared kill is TRUE in both named
  cells. The F-008 decline is honest and its consequence is correctly stated.
  It is not certified because the round introduced two new findings in the one
  class this board gates on, and both are in the class this card exists to
  police - an instrument's domain leaking into a figure. F-201: the replacement
  rival-pytest instrument, `pgrep -f 'bin/python -m pytest' | wc -l`, CANNOT SEE
  a venv-launched pytest on this box - it reads 0 whether or not a rival is
  running - and the round's newly added positive control, "1 taken deliberately
  while SS8.2's own run was in flight ... the cell can rise, and it rose", is a
  reading that command cannot have produced here. That is cycle 1's F-001 in a
  new spelling, inside AC-6's own demonstrated instance, so AC-6 is STILL NOT
  MET. F-202: the round's own correction of F-005 ships a wrong DOMAIN into a
  standing docstring - all 108 analyses of the dear test are over planted
  ~389k-character texts, none is over the real module, and the 0-2 group's texts
  are not small; the counts are exactly right and the attribution is not. Both
  are prose, both are cheap, and neither moves a conclusion.

