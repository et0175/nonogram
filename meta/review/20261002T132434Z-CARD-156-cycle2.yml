  - id: F-007
    severity: low
    category: tech-debt
    type: risk
    file: tests/conftest.py
    line: 304
    title: "DROP SCHEMA public resets schema ownership/ACL and needs schema ownership"
    description: |
      The old fixture needed only table ownership; DROP SCHEMA public CASCADE + CREATE SCHEMA public
      needs ownership of public (pg_database_owner on PG15+) and recreates it owned by the
      connecting role, without the original default grants. A contributor whose test role owns the
      tables but not the database gets a hard fixture error, and a second role sharing nonogram_test
      loses access to the recreated schema. Works on this machine for both omelnikova and postgres.
    suggestion: |
      Document the requirement (test role must own nonogram_test), or drop the tables/types
      owned by the role (DROP OWNED BY CURRENT_USER) instead of the schema.
    confidence: medium
    source: static
