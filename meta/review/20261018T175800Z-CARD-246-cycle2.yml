summary: >
  The fix is real and it is structural rather than symptomatic. The invariant the card now
  names is carried by mechanisms I could not get round: the turn's drop path, the
  BOARD_CHANGE announcement and the single-flight guards each die to a mutant of their own
  (M1, M2, M3, M6, M7), Approve's capture dies to cycle 1's surviving M4 (now M12), the
  booked 409's wire reason dies to M9, `code: 0`'s save sentence dies to M8, edit mode's
  NO_SAVE now dies to BOTH localStorage tests (M13, F-006 closed as asked), the EDIT MODE
  contract's branch count dies to a sixth read (M15), one spelling of "editable" dies to
  truthiness (M14), and the rebuilt G-2 guard dies to cycle 1's surviving second renderer
  (M10). All five cycle-1 importants are closed, each with a test that fails when its
  mechanism alone is removed. The four server changes are earned, CARD-245's suite is
  untouched and still meaningful, and the player is not regressed (161 green, six-key
  payload, byte-identical key order).
  Two things keep this from a clean sweep. The first is a new important of exactly cycle
  1's F-003 shape, one branch over: `{storing: true}` is threaded into `refusalText` but
  consulted ONLY in the `code === 0` branch, so a save whose answer the page cannot read
  states "Nothing was stored" while the store has in fact written. I demonstrated it — the
  POST reached the panel, the werkzeug log shows 200, the store holds the edited grid, and
  the page says "Nothing was stored. The panel answered with 200 ... press Save to try
  again." A 502 says the same. That is the one claim the card's own invariant forbids.
  The second is that the disclosed survivor is only half the story: removing `tell`'s
  offer-clearing side effect (M4) ALSO survives all 65 tests, so the double-Approve
  property rests on two mechanisms of which neither is pinned alone and only the pair is.
  That is genuine defence in depth — both branches are taken on every Approve — but the
  disclosure named one half and not the other, and one test that reads the bar while
  "Storing this grid..." is up would close it.

findings:
  - id: G-001
    severity: important
    file: src/nonogram/admin/static/puzzle_edit.js
    line: 158
    claim: >
      A save whose answer the page cannot read makes the page say "Nothing was stored" when
      the store has written. `refusalText` takes `{storing}` but reads it only inside the
      `code === 0` branch; every other branch, the catch-all included, asserts "Nothing was
      stored" unconditionally. On a save that is knowable for 404/409/422 (CARD-245's own
      refusals never write) and NOT knowable for a 200 whose body will not parse or for any
      5xx — the two cases the fix's own correction 2 says are reachable.
    evidence: >
      Demonstrated in Chromium (temporary probe, since deleted). The Approve request was let
      through to the panel with `route.fetch()` and only its ANSWER replaced with a 200
      carrying `text/html`; the werkzeug log shows `POST /puzzle/<id>/edit 200`, the store
      holds the EDITED grid, and the message reads "Nothing was stored. The panel answered
      with 200, which this page does not know how to act on - press Save to try again." With
      the answer replaced by a 502 the message is the same sentence with 502 in it. No
      pageerror either time. The store is not corrupted — this is words-only — but it is the
      one thing THE INVARIANT says the page may never do ("never state a store state it has
      not been told"), and the owner's next act on that sentence is to press Save again,
      which costs a second solve and a second stamp.
      Reachability is not hypothetical for a panel behind a proxy: a gateway that times out
      after the app committed returns exactly a 5xx the page then narrates as "nothing was
      stored".
    suggested_fix: >
      Make `storing` govern the claim rather than one branch: on a save, say "whether it was
      stored is not known here - reload" for `code === 0`, for a 200/2xx whose body did not
      parse, and for any code the page has no refusal for (>= 500 and the catch-all), and
      keep the definite "nothing was stored" only for the three codes CARD-245 emits without
      writing. Pin it with two route.fulfill tests (an unreadable 200 and a 502) asserting
      "not known" and the absence of "Nothing was stored".

  - id: G-002
    severity: minor
    file: tests/test_puzzle_editor_ui.py
    line: 1456
    claim: >
      The double-Approve property is pinned only as a pair. The fix disclosed that removing
      the single-flight guard from `onApprove` alone survives; removing the OTHER half — the
      offer-clearing in `tell("Storing this grid...")` — also survives all 65 tests. So
      neither mechanism is individually pinned, and the fix's stated reason for keeping the
      guard ("so a reader need not reason about tell's side effect") leaves tell's side
      effect itself unguarded by any test.
    evidence: >
      M4 (`tell("Storing this grid...")` -> `tell("Storing this grid...", grid)`, i.e. the
      offer survives the sentence) : 65 passed, exit 0. M5 (the disclosed one: the
      `inFlight !== null` term dropped from onApprove's guard) : 65 passed, exit 0. M6 (both
      at once) : 1 failed — test_a_second_approve_pressed_in_flight_is_not_sent_either.
      Mutants restored; git diff clean.
      Not the sibling card's "unreachable disjunct" shape: both branches ARE taken on every
      Approve, and the guard is what makes the guarantee local to this file rather than
      borrowed from CARD-245's "a verification is not consumed by a save" (cycle 1's F-011).
    suggested_fix: >
      One assertion inside test_a_second_approve_pressed_in_flight_is_not_sent_either, using
      the _WATCH_BAR observer already in the file: no recorded state whose text contains
      "Storing this grid" has `offered` true. That kills M4 and leaves the guard as the only
      unpinned half, which is the honest state for a redundancy kept for readers.

  - id: G-003
    severity: minor
    file: src/nonogram/admin/static/solver.js
    line: 757
    claim: >
      `getBoard()` returns the DISPLAYED board, which during an uncommitted drag is the
      preview — and `BOARD_CHANGE` is dispatched from `commit()`, not from `show()`. So there
      is a window in which the board on screen is not the grid whose grade is on offer and no
      announcement has fired. Harmless as the code stands (Approve sends the captured grid,
      and the drag's own commit announces at pointerup), but it is the one hole in "the board
      announces its own changes", and it means Save pressed mid-drag verifies a grid that was
      never recorded.
    evidence: >
      Read off the code: `show(next) { board = next; ... }` with `getBoard: () => board`,
      against the dispatch sitting in `player.commit`. The two `player.show(...)` reverts
      (beginPinch, pointerup/cancel) restore `history.board`, so the divergence is bounded by
      the gesture. Reachable with two pointers on a touch device (one finger dragging, one
      tapping Save or Approve).
      This is also what makes F-004's capture-phase test pin a REAL property rather than an
      unreachable path — see the adjudication in the prose report.
    suggested_fix: >
      Nothing in this card. Either document the window in BOARD CHANGE (it already documents
      the deliberate silence of `show`, without noting that `getBoard` sees it), or have
      `onSave`/`onApprove` read the recorded board. A line of documentation is enough.

