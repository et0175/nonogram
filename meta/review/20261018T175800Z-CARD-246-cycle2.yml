server_changes:
  reason_on_refusals: earned - the minimum the client needs to give the booked 409 words that can succeed; branching on prose is not a contract. CARD-245's two test files are byte-identical to the base and still meaningful (status + ok + message substrings, all additive-safe; no exact-body assertion anywhere). Pinned by M9.
  puzzle_is_editable_and_editable: earned - F-010's own fix, one answer for three surfaces, pinned by M14 across control, payload and route with book_id "". Nit only: the template global reaches a private classmethod (`PuzzleReviewService._holds_a_book`) from the app layer, which matches the existing `_as_readable_grid` usage.
  board_page_payload: earned - F-015's own fix, and it preserves the player's six keys AND their order, so the player page's embedded JSON is byte-identical.
  tier_label_dropped_from_the_editor_route: earned - F-008's fix; the route never needed it once the page carries no badge.

corrections_adjudicated:
  f004_suggested_fix_not_implementable: "the fix is right, and more right than it claims - the suppressed state is reachable in production (getBoard() returns the drag PREVIEW, and BOARD_CHANGE fires from commit(), not show()), so the capture-phase test pins a real property rather than propping up an unreachable path. M12 kills."
  f003_fallback_was_reachable: "the fix is right, and the correction matters more than it says: that reachable branch is exactly where G-001 lives."
  f001_disable_save_is_the_wrong_mechanism: "the fix is right - `disabled` drops focus to the document mid-flow and leaves the button out of the tab order (G-4, CARD-211). The guard, not the attribute, prevents the second request, which M7 and M6 prove."
  f010_three_spellings_of_two_questions: "partly right and the fix is still the better answer - the narrowing is fair (both page-side spellings also tested status != 'in_book'), but the demonstrated book_id=\"\" case stands and is now pinned. Cycle 1 overstated the breadth, not the defect."

product_decisions:
  f008_no_tier_badge: "right. A badge is a claim about a stored grid on the page where that grid is being rewritten; cycle 1 demonstrated it still reading HARD after an easy grid had been stored. The grade is now said twice where it is true - from the solve, then from the row the store wrote - and the save bar is where the owner's eyes already are, because they just pressed Save. Residual loss: the pre-edit difficulty is no longer visible anywhere on the page, so a before/after comparison is gone. That is one line if the owner misses it, and it belongs in a card with a render."
  f012_gutters_not_dimmed: "the deferral is accepted - dimming a shared renderer's gutters is a visual change that wants an eyeball on a real board, which is the house rule. The relocation itself is unpinned (G-006)."
  f014_local_declaration: "adequate, and the stated cost checks out (test_browser_fixture_scope.py:997 ties _family_files() to set(PAGE_ISOLATION), and line 868 feeds the same glob to the collection-drift baseline). Residual is a backlog line, not code (G-010)."

