ac_coverage:
  AC-1: covered - list row (server, with a control that can fail) and detail-modal card (browser), both reaching the editor of that very puzzle, plus the link's own id test. The card's control now reads the server's `editable` rather than re-deriving it.
  AC-2: covered - payload at the stored extent, a 12-case seeded corpus, the drawn cells, and the clues re-encoded through the one encoder.
  AC-3: covered, now including the edge cycle 1 found open. A stroke after the grade withdraws the offer and says so (M3 kills three tests), a stroke during the check drops the grade (M1, M2), and the next Save stores the stroke.
  AC-4: covered - Cancel stores nothing, keeps the board, hides Approve, and the edit is provably still saveable afterwards. (Cancel mid-flight is latent only; G-008.)
  AC-5: covered except one branch. The sequential refusal, the non-unique refusal arriving on top of a live Approve, the booked 409's own words, the undecided refusal and a dropped connection are all pinned in words with pageerror listeners installed. What is NOT right is a save whose answer cannot be read: the page says "Nothing was stored" when the store wrote (G-001).
  AC-6: covered and unchanged - the refusal names the cells 1-based, sends nothing, rests on answerOfBoard returning grid null, and the narrowing is asserted separately as not being the guarantee.
  AC-7: covered in four halves - control absent on the list, absent on the card, GET /editor refused 409, both POSTs refused - plus the falsy-but-present book_id case across control, payload and route (M14 kills it).
guardrail_coverage:
  G-1: genuinely covered, and stronger than cycle 1. Both localStorage tests now fail on M13 (F-006 closed); the player's payload is exactly six keys AND the same key order (`mode` is inserted into a separate literal before the update, so the embedded JSON is byte-identical); 161 player tests green; one read of payload.mode and five reads of `editing`, counted by a test that M15 kills.
  G-2: covered in substance and the guard is now real over its declared domain - the page's script set is asserted exactly, "builds grid nodes" is asked of each script by three routes, and the predicate is asserted to match solver.js so a page that draws nothing cannot satisfy it. M10 (cycle 1's survivor) dies. Residual: a div/innerHTML renderer inside puzzle_edit.js survives (G-004).
  G-3: genuinely covered by the stubbed grade and the stubbed 422; the file-text test beside them now names its survivor in its own docstring (F-013 closed as documentation, G-6 respected).
  G-4: covered - role="status" always present, buttons outside the region, accessible names carry the visible text, the whole flow driven from the keyboard, Approve from the keyboard commits, and the in-flight state announced with aria-disabled rather than `disabled` (which would drop focus mid-flow). pageerror listeners are now installed in five tests, which is F-003's missing instrument.
  G-5: covered - no http(s) and no inline style in the template, no new dependency, baseline test named as survivor.
  G-6: respected - no test retired; the two weak tests cycle 1 flagged are kept with their survivors named in their docstrings.

