findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/admin/templates/batch_status.html
    line: 144
    title: "Random-mode quality_score=None renders as literal 'Quality: None'/'0/100' in two display templates AC-2 didn't reach"
    description: |
      AC-2 requires that if quality_score/recognizability are set to None for
      random-mode puzzles, "the UI [is] updated to match" so it stops implying
      a guarantee that doesn't hold. The implementer updated the one template
      that renders the quality *filter* form (batch_create.html) but left two
      *display* templates unguarded against the new None value this diff
      introduces for the first time in this field's history:
        - batch_status.html:144 — `<span class="quality-badge">Quality:
          {{ puzzle.quality_score }}</span>` renders the literal string
          "Quality: None" for every random-mode puzzle (verified: puzzles here
          are dicts from batch_gen.get_batch_puzzles(), and Jinja's `.`
          accessor falls back to dict getitem, so `puzzle.quality_score` is
          `None` and renders as Python's str(None)).
        - generated_puzzles.html:65 — `{{ (puzzle.get('quality_score', 0)|int)
          }}/100` renders "0/100": `.get('quality_score', 0)` returns the
          *stored* None (the default only applies when the key is absent, not
          when its value is None), and Jinja's `int` filter then catches the
          `int(None)` TypeError and substitutes its own default (0) — so a
          random-mode puzzle now visibly displays as the worst possible
          quality score, which is more actively misleading than the old
          hardcoded-75 behavior it replaces, not neutral.
      Both facts were independently verified against the code (not merely
      taken from the implementer's own worktree-notes disclosure, though that
      disclosure is accurate): grep confirms puzzle_review returns dicts with
      quality_score literally None for source="random", and both templates
      were read directly. Two sibling templates (puzzles_list.html:160/325,
      book_select_puzzles.html:125) already guard with `or 'N/A'`/`|| 'N/A'`
      and render correctly — showing the fix pattern was already known and
      applied elsewhere in the same template set, just not to these two.
      This is a real, diff-caused regression (before this card, quality_score
      was never None, so these two templates never rendered "None"/"0/100"
      for it) reachable through ordinary admin usage (viewing any random-mode
      batch's status or generated-puzzles page), not a pre-existing gap the
      diff merely failed to clean up.
    suggestion: |
      Apply the same guard already used in puzzles_list.html/book_select_puzzles.html:
      batch_status.html:144 → `Quality: {{ puzzle.quality_score if puzzle.quality_score is not none else 'N/A' }}`
      generated_puzzles.html:65 → `{{ puzzle.get('quality_score') is not none and (puzzle.get('quality_score')|int) or 'N/A' }}/100`
      (or equivalent None-safe Jinja). Two-line fix, no scope creep beyond what AC-2 already asks for.
    confidence: high
    source: static
