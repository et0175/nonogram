  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 369
    title: "PILImage.open(image.file_path) is never explicitly closed"
    description: |
      `original_image = PILImage.open(image.file_path)` is not used as a
      context manager and `original_image.close()` is never called. On
      CPython, refcounting will typically release the file handle promptly
      once the local variable is reassigned on the next loop iteration or the
      function returns, so the practical risk is low, but it is not
      exception-safe or portable to a non-refcounting interpreter, and a
      large image batch briefly holds one extra fd per image longer than
      necessary. app.py is a high-churn/high-defect-density file (67
      commits/12mo, 39 fix-like), which raises the cost of latent resource
      bugs there.
    suggestion: "Use `with PILImage.open(image.file_path) as original_image:` wrapping the measure_quality() call."
    confidence: medium
    source: static
