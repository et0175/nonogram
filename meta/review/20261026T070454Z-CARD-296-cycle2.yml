findings:
  - id: N-1
    severity: major
    title: >-
      MAX_PATH_POINTS cannot close the polyline route — a triangle fan and an
      ``re`` staircase each draw a disc with 264/264 green, and the bound has no
      headroom to tighten
    file: tests/test_book_guide_page_vector.py
    line: 1073
    gating: true
    confidence: high
    evidence: >-
      This is F-1 reopened by the cheapest spelling, with the structural reason
      the mechanism cannot work. A per-SUBPATH vertex bound asks "how many points
      in one path?"; a polygon approximation of a disc does not need one long
      path. MEASURED, both plants restored and sha256-verified: (1) 32 filled
      triangles fanned from the centre, one subpath each of ``m``+2x``l``+``h``+
      ``f`` = 3 points → three touched files **264 passed**, with
      ``subpath_vertices`` reporting max = 3 on the page that carries the plant,
      so ``max(points) <= 4`` passes and
      ``test_the_longest_path_the_page_writes_is_the_arrow_head`` still reads
      exactly 3; (2) 24 filled axis-aligned ``re`` bands whose half-widths come
      from the circle equation → **264 passed**, because ``subpath_vertices``
      counts only ``m``/``l``/``c`` and never sees an ``re``. The bound has ZERO
      headroom: the page's own arrow head is 3 points and a triangle is 3 points,
      so no value of MAX_PATH_POINTS admits the page and refuses a disc. The pair
      of assertions is also internally redundant in the restrictive direction —
      ``== ARROW_HEAD_POINTS`` (3) is strictly stronger than ``<= MAX_PATH_POINTS``
      (4), so the named bound never binds. The same weakness is inherited by
      ``MAX_FLAT_VERTICES = 4`` in the merged Pillow guard, whose own comment says
      "the one real call has three (an arrow head)": a ``draw.polygon`` triangle
      fan clears it too. That is pre-existing and out of this card's scope, but it
      is the precedent the round cited as proof the mechanism works, so it is
      worth recording that the precedent has the same hole.
    remedy: >-
      Route (a) is not available with this instrument; choose one of three and say
      which. (i) Change what is counted: a ``paint`` operator that fills, plus a
      count of CONSECUTIVE filled subpaths sharing a vertex, catches a fan — or
      simpler, bound the number of filled subpaths a diagram writes at all (the
      guide writes none today, so "no fill operator outside the vocabulary's own
      rectangle route" is assertable and non-vacuous). (ii) Measure the ink, which
      is CARD-241's instrument and is spelling-independent: render the page and
      hold the inked region's shape, which is what the raster side already does.
      (iii) Take route (b) after all — restate the tripwire as "no Bézier", carry
      the polygon-approximation route as a NAMED LIMIT with CARD-298 as owner, and
      delete the four sentences that assert a closure. (iii) is cheap and honest;
      what must not survive another cycle is the sentence "there is no operator
      left in this vocabulary that inks a round shape".
    disposition: open

