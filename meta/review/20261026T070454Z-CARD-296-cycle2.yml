  - id: N-3
    severity: major
    title: >-
      A Pillow call still wears the ``stream`` name through a third spelling, and
      the round declared that spelling harmless on reasoning it had just
      disproved
    file: tests/test_book_difficulty_dots.py
    line: 1107
    gating: true
    confidence: high
    evidence: >-
