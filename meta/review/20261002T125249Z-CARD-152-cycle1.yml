    file: scripts/README.md
    line: 15
    title: "README claims all three checks verify host, port and credentials; the Docker branches check only the name"
    description: |
      The new Prerequisites text says each script "checks that the database it names is
      reachable — host, port, credentials and name". In all three scripts the first two
      branches are `docker exec nonogram-postgres psql -U postgres -d "$DB_NAME"` and
      `docker-compose exec postgres psql -U postgres -d "$DB_NAME"`
      (setup_admin_local.sh:104-106, run_admin_tests.sh:181-183): they discard the URL's
      host, port and credentials. With a local container holding a database of the same
      name, an exported URL pointing at another host/port/user passes the check. This is
      the known-open F-005 (CARD-151 "Out of scope"), so the code is fine for this card,
      but the card's "What to do" step 3 requires every README claim about the three
      scripts to be true, and this one is false on two of three branches.
    suggestion: |
      Qualify the sentence: host, port and credentials are checked on the local psql
      branch; the Docker / Compose branches check only that the named database exists in
      the container (F-005, backlog). Optionally add the qualifier to the Troubleshooting
      section too.
    confidence: high
