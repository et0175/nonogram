    category: tech-debt
    type: gap
    file: scripts/README.md
    line: 81
    title: "'After setup' snippet still unconditionally exports nonogram_poc"
    description: |
      The rewritten comment says "The same URL setup used: the project default below, or
      your own exported DATABASE_URL", but the next line is an unconditional
      `export DATABASE_URL=".../nonogram_poc"`. A user who exported nonogram_dev, ran
      setup, then pasted this block would start Flask against a different database from
      the one setup migrated, which is the defect class this card removes from the scripts.
    suggestion: |
      Use `export DATABASE_URL="${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/nonogram_poc}"`,
      or say "skip this line if you exported your own".
