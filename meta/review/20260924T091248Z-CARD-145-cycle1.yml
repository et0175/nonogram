findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_memory.py
    line: 118
    title: "PEAK_CAP_IN_PAGES = 2 is one page bitmap too loose — the load-bearing `del page` is untested"
    description: |
      Mutation-verified during this review. Replacing `del page` with `pass` at
      src/nonogram/admin/book_pdf_generator.py:1748 (the writer's loop) doubles the
      measured peak from 1.00 to 2.00 page bitmaps (25.2 MB -> 50.5 MB per export,
      measured on a 51-page book with the module's own `_measured`/`LivePageBytes`
      probe) and ALL 22 tests in tests/test_book_pdf_memory.py still pass.

      Both memory assertions let it through:
        * `test_neither_book_holds_more_than_the_cap` / `test_its_peak_page_memory_is_under_the_cap`
          assert `peak <= 2 * PAGE_BITMAP_BYTES`, and 2.00 satisfies that;
        * `test_a_big_books_peak_is_a_small_books_peak` asserts only that the peak does
          not GROW with the page count — a constant 2-page peak grows by zero.

      This is exactly the property the card's own STRUCTURE note calls "load-bearing,
      not style … the difference between a peak of 1.00 and 2.00 page bitmaps", and the
      property it explicitly hands to CARD-128 ("Nothing may bind a page to a local
      across a `yield`"). CARD-128 is scheduled next and restructures the same producer.

      The docstring's justification for 2 is also wrong: `LivePageBytes.track` samples
      inside itself, before the consumer has received the page, and the previous page
      has already been released by then — which is why the measured value is exactly
      1.00 on both corpora and on `export_book`.
    suggestion: |
      Assert the level, not just the shape: on both `small_export` and `corpus_export`,
      `assert probe.peak == PAGE_BITMAP_BYTES` (equivalently `peak_in_pages == 1.0`).
      Keep `PEAK_CAP_IN_PAGES = 2` as the outer safety bound for the `_write_page`
      convert-to-RGB path if you want, but the tight assertion is what makes the card's
      own invariant enforceable for CARD-128. Correct the constant's docstring: the
      sample is taken before hand-off, so one page is the honest figure.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

