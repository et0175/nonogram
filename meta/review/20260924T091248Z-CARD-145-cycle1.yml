  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_pdf_memory.py
    line: 462
    title: "The font-fingerprint skip throws away six font-independent pages with the two lettered ones"
    description: |
      The `baseline` fixture skips the whole AC-3 class when `font_fingerprint()`
      differs from the recorded one. Only interior pages 1 (guide) and 5 (SOLUTIONS
      divider) depend on the system face — book_pdf_generator.py:914-918 and 959-961 are
      the only `/System/Library/Fonts/Arial.ttf` calls on an interior page; puzzle pages
      and answer pages letter from `_band_font` (packaged font data) and
      `ImageFont.load_default`. So on any machine without that path — including this
      project's own Linux deployment image (Dockerfile/render.yaml) — G-1's pixel
      evidence for six of eight pages vanishes into a skip.

      Mitigating: the skip is loud rather than silent, and the repo has no CI today
      (no .github/workflows, no ci/), so the suite only ever runs here. That is why this
      is Minor and not Important — but it is the kind of latent hole that becomes real
      the day the suite runs anywhere else.

      Secondary: `font_fingerprint()` probes only size 48, while the guide page also
      uses 28 and the divider 60, so the fingerprint is a narrower proof of sameness
      than it reads as.
    suggestion: |
      Record the font-dependent page indices in the fixture (e.g. "font_dependent": [1, 5])
      and compare every other page unconditionally, skipping only those two on a
      fingerprint mismatch. Optionally fold the 28 px and 60 px renderings into the
      fingerprint.
