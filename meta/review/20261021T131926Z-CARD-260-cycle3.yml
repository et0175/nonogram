  - id: F-304
    severity: low
    category: tech-debt
    type: gap
    file: tests/kill_matrix.py
    line: 795
    title: "KillMatrix.figure()'s own docstring contradicts itself in one sentence (\"the grid is identical in all three\")"
    description: |
      New in the cycle-2 fix (part 2). The docstring reads: "A mutant's cells can be FAIL-free for
      three different reasons, and the grid is identical in all three: nothing ran (`0 reached`),
      the kill was expressed outside this matrix's domain ... (`exit 1` with arms reached and none
      FAIL), or the arms genuinely survived (`exit 0`)."

      The sentence refutes itself: it separates case 1 from case 2 BY THE REACHED COUNT, and the
      reached count is derived from the cells (`denominator - len(not_reached)`), i.e. from the
      grid. Case 1's column is all-NOT-REACHED; case 3's column equals SHIPPED's, which the new
      `reached == 0` gate guarantees has at least one reached arm — so the two grids are not
      identical. What is true, and what the card's own fix note says, is narrower: cases 2 and 3
      are cell-for-cell identical, which is exactly what
      `test_g1_a_kill_outside_the_matrix_domain_is_attributable_in_the_figure` demonstrates
      (MESSAGE-ROT vs RAISE-WRONG-TYPE). The mechanism is sound and controlled (mutant M2 killed);
      only the sentence overreaches.

      Raised because this card's standard is its own ("Any sentence it prints is a claim"), and
      because an overstated motivation is how F-201 started. It is NOT a repeat of F-201's
      species: nothing is justified by this clause — it does not reject an alternative, and the
      alternative it would have supported (carry the distinction in the figure) is what shipped.
      This is the ONLY finding this cycle attributable to the cycle-2 fix, and it is non-gating.
    suggestion: |
      Narrow to what is measured: "...and the grid cannot say which: cases 2 and 3 are
      cell-for-cell identical (demonstrated by
      test_g1_a_kill_outside_the_matrix_domain_is_attributable_in_the_figure), and case 1's
      column of NOT-REACHED is indistinguishable from the arms a targeted selection legitimately
      never ran."
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: 'fix round 4 (escalation remedy) -- confirmed by the cycle-4 review, mutation-verified'
    dismissed_reason: null
    learned_pattern: null

