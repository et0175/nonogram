  sentence: "Each fix declares a boundary, and the next cycle finds a shape inside it."
  attributable_to_cycle2_fix: ["F-304 (Minor, non-gating)"]
  streak_after: 1
  verdict: |
    The streak does NOT reach 2 and the family trigger does NOT fire. Attribution was done
    mechanically, with `git show HEAD:<file>` against the working tree, not by proximity:
      * F-301's code and its README claim are ABSENT at HEAD f9718739 and present now, and
        cycle 2's own report attributes them to the CYCLE-1 fix (F-003's resolution, which it
        quoted approvingly without checking for a control). New in the cycle-1 fix, not the
        cycle-2 fix.
      * F-302's two refusals are PRESENT AT HEAD (original implementation), so they predate
        every fix round.
      * F-303 is original implementation (HEAD) plus a git-history signal.
      * F-304 IS new in the cycle-2 fix — and it is Minor and non-gating, so it is not "a
        gating finding attributable to the cycle-2 fix".
    The honest shape of this cycle is therefore one cycle LATE rather than one more turn of the
    family: cycle 3 found a shape inside a boundary the CYCLE-1 fix declared, which cycle 2
    reviewed and endorsed. That is a review-coverage observation about cycle 2, not a new
    instance of the fix-declares-boundary loop, and the orchestrator should classify it as such
    rather than as streak 2.

escalation_note: |
  This is cycle 3 of 3 and F-301 (Important) stands, so the severity gate closes the success
  path and the card cannot merge on this review. Per the cycle brief that means escalation
  rather than another round — but NOT on the family trigger (see `family` above). The remedy is
  one test, in a fixture that already exists, in the file the card already owns.

