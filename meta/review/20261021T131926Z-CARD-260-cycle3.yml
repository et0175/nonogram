    category: tech-debt
    type: risk
    file: tests/test_kill_matrix.py
    line: 1833
    title: "AC-7 anchor 1 pins 130/41 against a live, actively-changing file with a bare assert and no drift message"
    description: |
      `assert _independent_assert_count(LOCK_GUARD_TEST) == 130` (:1833) and
      `assert matrix.collected_tests == 41` pin figures against tests/test_full_suite_lock.py as
      it is on disk, not at the `ddb1731b` the docstring names. The pin is correct today — I
      checked: `git diff ddb1731b HEAD -- tests/test_full_suite_lock.py` is EMPTY, as is
