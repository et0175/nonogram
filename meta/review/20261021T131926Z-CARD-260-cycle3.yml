findings:
  - id: F-301
    severity: high
    category: tech-debt
    type: gap
    file: tests/kill_matrix.py
    line: 1341
    title: "The off-key refusal has no control that can fail — removing it leaves all 66 tests green"
    description: |
      `_measure` refuses a reading whose records name an assert `lineno` the matrix has no cell
      for (tests/kill_matrix.py:1341-1348), and tests/README.md:523 publishes that refusal to a
      consumer: "a reading that records an assert `lineno` the matrix has **no cell for** | the
      file that ran is not the file the keys came from; each such record is a real execution
      attributed to nothing". Nothing exercises it.

      PROVEN, not inferred — mutant M10: `off_key = sorted(set(records) - set(linenos))` ->
      `off_key = []`, so the refusal can never fire. `pytest tests/test_kill_matrix.py -q` ->
      66 passed. The mutant SURVIVES. Corroborated statically: the refusal's own message
      fragments ("recorded assert lineno", "attributed to nothing") appear nowhere in
      tests/test_kill_matrix.py, and no test matches it with pytest.raises.

      The near-miss makes the gap sharper, not softer.
      `test_ac1_the_planted_shifting_mutant_runs_green_and_reports_nothing`
      (tests/test_kill_matrix.py:249-288) constructs EXACTLY the off-key condition — it writes a
      line-deleting mutant past `apply_edit` and asserts `not set(records) & set(linenos)` — and
      then routes around `_measure`, calling `runner._pytest(...)` and re-deriving the cells by
      hand with `km.aggregate_any_red(...)`. So the "missed WITHOUT" half of R1's pair exists and
      the "caught WITH" half does not.

      ADR-0039/R1 is this card's own declared subject ("This card is about ADR-0039/R1", card
      `## Worktree notes`) and its clause is literal: "A claim whose control cannot fail is
      narrative, not coverage, and must be narrowed to what is measured or deleted." A refusal
      that can be deleted without reddening anything is the strongest form of that defect, inside
      the instrument built to detect exactly it.

      ATTRIBUTION, mechanical: `grep -c off_key` is 0 in `git show HEAD:tests/kill_matrix.py` and
      3 in the working tree, and the README row is absent from `git show HEAD:tests/README.md` —
      so the refusal and its claim are NEW IN A FIX ROUND, and cycle 2's own report attributes
      them to the CYCLE-1 fix (F-003's resolution, quoted there as "_measure adds the off-key
      refusal `set(records) - set(linenos)` (kill_matrix.py:1243)"). It is NOT new in the
      cycle-2 fix. Cycle 2 cited this mechanism approvingly as F-003's resolution without
      checking whether it had a control.
    suggestion: |
      One change, either direction — R1 offers both:
      (a) give it the control, which costs almost nothing because the fixture already exists:
          in `test_ac1_the_planted_shifting_mutant_runs_green_and_reports_nothing`, after the
          existing `_pytest` block asserts the off-key shape, call
          `runner._measure("SHIFTED", Pass.RECORDING, len(linenos), pristine)` on the same
          shifted file inside `pytest.raises(MutantRefused, match="no cell for")`, and assert
          the "missed WITHOUT" half stays as it is (the hand-aggregated all-NOT-REACHED reading)
          so both sides of R1's pair are in one test; or
      (b) delete the refusal and say in README's refusal table that
          `_refuse_unless_topology_holds` owns that claim — but only after measuring that it
          does, which (a) is cheaper than.
      Do NOT also add a new predicate or a fifth cell outcome: the family's shape on this card is
      position standing in for a cause, and this finding asks for a control, not a mechanism.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: 'fix round 4 (escalation remedy) -- confirmed by the cycle-4 review, mutation-verified'
    dismissed_reason: null
    learned_pattern: null

  - id: F-302
    severity: low
    category: tech-debt
    type: gap
    file: tests/kill_matrix.py
    line: 564
    title: "Two more refusals with no control: an empty-edit-set Mutant, and Edit(occurrence<1)"
    description: |
      Same root cause as F-301, lower stakes, and PRESENT AT HEAD rather than added by a fix
      (`grep -c "edits nothing"` and `grep -c "must be 1-based"` are both 1 in
      `git show HEAD:tests/kill_matrix.py` and 1 in the working tree) — so cycles 1 and 2 both
      passed over it.

      * tests/kill_matrix.py:564 — `Mutant.__post_init__` raises `MutantRefused("mutant {name!r}
        edits nothing")`. An AST scan of tests/test_kill_matrix.py finds no `Mutant(name, ())`
        construction, so this refusal is never exercised. It is not cosmetic: without it `_apply`
