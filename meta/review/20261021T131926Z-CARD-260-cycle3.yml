      * tests/kill_matrix.py:541 — `Edit.__post_init__` raises on `occurrence < 1`. No
        `Edit(occurrence=0)` or negative construction exists in the test file. Trivial by itself.
    suggestion: |
      Fold into F-301's fix pass: `pytest.raises(MutantRefused, match="edits nothing")` on
      `Mutant("EMPTY", ())`, and `pytest.raises(MutantRefused, match="1-based")` on
      `Edit(path=..., old="x", new="y", occurrence=0)`. Two lines each, in bound 1's shape.
    confidence: high
    source: static
