findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_guard_integrity.py
    line: 4751
    title: "TestTheDeclaredMissTables' class docstring claims all seven directions name a line; two of them name the table"
    description: |
      :4751-4752 reads: "The per-line arm reds on seven directions, each with a
      constructed case naming the line it reds on."  Measured against the
      mechanism: two of the seven verdicts carry no line number at all.

        extra_entry -> "fabricated.py: MEASURED_FABRICATED_MISSES holds 3
                        entries and 2 key groups"        (_unkeyed_declaration_lines:3209)
        renamed     -> "fabricated.py: MEASURED_FABRICATED_MISSES is keyed
                        here but assigned nowhere"       (:3202)

      Both are `f"{where}: ..."`, not `f"{where}:{first}: ..."`, and the
      committed cases' own `expected` prefixes (:4942, :4948) contain no line
      number either -- so the docstring is contradicted by the very cases it
      is describing.

      This is a claim wider than the mechanism, in one of the four places the
      round names as "restated from the mechanism as it now stands"
      (DECLARATIONS F-001).  The other three get it right: the contract block
      at :2954-2956 says "changing an entry **count** and **renaming** the
      table red naming the table rather than a line", and
      test_the_rule_names_what_it_cannot_see's docstring enumerates only the
      five line-naming directions.  The class docstring is the single
      restatement that over-generalises, and the over-generalisation is the
      same shape as cycle 5's F-001 (clause 2 claiming five directions where
      four were constructed).
    suggestion: |
      One sentence.  Replace "each with a constructed case naming the line it
      reds on" with the distinction the contract block already draws, e.g.
      "each with a constructed case asserting the verdict it names -- by line
      number for the five that move a line, and by table for the entry-count
      and rename directions."  No mechanism changes, so the mutation matrix
      does not need re-running.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: tests/test_guard_integrity.py
    line: 2962
    title: "'eleven lines of slack' is twelve: the retired floor `keyed >= 45` against a measured 57 tolerated 12 lines leaving"
    description: |
      The sentence explaining WHY the floor was replaced by an equality states
      the floor's slack as eleven, in two places in the code and once in the
      card:

        tests/test_guard_integrity.py:2962  "that pin read ``>= 45`` against a
            measured 57: eleven lines of slack, which is exactly what made the
            shrink silent"
        tests/test_guard_integrity.py:4794-4795  "The floor it replaces read
            `>= 45` against a measured 57, and eleven lines of slack is what
            made the one edit the per-line arm cannot see ... silent"
        meta/kanban/cards/CARD-264.md:1886  "at `>= 45` against a measured 57
            it had eleven lines of slack."

      The retired assertion was `assert keyed >= 45` (the diff's removed lines)
      and `keyed` summed exactly what _declaration_census's third figure sums,
      measured 57.  Under `>=`, keyed may fall to 45 inclusive and still pass,
      so the number of declaration lines that could silently disappear is
      57 - 45 = **12**, not 11.  The figure is wrong under the other natural
      reading too (the margin 57 - 45 is 12).

      It is the F-002 class exactly -- a figure written into prose where
      nothing re-derives it -- recurring inside the round whose own stated
      principle is "a figure belongs where it can be re-derived rather than
      beside the thing it describes" (:2957-2958).  It is load-bearing for the
      argument it carries: the sentence's whole job is to quantify why a floor
      could not be the control, and it quantifies it wrong.
    suggestion: |
      Change "eleven" to "twelve" in all three places, or state it as the
      margin without a count ("a floor of 45 against a measured 57 tolerated
      every line down to 45").  The second shape is the one the round's own
      F-002 principle prefers.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

