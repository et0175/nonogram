    file: tests/test_book_detail_page.py
    line: 630
    title: "Export cross-check spies a path only one-up pages take; no AC test ever forms a two-up page"
    description: |
      _bands_the_export_prints spies BookPDFGenerator._puzzle_payload, which only _blank_page calls
      (book_pdf_generator.py:1640). Two-up pages write their bands via band_identity directly
      (book_pdf_generator.py:1809) and are invisible to the spy. All fixtures are 20x20 grids, which
      never pair on the 8x10 trim (measured: 0 two-up pages on a 120-puzzle book of the same
      fixture), so neither the band cross-check nor the corpus oracle exercises paired pages. The
      failure is loud, not a false green (assert set(bands) == set(ids) would fail if a pair formed),
      and the page's number does not depend on pairing (enumerate(plan.printed) is pinned to the
      band numbers by interior_stream's 1..count tripwire), so the correctness risk is low. The
      helper docstring ("as the real interior download draws them") overstates what it observes.
    suggestion: |
      Add one book of small same-tier neighbours that pair and capture bands on both paths (e.g.
      wrap module-level band_identity, or read the PDF text), or narrow the docstring to one-up pages.
    confidence: high
    source: static
