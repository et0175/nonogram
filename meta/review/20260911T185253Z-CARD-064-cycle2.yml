    file: src/nonogram/admin/app.py
    line: 460
    title: "Sub-threshold shares in [89.5%, 90%) print as '90%'"
    description: |
      The new results lines format a share that is below MIN_KEPT_SHARE with
      :.0%, so 0.895 to 0.8999 prints "90%". The retry note is appended only
      when the grid keeps less than 90%, yet it can read "; it keeps 90% of the
      picture". The moved line can likewise read "would cut it (keeps 90%)"
      (app.py:446), e.g. a 130x290 picture at Medium (10x20 keeps 89.7%).
      Corpus: 420 of 69,397 moved cases and 2,842 of 15,049 sub-threshold
      neighbours. The owner's real set has none (c4 prints 89%). The preview
      template uses the same rounding (already there at cycle 1), so the pages
      agree with each other.
    suggestion: |
      Floor rather than round shares shown below the threshold (in both the
      flash lines and the template), or show one decimal.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
