  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_crosshair.py
    line: 547
    title: "AC-6's nominated purity test is driven from the one state in which a destructive side effect is invisible — SURVIVING MUTANT M13: a hover that wipes localStorage passes all 15 tests"
    description: |
      MUTANT M13 (line-count preserving, one line of solver.js):

        for (const part of crossedParts(table, row, col)) part.classList.toggle("is-crossed", on);
      ->
        for (const part of crossedParts(table, row, col)) { part.classList.toggle("is-crossed", on); localStorage.clear(); }

      Result: 15 collected, 15 PASSED, exit 0. A crosshair that erases every saved
      puzzle in the browser on every hover is green against AC-6's own nominated test,
      TestSolverCrosshair_IsPureView::test_a_long_hover_sequence_changes_no_state_no_history_and_no_save,
      whose snapshot includes the field `"save": browser_page.evaluate("Object.entries(localStorage)")`.

      WHY, and this is the state question rather than a mutant-class question: the test
      is driven from a VIRGIN board. Its own premise line is
      `assert before["states"] == [U] * 225`. On that board four of the snapshot's
      seven fields are at their initial value — `save` is `[]`, `circled` is all
      False, `undo` and `redo` are both "true" — so the whole-snapshot equality
      compares `[] == []` for the save and can only ever catch an ADDITIVE side
      effect. A hover that DESTROYS player state is invisible to it, and M13 is not a
      deletion mutant: it is an addition that survives purely because of the state the
      test is driven from.

      That makes two claims false as written:
        * tests/test_browser_fixture_scope.py:1387 (the ADDED_SINCE_BEFORE row):
          "forty hovers change no data-state, no undo/redo aria, no counter, no clue
          circle and no localStorage entry — one snapshot compared whole, SO A SINGLE
          CHANGED FIELD REDS IT". M13 changes a field (localStorage, from [] to []) and
          nothing reds.
        * the implementation record's own gap statement, which frames the limit as a
          mutant-class limit ("a deletion only ever makes the crosshair do less, so no
          deletion mutant can red the negative claims"). The limit is not the mutant
          class; it is the state. An addition mutant reaches the claim and still
          survives.

      No user-facing bug: the shipped code touches no storage (M13 had to ADD the call
      to reach it, which is itself the CON-021 evidence above). This is a
      test-discrimination defect, the same shape the concurrent CARD-305 review found.

      The fix is the one TestSolverMarking_RevealsNoCorrectness already uses: drive the
      purity snapshot from a board that HAS state.
    suggestion: |
      In test_a_long_hover_sequence_changes_no_state_no_history_and_no_save, mark a few
      cells by real clicks (and undo one, so redo is enabled) BEFORE taking `before`,
      so that `save` is a non-empty localStorage entry, `circled` has at least one
      True, and undo/redo aria-disabled are not both "true". Keep the virgin-board arm
      if you want it, as a second case. Then re-fire M13: it must red. Narrow the
      ADDED_SINCE_BEFORE row to what the chosen state actually discriminates, and
      replace the record's "no deletion mutant can red the negative claims" with the
      accurate statement: "no mutant can red them while the test is driven from an
      empty board".
