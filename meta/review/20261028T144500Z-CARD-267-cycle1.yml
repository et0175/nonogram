      `assert seen[0][1] == {"background": ink, "mark": False}`, observed background
      `color(srgb 0.243451 0.262745 0.306667)`. That is --player-cross-ink to six
      figures, and it reproduces the record's own measured value (0.243 0.263 0.307)
      in a new run.
      (b) TestSolverMarking_RevealsNoCorrectness. Mutant M2 neutered the new
      `_STRIPPED` line (is-crossed -> is-crozzed) and the test RED at
      `assert browser_page.evaluate(_STRIPPED) == before`. The record's claim that the
      ONLY differing bytes were is-crossed needs no separate run: the baseline is
      green with nothing but the is-crossed strip added, which is that claim.

      Is the guardrail unsatisfiable or merely inconvenient? Unsatisfiable, and for a
      reason STRONGER than the two the record gives:
      tests/test_browser_fixture_scope.py:2050 asserts
      `set(PAGE_ISOLATION) == on_disk` over a glob of tests/test_puzzle_solver_*.py,
      so ANY card that adds a file to that family MUST edit
      tests/test_puzzle_solver_page.py — itself a tests/test_puzzle_solver_*.py file.
      That edit is in this diff (+6/-1 at :557 and :596) and is mechanical, independent
      of the crosshair's design, and independent of (a) and (b). The record files it
      under "Three registries outside Touches", not under G-6, so the G-6 verdict
      enumerates 2 of the 3 edits actually present.
      (b) is additionally unavoidable for any marker the CARD ITSELF prescribes: body
      item 2 mandates "a class ... on every td.player-cell of the row and of the
      column", and the snapshot is document.body.outerHTML. So G-6 and body item 2
      cannot both hold — a card self-contradiction, which is an escalation on this
      board. (a) is NOT structurally unavoidable — a non-background channel
      (background-image, an inset shadow) would leave computed backgroundColor
      untouched — but the CSS comment at admin.css:1044-1050 argues those channels are
      already spent on the hint outline and CARD-270's division, and reading a mark's
      look with the pointer parked under the tint is the wrong reading point anyway.
      The chosen fix is the honest one.

      Non-weakening check on both edits: PASSED. The ClickCycles claim ("three clicks
      are drawn black, dot, blank") is unchanged and still kills M1; the _STRIPPED
      addition is the same narrowing CARD-188 made for is-circled, and is-crossed is a
      function of the pointer alone, never of the board or the solution.

      What is left to fix is therefore NOT the implementation: it is the card. G-6 must
      be amended to forbid behaviour change while permitting recorded test
      accommodation (which is exactly what the record proposes), and the G-6 verdict
      must name the PAGE_ISOLATION edit as the third — and mechanically strongest —
      instance. Until then the card ships with a guardrail its own body refutes.
    suggestion: |
      Orchestrator (this review must not edit meta/kanban/**):
      1. Amend G-6 to: "Marking BEHAVIOUR is untouched ... Accommodating an existing
