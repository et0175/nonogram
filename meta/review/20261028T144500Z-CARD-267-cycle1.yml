    title: "G-6's 'unedited' clause is genuinely unsatisfiable — ADJUDICATED TRUE — but the record enumerates 2 of the 3 edits that break it, and the card still carries G-6 unamended"
    description: |
      The card's declared finding is CONFIRMED, and both of its named failures were
      re-derived here rather than inherited.

      (a) TestSolverMarking_ClickCycles. Mutant M1 reverted the card's one-line
      accommodation (browser_page.mouse.move(1, 1) -> wait_for_timeout(0), line-count
      preserving) and the test RED at the named cell:
