  - id: F-003
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_puzzle_solver_crosshair.py
    line: 212
    title: "'measured in computed pixels' / 'asserted in pixels' is wider than the instrument: three of the four cell states are told apart by an ::after CONTENT STRING — SURVIVING MUTANT M11"
    description: |
      Card item 5 requires that the tint "keep all four data-state looks plainly
      distinguishable". Three places claim that is measured in pixels:
        * src/nonogram/admin/static/admin.css:1067-1072 — "all four data-state looks
          stay plainly apart under the crosshair (ASSERTED IN PIXELS,
          tests/test_puzzle_solver_crosshair.py TestSolverCrosshair_RowColumnAndCluesLight)"
        * tests/test_browser_fixture_scope.py:1283 — "all four data-state looks stay
          plainly apart under the tint ... MEASURED IN COMPUTED PIXELS on one hovered row"
        * the test's own docstring — "What 'plainly apart' is, MEASURED RATHER THAN
          ASSERTED BY EYE"

      What the test actually reads for the three light states is
      `mark: getComputedStyle(cell, '::after').content`, asserted only as
      `len(set(marks.values())) == 3` — three distinct CONTENT STRINGS. Only the filled
      state is measured in pixels (the luma margin).

      INSIDE / EDGE PAIR, both fired:
        * INSIDE (killed) — M7 respelled the specificity override
          `.player-cell.is-crossed[data-state="filled"]` as
          `.player-cell[data-state="filled"].is-crozzed`, so the crossed filled cell is
          repainted paper. 2 failed: the four-states test AND
          test_the_crosshair_tint_comes_from_tokens. So the docstring's second clause
          ("or that lightened the filled cell toward the paper") IS backed.
        * EDGE (SURVIVED) — M11 set the empty state's dot to the tint token
          (`.player-cell[data-state="empty"]::after { ... background: var(--color-surface-hover); }`,
          token-only so the sweeps stay clean). The white dot is now pixel-identical to
          the ground it sits on — invisible. Result: 16 collected, 16 PASSED, exit 0.
          A mark that is gone in pixels passes the test that claims to measure pixels.

      CONCEDED, so the finding stays narrow: the docstring's FIRST clause — "a tint
      that flattened the dot or the '?' away ... fails one of them" — is arithmetically
      safe, and I checked it rather than asserting it. For the dot to vanish the tint
      must reach the dot's own mean luma 0.392, while the filled-margin arm needs tint
      luma > 0.589 (margin = 0.84 * (tint - 0.113) > 0.4); no value satisfies both, so
      no TINT can flatten the dot without reding the margin arm. The defect is the
      claim about the INSTRUMENT, not that clause.

      SUBSTANCE IS FINE, verified in a new domain (WCAG 2.1 arithmetic, an instrument
      the suite does not use): on the tint #f1ebdd the dot (--color-text-secondary
      #5c6070) is 5.25:1 and the "?" (--color-accent #1f5f5b) is 6.20:1. So the shipped
      CSS does keep the four states apart. Only the three claims overstate how that was
      established.
    suggestion: |
      Either narrow all three claims to what is read — "the three light states are told
      apart by distinct ::after content; the filled state by its ground in computed
      pixels" — or add the pixel arm the claims promise: read each mark's own computed
      colour (or `parseFloat(after.width) > 0`, which tests/test_puzzle_solver_marking.py's
      `_LOOK` already uses) and assert it differs from the crossed ground. Then M11 must
      red.
