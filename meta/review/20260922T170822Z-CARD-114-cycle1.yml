  - id: F-001
    severity: low
    category: tech-debt
    type: bug
    file: src/nonogram/export/layout.py
    line: 367
    title: "numpy float measurement passes _is_real then crashes in _exact_mm with an unnamed ValueError"
    description: |
      _is_real (layout.py:350-356) accepts any float subclass, so np.float64(215.9) passes the
      field check; __post_init__ then calls _exact_mm -> Fraction(repr(value)), and under NumPy 2
      repr is 'np.float64(215.9)', so Fraction raises "Invalid literal for Fraction: 'np.float64(215.9)'".
      Reproduced. The spec is still refused, but the failure-matrix row "ValueError naming the field"
      is not met, and a finite real that the declared semantics say to accept is refused. NumPy is a
      runtime dependency, so a CARD-115 builder doing arithmetic in numpy would hit this.
    suggestion: |
      Use Fraction(str(float(value))) (or Fraction(repr(float(value)))) in _exact_mm, or coerce each
      measurement to a builtin float/int before validating; add np.float64 to the poison/accept table.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/export/layout.py
    line: 1397
    title: "Floor case where only the height overflows keeps horizontal centring; failure matrix says it anchors left, and it is untested"
    description: |
      The left edge anchors only when spare width < 0 (layout.py:1397-1398). When page fit falls below
      MIN_CELL_MM because of the height alone, the drawing stays centred horizontally and overflows
      downward only. Reproduced: a 300x60 mm trim with a 30x30 grid gives drawing_left 1435 vs
      usable_left 118, fits False. The behaviour is reasonable, but the declared row ("anchored at the
      usable area's left edge instead of centred ... overflows right and down") and the docstrings
      (PagePlacement.fits, test_book_layout.py module doc) describe only the width case. The floor
      property test (test_book_layout.py:217) pins only width overflow (height fixed at 600 mm).
    suggestion: |
      Reword the matrix row and the fits/placement docstrings to "anchors left only when the width
      overflows". Add height-only overflow cases to the floor property test asserting fits is False,
      drawing_top == top+band and horizontal centring.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/export/layout.py
    line: 434
    title: "PageSpec has no upper bound on trim; render_image allocates a trim-sized image (undeclared failure row)"
    description: |
      PageSpec accepts any finite positive trim, and on the placed path render_image allocates
      Image.new at trim px (png.py:145). A mistyped stored trim (for example 2159 mm instead of
      215.9) gives an image about 25500 x 33000 px, roughly 2.5 GB RGB, in the admin process. The
      failure matrix covers poison specs from bad stored values, but it has no row for an oversize
      trim. The matrix says "the renderers only allocate a Pillow image", so the allocation is the
      failure-bearing boundary it misses.
    suggestion: |
      Either declare a trim ceiling in PageSpec (e.g. <= 1000 mm per side, well above any KDP trim)
      with a ValueError, or add the row to the matrix and assign the bound to CARD-115's builder.
    confidence: medium
    source: inferred
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
