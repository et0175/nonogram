  - id: F-004
    severity: medium
    category: tech-debt
    type: gap
    file: meta/architecture/requirements.yml
    line: 925
    title: "FR-023's statement carries the same defective clause as EC-009, and only EC-009 was amended"
    description: |
      I re-derived EC-009's arithmetic from scratch and CONFIRM the agent's claim: the
      requirement is self-contradictory, and the finding is against EC-009, not the code.

        * `round(N*r) < MIN_SIZE` is `long:short > N/9.5`, NOT `> N/5`. Exhaustively
          computed over N = 10..30 x source ratios: 21 counterexamples, one per supported N
          (e.g. N=10, a 2:1 source: `round(10*0.5) = 5 < 10`, yet `2.0 > 10/5 = 2.0` is false).
        * Only the N/5 reading satisfies AC-097: at ratio exactly N/5 the unclamped value is
          always exactly 5, so the literal EC-009 clause would REFUSE all three of AC-097's
          cases, while AC-097 requires "the short side lands exactly on MIN_SIZE ... and is
          accepted, not refused". Verified: at (10, 2:1), (20, 4:1), (30, 6:1) the derived
          short side is 5 pre-clamp, 10 post-clamp, and `keeps_half` returns True at each —
          exactly on the inclusive 2x boundary.
        * Only the N/5 reading satisfies AC-098: for a 5:1 source the smallest N that works
          is 25 and 24 is refused (verified). EC-009's literal "smallest N for which
          round(N*r) >= MIN_SIZE" gives 48 — past MAX_SIZE and unofferable.

      So the implemented rule — derive `round(N*short/long)`, APPLY the MIN_SIZE floor, refuse
      when the resulting grid would discard more than half the source — is not merely *a*
      resolution, it is THE resolution: it is what ADR-0022/R4 already says verbatim ("clamped
      to MIN_SIZE at the bottom only ... A source whose ratio exceeds N/5 is refused with a
      message naming the smallest N that would accommodate it"), and it is the only rule
      satisfying AC-097 and AC-098 together. R4 needs no change, as the agent says.

      THE GAP: the intake amendment (raw-requirements.md, third new line) addresses EC-009's
      statement only. FR-023's OWN statement carries the identical defect at
      requirements.yml:924-925 — "the error names the smallest `--size N` that would
      accommodate the source's ratio **unclamped**" — which is the 48 reading, contradicting
      AC-098's 25. FR-023 is the requirement `trace.yml` points at and the one a reader reaches
      first, so amending EC-009 alone leaves the authoritative text wrong.

      Confirmed clean: `requirements.yml` was NOT hand-edited (`git diff main...HEAD --stat --
      meta/architecture/` shows only `inputs/raw-requirements.md`, 3 insertions). Both filed
      intake lines are accurate — I re-derived every figure each one asserts.
    suggestion: |
      Extend the EC-009 intake line (or add a fourth) to cover FR-023's own statement:
      replace "would accommodate the source's ratio unclamped" with "would accommodate the
      source's ratio" (matching ADR-0022/R4's wording exactly), and replace FR-023's
      "cannot be reached by that N without clamping" with the retention criterion, since
      clamping begins at N/9.5 while refusal begins at N/5.
    confidence: high
    source: model
    violates: EC-009
    root_cause: RC-2
