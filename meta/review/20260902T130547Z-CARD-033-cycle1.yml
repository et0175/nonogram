  - id: F-006
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/sourcing/image.py
    line: 525
    title: "The disclosed double decode is neither measured nor pinned"
    description: |
      A bare `--size N` image run now decodes the picture twice — once in
      `image.source_shape` for the ink box, once in `generate` for the pixels. The agent
      disclosed this and the reasoning is correct: passing a decoded Pillow `Image` back out
      would put it on a boundary that carries `list[list[bool]]` and nothing else (ADR-0012),
      and the extent must be resolved before the source is called. So the second decode is
      NECESSARY given the standing constraints, not incidental — I could find no alternative
      that does not either cross ADR-0012's boundary or introduce module-level caching state.

      It is also correctly bounded: only image mode, only the bare-size path. AC-096's test
      pins the explicit path at zero shape lookups by making the reporter explode
      (tests/test_derive_shape.py:323), which is a strong assertion.

      What is missing is the other half: nothing asserts the bare-size path costs exactly TWO
      decodes rather than three or twenty. CARD-030 already made every image request pay one
      decode; a future card adding a third would be invisible. `_resolved_extent` is called
      once outside both retry loops (orchestrator.py:1130), which is what keeps it at two —
      that ordering is load-bearing and unasserted.
    suggestion: |
      Add a counting test alongside `test_a_bare_size_out_of_range_is_refused_before_the_source_is_consulted`
      (tests/property/test_grid_dimensions.py:400, which already counts source calls): patch
      `image.load_greyscale` with a counter and assert exactly 2 calls for a bare `--size N`
      image run through `generate`, and exactly 1 for an explicit `--size WxH`. That pins both
      the disclosed cost and the once-outside-the-loops ordering.
    confidence: high
