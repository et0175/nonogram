    type: gap
    file: src/nonogram/orchestrator.py
    line: 629
    title: "Puzzle.width/height reading the RESOLVED extent is unpinned — mutant survives the full suite"
    description: |
      Mutating `Puzzle.width` (orchestrator.py:629) from

          return self.extent[0] if self.extent is not None else self.request.width

      to `return self.request.width` leaves the ENTIRE suite green (verified: mutant m6,
      full scoped run of 8 test files, rc=0; restored and md5-verified
      d50486b4015f2ad2b403df111b67a5d5).

      That accessor is not decorative. `orchestrator.py:1346-1347` feeds
      `export.ExportPayload(width=puzzle.width, height=puzzle.height)`, so under the mutant a
      bare `--size 25` run exports the HALF-STATED request pair. Demonstrated end to end on
      the real code: a bare-size library request (`width=20, height=None`) currently exports
      `request.width=20, request.height=20`; with the mutant it would export
      `height: null`, and for a portrait picture it would export `width: 25` where the grid is
      actually 18 wide. That breaks FR-012's exact-reconstruction promise and INV-004's
      "10..30 at every point in its lifecycle".

      The gap is precise and narrow: `puzzle.extent` (the FIELD) is asserted exactly once, at
      tests/test_derive_shape.py:292, and only in RANDOM mode where the resolved pair happens
      to equal nothing observable. No test reads `puzzle.width`/`puzzle.height`, or an export
      document, for a half-stated request on a NON-SQUARE source — which is the only shape
      where the two disagree.

      [history] corroboration: `tests/test_export_json.py` co-changed with `orchestrator.py`
      4 times in the last 12 months and is absent from this diff. Its two extent tests
      (`test_the_request_block_records_an_extent_pair_and_never_a_scalar_size` at line 273,
      and line 201) use `width=2, height=2` / `width=10, height=10` only — fully stated, so
      they cannot see this.

      Five of seven mutants were killed, and the two other survivors (m3: the
      `_smallest_workable_size` lower bound; m4: the square-source orientation branch) are
      PROVABLY EQUIVALENT — verified exhaustively, not sampled: 0 refusal paths whose smallest
      workable size is MIN_SIZE, and 0 square sources where the two branches differ. So this
      is the one real test gap, not a scatter.
    suggestion: |
      Add one assertion to `tests/test_derive_shape.py` (or to `tests/test_export_json.py`,
      the co-change peer) that a bare `--size N` on a NON-square source is recorded on the
      aggregate and in the export, e.g. for the cat:

          puzzle = orchestrator.generate(GenerationRequest(mode="image", image=CAT, width=25, ...))
          assert (puzzle.width, puzzle.height) == (18, 25)   # not (25, None)
          document = json.loads(export_puzzle(puzzle)[0].read_text())
          assert (document["request"]["width"], document["request"]["height"]) == (18, 25)

      Asserting the properties (not the `extent` field) is what kills the mutant, and
      asserting the exported document is what pins FR-012. A library-mode bare size is a
      cheaper alternative that still kills it, since `height` goes None under the mutant.
