    description: |
      The test asserts _assert_the_export_fitted_with_room passes at CHILD_EXPORT_COST_BYTES - 1
      and fails at CHILD_EXPORT_COST_BYTES. Both sides are expressed in terms of the constant
      under test, so the test holds for ANY value of CHILD_EXPORT_COST_IN_PAGES. Confirmed by
      mutation: with CHILD_EXPORT_COST_IN_PAGES = 320 (the "weaken until green" fix) this test
      stayed GREEN while three of its siblings went red. It does pin the comparison's edge
      (a `<=` / `<` slip would be caught), which is worth keeping — but the constant's VALUE is
      pinned only by its two siblings, and the docstring/comment claim that it "pins both sides
      of the bound itself" overstates what it can do.
    suggestion: |
      Either state in the docstring that this test pins the comparison edge and not the
      constant's value (the value is pinned by
      test_an_export_at_the_list_shapes_order_of_magnitude_fails and
      test_an_export_that_retains_a_fraction_of_the_book_fails), or add one absolute assertion
      on the constant itself (e.g. CHILD_EXPORT_COST_IN_PAGES < CORPUS_PAGE_COUNT / 10) so a
      weakened constant is red in this class too.
