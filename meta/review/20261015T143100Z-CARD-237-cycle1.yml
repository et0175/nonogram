  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_pdf_memory.py
    line: 1016
    title: "The instrument, not the quantity, sets the sensitivity floor — a cross-process ru_maxrss difference with a 2.26x spread"
    description: |
      _export_marginal_cost subtracts two peak resident-set figures taken from two different
      processes. That is why the bound cannot be tighter than ~2.4-2.7x the worst noise, and so
      why the guard cannot bite below ~11-13 retained pages (re-derived below). The card chose
      to size around the noise rather than reduce it, and the comment is honest about that. The
      residual risks worth recording: (a) the peak difference is not an export term in any strict
      sense — the floor child's own transient peak is subtracted from the streaming child's, so a
      regression in the SHARED half (imports, corpus construction) is subtracted away and
      invisible to this guard, bounded now only by the much looser CHILD_FLOOR_SHARE skip at 8
      bitmaps; (b) the 2.26x spread is what made F-001 possible.
      Mitigating, and the reason this is Minor rather than Important: the fine-grained shape
      claim is NOT carried by this RSS guard. TestBookPdfMemory_PeakDoesNotGrowWithPageCount::
      test_neither_book_holds_more_than_one_page_bitmap asserts an EQUALITY (retained peak ==
      exactly one page bitmap) through the in-process LivePageBytes instrument, untouched by this
      card, so a single retained page is already red at bitmap precision elsewhere in this file.
      The capped-child RSS guard only has to be a coarse envelope check, which is what 16 is.
    suggestion: |
      If a tighter capped-child bound is ever wanted, measure something less peak-sensitive in
      the child (e.g. have the child report a tracemalloc or sampled-RSS high-water mark of the
      export phase alone, after the floor work has completed, so one process yields both terms)
      rather than differencing two processes' ru_maxrss. Out of scope for this card; worth a
      backlog note.
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

