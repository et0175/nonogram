findings:
  - id: F-001
    severity: critical
    category: tech-debt
    type: bug
    file: tests/test_book_pdf_memory.py
    line: 1489
    title: "The new AC-2 test is itself flaky and fails on the unchanged tree — the flake is relocated, not removed"
    description: |
      TestMemoryGuard_InterpreterGrowthDoesNotTripTheGuard::test_a_floor_at_the_edge_of_the_share_still_passes
      carries a non-vacuity guard at line 1489:

          old_tripwire_quantity = same_export.report["resident"] * 3
          assert old_tripwire_quantity > CHILD_CAP_BYTES, (...)

      with grown_floor_bytes = int(CHILD_CAP_BYTES * CHILD_FLOOR_SHARE) - 1 = 201_959_999 B
      and same_export.resident = grown_floor_bytes + measured_export, where measured_export is
      THIS RUN's live _export_marginal_cost. The assert therefore demands

          201_959_999 + measured_export > CHILD_CAP_BYTES / 3 = 269_280_000
          i.e.  measured_export > 67_320_001 B = 2.667 page bitmaps

      That threshold sits inside the export's own measured distribution. The implementer's
      recorded minimum is 2.70 bitmaps (68.15 MB) — 1.2 % above it. This review measured the
      export at 65.5, 66.6, 66.7, 67.0 and 67.1 MB (2.59-2.66 bitmaps) and the test went RED
      each time, including on the first batched run alongside the real capped test:

          AssertionError: this pair no longer reproduces CARD-237's false red: a floor of
          202.0 MB carrying a measured export of 67.0 MB totals 268.9 MB, which the old 3x
          bound on the total would have accepted — so AC-2 proves nothing
          assert 806764221 > 807840000

      Observed red in 5 of ~11 solo invocations on this host, on the committed tree with no
      mutant applied. This is the same defect class the card exists to remove — a bound placed
      just above the minimum of an instrument with a 2.26x spread — with the polarity inverted:
      the old test failed inside a busy suite and passed solo, this one passes inside a busy
      suite (where the peak, and so the marginal, runs higher) and fails solo or on a quiet host.
      The implementer's five green full suites are consistent with that and do not refute it:
      their margins were 3.41-5.87 bitmaps, all comfortably above 2.667. The merge gate goes red
      either way, and it fails precisely on the solo-file run that is the debugging path for this
      file.
    suggestion: |
      Do not derive the old-bound refutation from the live measurement. Make the demonstration
      deterministic and keep the live measurement as a separate, robust assertion:

        * build the AC-2 pair from the WORST recorded export cost (the comment's own ~6.56
          bitmaps / 165.5 MB) rather than from measured_export: 201_959_999 + 165_500_000 =
          367.5 MB, which the old 3x bound rejects by 1.36x — a margin far outside the
          instrument's spread, so the demonstration cannot go red on noise; then
        * separately assert that THIS run's live measured_export passes the new guard at the
          same share-edge floor (that half is already robust and is the half AC-2 actually
          claims).

      Alternatively keep the live figure but drop the non-vacuity assert to a documented
      constant floor chosen so the old bound fails for any export >= the smallest ever
      measured (~2.59 bitmaps), i.e. a floor >= 269_280_000 - 65_500_000 = 203.8 MB — which is
      over CHILD_FLOOR_SHARE and so not available; this is why the share-edge pair cannot carry
      the demonstration on a small live export at all, and why the worst-case constant is the
      right fix.
    confidence: high
    source: static
