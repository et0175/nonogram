  - id: F-009
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_browser_fixture_scope.py
    line: 216
    title: "_SERVE_SETTLE_S does not reliably establish the state it exists for — measured 2/20 — but only on correct code"
    description: |
      _SERVE_SETTLE_S = 0.05 exists so the serve loop is measured *inside* a
      poll wait. Measured it: 20 samples of exactly the quantity the test
      asserts on, driven through the same `_fixture_function(live)` path.

        at the shipped 0.05 s: 20/20 under the bound, median 0.0472 s,
          max 0.0506 s (3.95x margin against 0.2 s) — but 2 of 20 samples
          came in at 0.0002 s, i.e. the loop was not in a poll wait at all
          and those iterations measured nothing.
        at 0.5 s (M1 applied): 0/20 under the bound, range 0.4454-0.4506 s,
          0 near-zero samples.

      So the resonance (settle == poll interval) produces false-GREEN on
      already-correct code and vanishes under the mutant, where the loop is
      always deep inside a 0.5 s select after a 0.05 s settle. The guard's
      discrimination is unaffected, and M2 is in any case killed by the
      clock-free monkeypatch test.

      On the project's no-sleep-synchronisation convention: this sleep is the
      legitimate exception — it establishes a state with a bounded 50 ms cost
      rather than waiting for one, and it never polls. Flake risk is low in
      the direction that matters: a false red needs +150 ms of scheduling
      delay on a 47 ms operation.
    suggestion: |
      Optional. Replacing the sleep with one HTTP request to `live.url`
      before starting the clock would guarantee the loop has reached select
      and remove the 2/20 vacuous iterations, at the cost of a request. If
      the sleep stays, note in the comment that it is best-effort and that
      the monkeypatch test is what makes the pair deterministic — the class
      docstring currently says "both fail on the mutant above", which is true
      of M2 and M1 as measured but not guaranteed of the timing half.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

