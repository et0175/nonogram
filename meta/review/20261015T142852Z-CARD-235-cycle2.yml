      per-suite cost added after the measurement that certifies the card.

      Nothing fails, and that is the point: every AC-1 bar reads the frozen
      artefact, and `test_the_profile_is_this_cards_run` pins the artefact to
      its own digest, not to the tree. So the card's headline row — "suite
      wall clock 930.81 s -> 871.02 s, -59.79 s" — is now the measurement of
      a tree that is two commits and one fix delta behind, and the realised
      wall-clock return is roughly half of what that row says. The 126.35 s
      teardown saving itself is untouched (the guard file is not in the
      `tests/test_puzzle_solver` family prefix, so it moves no family total);
      what moved is the net.

      This is the same class of defect the card exists to correct — CARD-217
      committed a confident attribution from one run's shape — one layer out:
      here the number is honestly labelled with the commit it was taken at,
      and the drift is that the card's summary presents it as the card's
      outcome. Kept Minor for that reason: the direction of the conclusion
      (the family's teardown collapses, the chosen interval costs call
      nothing) is unaffected, and no merge decision turns on it.
    suggestion: |
      Cheapest honest fix: one line in
      meta/profiling/card-235-browser-teardown.md stating the guard file's
      post-review cost (54.05 s against the 23.99 s in the artefact) and the
      adjusted net, so the next reader who quotes -59.79 s sees the caveat
