  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_proof.py
    line: 546
    title: "_wrapped docstring claims more than the code does for non-note input"
    description: |
      The docstring states, unconditionally for _wrapped, that a line never breaks
      between a number and the unit after it, and (line 554) that no printed line starts
      with a ×. The code only glues a unit to a token that fullmatches _NUMBER (a bare
      number) and only merges a × that has a word before it and a token after it.
      Repro: _wrapped("size (8.25 in) wide", font42, 150) -> ['size', '(8.25', 'in)', 'wide']
      (unit parted from its bracketed number); _wrapped("aaaa bbbb ×", font42, 110) ->
      ['aaaa', 'bbbb', '×'] (line starts with ×). Unreachable today (annotation_lines is
      the only input and G-2 freezes its wording; AC-3 covers exactly those texts), but
      per the project's declare-only-what-code-and-tests-demonstrate rule the claim is
      over-broad.
    suggestion: |
      Narrow the docstring to the note's own text ("in the note annotation_lines prints:
      ..."), or make the code match the claim (allow an optional leading "(" in the glue
      check and keep a leading/trailing × attached) and add the two repros as tests.
    confidence: high
