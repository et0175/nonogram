  - id: F-005
    severity: info
    category: tech-debt
    type: question
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1755
    title: "Out of scope: _write_pdf is built on PIL.PdfParser internals under an unbounded Pillow>=10.0"
    description: |
      `PdfParser.PdfParser`, `next_object_id`, `start_writing`, `write_header`,
      `write_comment`, `write_catalog`, `write_obj`, `write_page`,
      `write_xref_and_trailer` are Pillow internals. I read Pillow 12.3.0's
      `PdfImagePlugin._save`/`_write_image` and `PdfParser` line by line against
      `_write_pdf`/`_write_page`: the object-id allocation order, the
      `write_comment("created by Pillow PDF driver")` string (no version
      substring, which is what would most plausibly have differed), the
      `DCTDecode`/`DeviceRGB`/`BitsPerComponent` key order after `PdfDict`
      skips the two `None`s Pillow passes, the MediaBox arithmetic and the
      contents operator all match, and the recorded byte length reproduces
      exactly. G-4 holds — Pillow is already a declared runtime dependency and
      `tests/helpers/pdf_pages.py` already imported `PdfParser`. But
      `pyproject.toml:20` pins `Pillow>=10.0` with no upper bound and nothing in
      the suite compares the two writers, so a Pillow upgrade that reshapes its
      PDF writer would be caught only indirectly (via the fixture's byte length,
      and only on a machine whose font fingerprint matches). F-002's suggested
      test closes this too.
    suggestion: "Note it on the card, or adopt F-002's two-writer equality test, which is the direct tripwire."
    confidence: high
    source: static
