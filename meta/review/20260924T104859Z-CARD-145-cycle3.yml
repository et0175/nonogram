  - id: F-002
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1834
    title: "Surviving mutant: file fidelity is asserted as length + pixels, so a same-length byte change in the embedded JPEG passes"
    description: |
      Failure matrix F-7 declares "The only difference between the old file and
      the new is the two `Info` timestamps". What the suite asserts is weaker:
      `test_the_interior_file_is_the_length_it_was_recorded_with` (byte LENGTH ==
      2,210,622) and `test_every_page_is_pixel_identical_to_the_recorded_one`
      (decoded pixels). A byte change that alters neither is invisible.

      Mutation-proved on a copy in my scratchpad (the worktree was never touched):
      dropping `dpi=(self.dpi, self.dpi)` from `page.save(encoded, format="JPEG",
      dpi=(self.dpi, self.dpi))` at :1834 — the one thing in `_write_page` that
      reproduces the JFIF density Pillow's own `JpegImagePlugin._save` wrote from
      the PDF encoderinfo — leaves **all 26 tests green**. Measured directly:
      with and without `dpi=`, a 2550x3300 white page JPEG is 133,107 bytes both
      ways, first differing byte at offset 13 (the JFIF density field).

      Six other mutants I ran were all killed, including the four that matter for
      this card's own claims: `del page` removed from `_write_pdf`'s loop (4
      tests fail), the `_as_planned` under-count guard removed (1), the
      over-count guard disabled (1), `export_book` binding the cover page itself
      (1), a one-page shift of the answer pages' page numbers (2 — the baseline
      fixture does have teeth), and dropping a name from `PAGE_FACTORIES` (2 —
      the cycle-2 coverage guard is non-vacuous and its premise does not go
      vacuous, the `assert annotated` line fires first).

      Harm is small: the JFIF density is metadata a PDF reader ignores (page size
      comes from the MediaBox, which `_write_page` computes from `self.dpi`), so
      a regression here would not change what prints. It is the evidence, not the
      file, that is one notch weaker than the row claims.
    suggestion: |
      Add one test that pins what F-7 actually says: build a one-page PDF both
      ways — `im.save(buf, format="PDF", save_all=True, append_images=[],
      dpi=(300, 300))` and `BookPDFGenerator._write_pdf(iter([im]), 1)` — and
      assert the two byte strings are equal after masking the two `(D:...Z)`
      timestamps. That is a few milliseconds, kills this mutant, and is also the
      tripwire that would catch Pillow changing its PDF writer under an
      unbounded `Pillow>=10.0` (see the out-of-scope note).
    confidence: high
