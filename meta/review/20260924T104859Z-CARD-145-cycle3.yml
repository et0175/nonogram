findings:
  - id: F-001
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 136
    title: "\"exactly one page bitmap is alive at any moment\" is one page short: render_pages' discarded solved page makes the real peak 2.00"
    description: |
      The module docstring (:130-137), the test module's docstring, the card's
      F-1 row and the card's Measured-numbers table all state the peak as
      **exactly one page bitmap (25,245,000 B)**. Measured, that is the peak of
      the pages the instrument registers, not of the page-size bitmaps alive in
      the process.

      `_blank_page` (:1148-1163) calls `nonogram.export.pdf.render_pages`, which
      builds TWO full-size page bitmaps — `blank = render_image(...)` and
      `answer = _reveal(blank.copy(), ...)` (export/pdf.py:439-440) — and
      `_blank_page` then binds `blank, _ = render_pages(...)`, keeping the
      discarded solved page alive until the frame exits. `render_pages` is not a
      `BookPDFGenerator` method, so it is outside `PAGE_FACTORIES` and the probe
      never sees it.

      Re-derived on a copy in my scratchpad (never the worktree): registering
      both pages `render_pages` returns and running the real `export_interior`
      over the 8-page baseline book gives `pages registered: 10, peak bytes:
      50490000 = 2.00 page bitmaps`. Every one of the 150 puzzle pages of the
      corpus book goes through the same path.

      **Why this is Minor and not Important, stated explicitly.** No AC is
      affected: AC-1 asks that peak not grow with page count, and the extra term
      is a constant, not a per-page one; AC-2's real 179-page export still fits
      the envelope (50.5 MB of bitmap + 81.9 MB of file = ~132 MB, 26% of 512 MB,
      against the card's stated 107.1 MB / 21%). There is no behaviour change
      versus the merge-base — `_blank_page` is byte-for-byte the code that was
      there before. The equality assertion still has all the teeth the card
      claims for it (I killed the `_write_pdf` `del page` mutant and it fails
      four tests). The concrete harm is bounded: a 25 MB understatement against
      a 380 MB margin, and a production docstring that CARD-128 is instructed to
      preserve stating a property the process does not have.
    suggestion: |
      Cheapest honest fix, no code change: reword the claim to what is actually
      measured and pinned — "the export retains no page across the call that
      builds the next one; exactly one page bitmap survives a page boundary" —
      in the module docstring (:130-137), the test module's docstring and F-1,
      and restate the envelope as ~132 MB / 26%.
      If you would rather widen the measurement, add
      `nonogram.admin.book_pdf_generator.render_pages` to the wrapped seam in
      `_measured` and move the equality to 2, with a note that the second bitmap
      is COMP-007's transient and not a retained page.
    confidence: high
    source: static
