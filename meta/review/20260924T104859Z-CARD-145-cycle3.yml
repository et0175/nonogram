  - id: F-003
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_memory.py
    line: 909
    title: "F-6's cover bound is only measured for the generated title cover, never for the route's uploaded one"
    description: |
      `TestBookPdfMemory_InteriorAndCoverStillSeparate` always calls
      `export_book(baseline_puzzles(), BOOK_TITLE)` with `cover_image` left at
      `None`, and asserts `probe.page_bytes == PAGE_BITMAP_BYTES` and
      `probe.peak == 1 * PAGE_BITMAP_BYTES` (:908-913). The panel's actual cover
      route does not take that path: `app.py:3586-3587` calls
      `generator.export_cover(book.metadata.title, _uploaded_cover(book.book_id))`,
      and `create_cover_page` returns `cover_image.resize(...)` (:865), which
      preserves the uploaded image's mode.

      Measured on a copy in my scratchpad, real `export_cover`:
      generated cover -> `seen=1 peak=1.00 pages`; an RGBA upload ->
      `seen=1 peak=1.33 pages page_bytes=33660000` (2550*3300*4), and
      `_write_page`'s `if page.mode != "RGB": page = page.convert("RGB")`
      (:1830-1831) then holds a second, converted bitmap alongside it.

      This is one page of a one-page file, it is byte-for-byte the conversion the
      merge-base's `_save_pdf` did, and it cannot grow with the book — so it
      breaks no AC and is not a regression. It is an undeclared boundary: the
      failure matrix's seven rows state the cover bound unconditionally, and the
      card is a memory card, so the one path where an arbitrary user-supplied
      bitmap enters the export is worth a row rather than silence.
    suggestion: |
      Either scope F-6's numeric bound to the generated cover in one clause
      ("measured with the generated title cover; an uploaded cover's page is the
      upload's own mode and size"), or add one cheap assertion:
      `_measured(lambda: g.export_cover(TITLE, Image.new("RGBA", (1200, 1600))))`
      and pin `peak == page_bytes` (one page, whatever its mode), which states
      the real property — the cover file holds one page — without pretending the
      upload is 25.2 MB.
