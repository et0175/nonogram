  - id: F-011
    severity: high
    category: feature
    type: bug
    file: src/nonogram/admin/static/solver_state.js
    line: 108
    title: "F17 row refuted: the prototype is read (withCell) and an accepted Proxy is retained, so 'withCell output is always a board', 'indistinguishable', and 'before any paint' do not hold"
    description: |
      Two re-derivable refutations of the declared F17 row (and of solver_state.js:72-79):
      (1) F17 says the prototype is "ignored by design (nothing reads them)" and "createBoard/withCell output is always a board".
      withCell calls board.cells.slice() (solver_state.js:108), a prototype method. A frozen genuine Array whose prototype
      overrides slice is accepted by isBoard, and withCell on it returns a non-board (node probe: isBoard(b)=true,
      isBoard(withCell(b,0,0,FILLED))=false, cells [filled, <5 empty>]).
      (2) F17 says "a passing Proxy is indistinguishable from its board" and "a revoked Proxy: TypeError, likewise before any
      paint; keeps the current board and DOM". setBoard stores the caller's object (solver.js:189) and paint reads
      board.cells per index via [[Get]] (solver.js:151). A Proxy over a board whose get trap revokes it after isBoard passes
      (isBoard only uses getOwnPropertyDescriptor/isFrozen) is accepted, assigned to board, cell 0 repainted, then TypeError
      mid-paint; getBoard() thereafter returns a revoked proxy (node probe of the setBoard sequence: 'threw mid-paint
      TypeError, board retained? true'). This also breaks the bound "every value isBoard read is permanent" that CARD-161's
      history relies on, in the sense that matters: the retained value can stop being readable.
      Practical reachability is nil (needs hostile code in the page's own realm; no user input reaches setBoard; CARD-161/162
      pass withCell outputs) — it is gating only because Step 6 makes a refuted declared row Important. It is the third
      defect in the "what makes a value a board" family (F-001 -> F-003 -> F-009 -> F-011): each fix extends a clause list;
      the root cause is that setBoard keeps, and withCell reads through, the caller's object.
    suggestion: |
      Structural fix that ends the family rather than adding a clause: copy on accept. In setBoard, after isBoard passes,
      store a fresh module-made value built from the own-data reads, e.g. export from solver_state.js
      `normalizeBoard(v)` = Object.freeze({width, height, cells: Object.freeze(Array.from({length: width*height}, (_, i) => ownData(cells, i)))})
      (or have isBoard's pass produce it), and make withCell build its cells by index (Array.from(...) over ownData or
      Array.prototype.slice.call) instead of board.cells.slice(). Then delete the Proxy/prototype prose from F17 and the
      header (a Proxy or exotic prototype is simply copied), and update the two identity assertions in
      test_set_board_refuses_a_value_that_is_not_a_board (getBoard() === withExtra / === proxied) to structural equality,
      plus one row each for the self-revoking proxy and the hostile-slice prototype. Alternative (cheaper, owner call):
      narrow F17 to "values whose traps and prototype are side-effect-free" and drop the "indistinguishable" claim.
    confidence: high
    source: static
