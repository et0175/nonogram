findings:
  - id: F-401
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_kill_matrix.py
    line: 935
    title: "G-5's and G-6's censuses can each be silently disabled — three mutants survive, 67 passed each"
    description: |
      The card's refusal half is now clean (26/26 refusal sites in kill_matrix.py map to a
      pytest.raises that asserts on the message; the four controls fix 4 added all red when their
      mechanism is killed). The guard half is not. Three censuses assert only the ABSENCE of a
      violation over a source that contains none, so disabling the predicate is indistinguishable
      from the predicate holding. Measured on the current working tree, each mutant run against the
      whole file:

        M5  tests/test_kill_matrix.py:935  `"git" in str(name)` -> `"gxt" in str(name)`
            -> 67 passed. The argv half's git detection is inert and nothing reds.
        M6  tests/test_kill_matrix.py:942  `re.match(r"(\S*/)?git(\s|$)", node.value)`
            -> a never-matching pattern -> 67 passed. The strings half is inert and nothing reds.
        M7  tests/test_kill_matrix.py:1840 `imported.isdisjoint({time,timeit,datetime,resource,
            cProfile})` -> `isdisjoint({zzz_not_a_module})` -> 67 passed. G-6's import census is
            inert and nothing reds.

      M6 is the measured consequence of the residual cycle 3 recorded and fix 4 deliberately left:
      lines :945 and :949 read as the control for the pattern ("the widened pattern no longer
      reaches an absolute path, which is the shape it was widened for") but assert over their own
      re-spelled copies, so they cannot disagree with the pattern actually in use at :942. The
      orchestrator's stated reason for leaving it — "sharing the constant would make the
      demonstration depend on the thing it demonstrates" — is inverted: with a shared constant, M6
      makes :945 red immediately, which is exactly a control that CAN fail. With four copies, M6
      survives.

      Two more sites of the same shape, not separately mutated: :901 `aliased == []` (the
      bare-name-spawn import refusal) and :1843 `assert name not in source` over a hand-written
      name tuple that can be emptied.

      The guardrails themselves HOLD in substance — verified independently of the censuses, by my
      own grep over tests/kill_matrix.py: no git invocation anywhere (the hits are prose and the
      `.git` pointer in a docstring), and zero hits for time/timeit/datetime/resource/cProfile/
      perf_counter/monotonic/process_time/elapsed. What is missing is the control that proves the
      guards would catch a violation, which is what ADR-0039/R1 requires of a claim and what this
      card exists to enforce.

      ATTRIBUTION, mechanical: all three sites predate every fix round. `git show
      HEAD:tests/test_kill_matrix.py` carries :592 (`assert not [name for name in commands if
      "git" in str(name)]`), :599 (`re.match(r"git(\s|$)", node.value)`) and the whole G-6 census
      at :929-:947. No fix round created the gap; the cycle-2 fix added a NEGATIVE demonstration
      (both halves asserted to MISS an assembled command) beside it, which is adjacent but is not a
      planted positive. This is therefore NOT a new instance of the family loop — see the verdict.
    suggestion: |
      One synthetic source per census, run through the same enumeration and asserted to be FLAGGED
      — the shape the :953-:988 block already has, with the sign reversed. Concretely:
        1. G-5 argv half: feed `subprocess.run(["git", "checkout", path])` through the same walk and
           assert the git head is found; or, better and cheaper, hold `commands` to an EQUALITY the
           way G-4 holds its import allowance (`sorted(set(commands)) == ["cp", "diff", "shasum",
           "sys.executable"]`), which reds on a new spawn of any name and needs no git predicate.
        2. G-5 strings half: hoist `(\S*/)?git(\s|$)` into one module-level constant used at :942,
           :945, :949 and :981, and add a source containing `"git checkout x"` asserted to be
           caught. Sharing the constant is what makes :945 a control (M6 proves it currently is not).
        3. G-6: run the same import/name census over a synthetic source that does `import time` and
           names `perf_counter`, and assert both halves flag it.
      Each of the three must be verified by killing its mechanism and seeing the new control red —
      the same discipline fix 4 applied to F-301/F-302.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: fixed
    fixed_in: 'fix round 5 (uncommitted) -- tests/test_kill_matrix.py c2113a33 -> 1468707b'
    dismissed_reason: null
    learned_pattern: null

  - id: F-402
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_kill_matrix.py
    line: 253
    title: "The new F-302 control's justification clause is true but undemonstrated"
    description: |
      test_g1_the_two_construction_refusals_each_have_a_control's docstring claims "without it
      `_apply` is a no-op and the mutant's column publishes as a survivor, which is trap 5's own
      shape". I checked it rather than accepting it, two ways, and it is TRUE: `run()`
      (kill_matrix.py:1140-1205) has no predicate anywhere that a mutant actually changed a file —
      `_apply` iterates `mutant.edits`, `_refuse_unless_topology_holds` compares after==before and
      returns, and `_refuse_unless_clean` only ever constrains SHIPPED — so an empty-edit mutant
      would publish a column cell-for-cell equal to SHIPPED, i.e. an all-PASS survivor. Mutant M2
      corroborates it from the other side: with `if not self.edits:` turned off, the ONLY test that
      reds is this new one, so nothing else in the suite catches an edit-less mutant.
      Filing it as Minor, explicitly NOT as an ADR-0039/R1 violation: the claim about what the
      refusal CATCHES has a control that can fail (M2/M3 both red it), and the clause above is a
      true statement about the downstream pipeline, derivable from ten lines of `run()`, not a claim
      about the guard's reach. Worth a line only because this card's whole subject is the
      difference, and a reader cannot tell a derived consequence from a measured one.
    suggestion: |
      Either leave it (it is true and cheap to re-derive) or, if the card wants parity with its own
      standard, add the plant: construct the empty-edit mutant past the refusal
      (`object.__setattr__`) and assert its column equals SHIPPED's cell for cell.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

