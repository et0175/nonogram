findings:
  - id: F-5
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 4215
    title: "Fix 2 narrows cycle-1's F-1 from per-page to per-book-scale, but the same pair of puzzles can still pair in a short book and refuse to pair in a long book — INV-010 remains violated, just at a coarser granularity"
    description: |
      Fix 2's own stated goal (and its new test's docstring) is "the same
      pair of puzzles gets an identical pairing verdict and cell size
      regardless of where in the book it lands." That specific claim is
      true and independently reproduced: within one book, the reserve is
      now a single constant (book_folio_reserve_px in puzzle_section,
      lines 4215-4222; puzzle_pages's own standalone default at
      lines 4069-4074) passed to every level's puzzle_pages call, so the
      exact page-99-vs-page-100-of-the-same-book flip cycle 1 reported
      (F-1) no longer occurs — verified directly against this worktree's
      own compute_pair_layout/_folio_reserve_px.

      But INV-010's canonical statement (meta/architecture/domain/
      aggregates.yml:83-91) defines "fit" by tier equality, adjacency and a
      shared cell >= 7.0mm (capped 7.5mm) alone — nothing about any digit
      count, page number, or book scale. Fix 2 still lets
      folio_reserve_px participate in compute_pair_layout's
      TWO_UP_MIN_CELL_MM floor check (src/nonogram/export/layout.py, the
      `if exact_cell_mm < _exact_mm(TWO_UP_MIN_CELL_MM): return None` after
      the Fix-1 refit), and that reserve is now sized from
      `max_page_number`'s own digit count — a property of the *whole
      book's* total puzzle/divider count, still unrelated to whether these
      two specific puzzles fit.

      Reproduced directly (not merely argued), using the exact pair cycle
      1 used (25 columns x 6 rows, row/column-clue depth 2; unreserved
      shared cell 7.1731mm, comfortably above the 7.0mm floor):
        - a book whose own worst-case page number is 2 digits (e.g.
          max_page_number=99): reserve=54px, cell shrinks to 7.0038mm,
          pairs
        - a book whose own worst-case page number is 3 digits (e.g.
          max_page_number=999): reserve=81px, compute_pair_layout returns
          None - the identical pair REFUSES to pair
      Same two puzzles, same geometry, same tier, same adjacency - whether
      they share a page now depends on how large the *book* is, which is
      exactly as unrelated to "do these two puzzles fit" as the page
      number F-1 already condemned. Given the project's own market
      research (median ~120-page books), most real books will sit on the
      3-digit side of this boundary for their *entire* interior, so this
      is the common case, not a corner case.

      This is not a hidden regression: the fix's own new test encodes it
      as expected (tests/property/test_book_pairing.py:676-680, the
      REGIMES tuple `(98, 3, False, None)` - the 3-digit regime is
      asserted to NOT pair), and the card's own Fix 2 worktree notes
      state outright: "the verdict only changes when the book's own total
      scale crosses a digit boundary, a legitimate dependency." That
      characterization is not supported by INV-010's own text, and unlike
      this same card's F-4 (the FR-032 centred-vs-right-aligned text gap,
      explicitly routed to architect-station as a deferred model update),
      this new dependency was not flagged to the model or routed anywhere
      - it is simply asserted as fine in prose and then locked in by a
      test that would fail if someone later tried to actually fix it.

      G-5 (this card's own guardrail: "this card repositions a pair's
      slots, it does not change which puzzles pair") is violated for the
      same reason it was in cycle 1 - the pairing mechanism Fix 1
      introduced, and Fix 2 narrows but does not remove, still changes
      which puzzles pair, now as a function of total book size rather
      than one page's own number.
    suggestion: |
      Either (a) implement cycle 1's original suggested remedy in full:
      decide pair/no-pair from the *unreserved* cell against
      TWO_UP_MIN_CELL_MM first, and use folio_reserve_px only as a
      cosmetic adjustment within whatever cell that first decision already
      settled on (never letting it flip the verdict) - falling back to
      _draw_folio's own "omit rather than collide" rule for the rare page
      where the already-accepted cell leaves no room for the folio; or
      (b) if the owner/architect station decides a book-scale dependency
      really is acceptable, amend INV-010's own statement in
      domain/aggregates.yml to say so explicitly (the same way FR-032 is
      being amended for F-4) rather than leaving the model's stated
      invariant and the code's actual behaviour in disagreement. Either
      way, this needs an explicit decision, not a prose assertion in a
      worktree note.
