corrections_to_the_brief:
  - >-
    `meta/architecture/trace.yml`'s `tests:` list is **not** mechanically read
    for NFR-001. All three gates in
    `validators/trace.py::_check_covered_tests` are conditioned on
    `status: covered`, and NFR-001 is `status: partial` (`trace.yml:553`). The
    dead label at `:539` is latent, not live, which is why F-3 is important
    rather than critical. The brief's substantive point stands and is
    strengthened by a second measurement: the list becomes read the day the
    entry flips to `covered`, and at that moment gate 2 will ERROR on the
    missing AC-037 linkage while gate 3 silently accepts the dead label,
    because the branch's own new module text-matches it.
  - >-
    AC-5's control is **not** blind, and I would not have the next cycle
    proceed on the assumption that it is.
    `test_the_registry_names_this_module_and_every_ref_resolves` resolves each
    ref against `globals()` membership plus `callable` (`:412-420`), which is a
    definition check and strictly stronger than `git grep -lw`; the rename
    mutant (`…_under_5s` -> `…_under_6s`) kills it. The validator's blindness
    (N-3) is forge's, not this card's. What survives is the narrower F-9.
  - >-
    The round's "seven committed references" is seven **in `docs` and `meta`**;
    over the whole tracked tree it is eight, the extra one in
    `src/nonogram/orchestrator.py:338` (F-5). Its exclusions did not hide a
    ref that goes dead — the eighth is path-level and stays true — but they did
    hide a ref.
  - >-
    The round's "five committed references" to the pin's test name is seven
    occurrences in three files, and — the part that decides F-2 — none of them
    is mechanically read. `meta/review` is inside `code_search()`'s haystack,
    never a source of refs, so a review YAML quoting a renamed test produces no
    finding from any validator. The round's stated reason for keeping the name
    reads the board's own `meta/review` rule backwards.

scope_judgments:
  kept_test_name: >-
    RENAME IT. The name is a live claim ("two") contradicted by its own
    assertion ("one"), which is the family this board gates on, and the cost of
    renaming is mechanically zero (F-2). The round's dilemma is false: a
    one-line "renamed from `…_are_the_two_known_ones` by CARD-301" in the
    module docstring keeps a `git grep` for the retired spelling landing in the
    live file, which is all the ref stability the round was buying, while the
    name stops lying. Historical records naming a renamed test are normal and
    self-dating; a live test whose name misstates its assertion is read as
    current, and this card exists because four cards read a docstring instead
    of running the file.
  declined_dead_refs: >-
    SPLIT. ADR-0001:23 — declining was RIGHT. `decisions/adr/` is outside
    `Touches`, the citation is prose in a dated decision record with no
    `check:` key anywhere in the file, nothing reads it mechanically, and the
    board's rule about honest check refs is satisfied by owing it to a named
    card, which the round did. `trace.yml:539` — declining was WRONG. One line,
    in `meta/architecture/`, the directory this branch already commits
    `requirements.yml` into, named on the card as its **Trace** context,
    carrying the exact string the card just retired from its sibling file; the
    stated reason ("a test asserting the state I want would be red on arrival")
    dissolves the moment the line is edited, and a card whose subject is an
    unresolvable ref may not ship leaving one of the same family in the same
    registry — least of all while its own new file is what keeps that label
    invisible to the validator.
  second_timing_implementation: >-
    NOT this card's AC, but the round's "out of scope" is not the whole answer
    and the residual should be written down as owed rather than closed.
    `CLAUDE.md` does prefer an independent second implementation over
    re-deriving a value with the function under test, and the solver carries
    two brute-force oracles that cross-check each other — so the convention
    reaches this case in principle. Two measured reasons it does not bind here:
    the quantity is wall-clock time, where a second implementation
    (`time.monotonic` beside `time.perf_counter`, say) cross-checks the clock
    and not the thing that could actually be wrong (which request was timed,
    and under which budget); and the card's own scope is *where the verifier
    lives*, not what it measures. What WOULD be a real second reader is cheap
    and worth owing to CARD-018: assert the gate's samples against the
    pipeline's own observable work — that each timed request's outcome matches
    an independently recomputed `orchestrator.generate` verdict at the same
    `(density, seed)` — which is a second implementation of "what was
    measured", the part a timer cannot check itself. Record it on CARD-018,
    which owns closing AC-037 and will have to trust these numbers.
  undeclared_path: >-
    ACCEPT. `tests/test_nfr001_generation_time.py` is the file route 2 requires
    and cannot be taken without; the round declared it rather than hiding it;
    growth against `Touches` is +1 path, 0 under `src/`, 0 in
    `pyproject.toml`. Amend `Touches` at merge.

