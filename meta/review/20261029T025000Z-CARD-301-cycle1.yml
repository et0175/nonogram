verdict: >-
  **The hole is closed and the route is the right one, measured rather than
  argued.** The branch is exactly four paths; `git diff --name-only
  main...HEAD -- src/` is empty and `pyproject.toml` is 0 diff lines, so G-1
  and G-2 hold structurally and not by assertion. A bare `--collect-only -q`
  with `-o addopts=''` collects **9580** on the branch against **9570** on a
  clean `main` worktree I created for the arm — **+10, reconciling exactly** to
  the ten node ids the new module declares, with `grep -c bench_generate` =
  **0** on both. The card's four named test files run **599 passed, 1 xfailed,
  0 skipped** (49.06 s, `-rs` prints no SKIPPED section, so the green is a
  green and not a quiet skip). AC-2's control is real: planting
  `tests/card301_planted_third.py` and running the pin by explicit node id
  gives `collected 1 item` / 1 failed naming the plant; removing it gives 1
  passed; the worktree is clean after. G-5 holds in the strong sense —
  `P95_CAP_SECONDS`, `SIZE`, `DENSITIES`, `SEEDS`, `CORPUS`, `_P95_RANK` and
  `_ALLOWED_OVER_CAP` are at the same spellings as `main`, and `XFAIL_REASON`
  is **byte-identical** to the decorator string on `main` (both 1390 chars,
  compared by `ast.literal_eval` on each side rather than by eye).

  **Every route-deciding figure in AC-4 reproduces, and the internal
  consistency is better than the round claimed for itself.** Gate call time:
  **13.91 s** and **14.12 s** in two independent runs against the round's five
  readings of 13.85-14.22. The module's whole cost: **30** setup/call/teardown
  rows under `-vv --durations=0` (the plain `--durations=0` hides 27 of them
  below 0.005 s, which is the trap the round avoided), summing to **14.15 s**
  against its 14.03 s; share of the committed 1433.47 s profile **0.99 %**
  against its 0.98 %. **14** call rows in that profile exceed 14.15 s, slowest
  **81.03 s** — its corrected figure, not the contaminated 34. The full corpus
  with the early exit disabled: **41.61 s, 6 of 20 over cap, p95 5.001 s**
  against 40.79 s / 6 / 5.001 — and 6-of-20 / 5.001 s is the figure the round
  *committed into `requirements.yml`*, so the one number a reader will act on
  is the one I confirmed. The uncensored 30 s sweep: **122.67 s**, p95
  **24.966 s**, 6 over cap with one censored at 30.003 s, against 122.04 s /
  24.881 s — and the load-bearing part of that claim, that 122 s is *past*
  `tests/hang_guard.py`'s 120 s `_exit()`, holds on my reading too. The sweep
  also explains the gate's 14 s from its own rows: 1.17 + 5.0 + 0.02 + 0.008 +
  2.81 + 5.0 after six samples, which is exactly the "settles after 6 of 20,
  density-40 at seeds 0 and 1" the `gate_verdict` docstring claims. The suite
  denominator **is honestly labelled** — "a suite of 1433.47 s on the board's
  last committed profile (`meta/profiling/suite-durations-20261023.txt`)" is a
  quotation that names its artefact and does not read as re-measured.

  **I re-fired fifteen mutations — the four behind the round's gating
  narrative, plus eleven chosen so each one checks that the cell the round
  named is the cell that reds.** Thirteen killed, each at the named cell. M7
  reproduces precisely: renaming `gate_verdict` away makes the gate report
  **XFAIL, exit 0** — so "the verifier is collected and runs" genuinely does
  not establish that the measurement happened, and the round's own finding is
  real. M11 reproduces as a plain-only kill (`FAILED … [XPASS(strict)]`, 14.08
  s). M13 reproduces as the asymmetry claimed: the gate XFAILed green while
  `test_the_benchmarks_own_instrument_still_measures_a_request` FAILED, which
  is the one thing the instrument cannot say about itself.

  **What keeps this below the bar is one mutant that survived where the round
  told me it would not, and it survived on the card's own newly-added
  guardrail.** `test_the_corpus_is_fixed_and_the_p95_rank_is_the_nineteenth_of_twenty`
  states in its docstring that "a round that reshaped `CORPUS`, `_P95_RANK`,
  `_ALLOWED_OVER_CAP` or the cap to make AC-037 green reds here". Three of
  those four are pinned. `CORPUS` is not: only its length and its uniqueness
  are. Change `DENSITIES = (30, 40, 50, 60)` to `(50, 60, 70, 80)` —
  line-count-preserving, one line — and that test **passes**, the whole module
  runs in **0.29 s**, and the single red is `FAILED … [XPASS(strict)]` on the
  gate, which under the marker's own standing instruction reads as *"the solver
  met the cap, remove the marker"*. My 30 s sweep measures densities 50 and 60
  at **0.004-0.041 s**, so this is not a hypothetical: the fast end of the band
  is three orders of magnitude inside the cap. That is precisely the outcome
  G-5 was added at dispatch to prevent, reached through the test that claims to
  prevent it. One assertion closes it (F-1).

  **Two judgments the round flagged rather than hid, and I come down against
  it on both.** The kept test name (F-2): a live test called
  `…_are_the_two_known_ones` over an assertion holding one entry is the
  claim-wider-than-its-control family in its purest form, and the measured
  cost of renaming is smaller than the round stated and *mechanically zero* —
  the five references are really **seven occurrences in three files**, two of
  them in CARD-301.md which the orchestrator rewrites at merge anyway, and
  **none of them is read by any gate**. The round's reason ("the validator
  reads `meta/review`") inverts the mechanism: `code_search()` excludes
  `meta/architecture` and `*.md`, so `meta/review` is in the validator's
  *haystack*, never a source of refs — a review YAML can only make a dead ref
  look alive, it can never produce a finding when a name it quotes goes away.
  And the dilemma is false: rename, and add one line to the module docstring
  naming the retired spelling, which keeps a `git grep` for the old name
  landing in the live file at zero cost. The declined `trace.yml:539` (F-3):
  it is one line, in `meta/architecture/`, the directory this card already
  commits to, named in the card's own **Architecture context**, carrying the
  exact string the card just retired — and the round's stated reason ("a test
  asserting the state I want would be red on arrival") only holds if the file
  may not be edited, which it may. Worse, the round **relocated the
  camouflage**: on `main`, `BenchGenerate_20x20_p95Under5s` read ALIVE to the
  validator because `tests/bench_generate.py` named it in prose; on the branch
  the one file keeping it alive is the card's own new module, at `:388` and
  `:441`.

  **On the two blind spots the brief put to me, I part company with the brief
  in the card's favour.** AC-5's control is **not** blind: lines 412-420 of the
  new module resolve each registry ref against `globals()` membership plus
  `callable`, which is a genuine definition check and strictly stronger than
  `git grep -lw`, and `test_the_registry_names_this_module_and_every_ref_resolves`
  reds when the name is renamed away. The cheap counter-argument holds too —
  the node id is collected (I enumerated all ten). What survives is narrower
  and cheaper than a gating finding: `tests/bench_generate.py:3` still names
  the new node id in prose, so to the validator's own door the ref would read
  ALIVE with the whole verifier module deleted. Dropping the `::test_…` suffix
  from that one line costs nothing and makes both doors agree (F-9).

  Fix F-1's one assertion, rename the pin with an alias line, and repair
  `trace.yml:539`, and this is a 9. None of the three is more than a few lines,
  and nothing here is a correctness risk to the generator — G-1 is empty.

