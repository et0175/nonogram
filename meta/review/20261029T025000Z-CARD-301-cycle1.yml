    file: tests/test_nfr001_generation_time.py
    line: 105
    gating: false
    confidence: certain
    source: measured
    evidence: >-
      The `RETIRED_CLAIMS` attribute doc states the width honestly — "a
      *reworded* execution claim is not caught here" — and then states a
      mitigation: "which is why
      `test_the_benchmark_prose_claims_no_execution_context_it_does_not_have`
      also requires the positive statement in `NON_COLLECTION_STATEMENT`."
      Two mutants, one inside the claimed region and one at its edge, as the
      board's rule for a claim-bearing comment requires.
      INSIDE (M6inside): reword the sentence carrying "pytest does not collect
      this file" to "This module is a standalone benchmark…", keeping the line
      count. KILLED —
      `test_the_benchmark_prose_claims_no_execution_context_it_does_not_have`
      reds at `assert NON_COLLECTION_STATEMENT in _normalised(source)`.
      EDGE (M6edge): keep that sentence untouched and append a reworded false
      execution claim two lines down — "The suite does execute every function
      below on each `pytest -q` run, so the gate is enforced in CI."
      **SURVIVED**: 3 passed
      (`…prose_claims_no_execution_context_it_does_not_have`,
      `test_the_prose_rule_catches_each_retired_claim`,
      `…declares_no_name_pytest_would_have_to_collect`).
      So the positive statement closes the *replacement* case and does nothing
      about the *coexistence* case, which is the case a reworded claim actually
      takes — a new sentence is added, the old one is rarely deleted.
    failure_scenario: >-
      A later round, reading the file's `__main__` door and seeing it driven in
      CI, adds a sentence to the docstring asserting the suite runs the
      benchmark — the same false belief four cards already acted on, in
      different words. The frozen list does not match it, the positive
      statement is still present, and the suite is green. The file is back to
      claiming an execution context it does not have, which is AC-3's subject.
    fix: >-
      Either narrow the comment (delete the "which is why … also requires the
      positive statement" clause, so the stated width is simply "exact
      spellings only"), or widen the rule cheaply: add to
      `test_the_benchmark_prose_claims_no_execution_context_it_does_not_have`
      a scan for the *pattern* rather than the spellings — e.g. no normalised
      sentence in the file may contain both a collection/execution verb
      (`collect`, `run`, `execute`) and `pytest` without the negation, or more
      simply assert that `"pytest"` appears in the docstring only in the
      sentences the test already pins. The narrowing is honest and free; the
      widening is what AC-3 is actually about.

