      fork point. Reading: `0 error(s), 108 warning(s), 0 info`, and `diff` of
      the two full outputs is **empty** — byte-identical.
      So the round's CONCLUSION is correct — the branch introduces no new
      validator finding — and only its number is wrong. **56 does not
      reproduce.**
      One door that produces a different wrong number, offered because the
      brief asked which door yields which figure: running the same script
      against a detached copy of the model (`git archive main meta/architecture
      | tar -x -C <tmp>`, then `--root <tmp>/meta/architecture`) reads
      `0 error(s), 77 warning(s), 11 info` — because `code_search()` returns
      None when there is no git repo around the model, so every dead-ref check
      degrades from WARN to INFO. That is the shape of a wrong warning count
      from an architecture-only root. It still is not 56.
    failure_scenario: >-
      A figure recorded on the round reads as a measurement a later cycle can
      stand on. A cycle checking "did this card change the validator's
      findings?" against 56 would see 108, conclude the branch added 52
      warnings, and chase a regression that does not exist — the inverse of the
      error the figure was meant to foreclose.
    fix: >-
      Record `0 errors / 108 warnings / 0 info, both arms, outputs
      byte-identical`, with the door and the capture order named, which is the
      form this board's figure rule asks for.

  - id: F-7
    severity: minor
    title: >-
      `test_the_benchmarks_own_instrument_still_measures_a_request` attributes
      itself to mutant M7, and M7 does not kill it — the mutant it kills is
      M13, and the cell that reds for M7 is a different test
    file: tests/test_nfr001_generation_time.py
    line: 280
    gating: false
    confidence: certain
    source: measured
    evidence: >-
      The docstring reads "**Measured, not reasoned** — CARD-301's mutant M7
      renamed `gate_verdict` out of the benchmark … So the instrument is driven
      here instead, outside the marker."
      Re-fired M7 (`def gate_verdict` -> `def gate_verdictX`,
      line-count-preserving) and ran both the gate and this test:
      the gate reported `XFAIL … exit 0` (the round's finding, reproduced
      exactly), and
      `test_the_benchmarks_own_instrument_still_measures_a_request` **PASSED**
      — it calls `_time_one_request`, which M7 does not touch. The cell that
      actually reds for M7 is
      `test_the_benchmark_module_declares_no_name_pytest_would_have_to_collect`,
      at `assert {"gate_verdict", "measure", "report", "main"} <= set(declared)`.
      Re-fired M13 (`_time_one_request`'s body deleted, line-count-preserving):
      the gate again XFAILed green and **this** test FAILED. So the test is
      load-bearing, for M13.
      The reasoning in the docstring is sound — M7 is what demonstrates that a
      strict xfail cannot witness its own instrument, and driving the
      instrument outside the marker is the right response. Only the
      mutant-to-cell attribution is off, and this board's rule is that a
      comment about what a test catches is checked by mutation.
    failure_scenario: >-
      A later cycle re-fires M7 to confirm the control, sees the test pass, and
      reads it as a regression in a control that never caught M7 — or, worse,
      deletes the test as "not catching what it says it catches" and loses the
      only cell that reds for M13.
    fix: >-
      One clause: name M13 as the mutant this test kills and M7 as the mutant
      that produced the *insight* ("a strict xfail absorbs an `AttributeError`
      exactly as it absorbs a missed cap"), and note that M7 itself is killed
      by `…declares_no_name_pytest_would_have_to_collect`'s door-set assertion.

  - id: F-8
    severity: minor
    title: >-
      The new module's docstring heads "The node ids this module owns" over a
      list of three of the ten it declares
    file: tests/test_nfr001_generation_time.py
    line: 11
    gating: false
    confidence: certain
    source: measured
    evidence: >-
      `--collect-only -q` on the branch enumerates **ten** node ids in this
      module; the docstring list at `:16-18` holds three (the gate and the two
      names moved from the benchmark). The list's real job is narrower and is
      stated in the sentence above it — a registry check ref must be findable
      by `git grep` in a code file — and
      `test_the_registry_names_this_module_and_every_ref_resolves` enforces
      exactly that for the one ref the registry carries (mutant: delete the
      gate's bullet, KILLED with "a git grep for the node id will not find
      them in any code file").
    failure_scenario: >-
      A reader counts the module's controls from its own docstring and gets
      three. Minor on its own; it earns a line because the header's wording is
      the same shape the card is about — prose stating a fact about the file
      that the file does not bear out.
    fix: >-
      Retitle to what it is: "The registry-referenced node id this module owns,
      written out because…", or list all ten.

  - id: F-9
    severity: minor
    title: >-
      `tests/bench_generate.py:3` names the new node id in prose, so through
      the validator's own door the ref would read ALIVE with the entire
      verifier module deleted — the in-suite control is sound, this is the
      cheap second door
    file: tests/bench_generate.py
    line: 3
    gating: false
    confidence: certain
    source: measured
    evidence: >-
      `git grep -lw "tests/test_nfr001_generation_time.py::test_20x20_p95_is_under_5s"
      -- . ':(exclude)meta/architecture' ':(exclude)*.md'
      ':(exclude)tests/test_nfr001_generation_time.py'` -> `tests/bench_generate.py`,
      exit 0. The matching line is `:3`'s
      `    AC-037  tests/test_nfr001_generation_time.py::test_20x20_p95_is_under_5s`.
      This is NOT AC-5's hole, and I want that on the record because the brief
      raised it as possibly gating. The card's own control does a real
      definition check: `test_the_registry_names_this_module_and_every_ref_resolves`
      at `:412-420` resolves each ref against `globals()` membership plus
      `callable`, which `git grep -lw` cannot do, and it reds when the name is
      renamed (mutant `…_under_5s` -> `…_under_6s` in `requirements.yml`:
      KILLED, both registry tests). The node id is also genuinely collected
      (ten enumerated). The cheap counter-argument holds.
      What remains is a second-door disagreement that only bites if the whole
      module is deleted, taking its own control with it.
    failure_scenario: >-
      A future card deletes or renames `tests/test_nfr001_generation_time.py`
      wholesale. The suite loses the control silently (no test asserts the
      module exists), and the validator still reads AC-037's `test:` as alive,
      because the benchmark's line 3 quotes it. That is the exact two-gate
      blind spot this card was cut to remove, reconstituted with the files
      swapped.
    fix: >-
      Drop the `::test_20x20_p95_is_under_5s` suffix from
      `tests/bench_generate.py:3`, leaving the module path (which is what the
      line is for — telling a reader where the pytest half lives). Nothing
      asserts that suffix: `test_the_benchmark_prose_claims_no_execution_context_it_does_not_have`
      checks only `RETIRED_CLAIMS` absence and `NON_COLLECTION_STATEMENT`
      presence, so the edit is free. With that and F-3 applied, both doors —
      the suite's definition check and the validator's text search — agree
      about AC-037 and about the retired label.

  - id: F-10
    severity: minor
    title: >-
      The gate's stated worst case (~100 s) sits 17 % under `hang_guard.py`'s
      120 s `_exit()`, which kills the session rather than one test
    file: tests/test_nfr001_generation_time.py
    line: 57
    gating: false
    confidence: high
    source: derived
    evidence: >-
      The docstring bounds the gate: "every request is capped at
      `P95_CAP_SECONDS`, 20 of them bound the test at ~100 s", against
      "`tests/hang_guard.py`'s 120 s per test (CARD-292)" —
      `HANG_SECONDS = float(os.getenv("NONOGRAM_TEST_HANG_SECONDS", "120"))` at
      `tests/hang_guard.py:41`, confirmed.
      The practical figure is far below: with the early exit on, the gate
      settles in 13.9-14.2 s over six samples, and even with the early exit
      disabled the whole corpus is 41.6 s measured. So the bound is sound and
      the margin is never approached today.
      It is named because the bound is what a reader will act on, and the
      consequence of crossing it is not a red test but `_exit()` of the whole
      session — a mode this board has already paid for once. 20 * 5.0 = 100.0
      is also a floor, not a ceiling: it excludes per-request overhead outside
      the cooperative deadline (the measured overshoot the round quotes as
      <= 2 ms per capped request is the relevant term, and it is small, but the
      arithmetic as written leaves 20 s for everything).
    failure_scenario: >-
      A card raises `P95_CAP_SECONDS` toward ADR-0001's 30 s hard timeout for
      larger grids, or grows `CORPUS` past 24 entries, and the gate's worst
      case crosses 120 s on a slow or loaded host. The hang guard `_exit()`s
      the session mid-suite, which reads as infrastructure flake rather than as
      the gate's own cost.
    fix: >-
      A sentence, no code: state the headroom as a number ("worst case
      20 x 5 s = 100 s against a 120 s session-killing ceiling — 20 s of
      margin, so the cap and the corpus size cannot both grow") so the next
      card sees the constraint instead of re-deriving it.

