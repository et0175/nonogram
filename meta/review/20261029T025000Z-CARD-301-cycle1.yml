      pinned by mutation-killed assertions. What is not met is the AC's spirit
      one file over: `trace.yml:539` still carries the retired label, and the
      branch's own new module is now the single thing keeping that label alive
      to the validator (F-3). AC-5 names `requirements.yml`, so this is a
      judgment rather than a literal miss — but the card's subject is
      unresolvable refs in the architecture model, and it ships leaving one.

what_i_did_not_verify:
