  - id: F5
    severity: low
    gating: false
    title: >-
      _settled is not a pure function of its candidate set when two candidates
      share a str(): its tie-break falls through to hash-randomised set
      iteration order
    file: src/nonogram/admin/player_bundle.py
    line: 485
    confidence: certain
    evidence: |
      _settled builds `distinct = {value for value in values}` and sorts by
      `(value is None, "" if value is None else str(value))`. Two distinct
      candidates with the same str() tie, and sorted() then preserves the
      SET's iteration order, which for strings is hash-randomised.

        $ for s in 0 1 12345 99999; do PYTHONHASHSEED=$s python -c "...
              print('seed=$s ->', repr(_settled(iter(['1', 1]))))"; done
        seed=0     -> 1
        seed=1     -> 1
        seed=12345 -> 1
        seed=99999 -> '1'

      Totality, checked while there (scratchpad/probe_settled.py):
        empty                  -> None
        all None               -> None
        None + value           -> 'easy'
        whitespace variants    -> '  a'   (candidates differing only by
                                           whitespace are distinct; _title_of
                                           strips, _book_title strips)
        mixed types            -> 1       (the tie above)
        bool vs int            -> True
        unhashable             -> TypeError: cannot use 'list' as a set element

      Not a live EC-049 breach: reachable only through the in-memory mode,
      because difficulty_tier and puzzle_name are varchar in DB mode and
      str() is the identity on str. But the docstring's "a pure function of
      the *set* of candidates" is stronger than the code, and AC-382's
      PYTHONHASHSEED instrument - which is the right instrument - can only see
      it if such a pair is in the corpus, and none is.

      Checked for other seed-invisible inputs and found none: player_bundle
      imports no time/datetime/locale; every written collection is derived
      from sorted(candidates) / sorted(book_keys), never from filesystem or
      pathlib iteration; ensure_ascii=True makes title bytes locale-free.
    remedy_direction: >-
      Add the type name to the sort key -
      (value is None, str(value), type(value).__name__) - or refuse a
      non-string candidate the way _refuse_unless_serialisable refuses a float.

