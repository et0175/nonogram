verdict: >-
  The exporter is right and the bundle it writes is clean: a provenance audit
  over the 53-grid corpus (56 files) finds zero values that are not the R1 key,
  the extent, a stored tier, a stored title, a R7 slug or compute_clues of the
  stored grid. Determinism is built rather than hoped for and the read-only
  proof is a real mechanism with no bypass path. What does not hold is the
  guard EC-048 rests on: AC-381's scan is default-ALLOW on the VALUE of any
  declared field and on which file a declared name may appear in, so one
  single-edit mutant on the production path puts an entire 144-cell solution
  grid into index.json with all 55 tests green; and the corpus minimum EC-048
  explicitly requires to be asserted is a tautology, lowerable to 9 grids with
  the suite still green. Both are the ADR-0039/R2 shape this board gates on,
  both are fixable inside this card's four paths, and they share one remedy.

findings:
  - id: F1
    severity: high
    gating: true
    title: >-
      AC-381/EC-048's scan is default-ALLOW on a declared field's value and on
      which file a declared name may appear in: the whole solution grid reaches
      index.json with 55/55 green
    file: tests/test_player_bundle.py
    line: 241
    confidence: certain
    evidence: |
      Leak mutant L1 - ONE edit on the production path, in
      src/nonogram/admin/player_bundle.py::_index_entry, adding
        "clues": {"rows": [[1 if c else 0 for c in row] for row in grid],
                  "columns": []}
      to the index entry. No schema tuple widened, no new field name invented:
      "clues", "rows" and "columns" are already in DECLARED_FIELDS.

        $ ./.venv/bin/python -m pytest tests/test_player_bundle.py -o addopts='' -q
        55 passed, 131 warnings in 5.32s

      Probe (scratchpad/probe_leak.py) against the same mutant:
        index entry fields: ['clues', 'height', 'key', 'tier', 'title', 'width']
        recovered grid == stored solution grid: True
        cells recovered: 144
        answer_violations(bundle) -> []
      index.json's first lines show the grid as a pretty-printed nested array.
      So EC-048's second clause ("data from which any solution cell is
      recoverable") is broken with every control, both ACs and the EC green.

      TWO independent causes, each measured separately.

      (a) DECLARED_FIELDS is a FLAT UNION of the five per-file tuples -
      ['clues','columns','height','key','puzzle_keys','puzzles','rows','slug',
      'tier','title','width'] - and nothing anywhere asserts that a written
      file's object equals ITS OWN tuple. Probe (scratchpad/probe_union.py):
      planting "slug" and "puzzles" into a puzzle/<key>.json gives
        violations: []
      grep confirms INDEX_ENTRY_FIELDS / PUZZLE_FILE_FIELDS / BOOK_FILE_FIELDS
      are read only at tests/test_player_bundle.py:120-124 (collapsed into the
      union) and 746-750 (compared to CRITERIA_FIELDS). Never per file.

      (b) All 69 forms forbidden_encodings() derives are COMPACT text, while
      _dump writes with indent=2, so a structured leak can never match.
      Probe (scratchpad/probe_indent.py), same leak, same field, same file:
        compact json.dumps (what the control uses)             -> violations: 1  CAUGHT
        player_bundle._dump (what the exporter uses, indent=2) -> violations: 0  MISSED
        forbidden_encodings count: 69
        forms containing a real newline: 0
        bundle file bytes use indent: '{\n  "puzzles": [\n    {\n      "height": 1'
      This is also an ADR-0039/R1 defect in the control itself:
      test_the_answer_scan_catches_each_leak_shape plants its "grid as a field"
      leak and rewrites the file with bare json.dumps(payload) at line 696 -
      a byte shape the exporter cannot produce. The control demonstrates the
      scan catching something no real bundle file can look like.

      The scan's remaining reach is string values, and it is not complete there
      either. Probe (scratchpad/probe_encodings.py) plants each of these in the
      declared "title" field through player_bundle._dump; each is a fully
      recoverable encoding of every solution cell:
        MISSED len=   24  base64 of PACKED bits (not the ascii bit string)
        MISSED len=   23  base85 of packed bits
        MISSED len=  144  diagonal traversal bits
        MISSED len=   77  run-length of cells (12F,3E,...)
        MISSED len=   45  per-row hex joined by ':'
        MISSED len=  144  each row reversed, rows forward
        MISSED len=  287  bits joined by '-'
      7 of 7 missed. ADR-0039/R2 requires a shape the guard cannot analyse to
      be a FAILURE, not a silent pass; here it is a pass.

      Adjacent, same cause: the draft book's puzzle is checked only for its key
      and the literal "Still a draft" (lines 628-633), never against
      forbidden_encodings, because it is not in `records`.

      NOT a defect in the shipped product. Provenance audit
      (scratchpad/probe_provenance.py) over the real corpus:
        files: 56 | puzzles: 52 | books: 3
        corpus grids: 53
        UNACCOUNTED VALUES: none - every value is key, extent, stored tier,
        stored title, or compute_clues
      The bundle that ships is clean. The guard that must keep it clean as
      CARD-283/284/285 build on it is not default-deny.
    remedy_direction: >-
      Inside this card's four paths. Turn the scan from a denylist of encodings
      into a whitelist on provenance, which is what the audit above already is
      in 30 lines: assert each file's object set equals its own schema tuple
      (not the union); then for every declared field NOT in
      SOLUTION_DERIVED_FIELDS assert its value's provenance (title equals the
      stored name stripped or "Puzzle <key>", width/height equal the extent,
      tier is a stored tier or null); for the exempt three assert key ==
      puzzle_key(grid), clues == compute_clues(grid), puzzle_keys are 10-hex.
      Keep forbidden_encodings as the belt, and plant the leak-shape control's
      cases through player_bundle._dump rather than compact json.dumps so the
      control runs against the bytes the exporter actually writes.

  - id: F2
    severity: medium
    gating: true
    title: >-
      The AC-381 corpus minimum is a tautology - the corpus is generated from
      the same constant it is compared against, so it IS silently shrinkable,
