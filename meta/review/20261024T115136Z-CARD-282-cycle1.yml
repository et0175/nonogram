      against (`assert len(records) >= MIN_CORPUS_GRIDS`, line 620;
      `report.puzzle_count >= MIN_CORPUS_GRIDS - 1`, 621;
      `len(list(root.rglob("*.json"))) >= MIN_CORPUS_GRIDS`, 622). The
      assertion can never fail.

      Measured - MIN_CORPUS_GRIDS 48 -> 4, single edit, nothing else changed:
        $ ./.venv/bin/python -m pytest tests/test_player_bundle.py -o addopts='' -q
        55 passed, 131 warnings in 2.20s
        MIN_CORPUS_GRIDS = 4 -> corpus size = 9

      The corpus fell from 53 grids to 9 with the suite green. This is not
      only a claim defect: EC-048's own registry statement
      (meta/architecture/requirements.yml:4903-4913) ends "- verified over a
      seeded corpus of generated grids, not single examples, with the minimum
      corpus size asserted in the test", and CLAUDE.md's no-hypothesis rule is
      "asserting a minimum case count inside the test itself so the corpus
      can't silently shrink". The file's own docstring (lines 49-51) and
      test_bundle_is_clean_of_answers' docstring (611-612) both claim it
