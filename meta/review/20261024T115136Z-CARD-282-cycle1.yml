    The FIX PRE-GATE's "zero occurrences of 'this card's recipe, not the ADR's'
    remain" is wrong - see F4. One occurrence remains, at
    player_bundle.py:176, spelled "not ADR-0041's". The grep that cleared it
    matched the other spelling.
  - >-
    The pre-gate's reading of the two scans as "two halves of deliberately
    different kinds", with the field half being "the half that catches a leak
    which is not a cell encoding at all", holds only for a leak that invents a
    NEW field name. The field half is a flat union across all five per-file
    schemas, so a leak that reuses a name from another file's schema passes
    both halves - which is F1, and it is the CARD-245 default-ALLOW shape the
    brief predicted a Critical would have.
  - >-
    "M9 as the one error-kill (exit 1, 0 cells)" does not reproduce under plain
    pytest - it is one failure cell on a named test (F7). M12's 10 NOT-REACHED
    does reproduce and is honest.
  - >-
    The brief asked whether anything reaches the output that PYTHONHASHSEED
    variation cannot see. The answer is the other way round: PYTHONHASHSEED
    does reach the output, through _settled's tie-break (F5), on a shape
    AC-382's corpus does not contain. Locale, filesystem iteration, pathlib
    order and time are all clear.

ec048_verdict: >-
  No recoverable solution cell ships. I attacked the second clause from both
  ends. Against the exemptions: the clues are injective on the published set by
  construction and the ADR sanctions that explicitly (the public player's
  solved check IS clue satisfaction), and the 40-bit key adds nothing a reader
  who already has the clues does not have, with every published grid at least
  10x10 by CON-011 so the key is not brute-forceable on its own; the
  untruncated digest is scanned for and absent. Against the written bytes: the
  provenance audit over the 53-grid corpus accounts for every value in all 56
  files. What I did find is that the GUARD cannot fail for the leak class it
  exists to catch - a structured leak in a declared field, and seven of seven
  string encodings in a declared field - which is F1, gating, and the thing to
  fix before CARD-283 builds a public site on this contract.

scan_default_deny_answer: >-
  Neither scan is default-deny all the way down. The field scan is default-deny
  on NAMES against a flat union of eleven, and default-ALLOW on which file a
  name may appear in and on every value. The content scan is a denylist of 69
  derived forms over an open set of encodings, all of them compact while the
  writer writes indent=2, so it is default-ALLOW on any structured shape and on
  any string encoding outside its 69. The determinism allowlist
  (_SERIALISABLE) IS default-deny, genuinely. The statement verdict IS
  default-deny, genuinely, on the complement of READ_ONLY_VERBS.

