      Confirmed the brief's figure while here: the corpus really is 53 grids
      at MIN_CORPUS_GRIDS = 48 (52 generated + the nameless duplicate).
    remedy_direction: >-
      Separate the two roles: a literal CORPUS_GRIDS = 52 that builds the
      corpus and a MIN_CORPUS_GRIDS = 48 it is asserted against, so shrinking
