    file: tests/test_puzzle_solver_marking.py
    line: 421
    title: "Same-cell repeat check is tested on one axis only; a row-only comparison survives every player test"
    description: |
      The repeat rule is "same cell" (solver.js:515 compares lastClick.row and lastClick.col; the
      MARKING header and AC-5 say a click on a different cell makes the next click a first click).
      Mutant R1 drops the column comparison (lastClick.row === row only): it SURVIVES all 288 tests
      of the 8 player test files. AC-5 case (a) clicks (14,14), which differs from (row,10) on both
      axes, so it cannot tell a row-only check from a full check. The column-only mutant (R2) is
      killed only incidentally (AC-4 test clicks down one column). This breaks the standing rule
      that positional claims need tests on every claimed axis. User-visible effect of the
      undetected bug: Black, click A twice (white), click B in the same row, click A again gives
      blank instead of dark.
    suggestion: |
      In test_anything_between_two_clicks_makes_the_next_a_first_click add two between-steps:
      "another cell in the same row" (e.g. _cell(page, row, 13).click()) and "another cell in the
      same column" (a cell in column 10 outside the rows the loop uses, e.g. (14, 10)), each
      expecting the third click to give F. Re-run R1/R2 to show both are killed.
    confidence: high
    source: static
