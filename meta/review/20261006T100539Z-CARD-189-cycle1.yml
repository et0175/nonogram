    severity: low
    category: feature
    type: question
    file: src/nonogram/admin/static/solver.js
    line: 573
    title: "A reset that is opened and cancelled (Keep marks / Escape) keeps lastClick"
    description: |
      The card says a click is a repeat only when the previous input was a recorded click and
      "anything else" makes the next click a first click, but its explicit list names only a
      confirmed reset. The implementation clears lastClick only on commit, so Reset then Keep
      marks (or Escape) leaves the run intact. Ambiguous AC: two readings exist; the card's own
      implementation hint (clear on commit) supports the shipped reading.
    suggestion: |
      Either confirm with the owner that a cancelled reset is not an input that breaks a run (and
      say so in the MARKING comment), or clear lastClick in closeConfirm / the Reset handler.
