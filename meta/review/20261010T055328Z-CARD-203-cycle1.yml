findings:
  - id: F-001
    severity: critical
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 3602
    title: "Right-aligned caption can visually collide with the page folio on a right-hand page"
    description: |
      _draw_solved_slot's new caption anchor (anchor="rm" at placement.drawing_right,
      line 3602-3610) and the independently-drawn folio (_draw_folio, called from
      solved_puzzle_page at line 3689-3703 and from _packed_answer_page at
      3806-3827, neither edited by this card per G-3/G-4) both target the SAME
      horizontal extreme on a right-hand page (page_is_right_hand: odd page
      numbers) whenever the grid's own drawing_right sits close to the page's
      usable_right (common for wide/cell-capped puzzles, e.g. margin=0 on the
      real baseline's own page-13 Snowflake puzzle). Before this card the caption
      was horizontally centred, so it could never reach that corner; the right
      alignment removes that separation.

      The folio's own "is there room" bar (_draw_folio, line ~1345: `bottom -
      content_bottom < line_height`, using FOLIO_PT's own 49px line height) is
      LOWER than the caption's new, widened bar (73px = gap_px + line_height,
      line 3600). In the slack window [73px, ~120px) -- reachable by ordinary
      10..30-cell puzzle shapes (14 such shapes found sweeping checkerboards in
      this range) -- the caption now draws (clearing its own 73px bar) AND the
      folio draws unconditionally (its own 49px bar is already cleared, so
      _draw_folio skips its horizontal collision check entirely and draws at
      (usable_right, usable_bottom) regardless of the caption).

      Reproduced directly against this worktree's own code (not against main):
      a 30x24 checkerboard on page_number=3 (right-hand) yields slack=74px,
      margin=0. The caption's own ink occupies columns ~1983-2435 at rows
      3145-3176; the folio's digit occupies columns ~2414-2433 at rows
      3177-3187 -- i.e. the two marks are horizontally overlapping (columns
      2414-2435 shared) and vertically adjacent with zero blank rows between
      them. Running the identical scenario against main's (pre-CARD-203)
      code produces two well-separated ink blobs (caption near the grid's
      horizontal midpoint ~col 1294, folio near the right edge ~col 2420) --
      confirming this collision is newly introduced by this diff, not
      pre-existing.

      The real regenerated baseline (book_baseline_card203.json, page 13) does
      NOT happen to exercise this window -- that puzzle's own slack is 646px,
      far outside the danger zone -- so the baseline test suite is silently
      blind to it, and the owner's own pending visual sign-off (flagged by the
      card itself) has not yet rendered a shape that would show it either.
    suggestion: |
      Either (a) make the caption's omission/placement arithmetic aware of the
      folio's own reserved corner on a right-hand page (mirror the
      content_right/content_left clearance check _draw_folio already has for
      two-up/packed pages), or (b) thread the caption's own occupied bounding
      box into _draw_folio's content_bottom/content_right for solved_puzzle_page
      too (currently passed as None there), or (c) at minimum raise the folio's
      own vertical "room" bar to match the caption's new, wider one so both
      marks appear/disappear together as they did before this card. Add a test
      that renders an odd (right-hand) page with slack in [gap_px+line_height,
      gap_px+line_height+FOLIO_PT-line-height) and asserts the caption's and
      folio's ink regions do not overlap.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

