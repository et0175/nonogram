    title: "The rule block does not say rule C performs no left-to-right ordering check"
    description: |
      The card calls the comment block at :369-396 "the specification readers
      trust, so a rule not described there is a rule that will be deleted by a
      later card". The block describes rule C's per-line/per-value uniqueness,
      the two-matching-runs refusal and the irrelevance of the rest of the
      line, but it never states the one consequence a reader is most likely to
      read as a bug: rule C applies no ordering constraint across the closed
      runs. Two of the three table rows this card re-expects are exactly that
      case — `((1, 2), "DDWDW.....")` and `((2, 1), ".....WDWDD")` now circle
      both numbers although the runs appear in the opposite order to the clue.
      "Nothing else about the line matters" implies it, but a reader
      reconciling that sentence with `[True, True]` on a line that fits no
      placement has to re-derive the argument the card's Worktree notes make.
      Verified sound, so this is a documentation gap and not a behaviour
      finding (see the Out-of-scope note on ordering).
    suggestion: |
      One sentence in the rule C paragraph: rule C checks each closed run's
      length against the clue's multiset only — it does not check that the
      circled numbers appear in clue order, so marks that fit no placement can
      circle numbers whose runs are out of order (the G-3 "wrong but
      self-consistent marks" allowance, which rules A and B already exercise).
