findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: src/nonogram/admin/app.py
    line: 3061
    title: "Print setup's one-write wiring is untested — reverting the route to save_plan + set_print_spec survives all 692 related tests"
    description: |
      The defect this card fixes lived in the route (two writers, two commits). The fix moves the
      trim into save_plan(..., print_spec=spec) at app.py:3061, but no test pins that wiring.
      AC-2's test (TestPrintSetup_PlanAndTrimCommitTogether, tests/test_print_specs.py:250) calls
      BookManager.save_plan directly — its name says "PrintSetup" but it never POSTs to
      /book/<id>/setup-print. AC-3's route test refuses "nan" in the validator before any writer
      runs, so it cannot see the transaction shape either; and the edited F-004 test now sends the
      unchanged plan to the set_print_spec parametrization. Probe (applied, run, restored by md5):
      replacing app.py:3061 with
        if not (book_mgr.save_plan(book_id, new_plan) and book_mgr.set_print_spec(book_id, spec)):
      i.e. exactly the pre-card two-commit shape, leaves tests/test_print_specs.py,
      test_book_trim_persistence.py, test_book_finalise_gutter.py, test_book_published_confirm.py,
      test_book_plan_storage.py, test_book_workflow_steps.py, test_book_pdf_ink_mode.py,
      test_book_ready_gate.py and property/test_book_workflow.py all green (692 passed).
      So AC-2 ("if writing the trim fails after the plan has been accepted, the stored plan is
      unchanged") is unverified at the place where the plan is accepted — the aspirational-green
      pattern of Step 8c. app.py has 142 commits / 64 fix commits in 12 months, the hottest file
      in the diff.
    suggestion: |
      Add a route-level AC-2 case to TestPrintSetup_PlanAndTrimCommitTogether (sqlite + postgres
      stores, reusing the `panel` fixture and `_trim_write_fails_at_flush`): POST a plan edit with a
      valid trim to /book/<id>/setup-print while the before_flush listener refuses a dirty trim, and
      assert the stored plan (raw row) is still DEFAULT_PLAN and the trim still 6x9. The listener
      raises RuntimeError, which the route does not catch — either assert the raised error via
      the test client (app.testing propagates) or wrap; the point is the post-state. With the
      two-write route the plan's own commit succeeds first and the test fails.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: fixed
    fixed_in: "tests/test_print_specs.py::TestPrintSetup_PlanAndTrimCommitTogether::test_print_setup_route_stores_neither_when_the_trim_write_fails"
