findings:
  critical: []
  important:
    - id: IMP-1
      title: >-
        "Valid by construction ... never re-checks EC-031" is an overclaim: the
        3.19 mm cell floor is not enforced anywhere
      files:
        - src/nonogram/export/layout.py
      detail: >-
        AnswerPageLayout's class docstring ("so a caller holding one never re-checks
        EC-031"), AnswerTile.fits's docstring ("what makes EC-031 a property of the
        type rather than of the tests") and the card's own handover note ("so
        CARD-134 never re-checks EC-031") all promise that the type guarantees
        EC-031. __post_init__ checks the upper cap, tile containment, grid-in-tile
        and overlap, but never the lower bound. Reproduced:
        compute_answer_page_layout([(25, 25)], 6, BOOK1_ODD) returns cell_mm =
        3.178 and [(30, 30)] six-up returns 2.648 — both below EC-031's 3.19 mm —
        with no error. The split with CARD-134 is defensible, but the documentation
        tells CARD-134 to skip the only check that keeps EC-031 true.
      fix: >-
        Either enforce INV-011's capacity rule in compute_answer_page_layout (reject
        capacity 6 when max(columns, rows) > 20 — a named constant beside
        ANSWER_MAX_CELL_MM), or correct the three docstrings and the handover note
        to say the floor is the caller's rule and is NOT guaranteed by the type.
      confidence: high
      source: re-derivation
  minor:
    - id: MIN-1
      title: compute_answer_page_layout's docstring quotes 3.87 mm for a heading page; the implemented formula gives 3.839 mm
      files: [src/nonogram/export/layout.py]
      detail: >-
        The docstring correctly states the 82.78 mm heading tile but then says a
        20x20 prints "3.87 mm under a heading" — that is AC-295's target, not what
        this code prints (3.8392 mm). The test module docstring gets it right (3.84).
    - id: MIN-2
      title: AnswerPageLayout's heading validation is effectively vacuous and uses the wrong reservation
      files: [src/nonogram/export/layout.py]
      detail: >-
        heading_top = center_y - height // 2 reconstructs exactly usable_top for any
        band this module builds, so `heading_top < usable_top` can never fire. The
        first-tile-row check then uses heading.height (6 mm) where the real
        reservation is 6 + 2 mm, so it carries 2 mm of slack and never verifies that
        the heading line clears the first tile row — the "without overlapping one
        another" half of EC-031 for the heading.
    - id: MIN-3
      title: No caption/heading text fitting; a long caption draws across the whole page
      files: [src/nonogram/export/png.py]
      detail: >-
        Measured: a 109-character caption on a six-up tile inks x = 0..2315 on a
        2551 px page whose tile is x = 150..1282 — over the neighbouring tile and
        past the left margin. EC-031 only constrains the caption *line*, and the
        text is CARD-134's, so this is not an AC failure; it belongs in the handover
        as an explicit caller obligation, or wants a measure-and-shrink in
        render_answer_page.
    - id: MIN-4
      title: Two different private `_answer_extent` functions with the same name
      files: [src/nonogram/export/png.py, src/nonogram/export/layout.py]
      detail: >-
        png.py's takes a grid and returns its extent; layout.py's takes a candidate
        extent and validates it. Same name, different contracts, adjacent modules.
  out_of_scope:
    - id: OOS-1
      detail: >-
        src/nonogram/export/__init__.py is listed under the card's **Touches** but
        deliberately untouched; the worktree note gives a consistent reason (the
        package re-exports layout types/constants, never its functions — CARD-127's
        compute_pair_layout is the precedent).
    - id: OOS-2
      detail: >-
        The card's AC-295 prose (83.45 / 77.45 / 3.87 mm) contradicts its own stated
        formula (82.78 / 76.78 / 3.839 mm). Already flagged for the owner; both
        readings land inside AC-295's tolerance.

