family_regression_determination:
  question: "Are cycle-2's gating findings attributable to cycle-1's fixes AND in the same six-card finding family (prose that overclaims what the code or a test does; test-name arrows pointing at tests that do not exist)?"
  answer: "No gating findings this cycle — zero critical, zero high. The loop converged; it did not regenerate defects at gating severity."
  detail: |
    Three separable questions, answered separately.

    (a) Did cycle 1's fixes hold up as FACT? Yes, completely. Every number
    cycle 1 corrected or added reproduces exactly under independent
    re-derivation on this tree: 22/1/2 with a 15-strong >5pp subset; the
    150/32/23/9 reachability split with all nine named regressions and no
    tenth; net 94 -> 108; the single unchanged SolverTimeout; all 20 README
    cells; 208 property pairs. Nothing cycle 1 wrote is false today.

    (b) Did cycle 1's fixes hold up as MECHANISM? Partly. The three findings
    that had a code-shaped remedy are genuinely pinned, verified by mutation
    rather than by reading the fix: F-001's trim (M1 killed), F-009's
    threshold bound (M4 killed), F-010's near-degenerate box (M1/M2 both
    kill through it). The three that had a prose-shaped remedy — F-002, F-006,
    F-007 — remain prose, with nothing that would catch them drifting (F-201).
    So the CARD-027 cycle-2 diagnosis ("cycle-1's remedy for an overclaiming
    comment was a longer comment") applies to exactly half this card's fixes.
    The material difference from CARD-027 is that there the unpinned remedy
    was itself REVERTIBLE WITH THE SUITE GREEN; here the remedies that could
    be mechanical were made mechanical, and the ones that stayed prose are
    verifiably correct as of this head.

    (c) Did cycle 1's fixes GENERATE a new family instance? Yes, one, at low
    severity: F-202. Cycle 1's F-005 fix edited tests/property/test_grid_dimensions.py
    and its F-006 fix edited README.md, and neither was added to the card's
    "three files outside the predicted Touches ... Nothing else" scope list;
    the [Suite] count was likewise left at 1471/+8 against a tree that is now
    1473/+10. The mechanism is precise and worth naming because it is
    structural rather than careless: the card carries a hand-maintained
    mirror of facts that git and pytest already hold authoritatively (which
    files changed, how many tests there are), and every fix pass has to
    remember to update the mirror. A mirror with no check is a defect
    generator with a fixed rate — this is the fifth cycle in a row where the
    mirror, not the code, produced the finding.

    (d) The family's SECOND symptom did not recur at all. I checked all 17
    test names referenced by the card's ACs, its failure matrix, its EC
    section, the AC->test map at the top of tests/test_sourcing_image.py, and
    the cross-file docstring reference F-005 added: every one resolves to
    exactly one `def` in tests/. No dangling arrow. That is a real improvement
    over the six-card history.

    Verdict on the loop: converging, not regenerating. The one new instance
    (F-202) is low-severity bookkeeping, and it is the same root cause as
    F-201 — unchecked hand-maintained facts — which is why they cluster under
    RC-1 and the score deducts for the cause once.

recommendation:
  gate: pass
  merge: true
  cycle_3: false
  rationale: |
    Gate config: min_score 8, zero critical/high, max_cycles 3. This review
    scores 9.0 with zero critical and zero high findings, so the gate passes
    on both conditions, and the +2.0 delta clears min_improvement 0.5 by a
    wide margin.
    Certification was NOT deferred: the mutation check ran (8 targeted mutants,
    zero survivors, source restored byte-identical and verified with md5 and
    an empty git diff --stat), so this is a legitimate passing cycle rather
    than one that pushed the expensive check forward.
    A cycle 3 would spend a full loop on two medium findings of which one
    (F-203) is a model edit outside this card's Touches and outside its
    guardrails, and the other (F-201) is a durability improvement to prose
    that is currently correct. Neither changes shipped behaviour. The stronger
    move is to merge and carry F-201/F-203/F-204/F-205 to the backlog as one
    model-and-pins follow-up — F-204 and F-205 have now survived two cycles as
    "out of scope", which is the point at which out-of-scope should become a
