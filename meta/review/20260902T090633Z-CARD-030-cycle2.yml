      the kills mean: test_a_picture_with_no_ink_at_all_is_trimmed_by_nothing
      reads like the discriminating test for the exclusive boundary — its
      docstring says "The mid-grey field is the case that matters most,
      because 128 is *not* ink by FR-022's own definition" — but for a FLAT
      128 field inclusive and exclusive give the same answer: all-ink returns
