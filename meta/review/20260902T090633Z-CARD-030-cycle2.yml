  - id: F-203
    severity: medium
    category: tech-debt
    type: gap
    file: meta/architecture/decisions/adr/0022-grid-extent-and-size-range.md
    line: 328
    title: "ADR-0022/R3 and CON-012 were revised to judge the ink box before any crop; their declared `check:` refs are pre-revision tests that cannot discriminate either clause, and the test that can is registered nowhere in the model"
    description: |
      ADR-0022/R3's statement now reads "... differs by more than 2x from the
      source's INK BOUNDING BOX ratio — not from its as-decoded file ratio —
      ... The bounding box is computed and judged before any crop is applied".
      Its declared check is
      `check: {kind: test, ref: TestFitImage_RefusesRatioMismatchBeyondTwice}`.

      That test is tests/test_sourcing_image.py:887,
      test_fit_image_refuses_a_ratio_mismatch_beyond_twice. Its whole body is
      two statements: `image.validate_aspect_ratio(60, 20, 20, 20)` inside a
      raises, and `_convert(WIDE, 30, 10)`. The first calls the pure predicate
      on four literals — it cannot observe which extent generate passes. The
      second uses WIDE, whose ink box I measured as its whole 60x20 sheet, so
      it is a trim no-op and cannot distinguish box from file either. Neither
      statement touches ordering. So R3's mechanical judge is green on a
      statement it does not test.

      CON-012 (meta/architecture/requirements.yml:1594, severity mandatory) is
      the same case: its statement carries the "INK BOUNDING BOX ratio ... not
      its as-decoded file ratio" wording, and its check is
      PropertyTest_AspectGuard_AcceptsExactlyThoseRequestsRetainingHalfOrMore —
      a sweep over four-integer tuples that never constructs an image. This is
      the second half of cycle-1's F-011, left open as out-of-scope.

      The property itself holds — I proved it by mutation rather than by
      reading: M2 (judge greyscale.width/height) and M3 (crop before the
      guard) were both applied and both killed by
      test_property_aspect_guard_judges_the_ink_box_before_any_crop_is_applied.
      But that test — which the card itself names as the EC test for
      ADR-0022/R3's revision, `PropertyTest_AspectGuard_JudgesInkBoxBeforeAnyCropIsApplied`
      — appears nowhere in the model: `grep -rn JudgesInkBox meta/` hits only
      CARD-030.md and the cycle-1 report. It is not in requirements.yml, not in
      trace.yml's FR-022 test list (which carries the five TestTrimToInk_*
      names and stops there), and it is not any rule's `check:`.

      Net effect: the only mechanical judge for the clause this whole card
      exists to implement is invisible to the model, while two mandatory rules
      point at tests that would stay green if the card were reverted to judging
      the file. That is precisely the "dead-check-ref" failure mode one level
      up — not a missing ref, but a live ref aimed at the wrong assertion,
      which is harder to see.
    suggestion: |
      Two one-line model edits, both forge:architect's territory rather than
      this card's:
        * ADR-0022/R3 `check.ref` -> PropertyTest_AspectGuard_JudgesInkBoxBeforeAnyCropIsApplied
          (or list both refs if the format allows).
        * Add PropertyTest_AspectGuard_JudgesInkBoxBeforeAnyCropIsApplied to
          trace.yml's FR-022 test list, and to CON-012's check.
      If the card should not touch the model, this belongs on the backlog as a
      follow-up with F-011 rather than being carried forward silently a second
      time — it has now survived two review cycles.
    confidence: high
    source: model
    violates: ADR-0022/R3
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

