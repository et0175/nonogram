  - id: F-207
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/sourcing/image.py
    line: 494
    title: "The refusal message now reports the ink box's dimensions but still calls them \"a WxH picture\", so a refused user sees a size that is not their file's"
    description: |
      A user-facing consequence of the ADR revision that neither the card, the
      failure matrix, nor AC-077 addresses in the message's own terms.
      validate_aspect_ratio's message is unchanged in wording:
      "a {source_width}x{source_height} picture is too differently shaped from
      a {target_width}x{target_height} grid: fitting it would keep only N% of
      the picture. Crop the picture yourself ...". Since this card, the two
      source integers are the INK BOX extent. The card's own new test asserts
      this directly: test_a_near_degenerate_ink_box_drives_the_guard_and_the_resize
      matches on "400x1" for a file that is 400x400 on disk.
      So a user who uploads a 400x400 PNG is told their picture is 400x1, with
      no hint that the tool measured the inked region rather than the file, and
      the advice "crop the picture yourself to roughly the grid's proportions"
      is now advice about a rectangle they cannot see in an image viewer.
      Blast radius is small in practice — I swept all 25 corpus pictures x six
      grid sizes on both trees and not one case reaches ImageNeedsManualCrop —
      so this is a latent clarity problem on the refusal path, not a live
      regression, and it is a Minor.
    suggestion: "Name the trim in the message, e.g. \"the inked part of your picture measures 400x1 (the file is 400x400) and is too differently shaped from a 20x20 grid ...\". validate_aspect_ratio is a pure four-integer predicate, so this needs the file extent threading through or the message assembled by generate; the cheaper variant is a fixed clause — \"measured on the picture's inked area, not the whole file\" — which needs no new argument. Either way AC-077's \"names both extents\" stays satisfied."
