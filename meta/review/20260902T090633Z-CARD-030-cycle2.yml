findings:
  - id: F-201
    severity: medium
    category: tech-debt
    type: gap
    file: src/nonogram/sourcing/image.py
    line: 100
    title: "Cycle-1's three headline remedies are correct today and mechanically unguarded: the 22/1/2 figure, the README table and the reachability split are prose with no failing test behind them"
    description: |
      Point 1 of this cycle's brief, answered directly. F-002, F-006 and F-007
      were fixed by rewriting prose, and I re-derived all three independently:
      every number reproduces exactly (see independent_verification above).
      They are RIGHT. They are not PINNED.

      Concretely, nothing in the 1474-test suite fails if any of them drifts:
        * image.py:100-105 — "overstates on 22 of them, by more than 5
          percentage points on 15 of those, reads exactly right on 1, and
          understates on the remaining 2". grep over tests/ for "overstate",
          "22 of", "15 of" returns nothing. The corpus premise test
          (test_the_corpus_the_trim_criteria_are_stated_over_is_the_one_on_disk)
          pins the corpus at 25 files, which catches a corpus edit — but a
          change to ink_bounding_box's semantics moves this figure with the
          suite fully green.
        * README.md:127-134 — the ✓/✗ conversion table. No test in the repo
          reads README.md at all (grep -rln README tests/ is empty). This
          table has already been wrong twice: two cells this card broke and
          two more that were wrong on main before it.
        * meta/kanban/cards/CARD-030.md:~380 — the 150/32/23/9/94->108
          reachability table. Nothing computes it in CI.

      This is exactly the trap named in the brief, and the CARD-027 cycle-2
      diagnosis applies verbatim: the remedy for prose that overclaimed was
      more prose. The difference from CARD-027 is that here the prose is
      currently TRUE, verified by an independent re-derivation — so this is a
      standing durability gap, not a live defect, which is why it is medium
      and not high.

      What makes it worth fixing rather than accepting: the machinery already
      exists three feet away. tests/test_sourcing_image.py already has
      _ink_extent(), _corpus() and a 25-file premise assertion, and the file
      already pins five other corpus-wide counts (19/17/2/23, 6, 2, 3, 6-vs-2)
      as real assertions. The 22/1/2/15 split is the same shape of claim
      against the same corpus and would be ~12 lines.
    suggestion: |
      Add one test next to the AC-089 comparator, e.g.
      test_the_as_decoded_reading_misstates_what_survives_the_crop: for each of
      the 25 pictures compare Fraction-exact retained-at-20x20 from
      load_greyscale().size against the same from ink_bounding_box(), and
      assert (overstate, equal, understate) == (22, 1, 2) and the >5pp subset
      == 15, naming eagle-silhouette1.jpg / cat_Mouse.png / cat_dog.png the way
      AC-086's test names its two survivors. That converts the shipped
      docstring's central justification from a claim into a check.

      For the README table and the reachability split, a test is heavier than
      the claim deserves; the cheaper honest move is to stop publishing exact
      per-picture verdicts in README.md (say "try another --size; results are
      not monotonic" and drop the grid), and to date-stamp the card's
      reachability table as a point-in-time measurement rather than a standing
      fact. If the table stays, it should be generated by a script committed
      next to it.
    confidence: high
