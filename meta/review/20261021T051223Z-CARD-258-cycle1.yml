  - id: F-002
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_admin_binding.py
    line: 1023
    title: "The one-hook guard reads only top-level `def`s, so an assigned hook — a live pytest hook — is invisible, and G-4 plus AC-4's bound 7 rest on it"
    description: |
      `test_the_plugin_implements_exactly_one_hook_and_it_is_the_failure_one` builds its
      hook set from `tree.body` only, and only from ast.FunctionDef/AsyncFunctionDef whose
      name starts with "pytest_". Two shapes escape it, and the first one is a real pytest
      hook:

        pytest_runtest_setup = _tax     # module-level assignment
        class Inner:
            def pytest_collection_modifyitems(...)   # nested def

      Measured by execution, not inferred: a throwaway plugin whose only content is
      `def _tax(item): print("ASSIGNED-HOOK-RAN")` followed by
      `pytest_runtest_setup = _tax`, loaded with `-p`, printed ASSIGNED-HOOK-RAN once per
      test under pytest 9.1.1 — pluggy resolves hookimpls by getattr over dir(module), so
      an assignment is as live as a def. Run through the guard's own expression, the hook
      set it reports for that module is {'pytest_exception_interact'} only.

      Why this matters beyond the guard: the guard is the *general half* of two card
      claims. G-4 ("the hook must not run per-test on the happy path") is held
      structurally by this test (tests/test_admin_binding.py:1015-1021 says "A
      ``pytest_runtest_setup`` added here ... would red this" — exactly the shape that
      does not), and declared bound 7 rests AC-4's skip-profile half on "the plugin
      implements one hook and it is not a collection or setup hook". The byte comparisons
      cannot substitute: a per-test hook that queries and prints nothing is byte-identical
      and invisible to both.

      G-4 does hold for the code as written — the module has exactly one top-level
      `pytest_` def and no assignments — and I independently re-derived that pytest never
      calls pytest_exception_interact on a pass, a skip or an xfail
      (`_pytest.runner.check_interactive_exception`, pytest 9.1.1). The finding is the
      guard's reach, which is what has to keep holding G-4 after this card.
    suggestion: |
      Derive the hook set from the authority the runtime itself consults rather than from
      the top level of the AST: iterate `dir(diagnostic)` for names starting with
      "pytest_" whose attribute is callable (that is literally what pluggy does), and
      assert the resulting set == {"pytest_exception_interact"}. That closes the assigned
      and re-exported shapes in one line and satisfies ADR-0039/R2's "derived from an
      authority the runtime can enumerate". Keep the AST check as a second arm if the
      nested-def shape is wanted, or declare it as a measured bound.
    confidence: high
    source: static
    violates: ADR-0039/R2
    root_cause: RC-1
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: medium
    category: tech-debt
    type: risk
    file: tests/helpers/undefined_table_report.py
    line: 482
    title: "The MATCH/MISMATCH verdict compares the failing connection against the fixtures' database, not the one the app was told to use — so MISMATCH does not mean what the card says it means"
    description: |
      `_capture_lines` resolves its database with
      `db_name.resolve_test_database_url(os.environ, db_name.REPO_ROOT)`
      (undefined_table_report.py:482). That function (tests/db_name.py:182-185) reads
      TEST_DATABASE_URL, else derives the per-worktree name — it never reads
      DATABASE_URL. The app engine the failure came out of is built from DATABASE_URL
      (src/nonogram/db/session.py:199). The verdict at
      undefined_table_report.py:553-557 then compares the failing connection's dbname
      against `current_database()` on the *capture* connection and prints MATCH/MISMATCH.

      The suite explicitly supports those two being different: tests/conftest.py:222
      branches on exactly `database_url == resolved` and takes a different path when they
      are not, and the five tests this card exists for
      (tests/test_admin_binding.py:296-308) are NOT db_required and build their app from
      the ambient DATABASE_URL with no monkeypatch (conftest.py:621 only sets it inside
      the function-scoped `db_session` fixture). In any run where TEST_DATABASE_URL is
      unset and DATABASE_URL names something other than the derived name, the verdict
      prints MISMATCH on every occurrence while the failing connection sat exactly where
      it was told to go — the inverse of the card's headline "a connection to the *wrong*
      database is a one-line proof".

      Mitigating, and why this is Important rather than Critical: the raw names are all on
      the page — group-2 prints the app engine's URL, the verdict prints both dbnames, and
      the capture line is labelled "[a connection opened here, not the failing one]". So a
      careful reader is not misled; the *label* overclaims. And
      scripts/run_admin_tests.sh:83 defaults TEST_DATABASE_URL to DATABASE_URL, so a gate
      invoked through that script is unaffected (I could not read the build-gate runner
      itself — see coverage.not_reached).

      No control distinguishes the two causes of MISMATCH:
      `test_a_connection_on_the_wrong_database_is_a_one_line_proof`
      (tests/test_admin_binding.py:894-921) makes the *failing* side the odd one out, and
      nothing exercises a capture that resolved elsewhere. The card's eight declared
      bounds do not name this one.
    suggestion: |
      Cheapest honest fix: add the third name to the verdict and say which pair it
      compares — e.g.
      `group-4 verdict: failing-dbname=X app-engine-dbname=Y capture-dbname=Z
      failing-vs-app=MATCH failing-vs-capture=MISMATCH [capture resolves
      TEST_DATABASE_URL, not DATABASE_URL]`. The app-engine dbname is already in hand at
      _engine_lines (`engine.url.database`). Alternatively prefer the app engine's own URL
      for the capture when the refusal allows it, falling back to the resolved test URL
      and labelling which was used. Either way add the missing control: a probe where
      TEST_DATABASE_URL and DATABASE_URL name different databases, asserting the report
      distinguishes "the connection was elsewhere" from "the capture was elsewhere".
    confidence: medium
    source: static
    violates: null
    root_cause: null
    status: fixed
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/db/session.py
    line: 347
    title: "`_reset_count += 1` is an AugAssign, invisible to CARD-252's derived globals guard — that guard's green is a blind spot, not a check"
    description: |
      `reset_engine` now declares four globals
      (src/nonogram/db/session.py:341) and assigns `_reset_count` with `+=` at :347.
      `tests/test_db_engine_lifecycle.py:197-226`'s `_global_names_assigned_by` collects
      only `ast.Assign` targets, so `_reset_count` is in the `global` statement but not in
      the derived `assigned` set. Measured by re-running that function's logic against the
      current session.py:
        guard as written      : _init_engine {SessionLocal,_engine_url,engine}
                                reset_engine {SessionLocal,_engine_url,engine}  -> equal, green
        with AugAssign added  : reset_engine {SessionLocal,_engine_url,_reset_count,engine} -> unequal, red
      So `test_it_resets_exactly_the_globals_the_builder_creates` still reports agreement
      only because of the AugAssign blind spot — the opposite of the bias its own docstring
      claims ("A shape this function cannot analyse biases it to red rather than to a
      pass", :208-211).

      There is no functional defect: the guard's purpose is to catch a global the *builder*
      sets and the reset leaves behind, and `_reset_count` is the reverse. The finding is
      that the card's implementation record cites that file's greenness as evidence the src
      change is safe, and for this global that green is uninformative.

      Filed low-confidence and non-gating: the honest resolution (teaching the guard about
      AugAssign and then narrowing its claim to builder-set globals) lands in
      tests/test_db_engine_lifecycle.py, which is outside this card's four-file scope.
    suggestion: |
      In scope: declare it as a ninth bound on the card ("the new global is spelled with
      `+=` and so sits outside CARD-252's derived globals equality; that guard's green does
      not cover it"). Out of scope, for a follow-up card: have
      `_global_names_assigned_by` collect ast.AugAssign/ast.AnnAssign targets too and
      restate the equality as "every global the builder assigns is also cleared by the
      reset" (a subset relation), which is what the guard actually means and which stays
      green with a reset-only counter.
    confidence: low
    source: static
    violates: null
