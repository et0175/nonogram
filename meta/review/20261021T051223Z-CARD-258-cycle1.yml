findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_admin_binding.py
    line: 1074
    title: "G-1's sweep claims 'a call added anywhere under src reds this' but catches only the direct-callee shape"
    description: |
      `test_nothing_in_src_calls_the_reset_counter` walks every ast.Call under src/ and
      reads the callee name as `func.attr` when it is an ast.Attribute, else
      `getattr(func, "id", None)`. Every other callee shape yields None and is skipped
      with no record.

      Measured, not argued. Four indirect call shapes were run through the guard's exact
      expression and 0 of 4 were caught:
        getattr(session, "reset_count")()   -> missed
        f = session.reset_count; f()        -> missed
        globals()["reset_count"]()          -> missed
        vars(session)["reset_count"]()      -> missed
      (reproduce: the loop at tests/test_admin_binding.py:1074-1082 over that source.)

      The claim the guard carries is wider than that reach in two places:
      tests/test_admin_binding.py:1060-1061 ("a call added anywhere under it reds this —
      including one written after this card") and src/nonogram/db/session.py:353-355
      ("Nothing in ``src/`` calls it -- held by
      ``test_nothing_in_src_calls_the_reset_counter``"). ADR-0039/R1 requires the claim be
      narrowed to what is measured; ADR-0039/R2 requires a shape the guard cannot analyse
      to be a FAILURE, not a silent pass, with the unanalysable sites named as exemptions
      under R3. Neither is done, and the card's eight declared bounds do not mention it.

      G-1 itself holds today by direct evidence (`grep -rn reset_count src/` finds no call
      site) — this finding is about the guard that is supposed to keep holding it.
    suggestion: |
      Either (a) make the guard default to deny: collect every ast.Call whose callee name
      cannot be resolved to a Name/Attribute and fail on a non-empty list of unanalysable
      sites (an equality against the sites that exist today, per ADR-0039/R3), or (b)
      narrow both claims to what is measured — "no direct `reset_count(...)` or
      `<obj>.reset_count(...)` call exists under src/" — and declare the indirect shapes as
      a measured bound in the card's Worktree notes. (a) is preferable: it is the shape
      ADR-0039/R2 asks for and tests/full_suite_lock.py already cites that discipline.
    confidence: high
    source: static
    violates: ADR-0039/R2
