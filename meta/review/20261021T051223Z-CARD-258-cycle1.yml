  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: tests/helpers/undefined_table_report.py
    line: 238
    title: "`except BaseException` in the guards converts a KeyboardInterrupt during the capture into a report line"
    description: |
      `_guarded` (:238), `pytest_exception_interact` (:126) and `_capture_lines` (:494) all
      catch BaseException. That is right for AC-5's purpose, but it also absorbs
      KeyboardInterrupt and SystemExit: a Ctrl-C landing while the capture waits on
      `engine.connect()` (which carries CARD-097's connect deadline, so the window is up to
      CONNECT_TIMEOUT_SECONDS per failing test) is turned into
      "group-4 capture-connection: FAILED: builtins.KeyboardInterrupt" and the run carries
      on. The comment "named, never swallowed" is true of the name and not of the control
      flow.
    suggestion: |
      Re-raise the two control-flow exceptions before formatting:
      `except (KeyboardInterrupt, SystemExit): raise` ahead of each
      `except BaseException` clause. AC-5's property is unaffected — no diagnostic failure
      is swallowed — and Ctrl-C keeps working during a slow capture.
