verdict: >-
  REFIRE on three gating findings, none of which is a defect in a drawn page.
  The implementation is sound and I found no wrong number on any page: the
  split is real (no puzzle-page constant, default or clue-gutter assumption in
  book_vector_draw; I ran its TEXT half as well as its grid half on CARD-296's
  two layouts against the oracle and both agree), the three pre-chosen plants
  all fire under my own mutations (M2 import leak, M3 ContentStream.ellipse,
  M4 max(1, line.width) -- and M4 reds the zero test while the 60-page corpus
  equality stays green, which is exactly why that plant was needed), the ten
  mutants are of genuinely different shapes rather than ten of one, and AC-5's
  measurement predicted the post-cache figure to within 1 per cent. What has to
  close before merge is three named holes, all cheap: (F-001) the cross-medium
  seam the G-4 refusal is defended by does not read the raster page at all --
  I moved every raster vertical rule 7 px and reversed its stroke order and the
  module stayed 35-green; (F-002) the AC-5 artefact's forward prescription to
  CARD-299 is now inverted by main's own 5d84976c, which this branch merged;
  (F-003) the card's explicit "say so with a reason and name who owns them"
  clause on CARD-294's _cap_height controls was not discharged. G-4's refusal
  is UPHELD, conditional on F-001.

