    Status, Worktree and Started, plus the orchestrator's own DISPATCH block.
    The round's notes are the commit message of 675222c1, which is thorough and
    honest; the merge pass should expect the card itself to carry nothing."
  - "\"35 new tests, 1.39 s\" is now 0.46-0.59 s on HEAD -- the cache the
    orchestrator merged removed most of it. Full-tree collection on HEAD is
    9,326, not 9,322: main's 5d84976c added 4 node ids
    (TestVectorFace_TheCompressedFaceIsCachedAndStillTheSameBytes). 0 removed
    either way."
  - "The answer to the phase's question: the naive-conversion ratio NOW is
    14.54x FASTER than the ink assertion (min of 7, loadavg 7.05/5.53/4.83
    identical at both ends), with a same-session no-cache control reproducing
    the round's 0.69x. Generation is 21.14x (0.833 ms/page against 17.621)."
  - "The brief's framing -- \"a converted assertion writing its own PDF
    measured 0.71x, SLOWER\" -- is now history. The live inversion is the other
    way round: the SHARED-interior arm (8.55x) is now the slower of the two
    file-writing stream arms, because it re-extracts a 24-page PDF's content
    streams per assertion. The artefact's recommendation to share the FILE is
    the part that has to be retracted; what survives is to parse it once per
    fixture."
  - "\"Is the operator alphabet derived or hand-written?\" -- hand-written, but
    the question it raises is answered elsewhere: marks_of is default-DENY and
    raises on any line it cannot classify, which I probed. A text literal
    carrying \"m l S re Do\" is stripped by operator_tokens before tallying and
    read back as one Shown, so no false operator enters; fill_grey, begin_path,
    line_to and paint each emit a line no pattern matches and so raise. A
    NEGATIVE rule width never reaches the parser at all --
    ContentStream.stroke_width raises ContentStreamError(\"a stroke is not
    -0.72 pt wide\") -- so the zero plant sits exactly on the boundary of an
    already-validated range. Not a finding."
  - "\"Is puzzle-page knowledge leaking into the page-kind-free module?\" -- I
    found none. BAND_WIDTH_RATIO, MIN_BAND_FONT_RATIO and slot_room all sit in
    book_puzzle_vector; book_vector_draw holds no gutter or band constant, and
    INK_GREY is derived from png.INK and is an argument at every call site. The
    round only ran GRID + FRAME on CARD-296's layouts; I additionally ran
    draw_clue_digits on example_line_layout (2 entries, font 55) and it agrees
    with the oracle exactly, and guide_icon_layout draws its 4 marks with no
    frame. CARD-296's body prose needs no new routine either --
    ContentStream.text already takes a left edge and a baseline. So the guide
    IS drawable through it."
  - "\"Are the two frozen-set additions earned?\" -- yes, both, and neither
    weakens its set. NON_DRAW_RECEIVER_SITES is held by a SET equality (line
    1695, unrecognised == sorted(NON_DRAW_RECEIVER_SITES)), so a fifth vector
    site fails until named; the new vector branch additionally pins the module
    and refuses a List/Tuple argument, and the dir(ContentStream) surface check
    is real -- M3 (giving ContentStream an `ellipse` method) reds it.
    RENDER_HEAVY_SNAPSHOT's 32nd path is a genuine grep hit
    (vector_puzzle_pages contains puzzle_pages) and the file really does
    allocate two page bitmaps. The residual is F-004, which is a different
    route and not one these additions opened."
  - "\"Are the ten mutants ten variants of one?\" -- no. I re-derived the three
    claimed plants and added seven shapes of my own, and they discriminate on
    different mechanisms: an import set (M2), a class's surface (M3), a
    geometry floor (M4), a stroke ORDER (M8 -- reversing the major sort reds
    test_the_thin_rules_are_stroked_before_the_heavy_ones while the set
    comparison passes, which is the one claim a set cannot make), a type
    centring rule (M6), a tolerance (M7), a borrowed scalar (M9) and a
    cross-medium perturbation (M10). Every file restored and sha256-verified;
    git status clean."
