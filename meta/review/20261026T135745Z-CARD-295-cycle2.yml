findings:
  - id: F-101
    severity: minor
    title: >-
      The seam's placement bound absorbs a uniform raster translation of -1..+5
      device pixels, and the offset it stands in for is exactly derivable
    file: tests/test_book_puzzle_page_vector.py
    line: 1596
    gating: false
    confidence: high
    evidence: >-
      MY FIFTH SHAPE, chosen because it is the one perturbation the
      len(offsets) == 1 trick cannot see: a UNIFORM PURE TRANSLATION of the
      whole raster drawing -- +3 device px on BOTH axes, applied to
      png._draw_grid's every rule AND to png._draw_frame's four sides, so the
      bitmap's grid and frame move together and no edge moves relative to
      another. It is different from all five already fired: M8 and the
      orchestrator's first shape attack stroke ORDER, M10 and the orchestrator's
      fourth attack an ASYMMETRIC translation (verticals only, or horizontals
      only), M4 attacks a width FLOOR, M3 a class SURFACE. A symmetric
      translation preserves count, span and the single-offset invariant, and
      attacks only the magnitude bound. Result, from the worktree root:
      "tests/test_book_puzzle_page_vector.py: 40 passed, 0.59s" -- the seam does
      not see it -- while "tests/test_book_puzzle_frame.py: 16 failed, 84
      passed". The arithmetic says why, and is not specific to +3: the live
      offset is -2 on all four edges with heavy = 6 device px, so
      abs(offset) * 2 <= heavy admits any uniform raster shift d with
      abs(d - 2) <= 3, i.e. d in [-1, +5] -- up to 1.2 pt / 0.42 mm. The
      docstring's framing is also imprecise. It calls the residue "Pillow's own
      line-cap convention for an EVEN-width stroke", but I measured Pillow's
      thick-line centring at widths 1..8 (a vertical line at x = 20 in a fresh
      bitmap): the inked run starts at 20, 20, 19, 19, 18, 18, 17, 17, i.e. the
      offset is -((w - 1) // 2) for every width, odd and even alike, and is -2
      for w = 5 just as for w = 6. So the residue is neither a constant nor an
      even-width phenomenon -- it is an exact function of the heavy rule's own
      width, which the test already has in hand as `heavy`. The round was right
      not to hardcode -2 (CARD-227 changes the weights next wave, and -2 would
      break), but the width-robust form it reached for is a tolerance where a
      width-robust EQUALITY was available.
    remedy: >-
      Replace `assert abs(offsets.pop()) * 2 <= heavy` with the derived
      equality -- `assert offsets.pop() == -((int(heavy) - 1) // 2)` -- and
      restate the docstring bullet as "Pillow centres a width-w stroke so its
      ink starts (w-1)//2 pixels before the coordinate, at any width; PDF
      strokes centred on the coordinate exactly". That reds the shape above,
      stays correct when CARD-227 moves the weights, and turns the one
      sub-claim of the seam that is currently a margin into the measurement the
      other three already are. Cheap alternative if the exact convention is
      judged too much to pin: bound at one device pixel of the stated constant
      rather than at half a heavy rule.
