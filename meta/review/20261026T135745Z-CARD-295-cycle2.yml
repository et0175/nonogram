verdict: >-
  CERTIFIED at 9/10. All three of cycle 1's gating findings are closed, the two
  non-gating majors are closed or defended, and every control I fired
  discriminates: M9 (slot_room returns a page's usable HEIGHT) now reds exactly
  the one equality the fix round added; reverting _state_operators to the
  len({widths}) form reds exactly the new many-widths cell; a 0.02 pt digit
  drift reds AC-3 at SLACK_PT 0.005 and passes at 0.05, which is the round's own
  claim measured; and re-planting cycle 1's M5 draw_dot leaves all 247 green, so
  the F-004 decline is honest rather than quietly obsolete. The fix round is
  unusually disciplined about its own limits -- it took no timing on a loaded
  box, promoted cycle 1's figures into the AC-5 artefact with explicit
  provenance rather than re-deriving them badly, left the pre-cache table intact
  as the honest record, and states the one wall clock it owes. What I found is
  four minor and three trivial items, none of them a wrong number on a drawn
  page. The two that matter: the new seam's placement bound (|offset| * 2 <=
  heavy) absorbs a uniform raster translation of -1..+5 device pixels, and the
  offset it is standing in for is exactly derivable -- my fifth shape, a uniform
  +3 px translation of the raster grid AND frame on both axes, leaves this
  module 40-green while the raster's own file reds 16 (F-101); and the F-004
  decline's supporting claim that confining line_to/paint "forbids the
  vocabulary's ordinary use" is false on today's tree, where the only caller of
  any of the five path primitives anywhere in src/ is ContentStream.round_mark
  itself (F-103). Cycle 1 upheld the G-4 refusal conditional on F-001; that
  condition is NOW MET. One merge-mechanical item: the declaration that
  discharges F-003 is in the working tree only, not in defab5c7 (F-102).

