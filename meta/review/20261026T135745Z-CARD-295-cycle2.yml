  - id: F-103
    severity: minor
    title: >-
      The F-004 decline's "forbids the vocabulary's ordinary use" is false on
      today's tree -- no production module outside book_vector.py calls any of
      the five
    file: tests/test_book_pdf_vector_primitives.py
    line: 1296
    gating: false
    confidence: high
    evidence: >-
      The decline rests on two claims. The first -- that no vertex bound
      separates a dot from a legitimate shape, measured by CARD-296 -- is true
      and is the right reason not to write a fourth source-pattern guard. The
      second is stated in the present tense and is false: "line_to/paint are how
      a page draws ANYTHING at all, so holding them to one module forbids the
      vocabulary's ordinary use". MEASURED: `grep -rn "\.begin_path(|\.line_to(|
      \.close_path(|\.paint(|\.curve(" src/` returns seven hits, all of them
      inside ContentStream.round_mark in book_vector.py itself (lines 864-870);
      `line_to` has no caller anywhere in src/. The ordinary callers the
      orchestrator's own brief-correction 3 names -- draw_frame and
      draw_grid_lines -- call stream.rectangle and stream.line, neither of which
      is in that family. So a THE_CURVE_SITE-style confinement of those four
      calls to book_vector.py would be GREEN on today's tree, would have redded
      cycle 1's M5, and would have redded my planted polygon. It would red
      legitimately the day CARD-296's guide draws an arrow head -- which is the
      real argument, and is prospective. The conclusion survives (a guard that
      has to be relaxed one wave later is the fourth instance of the pattern the
      decline is trying to break), but the reason as written is a measurable
      overclaim about the present, and this card's whole review history is about
      declarations that outlive their measurement.
    remedy: >-
      One clause in the class docstring: say that confining the four would cost
      nothing TODAY (round_mark is their only caller) and would start costing at
      CARD-296/CARD-229, which is the same objection one wave later and is why a
      fourth guard is not worth writing -- rather than stating a present-tense
      fact that the tree contradicts. Correct the brief's point 3 the same way.
  - id: F-104
    severity: minor
    title: >-
      The min-trim fixture is not "the smallest trim the panel offers", and the
      smallest clue type the book can print is 15 px, not 21
    file: tests/test_book_puzzle_page_vector.py
    line: 597
    gating: false
    confidence: high
    evidence: >-
