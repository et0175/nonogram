findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_manager.py
    line: 940
    title: "DB mode: the gate's check and the status write span two sessions (TOCTOU, regression)"
    description: |
      Before this card the DB branch of `set_book_status` read the row, applied
      the published-book and empty-selection rules, and wrote `status` inside ONE
      session (`git show main:src/nonogram/admin/book_manager.py`, the single
      `with self._session_factory() as db:` block). The card splits it:

        940  with self._session_factory() as db:   # read status + selection, checks
        ...
        952      current_status = book_row.status
        953      selection = list(book_row.puzzle_ids or [])
        958  self._refuse_unless_the_planned_book(book_id, current_status, status, selection)
        960  with self._session_factory() as db:   # re-read, then blind write
        965      book_row.status = status

      The second session re-reads the row only to confirm it exists; it does not
      re-check `current_status`, the "Cannot change status of published book"
      rule (line 946) or the empty-selection rule (line 949), and it does not
      compare the selection against the one that was judged. Between the two
      sessions another request can publish the book, or add/remove puzzles, and
      the write proceeds anyway. Net effect: ADR-0035/R1's guarantee ("no book
      leaves draft unless … every cell is within ±3 pp") is now only a sequential
      guarantee, and the pre-existing published-immutability rule became racy in
      the same move. The Flask admin server is threaded by default, so two
      concurrent POSTs are reachable, if unlikely for a single owner.

      The in-memory branch is unaffected (check and write are inline, lines
      928-933).
    suggestion: |
      Read the plan and the selection's records BEFORE opening the write session
      (both already use their own sessions), then do read-check-write inside one
      session: re-read `book_row.status` and `book_row.puzzle_ids` there and
      abort if either differs from what was judged (a compare-and-swap), or
      re-apply the three rules inside that session. That restores the original
      atomicity without nesting sessions.
    confidence: high
    source: static
    violates: ADR-0035/R1
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_manager.py
    line: 436
    title: "save_plan silently un-publishes a published book, bypassing the published-immutability rule"
    description: |
      `save_plan` now writes `status = draft` unconditionally in both storage
      modes (lines 425 and 436) with no status guard. A PUBLISHED book is
      therefore returned to draft by a plan save — with no confirmation and no
      refusal — although `set_book_status` (lines 922/946) and
      `add_puzzles_to_book` (lines 465/488) both refuse to touch a published
      book at all. Verified by execution in this worktree:

        published: published
        save_plan on published -> True
        status now: draft

      The route makes it reachable: `POST /book/<id>/setup-print` (app.py:2087)
      checks only that the book exists, so the owner can un-publish a live KDP
      book by re-saving Print setup; the flash only says "back in draft".

      ADR-0035's clarification the card leans on is explicitly conditional here
      — "Adding or removing puzzles in a book that has left draft (**after
      FR-038's confirmation for a published book**) returns the book to draft" —
      and INV-008 exists for exactly that confirmation step. The owner decision
      recorded in the card's Worktree notes says "non-draft", and the published
      case was never separated out; the card's own test for the decision
      (`TestBookPlanEdit_OnANonDraftBookReturnsItToDraft::test_save_plan_returns_the_book_to_draft`,
      tests/test_book_ready_gate.py:493) uses `ready_for_kdp`, so the published
      case is untested.
    suggestion: |
      Either refuse a plan edit on a published book in `save_plan` (mirroring
      "Cannot change status of published book"), or gate it behind FR-038's
      confirmation the way ADR-0035's clarification requires — and add a test
      for the published case beside the ready_for_kdp one. Whichever the owner
      picks, state it in the `save_plan` docstring, which currently says only
      "A book already in draft is left where it is".
    confidence: high
    source: model
    violates: INV-008
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-003
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/app.py
    line: 2149
    title: "Print setup demotes a non-draft book even when the plan did not change"
    description: |
      `setup_print` calls `save_plan` whenever the submitted form carries the
      plan fields (`if "split_easy" in request.form`, app.py:2122), regardless of
      whether `new_plan` differs from the stored plan. Re-opening Print setup on
      a non-draft book and pressing Save with nothing altered therefore returns
      the book to draft, and the flash asserts something that is false: "The
      plan changed, so the book is back in draft". The card's owner decision is
      about a plan *edit*; an idempotent re-save is not one.
    suggestion: |
      Compare `new_plan` with `_readable_plan(book_id)[0]` and skip both the save
      and the flash when they are equal (DistributionPlan is a frozen dataclass,
      so `==` is exact) — or, at minimum, reword the flash to "The plan was
      saved, so the book is back in draft".
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-004
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 828
    title: "`_selection_records` is not actually fail-closed; its docstring and log line claim it is"
    description: |
      The docstring says a manager built without a puzzle store "reads as empty
      and the gate refuses rather than waving the book through", and the warning
      logs "sees an empty book and refuses". That is only true for plans whose
      cells are large relative to the count. An empty selection PASSES any plan
      where every cell is within 3 pp of zero — i.e. every cell ≤ 3*count/100.
      Verified by execution: a store-less `BookManager`, a book holding one
      unresolvable id, and a plan of `count=1, cells=all zero` →
      `set_book_status(..., "published")` returns True and the book reaches
      published.

      This is the same degenerate configuration the SCOPE+ adaptation of
      tests/test_book_manager.py relies on (`EMPTY_SELECTION_PLAN`, count=1 with
      an all-zero matrix — a plan `prefill` can never produce). The adaptation
      itself is honest (the three tests keep their original assertions and only
      gain a setup line), but it does mean those status tests now pass through
      the one gate configuration that approves an unreadable selection.

      Production is not exposed: `create_app` wires a store on both branches
      (app.py:952/957). The risk is that the claim, not the code, is what a
      future caller will trust.
    suggestion: |
      Make the claim true or drop it: raise (or return a refusal) from
      `_selection_records` when `self.puzzle_store is None` and the book's
      selection is non-empty, rather than returning `[]` and hoping the plan is
      big enough. Then correct the docstring and the log message.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-005
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_manager.py
    line: 838
    title: "N+1: one query and one DB session per puzzle on every exit from draft"
    description: |
      `_selection_records` loops over the book's puzzle ids calling
      `self.puzzle_store.get_puzzle(str(puzzle_id))` (line 838). In DB mode
      `PuzzleReviewService.get_puzzle` (puzzle_review.py:1096) opens its own
      session per call, so a 150-puzzle book costs 150 sessions and 150 SELECTs
      for one status change — and the property test's storage corpus pays it 24
      times per parameterisation. `PuzzleReviewService` has no batch getter, so
      the shape is partly forced by the store's API.
    suggestion: |
      Add a batched read to the store (one `WHERE id IN (...)` query, chunked)
      and use it here; the in-memory branch can keep the dict lookup.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null
