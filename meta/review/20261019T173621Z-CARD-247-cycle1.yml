    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/static/admin.css
    line: 777
    title: "The Region toggle's new face rules sit outside every token pin, by class name rather than by principle"
    description: |
      `test_the_region_toggles_pressed_look_comes_from_tokens` collects only the lines
      that `startswith(".player-region")` and requires every declared value to
      `startswith("var(--")`. The two new rules are named `.player-brush-run`, so they
      are not collected — and they could not have been: `display: inline-flex`,
      `calc(-1 * var(--border-width))` and `color-mix(in srgb, var(--grid-ink) 28%,
      var(--grid-paper))` all fail a literal `var(--` prefix test. The agent's report
      calls this deliberate ("the token rule's assertion is unchanged rather than
      relaxed"), which is true as stated, but the consequence is that the declarations
      styling the Region toggle's face are pinned by nothing more than the whole-file
      `#[0-9a-f]{6}` sweep — an `rgb()`, `hsl()` or named colour added here later passes
      both tests. The CSS comment's own claim, "Lengths and colours are tokens or a mix
      of two of them (G-4)", therefore has no control behind it. (Two notes: the token
      guardrail is CARD-211's G-4; this card's G-4 is accessibility. And
      `.guide-strip-cell:345`, the precedent these rules borrow, is unpinned in exactly
      the same way, so this is not a new hole class.)
    suggestion: |
      Extend the existing test rather than adding another: collect
      `.player-region`-prefixed AND `.player-brush-run`-prefixed rules, and replace the
      `startswith("var(--")` predicate with one that accepts a bare CSS keyword and a
      `calc(`/`color-mix(` whose every colour or length argument is a `var(--…)`. Pin it
      with a control (a literal `rgb(…)` in a `.player-brush-run` rule must go red).
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

