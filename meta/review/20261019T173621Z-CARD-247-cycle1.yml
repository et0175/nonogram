findings:
  - id: F-001
    severity: medium
    category: tech-debt
    type: gap
    file: tests/test_browser_fixture_scope.py
    line: 1245
    title: "Four of the nine rename-table refusals are narrative: deleting them leaves the control green"
    description: |
      `test_the_rename_table_refuses_what_it_claims_to` drives nine deliberately-broken
      tables through `_rename_problems` and asserts, for each, only
      `_rename_problems(table) != []`. Because several broken cases trip more than one
      refusal, four of the nine refusals are never shown to execute.

      Measured, one branch neutralised at a time (`if <cond>:` -> `if False:`), running
      only this control, tree restored byte-identical after each:

        branch 1  not a 3-tuple ................................. killed
        branch 2  old not in CARD-217's record .................. killed
        branch 3  new in record ("a merge, not a move") ......... SURVIVED
        branch 4  new == old ("moves to itself") ................ SURVIVED
        branch 5  new not of the browser family ................. SURVIVED
        branch 6  old/new name different test functions ......... killed
        branch 7  card id does not match CARD-\d+ ............... killed
        branch 8  reason shorter than 8 words ................... killed
        branch 9  old/new also in ADDED_SINCE_BEFORE ............ SURVIVED

      Why each survivor is shadowed: branch 4's case `{old: (card, old, reason)}` also
      trips branch 3, because every legal `old` is by construction in `before`; branch
      5's case `tests/test_cli.py::test_x` also trips branch 6; branch 9's case uses an
      ADDED id as `old`, which also trips branch 2; branch 3's case targets a different
      test function, which also trips branch 6.

      This contradicts the test's own docstring ("Each case below is reported WITH the
      break and absent WITHOUT it"), the sibling test's ("so that the control below can
      show each of them firing (ADR-0039/R1)") and the card's worktree note ("drives all
      nine of them over tables broken on purpose, so none of them is a branch nothing
      executes"). ADR-0039/R1 is `mandatory` and names exactly this: "a claim whose
      control cannot fail is narrative, not coverage, and must be narrowed to what is
      measured or deleted".

      Calibration — the coverage guard itself is NOT weakened. Each survivor is strictly
      shadowed, and the one genuinely dangerous shape (a "rename" that merges two
      recorded ids) is caught a second time by the set-size equality in
      `test_every_rename_entry_moves_one_recorded_id_and_is_attributed`, which goes red
      because `_recorded_node_ids()` is a set comprehension and collapses. So this is a
      defective claim about the control, not a hole in the table — which is why it is
      Important and not Critical.
    suggestion: |
      Make each case name the refusal it is supposed to provoke, and assert that one:

        broken = {
            "moves to itself": ({old: (card, old, reason)}, "moves to itself"),
            "not of this family": ({old: (card, "tests/test_cli.py::test_x", reason)},
                                   "is not a node id of the browser family"),
            ...
        }
        for label, (table, expected) in broken.items():
            problems = _rename_problems(table)
            assert any(expected in p for p in problems), (label, problems)

      Then re-run the nine neutralisations: every branch must take its own case red.
      (The remedy needs the same check as the finding — a fragment assertion that
      matches a *different* refusal's message would reproduce the defect one layer up.)
      Alternatively, per R1's other option, narrow the two docstrings and the card note
      to the five refusals the control actually measures — but the discriminating
      version costs one line per case and keeps the claim.
    confidence: high
    source: static
    violates: ADR-0039/R1
    root_cause: RC-1
    status: open
