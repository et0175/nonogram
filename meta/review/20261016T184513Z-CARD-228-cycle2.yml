findings:
  - id: F-101
    severity: high
    category: tech-debt
    type: gap
    file: tests/test_book_difficulty_dots.py
    line: 1104
    title: "Two of the four limits the widened round-mark guard states about itself are false; a second dot glyph still lands in the package with 198 green"
    description: |
      The fix is a real widening — 1 guarded route became 4, and I confirmed all four controls
      fire against the real package, each mutant in its own fresh process, every file restored
      and shasum-verified:

        C1  draw.bitmap((0,0), mask, fill=INK)            in export/png.py -> KILLED
            (test_no_module_approximates_a_round_mark_another_way)
        C2  draw.point([(x,y) for x in range(9) for y in range(9)])        -> KILLED
        C3  draw.polygon([<10 literal points>])                           -> KILLED
            (both: test_no_module_draws_a_round_mark_out_of_vertices)
        C4  draw.ellipse((0,0,9,9))                                       -> KILLED
            (test_the_package_draws_a_round_mark_in_exactly_one_function)

      What fails is the same thing that failed in cycle 1, one layer in: the class docstring's
      list of "what this instrument cannot see" contains two sentences that are false in the
      direction that matters, and both are refutable by execution.

      SYMPTOM A — "a vertex list this walk cannot count ... treats it as a failure rather than
      a pass, so it is a blind spot that shows itself" (class docstring; repeated verbatim in
      test_no_module_draws_a_round_mark_out_of_vertices' docstring, in the card's notes and in
      b3ba400's commit message). Planted in src/nonogram/export/png.py:

          points = [(50 + 20*cos(i*tau/32), 50 + 20*sin(i*tau/32)) for i in range(32)]
          draw.polygon([*points], fill=INK)

      -> SURVIVED. 198 green; also green with tests/test_suite_profile.py added. This is cycle 1's
      H2 mutant (a 32-gon tier glyph, the one the vertex bound exists for), on the canonical
      `draw` receiver, two characters away from the form the guard catches.

      Mechanism, so the finding is refutable without re-running it: `[*points]` parses to an
      ast.List whose elts is a single ast.Starred, so `isinstance(points, (ast.List, ast.Tuple))`
      passes and `len(points.elts) == 1 <= MAX_FLAT_VERTICES`. Verified directly:
      `[*points]` -> List/elts=1, `(*points,)` -> Tuple/elts=1, `[(0,0), *more]` -> List/elts=2.
      Only the bare name form (`draw.polygon(points)`) is uncountable to this guard.

      This is worse than an ordinary blind spot because the guard teaches the evasion: its own
      assertion message is "vertices this guard cannot count", and the cheapest way for a future
      card to silence that message is to wrap the name in a literal list.

      SYMPTOM B — "a draw object reached by a receiver this package does not currently use
      (DRAW_RECEIVER_NAME has its own completeness test, so a new spelling fails that test
      rather than slipping past this one)". Two mutants, each in its own fresh process:

        M2   def _rogue(canvas, rank): canvas.polygon([<32 literal points>], fill=INK)
             plus a caller passing the real draw object                     -> SURVIVED
        M3b  canvas: ImageDraw.ImageDraw = ImageDraw.Draw(image)
             canvas.polygon([<9 literal points>], fill=INK)                 -> SURVIVED
        M3   canvas = ImageDraw.Draw(image)   (the agent's own tested control)
             canvas.polygon([(0,0),(1,1),(2,2)], fill=INK)                  -> KILLED
             (test_every_draw_object_in_the_package_is_spelled_draw)

      So the agent's claimed control is true as stated and the completeness test is one annotation
      away from silent. test_every_draw_object_in_the_package_is_spelled_draw collects exactly two
      shapes: ast.Assign whose value is a `.Draw(...)` call AND whose target is an ast.Name, and
      function parameters whose annotation is an ast.Attribute named ImageDraw. Everything else
      contributes nothing to `assigned`/`annotated`, so the assertion `== {"draw"}` still holds:
      ast.AnnAssign (M3b), an Attribute target (`self.canvas = ...`), a tuple target, a loop
      target, an unannotated parameter (M2), and a parameter annotated with a bare `ImageDraw`
      name. AnnAssign is the *more* idiomatic spelling in this package, which annotates all 13 of
      its draw parameters and runs `from __future__ import annotations`.

      The test therefore fails when a known shape changes, not when a new receiver spelling
      appears — which is precisely the distinction the fix brief asked this cycle to check.

      Bound, stated rather than overclaimed: the hole is confined to the vertex route.
      _round_mark_sites ignores the receiver entirely, so a circle drawn as a circle
      (ELLIPSE_METHODS) is still caught under any spelling — I verified that path separately
      (C4), and the dingbat route is receiver-agnostic by construction. Nothing in src/ renders
      a dot today (G-5), so this is an unverified future constraint, not a live defect; that is
      what holds it at high rather than critical.

      Cycle 1's premise that this cycle correctly refused is independently confirmed, so the
      review does not rest on it: my own AST scan of every receiver of a Pillow draw-method name
      across src/nonogram/ returns exactly `draw` (48 calls), one inline ImageDraw.Draw(probe)
      (book_pdf_generator.py:3385), `greyscale` (sourcing/image.py:456) and `scaled`
      (sourcing/image.py:893). draw.polygon is real and sits at book_pdf_generator.py:1895.
      Moving polygon/point into ROUND_ENOUGH_METHODS would indeed have reddened a test on honest
      code; cycle 1's F-001 suggestion was wrong and refusing it was right.
    suggestion: |
      Two one-line mechanism fixes, each with the control the project's standing rule asks for:

      1. In test_no_module_draws_a_round_mark_out_of_vertices, require every element of the
         vertex literal to be countable too — `assert all(not isinstance(e, ast.Starred) for e
         in points.elts)` before the length bound — and add a not-caught/caught control pair for
         `draw.polygon([*points])` beside test_a_disc_drawn_point_by_point_is_caught.
      2. In test_every_draw_object_in_the_package_is_spelled_draw, collect the *concept* rather
         than one shape: walk ast.Assign AND ast.AnnAssign AND ast.NamedExpr AND for-targets for
         any `.Draw(...)` value, flatten Attribute/Tuple/Starred targets, and assert any
         non-Name target is itself a failure; and classify parameters by whether their enclosing
         function body writes an attribute call on them from ALL_DRAW_METHODS, so an unannotated
         `canvas` is caught by what it does rather than by how it is spelled. Then re-plant M2
         and M3b as controls.

      Alternatively — and this is the cheaper honest move if the mechanism is not to be widened —
      delete the two false sentences from the class docstring and replace them with what the
      mechanism actually guarantees: "a vertex list spelled as a bare name is a failure; a vertex
      literal containing a starred unpack is NOT inspected", and "a draw object assigned to a
      plain local name under a second spelling fails the completeness test; one reached by an
      annotated assignment, an attribute target or an unannotated parameter does not". A named
      limit costs nothing; a false limit costs the next four cards.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-102
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_difficulty_dots.py
    line: 843
    title: "The dingbat guard's limit list omits the computed-string route, while the vertex guard's analogous route is documented"
    description: |
      I pushed on _dingbat_literals exactly where the brief asked, one mutant per fresh process
      in src/nonogram/export/png.py. The mechanism is wider than I expected and matches its own
      stated wording precisely:

        f-string format spec   draw.text(xy, f"{word:\u25cf^12}")      -> KILLED (both the
                               offenders test AND the exemption-equality test)
        implicit concatenation draw.text(xy, "\u25cf" "\u25cb")        -> KILLED (both)
        \u escapes             (resolved by the parser into the Constant) -> covered by the above
        f-string literal part  (the agent's own control)               -> covered

      A dingbat in a module-level constant later interpolated is a string literal and is caught
      for the same reason. So _dingbat_literals does see every *string literal* route I could
      construct, including the three the brief named as unchecked, and the exemption equality is
      load-bearing: both red paths above fired it.

      Two routes are NOT literals and survive:

        chr()        glyph = chr(0x25CF)*rank + chr(0x25CB)*(3-rank); draw.text(...)  -> SURVIVED
        bytes decode draw.text(xy, b"\xe2\x97\x8f".decode("utf-8"))                   -> SURVIVED

      The test's own sentence is exact ("no module in src/nonogram/ writes a string literal
      holding a ROUND_DINGBATS codepoint"), so claim and mechanism agree there. What is missing
      is symmetry in the honesty: the class docstring enumerates four things the instrument
      cannot see and this is not among them, and b3ba400's commit message says "the character
      route is closed package-wide", which one chr() call refutes. The vertex guard's equivalent
      route is documented; this one is not. Low because chr() is not a spelling anyone reaches
      for when "\u25cf" is available, and because the exemption equality makes the literal route
      genuinely closed.
    suggestion: |
      Add the computed-string route to the class docstring's limit list beside the dynamically
      dispatched draw call — one line, naming chr()/bytes-decode/unicodedata.lookup — and narrow
      the commit-message-level phrasing in the card notes from "closed package-wide" to "every
      string literal in the package, docstrings included". Optionally also exclude the assets
      the walk cannot see (non-.py files) in the same line.
    confidence: high
    source: static
    violates: null
    root_cause: RC-2
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

