  - id: F-104
    severity: low
    category: tech-debt
    type: risk
    file: tests/test_book_difficulty_dots.py
    line: 954
    title: "F-006's tautological clause was relocated into test_the_walk_actually_sees_the_package rather than dropped"
    description: |
      F-006 asked for the removal of test_the_real_packages_one_site_is_the_dot_drawer_itself,
      on the ground that its three assertions each derived both sides from the same source. The
      test is gone (the name now appears once, in an explanatory comment), and the real check
      was genuinely strengthened: test_the_walk_actually_sees_the_package now resolves
      `f"def {THE_DRAWING_SITE[1]}"` against the source on disk instead of a hardcoded name.
      I verified the claim that nothing was lost: a typo in THE_DRAWING_SITE[1]
      ("_draw_difficulty_dotz") turns two tests red — test_the_walk_actually_sees_the_package and
      test_the_package_draws_a_round_mark_in_exactly_one_function.

      But line 954 also carries over the removed test's tautological assertion:
      `assert getattr(book_pdf_generator, THE_DRAWING_SITE[1]) is _draw_difficulty_dots`. Because
      _draw_difficulty_dots is imported from book_pdf_generator at module scope, this can only
      fail by ImportError at collection, never by assertion, and on the one input that could
      break it (a typo in the literal) the line above it already fails first. The fix removed
      the decorative test and kept one of its decorative assertions.
    suggestion: "Drop the getattr clause; the `f\"def {THE_DRAWING_SITE[1]}\" in sources[...]` line above it is the whole of its discriminating power."
