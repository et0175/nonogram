  - id: F-005
    severity: low
    category: tech-debt
    type: gap
    file: tests/test_book_pdf_two_up.py
    line: 270
    title: "The band comparison discards position, so a two-up band's horizontal placement is unverified"
    description: |
      `_same_ink` compares `_ink(...)` crops — the band's tight ink bounding box — so it
      proves the glyphs are identical but says nothing about where on the page they sit.
      A `_set_band` that centred the line on the wrong x (e.g. the trim's centre instead
      of `band.center_x`, which differs by (gutter - outside)/2 on a mirrored page) would
      pass every AC-251 assertion. The vertical placement IS pinned (the 12 mm strip is
      cropped at hand-computed millimetres, and `test_the_two_bands_are_not_the_same_line`
      shows the two strips differ); only the horizontal is not.
      The value itself is COMP-007's (`header_band(slot).center_x`), so the risk is low —
      but the card's claim that a slot's band "is the same ink" as a single page's band is
      only half-measured.
    suggestion: |
      Assert the ink box's left edge too, e.g. compare `_ink_box(page, top_mm)[0]` against
      the reference page's, or crop both bands on the same x-window before comparing.
