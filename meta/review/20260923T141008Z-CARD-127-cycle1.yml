    title: "[out-of-scope] Finalise now overstates the interior page count by pages_saved; CARD-129's gutter check will consume it"
    description: |
      `interior_page_count(len(puzzles_in_book))` (the one-argument call) is by design the
      un-paired plan, so the Finalise screen now shows a count that exceeds the interior's
      real page count by `pages_saved` on every book that pairs — the card's own 9-puzzle
      render saved 3 of 20 pages (~15%), and Book 1 profiles of small easy puzzles will
      save considerably more. EC-034 states "the page count finalise checks equals the
      interior's page count" (meta/architecture/requirements.yml:3584), which is now false
      for a systematic reason rather than the pre-existing rare one (a dropped member).
      The card explicitly defers this (item 4: the generator returns both counts "so
      CARD-128/129 and the checkpoint can print it"; app.py already carried the comment
      "CARD-129 owns the exact equality (EC-034)"), so this is NOT a failure of this card's
      contract and is filed as out-of-scope.
      History supports flagging it: `app.py` (6 of 11 commits) and
      `templates/book_finalize.html` (4 of 11) are the two strongest co-change peers of
      book_pdf_generator.py in the last 12 months, and both are absent from this diff.
      The concrete downstream risk: CARD-129 ("Finalise refuses when the page count needs a
      larger KDP gutter than the stored one") computes its gutter requirement from this
      number — an overstated count can demand a larger gutter, or refuse a book, that the
      real interior does not warrant. CARD-129 must switch the call to
      `interior_page_count(count, puzzle_pages)` or consume `BookExport.interior_page_count`.
    suggestion: |
      No change requested in this card. Record the dependency on CARD-129's card body so
      the gutter check is not built on the un-paired number.
