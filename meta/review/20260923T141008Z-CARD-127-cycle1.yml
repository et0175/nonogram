  - id: F-004
    severity: low
    category: tech-debt
    type: gap
    file: src/nonogram/admin/book_pdf_generator.py
    line: 307
    title: "_set_band drops the export's elide-at-the-floor pass, so the docstring's 'same rule' claim is not exact"
    description: |
      `pdf._draw_header` fits a header in three steps: measure, shrink once to
      `_MIN_HEADER_FONT_RATIO`, then — if it still overflows — elide the first piece
      (`_elided`, export/pdf.py:374-378). `_set_band` implements the first two and stops:
      a band line still too wide at the font floor would be drawn past `room` rather than
      elided. Unreachable with "Puzzle N · Tier" (the docstring's own argument, and a
      correct one), but the docstring claims "the same shrink-to-fit rule the export's
      header uses" without recording the missing third step, which is the kind of claim a
      later reader relies on.
    suggestion: |
      Either add the elide pass, or narrow the docstring to say exactly which of the
      export's three steps are reproduced and why the third cannot be reached
      (one-piece header, bounded text).
    confidence: high
