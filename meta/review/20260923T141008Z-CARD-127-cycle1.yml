findings:
  - id: F-001
    severity: high
    category: tech-debt
    type: bug
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1032
    title: "A layout failure during the pairing walk escapes interior() unnamed, breaking the documented Raises contract"
    description: |
      `interior()` calls `plan = self.puzzle_pages([...])` at line 1032, outside the
      `try/except` (lines 1050-1064) that converts a drawing failure into
      `RuntimeError(f"puzzle {named} could not be drawn: {e}")`. `compute_pair_layout`
      raises `ValueError` when "one of its clue sets is empty while the other is not"
      (export/layout.py:1602-1607), so a malformed member with a same-tier neighbour
      aborts the export with a bare, anonymous error.

      Reproduced against this worktree (PYTHONPATH=<worktree>/src):
        row id "HALF" with clues_rows present and clues_cols == []:
          * [HALF] alone                     -> RuntimeError: puzzle 'HALF' could not be drawn: ...
          * [HALF, good] both tier "easy"    -> ValueError: first: clue sets disagree about the grid: ...
          * [good, HALF] both tier "easy"    -> ValueError: second: clue sets disagree about the grid: ...
          * [HALF, good] different tiers     -> RuntimeError: puzzle 'HALF' could not be drawn: ...

      This is exactly the contract `interior()`'s own docstring states ("The message
      names the puzzle's `id`, which is the only thing in the raised text a 120-puzzle
      book can be searched by", lines 999-1002) and that
      `TestBookPdf_UndrawablePuzzleAbortsNamingThePuzzle` exists to protect ("the owner
      has to be able to tell *which* member from the message alone (a 120-puzzle book
      offers no other way to look)", tests/test_book_pdf.py:705-710). That test's fixture
      fails at draw time (grid=None), not at layout time, so the regression is invisible
      to the suite.

      Reachability is the same "API-contract, not a production scenario" class the
      existing test class declares for itself: `add_puzzle` refuses such rows today. But
      the set of inputs that hit the unnamed path is now materially larger than the set
      that hits the named one, because INV-009 groups the book order by tier — after
      CARD-126 almost every member HAS a same-tier neighbour, so almost every malformed
      member now takes the anonymous path.
    suggestion: |
      Either (a) keep the failure inside the per-page boundary: wrap only the
      `compute_pair_layout(...)` call in `puzzle_pages` and treat an exception as
      "this pair does not pair" (`pair = None`), so the bad row reaches `_blank_page`
      inside the try/except that names it; or (b) hand the ids to the walk (or wrap the
      `self.puzzle_pages(...)` call in `interior()`) and re-raise
      `RuntimeError(f"puzzle {ids} could not be laid out: {e}") from e`.
      Add a test with a same-tier neighbour to
      `TestBookPdf_UndrawablePuzzleAbortsNamingThePuzzle` — the existing fixture cannot
      reach this path.
    confidence: high
    source: static
    violates: null
    root_cause: RC-1
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

  - id: F-002
    severity: low
    category: tech-debt
    type: risk
    file: src/nonogram/admin/book_pdf_generator.py
    line: 1091
    title: "The page-plan tripwire no longer ties the plan back to the puzzle count"
    description: |
      `planned = interior_page_count(count, len(plan))` still catches a page-BUILD /
      page-PLAN disagreement (a divider per level, a packed answer key: the loops would
      emit more pages than the plan's terms allow), so it has not become fully
      self-fulfilling. But the puzzle-page term used to come from `count` — this call's
      own input — and now comes from `len(plan)`, a number the walk produced. Nothing at
      runtime asserts that the walk covers every puzzle exactly once: a walk that dropped
      a puzzle would shorten `len(plan)`, the tripwire would agree with itself, the book
      would ship without that puzzle, and its answer page would still be printed.
      (A duplicate would print twice, also silently; an out-of-range number is the one
      case that still fails, via IndexError at line 1049.)
      The coverage property is real and is covered — by
      `test_PropertyTest_BookPairing_InOrderSameTierFittingNeighboursOnly` — but only in
      the test tree, not by the runtime guard that exists precisely so this class of
      change fails loudly.
    suggestion: |
      One line beside the existing check, e.g.:
        printed = [n for entry in plan for n in entry.numbers]
        if printed != list(range(1, count + 1)):
            raise RuntimeError(f"the page plan prints {printed}, not puzzles 1..{count}")
      It restores the input-derived half of the guard and is what CARD-134 will want when
      it rewrites the answer term.
    confidence: high
    source: static
    violates: null
    root_cause: null
    status: open
    fixed_in: null
    dismissed_reason: null
    learned_pattern: null

