  raw: '- [ ] CARD-515 review 1 F-003: after CARD-515 a whitespace-only DATABASE_URL counts as unset, as an empty one already did, so the panel starts in in-memory mode and logs "DATABASE_URL not set"; writes are lost on restart. On main before CARD-515 the whitespace case failed on every request. `_configured_hostname` already refuses a blank REMOTE_HOST. Whether the deployed panel (REMOTE_HOST set) should refuse to start without a database is an owner decision.   @tech-debt'
  source_line: null
  intent: null
  category: tech-debt
  status: done
  owner_ruling: 'Owner 2026-11-22: refuse to start on the deployed server (REMOTE_HOST set) without a database; keep the in-memory fallback locally.'
  needs_owner_decision: false
  scored_at: '2026-11-22'
- id: IDEA-227
  title: Two kill-matrix runs in one tree can still leave a mutant on disk (reported, not prevented)
  raw: '- [ ] CARD-315 case (D): a second kill-matrix run in the same tree backs up the first run''s mutant as pristine; since CARD-315 it raises ConcurrentWrite, but the mutant can stay on disk. Preventing it needs a per-tree lock (one run per tree). Nothing runs two in one tree today. Owner decision: add the lock, or leave it reported.   @tech-debt'
