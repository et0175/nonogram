tdd: false            # not the project's practice; cards opt in via `TDD: true`
# THE VALIDATOR OF RECORD. There are two copies of the architecture validator on
# this box and they disagree, so a figure without a binary attached is not a
# figure.
#
# CURRENT, re-measured 2026-10-31 on main after CARD-318 merged (which closed ten
# dead refs, 100 -> 90 as sets):
#
#   forge_1       0 error(s), 90 warning(s), 0 info
#
# The 102 below was measured 2026-10-29 and went stale the moment a card closed a
# ref. It is kept, dated, rather than overwritten, because two rounds quoted it
# as current and a reader needs to see which figure they were holding:
#
#   forge_1       0 error(s), 102 warning(s), 0 info   <- STALE 2026-10-29
#   plugin cache  1 error(s), 102 warning(s), 0 info   <- STALE 2026-10-29
#
# A count here is a DATED READING, never a current fact: re-derive before citing
# it, and diff the WARN sets with `comm` rather than comparing totals, because a
# +1/-1 pair hides inside an unchanged total.
#
# The plugin cache's single error is a REGEX ARTEFACT, not a finding:
#   [ERROR] ADR-0025 circular supersession: ADR-0025 -> ADR-0031 -> ADR-0025
# Its adr_integrity.py counts "supersedes" and "superseded by" as two edges.
# Verified by the orchestrator: `validate.py` is BYTE-IDENTICAL between the
# copies (`diff -q` clean) and `validators/adr_integrity.py` is the ONLY
# differing SOURCE file (`diff -rq` over the two script trees names it plus
# __pycache__ entries, nothing else). The honest error count here is 0.
#
# Why this key exists at all: BOTH wave-65 implementation rounds reported the
# cache's phantom error as pre-existing fact, and the orchestrator once
# announced it had "been running the wrong validator all session" and had to
# retract it. The cost was paid three times before anything was written down.
# Added by CARD-308, whose AC-1 could not close on its own branch because
# /commit excludes meta/ from card branches.
architecture_validator:
  path: /Users/omelnikova/MyProjects/forge_1/forge/skills/architect-validate/scripts/validate.py
  command: "--root meta/architecture --phase all"
  reason: >-
    forge_1 is the validator of record. The forge plugin cache copy reports a
    spurious ADR-0025 circular-supersession ERROR because its adr_integrity.py
    counts "supersedes" and "superseded by" as two edges; validate.py itself is
    byte-identical between the copies and validators/adr_integrity.py is the
    only differing source file. The honest error count on this board is 0, and
    no reported figure is meaningful without the binary named beside it.

review:
  enabled: true
  min_score: 8
  max_cycles: 3
  # "off", 2026-10-23. Quoted on purpose: a bare `off` is YAML False, reads back
  # as 0 and silently means "escalate only on a strict fall". forge's own
  # kanban SKILL.md documents when to switch this off: the score judges the
  # state at the current DEPTH of scrutiny, so a deeper cycle scores the SAME
  # code lower while the card converges. This board shows that shape on
  # CARD-264 (9.6 -> 7.65 -> 7.6 after the 8h spot-check went deeper).
  # family_regression below stays as the stall detector.
  min_improvement: "off"
  build_fix_attempts: 2
  scope_gate: on
  # warn, 2026-10-23: writes the [Family] note but never escalates (`off` is
  # refused by forge in run auto/autonomy, CARD-154). The retro's 2026-10-20
  # precedent already treats the flag as a signal to surface at the wave
  # boundary when findings are record-only; this makes that the default.
  # A code-implicated family is still visible in the note -- raise it to `on`
  # if one ever slips through unescalated.
  family_regression: warn
  parallel: false    # keep off: heavy reviewers x max_concurrent is the cost cliff

  test_command: "./.venv/bin/python -m pytest"

  # HOW A GATE RECORDS THE HOST (CARD-292 / AC-6, owner-facing convention).
  # A gate that reds under contention and greens idle is not a verdict about
  # the tree, and this board has argued about four such verdicts (CARD-218's
  # 101 skips, CARD-271's Page.goto, CARD-276's six identical deaths,
  # CARD-283's main-was-red). Every gate row therefore carries THREE host
  # cells, written into the gate's own output file BEFORE the first test runs
  # and again after the last:
  #
  #   load-start / load-end   the `load` cell of `host_cells:` below, at both
  #                           ends.
  #   rival-pytest            the `rival-pytest` cell of `host_cells:` below,
  #                           at both ends. The commands are written THERE AND
  #                           NOWHERE ELSE, including not here: CARD-304's
  #                           `test_each_prescribed_command_is_written_in_one_place_in_config_yml`
  #                           reds if one of them is restated in this prose,
  #                           because a prescription corrected in one copy
  #                           survives in the other -- ADR-0039/R4's last
  #                           clause, which is the only part of R4 the
  #                           executing check reaches.
  #                           > 0 means a rival run. THIS CELL HAS NOW
  #                           BEEN WRONG TWICE, so it carries the truth table
  #                           that earned it (measured 2026-10-27, four cases,
  #                           a real venv pytest launched both ways):
  #
  #                             instrument                      (c) (d) (d2) (a) (b)
  #                             pgrep -f 'pytest'                0   1   1    1   1
  #                             pgrep -fi 'python.*pytest'       0   *   1    1   1
  #                             pgrep -f 'm pytest'              0   1   1    1   0
  #                             pgrep -f 'bin/python -m pytest'  0   0   1    0   0
  #                             pgrep -f 'MacOS/Python.*pytest'  0   0   0    1   1
  #                             ps|awk first-token-is-python      0   0   0    1   0
  #
  #                           THE LAST ROW'S (b) CELL READ 1 UNTIL 2026-10-29,
  #                           AND IT IS 0. CARD-304 re-measured it against a
  #                           live console-script run: the awk keys on
  #                           ` -m pytest`, and (b)'s argv is
  #                           `.../MacOS/Python .../.venv/bin/pytest ...`,
  #                           which never holds that substring -- the SAME
  #                           mechanism this table already records three rows
  #                           up for `pgrep -f 'm pytest'`, transcribed wrong
  #                           into the row that replaced it. The same awk
  #                           keyed on /pytest/ instead of /-m pytest/ reads
  #                           0 -> 1 on (b), so the blindness is in the
  #                           pattern and not in `ps`. Kept rather than
  #                           widened, because /pytest/ counts any python
  #                           process whose argv merely mentions pytest and no
  #                           control for THAT direction has been measured;
  #                           it is a declared bound in `host_cells:` below,
  #                           tolerated only because `test_command` above
  #                           starts pytest as `-m pytest`, which is asserted.
  #
  #                           A SIXTH CASE, FOUND 2026-10-28 DURING WAVE 63, AND
  #                           IT RETIRES ROW 5. (d3) a `zsh -c` wrapper whose argv
  #                           names the FRAMEWORK PATH -- which is what this
  #                           harness actually produces, because the agent shell
  #                           invokes the venv python by absolute path:
  #
  #                             instrument                       (d3)  truth
  #                             pgrep -f 'MacOS/Python.*pytest'   4-7    0-1
  #                             ps|awk first-token-is-python      =truth
  #
  #                           Measured six atomic `ps` snapshots: the pgrep form
  #                           read 6 EVERY TIME while no pytest was running at
  #                           all, and 4-7 generally. It is STRUCTURALLY
  #                           false-positive here. The five-case table above did
  #                           not catch it because its (d) wrapper said
  #                           `python -m pytest` and never named the framework
  #                           path -- THE NEGATIVE CONTROL WAS TOO WEAK, in
  #                           exactly the way ADR-0039/R4 warns about, on the
  #                           instrument R4 was promoted around.
  #
  #                           The prescribed form is verified in BOTH directions
  #                           against a live PID: baseline 1 (a real sibling
  #                           pytest, cwd confirmed), stays 1 when a
  #                           framework-path wrapper is added, RISES to 2 for a
  #                           real run, FALLS back to 1 when that run is killed.
  #
  #                           TWO MORE TRAPS MET WHILE FIXING THIS, both of which
  #                           produced a wrong instrument that LOOKED right:
  #                             * `ps -o comm` is TRUNCATED to 16 chars on macOS
  #                               (`/Library/Framewo`), so a filter keying on the
  #                               executable NAME silently matches nothing.
  #                             * `awk '$1 ~ /python$/'` over `ps -eo
  #                               pid=,command=` tests the PID, not the
  #                               executable -- it reads 0 forever and passes for
  #                               correct. Hence `ps -eo command=` with no pid
  #                               column, so $1 really is the executable.
  #
  #                           A THIRD TRAP, MEASURED 2026-10-29 BY CARD-304, AND
  #                           IT MAKES A NEGATIVE CONTROL VACUOUS RATHER THAN
  #                           WRONG: a synthetic (d)/(d2)/(d3) wrapper written as
  #                           `zsh -c ': <text>; sleep N'` DOES NOT EXIST in `ps`
  #                           by the time anything looks. zsh execs its last
  #                           command, so the process's argv is replaced by
  #                           `sleep N` and the text the control is about is gone
  #                           -- the instrument then reads "did not rise" because
  #                           the near-miss was never there. Measured: argv
  #                           `'sleep 20'` for the tail form, and the full
  #                           `/bin/zsh -c : ... -m pytest ...` for
  #                           `zsh -c ': <text>; sleep N & wait'`, which forks.
  #                           A negative control therefore has to assert its own
  #                           probe is VISIBLE before it concludes anything, and
  #                           CARD-304's check does
  #                           (`test_each_near_miss_probe_is_visible_to_ps`).
  #
  #                           A FOURTH FALSE-POSITIVE SOURCE, same date, same
  #                           card: a SEARCH TOOL spawned by the act of
  #                           measuring. `grep`/`ugrep`/`rg` carry the pattern in
  #                           their own argv, so a probe that excludes only
  #                           shells still counts one. It is case (e) in
  #                           `host_cells:` below. The prescribed `ps|awk` form
  #                           is immune because $1 is then `/usr/bin/grep`, and
  #                           that immunity is now asserted rather than reasoned
  #                           -- asserted ON THE GREP, which is the part that
  #                           took two goes. zsh FORKS for a pipeline, so the
  #                           process a harness holds is the wrapper, and the
  #                           wrapper's own argv carries the pattern too: an
  #                           assertion on it holds whether or not a search
  #                           tool ever started, which was measured by giving
  #                           the grep a flag it does not have (it died on
  #                           arrival, no search tool existed on the host, and
  #                           every assertion passed -- review cycle 1, F-001).
  #                           The check now requires a CHILD of that wrapper
  #                           whose own $1 is not a shell, which is the same
  #                           field the immunity itself turns on, and that
  #                           requirement carries its own standing control in
  #                           both directions (a search tool really there, and
  #                           one that dies on arrival).
  #
  #                           (a) pytest via `python -m pytest`; (b) via the
  #                           `.venv/bin/pytest` console script; (c) nothing
  #                           running. The last two are THE CONTROLS, and both
  #                           are a `zsh -c` with NO pytest running whose own
  #                           argv merely spells one: (d) `: python -m pytest
  #                           tests/foo.py`, (d2) `: .venv/bin/python -m pytest
  #                           tests/`. (*) `-fi 'python.*pytest'` reads 1 on
  #                           (d) and 0 on a wrapper that says *pytest* but not
  #                           *python* -- it depends on the wrapper's wording,
  #                           which is itself the disqualification.
  #
  #                           THE LAST ROW PASSES FOUR OF THE FIVE AND IS THE
  #                           ONLY ROW THAT PASSES MORE THAN THREE; its (b) is
  #                           the declared bound recorded above. This sentence
  #                           read "ONLY THE LAST ROW PASSES ALL FIVE" while the
  #                           row's own (b) cell was a transcription error --
  #                           a summary of a table, inheriting the table's
  #                           wrong cell. Read row 4:
  #                           the form this convention prescribed between
  #                           d61f0be1 and e4d33dfa is 1 when nothing runs and
  #                           0 when something does -- wrong in BOTH
  #                           directions, the exact inverse of an instrument.
  #                           Row 3 is the remedy CARD-292's review cycle 2
  #                           prescribed; its fix round measured it, refused it
  #                           and said so, which is the behaviour this table
  #                           exists to make possible. Row 3's (b) cell read
  #                           1 here until CARD-292's cycle 3 recomputed it:
  #                           it is 0, because the console script's argv holds
  #                           `bin/pytest` and never ` -m pytest`. So row 3 is
  #                           wrong in BOTH directions too, like row 4. The
  #                           orchestrator had measured that 0 an hour earlier
  #                           and transcribed a 1 into this table -- which is
  #                           why the table is here: a figure is a claim, and
  #                           its control is recomputation.
  #
  #                           TWO REJECTED FORMS, both of which LOOK like they
  #                           work:
  #                             `pgrep -fc ...`  -- BSD/macOS pgrep has no -c
  #                               flag. Exits 2 with a usage line, and in a
  #                               `$(...)` cell yields an EMPTY host cell, not
  #                               a count.
  #                             `pgrep -f 'bin/python -m pytest' | wc -l`
  #                               -- reads 0 WHETHER OR NOT pytest is running,
  #                               so it never errors and always looks fine.
  #                               The venv's python is a macOS FRAMEWORK
  #                               python: it re-execs through Python.app, so a
  #                               live run's argv is
  #                               `/Library/Frameworks/.../Python.app/Contents/MacOS/Python -m pytest ...`
  #                               and the literal `bin/python` never appears.
  #                               This was the correction for the first defect
  #                               and it was WORSE than what it replaced: the
  #                               first failed loudly, this one silently.
  #
  #                           DECLARED BOUND, RESTATED 2026-10-29 BY CARD-304
  #                           BECAUSE IT WAS ABOUT THE RETIRED FORM: this
  #                           paragraph read "the working pattern keys on the
  #                           framework-python re-exec path, so on a venv built
  #                           from a NON-framework python it would read 0 and be
  #                           blind again". That is true of
  #                           `pgrep -f 'MacOS/Python.*pytest'`, which the (d3)
  #                           case above RETIRED, and false of the form that
  #                           replaced it: `$1 ~ /[Pp]ython[0-9.]*$/` matches a
  #                           plain `.venv/bin/python` as readily as the
  #                           framework re-exec, so a non-framework venv is the
  #                           one host shape this instrument is NOT bound by. A
  #                           bound written for an instrument outliving that
  #                           instrument is ADR-0039/R4's last clause again, in
  #                           the same cell, one paragraph down.
  #                           The bounds that are real: the cell is verified on
  #                           arm64 Darwin 25.6 only; `ps -eo`/`sysctl` are BSD
  #                           spellings and neither is POSIX-portable; and the
  #                           (b) blindness above. Re-run the cases before
  #                           trusting it elsewhere -- CARD-304's check runs
  #                           them on every suite run on THIS host, which is
  #                           what makes "verified here" a test rather than a
  #                           sentence -- and note the lesson that actually
  #                           generalises: an instrument needs a POSITIVE
  #                           control (it must rise) AND a NEGATIVE one (it
  #                           must not rise on case (d)). A cell reading 0
  #                           because the box is quiet and a cell reading 0
  #                           because the command is blind are identical from
  #                           the figure alone.
  #                           THIS is the cell that decides whether the run was
  #                           quiet; the load averages are context. NOT
  #                           `ps -Ao command | grep -c '[m] pytest'`, which was
  #                           the idiom in use and which counts THIS AGENT'S OWN
  #                           `zsh -c` wrapper lines: measured 2026-10-27 it
  #                           returns 1-3 with no pytest running at all, so its
  #                           baseline moves with the shape of the command that
  #                           asks -- measured 2 by CARD-292, 3 by the
  #                           orchestrator an hour later, and 1 by CARD-292's
  #                           fix round. Three readings, three values, for a
  #                           figure that was being used as a constant.
  #   per-test ceiling        whether any test's SUMMED setup+call+teardown
  #                           reached tests/hang_guard.py's HANG_SECONDS
  #                           (120 s), and the dearest test's figure.
  #
  # WHY rival-pytest AND NOT THE LOAD AVERAGE, measured on this box 2026-10-26
  # and re-derived 2026-10-27: with NO pytest running at all the 1-minute load
  # average here is 4.6-14.4 -- it is the owner's desktop (WindowServer,
  # IntelliJ, Chrome, a video decode), which the board does not get to
  # schedule. "Wait for a quiet box" was therefore waiting for something that
  # never arrives, and it held CARD-292 for a whole wave. The operative
  # definition of quiet is NO RIVAL PYTEST, which meta/kanban/.full-suite.lock
  # and CARD-255's foreign-holder guard already enforce and which nothing else
  # enforces.
  #
  # AND THE ONE THAT COST THE MOST: a gate command run through an agent's
  # shell tool inherits that tool's own wall-clock timeout, 120 s by default
  # on this harness. A run cut there returns a truncated log and a non-zero
  # exit with NO summary line -- indistinguishable from a suite failure, and
  # the thing CARD-276 attributed to a card's diff twice. Any gate invocation
  # longer than two minutes must pass an explicit timeout (600 s is this
  # harness's maximum for a foreground call) or run in the background. A gate
  # row with no summary line is a MEASUREMENT defect, never a tree verdict.

  # THE SAME CONVENTION AS DATA (CARD-304, AC-1 and AC-2). Everything above is
  # prose, and prose carried this cell's defect three times: a flag that does
  # not exist on this platform, a pattern that cannot match, and a bound
  # written for a retired instrument. So the part a machine can act on lives
  # here, and `tests/test_suite_profile.py`'s
  # `TestHostCells_ThePrescribedInstrumentsExecuteAndRespond` executes it:
  # every `command` is run and must exit 0 with stdout matching `stdout`, and
  # the `rival_pytest` truth table is run case by case against live probes.
  #
  # It is a JSON document inside a YAML block scalar on purpose. YAML is what
  # reads this file, and JSON is what the test can parse with the stdlib --
  # PyYAML is NOT in ADR-0006/R1's dependency baseline (it is in this venv
  # only incidentally), and a hand-rolled YAML reader in a test would be one
  # more unproven instrument in the file about unproven instruments.
  #
  # Readings are DELTAS, never absolutes: a sibling worktree's gate counts in
  # the rival-pytest cell, so the only stable quantity is the change a probe
  # makes. A baseline that moved between the two readings around a probe is a
  # refusal to judge, not a verdict.
  host_cells: |
    {
      "shell": "/bin/zsh",
      "exit_check": "set -o pipefail, then exit 0 required",
      "measured_on": "2026-10-29, CARD-304, arm64 Darwin 25.6, venv python 3.14 (framework build)",
      "placeholders": {
        "{venv_python}": "the venv interpreter as the board spells it, sys.executable",
        "{argv0}": "argv[0] a LIVE venv run actually shows, i.e. the framework re-exec path; read from a child's sys.orig_argv[0] rather than assumed"
      },
      "cells": [
        {
          "id": "load",
          "recorded_at": ["start", "end"],
          "command": "sysctl -n vm.loadavg",
          "stdout": "^\\{ +[0-9.]+ +[0-9.]+ +[0-9.]+ +\\}$",
          "role": "context only; it does not decide whether a run was quiet"
        },
        {
          "id": "rival-pytest",
          "recorded_at": ["start", "end"],
          "command": "ps -eo command= | awk '$1 ~ /[Pp]ython[0-9.]*$/ && /-m pytest/' | wc -l",
          "stdout": "^ *[0-9]+$",
          "role": "the cell that decides whether the run was quiet; > 0 is a rival run",
          "controls": "rival_pytest",
          "why_this_shape_is_storable_at_all": "awk exits 0 when it matches nothing, so the pipeline's exit status carries executability and not emptiness. AC-1's pipefail criterion therefore EXCLUDES any instrument that signals emptiness through exit status -- including correct ones: the same awk with `| grep -c .` as its counting stage reads right in every case of the table below and still cannot be stored here. That is a declared bound on the criterion, not a defect in the rejected forms. Corrected 2026-10-30 (review cycle 1, F-008): the earlier claim that a grep- or pgrep-based prescription 'cannot be stored here at all' is FALSE, because `<form> || [ $? -eq 1 ]` exits 0 on a legitimate empty match and still reds `pgrep -fc`, whose usage failure is exit 2 and not 1 (measured both ways under pipefail: normalized grep form exit 0, normalized `pgrep -fc` exit 1). awk is preferred because grep's READINGS are wrong, which is the argument already in the `rejected` list below: the `ps -Ao command= | grep -c` form counts the measuring agent's own `zsh -c` wrapper lines. Stated as a mechanism and not as a figure, 2026-10-30 (review cycle 2, F-108): the earlier form of this sentence published a point estimate -- `reading 3 at an instant when the prescribed cell read 1` -- for a contention-dependent quantity, and it did not reproduce. Re-measured on 2026-10-30, three trials each: 1 against a true 0 on a quiet host, and 2 against a true 1 from inside a single live run, with the excess in both cases being exactly the measuring shell's own wrapper. So the reading is the true count PLUS one per live shell wrapper whose argv spells the pattern -- not a function of the host's pytest count at all -- and how many agent shells are alive is not something a stored figure could hold fixed. That mechanism is the argument; a number here would be the card's own AC-3 residue item 3 committed one more time."
        },
        {
          "id": "per-test-ceiling",
          "recorded_at": ["end"],
          "command": null,
          "no_command_because": "it is read off the run's own --durations output against tests/hang_guard.py's HANG_SECONDS, not off the host. There is no shell command to execute, so AC-1 has nothing to run; the cell is listed so that a future cell cannot acquire a null command silently."
        }
      ],
      "rival_pytest": {
        "instrument_cell": "rival-pytest",
        "re_execution_is_not_literal": "A `rejected` entry below is a RECORD of what was measured, so its spelling is historical and is never edited to suit the checker -- but the pgrep family cannot be re-executed exactly as spelt and still see anything. BSD pgrep excludes the invoking process AND ALL ITS ANCESTORS unless `-a` is passed (man pgrep), and the test that re-executes these forms always runs under a real `-m pytest`: its own runner, which the prescribed cell above DOES count. Measured 2026-10-30 from inside a run (review cycle 2, F-101): `pgrep -f ' -m pytest'` did not return the runner's pid and `pgrep -a -f ' -m pytest'` did. So the re-executing test inserts `-a` at the point of execution, and asserts that insertion in both directions on this host rather than describing it. Without it, the `pgrep -f` row's blindness half was strong only while a SIBLING card happened to be running pytest -- green on a solo board for a reason that is not about the rejection.",
        "reading_harness": "WITHOUT pipefail, unlike the exit_check above, and deliberately: these cases ask whether the instrument RESPONDS, and a harness that reds on exit status would red a blind form for the wrong reason -- 'it exited 1' instead of 'it did not rise while a real pytest was alive'. Executability is AC-1's question and is asked with pipefail; responsiveness is this table's and is asked on the reading. Two questions, two harnesses, stated so neither is mistaken for the other.",
        "cases": [
          {
            "id": "a",
            "expect": "rises",
            "probe": "pytest-module",
            "what": "a real pytest alive, started as `{venv_python} -m pytest`",
            "role": "THE POSITIVE CONTROL"
          },
          {
            "id": "b",
            "expect": "flat",
            "probe": "pytest-console-script",
            "what": "a real pytest alive, started through the venv's bin/pytest console script",
            "declared_bound": "the instrument is BLIND to this one. The console script's argv is `.../MacOS/Python .../.venv/bin/pytest ...` and never holds ` -m pytest`. Measured 2026-10-29 both ways: 0 -> 0 for this cell, 0 -> 1 for the same awk keyed on /pytest/. Tolerated, not fixed: /pytest/ would count any python process merely mentioning pytest and no control for that direction is measured. It is tolerable only while review.test_command starts pytest as `-m pytest`, which test_the_board_starts_pytest_in_the_form_the_cell_can_see asserts.",
            "role": "a bound asserted in BOTH directions, so it cannot drift silently"
          },
          {
            "id": "c",
            "expect": "flat",
            "probe": null,
            "what": "nothing running at all",
            "not_realizable_because": "a test cannot make a shared desktop quiet -- sibling card worktrees run their own gates, and this board's concurrency is 5. The per-case baseline, re-read after the probe exits, stands in for it; a baseline that moved is a refusal to judge."
          },
          {
            "id": "d",
            "expect": "flat",
            "probe": "shell-wrapper",
            "argv_mentions": "python -m pytest tests/foo.py",
            "what": "a `zsh -c` with no pytest running whose own argv merely spells one",
            "role": "THE NEGATIVE CONTROL"
          },
          {
            "id": "d2",
            "expect": "flat",
            "probe": "shell-wrapper",
            "argv_mentions": "{venv_python} -m pytest tests/",
            "what": "the same wrapper naming the venv interpreter by absolute path"
          },
          {
            "id": "d3",
            "expect": "flat",
            "probe": "shell-wrapper",
            "argv_mentions": "{argv0} -m pytest tests/",
            "what": "the same wrapper naming the FRAMEWORK re-exec path, which is what this harness actually produces -- the case that retired `pgrep -f 'MacOS/Python.*pytest'`"
          },
          {
            "id": "e",
            "expect": "flat",
            "probe": "search-tool",
            "argv_mentions": "{argv0} -m pytest",
            "what": "a search tool (grep) whose OWN argv carries the pattern -- a process the act of measuring spawns",
            "added": "2026-10-29. A probe that excludes only shells still counts this one, and five hand-written variants measured at a single instant on 2026-10-29 returned five different answers partly because of it."
          }
        ],
        "rejected": [
          {
            "instrument": "pgrep -fc 'python.* -m pytest'",
            "verdict": "NOT EXECUTABLE here. BSD/macOS pgrep has no -c: exit 2, usage on stderr, and an EMPTY cell inside $(...) rather than a count.",
            "re_executed_by": "test_a_rejected_instrument_is_still_refuted_on_this_host"
          },
          {
            "instrument": "pgrep -f 'python.* -m pytest'",
            "verdict": "BLIND here, and for a second reason independent of -c: -f is case-sensitive and a live run's argv[0] is .../MacOS/Python with a capital P, so no lowercase `python` appears anywhere in it. Measured 2026-10-29 against a live pytest: 0 -> 0. The -fi form reads 1 with nothing running at all.",
            "re_executed_by": "test_a_rejected_instrument_is_still_refuted_on_this_host"
          },
          {
            "instrument": "pgrep -f 'bin/python -m pytest'",
            "verdict": "BLIND: the framework re-exec means `bin/python` never appears in a live run's argv. It never errors and always looks fine."
          },
          {
            "instrument": "pgrep -f 'MacOS/Python.*pytest'",
            "verdict": "FALSE-POSITIVE on case d3, the wrapper this harness actually produces."
          },
          {
            "instrument": "ps -Ao comm= | grep -c 'pytest$'",
            "verdict": "CANNOT MATCH: comm is the executable name, which for this venv is `Python`, and macOS truncates it to 16 chars besides. Reads 0 whatever the host is doing, and was reported as a quiet-host figure on CARD-299 before being retracted."
          },
          {
            "instrument": "ps -Ao command= | grep -c '[m] pytest'",
            "verdict": "counts the measuring agent's own `zsh -c` wrapper lines. Three readings within an hour gave 1, 2 and 3 with no pytest running."
          }
        ]
      }
    }

  # IMPACT, owner decision 2026-10-22. The reason is NOT that the suite became
  # the bottleneck -- it is that `full` is unreachable at this board's
  # concurrency, which nobody had noticed:
  #
  #   A full-suite gate takes meta/kanban/.full-suite.lock, and CARD-255's guard
  #   makes pytest_configure raise pytest.UsageError on a FOREIGN holder. So a
  #   full gate taken by one card reds every pytest run a sibling card's agent
  #   makes, in its own worktree, for the whole ~16.5 minutes. With
  #   max_concurrent 2 (owner's standing cap) and test_scope full, the two
  #   settings contradict each other: whichever card reaches a gate first breaks
  #   the other. Measured on wave 52, where CARD-259's gate ran while CARD-206
  #   was still implementing.
  #
  # The suite being the dominant per-cycle cost -- O(suite) x cycles x cards x
  # max_concurrent -- is still true and is still a reason. It is just not the
  # reason this flipped.
  #
  # WHAT THE PREVIOUS COMMENT WARNED ABOUT IS STILL TRUE AND IS NOT YET CLOSED.
  # It read: the skill's python-pro recipe narrows only with pytest-testmon
  # installed ("import-graph heuristics on Python are not trustworthy enough to
  # gate on"); without it there is NO narrowing -- the gate falls back to full
  # and notes "[Build gate] impact underivable". pytest-testmon is still not in
  # this venv. So this value alone does not narrow anything: taken literally it
  # buys a fallback to full that CLAIMS to be scoped, which is worse than `full`
  # honestly stated.
  #
  # What makes it real is one of two things, and until one lands every cycle
  # gate must record its own selection on the card (which is what CARD-259's
  # build gate note does -- eight named files, 815 passed):
  #   (a) a harness `make test-impact` target, which cmd-start-review prefers
  #       over the inline recipes ("one source of truth"). No new dependency.
  #       This project has no Makefile at all today.
  #   (b) pytest-testmon in the dev extra, which makes a coverage-based selector
  #       part of the gate path -- a dependency decision, not a config one.
  test_scope: impact

  # REFIRE POLICY (owner, 2026-10-25, wave 60). A review cycle re-fires every
  # GATING finding's mutation plus a SAMPLE of the minors — not all of them. The
  # fix station still mutates all of its own additions before hand-back, and a
  # gating finding's closure is still independently re-derived; what stops is a
  # reviewer re-confirming every minor the fix round already mutated and the
  # orchestrator already pre-gated.
  #
  # Measured on CARD-294 cycle 2, which re-fired all 17 of its fix round's
  # mutations plus 5 of its own: ~7.1 hours over 63 tool calls, with UNDER 25
  # MINUTES of pytest inside it (the four claim files run in 8 s; those plus the
  # guard quartet in 52 s). The cost is per-step model time over a large context,
  # so it scales with the NUMBER of mutations rather than their runtime. Roughly
  # a third of a review's steps are recoverable this way.
  #
  # NOT a licence to narrow mutation generally: CARD-294 cycle 1's CRITICAL
  # finding was a control that could not fail (a `class PropertyTest_…` pytest
  # never collected, so the card's own EC ran zero times with no skip and no
  # error), and that is what a thin mutation policy ships.
  #
  # On: this project already reviews by mutation — merged cards routinely
  # record "4 of 5 mutants caught", and CARD-105 went as far as proving the
  # survivor equivalent rather than chasing it. The setting makes an existing
  # practice a gate instead of a habit. Cost-deferred by the skill to the
  # passing cycle, so it runs once per card on stable code.
  mutation_check: true

  # Off: visual capture needs a harness run target and there is no Makefile in
  # this repo, so `auto` would attempt a capture and write a degraded-to-static
  # note on every cycle of every template card. pytest-playwright IS installed,
  # so the route to enabling this is a `make run` target, not a dependency.
  # The owner's visual validation currently happens on rendered pages under
  # ~/Documents/nonogram-reviews/CARD-NNN, which no automated gate replaces.
  visual: off

e2e:
  # Off, not `auto`: the admin panel is server-rendered Flask, not a JS
  # frontend, and there is no e2e suite or `make test-e2e`. Left at `auto` the
  # wave gate would report a mandated-but-missing suite every wave.
  enabled: false
  test_command: ""

dispatcher:
  max_concurrent: 5
  max_overlap: 0.3

conflict:
  # Seeded from what wave 26's dispatch actually showed. Before this list
  # existed, app.py serialized only by arithmetic accident: five cards touch
  # it, each pair scoring exactly 0.33 against a 0.3 threshold. A card with a
  # wider Touches set would have scored below the threshold and run
  # concurrently into the same file. Naming these makes the serialization
  # intentional and independent of how many other paths a card happens to list.
  hotspots:
    - src/nonogram/admin/app.py            # route registration — CARD-131/132/139/140/142
    - src/nonogram/export/layout.py        # shared page geometry — CARD-141/144
    - src/nonogram/admin/book_pdf_generator.py  # the streaming page writer (CARD-145)
    - src/nonogram/admin/book_manager.py
    # Added 2026-10-23: tests/conftest.py, and ONLY that. The orchestrator came
    # here to add tests/helpers/book_corpus.py after measuring that CARD-218 and
    # CARD-219 both modify it at a predicted overlap of 0.21 against a 0.3
    # threshold -- and it is ALREADY in this list, further down, with a comment
    # that states that same pair and that same arithmetic. The measurement was
    # right and the gap was not where it looked: the orchestrator had read the
    # first twelve lines of this section and not the rest of it. The one path
    # genuinely missing is the conftest -- CARD-218 declares it, it holds the
    # fixtures every suite-cost card reshapes, and a second card editing it
    # concurrently is the same collision as the corpus.
    - tests/conftest.py                    # the one conftest; every fixture edit lands here
    - migrations/**                        # migration index; merged order is what runs
    - src/nonogram/db/**
    # Added 2026-10-22 (owner). The shared book corpus: 10 READY cards declare it
    # (CARD-209, 218, 219, 226, 227, 229, 230, 231, 232, 233), so any two of them
    # running concurrently edit the same fixtures and page maps. It was measured
    # as the most-shared file on this board -- present in 9 of the 12 ready-card
    # overlaps with CARD-206's real diff -- and it was in no hotspot, while the
    # ten cards that DO collide on book_pdf_generator.py were already covered.
    #
    # What this entry does NOT catch, stated so nobody reads it as closed: the
    # hotspot rule needs BOTH cards to *declare* the path, and CARD-206 edited
    # this file without declaring it (Touches said 6 files; the diff was 27). So
    # CARD-218 and CARD-219 -- the two whose real overlap with CARD-206 was 89%
    # and 100% -- are serialized against each OTHER by this line and still not
    # against a card that touches the corpus undeclared. That residue is the
    # `Touches`-is-a-prediction problem, filed as an @ops item in backlog.md,
    # and it is deliberately NOT fixed by widening every card's Touches: the
    # same field feeds the scope gate, which needs a prediction to detect growth
    # against. Two jobs, opposite requirements.
    - tests/helpers/book_corpus.py

done:
  require_pr: false
  target_branch: main

sizing:
  min_estimate: 0.25d
  max_estimate: 1d
