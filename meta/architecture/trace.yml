  - TestLayout_NonSquareGridUsesLargerDimension
  - TestLayout_InterpolatesBetweenTabulatedCellSizes
  - PropertyTest_Layout_CellSizeNonIncreasingInLargerDimension
  notes: >-
    export/layout.py already derives grid extent from len(row_clues) /
    len(column_clues) rather than a size parameter, so it is likely already
    rectangle-tolerant; what changes is the MAX_CELL_MM = 6.5 flat cap, which
    today makes every grid from 10x10 to 25x25 print an identical 6.52 mm cell.
  status: partial

