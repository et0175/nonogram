    (Puzzle); contexts.yml argues single-context on the grounds that every
    capability acts on that one aggregate, an argument a second aggregate would
    reopen. CARD-110 deliberately stopped at the ids (option A of three) so
    that decision is taken as a decision, not inside a commit about globs. The only Strategy enum in the repo today
    (analysis/strategy_counter.py) is fed by nothing the real solver does and
    is not the enum this row traces.
  status: partial

- req: NFR-007
  description: "Difficulty score and tier decision are machine-independent:
    no term derives from elapsed wall-clock time (metric: 0 dependence)"
  capabilities: [CAP-004]
  contexts: [CTX-001]
  components: [COMP-006, COMP-002]
  adrs: [ADR-0029, ADR-0011, ADR-0015]
  tests:
  - TestScoreDifficulty_IgnoresElapsedSeconds
  - TestResample_SameSeedSameTierUnderDilatedClock
  - PropertyTest_ScoreDifficulty_IndependentOfElapsedTime
  notes: >-
    Story US-008 (via FR-009/FR-010, which it amends). No DEC: one option
    only (open.yml 2026-09-12 note); ADR-0013's rejected alternative
    `exclude_wall_clock_time` became the rule by way of ADR-0029/R3 rather
    than a separate revision. COMP-006 because today's difficulty.py
    time_pressure term (weight 0.15, budget 5s per 400 cells) is the
    violation — under ADR-0029 the score is a pure function of the rung tags
    and branch_nodes; COMP-002 because the POL-004 resample decision must not
    flip on a slower host (AC-123) — the ADR-0011 deadline still bounds the
    solve but its clock readings never reach the scorer. Restated as
    standing rule CON-014 below. ADR-0015's "same seed replays the same run"
    consequence holds only without --difficulty today
    (docs/GENERATION_ALGORITHM.md §10.2 #3) and unconditionally once this
    ships; the ADR-0015 History entry recording that is owed by the
    adr-writer. SHIPPED 2026-09-13 (CARD-076): the time_pressure term is gone
    with the rest of ADR-0013's formula, and `difficulty.SolverSignals` no
    longer names `elapsed_seconds` at all — the scorer cannot read a clock it
    is never handed, so the metric ("0 dependence") holds structurally rather
    than by discipline. The owed ADR-0015 History entry is written. AC-123 is
    checked end to end by injecting a 50x clock at the solver's own
    perf_counter and comparing two runs of one seeded --difficulty request:
    same grid, same score to the last digit, same tier, same attempt counts.
  status: covered

- req: CON-014
  description: "Wall-clock solve time never enters the difficulty score or
    the tier decision — the score is a pure function of structural signals
    and clues (standing rule for NFR-007)"
  capabilities: [CAP-004]
  contexts: [CTX-001]
  components: [COMP-006, COMP-002]
  adrs: [ADR-0029, ADR-0011]
  tests:
  - PropertyTest_ScoreDifficulty_IndependentOfElapsedTime
  notes: >-
    NFR-007 restated as a CHECKED constraint (check: test, ref above; scope
    src/nonogram/difficulty.py and src/nonogram/orchestrator.py) so
    forge:review's system contract holds it on every diff touching the scorer
    or the resample loop, not only the one that introduces it — the CON-009/
    CON-010 shape. Same rule as ADR-0029/R3, which additionally excludes size
    and density terms. NOT `covered`: unlike the design-satisfied CONs above,
    this one is currently VIOLATED by the shipped time_pressure term in
    difficulty.py, and its declared check ref does not exist yet — the
    CON-011 precedent (partial until the check goes live).
    COVERED 2026-09-13 (CARD-076): the declared check now exists and is green —
    `PropertyTest_ScoreDifficulty_IndependentOfElapsedTime`, i.e.
    `tests/property/test_difficulty_ladder.py::test_independent_of_elapsed_time`
    over a seeded corpus of real SolveSignals with the elapsed time substituted
    across eight dilations, plus a synthetic-corpus twin that also covers the
    branching half of the input space the generator never reaches. The
    violation is gone: the time_pressure term is deleted and the scorer's
    signals protocol carries no clock member, so the constraint is structural.
    Note the description above still says "and clues" — since ADR-0029 the
    clues do not reach the scorer either (density left the formula with size);
    the rule is only narrower for it.
  status: covered

