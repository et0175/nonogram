  - ADR-0020
  tests:
  - PropertyTest_WebServer_RejectsAnyCrossOriginOrForeignAuthorityRequest
  notes: 'The half of BCON-0001 that loopback binding does NOT deliver. Deliberately
    stated as a property over ALL cross-origin/foreign-authority shapes rather than
    the three header forms named in the ACs — the post-hoc review found that hardcoded
    shape lists miss cases (# and ? split under urlsplit exactly as @ and / do). Test
    is planned; CARD-020 must satisfy it. Follow-up: ADR-0020 ## Rules block.'
  status: partial
  # ------------------------------ rectangular grids (US-016..US-019, 2026-08-30)
  # Hand-written by forge:architect-domain-extraction; see the STALE note in the
  # header. Component assignments are inherited from the requirements they refine.
- req: FR-018
  description: "Generation request carries grid width AND height; CLI `--size N` /
    `--size NxM`"
  capabilities: [CAP-001]
  contexts: [CTX-001]
  components: [COMP-001, COMP-008, COMP-002, COMP-003]
  adrs: [ADR-0010, ADR-0012]
  tests:
  - TestCLI_ParsesRectangularSizeToken
  - TestCLI_RectangularRequestProducesWidthByHeightGrid
  - TestCLI_SquareSizeShorthandSetsBothSides
  - TestCLI_RejectsMalformedSizeToken
  - TestCLI_OutOfRangeSideRejectedByDomainNotArgparse
  notes: >-
    ADR-0010's split holds unchanged: splitting the NxM token is parsing
    (COMP-001/COMP-008), while the range check stays a pure domain function
    inward of both adapters — AC-065 is what pins that boundary. The web UI
    adapter is listed because FR-017 exposes the same option.
  status: partial

- req: FR-019
  description: "Random grid at configurable width x height, each side 10..30
    (replaces FR-001)"
  capabilities: [CAP-001]
  contexts: [CTX-001]
  components: [COMP-003, COMP-001]
  adrs: [ADR-0006, ADR-0010, ADR-0012, ADR-0015]
  tests:
  - TestGenerateRandom_ProducesRequestedDimensions
  - TestGenerateRandom_ProducesRectangularGrid
  - TestGenerateRandom_AcceptsMaxSide30
  - TestGenerateRandom_RejectsSideAbove30
  - TestGenerateRandom_RejectsSideBelow10
  - PropertyTest_GridDimensions_EverySourceModeRejectsSideOutside10To30
  notes: >-
    Replaces FR-001. random_grid.py's MAX_SIZE = 50 becomes 30 and
    validate_size becomes a two-sided check; INV-004 is the aggregate-level
    statement of the same bound. COMP-004 (clues) and COMP-005 (solver) are
    deliberately NOT listed: both are already rectangle-native (verified
    empirically — an 8x14 grid solves uniquely and round-trips, a 3x5 computes
    correct clues), so this requirement asks nothing of them.
  status: partial

- req: FR-020
  description: "Uploaded silhouette fitted to the requested grid shape, not to a
    square"
  capabilities: [CAP-001]
  contexts: [CTX-001]
  components: [COMP-003]
  adrs: [ADR-0006, ADR-0012]
  tests:
  - TestFitImage_CropsToRequestedAspectRatio
  - TestFitImage_SquareGridReproducesSquareCropBox
  - TestFitImage_CropIsCentredOnBothAxes
  - TestFitImage_ProducesExactDimensionsWithoutLetterbox
  - PropertyTest_FitImage_CropBoxIsLargestCentredRectangleOfTargetAspect
  notes: >-
    Generalizes sourcing/image.py's square_crop_box rather than replacing it —
    AC-072 pins the width == height case to today's behaviour, so the change is
    a superset. Evidence: eagle-silhouette1.jpg is 563x980; the square crop
    retains 57%, a 15x30 grid retains 87%.
    Shipped by CARD-026 (merge 547d317, 2026-08-31); all five tests are live.
    Declared limitation carried from that card's AC gate: AC-074's "a grid is
    produced" half is exercised through the _convert mirror, not through
    generate(), which stays scalar until CARD-027 wires the (width, height)
    pair through the request (FR-018/FR-019). fit_crop_box itself is production
    code on the live path.
  status: covered

- req: FR-021
  description: "Refuse a request whose grid/source aspect ratios differ by more than
    2x"
  capabilities: [CAP-001]
  contexts: [CTX-001]
  components: [COMP-003, COMP-002]
  adrs: [ADR-0010]
  tests:
  - TestAspectGuard_AcceptsExactlyTwoFoldRatioDifference
  - TestAspectGuard_RefusesRatioDifferenceAboveTwoFold
  - TestAspectGuard_RefusalMessageSuggestsManualCrop
  - TestAspectGuard_ThresholdIsSymmetricInSourceAndTarget
  - TestAspectGuard_AcceptsWellMatchedPortraitSource
  - PropertyTest_AspectGuard_AcceptsExactlyThoseRequestsRetainingHalfOrMore
  notes: >-
    A domain refusal, so it raises a NonogramError subclass that COMP-001 maps
    to an exit code and COMP-008 shapes into a structured failure (EC-003).
    The boundary is inclusive — exactly 50% retained passes (AC-075) — and
    AC-076 sits one grid row past it, so both sides are pinned.
    Shipped by CARD-026 (merge 547d317, 2026-08-31); all six tests are live.
    The decision is an integer cross-product, verified against a Fraction
    oracle over 1323 constructed exact-boundary shapes. Declared limitation
    carried from that card's AC gate: the guard's copy inside generate() is
    behaviourally inert while targets are square (the condition is symmetric
    under transposition), so today it is pinned through the _convert mirror;
    CARD-027 makes it load-bearing.
  status: covered

