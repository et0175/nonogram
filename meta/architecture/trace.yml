- req: NFR-004
  description: Web UI refuses browser-mediated cross-origin requests and 
    foreign-authority request targets
  capabilities:
  - CAP-001
  contexts:
  - CTX-001
  components:
  - COMP-008
  adrs:
  - ADR-0019
  - ADR-0020
  tests:
  - PropertyTest_WebServer_RejectsAnyCrossOriginOrForeignAuthorityRequest
  notes: 'COMP-008 alone: this is a per-request, application-layer check inside the
    web adapter — nothing inward of it can observe or affect the request headers.
    Distinct from NFR-003, whose metric is the SOCKET bind scope checked once at server
    start; conflating the two under one metric would put two unrelated verification
    stories behind one name. Gap found by the independent post-hoc review of merged
    CARD-019 (meta/review/20260830T163436Z-CARD-019-posthoc.yml, F-001/F-002) and
    reproduced on the wire: a browser sets Host from the TARGET url, so a form on
    a malicious page submitting to 127.0.0.1 arrives with an allowlisted Host and
    was served 200. Impact on the merged surface is nil (one static read-only GET);
    it becomes real with CARD-020s file-writing POST, which is why this requirement
    gates that card. SHIPPED by CARD-020: the check is
    WebUIRequestHandler._cross_origin_refusal, run from _dispatch before any route,
    and the property is tests/test_web_server.py''s EC-004 section — three arms
    over two hand-built corpora (294 refused rows against a floor of 200, 58 served
    rows against a floor of 40, both floors asserted inside
