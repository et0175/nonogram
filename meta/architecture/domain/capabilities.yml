    name: Puzzle sourcing
    description: >-
      Obtaining a black/white solution grid to build a puzzle from — either
      randomly at a configured size and density, from a built-in image
      library, or by converting a user-uploaded image via resize and
      dithering. Reachable through either inbound adapter — the CLI or the
      local web UI (FR-017) — since both invoke the same CMD-001/CMD-002/
      CMD-003 commands via the adapter-agnostic GenerationRequest; the web
      UI introduces no new sourcing behavior of its own.
