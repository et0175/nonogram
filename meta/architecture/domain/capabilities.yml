  - id: CAP-006
    name: Book assembly
    description: >-
      Assembling finalized puzzles into one printed book in the admin panel
      and following it through its lifecycle (draft -> ready_for_pdf ->
      pdf_generated -> ready_for_kdp -> published): editing the book's
      general info; setting its print specification (trim, margins — default
      Book 1 profile, CON-018) and its distribution plan (total count,
      easy/medium/hard split, per-longest-side bucket plan), with an
      un-hand-edited bucket plan re-derived automatically when the split
      changes (policy POL-007, CMD-020 -> EVT-021); selecting puzzles by
      longest-side tab against the plan, refusing below-floor puzzles
      without an explicit per-puzzle override and published-book changes
      without confirmation; marking the book ready only when its mix
      matches the plan; tracking actual-vs-plan progress in the books list;
      and generating the book PDF with every puzzle page portrait, sized
      for the book's own trim under the 7.5 mm standard cell and 4.8 mm
      floor, titles only in the answer key. Puzzles are referenced, never
