  - id: CAP-003
    name: Uniqueness verification and automatic recovery
    description: >-
      Guaranteeing every finished puzzle has exactly one logical solution:
      running the solver's uniqueness check, and — when it fails —
      automatically regenerating (random/library mode) or nudging pixels
      (uploaded-image mode) within a bounded retry count, cleanly
      abandoning generation and reporting failure when that bound is
      exhausted rather than looping forever or handing back an ambiguous
      puzzle. The uniqueness check also reports *where* it failed — the
      undecided/disagreement mask and a second-solution witness (FR-024) —
      so recovery can be targeted: random-mode candidates may be repaired in
      place by flipping one filled/empty pair inside that region (FR-025,
      CMD-014 -> EVT-015, policy POL-006) before or instead of a full redraw,
      and image-mode nudges pick their cells from the same mask (FR-013).
      Every repair attempt counts against the one shared retry bound.
    events: [EVT-005, EVT-006, EVT-007, EVT-008, EVT-009, EVT-012, EVT-015]
    commands: [CMD-005, CMD-006, CMD-007, CMD-008, CMD-011, CMD-014]
    aggregates: [AGG-001]
    stories: [US-005, US-006, US-007]
    requirements: [FR-006, FR-007, FR-013, FR-024, FR-025, NFR-001, NFR-002]

  - id: CAP-004
    name: Difficulty calibration
    description: >-
      Letting the user choose an Easy/Medium/Hard difficulty tier, scoring
      a candidate puzzle's actual difficulty from solver signals (line-logic
      coverage, backtracking amount, solve time, size, clue density), and
      resampling candidates within a bounded retry count until the score
      matches the requested tier. Scoring is by strategy ladder: a
      line-solvable puzzle is graded across the whole scale by the depth of
      line reasoning it needs, and "requires guessing" is an explicit
      attribute (FR-026); the solving strategies actually used are recorded
      with the puzzle (FR-029); and wall-clock solve time never enters the
      score, so the same seed grades the same on any machine (NFR-007,
      restated as standing rule CON-014).
    events: [EVT-010, EVT-011]
