        given: an uploaded image conversion that has exhausted the configured nudge cap without reaching uniqueness
        when: the uniqueness check is evaluated again
        then: the tool reports failure to the user and stops altering the image
        kind: boundary
        invariant: INV-003
        policy: POL-003
        test: TestNudge_ReportsFailureAtCap
      - id: AC-036
        given: a reported nudge-cap failure
        when: the failure is presented to the user
        then: the message states that the user should retry with a different image or size
        kind: negative
        test: TestNudge_FailureMessageSuggestsRetry

  - id: FR-014
    statement: >-
      When image-mode generation required one or more automatic pixel
      nudges (FR-013) to reach a unique solution, report the count of
      nudged cells to the user as a line in CLI output at export time.
    source: [US-007]  # requirement introduced by ADR-0004, resolving DEC-004
    acceptance:
      - id: AC-040
        given: an exported puzzle whose image conversion required 2 pixel nudges to reach uniqueness
        when: the puzzle is exported
        then: the CLI output includes a line stating that 2 cells were nudged
        kind: happy
        test: TestExport_ReportsNudgeCount
      - id: AC-041
        given: an exported puzzle whose image conversion reached uniqueness with zero nudges
        when: the puzzle is exported
        then: no nudge-count line is printed
        kind: boundary
        test: TestExport_OmitsNudgeCountWhenZero

  - id: FR-015
    # AMENDED 2026-09-01 (raw-requirements.md, entry 3 of the 2026-09-01
    # delta): image-sourced puzzles now default to the source file's stem,
    # mirroring AC-043's library-key rule, instead of falling through to the
    # mode+timestamp default. Id, kind, and existing AC ids/tests are
    # unchanged (EC-007 2026-08-31 amendment precedent); AC-090 is new.
    statement: >-
      Give every puzzle a name, which becomes an attribute of the Puzzle
      aggregate (AGG-001) set at creation time: auto-generated by default
      (the library key for library-sourced puzzles, e.g. "cat"; the source
      file's stem for image-sourced puzzles, e.g. an upload named "cat.png"
      names the puzzle "cat"; a mode+timestamp for random-sourced puzzles,
      e.g. "random-2026-08-27-1430"), or overridden via a --name flag.
    source: [US-011]
    acceptance:
      - id: AC-042
        given: a random-mode generation request with no --name flag, run on 2026-08-27 at 14:30
        when: the puzzle is created
        then: the puzzle's name is auto-generated as "random-2026-08-27-1430"
        kind: happy
        test: TestPuzzleName_AutoGeneratesModeTimestampForRandomMode
      - id: AC-043
        given: a library-mode generation request for library key "cat" with no --name flag
        when: the puzzle is created
        then: the puzzle's name is auto-generated as "cat"
        kind: happy
        test: TestPuzzleName_AutoGeneratesFromLibraryKey
      - id: AC-044
        given: a generation request with --name "my-cat-puzzle" supplied
        when: the puzzle is created
        then: the puzzle's name is set to "my-cat-puzzle", overriding the auto-generated default
        kind: happy
        test: TestPuzzleName_OverrideViaFlag
      - id: AC-045
        given: a generation request with --name "" (an empty string) supplied
        when: the puzzle is created
        then: the request is rejected with an invalid-name error and no puzzle is created
        kind: negative
        test: TestPuzzleName_RejectsEmptyName
      - id: AC-090
        given: an image-mode generation request uploading a file named "cat.png" with no --name flag
        when: the puzzle is created
        then: the puzzle's name is auto-generated as "cat", not the "image-2026-09-01-1240"-shaped mode+timestamp default
        kind: happy
        test: TestPuzzleName_AutoGeneratesFromImageFileStem

