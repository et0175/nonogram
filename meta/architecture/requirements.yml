    # the source: no criterion is written for darkness and AC-195 asserts
    # only "wider"; the thresholds are an open question (NFR threshold DEC
    # expected, see _meta), not invented here.
    statement: >-
      In a book, a puzzle's picture title appears only on its answer-key
