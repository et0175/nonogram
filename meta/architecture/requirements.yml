  - id: FR-037
    # RESOLVED 2026-09-22 by ADR-0035 (DEC-038): (a) every transition out of
    # draft is gated; (b) a cell's share = its count / the PLANNED total; (c) a
    # book with no stored plan is refused ("store a plan on Print setup
    # first"). The open_question below is kept as the record of what was open.
    # New 2026-09-22 (BK-4 gate half, book rule 6). Today
    # BookManager.set_book_status only requires at least one puzzle before
    # leaving draft. Three points are unstated in the source and left open
    # (see _meta.open_question), so the criteria use books whose actual
    # count equals the planned count, where every reading agrees.
    statement: >-
      A book can be marked ready only when every longest-side x tier cell of
      its selection is within +/-3 percentage points (inclusive) of that
      cell's share of the plan (FR-034); otherwise the transition is
      refused, the status is unchanged, and the refusal names each cell
      outside the tolerance with its actual and planned share.
    source: [US-026]
    _meta:
      source: authored
      open_question: "Unstated in the source: (a) which BookStatus is 'ready' (ready_for_pdf vs ready_for_kdp — the gate's position in the draft -> ready_for_pdf -> pdf_generated -> ready_for_kdp -> published chain); (b) the share's denominator when the actual count differs from the plan (planned total vs actual total); (c) what a book with no stored plan (created before FR-034) does at the gate."
      evidence: ["src/nonogram/admin/book_manager.py:18-25", "src/nonogram/admin/book_manager.py:622-677", "src/nonogram/admin/app.py:2367", "docs/book_generation_req/book_admin_ui_requirements.md#5"]
    acceptance:
      - id: AC-218
        given: a draft book with a plan of 100 puzzles and 100 selected, every longest-side x tier cell within 3 points of its plan
        when: the book is marked ready
        then: the status transitions to the ready status
        kind: happy
        invariant: INV-007
        test: TestBookReady_AcceptsWhenEveryCellWithinTolerance
      - id: AC-219
        given: the same 100-puzzle book whose 16-20 x medium cell holds 13 against a plan of 10 (13% vs 10%), every other cell within 3 points
        when: the book is marked ready
        then: the status transitions to the ready status — exactly 3.0 points is inside the tolerance
        kind: boundary
        invariant: INV-007
        test: TestBookReady_ExactlyThreePointsAccepted
      - id: AC-220
        given: the same 100-puzzle book whose 16-20 x medium cell holds 14 against a plan of 10 (14% vs 10%)
        when: the book is marked ready
        then: the transition is rejected with the status remaining draft
        kind: negative
        invariant: INV-007
        test: TestBookReady_RefusedBeyondThreePoints
      - id: AC-221
        given: the same refused 100-puzzle book
        when: the refusal is shown
        then: it names the 16-20 x medium cell with 14% against 10%
        kind: negative
        test: TestBookReady_RefusalNamesOffendingCell
    engineering_constraints:
      - id: EC-025
        statement: >-
          For any plan and any selection, marking the book ready succeeds if
          and only if every one of the 12 longest-side x tier cells is
          within +/-3 percentage points of its planned share — no route to
          the ready status bypasses the check, for every combination of
          counts, not only the measured examples.
        kind: consistency
        invariant: INV-007
        instances: [AC-219, AC-220]
        test: PropertyTest_BookReady_GateIffEveryCellWithinTolerance

