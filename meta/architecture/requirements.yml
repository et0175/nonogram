  - id: FR-034
    # New 2026-09-22 (BK-UI-1..BK-UI-3). Today Print setup
    # (book_setup_print.html, POST /book/<id>/setup-print) carries only
    # trim width/height and a unit; no plan exists in the schema (a
    # migration is needed — implementation, not decision). The prefill
    # rescales the Book 1 matrix (book_generation_admin_panel.md §2) COLUMN
    # by column — each tier's four longest-side shares rescaled to that
    # tier's count — which is what reproduces the owner's 150 x 40/40/20
    # table exactly (easy 10/15/5/0 of 30 -> 20/30/10/0 of 60; medium
    # 5/20/15/5 of 45 -> 7/27/20/6 of 60; hard 0/5/10/10 of 25 -> 0/6/12/12
    # of 30). Row totals are NOT preserved (27/63/42/18, not 15/40/30/15%).
    # The default split for a NEW book is FR-035's open decision.
    statement: >-
      Print setup carries a distribution plan (TERM-026) stored with the
      book: a total puzzle count and an easy/medium/hard split that must sum
      to 100%, plus an editable per-longest-side plan — an easy/medium/hard
      count for each of the buckets <=15, 16-20, 21-25, 26-30 (TERM-027) —
      prefilled from the Book 1 size x difficulty matrix rescaled to the
      book's count and split and rounded so each tier's column total equals
      that tier's count in the general plan and the whole matrix sums to
      the count; a cell whose Book 1 share is zero stays zero. When the
      general split changes, a per-bucket plan with no hand-edited cells is
      re-derived (POL-007); hand-edited cells keep their values and the
      screen warns that the per-bucket plan and the general split disagree.
      The stored plan survives leaving the workflow and is the reference for
      every planned-vs-actual figure (FR-036, FR-037, FR-039).
    source: [US-025]
    _meta:
      source: authored
      open_question: "How the general plan's tier counts round when count x split is not whole (e.g. 137 x 40% = 54.8) is unstated; the criteria use counts where it is whole, and EC-023 states only that the matrix honours whatever tier counts the general plan holds."
      evidence: ["src/nonogram/admin/templates/book_setup_print.html", "src/nonogram/admin/app.py:1939", "src/nonogram/db/models.py:121-125", "docs/book_generation_req/book_admin_ui_requirements.md#1", "docs/book_generation_req/book_generation_admin_panel.md#2"]
    acceptance:
      - id: AC-196
        given: a draft book whose Print setup is saved with count 150 and split 40/40/20
        when: the owner leaves the workflow and reopens Print setup
        then: the page shows count 150 and split 40/40/20 read back from the stored book
        kind: happy
        test: TestBookPlan_StoredWithBookSurvivesReopen
      - id: AC-197
        given: a draft book with a stored plan of 150 at 40/40/20
        when: Print setup is submitted with split 40/40/30 (110%)
        then: the submission is rejected and the stored plan stays 150 at 40/40/20
        kind: negative
        invariant: INV-005
        test: TestBookPlan_RejectsSplitNotSummingTo100
      - id: AC-198
        given: a general plan of 150 puzzles at 40/40/20 with no hand-edited cells
        when: the per-bucket plan is prefilled
        then: "the matrix is <=15: 20/7/0, 16-20: 30/27/6, 21-25: 10/20/12, 26-30: 0/6/12 (easy/medium/hard)"
        kind: boundary
        test: TestBookPlan_PrefillMatchesBook1MatrixAt150x40_40_20
      - id: AC-199
        given: a general plan of 120 puzzles at 30/45/25 (36/54/30)
        when: the per-bucket plan is prefilled
        then: the 12 cells sum to 120 with column totals 36, 54 and 30
        kind: boundary
        test: TestBookPlan_PrefillColumnTotalsMatchGeneralPlan
      - id: AC-200
        given: a general plan of 120 puzzles at 30/45/25
        when: the per-bucket plan is prefilled
        then: the <=15 x hard cell and the 26-30 x easy cell are both 0
        kind: boundary
        test: TestBookPlan_ZeroShareCellsStayZero
      - id: AC-201
        given: a stored plan of 150 at 40/40/20 whose per-bucket cells were never hand-edited
        when: the general split is changed to 30/45/25
        then: the per-bucket plan is re-derived from the Book 1 matrix at 30/45/25
        kind: happy
        policy: POL-007
        test: TestBookPlan_UneditedMatrixRederivedOnSplitChange
      - id: AC-202
        given: a stored plan of 150 at 40/40/20 whose 21-25 x hard cell was hand-edited from 12 to 15
        when: the general split is changed to 30/45/25
        then: the 21-25 x hard cell still holds 15
        kind: boundary
        policy: POL-007
        test: TestBookPlan_HandEditedCellSurvivesSplitChange
      - id: AC-203
        given: the same hand-edited plan after the split change to 30/45/25
        when: Print setup is rendered
        then: the page shows a warning that the per-bucket plan disagrees with the general split
        kind: negative
        test: TestBookPlan_WarnsWhenHandEditedMatrixDisagreesWithSplit
    engineering_constraints:
      - id: EC-023
        statement: >-
          For any count of at least 1 and any split summing to 100%, the
          prefilled per-bucket plan has 12 non-negative integer cells whose
          sum equals the count, whose per-tier column totals equal the
          general plan's tier counts, and whose zero-share cells (<=15 x
          hard, 26-30 x easy) are 0 — for every count and split, not only
          the measured examples.
        kind: consistency
        invariant: INV-005
        instances: [AC-198, AC-199, AC-200]
        test: PropertyTest_BookPlan_PrefillTotalsMatchGeneralPlan

  - id: FR-035
    # RESOLVED 2026-09-22 by ADR-0034 (DEC-036): a new book starts at 150
    # puzzles, 40/40/20, per-bucket plan prefilled from the rescaled Book 1
    # matrix. AC-204 and AC-205 stand; AC-206 (30/45/25) and AC-207 (derived
    # from audience) are retired unimplemented, kept below as the record of
    # what was open (FR-004 / ADR-0027 precedent).
    # New 2026-09-22 (raw line marked DECISION — default difficulty split for
    # a new book). Formalized NEUTRALLY: the alternative is NOT chosen here.
    # Three are named in the intake: 150 at 40/40/20 (owner's UI request,
    # "beginner"), 30/45/25 (research matrix, "mixed"), or derived from the
    # book's audience field (book_create.html already collects an
    # audience). The owner's own doc lists the last as an open item.
    statement: >-
      A new book starts with a default distribution plan (FR-034) that the
      owner can edit on Print setup; the default is a stored plan whose
      split sums to 100% and whose per-bucket plan is the prefill of that
      split. Which default split applies — 150 puzzles at 40/40/20, the
      research mix 30/45/25, or a split derived from the book's audience
      field — is the open decision.
    source: [US-025]
    _meta:
      source: authored
      dec_expected: true
      dec_question: "Default difficulty split for a new book: 150 puzzles at 40/40/20 (owner's UI request, 'beginner') vs 30/45/25 (research matrix, 'mixed') vs derived from the book's audience field (beginner -> 40/40/20, enthusiast -> 30/45/25)?"
      dec_alternatives: [fixed_150_at_40_40_20, fixed_research_mix_30_45_25, derived_from_audience]
      criteria_by_alternative:
        holds_under_every_alternative: [AC-204]
        fixed_150_at_40_40_20_only: [AC-205]
        fixed_research_mix_30_45_25_only: [AC-206]
        derived_from_audience_only: [AC-207]
      evidence: ["docs/book_generation_req/book_admin_ui_requirements.md#1", "docs/book_generation_req/book_admin_ui_requirements.md#open-items", "src/nonogram/admin/templates/book_create.html"]
    acceptance:
      # holds under every alternative
      - id: AC-204
        given: a new book created with no Print setup values entered
        when: its stored plan is read
        then: the split sums to 100% and the per-bucket plan equals the prefill of that split
        kind: boundary
        invariant: INV-005
        test: TestBookCreate_StoresDefaultPlanThatSumsTo100
      # alternative: fixed_150_at_40_40_20
      - id: AC-205
        given: a new book created with no Print setup values entered
        when: its stored plan is read
        then: the plan is 150 puzzles at 40/40/20 (60/60/30)
        kind: happy
        test: TestBookCreate_DefaultPlanIs150At40_40_20
      # alternative: fixed_research_mix_30_45_25
      - id: AC-206
        given: a new book created with no Print setup values entered
        when: its stored plan is read
