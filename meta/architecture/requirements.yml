  - id: FR-031
    # New 2026-09-22 (BK-2, BK-UI-7). Today there is no cell-size check
    # anywhere in the book flow; layout.py's MIN_CELL_MM = 2.0 is a render
    # backstop, not a print rule. Puzzles enter a book through two routes:
    # the selection step (POST /book/<id>/select-puzzles) and the detail
    # page's paste-IDs form (POST /book/<id>/add-puzzles), both ending in
    # BookManager.add_puzzles_to_book — the floor holds on both (EC-021).
    statement: >-
      A puzzle whose cell on the book's trim (FR-030's computation, the same
      value the PDF would print) falls below the 4.8 mm floor (TERM-024) is
      flagged on its puzzle-selection tile with its computed cell size, and
      cannot become a member of the book, by any add route, without an
      explicit per-puzzle override (TERM-025) that is stored with the book.
      Every tile shows the puzzle's computed cell on the book's trim,
      already capped at the 7.5 mm standard cell. The finalise summary
      counts the book's puzzles below the floor, recomputed on the book's
      current trim and margins.
    source: [US-023]
    _meta:
      source: authored
      evidence: ["src/nonogram/admin/book_manager.py:244-309", "src/nonogram/admin/app.py:2004", "src/nonogram/admin/app.py:2330", "src/nonogram/admin/templates/book_select_puzzles.html", "src/nonogram/admin/templates/book_finalize.html", "src/nonogram/export/layout.py:230"]
      open_note: "Where the per-puzzle override is stored has no column today (migration needed; implementation detail, not a decision)."
    acceptance:
      - id: AC-182
        given: a Book 1 profile book and a 30-wide x 25-tall puzzle whose row-clue gutter is 12 entries deep and column-clue gutter 8 deep (42 cells across, 4.61 mm on the trim)
        when: the puzzle-selection step lists it
        then: its tile shows a 4.61 mm cell with a below-floor flag
        kind: happy
        test: TestBookSelect_TileShowsCellAndBelowFloorFlag
      - id: AC-183
        given: the same Book 1 profile book and the same 4.61 mm puzzle, with no override given
        when: the puzzle is submitted from the selection step
        then: the puzzle is not added — the book's puzzle list is unchanged and the response names 4.61 mm against the 4.8 mm floor
        kind: negative
        invariant: INV-006
        test: TestBookAddPuzzles_RefusesBelowFloorWithoutOverride
      - id: AC-184
        given: the same book and puzzle, submitted with an explicit override for that puzzle id
        when: the add is processed
        then: the puzzle becomes a member and the override is persisted for that puzzle id
        kind: happy
        invariant: INV-006
        test: TestBookAddPuzzles_AcceptsBelowFloorWithOverrideAndRecordsIt
      - id: AC-185
        given: the same book and puzzle, with no override
        when: its id is pasted into the book detail page's add-puzzles form (POST /book/<id>/add-puzzles)
        then: the puzzle is not added — the floor holds on the paste-IDs route too
        kind: negative
        invariant: INV-006
        test: TestBookAddPuzzlesByIds_RefusesBelowFloorWithoutOverride
      - id: AC-186
        given: a Book 1 profile book holding a 30-wide x 20-tall puzzle whose row-clue gutter is 10 entries deep and column-clue gutter 8 deep (40 cells across, 4.84 mm)
        when: it is submitted without an override
        then: the puzzle is added with no flag — 4.84 mm is at or above the floor
        kind: boundary
        test: TestBookAddPuzzles_AcceptsCellJustAboveFloor
      - id: AC-187
        given: a book holding 150 puzzles, 2 of them added below the floor with overrides
        when: the finalise step renders its summary
        then: the summary reports 2 puzzles below the 4.8 mm floor
        kind: happy
        test: TestBookFinalize_SummaryCountsPuzzlesBelowFloor
      - id: AC-188
        given: a Book 1 profile book holding a 20x20 puzzle with 8-deep row- and column-clue gutters (6.92 mm on 8.5 x 11), no puzzle below the floor
        when: its trim is changed to 6 x 9 in and the finalise summary is rendered
        then: the summary reports 1 puzzle below the floor (4.65 mm on the new trim)
        kind: boundary
        test: TestBookFinalize_SummaryRecountsBelowFloorAfterTrimChange
    engineering_constraints:
      - id: EC-021
        statement: >-
          For any puzzle, any stored trim and margins and every add route
          (selection step, paste-IDs form, any future route ending in the
          book store), a puzzle whose book cell is below 4.8 mm becomes a
          member only together with a stored override for its id; and the
          tile's cell, the add refusal and the finalise count all come from
          the one computation FR-030's PDF uses, so no two of them can
          disagree about a puzzle.
        kind: consistency
        invariant: INV-006
        instances: [AC-183, AC-185]
        test: PropertyTest_BookMembership_BelowFloorOnlyWithStoredOverride

  - id: FR-032
    # AMENDED 2026-09-22 (b) (raw-requirements.md "## 2026-09-22 (b)", line 1;
    # BK-3 amended, book rule 5; owner decision — a turned picture is harder
    # to recognise). A book puzzle is NEVER TURNED: the page is portrait and
    # the picture prints upright, grid columns across the page. The clause
    # "with the puzzle's longest side running down the page" is dropped —
    # for a wide grid it could only hold by rotating the picture, which is
    # exactly what the owner ruled out. The wide-grid flag is dropped too:
    # a wide grid prints at the cell its width allows (20 wide -> 7.45 mm,
    # 25 wide -> 6.0 mm, 30 wide -> ~5.0 mm) and is covered only by the
    # 4.8 mm floor check (FR-031). AC-191 and AC-192 are RETIRED
    # unimplemented (FR-004 / ADR-0027 precedent), kept below as the record;
    # AC-240/AC-241 replace them. On a two-up page (FR-040) the fixed top
    # edge is the UPPER puzzle's. FR-031 and FR-036 were checked: neither
    # carries a wide-grid flag. Statement as first written, verbatim:
    #   "Every puzzle page of a book is portrait, with the puzzle's longest
    #   side running down the page; the book never turns a page to landscape
    #   (NFR-006 governs CLI and web exports only). The top edge of the
    #   puzzle drawing sits at the same position on every puzzle page — below
    #   the top margin and the title band — rather than being centred
    #   vertically. A wide grid (width greater than height) is flagged on its
    #   puzzle-selection tile."
    #
    # New 2026-09-22 (BK-1 top-edge clause, BK-3). export/layout.py's
    # _orientation_for turns the SHEET to landscape when that prints a
    # larger cell (NFR-006) — right for a loose A4 printout, wrong inside a
    # bound portrait book. NFR-006 is NOT amended: it stays true of the CLI
    # and web exports; this FR scopes the book out of it.
    statement: >-
      Every puzzle page of a book is portrait and every puzzle prints
      upright — never rotated: the grid's columns run across the page and
      its rows down it, whatever its shape. The book never turns a page to
      landscape (NFR-006 governs CLI and web exports only). A wide grid
      (width greater than height) prints at the cell its width allows and
      carries no flag of its own; only the 4.8 mm floor check (FR-031)
      applies to it. The top edge of the puzzle drawing sits at the same
      position on every puzzle page — below the top margin and the title
      band — rather than being centred vertically; on a two-up page
      (FR-040) that position is the upper puzzle's.
    source: [US-023]
    _meta:
      source: authored
      amended: "2026-09-22 (b) — upright pictures, no wide-grid flag (BK-3 amended)"
      retired_criteria: [AC-191, AC-192]
      evidence: ["src/nonogram/export/layout.py:635-716", "docs/book_generation_req/book_generation_admin_panel.md#2", "docs/book_generation_req/book_generation_admin_panel.md#3"]
    acceptance:
      - id: AC-189
        given: a Book 1 profile book holding a 30-wide x 15-tall puzzle
        when: the book PDF is generated
        then: that puzzle's page is portrait, 2550 px wide by 3300 px tall
        kind: happy
        test: TestBookPdf_WideGridPrintsOnPortraitPage
      - id: AC-190
        given: a Book 1 profile book holding a 15x15 puzzle and a 30x30 puzzle
        when: the book PDF is generated
        then: the top edge of the puzzle drawing is on the same pixel row on both pages
        kind: boundary
        test: TestBookPdf_PuzzleTopEdgeSamePositionOnEveryPage
      # RETIRED 2026-09-22 (b) unimplemented — the wide-grid flag is dropped
      # (BK-3 amended); replaced by AC-241. Kept as the record.
      - id: AC-191
        given: a 30-wide x 15-tall puzzle available for a book
        when: the puzzle-selection step lists it
        then: its tile carries a wide-grid flag
        kind: happy
        test: TestBookSelect_FlagsWideGrid
      # RETIRED 2026-09-22 (b) unimplemented — no wide-grid flag exists to
      # be absent (BK-3 amended). Kept as the record.
      - id: AC-192
        given: a 20x20 puzzle and a 15-wide x 30-tall puzzle available for a book
        when: the puzzle-selection step lists them
        then: neither tile carries a wide-grid flag
        kind: negative
        test: TestBookSelect_SquareAndTallGridsNotFlaggedWide
      # New 2026-09-22 (b) — upright, never turned.
      - id: AC-240
        given: a Book 1 profile book holding a 30-wide x 15-tall puzzle
        when: the book PDF is generated
        then: the puzzle's grid is drawn with 30 columns across the page and 15 rows down it (unrotated)
        kind: happy
        test: TestBookPdf_WideGridPrintsUprightNeverRotated
      - id: AC-241
        given: a Book 1 profile book and a 25-wide x 12-tall puzzle whose book cell is 6.0 mm (above the 4.8 mm floor)
        when: the puzzle-selection step lists it
        then: its tile carries no flag — neither a wide-grid flag nor a below-floor flag
        kind: negative
        test: TestBookSelect_WideGridAboveFloorCarriesNoFlag
    engineering_constraints:
      # AMENDED 2026-09-22 (b): "and the grid is drawn unrotated" added and
      # AC-240 joined the instances (BK-3 amended). Otherwise unchanged.
      - id: EC-022
        statement: >-
          For any puzzle extent of 10..30 per side and any clue depth, the
          book's puzzle page is portrait, the grid is drawn unrotated
          (width across the page, height down it), and the drawing's top
          edge — the upper puzzle's on a two-up page — lies at one fixed
          offset (top margin plus title band) from the top of the trim, so
          that offset never varies between puzzle pages of a book.
        kind: consistency
        instances: [AC-189, AC-190, AC-240]
        test: PropertyTest_BookPdf_PortraitWithFixedTopEdgeForEveryExtent

  - id: FR-033
    # RESOLVED 2026-09-22 by ADR-0037 (DEC-039): the band shows "Puzzle N ·
    # Tier"; under the book PageSpec thin rule >= 0.25 mm, heavy = 2 x thin,
    # pure black; final values confirmed on printed proof pages (30x30, 15x15).
    # New 2026-09-22 (BK-5, rules 7-8). Today the PDF header band
