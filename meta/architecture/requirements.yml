  - id: FR-013
    # AMENDED 2026-09-12 (raw-requirements.md, 2026-09-12 review, entry 3 —
    # NOT marked DECISION). Mechanism half only: which cells a nudge flips.
    # Today's ranking (sourcing/image.py nudge_cells) is a 2x2 "switching
    # block" heuristic that guesses where the ambiguity is; the nudge now
    # chooses from the solver's own undecided/disagreement mask (FR-024) —
    # the cells line logic left undecided at its first fixed point, or where
    # the two witness solutions disagree — nearest the ink boundary first.
    # The POLICY half (POL-002/POL-003: bounded, automatic, report at the cap)
    # is unchanged; so are the cap of 5 (ADR-0002) and the "attempt n flips
    # the best n cells of the ORIGINAL conversion" cumulative property. Id,
    # kind and test refs of AC-034..AC-036 are stable (EC-007 2026-08-31
    # precedent); AC-115..AC-117 and EC-014 are new. Open gap, recorded not
    # invented: the intake does not say what attempt n does when the mask
    # holds fewer than n cells — see _meta.gaps.
    statement: >-
      When an uploaded image's converted grid fails the uniqueness check,
      attempt a bounded number of automatic pixel nudges and re-check; if
      still not unique after the capped attempts, report failure to the
      user rather than continuing to alter the image silently. Each nudge
      chooses the cells it flips from the solver's undecided/disagreement
      mask for the ORIGINAL conversion (FR-024) — the cells line logic left
      undecided at its first fixed point, or on which the two witness
      solutions disagree — ordered nearest the ink boundary first; attempt
      n flips the n best such cells of the original conversion, so the
      nudges of one run nest and at most the capped number of the user's
      pixels are ever altered.
    source: [US-007]
    _meta:
      source: authored
      amended: 2026-09-12
      evidence: ["docs/GENERATION_ALGORITHM.md#8.3", "src/nonogram/sourcing/image.py nudge_cells"]
      gaps:
        - "Attempt n when the undecided/disagreement mask holds fewer than n cells: flip all of them and stop, or fall back to a secondary ranking? Not stated in the intake — needs an owner answer before the card is cut."
    acceptance:
      - id: AC-034
        given: an uploaded image whose initial conversion fails the uniqueness check, with nudge attempts remaining under the cap
        when: the auto-nudge policy evaluates
        then: a bounded pixel nudge is applied automatically and the result is re-checked
        kind: happy
        policy: POL-002
        test: TestNudge_AttemptsBoundedRecovery
      - id: AC-035
        given: an uploaded image conversion that has exhausted the configured nudge cap without reaching uniqueness
        when: the uniqueness check is evaluated again
        then: the tool reports failure to the user and stops altering the image
        kind: boundary
        invariant: INV-003
        policy: POL-003
        test: TestNudge_ReportsFailureAtCap
      - id: AC-036
        given: a reported nudge-cap failure
        when: the failure is presented to the user
        then: the message states that the user should retry with a different image or size
        kind: negative
        test: TestNudge_FailureMessageSuggestsRetry
      - id: AC-115
        given: an uploaded silhouette whose conversion at 20x20 reports MANY, with an undecided/disagreement mask of 14 cells
        when: nudge attempt 3 is applied
        then: all 3 flipped cells are members of that 14-cell mask
        kind: boundary
        policy: POL-002
        test: TestNudge_FlipsOnlyCellsInsideUndecidedMask
      - id: AC-116
        given: an undecided mask containing one cell adjacent to the ink boundary (Chebyshev distance 0 from a differently-valued neighbour) and one cell 3 cells away from any ink boundary
        when: nudge attempt 1 is applied
        then: the cell adjacent to the ink boundary is the one flipped
        kind: happy
        test: TestNudge_PrefersCellsNearestInkBoundary
      - id: AC-117
        given: a conversion whose mask-driven nudge attempts 1, 2 and 3 flipped cell sets S1, S2, S3
        when: the three sets are compared to the ORIGINAL conversion
        then: S1 is a subset of S2, S2 is a subset of S3, and S3 differs from the original conversion in exactly 3 cells
        kind: boundary
        test: TestNudge_MaskDrivenAttemptsRemainCumulativeFromOriginalConversion
    engineering_constraints:
      - id: EC-014
        statement: >-
          For any uploaded image whose conversion reports MANY and any
          attempt number n in 1..5, the set of cells nudge attempt n flips
          is a subset of the solver's undecided/disagreement mask for the
          ORIGINAL conversion, has exactly min(n, |mask|) members, and
          contains every cell attempt n-1 flipped — for every image and
          every n, not only the measured examples. The cap of 5 and the
          re-verification of every nudged grid by the real solver
          (CON-005) are unchanged by the mechanism.
        kind: consistency
        instances: [AC-115, AC-117]
        test: PropertyTest_Nudge_FlippedCellsSubsetOfUndecidedMaskAndNested

  - id: FR-014
    statement: >-
      When image-mode generation required one or more automatic pixel
