  - id: FR-040
    # OWNER ANSWERS 2026-09-22 to _meta.open_question (kept below as the
    # record): (1) a pair-aware call in COMP-007 lays out the two-up page with
    # one shared cell — recorded as an ADR-0036 clarification (History), the
    # admin panel still fits no cells (ADR-0036/R2); (2) no fixed-point loop:
    # the book keeps its stored gutter margin (Book 1: 0.5 in, valid up to 300
    # pages) and finalise refuses when the actual page count needs a larger
    # KDP gutter than the one stored.
    # New 2026-09-22 (b) (raw-requirements.md "## 2026-09-22 (b)", line 2;
    # BK-6, book rule 10). DECIDED by the owner in the DEC-039 session, not
    # a DEC EXPECTED. Today every book page holds exactly one puzzle
    # (book_pdf_generator.py loops one render_pages call per puzzle).
    # Relations:
    #  - NFR-008: the 7.0 mm two-up minimum sits INSIDE NFR-008's 4.8..7.5
    #    mm range; a two-up page never uses the 4.8 mm floor or a floor
    #    override, and the 7.5 mm standard cell still caps the shared cell.
    #  - ADR-0036: the pair is laid out through compute_layout with the
    #    book's PageSpec treated as two slots (ADR-0036/R2 — the admin panel
    #    does not fit cells itself). HOW the PageSpec expresses two slots
    #    whose split depends on both puzzles' heights is an implementation
    #    shape not fixed by ADR-0036 (see _meta.open_question).
    #  - ADR-0037: each slot carries its own 12 mm band "Puzzle N · Tier".
    #  - FR-041: pairs never span a level (same-tier rule), so a pair never
    #    straddles a divider page.
    # Measured on the Book 1 profile (CON-018): usable width 193.7 mm
    # (215.9 - 12.7 - 9.525), usable height 260.35 mm (279.4 - 2 x 9.525),
    # 236.35 mm left for the two drawings after two 12 mm bands. The
    # owner's worked cases (10+10 at 7.5, 12+12 at 7.4, 15+10 at 7.0; 15+12
    # and 15+15 do not pair) assume ~30% clue bands; the criteria below
    # state their clue depths explicitly and compute from them.
    statement: >-
      Two puzzles share one book page (a two-up page, TERM-030) when, and
      only when, their tiers are equal, they are next to each other in the
      book order (TERM-032), and both fit at one shared cell of at least
      7.0 mm. The shared cell is the largest cell, capped at the 7.5 mm
      standard cell (NFR-008), at which (a) the pair's combined drawing
      height — grid rows plus column-clue rows of both puzzles — times the
      cell, plus one 12 mm title band per puzzle, fits the book's usable
      height (trim height minus top and bottom margins), and (b) each
      puzzle's drawing width — grid columns plus row-clue columns — times
      the cell fits the usable width; clue depths are each puzzle's real
      clue depth (TERM-021). Both puzzles of a two-up page print at that
      one shared cell, each under its own band ("Puzzle N · Tier",
      ADR-0037), the earlier puzzle in the book order in the upper slot.
      Pairing walks the book order from the first puzzle: a puzzle pairs
      with the next one when the rule above holds, otherwise it stands
      alone on its page and the walk moves on; a puzzle left without a
      partner (e.g. the last of an odd run) prints alone. Pairing never
      reorders the book: reading the pages front to back yields the book
      order exactly, so puzzle numbers stay in sequence.
    source: [US-023]
    _meta:
      source: authored
      decided_by: "owner, 2026-09-22 (DEC-039 session) — BK-6, book_admin_ui_requirements.md rule 10"
      relates_to: [NFR-008, FR-030, FR-032, FR-033, FR-041, ADR-0036, ADR-0037]
      open_question: "(1) How compute_layout's PageSpec expresses a two-slot page whose split depends on both puzzles (a pair-aware call vs two per-slot calls with a shared-cell cap) is not fixed by ADR-0036 — implementation shape, possibly an ADR-0036 revision. (2) Circularity: KDP's gutter minimum depends on the page count (AC-179), and the page count depends on pairing, which depends on usable width, which depends on the gutter; it cannot bite on the Book 1 profile (stored gutter 0.5 in >= both minimums) but can for a stored 0.375 in gutter near 150 pages. The resolution order is unstated."
      evidence: ["src/nonogram/admin/book_pdf_generator.py:148-210", "docs/book_generation_req/book_generation_admin_panel.md#3", "docs/book_generation_req/book_admin_ui_requirements.md#5"]
    acceptance:
      - id: AC-242
        given: a Book 1 profile book whose order starts with two easy 10x10 puzzles, each with 4-deep row- and column-clue gutters (combined drawing height 28 cells)
        when: the book PDF is generated
        then: both puzzles print on one page at a 7.5 mm shared cell (the page fit of 8.44 mm capped at the standard cell)
        kind: happy
        invariant: INV-010
        test: TestBookPdf_TwoSmallSameTierNeighboursShareAPage
      - id: AC-243
        given: a Book 1 profile book whose order starts with two easy 12x12 puzzles, each with 4-deep row- and column-clue gutters (combined drawing height 32 cells)
        when: the book PDF is generated
        then: both puzzles print on one page at a 7.39 mm shared cell (+/- 0.05 mm; 236.35 mm over 32 cells)
        kind: boundary
        invariant: INV-010
        test: TestBookPdf_TwelvePairSharesPageBelowStandardCell
      - id: AC-244
        given: a Book 1 profile book whose order has an easy 15x15 puzzle with a 5-deep column-clue gutter followed by an easy 10x10 puzzle with a 3-deep column-clue gutter (combined drawing height 33 cells)
        when: the book PDF is generated
        then: both puzzles print on one page at a 7.16 mm shared cell (+/- 0.05 mm) — at or above the 7.0 mm two-up minimum
        kind: boundary
        invariant: INV-010
        test: TestBookPdf_PairJustAboveTwoUpMinimumShares
      - id: AC-245
        given: the same book but the 15x15 puzzle's column-clue gutter is 6 deep (combined drawing height 34 cells, 6.95 mm shared cell)
        when: the book PDF is generated
        then: the two puzzles print on two separate pages
        kind: boundary
        invariant: INV-010
        test: TestBookPdf_PairJustBelowTwoUpMinimumDoesNotShare
      - id: AC-246
        given: a Book 1 profile book whose order has an easy 15x15 puzzle with a 5-deep column-clue gutter followed by an easy 12x12 puzzle with a 4-deep one (combined 36 cells, 6.57 mm)
        when: the book PDF is generated
        then: the two puzzles print on two separate pages
        kind: negative
        invariant: INV-010
        test: TestBookPdf_FifteenPlusTwelveDoesNotPair
      - id: AC-247
        given: a Book 1 profile book whose order has an easy 22-wide x 10-tall puzzle with a 6-deep row-clue gutter (28 cells across, at most 6.92 mm on the 193.7 mm usable width) followed by an easy 10x10 puzzle with 3-deep gutters
        when: the book PDF is generated
        then: the two puzzles print on two separate pages — the pair fits the height but the wide puzzle's drawing does not fit the width at 7.0 mm
        kind: negative
        invariant: INV-010
        test: TestBookPdf_PairFailingWidthAtTwoUpMinimumDoesNotShare
      - id: AC-248
        given: a Book 1 profile book whose last easy puzzle and first medium puzzle are both 10x10 with 4-deep gutters and adjacent in the book order
        when: the book PDF is generated
        then: the two puzzles print on two separate pages
        kind: negative
