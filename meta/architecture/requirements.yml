    source: [US-001]
    acceptance:
      - id: AC-010
        given: a requested density of 30%
        when: a random grid is generated
        then: the fraction of filled cells is within ±3 percentage points of 30% (ADR-0003)
        kind: happy
        test: TestGenerateRandom_RespectsDensityParameter
      - id: AC-011
        given: a requested density of 150% (outside the valid 0-100% range)
        when: generation is requested
        then: the request is rejected with an error and no grid is produced
        kind: negative
        test: TestGenerateRandom_RejectsInvalidDensity

  - id: FR-005
    statement: >-
      Compute row and column clues from any solution grid via run-length
      encoding of contiguous filled runs.
    source: [US-004]
    acceptance:
      - id: AC-012
        given: a grid row with pattern "██·███··"
        when: clues are computed for that row
        then: the row clue equals [2, 3]
        kind: happy
        test: TestComputeClues_EncodesRunLengths
      - id: AC-013
        given: a grid row with no filled cells
