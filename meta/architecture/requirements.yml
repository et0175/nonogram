      score.
    source: [US-008]
    acceptance:
      - id: AC-022
        given: solver signals for a 15x15 candidate (80% of cells solved by line-logic, low backtracking, 0.2s solve time)
        when: the candidate is scored
        then: a single numeric difficulty score is produced reflecting the weighted combination of all signals
        kind: happy
        test: TestScoreDifficulty_CombinesSignals
      - id: AC-023
        given: a candidate solved entirely by line-logic with zero backtracking
        when: the candidate is scored
        then: the score falls at the easiest end of the scale
        kind: boundary
        test: TestScoreDifficulty_ZeroBacktrackingScoresEasiest

  - id: FR-010
    statement: >-
      Regenerate or resample a candidate puzzle until its estimated
