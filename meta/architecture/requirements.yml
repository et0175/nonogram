      - id: AC-025
        given: a scored candidate whose score falls outside the requested tier's threshold range
        when: the score is checked
        then: the resample policy fires and a new candidate is generated
        kind: boundary
        policy: POL-004
        test: TestResample_FiresWhenScoreOutOfRange
      - id: AC-026
        given: a newly resampled candidate produced in response to an out-of-range score
        when: the resample completes
