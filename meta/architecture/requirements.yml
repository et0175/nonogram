functional:
  - id: FR-001
    # SUPERSEDED 2026-08-30 by FR-019 (US-016, raw-requirements.md line 84).
    # The statement below is preserved VERBATIM and is deliberately not edited:
    # its "10x10 to 50x50" range is exactly what was superseded, so rewriting it
    # in place would erase the thing the supersession records. FR-019 restates
    # the same behaviour over a (width, height) pair with each side in 10..30.
    # AC-001..AC-004 retire with it: AC-001 -> AC-066, AC-002 (50x50 max) ->
    # AC-068 (30x30 max), AC-003 (60x60 rejected) -> AC-069 (31x30 rejected —
    # 60x60 is no longer the boundary at MAX_SIZE=30), AC-004 (9x9 rejected) ->
    # AC-070 (30x9 rejected). The FR entry, its trace row and its capability
    # mapping all stay in place so the supersession is reversible.
    status: superseded
    superseded_by: FR-019
    statement: >-
      Generate a random black/white solution grid at a configurable size
      from 10x10 to 50x50.
    source: [US-001]
    acceptance:
      - id: AC-001
        given: a request for a 20x20 random grid
        when: the grid is generated
        then: a 20x20 black/white grid is produced
        kind: happy
        test: TestGenerateRandom_ProducesRequestedSize
      - id: AC-002
        given: a request for the maximum supported size, 50x50
        when: the grid is generated
        then: a 50x50 grid is produced without error
        kind: boundary
        test: TestGenerateRandom_AcceptsMaxSize50
      - id: AC-003
        given: a request for a 60x60 grid (above the supported range)
        when: generation is requested
        then: the request is rejected with a size-range error and no grid is produced
        kind: negative
        test: TestGenerateRandom_RejectsSizeAbove50
      - id: AC-004
        given: a request for a 9x9 grid (below the supported range)
        when: generation is requested
        then: the request is rejected with a size-range error and no grid is produced
        kind: negative
        test: TestGenerateRandom_RejectsSizeBelow10

  - id: FR-002
    statement: >-
      Generate a solution grid from a fixed, named built-in image library
      (at minimum: cat, house, heart, moon), selectable by key; the library
      set is extensible without changing this requirement.
    source: [US-002]
    acceptance:
      - id: AC-005
        given: the built-in library key "cat"
        when: a grid is requested from the library
        then: a grid matching the cat template at the target size is produced
        kind: happy
        test: TestGenerateLibrary_ProducesCatGrid
      - id: AC-006
        given: an unknown library key "dragon" not present in the built-in library
        when: a grid is requested from the library
        then: the request is rejected with an unknown-library-image error and no grid is produced
        kind: negative
        test: TestGenerateLibrary_RejectsUnknownKey

  - id: FR-003
    # AMENDMENT NOTE 2026-09-12 (raw-requirements.md, 2026-09-12 review,
    # entry 6): the "Floyd-Steinberg error-diffusion dithering" clause of this
    # statement is under decision for CON-013 silhouette input — FR-027
    # formalizes the alternative (a 50% ink-coverage threshold after the
    # LANCZOS resize, dither kept for genuinely greyscale input) NEUTRALLY,
    # with a DEC expected and an owner visual gate on the picture corpus
    # before anything lands. Statement, AC ids and tests are deliberately NOT
    # rewritten here: until that DEC resolves, this FR describes what ships.
    statement: >-
      Generate a solution grid from a user-uploaded image, converted via
      resize to the target grid size followed by Floyd-Steinberg
      error-diffusion dithering before binarizing each cell.
    source: [US-003]
    acceptance:
      - id: AC-007
        given: a valid PNG image and a target size of 25x25
        when: the image is converted
        then: a 25x25 black/white grid is produced via resize and dithering
        kind: happy
        test: TestConvertImage_ProducesDitheredGrid
      - id: AC-008
        given: a path to a non-existent or corrupt image file
        when: conversion is requested
        then: the request fails with a "cannot read image" error and no grid is produced
        kind: negative
        test: TestConvertImage_RejectsUnreadableFile
      # SUPERSEDED 2026-08-30 by AC-059 (FR-021). AC-009's unqualified "differs
      # from the target grid" became false the moment FR-021 made a >2x ratio
      # difference a REFUSAL rather than a crop: the criterion as written now
      # asserts a converted grid for inputs the tool must reject. Preserved
      # verbatim rather than rewritten; AC-059 restates it inside the accepted
      # ratio band and reuses no test name.
      - id: AC-009
        status: superseded
        superseded_by: AC-059
        given: a source image whose aspect ratio differs from the target grid
        when: the image is converted
        then: the output grid has exactly the requested target dimensions
        kind: boundary
        test: TestConvertImage_ProducesExactTargetDimensions
      - id: AC-059
        given: a 563x980 portrait source image (ratio 0.574) and a 15x30 target grid (ratio 0.500), whose ratios differ by 1.15x — inside FR-021's accepted 2x band
        when: the image is converted
        then: the output grid has exactly 15 columns and 30 rows
        kind: boundary
        test: TestConvertImage_ProducesExactTargetDimensionsWithinAcceptedRatioBand

  - id: FR-004
    # AMENDMENT NOTE 2026-09-12 (raw-requirements.md, 2026-09-12 review,
    # entry 7): the ends of the density range are under decision. Today 0 and
    # 100 are accepted and yield an all-empty / all-filled grid that passes
    # the uniqueness check as an Easy puzzle, while random_grid.py claims a
    # later stage rejects them and none does. FR-028 formalizes both
    # alternatives (refuse as InvalidDensity, valid range 1..99 — the review's
    # recommendation — or state explicitly that degenerate grids are allowed)
    # NEUTRALLY, DEC expected. AC-011 is unaffected under either alternative:
    # 150% is outside both 0..100 and 1..99, so its `given` parenthetical
    # "(outside the valid 0-100% range)" stays true and is NOT rewritten.
    statement: >-
      Support configuring grid density (approximate percentage of filled
      cells) for random generation.
    source: [US-001]
    acceptance:
      - id: AC-010
        given: a requested density of 30%
        when: a random grid is generated
        then: the fraction of filled cells is within ±3 percentage points of 30% (ADR-0003)
        kind: happy
        test: TestGenerateRandom_RespectsDensityParameter
      - id: AC-011
        given: a requested density of 150% (outside the valid 0-100% range)
        when: generation is requested
        then: the request is rejected with an error and no grid is produced
        kind: negative
        test: TestGenerateRandom_RejectsInvalidDensity

  - id: FR-005
    statement: >-
      Compute row and column clues from any solution grid via run-length
      encoding of contiguous filled runs.
    source: [US-004]
    acceptance:
      - id: AC-012
        given: a grid row with pattern "██·███··"
        when: clues are computed for that row
        then: the row clue equals [2, 3]
        kind: happy
        test: TestComputeClues_EncodesRunLengths
      - id: AC-013
        given: a grid row with no filled cells
        when: clues are computed for that row
        then: the row clue is the empty-row marker [0]
        kind: boundary
        test: TestComputeClues_HandlesEmptyRow
      - id: AC-014
        given: any solution grid
        when: clues are computed for every row and column
        then: decoding each clue against the grid confirms it exactly matches that line's run-length encoding
        kind: boundary
        invariant: INV-001
        test: TestComputeClues_MatchesGridExactly

  - id: FR-006
    # AMENDMENT NOTE 2026-09-12 (raw-requirements.md, 2026-09-12 review,
    # entry 1): FR-024 EXTENDS this contract — alongside the count the solver
    # now exposes the set of cells line logic left undecided at its first
    # fixed point and, when it reports MANY, a second witness solution. The
    # count semantics (0 / 1 / MANY), the fail-fast rule (AC-017) and EC-001
    # are unchanged; the new outputs cross the module boundary as grid-shaped
    # list[list[bool]] structures (ADR-0012), never as the internal bitmasks.
    statement: >-
      Implement a nonogram solver (constraint propagation + backtracking)
      that determines a puzzle's solution count (0, 1, or many) from its
      clues, failing fast once a second distinct solution is found rather
      than exhaustively enumerating all solutions.
    source: [US-005]
    acceptance:
      - id: AC-015
        given: clues with exactly one valid solution
        when: the puzzle is solved
        then: the solver reports solution_count = 1 and returns that solution grid
        kind: happy
        test: TestSolver_ReportsUniqueSolution
      - id: AC-016
        given: clues with zero valid solutions (a contradictory clue set)
        when: the puzzle is solved
        then: the solver reports solution_count = 0 and no solution grid is returned
        kind: negative
        test: TestSolver_ReportsUnsolvable
      - id: AC-017
        given: clues admitting more than one valid solution
        when: the puzzle is solved
        then: the solver stops immediately after finding a second distinct solution and reports solution_count >= 2, without enumerating every solution
        kind: boundary
        test: TestSolver_FailsFastOnSecondSolution
    engineering_constraints:
      - id: EC-001
        statement: >-
          The solver never reports solution_count = 1 for a clue set that
          actually has 0 or more than 1 solutions, for any input clue set
          (the uniqueness check must never produce a false positive).
        kind: consistency
        instances: [AC-015]
        test: PropertyTest_Solver_NeverFalsePositiveUniqueness

  - id: FR-007
    # AMENDMENT NOTE 2026-09-12 (raw-requirements.md, 2026-09-12 review,
    # entry 2, marked DECISION): the MECHANISM half of this statement —
    # "discard it and regenerate a new candidate" — is under decision for
    # random mode. FR-025 formalizes the alternatives (pure redraw as today,
    # pure repair of the ambiguous region keeping the filled count exact,
    # redraw-then-repair hybrid) NEUTRALLY, DEC expected; POL-006 sits next to
    # POL-001 in policies.yml as the repair reaction. The POLICY half —
    # automatic, no user interaction, bounded by the same retry counter
    # (INV-003, ADR-0002), every candidate re-verified by the real solver
    # (CON-005) — is unchanged and holds under every alternative. AC-018 and
    # AC-019 stand as written; library mode is untouched by the decision.
    statement: >-
      When a random/library-generated candidate fails the uniqueness check
      (0 or >1 solutions), discard it and regenerate a new candidate
      automatically, bounded by a maximum retry count.
    source: [US-006]
    acceptance:
      - id: AC-018
        given: a freshly generated random or library grid whose uniqueness check reports solution_count != 1
        when: the auto-regenerate policy evaluates
        then: a new candidate grid is generated automatically without user interaction and re-checked
        kind: happy
        policy: POL-001
        test: TestRegenerate_FiresOnUniquenessFailure
      - id: AC-019
        given: a candidate that has already been regenerated up to the configured maximum retry bound
        when: another uniqueness failure occurs
        then: generation is abandoned and a clear error is reported instead of retrying again
        kind: boundary
        invariant: INV-003
        policy: POL-005
        test: TestRegenerate_StopsAtMaxRetryBound

  - id: FR-008
    statement: >-
      Expose a difficulty selector with tiers Easy, Medium, and Hard.
    source: [US-008]
    acceptance:
      - id: AC-020
        given: a request specifying difficulty "Medium"
        when: generation runs
        then: the resulting puzzle is tagged with requested tier "Medium" pending score confirmation
        kind: happy
        test: TestSelectDifficulty_AcceptsValidTier
      - id: AC-021
        given: a request specifying difficulty "Extreme" (not a supported tier)
        when: generation is requested
        then: the request is rejected with an unsupported-difficulty error
        kind: negative
        test: TestSelectDifficulty_RejectsUnknownTier

  - id: FR-009
    # AMENDMENT NOTE 2026-09-12 (raw-requirements.md, 2026-09-12 review,
    # entries 4 and 5). Two amendments, neither a rewrite:
    #   (a) "solver time" LEAVES the signal list — NFR-007/CON-014: wall-clock
    #       solve time must not enter the score or the tier decision, so the
    #       same seed and request classify identically on any machine. This
    #       is decided (not marked DECISION in the intake) but it amends
    #       ADR-0013's formula (weight 0.15 on time_pressure) and ADR-0015's
    #       reproducibility consequence, so the ADR revisions are expected
    #       from forge:architect-adr-writer. AC-022's `given` still names
    #       "0.2s solve time" — that figure becomes an ignored input, not a
    #       wrong one; the criterion is left as written.
    #   (b) DEC EXPECTED — FR-026: a puzzle solved entirely by line logic must
    #       be scoreable across the WHOLE scale by how much line reasoning it
    #       needed, and "requires guessing" becomes an explicit attribute
    #       (flag or separate tier — not chosen here). AC-023 below is
    #       CONTRADICTED by FR-026 ("the score falls at the easiest end of the
    #       scale" is exactly what FR-026 removes); it is NOT marked superseded
    #       yet because the DEC is open and this criterion describes what
    #       ships today. When the DEC resolves, AC-023 is superseded by
    #       FR-026's AC-118/AC-119 and this note is the pointer.
    #   (c) REFINED 2026-09-12 (b) by FR-029: the solve's structural signals
    #       this FR scores from also yield the ORDERED LIST OF SOLVING
    #       STRATEGIES the verifying solve required (fixed enum, provisional
    #       members fixed by DEC-030/DEC-031), recorded off the same solve
    #       with no re-solve and persisted with the puzzle. No change to the
    #       score itself; FR-029 owns the list.
    statement: >-
      Score a candidate puzzle's difficulty as a weighted heuristic
      combining cells solved by line-only logic, backtracking amount,
      solver time, puzzle size, and clue density into a single numeric
      score.
    source: [US-008]
    acceptance:
      - id: AC-022
        given: solver signals for a 15x15 candidate (80% of cells solved by line-logic, low backtracking, 0.2s solve time)
        when: the candidate is scored
        then: a single numeric difficulty score is produced reflecting the weighted combination of all signals
        kind: happy
        test: TestScoreDifficulty_CombinesSignals
      # CONTRADICTED 2026-09-12 by FR-026 (DEC pending) — see the FR-009 note.
      - id: AC-023
        given: a candidate solved entirely by line-logic with zero backtracking
        when: the candidate is scored
        then: the score falls at the easiest end of the scale
        kind: boundary
        test: TestScoreDifficulty_ZeroBacktrackingScoresEasiest

  - id: FR-010
    # AMENDMENT NOTE 2026-09-12 (raw-requirements.md, 2026-09-12 review,
    # entries 4 and 5): the tier decision this loop makes is amended twice
    # without changing the loop. (a) NFR-007/CON-014 — the decision must be
    # a pure function of the solve's structural signals, never of elapsed
    # time, so whether a candidate is kept or resampled for a given seed is
    # identical on every machine (today it is not: a boundary candidate can
    # flip tiers on a slower host). (b) DEC EXPECTED, FR-026 — once
    # line-solvable puzzles are graded across the whole scale and "requires
    # guessing" is an explicit attribute, the requested tier's band is read
    # off that grading; whether "requires guessing" is a flag inside the
    # existing tiers or a tier of its own changes what `--difficulty` can
    # ask for, and is the open decision. AC-024..AC-027 stand as written.
    statement: >-
      Regenerate or resample a candidate puzzle until its estimated
      difficulty score falls within the requested tier's threshold range,
      bounded by a maximum retry count.
    source: [US-008]
    acceptance:
      - id: AC-024
        given: a scored candidate whose score falls within the requested "Hard" tier's threshold range
        when: the score is checked
        then: the candidate is accepted as final and no further resampling occurs
        kind: happy
        test: TestResample_AcceptsCandidateInRange
      - id: AC-025
        given: a scored candidate whose score falls outside the requested tier's threshold range
        when: the score is checked
        then: the resample policy fires and a new candidate is generated
        kind: boundary
        policy: POL-004
        test: TestResample_FiresWhenScoreOutOfRange
      - id: AC-026
        given: a newly resampled candidate produced in response to an out-of-range score
        when: the resample completes
        then: the new candidate is re-scored automatically before any further check
        kind: boundary
        policy: POL-004
        test: TestResample_RescoresNewCandidate
      - id: AC-027
        given: a candidate that has already been resampled up to the configured maximum retry bound without matching the requested tier
        when: the score is checked again
        then: generation is abandoned with a clear error
        kind: boundary
        invariant: INV-003
        policy: POL-005
