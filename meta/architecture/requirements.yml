      grid lines, and every 5th grid line is drawn bolder than the lines
      between.
    source: [US-024]
    _meta:
      source: authored
      open_question: "Measurable thresholds for 'dark' grid lines and 'clearly bolder' 5th lines are unstated (colour/min stroke width in mm, bold:thin ratio) — NFR threshold needed from the owner, not invented."
      evidence: ["src/nonogram/export/layout.py:233-252", "src/nonogram/export/layout.py:406-500", "src/nonogram/admin/book_pdf_generator.py:185-210"]
    acceptance:
