        test: TestExport_RejectsUnverifiedPuzzle

  - id: FR-012
    statement: >-
      Export the underlying solution grid and clues as JSON and/or CSV,
      sufficient to exactly reconstruct the puzzle.
    source: [US-010]
    acceptance:
      - id: AC-031
        given: a finalized, uniqueness-confirmed puzzle
        when: it is exported as JSON
        then: the JSON file contains the full solution grid and clues
        kind: happy
        test: TestExport_WritesJSON
      - id: AC-032
        given: a finalized, uniqueness-confirmed puzzle
        when: it is exported as CSV
        then: the CSV file contains the full solution grid and clues
        kind: happy
        test: TestExport_WritesCSV
      - id: AC-033
        given: a puzzle exported as JSON
        when: that JSON is decoded back
        then: the resulting grid and clues are exactly identical to the original puzzle's
        kind: boundary
        test: TestExport_JSONRoundTripsExactly
      # Added 2026-08-30 (FR-018/CON-011 delta). This is a FILE FORMAT change,
      # not just a wider input range: today's exporters write grid extent as a
      # single `size` integer (src/nonogram/export/json_export.py's "size" key,
      # and "size" in csv_export.py's _META_KEYS), which cannot express a
      # rectangle. FR-012's round-trip fidelity — and EC-002, which generalizes
      # it — is therefore at stake until the metadata carries both dimensions.
      # AC-033/AC-031/AC-032 stay true for square puzzles and are NOT rewritten.
      - id: AC-060
        given: a finalized 30x12 puzzle exported as JSON
        when: that JSON is decoded back
        then: the decoded puzzle has width 30 and height 12, both read from the file's metadata rather than inferred as a square
        kind: boundary
        test: TestExport_JSONRoundTripsRectangularDimensions
      - id: AC-061
        given: a finalized 30x12 puzzle exported as CSV
        when: that CSV is decoded back
        then: the decoded puzzle has width 30 and height 12, both read from the file's metadata rather than inferred as a square
        kind: boundary
        test: TestExport_CSVRoundTripsRectangularDimensions
    engineering_constraints:
      - id: EC-002
        statement: >-
          For any finalized puzzle, decoding its exported JSON or CSV
          representation reproduces the exact original solution grid and
          clues.
        kind: consistency
        instances: [AC-033]
        test: PropertyTest_Export_RoundTripsExactlyForAnyPuzzle

  - id: FR-013
    # AMENDED 2026-09-12 (raw-requirements.md, 2026-09-12 review, entry 3 —
    # NOT marked DECISION). Mechanism half only: which cells a nudge flips.
    # The ranking it replaced (sourcing/image.py nudge_cells, now retired) was
    # a 2x2 "switching block" heuristic that guessed where the ambiguity is;
    # the nudge now chooses from the solver's own report (FR-024).
    #
    # RE-AMENDED 2026-09-17 (CARD-075, from CARD-096's measurement). The
    # 2026-09-12 wording had the mask as the primary region and had attempt n
    # choose n cells at once from the ORIGINAL conversion. CARD-096 measured
    # both and found both wrong:
    #   * the two witnesses disagreed on 4 cells in 27 of 34 abandonments,
    #     while the undecided mask covered a median 35% of the grid (up to
    #     100%) — so the disagreement set is the primary region and the mask
    #     is the fallback, the same order ADR-0024's repair already uses;
    #   * choosing once from the original conversion rescued 9 of the 36
    #     conversions dithering fails, re-reading the solver each attempt
    #     rescued 19 (the retired ranking rescued 0) — so each attempt adds
    #     ONE cell, chosen from what the solver reported about the grid the
    #     PREVIOUS attempt was judged on.
    # The POLICY half (POL-002/POL-003: bounded, automatic, report at the cap)
    # is unchanged; so are the cap of 5 (ADR-0002) and the cumulative property
    # — attempt n differs from the ORIGINAL conversion in exactly n cells and
    # contains every cell attempt n-1 flipped. Id, kind and test refs of
    # AC-034..AC-036 are stable (EC-007 2026-08-31 precedent); AC-115..AC-117
    # and EC-014 are the amended ones. The 2026-09-12 gap below ("attempt n
    # when the mask holds fewer than n cells") is RESOLVED by the re-amendment
    # rather than answered: attempts no longer draw n cells from one fixed
    # set, and the successor rule is AC-116's — fall back to the mask, then
    # stop adding while the counter keeps running.
    statement: >-
      When an uploaded image's converted grid fails the uniqueness check,
      attempt a bounded number of automatic pixel nudges and re-check; if
      still not unique after the capped attempts, report failure to the
      user rather than continuing to alter the image silently. Each attempt
      adds ONE cell to the set it flips, chosen from what the solver
      reported about the grid the previous attempt was judged on (FR-024) —
      the cells on which that solve's two witness solutions disagree, or,
      when those hold no cell not already flipped, the cells line logic
      left undecided — ordered nearest the ink boundary first. The flips
      are applied to the ORIGINAL conversion, so attempt n differs from the
      user's picture in exactly n cells, the nudges of one run nest, and at
      most the capped number of the user's pixels are ever altered.
    source: [US-007]
    _meta:
      source: authored
      amended: 2026-09-12
      re_amended: 2026-09-17
      re_amended_by: CARD-075
      evidence:
        - "docs/GENERATION_ALGORITHM.md#8.4"
        - "src/nonogram/sourcing/image.py next_nudge_cell"
        - "meta/kanban/cards/CARD-096.md"
      gaps: []
      resolved_gaps:
        - "2026-09-12: 'Attempt n when the undecided/disagreement mask holds fewer than n cells' — dissolved by the 2026-09-17 re-amendment (CARD-075); attempts no longer draw n cells from one fixed set. Successor rule: AC-116."
    acceptance:
      - id: AC-034
        given: an uploaded image whose initial conversion fails the uniqueness check, with nudge attempts remaining under the cap
        when: the auto-nudge policy evaluates
        then: a bounded pixel nudge is applied automatically and the result is re-checked
        kind: happy
        policy: POL-002
        test: TestNudge_AttemptsBoundedRecovery
      - id: AC-035
        given: an uploaded image conversion that has exhausted the configured nudge cap without reaching uniqueness
        when: the uniqueness check is evaluated again
        then: the tool reports failure to the user and stops altering the image
        kind: boundary
        invariant: INV-003
        policy: POL-003
        test: TestNudge_ReportsFailureAtCap
      - id: AC-036
        given: a reported nudge-cap failure
        when: the failure is presented to the user
        then: the message states that the user should retry with a different image or size
        kind: negative
        test: TestNudge_FailureMessageSuggestsRetry
      # AC-115/AC-116 re-amended 2026-09-17 (CARD-075): the region order is the
      # disagreement set first, the mask as fallback, and an attempt adds one
      # cell rather than choosing n at once. AC-117 is unchanged in substance.
      - id: AC-115
        given: a candidate the solver reported MANY for, whose two witnesses disagree on a set D
        when: the next nudge attempt is built
        then: the one cell it adds is a member of D that is not already flipped
        kind: boundary
        policy: POL-002
        test: TestNudge_AddsACellWhereTheWitnessesDisagree
      - id: AC-116
        given: a MANY candidate whose witness-disagreement cells are all already flipped or absent, and separately one whose undecided mask holds a cell adjacent to the ink boundary and a cell 3 cells away from any boundary
        when: the next nudge attempt is built
        then: the added cell comes from that candidate's undecided mask, the cell nearest the ink boundary is the one chosen (then row, then column), and when neither region holds an unflipped cell the attempt adds nothing and returns no candidate while the counter still advances
        kind: boundary
        test: TestNudge_FallsBackToTheMaskThenStops
      - id: AC-117
        given: a conversion whose nudge attempts 1, 2 and 3 flipped cell sets S1, S2, S3
        when: the three sets are compared to the ORIGINAL conversion
        then: S1 is a subset of S2, S2 is a subset of S3, and S3 differs from the original conversion in exactly 3 cells
        kind: boundary
        # Re-pointed 2026-09-22 (CARD-071). The former name,
        # TestNudge_MaskDrivenAttemptsRemainCumulativeFromOriginalConversion,
        # was never written as a test — here or anywhere; CARD-075 re-amended
        # the mask-driven mechanism it was named for before it was. The claim
        # itself is asserted, and over a corpus rather than one conversion, by
        # EC-014's property test, which is this AC's criterion generalised to
        # every attempt n. Re-pointed rather than retired: AC-117 is unchanged
        # in substance, only its witness is named correctly now.
        test: PropertyTest_Nudge_FlippedCellsSubsetOfUndecidedMaskAndNested
      # AC-172 is a measurement, not a suite test: the owner's 25-picture
      # corpus is not in the suite's time budget (meta/ops/
      # image_abandonment_sweep.py, ~20 minutes). Recorded here because it is
      # the criterion CARD-075 was accepted on.
      - id: AC-172
        given: the owner's 25-picture corpus swept at sizes 10,15,20,25,30 before and after CARD-075
        when: the two sweeps are compared
        then: at least 19 more of the 36 conversions that dithering fails are made, and every conversion made before is still made
        kind: happy
        test: meta/ops/image_abandonment_sweep.py
    engineering_constraints:
      - id: EC-014
        # Re-amended 2026-09-17 (CARD-075) alongside AC-115/AC-116.
        statement: >-
          For any uploaded image whose conversion reports MANY and any
          attempt number n in 1..5 that adds a cell, the set of cells
          attempt n flips has exactly one more member than attempt n-1's,
          contains every cell attempt n-1 flipped, and its new cell belongs
          to the witness-disagreement set of attempt n-1's candidate or,
          when that set holds no unflipped cell, to that candidate's
          undecided mask — for every image and every n, not only the
          measured examples. The grid attempt n is judged on differs from
          the ORIGINAL conversion in exactly those cells. The cap of 5 and
          the re-verification of every nudged grid by the real solver
          (CON-005) are unchanged by the mechanism.
        kind: consistency
        instances: [AC-115, AC-116, AC-117]
        test: PropertyTest_Nudge_FlippedCellsSubsetOfUndecidedMaskAndNested

  - id: FR-014
    statement: >-
      When image-mode generation required one or more automatic pixel
      nudges (FR-013) to reach a unique solution, report the count of
      nudged cells to the user as a line in CLI output at export time.
    source: [US-007]  # requirement introduced by ADR-0004, resolving DEC-004
    acceptance:
      - id: AC-040
        given: an exported puzzle whose image conversion required 2 pixel nudges to reach uniqueness
        when: the puzzle is exported
        then: the CLI output includes a line stating that 2 cells were nudged
        kind: happy
        test: TestExport_ReportsNudgeCount
      - id: AC-041
        given: an exported puzzle whose image conversion reached uniqueness with zero nudges
        when: the puzzle is exported
        then: no nudge-count line is printed
        kind: boundary
        test: TestExport_OmitsNudgeCountWhenZero

  - id: FR-015
    # AMENDED 2026-09-01 (raw-requirements.md, entry 3 of the 2026-09-01
    # delta): image-sourced puzzles now default to the source file's stem,
    # mirroring AC-043's library-key rule, instead of falling through to the
    # mode+timestamp default. Id, kind, and existing AC ids/tests are
    # unchanged (EC-007 2026-08-31 amendment precedent); AC-090 is new.
    statement: >-
      Give every puzzle a name, which becomes an attribute of the Puzzle
      aggregate (AGG-001) set at creation time: auto-generated by default
      (the library key for library-sourced puzzles, e.g. "cat"; the source
      file's stem for image-sourced puzzles, e.g. an upload named "cat.png"
      names the puzzle "cat"; a mode+timestamp for random-sourced puzzles,
      e.g. "random-2026-08-27-1430"), or overridden via a --name flag.
    source: [US-011]
    acceptance:
      - id: AC-042
        given: a random-mode generation request with no --name flag, run on 2026-08-27 at 14:30
        when: the puzzle is created
        then: the puzzle's name is auto-generated as "random-2026-08-27-1430"
        kind: happy
        test: TestPuzzleName_AutoGeneratesModeTimestampForRandomMode
      - id: AC-043
        given: a library-mode generation request for library key "cat" with no --name flag
        when: the puzzle is created
        then: the puzzle's name is auto-generated as "cat"
        kind: happy
        test: TestPuzzleName_AutoGeneratesFromLibraryKey
      - id: AC-044
        given: a generation request with --name "my-cat-puzzle" supplied
        when: the puzzle is created
        then: the puzzle's name is set to "my-cat-puzzle", overriding the auto-generated default
        kind: happy
        test: TestPuzzleName_OverrideViaFlag
      - id: AC-045
        given: a generation request with --name "" (an empty string) supplied
        when: the puzzle is created
        then: the request is rejected with an invalid-name error and no puzzle is created
        kind: negative
        test: TestPuzzleName_RejectsEmptyName
      - id: AC-090
        given: an image-mode generation request uploading a file named "cat.png" with no --name flag
        when: the puzzle is created
        then: the puzzle's name is auto-generated as "cat", not the "image-2026-09-01-1240"-shaped mode+timestamp default
        kind: happy
        test: TestPuzzleName_AutoGeneratesFromImageFileStem

  - id: FR-016
    statement: >-
      Export a finalized, uniqueness-confirmed puzzle as a single two-page
      PDF: page 1 is the blank puzzle with clues (for solving), page 2 is
