# generated_by: forge:brainstorm
# generated_at: 2026-08-27
terms:
  - id: TERM-001
    term: Nonogram
    definition: A picture logic puzzle solved by filling cells in a grid according to numeric row/column clues, revealing a picture.
    context: shared
    aliases: [Picross, Griddler]
    source: [US-001]
  - id: TERM-002
    term: Clue
    definition: The sequence of numbers for one row or column giving the lengths, in order, of consecutive runs of filled cells in that line.
    context: shared
    source: [US-004]
  - id: TERM-003
    term: Solution grid
    definition: The underlying black/white pixel grid a puzzle's clues are derived from; hidden from the player, used to verify solving.
    context: shared
    source: [US-001]
  - id: TERM-004
    term: Uniqueness check
    definition: >-
      Running a nonogram solver against a puzzle's clues to confirm that
      exactly one grid satisfies them. Sameness of two candidate solution
      grids is defined as: every (row, column) cell matches exactly,
      position-for-position, between the two grids — grid equality is
      computed from a full cell-by-cell comparison, nothing looser (no
      rotation/reflection/palette normalization). The solver counts a
      candidate as a distinct ("second") solution the moment it finds any
      grid that is not equal by this definition to the first one found,
      and stops searching further once a second distinct grid is found
      (fail-fast on ambiguity, FR-006).
    context: shared
    source: [US-005]
  - id: TERM-005
    # AMENDED 2026-09-12: "solver time" is no longer a scoring signal
    # (NFR-007/CON-014); line-reasoning depth signals and the explicit
    # requires-guessing attribute (TERM-015) are pending FR-026's DEC.
    term: Difficulty score
    definition: >-
      A heuristic numeric score combining solver signals (line-logic
      coverage, backtracking amount, clue density, puzzle size) used to
      bucket a puzzle into Easy, Medium, or Hard. Since 2026-09-12 solver
      wall-clock time is excluded from the signals (NFR-007), so the same
      seed scores identically on any machine; FR-026 (DEC pending) adds
      line-reasoning depth signals so line-solvable puzzles (TERM-014)
      span the whole scale.
    context: shared
    aliases: [Difficulty tier, Difficulty level]
    source: [US-008]
  - id: TERM-006
    term: Puzzle
    definition: The playable definition handed to the solver of a nonogram — clues plus grid dimensions. Distinct from the solution grid, which stays hidden from the player.
    context: shared
    source: [US-004, FR-005]  # CARD-071: the second entry was an anchor into the intake document, which is not in this repository; FR-005 is where clues-from-grid is stated
  - id: TERM-007
    term: Density
    definition: The approximate percentage of filled cells requested when generating a random grid.
    context: shared
    source: [FR-004]  # CARD-071: dropped a second entry pointing at the intake document (its "FR-4" is this FR-004)
  - id: TERM-008
    term: Pixel nudge
    definition: A bounded, automatic flip of a small number of cells in an uploaded image's converted grid, attempted when the initial conversion does not yield a unique-solution puzzle.
    context: shared
    aliases: [pixel adjustment]
    source: [US-007, FR-013]  # CARD-071: was the intake document's FR-16, which is FR-013 here
  - id: TERM-009
    term: Distinct solution
    definition: >-
      The equality relation CON-005, INV-002, and EC-001 all depend on but
      do not individually restate: two solution grids are the SAME solution
      if and only if they are identical cell-by-cell across every (row,
      column) position, compared using the list[list[bool]] boundary
      representation fixed by ADR-0012 — no rotation, reflection, or
      palette normalization. "Distinct" means not the same by this
      definition. A puzzle's clue set inherits the same equality
      transitively: two clue sets are the same puzzle only if every solution
      grid consistent with one is also consistent with the other under this
      definition. This is the exact relation the solver's fail-fast rule
      (AC-017) and the mandatory correctness property (CON-005) test
      against.
    context: shared
    source: [CON-005, INV-002, EC-001, AC-017, ADR-0012]
  - id: TERM-010
    term: Puzzle name
    definition: >-
      A human-readable label identifying one puzzle instance, set as an
      attribute of the Puzzle aggregate at creation time — either
      auto-generated (the library key for library-sourced puzzles, or a
      mode+timestamp for random/image-sourced puzzles) or supplied by the
      user via --name. Shown as a header on exported PDF pages alongside
      the difficulty tier.
    context: shared
    source: [US-011, US-012]
  # --- 2026-09-12: generation algorithm review (FR-024..FR-028, NFR-007) ---
  - id: TERM-011
    term: Undecided cells
    definition: >-
      The set of cells that line logic alone left open at the solver's
      FIRST propagation fixed point — before any search branch. Exposed by
      the solver as a grid-shaped boolean mask (FR-024). Every cell two
      solutions can disagree on lies in this set, because propagation only
      ever writes cells every solution agrees on; the set is empty exactly
      when the puzzle is line-solvable.
    context: shared
    aliases: [undecided mask, first-fixed-point mask, ambiguous region]
    source: [FR-024, FR-013, FR-025, docs/GENERATION_ALGORITHM.md#6.4]
  - id: TERM-012
    term: Witness solution
    definition: >-
      A full solution grid the solver returns as evidence for its count:
      one witness when the count is 1, two distinct (TERM-009) witnesses
      when it reports MANY (FR-024). The cells on which the two witnesses
      disagree form the disagreement set, a subset of the undecided cells
      (TERM-011). No witness exists when the count is 0.
    context: shared
    aliases: [second witness, disagreement set]
    source: [FR-024, FR-006, AC-017]
  - id: TERM-013
    term: Candidate repair
    definition: >-
      A random-mode recovery step in which a non-unique candidate grid is
      altered in place rather than redrawn: one filled cell and one empty
      cell inside the undecided cells (TERM-011) swap values, so the
      filled-cell count — and therefore the requested density (TERM-007)
      — stays exact, and the repaired grid is re-verified by the solver
      (FR-025). Whether repair replaces, follows, or never joins the
      redraw of FR-007 is an open decision (DEC pending).
    context: shared
    aliases: [repair, pair flip]
    source: [FR-025, POL-006, CMD-014]
  - id: TERM-014
    term: Line-solvable puzzle
    definition: >-
      A puzzle whose unique solution the solver reaches by line logic
      alone — propagation to a fixed point with no search branch
      (branch_nodes 0). FR-026 requires such puzzles to be graded across
      the whole difficulty scale by how much line reasoning they needed
      (fixed-point sweeps, first-sweep share, lines needing the full
      placement DP), not parked at the easy end.
    context: shared
    aliases: [logically solvable, solvable without guessing]
    source: [FR-026, FR-009, docs/GENERATION_ALGORITHM.md#6]
  - id: TERM-015
    term: Requires guessing
    definition: >-
      An explicit attribute of a scored puzzle stating that the solver had
      to branch at least once (branch_nodes greater than 0) to reach its
      unique solution — the negation of line-solvable (TERM-014). FR-026
      makes it a fact about the solve, exposed either as a flag beside the
      Easy/Medium/Hard tier or as a tier of its own; which is an open
      decision (DEC pending).
    context: shared
    aliases: [needs search, non-line-solvable]
    source: [FR-026, FR-010, EC-015]
  - id: TERM-016
    term: Ink coverage
    definition: >-
      The fraction of a grid cell's area that the source image's ink
      occupies after the LANCZOS resize to the grid extent — read as the
      cell's grey level. FR-027 proposes filling a silhouette cell when its
      ink coverage is at least 50% (plain threshold) as the alternative to
      Floyd-Steinberg dithering (FR-003); which binarisation applies is an
      open decision with an owner visual gate.
    context: shared
    aliases: [coverage threshold, binarisation threshold]
    source: [FR-027, FR-003, CON-013]
  - id: TERM-017
    term: Solving strategy
    definition: >-
      One kind of deduction a solver must be able to make to finish a
      puzzle, named from a fixed enum (provisionally simple_overlap,
      line_dp, cross_line, probe_contradiction, guess). A puzzle's
      strategies are the ordered list of the kinds its one verifying solve
      required (FR-029) — derived from that solve, never by re-solving —
      and are saved with the puzzle, exported, and used to filter the admin
      review. `guess` means the search branched (TERM-015). The enum's
      members are fixed by DEC-030/DEC-031.
    context: shared
    aliases: [strategies_used, technique, required technique]
    source: [FR-029, FR-026, docs/GENERATION_ALGORITHM.md#6, CARD-072]
  # New 2026-09-22 (delta — book generator, FR-030..FR-039). context: CTX-001 (ADR-0033)
  # until forge:architect-context-mapping re-runs (contexts.yml is stale).
  # NB "gutter" now carries TWO meanings in this project: the clue gutter
  # beside/above a grid (export/layout.py, NFR-005) and the binding-side page
  # margin of a book (KDP, gutter_margin_cm). They are different concepts
  # and are kept as two terms with qualified names (TERM-020, TERM-021);
  # bare "gutter" should not be used in new requirements.
  - id: TERM-018
    # AMENDED 2026-09-22 (b): "one puzzle per page" -> "one puzzle per page,
    # or two small ones on a two-up page (TERM-030), ordered easy -> medium
    # -> hard" (FR-040, FR-041).
    term: Book
    definition: >-
      A printed collection of uniquely solvable puzzles assembled in the
      admin panel — one puzzle per page, or two small ones on a two-up
      page, running easy -> medium -> hard, followed by an answer key — with a
      trim size, margins, a distribution plan and a publishing status,
      exported as a PDF for Amazon KDP.
    context: CTX-001
    aliases: [puzzle book, Book 1]
    source: [US-023, US-025, US-026, US-027, FR-030, FR-034]
  - id: TERM-019
    term: Trim size
    definition: >-
      The finished page size of a printed book, stored as trim_width_cm x
      trim_height_cm; 8.5 x 11 in (21.59 x 27.94 cm) by default (CON-018).
    context: CTX-001
    aliases: [trim, page size]
    source: [US-023, FR-030, CON-018]
  - id: TERM-020
    term: Gutter margin
    definition: >-
      The inside, binding-side page margin of a book (gutter_margin_cm);
      0.5 in by default, never below KDP's page-count minimum. Not the clue
      gutter (TERM-021).
    context: CTX-001
    aliases: [inside margin, binding margin]
    source: [US-023, FR-030, CON-018]
  - id: TERM-021
    term: Clue gutter
    definition: >-
      The band beside a grid holding its row clues, or above it holding its
      column clues; its depth is the longest clue's entry count on that
      axis (max(len(clue)), export/layout.py _gutter_depth). Not the gutter
      margin (TERM-020).
    context: CTX-001
    aliases: [clue band, clue depth]
    source: [FR-030, NFR-005, NFR-008]
  - id: TERM-022
    term: Book cell size
    definition: >-
      The printed side of one grid cell of a puzzle in a book, computed per
      puzzle on the book's trim and margins with the puzzle's real clue
      gutters and capped at the standard cell (FR-030, NFR-008).
    context: CTX-001
    aliases: [printed cell, cell_mm]
    source: [US-023, FR-030, NFR-008]
  - id: TERM-023
    term: Standard cell
    definition: >-
      The 7.5 mm cap on the book cell size — the owner's decision, so most
      of a book prints at one consistent cell size.
    context: CTX-001
    aliases: [cell cap]
    source: [US-023, NFR-008]
  - id: TERM-024
    term: Cell floor
    definition: >-
      The 4.8 mm minimum book cell size; a puzzle whose cell would print
      smaller is flagged and needs a floor override to enter a book.
    context: CTX-001
    aliases: [floor, 4.8 mm floor]
    source: [US-023, FR-031, NFR-008]
  - id: TERM-025
    term: Floor override
    definition: >-
      An explicit, per-puzzle permission, stored with the book, to include a
      puzzle whose book cell size is below the cell floor.
    context: CTX-001
    aliases: [override]
    source: [US-023, FR-031]
  - id: TERM-026
    term: Distribution plan
    definition: >-
      A book's intended content: a total puzzle count, an easy/medium/hard
      split summing to 100%, and a per-longest-side-bucket count for each
      tier — stored with the book and the reference for every planned-vs-
      actual figure.
    context: CTX-001
    aliases: [plan, general plan, per-bucket plan, size x difficulty matrix]
    source: [US-025, FR-034, FR-035]
  - id: TERM-027
    term: Longest-side bucket
    definition: >-
      One of four size classes a puzzle falls into by max(width, height) —
      <=15, 16-20, 21-25, 26-30 — used by the distribution plan, the
      selection tabs and the readiness check.
    context: CTX-001
    aliases: [size bucket, longest side, tab]
    source: [US-025, US-026, FR-034, FR-036]
  - id: TERM-028
    # AMENDED 2026-09-22 (b): content settled by ADR-0037 ("Puzzle N ·
    # Tier"); one band per puzzle, so a two-up page carries two (FR-040).
    # Previous definition's last clause: "what, if anything, it carries on
    # the puzzle page is not stated in the source."
    term: Title band
    definition: >-
      The 12 mm strip reserved above each puzzle on a book page — one per
      puzzle, so a two-up page carries two. It shows "Puzzle N · Tier"
      (ADR-0037), never the picture title (FR-033).
    context: CTX-001
    aliases: [header band]
    source: [FR-030, FR-033, FR-040, CON-018]
  - id: TERM-029
    term: Plan tolerance
    definition: >-
      The +/-3 percentage points by which each longest-side x tier cell of
      a book's selection may differ from its plan when the book is marked
      ready.
    context: CTX-001
    aliases: [readiness tolerance, +/-3 pp]
    source: [US-026, FR-037]
  # New 2026-09-22 (b) (delta — book layout, FR-040/FR-041). context:
  # CTX-001 (ADR-0033).
  - id: TERM-030
    term: Two-up page
    definition: >-
      A book page holding two puzzles of one tier, adjacent in the
      book order, printed at one shared cell of at least 7.0 mm (capped at
      the standard cell), each under its own title band, the earlier one
      on top.
    context: CTX-001
    aliases: [two-puzzle page, paired page, two slots, shared cell]
    source: [US-023, FR-040]
  - id: TERM-031
    term: Divider page
    definition: >-
      A short page before the first puzzle of each difficulty level in a
      book, carrying only the level's name ("Easy", "Medium", "Hard") and
      no puzzle number.
    context: CTX-001
    aliases: [level divider, section divider]
    source: [US-024, FR-041]
  - id: TERM-032
    term: Book order
    definition: >-
      The sequence in which a book's puzzles print: grouped easy -> medium
      -> hard, the owner's arrangement within each level. It fixes puzzle
      numbers, which puzzles may share a two-up page, and where divider
      pages fall.
    context: CTX-001
    aliases: [arrangement, puzzle order, difficulty order, level]
    source: [US-024, FR-040, FR-041]
  # New 2026-09-22 (c) (delta — answer key, mirrored margins; owner
  # decisions BK-8, BK-1 placement). context: CTX-001 (ADR-0033).
  - id: TERM-033
    term: Answer key
    definition: >-
      The section after a book's puzzles showing each puzzle's filled grid
      only (no clues), in puzzle-number order, each captioned "Puzzle N —
      Title" — the only place the picture's title appears; up to 6 answers
      a page (2 x 3) while every answer on the page is at most 20 cells on
      its longest side, 4 a page (2 x 2) once one is longer.
    context: CTX-001
    aliases: [answer section, answer page, 6-up page, 4-up page, answer tile]
    source: [US-023, US-024, FR-042, FR-033]
  - id: TERM-034
    term: Mirrored margins
    definition: >-
      The book's side margins swap with page parity so the gutter margin
      (TERM-020) is always on the binding side: on the left of a right-hand
      (odd) page, on the right of a left-hand (even) page; the drawing is
      centred across the usable width between them, and the top edge does
      not move.
    context: CTX-001
    aliases: [page parity, facing pages, recto/verso margins]
    source: [US-023, FR-030, FR-032]
