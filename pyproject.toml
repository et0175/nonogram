[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonogram"
version = "0.1.0"
description = "Command-line generator for uniquely-solvable black-and-white nonogram puzzles."
requires-python = ">=3.9"
authors = [{ name = "Puzzle Creator" }]
keywords = ["nonogram", "puzzle", "generator", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.9+",
  "Topic :: Games/Entertainment :: Puzzle Games",
]

# Dependencies for the nonogram CLI: stdlib + Pillow + NumPy (ADR-0006/R1)
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Development-only dependencies
dev = ["pytest>=8.3"]
# Admin panel dependencies. ReportLab lives here, not in core dependencies
# above: it is used only by admin/pdf_generator.py's book-PDF feature
# (CARD-008), the same reason Flask/Werkzeug are extras rather than core -
# a bare `pip install nonogram` (CLI-only) has no use for any of the three.
admin = ["Flask>=3.0", "Werkzeug>=3.0", "reportlab>=4.0"]
# Database dependencies
db = ["SQLAlchemy>=2.0", "alembic>=1.13", "psycopg2-binary>=2.9"]

[project.scripts]
nonogram = "nonogram.cli:main"

[tool.setuptools.packages.find]
# src-layout package structure
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
