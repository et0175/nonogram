[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nonogram"
version = "0.1.0"
description = "Command-line generator for uniquely-solvable black-and-white nonogram puzzles."
requires-python = ">=3.9"
authors = [{ name = "Puzzle Creator" }]
keywords = ["nonogram", "puzzle", "generator", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.9+",
  "Topic :: Games/Entertainment :: Puzzle Games",
]

# Dependencies for the nonogram CLI: stdlib + Pillow + NumPy (ADR-0006/R1)
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Development-only dependencies. pytest-playwright drives the admin panel's
# puzzle player in a real Chromium (ADR-0038/R7): dev-only, never in
# `dependencies` above nor in the `admin` extra. pip does not install the
# browser itself — run `playwright install chromium` once per checkout and as
# a CI step before the suite (ADR-0038/R8); without it the `browser`-marked
# tests fail with that instruction rather than skipping green.
dev = ["pytest>=8.3", "pytest-playwright>=0.7"]
# Admin panel dependencies. ReportLab lives here, not in core dependencies
# above: it is used only by admin/pdf_generator.py's book-PDF feature
# (CARD-008), the same reason Flask/Werkzeug are extras rather than core -
# a bare `pip install nonogram` (CLI-only) has no use for any of the three.
# gunicorn joins them for the same reason and under the same rule (CARD-086):
# it serves the admin panel in a deployment and a CLI-only install has no use
# for it. ADR-0006/R1's baseline is `project.dependencies` above, which stays
# exactly Pillow + NumPy — the extras have always been outside it.
admin = ["Flask>=3.0", "Werkzeug>=3.0", "reportlab>=4.0", "gunicorn>=23.0"]
# Database dependencies
# SQLAlchemy carries no upper bound. It was capped below 2.1 for a day, because
# 2.1.0 changed the default DBAPI for a bare `postgresql://` URL from psycopg2
# to psycopg (v3) and broke the deployed panel's boot with `No module named
# 'psycopg'`. CARD-148 removed the cap and the reason for it: the driver is now
# named in the URL by `nonogram.db.session.normalized_url` rather than
# inherited from whatever SQLAlchemy defaults to, and
# tests/test_db_url_driver.py fails if that named driver is not installed.
# psycopg2-binary stays the shipped DBAPI — ADR-0006/R1 keeps the database
# packages in this extra, and swapping one for another is a decision rather
# than part of a defect fix.
db = ["SQLAlchemy>=2.0", "alembic>=1.13", "psycopg2-binary>=2.9"]

[project.scripts]
nonogram = "nonogram.cli:main"

[tool.setuptools.packages.find]
# src-layout package structure
where = ["src"]

# The PDF exporter's bundled face. setuptools ships no non-Python file unless
# it is named here, so without this block the font is present in a source
# checkout — where pytest's `pythonpath = ["src"]` reads it straight off disk —
# and absent from every built wheel. Measured before this entry existed: a
# wheel built from this tree carried 60 entries and none of them a font, so
# `pdf._font_bytes()` raised on any real install while the whole suite stayed
# green. ADR-0006/R1 allows the font precisely *because* it ships as package
# data rather than as a dependency; that permission is only true once this
# block makes it so.
#
# The LICENSE travels with the file as an obligation of the DejaVu licence,
# not as a nicety, which is why it is listed explicitly rather than left to a
# glob that happens to catch it.
[tool.setuptools.package-data]
"nonogram.export" = ["fonts/*.ttf", "fonts/LICENSE"]
# The admin panel's Jinja templates, stylesheets and scripts: the same rule as
# the font — absent from every wheel unless named here. `static/*.js` is the
# puzzle player's client (ADR-0038/R5); without it an editable install works
# and a built wheel serves a player page with no script.
"nonogram.admin" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "browser: drives the admin panel in Chromium through pytest-playwright (needs `playwright install chromium`; ADR-0038/R8)",
]
