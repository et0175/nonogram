{#- The cropped preview for one image at its current size — rendered by
    image_preview.html and re-rendered by POST /api/image/<id>/size. -#}
{% if fit.status == 'cannot_fit' %}
<span class="fallback">Will be skipped</span>
{% else %}
<img src="/api/image/{{ image.file_id }}/cropped?extent={{ fit.extent[0] }}x{{ fit.extent[1] }}"
     alt="Cropped preview of {{ image.original_filename }}"
     onerror="this.parentElement.innerHTML='<span class=fallback>Failed to load image</span>'">
{% endif %}
